    snap(opener, `${dispName(opt.foe)} is faster off the mark!`, 'use', 'foe');
    foeTurn(opener);
  }
  // The very first hand is dealt as the battle opens.
  startPlayerTurn(opener);
  if (opener.length) G.battle.log = opener;
  // The controls, the first time there is a hand to use them on.
  //
  // These three lines were all gated on `opt.wild` — and the first fight in the
  // game is the RIVAL, on the only road out of town. So the one place that
  // teaches the hand properly, naming the actual keys and the actual button,
  // could not fire until after the fight a new player has already had to win,
  // which is why Rowan was reciting the same rule in the study beforehand to
  // somebody holding no cards. Taught here, they arrive with a hand on screen.
  if (!G.flags.taughtHand) {
    G.flags.taughtHand = 1;
    lines.push('Five cards, three energy. Left and right pick one, up plays it — or press its number, or just tap it.');
    lines.push('When you have spent what you can, end the turn: E, or the button under the hand.');
  }
  // The orb stays where it was: it needs something catchable to be about.
  if (opt.wild && !G.flags.taughtCatch && (G.bag.bloomorb > 0 || G.bag.gleamorb > 0 || G.bag.prismorb > 0)) {
    G.flags.taughtCatch = 1;
    lines.push('Knock it down first, then reach for an orb — Bag, then the orb. A hurt kin holds.');
  }
  battleSay(lines, () => renderHand());
  return true;
}

const B = () => G.battle;

// ---- damage ------------------------------------------------------------
function critRoll() { return chance(1 / 16); }

/** Pure-ish damage calc; `move` is a move id or a card's synthetic move. */
function damageOf(atkMon, defMon, move, opts = {}) {
  const m = typeof move === 'string' ? MOVES[move] : move;
  if (!m.pow) return { dmg: 0, eff: 1, crit: false };
  const eff = effect(m.type, defMon.types);
  const stab = atkMon.types.includes(m.type) ? 1.5 : 1;
  const crit = opts.crit != null ? opts.crit : critRoll();
  const a = effStat(atkMon, 'atk'), d = effStat(defMon, 'def');
  let base = Math.floor((((2 * atkMon.lvl / 5 + 2) * m.pow * a / Math.max(1, d)) / 50) + 2);
  const roll = opts.roll != null ? opts.roll : (.85 + Math.random() * .15);
  let dmg = Math.floor(base * stab * EFF_DMG(eff) * (crit ? 1.5 : 1) * roll);
  return { dmg: Math.max(eff === 0 ? 0 : 1, dmg), eff, crit };
}

const effWord = (e) => e === 0 ? 'It does nothing at all…' : e >= 2 ? "It's brutally effective!" : e > 1 ? "It's effective!" : e < 1 ? 'It barely lands…' : '';

// ---- log helpers -------------------------------------------------------
/**
 * Which cue a knockout plays. Your kin going down and the foe's going down are
 * opposite events and made exactly the same sound. The log has carried the side
 * all along, and the WORDS already say it — "Wild Zaplet is down!" against
 * "Cindercub has fainted." Only the cue was deaf to it.
 *
 * A function rather than a ternary at the call site so it can be driven: the
 * cue itself cannot be heard from a test, but the choice can be.
 */
const faintCue = (e) => (e && e.side === 'mine' ? 'faint' : 'downed');

/**
 * Which cue an impact plays. `effWord` gives the fight FIVE readings — "It's
 * brutally effective!", "It's effective!", "It barely lands…", "It does nothing
 * at all…", and nothing — and every one of them landed on the same blip. The
 * words already tell you whether your type choice worked; the sound did not.
 *
 * A crit still wins: it has its own cue and it is the bigger fact about a hit.
 * An immune hit deals no damage and so snaps no impact at all, which is why
 * there is no cue for it — the line stands on its own.
 */
function hitCue(e) {
  if (!e) return 'hit';
  if (e.crit) return 'crit';
  if (e.eff > 1) return 'strong';
  if (e.eff > 0 && e.eff < 1) return 'weak';
  return 'hit';
}

function snap(log, t, fx, side, extra) {
  const b = B();
  log.push({ t, fx: fx || '', side: side || '', hpM: b.mine.hp, hpF: b.foe.hp,
    sM: b.mine.status, sF: b.foe.status, lvM: b.mine.lvl, xpM: b.mine.xp,
    // Which kin is out. XP is per-creature, so a bar that glides across a
    // switch would be animating between two unrelated totals; the reader needs
    // to know the number changed hands rather than grew. Creatures carry no id
    // of their own — `packMon` saves none — so the party slot is the identity.
    miM: G.party.indexOf(b.mine), ...extra });
}

const STAT_WORD = { atk: 'attack', def: 'guard', spd: 'speed' };
function applyStages(log, target, list, who) {
  for (const [stat, n] of list) {
    const before = target.stages[stat];
    target.stages[stat] = clamp(before + n, -6, 6);
    if (target.stages[stat] === before) { snap(log, `${who}'s ${STAT_WORD[stat]} can go no ${n > 0 ? 'higher' : 'lower'}.`); continue; }
    const word = n > 0 ? (n > 1 ? 'sharply rose' : 'rose') : (n < -1 ? 'sharply fell' : 'fell');
    snap(log, `${who}'s ${STAT_WORD[stat]} ${word}!`);
  }
}

/** One creature uses one move. Mutates state, appends to log. */
function useMove(log, atkSide, moveId) {
  const b = B();
  const attacker = atkSide === 'mine' ? b.mine : b.foe;
  const defender = atkSide === 'mine' ? b.foe : b.mine;
  const who = atkSide === 'mine' ? dispName(attacker) : `Foe ${dispName(attacker)}`;
  const them = atkSide === 'mine' ? `Foe ${dispName(defender)}` : dispName(defender);
  if (attacker.hp <= 0 || defender.hp <= 0) return;

  if (attacker.status === 'shock' && chance(.25)) {
    snap(log, `${who} is jolted stiff and cannot move!`, 'status', atkSide);
    return;
  }

  const m = MOVES[moveId];
  snap(log, `${who} used ${m.name}!`, 'use', atkSide);

  // A miss does not eat the edge you were saving. Losing a Soulfang you spent
  // two turns setting up to a 5% accuracy roll is the kind of thing that makes
  // people stop setting things up; it waits for the next swing instead.
  if (m.acc && rnd(100) >= m.acc) { snap(log, `${who}'s attack missed!`, 'miss', atkSide); return; }

  const fx = m.fx || {};
  if (m.pow) {
    // Everything the deck stacked onto this swing rides here. Support cards
    // never touch the foe themselves; this is the only place their numbers turn
    // into damage, so a card that says "+4" is worth exactly 4 on the bar.
      // A wild kin is tougher and gentler than its level says: the toughness
      // buys the turns a deck needs to matter, the damper stops those extra
      // turns being paid for in walks back to town. A trainer's kin gets
      // neither — they are trained, and their fights are supposed to hurt.
    const bonus = atkSide === 'mine' ? attackBonus()
      : { flat: b.foeEdge || 0, mul: (b.wild ? WILD_DMG_MUL : trainerDmg(b.foe.lvl)) * (b.chipping ? PLAN_CHIP : 1), hits: 1, drain: 0 };
    if (atkSide === 'foe') b.foeEdge = 0;          // spent on this swing
    // A kin that has just been sent in is still finding its feet.
    const settling = atkSide === 'mine' ? b.settling : b.foeSettling;
    if (settling) {
      if (atkSide === 'mine') b.settling = 0; else b.foeSettling = 0;
      snap(log, `${who} is still finding its feet.`, 'block', atkSide);
    }
    let totalDealt = 0;
    for (let h = 0; h < bonus.hits && defender.hp > 0; h++) {
      const roll = damageOf(attacker, defender, moveId);
      const { eff, crit } = roll;
      // The wild damper is there so that a long fight is not paid for in walks
      // back to town. It has no business fully compounding with a resistance you
      // already have: a wild kin you resist was hitting for .65 x .70 of normal,
      // which is where the "nobody can hurt anybody" fights came from — three
      // quarters of them never in doubt, none of them lost, and the longest in
      // the game. Against a resistance it applies at half strength. Dropping it
      // altogether was worse than the disease: wipes went from .220 a fight to
      // .364, which is a walk back to town every third fight.
      let mul = atkSide === 'foe' && eff < 1 ? (1 + bonus.mul) / 2 : bonus.mul;
      if (settling) mul *= SETTLE_MUL;
      const dmg = roll.eff === 0 ? 0 : Math.max(1, Math.floor((roll.dmg + bonus.flat) * mul));
      let dealt = dmg;
      if (atkSide === 'foe') {
        b.hitEl = m.type;                       // for the impact burst
        b.hitEff = eff;                         // …and for how it should sound
        dealt = hurtMine(log, dmg, `${them} took ${dmg}.`, 'foe', crit);  // shield first
      } else {
        // Recoil and drain are paid on what actually came off, not on the
        // number rolled: hitting a foe with 3 HP left for 300 must not recoil
        // as though it had dealt 300, or a heavy move kills its own user
        // finishing off something that was already beaten.
        const had = defender.hp;
        let through = dmg;
        if (b.foeShield > 0) {
          const eaten = Math.min(b.foeShield, through);
          b.foeShield -= eaten; through -= eaten;
          if (eaten > 0) snap(log, `${them}'s guard absorbs ${eaten}.`, 'block', 'foe');
        }
        // A wild kin does not go down without one moment of its own. Three in
        // ten party fights ended in a single swing — you send in the right
        // element and delete something that never got a turn — and the cornered
        // telegraph, which is the only thing a wild fight has to read, can only
        // fire if the kin lives long enough to be cornered. So a healthy one
        // takes the blow and holds on by a point, once, and corners on the spot.
        // It cannot save a kin that was already hurt, and it cannot happen twice.
        if (b.wild && !b.lastStand && defender === b.foe
          && defender.hp > defender.max * CORNER_AT && through >= defender.hp) {
          b.lastStand = 1;
          through = defender.hp - 1;
          snap(log, `${them} will not go down yet!`, 'block', 'foe');
        }
        defender.hp = clamp(defender.hp - through, 0, defender.max);
        dealt = had - defender.hp;
        if (through > 0) snap(log, `${them} took ${through}.`, 'hit', 'foe', { atk: 'mine', crit: !!crit, el: m.type, eff });
      }
      totalDealt += dealt;
      if (crit && eff !== 0) snap(log, 'A critical hit!');
      if (h === 0) { const w = effWord(eff); if (w) snap(log, w); }
      if (eff === 0) { if (atkSide === 'mine') spendEdge(); return; }
    }
    const drain = (fx.drain || 0) + (atkSide === 'mine' ? bonus.drain : 0);
    if (drain && totalDealt > 0) {
      const heal = Math.max(1, Math.floor(totalDealt * drain));
      attacker.hp = clamp(attacker.hp + heal, 0, attacker.max);
      snap(log, `${who} drank the energy back.`, 'heal', atkSide);
    }
    if (fx.recoil && totalDealt > 0) {
      const r = Math.max(1, Math.floor(totalDealt * fx.recoil));
      attacker.hp = clamp(attacker.hp - r, 0, attacker.max);
      snap(log, `${who} is hurt by the recoil.`, 'hit', atkSide);
    }
    if (atkSide === 'mine') {
      applyRiders(log, defender);
      awardEdgeKill(log, defender);
      spendEdge();
    }
  }

  if (fx.heal) {
    const before = attacker.hp;
    attacker.hp = clamp(attacker.hp + Math.floor(attacker.max * fx.heal), 0, attacker.max);
    snap(log, attacker.hp > before ? `${who} settled and recovered.` : `${who} is already whole.`, 'heal', atkSide);
  }
  if (fx.st && defender.hp > 0) {
    const [st, p] = fx.st;
    if (!defender.status && chance(p) && !defender.types.includes(IMMUNE_TO[st] || '')) {
      defender.status = st;
      snap(log, `${them} is ${STATUS[st].name.toLowerCase()}!`, 'status', atkSide === 'mine' ? 'foe' : 'mine');
    }
  }
  if (fx.foe && defender.hp > 0) applyStages(log, defender, fx.foe, them);
  if (fx.self) applyStages(log, attacker, fx.self, who);
}

// A creature shrugs off the status its own element embodies.
const IMMUNE_TO = { burn: 'Ember', shock: 'Spark', chill: 'Tide', snare: 'Verdant' };

function endOfTurn(log) {
  const b = B();
  for (const [mon, side] of [[b.mine, 'mine'], [b.foe, 'foe']]) {
    if (mon.hp <= 0) continue;
    const who = side === 'mine' ? dispName(mon) : `Foe ${dispName(mon)}`;
    if (mon.status === 'burn' || mon.status === 'snare') {
      const d = Math.max(1, Math.floor(mon.max / 16));
      mon.hp = clamp(mon.hp - d, 0, mon.max);
      snap(log, `${who} is worn down by the ${mon.status === 'burn' ? 'burn' : 'roots'}.`, 'hit', side);
    }
  }
}

// ---- experience --------------------------------------------------------
function grantXP(log, winner, loser) {
  const gain = Math.max(1, Math.floor(DEX[loser.species].xp * loser.lvl / 7));
  winner.xp += gain;
  snap(log, `${dispName(winner)} gained ${gain} EXP.`, 'xp', 'mine');
  while (winner.lvl < 100 && winner.xp >= xpFor(winner.lvl + 1)) {
    winner.lvl++;
    refresh(winner);
    snap(log, `${dispName(winner)} grew to level ${winner.lvl}!`, 'level', 'mine');
    for (const [lv, mv] of DEX[winner.species].learn) {
      if (lv !== winner.lvl) continue;
      if (winner.moves.some((x) => x.id === mv)) continue;
      if (winner.moves.length < 4) {
        winner.moves.push({ id: mv, pp: MOVES[mv].pp, max: MOVES[mv].pp });
        snap(log, `${dispName(winner)} learned ${MOVES[mv].name}!`, 'learn', 'mine');
      } else {
        // Forget the weakest thing it knows — never the new move.
        let wi = 0;
        for (let i = 1; i < 4; i++) if (MOVES[winner.moves[i].id].pow < MOVES[winner.moves[wi].id].pow) wi = i;
        const old = MOVES[winner.moves[wi].id].name;
        winner.moves[wi] = { id: mv, pp: MOVES[mv].pp, max: MOVES[mv].pp };
        snap(log, `${dispName(winner)} forgot ${old} and learned ${MOVES[mv].name}!`, 'learn', 'mine');
      }
    }
  }
}

/** Pending evolutions are played out after the battle ends. */
function checkEvolve() {
  for (const m of G.party) {
    const evo = DEX[m.species].evo;
    if (evo && m.lvl >= evo[1] && !m.noEvo) return m;
  }
  return null;
}

function evolveMon(m) {
  const [to] = DEX[m.species].evo;
  const oldName = dispName(m);
  m.species = to; m.name = DEX[to].name;
  refresh(m);
  catchMon(to);
  // New form's level-1 kit is offered for any empty move slots.
  for (const [lv, mv] of DEX[to].learn) {
    if (lv <= m.lvl && m.moves.length < 4 && !m.moves.some((x) => x.id === mv)) {
      m.moves.push({ id: mv, pp: MOVES[mv].pp, max: MOVES[mv].pp });
    }
  }
  return { oldName, newName: DEX[to].name };
}

// ---- capture -----------------------------------------------------------
/** Pokémon-shaped capture maths: four shakes, all must hold. */
function captureChance(foe, orbMul) {
  const rate = DEX[foe.species].rate;
  const stMul = foe.status === 'shock' || foe.status === 'chill' ? 1.5 : foe.status ? 1.25 : 1;
  const a = ((3 * foe.max - 2 * foe.hp) / (3 * foe.max)) * rate * orbMul * stMul;
  return clamp(a / 255, 0, 1);
}

/**
 * How long each beat of a throw lasts. The whole point of a catch is the wait,
 * so the wobbles are slow and the gap between them is dead air — the outcome is
 * already decided when the orb leaves your hand, and every one of these seconds
 * is spent not knowing it.
 */
const ORB = { throw: .55, suck: .34, fall: .34, wobble: .5, gap: .22, click: .9, burst: .55 };

/** The beats a throw plays out, given how many times the orb held. */
function orbBeats(shakes, caught) {
  const beats = [['throw', ORB.throw], ['suck', ORB.suck], ['fall', ORB.fall]];
  for (let i = 0; i < shakes; i++) {
    beats.push(['wobble', ORB.wobble]);
    if (i < shakes - 1 || caught) beats.push(['gap', ORB.gap]);
  }
  beats.push(caught ? ['click', ORB.click] : ['burst', ORB.burst]);
  return beats;
}

function tryCatch(log, orbId) {
  const b = B();
  const orb = ITEMS[orbId];
  const p = captureChance(b.foe, orb.mul);
  const shakeP = Math.pow(p, 1 / 4);
  let shakes = 0;
  while (shakes < 4 && chance(shakeP)) shakes++;
  const caught = shakes >= 4;
  // The outcome is settled here, as everything in this game is; the animation
  // below only plays it back. Three shakes really did mean three shakes.
  b.orbPlan = { beats: orbBeats(Math.min(shakes, 3), caught), shakes, caught };
  snap(log, `You lob a ${orb.name}!`, 'throw', 'foe');
  if (caught) {
    snap(log, `…click. ${b.foe.name} is yours!`, 'caught', 'foe');
    b.over = 'caught';
    return true;
  }
  snap(log, ['It burst straight back out!', 'One shake. Not even close.',
    'Two shakes… and out.', 'Three shakes. You had it.'][Math.min(shakes, 3)], 'break', 'foe');
  return false;
}

/**
 * Run the throw. Returns true while it is still playing, which is what holds
 * the log back: the outcome line must not appear before the orb has stopped.
 */
function orbStep(dt) {
  const b = B();
  const o = b.orb;
  if (!o || o.done) return false;
  o.t += dt;
  const beat = o.beats[o.i];
  if (!beat) { o.done = true; return false; }
  if (o.t < beat[1]) return true;
  o.t -= beat[1];
  o.i++;
  const next = o.beats[o.i];
  if (!next) { o.done = true; return false; }
  // The orb taking the foe is not a log entry, so nothing else redraws the
  // chip that promises its next swing — it read "Foe: Rip Curl · hits 7-8" all
  // the way through a successful catch, over a creature already in the ball.
  if (!HEADLESS) renderIntent(b);
  if (next[0] === 'wobble') playCue('wobble');
  if (next[0] === 'click') playCue('click');
  if (next[0] === 'burst') { playCue('burst'); b.entry = .35; }
  return true;
}

/**
 * The beats the world holds its breath through: after the orb lands, until it
 * resolves. Named because two layers ask the same question — the canvas dims
 * the arena and the DOM dims the panels — and two copies of a condition are two
 * copies that will disagree. Neither the throw nor the resolution is hushed:
 * the arc has to be visible arriving and the answer has to be visible landing.
 */
const screenCovered = () => (G.fade > 0) || !!G.warp || G.wipe > 0;

const orbHush = (p) => p === 'fall' || p === 'wobble' || p === 'gap';

/**
 * How hard the orb rocks on its nth hold. The game already counts the holds and
 * already says so afterwards — "Three shakes. You had it." — but for a long
 * time the picture said the same thing three times over, so the two and a half
 * seconds of dead air had nothing tightening inside it.
 */
const orbRock = (holds) => .58 + .36 * Math.max(0, holds - 1);

const orbPhase = () => {
  const b = B();
  return b && b.orb && !b.orb.done ? b.orb.beats[b.orb.i][0] : null;
};

function addCaught(mon) {
  catchMon(mon.species);
  G.caught++;
  mon.stages = { atk: 0, def: 0, spd: 0 };
  untoughen(mon);
  if (G.party.length < PARTY_MAX) { G.party.push(mon); return 'party'; }
  G.box.push(mon); return 'box';
}

// ---- foe AI ------------------------------------------------------------
/** Picks the move with the best expected value, with a little noise. */
/**
 * What the foe reaches for.
 *
 * `mustAttack` is the plan keeping its own promise. A `sharpen` beat banks an
 * edge and costs the foe its turn to do it, so the beat after it has to be the
 * one that cashes it in — and it was not: the scorer would pick a status move,
 * the edge would sit there unspent, and a foe with a debuff to spam would bank
 * edge after edge while grinding your attack down. Coll's three kin turned a
 * five-turn fight into a thirty-turn one that way, and nothing in it was a
 * decision.
 */
function foeChoose(mustAttack) {
  const b = B();
  let list = b.foe.moves.length ? b.foe.moves : [{ id: 'falter' }];
  if (mustAttack) {
    const hits = list.filter((sl) => MOVES[sl.id] && MOVES[sl.id].pow);
    if (hits.length) list = hits;
  }
  let best = null, bestScore = -1;
  for (const slot of list) {
    const m = MOVES[slot.id];
    let score;
    if (m.pow) {
      const { dmg, eff } = damageOf(b.foe, b.mine, slot.id, { crit: false, roll: .925 });
      score = dmg * (eff === 0 ? 0 : 1);
      if (dmg >= b.mine.hp + b.shield) score *= 2.2;      // go for the kill
    } else {
      const fx = m.fx || {};
      score = b.foe.hp < b.foe.max * .45 && fx.heal ? b.foe.max * .35 : b.foe.max * .12;
      if (fx.st && b.mine.status) score = 1;
    }
    score *= .8 + Math.random() * .4;
    if (score > bestScore) { bestScore = score; best = slot.id; }
  }
  return best;
}

/** Roughly what the foe's best swing would do, for telegraphing a chip. */
function chipEstimate(b) {
  let best = 0;
  for (const slot of b.foe.moves) {
    const m = MOVES[slot.id];
    if (!m || !m.pow) continue;
    const r = damageOf(b.foe, b.mine, slot.id, { crit: false, roll: .925 });
    best = Math.max(best, r.eff === 0 ? 0 : Math.floor(r.dmg * foeSwingMul(b, r.eff)));
  }
  return best;
}

/** What the foe is about to do, telegraphed so the hand can be played into it. */
function readIntent() {
  const b = B();
  // A plan beat is announced a turn ahead, in the same line the moves use, so
  // the whole fight is readable from one place.
  const step = b.plan ? b.plan.steps[b.plan.i % b.plan.steps.length] : 'swing';
  if (step !== 'swing' && PLANS[step]) {
    const p = PLANS[step];
    // A wild kin works its beat smaller than a trainer does. The beat costs it
    // its attack, so a plan is less total damage, not more — but it arrives in
    // one lump, and a lump can take a kin out where two taps could be healed
    // through. At a trainer's numbers that read .389 lost-or-ran in solo against
    // .317 without, which is a bigger price than the moment is worth.
    const n = Math.round((p.edge || p.shield || 0) * planScale(b.foe.lvl)
      * (b.wild ? WILD_PLAN_MUL : 1));
    const tell = p.edge ? `+${n} on the next hit` : p.shield ? `${n} guard` : 'a shield will not help';
    // The chip has to be on the line, or the telegraph lies about the turn.
    const chip = b.wild ? Math.round(chipEstimate(b) * PLAN_CHIP) : 0;
    b.intent = { id: null, name: p.label, dmg: chip, hi: chip, kind: 'plan', step, n, tell };
    return b.intent;
  }
  // A wild kin that is losing stops fighting carefully. Two fights in five were
  // never in doubt, and the reason was not that they were easy — it was that a
  // wild fight is four identical small hits with no moment in it. Same damage,
  // gathered into one swing you are told about a turn ahead: the fight now has a
  // point where it could go wrong, and something to do about it.
  const nextCorner = b.wild ? cornerAt(b.foe, b.mine, b.cornered) : -1;
  if (nextCorner > 0 && b.foe.hp > 0 && b.foe.hp / b.foe.max < nextCorner) {
    b.cornered++;
    b.foeEdge += Math.round(CORNER_EDGE * planScale(b.foe.lvl));
  }
  const id = foeChoose(b.foeEdge > 0);
  const m = MOVES[id];
  // The same scaling the swing applies. Without it the chip named a number the
  // foe was never going to deal.
  // Both ends of the roll, not just its middle. The middle is what the line
  // prints; the top is what the lethal alarm has to be measured against.
  const swing = (roll) => {
    const r = damageOf(b.foe, b.mine, id, { crit: false, roll });
    return r.eff === 0 ? 0 : Math.max(1, Math.floor((r.dmg + (b.foeEdge || 0)) * foeSwingMul(b, r.eff)));
  };
  const est = m.pow ? swing(.925) : 0;
  const hi = m.pow ? swing(1) : 0;
  b.intent = { id, name: m.name, dmg: est, hi, kind: m.pow ? 'attack' : 'buff' };
  // Being cornered is the loudest thing on the line while it lasts, because it
  // is the only part of a wild fight worth reading.
  if (b.cornered > 0 && b.foeEdge > 0 && m.pow) {
    b.intent.name = `${m.name} — cornered`;
    b.intent.tell = null;
  }
  return b.intent;
}

/* ---------------------------------------------------------- the card game --
   A turn is: draw a hand, spend energy on it, end the turn, take the foe's
   hit. The active kin's own moves are shuffled into the same deck as the
   cards you brought, so a fight is the two of them together.
   ------------------------------------------------------------------------ */
// Three energy, five cards. Both measured against themselves, sixty runs an arm,
// and neither is a length dial either:
//
//   BASE_ENERGY 3 -> 4   turns per fight -0.12 +/-0.26   (nothing)
//                        never-in-doubt +.085 +/-.043, wipes -.033 +/-.020
//   HAND_SIZE   5 -> 7   turns per fight -0.28 +/-0.31   (nothing)
//                        and every other headline nothing as well
//
// A third more energy a turn does not shorten a fight; it makes the player
// stronger and the fight safer. Two extra cards a turn do not do anything at all
// — which is the same fact pass 25 found from the other side, that 85% of turns
// end out of energy rather than out of cards. The hand is not the constraint, so
// widening it changes nothing.
//
// Taken with FOE_HP_MUL and the damage work: nothing on either side's numbers
// moves fight length. Only structure does. If you want longer fights, give
// somebody something to do with a turn.
const BASE_ENERGY = 3, HAND_SIZE = 5;

/**
 * A trainer with a plan.
 *
 * Every hand-authored fight in the game was "two kin, no plan": the foe scored
 * its moves each turn and never built toward anything, so a trainer played
 * exactly like a wild kin with more HP. A plan is a short loop of beats the
 * opposing side works through — and because it is a loop rather than a script,
 * it survives a fight going long without needing an ending written for it.
 *
 * Every beat is telegraphed a turn ahead through the intent line that was
 * already there, so the point is never surprise. It is that you can see the big
 * hit coming and get to decide what to do about it.
 */
const PLANS = {
  sharpen: { label: 'sharpening', line: (n) => `is sharpening — the next one will hurt (+${n}).`, edge: 13 },
  brace:   { label: 'bracing',    line: (n) => `braces. ${n} of the next hit will go nowhere.`, shield: 20 },
  // The answer to a sharpen you can see coming is to bank a shield and eat it.
  // Aim is the answer to that answer, which is why only the late trainers know
  // it: the fight stops being "read the beat" and becomes "read the player".
  aim:     { label: 'taking aim',  line: () => 'takes aim. A shield will not be in the way.', pierce: 1 },
  swing:   { label: null },
};
/**
 * How much a plan beat is worth at a given level.
 *
 * It has to keep up with the valley, and it has to *not* be there at the start.
 * Wick's first fight is one kin against one kin at level five with the type
 * advantage his way; every global buff the trainers have ever been given has
 * landed on that fight first and made the opening of the game unwinnable —
 * twice now, caught both times by the "still a fight, not a formality"
 * assertion. A trainer at level five is a kid who was handed their first kin the
 * same morning you were. The plans are worth what they can make of them, and
 * they get better as you go north.
 */
const planScale = (lvl) => (1 + lvl / 22) * Math.min(1, lvl / 12);
// The pool of HP a fight is played over. Their stats are untouched.
//
// THIS IS A DANGER DIAL, NOT A LENGTH DIAL. It was written as the latter — "a foe
// wants a little more than its bare HP to be worth fighting" — and measured
// against itself at 4.0 against 5.0, sixty runs an arm, it moves turns per fight
// by +0.11 ±0.35 in solo and +0.07 ±0.18 in party. Nothing, in both modes. What a
// quarter more HP buys is danger: solo lost-or-ran .249 to .359, wipes .096 to
// .141, never-in-doubt down .059 ±.039.
//
// The deck is why. A longer fight is a fight with more turns of stacking in it,
// so a bigger pool is met by bigger hits rather than by more rounds — the player
// scales into the pool about as fast as the pool grows. Reach for this when
// fights feel *safe*. It will not make them feel *long*.
const FOE_HP_MUL = 4.0, WILD_DMG_MUL = .70;
// How hard a wild kin's plan beat lands, against a trainer's. See readIntent.
const WILD_PLAN_MUL = .8;
// How often a wild encounter is a pair rather than one kin.
//
// The only length lever this game has ever had is structure — every number on
// both sides moves danger and leaves fight length where it was (see FOE_HP_MUL,
// BASE_ENERGY, HAND_SIZE). The one structural thing never tried on the wild side
// is a second body: a trainer's second kin is an extra opening, an extra settle
// and a swap, and that is where a trainer's length comes from.
//
// The pool is held constant — each of a pair carries half the HP one would — so
// this adds turns without adding difficulty, or it does nothing. It is a
// structure test either way.
const WILD_PAIR = .25;
// A gathering wild kin can still lean on you, for this much of a normal hit.
// Zero, because the cure costs more than the drift.
//
// Solo's never-in-doubt went 34% to 39% when wild kin got a plan: the beat costs
// the foe its attack, and that free turn is where the pressure went. A chip puts
// it back — at .45 solo reads 30% never-in-doubt, the best that number has ever
// been. But the chip ends fights faster, and party fights are already the short
// ones: over-in-one goes from 4% to 24%, giving back almost the whole reason the
// plan was worth having. Four points of solo never-in-doubt for twenty of party
// over-in-one is a bad exchange, so the machinery stays and the dial is off.
const PLAN_CHIP = 0;
// A trainer is already a two- or three-kin fight, so each of their kin needs a
// far smaller pool than a lone wild one — and they hit at full strength, which
// a wild kin does not. Giving them the wild number made the opening rival fight
// a coin toss and turned Dorn's two kin into a ten-turn slog.
//
// That "ten-turn slog" is the one length claim in this file that survives, and it
// survives because it is about the number of *kin*, not the size of the pool: a
// trainer's extra kin is an extra opening, an extra settle, an extra swap. Adding
// HP to one kin does not lengthen a fight (see FOE_HP_MUL); adding a kin does.
// Length in this game comes from structure, and a second body is structure.
const TRAINER_HP_MUL = 2.2;
/**
 * A trainer's kin carries less of the pool the more of them there are.
 *
 * A flat multiplier meant a trainer's fight got longer in proportion to their
 * team: Wick's one kin was three turns and Dorn's two were eight, with Coll's
 * three the longest fight in the game and not one of those turns a decision.
 * The pool belongs to the trainer, so it is shared out — three kin at 1.5x each
 * is a longer fight than one at 2.2x, but not three times longer.
 */
const trainerHp = (n) => TRAINER_HP_MUL / Math.pow(Math.max(1, n), .35);
/**
 * And they hit harder than anything in the grass.
 *
 * Trainers stopped winning: every one of them except the opening rival sat at
 * 0% losses with the player's party still above three quarters health. Health
 * was the wrong lever for that — more of it made the fights long rather than
 * dangerous, and Coll's three kin were already the longest fight in the game.
 * A trained kin is not a tougher wild kin, it is a better-hitting one, so the
 * danger goes where you can see it coming instead of into the bar.
 */
const TRAINER_DMG_MUL = 1.35;
/** The same ramp, for the same reason. */
const trainerDmg = (lvl) => 1 + (TRAINER_DMG_MUL - 1) * Math.min(1, lvl / 14);
/**
 * What the foe's swing is scaled by — the wild damper or the trainer ramp, the
 * chip if a plan beat is being paid for, the half-strength blend against a
 * resistance, and the settling penalty.
 *
 * Lifted out because the TELEGRAPH did not apply any of it. `readIntent`
 * estimated `damageOf(...) + foeEdge` and the swing then multiplied that whole
 * thing, so the chip was systematically wrong — measured over sixty runs with
 * the roll frozen and crits off, the foe dealt more than told in 42 swings of
 * 59, median 1.11x, and the spread ran 0.50 to 1.35 because the factor differs
 * by wild-vs-trainer and by level. Two passes had built a lethal warning and an
 * in-fight bag figure on that number. Shared now, so they cannot disagree.
 */
function foeSwingMul(b, eff) {
  const base = (b.wild ? WILD_DMG_MUL : trainerDmg(b.foe.lvl)) * (b.chipping ? PLAN_CHIP : 1);
  const mul = eff < 1 ? (1 + base) / 2 : base;
  return b.foeSettling ? mul * SETTLE_MUL : mul;
}
// A wild kin fights for its life once it is losing: at this much health left it
// gathers itself, and the swing after that is worth this much more.
// CORNER_EDGE was 14 and drifted the solo danger line to .338 lost-or-ran across
// three passes of cornering changes, which is a third of one-kin fights lost or
// run from and higher than it has ever been. At 11 it is .288 ±.038 against
// .338 ±.045 — the intervals overlap at the edges, so read it as direction
// rather than proof — and the free-fight rate does not move at all (38% ±3
// against 37% ±3). That is the trade: measurable danger back, nothing
// measurable given up.
const CORNER_AT = .4, CORNER_EDGE = 11;
// Two moments even when it can hurt you. The single one at .4 left the even
// matchups — where neither side has anything on the other, and which are a fifth
// of one-kin fights — free 37% of the time, because one telegraphed swing across
// four turns is a moment, not a fight. The doubly-lucky bucket, where you
// brought the right kin *and* it cannot touch you, stays comfortable on purpose:
// a free fight there is what good play is for.
/**
 * How hurt a wild kin has to be before it stops fighting carefully — and the
 * answer depends on whether it can hurt you at all.
 *
 * Nearly half of one-kin fights were never in doubt, and the cross-tab says
 * where they live: 43% of fights are ones whose element you resist, and those
 * run 59%, 59% and 45% never-in-doubt against 29% for the fights you walk into
 * at a disadvantage. A kin whose every blow bounces off you cannot threaten you
 * by hitting harder, because hitting is the thing the chart has taken away.
 *
 * So it stops waiting. A resisted wild kin gathers itself while it still has
 * most of its health, which is the one thing it has that the chart cannot blunt:
 * a telegraphed swing carrying flat damage, on a turn you were not expecting to
 * have to answer.
 */
const CORNER_RESIST = [.78, .52, .26];
// Measured against [.62, .40, .22], which was the obvious trade-back when the
// price of this looked too high: it gave two points of never-in-doubt back and
// took .034 off lost-or-ran, and moved turns not at all. Neither clears its
// interval, so it is a wash, and a wash is not a reason to change a shipped
// number. What actually lengthened the fights was the probe running away more
// and failing the roll, which costs a turn — not the cornering.
/** Is every attack this kin has blunted by what the other one is made of? */
const resistedBy = (foe, mine) => {
  let best = 0;
  for (const slot of foe.moves) {
    const m = MOVES[slot.id];
    if (m && m.pow) best = Math.max(best, effect(m.type, mine.types));
  }
  return best < 1;
};
/**
 * The health at which it gathers itself for the nth time, or -1 for never.
 *
 * A kin that can hurt you gets one moment, late. A kin that cannot gets three,
 * starting early — because one extra flat swing is not a fight. Moving a
 * resisted foe's single moment earlier shifted the bucket it lives in by six
 * points and the run average by two, which is inside the interval and therefore
 * not a result. Three moments is the difference between a telegraph and a fight.
 */
const CORNER_PLAIN = [.55, .28];
const cornerAt = (foe, mine, done) => {
  const list = resistedBy(foe, mine) ? CORNER_RESIST : CORNER_PLAIN;
  return done < list.length ? list[done] : -1;
};
// What it costs to be caught changing kin. Switching already cost a turn and
// your hand and everything the deck had stacked up; none of that was a price
// worth thinking about next to buying the element outright.
const SWITCH_PUNISH = 11;
// And what a kin can do on the turn it arrives. Pricing the switch was not
// enough: it cost a turn and a harder hit, and still bought the whole matchup
// immediately, so with a party of four every fight was send-in-the-right-element
// and delete. The payoff arrives a turn late now. Over a three-turn fight that
// is most of the reason to do it at all, which is what makes it a decision
// rather than the obvious opening move.
// (Length claim flagged: "over a three-turn fight that is most of the reason to
// do it" is about the *value* of the delay, which stands. But nothing here buys
// turns — see the note on FOE_HP_MUL.)
const SETTLE_MUL = .6;
/**
 * What a trainer carries, and what it is worth.
 *
 * Trainers could not win, and no constant fixed it, because the problem was not
 * a number: the player arrives with four rested kin and rotates freshness in
 * while a trainer spends one to three, one at a time, with no way to put any of
 * it back. One potion per kin on the team, worth a third of the bar, reached for
 * when the kin on the field is nearly out. It costs them their turn, like every
 * other thing either side can do instead of swinging.
 */
const POTIONS_FOR = (team) => Math.max(1, team);
const FOE_POTION = .34, FOE_POTION_AT = .35;

/** Give a foe its battle-sized health as it steps in. */
function toughen(mon, mul) {
  mon.max = Math.round(mon.max * (mul || FOE_HP_MUL));
  mon.hp = mon.max;
  return mon;
}

/**
 * Hand the battle pool back. A foe you catch joins the party as itself, not as
 * the fight-sized version of itself — otherwise every kin you ever caught walks
 * around with double HP, and the first time one levels up `refresh` recomputes
 * the honest maximum, finds it smaller than what it is carrying, and drives HP
 * straight through zero.
 */
function untoughen(mon) {
  const real = hpAt(DEX[mon.species].base[0], mon.lvl);
  if (mon.max === real) return mon;
  const frac = mon.max > 0 ? mon.hp / mon.max : 1;
  mon.max = real;
  mon.hp = clamp(Math.round(real * frac), 1, real);      // it was caught, so it lives
  return mon;
}

/**
 * Kin moves are the heavy hitters, so they are priced as such: a real move
 * plus a support card is a turn, and three real moves is not. That is where
 * the deck earns its place.
 */
const moveCost = (id) => {
  const m = MOVES[id];
  if (!m.pow) return 1;
  return m.pow >= 100 ? 3 : m.pow >= 45 ? 2 : 1;
};

/**
 * What a card costs *right now*.
 *
 * `chain` is the one mechanic that reads the turn you are having: the card gets
 * a discount for every card you have already played this turn, which turns a
 * finisher you could never afford into the reward for setting one up. Every
 * other cost in the game is fixed, so this is the only place a price moves.
 */
const cardCost = (card) => {
  if (card.src === 'kin') return moveCost(card.id);
  // A save can hold a card whose definition has gone — an id renamed between
  // builds. It must not take the game down; it just costs nothing.
  const def = CARDS[card.id];
  if (!def) return 0;
  const b = B();
  const chain = def.chain && b ? def.chain * (b.playedTurn || 0) : 0;
  return Math.max(0, def.cost - chain);
};
const cardName = (card) => card.src === 'kin' ? MOVES[card.id].name : (CARDS[card.id] || { name: '?' }).name;
const cardRarity = (card) => card.src === 'kin' ? 'kin' : (CARDS[card.id] || { r: 'common' }).r;

function shuffleInto(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = rnd(i + 1);
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

/** The active kin's moves, as cards. They leave with it when it switches out. */
const kinCards = (mon) => mon.moves.map((slot) => ({ src: 'kin', id: slot.id }));

function buildDeck(b) {
  const support = deckCards().map((c) => ({ src: 'deck', u: c.u, id: c.id, bg: 0 }));
  b.draw = shuffleInto(support.concat(kinCards(b.mine)));
  b.hand = []; b.disc = []; b.exh = [];
}

/** Swap the outgoing kin's move cards for the incoming one's. */
function swapKinCards(b) {
  const strip = (pile) => pile.filter((c) => c.src !== 'kin');
  b.draw = strip(b.draw); b.hand = strip(b.hand); b.disc = strip(b.disc);
  b.draw = shuffleInto(b.draw.concat(kinCards(b.mine)));
}

function drawCards(log, n) {
  const b = B();
  for (let i = 0; i < n; i++) {
    if (b.hand.length >= 10) break;
    if (!b.draw.length) {
      if (!b.disc.length) break;
      b.draw = shuffleInto(b.disc);
      b.disc = [];
      snap(log, 'You shuffle the discards back in.');
    }
    b.hand.push(b.draw.pop());
  }
}

/**
 * Everything a deck can stack onto one battle.
 *   atk/def   flat damage added to your attacks / taken off theirs, this battle
 *   edge*     the one-shot half: spent by the next attack you make
 *   riders    statuses every attack of yours tries to apply
 *   hits/mul  extra swings and a damage multiplier on every attack
 * `G.might` is the same idea but permanent, so it lives on the run, not here.
 */
const freshMods = () => ({
  atk: 0, def: 0, thorns: 0,
  edge: 0, edgeSt: null, edgeDrain: 0, edgeCard: null,
  riders: [], hits: 0, mul: 1,
});

/**
 * Battle-only modifiers live here so nothing leaks into the save.
 *
 * Max HP has to be given back to whichever kin it was given to. Tracking one
 * running total and taking it off whoever happened to be out at the end meant
 * you could play a +max HP card, switch, and keep the HP forever while the kin
 * you switched to paid for it — permanently, in the save, every battle.
 */
function clearMods(b) {
  for (const [mon, add] of (b.maxAdds || [])) {
    mon.max = Math.max(1, mon.max - add);
    mon.hp = Math.min(mon.hp, mon.max);
  }
  b.maxAdds = new Map();
  b.mods = freshMods();
  b.maxAdd = 0;
  b.shield = 0;
}

function startPlayerTurn(log) {
  const b = B();
  b.turn++;
  b.playedTurn = 0;                               // chain and combo read this
  b.swungTurn = 0;                                // one attack a turn, no more
  b.shield = 0;                                   // shield is for one round only
  b.energy = BASE_ENERGY + (b.powers.energy || 0);
  if (b.mine.status === 'shock') {
    b.energy = Math.max(1, b.energy - 1);
    snap(log, `${dispName(b.mine)} is jolted — one less energy.`, 'status', 'mine');
  }
  const chill = b.mine.status === 'chill' ? 1 : 0;
  drawCards(log, HAND_SIZE - chill);
  if (chill) snap(log, `${dispName(b.mine)} is chilled — one card fewer.`, 'status', 'mine');
  readIntent();
  b.phase = 'player';
  aimPlayable(b);
}

/**
 * Park the aim on a card you can actually pay for. Only ever called when the
 * hand changes underneath the player — dealing a hand, or spending the card
 * they were on — never when they walked the aim there themselves, because
 * looking at a card you cannot afford yet is a fair thing to want to do.
 * Without it, confirm lands on a dead card and does nothing but toast at you
 * while three playable cards sit next to it.
 */
/**
 * Can this card be played right now? Energy is the obvious half; the other is
 * the one-swing rule — a kin move you have already thrown this turn is as dead
 * as one you cannot pay for, and the hand has to say so rather than quietly
 * refusing the keypress.
 */
function playableNow(b, c) {
  if (cardCost(c) > b.energy) return false;
  return !(c.src === 'kin' && b.swungTurn);
}

function aimPlayable(b) {
  if (!b.hand.length) { b.sel = 0; return; }
  b.sel = clamp(b.sel || 0, 0, b.hand.length - 1);
  if (playableNow(b, b.hand[b.sel])) return;
  // Nearest playable card, searching outward from where the aim already is.
  for (let d = 1; d < b.hand.length; d++) {
    for (const i of [b.sel + d, b.sel - d]) {
      if (i >= 0 && i < b.hand.length && playableNow(b, b.hand[i])) { b.sel = i; return; }
    }
  }
}

/** Damage the player's side takes, shield first. */
function hurtMine(log, amount, why, atk, crit) {
  const b = B();
  // Guard is flat and honest too: "take 2 less" takes 2 off the number, and a
  // hit never falls below 1 so a stack of guard cannot make you untouchable.
  let dmg = Math.max(amount > 0 ? 1 : 0, amount - (b.mods.def || 0));
  // A telegraphed aim goes straight past whatever you banked — and only past
  // the shield, so guard and the rest of the deck still do their job.
  if (b.foePierce && atk === 'foe') {
    b.foePierce = 0;
    if (b.shield > 0) snap(log, 'The shield is not where the hit lands.', 'block', 'mine');
    b.mine.hp = clamp(b.mine.hp - dmg, 0, b.mine.max);
    snap(log, why || `${dispName(b.mine)} took ${dmg}.`, 'hit', 'mine', { atk, crit: !!crit, el: b.hitEl, eff: b.hitEff });
    return dmg;
  }
  if (b.shield > 0) {
    const absorbed = Math.min(b.shield, dmg);
    b.shield -= absorbed; dmg -= absorbed;
    if (absorbed > 0) snap(log, `Shield absorbs ${absorbed}.`, 'block', 'mine');
  }
  if (dmg > 0) {
    b.mine.hp = clamp(b.mine.hp - dmg, 0, b.mine.max);
    snap(log, why || `${dispName(b.mine)} took ${dmg}.`, 'hit', 'mine', atk ? { atk, crit: !!crit, el: b.hitEl, eff: b.hitEff } : null);
  }
  return dmg;
}

/**
 * Everything the deck has stacked onto the kin's next swing. Support cards are
 * honest numbers: "+4" adds 4 to the damage, it is not a stat nudged through
 * the level formula where a level-5 kin would see 1 of it and a level-50 kin
 * would see 12. `edge` is the one-shot half — spent by the next attack, so you
 * choose which move it lands on.
 */
function attackBonus() {
  const b = B();
  if (!b) return { flat: 0, mul: 1, hits: 1 };
  const m = b.mods;
  return {
    flat: (m.atk || 0) + (G.might || 0) + (m.edge || 0),
    mul: m.mul || 1,
    hits: 1 + (m.hits || 0),
    drain: m.edgeDrain || 0,
  };
}

/** The next attack has been made: the one-shot half of the stack is gone. */
function spendEdge() {
  const b = B();
  if (!b) return;
  b.mods.edge = 0;
  b.mods.edgeDrain = 0;
  b.mods.edgeSt = null;
  b.mods.edgeCard = null;
}

/**
 * A `kill` card pays out when the attack it sharpened lands the killing blow.
 * The card no longer swings itself, so the kill belongs to whatever it buffed —
 * which is the deal the card offers: spend it on the swing you think finishes.
 */
function awardEdgeKill(log, defender) {
  const b = B();
  const card = b.mods.edgeCard;
  if (!card || defender.hp > 0) return;
  const def = CARDS[card.id];
  if (!def || !def.kill) return;
  const owned = ownedCard(card.u);
  if (!owned) return;
  const got = growCard(owned, def.kill);
  owned.kills = (owned.kills || 0) + 1;
  snap(log, got ? `${def.name} tasted the kill — permanently +${got}.`
    : `${def.name} tasted the kill, but it is already at its limit.`, 'grow', 'mine');
}

/**
 * Put a status on whatever you just hit, from a rider a card set up. Riders
 * stack: the powers apply on every attack, an `edge` rider only on the next.
 */
function applyRiders(log, target) {
  const b = B();
  const list = (b.mods.riders || []).concat(b.mods.edgeSt ? [b.mods.edgeSt] : []);
  for (const [st, odds] of list) {
    if (target.hp <= 0 || target.status) return;
    if (target.types.includes(IMMUNE_TO[st] || '')) continue;
    if (!chance(odds)) continue;
    target.status = st;
    snap(log, `Foe ${dispName(target)} is ${STATUS[st].name.toLowerCase()}!`, 'status', 'foe');
    return;
  }
}

/**
 * Play the card at hand index `i`. Returns the log; the turn does not end, so
 * you can keep spending energy until it runs out.
 */
function playCard(i) {
  const b = B();
  const log = [];
  const card = b.hand[i];
  if (!card || b.phase !== 'player' || b.over) return log;
  const cost = cardCost(card);
  if (cost > b.energy) { snap(log, 'Not enough energy.'); return log; }

  b.hand.splice(i, 1);
  b.energy -= cost;

  if (card.src === 'kin') {
    // One swing a turn. With three energy and moves costing one or two, the
    // best play was to attack twice and never touch the deck — which is the
    // exact opposite of "your kin brings the attacks, your deck makes them
    // land harder", and why a fight was over in a turn and a half.
    if (b.swungTurn) { b.hand.splice(i, 0, card); b.energy += cost; snap(log, `${dispName(b.mine)} has already swung this turn.`); return log; }
    b.swungTurn = 1;
    const before = b.foe.hp;
    snap(log, `${dispName(b.mine)} plays ${MOVES[card.id].name}.`, 'use', 'mine');
    useMove(log, 'mine', card.id);
    b.disc.push(card);
    if (before > 0 && b.foe.hp <= 0) resolveFoeDown(log);
    return log;
  }

  const def = CARDS[card.id];
  const owned = ownedCard(card.u);
  const inst = { id: card.id, plus: owned ? owned.plus : 0, bg: card.bg || 0 };
  // `combo` pays out only when this is not the first card of the turn. It is
  // the cheapest way to make the *order* you play things in matter.
  const combo = def.combo && (b.playedTurn || 0) > 0 ? def.combo : 0;
  const value = cardValue(inst) + combo;
  const fx = def.fx || {};
  b.playedTurn = (b.playedTurn || 0) + 1;
  snap(log, `You play ${def.name}.${combo ? ' It follows through.' : ''}`, 'card', 'mine');

  // Support only: a card in your deck never damages the foe itself, it makes
  // the kin's attacks do more. `vt` names whichever number the card grows.
  const amt = (key) => (def.vt === key ? value : (fx[key] || 0));
  if (amt('edge')) {
    b.mods.edge += amt('edge');
    if (fx.st) b.mods.edgeSt = fx.st;
    if (fx.drain) b.mods.edgeDrain = Math.max(b.mods.edgeDrain || 0, fx.drain);
    b.mods.edgeCard = card;                    // whoever swings next earns its kill bonus
    snap(log, `The next attack will hit for +${b.mods.edge}.`, 'buff', 'mine');
  }
  if (amt('might')) {
    // A card may grow to four times its own value and no further, because a card
    // that grows forever eventually plays the game for you. G.might is the pile
    // those plays add up to and it had no ceiling at all — by Crown Hollow it
    // reached +499 on every attack, against a wild kin's 174 HP, which turned the
    // back half of every run into one-shots. Same principle, same kind of
    // ceiling: generous enough that a might build is worth building, bounded so
    // it is a build and not an ending.
    G.might = Math.min(MIGHT_CAP, (G.might || 0) + amt('might'));
    snap(log, G.might >= MIGHT_CAP
      ? `Every attack hits for +${G.might}. There is no more room to grow.`
      : `Every attack from now on hits for +${G.might}. For good.`, 'grow', 'mine');
  }
  if (def.kind === 'power' && fx.st) {
    b.mods.riders.push(fx.st);
    snap(log, `Your attacks now ${fx.st[0] === 'snare' ? 'snare' : STATUS[fx.st[0]].name.toLowerCase() + ' on'} what they touch.`, 'buff', 'mine');
  }
  if (fx.hits) { b.mods.hits = (b.mods.hits || 0) + fx.hits; snap(log, 'Your attacks swing again.', 'buff', 'mine'); }
  // The only card in the deck that changes a rule rather than a number. One swing
  // a turn is the shape of every turn in this game; this clears that flag, so the
  // kin may move twice. Everything else in the set adds to a swing, a shield or a
  // heal, which is why every card can stand in for some other card — and a card
  // nothing can stand in for is the thing the deck has never had.
  if (fx.again) { b.swungTurn = 0; snap(log, `${dispName(b.mine)} finds another swing.`, 'buff', 'mine'); }
  if (fx.mul) { b.mods.mul = (b.mods.mul || 1) * fx.mul; snap(log, 'Everything you land hits twice as hard.', 'buff', 'mine'); }
  if (amt('shield')) { b.shield += amt('shield'); snap(log, `Shield up to ${b.shield}.`, 'block', 'mine'); }
  if (amt('atk')) { b.mods.atk += amt('atk'); snap(log, `Every attack now hits for +${b.mods.atk}.`, 'buff', 'mine'); }
  if (amt('def')) { b.mods.def += amt('def'); snap(log, `Every hit will land ${b.mods.def} lighter.`, 'buff', 'mine'); }
  if (fx.thorns) { b.mods.thorns += fx.thorns; snap(log, 'Thorns bristle.', 'buff', 'mine'); }
  if (amt('maxhp')) {
    const add = amt('maxhp');
    b.maxAdd += add; b.mine.max += add; b.mine.hp += add;
    // Booked against this kin, so the switch does not hand the bill to another.
    if (!b.maxAdds) b.maxAdds = new Map();
    b.maxAdds.set(b.mine, (b.maxAdds.get(b.mine) || 0) + add);
    snap(log, `${dispName(b.mine)}'s max HP is up ${add}.`, 'heal', 'mine');
  }
  if (fx.healFull) { b.mine.hp = b.mine.max; snap(log, `${dispName(b.mine)} is whole again.`, 'heal', 'mine'); }
  if (amt('heal')) {
    b.mine.hp = clamp(b.mine.hp + amt('heal'), 0, b.mine.max);
    snap(log, `${dispName(b.mine)} recovers.`, 'heal', 'mine');
  }
  if (fx.selfdmg) hurtMine(log, fx.selfdmg, `${dispName(b.mine)} pays ${fx.selfdmg} HP for it.`);
  if (amt('energy')) {
    if (def.kind === 'power') { b.powers.energy = (b.powers.energy || 0) + amt('energy'); snap(log, 'Energy will run higher from now on.', 'buff', 'mine'); }
    else { b.energy += amt('energy'); snap(log, 'Energy surges.', 'buff', 'mine'); }
  }
  if (amt('draw')) drawCards(log, amt('draw'));

  // ---- growth: the whole point of the system
  if (owned) {
    owned.plays = (owned.plays || 0) + 1;
    if (def.grow) {
      const got = growCard(owned, def.grow);
      if (got) snap(log, `${def.name} grows — now ${cardValue({ id: card.id, plus: owned.plus })}.`, 'grow', 'mine');
      else snap(log, `${def.name} is as sharp as it will ever be.`, 'grow', 'mine');
    }
  }
  if (def.bgrow) {
    // Battle-only growth rides on every copy of this card still in the piles.
    for (const pile of [b.draw, b.hand, b.disc]) {
      for (const c of pile) if (c.src === 'deck' && c.id === card.id) c.bg = (c.bg || 0) + def.bgrow;
    }
    card.bg = (card.bg || 0) + def.bgrow;
    snap(log, `${def.name} sharpens for the rest of the fight.`, 'grow', 'mine');
  }

  if (def.exhaust) { b.exh.push(card); snap(log, `${def.name} is spent.`, 'exhaust', 'mine'); }
  else b.disc.push(card);

  return log;
}

/**
 * The best kin a trainer has left for the fight in front of them, or -1.
 *
 * Scored the way a person scores it: what their element does to yours, weighted
 * by how much of the kin is still there. A trainer only reaches for it when the
 * one on the field is the wrong one — resisted, or nearly out — because it costs
 * them the turn, exactly as it costs you.
 */
function foeBench(force) {
  const b = B();
  if (!b.roster || b.wild) return -1;
  const best = (m, def) => {
    let e = 0;
    for (const slot of m.moves) {
      const mv = MOVES[slot.id];
      if (mv && mv.pow) e = Math.max(e, effect(mv.type, def.types));
    }
    return e;
  };
  const cur = b.foe;
  const mine = best(cur, b.mine);
  if (!force && !(mine < 1 || cur.hp / cur.max < .35)) return -1;
  let pick = -1, top = mine * (cur.hp / cur.max);
  b.roster.forEach((m, i) => {
    if (m === cur || m.hp <= 0) return;
    const score = best(m, b.mine) * (m.hp / m.max);
    if (score > top * 1.6) { pick = i; top = score; }
  });
  return pick;
}

/**
 * A trainer sends in somebody else. The same deal you get, mirrored: it costs
 * them their turn, the kin arriving swings soft once, and you catch them
 * changing — your next attack carries the edge theirs would have carried if you
 * had been the one to blink.
 */
function foeSwap(log, idx) {
  const b = B();
  const next = b.roster[idx];
  snap(log, `${b.npc ? b.npc.name : 'The challenger'} calls ${dispName(b.foe)} back!`, 'faint', 'foe');
  b.foe.stages = { atk: 0, def: 0, spd: 0 };
  b.foeShield = 0; b.foeEdge = 0; b.foePierce = 0; b.cornered = 0; b.chipping = 0;
  b.foe = next;
  b.teamIdx = idx;                       // whoever is out is who is out
  next.stages = { atk: 0, def: 0, spd: 0 };
  b.dispF = b.tgtF = next.hp;
  b.foeSettling = 1;
  b.foeSwaps++;
  b.foeSwapT = b.turn;
  b.mods.edge = (b.mods.edge || 0) + Math.round(SWITCH_PUNISH * planScale(next.lvl));
  const fresh = seeMon(next.species);
  snap(log, `${b.npc ? b.npc.name : 'The challenger'} sends out ${next.name}!`, 'send', 'foe');
  // Through the log, not straight out of here. A raw call only BUILDS the log;
  // the state moves when submitLog plays it back, so a toast fired at this line
  // would land a beat before the player is told anything came out at all.
  if (fresh) snap(log, dexNew(next.name), 'dex', 'foe');
  snap(log, `Caught mid-change — your next attack will land harder.`, 'buff', 'mine');
}

/** The foe is down: award XP and gems, or send out the next of a trainer's team. */
function resolveFoeDown(log) {
  const b = B();
  snap(log, `${b.wild ? 'Wild ' : 'Foe '}${dispName(b.foe)} is down!`, 'faint', 'foe');
  if (b.mine.hp > 0) grantXP(log, b.mine, b.foe);
  // Beating something puts a little back. A measured run walked to the Wayhouse
  // five times before Crown Hollow, every trip a corridor you had already
  // cleared — attrition with no recovery except the town turns exploring into
  // errands. Winning is now its own second wind, so the walk back is a choice
  // rather than a tax, and a chain of fights is survivable on its own terms.
  // …but only in proportion to what the fight cost. A flat slice made every
  // walkover free as well, and a fight you cannot lose is a cutscene you have
  // to press buttons through — the measured share of those went *up*. Half of
  // what this fight took off you, capped, so a hard fight pays and a trivial
  // one gives you nothing you did not already have.
  if (b.mine.hp > 0 && b.mine.hp < b.mine.max) {
    const mark = b.hpMark == null ? b.mine.max : b.hpMark;
    const lost = Math.max(0, mark - b.mine.hp);
    const back = Math.min(Math.round(lost * RALLY_SHARE), Math.round(b.mine.max * RALLY_CAP));
    if (back > 0) {
      const had = b.mine.hp;
      b.mine.hp = clamp(b.mine.hp + back, 0, b.mine.max);
      if (b.mine.hp > had) snap(log, `${dispName(b.mine)} catches its breath. +${b.mine.hp - had} HP.`, 'heal', 'mine');
    }
  }
  b.hpMark = b.mine.hp;                      // the next foe is measured from here
  // A trainer's team is a bench now, so "the next one" is the best one left
  // rather than the one that happens to be written next in the list.
  if (b.roster) {
    b.foeShield = 0; b.foeEdge = 0; b.foePierce = 0; b.foeSettling = 0;
    const idx = foeBench(true);
    const nextIdx = idx >= 0 ? idx : b.roster.findIndex((m) => m.hp > 0);
    if (nextIdx >= 0) {
      b.foe = b.roster[nextIdx];
      b.teamIdx = nextIdx;
      b.foe.stages = { atk: 0, def: 0, spd: 0 };
      b.dispF = b.tgtF = b.foe.hp;
      const seen = seeMon(b.foe.species);
      snap(log, `${b.npc ? b.npc.name : 'The challenger'} sends out ${b.foe.name}!`, 'send', 'foe');
      if (seen) snap(log, dexNew(b.foe.name), 'dex', 'foe');
      readIntent();
    } else {
      b.over = 'win';
    }
  } else if (b.team && b.teamIdx < b.team.length - 1) {
    b.teamIdx++;
    const nxt = b.team[b.teamIdx];
    b.foe = toughen(mkMon(nxt[0], nxt[1]), FOE_HP_MUL);
    b.foe.stages = { atk: 0, def: 0, spd: 0 };
    b.dispF = b.tgtF = b.foe.hp;
    seeMon(b.foe.species);
    snap(log, `${b.npc ? b.npc.name : 'The challenger'} sends out ${b.foe.name}!`, 'send', 'foe');
    readIntent();
  } else {
    b.over = 'win';
  }
}

/** The foe takes its telegraphed action, then statuses tick. */
function foeTurn(log) {
  const b = B();
  if (b.over || b.foe.hp <= 0 || b.mine.hp <= 0) return;
  b.phase = 'foe';
  // A potion, if the kin on the field is nearly out and there is one left. This
  // comes before the bench because putting the kin you have back together beats
  // sending in a fresh one that arrives swinging soft.
  if (b.foePotions > 0 && !b.wild && b.foe.hp / b.foe.max < FOE_POTION_AT && b.foe.hp > 0) {
    b.foePotions--;
    b.foeHeals++;
    const back = Math.max(1, Math.round(b.foe.max * FOE_POTION));
    const had = b.foe.hp;
    b.foe.hp = clamp(b.foe.hp + back, 0, b.foe.max);
    snap(log, `${b.npc ? b.npc.name : 'The challenger'} uses a potion. ${dispName(b.foe)} recovers ${b.foe.hp - had}.`, 'heal', 'foe');
    if (b.foe.hp > 0 && b.mine.hp > 0) endOfTurn(log);
    return;
  }
  // Somebody else's turn. A trainer with a bench uses it, at the same price you
  // pay: the turn goes, the kin arriving swings soft once, and you get the edge
  // for catching them mid-change. Once per fight per kin on the bench, and never
  // twice running, or a three-kin trainer can stall a fight for ever.
  if (b.roster && !b.wild && b.turn > b.foeSwapT + 1 && b.foeSwaps < b.roster.length) {
    const idx = foeBench(false);
    if (idx >= 0) {
      foeSwap(log, idx);
      if (b.foe.hp > 0 && b.mine.hp > 0) endOfTurn(log);
      return;
    }
  }
  // Work the plan. A beat costs the foe its attack, which is what makes it a
  // decision on your side too: the turn it braces is the turn it does not hit.
  if (b.intent && b.intent.kind === 'plan') {
    const p = PLANS[b.intent.step], n = b.intent.n;
    if (p.edge) { b.foeEdge += n; snap(log, `${dispName(b.foe)} ${p.line(n)}`, 'buff', 'foe'); }
    if (p.shield) { b.foeShield += n; snap(log, `${dispName(b.foe)} ${p.line(n)}`, 'block', 'foe'); }
    if (p.pierce) { b.foePierce = 1; snap(log, `${dispName(b.foe)} ${p.line(n)}`, 'buff', 'foe'); }
    if (b.plan) b.plan.i++;
    // A wild kin gathering still swings, softly. Everything goes through the
    // normal attack path so shields, guard, thorns and the knockout all behave —
    // `chipping` only scales the number.
    // Guarded on the dial, not just scaled by it. At PLAN_CHIP = 0 this block
    // still ran a zero-damage attack — and `useMove` spends `b.foeEdge` on the
    // way through, so the gather beat threw away the sharpen it had just gained
    // and the whole plan quietly did nothing. Shipped that way in pass 34 and
    // caught by the first paired run in pass 35: party over-in-one read 20.6%
    // where pass 33 had measured 4%.
    if (b.wild && PLAN_CHIP > 0) {
      b.chipping = 1;
      const cid = foeChoose(b.foeEdge > 0);
      const hpWas = b.mine.hp;
      useMove(log, 'foe', cid);
      b.chipping = 0;
      if (b.mods.thorns && b.mine.hp < hpWas && b.foe.hp > 0) {
        b.foe.hp = clamp(b.foe.hp - b.mods.thorns, 0, b.foe.max);
        snap(log, `Thorns bite back for ${b.mods.thorns}.`, 'hit', 'foe');
        if (b.foe.hp <= 0) { resolveFoeDown(log); return; }
      }
    }
    if (b.foe.hp > 0 && b.mine.hp > 0) endOfTurn(log);
    return;
  }
  if (b.plan) b.plan.i++;
  const id = (b.intent && b.intent.id) || foeChoose(b.foeEdge > 0);
  const hpBefore = b.mine.hp;
  useMove(log, 'foe', id);
  // Thorns answer anything that actually connected.
  if (b.mods.thorns && b.mine.hp < hpBefore && b.foe.hp > 0) {
    b.foe.hp = clamp(b.foe.hp - b.mods.thorns, 0, b.foe.max);
    snap(log, `Thorns bite back for ${b.mods.thorns}.`, 'hit', 'foe');
    if (b.foe.hp <= 0) { resolveFoeDown(log); return; }
  }
  if (b.foe.hp > 0 && b.mine.hp > 0) endOfTurn(log);
}

function afterFoe(log) {
  const b = B();
  // A foe can die on its own turn — burn or snare finishing it at end of turn,
  // or thorns answering the hit it just landed. When that happens and there is
  // another kin behind it, the next one steps in and the turn has to come back
  // to the player: returning here left the battle sitting in the foe phase with
  // an empty hand and no energy, and nothing the player pressed could move it.
  if (b.foe.hp <= 0 && !b.over) resolveFoeDown(log);
  if (b.mine.hp <= 0) {
    snap(log, `${dispName(b.mine)} has fainted.`, 'faint', 'mine');
    clearMods(b);
    b.over = partyAlive() ? 'switch' : 'lose';
    return;
  }
  if (!b.over) startPlayerTurn(log);
}

/** End the player's turn: hand goes to the discard, then the foe swings. */
function endTurn() {
  const b = B();
  const log = [];
  if (b.phase !== 'player' || b.over) return log;
  // A retained card stays in your hand across the turn. It is the difference
  // between a heal you must spend now and a heal you are holding — which is a
  // decision every single turn rather than one.
  const kept = b.hand.filter((c) => c.src !== 'kin' && CARDS[c.id].retain);
  b.disc.push(...b.hand.filter((c) => !kept.includes(c)));
  b.hand = kept;
  if (kept.length) snap(log, `${kept.length === 1 ? cardName(kept[0]) + ' stays' : kept.length + ' cards stay'} in your hand.`, 'buff', 'mine');
  foeTurn(log);
  afterFoe(log);
  return log;
}

/**
 * Actions that are not cards: an item, a switch, or running. Each one costs
 * the rest of your turn, exactly as it did before.
 */
function doAction(action) {
  const b = B();
  const log = [];
  if (b.over || b.phase !== 'player') return log;

  if (action.kind === 'run') {
    if (!b.wild) { snap(log, 'There is no running from a challenge!'); return log; }
    b.escapes++;
    const odds = clamp(.4 + .35 * (effStat(b.mine, 'spd') / Math.max(1, effStat(b.foe, 'spd')) - 1) + b.escapes * .15, .12, .95);
    if (b.mine.status === 'snare') snap(log, 'Roots hold you fast — no escape!');
    else if (chance(odds)) { snap(log, 'You slip away into the grass.', 'flee'); b.over = 'fled'; return log; }
    else snap(log, 'You could not get away!');
  } else if (action.kind === 'item') {
    if (!useItemInBattle(log, action.id, action.target)) return log;
    if (b.over === 'caught') return log;
  } else if (action.kind === 'switch') {
    const next = G.party[action.idx];
    if (!next || !alive(next) || next === b.mine) return log;
    // A switch cost one turn and bought the whole matchup, which made it a
    // reflex rather than a decision: send in the right element, delete the
    // thing, never lose. It is now a moment you can be caught in — the hit that
    // lands while your kin is still finding its feet comes in harder.
    if (b.foe.hp > 0 && !b.over) b.foeEdge += Math.round(SWITCH_PUNISH * planScale(b.foe.lvl));
    b.settling = 1;
    snap(log, `Come back, ${dispName(b.mine)}!`);
    clearMods(b);
    b.mine.stages = { atk: 0, def: 0, spd: 0 };
    b.mine = next;
    b.hpMark = next.hp;                  // a fresh kin is measured from where it came in
    next.stages = { atk: 0, def: 0, spd: 0 };
    swapKinCards(b);
    snap(log, `Go, ${dispName(next)}!`, 'send', 'mine');
    if (b.foeEdge > 0) snap(log, `${dispName(b.foe)} is already coming — this will hurt.`, 'buff', 'foe');
  }

  b.disc.push(...b.hand);
  b.hand = [];
  foeTurn(log);
  afterFoe(log);
  return log;
}

function useItemInBattle(log, id, targetIdx) {
  const b = B();
  const it = ITEMS[id];
  if (!it || !(G.bag[id] > 0)) { snap(log, 'You have none of those.'); return false; }
  if (it.kind === 'orb') {
    if (!b.wild) { snap(log, 'Stealing another trainer\'s kin? No.'); return false; }
    G.bag[id]--;
    tryCatch(log, id);
    return true;
  }
  const target = targetIdx != null ? G.party[targetIdx] : b.mine;
  if (it.kind === 'heal') {
    if (target.hp <= 0) { snap(log, `${dispName(target)} is out cold — that will not help.`); return false; }
    if (target.hp >= target.max) { snap(log, `${dispName(target)} is already whole.`); return false; }
    G.bag[id]--;
    target.hp = clamp(target.hp + it.amt, 0, target.max);
    snap(log, `${dispName(target)} recovered.`, 'heal', 'mine');
  } else if (it.kind === 'revive') {
    if (target.hp > 0) { snap(log, `${dispName(target)} does not need that.`); return false; }
    G.bag[id]--;
    target.hp = Math.floor(target.max / 2);
    snap(log, `${dispName(target)} opens its eyes.`, 'heal', 'mine');
  } else if (it.kind === 'draw') {
    G.bag[id]--;
    drawCards(log, it.amt);
    snap(log, 'The elixir clears your head.', 'buff', 'mine');
  }
  if (G.bag[id] <= 0) delete G.bag[id];
  return true;
}

// ---- battle scene drawing ---------------------------------------------
/**
 * The place a fight happens in.
 *
 * It used to be two flat gradient bands and four ellipses, which is a diagram
 * of an arena rather than one. What makes a backdrop read as somewhere is
 * depth, and depth in a 256-pixel-wide picture is layers: things further away
 * are lighter, lower in contrast and closer to the sky colour, and each layer
 * sits on a horizon line you can point at. The foe's element tints the whole
 * stack, so a fight against a Tide kin happens somewhere cold and a fight
 * against an Ember one somewhere that is not.
 */
function drawArena(g, tint, b) {
  const t = G.t;
  const HORIZON = 58;

  // Sky: darkest at the top, warming toward the horizon so the eye goes there.
  const sky = g.createLinearGradient(0, 0, 0, HORIZON + 10);
  sky.addColorStop(0, '#1a1128');
  sky.addColorStop(.6, '#2c1c3a');
  sky.addColorStop(1, '#432b47');
  g.fillStyle = sky; g.fillRect(0, 0, VIEW_W, HORIZON + 10);
  // The element sits over the sky rather than replacing it, so every arena is
  // recognisably the same valley in a different light.
  g.save(); g.globalAlpha = .16; g.fillStyle = tint;
  g.fillRect(0, 0, VIEW_W, HORIZON + 10); g.restore();

  // A low sun on the horizon behind the foe: something for the layers to sit against.
  const glow = g.createRadialGradient(178, HORIZON, 4, 178, HORIZON, 74);
  glow.addColorStop(0, 'rgba(255,214,160,.30)');
  glow.addColorStop(1, 'rgba(255,214,160,0)');
  g.fillStyle = glow; g.fillRect(0, 0, VIEW_W, HORIZON + 12);

  /** One rolling ridge. Further back means lighter and flatter. */
  const ridge = (baseY, amp, step, col, phase) => {
    g.fillStyle = col;
    g.beginPath();
    g.moveTo(0, VIEW_H);
    for (let x = 0; x <= VIEW_W; x += step) {
      const h = Math.sin(x * .021 + phase) * amp + Math.sin(x * .053 + phase * 1.7) * amp * .4;
      g.lineTo(x, Math.round(baseY - h));
    }
    g.lineTo(VIEW_W, VIEW_H);
    g.closePath(); g.fill();
  };
  // Further back is lighter, flatter and closer to the sky; nearer is darker
  // and rolls harder. Three is enough to read as distance.
  ridge(HORIZON + 1, 13, 6, '#54406b', .8);
  ridge(HORIZON + 11, 16, 5, '#3d2e55', 2.4);
  ridge(HORIZON + 22, 13, 4, '#2a2039', 4.1);

  // The field itself, running from the far ridge down under the player.
  const field = g.createLinearGradient(0, HORIZON + 12, 0, VIEW_H);
  field.addColorStop(0, '#2b4a38');
  field.addColorStop(.5, '#24402f');
  field.addColorStop(1, '#1a2f24');
  g.fillStyle = field; g.fillRect(0, HORIZON + 12, VIEW_W, VIEW_H - HORIZON - 12);

  // The field was one flat sweep of green, which is the arena equivalent of a
  // grey box. Same rule as the terrain tiles: texture is clusters, not pixels,
  // and it thins with distance. The seeds are fixed, so the grass does not
  // crawl between frames — a field that shimmers reads as static, not as grass.
  const FIELD_TOP = HORIZON + 12;
  for (let i = 0; i < 150; i++) {
    const seed = (i * 977) % 1009;
    const gx = seed % VIEW_W;
    // Squared distribution: sparse near the horizon, thick in the foreground.
    const d = ((seed * 31) % 100) / 100;
    const gy = FIELD_TOP + 2 + d * d * (VIEW_H - FIELD_TOP - 2);
    const near = (gy - FIELD_TOP) / (VIEW_H - FIELD_TOP);
    g.fillStyle = i % 5 === 0 ? '#3d6b4a' : near > .55 ? '#1b3427' : '#27452f';
    const h = near > .5 ? 2 : 1;
    g.fillRect(Math.round(gx), Math.round(gy), 1, h);
    if (i % 3 === 0) g.fillRect(Math.round(gx) + 2, Math.round(gy) + (h - 1), 1, 1);
  }
  // A bank across the very bottom: the ground the player is standing on, in
  // front of everything, so the picture has a floor and not just a backdrop.
  const bank = g.createLinearGradient(0, VIEW_H - 26, 0, VIEW_H);
  bank.addColorStop(0, 'rgba(10,22,17,0)');
  bank.addColorStop(1, 'rgba(8,18,14,.72)');
  g.fillStyle = bank; g.fillRect(0, VIEW_H - 26, VIEW_W, 26);

  /** A stand: a rim of light on top, a dark bed under it, the shadow beyond. */
  const stand = (cx, cy, rx, ry) => {
    const oval = (ox, oy, sx2, sy2, col) => {
      g.save(); g.translate(cx + ox, cy + oy); g.scale(1, sy2 / sx2);
      g.beginPath(); g.arc(0, 0, sx2, 0, Math.PI * 2); g.fillStyle = col; g.fill(); g.restore();
    };
    oval(2, 3, rx, ry, 'rgba(12,7,18,.45)');     // cast shadow, offset away from the light
    oval(0, 0, rx, ry, '#22392b');
    oval(0, -1, rx - 5, ry - 2, '#2f5138');
    oval(0, -2, rx - 12, ry - 4, '#3a6442');
  };
  stand(178, 68, 48, 12);
  stand(72, 111, 58, 14);

  // Motes drifting in the light. Three of them, seeded so they disagree.
  g.save();
  for (let i = 0; i < 14; i++) {
    const sp = .12 + (i % 4) * .05, seed = (i * 71 % 37) / 37;
    const x = (seed * VIEW_W + t * 9 * sp * 10) % VIEW_W;
    const y = 20 + ((seed * 61 % 1) * 60 + Math.sin(t * .8 + i) * 6);
    g.globalAlpha = .10 + (i % 3) * .04;
    g.fillStyle = '#ffe9c0';
    g.fillRect(Math.round(x), Math.round(y), 1, 1);
  }
  g.restore();
  void b;
}

function drawBattle(g) {
  const b = B();
  const t = G.t;
  const tint = TYPES[b.foe.types[0]] || '#7a5fc4';
  const FOE_GROUND = 66, MY_GROUND = 108;
  drawArena(g, tint, b);

  const shake = b.shake > 0 ? Math.sin(t * 70) * b.shake * 3 : 0;

  /** What a creature throws on the stand it is standing on. */
  const under = (cx, cy, r, alpha) => {
    g.save(); g.globalAlpha = alpha; g.fillStyle = '#0d0716';
    g.translate(cx, cy); g.scale(1, .32);
    g.beginPath(); g.arc(0, 0, r, 0, Math.PI * 2); g.fill(); g.restore();
  };
  const foeId = b.foe.species, myId = b.mine.species;
  const fs = 1.5, ms = 2;
  const fb = artBottom(foeId), mb = artBottom(myId);
  // Three motions, all measured along the line between the two of them and all
  // in whole pixels — a sprite that lands between them at this scale shimmers.
  //
  //   wind   pull back before the swing, so the lunge is a release
  //   lunge  out fast, back slower
  //   recoil the shove whoever took it goes through, and back
  const wind = (v) => (v > 0 ? Math.round(Math.sin((1 - v / WIND_UP) * Math.PI) * 4) : 0);
  const lunge = (v) => (v > 0 ? Math.round(Math.sin((1 - v / .26) * Math.PI) * 7) : 0);
  const recoil = (v) => {
    if (v <= 0) return 0;
    const k = 1 - v / RECOIL;                       // out in the first quarter…
    return Math.round((k < .25 ? k / .25 : (1 - k) / .75) * 6);   // …back over the rest
  };
  // Positive is "toward the foe" for mine, and the mirror of that for the foe.
  const pushM = lunge(b.lungeM || 0) - wind(b.windM || 0) - recoil(b.recoilM || 0);
  const pushF = lunge(b.lungeF || 0) - wind(b.windF || 0) - recoil(b.recoilF || 0);

  const fx = 178 - 40 * fs / 2 + shake * (b.flashF > 0 ? 1 : 0) - pushF;
  const fy = FOE_GROUND - fb * fs + Math.sin(t * 1.7) * 1.5 + Math.abs(pushF) * .18;
  const mx = 72 - 40 * ms / 2 - shake * (b.flashM > 0 ? 1 : 0) + pushM;
  const my = MY_GROUND - mb * ms + Math.sin(t * 1.9 + 1) * 2 + Math.abs(pushM) * .18;

  g.save(); g.globalAlpha = .3; g.fillStyle = '#000';
  if (g.ellipse) { g.beginPath(); g.ellipse(178, FOE_GROUND, 22, 5, 0, 0, Math.PI * 2); g.fill();
                   g.beginPath(); g.ellipse(72, MY_GROUND, 28, 6, 0, 0, Math.PI * 2); g.fill(); }
  g.restore();

  // A level lands on your own kin: a ring going up off the ground and sparks
  // with it. Upward, like the mend — it is the same claim, that something good
  // just happened to this creature — but quick and bright where a rest is slow
  // and soft.
  if (b.lvT > 0) {
    const k = 1 - b.lvT / LVL_T;
    const cx = 72, cy = MY_GROUND;
    // …and the ground under it lights up, because a level is something that
    // happens TO this creature and nothing on the field said so.
    //
    // Measured in the 68x52 box these rings and sparks live in: the whole beat
    // added 0.48 to the mean luminance. The victory flourish that follows it
    // adds 4.92 to the same box — TEN TIMES more — so the most repeated good
    // thing in the game was an order of magnitude quieter than the thing that
    // comes after it. Three one-pixel rings at half alpha cannot carry a beat;
    // a ring is an outline and what was missing was light.
    //
    // Up and out with the rings, and gone before they are: the glow peaks early
    // and is out by the time the last ring reaches its edge, so the beat ends
    // on the outline rather than on a smear.
    {
      const gk = Math.sin(clamp(k * 1.35, 0, 1) * Math.PI);
      if (gk > .01) {
        const gr = g.createRadialGradient(cx, cy - 6, 2, cx, cy - 6, 34);
        gr.addColorStop(0, `rgba(255,233,168,${(gk * .22).toFixed(3)})`);
        gr.addColorStop(1, 'rgba(255,201,77,0)');
        g.save();
        g.globalCompositeOperation = 'lighter';
        g.fillStyle = gr;
        g.fillRect(cx - 36, cy - 42, 72, 50);
        g.restore();
      }
    }
    g.save();
    g.globalCompositeOperation = 'lighter';
    for (let r = 0; r < 3; r++) {
      const rk = clamp(k * 1.3 - r * .16, 0, 1);
      if (rk <= 0 || rk >= 1) continue;
      g.globalAlpha = (1 - rk) * .9;
      g.strokeStyle = r % 2 ? '#ffe9a8' : '#ffc94d';
      g.lineWidth = 2;
      g.beginPath();
      if (g.ellipse) g.ellipse(cx, cy - rk * 26, 10 + rk * 16, (10 + rk * 16) * .34, 0, 0, Math.PI * 2);
      g.stroke();
    }
    g.restore();
    for (let i = 0; i < 12; i++) {
      const a = (i * 2.39) % (Math.PI * 2);
      const age = clamp(k * 1.5 - i * .04, 0, 1);
      if (age <= 0 || age >= 1) continue;
      const px = cx + Math.cos(a) * (5 + (i % 4) * 5);
      const py = cy + 2 - age * (26 + (i % 3) * 9);
      g.globalAlpha = Math.sin(age * Math.PI) * .95;
      g.fillStyle = '#2a1b2e';
      g.fillRect(Math.round(px) - 1, Math.round(py) - 1, 3, 3);
      g.fillStyle = i % 3 ? '#ffd873' : '#fff6d8';
      g.fillRect(Math.round(px), Math.round(py), 1, 1);
    }
    g.globalAlpha = 1;
  }

  const entry = clamp(b.entry, 0, 1);
  // A walk-on, not a slide. Sliding in at a constant speed is a teleport with
  // extra frames; what sells arrival is deceleration plus weight going down on
  // every step, so the offset eases out and the body bobs while it is still
  // covering ground. Both fall to nothing exactly when the entry finishes.
  const walkOff = Math.pow(1 - entry, 3) * 96;
  const gait = Math.abs(Math.sin(entry * Math.PI * 4)) * 4 * (1 - entry);
  // Dust kicked up behind whoever is still walking in.
  if (entry < 1) {
    g.save();
    for (let i = 0; i < 5; i++) {
      const age = (entry * 3 + i * .21) % 1;
      g.globalAlpha = (1 - age) * .45 * (1 - entry);
      g.fillStyle = '#cbb6d8';
      g.fillRect(Math.round(178 + walkOff + 14 + age * 16), Math.round(FOE_GROUND + 1 - age * 5), 2, 1);
      g.fillRect(Math.round(72 - walkOff - 16 - age * 18), Math.round(MY_GROUND + 2 - age * 6), 2, 1);
    }
    g.restore();
    g.globalAlpha = 1;
  }
  // While the orb has it, the foe is not on the field. It shrinks into the
  // shell on the way in and comes back the same way if the shell gives.
  const held = orbPhase();
  const inOrb = held === 'fall' || held === 'wobble' || held === 'gap' || held === 'click';
  if (!inOrb) under(178, FOE_GROUND + 3, 17, b.foe.hp <= 0 ? .12 : .34);
  under(72, MY_GROUND + 4, 21, b.mine.hp <= 0 ? .12 : .34);
  // Going down: a slump and a fade rather than a creature that is suddenly
  // translucent. Ease-out, so it drops fast and settles.
  const ko = (v, has) => {
    if (v == null) return has ? { dy: 10, a: .3 } : { dy: 0, a: 1 };
    const k = clamp(v / KO_FALL, 0, 1), e = 1 - Math.pow(1 - k, 2);
    return { dy: Math.round(e * 10), a: 1 - e * .7 };
  };
  const koF = ko(b.downF, b.foe.hp <= 0), koM = ko(b.downM, b.mine.hp <= 0);

  if (!inOrb) {
    let alpha = koF.a;
    let scale = fs;
    if (held === 'suck') {
      const k = clamp(b.orb.t / ORB.suck, 0, 1);
      alpha *= 1 - k; scale = Math.max(1, Math.round(fs * (1 - k * .7)));
    }
    drawSpr(g, 'creature', foeId, fx + walkOff, fy - gait + koF.dy, scale,
      { flash: b.flashF > 0 ? b.flashF : 0, alpha });
  }
  drawSpr(g, 'creature', myId, mx - walkOff, my - gait + koM.dy, ms,
    { flip: true, flash: b.flashM > 0 ? b.flashM : 0, alpha: koM.a });

  drawBurst(g, MY_GROUND, FOE_GROUND);
  drawCrit(g, MY_GROUND, FOE_GROUND);
  drawOrb(g, MY_GROUND, FOE_GROUND);
  drawPops(g, MY_GROUND, FOE_GROUND);
}

/**
 * What a critical hit looks like.
 *
 * The log has said "A critical hit!" since the first build and the picture said
 * nothing, so the biggest number in the fight arrived looking like every other
 * number. This is the whole difference: a ring that punches outward and thins
 * as it goes, and four spokes on the diagonals — the diagonals rather than the
 * axes, because a cross reads as a plus sign and a saltire reads as an impact.
 */
/**
