// ---- NPCs --------------------------------------------------------------
// The rival always shows up with the starter that beats yours, and keeps it.
const RIVAL_PICK = { cindercub: 'dewdrip', dewdrip: 'sproutle', sproutle: 'cindercub' };

/** A trainer's team, resolved at challenge time so the rival can react to you. */
function trainerTeam(npc) {
  const pick = RIVAL_PICK[G.flags.starter] || 'dewdrip';
  // Same level as yours. He already has the type advantage and two levels on
  // top of that made the first fight in the game unwinnable, which is a poor
  // way to open — and he stands between the town and the only grass to grind in.
  if (npc.dynamic === 'rival1') return [[pick, 5]];
  if (npc.dynamic === 'rival2') {
    const evo = DEX[pick].evo ? DEX[pick].evo[0] : pick;
    return [['kindlark', 15], [evo, 16]];
  }
  if (npc.dynamic === 'rival3') {
    // Three days up a mountain with the same kin: it is fully grown by now.
    let top = pick;
    while (DEX[top].evo) top = DEX[top].evo[0];
    return [['voltyx', 28], ['nocthorn', 29], [top, 31]];
  }
  return npc.trainer.team.map((e) => [e[0], e[1]]);
}

function talkTo(npc) {
  if (npc.script === 'rowan') { rowanScript(); return; }
  if (npc.trainer && !G.flags[npc.id]) {
    say(npc.name, npc.lines, () => {
      const team = trainerTeam(npc);
      const foe = mkMon(team[0][0], team[0][1]);
      startBattle({ foe, team, npc, wild: false });
    });
    return;
  }
  if (npc.heal) {
    say(npc.name, npc.lines, () => {
      healParty();
      say(npc.name, ['There. Right as rain.'], () => { saveGame(); });
    });
    return;
  }
  if (npc.shop) { say(npc.name, npc.lines, () => openScreen('shop')); return; }
  if (npc.chests) { say(npc.name, npc.lines, () => openScreen('chests')); return; }
  say(npc.name, npc.trainer && G.flags[npc.id] ? (npc.after || ['Good match. Go on.']) : npc.lines);
}

function healParty() {
  G.party.forEach((m) => { m.hp = m.max; m.status = ''; m.moves.forEach((mv) => { mv.pp = mv.max; }); });
  playCue('heal');
}

const STARTERS = ['cindercub', 'dewdrip', 'sproutle'];
function rowanScript() {
  const npc = G.map.npcs[0];
  if (!G.flags.gotStarter) {
    say('Elder Rowan', [
      'There you are. Late, but there.',
      'The valley is full of kin and I am full of years. One of us has to go out and look at them.',
      'Pick one. It will be yours and you will be its, and neither of you gets a say after that.',
    ], () => chooseStarter());
    return;
  }
  if (G.flags.beatVespyr) {
    say('Elder Rowan', [
      'So it went with you.',
      `Nineteen kin in this valley and you have ${dexCount(2)} of them written down in your own hand.`,
      'That is the work. There is no ceremony at the end of it — just more valley.',
      'Go on. Take them out again.',
    ]);
    return;
  }
  if (dexCount(2) >= 8) {
    say('Elder Rowan', [`${dexCount(2)} caught. You are doing better than I did.`, 'Crown Hollow, past the Warden. Something up there is worth the walk.']);
    return;
  }
  say('Elder Rowan', [`Seen ${dexCount(1)}, caught ${dexCount(2)}. Keep at it.`, 'The grass does the teaching. I only do the paperwork.']);
}

function chooseStarter() {
  G.mode = 'menu';
  openMenu('mainmenu', STARTERS.map((id) => ({
    label: DEX[id].name, sub: DEX[id].types.join('/'),
    fn: () => {
      closeMenu();
      const m = mkMon(id, 5);
      G.party.push(m);
      catchMon(id);
      G.flags.gotStarter = 1;
      G.flags.starter = id;
      G.bag.bloomorb = (G.bag.bloomorb || 0) + 5;
      G.bag.salve = (G.bag.salve || 0) + 3;
      G.mode = 'world';
      say('Elder Rowan', [
        `${DEX[id].name}. Of course.`,
        'Five orbs, three salves, and a deck. Ten cards — half of them nothing special.',
        'Your kin brings its own moves to the fight. The deck is what you bring.',
        'Each turn you get three energy and five cards. Spend it however you like, then end the turn and take what comes.',
        'Vane keeps the chest shop and takes gems, not shards. Win fights, buy chests, thicken the deck.',
      ], () => { saveGame(); });
    },
  })), { title: 'Choose your kin', cancel: () => { closeMenu(); G.mode = 'world'; } });
}

// ---- battle UI ---------------------------------------------------------
function hpColor(f) { return f > .5 ? 'var(--hp-good)' : f > .22 ? 'var(--hp-warn)' : 'var(--hp-bad)'; }
function renderHUD() {
  if (HEADLESS) return;
  const b = B();
  if (!b) { show(els.hudFoe, false); show(els.hudMine, false); return; }
  const box = (m, disp, mine) => {
    const f = clamp(disp / m.max, 0, 1);
    const xpNeed = Math.max(1, xpFor(m.lvl + 1) - xpFor(m.lvl));
    return `<div class="nm"><span>${dispName(m)}${m.status ? `<span class="st">${STATUS[m.status].tag}</span>` : ''}</span><span class="lv">Lv${m.lvl}</span></div>
      <div class="types">${typeChips(m.types)}</div>
      <div class="bar"><i style="width:${f * 100}%;background:${hpColor(f)}"></i></div>
      ${mine ? `<div class="bar xp"><i style="width:${clamp((m.xp - xpFor(m.lvl)) / xpNeed, 0, 1) * 100}%"></i></div>
      <div class="hpnum">${Math.round(disp)}/${m.max}</div>` : ''}`;
  };
  els.hudFoe.innerHTML = box(b.foe, b.dispF, false);
  els.hudMine.innerHTML = box(b.mine, b.dispM, true);
  show(els.hudFoe, true); show(els.hudMine, true);
}

/* ---- the hand ---------------------------------------------------------- */
/** The two touch buttons say what they do right now, not "A" and "B". */
function touchLabels() {
  if (HEADLESS || !els.btnA) return;
  const m = G.mode;
  const [a, b] = m === 'battle' ? ['Play', 'Menu']
    : m === 'dialogue' ? ['Next', 'Next']
    : (m === 'menu' || m === 'screen') ? ['Pick', 'Back']
    : ['Talk', 'Menu'];
  els.btnA.textContent = a;
  els.btnB.textContent = b;
}

function battleBar(on) {
  if (HEADLESS) return;
  show(els.battlebar, on);
  show(els.intent, on);
}

function renderHand() {
  if (HEADLESS) return;
  const b = B();
  if (!b) { battleBar(false); return; }
  const playable = b.phase === 'player' && !b.over && !b.log;
  els.energy.innerHTML = `<b>${b.energy}</b><small>/${BASE_ENERGY + (b.powers.energy || 0)}</small>`;
  els.piles.innerHTML = `draw ${b.draw.length} · used ${b.disc.length}` +
    (b.exh.length ? ` · spent ${b.exh.length}` : '') +
    (b.shield ? ` · <span id="shieldpip">shield ${b.shield}</span>` : '');
  els.hand.innerHTML = b.hand.map((c, i) => {
    const kin = c.src === 'kin';
    const cost = cardCost(c);
    const owned = kin ? null : ownedCard(c.u);
    const inst = kin ? null : { id: c.id, plus: owned ? owned.plus : 0, bg: c.bg || 0 };
    const txt = kin ? moveCardText(c.id) : cardText(inst);
    const grown = !kin && (owned && owned.plus ? `+${owned.plus}` : '') || '';
    const affordable = cost <= b.energy && playable;
    return `<div class="cardel ${kin ? 'kin' : ''} ${i === b.sel ? 'sel' : ''} ${affordable ? '' : 'dead'}" data-c="${i}">
      <div class="cr" style="background:${kin ? 'var(--gold)' : RARITY[CARDS[c.id].r]}"></div>
      <div class="cc">${cost}</div>
      <div class="ck">${i + 1}</div>
      <div class="cn">${cardName(c)}</div>
      <div class="ct">${txt}</div>
      ${grown ? `<div class="cg">${grown}</div>` : ''}
      ${i === b.sel && affordable ? '<div class="cp">▲ play</div>' : ''}
    </div>`;
  }).join('');
  // When there is nothing left you can pay for, the End turn button says so.
  const canPlay = b.hand.some((c) => cardCost(c) <= b.energy) && playable;
  els.acts.innerHTML = [
    ['end', `End turn <span class="key">E</span>`, !canPlay && playable],
    ['kin', 'Kin', false], ['bag', 'Bag', false],
    [b.wild ? 'run' : 'forfeit', b.wild ? 'Run' : 'Forfeit', false],
  ].map(([a, label, nag]) => `<div class="abtn ${nag ? 'nag' : ''}" data-a="${a}">${label}</div>`).join('');
  const it = b.intent;
  els.intent.innerHTML = it
    ? `Foe: <b>${it.name}</b>${it.kind === 'attack' ? ` · about ${it.dmg}` : ''}`
    : '';
  // The hand is too small to hold a card's whole rules text, so the line above
  // it spells out whichever card you are aiming at whenever it is otherwise idle.
  const aimed = b.hand[b.sel];
  if (aimed && playable && !(b.lineT > 0) && !b.log) {
    const kin = aimed.src === 'kin';
    const own = kin ? null : ownedCard(aimed.u);
    const full = kin ? moveCardText(aimed.id)
      : cardText({ id: aimed.id, plus: own ? own.plus : 0, bg: aimed.bg || 0 });
    els.dialogue.innerHTML = `<b style="color:${kin ? 'var(--gold)' : RARITY[CARDS[aimed.id].r]}">${cardName(aimed)}</b> — ${full}`;
    els.dialogue.classList.add('narrow');
    show(els.dialogue, true);
  }
  battleBar(true);
}

/** Kin move cards show what the move does, in the same voice as the deck. */
function moveCardText(id) {
  const m = MOVES[id];
  const bits = [];
  if (m.pow) bits.push(`${m.type} · power ${m.pow}`);
  else bits.push(`${m.type} · status`);
  const fx = m.fx || {};
  if (fx.st) bits.push(`may ${fx.st[0]}`);
  if (fx.heal) bits.push('heals');
  if (fx.drain) bits.push('drains');
  if (fx.self) bits.push('buffs you');
  if (fx.foe) bits.push('weakens them');
  if (fx.pri) bits.push('strikes first');
  return bits.join(', ');
}

/**
 * Show what just happened.
 *
 * A card you played resolves under your own hand, so it lands instantly: the
 * effects fire, the bars start moving, one line of text explains it, and you
 * keep your turn. Anything you are on the receiving end of — the foe's swing,
 * a faint, a level-up — plays back a line at a time, because that is the part
 * worth watching.
 */
function submitLog(log, opts = {}) {
  const b = B();
  b.armed = null;                       // a new hand is never pre-aimed
  if (opts.instant && log && log.length && !b.over) {
    for (const e of log) {
      if (e.fx === 'hit') { if (e.side === 'mine') b.flashM = .8; else b.flashF = .8; b.shake = 1; playCue('hit'); }
      else if (e.fx === 'grow' || e.fx === 'buff') playCue('level');
      else if (e.fx === 'heal' || e.fx === 'block') playCue('heal');
    }
    const last = log[log.length - 1];
    b.tgtM = last.hpM; b.tgtF = last.hpF;
    b.log = null; b.li = 0; b.started = false;
    battleLine(last.t);
    renderHand();
    return;
  }
  b.log = log && log.length ? log : null;
  b.li = 0; b.started = false; b.hold = 0;
  renderHand();
}

/** One line of battle text that fades on its own. */
function battleLine(text) {
  const b = B();
  b.lineT = 1.6;
  if (HEADLESS) return;
  els.dialogue.innerHTML = text;
  els.dialogue.classList.add('narrow');
  show(els.dialogue, true);
}

function playSelected() {
  const b = B();
  if (b.phase !== 'player' || b.over || b.log) return;
  const i = clamp(b.sel || 0, 0, Math.max(0, b.hand.length - 1));
  const card = b.hand[i];
  if (!card) return;
  if (cardCost(card) > b.energy) { setToast('Not enough energy.'); return; }
  playCue('select');
  const log = playCard(i);
  b.sel = clamp(i, 0, Math.max(0, b.hand.length - 1));
  aimPlayable(b);
  submitLog(log, { instant: true });
}

function doEndTurn() {
  const b = B();
  if (b.phase !== 'player' || b.over || b.log) return;
  submitLog(endTurn());
}

function openActionMenu(kind) {
  const b = B();
  if (kind === 'kin') { openScreen('party'); return; }
  if (kind === 'bag') { openScreen('bag'); return; }
  submitLog(doAction({ kind: 'run' }));
}

function playbackStep() {
  const b = B();
  const e = b.log[b.li];
  if (!e) return;
  b.tgtM = e.hpM; b.tgtF = e.hpF;
  if (e.fx === 'hit') { if (e.side === 'mine') b.flashM = .8; else b.flashF = .8; b.shake = 1; playCue('hit'); }
  if (e.fx === 'faint') playCue('faint');
  if (e.fx === 'level' || e.fx === 'learn') playCue('level');
  if (e.fx === 'caught') playCue('catch');
  if (e.fx === 'throw') { b.throwT = .6; playCue('throw'); }
  if (e.fx === 'send') b.entry = 0;
  if (!HEADLESS) {
    els.dialogue.innerHTML = e.t + '<span class="more">▼</span>';
    els.dialogue.classList.add('narrow');
    show(els.dialogue, true);
  }
  b.hold = e.fx === 'hit' || e.fx === 'faint' ? .55 : .38;
}

function finishBattle() {
  const b = B();
  const over = b.over;
  if (over === 'switch') {
    say('', [`${dispName(b.mine)} is done. Send out who?`], () => openScreen('party', { force: true }));
    return;
  }
  const done = () => {
    clearMods(b);
    G.battle = null; G.battleMsg = null;
    if (!HEADLESS) { show(els.hudFoe, false); show(els.hudMine, false); show(els.dialogue, false); battleBar(false); }
    G.mode = 'world';
    playCue('world');
    const evo = checkEvolve();
    if (evo) { runEvolution(evo); return; }
    saveGame();
  };
  if (over === 'win') {
    const gems = gemReward(b);
    G.gems += gems;
    if (!b.npc) { setToast(`+${gems} gems`); done(); return; }
    const lines = [`You pocket ${gems} rare gems.`];
    if (b.npc) {
      lines.push(...(b.npc.trainer.lose || []));
      G.flags[b.npc.id] = 1;
      G.money += b.npc.trainer.prize;
      lines.push(`You collected ${b.npc.trainer.prize} shards.`);
      if (b.npc.block) { b.npc.gone = true; lines.push(`${b.npc.name} steps off the path.`); }
    }
    G.wins++;
    say('', lines.length ? lines : ['You won.'], done);
  } else if (over === 'caught') {
    const where = addCaught(b.foe);
    const lines = [`${b.foe.name} was added to your ${where === 'party' ? 'party' : 'box'}.`];
    if (b.legendary) { G.flags.beatVespyr = 1; lines.push('The light goes out of the hollow. It went with you.'); }
    say('', lines, done);
  } else if (over === 'fled') {
    say('', ['You got away.'], done);
  } else if (over === 'lose') {
    say('', ['Everything you have is down.', 'You carry them back to the Wayhouse on instinct.'], () => {
      const lost = Math.floor(G.money * .25);
      G.money -= lost;
      healParty();
      clearMods(b);
      G.battle = null; G.battleMsg = null;
      if (!HEADLESS) { show(els.hudFoe, false); show(els.hudMine, false); battleBar(false); }
      enterMap('wayhouse', 5, 5, 'down');
      G.mode = 'world';
      playCue('world');
      const after = [`Sable patched them up. It cost you ${lost} shards.`, 'Go easier out there.'];
      // Say it out loud, so nobody stands in front of a trainer wondering
      // whether the game has stopped letting them through.
      if (b.npc) after.push(`${b.npc.name} will not stop you again. Go and ask for the rematch when you want it.`);
      say('Sable', after, () => saveGame());
    });
  } else {
    done();
  }
}

function runEvolution(m) {
  const from = m.species;
  G.evoAnim = { from, to: DEX[from].evo[0], t: 0, swapped: false };
  say('', [`${dispName(m)} is changing shape!`], () => {
    const r = evolveMon(m);
    G.evoAnim.swapped = true; G.evoAnim.t = 0;
    playCue('level');
    say('', [`${r.oldName} became ${r.newName}!`], () => {
      G.evoAnim = null;
      const next = checkEvolve();
      if (next) runEvolution(next);
      else saveGame();
    });
  });
}

function updateBattle(dt) {
  const b = B();
  b.entry = Math.min(1, b.entry + dt * 3);
  b.flashM = Math.max(0, b.flashM - dt * 3);
  b.flashF = Math.max(0, b.flashF - dt * 3);
  b.shake = Math.max(0, b.shake - dt * 4);
  if (b.throwT > 0) b.throwT = Math.max(0, b.throwT - dt);
  // HP bars chase their target so damage reads as motion, not a jump.
  const chase = (cur, tgt) => Math.abs(tgt - cur) < .6 ? tgt : cur + (tgt - cur) * Math.min(1, dt * 7);
  b.dispM = chase(b.dispM, b.tgtM); b.dispF = chase(b.dispF, b.tgtF);
  renderHUD();
  if (b.lineT > 0 && !b.log) {
    b.lineT -= dt;
    // When the message fades, the line goes back to explaining the aimed card.
    if (b.lineT <= 0) renderHand();
  }

  if (G.battleMsg) {
    G.battleMsg.hold = Math.max(0, G.battleMsg.hold - dt);
    if (justPressed('a') || justPressed('b')) advanceDialogue();
    return;
  }
  if (G.menu) { menuInput(); return; }
  if (G.screen) { screenInput(); return; }

  // ---- playing back what just happened
  if (b.log && b.li < b.log.length) {
    b.hold = Math.max(0, (b.hold || 0) - dt);
    const settled = Math.abs(b.dispM - b.tgtM) < 1 && Math.abs(b.dispF - b.tgtF) < 1;
    if (b.li === 0 && !b.started) { b.started = true; playbackStep(); return; }
    if ((justPressed('a') || b.hold <= 0) && settled) {
      b.li++;
      if (b.li < b.log.length) playbackStep();
      else if (!HEADLESS) show(els.dialogue, false);
    }
    return;
  }
  if (b.log) { b.log = null; b.started = false; renderHand(); }

  if (b.over) { if (!b.finishing) { b.finishing = true; finishBattle(); } return; }
  if (G.dialogue) return;

  // ---- the player's turn: pick a card, play it, or end the turn
  //
  // Left/right walks the hand, up or A plays the card you are on — pushing it
  // forward, the way you would with a real one. 1-5 plays a card outright.
  // E ends the turn and X opens everything that is not a card. Nothing here
  // needs remembering: the buttons under the hand say the same thing.
  if (b.hand.length) b.sel = clamp(b.sel || 0, 0, b.hand.length - 1);
  let moved = false;
  if (justPressed('left')) { b.sel = (b.sel + b.hand.length - 1) % Math.max(1, b.hand.length); moved = true; }
  if (justPressed('right')) { b.sel = (b.sel + 1) % Math.max(1, b.hand.length); moved = true; }
  for (let n = 1; n <= 9; n++) {
    if (justPressed(String(n)) && b.hand[n - 1]) { b.sel = n - 1; playSelected(); return; }
  }
  if (justPressed('a') || justPressed('up')) { playSelected(); return; }
  if (justPressed('e') || justPressed('E')) { doEndTurn(); return; }
  if (justPressed('b')) { openBattleActions(); return; }
  if (moved) renderHand();
  else if (!b.barShown) { b.barShown = true; renderHand(); }
}

/** Up opens the non-card actions, so the whole fight is reachable by keyboard. */
function openBattleActions() {
  const b = B();
  openMenu('battlemenu', [
    { label: 'Kin', fn: () => { closeMenu(); openScreen('party'); } },
    { label: 'Bag', fn: () => { closeMenu(); openScreen('bag'); } },
    { label: b.wild ? 'Run' : 'Forfeit', fn: () => { closeMenu(); submitLog(doAction({ kind: 'run' })); } },
    { label: 'End turn', fn: () => { closeMenu(); doEndTurn(); } },
    { label: 'Back', fn: () => { closeMenu(); renderHand(); } },
  ], { cancel: () => { closeMenu(); renderHand(); }, title: 'Actions' });
}

// ---- full screens ------------------------------------------------------
function openScreen(kind, opt = {}) {
  closeMenu();
  // When you must send someone out, start the cursor on someone who can go.
  const i = opt.force && kind === 'party' ? Math.max(0, G.party.findIndex(alive)) : 0;
  G.screen = { kind, i, sel: null, opt, prev: G.mode };
  G.mode = 'screen';
  renderScreen();
}
function closeScreen() {
  const s = G.screen;
  if (!s) return;
  if (s.opt.force && s.kind === 'party') return;         // must pick a replacement
  G.screen = null;
  if (!HEADLESS) show(els.screen, false);
  if (G.battle) { G.mode = 'battle'; if (!G.battle.over) renderHand(); }
  else { G.mode = 'world'; }
}

/**
 * What a screen is listing. Built here rather than as a side effect of
 * rendering, so navigation and selection agree with the view even when there
 * is no view — the headless suites drive exactly these paths.
 */
function screenList(s) {
  if (!s) return [];
  if (s.kind === 'bag') return Object.keys(G.bag).filter((k) => G.bag[k] > 0);
  if (s.kind === 'shop') return Object.keys(ITEMS);
  if (s.kind === 'chests') return CHEST_IDS;
  if (s.kind === 'deck') {
    const inDeck = G.deck.map(ownedCard).filter(Boolean);
    return inDeck.concat(G.cards.filter((c) => !G.deck.includes(c.u)));
  }
  if (s.kind === 'party') return G.party;
  if (s.kind === 'box') return G.party.concat(G.box);
  if (s.kind === 'dex') return DEX_ORDER;
  return [];
}

const typeChips = (types) => types.map((t) => `<span class="tp" style="background:${TYPES[t]}">${t}</span>`).join('');

/** Where a species can be found — read straight off the encounter tables. */
function habitat(id) {
  const where = [];
  for (const [mapId, map] of Object.entries(MAPS)) {
    const row = ((map.enc && map.enc.table) || []).find((e) => e[0] === id);
    if (row) where.push(`${map.name} (Lv${row[1]}–${row[2]})`);
  }
  if (where.length) return 'Found in ' + where.join(' · ');
  const from = DEX_ORDER.find((p) => DEX[p].evo && DEX[p].evo[0] === id);
  if (from) return `Evolves from ${DEX[from].name} at level ${DEX[from].evo[1]}.`;
  if (STARTERS.includes(id)) return 'A kin Elder Rowan hands out.';
  return 'Not found in the wild. Not anywhere, really.';
}

function renderScreen() {
  if (!G.screen) return;
  G.screen.list = screenList(G.screen);
  if (HEADLESS) return;
  const s = G.screen, el = els.screen;
  let html = '<div class="back">X — back</div>';
  if (s.kind === 'party') {
    html += `<h2>Your kin</h2><div class="cards">` + G.party.map((m, i) => {
      const f = m.hp / m.max;
      return `<div class="card panel ${i === s.i ? 'sel' : ''}" data-i="${i}">
        <canvas width="40" height="40" data-mon="${m.species}"></canvas>
        <div class="info"><b>${dispName(m)}</b><small>Lv${m.lvl} · ${m.types.join('/')}${m.status ? ' · ' + STATUS[m.status].tag : ''}</small>
        <div class="bar"><i style="width:${f * 100}%;background:${hpColor(f)}"></i></div>
        <small>${m.hp}/${m.max} HP</small></div></div>`;
    }).join('') + '</div>';
    if (G.party[s.i]) {
      const m = G.party[s.i];
      html += `<h2 style="margin-top:12px">${dispName(m)}</h2><div class="cards">` + m.moves.map((slot) => {
        const mv = MOVES[slot.id];
        return `<div class="card panel"><div class="info"><b style="color:${TYPES[mv.type]}">${mv.name}</b>
          <small>${mv.type} · ${mv.pow ? 'PWR ' + mv.pow : 'status'} · costs ${moveCost(slot.id)}</small></div></div>`;
      }).join('') + '</div>';
      html += `<p style="font-size:12px;color:var(--dim)">ATK ${m.atk} · GUARD ${m.def} · SPD ${m.spd} · EXP ${m.xp - xpFor(m.lvl)}/${xpFor(m.lvl + 1) - xpFor(m.lvl)}</p>`;
    }
    if (s.opt.force) html += '<p style="color:var(--gold);font-size:13px">Choose who steps up.</p>';
  } else if (s.kind === 'dex') {
    html += `<h2>Dex — ${dexCount(2)} caught / ${dexCount(1)} seen / ${DEX_ORDER.length}</h2><div class="dexgrid">` +
      DEX_ORDER.map((id, i) => {
        const st = G.dex[id] || 0;
        return `<div class="dexcell panel ${st ? '' : 'unseen'} ${i === s.i ? 'sel' : ''}" data-i="${i}">
          <canvas width="40" height="40" data-mon="${id}" data-sil="${st ? '' : '1'}"></canvas>
          <b>${st ? DEX[id].name : '???'}</b>
          ${st ? `<div class="types">${typeChips(DEX[id].types)}</div>` : '<small>not seen</small>'}</div>`;
      }).join('') + '</div>';
    const id = DEX_ORDER[s.i];
    if ((G.dex[id] || 0) > 0) {
      html += `<p style="font-size:.82em;max-width:520px">${DEX[id].dex}</p>`;
      html += `<p style="font-size:.75em;color:var(--dim)">${habitat(id)}</p>`;
    }
  } else if (s.kind === 'box') {
    // Party and box are one list, so a swap is just two indices.
    const monCard = (m, i) => {
      const f = m.hp / m.max;
      return `<div class="card panel ${i === s.i ? 'sel' : ''}" data-i="${i}" ${i === s.pick ? 'style="box-shadow:0 0 0 2px var(--xp)"' : ''}>
        <canvas width="40" height="40" data-mon="${m.species}"></canvas>
        <div class="info"><b>${dispName(m)}</b><small>Lv${m.lvl} · ${m.types.join('/')}</small>
        <div class="bar"><i style="width:${f * 100}%;background:${hpColor(f)}"></i></div></div></div>`;
    };
    html += `<h2>Party — ${G.party.length}/6</h2><div class="cards">` + G.party.map((m, i) => monCard(m, i)).join('') + '</div>';
    html += `<h2 style="margin-top:12px">Box — ${G.box.length}</h2>`;
    html += G.box.length ? `<div class="cards">` + G.box.map((m, i) => monCard(m, G.party.length + i)).join('') + '</div>'
      : '<p style="color:var(--dim)">Nothing stored yet.</p>';
    html += `<p style="font-size:12px;color:var(--dim)">A on a boxed kin withdraws it · A on a party kin stores it · with a full party, pick the newcomer then pick who it replaces.</p>`;
  } else if (s.kind === 'deck') {
    // Owned cards, deck first. Selecting one moves it in or out.
    const inDeck = G.deck.map(ownedCard).filter(Boolean);
    const rest = G.cards.filter((c) => !G.deck.includes(c.u));
    const cardTile = (c, i, on) => {
      const def = CARDS[c.id];
      return `<div class="card panel ${i === s.i ? 'sel' : ''}" data-i="${i}"
        style="border-color:${RARITY[def.r]}${on ? '' : ';opacity:.55'}">
        <div class="info"><b style="color:${RARITY[def.r]}">${def.name}${c.plus ? ` +${c.plus}` : ''}</b>
        <small>${def.r} · ${def.cost} energy · ${cardText(c)}</small>
        <small style="color:var(--dim)">played ${c.plays || 0}${c.kills ? ` · ${c.kills} kills` : ''}${
          (def.grow || def.kill) ? ` · grows to +${growCap(c.id)}` : ''}</small></div></div>`;
    };
    html += `<h2>Deck — ${inDeck.length}/${DECK_MAX} (min ${DECK_MIN})</h2>`;
    html += `<div class="cards">` + inDeck.map((c, i) => cardTile(c, i, true)).join('') + '</div>';
    html += `<h2 style="margin-top:12px">Collection — ${rest.length} spare</h2>`;
    html += rest.length ? `<div class="cards">` + rest.map((c, i) => cardTile(c, inDeck.length + i, false)).join('') + '</div>'
      : '<p style="color:var(--dim)">Everything you own is in the deck.</p>';
  } else if (s.kind === 'chests') {
    html += `<h2>Gem chests — ${G.gems} gems</h2>`;
    html += `<div class="cards">` + CHEST_IDS.map((k, i) => {
      const ch = CHESTS[k];
      const odds = RARITY_ORDER.filter((r) => ch.odds[r])
        .map((r) => `<span style="color:${RARITY[r]}">${r} ${ch.odds[r]}%</span>`).join(' · ');
      const tint = { silver: '#c8ccd4', gold: '#ffc94d', diamond: '#7fe0f5', prism: '#c86bff' }[k];
      return `<div class="card panel ${i === s.i ? 'sel' : ''}" data-i="${i}"
        style="border-color:${tint}${G.gems < ch.cost ? ';opacity:.5' : ''}">
        <div class="chest" style="--tint:${tint}"></div>
        <div class="info"><b style="color:${tint}">${ch.name}</b><small>${ch.cost} gems · ${ch.pulls} cards</small>
        <small>${odds}</small></div></div>`;
    }).join('') + '</div>';
    if (s.got) {
      html += `<h2 style="margin-top:12px">You pulled</h2><div class="cards">` + s.got.map((c) => {
        const def = CARDS[c.id];
        return `<div class="card panel" style="border-color:${RARITY[def.r]}">
          <div class="info"><b style="color:${RARITY[def.r]}">${def.name}</b>
          <small>${def.r} · ${def.cost} energy · ${cardText(c)}</small></div></div>`;
      }).join('') + '</div>';
    }
  } else if (s.kind === 'bag') {
    const list = s.list;
    html += `<h2>Bag — ${G.money} shards</h2>`;
    html += list.length ? `<div class="cards">` + list.map((k, i) => `
      <div class="card panel ${i === s.i ? 'sel' : ''}" data-i="${i}">
        <div class="info"><b>${ITEMS[k].name} ×${G.bag[k]}</b><small>${ITEMS[k].desc}</small></div></div>`).join('') + '</div>'
      : '<p style="color:var(--dim)">Empty. Even the lint.</p>';
  } else if (s.kind === 'shop') {
    const list = s.list;
    html += `<h2>Supply — ${G.money} shards</h2><div class="cards">` + list.map((k, i) => `
      <div class="card panel ${i === s.i ? 'sel' : ''}" data-i="${i}">
        <div class="info"><b>${ITEMS[k].name}</b><small>${ITEMS[k].cost} shards · ${ITEMS[k].desc}</small></div></div>`).join('') + '</div>';
  }
  el.innerHTML = html;
  show(el, true);
  el.querySelectorAll('canvas[data-mon]').forEach((c) => paintTo(c, 'creature', c.dataset.mon, 1, !!c.dataset.sil));
}

function screenInput() {
  const s = G.screen;
  if (!s) return;
  s.list = screenList(s);
  const len = (s.list || []).length;
  if (s.kind === 'chests' && s.got && (justPressed('left') || justPressed('right') || justPressed('up') || justPressed('down'))) s.got = null;
  let moved = false;
  const cols = s.kind === 'dex' ? 5 : 2;
  if (justPressed('left')) { s.i = (s.i + len - 1) % Math.max(1, len); moved = true; }
  if (justPressed('right')) { s.i = (s.i + 1) % Math.max(1, len); moved = true; }
  if (justPressed('up')) { s.i = clamp(s.i - cols, 0, Math.max(0, len - 1)); moved = true; }
  if (justPressed('down')) { s.i = clamp(s.i + cols, 0, Math.max(0, len - 1)); moved = true; }
  if (moved) renderScreen();
  if (justPressed('a')) screenSelect();
  if (justPressed('b')) closeScreen();
}

/**
 * Withdraw, store, or swap. The party may never empty and never exceed six, so
 * a full party turns a withdrawal into a two-tap swap.
 */
function boxSelect(s) {
  const inParty = s.i < G.party.length;
  const boxIdx = s.i - G.party.length;
  if (s.pick != null) {
    const pickBox = s.pick - G.party.length;
    if (inParty && pickBox >= 0 && G.box[pickBox]) {
      const out = G.party[s.i];
      G.party[s.i] = G.box[pickBox];
      G.box[pickBox] = out;
      setToast(`${dispName(G.party[s.i])} steps in for ${dispName(out)}.`);
    } else setToast('Pick a party kin to swap out.');
    s.pick = null;
    renderScreen();
    return;
  }
  if (inParty) {
    if (G.party.length <= 1) { setToast('You cannot travel with nobody.'); return; }
    const m = G.party.splice(s.i, 1)[0];
    G.box.push(m);
    s.i = clamp(s.i, 0, G.party.length + G.box.length - 1);
    setToast(`${dispName(m)} rests in the box.`);
  } else {
    const m = G.box[boxIdx];
    if (!m) return;
    if (G.party.length < 6) {
      G.box.splice(boxIdx, 1);
      G.party.push(m);
      setToast(`${dispName(m)} joins you.`);
    } else {
      s.pick = s.i;
      setToast(`Now pick who ${dispName(m)} replaces.`);
    }
  }
  renderScreen();
}

function screenSelect() {
  const s = G.screen;
  if (!s) return;
  s.list = screenList(s);
  if (s.kind === 'party') {
    const m = G.party[s.i];
    if (!m) return;
    if (G.battle) {
      if (!alive(m)) { setToast(`${dispName(m)} cannot fight.`); return; }
      if (m === G.battle.mine && !s.opt.force) { setToast('Already out there.'); return; }
      if (s.opt.force) {
        G.battle.mine = m; m.stages = { atk: 0, def: 0, spd: 0 };
        G.battle.dispM = m.hp; G.battle.tgtM = m.hp;
        G.battle.over = null; G.battle.finishing = false; G.battle.entry = 0;
        swapKinCards(G.battle);
        startPlayerTurn([]);
        s.opt.force = false;
        G.screen = null; if (!HEADLESS) show(els.screen, false);
        G.mode = 'battle';
        battleSay([`Go, ${dispName(m)}!`], () => renderHand());
        return;
      }
      G.screen = null; if (!HEADLESS) show(els.screen, false);
      G.mode = 'battle';
      submitLog(doAction({ kind: 'switch', idx: s.i }));
      return;
    }
    setToast(`${dispName(m)} · Lv${m.lvl} · ${m.hp}/${m.max}`);
  } else if (s.kind === 'box') {
    boxSelect(s);
  } else if (s.kind === 'deck') {
    const c = (s.list || [])[s.i];
    if (!c) return;
    const at = G.deck.indexOf(c.u);
    if (at >= 0) {
      if (G.deck.length <= DECK_MIN) { setToast(`A deck needs at least ${DECK_MIN} cards.`); return; }
      G.deck.splice(at, 1);
      setToast(`${CARDS[c.id].name} set aside.`);
    } else {
      if (G.deck.length >= DECK_MAX) { setToast(`A deck holds at most ${DECK_MAX} cards.`); return; }
      G.deck.push(c.u);
      setToast(`${CARDS[c.id].name} shuffled in.`);
    }
    saveGame();
    renderScreen();
  } else if (s.kind === 'chests') {
    const kind = (s.list || [])[s.i];
    const ch = CHESTS[kind];
    if (!ch) return;
    if (G.gems < ch.cost) { setToast(`${ch.cost - G.gems} gems short.`); return; }
    s.got = openChest(kind);
    playCue('catch');
    saveGame();
    renderScreen();
  } else if (s.kind === 'bag') {
    const id = (s.list || [])[s.i];
    if (!id) return;
    if (G.battle) {
      G.screen = null; if (!HEADLESS) show(els.screen, false);
      G.mode = 'battle';
      submitLog(doAction({ kind: 'item', id }));
      return;
    }
    const it = ITEMS[id];
    if (it.kind === 'orb') { setToast('Save those for the wild.'); return; }
    if (it.kind === 'draw') { setToast('Save that for a battle.'); return; }
    const target = G.party.find((m) => it.kind === 'revive' ? m.hp <= 0 : m.hp < m.max) || G.party[0];
    if (!target) return;
    if (it.kind === 'heal' && target.hp >= target.max) { setToast('Nobody needs that.'); return; }
    if (it.kind === 'revive' && target.hp > 0) { setToast('Nobody is down.'); return; }
    G.bag[id]--; if (G.bag[id] <= 0) delete G.bag[id];
    if (it.kind === 'heal') target.hp = clamp(target.hp + it.amt, 0, target.max);
    if (it.kind === 'revive') target.hp = Math.floor(target.max / 2);
    setToast(`${dispName(target)} feels better.`);
    renderScreen();
  } else if (s.kind === 'shop') {
    const id = (s.list || [])[s.i];
    const it = ITEMS[id];
    if (!it) return;
    if (G.money < it.cost) { setToast('Not enough shards.'); return; }
    G.money -= it.cost;
    G.bag[id] = (G.bag[id] || 0) + 1;
    setToast(`Bought ${it.name}.`);
    renderScreen();
  } else if (s.kind === 'dex') {
    renderScreen();
  }
}
/* ============================================================ §8 — sound ==
   A tiny square-wave sequencer. Two looping themes and a handful of cues.
   Everything is guarded: no AudioContext, no sound, no crash.
   ======================================================================== */
let AC = null, muted = false, musicTimer = null, musicStep = 0, musicTrack = 'world';

// Each theme is a set of 16-step phrases (semitone offsets from A3, 0 = rest)
// plus an order to play them in, so a loop takes four bars to come round.
const THEMES = {
  world: {
    bpm: 108, order: [0, 0, 1, 2], bass: [0, 0, 7, 7, 5, 5, 7, 7],
    lead: [
      [12, 0, 7, 0, 9, 0, 12, 14, 16, 0, 14, 0, 12, 0, 9, 0],
      [16, 0, 14, 0, 12, 0, 9, 7, 9, 0, 12, 0, 14, 0, 16, 0],
      [19, 0, 17, 16, 14, 0, 12, 0, 9, 0, 12, 14, 16, 0, 12, 0],
    ],
  },
  battle: {
    bpm: 148, order: [0, 0, 1, 0, 2, 1], bass: [0, 0, 3, 3, 5, 5, 7, 7],
    lead: [
      [12, 12, 15, 12, 19, 17, 15, 12, 10, 10, 12, 15, 17, 15, 12, 10],
      [17, 17, 19, 17, 22, 19, 17, 15, 14, 14, 15, 17, 19, 17, 15, 12],
      [24, 0, 22, 19, 17, 0, 15, 12, 10, 0, 12, 15, 17, 19, 17, 15],
    ],
  },
  shrine: {                       // only the legendary gets to sound like this
    bpm: 84, order: [0, 1], bass: [0, 0, 5, 5, 8, 8, 3, 3],
    lead: [
      [24, 0, 0, 19, 0, 0, 16, 0, 21, 0, 0, 17, 0, 0, 12, 0],
      [26, 0, 0, 21, 0, 0, 17, 0, 24, 0, 19, 0, 16, 0, 12, 0],
    ],
  },
};

function audio() {
  if (HEADLESS || muted) return null;
  if (!AC) {
    const C = window.AudioContext || window.webkitAudioContext;
    if (!C) return null;
    try { AC = new C(); } catch (e) { return null; }
  }
  if (AC.state === 'suspended') AC.resume().catch(() => {});
  return AC;
}

function blip(freq, dur, type, gain, when) {
  const ac = audio();
  if (!ac) return;
  const t = when || ac.currentTime;
  const o = ac.createOscillator(), g = ac.createGain();
  o.type = type || 'square';
  o.frequency.setValueAtTime(freq, t);
  g.gain.setValueAtTime(0, t);
  g.gain.linearRampToValueAtTime(gain || .06, t + .01);
  g.gain.exponentialRampToValueAtTime(.0001, t + dur);
  o.connect(g); g.connect(ac.destination);
  o.start(t); o.stop(t + dur + .02);
}

const note = (semi) => 220 * Math.pow(2, semi / 12);

function musicTick() {
  const th = THEMES[musicTrack];
  if (!th) return;
  const bar = Math.floor(musicStep / 16);
  const phrase = th.lead[th.order[bar % th.order.length]] || th.lead[0];
  const n = phrase[musicStep % 16];
  if (n) blip(note(n), .16, 'square', .045);
  const b = th.bass[musicStep % th.bass.length];
  if (musicStep % 2 === 0) blip(note(b - 24), .22, 'triangle', .05);
  musicStep++;
}

function startMusic(track) {
  if (HEADLESS) return;
  musicTrack = track;
  if (musicTimer) clearInterval(musicTimer);
  const th = THEMES[track];
  if (!th) return;
  musicStep = 0;
  musicTimer = setInterval(musicTick, 30000 / th.bpm);
}
function stopMusic() { if (musicTimer) { clearInterval(musicTimer); musicTimer = null; } }

function playCue(kind) {
  if (HEADLESS) return;
  const ac = audio();
  if (kind === 'battle' || kind === 'shrine' || kind === 'world') { startMusic(kind); return; }
  if (!ac) return;
  const t = ac.currentTime;
  if (kind === 'hit') blip(150, .09, 'sawtooth', .07);
  else if (kind === 'faint') { blip(220, .3, 'square', .05); blip(110, .45, 'square', .05, t + .12); }
  else if (kind === 'level') { [0, 4, 7, 12].forEach((s, i) => blip(note(12 + s), .16, 'square', .05, t + i * .07)); }
  else if (kind === 'catch') { [0, 5, 9, 14].forEach((s, i) => blip(note(12 + s), .2, 'triangle', .06, t + i * .1)); }
  else if (kind === 'throw') blip(500, .12, 'sine', .05);
  else if (kind === 'heal') { [0, 7, 12].forEach((s, i) => blip(note(12 + s), .2, 'sine', .05, t + i * .09)); }
  else if (kind === 'select') blip(660, .05, 'square', .04);
}

function toggleMute() {
  muted = !muted;
  if (muted) stopMusic(); else startMusic(musicTrack);
  setToast(muted ? 'Sound off' : 'Sound on');
}
/* ============================================================= §9 — boot ==
   Canvas scaling, input wiring, the frame loop, and the headless export the
   test suite drives.
   ======================================================================== */
let ctx = null;

/**
 * Work out how big the stage should be and where the touch controls go.
 *
 * Pure, so the sizes can be checked without a browser. Three shapes:
 *   side    — landscape: fill the height, stick and buttons take the gutters
 *   below   — portrait: fill the width, controls take the band underneath
 *   overlay — neither margin is big enough, so they sit on the game corners
 * A mouse gets none of that: integer scaling, centred, no controls at all.
 */
function layoutFor(vw, vh, touch) {
  const pad = 8;
  if (!touch) {
    const raw = Math.min((vw - pad) / VIEW_W, (vh - pad) / VIEW_H);
    // Integer scaling keeps pixels square when there is room for it.
    return { mode: 'none', scale: raw >= 2 ? Math.floor(raw) : Math.max(1, raw), gutter: 0 };
  }
  if (vw > vh) {
    // Landscape: the game is as tall as the screen, the gutters do the rest.
    const scale = Math.max(1, (vh - pad) / VIEW_H);
    const gutter = Math.floor((vw - VIEW_W * scale) / 2);
    return gutter >= 96
      ? { mode: 'side', scale, gutter }
      : { mode: 'overlay', scale: Math.max(1, (vh - pad) / VIEW_H), gutter: 0 };
  }
  // Portrait: fill the width, and use whatever is left underneath.
  const scale = Math.max(1, (vw - pad) / VIEW_W);
  const below = vh - VIEW_H * scale;
  return below >= 190
    ? { mode: 'below', scale, gutter: 0, below }
    : { mode: 'overlay', scale, gutter: 0, below };
}

function fitStage() {
  if (HEADLESS) return;
  const touch = document.body.classList.contains('touch');
  const L = layoutFor(window.innerWidth, window.innerHeight, touch);
  const st = document.getElementById('stage');
  const w = VIEW_W * L.scale, h = VIEW_H * L.scale;
  els.view.style.width = w + 'px';
  els.view.style.height = h + 'px';
  st.style.width = w + 'px';
  st.style.height = h + 'px';
  // Panel text is em-based, so one number scales the whole UI with the stage.
  st.style.fontSize = clamp(L.scale * 4.1, 11, 21) + 'px';

  document.body.classList.remove('ctl-side', 'ctl-below', 'ctl-overlay');
  if (L.mode !== 'none') document.body.classList.add('ctl-' + L.mode);
  document.body.style.setProperty('--gutter', L.gutter + 'px');
  // In portrait the stage sits at the top so the band underneath is all ours.
  document.body.classList.toggle('topalign', L.mode === 'below');
  const top = L.mode === 'below' ? Math.round(window.innerHeight * .04) : 0;
  document.body.style.setProperty('--stagebot', (top + h) + 'px');
  G.layout = L;
}

function draw() {
  if (!ctx) return;
  ctx.imageSmoothingEnabled = false;
  ctx.clearRect(0, 0, VIEW_W, VIEW_H);
  if (G.mode === 'title') return;
  if (G.evoAnim) drawEvolution(ctx);
  else if (G.battle) drawBattle(ctx);
  else if (G.map) drawWorld(ctx);
  if (G.fade > 0) {
    ctx.fillStyle = `rgba(8,5,12,${clamp(G.fade * 2.4, 0, 1)})`;
    ctx.fillRect(0, 0, VIEW_W, VIEW_H);
  }
  if (G.wipe > 0) {
    // Bars slide in from alternating sides, meet, then retract on the battle.
    const k = 1 - G.wipe / WIPE_T;
    const cover = clamp(k < .5 ? k * 2 : (1 - k) * 2, 0, 1);
    const bars = 8, bh = VIEW_H / bars;
    ctx.fillStyle = '#0a070e';
    for (let i = 0; i < bars; i++) {
      const w = VIEW_W * cover;
      ctx.fillRect(i % 2 ? VIEW_W - w : 0, i * bh, w, bh + 1);
    }
  }
}

/** The evolution payoff: spokes of light, a shimmer, then the new shape. */
function drawEvolution(g) {
  const a = G.evoAnim, t = a.t;
  g.fillStyle = '#120b1a';
  g.fillRect(0, 0, VIEW_W, VIEW_H);
  g.save();
  g.translate(VIEW_W / 2, 92);
  g.rotate((a.swapped ? -t : t) * .6);          // the whole wheel spins…
  g.globalAlpha = .16;
  g.fillStyle = '#ffc94d';
  for (let i = 0; i < 12; i++) {
    g.rotate(Math.PI / 6);                      // …spokes stay 30° apart
    g.beginPath(); g.moveTo(0, 0); g.lineTo(-10, -220); g.lineTo(10, -220); g.closePath(); g.fill();
  }
  g.restore();

  const id = a.swapped ? a.to : a.from;
  const s = 3;
  const bottom = artBottom(id) * s;
  // Before the change it shivers and glows; after, it lands and the glow fades.
  const flash = a.swapped ? Math.max(0, 1 - t * 1.4)
    : Math.min(.85, t * .25 + (Math.sin(t * 16) * .5 + .5) * .4);
  const jitter = a.swapped ? 0 : Math.round(Math.sin(t * 30) * 1.5);
  drawSpr(g, 'creature', id, VIEW_W / 2 - 20 * s + jitter, 128 - bottom, s, { flash });

  if (a.swapped && t < .45) {
    g.fillStyle = `rgba(255,255,255,${(1 - t / .45) * .85})`;
    g.fillRect(0, 0, VIEW_W, VIEW_H);
  }
}

function frame(now) {
  const dt = Math.min(.05, (now - (frame.last || now)) / 1000);
  frame.last = now;
  step(dt);
  draw();
  fired.clear();
  if (!HEADLESS) requestAnimationFrame(frame);
}

/** One tick of simulation. Split out so tests can drive it deterministically. */
function step(dt) {
  G.t += dt; G.dt = dt; G.playtime += dt;
  if (G.fade > 0) G.fade = Math.max(0, G.fade - dt);
  if (G.wipe > 0) G.wipe = Math.max(0, G.wipe - dt);
  if (G.evoAnim) G.evoAnim.t += dt;
  if (G.toastT > 0) {
    G.toastT -= dt;
    if (G.toastT <= 0 && !HEADLESS) els.toast.classList.remove('on');
  }
  if (justPressed('m')) toggleMute();
  if (G.mode !== G.uiMode) { G.uiMode = G.mode; touchLabels(); }

  if (G.mode === 'dialogue') {
    if (G.dialogue) G.dialogue.hold = Math.max(0, G.dialogue.hold - dt);
    if (justPressed('a') || justPressed('b')) advanceDialogue();
    return;
  }
  if (G.mode === 'menu') { menuInput(); return; }
  if (G.mode === 'screen') { screenInput(); return; }
  if (G.mode === 'battle') { updateBattle(dt); return; }
  if (G.mode === 'world') { updateWorld(dt); return; }
}

function newGame() {
  G.party = []; G.box = []; G.bag = {}; G.money = 500; G.gems = 0; G.dex = {}; G.flags = {};
  G.cards = []; G.deck = []; G.nextUid = 0; G.chestsOpened = 0;
  STARTER_DECK.forEach(grantCard);
  G.steps = 0; G.playtime = 0; G.wins = 0; G.caught = 0; G.battle = null;
  enterMap('lab', 5, 5, 'up');
  G.mode = 'world';
  updateCam();
  say('Elder Rowan', ['…and there you are. Come in, shut the door, the kin get out.'], () => {});
}

function boot() {
  if (HEADLESS) return;
  cacheEls();
  ctx = els.view.getContext('2d');
  fitStage();
  window.addEventListener('resize', fitStage);

  // keyboard
  window.addEventListener('keydown', (e) => {
    const k = KEYMAP[e.key] || e.key;
    if (KEYMAP[e.key] || e.key === 'm') e.preventDefault();
    pressKey(k);
  });
  window.addEventListener('keyup', (e) => releaseKey(KEYMAP[e.key] || e.key));

  // touch
  // ---- the stick: it appears under your thumb, wherever that lands
  const stick = { id: null, cx: 0, cy: 0, dir: null };
  const stickEl = document.getElementById('stick');
  const knobEl = document.getElementById('knob');
  const padEl = document.getElementById('pad');

  const setStickDir = (dir) => {
    for (const d of ['up', 'down', 'left', 'right']) if (d !== dir) releaseKey(d);
    if (dir) pressKey(dir);
    stick.dir = dir;
  };
  const stickPlace = (x, y) => {
    const r = padEl.getBoundingClientRect();
    stickEl.style.left = (x - r.left) + 'px';
    stickEl.style.top = (y - r.top) + 'px';
  };
  const stickDrag = (x, y) => {
    const dx = x - stick.cx, dy = y - stick.cy;
    const d = Math.hypot(dx, dy), R = 42;
    const k = d > R ? R / d : 1;
    knobEl.style.transform = `translate(${dx * k}px, ${dy * k}px)`;
    setStickDir(stickDir(dx, dy));
  };
  const stickEnd = () => {
    stick.id = null;
    setStickDir(null);
    stickEl.classList.remove('on');
    knobEl.style.transform = '';
  };

  padEl.addEventListener('touchstart', (e) => {
    e.preventDefault();
    const t = e.changedTouches[0];
    stick.id = t.identifier; stick.cx = t.clientX; stick.cy = t.clientY;
    stickPlace(t.clientX, t.clientY);
    stickEl.classList.add('on');
    knobEl.style.transform = '';
  }, { passive: false });
  padEl.addEventListener('touchmove', (e) => {
    e.preventDefault();
    for (const t of e.changedTouches) if (t.identifier === stick.id) stickDrag(t.clientX, t.clientY);
  }, { passive: false });
  for (const ev of ['touchend', 'touchcancel']) {
    padEl.addEventListener(ev, (e) => {
      e.preventDefault();
      for (const t of e.changedTouches) if (t.identifier === stick.id) stickEnd();
    }, { passive: false });
  }
  // A mouse can drive it too, which makes it testable in a desktop browser.
  padEl.addEventListener('mousedown', (e) => {
    stick.id = 'mouse'; stick.cx = e.clientX; stick.cy = e.clientY;
    stickPlace(e.clientX, e.clientY); stickEl.classList.add('on');
  });
  window.addEventListener('mousemove', (e) => { if (stick.id === 'mouse') stickDrag(e.clientX, e.clientY); });
  window.addEventListener('mouseup', () => { if (stick.id === 'mouse') stickEnd(); });

  // ---- the two action buttons
  const bindHold = (el, key) => {
    const on = (e) => { e.preventDefault(); pressKey(key); };
    const off = (e) => { e.preventDefault(); releaseKey(key); };
    el.addEventListener('touchstart', on, { passive: false });
    el.addEventListener('touchend', off, { passive: false });
    el.addEventListener('touchcancel', off, { passive: false });
    el.addEventListener('mousedown', on); el.addEventListener('mouseup', off); el.addEventListener('mouseleave', off);
  };
  document.querySelectorAll('#btns .rbtn').forEach((el) => bindHold(el, el.dataset.k === 'z' ? 'a' : 'b'));

  const goTouch = () => {
    document.body.classList.add('touch');
    document.body.classList.remove('notouch');
    fitStage();
  };
  if ((window.matchMedia && matchMedia('(pointer: coarse)').matches) || navigator.maxTouchPoints > 0) goTouch();
  window.addEventListener('touchstart', goTouch, { once: true });

  // ---- the hand: drag a card up to play it, or tap it
  //
  // Dragging is the gesture a card game teaches you, so it is the primary one;
  // a tap still works (aim, then confirm), and a mouse plays in one click
  // because hovering already aimed it.
  const handEl = els.hand;
  let drag = null;
  const dragLift = () => Math.max(28, handEl.getBoundingClientRect().height * .34);

  handEl.addEventListener('pointerdown', (e) => {
    const cel = e.target.closest && e.target.closest('.cardel');
    if (!cel || !G.battle) return;
    const i = +cel.dataset.c;
    drag = { i, x0: e.clientX, y0: e.clientY, el: cel, moved: false };
    G.battle.sel = i;
    try { cel.setPointerCapture(e.pointerId); } catch (err) {}
    renderHand();
    // renderHand rebuilds the row, so re-find the element we are dragging.
    drag.el = handEl.querySelector(`.cardel[data-c="${i}"]`) || cel;
  });

  handEl.addEventListener('pointermove', (e) => {
    if (!drag || !G.battle) return;
    const dx = e.clientX - drag.x0, dy = e.clientY - drag.y0;
    if (Math.hypot(dx, dy) > 8) drag.moved = true;
    if (!drag.moved) return;
    drag.el.style.transform = `translate(${dx}px, ${Math.min(0, dy)}px)`;
    drag.el.classList.toggle('willplay', -dy >= dragLift());
  });

  const endDrag = (e) => {
    if (!drag || !G.battle) { drag = null; return; }
    const lift = drag.y0 - (e.clientY != null ? e.clientY : drag.y0);
    const d = drag;
    drag = null;
    d.el.style.transform = '';
    d.el.classList.remove('willplay');
    const b = G.battle;
    if (d.moved && lift >= dragLift()) { b.sel = d.i; b.armed = null; playSelected(); return; }
    if (d.moved) { renderHand(); return; }               // dragged nowhere: put it back
    if (b.armed === d.i) { b.sel = d.i; b.armed = null; playSelected(); }
    else { b.sel = d.i; b.armed = d.i; renderHand(); }
  };
  handEl.addEventListener('pointerup', endDrag);
  handEl.addEventListener('pointercancel', () => { if (drag) { drag.el.style.transform = ''; drag.el.classList.remove('willplay'); drag = null; } });

  // ---- fullscreen
  document.getElementById('fsbtn').addEventListener('click', toggleFullscreen);
  for (const ev of ['fullscreenchange', 'webkitfullscreenchange']) {
    document.addEventListener(ev, () => {
      document.body.classList.toggle('fs', !!(document.fullscreenElement || document.webkitFullscreenElement));
      setTimeout(fitStage, 60);
    });
  }
  window.addEventListener('orientationchange', () => setTimeout(fitStage, 120));


  // Hovering a card aims it, so a mouse click plays in one go.
  document.addEventListener('mouseover', (e) => {
    if (!G.battle || document.body.classList.contains('touch')) return;
    const cel = e.target.closest && e.target.closest('.cardel');
    if (!cel) return;
    const i = +cel.dataset.c;
    if (G.battle.sel === i && G.battle.armed === i) return;
    G.battle.sel = i; G.battle.armed = i;
    renderHand();
  });

  // clicks on menus / cards / dialogue
  document.addEventListener('click', (e) => {
    const row = e.target.closest && e.target.closest('.menu .row');
    if (row && G.menu) { G.menu.i = +row.dataset.i; renderMenu(); playCue('select');
      const r = G.menu.rows[G.menu.i]; if (r && !r.off && r.fn) r.fn(); return; }
    const act = e.target.closest && e.target.closest('.abtn');
    if (act && G.battle) {
      const a = act.dataset.a;
      if (a === 'end') doEndTurn();
      else if (a === 'kin') openScreen('party');
      else if (a === 'bag') openScreen('bag');
      else submitLog(doAction({ kind: 'run' }));
      return;
    }
    const card = e.target.closest && e.target.closest('[data-i]');
    if (card && G.screen && els.screen.contains(card)) { G.screen.i = +card.dataset.i; renderScreen(); screenSelect(); return; }
    if (e.target.closest && e.target.closest('.back')) { closeScreen(); return; }
    if (els.dialogue && !els.dialogue.classList.contains('hidden')) { pressKey('a'); return; }
  });

  // title
  const startNew = () => { show(els.title, false); wipeSave(); newGame(); playCue('world'); };
  const startCont = () => {
    show(els.title, false);
    if (!loadGame()) newGame();
    else { G.mode = 'world'; updateCam(); }
    playCue('world');
  };
  els.title.querySelector('[data-act="new"]').addEventListener('click', startNew);
  const contBtn = els.title.querySelector('[data-act="cont"]');
  if (hasSave()) show(contBtn, true);
  contBtn.addEventListener('click', startCont);

  // A parade of three kin on the title card, cycling through the roster.
  const tg = els.titleArt.getContext('2d');
  const stars = DEX_ORDER.filter((id) => ART_CREATURES[id]);
  let ti = 0;
  const spin = () => {
    tg.clearRect(0, 0, 372, 128);
    tg.imageSmoothingEnabled = false;
    if (!stars.length) return;
    for (let i = 0; i < 3; i++) {
      const id = stars[(ti + i * 5) % stars.length];
      const s = i === 1 ? 3 : 2;                         // integer scales only — centre stands forward
      const bottom = artBottom(id) * s;
      drawSpr(tg, 'creature', id, 12 + i * 124 + (i === 1 ? -8 : 0), 122 - bottom, s, { flip: i === 2 });
    }
    ti++;
  };
  spin();
  setInterval(spin, 1600);

  enterMap('hollowbrook', 9, 8, 'down');
  requestAnimationFrame(frame);
}

if (!HEADLESS) boot();

// ---- headless export ---------------------------------------------------
// The test suite drives the real functions; nothing here is a re-implementation.
if (typeof window !== 'undefined') {
  window.EK = {
    G, DEX, DEX_ORDER, MOVES, ITEMS, MAPS, TYPES, CHART, STATUS, TILE_ART, SOLID,
    advanceDialogue, liveBattleMsg,
    ART_CREATURES, ART_TILES, ART_ACTORS,
    mkMon, refresh, movesAt, xpFor, statAt, hpAt, effect, effStat, damageOf,
    startBattle, foeChoose, captureChance, tryCatch, addCaught, readIntent,
    playCard, endTurn, doAction, drawCards, startPlayerTurn, buildDeck, swapKinCards,
    cardValue, cardText, cardCost, cardName, cardDamage, mkCard, grantCard, ownedCard, deckCards, growCap, growCard,
    CARDS, CARD_IDS, CHESTS, CHEST_IDS, RARITY, RARITY_ORDER, STARTER_DECK, DECK_MIN, DECK_MAX,
    openChest, rollRarity, cardsOfRarity, gemReward, moveCost, clearMods, hurtMine, toughen, FOE_HP_MUL,
    grantXP, checkEvolve, evolveMon, useMove, endOfTurn,
    enterMap, passable, warpAt, tileAt, npcAt, npcActive, rollEncounter, tryMove, onArrive, interact, trainerSight,
    updateWorld, updateBattle, step, draw, drawWorld, drawBattle,
    saveGame, loadGame, hasSave, wipeSave, healParty, seeMon, catchMon, dexCount,
    newGame, boot, say, openScreen, closeScreen, renderScreen, screenInput, screenSelect, boxSelect, habitat,
    layoutFor, stickDir, toggleFullscreen, VIEW_W, VIEW_H,
    renderHand, playSelected, doEndTurn, submitLog,
    talkTo, rowanScript, trainerTeam, RIVAL_PICK, sprite, artBottom, drawSpr,
    pressKey, releaseKey, keys, fired,
    setCtx: (c) => { ctx = c; },
    B,
  };
}
