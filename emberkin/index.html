const tileAt = (map, x, y) => (x < 0 || y < 0 || y >= map.rows.length || x >= map.rows[0].length) ? '#' : map.rows[y][x];

/** An NPC is on the map once its story beat is live and until it walks off. */
const npcActive = (n) => !n.gone && (!n.requires || !!G.flags[n.requires]);

function npcAt(map, x, y) {
  return (map.npcs || []).find((n) => n.x === x && n.y === y && npcActive(n)) || null;
}

/** Can the player step from (fx,fy) to (x,y)? Ledges are one-way, downward. */
function passable(map, x, y, fromY) {
  const t = tileAt(map, x, y);
  if (t === 'L') return y > fromY;         // hop down only
  if (SOLID.has(t)) return false;
  if (npcAt(map, x, y)) return false;
  return true;
}

function warpAt(map, x, y) { return (map.warps || []).find((w) => w.x === x && w.y === y) || null; }

function enterMap(id, x, y, dir) {
  const m = MAPS[id] || MAPS.hollowbrook;
  G.mapId = MAPS[id] ? id : 'hollowbrook';
  G.map = m;
  G.player.x = G.player.px = x; G.player.y = G.player.py = y;
  G.player.dir = dir || G.player.dir; G.player.moveT = 0;
  G.alert = null;
  return m;
}

/** Roll the encounter table; returns a fresh wild creature or null. */
function rollEncounter(map) {
  if (!map.enc) return null;
  const total = map.enc.table.reduce((s, e) => s + e[3], 0);
  let r = Math.random() * total;
  for (const [id, lo, hi, w] of map.enc.table) {
    r -= w;
    if (r <= 0) return mkMon(id, rrange(lo, hi));
  }
  const e = map.enc.table[0];
  return mkMon(e[0], rrange(e[1], e[2]));
}
/* =========================================================== §4 — sprites ==
   Art arrives as {p: palette, r: rows-of-chars}. Each sprite is painted once
   into an offscreen canvas at 1:1 and then blitted scaled with smoothing off.
   Missing art must never break anything — every lookup falls back.
   ======================================================================== */
const SPR = { creature: ART_CREATURES, tile: ART_TILES, actor: ART_ACTORS };
const sprCache = new Map();

function mkCanvas(w, h) {
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  return c;
}

/** Paint a char-grid def into a canvas. `mode` 'sil' renders a flat shadow. */
function rasterize(def, mode) {
  const rows = def.r, h = rows.length, w = rows[0].length;
  const c = mkCanvas(w, h);
  const g = c.getContext('2d');
  for (let y = 0; y < h; y++) {
    const row = rows[y];
    let x = 0;
    while (x < w) {
      const ch = row[x];
      if (ch === '.' || ch === ' ') { x++; continue; }
      let run = 1;
      while (x + run < w && row[x + run] === ch) run++;   // fill runs, not pixels
      g.fillStyle = mode === 'sil' ? '#1b1224' : (def.p[ch] || '#ff00ff');
      g.fillRect(x, y, run, 1);
      x += run;
    }
  }
  return c;
}

function sprite(kind, id, mode) {
  const key = kind + ':' + id + (mode || '');
  if (sprCache.has(key)) return sprCache.get(key);
  const def = (SPR[kind] || {})[id];
  let c = null;
  if (def && def.r && def.r.length) {
    try { c = rasterize(def, mode); } catch (e) { c = null; }
  }
  sprCache.set(key, c);
  return c;
}

const hasArt = (kind, id) => !!((SPR[kind] || {})[id]);

/**
 * Blit a sprite. x,y is the top-left in canvas pixels; scale is an integer so
 * pixels stay square. When art is missing we draw a soft placeholder blob in
 * the creature's type colour rather than nothing.
 */
function drawSpr(g, kind, id, x, y, scale = 1, opt = {}) {
  const c = sprite(kind, id, opt.sil ? 'sil' : '');
  if (!c) { placeholder(g, kind, id, x, y, scale); return; }
  const w = c.width * scale, h = c.height * scale;
  g.save();
  if (opt.alpha != null) g.globalAlpha = opt.alpha;
  // Flipping is a transform, so the blit below is written once for both cases.
  if (opt.flip) { g.translate(x + w, y); g.scale(-1, 1); } else { g.translate(x, y); }
  g.drawImage(c, 0, 0, w, h);
  if (opt.flash > 0) {                   // additive re-blit reads as a hit flash
    g.globalCompositeOperation = 'lighter';
    g.globalAlpha = clamp(opt.flash, 0, 1) * .9;
    g.drawImage(c, 0, 0, w, h);
  }
  g.restore();
}

function placeholder(g, kind, id, x, y, scale) {
  const size = (kind === 'creature' ? 40 : kind === 'tile' ? 16 : 22) * scale;
  const sp = DEX[id];
  g.save();
  g.fillStyle = sp ? TYPES[sp.types[0]] : '#4a3560';
  g.globalAlpha = .85;
  const w = size, h = size;
  g.beginPath();
  if (g.ellipse) g.ellipse(x + w / 2, y + h * .62, w * .34, h * .3, 0, 0, Math.PI * 2);
  else g.rect(x + w * .2, y + h * .35, w * .6, h * .5);
  g.fill();
  g.fillStyle = '#1b1224';
  g.fillRect(x + w * .38, y + h * .5, Math.max(1, w * .06), Math.max(1, h * .06));
  g.fillRect(x + w * .56, y + h * .5, Math.max(1, w * .06), Math.max(1, h * .06));
  g.restore();
}

/** Height of a creature's drawn pixels — used to sit sprites on the ground. */
function artBottom(id) {
  const def = ART_CREATURES[id];
  if (!def) return 40;
  for (let y = def.r.length - 1; y >= 0; y--) {
    if (/[^. ]/.test(def.r[y])) return y + 1;
  }
  return 40;
}

/** Draw a creature into a small DOM canvas (party/dex cards). */
function paintTo(canvas, kind, id, scale, sil) {
  if (HEADLESS || !canvas || !canvas.getContext) return;
  const g = canvas.getContext('2d');
  g.imageSmoothingEnabled = false;
  g.clearRect(0, 0, canvas.width, canvas.height);
  drawSpr(g, kind, id, 0, 0, scale, { sil });
}
/* ========================================================= §5 — overworld ==
   Grid movement with a short tween per step, encounters rolled on arrival in
   tall grass, warps on arrival, and A-button interaction with whatever the
   player is facing.
   ======================================================================== */
const VIEW_W = 256, VIEW_H = 176;
const STEP_TIME = .15;
const WIPE_T = .55;                    // battle-entry wipe, seconds
const DIRS = { up: [0, -1], down: [0, 1], left: [-1, 0], right: [1, 0] };

const keys = new Set();       // held
const fired = new Set();      // pressed this frame, consumed by handlers
const held = (k) => keys.has(k);
const justPressed = (k) => fired.has(k);

const KEYMAP = {
  ArrowUp: 'up', ArrowDown: 'down', ArrowLeft: 'left', ArrowRight: 'right',
  w: 'up', s: 'down', a: 'left', d: 'right', W: 'up', S: 'down', A: 'left', D: 'right',
  z: 'a', Z: 'a', Enter: 'a', ' ': 'a',
  x: 'b', X: 'b', Escape: 'b', Backspace: 'b',
};

function pressKey(k) { if (!keys.has(k)) fired.add(k); keys.add(k); }
function releaseKey(k) { keys.delete(k); }

const cam = { x: 0, y: 0 };
function updateCam() {
  const mw = G.map.rows[0].length * TILE, mh = G.map.rows.length * TILE;
  const cx = (G.player.px + .5) * TILE - VIEW_W / 2;
  const cy = (G.player.py + .5) * TILE - VIEW_H / 2 - 6;
  cam.x = mw <= VIEW_W ? (mw - VIEW_W) / 2 : clamp(cx, 0, mw - VIEW_W);
  cam.y = mh <= VIEW_H ? (mh - VIEW_H) / 2 : clamp(cy, 0, mh - VIEW_H);
}

/** Start a step if the target tile allows it. Returns true when moving. */
function tryMove(dir) {
  const p = G.player;
  if (p.moveT > 0) return false;
  p.dir = dir;
  const [dx, dy] = DIRS[dir];
  let nx = p.x + dx, ny = p.y + dy;
  const t = tileAt(G.map, nx, ny);
  // A ledge is a one-way hop: you clear it and land on the far side.
  if (t === 'L' && dir === 'down') {
    if (!passable(G.map, nx, ny + 1, ny)) return false;
    p.hop = true; ny += 1;
  } else if (!passable(G.map, nx, ny, p.y)) {
    p.bump = .12;
    return false;
  }
  p.x = nx; p.y = ny;
  p.moveT = p.hop ? STEP_TIME * 1.6 : STEP_TIME;
  p.moveLen = p.hop ? 2 : 1;
  return true;
}

/** Called the moment the player lands on a new tile. */
function onArrive() {
  const p = G.player;
  G.steps++;
  const w = warpAt(G.map, p.x, p.y);
  if (w) { doWarp(w); return; }
  if (trainerSight()) return;
  if (!GRASSY.has(tileAt(G.map, p.x, p.y)) || !G.map.enc) return;

  // The legendary haunts the shrine grass and gets first refusal. Losing it is
  // not permanent — it comes back around, so a wipe never ends the hunt.
  if (G.mapId === 'crown_hollow' && !G.flags.beatVespyr && p.y <= 8
      && G.steps > (G.flags.vespyrSeenAt || 0) + 25 && chance(.18)) {
    G.flags.vespyrSeenAt = G.steps;
    say('', ['The air goes thin and bright. Something old has noticed you.'], () => {
      startBattle({ foe: mkMon('vespyr', 26), wild: true, legendary: true });
    });
    return;
  }
  if (chance(G.map.enc.rate)) {
    const foe = rollEncounter(G.map);
    if (foe) startBattle({ foe, wild: true });
  }
}

const SIGHT = 4;                       // how far down their own line a trainer looks

/**
 * Did an unbeaten trainer just see the player walk into their line? Sight is
 * blocked by anything solid, so you can sneak behind a tree.
 */
function trainerSight() {
  const p = G.player;
  for (const n of (G.map.npcs || [])) {
    if (!n.trainer || !npcActive(n) || G.flags[n.id]) continue;
    const [dx, dy] = DIRS[n.dir] || [0, 1];
    for (let i = 1; i <= SIGHT; i++) {
      const x = n.x + dx * i, y = n.y + dy * i;
      if (SOLID.has(tileAt(G.map, x, y))) break;
      if (x === p.x && y === p.y) {
        // Turn and face whoever just called you out.
        p.dir = dx ? (dx > 0 ? 'left' : 'right') : (dy > 0 ? 'up' : 'down');
        G.alert = { npc: n, t: 0 };
        say(n.name, ['…'], () => { G.alert = null; talkTo(n); });
        return true;
      }
    }
  }
  return false;
}

function doWarp(w) {
  enterMap(w.to, w.tx, w.ty, w.dir || G.player.dir);
  G.fade = .35;
  updateCam();
  saveGame();
}

/** A-button: talk to whatever is in front, or read a sign. */
function interact() {
  const p = G.player;
  const [dx, dy] = DIRS[p.dir];
  const tx = p.x + dx, ty = p.y + dy;
  const npc = npcAt(G.map, tx, ty);
  if (npc) { faceNpc(npc, p); talkTo(npc); return true; }
  const sign = (G.map.signs || {})[tx + ',' + ty];
  if (sign) { say('', [sign]); return true; }
  return false;
}

function faceNpc(npc, p) {
  npc.dir = p.dir === 'up' ? 'down' : p.dir === 'down' ? 'up' : p.dir === 'left' ? 'right' : 'left';
}

function updateWorld(dt) {
  const p = G.player;
  if (p.bump > 0) p.bump = Math.max(0, p.bump - dt);

  if (p.moveT > 0) {
    p.moveT -= dt;
    const total = (p.moveLen === 2 ? STEP_TIME * 1.6 : STEP_TIME);
    const k = clamp(1 - p.moveT / total, 0, 1);
    const [dx, dy] = DIRS[p.dir];
    const len = p.moveLen || 1;
    p.px = p.x - dx * len * (1 - k);
    p.py = p.y - dy * len * (1 - k);
    if (p.moveT <= 0) {
      p.moveT = 0; p.px = p.x; p.py = p.y; p.step ^= 1; p.hop = false; p.moveLen = 1;
      onArrive();
    }
  } else {
    if (justPressed('b')) { openMainMenu(); return; }
    if (justPressed('a')) { if (interact()) return; }
    for (const d of ['up', 'down', 'left', 'right']) if (held(d)) { tryMove(d); break; }
  }
  updateCam();
}

// ---- drawing -----------------------------------------------------------
function drawTile(g, ch, sx, sy) {
  const id = TILE_ART[ch] || 'grass';
  if (hasArt('tile', id)) { drawSpr(g, 'tile', id, sx, sy, 1); return; }
  // Fallback palette so the world is still legible before art lands.
  const FB = { grass: '#4d9a3c', tallgrass: '#2f7a3a', path: '#c4a276', water: '#2b7fc0',
    tree: '#1f5230', rock: '#7d6a5c', flowers: '#5cb340', sand: '#e0cfa2', fence: '#8a6a45',
    wall: '#d8c9ad', roof: '#a8402f', door: '#6b4526', sign: '#8a6a45', ledge: '#3f7a37' };
  g.fillStyle = FB[id] || '#4d9a3c';
  g.fillRect(sx, sy, TILE, TILE);
}

function drawActor(g, sprite_id, dir, step, sx, sy, moving) {
  const base = sprite_id === 'player' ? 'player_' + dir : sprite_id;
  let id = sprite_id === 'player' ? base + '_' + (moving ? step : 0) : sprite_id;
  let flip = false;
  if (sprite_id === 'player' && !hasArt('actor', id) && (dir === 'right')) {
    id = 'player_left_' + (moving ? step : 0); flip = true;   // mirror if right frames are missing
  }
  if (!hasArt('actor', id)) id = sprite_id === 'player' ? 'player_down_0' : id;
  drawSpr(g, 'actor', id, sx, sy, 1, { flip });
}

function drawWorld(g) {
  const map = G.map;
  const x0 = Math.floor(cam.x / TILE), y0 = Math.floor(cam.y / TILE);
  const ox = -(cam.x % TILE), oy = -(cam.y % TILE);
  g.fillStyle = map.kind === 'inside' ? '#2a2030' : '#14301f';
  g.fillRect(0, 0, VIEW_W, VIEW_H);

  for (let y = 0; y <= VIEW_H / TILE + 1; y++) {
    for (let x = 0; x <= VIEW_W / TILE + 1; x++) {
      const mx = x0 + x, my = y0 + y;
      if (my < 0 || my >= map.rows.length || mx < 0 || mx >= map.rows[0].length) continue;
      const ch = map.rows[my][mx];
      const sx = Math.round(x * TILE + ox), sy = Math.round(y * TILE + oy);
      // Buildings and props sit on ground, so paint grass under them first.
      if (ch === 'R' || ch === 'W' || ch === 'D' || ch === 'S' || ch === 'o' || ch === 'f' || ch === '|') drawTile(g, '.', sx, sy);
      if (ch === '~') {
        // Water bobs: scroll the tile a pixel and wrap it inside its own cell.
        const dy = Math.round(Math.sin(G.t * 1.6 + mx * .8 + my * .5) * 1.2);
        g.save();
        g.beginPath(); g.rect(sx, sy, TILE, TILE); g.clip();
        drawTile(g, ch, sx, sy + dy);
        drawTile(g, ch, sx, sy + dy - TILE * (dy < 0 ? -1 : 1));
        g.restore();
        continue;
      }
      drawTile(g, ch, sx, sy);
    }
  }

  // Entities, back to front by tile row.
  const ents = [];
  for (const n of (map.npcs || [])) if (npcActive(n)) ents.push({ y: n.y, draw: () => {
    const sx = Math.round(n.x * TILE - cam.x), sy = Math.round(n.y * TILE - cam.y - 6);
    drawSpr(g, 'actor', n.sprite, sx, sy, 1);
    if (n.trainer && !G.flags[n.id]) {
      // A quiet marker normally; a big jolt on the frame they spot you.
      const spotted = G.alert && G.alert.npc === n;
      const bob = spotted ? -Math.abs(Math.sin(G.t * 14)) * 4 : Math.sin(G.t * 4) * 1.5;
      const s = spotted ? 2 : 1;
      g.fillStyle = spotted ? '#fff' : '#ffc94d';
      g.fillRect(sx + 8 - s, sy - 8 - 3 * s + bob, s * 2, s * 5);
      g.fillRect(sx + 8 - s, sy - 2 + bob, s * 2, s * 2);
    }
  } });
  const p = G.player;
  ents.push({ y: p.py, draw: () => {
    const hop = p.hop ? Math.sin(clamp(1 - p.moveT / (STEP_TIME * 1.6), 0, 1) * Math.PI) * 7 : 0;
    const sx = Math.round(p.px * TILE - cam.x), sy = Math.round(p.py * TILE - cam.y - 6 - hop);
    if (hop > 0) { g.fillStyle = 'rgba(0,0,0,.28)'; g.fillRect(sx + 3, sy + 21 + hop, 10, 3); }
    drawActor(g, 'player', p.dir, p.step, sx, sy, p.moveT > 0);
  } });
  ents.sort((a, b) => a.y - b.y).forEach((e) => e.draw());

  // Tall grass draws over feet so the player wades through it.
  for (const e of [p, ...(map.npcs || []).filter(npcActive)]) {
    const ex = e.px != null ? e.px : e.x, ey = e.py != null ? e.py : e.y;
    if (!GRASSY.has(tileAt(map, Math.round(ex), Math.round(ey)))) continue;
    const sx = Math.round(Math.round(ex) * TILE - cam.x), sy = Math.round(Math.round(ey) * TILE - cam.y);
    // The blades sway while whoever is standing in them is moving.
    const moving = e.moveT > 0;
    const sway = moving ? Math.round(Math.sin(G.t * 22) * 1.2) : 0;
    g.save(); g.beginPath(); g.rect(sx, sy + 7, TILE, 9); g.clip();
    drawTile(g, ',', sx + sway, sy);
    g.restore();
  }

  if (map.kind === 'inside') {                       // cosy interior vignette
    g.fillStyle = 'rgba(20,10,26,.25)';
    g.fillRect(0, 0, VIEW_W, VIEW_H);
  }
}
/* =========================================================== §6 — battle ==
   A turn resolves completely, up front, into a list of log entries. Each entry
   carries an HP snapshot, so the UI can play the turn back at reading speed
   while the underlying state is already consistent. Tests drive doTurn()
   directly and read the same log.
   ======================================================================== */
function startBattle(opt) {
  const mine = firstAlive();
  if (!mine) return false;
  G.battle = {
    foe: opt.foe, mine, wild: !!opt.wild, legendary: !!opt.legendary,
    npc: opt.npc || null,
    team: opt.team || null, teamIdx: 0,
    escapes: 0, turn: 0, over: null, log: null, li: 0,
    shake: 0, flashM: 0, flashF: 0, entry: 0, throwT: 0, hold: 0,
    dispM: mine.hp, dispF: opt.foe.hp, tgtM: mine.hp, tgtF: opt.foe.hp,
    started: false, finishing: false, await: null,
  };
  mine.stages = { atk: 0, def: 0, spd: 0 };
  opt.foe.stages = { atk: 0, def: 0, spd: 0 };
  G.wipe = WIPE_T;
  seeMon(opt.foe.species);
  G.mode = 'battle';
  const who = opt.npc ? `${opt.npc.name} wants to battle!` : `A wild ${opt.foe.name} bristles!`;
  playCue(opt.legendary ? 'shrine' : 'battle');
  const lines = [who, `Go, ${dispName(mine)}!`];
  // One-time nudge, the first time a wild kin shows up with orbs in the bag.
  if (opt.wild && !G.flags.taughtCatch && (G.bag.bloomorb > 0 || G.bag.gleamorb > 0 || G.bag.prismorb > 0)) {
    G.flags.taughtCatch = 1;
    lines.push('Knock it down first, then reach for an orb — Bag, then the orb. A hurt kin holds.');
  }
  battleSay(lines, () => openBattleMenu());
  return true;
}

const B = () => G.battle;

// ---- damage ------------------------------------------------------------
function critRoll() { return chance(1 / 16); }

/** Pure-ish damage calc; returns {dmg, eff, crit}. */
function damageOf(atkMon, defMon, move, opts = {}) {
  const m = MOVES[move];
  if (!m.pow) return { dmg: 0, eff: 1, crit: false };
  const eff = effect(m.type, defMon.types);
  const stab = atkMon.types.includes(m.type) ? 1.5 : 1;
  const crit = opts.crit != null ? opts.crit : critRoll();
  const a = effStat(atkMon, 'atk'), d = effStat(defMon, 'def');
  let base = Math.floor((((2 * atkMon.lvl / 5 + 2) * m.pow * a / Math.max(1, d)) / 50) + 2);
  const roll = opts.roll != null ? opts.roll : (.85 + Math.random() * .15);
  let dmg = Math.floor(base * stab * eff * (crit ? 1.5 : 1) * roll);
  return { dmg: Math.max(eff === 0 ? 0 : 1, dmg), eff, crit };
}

const effWord = (e) => e === 0 ? 'It does nothing at all…' : e >= 2 ? "It's brutally effective!" : e > 1 ? "It's effective!" : e < 1 ? 'It barely lands…' : '';

// ---- log helpers -------------------------------------------------------
function snap(log, t, fx, side) {
  const b = B();
  log.push({ t, fx: fx || '', side: side || '', hpM: b.mine.hp, hpF: b.foe.hp,
    sM: b.mine.status, sF: b.foe.status, lvM: b.mine.lvl, xpM: b.mine.xp });
}

const STAT_WORD = { atk: 'attack', def: 'guard', spd: 'speed' };
function applyStages(log, target, list, who) {
  for (const [stat, n] of list) {
    const before = target.stages[stat];
    target.stages[stat] = clamp(before + n, -6, 6);
    if (target.stages[stat] === before) { snap(log, `${who}'s ${STAT_WORD[stat]} can go no ${n > 0 ? 'higher' : 'lower'}.`); continue; }
    const word = n > 0 ? (n > 1 ? 'sharply rose' : 'rose') : (n < -1 ? 'sharply fell' : 'fell');
    snap(log, `${who}'s ${STAT_WORD[stat]} ${word}!`);
  }
}

/** One creature uses one move. Mutates state, appends to log. */
function useMove(log, atkSide, moveId) {
  const b = B();
  const attacker = atkSide === 'mine' ? b.mine : b.foe;
  const defender = atkSide === 'mine' ? b.foe : b.mine;
  const who = atkSide === 'mine' ? dispName(attacker) : `Foe ${dispName(attacker)}`;
  const them = atkSide === 'mine' ? `Foe ${dispName(defender)}` : dispName(defender);
  if (attacker.hp <= 0 || defender.hp <= 0) return;

  if (attacker.status === 'shock' && chance(.25)) {
    snap(log, `${who} is jolted stiff and cannot move!`, 'status', atkSide);
    return;
  }

  const m = MOVES[moveId];
  const slot = attacker.moves.find((x) => x.id === moveId);
  if (slot) slot.pp = Math.max(0, slot.pp - 1);
  snap(log, `${who} used ${m.name}!`, 'use', atkSide);

  if (m.acc && rnd(100) >= m.acc) { snap(log, `${who}'s attack missed!`, 'miss', atkSide); return; }

  const fx = m.fx || {};
  if (m.pow) {
    const { dmg, eff, crit } = damageOf(attacker, defender, moveId);
    defender.hp = clamp(defender.hp - dmg, 0, defender.max);
    snap(log, `${them} took ${dmg}.`, 'hit', atkSide === 'mine' ? 'foe' : 'mine');
    if (crit && eff !== 0) snap(log, 'A critical hit!');
    const w = effWord(eff);
    if (w) snap(log, w);
    if (fx.drain && dmg > 0) {
      const heal = Math.max(1, Math.floor(dmg * fx.drain));
      attacker.hp = clamp(attacker.hp + heal, 0, attacker.max);
      snap(log, `${who} drank the energy back.`, 'heal', atkSide);
    }
    if (fx.recoil && dmg > 0) {
      const r = Math.max(1, Math.floor(dmg * fx.recoil));
      attacker.hp = clamp(attacker.hp - r, 0, attacker.max);
      snap(log, `${who} is hurt by the recoil.`, 'hit', atkSide);
    }
    if (eff === 0) return;
  }

  if (fx.heal) {
    const before = attacker.hp;
    attacker.hp = clamp(attacker.hp + Math.floor(attacker.max * fx.heal), 0, attacker.max);
    snap(log, attacker.hp > before ? `${who} settled and recovered.` : `${who} is already whole.`, 'heal', atkSide);
  }
  if (fx.st && defender.hp > 0) {
    const [st, p] = fx.st;
    if (!defender.status && chance(p) && !defender.types.includes(IMMUNE_TO[st] || '')) {
      defender.status = st;
      snap(log, `${them} is ${STATUS[st].name.toLowerCase()}!`, 'status', atkSide === 'mine' ? 'foe' : 'mine');
    }
  }
  if (fx.foe && defender.hp > 0) applyStages(log, defender, fx.foe, them);
  if (fx.self) applyStages(log, attacker, fx.self, who);
}

// A creature shrugs off the status its own element embodies.
const IMMUNE_TO = { burn: 'Ember', shock: 'Spark', chill: 'Tide', snare: 'Verdant' };

function endOfTurn(log) {
  const b = B();
  for (const [mon, side] of [[b.mine, 'mine'], [b.foe, 'foe']]) {
    if (mon.hp <= 0) continue;
    const who = side === 'mine' ? dispName(mon) : `Foe ${dispName(mon)}`;
    if (mon.status === 'burn' || mon.status === 'snare') {
      const d = Math.max(1, Math.floor(mon.max / 16));
      mon.hp = clamp(mon.hp - d, 0, mon.max);
      snap(log, `${who} is worn down by the ${mon.status === 'burn' ? 'burn' : 'roots'}.`, 'hit', side);
    }
  }
}

// ---- experience --------------------------------------------------------
function grantXP(log, winner, loser) {
  const gain = Math.max(1, Math.floor(DEX[loser.species].xp * loser.lvl / 7));
  winner.xp += gain;
  snap(log, `${dispName(winner)} gained ${gain} EXP.`, 'xp', 'mine');
  while (winner.lvl < 100 && winner.xp >= xpFor(winner.lvl + 1)) {
    winner.lvl++;
    refresh(winner);
    snap(log, `${dispName(winner)} grew to level ${winner.lvl}!`, 'level', 'mine');
    for (const [lv, mv] of DEX[winner.species].learn) {
      if (lv !== winner.lvl) continue;
      if (winner.moves.some((x) => x.id === mv)) continue;
      if (winner.moves.length < 4) {
        winner.moves.push({ id: mv, pp: MOVES[mv].pp, max: MOVES[mv].pp });
        snap(log, `${dispName(winner)} learned ${MOVES[mv].name}!`, 'learn', 'mine');
      } else {
        // Forget the weakest thing it knows — never the new move.
        let wi = 0;
        for (let i = 1; i < 4; i++) if (MOVES[winner.moves[i].id].pow < MOVES[winner.moves[wi].id].pow) wi = i;
        const old = MOVES[winner.moves[wi].id].name;
        winner.moves[wi] = { id: mv, pp: MOVES[mv].pp, max: MOVES[mv].pp };
        snap(log, `${dispName(winner)} forgot ${old} and learned ${MOVES[mv].name}!`, 'learn', 'mine');
      }
    }
  }
}

/** Pending evolutions are played out after the battle ends. */
function checkEvolve() {
  for (const m of G.party) {
    const evo = DEX[m.species].evo;
    if (evo && m.lvl >= evo[1] && !m.noEvo) return m;
  }
  return null;
}

function evolveMon(m) {
  const [to] = DEX[m.species].evo;
  const oldName = dispName(m);
  m.species = to; m.name = DEX[to].name;
  refresh(m);
  catchMon(to);
  // New form's level-1 kit is offered for any empty move slots.
  for (const [lv, mv] of DEX[to].learn) {
    if (lv <= m.lvl && m.moves.length < 4 && !m.moves.some((x) => x.id === mv)) {
      m.moves.push({ id: mv, pp: MOVES[mv].pp, max: MOVES[mv].pp });
    }
  }
  return { oldName, newName: DEX[to].name };
}

// ---- capture -----------------------------------------------------------
/** Pokémon-shaped capture maths: four shakes, all must hold. */
function captureChance(foe, orbMul) {
  const rate = DEX[foe.species].rate;
  const stMul = foe.status === 'shock' || foe.status === 'chill' ? 1.5 : foe.status ? 1.25 : 1;
  const a = ((3 * foe.max - 2 * foe.hp) / (3 * foe.max)) * rate * orbMul * stMul;
  return clamp(a / 255, 0, 1);
}

function tryCatch(log, orbId) {
  const b = B();
  const orb = ITEMS[orbId];
  const p = captureChance(b.foe, orb.mul);
  snap(log, `You lob a ${orb.name}!`, 'throw', 'foe');
  const shakeP = Math.pow(p, 1 / 4);
  let shakes = 0;
  while (shakes < 4 && chance(shakeP)) shakes++;
  if (shakes >= 4) {
    snap(log, `…click. ${b.foe.name} is yours!`, 'caught', 'foe');
    b.over = 'caught';
    return true;
  }
  snap(log, ['It broke out immediately!', 'So close — one shake.', 'Two shakes… and out.', 'Three shakes! It nearly held!'][shakes], 'break', 'foe');
  return false;
}

function addCaught(mon) {
  catchMon(mon.species);
  G.caught++;
  mon.stages = { atk: 0, def: 0, spd: 0 };
  if (G.party.length < 6) { G.party.push(mon); return 'party'; }
  G.box.push(mon); return 'box';
}

// ---- foe AI ------------------------------------------------------------
/** Picks the move with the best expected value, with a little noise. */
function foeChoose() {
  const b = B();
  const usable = b.foe.moves.filter((m) => m.pp > 0);
  const list = usable.length ? usable : [{ id: 'falter', pp: 1, max: 1 }];
  let best = null, bestScore = -1;
  for (const slot of list) {
    const m = MOVES[slot.id];
    let score;
    if (m.pow) {
      const { dmg, eff } = damageOf(b.foe, b.mine, slot.id, { crit: false, roll: .925 });
      score = dmg * (eff === 0 ? 0 : 1);
      if (dmg >= b.mine.hp) score *= 2.2;                 // go for the kill
    } else {
      const fx = m.fx || {};
      score = b.foe.hp < b.foe.max * .45 && fx.heal ? b.foe.max * .35 : b.foe.max * .12;
      if (fx.st && b.mine.status) score = 1;
    }
    score *= .8 + Math.random() * .4;
    if (score > bestScore) { bestScore = score; best = slot.id; }
  }
  return best;
}

// ---- the turn ----------------------------------------------------------
/**
 * action: {kind:'move', id} | {kind:'switch', idx} | {kind:'item', id}
 *         | {kind:'run'}
 * Returns the log; b.over is set when the battle finished.
 */
function doTurn(action) {
  const b = B();
  const log = [];
  b.turn++;
  b.over = null;          // recomputed below; never inherit last turn's verdict

  // Non-move player actions happen first, then the foe still gets its turn.
  let playerMoved = false;
  if (action.kind === 'run') {
    if (!b.wild) { snap(log, 'There is no running from a challenge!'); return log; }
    b.escapes++;
    const odds = clamp(.4 + .35 * (effStat(b.mine, 'spd') / Math.max(1, effStat(b.foe, 'spd')) - 1) + b.escapes * .15, .12, .95);
    if (b.mine.status === 'snare') { snap(log, 'Roots hold you fast — no escape!'); }
    else if (chance(odds)) { snap(log, 'You slip away into the grass.', 'flee'); b.over = 'fled'; return log; }
    else snap(log, 'You could not get away!');
  } else if (action.kind === 'item') {
    const it = ITEMS[action.id];
    if (!useItemInBattle(log, action.id, action.target)) return log;
    if (it.kind === 'orb' && b.over === 'caught') return log;
  } else if (action.kind === 'switch') {
    const next = G.party[action.idx];
    snap(log, `Come back, ${dispName(b.mine)}!`);
    b.mine.stages = { atk: 0, def: 0, spd: 0 };
    b.mine = next;
    next.stages = { atk: 0, def: 0, spd: 0 };
    snap(log, `Go, ${dispName(next)}!`, 'send', 'mine');
  }

  const foeMove = foeChoose();
  if (action.kind === 'move') {
    const mMine = MOVES[action.id], mFoe = MOVES[foeMove];
    const priM = (mMine.fx && mMine.fx.pri) || 0, priF = (mFoe.fx && mFoe.fx.pri) || 0;
    const mineFirst = priM !== priF ? priM > priF
      : effStat(b.mine, 'spd') !== effStat(b.foe, 'spd') ? effStat(b.mine, 'spd') > effStat(b.foe, 'spd')
      : chance(.5);
    const order = mineFirst ? ['mine', 'foe'] : ['foe', 'mine'];
    for (const side of order) {
      if (b.mine.hp <= 0 || b.foe.hp <= 0) break;
      useMove(log, side, side === 'mine' ? action.id : foeMove);
    }
    playerMoved = true;
  } else if (b.foe.hp > 0 && b.mine.hp > 0) {
    useMove(log, 'foe', foeMove);
  }

  if (b.foe.hp > 0 && b.mine.hp > 0) endOfTurn(log);

  // ---- resolution
  if (b.foe.hp <= 0) {
    snap(log, `${b.wild ? 'Wild ' : 'Foe '}${dispName(b.foe)} is down!`, 'faint', 'foe');
    if (b.mine.hp > 0) grantXP(log, b.mine, b.foe);
    if (b.team && b.teamIdx < b.team.length - 1) {
      b.teamIdx++;
      const nxt = b.team[b.teamIdx];
      b.foe = mkMon(nxt[0], nxt[1]);
      b.foe.stages = { atk: 0, def: 0, spd: 0 };
      seeMon(b.foe.species);
      snap(log, `${b.npc ? b.npc.name : 'The challenger'} sends out ${b.foe.name}!`, 'send', 'foe');
    } else {
      b.over = 'win';
    }
  } else if (b.mine.hp <= 0) {
    snap(log, `${dispName(b.mine)} has fainted.`, 'faint', 'mine');
    if (!partyAlive()) b.over = 'lose';
    else b.over = 'switch';
  }
  return log;
}

function useItemInBattle(log, id, targetIdx) {
  const b = B();
  const it = ITEMS[id];
  if (!it || !(G.bag[id] > 0)) { snap(log, 'You have none of those.'); return false; }
  if (it.kind === 'orb') {
    if (!b.wild) { snap(log, 'Stealing another trainer\'s kin? No.'); return false; }
    G.bag[id]--;
    tryCatch(log, id);
    return true;
  }
  const target = targetIdx != null ? G.party[targetIdx] : b.mine;
  if (it.kind === 'heal') {
    if (target.hp <= 0) { snap(log, `${dispName(target)} is out cold — that will not help.`); return false; }
    if (target.hp >= target.max) { snap(log, `${dispName(target)} is already whole.`); return false; }
    G.bag[id]--;
    target.hp = clamp(target.hp + it.amt, 0, target.max);
    snap(log, `${dispName(target)} recovered.`, 'heal', 'mine');
  } else if (it.kind === 'revive') {
    if (target.hp > 0) { snap(log, `${dispName(target)} does not need that.`); return false; }
    G.bag[id]--;
    target.hp = Math.floor(target.max / 2);
    snap(log, `${dispName(target)} opens its eyes.`, 'heal', 'mine');
  } else if (it.kind === 'pp') {
    G.bag[id]--;
    target.moves.forEach((m) => { m.pp = Math.min(m.max, m.pp + it.amt); });
    snap(log, `${dispName(target)}'s moves feel fresh.`, 'heal', 'mine');
  }
  if (G.bag[id] <= 0) delete G.bag[id];
  return true;
}

// ---- battle scene drawing ---------------------------------------------
function drawBattle(g) {
  const b = B();
  const t = G.t;
  // Sky and ground bands, tinted by the foe's element.
  const tint = TYPES[b.foe.types[0]] || '#7a5fc4';
  const sky = g.createLinearGradient(0, 0, 0, VIEW_H);
  sky.addColorStop(0, '#231633'); sky.addColorStop(.55, '#39243f'); sky.addColorStop(1, '#1a1022');
  g.fillStyle = sky; g.fillRect(0, 0, VIEW_W, VIEW_H);
  g.globalAlpha = .10; g.fillStyle = tint; g.fillRect(0, 0, VIEW_W, VIEW_H * .6); g.globalAlpha = 1;

  const shake = b.shake > 0 ? Math.sin(t * 70) * b.shake * 3 : 0;
  // Two ground discs — foe far, yours near.
  const disc = (cx, cy, rx, ry, col) => {
    g.save(); g.translate(cx, cy); g.scale(1, ry / rx);
    g.beginPath(); g.arc(0, 0, rx, 0, Math.PI * 2); g.fillStyle = col; g.fill(); g.restore();
  };
  // Ground lines: the foe stands high and far, yours low and near, with the
  // text box below both — nothing may overlap the panels.
  const FOE_GROUND = 68, MY_GROUND = 128;
  disc(178, FOE_GROUND + 2, 50, 12, '#2e4a30');
  disc(178, FOE_GROUND + 2, 42, 9, '#3c6136');
  disc(72, MY_GROUND + 3, 60, 14, '#2e4a30');
  disc(72, MY_GROUND + 3, 52, 11, '#3c6136');

  const foeId = b.foe.species, myId = b.mine.species;
  const fs = 1.5, ms = 2;
  const fb = artBottom(foeId), mb = artBottom(myId);
  const fx = 178 - 40 * fs / 2 + shake * (b.flashF > 0 ? 1 : 0);
  const fy = FOE_GROUND - fb * fs + Math.sin(t * 1.7) * 1.5;
  const mx = 72 - 40 * ms / 2 - shake * (b.flashM > 0 ? 1 : 0);
  const my = MY_GROUND - mb * ms + Math.sin(t * 1.9 + 1) * 2;

  g.save(); g.globalAlpha = .3; g.fillStyle = '#000';
  if (g.ellipse) { g.beginPath(); g.ellipse(178, FOE_GROUND, 22, 5, 0, 0, Math.PI * 2); g.fill();
                   g.beginPath(); g.ellipse(72, MY_GROUND, 28, 6, 0, 0, Math.PI * 2); g.fill(); }
  g.restore();

  const entry = clamp(b.entry, 0, 1);
  drawSpr(g, 'creature', foeId, fx + (1 - entry) * 90, fy, fs, { flash: b.flashF > 0 ? b.flashF : 0, alpha: b.foe.hp <= 0 ? .35 : 1 });
  drawSpr(g, 'creature', myId, mx - (1 - entry) * 90, my, ms, { flip: true, flash: b.flashM > 0 ? b.flashM : 0, alpha: b.mine.hp <= 0 ? .35 : 1 });

  if (b.throwT > 0) {                       // an orb arcing toward the foe
    const k = 1 - b.throwT / .6;
    const ox = 72 + (178 - 72) * k, oy = MY_GROUND - Math.sin(k * Math.PI) * 60 - k * 50;
    g.fillStyle = '#ffc94d'; g.beginPath(); g.arc(ox, oy, 4, 0, Math.PI * 2); g.fill();
    g.strokeStyle = '#2a1b2e'; g.lineWidth = 1; g.stroke();
  }
}
/* =============================================================== §7 — UI ==
   Canvas draws the world; every panel is DOM so text stays crisp. Menus are
   data (G.menu) rendered into a panel, driven by the same keys as the world.
   ======================================================================== */
const $ = (id) => HEADLESS ? null : document.getElementById(id);
const els = {};
function cacheEls() {
  if (HEADLESS) return;
  for (const id of ['view', 'dialogue', 'mainmenu', 'battlemenu', 'movemenu', 'screen', 'hudFoe', 'hudMine', 'title', 'toast', 'titleArt']) els[id] = $(id);
}
const show = (el, on) => { if (el) el.classList.toggle('hidden', !on); };

// ---- dialogue ----------------------------------------------------------
function say(who, lines, done) {
  G.dialogue = { who, lines: Array.isArray(lines) ? lines : [lines], i: 0, done, hold: .12 };
  G.prevMode = G.mode === 'dialogue' ? G.prevMode : G.mode;
  G.mode = 'dialogue';
  renderDialogue();
}
function battleSay(lines, done) {
  G.battleMsg = { lines: Array.isArray(lines) ? lines : [lines], i: 0, done, hold: .12 };
  renderDialogue();
}
function renderDialogue() {
  if (HEADLESS) return;
  const d = G.dialogue || G.battleMsg;
  if (!d) { show(els.dialogue, false); return; }
  const line = d.lines[d.i] || '';
  els.dialogue.innerHTML = (d.who ? `<span class="who">${d.who}</span>` : '') +
    line + (d.i < d.lines.length - 1 ? '<span class="more">▼</span>' : '');
  els.dialogue.classList.toggle('narrow', !!G.battle);
  show(els.dialogue, true);
}
function advanceDialogue() {
  const inBattle = !!G.battleMsg;
  const d = inBattle ? G.battleMsg : G.dialogue;
  if (!d) return;
  if (d.hold > 0) return;
  d.i++;
  if (d.i >= d.lines.length) {
    if (inBattle) G.battleMsg = null; else { G.dialogue = null; G.mode = G.prevMode || 'world'; }
    show(els.dialogue, false);
    if (d.done) d.done();
    else if (!inBattle) renderDialogue();
  } else renderDialogue();
}

// ---- menus -------------------------------------------------------------
function openMenu(elId, rows, opt = {}) {
  G.menu = { elId, rows, i: opt.i || 0, cancel: opt.cancel, title: opt.title || '' };
  renderMenu();
}
function closeMenu() {
  if (G.menu && !HEADLESS) show(els[G.menu.elId], false);
  G.menu = null;
}
function renderMenu() {
  if (HEADLESS || !G.menu) return;
  const el = els[G.menu.elId];
  el.innerHTML = (G.menu.title ? `<div class="title">${G.menu.title}</div>` : '') +
    G.menu.rows.map((r, i) => `<div class="row ${i === G.menu.i ? 'sel' : ''} ${r.off ? 'off' : ''}" data-i="${i}">
      <span>${r.label}</span>${r.sub ? `<span class="sub">${r.sub}</span>` : ''}</div>`).join('');
  show(el, true);
}
function menuInput() {
  const m = G.menu;
  if (!m) return;
  if (justPressed('up')) { m.i = (m.i + m.rows.length - 1) % m.rows.length; renderMenu(); }
  if (justPressed('down')) { m.i = (m.i + 1) % m.rows.length; renderMenu(); }
  if (justPressed('a')) {
    const r = m.rows[m.i];
    if (r && !r.off && r.fn) r.fn();
  }
  if (justPressed('b')) { if (m.cancel) m.cancel(); else closeMenu(); }
}

// ---- world main menu ---------------------------------------------------
function openMainMenu() {
  G.mode = 'menu';
  openMenu('mainmenu', [
    { label: 'Kin', sub: `${G.party.length}/6`, fn: () => openScreen('party') },
    { label: 'Dex', sub: `${dexCount(2)}/${DEX_ORDER.length}`, fn: () => openScreen('dex') },
    { label: 'Bag', fn: () => openScreen('bag') },
    { label: 'Box', sub: '' + G.box.length, fn: () => openScreen('box') },
    { label: 'Shards', sub: '' + G.money, fn: () => setToast(`${G.money} shards`) },
    { label: 'Save', fn: () => { setToast(saveGame() ? 'Journey saved.' : 'Could not save.'); } },
    { label: 'Close', fn: closeWorldMenu },
  ], { cancel: closeWorldMenu, title: G.map.name });
}
function closeWorldMenu() { closeMenu(); G.mode = 'world'; }

// ---- NPCs --------------------------------------------------------------
// The rival always shows up with the starter that beats yours, and keeps it.
const RIVAL_PICK = { cindercub: 'dewdrip', dewdrip: 'sproutle', sproutle: 'cindercub' };

/** A trainer's team, resolved at challenge time so the rival can react to you. */
function trainerTeam(npc) {
  const pick = RIVAL_PICK[G.flags.starter] || 'dewdrip';
  if (npc.dynamic === 'rival1') return [[pick, 7]];
  if (npc.dynamic === 'rival2') {
    const evo = DEX[pick].evo ? DEX[pick].evo[0] : pick;
    return [['kindlark', 15], [evo, 16]];
  }
  if (npc.dynamic === 'rival3') {
    // Three days up a mountain with the same kin: it is fully grown by now.
    let top = pick;
    while (DEX[top].evo) top = DEX[top].evo[0];
    return [['voltyx', 28], ['nocthorn', 29], [top, 31]];
  }
  return npc.trainer.team.map((e) => [e[0], e[1]]);
}

function talkTo(npc) {
  if (npc.script === 'rowan') { rowanScript(); return; }
  if (npc.trainer && !G.flags[npc.id]) {
    say(npc.name, npc.lines, () => {
      const team = trainerTeam(npc);
      const foe = mkMon(team[0][0], team[0][1]);
      startBattle({ foe, team, npc, wild: false });
    });
    return;
  }
  if (npc.heal) {
    say(npc.name, npc.lines, () => {
      healParty();
      say(npc.name, ['There. Right as rain.'], () => { saveGame(); });
    });
    return;
  }
  if (npc.shop) { say(npc.name, npc.lines, () => openScreen('shop')); return; }
  say(npc.name, npc.trainer && G.flags[npc.id] ? (npc.after || ['Good match. Go on.']) : npc.lines);
}

function healParty() {
  G.party.forEach((m) => { m.hp = m.max; m.status = ''; m.moves.forEach((mv) => { mv.pp = mv.max; }); });
  playCue('heal');
}

const STARTERS = ['cindercub', 'dewdrip', 'sproutle'];
function rowanScript() {
  const npc = G.map.npcs[0];
  if (!G.flags.gotStarter) {
    say('Elder Rowan', [
      'There you are. Late, but there.',
      'The valley is full of kin and I am full of years. One of us has to go out and look at them.',
      'Pick one. It will be yours and you will be its, and neither of you gets a say after that.',
    ], () => chooseStarter());
    return;
  }
  if (G.flags.beatVespyr) {
    say('Elder Rowan', [
      'So it went with you.',
      `Nineteen kin in this valley and you have ${dexCount(2)} of them written down in your own hand.`,
      'That is the work. There is no ceremony at the end of it — just more valley.',
      'Go on. Take them out again.',
    ]);
    return;
  }
  if (dexCount(2) >= 8) {
    say('Elder Rowan', [`${dexCount(2)} caught. You are doing better than I did.`, 'Crown Hollow, past the Warden. Something up there is worth the walk.']);
    return;
  }
  say('Elder Rowan', [`Seen ${dexCount(1)}, caught ${dexCount(2)}. Keep at it.`, 'The grass does the teaching. I only do the paperwork.']);
}

function chooseStarter() {
  G.mode = 'menu';
  openMenu('mainmenu', STARTERS.map((id) => ({
    label: DEX[id].name, sub: DEX[id].types.join('/'),
    fn: () => {
      closeMenu();
      const m = mkMon(id, 5);
      G.party.push(m);
      catchMon(id);
      G.flags.gotStarter = 1;
      G.flags.starter = id;
      G.bag.bloomorb = (G.bag.bloomorb || 0) + 5;
      G.bag.salve = (G.bag.salve || 0) + 3;
      G.mode = 'world';
      say('Elder Rowan', [
        `${DEX[id].name}. Of course.`,
        'Five orbs and three salves. That is the whole grant, do not spend it in one route.',
        'Fill the dex. Catch what you can. Come back when something surprises you.',
      ], () => { saveGame(); });
    },
  })), { title: 'Choose your kin', cancel: () => { closeMenu(); G.mode = 'world'; } });
}

// ---- battle UI ---------------------------------------------------------
function hpColor(f) { return f > .5 ? 'var(--hp-good)' : f > .22 ? 'var(--hp-warn)' : 'var(--hp-bad)'; }
function renderHUD() {
  if (HEADLESS) return;
  const b = B();
  if (!b) { show(els.hudFoe, false); show(els.hudMine, false); return; }
  const box = (m, disp, mine) => {
    const f = clamp(disp / m.max, 0, 1);
    const xpNeed = Math.max(1, xpFor(m.lvl + 1) - xpFor(m.lvl));
    return `<div class="nm"><span>${dispName(m)}${m.status ? `<span class="st">${STATUS[m.status].tag}</span>` : ''}</span><span class="lv">Lv${m.lvl}</span></div>
      <div class="types">${typeChips(m.types)}</div>
      <div class="bar"><i style="width:${f * 100}%;background:${hpColor(f)}"></i></div>
      ${mine ? `<div class="bar xp"><i style="width:${clamp((m.xp - xpFor(m.lvl)) / xpNeed, 0, 1) * 100}%"></i></div>
      <div class="hpnum">${Math.round(disp)}/${m.max}</div>` : ''}`;
  };
  els.hudFoe.innerHTML = box(b.foe, b.dispF, false);
  els.hudMine.innerHTML = box(b.mine, b.dispM, true);
  show(els.hudFoe, true); show(els.hudMine, true);
}

function openBattleMenu() {
  const b = B();
  b.await = 'menu';
  openMenu('battlemenu', [
    { label: 'Fight', fn: openMoveMenu },
    { label: 'Kin', fn: () => openScreen('party') },
    { label: 'Bag', fn: () => openScreen('bag') },
    { label: b.wild ? 'Run' : 'Forfeit', fn: () => { closeMenu(); submitTurn({ kind: 'run' }); } },
  ], { cancel: null });
}

function openMoveMenu() {
  const b = B();
  // Out of PP on everything: offer Falter rather than leave the player stuck
  // with a menu of dead options in a battle they may not be allowed to flee.
  if (!b.mine.moves.some((m) => m.pp > 0)) {
    openMenu('movemenu', [{
      label: `<span style="color:${TYPES.Wild}">●</span> Falter`, sub: '—',
      fn: () => { closeMenu(); submitTurn({ kind: 'move', id: 'falter' }); },
    }], { cancel: openBattleMenu, title: 'Nothing left' });
    return;
  }
  const rows = b.mine.moves.map((slot) => {
    const m = MOVES[slot.id];
    const eff = m.pow ? effect(m.type, b.foe.types) : 1;
    const hint = !m.pow ? '' : eff >= 2 ? ' ▲' : eff === 0 ? ' ×' : eff < 1 ? ' ▼' : '';
    return {
      label: `<span style="color:${TYPES[m.type]}">●</span> ${m.name}${hint}`,
      sub: `${slot.pp}/${slot.max}`, off: slot.pp <= 0,
      fn: () => { closeMenu(); submitTurn({ kind: 'move', id: slot.id }); },
    };
  });
  openMenu('movemenu', rows, { cancel: openBattleMenu, title: 'Moves' });
}

/** Player committed to an action: resolve the turn and play it back. */
function submitTurn(action) {
  const b = B();
  closeMenu();
  b.await = null;
  const log = doTurn(action);
  b.log = log; b.li = 0; b.hold = 0;
  if (!log.length) { openBattleMenu(); return; }
}

function playbackStep() {
  const b = B();
  const e = b.log[b.li];
  if (!e) return;
  b.tgtM = e.hpM; b.tgtF = e.hpF;
  if (e.fx === 'hit') { if (e.side === 'mine') b.flashM = .8; else b.flashF = .8; b.shake = 1; playCue('hit'); }
  if (e.fx === 'faint') playCue('faint');
  if (e.fx === 'level' || e.fx === 'learn') playCue('level');
  if (e.fx === 'caught') playCue('catch');
  if (e.fx === 'throw') { b.throwT = .6; playCue('throw'); }
  if (e.fx === 'send') b.entry = 0;
  if (!HEADLESS) {
    els.dialogue.innerHTML = e.t + '<span class="more">▼</span>';
    els.dialogue.classList.add('narrow');
    show(els.dialogue, true);
  }
  b.hold = e.fx === 'hit' || e.fx === 'faint' ? .55 : .38;
}

function finishBattle() {
  const b = B();
  const over = b.over;
  if (over === 'switch') {
    say('', [`${dispName(b.mine)} is done. Send out who?`], () => openScreen('party', { force: true }));
    return;
  }
  const done = () => {
    G.battle = null;
    if (!HEADLESS) { show(els.hudFoe, false); show(els.hudMine, false); show(els.dialogue, false); }
    G.mode = 'world';
    playCue('world');
    const evo = checkEvolve();
    if (evo) { runEvolution(evo); return; }
    saveGame();
  };
  if (over === 'win') {
    if (!b.npc) { done(); return; }        // the log already narrated a wild win
    const lines = [];
    if (b.npc) {
      lines.push(...(b.npc.trainer.lose || []));
      G.flags[b.npc.id] = 1;
      G.money += b.npc.trainer.prize;
      lines.push(`You collected ${b.npc.trainer.prize} shards.`);
      if (b.npc.block) { b.npc.gone = true; lines.push(`${b.npc.name} steps off the path.`); }
    }
    G.wins++;
    say('', lines.length ? lines : ['You won.'], done);
  } else if (over === 'caught') {
    const where = addCaught(b.foe);
    const lines = [`${b.foe.name} was added to your ${where === 'party' ? 'party' : 'box'}.`];
    if (b.legendary) { G.flags.beatVespyr = 1; lines.push('The light goes out of the hollow. It went with you.'); }
    say('', lines, done);
  } else if (over === 'fled') {
    say('', ['You got away.'], done);
  } else if (over === 'lose') {
    say('', ['Everything you have is down.', 'You carry them back to the Wayhouse on instinct.'], () => {
      const lost = Math.floor(G.money * .25);
      G.money -= lost;
      healParty();
      G.battle = null;
      if (!HEADLESS) { show(els.hudFoe, false); show(els.hudMine, false); }
      enterMap('wayhouse', 5, 5, 'down');
      G.mode = 'world';
      playCue('world');
      say('Sable', [`Sable patched them up. It cost you ${lost} shards.`, 'Go easier out there.'], () => saveGame());
    });
  } else {
    done();
  }
}

function runEvolution(m) {
  const from = m.species;
  G.evoAnim = { from, to: DEX[from].evo[0], t: 0, swapped: false };
  say('', [`${dispName(m)} is changing shape!`], () => {
    const r = evolveMon(m);
    G.evoAnim.swapped = true; G.evoAnim.t = 0;
    playCue('level');
    say('', [`${r.oldName} became ${r.newName}!`], () => {
      G.evoAnim = null;
      const next = checkEvolve();
      if (next) runEvolution(next);
      else saveGame();
    });
  });
}

function updateBattle(dt) {
  const b = B();
  b.entry = Math.min(1, b.entry + dt * 3);
  b.flashM = Math.max(0, b.flashM - dt * 3);
  b.flashF = Math.max(0, b.flashF - dt * 3);
  b.shake = Math.max(0, b.shake - dt * 4);
  if (b.throwT > 0) b.throwT = Math.max(0, b.throwT - dt);
  // HP bars chase their target so damage reads as motion, not a jump.
  const chase = (cur, tgt) => Math.abs(tgt - cur) < .6 ? tgt : cur + (tgt - cur) * Math.min(1, dt * 7);
  b.dispM = chase(b.dispM, b.tgtM); b.dispF = chase(b.dispF, b.tgtF);
  renderHUD();

  if (G.battleMsg) {
    G.battleMsg.hold = Math.max(0, G.battleMsg.hold - dt);
    if (justPressed('a') || justPressed('b')) advanceDialogue();
    return;
  }
  if (G.menu) { menuInput(); return; }
  if (G.screen) { screenInput(); return; }

  if (b.log && b.li < b.log.length) {
    b.hold = Math.max(0, (b.hold || 0) - dt);
    const settled = Math.abs(b.dispM - b.tgtM) < 1 && Math.abs(b.dispF - b.tgtF) < 1;
    if (b.li === 0 && !b.started) { b.started = true; playbackStep(); return; }
    if ((justPressed('a') || b.hold <= 0) && settled) {
      b.li++;
      if (b.li < b.log.length) playbackStep();
      else if (!HEADLESS) show(els.dialogue, false);
    }
    return;
  }
  b.started = false;
  if (b.over) { if (!b.finishing) { b.finishing = true; finishBattle(); } return; }
  if (!b.await && !G.dialogue) openBattleMenu();
}

// ---- full screens ------------------------------------------------------
function openScreen(kind, opt = {}) {
  closeMenu();
  // When you must send someone out, start the cursor on someone who can go.
  const i = opt.force && kind === 'party' ? Math.max(0, G.party.findIndex(alive)) : 0;
  G.screen = { kind, i, sel: null, opt, prev: G.mode };
  G.mode = 'screen';
  renderScreen();
}
function closeScreen() {
  const s = G.screen;
  if (!s) return;
  if (s.opt.force && s.kind === 'party') return;         // must pick a replacement
  G.screen = null;
  if (!HEADLESS) show(els.screen, false);
  if (G.battle) { G.mode = 'battle'; if (!G.battle.over) openBattleMenu(); }
  else { G.mode = 'world'; }
}

const typeChips = (types) => types.map((t) => `<span class="tp" style="background:${TYPES[t]}">${t}</span>`).join('');

/** Where a species can be found — read straight off the encounter tables. */
function habitat(id) {
  const where = [];
  for (const [mapId, map] of Object.entries(MAPS)) {
    const row = ((map.enc && map.enc.table) || []).find((e) => e[0] === id);
    if (row) where.push(`${map.name} (Lv${row[1]}–${row[2]})`);
  }
  if (where.length) return 'Found in ' + where.join(' · ');
  const from = DEX_ORDER.find((p) => DEX[p].evo && DEX[p].evo[0] === id);
  if (from) return `Evolves from ${DEX[from].name} at level ${DEX[from].evo[1]}.`;
  if (STARTERS.includes(id)) return 'A kin Elder Rowan hands out.';
  return 'Not found in the wild. Not anywhere, really.';
}

function renderScreen() {
  if (HEADLESS || !G.screen) return;
  const s = G.screen, el = els.screen;
  let html = '<div class="back">X — back</div>';
  if (s.kind === 'party') {
    html += `<h2>Your kin</h2><div class="cards">` + G.party.map((m, i) => {
      const f = m.hp / m.max;
      return `<div class="card panel ${i === s.i ? 'sel' : ''}" data-i="${i}">
        <canvas width="40" height="40" data-mon="${m.species}"></canvas>
        <div class="info"><b>${dispName(m)}</b><small>Lv${m.lvl} · ${m.types.join('/')}${m.status ? ' · ' + STATUS[m.status].tag : ''}</small>
        <div class="bar"><i style="width:${f * 100}%;background:${hpColor(f)}"></i></div>
        <small>${m.hp}/${m.max} HP</small></div></div>`;
    }).join('') + '</div>';
    if (G.party[s.i]) {
      const m = G.party[s.i];
      html += `<h2 style="margin-top:12px">${dispName(m)}</h2><div class="cards">` + m.moves.map((slot) => {
        const mv = MOVES[slot.id];
        return `<div class="card panel"><div class="info"><b style="color:${TYPES[mv.type]}">${mv.name}</b>
          <small>${mv.type} · ${mv.pow ? 'PWR ' + mv.pow : 'status'} · PP ${slot.pp}/${slot.max}</small></div></div>`;
      }).join('') + '</div>';
      html += `<p style="font-size:12px;color:var(--dim)">ATK ${m.atk} · GUARD ${m.def} · SPD ${m.spd} · EXP ${m.xp - xpFor(m.lvl)}/${xpFor(m.lvl + 1) - xpFor(m.lvl)}</p>`;
    }
    if (s.opt.force) html += '<p style="color:var(--gold);font-size:13px">Choose who steps up.</p>';
  } else if (s.kind === 'dex') {
    html += `<h2>Dex — ${dexCount(2)} caught / ${dexCount(1)} seen / ${DEX_ORDER.length}</h2><div class="dexgrid">` +
      DEX_ORDER.map((id, i) => {
        const st = G.dex[id] || 0;
        return `<div class="dexcell panel ${st ? '' : 'unseen'} ${i === s.i ? 'sel' : ''}" data-i="${i}">
          <canvas width="40" height="40" data-mon="${id}" data-sil="${st ? '' : '1'}"></canvas>
          <b>${st ? DEX[id].name : '???'}</b>
          ${st ? `<div class="types">${typeChips(DEX[id].types)}</div>` : '<small>not seen</small>'}</div>`;
      }).join('') + '</div>';
    const id = DEX_ORDER[s.i];
    if ((G.dex[id] || 0) > 0) {
      html += `<p style="font-size:.82em;max-width:520px">${DEX[id].dex}</p>`;
      html += `<p style="font-size:.75em;color:var(--dim)">${habitat(id)}</p>`;
    }
  } else if (s.kind === 'box') {
    // Party and box are one list, so a swap is just two indices.
    const monCard = (m, i) => {
      const f = m.hp / m.max;
      return `<div class="card panel ${i === s.i ? 'sel' : ''}" data-i="${i}" ${i === s.pick ? 'style="box-shadow:0 0 0 2px var(--xp)"' : ''}>
        <canvas width="40" height="40" data-mon="${m.species}"></canvas>
        <div class="info"><b>${dispName(m)}</b><small>Lv${m.lvl} · ${m.types.join('/')}</small>
        <div class="bar"><i style="width:${f * 100}%;background:${hpColor(f)}"></i></div></div></div>`;
    };
    html += `<h2>Party — ${G.party.length}/6</h2><div class="cards">` + G.party.map((m, i) => monCard(m, i)).join('') + '</div>';
    html += `<h2 style="margin-top:12px">Box — ${G.box.length}</h2>`;
    html += G.box.length ? `<div class="cards">` + G.box.map((m, i) => monCard(m, G.party.length + i)).join('') + '</div>'
      : '<p style="color:var(--dim)">Nothing stored yet.</p>';
    html += `<p style="font-size:12px;color:var(--dim)">A on a boxed kin withdraws it · A on a party kin stores it · with a full party, pick the newcomer then pick who it replaces.</p>`;
  } else if (s.kind === 'bag') {
    const list = Object.keys(G.bag).filter((k) => G.bag[k] > 0);
    s.list = list;
    html += `<h2>Bag — ${G.money} shards</h2>`;
    html += list.length ? `<div class="cards">` + list.map((k, i) => `
      <div class="card panel ${i === s.i ? 'sel' : ''}" data-i="${i}">
        <div class="info"><b>${ITEMS[k].name} ×${G.bag[k]}</b><small>${ITEMS[k].desc}</small></div></div>`).join('') + '</div>'
      : '<p style="color:var(--dim)">Empty. Even the lint.</p>';
  } else if (s.kind === 'shop') {
    const list = Object.keys(ITEMS);
    s.list = list;
    html += `<h2>Supply — ${G.money} shards</h2><div class="cards">` + list.map((k, i) => `
      <div class="card panel ${i === s.i ? 'sel' : ''}" data-i="${i}">
        <div class="info"><b>${ITEMS[k].name}</b><small>${ITEMS[k].cost} shards · ${ITEMS[k].desc}</small></div></div>`).join('') + '</div>';
  }
  el.innerHTML = html;
  show(el, true);
  el.querySelectorAll('canvas[data-mon]').forEach((c) => paintTo(c, 'creature', c.dataset.mon, 1, !!c.dataset.sil));
}

function screenInput() {
  const s = G.screen;
  if (!s) return;
  const len = s.kind === 'party' ? G.party.length : s.kind === 'dex' ? DEX_ORDER.length
    : s.kind === 'box' ? G.party.length + G.box.length : (s.list || []).length;
  let moved = false;
  const cols = s.kind === 'dex' ? 5 : 2;
  if (justPressed('left')) { s.i = (s.i + len - 1) % Math.max(1, len); moved = true; }
  if (justPressed('right')) { s.i = (s.i + 1) % Math.max(1, len); moved = true; }
  if (justPressed('up')) { s.i = clamp(s.i - cols, 0, Math.max(0, len - 1)); moved = true; }
  if (justPressed('down')) { s.i = clamp(s.i + cols, 0, Math.max(0, len - 1)); moved = true; }
  if (moved) renderScreen();
  if (justPressed('a')) screenSelect();
  if (justPressed('b')) closeScreen();
}

/**
 * Withdraw, store, or swap. The party may never empty and never exceed six, so
 * a full party turns a withdrawal into a two-tap swap.
 */
function boxSelect(s) {
  const inParty = s.i < G.party.length;
  const boxIdx = s.i - G.party.length;
  if (s.pick != null) {
    const pickBox = s.pick - G.party.length;
    if (inParty && pickBox >= 0 && G.box[pickBox]) {
      const out = G.party[s.i];
      G.party[s.i] = G.box[pickBox];
      G.box[pickBox] = out;
      setToast(`${dispName(G.party[s.i])} steps in for ${dispName(out)}.`);
    } else setToast('Pick a party kin to swap out.');
    s.pick = null;
    renderScreen();
    return;
  }
  if (inParty) {
    if (G.party.length <= 1) { setToast('You cannot travel with nobody.'); return; }
    const m = G.party.splice(s.i, 1)[0];
    G.box.push(m);
    s.i = clamp(s.i, 0, G.party.length + G.box.length - 1);
    setToast(`${dispName(m)} rests in the box.`);
  } else {
    const m = G.box[boxIdx];
    if (!m) return;
    if (G.party.length < 6) {
      G.box.splice(boxIdx, 1);
      G.party.push(m);
      setToast(`${dispName(m)} joins you.`);
    } else {
      s.pick = s.i;
      setToast(`Now pick who ${dispName(m)} replaces.`);
    }
  }
  renderScreen();
}

function screenSelect() {
  const s = G.screen;
  if (s.kind === 'party') {
    const m = G.party[s.i];
    if (!m) return;
    if (G.battle) {
      if (!alive(m)) { setToast(`${dispName(m)} cannot fight.`); return; }
      if (m === G.battle.mine && !s.opt.force) { setToast('Already out there.'); return; }
      if (s.opt.force) {
        G.battle.mine = m; m.stages = { atk: 0, def: 0, spd: 0 };
        G.battle.dispM = m.hp; G.battle.tgtM = m.hp;
        G.battle.over = null; G.battle.finishing = false; G.battle.entry = 0;
        s.opt.force = false;
        G.screen = null; if (!HEADLESS) show(els.screen, false);
        G.mode = 'battle';
        battleSay([`Go, ${dispName(m)}!`], () => openBattleMenu());
        return;
      }
      G.screen = null; if (!HEADLESS) show(els.screen, false);
      G.mode = 'battle';
      submitTurn({ kind: 'switch', idx: s.i });
      return;
    }
    setToast(`${dispName(m)} · Lv${m.lvl} · ${m.hp}/${m.max}`);
  } else if (s.kind === 'box') {
    boxSelect(s);
  } else if (s.kind === 'bag') {
    const id = (s.list || [])[s.i];
    if (!id) return;
    if (G.battle) {
      G.screen = null; if (!HEADLESS) show(els.screen, false);
      G.mode = 'battle';
      submitTurn({ kind: 'item', id });
      return;
    }
    const it = ITEMS[id];
    if (it.kind === 'orb') { setToast('Save those for the wild.'); return; }
    const target = G.party.find((m) => it.kind === 'revive' ? m.hp <= 0 : m.hp < m.max) || G.party[0];
    if (!target) return;
    if (it.kind === 'heal' && target.hp >= target.max) { setToast('Nobody needs that.'); return; }
    if (it.kind === 'revive' && target.hp > 0) { setToast('Nobody is down.'); return; }
    G.bag[id]--; if (G.bag[id] <= 0) delete G.bag[id];
    if (it.kind === 'heal') target.hp = clamp(target.hp + it.amt, 0, target.max);
    if (it.kind === 'revive') target.hp = Math.floor(target.max / 2);
    if (it.kind === 'pp') target.moves.forEach((m) => { m.pp = m.max; });
    setToast(`${dispName(target)} feels better.`);
    renderScreen();
  } else if (s.kind === 'shop') {
    const id = (s.list || [])[s.i];
    const it = ITEMS[id];
    if (G.money < it.cost) { setToast('Not enough shards.'); return; }
    G.money -= it.cost;
    G.bag[id] = (G.bag[id] || 0) + 1;
    setToast(`Bought ${it.name}.`);
    renderScreen();
  } else if (s.kind === 'dex') {
    renderScreen();
  }
}
/* ============================================================ §8 — sound ==
   A tiny square-wave sequencer. Two looping themes and a handful of cues.
   Everything is guarded: no AudioContext, no sound, no crash.
   ======================================================================== */
let AC = null, muted = false, musicTimer = null, musicStep = 0, musicTrack = 'world';

// Each theme is a set of 16-step phrases (semitone offsets from A3, 0 = rest)
// plus an order to play them in, so a loop takes four bars to come round.
const THEMES = {
  world: {
    bpm: 108, order: [0, 0, 1, 2], bass: [0, 0, 7, 7, 5, 5, 7, 7],
    lead: [
      [12, 0, 7, 0, 9, 0, 12, 14, 16, 0, 14, 0, 12, 0, 9, 0],
      [16, 0, 14, 0, 12, 0, 9, 7, 9, 0, 12, 0, 14, 0, 16, 0],
      [19, 0, 17, 16, 14, 0, 12, 0, 9, 0, 12, 14, 16, 0, 12, 0],
    ],
  },
  battle: {
    bpm: 148, order: [0, 0, 1, 0, 2, 1], bass: [0, 0, 3, 3, 5, 5, 7, 7],
    lead: [
      [12, 12, 15, 12, 19, 17, 15, 12, 10, 10, 12, 15, 17, 15, 12, 10],
      [17, 17, 19, 17, 22, 19, 17, 15, 14, 14, 15, 17, 19, 17, 15, 12],
      [24, 0, 22, 19, 17, 0, 15, 12, 10, 0, 12, 15, 17, 19, 17, 15],
    ],
  },
  shrine: {                       // only the legendary gets to sound like this
    bpm: 84, order: [0, 1], bass: [0, 0, 5, 5, 8, 8, 3, 3],
    lead: [
      [24, 0, 0, 19, 0, 0, 16, 0, 21, 0, 0, 17, 0, 0, 12, 0],
      [26, 0, 0, 21, 0, 0, 17, 0, 24, 0, 19, 0, 16, 0, 12, 0],
    ],
  },
};

function audio() {
  if (HEADLESS || muted) return null;
  if (!AC) {
    const C = window.AudioContext || window.webkitAudioContext;
    if (!C) return null;
    try { AC = new C(); } catch (e) { return null; }
  }
  if (AC.state === 'suspended') AC.resume().catch(() => {});
  return AC;
}

function blip(freq, dur, type, gain, when) {
  const ac = audio();
  if (!ac) return;
  const t = when || ac.currentTime;
  const o = ac.createOscillator(), g = ac.createGain();
  o.type = type || 'square';
  o.frequency.setValueAtTime(freq, t);
  g.gain.setValueAtTime(0, t);
  g.gain.linearRampToValueAtTime(gain || .06, t + .01);
  g.gain.exponentialRampToValueAtTime(.0001, t + dur);
  o.connect(g); g.connect(ac.destination);
  o.start(t); o.stop(t + dur + .02);
}

const note = (semi) => 220 * Math.pow(2, semi / 12);

function musicTick() {
  const th = THEMES[musicTrack];
  if (!th) return;
  const bar = Math.floor(musicStep / 16);
  const phrase = th.lead[th.order[bar % th.order.length]] || th.lead[0];
  const n = phrase[musicStep % 16];
  if (n) blip(note(n), .16, 'square', .045);
  const b = th.bass[musicStep % th.bass.length];
  if (musicStep % 2 === 0) blip(note(b - 24), .22, 'triangle', .05);
  musicStep++;
}

function startMusic(track) {
  if (HEADLESS) return;
  musicTrack = track;
  if (musicTimer) clearInterval(musicTimer);
  const th = THEMES[track];
  if (!th) return;
  musicStep = 0;
  musicTimer = setInterval(musicTick, 30000 / th.bpm);
}
function stopMusic() { if (musicTimer) { clearInterval(musicTimer); musicTimer = null; } }

function playCue(kind) {
  if (HEADLESS) return;
  const ac = audio();
  if (kind === 'battle' || kind === 'shrine' || kind === 'world') { startMusic(kind); return; }
  if (!ac) return;
  const t = ac.currentTime;
  if (kind === 'hit') blip(150, .09, 'sawtooth', .07);
  else if (kind === 'faint') { blip(220, .3, 'square', .05); blip(110, .45, 'square', .05, t + .12); }
  else if (kind === 'level') { [0, 4, 7, 12].forEach((s, i) => blip(note(12 + s), .16, 'square', .05, t + i * .07)); }
  else if (kind === 'catch') { [0, 5, 9, 14].forEach((s, i) => blip(note(12 + s), .2, 'triangle', .06, t + i * .1)); }
  else if (kind === 'throw') blip(500, .12, 'sine', .05);
  else if (kind === 'heal') { [0, 7, 12].forEach((s, i) => blip(note(12 + s), .2, 'sine', .05, t + i * .09)); }
  else if (kind === 'select') blip(660, .05, 'square', .04);
}

function toggleMute() {
  muted = !muted;
  if (muted) stopMusic(); else startMusic(musicTrack);
  setToast(muted ? 'Sound off' : 'Sound on');
}
/* ============================================================= §9 — boot ==
   Canvas scaling, input wiring, the frame loop, and the headless export the
   test suite drives.
   ======================================================================== */
let ctx = null;

function fitStage() {
  if (HEADLESS) return;
  const pad = 8;
  const raw = Math.min((window.innerWidth - pad) / VIEW_W, (window.innerHeight - pad) / VIEW_H);
  // Integer scaling keeps pixels square when there is room for it; on a phone
  // there isn't, so fill the screen instead of leaving half of it black.
  const sc = raw >= 2 ? Math.floor(raw) : Math.max(1, raw);
  const st = document.getElementById('stage');
  els.view.style.width = VIEW_W * sc + 'px';
  els.view.style.height = VIEW_H * sc + 'px';
  st.style.width = VIEW_W * sc + 'px';
  st.style.height = VIEW_H * sc + 'px';
  // Panel text is em-based, so one number scales the whole UI with the stage.
  st.style.fontSize = clamp(sc * 4.1, 11, 21) + 'px';
  const below = window.innerHeight - VIEW_H * sc;
  document.body.classList.toggle('ctlsbelow', below >= 300);
}

function draw() {
  if (!ctx) return;
  ctx.imageSmoothingEnabled = false;
  ctx.clearRect(0, 0, VIEW_W, VIEW_H);
  if (G.mode === 'title') return;
  if (G.evoAnim) drawEvolution(ctx);
  else if (G.battle) drawBattle(ctx);
  else if (G.map) drawWorld(ctx);
  if (G.fade > 0) {
    ctx.fillStyle = `rgba(8,5,12,${clamp(G.fade * 2.4, 0, 1)})`;
    ctx.fillRect(0, 0, VIEW_W, VIEW_H);
  }
  if (G.wipe > 0) {
    // Bars slide in from alternating sides, meet, then retract on the battle.
    const k = 1 - G.wipe / WIPE_T;
    const cover = clamp(k < .5 ? k * 2 : (1 - k) * 2, 0, 1);
    const bars = 8, bh = VIEW_H / bars;
    ctx.fillStyle = '#0a070e';
    for (let i = 0; i < bars; i++) {
      const w = VIEW_W * cover;
      ctx.fillRect(i % 2 ? VIEW_W - w : 0, i * bh, w, bh + 1);
    }
  }
}

/** The evolution payoff: spokes of light, a shimmer, then the new shape. */
function drawEvolution(g) {
  const a = G.evoAnim, t = a.t;
  g.fillStyle = '#120b1a';
  g.fillRect(0, 0, VIEW_W, VIEW_H);
  g.save();
  g.translate(VIEW_W / 2, 92);
  g.rotate((a.swapped ? -t : t) * .6);          // the whole wheel spins…
  g.globalAlpha = .16;
  g.fillStyle = '#ffc94d';
  for (let i = 0; i < 12; i++) {
    g.rotate(Math.PI / 6);                      // …spokes stay 30° apart
    g.beginPath(); g.moveTo(0, 0); g.lineTo(-10, -220); g.lineTo(10, -220); g.closePath(); g.fill();
  }
  g.restore();

  const id = a.swapped ? a.to : a.from;
  const s = 3;
  const bottom = artBottom(id) * s;
  // Before the change it shivers and glows; after, it lands and the glow fades.
  const flash = a.swapped ? Math.max(0, 1 - t * 1.4)
    : Math.min(.85, t * .25 + (Math.sin(t * 16) * .5 + .5) * .4);
  const jitter = a.swapped ? 0 : Math.round(Math.sin(t * 30) * 1.5);
  drawSpr(g, 'creature', id, VIEW_W / 2 - 20 * s + jitter, 128 - bottom, s, { flash });

  if (a.swapped && t < .45) {
    g.fillStyle = `rgba(255,255,255,${(1 - t / .45) * .85})`;
    g.fillRect(0, 0, VIEW_W, VIEW_H);
  }
}

function frame(now) {
  const dt = Math.min(.05, (now - (frame.last || now)) / 1000);
  frame.last = now;
  step(dt);
  draw();
  fired.clear();
  if (!HEADLESS) requestAnimationFrame(frame);
}

/** One tick of simulation. Split out so tests can drive it deterministically. */
function step(dt) {
  G.t += dt; G.dt = dt; G.playtime += dt;
  if (G.fade > 0) G.fade = Math.max(0, G.fade - dt);
  if (G.wipe > 0) G.wipe = Math.max(0, G.wipe - dt);
  if (G.evoAnim) G.evoAnim.t += dt;
  if (G.toastT > 0) {
    G.toastT -= dt;
    if (G.toastT <= 0 && !HEADLESS) els.toast.classList.remove('on');
  }
  if (justPressed('m')) toggleMute();

  if (G.mode === 'dialogue') {
    if (G.dialogue) G.dialogue.hold = Math.max(0, G.dialogue.hold - dt);
    if (justPressed('a') || justPressed('b')) advanceDialogue();
    return;
  }
  if (G.mode === 'menu') { menuInput(); return; }
  if (G.mode === 'screen') { screenInput(); return; }
  if (G.mode === 'battle') { updateBattle(dt); return; }
  if (G.mode === 'world') { updateWorld(dt); return; }
}

function newGame() {
  G.party = []; G.box = []; G.bag = {}; G.money = 500; G.dex = {}; G.flags = {};
  G.steps = 0; G.playtime = 0; G.wins = 0; G.caught = 0; G.battle = null;
  enterMap('lab', 5, 5, 'up');
  G.mode = 'world';
  updateCam();
  say('Elder Rowan', ['…and there you are. Come in, shut the door, the kin get out.'], () => {});
}

function boot() {
  if (HEADLESS) return;
  cacheEls();
  ctx = els.view.getContext('2d');
  fitStage();
  window.addEventListener('resize', fitStage);

  // keyboard
  window.addEventListener('keydown', (e) => {
    const k = KEYMAP[e.key] || e.key;
    if (KEYMAP[e.key] || e.key === 'm') e.preventDefault();
    pressKey(k);
  });
  window.addEventListener('keyup', (e) => releaseKey(KEYMAP[e.key] || e.key));

  // touch
  const padMap = { u: 'up', d: 'down', l: 'left', r: 'right' };
  const bindHold = (el, key) => {
    const on = (e) => { e.preventDefault(); pressKey(key); };
    const off = (e) => { e.preventDefault(); releaseKey(key); };
    el.addEventListener('touchstart', on, { passive: false });
    el.addEventListener('touchend', off, { passive: false });
    el.addEventListener('touchcancel', off, { passive: false });
    el.addEventListener('mousedown', on); el.addEventListener('mouseup', off); el.addEventListener('mouseleave', off);
  };
  document.querySelectorAll('#pad div').forEach((el) => {
    const cls = el.className;
    bindHold(el, padMap[cls]);
  });
  document.querySelectorAll('#btns div').forEach((el) => bindHold(el, el.dataset.k === 'z' ? 'a' : 'b'));
  window.addEventListener('touchstart', () => document.body.classList.remove('notouch'), { once: true });

  // clicks on menus / cards / dialogue
  document.addEventListener('click', (e) => {
    const row = e.target.closest && e.target.closest('.menu .row');
    if (row && G.menu) { G.menu.i = +row.dataset.i; renderMenu(); playCue('select');
      const r = G.menu.rows[G.menu.i]; if (r && !r.off && r.fn) r.fn(); return; }
    const card = e.target.closest && e.target.closest('[data-i]');
    if (card && G.screen && els.screen.contains(card)) { G.screen.i = +card.dataset.i; renderScreen(); screenSelect(); return; }
    if (e.target.closest && e.target.closest('.back')) { closeScreen(); return; }
    if (els.dialogue && !els.dialogue.classList.contains('hidden') && els.dialogue.contains(e.target)) { pressKey('a'); return; }
    if (els.view && els.view.contains(e.target) && G.mode === 'battle') pressKey('a');
  });

  // title
  const startNew = () => { show(els.title, false); wipeSave(); newGame(); playCue('world'); };
  const startCont = () => {
    show(els.title, false);
    if (!loadGame()) newGame();
    else { G.mode = 'world'; updateCam(); }
    playCue('world');
  };
  els.title.querySelector('[data-act="new"]').addEventListener('click', startNew);
  const contBtn = els.title.querySelector('[data-act="cont"]');
  if (hasSave()) show(contBtn, true);
  contBtn.addEventListener('click', startCont);

  // A parade of three kin on the title card, cycling through the roster.
  const tg = els.titleArt.getContext('2d');
  const stars = DEX_ORDER.filter((id) => ART_CREATURES[id]);
  let ti = 0;
  const spin = () => {
    tg.clearRect(0, 0, 372, 128);
    tg.imageSmoothingEnabled = false;
    if (!stars.length) return;
    for (let i = 0; i < 3; i++) {
      const id = stars[(ti + i * 5) % stars.length];
      const s = i === 1 ? 3 : 2;                         // integer scales only — centre stands forward
      const bottom = artBottom(id) * s;
      drawSpr(tg, 'creature', id, 12 + i * 124 + (i === 1 ? -8 : 0), 122 - bottom, s, { flip: i === 2 });
    }
    ti++;
  };
  spin();
  setInterval(spin, 1600);

  enterMap('hollowbrook', 9, 8, 'down');
  requestAnimationFrame(frame);
}

if (!HEADLESS) boot();

// ---- headless export ---------------------------------------------------
// The test suite drives the real functions; nothing here is a re-implementation.
if (typeof window !== 'undefined') {
  window.EK = {
    G, DEX, DEX_ORDER, MOVES, ITEMS, MAPS, TYPES, CHART, STATUS, TILE_ART, SOLID,
    ART_CREATURES, ART_TILES, ART_ACTORS,
    mkMon, refresh, movesAt, xpFor, statAt, hpAt, effect, effStat, damageOf,
    doTurn, startBattle, foeChoose, captureChance, tryCatch, addCaught,
    grantXP, checkEvolve, evolveMon, useMove, endOfTurn,
    enterMap, passable, warpAt, tileAt, npcAt, npcActive, rollEncounter, tryMove, onArrive, interact, trainerSight,
    updateWorld, updateBattle, step, draw, drawWorld, drawBattle,
    saveGame, loadGame, hasSave, wipeSave, healParty, seeMon, catchMon, dexCount,
    newGame, boot, say, openScreen, closeScreen, renderScreen, screenInput, screenSelect, boxSelect, habitat,
    talkTo, rowanScript, trainerTeam, RIVAL_PICK, sprite, artBottom, drawSpr,
    pressKey, releaseKey, keys, fired,
    setCtx: (c) => { ctx = c; },
    B,
  };
}
</script>
