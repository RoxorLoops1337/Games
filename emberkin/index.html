<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover">
<title>EMBERKIN — a creature collector</title>
<meta name="description" content="Catch, raise and battle 19 hand-drawn creatures across the Hollowbrook valley. Cute enough to want one, armed enough to respect one.">
<meta name="theme-color" content="#120d18">
<style>
  :root{
    --ink:#f5ecdd; --dim:#a99cb4; --panel:#241a2e; --panel2:#170f1f; --edge:#4a3560;
    --gold:#ffc94d; --hp-good:#5fd77a; --hp-warn:#ffcf4d; --hp-bad:#ff5a5a;
    --xp:#5fc9ff;
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ margin:0; height:100%; background:#0a070e; color:var(--ink);
    font-family:'Trebuchet MS','Segoe UI',system-ui,sans-serif; overflow:hidden; }
  body{ display:flex; align-items:center; justify-content:center; touch-action:none; }

  #stage{ position:relative; image-rendering:pixelated; font-size:16px; }
  #view{ display:block; image-rendering:pixelated; background:#0a070e; }

  /* ---------------- shared panel look ---------------- */
  .panel{
    background:linear-gradient(180deg,var(--panel),var(--panel2));
    border:2px solid var(--edge); border-radius:8px;
    box-shadow:0 4px 0 rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.08);
  }
  .hidden{ display:none !important; }

  /* ---------------- dialogue ---------------- */
  #dialogue{
    position:absolute; left:2.5%; right:2.5%; bottom:2.5%; min-height:16%;
    padding:.62em .82em; font-size:.95em; line-height:1.45; letter-spacing:.2px; z-index:6;
  }
  /* In battle the log is a single line sitting just above the hand. */
  #dialogue.narrow{ left:1.5%; right:1.5%; bottom:auto; top:62%; min-height:0; padding:4px 10px;
    font-size:.8em; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  #dialogue.narrow .more{ bottom:2px; }
  #dialogue .who{ color:var(--gold); font-weight:700; display:block; margin-bottom:2px; font-size:.8em; letter-spacing:1px; text-transform:uppercase; }
  #dialogue .more{ position:absolute; right:10px; bottom:6px; color:var(--gold); animation:bob .7s infinite; }
  @keyframes bob{ 50%{ transform:translateY(3px); } }

  /* ---------------- menus ---------------- */
  .menu{ position:absolute; z-index:7; padding:6px; min-width:118px; }
  .menu .row{
    padding:.38em .62em; cursor:pointer; border-radius:5px; font-size:.88em;
    display:flex; justify-content:space-between; gap:12px; align-items:center; white-space:nowrap;
  }
  .menu .row .sub{ color:var(--dim); font-size:.75em; }
  .menu .row.sel{ background:rgba(255,201,77,.16); box-shadow:inset 0 0 0 1px rgba(255,201,77,.5); }
  .menu .row.sel::before{ content:'▸'; color:var(--gold); margin-right:-4px; }
  .menu .row.off{ opacity:.4; }
  .menu .title{ font-size:.7em; letter-spacing:1.5px; text-transform:uppercase; color:var(--dim); padding:2px 8px 5px; }

  #mainmenu{ right:2.5%; top:2.5%; }

  /* ---------------- the hand ---------------- */
  #battlebar{ position:absolute; inset:0; z-index:6; pointer-events:none; }
  #battlebar > *{ pointer-events:auto; }
  #hand{ position:absolute; left:1.5%; right:1.5%; bottom:1.5%; height:30%; touch-action:none;
    display:flex; gap:1%; justify-content:center; align-items:flex-end; }
  .cardel{
    /* Percentage padding resolves against the hand's width, not the card's,
       which left a 32px content box inside an 82px card. Ems do not. */
    flex:0 0 18%; height:100%; border-radius:7px; padding:.5em .45em .4em;
    background:linear-gradient(180deg,#241a2e,#150e1d); border:2px solid var(--edge);
    box-shadow:0 3px 0 rgba(0,0,0,.55); cursor:pointer; position:relative; overflow:hidden;
    display:flex; flex-direction:column; gap:2%; transition:transform .12s ease, box-shadow .12s ease;
  }
  /* The card is a token: name and cost read at a glance, and the line above
     the hand carries the full rules text for whichever one you are aiming at. */
  .cardel .cn{ margin-top:.55em; font-size:.92em; font-weight:700; line-height:1.05; letter-spacing:.2px; padding-right:1.5em;
    white-space:normal; overflow-wrap:break-word; overflow:hidden; }
  .cardel .ct{ font-size:.66em; color:var(--dim); line-height:1.15; flex:1; overflow:hidden; }
  .cardel .cc{ position:absolute; right:.35em; top:.3em; width:1.5em; height:1.5em; border-radius:50%;
    background:#0d0812; border:1px solid var(--gold); color:var(--gold); font-size:.72em;
    display:flex; align-items:center; justify-content:center; font-weight:700; }
  .cardel .cg{ position:absolute; right:.35em; bottom:.3em; font-size:.68em; color:var(--hp-good); font-weight:700; }
  .cardel .ck{ position:absolute; left:.4em; top:.25em; font-size:.58em; color:var(--dim); font-weight:700; }
  .cardel .cp{ position:absolute; left:0; right:0; bottom:.25em; text-align:center;
    font-size:.62em; letter-spacing:1px; color:var(--gold); text-transform:uppercase; }
  .cardel .cr{ position:absolute; left:0; top:0; bottom:0; width:4px; }
  .cardel.sel{ transform:translateY(-8%); box-shadow:0 0 0 2px var(--gold), 0 6px 0 rgba(0,0,0,.55); }
  .cardel.dead{ opacity:.4; }
  .cardel.willplay{ box-shadow:0 0 0 3px var(--gold), 0 0 22px rgba(255,201,77,.5); }
  .cardel.kin .cn{ color:var(--gold); }

  #energy{ position:absolute; left:1.5%; top:53%; padding:3px 9px; font-size:1em; color:var(--gold); }
  #energy small{ color:var(--dim); font-size:.7em; }
  #piles{ position:absolute; left:13%; top:54%; padding:3px 8px; font-size:.72em; color:var(--dim); }
  #acts{ position:absolute; right:1.5%; top:54%; display:flex; gap:4px; }
  #acts .abtn{ padding:3px 9px; font-size:.72em; border-radius:5px; cursor:pointer;
    background:linear-gradient(180deg,var(--panel),var(--panel2)); border:2px solid var(--edge); }
  #acts .abtn .key{ color:var(--gold); }
  /* Nothing left you can pay for — say so rather than let the player hunt. */
  #acts .abtn.nag{ border-color:var(--gold); color:var(--gold); animation:nag 1s ease-in-out infinite; }
  @keyframes nag{ 50%{ box-shadow:0 0 10px rgba(255,201,77,.5); } }
  /* Fingers need more to hit than a mouse does. */
  body.touch #acts .abtn{ padding:7px 14px; font-size:.8em; }
  body.touch #acts{ gap:7px; }
  #intent{ position:absolute; left:3%; top:14%; padding:3px 9px; font-size:.72em; z-index:6; }
  #intent b{ color:var(--hp-bad); }
  #shieldpip{ color:var(--xp); }

  #battlemenu{ right:2.5%; top:54%; }
  #movemenu{ left:2.5%; bottom:2.5%; right:32%; }
  #movemenu .row{ justify-content:space-between; }

  /* ---------------- battle HUD ---------------- */
  .hud{ position:absolute; z-index:5; width:44%; padding:6px 8px 7px; }
  #hudFoe{ left:3%; top:2%; }
  #hudMine{ right:3%; top:35%; }
  .hud .nm{ font-size:.82em; font-weight:700; display:flex; justify-content:space-between; gap:8px; }
  .hud .nm .lv{ color:var(--gold); font-size:.75em; }
  .hud .bar{ height:7px; border-radius:4px; background:#0d0812; margin-top:4px; overflow:hidden; border:1px solid #000; }
  .hud .bar > i{ display:block; height:100%; background:var(--hp-good); transition:width .35s ease, background .35s; }
  .hud .xp{ height:3px; margin-top:3px; }
  .hud .xp > i{ background:var(--xp); }
  .hud .hpnum{ font-size:.7em; color:var(--dim); text-align:right; margin-top:2px; }
  .hud .st{ font-size:.62em; letter-spacing:1px; text-transform:uppercase; padding:1px 5px; border-radius:3px;
    background:#000; color:var(--gold); margin-left:5px; }
  .balls{ display:flex; gap:2px; margin-top:4px; }
  .balls i{ width:7px; height:7px; border-radius:50%; background:var(--gold); box-shadow:0 0 0 1px #000; }
  .balls i.out{ background:#4a3560; }

  /* ---------------- full-screen screens (party / dex / bag) ---------------- */
  #screen{
    position:absolute; inset:0; z-index:9; padding:12px; overflow:auto;
    background:linear-gradient(180deg,#1a1222fa,#0d0913fd); backdrop-filter:blur(3px);
    touch-action:pan-y; -webkit-overflow-scrolling:touch; overscroll-behavior:contain;
  }
  #screen h2{ margin:2px 0 10px; font-size:1em; letter-spacing:2px; text-transform:uppercase; color:var(--gold); }
  #screen .back{ position:absolute; right:12px; top:10px; font-size:.78em; color:var(--dim); cursor:pointer; }
  .cards{ display:grid; grid-template-columns:repeat(auto-fill,minmax(210px,1fr)); gap:8px; }
  .card{ display:flex; gap:8px; padding:7px; align-items:center; cursor:pointer; }
  .card.sel{ box-shadow:0 0 0 2px var(--gold), 0 4px 0 rgba(0,0,0,.5); }
  /* Canvases are authored at 1:1 and blown up by an integer factor in CSS so
     the pixels stay square — never resize the backing store to a fraction. */
  .card canvas{ image-rendering:pixelated; flex:0 0 auto; width:80px; height:80px; }
  .card .info{ flex:1; min-width:0; }
  .card .info b{ display:block; font-size:.82em; }
  .card .info small{ color:var(--dim); font-size:.7em; }
  .card .bar{ height:5px; border-radius:3px; background:#0d0812; margin-top:4px; overflow:hidden; }
  .card .bar > i{ display:block; height:100%; background:var(--hp-good); }
  .chest{ flex:0 0 auto; width:34px; height:28px; border-radius:4px; position:relative;
    background:linear-gradient(180deg,var(--tint),#0000), #2a1f36;
    border:2px solid #1a1222; box-shadow:inset 0 -6px 0 rgba(0,0,0,.35); }
  .chest::before{ content:''; position:absolute; left:-2px; right:-2px; top:7px; height:4px;
    background:#1a1222; }
  .chest::after{ content:''; position:absolute; left:50%; top:5px; width:6px; height:9px;
    margin-left:-3px; border-radius:2px; background:var(--tint); box-shadow:0 0 0 2px #1a1222; }
  .dexgrid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(96px,1fr)); gap:6px; }
  .dexcell{ padding:5px; text-align:center; cursor:pointer; }
  .dexcell canvas{ image-rendering:pixelated; width:80px; height:80px; }
  .dexcell b{ display:block; font-size:.7em; margin-top:2px; }
  .dexcell.unseen{ opacity:.35; }
  .dexcell small{ color:var(--dim); font-size:.65em; }
  .types{ display:flex; gap:4px; justify-content:center; margin-top:3px; }
  .hud .types{ justify-content:flex-start; margin:3px 0 1px; }
  .hud .tp{ font-size:.55em; padding:0 4px; }
  .tp{ font-size:.58em; letter-spacing:1px; text-transform:uppercase; padding:1px 5px; border-radius:3px; color:#120d18; font-weight:700; }

  /* ---------------- title ---------------- */
  #title{ position:absolute; inset:0; z-index:12; display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:14px; text-align:center; padding:20px;
    background:radial-gradient(120% 90% at 50% 20%,#3a1c3f,#0c0812 70%); }
  #title h1{ margin:0; font-size:clamp(30px,9vw,58px); letter-spacing:8px; color:var(--gold);
    text-shadow:0 3px 0 #7a3f13, 0 0 26px rgba(255,201,77,.45); }
  #title p{ margin:0; color:var(--dim); font-size:13px; letter-spacing:2px; text-transform:uppercase; }
  #title .btn{ padding:9px 20px; font-size:15px; cursor:pointer; letter-spacing:1px; }
  #title .btn:hover{ background:rgba(255,201,77,.16); }
  #titleArt{ image-rendering:pixelated; }

  /* ---------------- touch controls ---------------- */
  /* ---------------- touch controls ----------------
     The pad and the buttons live outside the stage so they can take the
     margins the game does not use — the left gutter in landscape, the band
     under the stage in portrait — and only overlay the game when there is
     nowhere else for them to go. */
  /* Portrait puts the game at the top so the band underneath is all controls. */
  body.topalign{ align-items:flex-start; padding-top:4vh; }
  #pad, #btns{ position:fixed; z-index:20; display:none; touch-action:none; user-select:none; }
  body.touch #pad, body.touch #btns{ display:block; }

  body.ctl-side #pad{ left:0; top:0; bottom:0; width:var(--gutter,120px); }
  body.ctl-side #btns{ right:0; top:0; bottom:0; width:var(--gutter,120px); }
  body.ctl-below #pad{ left:0; width:50%; bottom:0; top:var(--stagebot,60%); }
  body.ctl-below #btns{ right:0; width:50%; bottom:0; top:var(--stagebot,60%); }
  body.ctl-overlay #pad{ left:0; bottom:0; width:36%; height:46%; }
  body.ctl-overlay #btns{ right:0; bottom:0; width:30%; height:34%; }

  /* The stick is wherever your thumb lands, not where the layout guessed. */
  #stick{ position:absolute; width:120px; height:120px; margin:-60px 0 0 -60px; border-radius:50%;
    border:2px solid var(--edge); background:rgba(30,22,40,.45); opacity:0; transition:opacity .12s;
    pointer-events:none; }
  #stick.on{ opacity:.9; }
  #knob{ position:absolute; left:50%; top:50%; width:52px; height:52px; margin:-26px 0 0 -26px;
    border-radius:50%; background:linear-gradient(180deg,#4a3560,#241a2e); border:2px solid var(--gold);
    box-shadow:0 0 12px rgba(255,201,77,.3); }
  body.touch #pad::after{ content:'move'; position:absolute; left:0; right:0; bottom:8%;
    text-align:center; font-size:12px; letter-spacing:2px; color:#4a3560; text-transform:uppercase; }

  #btns .rbtn{ position:absolute; left:50%; width:82px; height:82px; margin-left:-41px;
    border-radius:50%; background:linear-gradient(180deg,#2b2038,#171021); border:2px solid var(--edge);
    display:flex; align-items:center; justify-content:center; font-size:14px; font-weight:700;
    letter-spacing:.5px; color:var(--ink); box-shadow:0 4px 0 rgba(0,0,0,.5); }
  #btns .rbtn:active{ transform:translateY(2px); box-shadow:0 2px 0 rgba(0,0,0,.5); }
  #btns .rbtn[data-k="z"]{ bottom:calc(50% - 96px); border-color:var(--gold); color:var(--gold); }
  #btns .rbtn[data-k="x"]{ bottom:calc(50% + 10px); }
  /* Portrait: put the controls in the middle of the band, not at its floor. */
  body.ctl-below #btns .rbtn{ bottom:auto; top:50%; margin-top:-41px; }
  body.ctl-below #btns .rbtn[data-k="z"]{ left:68%; }
  body.ctl-below #btns .rbtn[data-k="x"]{ left:26%; }
  body.ctl-below #pad::after{ bottom:auto; top:calc(50% - 8px); }
  body.ctl-overlay #btns .rbtn{ width:64px; height:64px; margin-left:-32px; font-size:12px; }

  /* Fullscreen: a corner button, out of the way until you want it. */
  #fsbtn{ position:fixed; right:8px; top:8px; z-index:22; width:34px; height:34px; border-radius:8px;
    background:rgba(36,26,46,.75); border:2px solid var(--edge); color:var(--dim);
    display:flex; align-items:center; justify-content:center; font-size:17px; cursor:pointer; }
  #fsbtn:hover{ color:var(--gold); border-color:var(--gold); }
  body.fs #fsbtn{ color:var(--gold); }

  #toast{ position:absolute; left:50%; top:27%; transform:translateX(-50%); z-index:11; padding:6px 14px;
    font-size:.82em; letter-spacing:1px; opacity:0; transition:opacity .25s; pointer-events:none; }
  #toast.on{ opacity:1; }
</style>
</head>
<body class="notouch">
<div id="stage">
  <canvas id="view" width="256" height="208"></canvas>

  <div id="hudFoe" class="hud panel hidden"></div>
  <div id="hudMine" class="hud panel hidden"></div>

  <div id="intent" class="panel hidden"></div>
  <div id="battlebar" class="hidden">
    <div id="energy" class="panel"><b>3</b><small>/3</small></div>
    <div id="piles" class="panel"></div>
    <div id="acts"></div>
    <div id="hand"></div>
  </div>

  <div id="dialogue" class="panel hidden"></div>
  <div id="mainmenu" class="menu panel hidden"></div>
  <div id="battlemenu" class="menu panel hidden"></div>
  <div id="movemenu" class="menu panel hidden"></div>
  <div id="screen" class="hidden"></div>
  <div id="toast" class="panel"></div>


  <div id="title">
    <canvas id="titleArt" width="372" height="128"></canvas>
    <h1>EMBERKIN</h1>
    <p>cute enough to want one · armed enough to respect one</p>
    <div class="btn panel" data-act="new">New journey</div>
    <div class="btn panel hidden" data-act="cont">Continue</div>
    <p style="font-size:11px;letter-spacing:1px;text-transform:none">arrows / WASD move · Z or Enter acts · X opens the menu · M mutes</p>
    <p style="font-size:11px;letter-spacing:1px;text-transform:none">in a fight: ← → pick a card · ↑ or Z plays it · 1-5 plays one outright · E ends the turn</p>
  </div>
</div>

<div id="pad"><div id="stick"><i id="knob"></i></div></div>
<div id="btns">
  <div class="rbtn" data-k="x">Menu</div>
  <div class="rbtn" data-k="z">Talk</div>
</div>
<div id="fsbtn" title="Fullscreen">⛶</div>

   ======================================================================== */
const HEADLESS = typeof window !== 'undefined' && !!window.__EK_HEADLESS__;
const SAVE_KEY = 'emberkin_save_v1';

const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const rnd = (n) => Math.floor(Math.random() * n);           // 0..n-1
const rrange = (a, b) => a + rnd(b - a + 1);                 // inclusive
const chance = (p) => Math.random() < p;

// The whole game lives here. `mode` drives the input router and the renderer.
const G = {
  mode: 'title',           // title | world | battle | screen | dialogue
  t: 0, dt: 0,
  map: null, mapId: '',
  player: { x: 5, y: 8, dir: 'down', px: 5, py: 8, moveT: 0, moveLen: 1, step: 0, bump: 0, hop: false },
  fade: 0, wipe: 0, evoAnim: null, alert: null, prevMode: 'world',
  party: [], box: [], bag: {}, money: 500, gems: 0,
  cards: [], deck: [], nextUid: 0, chestsOpened: 0,
  dex: {},                 // id -> 1 seen, 2 caught
  flags: {},               // story progress
  battle: null,
  dialogue: null,
  screen: null,
  menu: null,
  toastT: 0,
  steps: 0, playtime: 0, wins: 0, caught: 0,
};

const setToast = (msg) => {
  G.toastT = 2.2;
  if (!HEADLESS) { const el = document.getElementById('toast'); el.textContent = msg; el.classList.add('on'); }
};

// ---- save / load -------------------------------------------------------
// One JSON blob. Creatures are stored lean (species + level + hp + moves +
// xp) and rehydrated through mkMon so a stat formula change never needs a
// save migration.
function saveGame() {
  const packMon = (m) => ({ s: m.species, l: m.lvl, hp: m.hp, xp: m.xp, mv: m.moves.map((x) => [x.id, x.pp]), nm: m.nick || '', st: m.status || '' });
  const blob = {
    v: 2, map: G.mapId, x: G.player.x, y: G.player.y, dir: G.player.dir,
    party: G.party.map(packMon), box: G.box.map(packMon),
    bag: G.bag, money: G.money, gems: G.gems, dex: G.dex, flags: G.flags,
    cards: G.cards.map((c) => [c.u, c.id, c.plus, c.plays, c.kills]),
    deck: G.deck, uid: G.nextUid, chests: G.chestsOpened,
    steps: G.steps, playtime: Math.round(G.playtime), wins: G.wins, caught: G.caught,
  };
  try { localStorage.setItem(SAVE_KEY, JSON.stringify(blob)); return true; }
  catch (e) { return false; }
}

function hasSave() {
  try { return !!localStorage.getItem(SAVE_KEY); } catch (e) { return false; }
}

function loadGame() {
  let blob;
  try { blob = JSON.parse(localStorage.getItem(SAVE_KEY) || 'null'); } catch (e) { blob = null; }
  if (!blob || !blob.party) return false;
  const unpack = (p) => {
    const m = mkMon(p.s, p.l);
    if (!m) return null;
    m.hp = clamp(p.hp, 0, m.max); m.xp = p.xp || 0;
    m.nick = p.nm || ''; m.status = p.st || '';
    if (Array.isArray(p.mv) && p.mv.length) {
      m.moves = p.mv.filter((x) => MOVES[x[0]]).map((x) => ({ id: x[0], pp: x[1], max: MOVES[x[0]].pp }));
    }
    return m;
  };
  G.party = (blob.party || []).map(unpack).filter(Boolean);
  G.box = (blob.box || []).map(unpack).filter(Boolean);
  G.bag = blob.bag || {}; G.money = blob.money ?? 500; G.gems = blob.gems ?? 0;
  // Cards carry their own permanent growth, so they round-trip per copy.
  G.cards = (blob.cards || []).filter((c) => CARDS[c[1]])
    .map((c) => ({ u: c[0], id: c[1], plus: c[2] || 0, plays: c[3] || 0, kills: c[4] || 0 }));
  G.nextUid = blob.uid || G.cards.reduce((m, c) => Math.max(m, c.u), 0);
  G.deck = (blob.deck || []).filter((u) => G.cards.some((c) => c.u === u));
  G.chestsOpened = blob.chests || 0;
  if (!G.cards.length) { STARTER_DECK.forEach(grantCard); }
  G.dex = blob.dex || {}; G.flags = blob.flags || {};
  G.steps = blob.steps || 0; G.playtime = blob.playtime || 0;
  G.wins = blob.wins || 0; G.caught = blob.caught || 0;
  enterMap(blob.map || 'hollowbrook', blob.x ?? 5, blob.y ?? 8, blob.dir || 'down');
  return G.party.length > 0;
}

function wipeSave() { try { localStorage.removeItem(SAVE_KEY); } catch (e) {} }

   Every card has one growable number, `v`, and `vt` says what that number is.
   Growth is the point of the system:
     grow    — permanent, kept in the save, the card gets stronger forever
     bgrow   — grows while the battle lasts, resets after
     kill    — permanent, but only when this card lands the killing blow
     exhaust — one use, then out of the deck for the rest of the battle
   ======================================================================== */

const CARD_IDS = Object.keys(CARDS);

/**
 * How far a card may grow. Growth is the fun of the system, so the ceiling is
 * generous — several times the card's own value — but it exists, because a
 * card that grows forever eventually plays the game for you.
 */
const growCap = (id) => Math.round(CARDS[id].v * (CARDS[id].capMul || 4));

/** The live value of a card: its base, its permanent growth, its battle growth. */
const cardValue = (inst) => {
  const c = CARDS[inst.id];
  return Math.max(0, c.v + (inst.plus || 0) + (inst.bg || 0));
};

/** Add permanent growth to an owned copy, up to its ceiling. Returns the gain. */
function growCard(owned, amount) {
  const cap = growCap(owned.id);
  const before = owned.plus || 0;
  owned.plus = Math.min(cap, before + amount);
  return owned.plus - before;
}

const cardText = (inst) => CARDS[inst.id].txt.replace('{v}', cardValue(inst));

/** Cards are owned as individual copies, because each one grows on its own. */
function mkCard(id) {
  G.nextUid = (G.nextUid || 1) + 1;
  return { u: G.nextUid, id, plus: 0, plays: 0, kills: 0 };
}

const ownedCard = (u) => G.cards.find((c) => c.u === u) || null;
const deckCards = () => G.deck.map(ownedCard).filter(Boolean);

const STARTER_DECK = ['strike', 'strike', 'strike', 'strike', 'guard', 'guard', 'guard', 'focus', 'vigor', 'jab'];
const DECK_MIN = 8, DECK_MAX = 24;

function grantCard(id) {
  const c = mkCard(id);
  G.cards.push(c);
  if (G.deck.length < DECK_MAX) G.deck.push(c.u);
  return c;
}

// ---- chests ------------------------------------------------------------
// Costs climb steeply; odds shift toward the top of the table as they do.
const CHESTS = {
  silver:  { name: 'Silver Chest',  cost: 60,   pulls: 3, odds: { common: 80, rare: 17, epic: 3, legendary: 0 } },
  gold:    { name: 'Gold Chest',    cost: 180,  pulls: 3, odds: { common: 55, rare: 33, epic: 11, legendary: 1 } },
  diamond: { name: 'Diamond Chest', cost: 540,  pulls: 3, odds: { common: 25, rare: 40, epic: 28, legendary: 7 } },
  prism:   { name: 'Prism Chest',   cost: 1620, pulls: 4, odds: { common: 5, rare: 30, epic: 45, legendary: 20 } },
};
const CHEST_IDS = Object.keys(CHESTS);

function rollRarity(odds) {
  const total = RARITY_ORDER.reduce((s, r) => s + (odds[r] || 0), 0);
  let n = Math.random() * total;
  for (const r of RARITY_ORDER) {
    n -= odds[r] || 0;
    if (n <= 0) return r;
  }
  return 'common';
}

const cardsOfRarity = (r) => CARD_IDS.filter((id) => CARDS[id].r === r);

/** Open a chest. Returns the card instances granted, or null if you can't pay. */
function openChest(kind) {
  const ch = CHESTS[kind];
  if (!ch || G.gems < ch.cost) return null;
  G.gems -= ch.cost;
  const got = [];
  for (let i = 0; i < ch.pulls; i++) {
    let r = rollRarity(ch.odds);
    let pool = cardsOfRarity(r);
    while (!pool.length) { r = RARITY_ORDER[Math.max(0, RARITY_ORDER.indexOf(r) - 1)]; pool = cardsOfRarity(r); }
    got.push(grantCard(pool[rnd(pool.length)]));
  }
  G.chestsOpened = (G.chestsOpened || 0) + 1;
  return got;
}

/** Gems for winning: wild kin are pocket change, trainers pay properly. */
function gemReward(b) {
  if (b.npc) return 6 + Math.floor(b.npc.trainer.prize / 120) + rrange(0, 4);
  return 1 + rrange(0, 2) + (b.legendary ? 40 : 0);
}

// ---- levels, stats, creatures -----------------------------------------
const xpFor = (lvl) => Math.floor(0.8 * lvl * lvl * lvl);
const statAt = (base, lvl) => Math.floor(base * 2 * lvl / 100) + 5;
const hpAt = (base, lvl) => Math.floor(base * 2 * lvl / 100) + lvl + 10;

/** Moves a species knows by `lvl` — the last four it learned. */
function movesAt(id, lvl) {
  const sp = DEX[id];
  const known = sp.learn.filter((e) => e[0] <= lvl).map((e) => e[1]);
  const uniq = [...new Set(known)];
  return uniq.slice(-4).map((m) => ({ id: m, pp: MOVES[m].pp, max: MOVES[m].pp }));
}

/** Build a fresh creature. Everything derived (stats, moves) comes from here. */
function mkMon(id, lvl, opts = {}) {
  const sp = DEX[id];
  if (!sp) return null;
  const m = {
    species: id, name: sp.name, nick: opts.nick || '', lvl,
    types: sp.types.slice(),
    atk: statAt(sp.base[1], lvl), def: statAt(sp.base[2], lvl), spd: statAt(sp.base[3], lvl),
    max: hpAt(sp.base[0], lvl), hp: 0,
    xp: xpFor(lvl), status: '', moves: movesAt(id, lvl),
    stages: { atk: 0, def: 0, spd: 0 },
  };
  m.hp = m.max;
  return m;
}

/** Recompute stats after a level-up, keeping damage taken proportional. */
function refresh(m) {
  const sp = DEX[m.species];
  const oldMax = m.max;
  m.max = hpAt(sp.base[0], m.lvl);
  m.atk = statAt(sp.base[1], m.lvl);
  m.def = statAt(sp.base[2], m.lvl);
  m.spd = statAt(sp.base[3], m.lvl);
  // A level-up hands over the HP it added. Clamped at both ends: if this mon is
  // carrying a maximum bigger than its stats say it should — a caught foe still
  // holding the battle pool, an old save — the correction must not push it
  // through zero and faint a creature that was standing up a moment ago.
  m.hp = clamp(m.hp + (m.max - oldMax), m.hp > 0 ? 1 : 0, m.max);
  m.types = sp.types.slice();
}

const dispName = (m) => m.nick || m.name;
const alive = (m) => m.hp > 0;
const firstAlive = () => G.party.find(alive) || null;
const partyAlive = () => G.party.some(alive);

/** Effective stat including battle stages (−6…+6) and status. */
function effStat(m, key) {
  const st = clamp(m.stages ? m.stages[key] || 0 : 0, -6, 6);
  const mul = st >= 0 ? (2 + st) / 2 : 2 / (2 - st);
  let v = m[key] * mul;
  const b = G.battle;
  if (b && b.mine === m && b.mods && b.mods[key]) v += b.mods[key];   // card buffs
  if (key === 'atk' && m.status === 'burn') v *= .85;
  if (key === 'spd' && m.status === 'chill') v *= .5;
  return Math.max(1, Math.floor(v));
}

// A room interior: plain walls, floor, and a door pair on the bottom wall.
const interior = (w, h) => {
  const rows = [];
  rows.push('W'.repeat(w));
  for (let y = 1; y < h - 2; y++) rows.push('W' + '='.repeat(w - 2) + 'W');
  const dx = (w >> 1) - 1;
  rows.push('W' + '='.repeat(dx - 1) + 'DD' + '='.repeat(w - 3 - dx) + 'W');
  rows.push('W'.repeat(w));
  return rows;
};

const tileAt = (map, x, y) => (x < 0 || y < 0 || y >= map.rows.length || x >= map.rows[0].length) ? '#' : map.rows[y][x];

/** An NPC is on the map once its story beat is live and until it walks off. */
const npcActive = (n) => !n.gone && (!n.requires || !!G.flags[n.requires]);

function npcAt(map, x, y) {
  return (map.npcs || []).find((n) => n.x === x && n.y === y && npcActive(n)) || null;
}

/** Can the player step from (fx,fy) to (x,y)? Ledges are one-way, downward. */
function passable(map, x, y, fromY) {
  const t = tileAt(map, x, y);
  if (t === 'L') return y > fromY;         // hop down only
  if (SOLID.has(t)) return false;
  if (npcAt(map, x, y)) return false;
  return true;
}

function warpAt(map, x, y) { return (map.warps || []).find((w) => w.x === x && w.y === y) || null; }

function enterMap(id, x, y, dir) {
  const m = MAPS[id] || MAPS.hollowbrook;
  G.mapId = MAPS[id] ? id : 'hollowbrook';
  G.map = m;
  G.player.x = G.player.px = x; G.player.y = G.player.py = y;
  G.player.dir = dir || G.player.dir; G.player.moveT = 0;
  G.alert = null;
  return m;
}

/** Roll the encounter table; returns a fresh wild creature or null. */
function rollEncounter(map) {
  if (!map.enc) return null;
  const total = map.enc.table.reduce((s, e) => s + e[3], 0);
  let r = Math.random() * total;
  for (const [id, lo, hi, w] of map.enc.table) {
    r -= w;
    if (r <= 0) return mkMon(id, rrange(lo, hi));
  }
  const e = map.enc.table[0];
  return mkMon(e[0], rrange(e[1], e[2]));
}
/* =========================================================== §4 — sprites ==
   Art arrives as {p: palette, r: rows-of-chars}. Each sprite is painted once
   into an offscreen canvas at 1:1 and then blitted scaled with smoothing off.
   Missing art must never break anything — every lookup falls back.
   ======================================================================== */
const SPR = { creature: ART_CREATURES, tile: ART_TILES, actor: ART_ACTORS };
const sprCache = new Map();

function mkCanvas(w, h) {
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  return c;
}

/** Paint a char-grid def into a canvas. `mode` 'sil' renders a flat shadow. */
function rasterize(def, mode) {
  const rows = def.r, h = rows.length, w = rows[0].length;
  const c = mkCanvas(w, h);
  const g = c.getContext('2d');
  for (let y = 0; y < h; y++) {
    const row = rows[y];
    let x = 0;
    while (x < w) {
      const ch = row[x];
      if (ch === '.' || ch === ' ') { x++; continue; }
      let run = 1;
      while (x + run < w && row[x + run] === ch) run++;   // fill runs, not pixels
      g.fillStyle = mode === 'sil' ? '#1b1224' : (def.p[ch] || '#ff00ff');
      g.fillRect(x, y, run, 1);
      x += run;
    }
  }
  return c;
}

function sprite(kind, id, mode) {
  const key = kind + ':' + id + (mode || '');
  if (sprCache.has(key)) return sprCache.get(key);
  const def = (SPR[kind] || {})[id];
  let c = null;
  if (def && def.r && def.r.length) {
    try { c = rasterize(def, mode); } catch (e) { c = null; }
  }
  sprCache.set(key, c);
  return c;
}

const hasArt = (kind, id) => !!((SPR[kind] || {})[id]);

/**
 * Blit a sprite. x,y is the top-left in canvas pixels; scale is an integer so
 * pixels stay square. When art is missing we draw a soft placeholder blob in
 * the creature's type colour rather than nothing.
 */
function drawSpr(g, kind, id, x, y, scale = 1, opt = {}) {
  const c = sprite(kind, id, opt.sil ? 'sil' : '');
  if (!c) { placeholder(g, kind, id, x, y, scale); return; }
  const w = c.width * scale, h = c.height * scale;
  g.save();
  if (opt.alpha != null) g.globalAlpha = opt.alpha;
  // Flipping is a transform, so the blit below is written once for both cases.
  if (opt.flip) { g.translate(x + w, y); g.scale(-1, 1); } else { g.translate(x, y); }
  g.drawImage(c, 0, 0, w, h);
  if (opt.flash > 0) {                   // additive re-blit reads as a hit flash
    g.globalCompositeOperation = 'lighter';
    g.globalAlpha = clamp(opt.flash, 0, 1) * .9;
    g.drawImage(c, 0, 0, w, h);
  }
  g.restore();
}

function placeholder(g, kind, id, x, y, scale) {
  const size = (kind === 'creature' ? 40 : kind === 'tile' ? 16 : 22) * scale;
  const sp = DEX[id];
  g.save();
  g.fillStyle = sp ? TYPES[sp.types[0]] : '#4a3560';
  g.globalAlpha = .85;
  const w = size, h = size;
  g.beginPath();
  if (g.ellipse) g.ellipse(x + w / 2, y + h * .62, w * .34, h * .3, 0, 0, Math.PI * 2);
  else g.rect(x + w * .2, y + h * .35, w * .6, h * .5);
  g.fill();
  g.fillStyle = '#1b1224';
  g.fillRect(x + w * .38, y + h * .5, Math.max(1, w * .06), Math.max(1, h * .06));
  g.fillRect(x + w * .56, y + h * .5, Math.max(1, w * .06), Math.max(1, h * .06));
  g.restore();
}

/** Height of a creature's drawn pixels — used to sit sprites on the ground. */
function artBottom(id) {
  const def = ART_CREATURES[id];
  if (!def) return 40;
  for (let y = def.r.length - 1; y >= 0; y--) {
    if (/[^. ]/.test(def.r[y])) return y + 1;
  }
  return 40;
}

/** Draw a creature into a small DOM canvas (party/dex cards). */
function paintTo(canvas, kind, id, scale, sil) {
  if (HEADLESS || !canvas || !canvas.getContext) return;
  const g = canvas.getContext('2d');
  g.imageSmoothingEnabled = false;
  g.clearRect(0, 0, canvas.width, canvas.height);
  drawSpr(g, kind, id, 0, 0, scale, { sil });
}
/* ========================================================= §5 — overworld ==
   Grid movement with a short tween per step, encounters rolled on arrival in
   tall grass, warps on arrival, and A-button interaction with whatever the
   player is facing.
   ======================================================================== */
const VIEW_W = 256, VIEW_H = 208;
const STEP_TIME = .15;
const WIPE_T = .55;                    // battle-entry wipe, seconds
const DIRS = { up: [0, -1], down: [0, 1], left: [-1, 0], right: [1, 0] };

const keys = new Set();       // held
const fired = new Set();      // pressed this frame, consumed by handlers
const held = (k) => keys.has(k);
const justPressed = (k) => fired.has(k);

const KEYMAP = {
  ArrowUp: 'up', ArrowDown: 'down', ArrowLeft: 'left', ArrowRight: 'right',
  w: 'up', s: 'down', a: 'left', d: 'right', W: 'up', S: 'down', A: 'left', D: 'right',
  z: 'a', Z: 'a', Enter: 'a', ' ': 'a',
  x: 'b', X: 'b', Escape: 'b', Backspace: 'b',
};

function pressKey(k) { if (!keys.has(k)) fired.add(k); keys.add(k); }

/** Which way a stick pull counts as, or null inside the dead zone. */
function stickDir(dx, dy, dead = 14) {
  if (Math.hypot(dx, dy) < dead) return null;
  return Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'right' : 'left') : (dy > 0 ? 'down' : 'up');
}

/** Go fullscreen, or come back. Silently fine on browsers that refuse. */
function toggleFullscreen() {
  if (HEADLESS) return false;
  const doc = document, el = doc.documentElement;
  const on = doc.fullscreenElement || doc.webkitFullscreenElement;
  try {
    if (!on) {
      const req = el.requestFullscreen || el.webkitRequestFullscreen;
      if (!req) { setToast('This browser will not go fullscreen.'); return false; }
      const r = req.call(el);
      if (r && r.catch) r.catch(() => setToast('Fullscreen was refused.'));
    } else {
      const exit = doc.exitFullscreen || doc.webkitExitFullscreen;
      if (exit) exit.call(doc);
    }
  } catch (e) { return false; }
  return true;
}
function releaseKey(k) { keys.delete(k); }

const cam = { x: 0, y: 0 };
function updateCam() {
  const mw = G.map.rows[0].length * TILE, mh = G.map.rows.length * TILE;
  const cx = (G.player.px + .5) * TILE - VIEW_W / 2;
  const cy = (G.player.py + .5) * TILE - VIEW_H / 2 - 6;
  cam.x = mw <= VIEW_W ? (mw - VIEW_W) / 2 : clamp(cx, 0, mw - VIEW_W);
  cam.y = mh <= VIEW_H ? (mh - VIEW_H) / 2 : clamp(cy, 0, mh - VIEW_H);
}

/** Start a step if the target tile allows it. Returns true when moving. */
function tryMove(dir) {
  const p = G.player;
  if (p.moveT > 0) return false;
  p.dir = dir;
  const [dx, dy] = DIRS[dir];
  let nx = p.x + dx, ny = p.y + dy;
  const t = tileAt(G.map, nx, ny);
  // A ledge is a one-way hop: you clear it and land on the far side.
  if (t === 'L' && dir === 'down') {
    if (!passable(G.map, nx, ny + 1, ny)) return false;
    p.hop = true; ny += 1;
  } else if (!passable(G.map, nx, ny, p.y)) {
    p.bump = .12;
    return false;
  }
  p.x = nx; p.y = ny;
  p.moveT = p.hop ? STEP_TIME * 1.6 : STEP_TIME;
  p.moveLen = p.hop ? 2 : 1;
  return true;
}

/** Called the moment the player lands on a new tile. */
function onArrive() {
  const p = G.player;
  G.steps++;
  const w = warpAt(G.map, p.x, p.y);
  if (w) { doWarp(w); return; }
  if (trainerSight()) return;
  if (!GRASSY.has(tileAt(G.map, p.x, p.y)) || !G.map.enc) return;

  // The legendary haunts the shrine grass and gets first refusal. Losing it is
  // not permanent — it comes back around, so a wipe never ends the hunt.
  if (G.mapId === 'crown_hollow' && !G.flags.beatVespyr && p.y <= 8
      && G.steps > (G.flags.vespyrSeenAt || 0) + 25 && chance(.18)) {
    G.flags.vespyrSeenAt = G.steps;
    say('', ['The air goes thin and bright. Something old has noticed you.'], () => {
      startBattle({ foe: mkMon('vespyr', 26), wild: true, legendary: true });
    });
    return;
  }
  if (chance(G.map.enc.rate)) {
    const foe = rollEncounter(G.map);
    if (foe) startBattle({ foe, wild: true });
  }
}

const SIGHT = 4;                       // how far down their own line a trainer looks

/**
 * A trainer only gets to ambush you once. Beat them and they are done; lose to
 * them and they have made their point — the rematch is there when you go and
 * ask for it. Without this a trainer standing on the only road out of town
 * re-challenges you the moment you walk back, and a loss becomes a soft-lock
 * you cannot train your way out of, because the grass is on their side of them.
 */
const sightSpent = (id) => `seen_${id}`;

/**
 * Did an unbeaten trainer just see the player walk into their line? Sight is
 * blocked by anything solid, so you can sneak behind a tree.
 */
function trainerSight() {
  const p = G.player;
  for (const n of (G.map.npcs || [])) {
    if (!n.trainer || !npcActive(n) || G.flags[n.id] || G.flags[sightSpent(n.id)]) continue;
    const [dx, dy] = DIRS[n.dir] || [0, 1];
    for (let i = 1; i <= SIGHT; i++) {
      const x = n.x + dx * i, y = n.y + dy * i;
      if (SOLID.has(tileAt(G.map, x, y))) break;
      if (x === p.x && y === p.y) {
        // Turn and face whoever just called you out.
        p.dir = dx ? (dx > 0 ? 'left' : 'right') : (dy > 0 ? 'up' : 'down');
        G.flags[sightSpent(n.id)] = 1;         // they got their ambush; that was it
        G.alert = { npc: n, t: 0 };
        say(n.name, ['…'], () => { G.alert = null; talkTo(n); });
        return true;
      }
    }
  }
  return false;
}

function doWarp(w) {
  enterMap(w.to, w.tx, w.ty, w.dir || G.player.dir);
  G.fade = .35;
  updateCam();
  saveGame();
}

/** A-button: talk to whatever is in front, or read a sign. */
function interact() {
  const p = G.player;
  const [dx, dy] = DIRS[p.dir];
  const tx = p.x + dx, ty = p.y + dy;
  const npc = npcAt(G.map, tx, ty);
  if (npc) { faceNpc(npc, p); talkTo(npc); return true; }
  const sign = (G.map.signs || {})[tx + ',' + ty];
  if (sign) { say('', [sign]); return true; }
  return false;
}

function faceNpc(npc, p) {
  npc.dir = p.dir === 'up' ? 'down' : p.dir === 'down' ? 'up' : p.dir === 'left' ? 'right' : 'left';
}

function updateWorld(dt) {
  const p = G.player;
  if (p.bump > 0) p.bump = Math.max(0, p.bump - dt);

  if (p.moveT > 0) {
    p.moveT -= dt;
    const total = (p.moveLen === 2 ? STEP_TIME * 1.6 : STEP_TIME);
    const k = clamp(1 - p.moveT / total, 0, 1);
    const [dx, dy] = DIRS[p.dir];
    const len = p.moveLen || 1;
    p.px = p.x - dx * len * (1 - k);
    p.py = p.y - dy * len * (1 - k);
    if (p.moveT <= 0) {
      p.moveT = 0; p.px = p.x; p.py = p.y; p.step ^= 1; p.hop = false; p.moveLen = 1;
      onArrive();
    }
  } else {
    if (justPressed('b')) { openMainMenu(); return; }
    if (justPressed('a')) { if (interact()) return; }
    for (const d of ['up', 'down', 'left', 'right']) if (held(d)) { tryMove(d); break; }
  }
  updateCam();
}

// ---- drawing -----------------------------------------------------------
function drawTile(g, ch, sx, sy) {
  const id = TILE_ART[ch] || 'grass';
  if (hasArt('tile', id)) { drawSpr(g, 'tile', id, sx, sy, 1); return; }
  // Fallback palette so the world is still legible before art lands.
  const FB = { grass: '#4d9a3c', tallgrass: '#2f7a3a', path: '#c4a276', water: '#2b7fc0',
    tree: '#1f5230', rock: '#7d6a5c', flowers: '#5cb340', sand: '#e0cfa2', fence: '#8a6a45',
    wall: '#d8c9ad', roof: '#a8402f', door: '#6b4526', sign: '#8a6a45', ledge: '#3f7a37' };
  g.fillStyle = FB[id] || '#4d9a3c';
  g.fillRect(sx, sy, TILE, TILE);
}

/** The player's walk frame for a direction, with a mirrored fallback. */
function drawPlayer(g, dir, step, sx, sy, moving) {
  const frame = moving ? step : 0;
  let id = `player_${dir}_${frame}`;
  let flip = false;
  if (!hasArt('actor', id) && dir === 'right') {
    id = `player_left_${frame}`; flip = true;      // mirror if right frames are missing
  }
  if (!hasArt('actor', id)) id = 'player_down_0';
  drawSpr(g, 'actor', id, sx, sy, 1, { flip });
}

function drawWorld(g) {
  const map = G.map;
  const x0 = Math.floor(cam.x / TILE), y0 = Math.floor(cam.y / TILE);
  const ox = -(cam.x % TILE), oy = -(cam.y % TILE);
  g.fillStyle = map.kind === 'inside' ? '#2a2030' : '#14301f';
  g.fillRect(0, 0, VIEW_W, VIEW_H);

  for (let y = 0; y <= VIEW_H / TILE + 1; y++) {
    for (let x = 0; x <= VIEW_W / TILE + 1; x++) {
      const mx = x0 + x, my = y0 + y;
      if (my < 0 || my >= map.rows.length || mx < 0 || mx >= map.rows[0].length) continue;
      const ch = map.rows[my][mx];
      const sx = Math.round(x * TILE + ox), sy = Math.round(y * TILE + oy);
      // Buildings and props sit on ground, so paint grass under them first.
      if (ch === 'R' || ch === 'W' || ch === 'D' || ch === 'S' || ch === 'o' || ch === 'f' || ch === '|') drawTile(g, '.', sx, sy);
      if (ch === '~') {
        // Water bobs: scroll the tile a pixel and wrap it inside its own cell.
        const dy = Math.round(Math.sin(G.t * 1.6 + mx * .8 + my * .5) * 1.2);
        g.save();
        g.beginPath(); g.rect(sx, sy, TILE, TILE); g.clip();
        drawTile(g, ch, sx, sy + dy);
        drawTile(g, ch, sx, sy + dy - TILE * (dy < 0 ? -1 : 1));
        g.restore();
        continue;
      }
      drawTile(g, ch, sx, sy);
    }
  }

  // Entities, back to front by tile row.
  const ents = [];
  for (const n of (map.npcs || [])) if (npcActive(n)) ents.push({ y: n.y, draw: () => {
    const sx = Math.round(n.x * TILE - cam.x), sy = Math.round(n.y * TILE - cam.y - 6);
    drawSpr(g, 'actor', n.sprite, sx, sy, 1);
    if (n.trainer && !G.flags[n.id]) {
      // A quiet marker normally; a big jolt on the frame they spot you.
      const spotted = G.alert && G.alert.npc === n;
      const bob = spotted ? -Math.abs(Math.sin(G.t * 14)) * 4 : Math.sin(G.t * 4) * 1.5;
      const s = spotted ? 2 : 1;
      g.fillStyle = spotted ? '#fff' : '#ffc94d';
      g.fillRect(sx + 8 - s, sy - 8 - 3 * s + bob, s * 2, s * 5);
      g.fillRect(sx + 8 - s, sy - 2 + bob, s * 2, s * 2);
    }
  } });
  const p = G.player;
  ents.push({ y: p.py, draw: () => {
    const hop = p.hop ? Math.sin(clamp(1 - p.moveT / (STEP_TIME * 1.6), 0, 1) * Math.PI) * 7 : 0;
    const sx = Math.round(p.px * TILE - cam.x), sy = Math.round(p.py * TILE - cam.y - 6 - hop);
    if (hop > 0) { g.fillStyle = 'rgba(0,0,0,.28)'; g.fillRect(sx + 3, sy + 21 + hop, 10, 3); }
    drawPlayer(g, p.dir, p.step, sx, sy, p.moveT > 0);
  } });
  ents.sort((a, b) => a.y - b.y).forEach((e) => e.draw());

  // Tall grass draws over feet so the player wades through it.
  for (const e of [p, ...(map.npcs || []).filter(npcActive)]) {
    const ex = e.px != null ? e.px : e.x, ey = e.py != null ? e.py : e.y;
    if (!GRASSY.has(tileAt(map, Math.round(ex), Math.round(ey)))) continue;
    const sx = Math.round(Math.round(ex) * TILE - cam.x), sy = Math.round(Math.round(ey) * TILE - cam.y);
    // The blades sway while whoever is standing in them is moving.
    const moving = e.moveT > 0;
    const sway = moving ? Math.round(Math.sin(G.t * 22) * 1.2) : 0;
    g.save(); g.beginPath(); g.rect(sx, sy + 10, TILE, 6); g.clip();
    drawTile(g, ',', sx + sway, sy);
    g.restore();
  }

  if (map.kind === 'inside') {                       // cosy interior vignette
    g.fillStyle = 'rgba(20,10,26,.25)';
    g.fillRect(0, 0, VIEW_W, VIEW_H);
  }
}
/* =========================================================== §6 — battle ==
   A turn resolves completely, up front, into a list of log entries. Each entry
   carries an HP snapshot, so the UI can play the turn back at reading speed
   while the underlying state is already consistent. Tests drive playCard(),
   endTurn() and doAction() directly and read the same log.
   ======================================================================== */
function startBattle(opt) {
  const mine = firstAlive();
  if (!mine) return false;
  G.battle = {
    foe: opt.foe, mine, wild: !!opt.wild, legendary: !!opt.legendary,
    npc: opt.npc || null,
    team: opt.team || null, teamIdx: 0,
    escapes: 0, turn: 0, over: null, log: null, li: 0,
    shake: 0, flashM: 0, flashF: 0, entry: 0, throwT: 0, hold: 0,
    dispM: mine.hp, dispF: opt.foe.hp, tgtM: mine.hp, tgtF: opt.foe.hp,
    started: false, finishing: false, await: null,
    // the card game
    draw: [], hand: [], disc: [], exh: [],
    energy: 0, phase: 'player', intent: null, powers: {},
    mods: { atk: 0, def: 0, thorns: 0 }, maxAdd: 0, maxAdds: new Map(), shield: 0,
  };
  mine.stages = { atk: 0, def: 0, spd: 0 };
  opt.foe.stages = { atk: 0, def: 0, spd: 0 };
  toughen(opt.foe);
  G.battle.dispF = G.battle.tgtF = opt.foe.hp;
  buildDeck(G.battle);
  G.wipe = WIPE_T;
  seeMon(opt.foe.species);
  G.mode = 'battle';
  const who = opt.npc ? `${opt.npc.name} wants to battle!` : `A wild ${opt.foe.name} bristles!`;
  playCue(opt.legendary ? 'shrine' : 'battle');
  const lines = [who, `Go, ${dispName(mine)}!`];
  // The very first hand is dealt as the battle opens.
  startPlayerTurn([]);
  // One-time nudge, the first time a wild kin shows up with orbs in the bag.
  if (opt.wild && !G.flags.taughtCatch && (G.bag.bloomorb > 0 || G.bag.gleamorb > 0 || G.bag.prismorb > 0)) {
    G.flags.taughtCatch = 1;
    lines.push('Five cards, three energy. Left and right pick one, up plays it — or press its number, or just tap it.');
    lines.push('When you have spent what you can, end the turn: E, or the button under the hand.');
    lines.push('Knock it down first, then reach for an orb — Bag, then the orb. A hurt kin holds.');
  }
  battleSay(lines, () => renderHand());
  return true;
}

const B = () => G.battle;

// ---- damage ------------------------------------------------------------
function critRoll() { return chance(1 / 16); }

/** Pure-ish damage calc; `move` is a move id or a card's synthetic move. */
function damageOf(atkMon, defMon, move, opts = {}) {
  const m = typeof move === 'string' ? MOVES[move] : move;
  if (!m.pow) return { dmg: 0, eff: 1, crit: false };
  const eff = effect(m.type, defMon.types);
  const stab = atkMon.types.includes(m.type) ? 1.5 : 1;
  const crit = opts.crit != null ? opts.crit : critRoll();
  const a = effStat(atkMon, 'atk'), d = effStat(defMon, 'def');
  let base = Math.floor((((2 * atkMon.lvl / 5 + 2) * m.pow * a / Math.max(1, d)) / 50) + 2);
  const roll = opts.roll != null ? opts.roll : (.85 + Math.random() * .15);
  let dmg = Math.floor(base * stab * eff * (crit ? 1.5 : 1) * roll);
  return { dmg: Math.max(eff === 0 ? 0 : 1, dmg), eff, crit };
}

const effWord = (e) => e === 0 ? 'It does nothing at all…' : e >= 2 ? "It's brutally effective!" : e > 1 ? "It's effective!" : e < 1 ? 'It barely lands…' : '';

// ---- log helpers -------------------------------------------------------
function snap(log, t, fx, side) {
  const b = B();
  log.push({ t, fx: fx || '', side: side || '', hpM: b.mine.hp, hpF: b.foe.hp,
    sM: b.mine.status, sF: b.foe.status, lvM: b.mine.lvl, xpM: b.mine.xp });
}

const STAT_WORD = { atk: 'attack', def: 'guard', spd: 'speed' };
function applyStages(log, target, list, who) {
  for (const [stat, n] of list) {
    const before = target.stages[stat];
    target.stages[stat] = clamp(before + n, -6, 6);
    if (target.stages[stat] === before) { snap(log, `${who}'s ${STAT_WORD[stat]} can go no ${n > 0 ? 'higher' : 'lower'}.`); continue; }
    const word = n > 0 ? (n > 1 ? 'sharply rose' : 'rose') : (n < -1 ? 'sharply fell' : 'fell');
    snap(log, `${who}'s ${STAT_WORD[stat]} ${word}!`);
  }
}

/** One creature uses one move. Mutates state, appends to log. */
function useMove(log, atkSide, moveId) {
  const b = B();
  const attacker = atkSide === 'mine' ? b.mine : b.foe;
  const defender = atkSide === 'mine' ? b.foe : b.mine;
  const who = atkSide === 'mine' ? dispName(attacker) : `Foe ${dispName(attacker)}`;
  const them = atkSide === 'mine' ? `Foe ${dispName(defender)}` : dispName(defender);
  if (attacker.hp <= 0 || defender.hp <= 0) return;

  if (attacker.status === 'shock' && chance(.25)) {
    snap(log, `${who} is jolted stiff and cannot move!`, 'status', atkSide);
    return;
  }

  const m = MOVES[moveId];
  snap(log, `${who} used ${m.name}!`, 'use', atkSide);

  if (m.acc && rnd(100) >= m.acc) { snap(log, `${who}'s attack missed!`, 'miss', atkSide); return; }

  const fx = m.fx || {};
  if (m.pow) {
    const { dmg, eff, crit } = damageOf(attacker, defender, moveId);
    let dealt = dmg;
    if (atkSide === 'foe') {
      dealt = hurtMine(log, dmg, `${them} took ${dmg}.`);          // shield first
    } else {
      defender.hp = clamp(defender.hp - dmg, 0, defender.max);
      snap(log, `${them} took ${dmg}.`, 'hit', 'foe');
    }
    if (crit && eff !== 0) snap(log, 'A critical hit!');
    const w = effWord(eff);
    if (w) snap(log, w);
    if (fx.drain && dealt > 0) {
      const heal = Math.max(1, Math.floor(dealt * fx.drain));
      attacker.hp = clamp(attacker.hp + heal, 0, attacker.max);
      snap(log, `${who} drank the energy back.`, 'heal', atkSide);
    }
    if (fx.recoil && dealt > 0) {
      const r = Math.max(1, Math.floor(dealt * fx.recoil));
      attacker.hp = clamp(attacker.hp - r, 0, attacker.max);
      snap(log, `${who} is hurt by the recoil.`, 'hit', atkSide);
    }
    if (eff === 0) return;
  }

  if (fx.heal) {
    const before = attacker.hp;
    attacker.hp = clamp(attacker.hp + Math.floor(attacker.max * fx.heal), 0, attacker.max);
    snap(log, attacker.hp > before ? `${who} settled and recovered.` : `${who} is already whole.`, 'heal', atkSide);
  }
  if (fx.st && defender.hp > 0) {
    const [st, p] = fx.st;
    if (!defender.status && chance(p) && !defender.types.includes(IMMUNE_TO[st] || '')) {
      defender.status = st;
      snap(log, `${them} is ${STATUS[st].name.toLowerCase()}!`, 'status', atkSide === 'mine' ? 'foe' : 'mine');
    }
  }
  if (fx.foe && defender.hp > 0) applyStages(log, defender, fx.foe, them);
  if (fx.self) applyStages(log, attacker, fx.self, who);
}

// A creature shrugs off the status its own element embodies.
const IMMUNE_TO = { burn: 'Ember', shock: 'Spark', chill: 'Tide', snare: 'Verdant' };

function endOfTurn(log) {
  const b = B();
  for (const [mon, side] of [[b.mine, 'mine'], [b.foe, 'foe']]) {
    if (mon.hp <= 0) continue;
    const who = side === 'mine' ? dispName(mon) : `Foe ${dispName(mon)}`;
    if (mon.status === 'burn' || mon.status === 'snare') {
      const d = Math.max(1, Math.floor(mon.max / 16));
      mon.hp = clamp(mon.hp - d, 0, mon.max);
      snap(log, `${who} is worn down by the ${mon.status === 'burn' ? 'burn' : 'roots'}.`, 'hit', side);
    }
  }
}

// ---- experience --------------------------------------------------------
function grantXP(log, winner, loser) {
  const gain = Math.max(1, Math.floor(DEX[loser.species].xp * loser.lvl / 7));
  winner.xp += gain;
  snap(log, `${dispName(winner)} gained ${gain} EXP.`, 'xp', 'mine');
  while (winner.lvl < 100 && winner.xp >= xpFor(winner.lvl + 1)) {
    winner.lvl++;
    refresh(winner);
    snap(log, `${dispName(winner)} grew to level ${winner.lvl}!`, 'level', 'mine');
    for (const [lv, mv] of DEX[winner.species].learn) {
      if (lv !== winner.lvl) continue;
      if (winner.moves.some((x) => x.id === mv)) continue;
      if (winner.moves.length < 4) {
        winner.moves.push({ id: mv, pp: MOVES[mv].pp, max: MOVES[mv].pp });
        snap(log, `${dispName(winner)} learned ${MOVES[mv].name}!`, 'learn', 'mine');
      } else {
        // Forget the weakest thing it knows — never the new move.
        let wi = 0;
        for (let i = 1; i < 4; i++) if (MOVES[winner.moves[i].id].pow < MOVES[winner.moves[wi].id].pow) wi = i;
        const old = MOVES[winner.moves[wi].id].name;
        winner.moves[wi] = { id: mv, pp: MOVES[mv].pp, max: MOVES[mv].pp };
        snap(log, `${dispName(winner)} forgot ${old} and learned ${MOVES[mv].name}!`, 'learn', 'mine');
      }
    }
  }
}

/** Pending evolutions are played out after the battle ends. */
function checkEvolve() {
  for (const m of G.party) {
    const evo = DEX[m.species].evo;
    if (evo && m.lvl >= evo[1] && !m.noEvo) return m;
  }
  return null;
}

function evolveMon(m) {
  const [to] = DEX[m.species].evo;
  const oldName = dispName(m);
  m.species = to; m.name = DEX[to].name;
  refresh(m);
  catchMon(to);
  // New form's level-1 kit is offered for any empty move slots.
  for (const [lv, mv] of DEX[to].learn) {
    if (lv <= m.lvl && m.moves.length < 4 && !m.moves.some((x) => x.id === mv)) {
      m.moves.push({ id: mv, pp: MOVES[mv].pp, max: MOVES[mv].pp });
    }
  }
  return { oldName, newName: DEX[to].name };
}

// ---- capture -----------------------------------------------------------
/** Pokémon-shaped capture maths: four shakes, all must hold. */
function captureChance(foe, orbMul) {
  const rate = DEX[foe.species].rate;
  const stMul = foe.status === 'shock' || foe.status === 'chill' ? 1.5 : foe.status ? 1.25 : 1;
  const a = ((3 * foe.max - 2 * foe.hp) / (3 * foe.max)) * rate * orbMul * stMul;
  return clamp(a / 255, 0, 1);
}

function tryCatch(log, orbId) {
  const b = B();
  const orb = ITEMS[orbId];
  const p = captureChance(b.foe, orb.mul);
  snap(log, `You lob a ${orb.name}!`, 'throw', 'foe');
  const shakeP = Math.pow(p, 1 / 4);
  let shakes = 0;
  while (shakes < 4 && chance(shakeP)) shakes++;
  if (shakes >= 4) {
    snap(log, `…click. ${b.foe.name} is yours!`, 'caught', 'foe');
    b.over = 'caught';
    return true;
  }
  snap(log, ['It broke out immediately!', 'So close — one shake.', 'Two shakes… and out.', 'Three shakes! It nearly held!'][shakes], 'break', 'foe');
  return false;
}

function addCaught(mon) {
  catchMon(mon.species);
  G.caught++;
  mon.stages = { atk: 0, def: 0, spd: 0 };
  untoughen(mon);
  if (G.party.length < 6) { G.party.push(mon); return 'party'; }
  G.box.push(mon); return 'box';
}

// ---- foe AI ------------------------------------------------------------
/** Picks the move with the best expected value, with a little noise. */
function foeChoose() {
  const b = B();
  const list = b.foe.moves.length ? b.foe.moves : [{ id: 'falter' }];
  let best = null, bestScore = -1;
  for (const slot of list) {
    const m = MOVES[slot.id];
    let score;
    if (m.pow) {
      const { dmg, eff } = damageOf(b.foe, b.mine, slot.id, { crit: false, roll: .925 });
      score = dmg * (eff === 0 ? 0 : 1);
      if (dmg >= b.mine.hp + b.shield) score *= 2.2;      // go for the kill
    } else {
      const fx = m.fx || {};
      score = b.foe.hp < b.foe.max * .45 && fx.heal ? b.foe.max * .35 : b.foe.max * .12;
      if (fx.st && b.mine.status) score = 1;
    }
    score *= .8 + Math.random() * .4;
    if (score > bestScore) { bestScore = score; best = slot.id; }
  }
  return best;
}

/** What the foe is about to do, telegraphed so the hand can be played into it. */
function readIntent() {
  const b = B();
  const id = foeChoose();
  const m = MOVES[id];
  const est = m.pow ? damageOf(b.foe, b.mine, id, { crit: false, roll: .925 }).dmg : 0;
  b.intent = { id, name: m.name, dmg: est, kind: m.pow ? 'attack' : 'buff' };
  return b.intent;
}

/* ---------------------------------------------------------- the card game --
   A turn is: draw a hand, spend energy on it, end the turn, take the foe's
   hit. The active kin's own moves are shuffled into the same deck as the
   cards you brought, so a fight is the two of them together.
   ------------------------------------------------------------------------ */
const BASE_ENERGY = 3, HAND_SIZE = 5;
// A hand lands two or three cards a turn where a move landed one, so a foe
// needs proportionally more to hit back through. Their stats are untouched —
// only the pool of HP a fight is played over.
const FOE_HP_MUL = 2.0;

/** Give a foe its battle-sized health as it steps in. */
function toughen(mon) {
  mon.max = Math.round(mon.max * FOE_HP_MUL);
  mon.hp = mon.max;
  return mon;
}

/**
 * Hand the battle pool back. A foe you catch joins the party as itself, not as
 * the fight-sized version of itself — otherwise every kin you ever caught walks
 * around with double HP, and the first time one levels up `refresh` recomputes
 * the honest maximum, finds it smaller than what it is carrying, and drives HP
 * straight through zero.
 */
function untoughen(mon) {
  const real = hpAt(DEX[mon.species].base[0], mon.lvl);
  if (mon.max === real) return mon;
  const frac = mon.max > 0 ? mon.hp / mon.max : 1;
  mon.max = real;
  mon.hp = clamp(Math.round(real * frac), 1, real);      // it was caught, so it lives
  return mon;
}

/**
 * Kin moves are the heavy hitters, so they are priced as such: a real move
 * plus a support card is a turn, and three real moves is not. That is where
 * the deck earns its place.
 */
const moveCost = (id) => {
  const m = MOVES[id];
  if (!m.pow) return 1;
  return m.pow >= 100 ? 3 : m.pow >= 45 ? 2 : 1;
};

const cardCost = (card) => card.src === 'kin' ? moveCost(card.id) : CARDS[card.id].cost;
const cardName = (card) => card.src === 'kin' ? MOVES[card.id].name : CARDS[card.id].name;
const cardRarity = (card) => card.src === 'kin' ? 'kin' : CARDS[card.id].r;

function shuffleInto(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = rnd(i + 1);
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

/** The active kin's moves, as cards. They leave with it when it switches out. */
const kinCards = (mon) => mon.moves.map((slot) => ({ src: 'kin', id: slot.id }));

function buildDeck(b) {
  const support = deckCards().map((c) => ({ src: 'deck', u: c.u, id: c.id, bg: 0 }));
  b.draw = shuffleInto(support.concat(kinCards(b.mine)));
  b.hand = []; b.disc = []; b.exh = [];
}

/** Swap the outgoing kin's move cards for the incoming one's. */
function swapKinCards(b) {
  const strip = (pile) => pile.filter((c) => c.src !== 'kin');
  b.draw = strip(b.draw); b.hand = strip(b.hand); b.disc = strip(b.disc);
  b.draw = shuffleInto(b.draw.concat(kinCards(b.mine)));
}

function drawCards(log, n) {
  const b = B();
  for (let i = 0; i < n; i++) {
    if (b.hand.length >= 10) break;
    if (!b.draw.length) {
      if (!b.disc.length) break;
      b.draw = shuffleInto(b.disc);
      b.disc = [];
      snap(log, 'You shuffle the discards back in.');
    }
    b.hand.push(b.draw.pop());
  }
}

/**
 * Battle-only modifiers live here so nothing leaks into the save.
 *
 * Max HP has to be given back to whichever kin it was given to. Tracking one
 * running total and taking it off whoever happened to be out at the end meant
 * you could play a +max HP card, switch, and keep the HP forever while the kin
 * you switched to paid for it — permanently, in the save, every battle.
 */
function clearMods(b) {
  for (const [mon, add] of (b.maxAdds || [])) {
    mon.max = Math.max(1, mon.max - add);
    mon.hp = Math.min(mon.hp, mon.max);
  }
  b.maxAdds = new Map();
  b.mods = { atk: 0, def: 0, thorns: 0 };
  b.maxAdd = 0;
  b.shield = 0;
}

function startPlayerTurn(log) {
  const b = B();
  b.turn++;
  b.shield = 0;                                   // shield is for one round only
  b.energy = BASE_ENERGY + (b.powers.energy || 0);
  if (b.mine.status === 'shock') {
    b.energy = Math.max(1, b.energy - 1);
    snap(log, `${dispName(b.mine)} is jolted — one less energy.`, 'status', 'mine');
  }
  const chill = b.mine.status === 'chill' ? 1 : 0;
  drawCards(log, HAND_SIZE - chill);
  if (chill) snap(log, `${dispName(b.mine)} is chilled — one card fewer.`, 'status', 'mine');
  readIntent();
  b.phase = 'player';
  aimPlayable(b);
}

/**
 * Park the aim on a card you can actually pay for. Only ever called when the
 * hand changes underneath the player — dealing a hand, or spending the card
 * they were on — never when they walked the aim there themselves, because
 * looking at a card you cannot afford yet is a fair thing to want to do.
 * Without it, confirm lands on a dead card and does nothing but toast at you
 * while three playable cards sit next to it.
 */
function aimPlayable(b) {
  if (!b.hand.length) { b.sel = 0; return; }
  b.sel = clamp(b.sel || 0, 0, b.hand.length - 1);
  if (cardCost(b.hand[b.sel]) <= b.energy) return;
  // Nearest playable card, searching outward from where the aim already is.
  for (let d = 1; d < b.hand.length; d++) {
    for (const i of [b.sel + d, b.sel - d]) {
      if (i >= 0 && i < b.hand.length && cardCost(b.hand[i]) <= b.energy) { b.sel = i; return; }
    }
  }
}

/** Damage the player's side takes, shield first. */
function hurtMine(log, amount, why) {
  const b = B();
  let dmg = amount;
  if (b.shield > 0) {
    const absorbed = Math.min(b.shield, dmg);
    b.shield -= absorbed; dmg -= absorbed;
    if (absorbed > 0) snap(log, `Shield absorbs ${absorbed}.`, 'block', 'mine');
  }
  if (dmg > 0) {
    b.mine.hp = clamp(b.mine.hp - dmg, 0, b.mine.max);
    snap(log, why || `${dispName(b.mine)} took ${dmg}.`, 'hit', 'mine');
  }
  return dmg;
}

/**
 * What a card's attack actually lands for. A card says "Deal 10" and deals 10 —
 * the number on the card is the number, not a power rating fed through the
 * level-scaled move formula. Cards belong to you, not to the kin holding them,
 * so they must not shrink because the kin is level 5 or because the foe rolled
 * a fat defence stat; growing the card is the only thing that grows the damage.
 * Attack buffs add on top, an element on the card still meets the type chart,
 * and crits still land, because those are the game's own language.
 */
function cardDamage(value, type, opts = {}) {
  const b = B();
  const eff = type ? effect(type, b.foe.types) : 1;
  const crit = opts.crit != null ? opts.crit : critRoll();
  const raw = Math.max(0, value + (b.mods.atk || 0));
  const dmg = Math.floor(raw * eff * (crit ? 1.5 : 1));
  return { dmg: eff === 0 ? 0 : Math.max(1, dmg), eff, crit };
}

/**
 * Play the card at hand index `i`. Returns the log; the turn does not end, so
 * you can keep spending energy until it runs out.
 */
function playCard(i) {
  const b = B();
  const log = [];
  const card = b.hand[i];
  if (!card || b.phase !== 'player' || b.over) return log;
  const cost = cardCost(card);
  if (cost > b.energy) { snap(log, 'Not enough energy.'); return log; }

  b.hand.splice(i, 1);
  b.energy -= cost;

  if (card.src === 'kin') {
    const before = b.foe.hp;
    snap(log, `${dispName(b.mine)} plays ${MOVES[card.id].name}.`, 'use', 'mine');
    useMove(log, 'mine', card.id);
    b.disc.push(card);
    if (before > 0 && b.foe.hp <= 0) resolveFoeDown(log);
    return log;
  }

  const def = CARDS[card.id];
  const owned = ownedCard(card.u);
  const inst = { id: card.id, plus: owned ? owned.plus : 0, bg: card.bg || 0 };
  const value = cardValue(inst);
  const fx = def.fx || {};
  snap(log, `You play ${def.name}.`, 'card', 'mine');

  let killed = false;
  if (def.kind === 'attack') {
    const hits = fx.hits || 1;
    for (let h = 0; h < hits && b.foe.hp > 0; h++) {
      const { dmg, eff } = cardDamage(value, fx.type);
      b.foe.hp = clamp(b.foe.hp - dmg, 0, b.foe.max);
      snap(log, `Foe ${dispName(b.foe)} took ${dmg}.`, 'hit', 'foe');
      const w = effWord(eff);
      if (w) snap(log, w);
      if (fx.drain && dmg > 0) {
        b.mine.hp = clamp(b.mine.hp + Math.max(1, Math.floor(dmg * fx.drain)), 0, b.mine.max);
        snap(log, `${dispName(b.mine)} drinks it back.`, 'heal', 'mine');
      }
      if (b.foe.hp <= 0) killed = true;
    }
    if (fx.st && b.foe.hp > 0 && !b.foe.status && chance(fx.st[1])
        && !b.foe.types.includes(IMMUNE_TO[fx.st[0]] || '')) {
      b.foe.status = fx.st[0];
      snap(log, `Foe ${dispName(b.foe)} is ${STATUS[fx.st[0]].name.toLowerCase()}!`, 'status', 'foe');
    }
  }

  // Non-damage effects. `vt` names whichever number the card grows.
  const amt = (key) => (def.vt === key ? value : (fx[key] || 0));
  if (amt('shield')) { b.shield += amt('shield'); snap(log, `Shield up to ${b.shield}.`, 'block', 'mine'); }
  if (amt('atk')) { b.mods.atk += amt('atk'); snap(log, `${dispName(b.mine)}'s attack is up.`, 'buff', 'mine'); }
  if (amt('def')) { b.mods.def += amt('def'); snap(log, `${dispName(b.mine)}'s guard is up.`, 'buff', 'mine'); }
  if (fx.thorns) { b.mods.thorns += fx.thorns; snap(log, 'Thorns bristle.', 'buff', 'mine'); }
  if (amt('maxhp')) {
    const add = amt('maxhp');
    b.maxAdd += add; b.mine.max += add; b.mine.hp += add;
    // Booked against this kin, so the switch does not hand the bill to another.
    if (!b.maxAdds) b.maxAdds = new Map();
    b.maxAdds.set(b.mine, (b.maxAdds.get(b.mine) || 0) + add);
    snap(log, `${dispName(b.mine)}'s max HP is up ${add}.`, 'heal', 'mine');
  }
  if (fx.healFull) { b.mine.hp = b.mine.max; snap(log, `${dispName(b.mine)} is whole again.`, 'heal', 'mine'); }
  if (amt('heal')) {
    b.mine.hp = clamp(b.mine.hp + amt('heal'), 0, b.mine.max);
    snap(log, `${dispName(b.mine)} recovers.`, 'heal', 'mine');
  }
  if (fx.selfdmg) hurtMine(log, fx.selfdmg, `${dispName(b.mine)} pays ${fx.selfdmg} HP for it.`);
  if (amt('energy')) {
    if (def.kind === 'power') { b.powers.energy = (b.powers.energy || 0) + amt('energy'); snap(log, 'Energy will run higher from now on.', 'buff', 'mine'); }
    else { b.energy += amt('energy'); snap(log, 'Energy surges.', 'buff', 'mine'); }
  }
  if (amt('draw')) drawCards(log, amt('draw'));

  // ---- growth: the whole point of the system
  if (owned) {
    owned.plays = (owned.plays || 0) + 1;
    if (def.grow) {
      const got = growCard(owned, def.grow);
      if (got) snap(log, `${def.name} grows — now ${cardValue({ id: card.id, plus: owned.plus })}.`, 'grow', 'mine');
      else snap(log, `${def.name} is as sharp as it will ever be.`, 'grow', 'mine');
    }
    if (def.kill && killed) {
      const got = growCard(owned, def.kill);
      owned.kills = (owned.kills || 0) + 1;
      snap(log, got ? `${def.name} tasted the kill — permanently +${got}.`
        : `${def.name} tasted the kill, but it is already at its limit.`, 'grow', 'mine');
    }
  }
  if (def.bgrow) {
    // Battle-only growth rides on every copy of this card still in the piles.
    for (const pile of [b.draw, b.hand, b.disc]) {
      for (const c of pile) if (c.src === 'deck' && c.id === card.id) c.bg = (c.bg || 0) + def.bgrow;
    }
    card.bg = (card.bg || 0) + def.bgrow;
    snap(log, `${def.name} sharpens for the rest of the fight.`, 'grow', 'mine');
  }

  if (def.exhaust) { b.exh.push(card); snap(log, `${def.name} is spent.`, 'exhaust', 'mine'); }
  else b.disc.push(card);

  if (killed) resolveFoeDown(log);
  return log;
}

/** The foe is down: award XP and gems, or send out the next of a trainer's team. */
function resolveFoeDown(log) {
  const b = B();
  snap(log, `${b.wild ? 'Wild ' : 'Foe '}${dispName(b.foe)} is down!`, 'faint', 'foe');
  if (b.mine.hp > 0) grantXP(log, b.mine, b.foe);
  if (b.team && b.teamIdx < b.team.length - 1) {
    b.teamIdx++;
    const nxt = b.team[b.teamIdx];
    b.foe = toughen(mkMon(nxt[0], nxt[1]));
    b.foe.stages = { atk: 0, def: 0, spd: 0 };
    b.dispF = b.tgtF = b.foe.hp;
    seeMon(b.foe.species);
    snap(log, `${b.npc ? b.npc.name : 'The challenger'} sends out ${b.foe.name}!`, 'send', 'foe');
    readIntent();
  } else {
    b.over = 'win';
  }
}

/** The foe takes its telegraphed action, then statuses tick. */
function foeTurn(log) {
  const b = B();
  if (b.over || b.foe.hp <= 0 || b.mine.hp <= 0) return;
  b.phase = 'foe';
  const id = (b.intent && b.intent.id) || foeChoose();
  const hpBefore = b.mine.hp;
  useMove(log, 'foe', id);
  // Thorns answer anything that actually connected.
  if (b.mods.thorns && b.mine.hp < hpBefore && b.foe.hp > 0) {
    b.foe.hp = clamp(b.foe.hp - b.mods.thorns, 0, b.foe.max);
    snap(log, `Thorns bite back for ${b.mods.thorns}.`, 'hit', 'foe');
    if (b.foe.hp <= 0) { resolveFoeDown(log); return; }
  }
  if (b.foe.hp > 0 && b.mine.hp > 0) endOfTurn(log);
}

function afterFoe(log) {
  const b = B();
  // A foe can die on its own turn — burn or snare finishing it at end of turn,
  // or thorns answering the hit it just landed. When that happens and there is
  // another kin behind it, the next one steps in and the turn has to come back
  // to the player: returning here left the battle sitting in the foe phase with
  // an empty hand and no energy, and nothing the player pressed could move it.
  if (b.foe.hp <= 0 && !b.over) resolveFoeDown(log);
  if (b.mine.hp <= 0) {
    snap(log, `${dispName(b.mine)} has fainted.`, 'faint', 'mine');
    clearMods(b);
    b.over = partyAlive() ? 'switch' : 'lose';
    return;
  }
  if (!b.over) startPlayerTurn(log);
}

/** End the player's turn: hand goes to the discard, then the foe swings. */
function endTurn() {
  const b = B();
  const log = [];
  if (b.phase !== 'player' || b.over) return log;
  b.disc.push(...b.hand);
  b.hand = [];
  foeTurn(log);
  afterFoe(log);
  return log;
}

/**
 * Actions that are not cards: an item, a switch, or running. Each one costs
 * the rest of your turn, exactly as it did before.
 */
function doAction(action) {
  const b = B();
  const log = [];
  if (b.over || b.phase !== 'player') return log;

  if (action.kind === 'run') {
    if (!b.wild) { snap(log, 'There is no running from a challenge!'); return log; }
    b.escapes++;
    const odds = clamp(.4 + .35 * (effStat(b.mine, 'spd') / Math.max(1, effStat(b.foe, 'spd')) - 1) + b.escapes * .15, .12, .95);
    if (b.mine.status === 'snare') snap(log, 'Roots hold you fast — no escape!');
    else if (chance(odds)) { snap(log, 'You slip away into the grass.', 'flee'); b.over = 'fled'; return log; }
    else snap(log, 'You could not get away!');
  } else if (action.kind === 'item') {
    if (!useItemInBattle(log, action.id, action.target)) return log;
    if (b.over === 'caught') return log;
  } else if (action.kind === 'switch') {
    const next = G.party[action.idx];
    if (!next || !alive(next) || next === b.mine) return log;
    snap(log, `Come back, ${dispName(b.mine)}!`);
    clearMods(b);
    b.mine.stages = { atk: 0, def: 0, spd: 0 };
    b.mine = next;
    next.stages = { atk: 0, def: 0, spd: 0 };
    swapKinCards(b);
    snap(log, `Go, ${dispName(next)}!`, 'send', 'mine');
  }

  b.disc.push(...b.hand);
  b.hand = [];
  foeTurn(log);
  afterFoe(log);
  return log;
}

function useItemInBattle(log, id, targetIdx) {
  const b = B();
  const it = ITEMS[id];
  if (!it || !(G.bag[id] > 0)) { snap(log, 'You have none of those.'); return false; }
  if (it.kind === 'orb') {
    if (!b.wild) { snap(log, 'Stealing another trainer\'s kin? No.'); return false; }
    G.bag[id]--;
    tryCatch(log, id);
    return true;
  }
  const target = targetIdx != null ? G.party[targetIdx] : b.mine;
  if (it.kind === 'heal') {
    if (target.hp <= 0) { snap(log, `${dispName(target)} is out cold — that will not help.`); return false; }
    if (target.hp >= target.max) { snap(log, `${dispName(target)} is already whole.`); return false; }
    G.bag[id]--;
    target.hp = clamp(target.hp + it.amt, 0, target.max);
    snap(log, `${dispName(target)} recovered.`, 'heal', 'mine');
  } else if (it.kind === 'revive') {
    if (target.hp > 0) { snap(log, `${dispName(target)} does not need that.`); return false; }
    G.bag[id]--;
    target.hp = Math.floor(target.max / 2);
    snap(log, `${dispName(target)} opens its eyes.`, 'heal', 'mine');
  } else if (it.kind === 'draw') {
    G.bag[id]--;
    drawCards(log, it.amt);
    snap(log, 'The elixir clears your head.', 'buff', 'mine');
  }
  if (G.bag[id] <= 0) delete G.bag[id];
  return true;
}

// ---- battle scene drawing ---------------------------------------------
function drawBattle(g) {
  const b = B();
  const t = G.t;
  // Sky and ground bands, tinted by the foe's element.
  const tint = TYPES[b.foe.types[0]] || '#7a5fc4';
  const sky = g.createLinearGradient(0, 0, 0, VIEW_H);
  sky.addColorStop(0, '#231633'); sky.addColorStop(.55, '#39243f'); sky.addColorStop(1, '#1a1022');
  g.fillStyle = sky; g.fillRect(0, 0, VIEW_W, VIEW_H);
  g.globalAlpha = .10; g.fillStyle = tint; g.fillRect(0, 0, VIEW_W, VIEW_H * .6); g.globalAlpha = 1;

  const shake = b.shake > 0 ? Math.sin(t * 70) * b.shake * 3 : 0;
  // Two ground discs — foe far, yours near.
  const disc = (cx, cy, rx, ry, col) => {
    g.save(); g.translate(cx, cy); g.scale(1, ry / rx);
    g.beginPath(); g.arc(0, 0, rx, 0, Math.PI * 2); g.fillStyle = col; g.fill(); g.restore();
  };
  // Ground lines: the foe stands high and far, yours low and near, with the
  // text box below both — nothing may overlap the panels.
  const FOE_GROUND = 66, MY_GROUND = 108;
  disc(178, FOE_GROUND + 2, 50, 12, '#2e4a30');
  disc(178, FOE_GROUND + 2, 42, 9, '#3c6136');
  disc(72, MY_GROUND + 3, 60, 14, '#2e4a30');
  disc(72, MY_GROUND + 3, 52, 11, '#3c6136');

  const foeId = b.foe.species, myId = b.mine.species;
  const fs = 1.5, ms = 2;
  const fb = artBottom(foeId), mb = artBottom(myId);
  const fx = 178 - 40 * fs / 2 + shake * (b.flashF > 0 ? 1 : 0);
  const fy = FOE_GROUND - fb * fs + Math.sin(t * 1.7) * 1.5;
  const mx = 72 - 40 * ms / 2 - shake * (b.flashM > 0 ? 1 : 0);
  const my = MY_GROUND - mb * ms + Math.sin(t * 1.9 + 1) * 2;

  g.save(); g.globalAlpha = .3; g.fillStyle = '#000';
  if (g.ellipse) { g.beginPath(); g.ellipse(178, FOE_GROUND, 22, 5, 0, 0, Math.PI * 2); g.fill();
                   g.beginPath(); g.ellipse(72, MY_GROUND, 28, 6, 0, 0, Math.PI * 2); g.fill(); }
  g.restore();

  const entry = clamp(b.entry, 0, 1);
  drawSpr(g, 'creature', foeId, fx + (1 - entry) * 90, fy, fs, { flash: b.flashF > 0 ? b.flashF : 0, alpha: b.foe.hp <= 0 ? .35 : 1 });
  drawSpr(g, 'creature', myId, mx - (1 - entry) * 90, my, ms, { flip: true, flash: b.flashM > 0 ? b.flashM : 0, alpha: b.mine.hp <= 0 ? .35 : 1 });

  if (b.throwT > 0) {                       // an orb arcing toward the foe
    const k = 1 - b.throwT / .6;
    const ox = 72 + (178 - 72) * k, oy = MY_GROUND - Math.sin(k * Math.PI) * 60 - k * 50;
    g.fillStyle = '#ffc94d'; g.beginPath(); g.arc(ox, oy, 4, 0, Math.PI * 2); g.fill();
    g.strokeStyle = '#2a1b2e'; g.lineWidth = 1; g.stroke();
  }
}
/* =============================================================== §7 — UI ==
   Canvas draws the world; every panel is DOM so text stays crisp. Menus are
   data (G.menu) rendered into a panel, driven by the same keys as the world.
   ======================================================================== */
const $ = (id) => HEADLESS ? null : document.getElementById(id);
const els = {};
function cacheEls() {
  if (HEADLESS) return;
  for (const id of ['view', 'dialogue', 'mainmenu', 'battlemenu', 'movemenu', 'screen', 'hudFoe', 'hudMine',
    'title', 'toast', 'titleArt', 'battlebar', 'hand', 'energy', 'piles', 'acts', 'intent']) els[id] = $(id);
  els.btnA = document.querySelector('#btns [data-k="z"]');
  els.btnB = document.querySelector('#btns [data-k="x"]');
}
const show = (el, on) => { if (el) el.classList.toggle('hidden', !on); };

// ---- dialogue ----------------------------------------------------------
function say(who, lines, done) {
  G.dialogue = { who, lines: Array.isArray(lines) ? lines : [lines], i: 0, done, hold: .12 };
  G.prevMode = G.mode === 'dialogue' ? G.prevMode : G.mode;
  G.mode = 'dialogue';
  renderDialogue();
}
function battleSay(lines, done) {
  G.battleMsg = { lines: Array.isArray(lines) ? lines : [lines], i: 0, done, hold: .12 };
  renderDialogue();
}
const liveBattleMsg = () => (G.battle ? G.battleMsg : null);

function renderDialogue() {
  if (HEADLESS) return;
  const d = G.dialogue || liveBattleMsg();
  if (!d) { show(els.dialogue, false); return; }
  const line = d.lines[d.i] || '';
  els.dialogue.innerHTML = (d.who ? `<span class="who">${d.who}</span>` : '') +
    line + (d.i < d.lines.length - 1 ? '<span class="more">▼</span>' : '');
  els.dialogue.classList.toggle('narrow', !!G.battle);
  show(els.dialogue, true);
}
function advanceDialogue() {
  const inBattle = !!liveBattleMsg();
  const d = inBattle ? G.battleMsg : G.dialogue;
  if (!d) return;
  if (d.hold > 0) return;
  d.i++;
  if (d.i >= d.lines.length) {
    if (inBattle) G.battleMsg = null; else { G.dialogue = null; G.mode = G.prevMode || 'world'; }
    show(els.dialogue, false);
    if (d.done) d.done();
    else if (!inBattle) renderDialogue();
  } else renderDialogue();
}

// ---- menus -------------------------------------------------------------
function openMenu(elId, rows, opt = {}) {
  G.menu = { elId, rows, i: opt.i || 0, cancel: opt.cancel, title: opt.title || '' };
  renderMenu();
}
function closeMenu() {
  if (G.menu && !HEADLESS) show(els[G.menu.elId], false);
  G.menu = null;
}
function renderMenu() {
  if (HEADLESS || !G.menu) return;
  const el = els[G.menu.elId];
  el.innerHTML = (G.menu.title ? `<div class="title">${G.menu.title}</div>` : '') +
    G.menu.rows.map((r, i) => `<div class="row ${i === G.menu.i ? 'sel' : ''} ${r.off ? 'off' : ''}" data-i="${i}">
      <span>${r.label}</span>${r.sub ? `<span class="sub">${r.sub}</span>` : ''}</div>`).join('');
  show(el, true);
}
function menuInput() {
  const m = G.menu;
  if (!m) return;
  if (justPressed('up')) { m.i = (m.i + m.rows.length - 1) % m.rows.length; renderMenu(); }
  if (justPressed('down')) { m.i = (m.i + 1) % m.rows.length; renderMenu(); }
  if (justPressed('a')) {
    const r = m.rows[m.i];
    if (r && !r.off && r.fn) r.fn();
  }
  if (justPressed('b')) { if (m.cancel) m.cancel(); else closeMenu(); }
}

// ---- world main menu ---------------------------------------------------
