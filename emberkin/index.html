const CARD_IDS = Object.keys(CARDS);

/**
 * How far a card may grow. Growth is the fun of the system, so the ceiling is
 * generous — several times the card's own value — but it exists, because a
 * card that grows forever eventually plays the game for you.
 */
const growCap = (id) => Math.round(CARDS[id].v * (CARDS[id].capMul || 4));

/** The ceiling on run-long might. See the note where G.might is added to. */
const MIGHT_CAP = 150;

/** The live value of a card: its base, its permanent growth, its battle growth. */
const cardValue = (inst) => {
  const c = CARDS[inst.id];
  return Math.max(0, c.v + (inst.plus || 0) + (inst.bg || 0));
};

/** Add permanent growth to an owned copy, up to its ceiling. Returns the gain. */
function growCard(owned, amount) {
  const cap = growCap(owned.id);
  const before = owned.plus || 0;
  owned.plus = Math.min(cap, before + amount);
  return owned.plus - before;
}

const cardText = (inst) => CARDS[inst.id].txt.replace('{v}', cardValue(inst));

/** Cards are owned as individual copies, because each one grows on its own. */
function mkCard(id) {
  G.nextUid = (G.nextUid || 1) + 1;
  return { u: G.nextUid, id, plus: 0, plays: 0, kills: 0 };
}

const ownedCard = (u) => G.cards.find((c) => c.u === u) || null;
const deckCards = () => G.deck.map(ownedCard).filter(Boolean);

// All support: the kin brings the damage, the deck makes it hurt more.
const STARTER_DECK = ['edge', 'edge', 'edge', 'guard', 'guard', 'guard', 'focus', 'snack', 'quickstep', 'whet'];
/**
 * A deck you never see through is not a deck, it is a collection.
 *
 * Fights measured out at three and a half turns; five cards a turn against a
 * twenty-four card deck meant you saw two thirds of it once and your best card
 * usually stayed in the draw pile. Twelve is small enough that a fight cycles
 * the whole thing, which is what makes each card you add a real decision — and
 * what makes taking one out a decision too.
 */
/**
 * A deck you never see through is a collection.
 *
 * Fights run about two and a half turns; five cards a turn against twenty-four
 * meant you saw half of it once and your best card usually stayed in the draw
 * pile. Twelve is small enough that a fight cycles the whole thing, which is
 * what makes each card you put in worth putting in — and what makes taking one
 * out a decision rather than a formality.
 */
const DECK_MIN = 6, DECK_MAX = 12;
/**
 * The second wind: you get back what the fight cost you, up to a third of your
 * health. Earned rather than granted — a walkover took nothing off you, so it
 * gives nothing back.
 */
const RALLY_SHARE = 1, RALLY_CAP = .5;

/**
 * Take a card. It always reaches the deck.
 *
 * With a twelve-card deck, the old rule — "add it if there is room" — meant
 * every reward after the twelfth was a card you owned and would never draw, so
 * the offer stopped being a decision about a third of the way through a run. A
 * full deck now makes room by putting out the copy you have played least, which
 * is the closest thing to "the card you were not using" the game can work out on
 * its own. Curating it properly is what the deck screen is for.
 */
function grantCard(id, ask) {
  const c = mkCard(id);
  G.cards.push(c);
  if (G.deck.length < DECK_MAX) { G.deck.push(c.u); return c; }
  // The caller is going to ask which card comes out, so do not guess.
  if (ask) return c;
  const inDeck = G.deck.map(ownedCard).filter(Boolean);
  if (!inDeck.length) { G.deck.push(c.u); return c; }
  // Weakest first, then least used. Going by play count alone thrashes: a card
  // you took last fight has been played nought times, so the next reward throws
  // it straight back out again.
  // A card whose definition has gone — an old save, a renamed id — is worth
  // less than any real card, so it is the first thing out.
  const worthOf = (o) => (CARDS[o.id] ? RARITY_ORDER.indexOf(CARDS[o.id].r) * 100 + (o.plays || 0) : -1);
  let worst = inDeck[0];
  for (const o of inDeck) if (worthOf(o) < worthOf(worst)) worst = o;
  G.deck = G.deck.filter((u) => u !== worst.u);
  G.deck.push(c.u);
  c.replaced = (CARDS[worst.id] || { name: 'an old card' }).name;   // so the offer can say so
  return c;
}

// ---- chests ------------------------------------------------------------
// Costs climb steeply; odds shift toward the top of the table as they do.
const CHESTS = {
  silver:  { name: 'Silver Chest',  cost: 60,   pulls: 3, odds: { common: 80, rare: 17, epic: 3, legendary: 0 } },
  gold:    { name: 'Gold Chest',    cost: 180,  pulls: 3, odds: { common: 55, rare: 33, epic: 11, legendary: 1 } },
  diamond: { name: 'Diamond Chest', cost: 540,  pulls: 3, odds: { common: 25, rare: 40, epic: 28, legendary: 7 } },
  prism:   { name: 'Prism Chest',   cost: 1620, pulls: 4, odds: { common: 5, rare: 30, epic: 45, legendary: 20 } },
};
const CHEST_IDS = Object.keys(CHESTS);
// One source for a chest's colour. It lived as a literal inside the shop's
// render, so the opening beat could not reach it and fell back to gold for all
// four — a 1620-gem Prism burst exactly like a 60-gem Silver, which is most of
// what you paid for. The beat asked for `ch.tint`, a field CHESTS never had,
// and its own `|| gold` fallback hid that.
const CHEST_TINT = { silver: '#c8ccd4', gold: '#ffc94d', diamond: '#7fe0f5', prism: '#c86bff' };

function rollRarity(odds) {
  const total = RARITY_ORDER.reduce((s, r) => s + (odds[r] || 0), 0);
  let n = Math.random() * total;
  for (const r of RARITY_ORDER) {
    n -= odds[r] || 0;
    if (n <= 0) return r;
  }
  return 'common';
}

const cardsOfRarity = (r) => CARD_IDS.filter((id) => CARDS[id].r === r);

/** Open a chest. Returns the card instances granted, or null if you can't pay. */
function openChest(kind) {
  const ch = CHESTS[kind];
  if (!ch || G.gems < ch.cost) return null;
  G.gems -= ch.cost;
  const got = [];
  for (let i = 0; i < ch.pulls; i++) {
    let r = rollRarity(ch.odds);
    let pool = cardsOfRarity(r);
    while (!pool.length) { r = RARITY_ORDER[Math.max(0, RARITY_ORDER.indexOf(r) - 1)]; pool = cardsOfRarity(r); }
    got.push(grantCard(pool[rnd(pool.length)]));
  }
  G.chestsOpened = (G.chestsOpened || 0) + 1;
  return got;
}

/**
 * Three cards to pick from after a win — the deck grows a card at a time, out
 * of what you were actually offered, rather than only out of what you could
 * afford at a shop. A tougher fight offers from further up the rarity table.
 * Never the same card twice in one offer, because a choice between two copies
 * of Guard is not a choice.
 */
const REWARD_ODDS = {
  wild:      { common: 72, rare: 24, epic: 4, legendary: 0 },
  trainer:   { common: 45, rare: 38, epic: 15, legendary: 2 },
  legendary: { common: 10, rare: 35, epic: 40, legendary: 15 },
};
const REWARD_PICKS = 3;

function rewardOdds(b) {
  return b && b.legendary ? REWARD_ODDS.legendary : (b && b.npc ? REWARD_ODDS.trainer : REWARD_ODDS.wild);
}

/** Roll the offer. Returns card ids, no state touched — picking is what commits. */
function rollReward(b, n = REWARD_PICKS) {
  const odds = rewardOdds(b);
  const out = [];
  for (let i = 0; i < n * 12 && out.length < n; i++) {
    let r = rollRarity(odds);
    let pool = cardsOfRarity(r);
    while (!pool.length && RARITY_ORDER.indexOf(r) > 0) { r = RARITY_ORDER[RARITY_ORDER.indexOf(r) - 1]; pool = cardsOfRarity(r); }
    const id = pool[rnd(pool.length)];
    if (id && !out.includes(id)) out.push(id);
  }
  // A short pool should still fill the offer rather than silently shrink it.
  for (const id of CARD_IDS) { if (out.length >= n) break; if (!out.includes(id)) out.push(id); }
  return out.slice(0, n);
}

/** Gems for winning: wild kin are pocket change, trainers pay properly. */
function gemReward(b) {
  if (b.npc) return 6 + Math.floor(b.npc.trainer.prize / 120) + rrange(0, 4);
  return 1 + rrange(0, 2) + (b.legendary ? 40 : 0);
}

// ---- levels, stats, creatures -----------------------------------------
const xpFor = (lvl) => Math.floor(0.8 * lvl * lvl * lvl);
const statAt = (base, lvl) => Math.floor(base * 2 * lvl / 100) + 5;
const hpAt = (base, lvl) => Math.floor(base * 2 * lvl / 100) + lvl + 10;

/** Moves a species knows by `lvl` — the last four it learned. */
function movesAt(id, lvl) {
  const sp = DEX[id];
  const known = sp.learn.filter((e) => e[0] <= lvl).map((e) => e[1]);
  const uniq = [...new Set(known)];
  return uniq.slice(-4).map((m) => ({ id: m, pp: MOVES[m].pp, max: MOVES[m].pp }));
}

/** Build a fresh creature. Everything derived (stats, moves) comes from here. */
function mkMon(id, lvl, opts = {}) {
  const sp = DEX[id];
  if (!sp) return null;
  const m = {
    species: id, name: sp.name, nick: opts.nick || '', lvl,
    types: sp.types.slice(),
    atk: statAt(sp.base[1], lvl), def: statAt(sp.base[2], lvl), spd: statAt(sp.base[3], lvl),
    max: hpAt(sp.base[0], lvl), hp: 0,
    xp: xpFor(lvl), status: '', moves: movesAt(id, lvl),
    stages: { atk: 0, def: 0, spd: 0 },
  };
  m.hp = m.max;
  return m;
}

/** Recompute stats after a level-up, keeping damage taken proportional. */
function refresh(m) {
  const sp = DEX[m.species];
  const oldMax = m.max;
  m.max = hpAt(sp.base[0], m.lvl);
  m.atk = statAt(sp.base[1], m.lvl);
  m.def = statAt(sp.base[2], m.lvl);
  m.spd = statAt(sp.base[3], m.lvl);
  // A level-up hands over the HP it added. Clamped at both ends: if this mon is
  // carrying a maximum bigger than its stats say it should — a caught foe still
  // holding the battle pool, an old save — the correction must not push it
  // through zero and faint a creature that was standing up a moment ago.
  m.hp = clamp(m.hp + (m.max - oldMax), m.hp > 0 ? 1 : 0, m.max);
  m.types = sp.types.slice();
}

const dispName = (m) => m.nick || m.name;
const alive = (m) => m.hp > 0;
const firstAlive = () => G.party.find(alive) || null;
const partyAlive = () => G.party.some(alive);

/** Effective stat including battle stages (−6…+6) and status. */
function effStat(m, key) {
  const st = clamp(m.stages ? m.stages[key] || 0 : 0, -6, 6);
  const mul = st >= 0 ? (2 + st) / 2 : 2 / (2 - st);
  let v = m[key] * mul;
  // Card buffs deliberately do NOT live here. A support card promises flat
  // damage — "+4" means 4 on the bar — and a stat nudged through the level
  // formula would be worth 1 to a level-5 kin and 12 to a level-50 one. They
  // are applied where the damage is, in useMove and hurtMine.
  if (key === 'atk' && m.status === 'burn') v *= .85;
  if (key === 'spd' && m.status === 'chill') v *= .5;
  return Math.max(1, Math.floor(v));
}

// Both of these SAY whether they wrote a new line, because the dex advancing is
// the errand and it used to advance in total silence.
//
// Rowan hands you the game with "there are nineteen kin in this valley — I want
// every one of them written down", the menu carries the tally, and the ending
// counts what is still unwritten. Three pieces of prose agree the book is the
// point. The two moments the book actually moves — meeting a species for the
// first time, and being the one to write it down — were indistinguishable from
// meeting your fiftieth Emberpup. The fact was there in `G.dex` all along; the
// only thing missing was for these to hand it back.
const seeMon = (id) => { if ((G.dex[id] || 0) >= 1) return false; G.dex[id] = 1; return true; };
const catchMon = (id) => { const had = (G.dex[id] || 0) >= 2; G.dex[id] = 2; return !had; };
// One wording for a first sighting, so four call sites cannot drift apart.
const dexNew = (name) => `${name} — new to the dex.`;
// And the other half, in Rowan's own words. He does not say "caught", he says
// "written down in your own hand" — so the payoff screen quotes the errand back
// at the one moment the errand actually moves, with the tally it moved to.

const dexCount = (n) => DEX_ORDER.filter((id) => (G.dex[id] || 0) >= n).length;
/**
 * Numbers as a person says them. Tallies stay as digits — "13 caught" is a
 * reading off a page and looks right — but a count inside a spoken sentence
 * does not: "9 trainers between here and the top of Crown Hollow" reads as a
 * stat line, and Rowan is talking. The point of routing it through here rather
 * than typing the word is that these counts come out of DEX_ORDER and
 * AIM_ORDER, so adding a kin or a trainer cannot leave her saying the old one.
 */
const NUMWORD = ['zero', 'one', 'two', 'three', 'four', 'five', 'six', 'seven', 'eight', 'nine', 'ten',
  'eleven', 'twelve', 'thirteen', 'fourteen', 'fifteen', 'sixteen', 'seventeen', 'eighteen', 'nineteen', 'twenty'];
const spell = (n) => NUMWORD[n] || String(n);
const Spell = (n) => spell(n).replace(/^./, (c) => c.toUpperCase());

/**
 * A count and its noun, agreeing.
 *
 * The win flourish already got this right on the canvas — `+1 gem`, `+2 gems`
 * — and the TOAST for the same win, fired in the same moment two inches away,
 * said `+1 gems`. One number, one event, two places, disagreeing.
 *
 * And the line pass 161 rewrote for zero still read "It cost you 1 shards" for
 * anybody holding four to seven: the zero was fixed and the one was walked
 * straight past, in the same sentence. Both go through here now, so a count
 * cannot meet a noun in this game without them agreeing.
 */
const countOf = (n, one, many) => `${n} ${n === 1 ? one : (many || one + 's')}`;

      '##.....===........##',
      '##......==........##',
      '########==##########',
    ],
    warps: [{ x: 8, y: 11, to: 'emberwood', tx: 8, ty: 1 }, { x: 9, y: 11, to: 'emberwood', tx: 9, ty: 1 }],
    npcs: [
      { x: 9, y: 9, dir: 'down', sprite: 'npc_rival', name: 'Wick', id: 't_wick3', requires: 'beatVespyr',
        lines: ['You got it. Of course you did.', 'I have been up here three days waiting to lose to you properly. Go on.'],
        dynamic: 'rival3',
        trainer: { team: [['tsunaga', 30], ['nocthorn', 29], ['gargolem', 29]], prize: 3000,
          // Three tools, and one of them is the answer to how you beat him last time.
          plan: ['sharpen', 'swing', 'aim', 'swing', 'brace', 'swing'],
          lose: ['There. Now I can go home.', 'Rowan will want to hear it from you, not me.'],
          win: ['Ha! Not today.'] },
        // He sends you down the mountain, and used to go on sending you for
        // ever — including on the walk back up, after you had been and heard
        // her. A parting line that outlives the errand it gave you is the same
        // fault as an errand nobody acknowledges; this is the other end of it.
        after: () => (G.flags.heardEnding
          ? ['She told you, then. She has been rehearsing that since we were nine.',
            'I am staying up here a while. It is quiet, and nothing on this mountain has beaten me yet.']
          : ['Go and see Rowan. She has been pretending not to wait.']) },
    ],
    enc: { rate: .14, table: [['nocthorn', 20, 24, 20], ['voltyx', 20, 24, 20], ['thornip', 20, 24, 20], ['pyrelynx', 20, 24, 20], ['gargolem', 20, 24, 20]] },
    // The shrine's own encounter, as DATA rather than a branch keyed on the map
    // id. `habitat` answers "where is this found" by reading map data, and the
    // one kin the entire game is built toward was invisible to it: the dex said
    // "Not found in the wild. Not anywhere, really." about the thing with its
    // own theme, its own opening line, its own reward and a whole reassurance
    // elsewhere that it will gather on the shrine again. A rule written where
    // nothing else can read it is a rule the rest of the game cannot agree with.
    //
    // `above` is a row index: the shrine grass is the top of the map, and the
    // legendary has always been confined to it. That was a bare `p.y <= 8`.
    legend: { id: 'vespyr', lvl: 26, above: 8, rate: .18, gap: 25,
      gate: 'beatVespyr', mark: 'vespyrSeenAt',
      where: 'the shrine grass at the top of Crown Hollow',
      line: 'The air goes thin and bright. Something old has noticed you.',
      plan: ['sharpen', 'swing', 'aim', 'swing', 'brace', 'swing'] },
  },
};

const tileAt = (map, x, y) => (x < 0 || y < 0 || y >= map.rows.length || x >= map.rows[0].length) ? '#' : map.rows[y][x];

/**
 * An NPC is on the map once its story beat is live and until it walks off.
 *
 * Walking off is DERIVED from the save, never stored on the map. Warden Hale is
 * the only npc who leaves, and he leaves from the one tile it matters on: the
 * path up to Crown Hollow is two wide at the top of the Emberwood and narrows
 * to a single tile at (8,2), which is where he stands, and npcs are impassable.
 * He is the gate, not a decoration in front of one.
 *
 * Beating him used to set `n.gone = true` on the MAPS object. MAPS is a
 * module-level const and the save blob has never carried npc state, so that
 * flag lived exactly as long as the tab did — and it failed in both directions.
 * Reload a save taken after beating him and he is standing in the neck again
 * with `t_hale` already set, so talking to him gives his after-line instead of
 * a rematch and there is no second way round: Crown Hollow, the shrine, the
 * legendary and the last fight are unreachable for the rest of that save's
 * life. Start a NEW run in the same tab and the opposite happens — he is still
 * gone, the pass is open from the first minute, and the Warden never fights.
 *
 * `G.flags` is saved and is rebuilt per run, so reading it fixes both at once.
 */
// `leaves` is the general form of what `block` does to an npc's presence: gone
// once some flag is set. `block` uses the npc's OWN id and also means "stands in
// a path", which is why both exist — Wick is not in anybody's way, he simply
// stops being in town.
const npcActive = (n) => !(n.block && G.flags[n.id]) && !(n.leaves && G.flags[n.leaves])
  && (!n.requires || !!G.flags[n.requires]);

function npcAt(map, x, y) {
  return (map.npcs || []).find((n) => n.x === x && n.y === y && npcActive(n)) || null;
}

/** Can the player step from (fx,fy) to (x,y)? Ledges are one-way, downward. */
function passable(map, x, y, fromY) {
  const t = tileAt(map, x, y);
  if (t === 'L') return y > fromY;         // hop down only
  if (SOLID.has(t)) return false;
  if (npcAt(map, x, y)) return false;
  return true;
}

function warpAt(map, x, y) { return (map.warps || []).find((w) => w.x === x && w.y === y) || null; }

function enterMap(id, x, y, dir) {
  const m = MAPS[id] || MAPS.hollowbrook;
  G.mapId = MAPS[id] ? id : 'hollowbrook';
  G.map = m;
  G.been[G.mapId] = 1;
  G.player.x = G.player.px = x; G.player.y = G.player.py = y;
  G.player.dir = dir || G.player.dir; G.player.moveT = 0;
  G.alert = null;
  // Every beat that owns the screen is abandoned when the ground moves under
  // it. Each of these is a state with a timer, and three of them — blackout,
  // gotcha, flourish — carry a callback that changes the map or opens a screen
  // when it expires, so a stranded one does not merely linger, it acts.
  //
  // Honest note on reachability, correcting an overstatement made when the
  // blackout was added to this list: every one of these beats blocks input
  // while it runs, so a player cannot walk into a warp during one, and the only
  // code path that changes maps underneath a beat is the loss handler. What
  // this list actually prevents is a whole class of "it fired later, somewhere
  // else" rather than a bug anybody has been shown to hit. It earns its place
  // as defence, not as a fix for a symptom in play — the symptom it did fix was
  // the story suite's rival rematch failing about one run in four.
  //
  // `warp` is deliberately absent: warpStep is what calls this function, and
  // clearing it here would cancel the door you are walking through.
  G.rustle = null;
  G.mend = null;
  G.blackout = null;
  G.gotcha = null;
  G.chestOpen = null;
  G.flourish = null;
  G.evoAnim = null;
  // Say where you are. The map name was reachable in exactly two places — the
  // field menu title and the dex habitat line — so walking out of town into the
  // Emberwood, the biggest change of scene in the game, happened in silence.
  //
  // This is deliberately NOT one of the beats above: it owns nothing, blocks no
  // input, and is not in the `step` early-return ladder. You keep walking and
  // it slides away behind you. Interiors stay quiet, and `placeSeen` only moves
  // when something is actually announced, so ducking into the study and back
  // out does not re-announce Hollowbrook — while coming back outside somewhere
  // else does, because that is a real change of place.
  if (m.kind !== 'inside' && G.placeSeen !== G.mapId) {
    G.placeSeen = G.mapId;
    G.place = { name: m.name, t: 0 };
    playCue('place');
  }
  followMap();
  return m;
}

/** Roll the encounter table; returns a fresh wild creature or null. */
/**
 * How far behind your best kin the valley is allowed to fall.
 *
 * The bands used to be fixed, so Route One spawned level 3 kin for ever while
 * you climbed to twelve on them: two fights in five were decided before they
 * started, and the fix for that is not more foe HP, it is foes that are still
 * worth fighting. A wild kin is rolled in its band as before and then brought
 * up to within this many levels of your lead — never above it, so the valley
 * follows you rather than racing you.
 */
const WILD_TRAIL = 3;

function rollEncounter(map) {
  if (!map.enc) return null;
  const lead = G.party.length ? Math.max(...G.party.map((m) => m.lvl)) : 1;
  const scale = (lo, hi) => {
    // Never below the band — walk somewhere you have no business being and it
    // is still dangerous. Never above the band *or* your lead, whichever is
    // higher, so the valley follows you without ever racing ahead.
    const rolled = rrange(lo, hi);
    const ceiling = Math.max(hi, lead);
    return clamp(Math.max(rolled, lead - WILD_TRAIL), lo, ceiling);
  };
  const total = map.enc.table.reduce((s, e) => s + e[3], 0);
  let r = Math.random() * total;
  for (const [id, lo, hi, w] of map.enc.table) {
    r -= w;
    if (r <= 0) return mkMon(id, scale(lo, hi));
  }
  const e = map.enc.table[0];
  return mkMon(e[0], scale(e[1], e[2]));
}
/* =========================================================== §4 — sprites ==
   Art arrives as {p: palette, r: rows-of-chars}. Each sprite is painted once
   into an offscreen canvas at 1:1 and then blitted scaled with smoothing off.
   Missing art must never break anything — every lookup falls back.
   ======================================================================== */
const SPR = { creature: ART_CREATURES, tile: ART_TILES, actor: ART_ACTORS, card: ART_CARDS };
const sprCache = new Map();

function mkCanvas(w, h) {
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  return c;
}

/** Paint a char-grid def into a canvas. `mode` 'sil' renders a flat shadow. */
function rasterize(def, mode) {
  const rows = def.r, h = rows.length, w = rows[0].length;
  const c = mkCanvas(w, h);
  const g = c.getContext('2d');
  for (let y = 0; y < h; y++) {
    const row = rows[y];
    let x = 0;
    while (x < w) {
      const ch = row[x];
      if (ch === '.' || ch === ' ') { x++; continue; }
      let run = 1;
      while (x + run < w && row[x + run] === ch) run++;   // fill runs, not pixels
      g.fillStyle = mode === 'sil' ? '#1b1224' : (def.p[ch] || '#ff00ff');
      g.fillRect(x, y, run, 1);
      x += run;
    }
  }
  return c;
}

function sprite(kind, id, mode) {
  const key = kind + ':' + id + (mode || '');
  if (sprCache.has(key)) return sprCache.get(key);
  const def = (SPR[kind] || {})[id];
  let c = null;
  if (def && def.r && def.r.length) {
    try { c = rasterize(def, mode); } catch (e) { c = null; }
  }
  sprCache.set(key, c);
  return c;
}

const hasArt = (kind, id) => !!((SPR[kind] || {})[id]);

/**
 * Blit a sprite. x,y is the top-left in canvas pixels; scale is an integer so
 * pixels stay square. When art is missing we draw a soft placeholder blob in
 * the creature's type colour rather than nothing.
 */
function drawSpr(g, kind, id, x, y, scale = 1, opt = {}) {
  const c = sprite(kind, id, opt.sil ? 'sil' : '');
  if (!c) { placeholder(g, kind, id, x, y, scale); return; }
  const w = c.width * scale, h = c.height * scale;
  g.save();
  if (opt.alpha != null) g.globalAlpha = opt.alpha;
  // Flipping is a transform, so the blit below is written once for both cases.
  if (opt.flip) { g.translate(x + w, y); g.scale(-1, 1); } else { g.translate(x, y); }
  g.drawImage(c, 0, 0, w, h);
  if (opt.flash > 0) {                   // additive re-blit reads as a hit flash
    g.globalCompositeOperation = 'lighter';
    g.globalAlpha = clamp(opt.flash, 0, 1) * .9;
    g.drawImage(c, 0, 0, w, h);
  }
  g.restore();
}

function placeholder(g, kind, id, x, y, scale) {
  const size = (kind === 'creature' ? 40 : kind === 'tile' ? 16 : 22) * scale;
  const sp = DEX[id];
  g.save();
  g.fillStyle = sp ? TYPES[sp.types[0]] : '#4a3560';
  g.globalAlpha = .85;
  const w = size, h = size;
  g.beginPath();
  if (g.ellipse) g.ellipse(x + w / 2, y + h * .62, w * .34, h * .3, 0, 0, Math.PI * 2);
  else g.rect(x + w * .2, y + h * .35, w * .6, h * .5);
  g.fill();
  g.fillStyle = '#1b1224';
  g.fillRect(x + w * .38, y + h * .5, Math.max(1, w * .06), Math.max(1, h * .06));
  g.fillRect(x + w * .56, y + h * .5, Math.max(1, w * .06), Math.max(1, h * .06));
  g.restore();
}

/** Height of a creature's drawn pixels — used to sit sprites on the ground. */
function artBottom(id) {
  const def = ART_CREATURES[id];
  if (!def) return 40;
  for (let y = def.r.length - 1; y >= 0; y--) {
    if (/[^. ]/.test(def.r[y])) return y + 1;
  }
  return 40;
}

/** Draw a creature into a small DOM canvas (party/dex cards). */
function paintTo(canvas, kind, id, scale, sil) {
  if (HEADLESS || !canvas || !canvas.getContext) return;
  const g = canvas.getContext('2d');
  g.imageSmoothingEnabled = false;
  g.clearRect(0, 0, canvas.width, canvas.height);
  drawSpr(g, kind, id, 0, 0, scale, { sil });
}
/* ========================================================= §5 — overworld ==
   Grid movement with a short tween per step, encounters rolled on arrival in
   tall grass, warps on arrival, and A-button interaction with whatever the
   player is facing.
   ======================================================================== */
const VIEW_W = 256, VIEW_H = 208;
const STEP_TIME = .15;
const WIPE_T = .55;                    // battle-entry wipe, seconds
const LVL_T = .8;                      // how long a level-up shows for
const DIRS = { up: [0, -1], down: [0, 1], left: [-1, 0], right: [1, 0] };

const keys = new Set();       // held
const fired = new Set();      // pressed this frame, consumed by handlers
const held = (k) => keys.has(k);
const justPressed = (k) => fired.has(k);

const KEYMAP = {
  ArrowUp: 'up', ArrowDown: 'down', ArrowLeft: 'left', ArrowRight: 'right',
  w: 'up', s: 'down', a: 'left', d: 'right', W: 'up', S: 'down', A: 'left', D: 'right',
  z: 'a', Z: 'a', Enter: 'a', ' ': 'a',
  x: 'b', X: 'b', Escape: 'b', Backspace: 'b',
};

function pressKey(k) { if (!keys.has(k)) fired.add(k); keys.add(k); }

/** Which way a stick pull counts as, or null inside the dead zone. */
function stickDir(dx, dy, dead = 14) {
  if (Math.hypot(dx, dy) < dead) return null;
  return Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'right' : 'left') : (dy > 0 ? 'down' : 'up');
}

/** Go fullscreen, or come back. Silently fine on browsers that refuse. */
function toggleFullscreen() {
  if (HEADLESS) return false;
  const doc = document, el = doc.documentElement;
  const on = doc.fullscreenElement || doc.webkitFullscreenElement;
  try {
    if (!on) {
      const req = el.requestFullscreen || el.webkitRequestFullscreen;
      if (!req) { setToast('This browser will not go fullscreen.'); return false; }
      const r = req.call(el);
      if (r && r.catch) r.catch(() => setToast('Fullscreen was refused.'));
    } else {
      const exit = doc.exitFullscreen || doc.webkitExitFullscreen;
      if (exit) exit.call(doc);
    }
  } catch (e) { return false; }
  return true;
}
function releaseKey(k) { keys.delete(k); }
/**
 * A tap is a press AND a release. A click has no keyup to end it, and
 * `pressKey` only adds to `fired` when the key is not already held — so a bare
 * `pressKey('a')` from a click worked exactly once and then never again: 'a'
 * stayed in `keys` for the rest of the page's life and every later tap was a
 * no-op. Tapping to advance a dialogue died after the first line, which is the
 * whole of that affordance on a phone. A keyboard player never saw it, because
 * the first Z they pressed released 'a' for them.
 * Releasing immediately is safe: `fired` is what `justPressed` reads and it is
 * cleared by the frame, not by this. It releases FIRST as well, so a tap always
 * lands even if something else has left the key held — the test below asserts
 * that, and the first version of this could not do it.
 */
function tapKey(k) { releaseKey(k); pressKey(k); releaseKey(k); }

const cam = { x: 0, y: 0 };
function updateCam() {
  const mw = G.map.rows[0].length * TILE, mh = G.map.rows.length * TILE;
  const cx = (G.player.px + .5) * TILE - VIEW_W / 2;
  const cy = (G.player.py + .5) * TILE - VIEW_H / 2 - 6;
  cam.x = mw <= VIEW_W ? (mw - VIEW_W) / 2 : clamp(cx, 0, mw - VIEW_W);
  cam.y = mh <= VIEW_H ? (mh - VIEW_H) / 2 : clamp(cy, 0, mh - VIEW_H);
}

/** Start a step if the target tile allows it. Returns true when moving. */
function tryMove(dir) {
  const p = G.player;
  if (p.moveT > 0) return false;
  p.dir = dir;
  const [dx, dy] = DIRS[dir];
  let nx = p.x + dx, ny = p.y + dy;
  const t = tileAt(G.map, nx, ny);
  // A ledge is a one-way hop: you clear it and land on the far side.
  if (t === 'L' && dir === 'down') {
    if (!passable(G.map, nx, ny + 1, ny)) return false;
    p.hop = true; ny += 1;
  } else if (!passable(G.map, nx, ny, p.y)) {
    p.bump = .12;
    return false;
  }
  p.x = nx; p.y = ny;
  p.moveT = p.hop ? STEP_TIME * 1.6 : STEP_TIME;
  p.moveLen = p.hop ? 2 : 1;
  return true;
}

/** Called the moment the player lands on a new tile. */
function onArrive() {
  const p = G.player;
  G.steps++;
  playCue(stepCue(tileAt(G.map, p.x, p.y)));
  const w = warpAt(G.map, p.x, p.y);
  if (w) { doWarp(w); return; }
  if (trainerSight()) return;
  if (!GRASSY.has(tileAt(G.map, p.x, p.y)) || !G.map.enc) return;

  // The legendary haunts the shrine grass and gets first refusal. Losing it is
  // not permanent — it comes back around, so a wipe never ends the hunt.
  // Every number here now comes off the map (see crown_hollow.legend); this
  // used to be the map id, the row, the rate and the cooldown all written out
  // where nothing but this line could read them.
  const lg = G.map.legend;
  if (lg && !G.flags[lg.gate] && p.y <= lg.above
      && G.steps > (G.flags[lg.mark] || 0) + lg.gap && chance(lg.rate)) {
    G.flags[lg.mark] = G.steps;
    say('', [lg.line], () => {
      startBattle({ foe: mkMon(lg.id, lg.lvl), wild: true, legendary: true, plan: lg.plan });
    });
    return;
  }
  if (chance(G.map.enc.rate)) {
    const foe = rollEncounter(G.map);
    // Sometimes two of them. The partner comes off the same table, so a pair is
    // whatever that patch of grass holds rather than a special encounter.
    const pair = foe && chance(WILD_PAIR) ? rollEncounter(G.map) : null;
    if (foe) {
      playCue('rustle');
      G.rustle = { t: 0, x: p.x, y: p.y, go: () => startBattle({ foe, wild: true, pair }) };
    }
  }
}

/**
 * Something in the grass.
 *
 * A trainer spotting you gets three beats — the look, the walk, the pause — and
 * a wild encounter got none: you took a step and the wipe was already closing.
 * Filming it made the asymmetry obvious, and it is the beat the world plays most
 * often. This is the half-second before the fight: the blades you are standing
 * in thrash, leaves come off them, and only then does the screen close.
 *
 * It is deliberately shorter than the trainer's ambush. Being called out by a
 * person is an event; grass moving is a warning, and a warning that outstays
 * itself becomes a loading screen.
 */
const RUSTLE_T = .40;

function rustleStep(dt) {
  const r = G.rustle;
  if (!r) return false;
  r.t += dt;
  if (r.t < RUSTLE_T) return true;
  G.rustle = null;
  r.go();
  return true;
}

/** The blades thrashing, and what comes off them. */
function drawRustle(g, cam) {
  const r = G.rustle;
  if (!r) return;
  const k = clamp(r.t / RUSTLE_T, 0, 1);
  const sx = Math.round(r.x * TILE - cam.x), sy = Math.round(r.y * TILE - cam.y);
  const cx = sx + 8, cy = sy + 11;
  // The thrash builds rather than starting at full tilt — grass does not snap
  // to violent, and a shake that opens at maximum reads as a glitch.
  const amp = Math.sin(k * Math.PI) ** .6;

  // The grass parts: a dark hollow opening under the player.
  //
  // The first attempt shook the tall-grass tile itself, three offset copies of
  // it, and was completely invisible — because the field tiles seamlessly, so
  // sliding one tile sideways over identical neighbours changes nothing you can
  // see. A texture that repeats cannot be shaken. What CAN be seen is a hole in
  // it and something thrown out of it.
  g.save();
  g.globalAlpha = amp * .55;
  g.fillStyle = '#101c14';
  if (g.ellipse) {
    g.beginPath(); g.ellipse(cx, cy, 7 * amp, 3 * amp, 0, 0, Math.PI * 2); g.fill();
  } else g.fillRect(cx - 6, cy - 2, 12, 4);
  g.restore();

  // Blades flicking out of the hollow, alternating sides, in the pale green the
  // tuft highlights already use so they sit in the palette without vanishing
  // into the field the way a mid-green did.
  g.fillStyle = '#b8e88a';
  for (let i = 0; i < 5; i++) {
    const side = i % 2 ? 1 : -1;
    const lean = Math.round(Math.sin(G.t * 30 + i * 1.7) * 2 * amp);
    const h = Math.round((5 + (i % 3) * 3) * amp);
    const bx = cx + side * (2 + (i >> 1) * 3) + lean;
    for (let y = 0; y < h; y++) {
      g.fillRect(bx + Math.round(side * y * .25), cy - 2 - y, 1, 1);
    }
  }

  // Leaves thrown clear and falling back. Warm and pale rather than
  // grass-coloured: green specks on green grass is camouflage, which is exactly
  // what the second attempt turned out to be. Fixed seeds, so the same step
  // always throws the same spray and nothing pops between frames.
  for (let i = 0; i < 12; i++) {
    const a = (i * 2.39) % (Math.PI * 2);
    const age = clamp(k * 1.7 - i * .035, 0, 1);
    if (age <= 0 || age >= 1) continue;
    const rad = age * (12 + (i % 4) * 6);
    const lx = cx + Math.cos(a) * rad;
    const ly = cy - 2 + Math.sin(a) * rad * .45 - (1 - (2 * age - 1) ** 2) * 12;
    const sz = i % 3 ? 1 : 2;
    g.globalAlpha = (1 - age * age) * .9;
    g.fillStyle = '#0e1a12';                       // a rim, so it never dissolves
    g.fillRect(Math.round(lx) - 1, Math.round(ly) - 1, sz + 2, sz + 2);
    g.fillStyle = i % 4 ? '#d8f0a0' : '#fff4cf';
    g.fillRect(Math.round(lx), Math.round(ly), sz, sz);
  }
  g.globalAlpha = 1;
}

/**
 * Being healed.
 *
 * Every other thing that happens to you has a beat: an orb arcs and wobbles, an
 * evolution turns a wheel of light, the grass parts before a wild kin, a trainer
 * looks and walks over. The Wayhouse — the place you go after every rough fight,
 * and the only good thing that happens to you outside a win — restored the whole
 * party silently between two lines of dialogue. Listing what has a beat and what
 * does not is what found it; nothing about the code says it is missing.
 *
 * A warmth rising off the floor and closing over you, and it holds a moment
 * after the light goes, because the pause is what makes it a rest rather than a
 * transaction.
 */
const MEND_T = 1.15;

function mendStep(dt) {
  const m = G.mend;
  if (!m) return false;
  m.t += dt;
  if (m.t < MEND_T) return true;
  G.mend = null;
  m.go();
  return true;
}

function drawMend(g, cam) {
  const m = G.mend;
  if (!m) return;
  const k = clamp(m.t / MEND_T, 0, 1);
  const sx = Math.round(G.player.px * TILE - cam.x) + 8;
  const sy = Math.round(G.player.py * TILE - cam.y) + 8;
  // Swells and then lets go — the fall is longer than the rise, which is the
  // difference between being healed and being flashed at.
  const amp = k < .35 ? k / .35 : Math.pow(1 - (k - .35) / .65, 1.6);

  // The whole room lifts and settles. A warm glow on a warm floor is
  // camouflage — the Wayhouse is the most golden interior in the game, which is
  // exactly the wrong background for adding gold to — so what carries the beat
  // is a change over time rather than a difference in colour: the light comes
  // up across the frame and goes again.
  g.save();
  g.globalCompositeOperation = 'lighter';
  g.fillStyle = `rgba(96,150,110,${(amp * .16).toFixed(3)})`;
  g.fillRect(0, 0, VIEW_W, VIEW_H);
  g.restore();

  g.save();
  g.globalCompositeOperation = 'lighter';
  const glow = g.createRadialGradient(sx, sy, 2, sx, sy, 26 + k * 34);
  glow.addColorStop(0, `rgba(255,236,190,${(amp * .5).toFixed(3)})`);
  glow.addColorStop(.55, `rgba(150,230,170,${(amp * .22).toFixed(3)})`);
  glow.addColorStop(1, 'rgba(120,220,150,0)');
  g.fillStyle = glow;
  g.fillRect(0, 0, VIEW_W, VIEW_H);
  g.restore();

  // Motes lifting off the floor rather than falling onto it — the direction is
  // the whole reading. Fixed seeds, so a rest always looks like the same rest.
  for (let i = 0; i < 16; i++) {
    const a = (i * 2.39) % (Math.PI * 2);
    const age = clamp(k * 1.35 - i * .035, 0, 1);
    if (age <= 0 || age >= 1) continue;
    const rad = 4 + (i % 5) * 4;
    const mx = sx + Math.cos(a) * rad;
    const my = sy + 6 - age * (18 + (i % 4) * 7);
    g.globalAlpha = Math.sin(age * Math.PI) * .95;
    g.fillStyle = '#0e1a12';
    g.fillRect(Math.round(mx) - 1, Math.round(my) - 1, 3, 3);
    g.fillStyle = i % 3 ? '#bdf0c4' : '#fff4cf';
    g.fillRect(Math.round(mx), Math.round(my), 1, 1);
  }
  g.globalAlpha = 1;
}

/**
 * Going down.
 *
 * Losing the whole party said two lines and then teleported you to the
 * Wayhouse on the same frame — a harder cut than walking through a door, which
 * at least gets a curtain. The one moment in the game where you lose something
 * was the only transition in it with no transition.
 *
 * The dark closes over the arena and holds a moment before the room comes up.
 * The hold is the point: it is the difference between being moved and being
 * carried.
 */
const BLACKOUT_T = 1.05;

function blackoutStep(dt) {
  const o = G.blackout;
  if (!o) return false;
  o.t += dt;
  if (o.t < BLACKOUT_T) return true;
  G.blackout = null;
  o.go();
  return true;
}

/** How black the screen is, 0 to 1, or 0 when nothing is going down. */
function blackoutCover() {
  const o = G.blackout;
  if (!o) return 0;
  // Closes over three quarters of the beat, then holds — so the last of it is
  // silence rather than motion.
  return clamp(o.t / (BLACKOUT_T * .72), 0, 1);
}

const SIGHT = 4;                       // how far down their own line a trainer looks
/** The three beats of being caught out: the look, the walk, and the pause. */
const ALERT = { spot: .55, walk: .55, land: .25 };

/** True while the ambush owns the screen. */
function alertStep(dt) {
  const a = G.alert;
  if (!a || !a.beats) return false;
  a.t += dt;
  const beat = a.beats[a.i];
  if (beat && beat[0] === 'walk') {
    // Slide them across in pixels. The tile they occupy never changes, so
    // nothing about collision or interaction has to know this is happening.
    const k = clamp(a.t / beat[1], 0, 1);
    const e = 1 - Math.pow(1 - k, 2);
    a.npc.ox = Math.round((a.stop.x - a.from.x) * TILE * e);
    a.npc.oy = Math.round((a.stop.y - a.from.y) * TILE * e);
  }
  if (beat && a.t < beat[1]) return true;
  a.t = 0; a.i++;
  if (a.beats[a.i]) return true;
  const npc = a.npc;
  npc.ox = 0; npc.oy = 0;
  G.alert = null;
  talkTo(npc);
  return false;
}

/** How far the frame has closed in, 0–1. */
const alertClose = () => {
  const a = G.alert;
  if (!a || !a.beats) return 0;
  const beat = a.beats[a.i];
  if (!beat) return 1;
  if (beat[0] === 'spot') return clamp(a.t / beat[1], 0, 1);
  return 1;
};

/**
 * A trainer only gets to ambush you once. Beat them and they are done; lose to
 * them and they have made their point — the rematch is there when you go and
 * ask for it. Without this a trainer standing on the only road out of town
 * re-challenges you the moment you walk back, and a loss becomes a soft-lock
 * you cannot train your way out of, because the grass is on their side of them.
 */
const sightSpent = (id) => `seen_${id}`;

/**
 * Did an unbeaten trainer just see the player walk into their line? Sight is
 * blocked by anything solid, so you can sneak behind a tree.
 */
function trainerSight() {
  const p = G.player;
  for (const n of (G.map.npcs || [])) {
    if (!n.trainer || !npcActive(n) || G.flags[n.id] || G.flags[sightSpent(n.id)]) continue;
    const [dx, dy] = DIRS[n.dir] || [0, 1];
    for (let i = 1; i <= SIGHT; i++) {
      const x = n.x + dx * i, y = n.y + dy * i;
      if (SOLID.has(tileAt(G.map, x, y))) break;
      if (x === p.x && y === p.y) {
        // Turn and face whoever just called you out.
        p.dir = dx ? (dx > 0 ? 'left' : 'right') : (dy > 0 ? 'up' : 'down');
        G.flags[sightSpent(n.id)] = 1;         // they got their ambush; that was it
        // An ambush used to be an exclamation mark and a dialogue box with an
        // ellipsis in it. It is a beat now: they see you, the frame closes in,
        // and they walk over. Nothing you can do about any of it, which is the
        // point of being ambushed.
        // One tile short of you — dx,dy points from them TOWARDS you, so the
        // tile before you is p minus that step, not p plus it. Adding it walked
        // them through you and left them addressing your back: filming the
        // ambush showed the player above the trainer by the time it landed.
        const stop = { x: p.x - dx, y: p.y - dy };
        G.alert = { npc: n, t: 0, i: 0, from: { x: n.x, y: n.y }, stop,
          beats: [['spot', ALERT.spot], ['walk', ALERT.walk], ['land', ALERT.land]] };
        playCue('spotted');
        return true;
      }
    }
  }
  return false;
}

/**
 * A door goes *through* black, not straight to it.
 *
 * The map used to change on the frame you stepped on the warp and then fade up
 * from black, which reads as a cut with a stain on it: you see the new room
 * before the old one has gone. Now the screen closes first, the map changes
 * behind the curtain, and it opens again — same total time, and the only frame
 * either room is on screen at less than full brightness is one it earned.
 */
const WARP_SHUT = .17;
function doWarp(w) {
  G.warp = { to: w, t: WARP_SHUT };
  playCue('door');
}

/** True while the curtain is down and nobody may move. */
function warpStep(dt) {
  if (!G.warp) return false;
  G.warp.t -= dt;
  if (G.warp.t > 0) return true;
  const w = G.warp.to;
  G.warp = null;
  enterMap(w.to, w.tx, w.ty, w.dir || G.player.dir);
  updateCam();
  saveGame();
  G.fade = .3;                     // …and open again
  return true;                     // this frame still belongs to the transition
}

/** A-button: talk to whatever is in front, or read a sign. */
function interact() {
  const p = G.player;
  const [dx, dy] = DIRS[p.dir];
  const tx = p.x + dx, ty = p.y + dy;
  const npc = npcAt(G.map, tx, ty);
  if (npc) { faceNpc(npc, p); talkTo(npc); return true; }
  const sign = (G.map.signs || {})[tx + ',' + ty];
  if (sign) { say('', [sign]); return true; }
  return false;
}

function faceNpc(npc, p) {
  npc.dir = p.dir === 'up' ? 'down' : p.dir === 'down' ? 'up' : p.dir === 'left' ? 'right' : 'left';
}

function updateWorld(dt) {
  const p = G.player;
  if (p.bump > 0) p.bump = Math.max(0, p.bump - dt);

  if (p.moveT > 0) {
    p.moveT -= dt;
    const total = (p.moveLen === 2 ? STEP_TIME * 1.6 : STEP_TIME);
    const k = clamp(1 - p.moveT / total, 0, 1);
    const [dx, dy] = DIRS[p.dir];
    const len = p.moveLen || 1;
    p.px = p.x - dx * len * (1 - k);
    p.py = p.y - dy * len * (1 - k);
    if (p.moveT <= 0) {
      p.moveT = 0; p.px = p.x; p.py = p.y; p.step ^= 1; p.hop = false; p.moveLen = 1;
      onArrive();
    }
  } else {
    if (justPressed('b')) { openMainMenu(); return; }
    if (justPressed('a')) { if (interact()) return; }
    for (const d of ['up', 'down', 'left', 'right']) if (held(d)) { tryMove(d); break; }
  }
  updateCam();
}

// ---- drawing -----------------------------------------------------------
function drawTile(g, ch, sx, sy) {
  const id = TILE_ART[ch] || 'grass';
  if (hasArt('tile', id)) { drawSpr(g, 'tile', id, sx, sy, 1); return; }
  // Fallback palette so the world is still legible before art lands.
  const FB = { grass: '#4d9a3c', tallgrass: '#2f7a3a', path: '#c4a276', water: '#2b7fc0',
    tree: '#1f5230', rock: '#7d6a5c', flowers: '#5cb340', sand: '#e0cfa2', fence: '#8a6a45',
    wall: '#d8c9ad', roof: '#a8402f', door: '#6b4526', sign: '#8a6a45', ledge: '#3f7a37' };
  g.fillStyle = FB[id] || '#4d9a3c';
  g.fillRect(sx, sy, TILE, TILE);
}

/** The player's walk frame for a direction, with a mirrored fallback. */
function drawPlayer(g, dir, step, sx, sy, moving) {
  const frame = moving ? step : 0;
  let id = `player_${dir}_${frame}`;
  let flip = false;
  if (!hasArt('actor', id) && dir === 'right') {
    id = `player_left_${frame}`; flip = true;      // mirror if right frames are missing
  }
  if (!hasArt('actor', id)) id = 'player_down_0';
  drawSpr(g, 'actor', id, sx, sy, 1, { flip });
}

function drawWorld(g) {
  const map = G.map;
  const x0 = Math.floor(cam.x / TILE), y0 = Math.floor(cam.y / TILE);
  const ox = -(cam.x % TILE), oy = -(cam.y % TILE);
  // What is behind the map, where the map runs out.
  //
  // This was a flat fill, and most rooms are smaller than the viewport, so a
  // small map read as a picture pasted on a dead rectangle. It is a light now:
  // the room sits in a glow of its own air, falling off to almost nothing at the
  // corners, so the frame is somewhere rather than nowhere.
  const air = AIR[G.mapId] || AIR_DEFAULT;
  const base = map.kind === 'inside' ? [26, 18, 32] : [12, 26, 20];
  if (g.createRadialGradient) {
    const bg = g.createRadialGradient(VIEW_W / 2, VIEW_H / 2, 8,
      VIEW_W / 2, VIEW_H / 2, VIEW_W * .72);
    const t = air.tint;
    const mix = (c, k) => Math.round(base[c] + (t[c] - base[c]) * k);
    bg.addColorStop(0, `rgb(${mix(0, .20)},${mix(1, .20)},${mix(2, .20)})`);
    bg.addColorStop(.55, `rgb(${mix(0, .07)},${mix(1, .07)},${mix(2, .07)})`);
    bg.addColorStop(1, `rgb(${Math.round(base[0] * .34)},${Math.round(base[1] * .34)},${Math.round(base[2] * .34)})`);
    g.fillStyle = bg;
  } else {
    g.fillStyle = map.kind === 'inside' ? '#2a2030' : '#14301f';
  }
  g.fillRect(0, 0, VIEW_W, VIEW_H);

  // Anything in the valley that is lit from inside, and the pool it throws.
  //
  // A window was a picture of a window: a warm rectangle with the same dark
  // floor under it as everywhere else. Light that leaves its own tile is what
  // makes a room feel occupied and a street feel like evening, and it costs one
  // additive gradient per source. The flicker is two sines beating against each
  // other, so a row of windows never pulses in step.
  const lit = [];
  for (let y = 0; y <= VIEW_H / TILE + 1; y++) {
    for (let x = 0; x <= VIEW_W / TILE + 1; x++) {
      const mx = x0 + x, my = y0 + y;
      if (my < 0 || my >= map.rows.length || mx < 0 || mx >= map.rows[0].length) continue;
      const ch = map.rows[my][mx];
      const sx = Math.round(x * TILE + ox), sy = Math.round(y * TILE + oy);
      if (ch === 'n' || ch === 'D') lit.push([sx + TILE / 2, sy + TILE / 2, mx, my, ch]);
      // Buildings and props sit on ground, so paint grass under them first.
      if (ch === 'R' || ch === 'W' || ch === 'D' || ch === 'S' || ch === 'o' || ch === 'f' || ch === '|') drawTile(g, '.', sx, sy);
      if (ch === '~') {
        // Water bobs: scroll the tile a pixel and wrap it inside its own cell.
        const dy = Math.round(Math.sin(G.t * 1.6 + mx * .8 + my * .5) * 1.2);
        g.save();
        g.beginPath(); g.rect(sx, sy, TILE, TILE); g.clip();
        drawTile(g, ch, sx, sy + dy);
        drawTile(g, ch, sx, sy + dy - TILE * (dy < 0 ? -1 : 1));
        g.restore();
        continue;
      }
      if (ch === ',') {
        // Wind crosses a field as a travelling wave, so the blades ripple in
        // sequence rather than shivering all at once. Only the top of the tile
        // moves — the roots stay put, which is the difference between grass
        // bending and grass sliding.
        const w = WIND[G.mapId] || WIND._;
        const sway = Math.round(Math.sin(G.t * w[0] + (mx + my * .35) * .55) * w[1]);
        drawTile(g, ch, sx, sy);
        if (sway) {
          g.save();
          g.beginPath(); g.rect(sx, sy, TILE, 9); g.clip();
          drawTile(g, ch, sx + sway, sy);
          drawTile(g, ch, sx + sway - TILE * (sway < 0 ? -1 : 1), sy);
          g.restore();
        }
        continue;
      }
      drawTile(g, ch, sx, sy);
    }
  }
  drawEdges(g, map, x0, y0, ox, oy);

  // What every standing thing throws on the ground in front of it.
  //
  // The player and the NPCs have cast a shadow all along (`castShadow`); the
  // buildings, trees, rocks and fences they walk between never did. Hollowbrook
  // is the first outdoors a player sees and it measured as the flattest bright
  // map in the game — mean 86, sd 20.6, against the shore's 25.7 — and the
  // grade was not the lever: pushing the town's washes and vignette moved sd by
  // 0.1, because a grade is a wash over the whole frame and flatness is a want
  // of LOCAL contrast. A wash cannot make one tile darker than its neighbour.
  // This can.
  //
  // A second pass rather than a branch in the loop above, which already forks
  // five ways for water and grass and props. Under the window pools on purpose:
  // a lamp should wash its own shadows out.
  //
  // Indoors too. That started as an exclusion on the grounds that the study
  // already reads best in the game, which is an assumption rather than a look —
  // photographing it with interiors included put a band under the top wall and
  // gave the room an edge, so the walls are enclosing something now instead of
  // being drawn around it.
  // Only things that fill their tile. A full-width shadow is right under a wall
  // and badly wrong under a rock: the first version cast from rocks, fences and
  // signs too, and a round rock a third of a tile across threw a hard-edged
  // slab the full width of one — a floating rectangle, not a shadow. Town read
  // well and Route One read broken, and the difference was entirely that a
  // building fills its tile and a prop does not.
  const CASTS = new Set(['#', 'W', 'R', 'D', 'n']);
  if (g.createLinearGradient) {
    g.save();
    for (let y = 0; y <= VIEW_H / TILE + 1; y++) {
      for (let x = 0; x <= VIEW_W / TILE + 1; x++) {
        const mx = x0 + x, my = y0 + y;
        if (my <= 0 || my >= map.rows.length || mx < 0 || mx >= map.rows[0].length) continue;
        if (CASTS.has(map.rows[my][mx])) continue;          // a wall's own face, not ground
        if (!CASTS.has(map.rows[my - 1][mx])) continue;      // nothing standing above it
        const sx = Math.round(x * TILE + ox), sy = Math.round(y * TILE + oy);
        const gr = g.createLinearGradient(0, sy, 0, sy + TILE * .75);
        gr.addColorStop(0, 'rgba(14,10,26,.34)');
        gr.addColorStop(1, 'rgba(14,10,26,0)');
        g.fillStyle = gr;
        // Offset a little with the light, which comes across rather than down.
        g.fillRect(sx + 1, sy, TILE, TILE * .75);
      }
    }
    g.restore();
  }

  // The light the windows and doorways throw, over the ground and under
  // everything that walks on it — so a lamp lights the street, not the player's
  // hat. Additive, because light adds.
  if (lit.length && g.createRadialGradient) {
    g.save();
    g.globalCompositeOperation = 'lighter';
    for (const [cx, cy, mx, my, ch] of lit) {
      // Two sines that do not divide into each other, so a terrace of windows
      // breathes out of step instead of blinking as one sign.
      const f = .82 + .12 * Math.sin(G.t * 1.7 + mx * 1.9)
        + .06 * Math.sin(G.t * 2.9 + my * 2.7);
      const r = ch === 'D' ? 30 : 24;
      const warm = ch === 'D' ? [255, 196, 116] : [255, 214, 150];
      const gr = g.createRadialGradient(cx, cy + 4, 1, cx, cy + 4, r);
      gr.addColorStop(0, `rgba(${warm[0]},${warm[1]},${warm[2]},${(.30 * f).toFixed(3)})`);
      gr.addColorStop(.45, `rgba(${warm[0]},${warm[1]},${warm[2]},${(.11 * f).toFixed(3)})`);
      gr.addColorStop(1, `rgba(${warm[0]},${warm[1]},${warm[2]},0)`);
      g.fillStyle = gr;
      g.fillRect(cx - r, cy + 4 - r, r * 2, r * 2);
    }
    g.restore();
  }

  // Entities, back to front by tile row.
  const ents = [];
  for (const n of (map.npcs || [])) if (npcActive(n)) ents.push({ y: n.y, draw: () => {
    const sx = Math.round(n.x * TILE - cam.x) + (n.ox || 0),
          sy = Math.round(n.y * TILE - cam.y - 6) + (n.oy || 0);
    // Everyone breathes, and everyone on their own phase — a town whose people
    // bob in unison is a metronome, not a town. Seeded off the tile so it is
    // stable across frames and different for each person standing in it.
    const seed = (n.x * 7 + n.y * 13) % 11;
    const p0 = G.player;
    const near = Math.abs(p0.x - n.x) + Math.abs(p0.y - n.y) <= 2;
    const bob = Math.round(Math.sin(G.t * (near ? 3.6 : 2.1) + seed) * (near ? 1.4 : .9));
    // …and everyone turns to look at you. The NPC art faces the viewer, so a
    // mirror is the only honest turn available: left and right are real, up
    // and down keep them facing forward rather than lying about the sprite.
    const flip = near ? p0.x < n.x : n.dir === 'left';
    castShadow(g, sx, sy);
    drawSpr(g, 'actor', n.sprite, sx, sy - bob, 1, { flip });
    if (n.trainer && !G.flags[n.id]) {
      // A quiet marker normally; a big jolt on the frame they spot you.
      const spotted = G.alert && G.alert.npc === n;
      const bob = spotted ? -Math.abs(Math.sin(G.t * 14)) * 4 : Math.sin(G.t * 4) * 1.5;
      const s = spotted ? 2 : 1;
      g.fillStyle = spotted ? '#fff' : '#ffc94d';
      g.fillRect(sx + 8 - s, sy - 8 - 3 * s + bob, s * 2, s * 5);
      g.fillRect(sx + 8 - s, sy - 2 + bob, s * 2, s * 2);
    }
  } });
  const p = G.player;
  ents.push({ y: p.py, draw: () => {
    const hop = p.hop ? Math.sin(clamp(1 - p.moveT / (STEP_TIME * 1.6), 0, 1) * Math.PI) * 7 : 0;
    const sx = Math.round(p.px * TILE - cam.x), sy = Math.round(p.py * TILE - cam.y - 6 - hop);
    castShadow(g, sx, sy + hop, hop ? .55 : 1);
    drawPlayer(g, p.dir, p.step, sx, sy, p.moveT > 0);
  } });
  ents.sort((a, b) => a.y - b.y).forEach((e) => e.draw());

  // Tall grass draws over feet so the player wades through it.
  for (const e of [p, ...(map.npcs || []).filter(npcActive)]) {
    const ex = e.px != null ? e.px : e.x, ey = e.py != null ? e.py : e.y;
    if (!GRASSY.has(tileAt(map, Math.round(ex), Math.round(ey)))) continue;
    const sx = Math.round(Math.round(ex) * TILE - cam.x), sy = Math.round(Math.round(ey) * TILE - cam.y);
    // The blades sway while whoever is standing in them is moving.
    const moving = e.moveT > 0;
    const sway = moving ? Math.round(Math.sin(G.t * 22) * 1.2) : 0;
    g.save(); g.beginPath(); g.rect(sx, sy + 10, TILE, 6); g.clip();
    drawTile(g, ',', sx + sway, sy);
    g.restore();
  }

  drawRustle(g, cam);
  drawMend(g, cam);

  if (map.kind === 'inside') {                       // cosy interior vignette
    g.fillStyle = 'rgba(20,10,26,.25)';
    g.fillRect(0, 0, VIEW_W, VIEW_H);
  }
  worldLight(g, map.kind, G.mapId);
  weather(g, G.mapId, { kind: map.kind, map, x0, y0, ox, oy });
  // Being spotted closes the frame in. Two bars and a darkening — the cheapest
  // way to say "this is happening to you and you are not driving".
  const close = alertClose();
  if (close > 0) {
    const h = Math.round(close * 22);
    g.fillStyle = '#07050c';
    g.fillRect(0, 0, VIEW_W, h);
    g.fillRect(0, VIEW_H - h, VIEW_W, h);
    g.fillStyle = `rgba(7,5,12,${close * .3})`;
    g.fillRect(0, h, VIEW_W, VIEW_H - h * 2);
  }
}

/**
 * How hard the wind blows, per map: [rate, pixels]. Tied to the place rather
 * than to a clock, so Crown Hollow is always the exposed one and Emberwood is
 * always the sheltered one — a valley you can recognise by how its grass moves.
 */
const WIND = {
  _: [1.6, 1],
  hollowbrook: [1.3, 1],
  route_one: [1.8, 1],
  emberwood: [1.1, 1],           // under a canopy, almost nothing gets through
  stillmere: [2.2, 1],
  crown_hollow: [3.1, 2],        // nothing up here to stop it
};

/** Which weather a place has. A place, not a clock: Stillmere is always wet. */
const WEATHER = {
  hollowbrook: 'motes',
  route_one: 'motes',
  emberwood: 'fog',
  stillmere: 'rain',
  crown_hollow: 'gale',
};

/**
 * Weather.
 *
 * The grade already says what colour a place is; this says what is moving in
 * the air there. All of it is procedural and seeded off fixed numbers rather
 * than randomness, so nothing is stored between frames and nothing pops when
 * the camera moves. It draws over the grade, because weather is between you
 * and the valley rather than part of it.
 */
function weather(g, id, ctx) {
  const w = WEATHER[id];
  if (!w || ctx.kind === 'inside') return;
  const t = G.t;
  g.save();

  if (w === 'motes') {
    // Dust in the light. Slow, warm, and few — this is a nice day, not an event.
    for (let i = 0; i < 18; i++) {
      const seed = (i * 71) % 37 / 37;
      const rise = (t * (.05 + (i % 4) * .02) + seed) % 1;
      g.globalAlpha = Math.sin(rise * Math.PI) * .45;
      g.fillStyle = i % 3 ? '#ffe0a8' : '#fff4dc';
      g.fillRect(Math.round(seed * VIEW_W + Math.sin(t * .7 + i) * 6),
        Math.round(VIEW_H - rise * VIEW_H), 1, 1);
    }
  } else if (w === 'fog') {
    // Banks of mist drifting at different speeds. Depth in a flat picture is
    // parallax, so the near band moves twice as fast as the far one.
    for (let i = 0; i < 11; i++) {
      const seed = (i * 53) % 29;
      const speed = 5 + (i % 3) * 7;
      const x = ((t * speed + seed * 31) % (VIEW_W + 220)) - 110;
      const y = 16 + (seed * 11) % (VIEW_H - 30);
      const r = 54 + (seed % 5) * 12;
      const blob = g.createRadialGradient(x, y, 0, x, y, r);
      blob.addColorStop(0, `rgba(206,220,212,${.11 + (i % 3) * .035})`);
      blob.addColorStop(1, 'rgba(206,220,212,0)');
      g.fillStyle = blob;
      g.fillRect(x - r, y - r, r * 2, r * 2);
    }
    // …and it pools on the ground, which is where fog actually lives.
    const pool = g.createLinearGradient(0, VIEW_H - 56, 0, VIEW_H);
    pool.addColorStop(0, 'rgba(196,212,204,0)');
    pool.addColorStop(1, 'rgba(196,212,204,.24)');
    g.fillStyle = pool; g.fillRect(0, VIEW_H - 56, VIEW_W, 56);
  } else if (w === 'rain') {
    // Streaks, slanted, falling at three different speeds so the curtain has
    // depth. The far ones are shorter, dimmer and slower.
    for (let i = 0; i < 64; i++) {
      const lane = i % 3;
      const spd = 300 + lane * 200, len = 4 + lane * 3;
      const x = ((i * 97) + t * spd * .35) % (VIEW_W + 60) - 30;
      const y = ((i * 53) + t * spd) % (VIEW_H + 20) - 10;
      g.globalAlpha = .18 + lane * .12;
      g.strokeStyle = '#cfe8f5';
      g.lineWidth = 1;
      g.beginPath();
      g.moveTo(Math.round(x), Math.round(y));
      g.lineTo(Math.round(x - len * .45), Math.round(y + len));
      g.stroke();
    }
    // The water has to notice. Rings on a rolling handful of the visible water
    // tiles, each keyed off its own map position so they never all fire at once.
    g.globalAlpha = 1;
    g.strokeStyle = 'rgba(220,244,255,.45)';
    const { map, x0, y0, ox, oy } = ctx;
    for (let ty = -1; ty <= VIEW_H / TILE + 1; ty++) {
      for (let tx = -1; tx <= VIEW_W / TILE + 1; tx++) {
        const mx = x0 + tx, my = y0 + ty;
        if (my < 0 || my >= map.rows.length || mx < 0 || mx >= map.rows[0].length) continue;
        if (map.rows[my][mx] !== '~') continue;
        const h = (mx * 7 + my * 13) % 11;
        const k = (t * 1.6 + h / 11) % 1;
        if (h % 3 !== Math.floor(t * 1.6 + h / 11) % 3) continue;   // only some, and not for long
        const cx = tx * TILE + ox + 8, cy = ty * TILE + oy + 8;
        g.globalAlpha = (1 - k) * .5;
        g.lineWidth = 1;
        g.beginPath(); g.arc(cx, cy, 1 + k * 6, 0, Math.PI * 2); g.stroke();
      }
    }
  } else if (w === 'gale') {
    // Nothing up here to stop it. Long pale streaks crossing fast, low enough
    // in contrast that they read as moving air rather than as scratches.
    for (let i = 0; i < 26; i++) {
      const seed = (i * 61) % 23;
      const spd = 150 + (i % 4) * 90;
      const x = ((i * 113) + t * spd) % (VIEW_W + 90) - 45;
      const y = (seed * 9) % VIEW_H;
      const len = 10 + (i % 5) * 7;
      g.globalAlpha = .10 + (i % 3) * .05;
      g.strokeStyle = '#d8d0f5';
      g.lineWidth = 1;
      g.beginPath();
      g.moveTo(Math.round(x), Math.round(y));
      g.lineTo(Math.round(x + len), Math.round(y + 2));
      g.stroke();
    }
  }

  g.restore();
  g.globalAlpha = 1;
}

/**
 * The light over the valley. A flat field of tiles is a texture; a lit one is
 * a place. Two passes, both cheap and both doing work an artist would do by
 * hand: a warm wash across the top and a cool one across the bottom, so the
 * ground has a direction to it, and a soft vignette that darkens the corners
 * and pulls the eye to the middle where the player is. The colours are the
 * game's own violet and gold, which is what stops the world and the panels
 * around it looking like two different pictures.
 *
 * Every map gets its own grade. The tiles are shared, so without this the shore
 * and the deep wood are the same picture with different props; with it, walking
 * from one into the other is a change of weather. Each entry is a top wash, a
 * bottom wash and how hard the corners close in — no new art, just light.
 *
 * `hue` is the one that does the heavy lifting. A wash painted over grass can
 * only darken or lighten it; it can never make it stop being grass-green, which
 * is why the first pass at this had four maps that all read the same. Painting
 * a colour in the 'color' blend mode keeps every value exactly where it was and
 * moves only the hue and the saturation — which is precisely what a colour
 * grade is, and what a wash can never be.
 */
const GRADE = {
  // A town is outdoors. It was the one map with a sky and no light source left
  // after the routes got theirs — the same asymmetry one level down, found by
  // re-photographing it once the shafts had landed. Weaker than a route's: the
  // buildings break the light up, and Hollowbrook is meant to read as sheltered.
  town:   { top: 'rgba(255,201,77,.10)',  bot: 'rgba(58,36,86,.22)',   vig: .40,
            shaft: ['rgba(255,214,140,.10)', .07] },
  route:  { top: 'rgba(255,214,120,.09)', bot: 'rgba(46,40,92,.20)',   vig: .38 },
  inside: { top: 'rgba(255,182,96,.14)',  bot: 'rgba(30,18,44,.30)',   vig: .55 },
  // Late-afternoon gold on the first road out — the friendliest light in the
  // game, and the one the others are read against, so it barely grades at all.
  route_one:    { top: 'rgba(255,208,110,.12)', bot: 'rgba(58,42,92,.18)',  vig: .34,
                  hue: ['#e8c070', .10], shaft: ['rgba(255,214,140,.10)', .10] },
  // Under a canopy: little sky, a lot of green shade, corners closing in.
  emberwood:    { top: 'rgba(214,150,60,.17)',  bot: 'rgba(16,44,34,.34)',  vig: .56,
                  hue: ['#7fa03c', .15], shaft: ['rgba(240,214,120,.10)', .13] },
  // Open water, flat cool light, almost no vignette so it reads as wide.
  stillmere:    { top: 'rgba(150,220,255,.13)', bot: 'rgba(30,64,110,.24)', vig: .26,
                  hue: ['#4fb4d6', .15], shaft: ['rgba(190,236,255,.10)', .08] },
  // High, thin and cold, with a bruise-coloured sky pressing down.
  crown_hollow: { top: 'rgba(178,164,255,.17)', bot: 'rgba(52,26,86,.44)',  vig: .62,
                  hue: ['#8a7fd0', .24], shaft: ['rgba(214,200,255,.10)', .12] },
};
/**
 * Everything that happens where one kind of ground stops and another starts.
 *
 * A tileset can only ever draw the middle of things; the edges are where a map
 * either reads as a place or as a spreadsheet with colours in it. Rather than
 * author a transition tile for every pair — which is dozens of tiles and still
 * misses a corner — this pass looks at each cell's neighbours after the field
 * is down and draws the joins: a shoreline where water meets land, an eave and
 * a base course on a building, and the shadow a building throws on the ground
 * beside it. All of it in the same violet-leaning dark the vignette uses.
 */
function drawEdges(g, map, x0, y0, ox, oy) {
  const at = (mx, my) => (my < 0 || my >= map.rows.length || mx < 0 || mx >= map.rows[0].length)
    ? null : map.rows[my][mx];
  const BUILD = new Set(['R', 'W', 'D']);
  const SHADE = 'rgba(14,8,20,.30)';

  for (let y = -1; y <= VIEW_H / TILE + 1; y++) {
    for (let x = -1; x <= VIEW_W / TILE + 1; x++) {
      const mx = x0 + x, my = y0 + y;
      const ch = at(mx, my);
      if (!ch) continue;
      const sx = Math.round(x * TILE + ox), sy = Math.round(y * TILE + oy);
      const up = at(mx, my - 1), down = at(mx, my + 1);
      const left = at(mx - 1, my), right = at(mx + 1, my);

      // ---- water: a bright rim on the land side, dark under the bank
      if (ch === '~') {
        const deep = 'rgba(10,26,44,.45)';
        // Foam is what water does at an edge, not a frame around it. An
        // unbroken bright line on all four sides is what makes a pond read as
        // a swimming pool, so it comes in dashes whose lengths depend on where
        // the tile is — the same tile always breaks the same way, and no two
        // neighbours break alike.
        const dash = (dx, dy, w, h, seed) => {
          g.fillStyle = 'rgba(190,232,246,.34)';
          const skip = (mx * 7 + my * 13 + seed) % 3;
          if (skip === 2) return;                    // a third of the run is simply open
          const a = skip === 0 ? 2 : 6, len = skip === 0 ? 9 : 8;
          if (w > h) g.fillRect(sx + dx + a, sy + dy, Math.min(len, w - a), h);
          else g.fillRect(sx + dx, sy + dy + a, w, Math.min(len, h - a));
        };
        if (up && up !== '~') { g.fillStyle = deep; g.fillRect(sx, sy, TILE, 2); dash(0, 2, TILE, 1, 0); }
        if (down && down !== '~') dash(0, TILE - 2, TILE, 1, 1);
        if (left && left !== '~') { g.fillStyle = deep; g.fillRect(sx, sy, 2, TILE); dash(2, 0, 1, TILE, 2); }
        if (right && right !== '~') dash(TILE - 2, 0, 1, TILE, 3);
        continue;
      }
      // ---- the bank itself darkens toward the water it runs into
      if (!BUILD.has(ch)) {
        g.fillStyle = 'rgba(14,8,20,.22)';
        if (down === '~') g.fillRect(sx, sy + TILE - 3, TILE, 3);
        if (up === '~') g.fillRect(sx, sy, TILE, 2);
        if (right === '~') g.fillRect(sx + TILE - 3, sy, 3, TILE);
        if (left === '~') g.fillRect(sx, sy, 2, TILE);
      }

      // ---- a window is a light source, and a light source that lights nothing
      // is a picture of a window. It throws a slab of daylight down the floor,
      // leaning the way light does when it comes through a wall above you, and
      // fading out as it goes.
      if (ch === 'n') {
        g.save();
        for (let d = 1; d <= 3; d++) {
          const below = at(mx, my + d);
          if (!below || below === 'W' || below === 'n') break;
          g.globalAlpha = .17 - (d - 1) * .05;
          g.fillStyle = '#ffe7b0';
          g.beginPath();
          g.moveTo(sx + 1 + (d - 1) * 3, sy + d * TILE);
          g.lineTo(sx + TILE - 1 + (d - 1) * 3, sy + d * TILE);
          g.lineTo(sx + TILE + 2 + d * 3, sy + (d + 1) * TILE);
          g.lineTo(sx + 2 + d * 3, sy + (d + 1) * TILE);
          g.closePath(); g.fill();
        }
        g.restore();
        g.globalAlpha = 1;
      }

      // ---- a rug is one object, so it gets a hem, not sixteen little frames
      if (ch === 'r') {
        g.fillStyle = 'rgba(198,147,32,.85)';
        if (up !== 'r') g.fillRect(sx, sy, TILE, 2);
        if (down !== 'r') g.fillRect(sx, sy + TILE - 2, TILE, 2);
        if (left !== 'r') g.fillRect(sx, sy, 2, TILE);
        if (right !== 'r') g.fillRect(sx + TILE - 2, sy, 2, TILE);
        g.fillStyle = 'rgba(14,8,20,.35)';                 // the pile it sits on
        if (down !== 'r') g.fillRect(sx, sy + TILE, TILE, 2);
      }
      // ---- roofs: a lit ridge on top, an eave hanging over what is below
      if (ch === 'R') {
        if (up !== 'R') { g.fillStyle = 'rgba(255,214,160,.20)'; g.fillRect(sx, sy, TILE, 2); }
        if (down !== 'R') {
          g.fillStyle = 'rgba(14,8,20,.55)';
          g.fillRect(sx - 1, sy + TILE - 3, TILE + 2, 3);          // the eave overhangs
          g.fillStyle = 'rgba(255,214,160,.14)';
          g.fillRect(sx - 1, sy + TILE - 4, TILE + 2, 1);
        }
      }
      // ---- walls: shaded under the eave, with a base course on the ground
      if (ch === 'W' || ch === 'D') {
        if (up === 'R') { g.fillStyle = 'rgba(14,8,20,.34)'; g.fillRect(sx, sy, TILE, 4); }
        if (!BUILD.has(down)) {
          g.fillStyle = 'rgba(14,8,20,.45)';
          g.fillRect(sx, sy + TILE - 2, TILE, 2);
        }
      }
      // ---- and the shadow the whole building throws on the ground beside it
      if (!BUILD.has(ch)) {
        if (BUILD.has(up)) { g.fillStyle = SHADE; g.fillRect(sx, sy, TILE, 4); }
        if (BUILD.has(left)) { g.fillStyle = SHADE; g.fillRect(sx, sy, 4, TILE); }
      }
    }
  }
}

/**
 * A soft ellipse under whoever is standing there. Without one, everybody on
 * the map looks pasted on top of it rather than standing in it — the cheapest
 * single thing that makes a flat tile field read as ground.
 */
function castShadow(g, sx, sy, scale = 1) {
  g.save();
  g.globalAlpha = .3;
  g.fillStyle = '#0d0716';
  g.beginPath();
  g.ellipse(sx + 8, sy + 21, 6 * scale, 2.4 * scale, 0, 0, Math.PI * 2);
  g.fill();
  g.restore();
}

function gradeFor(kind, id) {
  return GRADE[id] || GRADE[kind] || GRADE.route;
}

function worldLight(g, kind, id) {
  const gr = gradeFor(kind, id);

  // Hue first, while the picture is still only art: grading the washes as well
  // would just be grading a grade.
  if (gr.hue) {
    g.save();
    g.globalCompositeOperation = 'color';
    g.globalAlpha = gr.hue[1];
    g.fillStyle = gr.hue[0];
    g.fillRect(0, 0, VIEW_W, VIEW_H);
    g.restore();
    g.globalAlpha = 1;
  }

  const fade = gr.top.replace(/[\d.]+\)$/, '0)');   // same hue, no alpha, at the meeting point
  const warm = g.createLinearGradient(0, 0, 0, VIEW_H);
  warm.addColorStop(0, gr.top);
  warm.addColorStop(.45, fade);
  warm.addColorStop(1, gr.bot);
  g.fillStyle = warm;
  g.fillRect(0, 0, VIEW_W, VIEW_H);

  // Shafts, on the maps that have a sky.
  //
  // Photographing all eight maps turned up one asymmetry and no bugs: the three
  // interiors have somewhere the light comes FROM — the window pools throw a
  // slab of daylight across the floor and it is the best-looking thing in the
  // game — and the three outdoor maps have no light source at all, only a wash
  // top and bottom and a vignette closing the corners. Flat light is what makes
  // an outdoor tile field read as a field of tiles.
  //
  // So: a few wide, low, slanted columns coming down from the top of the frame
  // in the map's own warm colour. Screen space, not world space, because the
  // sun does not move when you take a step, and additive so they lift the
  // ground rather than fogging it. They breathe slightly, out of phase, which
  // is the difference between light through moving leaves and a painted-on
  // triangle.
  if (gr.shaft) {
    const [col, amp] = gr.shaft;
    g.save();
    g.globalCompositeOperation = 'lighter';
    const LEAN = VIEW_H * .55, BOT = VIEW_H * .92, SLICES = 7;
    for (let i = 0; i < 4; i++) {
      const x = -30 + i * 78 + Math.sin(i * 2.7) * 12;
      const w = 26 + (i % 3) * 11;
      const a = amp * (.62 + .38 * (.5 + .5 * Math.sin(G.t * .5 + i * 1.9)));
      // Sliced across its width with a bell-shaped alpha, because a shaft with
      // hard sides is a parallelogram. One fill each, and the first version —
      // a single polygon with only a vertical fade — read as geometry laid over
      // the grass rather than as light coming through it.
      for (let s = 0; s < SLICES; s++) {
        const t0 = s / SLICES, t1 = (s + 1) / SLICES;
        const bell = Math.sin(((t0 + t1) / 2) * Math.PI) ** 1.6;
        const sh = g.createLinearGradient(0, 0, 0, BOT);
        sh.addColorStop(0, col.replace(/[\d.]+\)$/, `${(a * bell).toFixed(3)})`));
        sh.addColorStop(1, col.replace(/[\d.]+\)$/, '0)'));
        g.fillStyle = sh;
        g.beginPath();
        g.moveTo(x + w * t0, 0); g.lineTo(x + w * t1, 0);
        g.lineTo(x + w * t1 + LEAN, BOT); g.lineTo(x + w * t0 + LEAN, BOT);
        g.closePath(); g.fill();
      }
    }
    g.restore();
  }

  const vig = g.createRadialGradient(VIEW_W / 2, VIEW_H / 2, VIEW_H * .34,
    VIEW_W / 2, VIEW_H / 2, VIEW_H * .95);
  vig.addColorStop(0, 'rgba(12,7,18,0)');
  vig.addColorStop(1, `rgba(12,7,18,${gr.vig})`);
  g.fillStyle = vig;
  g.fillRect(0, 0, VIEW_W, VIEW_H);
}
/* =========================================================== §6 — battle ==
   A turn resolves completely, up front, into a list of log entries. Each entry
   carries an HP snapshot, so the UI can play the turn back at reading speed
   while the underlying state is already consistent. Tests drive playCard(),
   endTurn() and doAction() directly and read the same log.
   ======================================================================== */
/**
 * Which theme a fight plays. The legendary has had its own since it was built;
 * everything else shared one, so a rival showdown and a level-four Zaplet in
 * the long grass were the same tune. Wick is the only person in the valley you
 * meet more than once, and he is worth recognising before you have read his
 * name.
 */
function battleTrack(opt) {
  if (opt.legendary) return 'shrine';
  if (!opt.npc) return 'battle';
  return String(opt.npc.id || '').startsWith('t_wick') ? 'rival' : 'duel';
}

function startBattle(opt) {
  const mine = firstAlive();
  if (!mine) return false;
  G.battleMsg = null;              // nothing from the last fight gets to speak in this one
  G.battle = {
    foe: opt.foe, mine, wild: !!opt.wild, legendary: !!opt.legendary,
    npc: opt.npc || null,
    team: opt.team || null, teamIdx: 0,
    escapes: 0, turn: 0, over: null, log: null, li: 0,
    shake: 0, flashM: 0, flashF: 0, entry: 0, throwT: 0, hold: 0, lvT: 0,
    pops: [], lungeM: 0, lungeF: 0, windM: 0, windF: 0, recoilM: 0, recoilF: 0,
    foeEdge: 0, foeShield: 0, foePierce: 0, plan: null, cornered: 0, lastStand: 0, settling: 0, chipping: 0,
    roster: null, foeSettling: 0, foeSwaps: 0, foeSwapT: 0, foePotions: 0, foeHeals: 0,
    downM: null, downF: null, hpMark: mine.hp,
    crit: null,
    dispM: mine.hp, dispF: opt.foe.hp, tgtM: mine.hp, tgtF: opt.foe.hp,
    dispXp: mine.xp, tgtXp: mine.xp, barLv: mine.lvl, barSlot: G.party.indexOf(mine),
    started: false, finishing: false, await: null,
    // the card game
    draw: [], hand: [], disc: [], exh: [],
    energy: 0, phase: 'player', intent: null, powers: {}, playedTurn: 0, swungTurn: 0,
    mods: freshMods(), maxAdd: 0, maxAdds: new Map(), shield: 0,
  };
  mine.stages = { atk: 0, def: 0, spd: 0 };
  opt.foe.stages = { atk: 0, def: 0, spd: 0 };
  // A wild pair splits one kin's pool between two bodies, so the fight is the
  // same size and a different shape.
  const paired = !!(opt.wild && opt.pair);
  toughen(opt.foe, opt.wild ? FOE_HP_MUL * (paired ? .5 : 1) : trainerHp((opt.team || [1]).length));
  // A trainer's whole team exists from the start rather than being conjured as
  // the last one falls, because a trainer who can only ever send the next kin
  // in order is not playing the game you are playing. See `foeSwap`.
  // The other half of playing the same game: a trainer carries a bag. You beat
  // them by rotating fresh kin in, and they had no answer to that at all — a
  // potion is the answer, and it costs them the turn to reach for it exactly as
  // switching does.
  if (opt.npc && !opt.wild) G.battle.foePotions = POTIONS_FOR(opt.team ? opt.team.length : 1);
  if (paired) {
    const mate = toughen(opt.pair, FOE_HP_MUL * .5);
    mate.stages = { atk: 0, def: 0, spd: 0 };
    G.battle.roster = [opt.foe, mate];
  }
  if (opt.team && !opt.wild) {
    const mul = trainerHp(opt.team.length);
    G.battle.roster = opt.team.map((e, i) => {
      if (i === 0) return opt.foe;
      const m = toughen(mkMon(e[0], e[1]), mul);
      m.stages = { atk: 0, def: 0, spd: 0 };
      return m;
    });
  }
  G.battle.dispF = G.battle.tgtF = opt.foe.hp;
  buildDeck(G.battle);
  G.wipe = WIPE_T;
  const firstSight = seeMon(opt.foe.species);
  G.mode = 'battle';
  // The legendary announced itself with the same line as a level-six Dewdrip.
  // Everything else about the encounter is built up — its own cue, twice the
  // motes, a heavier vignette, forty gems, a shrine to find it at — and then it
  // opened with "A wild Vespyr bristles!". The climax of the game gets its own
  // words. Photographed five passes in a row without anyone reading the text.
  const who = opt.npc ? `${opt.npc.name} wants to battle!`
    : opt.legendary ? `${opt.foe.name} unfolds out of the light.`
    : `A wild ${opt.foe.name} bristles!`;
  playCue(battleTrack(opt));
  // The toast outlives the wipe (2.2s against .55s), so it is still standing
  // when the arena arrives — it marks the kin, not the transition.
  if (firstSight) { setToast(dexNew(opt.foe.name)); playCue('dex'); }
  const lines = opt.legendary
    ? [who, 'Nothing in the valley moves. It is deciding about you.', `Go, ${dispName(mine)}!`]
    : [who, `Go, ${dispName(mine)}!`];
  // Speed decides who opens. The player used to move first always, and with
  // fights running under two turns that meant most foes got exactly one action
  // and half of them never touched you — a fight decided before it started.
  // Something faster than you now lands the first blow, which is what makes
  // SPD a stat rather than a number on a screen, and what makes an ambush by
  // something quick actually frightening.
  // A trainer brings a plan; a wild kin used to bring only itself, and that
  // asymmetry is the root of six passes of "wild fights have no shape". The one
  // beat they had — cornering — fires off the foe's own HP falling, so it is
  // reactive: it always arrives late, and there is nothing to build a turn
  // around in advance. Measured, it is 1.25 beats a fight and 23% of wild fights
  // never get one at all.
  //
  // So a wild kin gets a rhythm too: swing, gather, swing. It is the same
  // damage, announced a turn ahead, on a cadence a player can plan for rather
  // than one their own success triggers. `planScale` keeps it off the opening of
  // the game the same way it does for trainers.
  const plan = opt.plan || (opt.npc && opt.npc.trainer && opt.npc.trainer.plan)
    || (opt.wild ? ['swing', 'sharpen', 'swing'] : null);
  if (plan) G.battle.plan = { steps: plan.slice(), i: 0 };
  const opener = [];
  // Wild kin only: a trainer squares up with you, and the opening rival
  // fight is meant to be winnable rather than a coin toss on speed.
  if (opt.wild && effStat(opt.foe, 'spd') > effStat(mine, 'spd')) {
