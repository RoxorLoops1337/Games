    bpm: 76, order: [0, 1], bass: [0, 0, 0, 0, 8, 8, 8, 8],
    lead: [
      [24, 0, 0, 0, 19, 0, 0, 0, 21, 0, 0, 0, 16, 0, 0, 0],
      [26, 0, 0, 24, 0, 0, 0, 19, 0, 0, 21, 0, 0, 0, 12, 0],
    ],
  },
  shrine: {                       // only the legendary gets to sound like this
    bpm: 84, order: [0, 1], bass: [0, 0, 5, 5, 8, 8, 3, 3],
    lead: [
      [24, 0, 0, 19, 0, 0, 16, 0, 21, 0, 0, 17, 0, 0, 12, 0],
      [26, 0, 0, 21, 0, 0, 17, 0, 24, 0, 19, 0, 16, 0, 12, 0],
    ],
  },
};

function audio() {
  if (HEADLESS || muted) return null;
  if (!AC) {
    const C = window.AudioContext || window.webkitAudioContext;
    if (!C) return null;
    try { AC = new C(); } catch (e) { return null; }
  }
  if (AC.state === 'suspended') AC.resume().catch(() => {});
  return AC;
}

function blip(freq, dur, type, gain, when) {
  const ac = audio();
  if (!ac) return;
  const t = when || ac.currentTime;
  const o = ac.createOscillator(), g = ac.createGain();
  o.type = type || 'square';
  o.frequency.setValueAtTime(freq, t);
  g.gain.setValueAtTime(0, t);
  g.gain.linearRampToValueAtTime(gain || .06, t + .01);
  g.gain.exponentialRampToValueAtTime(.0001, t + dur);
  o.connect(g); g.connect(ac.destination);
  o.start(t); o.stop(t + dur + .02);
}

const note = (semi) => 220 * Math.pow(2, semi / 12);

function musicTick() {
  const th = THEMES[musicTrack];
  if (!th) return;
  const bar = Math.floor(musicStep / 16);
  const phrase = th.lead[th.order[bar % th.order.length]] || th.lead[0];
  const n = phrase[musicStep % 16];
  if (n) blip(note(n), .16, 'square', .045);
  const b = th.bass[musicStep % th.bass.length];
  if (musicStep % 2 === 0) blip(note(b - 24), .22, 'triangle', .05);
  musicStep++;
}

/**
 * Which theme a place plays. The four you TRAVEL get their own; the town and
 * the rooms inside it keep `world`, which is the tune the valley hums.
 */
const MAP_TRACK = { route_one: 'route', stillmere: 'mere', emberwood: 'wood', crown_hollow: 'hollow' };
const placeTrack = (mapId) => MAP_TRACK[mapId] || 'world';

/**
 * Follow the map with the music, but only once music is already playing.
 *
 * enterMap runs at boot to put a world behind the title card, so STARTING a
 * track here would play over the title, which has always been silent until you
 * choose. And it must not restart a track that is already going: startMusic
 * resets the step and the interval, so re-firing `world` at every doorway in
 * Hollowbrook would stutter the same tune every few steps.
 */
function followMap() {
  if (HEADLESS || !musicTimer) return;
  const track = placeTrack(G.mapId);
  if (track !== musicTrack) startMusic(track);
}

function startMusic(track) {
  if (HEADLESS) return;
  musicTrack = track;
  if (musicTimer) clearInterval(musicTimer);
  const th = THEMES[track];
  if (!th) return;
  musicStep = 0;
  musicTimer = setInterval(musicTick, 30000 / th.bpm);
}
function stopMusic() { if (musicTimer) { clearInterval(musicTimer); musicTimer = null; } }

function playCue(kind) {
  if (HEADLESS) return;
  const ac = audio();
  // Any theme is a cue. This used to name the three tracks a second time, so
  // adding a fourth was two edits and one of them was easy to forget.
  if (THEMES[kind]) { startMusic(kind); return; }
  if (!ac) return;
  const t = ac.currentTime;
  if (kind === 'hit') blip(150, .09, 'sawtooth', .07);
  // The same impact, told twice more. `strong` is higher and cracks — a second
  // shorter blip on top of the first, so it reads as edge rather than weight,
  // which is what separates it from a crit's low double thud. `weak` loses the
  // sawtooth's edge entirely and is shorter: a thud with nothing behind it.
  // Both are written, not heard; sound cannot be photographed.
  else if (kind === 'strong') { blip(190, .1, 'sawtooth', .08); blip(265, .06, 'square', .05, t + .04); }
  else if (kind === 'weak') blip(110, .07, 'sine', .05);
  // A crit already looks different — its own burst, its own colour on the
  // number — and sounded exactly like every other hit. Lower and longer than
  // `hit`, with a second blip under it so it lands as one heavier impact
  // rather than two taps. Written, not heard: sound cannot be photographed and
  // nobody in this loop has ever listened to this game.
  else if (kind === 'crit') { blip(96, .16, 'sawtooth', .085); blip(58, .22, 'square', .05, t + .02); }
  // Yours: a fall. Two notes an octave apart going down, the second longer, so
  // it sags rather than lands.
  else if (kind === 'faint') { blip(220, .3, 'square', .05); blip(110, .45, 'square', .05, t + .12); }
  // Theirs: the same shape refused. It goes UP and stops short — a snap rather
  // than a sag, and quieter than a level-up so beating a Zaplet does not sound
  // like an achievement. Written, not heard: sound cannot be photographed and
  // nobody in this loop has listened to this game.
  else if (kind === 'downed') { blip(196, .1, 'square', .045); blip(294, .14, 'square', .04, t + .07); }
  // A pen, not a fanfare. Two short high ticks, quiet enough to sit under a
  // fight — this fires up to nineteen times in a run, and a note being made is
  // bookkeeping that you notice, not an achievement that stops the room. The
  // catch keeps the fanfare; the sighting only wants to be heard.
  else if (kind === 'dex') { blip(1046, .04, 'square', .028); blip(1568, .06, 'square', .022, t + .05); }
  else if (kind === 'level') { [0, 4, 7, 12].forEach((s, i) => blip(note(12 + s), .16, 'square', .05, t + i * .07)); }
  else if (kind === 'catch') { [0, 5, 9, 14].forEach((s, i) => blip(note(12 + s), .2, 'triangle', .06, t + i * .1)); }
  // A chest borrowed the catch cue, which made the biggest purchase in the
  // game sound like a creature going into an orb. Lower, wider, and it opens
  // out rather than climbing: a lid giving, not a lock closing. Sound cannot
  // be photographed, so this is described rather than shown — nobody has heard
  // it, including me.
  else if (kind === 'chest') {
    blip(90, .28, 'sawtooth', .05);
    [0, 7, 12, 19, 24].forEach((s, i) => blip(note(s), .34, 'triangle', .055, t + .1 + i * .06));
  }
  // Arriving somewhere new. The plaque that names a place was the only beat in
  // the game with no sound at all — every other one that asks for your
  // attention has a cue, including the ones that do not own the screen. This
  // one must not own it either: the card slides in while you keep walking, so
  // the sound is two soft notes a fifth apart, quiet and short, opening rather
  // than announcing. A fanfare here would stop a player who is not stopping.
  // Written, not heard: sound cannot be photographed and nobody in this loop
  // has ever listened to this game.
  else if (kind === 'place') {
    blip(note(0), .26, 'triangle', .035);
    blip(note(7), .3, 'triangle', .03, t + .09);
  }
  else if (kind === 'throw') blip(500, .12, 'sine', .05);
  // A throw is three sounds: the effort, the verdict, and the disappointment.
  else if (kind === 'wobble') { blip(300, .07, 'square', .05); blip(240, .07, 'square', .04, t + .09); }
  else if (kind === 'click') { blip(880, .06, 'square', .06); blip(1320, .1, 'square', .05, t + .06); }
  else if (kind === 'burst') { blip(200, .1, 'sawtooth', .06); blip(120, .22, 'sawtooth', .05, t + .08); }
  // The one fanfare in the game that is allowed to be a bit much.
  else if (kind === 'gotcha') {
    [0, 4, 7, 12, 16, 19, 24].forEach((s, i) => blip(note(12 + s), .22, 'triangle', .06, t + i * .085));
    [0, 12].forEach((s, i) => blip(note(s), .5, 'square', .04, t + .6 + i * .12));
  }
  else if (kind === 'heal') { [0, 7, 12].forEach((s, i) => blip(note(12 + s), .2, 'sine', .05, t + i * .09)); }
  else if (kind === 'select') blip(660, .05, 'square', .04);
  // ---- the world, which used to be silent ------------------------------
  // A menu that opens and a menu that confirms must not be the same sound, or
  // the ear stops using either of them. Open is low and short; confirm rises.
  else if (kind === 'menu') blip(330, .05, 'square', .035);
  else if (kind === 'back') blip(240, .06, 'square', .03);
  else if (kind === 'door') { blip(140, .1, 'sawtooth', .05); blip(95, .18, 'sine', .045, t + .05); }
  // The dark closing over a wipe. A CHOICE rather than a gap: the beat was
  // never silent — the last kin's `faint` runs just before it and `world` opens
  // the Wayhouse after — but it borrowed both of those and had nothing of its
  // own for the worst moment in the game. Two long notes falling a fifth, under
  // everything else in the game's register, so it reads as the floor going out
  // rather than another event happening.
  // Written, not heard. Nothing in this repo can play it back.
  else if (kind === 'blackout') { blip(70, .5, 'sine', .06); blip(47, .8, 'sine', .05, t + .18); }
  // Footsteps carry the ground under them: grass brushes, a path knocks, sand
  // is soft and short, boards ring. Two alternating pitches so a walk has a
  // gait instead of a metronome.
  else if (kind === 'step_grass') blip(220 + (G.steps % 2) * 30, .045, 'triangle', .022);
  else if (kind === 'step_tall') blip(180 + (G.steps % 2) * 26, .07, 'triangle', .028);
  else if (kind === 'step_path') blip(120 + (G.steps % 2) * 18, .04, 'square', .022);
  else if (kind === 'step_sand') blip(150 + (G.steps % 2) * 20, .05, 'sine', .02);
  else if (kind === 'step_wood') blip(300 + (G.steps % 2) * 40, .04, 'square', .02);
  // The grass, harder. Inventorying which beats make a sound found the rustle
  // silent: half a second of blades thrashing with nothing on it, and then the
  // battle sting. Inserting that beat pushed the battle cue half a second later
  // than it used to be without anybody noticing, which is a thing you only see
  // by listing what has a voice and what does not. It borrows the tall-grass
  // step's own triangle and runs it three times, falling — the same material
  // moving faster.
  else if (kind === 'rustle') { [0, 1, 2].forEach((i) => blip(196 - i * 22, .09, 'triangle', .034, t + i * .07)); }
  // Evolution opens on a low swell rather than a chime — something is coming.
  else if (kind === 'evo') { [0, 3, 7].forEach((s2, i) => blip(note(s2), .9, 'sine', .04, t + i * .18)); }
  // Being spotted: two hard notes, the second higher. Nothing friendly about it.
  else if (kind === 'spotted') { blip(note(7), .09, 'square', .06); blip(note(14), .16, 'square', .055, t + .1); }
}

/** Which footstep the ground under you makes. */
const STEP_CUE = { ',': 'step_tall', '=': 'step_path', s: 'step_sand', b: 'step_wood', r: 'step_wood' };
// The surface underfoot, as a function rather than a bare lookup, so the
// default — grass, meaning everything not named above — is part of the ANSWER
// instead of living at the one call site as `|| 'step_grass'`. The cue
// invariant asks this for every tile character that appears in any map; it
// could not see a fallback parked next to the caller, and step_grass was the
// one cue in the game that nothing could prove was reachable.
const stepCue = (tile) => STEP_CUE[tile] || 'step_grass';

function toggleMute() {
  muted = !muted;
  if (muted) stopMusic(); else startMusic(musicTrack);
  setToast(muted ? 'Sound off' : 'Sound on');
}
/* ============================================================= §9 — boot ==
   Canvas scaling, input wiring, the frame loop, and the headless export the
   test suite drives.
   ======================================================================== */
let ctx = null;

/**
 * Work out how big the stage should be and where the touch controls go.
 *
 * Pure, so the sizes can be checked without a browser. Three shapes:
 *   side    — landscape: fill the height, stick and buttons take the gutters
 *   below   — portrait: fill the width, controls take the band underneath
 *   overlay — neither margin is big enough, so they sit on the game corners
 * A mouse gets none of that: integer scaling, centred, no controls at all.
 */
function layoutFor(vw, vh, touch) {
  const pad = 8;
  if (!touch) {
    const raw = Math.min((vw - pad) / VIEW_W, (vh - pad) / VIEW_H);
    // Integer scaling keeps pixels square when there is room for it.
    return { mode: 'none', scale: raw >= 2 ? Math.floor(raw) : Math.max(1, raw), gutter: 0 };
  }
  if (vw > vh) {
    // Landscape: the game is as tall as the screen, the gutters do the rest.
    const scale = Math.max(1, (vh - pad) / VIEW_H);
    const gutter = Math.floor((vw - VIEW_W * scale) / 2);
    return gutter >= 96
      ? { mode: 'side', scale, gutter }
      : { mode: 'overlay', scale: Math.max(1, (vh - pad) / VIEW_H), gutter: 0 };
  }
  // Portrait: fill the width, and use whatever is left underneath.
  const scale = Math.max(1, (vw - pad) / VIEW_W);
  const below = vh - VIEW_H * scale;
  return below >= 190
    ? { mode: 'below', scale, gutter: 0, below }
    : { mode: 'overlay', scale, gutter: 0, below };
}

function fitStage() {
  if (HEADLESS) return;
  const touch = document.body.classList.contains('touch');
  const L = layoutFor(window.innerWidth, window.innerHeight, touch);
  const st = document.getElementById('stage');
  const w = VIEW_W * L.scale, h = VIEW_H * L.scale;
  els.view.style.width = w + 'px';
  els.view.style.height = h + 'px';
  st.style.width = w + 'px';
  st.style.height = h + 'px';
  // Panel text is em-based, so one number scales the whole UI with the stage.
  st.style.fontSize = clamp(L.scale * 4.1, 11, 21) + 'px';

  // Under a x2 stage the title screen sheds its key hints — see body.tight.
  document.body.classList.toggle('tight', L.scale < 2);

  document.body.classList.remove('ctl-side', 'ctl-below', 'ctl-overlay');
  if (L.mode !== 'none') document.body.classList.add('ctl-' + L.mode);
  document.body.style.setProperty('--gutter', L.gutter + 'px');
  // In portrait the stage sits at the top so the band underneath is all ours.
  document.body.classList.toggle('topalign', L.mode === 'below');
  const top = L.mode === 'below' ? Math.round(window.innerHeight * .04) : 0;
  document.body.style.setProperty('--stagebot', (top + h) + 'px');
  G.layout = L;
}

/**
 * The celebration. A catch is the thing the whole genre is named after, so it
 * gets the one moment in the game that stops everything else: light off the
 * new kin, its name, and a shower that takes its time.
 */
/**
 * A chest coming open.
 *
 * Every other reward in this game is an event — a catch is throw, wobble,
 * gotcha, papers; a win is the flourish; a level-up is a ring and sparks. A
 * chest was `openChest()` and a re-render, so the cards were simply there on
 * the next frame. It is the largest purchase in the game, a Prism Chest is
 * 1620 gems, and it had less ceremony than picking up a salve.
 *
 * Three sub-beats. The shortest is the burst at .35s, which is what a film of
 * this has to be sampled against — not the 1.6s whole.
 */
const PLACE_IN = .3, PLACE_HOLD = 1.7, PLACE_OUT = .4;
/**
 * The name of the place you have just walked into, on a plaque that comes down
 * out of the top edge and leaves the same way. Two seconds, top-left, out of
 * the road you are walking on.
 *
 * It eases on the way in so it arrives rather than snaps, and goes out linearly
 * because an overlay that lingers on its way off screen reads as a stutter. The
 * gold rule underneath is the one the field menu title already sits on, so the
 * card is recognisably the same furniture rather than a new kind of thing.
 */
function drawPlace(g) {
  const p = G.place, T = p.t;
  const raw = T < PLACE_IN ? T / PLACE_IN
    : T < PLACE_IN + PLACE_HOLD ? 1
    : 1 - (T - PLACE_IN - PLACE_HOLD) / PLACE_OUT;
  const e = clamp(raw, 0, 1);
  const slide = T < PLACE_IN ? 1 - (1 - e) * (1 - e) * (1 - e) : e;
  const name = String(p.name).toUpperCase();
  g.save();
  g.font = 'bold 9px monospace';
  const w = Math.ceil(g.measureText(name).width) + 16, h = 17;
  const x = 8, y = Math.round(-h + (10 + h) * slide);
  g.globalAlpha = e;
  g.fillStyle = 'rgba(14,9,18,.86)';
  g.fillRect(x, y, w, h);
  g.fillStyle = '#ffc94d';
  g.fillRect(x, y + h - 1, w, 1);
  g.textAlign = 'left';
  g.fillStyle = '#2a1b2e';
  g.fillText(name, x + 9, y + 13);
  g.fillStyle = '#f2e6d8';
  g.fillText(name, x + 8, y + 12);
  g.restore();
  g.globalAlpha = 1;
}

const CHEST_SHAKE = .55, CHEST_BURST = .35, CHEST_SHOW = .7;
const CHEST_T = CHEST_SHAKE + CHEST_BURST + CHEST_SHOW;

function chestStep(dt) {
  const c = G.chestOpen;
  if (!c) return false;
  c.t += dt;
  // A press skips ahead to the cards rather than out of the beat entirely —
  // the thing you paid for should never be the part that gets cut.
  if ((justPressed('a') || justPressed('b')) && c.t < CHEST_SHAKE + CHEST_BURST) {
    c.t = CHEST_SHAKE + CHEST_BURST;
  }
  if (c.t < CHEST_T) return true;
  G.chestOpen = null;
  if (c.done) c.done();
  return true;
}

function drawChest(g) {
  const c = G.chestOpen;
  const cx = VIEW_W / 2, cy = VIEW_H / 2;
  g.save();
  g.fillStyle = 'rgba(10,6,16,.82)';
  g.fillRect(0, 0, VIEW_W, VIEW_H);

  const tint = c.tint || '#ffc94d';
  if (c.t < CHEST_SHAKE) {
    // Working itself open: three shakes that tighten, so it reads as pressure
    // building rather than a wobble on a timer.
    const k = c.t / CHEST_SHAKE;
    const sx = Math.sin(k * Math.PI * 6) * (1 - k) * 4;
    // Drawn rather than sprited, the way the orb's shell is — there is no chest
    // art in the pipeline and this has to read at 36 pixels. The lid is its own
    // piece so it can strain upward against the box as the shake tightens,
    // which is the difference between a thing working itself open and a
    // rectangle vibrating.
    const lift = k * k * 5;
    g.save(); g.translate(cx + sx, cy);
    // Box.
    g.fillStyle = '#6b4526'; g.fillRect(-18, -6, 36, 18);
    g.fillStyle = '#4a2f19'; g.fillRect(-18, 8, 36, 4);          // shadowed foot
    g.strokeStyle = '#2a1b2e'; g.lineWidth = 1; g.strokeRect(-18, -6, 36, 18);
    // Straps and the lock the lid is fighting.
    g.fillStyle = '#3a2413'; g.fillRect(-13, -6, 3, 18); g.fillRect(10, -6, 3, 18);
    g.fillStyle = tint; g.fillRect(-3, 0, 6, 6);
    g.strokeStyle = '#2a1b2e'; g.strokeRect(-3, 0, 6, 6);
    // Lid, hinged at the back and lifting.
    g.save(); g.translate(0, -6 - lift); g.rotate(-lift * .022);
    g.fillStyle = '#7d5430'; g.fillRect(-18, -8, 36, 8);
    g.fillStyle = tint; g.fillRect(-18, -8, 36, 3);
    g.strokeStyle = '#2a1b2e'; g.strokeRect(-18, -8, 36, 8);
    g.restore();
    g.restore();
    // Light leaking out of the seam, brighter as it gives.
    g.globalAlpha = k * k;
    g.fillStyle = tint;
    g.fillRect(cx - 18, cy - 1, 36, 2);
  } else if (c.t < CHEST_SHAKE + CHEST_BURST) {
    const k = (c.t - CHEST_SHAKE) / CHEST_BURST;
    g.globalCompositeOperation = 'lighter';
    for (let i = 0; i < 12; i++) {
      const a = (i / 12) * Math.PI * 2 + k * .5;
      g.globalAlpha = (1 - k) * .5;
      g.strokeStyle = tint; g.lineWidth = 2 + (1 - k) * 3;
      g.beginPath(); g.moveTo(cx, cy);
      g.lineTo(cx + Math.cos(a) * k * 150, cy + Math.sin(a) * k * 150);
      g.stroke();
    }
    g.globalCompositeOperation = 'source-over';
    g.globalAlpha = 1 - k;
    g.fillStyle = '#fff'; 
    g.beginPath(); g.arc(cx, cy, 6 + k * 30, 0, Math.PI * 2); g.fill();
  } else {
    // What you actually bought, one name at a time so a five-pull does not
    // arrive as a paragraph.
    const k = (c.t - CHEST_SHAKE - CHEST_BURST) / CHEST_SHOW;
    const names = c.names || [];
    g.textAlign = 'center';
    g.font = 'bold 13px monospace';
    g.fillStyle = tint;
    g.fillText(c.label || 'OPENED', cx, cy - 34);
    g.font = 'bold 9px monospace';
    for (let i = 0; i < names.length; i++) {
      const at = clamp(k * names.length - i, 0, 1);
      if (at <= 0) continue;
      g.globalAlpha = at;
      g.fillStyle = '#f3ecff';
      g.fillText(names[i], cx, cy - 14 + i * 13 + (1 - at) * 5);
    }
  }
  g.restore();
}

function drawGotcha(g) {
  const a = G.gotcha;
  const k = clamp(a.t / 1.9, 0, 1);
  const fade = k > .86 ? 1 - (k - .86) / .14 : 1;
  g.save();
  g.globalAlpha = clamp(fade, 0, 1);
  g.fillStyle = 'rgba(10,6,16,.82)';
  g.fillRect(0, 0, VIEW_W, VIEW_H);

  // Rays turning slowly behind it — the cheapest way to make a moment feel big.
  const cx = VIEW_W / 2, cy = 88;
  g.save(); g.translate(cx, cy); g.rotate(a.t * .5);
  for (let i = 0; i < 12; i++) {
    g.rotate(Math.PI / 6);
    g.globalAlpha = .12 * fade;
    g.fillStyle = '#ffc94d';
    g.beginPath(); g.moveTo(0, 0); g.lineTo(160, -13); g.lineTo(160, 13); g.closePath(); g.fill();
  }
  g.restore();

  // The kin, arriving with a bounce that settles.
  const pop = k < .3 ? 1 - Math.pow(1 - k / .3, 3) : 1;
  const bob = Math.sin(a.t * 4) * 2 * (k > .3 ? 1 : 0);
  const scale = Math.max(1, Math.round(2 + pop));
  const spr = sprite('creature', a.species);
  const w = (spr ? spr.width : 40) * scale, h = (spr ? spr.height : 40) * scale;
  g.globalAlpha = fade;
  drawSpr(g, 'creature', a.species, Math.round(cx - w / 2), Math.round(cy - h / 2 + bob), scale);

  // Sparks rising past it, seeded off their index so they do not all agree.
  for (let i = 0; i < 26; i++) {
    const seed = (i * 97 % 41) / 41, sp = .5 + (i % 5) * .16;
    const ty = ((a.t * sp + seed) % 1);
    const x = 20 + seed * (VIEW_W - 40) + Math.sin(a.t * 2 + i) * 5;
    g.globalAlpha = (1 - ty) * .9 * fade;
    g.fillStyle = i % 3 === 0 ? '#fff' : '#ffc94d';
    g.fillRect(Math.round(x), Math.round(VIEW_H - 10 - ty * 130), 2, 2);
  }

  g.globalAlpha = fade;
  g.textAlign = 'center';
  g.font = 'bold 22px monospace';
  // The starter borrows this beat, and it was not caught — it was handed over.
  // A gift that shouts GOTCHA! is claiming something that did not happen.
  const head = a.head || 'GOTCHA!';
  g.fillStyle = '#2a1b2e';
  g.fillText(head, cx + 1, 36);
  g.fillStyle = '#ffc94d';
  g.fillText(head, cx, 35);
  g.font = 'bold 11px monospace';
  g.fillStyle = '#f3ecff';
  g.fillText(a.name, cx, 150);
  g.font = '8px monospace';
  g.fillStyle = '#b9adc4';
  g.fillText(a.where, cx, 164);
  // The errand's counter, only on the ones that moved it. A fourth Emberpup
  // gets the celebration and no tally, because nothing was written.
  if (a.note) { g.fillStyle = '#ffc94d'; g.fillText(a.note, cx, 178); }
  g.textAlign = 'left';
  g.restore();
}

/**
 * The air in a place.
 *
 * Every map was drawn with the same light, which is why the valley reads as one
 * tileset rather than eight places. This is the cheapest thing that fixes it: a
 * colour poured over the finished frame, a vignette so the edges fall away, and
 * a few motes drifting through the light. Nothing here touches the tiles — a map
 * keeps its own art and gets its own weather.
 *
 *   tint/grade — the colour of the light and how much of it there is
 *   vig        — how hard the corners close in
 *   motes      — how many specks drift, and what colour, and which way
 */
const AIR = {
  hollowbrook: { tint: [255, 208, 140], grade: .17, vig: .46, motes: 16, mc: [255, 226, 170], drift: [-4, -7] },
  lab:         { tint: [150, 190, 255], grade: .20, vig: .56, motes: 12,  mc: [190, 220, 255], drift: [2, -5] },
  wayhouse:    { tint: [255, 190, 120], grade: .22, vig: .54, motes: 14,  mc: [255, 214, 150], drift: [3, -6] },
  shop:        { tint: [255, 200, 150], grade: .18, vig: .52, motes: 11,  mc: [255, 224, 176], drift: [-3, -5] },
  route_one:   { tint: [180, 255, 190], grade: .14, vig: .40, motes: 22, mc: [214, 255, 200], drift: [7, -4] },
  emberwood:   { tint: [255, 150, 90],  grade: .25, vig: .48, motes: 28, mc: [255, 180, 110], drift: [5, -9] },
  stillmere:   { tint: [130, 205, 255], grade: .23, vig: .44, motes: 20, mc: [190, 235, 255], drift: [-6, -3] },
  crown_hollow:{ tint: [190, 160, 255], grade: .28, vig: .60, motes: 26, mc: [225, 200, 255], drift: [3, -8] },
};
const AIR_DEFAULT = { tint: [255, 220, 180], grade: .14, vig: .42, motes: 14, mc: [255, 235, 200], drift: [4, -6] };

/**
 * Motes are deterministic: a fixed lattice of specks, each drifting on its own
 * clock and wrapping. No allocation, no particle list, and the same frame every
 * time for a given t — which the render suite needs and which costs nothing.
 */
function drawMotes(g, air, t) {
  const n = air.motes | 0;
  if (!n) return;
  const [dx, dy] = air.drift;
  g.save();
  for (let i = 0; i < n; i++) {
    // Cheap hash so the specks are scattered rather than gridded.
    const h = Math.sin(i * 12.9898) * 43758.5453;
    const fx = h - Math.floor(h);
    const h2 = Math.sin(i * 78.233) * 22578.145;
    const fy = h2 - Math.floor(h2);
    const life = 6 + fx * 5;
    const x = (fx * VIEW_W + t * dx) % (VIEW_W + 8);
    const y = (fy * VIEW_H + t * dy) % (VIEW_H + 8);
    // Breathing, out of phase, so the field never pulses as one.
    const a = (.34 + .40 * (.5 + .5 * Math.sin(t * 1.6 + i * 2.1))) * (.55 + .45 * fy);
    g.fillStyle = `rgba(${air.mc[0]},${air.mc[1]},${air.mc[2]},${a.toFixed(3)})`;
    const sz = fx > .82 ? 2 : 1;
    g.fillRect(Math.round((x + VIEW_W + 8) % (VIEW_W + 8)) - 4,
      Math.round((y + VIEW_H + 8) % (VIEW_H + 8)) - 4, sz, sz);
    void life;
  }
  g.restore();
}

/** The grade and the vignette, over whatever was drawn. */
function drawAir(g, air, t) {
  if (air.grade > 0) {
    g.save();
    // Soft-light rather than overlay. Overlay pushes saturated pixels hard, which
    // is fine for a sky and heavy-handed on a sprite; soft-light tints the air
    // and leaves the art most of its own colour.
    g.globalCompositeOperation = 'soft-light';
    g.fillStyle = `rgba(${air.tint[0]},${air.tint[1]},${air.tint[2]},${air.grade})`;
    g.fillRect(0, 0, VIEW_W, VIEW_H);
    g.restore();
  }
  if (air.vig > 0 && g.createRadialGradient) {
    // Elliptical, not round. A circular vignette on a 256x208 frame closes
    // hardest at the left and right edges, which is exactly where the two kin
    // stand in a fight — so the darkest part of the frame was the part with the
    // subjects in it. Widening the clear zone horizontally is the right shape
    // for a landscape frame whether or not anything was visibly wrong.
    g.save();
    g.translate(VIEW_W / 2, VIEW_H / 2);
    g.scale(1.5, 1);
    const gr = g.createRadialGradient(0, 0, VIEW_H * .34, 0, 0, VIEW_H * .78);
    gr.addColorStop(0, 'rgba(0,0,0,0)');
    gr.addColorStop(1, `rgba(6,3,10,${air.vig})`);
    g.fillStyle = gr;
    g.fillRect(-VIEW_W, -VIEW_H, VIEW_W * 2, VIEW_H * 2);
    g.restore();
  }
  drawMotes(g, air, t);
}

function draw() {
  if (!ctx) return;
  ctx.imageSmoothingEnabled = false;
  ctx.clearRect(0, 0, VIEW_W, VIEW_H);
  if (G.mode === 'title') return;
  if (G.evoAnim) drawEvolution(ctx);
  else if (G.battle) drawBattle(ctx);
  else if (G.map) drawWorld(ctx);
  // The air goes on after the scene and before anything that is meant to sit on
  // top of it — a flourish, a fade, a door closing. Those are punctuation, and
  // punctuation should not be graded.
  if (G.mode !== 'title') {
    // An arena already colours itself — drawArena washes the sky in the foe's
    // element — so grading it again is grading it twice, and the second one is
    // over the kin rather than behind them. Crown Hollow's violet is orange's
    // complement, and at any strength worth having it turned Cindercub to brown
    // mud while flattering the purple thing it was fighting: a grade that picks
    // a side. So a battle gets the dark and the drifting and none of the wash.
    // A fight is lit for the fight. The arena already colours itself — drawArena
    // washes the sky in the foe's element and puts a sun behind them — so
    // grading it again with the map's weather is grading it twice, and the
    // second pass lands over the kin rather than behind them. So a battle takes
    // the dark and the drifting and none of the wash, with the legendary getting
    // more of both. Only the world gets weather.
    const air = G.battle
      ? { ...AIR_DEFAULT, grade: 0, vig: G.battle.legendary ? .40 : .30,
        motes: G.battle.legendary ? 40 : 14,
        mc: G.battle.legendary ? [240, 215, 255] : AIR_DEFAULT.mc,
        drift: G.battle.legendary ? [2, -10] : AIR_DEFAULT.drift }
      : (AIR[G.mapId] || AIR_DEFAULT);
    drawAir(ctx, air, G.t);
  }
  // Over the world and its weather, under everything that takes the screen —
  // a plaque has no business sitting on top of a catch or a wipe. The rule was
  // written and then named one screen-taker: an evolution replaces the world
  // exactly as a battle does, and the plaque was drawing straight over it.
  // Provoked by a scene that enters a map and evolves in the same breath; I
  // could not reach it in play, because a level comes from a fight and a fight
  // cannot start and finish inside the plaque's two seconds. Latent, not live —
  // and one token, against an intent already spelled out on the line above.
  if (G.place && !G.battle && !G.evoAnim) drawPlace(ctx);
  if (G.flourish) drawFlourish(ctx);
  if (G.gotcha) drawGotcha(ctx);
  if (G.chestOpen) drawChest(ctx);
  const dark = blackoutCover();
  if (dark > 0) {
    ctx.fillStyle = `rgba(6,3,10,${dark.toFixed(3)})`;
    ctx.fillRect(0, 0, VIEW_W, VIEW_H);
  }
  if (G.fade > 0) {
    ctx.fillStyle = `rgba(8,5,12,${clamp(G.fade * 2.4, 0, 1)})`;
    ctx.fillRect(0, 0, VIEW_W, VIEW_H);
  }
  // The closing half of a door. The map behind it is still the old one.
  if (G.warp) {
    ctx.fillStyle = `rgba(8,5,12,${clamp(1 - G.warp.t / WARP_SHUT, 0, 1)})`;
    ctx.fillRect(0, 0, VIEW_W, VIEW_H);
  }
  if (G.wipe > 0) {
    // Bars slide in from alternating sides, meet, then retract on the battle.
    const k = 1 - G.wipe / WIPE_T;
    const cover = clamp(k < .5 ? k * 2 : (1 - k) * 2, 0, 1);
    const bars = 8, bh = VIEW_H / bars;
    ctx.fillStyle = '#0a070e';
    for (let i = 0; i < bars; i++) {
      const w = VIEW_W * cover;
      ctx.fillRect(i % 2 ? VIEW_W - w : 0, i * bh, w, bh + 1);
    }
  }
}

/** The evolution payoff: spokes of light, a shimmer, then the new shape. */
function drawEvolution(g) {
  const a = G.evoAnim;
  const phase = evoPhase();
  if (!phase) return;
  const t = a.t, dur = a.beats[a.i][1], k = clamp(t / dur, 0, 1);
  // How far through the whole thing, for anything that ramps across beats.
  const heat = evoHeat(phase, k);

  g.fillStyle = '#120b1a';
  g.fillRect(0, 0, VIEW_W, VIEW_H);

  // The wheel: twelve spokes turning behind it, faster the closer it gets.
  g.save();
  g.translate(VIEW_W / 2, 92);
  g.rotate(a.spin);
  g.globalAlpha = .07 + heat * .22;
  g.fillStyle = '#ffc94d';
  for (let i = 0; i < 12; i++) {
    g.rotate(Math.PI / 6);                      // spokes stay 30° apart
    g.beginPath(); g.moveTo(0, 0); g.lineTo(-10, -220); g.lineTo(10, -220); g.closePath(); g.fill();
  }
  g.restore();

  // Motes falling *into* it while the light builds — the energy is arriving,
  // not leaving, which is the whole difference between evolving and burning.
  if (heat > .05) {
    for (let i = 0; i < 26; i++) {
      const seed = (i * 71 % 41) / 41;
      const ang = seed * Math.PI * 2 + G.t * .4;
      const pull = ((G.t * (.6 + (i % 4) * .25) + seed) % 1);
      const r = 100 * (1 - pull);
      g.globalAlpha = (1 - Math.abs(pull * 2 - 1)) * heat * .8;
      g.fillStyle = i % 3 ? '#ffd98a' : '#fff4dc';
      g.fillRect(Math.round(VIEW_W / 2 + Math.cos(ang) * r),
        Math.round(92 + Math.sin(ang) * r * .7), 1, 1);
    }
    g.globalAlpha = 1;
  }

  const id = a.swapped ? a.to : a.from;
  const s = 3;
  const bottom = artBottom(id) * s;
  // It shivers harder the closer it gets, and holds perfectly still once it
  // has landed. Whole pixels — a sprite between them at ×3 shimmers.
  const jitter = phase === 'build' ? Math.round(Math.sin(G.t * 34) * (1 + k * 2))
    : phase === 'hold' ? Math.round(Math.sin(G.t * 14) * .6) : 0;
  const x = VIEW_W / 2 - 20 * s + jitter, y = 128 - bottom;
  drawSpr(g, 'creature', id, x, y, s, {});
  // …and it goes white as the light takes it. Additive blits of its own
  // silhouette: a flat dark shape stacked on itself climbs to white, which is
  // the only way to blow a sprite out without a second set of art for it.
  const glow = phase === 'build' ? k : phase === 'burst' ? 1 : phase === 'settle' ? 1 - k : 0;
  if (glow > .02) {
    g.save();
    g.globalCompositeOperation = 'lighter';
    for (let i = 0; i < 5; i++) {
      g.globalAlpha = glow * .42;
      drawSpr(g, 'creature', id, x, y, s, { sil: true });
    }
    g.restore();
    g.globalAlpha = 1;
  }

  // The burst itself: a white-out with a ring running out of it.
  if (phase === 'burst') {
    const b = 1 - Math.abs(k * 2 - 1);
    g.strokeStyle = `rgba(255,236,190,${(1 - k) * .9})`;
    g.lineWidth = Math.max(1, 4 * (1 - k));
    g.beginPath(); g.arc(VIEW_W / 2, 92, 10 + k * 150, 0, Math.PI * 2); g.stroke();
    g.fillStyle = `rgba(255,255,255,${b * .95})`;
    g.fillRect(0, 0, VIEW_W, VIEW_H);
  }
}

/**
 * One exception used to take the whole game with it: the throw escaped, the
 * requestAnimationFrame chain stopped, and the page froze on its last drawn
 * frame with the buttons still labelled for a state the game was no longer in.
 * Nothing the player pressed did anything and the run was gone. The loop keeps
 * going now, and says so, so a bug costs a frame rather than the save.
 */
function frame(now) {
  const dt = Math.min(.05, (now - (frame.last || now)) / 1000);
  frame.last = now;
  try {
    step(dt);
    draw();
    if (G.mode === 'title') drawTitleArt(G.t);
  } catch (e) {
    frame.errs = (frame.errs || 0) + 1;
    if (frame.errs <= 3) {
      console.error('emberkin frame error', e);
      setToast('Something went wrong — the game kept going.');
    }
  }
  fired.clear();
  if (!HEADLESS) requestAnimationFrame(frame);
}

/** One tick of simulation. Split out so tests can drive it deterministically. */
function step(dt) {
  G.t += dt; G.dt = dt; G.playtime += dt;
  if (G.fade > 0) G.fade = Math.max(0, G.fade - dt);
  if (G.wipe > 0) G.wipe = Math.max(0, G.wipe - dt);
  // The panels are DOM and the bars are canvas, so nothing about the wipe
  // reaches them unless it is said here.
  if (!HEADLESS) document.body.classList.toggle('wiping', screenCovered());
  // Ages here with the other passive overlays rather than inside a mode branch,
  // for the reason spelled out below about message holds: a timer that only
  // ticks while one branch is running is a timer that can stick for ever.
  // Whether the screen is under something opaque enough that nothing else is
  // being seen: a door's curtain, the fade that opens the far side of it, or
  // the bars of a battle wipe. Named because three things ask it — the plaque's
  // clock, the toast's clock, and the class that takes the battle panels out of
  // the wipe — and three copies of a condition are three copies that drift.
  //
  // The two clocks are here for the same reason and were found one after the
  // other: a beat whose display time is spent behind a curtain has not been
  // shown, it has been consumed.
  //
  // A plaque nobody can see is not being shown. `enterMap` raises it while the
  // door is still shut, so its clock was running behind black: measured on a
  // warp, the map swaps at 0.183s, `G.fade` opens the far side over 0.300s, and
  // PLACE_IN is 0.300s starting at that same instant. ALL of the ease that
  // drawPlace's comment describes — "it eases on the way in so it arrives
  // rather than snaps" — happened underneath the fade, and the world appeared
  // with the name already fully in place.
  //
  // The clock waits for the light rather than the raise being delayed, because
  // that self-corrects for every entrance — a warp's .3, the loss handler's .5,
  // and the paths with no fade at all — instead of naming one of them. `G.fade`
  // decays unconditionally two lines down, so this cannot stall; that the
  // plaque still arrives is netted separately, because "wait for X" and "X
  // still happens" are two claims.
  if (G.place) {
    if (!screenCovered()) G.place.t += dt;
    if (G.place.t > PLACE_IN + PLACE_HOLD + PLACE_OUT) G.place = null;
  }
  if (G.toastT > 0) {
    // Same rule as the plaque above. The toast that says "Dewdrip — new to the
    // dex" fires as a fight begins, so its whole life ran under the wipe's
    // bars: shot at peak cover it was the only thing left on the screen, and
    // measured, it was at 0.99 opacity over a picture that was 97% black.
    if (!screenCovered()) G.toastT -= dt;
    // The string goes when the toast does. A message that outlives its own
    // display reads as current to anything that asks G rather than the screen.
    if (G.toastT <= 0) { G.toast = ''; if (!HEADLESS) els.toast.classList.remove('on'); }
  }
  if (justPressed('m')) toggleMute();
  // Keyed on the screen too, because the reward screen labels its buttons
  // differently from every other one and can open from another screen.
  const uiKey = G.mode + (G.screen ? ':' + G.screen.kind : '');
  if (uiKey !== G.uiMode) { G.uiMode = uiKey; touchLabels(); }

  // Both message queues age here and nowhere else. Ticking a hold inside the
  // branch that happens to be running means a message left over from another
  // branch keeps its hold for ever, and a hold that never expires is a message
  // that can never be dismissed.
  if (G.dialogue) G.dialogue.hold = Math.max(0, G.dialogue.hold - dt);
  if (G.battleMsg) G.battleMsg.hold = Math.max(0, G.battleMsg.hold - dt);

  // The celebration owns the screen while it runs, and any key skips the tail
  // of it — nobody should have to sit through a flourish twice.
  // Two things own the screen outright while they run, on their own clocks:
  // the curtain over a door, and an evolution.
  if (G.warp && warpStep(dt)) return;
  if (G.evoAnim && evoStep(dt)) return;
  if (G.alert && G.alert.beats && alertStep(dt)) return;
  if (G.rustle && rustleStep(dt)) return;
  if (G.mend && mendStep(dt)) return;
  if (G.blackout && blackoutStep(dt)) return;
  if (G.chestOpen && chestStep(dt)) return;
  if (G.flourish && flourishStep(dt)) return;
  if (G.gotcha) {
    G.gotcha.t += dt;
    if (G.gotcha.t > 2 || justPressed('a') || justPressed('b')) {
      const done = G.gotcha.done;
      G.gotcha = null;
      if (done) done();
    }
    return;
  }
  // The title is a DOM screen and was wired to clicks alone, so on a phone —
  // where the two circles are the only controls — pressing either did nothing
  // at all. The first thing a phone player ever saw was a pair of glowing
  // buttons naming actions that did not exist and answering to nothing.
  //
  // It sits with the other modes, BELOW the screen-owning beats, not above
  // them. Above, its `return` swallowed anything mid-run — the render suite
  // caught it holding an evolution on its first frame for ever.
  if (G.mode === 'title') {
    if (justPressed('a')) (hasSave() ? startCont : startNew)();
    else if (justPressed('b')) startNew();
    return;
  }
  if (G.mode === 'dialogue') {
    if (justPressed('a') || justPressed('b')) advanceDialogue();
    return;
  }
  if (G.mode === 'menu') { menuInput(); return; }
  if (G.mode === 'screen') { screenInput(); return; }
  if (G.mode === 'battle') { updateBattle(dt); return; }
  if (G.mode === 'world') { updateWorld(dt); return; }
}

function newGame() {
  G.party = []; G.box = []; G.bag = {}; G.money = 500; G.gems = 0; G.dex = {}; G.been = {}; G.flags = {};
  G.cards = []; G.deck = []; G.nextUid = 0; G.chestsOpened = 0; G.might = 0;
  STARTER_DECK.forEach(grantCard);
  G.steps = 0; G.playtime = 0; G.wins = 0; G.caught = 0; G.battle = null;
  G.placeSeen = null; G.place = null;      // see loadGame — a new run has been nowhere
  enterMap('lab', 5, 5, 'up');
  G.mode = 'world';
  updateCam();
  say('Elder Rowan', ['…and there you are. Come in, shut the door, the kin get out.'], () => {});
}

/**
 * Leaving the title. These were closures inside `boot`, reachable only from the
 * two DOM buttons — so on a phone, where the round controls are the only thing
 * you can press, the title did not respond to either of them. See `step`.
 */
function startNew() { show(els.title, false); wipeSave(); newGame(); playCue('world'); }
function startCont() {
  show(els.title, false);
  if (!loadGame()) newGame();
  else { G.mode = 'world'; updateCam(); }
  // A save picked up in the Emberwood should not open on the town's tune.
  playCue(placeTrack(G.mapId));
}

function boot() {
  if (HEADLESS) return;
  cacheEls();
  ctx = els.view.getContext('2d');
  fitStage();
  window.addEventListener('resize', fitStage);

  // keyboard
  // A field with focus is being typed into, not played with — every key goes
  // to it, except Enter and Escape, which mean "that will do" either way.
  const typing = (e) => {
    const t = e.target;
    return t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA');
  };
  window.addEventListener('keydown', (e) => {
    if (typing(e)) {
      if (e.key === 'Enter' || e.key === 'Escape') { e.target.blur(); e.preventDefault(); }
      return;
    }
    const k = KEYMAP[e.key] || e.key;
    if (KEYMAP[e.key] || e.key === 'm') e.preventDefault();
    pressKey(k);
  });
  window.addEventListener('keyup', (e) => { if (!typing(e)) releaseKey(KEYMAP[e.key] || e.key); });

  // touch
  // ---- the stick: it appears under your thumb, wherever that lands
  const stick = { id: null, cx: 0, cy: 0, dir: null };
  const stickEl = document.getElementById('stick');
  const knobEl = document.getElementById('knob');
  const padEl = document.getElementById('pad');

  const setStickDir = (dir) => {
    for (const d of ['up', 'down', 'left', 'right']) if (d !== dir) releaseKey(d);
    if (dir) pressKey(dir);
    stick.dir = dir;
  };
  const stickPlace = (x, y) => {
    const r = padEl.getBoundingClientRect();
    stickEl.style.left = (x - r.left) + 'px';
    stickEl.style.top = (y - r.top) + 'px';
  };
  const stickDrag = (x, y) => {
    const dx = x - stick.cx, dy = y - stick.cy;
    const d = Math.hypot(dx, dy), R = 42;
    const k = d > R ? R / d : 1;
    knobEl.style.transform = `translate(${dx * k}px, ${dy * k}px)`;
    setStickDir(stickDir(dx, dy));
  };
  const stickEnd = () => {
    stick.id = null;
    setStickDir(null);
    stickEl.classList.remove('on');
    knobEl.style.transform = '';
  };

  padEl.addEventListener('touchstart', (e) => {
    e.preventDefault();
    // In a dialogue the stick has no job — arrows do nothing in that mode — and
    // this preventDefault cancels the synthetic click, which is what the
    // document handler uses to advance a line from a tap anywhere. In the
    // overlay layout the pad lies directly over the left third of the dialogue
    // box, so the most natural place on the screen to tap was the one place
    // that did nothing at all.
    if (G.mode === 'dialogue') { tapKey('a'); return; }
    const t = e.changedTouches[0];
    stick.id = t.identifier; stick.cx = t.clientX; stick.cy = t.clientY;
    stickPlace(t.clientX, t.clientY);
    stickEl.classList.add('on');
    knobEl.style.transform = '';
  }, { passive: false });
  padEl.addEventListener('touchmove', (e) => {
    e.preventDefault();
    for (const t of e.changedTouches) if (t.identifier === stick.id) stickDrag(t.clientX, t.clientY);
  }, { passive: false });
  for (const ev of ['touchend', 'touchcancel']) {
    padEl.addEventListener(ev, (e) => {
      e.preventDefault();
      for (const t of e.changedTouches) if (t.identifier === stick.id) stickEnd();
    }, { passive: false });
  }
  // A mouse can drive it too, which makes it testable in a desktop browser.
  padEl.addEventListener('mousedown', (e) => {
    stick.id = 'mouse'; stick.cx = e.clientX; stick.cy = e.clientY;
    stickPlace(e.clientX, e.clientY); stickEl.classList.add('on');
  });
  window.addEventListener('mousemove', (e) => { if (stick.id === 'mouse') stickDrag(e.clientX, e.clientY); });
  window.addEventListener('mouseup', () => { if (stick.id === 'mouse') stickEnd(); });

  // ---- the two action buttons
  const bindHold = (el, key) => {
    const on = (e) => { e.preventDefault(); pressKey(key); };
    const off = (e) => { e.preventDefault(); releaseKey(key); };
    el.addEventListener('touchstart', on, { passive: false });
    el.addEventListener('touchend', off, { passive: false });
    el.addEventListener('touchcancel', off, { passive: false });
    el.addEventListener('mousedown', on); el.addEventListener('mouseup', off); el.addEventListener('mouseleave', off);
  };
  document.querySelectorAll('#btns .rbtn').forEach((el) => bindHold(el, el.dataset.k === 'z' ? 'a' : 'b'));

  const goTouch = () => {
    document.body.classList.add('touch');
    document.body.classList.remove('notouch');
    fitStage();
  };
  if ((window.matchMedia && matchMedia('(pointer: coarse)').matches) || navigator.maxTouchPoints > 0) goTouch();
  window.addEventListener('touchstart', goTouch, { once: true });

  // ---- the hand: drag a card up to play it, or tap it
  //
  // Dragging is the gesture a card game teaches you, so it is the primary one;
  // a tap still works (aim, then confirm), and a mouse plays in one click
  // because hovering already aimed it.
  const handEl = els.hand;
  let drag = null;
  const dragLift = () => Math.max(28, handEl.getBoundingClientRect().height * .34);

  handEl.addEventListener('pointerdown', (e) => {
    const cel = e.target.closest && e.target.closest('.cardel');
    if (!cel || !G.battle) return;
    const i = +cel.dataset.c;
    drag = { i, x0: e.clientX, y0: e.clientY, el: cel, moved: false };
    G.battle.sel = i;
    try { cel.setPointerCapture(e.pointerId); } catch (err) {}
    renderHand();
    // renderHand rebuilds the row, so re-find the element we are dragging.
    drag.el = handEl.querySelector(`.cardel[data-c="${i}"]`) || cel;
  });

  handEl.addEventListener('pointermove', (e) => {
    if (!drag || !G.battle) return;
    const dx = e.clientX - drag.x0, dy = e.clientY - drag.y0;
    if (Math.hypot(dx, dy) > 8) drag.moved = true;
    if (!drag.moved) return;
    drag.el.style.transform = `translate(${dx}px, ${Math.min(0, dy)}px)`;
    drag.el.classList.toggle('willplay', -dy >= dragLift());
  });

  const endDrag = (e) => {
    if (!drag || !G.battle) { drag = null; return; }
    const lift = drag.y0 - (e.clientY != null ? e.clientY : drag.y0);
    const d = drag;
    drag = null;
    d.el.style.transform = '';
    d.el.classList.remove('willplay');
    const b = G.battle;
    if (d.moved && lift >= dragLift()) { b.sel = d.i; b.armed = null; playSelected(); return; }
    if (d.moved) { renderHand(); return; }               // dragged nowhere: put it back
    if (b.armed === d.i) { b.sel = d.i; b.armed = null; playSelected(); }
    else { b.sel = d.i; b.armed = d.i; renderHand(); }
  };
  handEl.addEventListener('pointerup', endDrag);
  handEl.addEventListener('pointercancel', () => { if (drag) { drag.el.style.transform = ''; drag.el.classList.remove('willplay'); drag = null; } });

  // ---- fullscreen
  document.getElementById('fsbtn').addEventListener('click', toggleFullscreen);
  for (const ev of ['fullscreenchange', 'webkitfullscreenchange']) {
    document.addEventListener(ev, () => {
      document.body.classList.toggle('fs', !!(document.fullscreenElement || document.webkitFullscreenElement));
      setTimeout(fitStage, 60);
    });
  }
  window.addEventListener('orientationchange', () => setTimeout(fitStage, 120));


  // Hovering a card aims it, so a mouse click plays in one go.
  document.addEventListener('mouseover', (e) => {
    if (!G.battle || document.body.classList.contains('touch')) return;
    const cel = e.target.closest && e.target.closest('.cardel');
    if (!cel) return;
    const i = +cel.dataset.c;
    if (G.battle.sel === i && G.battle.armed === i) return;
    G.battle.sel = i; G.battle.armed = i;
    renderHand();
  });

  // clicks on menus / cards / dialogue
  document.addEventListener('click', (e) => {
    const row = e.target.closest && e.target.closest('.menu .row');
    if (row && G.menu) { G.menu.i = +row.dataset.i; renderMenu(); playCue('select');
      const r = G.menu.rows[G.menu.i]; if (r && !r.off && r.fn) r.fn(); return; }
    const act = e.target.closest && e.target.closest('.abtn');
    if (act && G.battle) {
      const a = act.dataset.a;
      if (a === 'end') doEndTurn();
      else if (a === 'kin') openScreen('party');
      else if (a === 'bag') openScreen('bag');
      else submitLog(doAction({ kind: 'run' }));
      return;
    }
    const card = e.target.closest && e.target.closest('[data-i]');
    if (card && G.screen && els.screen.contains(card)) { G.screen.i = +card.dataset.i; renderScreen(); screenSelect(); return; }
    if (e.target.closest && e.target.closest('.back')) { closeScreen(); return; }
    if (els.dialogue && !els.dialogue.classList.contains('hidden')) { tapKey('a'); return; }
  });

  // title
  els.title.querySelector('[data-act="new"]').addEventListener('click', startNew);
  const contBtn = els.title.querySelector('[data-act="cont"]');
  // One flag for both the button and the ordering, so the screen cannot show
  // Continue while still leading with the button that wipes the save.
  if (hasSave()) { show(contBtn, true); els.title.classList.add('returning'); }
  contBtn.addEventListener('click', startCont);

  // A parade of three kin on the title card, cycling through the roster.
  titleCtx = els.titleArt.getContext('2d');

  enterMap('hollowbrook', 9, 8, 'down');
  requestAnimationFrame(frame);
}

/**
 * The title illustration.
 *
 * It was three sprites floating on a flat CSS gradient — the first thing anyone
 * sees, and the only screen in the game with nothing behind it. It is a dusk in
 * the valley now, built the way the arena is: layers, each further one lighter
 * and closer to the sky, with a low sun for them to stand against. The three
 * kin change every few seconds so the roster gets to introduce itself.
 *
 * It is 256x208 — the viewport's own size — because it is the backdrop of the
 * title screen rather than a framed picture hung on it, and at the game's
 * resolution it scales by the same integer factor the valley does. The dusk
 * fills the bezel; the words sit on top of it.
 */
const TITLE_W = 256, TITLE_H = 208;
let titleCtx = null;

function drawTitleArt(t, into) {
  const g = into || titleCtx;
  if (!g) return;
  g.imageSmoothingEnabled = false;
  const HORIZON = 104;

  const sky = g.createLinearGradient(0, 0, 0, HORIZON);
  sky.addColorStop(0, '#160f26');
  sky.addColorStop(.55, '#311c3c');
  sky.addColorStop(1, '#6b3542');
  g.fillStyle = sky; g.fillRect(0, 0, TITLE_W, HORIZON);

  // A sun going down, off to one side so it is not hidden behind the middle
  // of the roster, and low enough that the ridges eat its bottom edge.
  const sunX = Math.round(TITLE_W * .3), sunY = HORIZON - 8;
  const halo = g.createRadialGradient(sunX, sunY, 6, sunX, sunY, 104);
  halo.addColorStop(0, 'rgba(255,196,120,.55)');
  halo.addColorStop(1, 'rgba(255,196,120,0)');
  g.fillStyle = halo; g.fillRect(0, 0, TITLE_W, HORIZON + 8);
  g.fillStyle = '#ffd08a';
  g.beginPath(); g.arc(sunX, sunY, 15, 0, Math.PI * 2); g.fill();

  // Stars, only in the dark half, fading out as the sky warms.
  for (let i = 0; i < 30; i++) {
    const sx = (i * 97) % TITLE_W, sy = (i * 53) % 62;
    g.globalAlpha = (1 - sy / 70) * (.25 + .35 * Math.abs(Math.sin(t * .9 + i)));
    g.fillStyle = '#ffeccd';
    g.fillRect(sx, sy, 1, 1);
  }
  g.globalAlpha = 1;

  const ridge = (baseY, amp, col, phase) => {
    g.fillStyle = col;
    g.beginPath(); g.moveTo(0, TITLE_H);
    for (let x = 0; x <= TITLE_W; x += 5) {
      const h = Math.sin(x * .018 + phase) * amp + Math.sin(x * .047 + phase * 1.6) * amp * .4;
      g.lineTo(x, Math.round(baseY - h));
    }
    g.lineTo(TITLE_W, TITLE_H); g.closePath(); g.fill();
  };
  // Three ridges, each darker and taller than the one behind it. Distance
  // washes contrast out, so the far one is the palest thing on the ground.
  ridge(HORIZON - 4, 9, '#7d4a5c', 1.7);
  ridge(HORIZON + 4, 12, '#563150', .6);
  ridge(HORIZON + 15, 14, '#3a2440', 2.2);

  // A treeline on the nearest ridge, so the valley has something living in it.
  g.fillStyle = '#241a2e';
  for (let x = -6; x < TITLE_W + 6; x += 9) {
    const h = 10 + ((x * 37) % 7);
    const bx = x + ((x * 13) % 4);
    g.beginPath();
    g.moveTo(bx, HORIZON + 28);
    g.lineTo(bx + 4, HORIZON + 28 - h);
    g.lineTo(bx + 8, HORIZON + 28);
    g.closePath(); g.fill();
  }

  // Mist pooling where the trees meet the near ground — the cheapest way to
  // tell the eye that those are two different distances.
  const GROUND_Y = HORIZON + 26;
  const fog = g.createLinearGradient(0, GROUND_Y - 7, 0, GROUND_Y + 5);
  fog.addColorStop(0, 'rgba(122,80,102,0)');
  fog.addColorStop(.5, 'rgba(122,80,102,.5)');
  fog.addColorStop(1, 'rgba(122,80,102,0)');
  g.fillStyle = fog; g.fillRect(0, GROUND_Y - 7, TITLE_W, 12);

  // Near ground: light enough that the kin standing on it keep their feet.
  const soil = g.createLinearGradient(0, GROUND_Y, 0, TITLE_H);
  soil.addColorStop(0, '#3b2740');
  soil.addColorStop(1, '#241a2c');
  g.fillStyle = soil; g.fillRect(0, GROUND_Y, TITLE_W, TITLE_H - GROUND_Y);
  // Tufts, clustered rather than sprinkled, catching the sun from the left.
  for (let i = 0; i < 54; i++) {
    const gx = (i * 61 + (i % 5) * 3) % TITLE_W;
    const gy = GROUND_Y + 2 + ((i * 29) % (TITLE_H - GROUND_Y - 3));
    const lit = gx < TITLE_W * .5;
    g.fillStyle = lit ? '#54354f' : '#2e2036';
    g.fillRect(gx, gy, 1, 2);
    if (i % 3 === 0) g.fillRect(gx + 2, gy + 1, 1, 1);
  }

  // The three of them, on the near ground, changing every few seconds.
  const stars = DEX_ORDER.filter((id) => ART_CREATURES[id]);
  if (stars.length) {
    const step = Math.floor(t / 2.4);
    for (let i = 0; i < 3; i++) {
      const id = stars[(step + i * 5) % stars.length];
      // All three at the same scale. The middle one used to be bigger, which
      // worked when the picture was 372 wide; at the viewport's 256 a x3 sprite
      // is 120 across, eats the treeline behind it and runs off the frame. The
      // one in front earns its place by standing NEARER — lower on the ground —
      // rather than by being drawn larger.
      const sc = 2;
      const cx = 46 + i * 82;
      // They stand in the middle band, not at the bottom edge: the near soil
      // below their feet is where the button and the key hints go.
      const GROUND = i === 1 ? 158 : 148;
      const bob = Math.sin(t * 1.6 + i * 2) * (i === 1 ? 2 : 1.4);
      const bottom = artBottom(id) * sc;
      g.save(); g.globalAlpha = .35; g.fillStyle = '#0d0716';
      g.translate(cx, GROUND); g.scale(1, .3);
      g.beginPath(); g.arc(0, 0, 15 * (sc / 2), 0, Math.PI * 2); g.fill(); g.restore();
      drawSpr(g, 'creature', id, Math.round(cx - 20 * sc), Math.round(GROUND - bottom + bob), sc,
        { flip: i === 2 });
    }
  }

  // Motes rising through the whole picture, and a vignette to close it.
  for (let i = 0; i < 22; i++) {
    const seed = (i * 71 % 43) / 43;
    const rise = (t * (.06 + (i % 4) * .03) + seed) % 1;
    g.globalAlpha = (1 - rise) * .5;
    g.fillStyle = i % 3 ? '#ffd08a' : '#fff4dc';
    g.fillRect(Math.round(seed * TITLE_W + Math.sin(t + i) * 4), Math.round(TITLE_H - rise * TITLE_H), 1, 1);
  }
  g.globalAlpha = 1;

  // Two bands the words live in. Without them the tagline sits on the warmest
  // part of the sky and the key hints sit on lit soil, and both go to mush —
  // the picture wins the contrast fight against its own text. Each falls off
  // well before the kin so nothing dims the thing you came to look at.
  const top = g.createLinearGradient(0, 0, 0, 56);
  top.addColorStop(0, 'rgba(8,5,14,.62)');
  top.addColorStop(1, 'rgba(8,5,14,0)');
  g.fillStyle = top; g.fillRect(0, 0, TITLE_W, 56);
  const bot = g.createLinearGradient(0, 162, 0, TITLE_H);
  bot.addColorStop(0, 'rgba(8,5,14,0)');
  bot.addColorStop(1, 'rgba(8,5,14,.8)');
  g.fillStyle = bot; g.fillRect(0, 162, TITLE_W, TITLE_H - 162);

  const vig = g.createRadialGradient(TITLE_W / 2, TITLE_H / 2, TITLE_H * .3,
    TITLE_W / 2, TITLE_H / 2, TITLE_W * .62);
  vig.addColorStop(0, 'rgba(10,6,16,0)');
  vig.addColorStop(1, 'rgba(10,6,16,.6)');
  g.fillStyle = vig; g.fillRect(0, 0, TITLE_W, TITLE_H);
}

if (!HEADLESS) boot();

// ---- headless export ---------------------------------------------------
// The test suite drives the real functions; nothing here is a re-implementation.
if (typeof window !== 'undefined') {
  window.EK = {
