 * The moment a hit lands, in the colour and the shape of what landed it.
 *
 * All in whole pixels and straight lines: at 256x208 a curve is three pixels
 * that look like a mistake, and a piece that lands on a half-pixel shimmers.
 * The whole thing is over in a quarter of a second — punctuation, not animation.
 */
function drawBurst(g, myGround, foeGround) {
  const b = B();
  if (!b.burst) return;
  const k = clamp(b.burst.t / BURST_T, 0, 1);
  const e = ELEM_BURST[b.burst.el] || ELEM_BURST.Wild;
  const col = TYPES[b.burst.el] || '#ffe6bf';
  const cx = b.burst.side === 'mine' ? 72 : 178;
  const cy = (b.burst.side === 'mine' ? myGround : foeGround) - 20;
  // Out fast, then hang: most of the reach is spent in the first third, which is
  // what makes it read as an impact rather than an expanding circle.
  const reach = (k < .34 ? k / .34 : 1) * (b.burst.crit ? 30 : 21) * e.len;
  const fade = 1 - k * k;

  g.save();
  // The core: a hot bloom that is white at the centre whatever the element is,
  // because a hit is bright before it is coloured.
  g.globalAlpha = fade * .9;
  g.fillStyle = '#fff6e4';
  const core = Math.round((1 - k) * (b.burst.crit ? 7 : 5));
  if (core > 0) g.fillRect(cx - core, cy - core, core * 2, core * 2);

  if (e.ring) {
    g.globalAlpha = fade * .55;
    g.strokeStyle = col;
    g.lineWidth = 1;
    g.beginPath(); g.arc(cx, cy, Math.max(1, reach * .8), 0, Math.PI * 2); g.stroke();
  }

  // The pieces. A fixed fan rather than a random one, so the same hit looks the
  // same every time and nothing crawls between frames.
  g.globalAlpha = fade;
  g.fillStyle = col;
  const base = -Math.PI / 2 - e.up * Math.PI * .5;
  for (let i = 0; i < e.n; i++) {
    const f = e.n === 1 ? .5 : i / (e.n - 1) - .5;
    const a = base + f * e.spread * Math.PI * 2;
    const wob = 1 + ((i * 37) % 11) / 22;          // uneven lengths, fixed
    const d = reach * wob;
    const px = Math.round(cx + Math.cos(a) * d);
    const py = Math.round(cy + Math.sin(a) * d * .8);
    const w = Math.max(1, Math.round(e.wide * (1 - k) * 2));
    g.fillRect(px - (w >> 1), py - (w >> 1), w, w);
    // A tail back toward the centre, so a piece has a direction.
    const tx = Math.round(cx + Math.cos(a) * d * .55);
    const ty = Math.round(cy + Math.sin(a) * d * .8 * .55);
    g.globalAlpha = fade * .5;
    g.fillRect(tx, ty, 1, 1);
    g.globalAlpha = fade;
  }
  g.restore();
}

function drawCrit(g, myGround, foeGround) {
  const b = B();
  if (!b.crit) return;
  const k = clamp(b.crit.t / CRIT_BURST, 0, 1);
  const cx = b.crit.side === 'mine' ? 72 : 178;
  const cy = (b.crit.side === 'mine' ? myGround : foeGround) - 22;
  const r = 6 + k * 30;
  g.save();
  g.globalAlpha = (1 - k) * .9;
  g.strokeStyle = '#fff4dc';
  g.lineWidth = Math.max(1, 3 * (1 - k));
  g.beginPath(); g.arc(cx, cy, r, 0, Math.PI * 2); g.stroke();
  g.strokeStyle = '#ffc94d';
  g.lineWidth = 2;
  for (let i = 0; i < 4; i++) {
    const a = Math.PI / 4 + i * Math.PI / 2;
    g.beginPath();
    g.moveTo(cx + Math.cos(a) * (r * .55), cy + Math.sin(a) * (r * .55));
    g.lineTo(cx + Math.cos(a) * (r * 1.15), cy + Math.sin(a) * (r * 1.15));
    g.stroke();
  }
  g.restore();
  g.globalAlpha = 1;
}

/**
 * The throw, beat by beat. Nothing here decides anything — the outcome was
 * settled when the orb left your hand — but every beat is a second the player
 * spends not knowing it, and that is the whole of what a catch is.
 */
function drawOrb(g, myGround, foeGround) {
  const b = B();
  const o = b.orb;
  const phase = orbPhase();
  if (!phase && !(b.throwT > 0)) return;
  const rest = { x: 178, y: foeGround + 4 };
  // Only a live beat has a length to measure against; a finished throw is just
  // the tail of the old arc still fading out.
  const k = phase ? clamp(o.t / o.beats[o.i][1], 0, 1) : 0;

  // The orb itself: a gold shell with a dark seam, so it reads at 8 pixels.
  const shell = (x, y, r, tilt) => {
    g.save(); g.translate(x, y); g.rotate(tilt);
    g.beginPath(); g.arc(0, 0, r, 0, Math.PI * 2);
    const grd = g.createLinearGradient(-r, -r, r, r);
    grd.addColorStop(0, '#ffe9a8'); grd.addColorStop(.5, '#ffc94d'); grd.addColorStop(1, '#a8761b');
    g.fillStyle = grd; g.fill();
    g.strokeStyle = '#2a1b2e'; g.lineWidth = 1; g.stroke();
    g.beginPath(); g.moveTo(-r, 0); g.lineTo(r, 0); g.stroke();
    g.beginPath(); g.arc(0, 0, r * .34, 0, Math.PI * 2); g.fillStyle = '#2a1b2e'; g.fill();
    g.restore();
  };
  const ring = (x, y, r, a, col) => {
    g.save(); g.globalAlpha = a; g.strokeStyle = col; g.lineWidth = 1;
    g.beginPath(); g.arc(x, y, r, 0, Math.PI * 2); g.stroke(); g.restore();
  };
  // How many holds have happened, counting the one being drawn. Two things
  // need it, and both for the same reason.
  let holds = 0;
  if (o && phase) for (let i = 0; i <= o.i && i < o.beats.length; i++) {
    if (o.beats[i][0] === 'wobble') holds++;
  }

  // THE HUSH. Escalating the rock made the orb louder without making the moment
  // bigger: filmed, the wait is still two and a half seconds in which an 8px
  // object on a 256px canvas is the only thing that moves, and everything else
  // — the kin, the ground, the sky — carries on as if nothing were being
  // decided. So everything that is not the orb steps back, and steps back
  // further with each hold. It is not a fade to black; it is a frame closing
  // in, which is what the wait has been asking for.
  //
  // It arrives on the fall, so the world dims as the orb lands rather than
  // snapping dark, and it is gone by the click and the burst — those want the
  // whole screen back at full strength, and a resolution under a vignette
  // reads as a continuation rather than an answer.
  if (orbHush(phase)) {
    // Shot at the deepest hold, the first numbers put roughly half a black
    // frame over the player's own kin — which reads as the lights going out
    // rather than as a frame closing in, and the difference is whether you can
    // still see who is waiting. The lit core is wide enough to hold the ground
    // the orb is resting on, and the far corners stop well short of black.
    const close = phase === 'fall' ? k * .38 : Math.min(.86, .38 + holds * .19);
    const gr = g.createRadialGradient(rest.x, rest.y - 4, 22, rest.x, rest.y - 4, 152);
    gr.addColorStop(0, 'rgba(9,6,13,0)');
    gr.addColorStop(1, `rgba(9,6,13,${(close * .5).toFixed(3)})`);
    g.save(); g.fillStyle = gr; g.fillRect(0, 0, VIEW_W, VIEW_H); g.restore();
  }

  if (phase === 'throw' || (!phase && b.throwT > 0)) {
    const t = phase ? k : 1 - b.throwT / .6;
    const ox = 72 + (rest.x - 72) * t, oy = myGround - Math.sin(t * Math.PI) * 62 - t * 46;
    shell(ox, oy, 4, t * 9);
    return;
  }
  if (phase === 'suck') {
    // The creature is drawn small and fading by drawBattle; here the orb opens.
    shell(rest.x, rest.y - 26 * (1 - k), 4, 0);
    ring(rest.x, rest.y - 26 * (1 - k), 6 + k * 22, 1 - k, '#ffe9a8');
    return;
  }
  if (phase === 'fall') {
    const drop = k * k;                       // accelerate, then a small settle
    shell(rest.x, rest.y - 26 * (1 - drop), 4, 0);
    return;
  }
  if (phase === 'wobble' || phase === 'gap') {
    // The orb tips about the point it is resting on, rather than sliding along
    // the ground with a tilt applied on top. A ball settling pivots at its
    // contact — anchoring the rock there is both what it looks like and what
    // makes a small angle read as a big movement, because the top of the shell
    // travels while the base stays put.
    //
    // It was worth the change because this is the beat the whole throw is for
    // and it was the quietest thing on screen: the swing moved the orb 2.75px,
    // about a third of its own width, while the throw beside it arcs 106px and
    // the click ring opens to 44. An order of magnitude under its neighbours,
    // and the first film of it looked like a dot sitting still.
    // …and the shake knows WHICH shake it is. Filmed, the wait was seventeen
    // frames in which every wobble looked exactly like the last one, so the two
    // and a half seconds of dead air had nothing tightening inside it. The game
    // already counts the holds and already says so afterwards — "Three shakes.
    // You had it." — but the picture said the same thing three times. The
    // third rock is the one that nearly held, and now it looks like it.
    const amp = orbRock(holds);
    const w = phase === 'wobble' ? Math.sin(k * Math.PI * 2) * amp : 0;
    const R = 4;
    shell(rest.x + Math.sin(w) * R, rest.y + R - Math.cos(w) * R, R, w);
    // A tick of light on each swing, so the wobble reads as an effort, and a
    // scuff under it so the ground knows the orb is working against it. The
    // light escalates with the rock for the same reason it does.
    if (phase === 'wobble') {
      ring(rest.x, rest.y, 6 + k * (6 + holds * 3), (1 - k) * (.34 + holds * .12), '#ffc94d');
      g.save();
      g.globalAlpha = Math.abs(w) * .5;
      g.fillStyle = '#2a1b2e';
      if (g.ellipse) {
        g.beginPath();
        g.ellipse(rest.x + Math.sin(w) * R * .6, rest.y + 3, 5, 1.4, 0, 0, Math.PI * 2);
        g.fill();
      }
      g.restore();
    }
    return;
  }
  if (phase === 'click') {
    shell(rest.x, rest.y, 4, 0);
    for (let i = 0; i < 3; i++) {
      const t = clamp(k * 1.6 - i * .22, 0, 1);
      if (t > 0) ring(rest.x, rest.y, 4 + t * 40, 1 - t, '#ffe9a8');
    }
    // Sparks going up: the moment reads as a win before the text says so.
    for (let i = 0; i < 10; i++) {
      const a = (i / 10) * Math.PI * 2, t = clamp(k * 1.3 - (i % 3) * .1, 0, 1);
      if (t <= 0) continue;
      g.globalAlpha = 1 - t;
      g.fillStyle = i % 2 ? '#ffe9a8' : '#fff';
      g.fillRect(Math.round(rest.x + Math.cos(a) * t * 34), Math.round(rest.y - 4 - Math.sin(a) * t * 26 - t * 10), 2, 2);
      g.globalAlpha = 1;
    }
    return;
  }
  if (phase === 'burst') {
    // Two halves flung apart, and the light it failed to hold.
    const half = (dir) => {
      g.save(); g.translate(rest.x + dir * k * 16, rest.y - k * 12); g.rotate(dir * k * 2.4);
      g.fillStyle = '#c69320'; g.beginPath(); g.arc(0, 0, 4, Math.PI, Math.PI * 2); g.fill();
      g.strokeStyle = '#2a1b2e'; g.lineWidth = 1; g.stroke(); g.restore();
    };
    half(-1); half(1);
    ring(rest.x, rest.y, 4 + k * 26, 1 - k, '#8f7aa8');
  }
}
/* =============================================================== §7 — UI ==
   Canvas draws the world; every panel is DOM so text stays crisp. Menus are
   data (G.menu) rendered into a panel, driven by the same keys as the world.
   ======================================================================== */
const $ = (id) => HEADLESS ? null : document.getElementById(id);
const els = {};
function cacheEls() {
  if (HEADLESS) return;
  for (const id of ['view', 'dialogue', 'mainmenu', 'battlemenu', 'movemenu', 'screen', 'hudFoe', 'hudMine',
    'title', 'toast', 'titleArt', 'battlebar', 'hand', 'energy', 'piles', 'acts', 'intent']) els[id] = $(id);
  els.btnA = document.querySelector('#btns [data-k="z"]');
  els.btnB = document.querySelector('#btns [data-k="x"]');
}
const show = (el, on) => { if (el) el.classList.toggle('hidden', !on); };

// ---- dialogue ----------------------------------------------------------
function say(who, lines, done) {
  G.dialogue = { who, lines: Array.isArray(lines) ? lines : [lines], i: 0, done, hold: .12 };
  G.prevMode = G.mode === 'dialogue' ? G.prevMode : G.mode;
  G.mode = 'dialogue';
  renderDialogue();
}
function battleSay(lines, done) {
  G.battleMsg = { lines: Array.isArray(lines) ? lines : [lines], i: 0, done, hold: .12 };
  renderDialogue();
}
const liveBattleMsg = () => (G.battle ? G.battleMsg : null);

/**
 * The message the player is actually looking at. Drawing it and advancing it
 * MUST agree on which one that is: they used to disagree, and a battle message
 * left unread — "Go, Cindercub!" from a switch, the first-fight tutorial lines —
 * would still be sitting in `G.battleMsg` when the battle ended. The end-of-
 * battle text went up on screen through `G.dialogue`, every press was applied to
 * the invisible battle message instead, and that one's `hold` was only ever
 * ticked by `updateBattle`, which no longer runs once the mode is 'dialogue'.
 * Nothing on screen moved, no button did anything, and the run was over.
 */
const shownDialogue = () => G.dialogue || liveBattleMsg();

function renderDialogue() {
  if (HEADLESS) return;
  const d = shownDialogue();
  if (!d) { show(els.dialogue, false); return; }
  const line = d.lines[d.i] || '';
  els.dialogue.innerHTML = (d.who ? `<span class="who">${d.who}</span>` : '') +
    line + (d.i < d.lines.length - 1 ? '<span class="more">▼</span>' : '');
  els.dialogue.classList.toggle('narrow', !!G.battle);
  show(els.dialogue, true);
}
function advanceDialogue() {
  const d = shownDialogue();
  if (!d) return;
  if (d.hold > 0) return;
  const isBattleMsg = d !== G.dialogue;
  d.i++;
  if (d.i >= d.lines.length) {
    if (isBattleMsg) G.battleMsg = null;
    else { G.dialogue = null; G.mode = G.prevMode || 'world'; }
    show(els.dialogue, false);
    if (d.done) d.done();
    else renderDialogue();                 // whatever is behind it, if anything
  } else renderDialogue();
}

// ---- menus -------------------------------------------------------------
function openMenu(elId, rows, opt = {}) {
  G.menu = { elId, rows, i: opt.i || 0, cancel: opt.cancel, title: opt.title || '' };
  renderMenu();
}
function closeMenu() {
  if (G.menu && !HEADLESS) show(els[G.menu.elId], false);
  G.menu = null;
}
function renderMenu() {
  if (HEADLESS || !G.menu) return;
  const el = els[G.menu.elId];
  el.innerHTML = (G.menu.title ? `<div class="title">${G.menu.title}</div>` : '') +
    G.menu.rows.map((r, i) => `<div class="row ${i === G.menu.i ? 'sel' : ''} ${r.off ? 'off' : ''}" data-i="${i}">
      <span>${r.label}</span>${r.sub ? `<span class="sub">${r.sub}</span>` : ''}</div>`).join('');
  show(el, true);
}
function menuInput() {
  const m = G.menu;
  if (!m) return;
  if (justPressed('up')) { m.i = (m.i + m.rows.length - 1) % m.rows.length; renderMenu(); }
  if (justPressed('down')) { m.i = (m.i + 1) % m.rows.length; renderMenu(); }
  if (justPressed('a')) {
    const r = m.rows[m.i];
    if (r && !r.off && r.fn) r.fn();
  }
  if (justPressed('b')) { if (m.cancel) m.cancel(); else closeMenu(); }
}

/**
 * What you are actually doing here.
 *
 * The game handed you a kin, explained how a deck works, opened the door, and
 * then never said what any of it was for. The menu counted what you HAD — six
 * of six, thirteen of nineteen — and nothing anywhere said what it was FOR.
 * A player who put this down for a week came back to a map and a save file.
 *
 * The valley has a shape and `G.flags` already knows all of it, so this reads
 * the shape back out rather than storing a second copy of it: the first
 * trainer you have not beaten, in the order the routes run, and the shrine
 * after them. Written in the register the legendary already uses — concrete,
 * unsentimental, tells you where to go without instructing you.
 *
 * The fourth column is the npc's own `requires` flag, and a trainer whose gate
 * is shut is skipped rather than pointed at. That column is not decoration:
 * Wick's last fight sits in Crown Hollow behind `beatVespyr`, so a version of
 * this that read straight down the list sent you up the mountain to fight a
 * man who is not there yet, past the shrine that unlocks him. If you add a
 * gated trainer, put the gate here too — `emberkin_story` compares this column
 * against the map data and will fail if they drift.
 */
// [id, name, gate]. There used to be a fourth column saying WHERE each one
// stands — a third hand-written copy of a fact the map data already owns, and
// the net for it only asked that it "says something". It also produced "in
// Route One", which is not English; you are OUT ON a route. Both die together:
// the place is asked of the map the trainer is actually standing on.
const AIM_ORDER = [
  ['t_wick1', 'Wick', 'gotStarter'], ['t_pell', 'Forager Pell'],
  ['t_dorn', 'Hiker Dorn'], ['t_ivo', 'Bramble Kid Ivo'],
  ['t_wick2', 'Wick', 't_wick1'], ['t_coll', 'Ranger Coll'],
  ['t_mio', 'Tide-hand Mio'], ['t_hale', 'Warden Hale'],
  ['t_wick3', 'Wick', 'beatVespyr'],
];
/** Where a trainer actually stands, said the way the map says it. */
function aimPlace(id) {
  for (const map of Object.values(MAPS)) {
    if ((map.npcs || []).some((n) => n.id === id)) return map.at || `in ${map.name}`;
  }
  return 'somewhere out there';
}
function nextAim() {
  if (!G.flags.gotStarter) return 'Elder Rowan is waiting on you.';
  const next = AIM_ORDER.find(([id, , gate]) => !G.flags[id] && (!gate || G.flags[gate]));
  if (next) return `${next[1]} is still standing, ${aimPlace(next[0])}.`;
  if (!G.flags.beatVespyr) return 'Only the thing on the shrine is left, up in Crown Hollow.';
  const seen = dexCount(2);
  return seen < DEX_ORDER.length
    ? `Nobody left to beat. ${DEX_ORDER.length - seen} kin still unfound.`
    : 'Every trainer down, every kin found. The valley is yours.';
}

// ---- world main menu ---------------------------------------------------
function openMainMenu() {
  G.mode = 'menu';
  playCue('menu');
  openMenu('mainmenu', [
    { label: 'Kin', sub: partyTally(), fn: () => openScreen('party') },
    { label: 'Dex', sub: `${dexCount(2)}/${DEX_ORDER.length}`, fn: () => openScreen('dex') },
    { label: 'Bag', fn: () => openScreen('bag') },
    { label: 'Box', sub: '' + G.box.length, fn: () => openScreen('box') },
    { label: 'Deck', sub: `${G.deck.length}/${DECK_MAX}`, fn: () => openScreen('deck') },
    { label: 'Sound', sub: muted ? 'off' : 'on', fn: () => { toggleMute(); openMainMenu(); } },
    { label: 'Fullscreen', fn: () => { toggleFullscreen(); closeWorldMenu(); } },
    { label: 'Save', fn: () => { setToast(saveGame() ? 'Journey saved.' : 'Could not save.'); } },
    { label: 'Close', fn: closeWorldMenu },
  ], { cancel: closeWorldMenu, title: `${G.map.name} · ${G.money} shards · ${G.gems} gems<span class="aim">${nextAim()}</span>` });
}
function closeWorldMenu() { closeMenu(); G.mode = 'world'; }

// ---- NPCs --------------------------------------------------------------
// The rival always shows up with the starter that beats yours, and keeps it.
const RIVAL_PICK = { cindercub: 'dewdrip', dewdrip: 'sproutle', sproutle: 'cindercub' };

/** A trainer's team, resolved at challenge time so the rival can react to you. */
function trainerTeam(npc) {
  const pick = RIVAL_PICK[G.flags.starter] || 'dewdrip';
  // Level with you. He has the type advantage and that used to be enough on its
  // own — two levels on top made the first fight in the game unwinnable, and he
  // stands between the town and the only grass to grind in. He was dropped a
  // level when a kin went down to one swing a turn; now that a type advantage is
  // a tilt rather than a verdict, that compensation had him losing 98 times in a
  // hundred to a bot, so it comes back off. The opening fight has to be winnable
  // on what the game has just handed you, and it also has to be a fight.
  if (npc.dynamic === 'rival1') return [[pick, 5]];
  if (npc.dynamic === 'rival2') {
    const evo = DEX[pick].evo ? DEX[pick].evo[0] : pick;
    return [['kindlark', 15], [evo, 16]];
  }
  if (npc.dynamic === 'rival3') {
    // Three days up a mountain with the same kin: it is fully grown by now.
    let top = pick;
    while (DEX[top].evo) top = DEX[top].evo[0];
    return [['voltyx', 28], ['nocthorn', 29], [top, 31]];
  }
  return npc.trainer.team.map((e) => [e[0], e[1]]);
}

/**
 * What somebody says, asked rather than read.
 *
 * Every path that speaks an npc goes through here — the challenge, the
 * Wayhouse, both shops and the plain conversation — so a person who wants to
 * notice something can, wherever they stand, and nobody has to remember which
 * of the five call sites supports it.
 */
function talkLines(npc) {
  return typeof npc.lines === 'function' ? npc.lines() : npc.lines;
}

function talkTo(npc) {
  if (npc.script === 'rowan') { rowanScript(); return; }
  if (npc.trainer && !G.flags[npc.id]) {
    say(npc.name, talkLines(npc), () => {
      const team = trainerTeam(npc);
      const foe = mkMon(team[0][0], team[0][1]);
      startBattle({ foe, team, npc, wild: false });
    });
    return;
  }
  if (npc.heal) {
    // A whole party gets told so, and no light. The mend played every time you
    // walked past, on a party that had nothing wrong with it — the lines, the
    // light and "right as rain" for a heal that healed nothing. A beat that
    // fires when nothing happened is worth less the next time something does,
    // and this is the beat the Wayhouse exists for.
    const hurt = G.party.some((m) => m.hp < m.max || m.status
      || m.moves.some((mv) => mv.pp < mv.max));
    if (!hurt) {
      say(npc.name, ['They are all sound. Go on, then.'], () => { saveGame(); });
      return;
    }
    say(npc.name, talkLines(npc), () => {
      healParty();
      // The light happens between the offer and the reply, so the line that
      // says it worked arrives after you have watched it work.
      G.mend = { t: 0, go: () => say(npc.name, ['There. Right as rain.'], () => { saveGame(); }) };
    });
    return;
  }
  if (npc.shop) { say(npc.name, talkLines(npc), () => openScreen('shop')); return; }
  if (npc.chests) { say(npc.name, talkLines(npc), () => openScreen('chests')); return; }
  // `after` may be a function, for a trainer whose parting line stops being
  // true once you have done what it told you to.
  //
  // And so may `lines`, which is the same idea for everybody who is not a
  // trainer. It was a trainers-only privilege for no reason but that trainers
  // were where it was first needed: the four people in this valley who exist to
  // point at something — the grass, the Wayhouse, the road north, the thing in
  // the shallows — went on pointing at it for the whole game, to a player who
  // by the end had caught the grass, used the Wayhouse forty times, walked the
  // road and had the thing in the shallows in their party.
  const after = typeof npc.after === 'function' ? npc.after() : npc.after;
  say(npc.name, npc.trainer && G.flags[npc.id] ? (after || ['Good match. Go on.']) : talkLines(npc));
}

function healParty() {
  G.party.forEach((m) => { m.hp = m.max; m.status = ''; m.moves.forEach((mv) => { mv.pp = mv.max; }); });
  playCue('heal');
}

const STARTERS = ['cindercub', 'dewdrip', 'sproutle'];
function rowanScript() {
  const npc = G.map.npcs[0];
  if (!G.flags.gotStarter) {
    say('Elder Rowan', [
      'There you are. Late, but there.',
      'The valley is full of kin and I am full of years. One of us has to go out and look at them.',
      'Pick one. It will be yours and you will be its, and neither of you gets a say after that.',
    ], () => chooseStarter());
    return;
  }
  // The actual end of the game, which nobody used to mark. Wick's parting line
  // after his last fight is "Go and see Rowan. She has been pretending not to
  // wait" — and she then said the shrine speech, the one you already heard
  // before climbing the mountain, because her closing branch keyed on
  // `beatVespyr` and that flag is set by the fight BEFORE the final one. An npc
  // pointing you at a conversation that does not exist is worse than silence.
  //
  // Her register does not change for it. She told you at the shrine that there
  // is no ceremony at the end, so there is not one here either — the ending is
  // that somebody noticed, and the last line puts you back outside.
  if (G.flags.t_wick3) {
    const left = DEX_ORDER.length - dexCount(2);
    say('Elder Rowan', [
      'He came down before you did. Sat in that chair a while. Did not say much.',
      `That is all ${spell(AIM_ORDER.length)} of them, then, and the thing on the shrine.`,
      left === 0
        ? `And every one of the ${spell(DEX_ORDER.length)} written down in your own hand. I did not think anybody would.`
        : `${Spell(left)} still unwritten, mind. The valley keeps some back for people who keep looking.`,
      'I said there was no ceremony at the end of it. There is not. You are only somebody who has done it now.',
      'Go on. It is all still out there.',
    ], () => { G.flags.heardEnding = 1; saveGame(); });
    return;
  }
  if (G.flags.beatVespyr) {
    say('Elder Rowan', [
      'So it went with you.',
      `${Spell(DEX_ORDER.length)} kin in this valley and you have ${dexCount(2)} of them written down in your own hand.`,
      'That is the work. There is no ceremony at the end of it — just more valley.',
      'Go on. Take them out again.',
    ]);
    return;
  }
  // Her one piece of navigation was gated on `dexCount(2) >= 8`, which is a
  // PROXY for "far enough along" — and the game has the actual fact one flag
  // away. It was wrong in both directions at once. Somebody who had beaten the
  // Warden with a thin dex was never told the path had opened; somebody who had
  // already stood on the mountain was still being sent "past the Warden", who
  // is not on the map any more. That is the signpost fault of the four in town,
  // in the mouth of the one character the whole game says is paying attention.
  //
  // Most progressed first. Being up the mountain implies Hale stepped aside,
  // and both of those are facts rather than counts.
  if (G.been.crown_hollow) {
    say('Elder Rowan', [
      `Seen ${dexCount(1)}, caught ${dexCount(2)} — and you have stood on the mountain.`,
      'Then you have felt the air go thin up there. That is not weather.',
      'Take orbs when you go back. Take all of them.',
    ]);
    return;
  }
  if (G.flags.t_hale) {
    say('Elder Rowan', [
      'Hale stepped aside for you. He does not do that often.',
      'Crown Hollow is open, then. Something up there is worth the walk.',
    ]);
    return;
  }
  if (dexCount(2) >= 8) {
    say('Elder Rowan', [
      `${dexCount(2)} caught. You are doing better than I did.`,
      'Crown Hollow is up past the Emberwood, and Warden Hale will not let you by until he is satisfied.',
    ]);
    return;
  }
  say('Elder Rowan', [`Seen ${dexCount(1)}, caught ${dexCount(2)}. Keep at it.`, 'The grass does the teaching. I only do the paperwork.']);
}

function chooseStarter() {
  openScreen('starter', { done: () => saveGame() });
}

/** Taking one. Everything the old menu did, minus the menu. */
/**
 * Grant the starter. State only — no ceremony, the same way `addCaught` puts a
 * caught kin somewhere and `finishBattle` is what makes anything of it. The
 * choosing is what deserves the beat, so that lives in `screenSelect`, and
 * everything that just wants a party to exist (the shot scenes, the
 * playthrough probe) can call this and get on with it.
 */
function takeStarter(id) {
  const m = mkMon(id, 5);
  G.party.push(m);
  catchMon(id);
  G.flags.gotStarter = 1;
  G.flags.starter = id;
  G.bag.bloomorb = (G.bag.bloomorb || 0) + 5;
  G.bag.salve = (G.bag.salve || 0) + 3;
  return m;
}

// ---- battle UI ---------------------------------------------------------
function hpColor(f) { return f > .5 ? 'var(--hp-good)' : f > .22 ? 'var(--hp-warn)' : 'var(--hp-bad)'; }
function renderHUD() {
  if (HEADLESS) return;
  const b = B();
  // The hush reaches the panels too, and it has to: the orb rests at canvas
  // (178, 70), and measured against the DOM that is INSIDE the player's HUD
  // plate on a phone and two pixels above it on a desktop. Every bit of work
  // on this beat — the escalating rock, the frame closing in — was happening
  // behind a health bar on the layout most people will play on. A canvas
  // vignette cannot dim a DOM panel; only the panel can.
  //
  // They fade rather than vanish, because a fight you cannot see the state of
  // is a different kind of wrong, and they are back by the click.
  if (!HEADLESS) {
    const held = orbPhase();
    document.body.classList.toggle('hushing', orbHush(held));
  }
  if (!b) { show(els.hudFoe, false); show(els.hudMine, false); return; }
  const box = (m, disp, mine) => {
    const f = clamp(disp / m.max, 0, 1);
    return `<div class="nm"><span>${dispName(m)}${m.status ? statusChip(m.status) : ''}</span><span class="lv">Lv${m.lvl}</span></div>
      <div class="types">${typeChips(m.types)}</div>
      <div class="bar">${(() => {
        // Shield is health BEYOND your maximum, so the bar has to make room for
        // it rather than hide it. A band behind the fill was invisible at full
        // HP — which is exactly when a banked guard matters most — because the
        // fill is 100% wide and drawn over it. Scaling the track to max+shield
        // shows both, correctly proportioned, and the bar visibly gets longer
        // when you bank something, which is the reading you want.
        // Both sides. The foe banks a shield too — `brace` is worth 20 at scale
        // — and its bar was as silent about that as yours was about yours.
        //
        // Worse than an oversight: the line that put the shield on your bar
        // last pass read `mine ? b.shield : 0`, which is the mirror of the fix
        // written out by hand while writing the fix. The foe's brace is
        // announced once, on the turn it happens, and then you spend your next
        // turn choosing a card against a wall you cannot see.
        //
        // A tail on the bar and no number, because the foe's exact HP is
        // deliberately not shown and a shield figure would leak it.
        const sh = mine ? (b.shield || 0) : (b.foeShield || 0);
        const span = m.max + sh;
        return `<i style="width:${(disp / span) * 100}%;background:${hpColor(f)}"></i>`
          + (sh > 0 ? `<u style="left:${(disp / span) * 100}%;width:${(sh / span) * 100}%"></u>` : '');
      })()}</div>
      ${mine ? `<div class="bar xp"><i style="width:${(() => {
        // Draw the bar against the level the playback is currently ON, not the
        // level the creature has already reached — the two differ for exactly
        // as long as the fill is crossing a boundary, which is the whole beat.
        // Reading it against `m.lvl` is what made a level-up skip the fill.
        const dx = Number.isFinite(b.dispXp) ? b.dispXp : m.xp;
        const lv = b.barLv || m.lvl, fl = xpFor(lv);
        return clamp((dx - fl) / Math.max(1, xpFor(lv + 1) - fl), 0, 1) * 100;
      })()}%"></i></div>
      <div class="hpnum">${Math.round(disp)}/${m.max}${b.shield > 0 ? ` <span class="shd">+${b.shield}</span>` : ''}</div>` : ''}`;
  };
  els.hudFoe.innerHTML = box(b.foe, b.dispF, false);
  els.hudMine.innerHTML = box(b.mine, b.dispM, true);
  show(els.hudFoe, true); show(els.hudMine, true);
}

/* ---- the hand ---------------------------------------------------------- */
/** The two touch buttons say what they do right now, not "A" and "B". */
/** What the two buttons are called right now, for whatever they are driving. */
function btnLabels() {
  const m = G.mode;
  const reward = m === 'screen' && G.screen && G.screen.kind === 'reward';
  return reward ? ['Take', 'Skip']                   // nothing behind it to go back to
    // The title had no case here, so it fell through to the world's defaults
    // and the two round buttons on a phone read Talk and Menu — on a screen
    // with nobody to talk to and no menu. With a save there are two real
    // choices and each button takes one; without, both do the only thing there
    // is, the way a dialogue makes both buttons Next rather than leaving one
    // dead.
    : m === 'title' ? (hasSave() ? ['Continue', 'New'] : ['Start', 'Start'])
    : m === 'battle' ? ['Play', 'Menu']
    : m === 'dialogue' ? ['Next', 'Next']
    : (m === 'menu' || m === 'screen') ? ['Pick', 'Back']
    : ['Talk', 'Menu'];
}
/**
 * The names to write in the prose, which are not always the names of keys.
 *
 * Photographing the game as a phone for the first time — the shot tool could
 * not produce that layout until this pass, so nobody had ever seen it — showed
 * the box screen telling a player to press A, and "X — back" in the corner,
 * three inches above two large circles labelled Pick and Back. Neither key
 * exists on the device. The button labels were already computed here; the
 * screens simply wrote their own copy of the keyboard's names beside them.
 */
const isTouch = () => !HEADLESS && document.body.classList.contains('touch');
const pickName = () => (isTouch() ? btnLabels()[0] : 'A');
const backName = () => (isTouch() ? btnLabels()[1] : 'X');
function touchLabels() {
  if (HEADLESS || !els.btnA) return;
  const [a, b] = btnLabels();
  els.btnA.textContent = a;
  els.btnB.textContent = b;
}

function battleBar(on) {
  if (HEADLESS) return;
  show(els.battlebar, on);
  show(els.intent, on);
}

/* ---- the card face ------------------------------------------------------
   One component for the hand, the deck screen and the post-win offer, because
   a card the player learns to read in a fight should look the same everywhere
   they meet it. The frame is built out of five parts, in the order a card game
   teaches you to scan them:

     cost gem   top left, on the frame — the first thing you check
     art        a window with a glow behind it in the card's own colour
     name       a band across the middle, on a rule
     rules      the text, which is the only part that shrinks in a small hand
     rarity     the frame itself, plus a pip at the foot

   Kin move cards wear gold and carry their element instead of a rarity: they
   belong to the creature, not to the deck, and they should read that way from
   across the table.
   ---------------------------------------------------------------------- */
function cardHTML(c, opt = {}) {
  const kin = c.src === 'kin';
  const def = kin ? MOVES[c.id] : CARDS[c.id];
  const rarity = kin ? 'kin' : def.r;
  const owned = kin ? null : ownedCard(c.u);
  const inst = kin ? null : { id: c.id, plus: owned ? owned.plus : 0, bg: c.bg || 0 };
  const tint = kin ? (TYPES[def.type] || 'var(--gold)') : RARITY[rarity];
  const txt = kin ? moveCardText(c.id) : cardText(inst);
  const grown = owned && owned.plus ? `+${owned.plus}` : '';
  // A kin's move wears its element; a deck card wears its own glyph.
  const artId = kin ? `elem_${String(def.type).toLowerCase()}` : c.id;
  const art = hasArt('card', artId) ? `<canvas width="20" height="20" data-card="${artId}"></canvas>` : '';
  return `<div class="cardel r-${rarity} ${kin ? 'kin' : ''} ${opt.cls || ''}" ${opt.attr || ''}
      style="--tint:${tint}${opt.style ? ';' + opt.style : ''}">
    <div class="cframe"></div>
    <div class="ccost">${cardCost(c)}</div>
    ${opt.slot ? `<div class="cslot">${opt.slot}</div>` : ''}
    ${grown ? `<div class="cgrow">${grown}</div>` : ''}
    <div class="cart">${art || `<span class="cglyph">${(def.name || '?')[0]}</span>`}</div>
    <div class="cname">${cardName(c)}</div>
    <div class="ctext">${txt}</div>
    <div class="cfoot">
      ${opt.note ? `<div class="cnote">${opt.note}</div>` : ''}
      <div class="cpip">${kin ? def.type : rarity}</div>
    </div>
    ${opt.foot || ''}
  </div>`;
}

/**
 * The name field. A real <input> rather than a letter-picker: this game is
 * played on a phone as often as a keyboard, and the phone already has a very
 * good letter-picker in it. While it has focus the game's own key handling
 * stands down, or typing "e" would end your turn.
 */
const nickEl = () => (HEADLESS ? null : document.getElementById('nickin'));
const nickFocused = () => !HEADLESS && document.activeElement === nickEl();

function focusNick() {
  const el = nickEl();
  if (!el) return;
  el.focus();
  el.select();
}

/**
 * Take whatever is in the field. Blank, or its own name, means no nickname.
 *
 * The player types this, and `dispName()` — which is `nick || name` — lands in
 * `innerHTML` at fifty-five sites: kin rows, box cards, the stat block, the
 * battle HUD, toasts. A nickname of `A<B` therefore opened a `<b>` element in
 * the middle of a name, and the `</b>` that followed closed the wrong one, so
 * the rest of the screen went bold and the DOM was corrupt from that row down.
 * The nickname is SAVED, so it stayed corrupt for the rest of the run.
 *
 * Fixed at the boundary rather than at the fifty-five: angle brackets are the
 * only characters that can start an element, they are the last thing anybody
 * wants in a name, and one gate cannot drift out of step with itself the way
 * fifty-five escapes would. `&` is deliberately left alone — a bare ampersand
 * renders as itself, and stripping it would turn "Bo & Ed" into "Bo  Ed" for
 * no gain. (`<3` was already safe: `<` before a digit is not a tag start, so a
 * parser emits it as text. That is luck, not design, and it is not what this
 * relies on.)
 *
 * The trim runs twice on purpose: once before the slice and once after, because
 * cutting at twelve can land mid-space and "Ashling the " is not a name either.
 */
function commitNick(s) {
  const m = s && s.opt && s.opt.mon;
  if (!m) return '';
  const el = nickEl();
  const raw = el ? el.value : (m.nick || '');
  const name = String(raw).replace(/[<>]/g, '').replace(/\s+/g, ' ').trim().slice(0, 12).trim();
  m.nick = (!name || name === m.name) ? '' : name;
  return m.nick;
}

/** Fill in every card icon canvas under `root`. */
function paintCardArt(root) {
  if (HEADLESS || !root || !root.querySelectorAll) return;
  root.querySelectorAll('canvas[data-card]').forEach((c) => paintTo(c, 'card', c.dataset.card, 1, false));
}

/**
 * Where a card sits in the fan.
 *
 * A hand held in front of you is an arc, not a row: the cards overlap, they
 * splay from a point somewhere below your hand, and the outer ones sit lower
 * than the middle because they are further round the curve. That is the whole
 * trick — rotation and a drop that both scale with distance from the middle,
 * around a transform-origin under the card rather than through it.
 *
 * The one you are aiming at leaves the arc entirely: it comes upright, lifts
 * clear and grows, because the card you are about to play should be the one
 * card on screen that is not at an angle.
 *
 * Exported and pure, so the render suite can check the shape of the fan
 * without a browser.
 */
function fanStyle(i, n, selected) {
  // The chosen card pivots about its own base rather than the fan's, or scaling
  // it around a point below the hand throws it up over the dialogue line.
  // Lift more, swell less. At scale 1.09 the aimed card grew sideways into its
  // neighbour and hid the left half of that card's rules text — photographing a
  // real turn showed a hand where one of four cards could not be read. Height
  // is what marks the card you are aiming at; width only eats the ones you are
  // choosing between.
  if (selected) return 'transform-origin:50% 100%;transform:translateY(-9%) rotate(0deg) scale(1.045);z-index:20';
  if (n <= 1) return 'z-index:1';
  const off = i - (n - 1) / 2;                    // -2, -1, 0, 1, 2 for five
  const spread = n > 4 ? 5 : 6.5;                 // a fuller hand fans tighter
  const rot = off * spread;
  const drop = off * off * (n > 4 ? .9 : 1.2);    // the curve, not a straight tilt
  return `transform:translateY(${drop.toFixed(2)}%) rotate(${rot.toFixed(2)}deg);z-index:${i + 1}`;
}

/**
 * What the telegraphed swing actually LANDS, after guard and shield — the
 * numbers the chip prints beside the raw one. Lifted out of renderHand, which
 * returns early with no DOM, so both of these can be driven headlessly.
 *
 * A RANGE, because the swing rolls [.85, 1] and a single figure cannot be both
 * things the screen needs it to be. This returned the estimate at the middle of
 * that roll and the lethal alarm below was computed off it, which meant the
 * alarm answered "will this kill me on average" — a question nobody has ever
 * asked. Sat at one HP above what the chip said was coming, in the strongest
 * terms the screen has, the swing killed you 31% of the time and the alarm was
 * silent in every one of fifty measured matchups.
 */
function intentThrough(b, it) {
  if (!b || !it || it.kind !== 'attack') return null;
  const cut = (d) => Math.max(0, Math.max(d > 0 ? 1 : 0, d - (b.mods.def || 0)) - (b.shield || 0));
  return { lo: cut(it.dmg), hi: cut(it.hi != null ? it.hi : it.dmg) };
}
/**
 * …and whether that is more than the kin has left, which is the half of the
 * question the chip never finished. Read off the TOP of the range: a warning
 * exists for the turn that can go wrong, not the turn that usually does. Burn
 * ticking at the end of the turn is a second source and deliberately not
 * counted here, and neither is a crit — the chip warns about the swing it is
 * showing you.
 */
function intentLethal(b, it) {
  const through = intentThrough(b, it);
  if (!through || !b.mine || b.mine.hp <= 0) return false;
  return through.hi >= b.mine.hp;
}
/** One number when the roll cannot spread it, two when it can. */
const rangeText = (lo, hi) => (lo === hi ? `${lo}` : `${lo}-${hi}`);

/**
 * The foe's next move, as a chip. Its own function because it has to be
 * redrawn at a moment `renderHand` does not run: `renderHand` fires when the
 * playback ENDS, and the foe falls about a second and a half before that.
 */
/**
 * Whether the foe is standing on the field, able to take a turn. Two ways it
 * stops being so and both had to be found separately: it falls, or an orb takes
 * it. The second is not a variant of the first — the creature is alive and
 * about to be yours — and the chip promising its next swing read the same
 * either way.
 *
 * NOT the same question as `inOrb` in the draw, which asks "should I skip the
 * normal sprite draw" and deliberately excludes the suck, where the creature is
 * still drawn, shrinking. Two conditions that overlap are still two questions.
 */
const foeAfield = (b) => {
  if (!b || b.downF != null) return false;
  const p = orbPhase();
  return !(p && p !== 'throw');
};

/**
 * The chip's contents, as a value. A pure function because the DOM write is not
 * observable from a suite — `renderIntent` returns early when headless and the
 * stub hands back a fresh element each call — so a net written against the
 * panel could not tell whether the chip was gated on anything at all. Breaking
 * the gate on purpose changed nothing and no test failed, which is the same
 * shape as a check that has never said anything.
 */
function intentLine(b) {
  // A chip that says what the foe will do next is a promise about a NEXT TURN.
  // Filmed, the foe fell and faded and this line went on reading
  // "Foe: Mist Spray · hits 9" for the whole of the next two seconds —
  // measured, from the faint at 1.97s until the flourish hid the panels at
  // 3.52s. There is no next turn and there is no foe.
  //
  // Gated on the PICTURE rather than on `foe.hp` or `b.over`, which are the
  // STATE. The outcome is settled the instant the card
  // resolves, about two seconds before the creature is seen to fall; clearing
  // the chip then would take the foe's intent off the screen while it is still
  // standing there, mid-exchange. Same reason the bar follows `dispF`.
  const it = foeAfield(b) ? b.intent : null;
  // What actually reaches you, not what the foe swings.
  //
  // `readIntent` takes its number straight from `damageOf`, which knows nothing
  // about guard or shield — but `hurtMine` subtracts `mods.def` and then the
  // shield absorbs the rest. So the line said "about 28" while a banked 18
  // shield and 3 guard meant 7 was going to land, and the whole reason that
  // line exists is to answer "can I take this, or do I need to block?"
  //
  // The raw number stays: it is what the foe is swinging, and it is what a
  // pierce will bypass your shield with. The number that lands is added beside
  // it, and only when you are actually holding something — otherwise they are
  // the same figure printed twice. Rendered here rather than in readIntent
  // because shield changes as you play cards, and the answer has to change
  // with it.
  const through = intentThrough(b, it);
  const banked = (b.mods.def || 0) + (b.shield || 0) > 0;
  // And the other half of the question the comment above says this line exists
  // to answer. "How much lands" has no meaning without "how much is left", and
  // the chip had every number it needed: at 9 HP against about 30 it read
  // exactly as it does at full health, in the same colour, while the screen
  // printed 9/63 on the other side of the arena for the player to hold in their
  // head. It already does the shield subtraction; this is the one that decides
  // whether the turn is a choice or a mistake.
  //
  // It said "about N" and meant the middle of the roll, which made the alarm
  // below fire on the average turn instead of the bad one. Both ends are on the
  // line now, so the word "about" is not doing work a number can do, and the
  // figure the alarm is reading is the figure the player can see. It still does
  // not count a burn ticking at the end of the turn; that is a second source
  // and this line is about the swing.
  const lethal = intentLethal(b, it);
  const html = it
    ? `Foe: <b>${it.name}</b>${it.kind === 'attack'
        ? ` · hits ${rangeText(it.dmg, it.hi != null ? it.hi : it.dmg)}${banked ? ` · <b style="color:${through.hi > 0 ? 'var(--hp-warn)' : 'var(--hp-good)'}">${rangeText(through.lo, through.hi)} through</b>` : ''}`
          + (lethal ? ' · <b>enough to finish you</b>' : '')
        : it.tell ? ` · ${it.tell}` : ''}`
    : '';
  return { html, lethal };
}

function renderIntent(b) {
  if (HEADLESS) return;
  const { html, lethal } = intentLine(b);
  els.intent.classList.toggle('lethal', lethal);
  els.intent.innerHTML = html;
}

function renderHand() {
  if (HEADLESS) return;
  const b = B();
  if (!b) { battleBar(false); return; }
  const playable = b.phase === 'player' && !b.over && !b.log;
  // Energy is a row of gems that go out as you spend them. "2/3" is a number
  // you have to read; three gems with one dark is a thing you can see.
  const cap = BASE_ENERGY + (b.powers.energy || 0);
  els.energy.innerHTML = Array.from({ length: cap }, (_, i) =>
    `<span class="gem ${i < b.energy ? '' : 'spent'}"></span>`).join('')
    + `<span class="ecount">${b.energy}</span>`;
  // The piles are stacks of cards, so they are drawn as stacks of cards.
  const pile = (cls, n, label) =>
    `<span class="pile ${cls} ${n ? '' : 'empty'}" title="${label}"><span class="stk"><i></i><i></i><i></i></span><b>${n}</b></span>`;
  els.piles.innerHTML = pile('draw', b.draw.length, 'draw pile')
    + pile('disc', b.disc.length, 'used')
    + (b.exh.length ? pile('exh', b.exh.length, 'spent') : '')
    + (b.shield ? `<span id="shieldpip" class="shieldpip">${b.shield}</span>` : '');
  els.hand.innerHTML = b.hand.map((c, i) => cardHTML(c, {
    cls: `${i === b.sel ? 'sel' : ''} ${playableNow(b, c) && playable ? '' : 'dead'}`,
    attr: `data-c="${i}"`, slot: i + 1,
    style: fanStyle(i, b.hand.length, i === b.sel),
    foot: i === b.sel && playableNow(b, c) && playable ? '<div class="cp">▲ play</div>' : '',
  })).join('');
  paintCardArt(els.hand);
  // When there is nothing left you can play, the End turn button says so.
  const canPlay = b.hand.some((c) => playableNow(b, c)) && playable;
  els.acts.innerHTML = [
    ['end', `End turn <span class="key">E</span>`, !canPlay && playable],
    ['kin', 'Kin', false], ['bag', 'Bag', false],
    [b.wild ? 'run' : 'forfeit', b.wild ? 'Run' : 'Forfeit', false],
  ].map(([a, label, nag]) => `<div class="abtn ${nag ? 'nag' : ''}" data-a="${a}">${label}</div>`).join('');
  renderIntent(b);
  // The hand is too small to hold a card's whole rules text, so the line above
  // it spells out whichever card you are aiming at whenever it is otherwise idle.
  const aimed = b.hand[b.sel];
  if (aimed && playable && !(b.lineT > 0) && !b.log) {
    const kin = aimed.src === 'kin';
    const own = kin ? null : ownedCard(aimed.u);
    const full = kin ? moveCardText(aimed.id)
      : cardText({ id: aimed.id, plus: own ? own.plus : 0, bg: aimed.bg || 0 });
    els.dialogue.innerHTML = `<b style="color:${kin ? 'var(--gold)' : RARITY[CARDS[aimed.id].r]}">${cardName(aimed)}</b> — ${full}`;
    els.dialogue.classList.add('narrow');
    show(els.dialogue, true);
  }
  battleBar(true);
}

/** Kin move cards show what the move does, in the same voice as the deck. */
function moveCardText(id) {
  const m = MOVES[id];
  const bits = [];
  if (m.pow) {
    const d = moveDamage(id);
    bits.push(d ? `${m.type} · deal ${d.lo === d.hi ? d.lo : `${d.lo}-${d.hi}`}${d.hits > 1 ? ` ×${d.hits}` : ''}`
                : `${m.type} · power ${m.pow}`);
  } else bits.push(`${m.type} · status`);
  const fx = m.fx || {};
  if (fx.st) bits.push(`may ${fx.st[0]}`);
  if (fx.heal) bits.push('heals');
  if (fx.drain) bits.push('drains');
  if (fx.recoil) bits.push('costs you HP');
  if (fx.self) bits.push('buffs you');
  if (fx.foe) bits.push('weakens them');
  if (fx.pri) bits.push('strikes first');
  return bits.join(', ');
}

/**
 * What this move will actually take off the foe in front of you, right now,
 * with everything the deck has stacked onto it. Power is an internal number
 * nobody can act on — 45 means one thing at level 5 and another at level 50,
 * and nothing at all against something that resists it. The range is the
 * damage roll; a type-immune matchup reads 0 rather than pretending.
 */
function moveDamage(id) {
  const b = B();
  const m = MOVES[id];
  if (!b || !m || !m.pow) return null;
  const bonus = attackBonus();
  const swing = (roll) => {
    const { dmg, eff } = damageOf(b.mine, b.foe, id, { crit: false, roll });
    return eff === 0 ? 0 : Math.max(1, Math.floor((dmg + bonus.flat) * bonus.mul));
  };
  return { lo: swing(.85), hi: swing(1), hits: bonus.hits };
}

/**
 * The same number for the party screen, where there is nobody to hit yet.
 * Measured against something of its own level and guard that neither resists
 * the element nor is weak to it, so the figure is comparable between moves —
 * a mirror of the kin itself would resist its own element and make every move
 * read as feeble. In a fight the card shows the real number against the real
 * foe; this is the yardstick for choosing between moves out of one.
 */
/**
 * The same reading against whoever is actually out there, or null out of a
 * fight. Returns `eff` too, because "how much" and "how well" are one answer.
 *
 * A range, in the same shape and by the same call as the card in hand. This
 * showed one number at roll 1 behind a `~`: "about 8" for a move that deals
 * 7 or 8 and never once 9. A tilde promises the middle and this was the
 * ceiling — the one figure on the screen it could not have been.
 */
const EFF_MARK = {
  '2': { tag: 'STRONG', cls: 'eff-good' },
  '0.5': { tag: 'RESISTED', cls: 'eff-bad' },
  '0': { tag: 'NOTHING', cls: 'eff-none' },
};
function moveVersusFoe(mon, id) {
  const b = B();
  const mv = MOVES[id];
  if (!b || !b.foe || !mv || !mv.pow) return null;
  const eff = damageOf(mon, b.foe, id, { crit: false, roll: 1 }).eff;
  // …and the banked bonus, which the swing applies and this did not.
  //
  // The same fault as the telegraph's, in a function written two passes after
  // it and by the same hand: `moveDamage` has always folded attackBonus() in,
  // this did not, and with an edge banked the switch screen understated what a
  // replacement would hit for by up to a quarter. attackBonus reads only
  // `b.mods` and `G.might` — nothing about which kin is holding it — so it
  // belongs to whoever swings, including somebody still on the bench.
  const bonus = attackBonus();
  const swing = (roll) => {
    const { dmg } = damageOf(mon, b.foe, id, { crit: false, roll });
    return eff === 0 ? 0 : Math.max(1, Math.floor((dmg + bonus.flat) * bonus.mul));
  };
  return { lo: swing(.85), hi: swing(1), eff };
}

/** The same range, foe-agnostic, for the town menu. */
function moveDamageNeutral(mon, id) {
  const m = MOVES[id];
  if (!m || !m.pow) return null;
  const dummy = { types: [], def: mon.def, stages: { atk: 0, def: 0, spd: 0 }, status: '', lvl: mon.lvl };
  const swing = (roll) => damageOf(mon, dummy, id, { crit: false, roll }).dmg;
  return { lo: swing(.85), hi: swing(1) };
}

/**
 * Show what just happened.
 *
 * A card you played resolves under your own hand, so it lands instantly: the
 * effects fire, the bars start moving, one line of text explains it, and you
 * keep your turn. Anything you are on the receiving end of — the foe's swing,
 * a faint, a level-up — plays back a line at a time, because that is the part
 * worth watching.
 */
function submitLog(log, opts = {}) {
  const b = B();
  b.armed = null;                       // a new hand is never pre-aimed
  if (opts.instant && log && log.length && !b.over) {
    for (const e of log) {
      entryFx(b, e);
      if (e.fx === 'grow' || e.fx === 'buff') playCue('level');
      else if (e.fx === 'heal' || e.fx === 'block') playCue('heal');
    }
    const last = log[log.length - 1];
    b.log = null; b.li = 0; b.started = false;
    battleLine(last.t);
    renderHand();
    return;
  }
  b.log = log && log.length ? log : null;
  b.li = 0; b.started = false; b.hold = 0;
  renderHand();
}

/**
 * How long a damage number lives, and how far it drifts while it does.
 */
const POP_LIFE = .85;
/** The pull back before a swing, and the shove the one on the end of it takes. */
const WIND_UP = .42, RECOIL = .30, CRIT_BURST = .40;
// How long an impact holds. Short: this is punctuation, not an animation.
const BURST_T = .26;
/**
 * What each element does when it lands.
 *
 *   n      how many pieces fly
 *   spread how wide the fan is, in turns — 1 is the whole circle
 *   up     how far the fan is biased upward, so fire goes up and stone does not
 *   len    how far a piece travels, against the burst radius
 *   wide   fat shards (stone, verdant) against thin ones (spark, tide)
 *   ring   whether a shockwave ring goes with it
 */
const ELEM_BURST = {
  Ember:   { n: 7, spread: .34, up: .78, len: 1.25, wide: 1.5, ring: false },
  Tide:    { n: 9, spread: 1,   up: .30, len: .95,  wide: 1,   ring: true },
  Verdant: { n: 6, spread: .70, up: .45, len: .90,  wide: 2.4, ring: false },
  Spark:   { n: 8, spread: 1,   up: .20, len: 1.45, wide: .7,  ring: true },
  Gloom:   { n: 5, spread: .55, up: -.35, len: .85, wide: 2,   ring: false },
  Stone:   { n: 5, spread: .48, up: -.25, len: .75, wide: 3,   ring: false },
  Aether:  { n: 10, spread: 1,  up: .35, len: 1.1,  wide: .9,  ring: true },
  Wild:    { n: 6, spread: .8,  up: .35, len: 1,    wide: 1.4, ring: false },
};
/** How long a beaten kin takes to go down. */
const KO_FALL = .55;

/** A number leaving whoever the HP came out of. */
function pushPop(b, side, n, kind) {
  if (!n) return;
  // Two numbers in the same instant must not print on top of each other, so
  // each one steps a little further out from the middle than the last.
  b.pops.push({ side, n, kind, t: 0, dx: ((b.pops.length % 3) - 1) * 7 });
  while (b.pops.length > 8) b.pops.shift();
}

/**
 * Everything one log entry does to the picture.
 *
 * The bars are the slow truth — they slide, and they are still sliding when the
 * next line comes. The fast truth is a number popping off the target and the
 * attacker leaning into the swing, and a fight reads as a fight only when it
 * has both. The HP that moved is measured against the snapshot the picture is
 * currently heading for, which is what makes this work identically whether the
 * turn is being played back line by line or resolved instantly under your hand.
 */
function entryFx(b, e) {
  const dM = b.tgtM - e.hpM, dF = b.tgtF - e.hpF;
  if (dM) pushPop(b, 'mine', Math.abs(dM), dM > 0 ? 'dmg' : 'heal');
  if (dF) pushPop(b, 'foe', Math.abs(dF), dF > 0 ? 'dmg' : 'heal');
  b.tgtM = e.hpM; b.tgtF = e.hpF;
  // XP rides the same snapshots as HP, for the same reason. Chasing the live
  // `mine.xp` instead looked equivalent and was not: the turn resolves in full
  // before any of it is played back, so a live target starts the bar climbing
  // the moment the foe drops — under the "is down!" line, a beat before the one
  // that says EXP was gained. And it swept between two unrelated totals when
  // you switched kin, because the outgoing creature's number was where the bar
  // happened to be standing.
  //
  // `lvM` is snapped too, which is what makes the level-up wrap fall out for
  // free: the EXP line carries the OLD level with the new total, so the bar
  // fills past the boundary and clamps to full, and the "grew to level" line
  // that follows carries the new level, so it wraps to the start of it.
  if (e.xpM !== undefined) {
    // A different kin is out: hand the bar over rather than gliding to it.
    if (e.miM !== undefined && e.miM !== b.barSlot) b.dispXp = e.xpM;
    b.tgtXp = e.xpM;
  }
  if (e.lvM !== undefined) b.barLv = e.lvM;
  if (e.miM !== undefined) b.barSlot = e.miM;
  // A swing is announced a line before it lands. That gap is the wind-up: the
  // one about to throw it pulls back, so the lunge that follows is a release
  // rather than a twitch.
  if (e.fx === 'use') {
    if (e.side === 'mine') b.windM = WIND_UP; else b.windF = WIND_UP;
  }
  // A knockout used to be an alpha change on the next frame. It falls now.
  if (e.fx === 'faint') {
    if (e.side === 'mine' || (e.side !== 'foe' && e.hpM <= 0)) b.downM = 0;
    else b.downF = 0;
    // The chip that promises the foe's next move has to go when the foe does.
    // It lives in `renderHand`, which runs when the PLAYBACK ends — about a
    // second and a half after this — so without a refresh here the screen goes
    // on offering "Foe: Mist Spray · hits 9" over a creature lying on its side,
    // right up until the flourish covers the panels. Redrawing the chip alone
    // rather than the whole hand: rebuilding the row mid-playback would reset
    // the cards' transitions under a beat that is still running.
    renderIntent(b);
  }
  // Levelling had a cue and nothing to look at. It is the most repeated good
  // thing in the game — every fight you win ends with one — and it was the last
  // entry on the beat inventory with nothing on the canvas at all.
  if (e.fx === 'level') {
    b.lvT = LVL_T;
    // The good news takes the sprite from the bad news.
    //
    // A level lands moments after the exchange that won the fight, so the kin
    // is very often still carrying the white flash and the shove of whatever
    // hit it last. Filmed, that frame holds the level ring and the hit flash on
    // the same body and the two are genuinely indistinguishable — the first
    // time two beats in this game have been seen running at once, because every
    // one of them was designed and photographed alone.
    //
    // Clearing the flash rather than quietening the ring is the right way round:
    // the hit has already been read (its number is on screen), and what has not
    // been read yet is that you levelled.
    // `windM` belongs in this list on exactly the grounds the burst below was
    // added on: `mx` is `72 - … - shake - wind(windM) + lunge − recoil`, so the
    // wind-up displaces the very sprite the ring is drawn around, in the same
    // units as the two beside it. Swept for and measured rather than assumed —
    // driven through two shapes of levelling fight it is 0 at the frame the
    // level lands, because a 'use' entry clears it when the swing fires. Latent,
    // like the burst, and in the list for the same reason: three of the four
    // ways this sprite can be shoved were named and one was not.
    b.flashM = 0; b.lungeM = 0; b.recoilM = 0; b.windM = 0;
    // And the bursts on your side. Both of them, which took a net to find:
    // there are TWO fields, `b.burst` (every landed hit, drawn by drawBurst)
    // and `b.crit` (the crit ring, drawn by drawCrit at cx 72 — exactly where
    // the level ring goes). The comment that used to sit here said the crit
    // burst had been added to this list, and the line under it cleared
    // `b.burst`. **The fix named the wrong field**, so the one thing it was
    // written to clear was the one thing it never cleared — and it said
    // otherwise in prose, which is worse than saying nothing.
    //
    // Found by netting the CLAIM (nothing is still running under the level)
    // instead of the line, and by shoving the sprite every way it can be shoved
    // right up to the moment the level lands. A net that checks a battle where
    // these were all zero anyway cannot fail.
    //
    // Stated as defence, not as a symptom: BURST_T is 0.26s and a level lands
    // after the win lines, so they very probably never overlap in play. What is
    // certain is that they are drawn in the same place.
    if (b.burst && b.burst.side === 'mine') b.burst = null;
    if (b.crit && b.crit.side === 'mine') b.crit = null;
  }
  if (e.fx === 'hit') {
    if (e.side === 'mine') b.flashM = .8; else b.flashF = .8;
    b.shake = e.crit ? 1.8 : 1;
    // Every landed hit gets a burst in the colour and the shape of whatever
    // landed it. Before this only a crit had a moment, and a crit is one swing
    // in sixteen — so fifteen hits in sixteen were a white flash and a shudder,
    // which is the same feedback a miss gets with the numbers turned up.
    b.burst = { t: 0, side: e.side, el: e.el || null, crit: !!e.crit };
    // Only a swing lunges. Burn, roots and recoil are also 'hit', and nobody
    // threw those, so nothing leans in for them.
    if (e.atk === 'mine') { b.lungeM = .26; b.windM = 0; }
    else if (e.atk === 'foe') { b.lungeF = .26; b.windF = 0; }
    // Whoever took it gets knocked back, whether or not anybody threw it.
    if (e.side === 'mine') b.recoilM = RECOIL; else b.recoilF = RECOIL;
    if (e.crit) {
      b.crit = { side: e.side, t: 0 };
      const last = b.pops[b.pops.length - 1];
      if (last && last.side === e.side) last.kind = 'crit';
    }
    playCue(hitCue(e));
  }
}

/** Damage and healing floating off the two stands. */
function drawPops(g, myGround, foeGround) {
  const b = B();
  if (!b.pops || !b.pops.length) return;
  g.save();
  g.textAlign = 'center';
  for (const p of b.pops) {
    const k = clamp(p.t / POP_LIFE, 0, 1);
    // Out fast, then coast — a number that rises at a constant speed reads as a
    // balloon, one that decelerates reads as impact.
    const rise = (1 - (1 - k) * (1 - k)) * 20;
    const x = Math.round((p.side === 'mine' ? 72 : 178) + p.dx);
    const y = Math.round((p.side === 'mine' ? myGround - 44 : foeGround - 34) - rise);
    g.globalAlpha = k < .7 ? 1 : (1 - k) / .3;
    // A crit is the biggest number of the fight; it should not arrive in the
    // same typeface as chip damage. It comes in oversized and settles.
    const crit = p.kind === 'crit';
    const size = (p.n >= 20 ? 13 : 11) + (crit ? 5 + Math.round((1 - Math.min(1, k * 5)) * 4) : 0);
    g.font = `bold ${size}px monospace`;
    const text = (p.kind === 'heal' ? '+' : '') + p.n + (crit ? '!' : '');
    g.fillStyle = '#2a1b2e';
    g.fillText(text, x + 1, y + 1);
    g.fillStyle = crit ? '#fff4dc'
      : p.kind === 'heal' ? '#8ce88c'
      : p.side === 'mine' ? '#ff8a7a' : '#ffc94d';
    g.fillText(text, x, y);
  }
  g.restore();
  g.globalAlpha = 1;
  g.textAlign = 'left';
}

/** One line of battle text that fades on its own. */
function battleLine(text) {
  const b = B();
  b.lineT = 1.6;
  if (HEADLESS) return;
  els.dialogue.innerHTML = text;
  els.dialogue.classList.add('narrow');
  show(els.dialogue, true);
}

function playSelected() {
  const b = B();
  if (b.phase !== 'player' || b.over || b.log) return;
  const i = clamp(b.sel || 0, 0, Math.max(0, b.hand.length - 1));
  const card = b.hand[i];
  if (!card) return;
  if (cardCost(card) > b.energy) { setToast('Not enough energy.'); return; }
  playCue('select');
  const log = playCard(i);
  b.sel = clamp(i, 0, Math.max(0, b.hand.length - 1));
  aimPlayable(b);
  submitLog(log, { instant: true });
}

function doEndTurn() {
  const b = B();
  if (b.phase !== 'player' || b.over || b.log) return;
  submitLog(endTurn());
}

function openActionMenu(kind) {
  const b = B();
  if (kind === 'kin') { openScreen('party'); return; }
  if (kind === 'bag') { openScreen('bag'); return; }
  submitLog(doAction({ kind: 'run' }));
}

function playbackStep() {
  const b = B();
  const e = b.log[b.li];
  if (!e) return;
  entryFx(b, e);
  if (e.fx === 'faint') playCue(faintCue(e));
  if (e.fx === 'level' || e.fx === 'learn') playCue('level');
  if (e.fx === 'dex') playCue('dex');
  if (e.fx === 'caught') playCue('catch');
  if (e.fx === 'throw') {
    playCue('throw');
    // The throw starts when its own line is the one on screen, so the player
    // reads "you lob a Bloom Orb" and then watches it happen, not the reverse.
    if (b.orbPlan) { b.orb = { ...b.orbPlan, i: 0, t: 0, done: false }; b.orbPlan = null; }
    else b.throwT = .6;
  }
  if (e.fx === 'send') b.entry = 0;
  if (!HEADLESS) {
    els.dialogue.innerHTML = e.t + '<span class="more">▼</span>';
    els.dialogue.classList.add('narrow');
    show(els.dialogue, true);
  }
  b.hold = e.fx === 'hit' || e.fx === 'faint' ? .55 : .38;
}

function finishBattle() {
  const b = B();
  const over = b.over;
  if (over === 'switch') {
    say('', [`${dispName(b.mine)} is done. Send out who?`], () => openScreen('party', { force: true }));
    return;
  }
  // Take the battle off the board. Split from `done` because the card offer is
  // a screen, and a screen cannot open while a battle is still on top of it.
  const teardown = () => {
    clearMods(b);
    G.battle = null; G.battleMsg = null;
    if (!HEADLESS) { show(els.hudFoe, false); show(els.hudMine, false); show(els.dialogue, false); battleBar(false); }
    G.mode = 'world';
    // The place you are standing in, not the valley's default: every fight used
    // to hand you back the town's tune wherever you were.
    playCue(placeTrack(G.mapId));
  };
  const settle = () => {
    const evo = checkEvolve();
    if (evo) { runEvolution(evo); return; }
    saveGame();
  };
  const done = () => { teardown(); settle(); };
  /** Every win grows the deck by one card of your choosing — or by none. */
  const withReward = () => {
    const offer = rollReward(b);
    teardown();
    openScreen('reward', { offer, done: settle });
  };
  if (over === 'win') {
    const gems = gemReward(b);
    G.gems += gems;
    G.wins++;
    if (!b.npc) {
      // Knocking the legendary down instead of catching it is the quietest of
      // the three ways to lose it — a wild win says nothing at all — and it is
      // the one most likely to read as "that was my only chance". The code has
      // always kept the hunt open (`beatVespyr` stays unset); nothing ever said
      // so. A player who believes it is gone stops going back to the shrine,
      // and no picture can tell them otherwise. This is the sentence's job.
      if (b.legendary) { winFlourish(gems, () => say('', ['It comes apart into light and goes out.', 'Not gone. It will gather on the shrine again — bring more orbs.'], withReward)); return; }
      winFlourish(gems, withReward); return;
    }
    const lines = [`You pocket ${gems} rare gems.`];
    lines.push(...(b.npc.trainer.lose || []));
    G.flags[b.npc.id] = 1;
    G.money += b.npc.trainer.prize;
    lines.push(`You collected ${countOf(b.npc.trainer.prize, 'shard')}.`);
    // The flag two lines up is what moves him; this only says so. Setting a
    // `gone` field here as well would be a second copy of the same fact living
    // on shared map data, which is the bug npcActive documents.
    if (b.npc.block) lines.push(`${b.npc.name} steps off the path.`);
    winFlourish(gems, () => say('', lines, withReward));
  } else if (over === 'caught') {
    const caught = b.foe;
    // Asked before `addCaught` writes it down, because after that the book
    // cannot tell you whether this was the first of its kind or your fourth.
    const written = (G.dex[caught.species] || 0) < 2;
    const where = addCaught(caught);
    if (b.legendary) G.flags.beatVespyr = 1;
    const gems = gemReward(b);
    G.gems += gems;
    teardown();
    // The celebration runs on its own clock, then hands you the new kin's
    // papers — the one screen where the name is still yours to choose.
    G.gotcha = {
      t: 0, species: caught.species, name: caught.name,
      where: where === 'party' ? 'joined your party' : 'was sent to the box',
      note: written ? dexTally() : '',
      done: () => {
        G.gotcha = null;
        openScreen('profile', {
          mon: caught, fresh: true, legendary: !!b.legendary,
          done: () => { setToast(`+${countOf(gems, 'gem')}`); settle(); },
        });
      },
    };
    playCue('gotcha');
  } else if (over === 'fled') {
    // Running from the legendary does not end the hunt either, and a player who
    // does not know that will not go back.
    say('', b.legendary
      ? ['You got away.', 'The light closes behind you. It will be up here again.']
      : ['You got away.'], done);
  } else if (over === 'lose') {
    say('', ['Everything you have is down.', 'You carry them back to the Wayhouse on instinct.'], () => {
      // The dark closes over the arena first, and the room comes up out of it.
      playCue('blackout');
      G.blackout = { t: 0, go: () => {
      const lost = Math.floor(G.money * .25);
      G.money -= lost;
      healParty();
      clearMods(b);
      G.battle = null; G.battleMsg = null;
      if (!HEADLESS) { show(els.hudFoe, false); show(els.hudMine, false); battleBar(false); }
      enterMap('wayhouse', 5, 5, 'down');
      G.mode = 'world';
      G.fade = .5;                   // …and the Wayhouse opens out of it
      playCue('world');
      // …and when there was nothing to take, she says so.
      //
      // The fee is a quarter of your shards, floored — so anybody holding fewer
      // than four was told "It cost you 0 shards" in the one line the game
      // writes to soften a loss. That is the player most likely to be broke:
      // they have just lost everything. A number that is always zero reads as a
      // bug, and it turned the only mercy in the beat into a clerical error.
      // She does not explain herself anywhere else either.
      const after = [lost > 0
        ? `Sable patched them up. It cost you ${countOf(lost, 'shard')}.`
        : 'Sable patched them up. She did not ask for anything, and did not say why.',
        'Go easier out there.'];
      // Say it out loud, so nobody stands in front of a trainer wondering
      // whether the game has stopped letting them through.
      if (b.npc) after.push(`${b.npc.name} will not stop you again. Go and ask for the rematch when you want it.`);
      if (b.legendary) after.push('And the thing on the shrine is still up there. It always is.');
      say('Sable', after, () => saveGame());
      } };
    });
  } else {
    done();
  }
}

/**
 * Evolution, beat by beat.
 *
 * It used to be two dialogue boxes with a spinning wheel behind them, which
 * means the whole thing advanced at the speed you mashed A — and the one moment
 * in the genre that is supposed to make you stop and watch was over before you
 * had read the first line. It runs on its own clock now, like the catch does:
 *
 *   hold · build · burst · settle · quiet
 *
 * The shape changes at the top of `burst`, under a white-out, so you never see
 * the swap — you see what it was, then light, then what it is. `quiet` is the
 * beat that does the most work and draws nothing at all: a second of the new
 * creature standing there before anybody says its name.
 */
const EVO = { hold: .9, build: 1.5, burst: .45, settle: 1.0, quiet: .6 };
const evoBeats = () => [['hold', EVO.hold], ['build', EVO.build],
  ['burst', EVO.burst], ['settle', EVO.settle], ['quiet', EVO.quiet]];

/**
 * How hot the light is, 0 to 1, across the whole beat. Named because the wheel,
 * the motes and the blow-out all ramp off it and three copies would drift.
 */
const evoHeat = (phase, k) => phase === 'hold' ? k * .25
  : phase === 'build' ? .25 + k * .75
  : phase === 'burst' ? 1
  : phase === 'settle' ? 1 - k
  : 0;

/**
 * How fast the wheel is turning right now, in radians a second. This is a
 * VELOCITY and it has to be integrated — the draw used to rotate by
 * `G.t * (.35 + heat * 2.6)`, which is a product of time and a rate that
 * changes, not the angle a thing turning at that rate would be at.
 *
 * Measured across a whole evolution the difference is not subtle: the wheel
 * snapped backwards at 425 rad/s at the burst and reversed a second time in
 * plain view during the settle — three sign flips in four and a half seconds,
 * where the intent was one long wind-up and a release. The first reversal only
 * went unnoticed because the white-out happens to cover it, which is luck
 * rather than design, and the second is visible for a full second.
 *
 * The direction flip after the change is deliberate and survives: with an
 * angle that accumulates, flipping the SIGN OF THE RATE reverses the spin
 * without moving the wheel, which reads as the light unwinding. Flipping the
 * sign of an angle teleports it.
 */
const evoSpin = (phase, k, swapped) =>
  (.35 + evoHeat(phase, k) * 2.6) * (swapped ? -1 : 1);

function runEvolution(m) {
  const from = m.species;
  G.evoAnim = { mon: m, from, to: DEX[from].evo[0], beats: evoBeats(),
    i: 0, t: 0, spin: 0, swapped: false, res: null };
  playCue('evo');
}

/** The scene owns the screen while this returns true. */
function evoStep(dt) {
  const a = G.evoAnim;
  if (!a) return false;
  a.t += dt;
  const beat = a.beats[a.i];
  // The wheel's angle accumulates here, where dt is. Nothing that turns should
  // be drawn from absolute time multiplied by a rate that moves.
  if (beat) a.spin += dt * evoSpin(beat[0], clamp(a.t / beat[1], 0, 1), a.swapped);
  if (!beat || a.t < beat[1]) return true;
  a.t = 0; a.i++;
  const next = a.beats[a.i];
  if (next && next[0] === 'burst') {
    a.res = evolveMon(a.mon);
    a.swapped = true;
    playCue('level');
  }
  if (next) return true;
  const r = a.res;
  G.evoAnim = null;
  say('', [`${r.oldName} became ${r.newName}!`], () => {
    const nxt = checkEvolve();
    if (nxt) runEvolution(nxt);
    else saveGame();
  });
  return false;
}

/** Which beat is on, for the renderer. */
const evoPhase = () => {
  const a = G.evoAnim;
  return a && a.beats[a.i] ? a.beats[a.i][0] : null;
};

/**
 * A beat for winning.
 *
 * The foe went down and then a card offer appeared, which is a transaction
 * rather than a victory. This holds the arena for a second: the light comes up,
 * gold rises off the ground, and the two numbers you actually won are on
 * screen. Any key skips the tail of it — nobody should sit through a flourish
 * twice.
 */
const FLOURISH_T = 1.35;
function winFlourish(gems, then) {
  G.flourish = { t: 0, gems, done: then };
  // The moment is on the canvas, so the panels around the fight get out of its
  // way — otherwise the word lands behind your own HP bar.
  if (!HEADLESS) {
    show(els.hudFoe, false); show(els.hudMine, false);
    show(els.dialogue, false); show(els.intent, false);
    battleBar(false);
  }
  playCue('level');
}

/** True while the flourish owns the screen. */
function flourishStep(dt) {
  const f = G.flourish;
  if (!f) return false;
  f.t += dt;
  if (f.t < FLOURISH_T && !justPressed('a') && !justPressed('b')) return true;
  const done = f.done;
  G.flourish = null;
  if (done) done();
  // This frame still belongs to the transition. Without that, the very press
  // that skipped the flourish falls through to the screen it just opened and
  // takes the first card for you.
  return true;
}

/** Painted over the arena, so the fight you just won is still behind it. */
function drawFlourish(g) {
  const f = G.flourish;
  if (!f) return;
  const k = clamp(f.t / FLOURISH_T, 0, 1);
  const fade = k < .82 ? 1 : (1 - k) / .18;
  // The light comes up on the field rather than a curtain coming down.
  const glow = g.createLinearGradient(0, VIEW_H, 0, VIEW_H * .3);
  glow.addColorStop(0, `rgba(255,201,77,${.20 * fade})`);
  glow.addColorStop(1, 'rgba(255,201,77,0)');
  g.fillStyle = glow; g.fillRect(0, 0, VIEW_W, VIEW_H);
  // Gold coming up off the ground.
  for (let i = 0; i < 22; i++) {
    const seed = (i * 71 % 43) / 43;
    const rise = (f.t * (.55 + (i % 4) * .22) + seed) % 1;
    g.globalAlpha = (1 - rise) * .85 * fade;
    g.fillStyle = i % 3 ? '#ffc94d' : '#fff4dc';
    g.fillRect(Math.round(seed * VIEW_W + Math.sin(f.t * 3 + i) * 5),
      Math.round(VIEW_H - rise * VIEW_H), 1, 2);
  }
  g.globalAlpha = fade;
  g.textAlign = 'center';
  const pop = Math.min(1, k * 6);
  g.font = `bold ${Math.round(15 + (1 - pop) * 6)}px monospace`;
  g.fillStyle = '#2a1b2e';
  g.fillText('WON', VIEW_W / 2 + 1, 119);
  g.fillStyle = '#ffc94d';
  g.fillText('WON', VIEW_W / 2, 118);
  g.font = 'bold 9px monospace';
  g.fillStyle = '#f3ecff';
  g.fillText(`+${countOf(f.gems, 'gem')}`, VIEW_W / 2, 133);
  g.textAlign = 'left';
  g.globalAlpha = 1;
}

function updateBattle(dt) {
  const b = B();
  // A walk-on, not a teleport — but only once there is somebody to see it.
  //
  // The entry runs at 1.7/s, so it lands at 0.588s; the wipe is 0.55s. Filming
  // a wild encounter showed what that means: the deceleration, the gait bob and
  // the dust all play behind the wipe's black bars and finish 35 milliseconds
  // after they clear, so the frame you actually get is two kin already planted.
  // The most carefully built motion in the arena had never been seen.
  //
  // Holding it while the bars are fully closed costs nothing and the walk-on
  // now plays out into an opening frame, which is the shot it was written for.
  if (G.wipe <= WIPE_T * .5) b.entry = Math.min(1, b.entry + dt * 1.7);
  b.lvT = Math.max(0, (b.lvT || 0) - dt);
  b.flashM = Math.max(0, b.flashM - dt * 3);
  b.flashF = Math.max(0, b.flashF - dt * 3);
  b.shake = Math.max(0, b.shake - dt * 4);
  b.lungeM = Math.max(0, (b.lungeM || 0) - dt);
  b.lungeF = Math.max(0, (b.lungeF || 0) - dt);
  b.windM = Math.max(0, (b.windM || 0) - dt);
  b.windF = Math.max(0, (b.windF || 0) - dt);
  b.recoilM = Math.max(0, (b.recoilM || 0) - dt);
  b.recoilF = Math.max(0, (b.recoilF || 0) - dt);
  if (b.crit) { b.crit.t += dt; if (b.crit.t >= CRIT_BURST) b.crit = null; }
  if (b.burst) { b.burst.t += dt; if (b.burst.t >= BURST_T) b.burst = null; }
  if (b.downM != null) b.downM = Math.min(KO_FALL, b.downM + dt);
  if (b.downF != null) b.downF = Math.min(KO_FALL, b.downF + dt);
  if (b.pops && b.pops.length) {
    for (const p of b.pops) p.t += dt;
    b.pops = b.pops.filter((p) => p.t < POP_LIFE);
  }
  if (b.throwT > 0) b.throwT = Math.max(0, b.throwT - dt);
  // A throw in flight holds everything else: the line that says what happened
  // must not arrive before the orb has stopped moving.
  const orbBusy = orbStep(dt);
  // HP bars chase their target so damage reads as motion, not a jump.
  const chase = (cur, tgt) => Math.abs(tgt - cur) < .6 ? tgt : cur + (tgt - cur) * Math.min(1, dt * 7);
  b.dispM = chase(b.dispM, b.tgtM); b.dispF = chase(b.dispF, b.tgtF);
  // The XP bar chases too, and it is the one bar that only ever moves once.
  // It read `m.xp` raw, so at the single instant it had anything to say — the
  // foe going down — it teleported while the HP bar beside it glided. Worse on
  // a level-up: the level increments before the bar is next drawn, so the fill
  // was measured against the NEW level's floor and the bar went from part-full
