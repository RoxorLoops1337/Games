<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover">
<title>EMBERKIN — a creature collector</title>
<meta name="description" content="Catch, raise and battle 19 hand-drawn creatures across the Hollowbrook valley. Cute enough to want one, armed enough to respect one.">
<meta name="theme-color" content="#120d18">
<style>
  :root{
    --ink:#f5ecdd; --dim:#a99cb4; --panel:#241a2e; --panel2:#170f1f; --edge:#4a3560;
    --gold:#ffc94d; --hp-good:#5fd77a; --hp-warn:#ffcf4d; --hp-bad:#ff5a5a;
    --xp:#5fc9ff;
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ margin:0; height:100%; background:#0a070e; color:var(--ink);
    font-family:'Trebuchet MS','Segoe UI',system-ui,sans-serif; overflow:hidden; }
  body{ display:flex; align-items:center; justify-content:center; touch-action:none; }

  #stage{ position:relative; image-rendering:pixelated; font-size:16px; }
  #view{ display:block; image-rendering:pixelated; background:#0a070e; }

  /* ---------------- shared panel look ---------------- */
  .panel{
    background:linear-gradient(180deg,var(--panel),var(--panel2));
    border:2px solid var(--edge); border-radius:8px;
    box-shadow:0 4px 0 rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.08);
  }
  .hidden{ display:none !important; }

  /* ---------------- dialogue ---------------- */
  #dialogue{
    position:absolute; left:2.5%; right:2.5%; bottom:2.5%; min-height:16%;
    padding:.62em .82em; font-size:.95em; line-height:1.45; letter-spacing:.2px; z-index:6;
  }
  /* In battle the action menu sits beside the text, so the box gives way. */
  #dialogue.narrow{ right:30%; }
  #dialogue .who{ color:var(--gold); font-weight:700; display:block; margin-bottom:2px; font-size:.8em; letter-spacing:1px; text-transform:uppercase; }
  #dialogue .more{ position:absolute; right:10px; bottom:6px; color:var(--gold); animation:bob .7s infinite; }
  @keyframes bob{ 50%{ transform:translateY(3px); } }

  /* ---------------- menus ---------------- */
  .menu{ position:absolute; z-index:7; padding:6px; min-width:118px; }
  .menu .row{
    padding:.38em .62em; cursor:pointer; border-radius:5px; font-size:.88em;
    display:flex; justify-content:space-between; gap:12px; align-items:center; white-space:nowrap;
  }
  .menu .row .sub{ color:var(--dim); font-size:.75em; }
  .menu .row.sel{ background:rgba(255,201,77,.16); box-shadow:inset 0 0 0 1px rgba(255,201,77,.5); }
  .menu .row.sel::before{ content:'▸'; color:var(--gold); margin-right:-4px; }
  .menu .row.off{ opacity:.4; }
  .menu .title{ font-size:.7em; letter-spacing:1.5px; text-transform:uppercase; color:var(--dim); padding:2px 8px 5px; }

  #mainmenu{ right:2.5%; top:2.5%; }
  #battlemenu{ right:2.5%; bottom:2.5%; }
  #movemenu{ left:2.5%; bottom:2.5%; right:32%; }
  #movemenu .row{ justify-content:space-between; }

  /* ---------------- battle HUD ---------------- */
  .hud{ position:absolute; z-index:5; width:44%; padding:6px 8px 7px; }
  #hudFoe{ left:3%; top:4%; }
  #hudMine{ right:3%; top:44%; }
  .hud .nm{ font-size:.82em; font-weight:700; display:flex; justify-content:space-between; gap:8px; }
  .hud .nm .lv{ color:var(--gold); font-size:.75em; }
  .hud .bar{ height:7px; border-radius:4px; background:#0d0812; margin-top:4px; overflow:hidden; border:1px solid #000; }
  .hud .bar > i{ display:block; height:100%; background:var(--hp-good); transition:width .35s ease, background .35s; }
  .hud .xp{ height:3px; margin-top:3px; }
  .hud .xp > i{ background:var(--xp); }
  .hud .hpnum{ font-size:.7em; color:var(--dim); text-align:right; margin-top:2px; }
  .hud .st{ font-size:.62em; letter-spacing:1px; text-transform:uppercase; padding:1px 5px; border-radius:3px;
    background:#000; color:var(--gold); margin-left:5px; }
  .balls{ display:flex; gap:2px; margin-top:4px; }
  .balls i{ width:7px; height:7px; border-radius:50%; background:var(--gold); box-shadow:0 0 0 1px #000; }
  .balls i.out{ background:#4a3560; }

  /* ---------------- full-screen screens (party / dex / bag) ---------------- */
  #screen{
    position:absolute; inset:0; z-index:9; padding:12px; overflow:auto;
    background:linear-gradient(180deg,#1a1222fa,#0d0913fd); backdrop-filter:blur(3px);
  }
  #screen h2{ margin:2px 0 10px; font-size:1em; letter-spacing:2px; text-transform:uppercase; color:var(--gold); }
  #screen .back{ position:absolute; right:12px; top:10px; font-size:.78em; color:var(--dim); cursor:pointer; }
  .cards{ display:grid; grid-template-columns:repeat(auto-fill,minmax(210px,1fr)); gap:8px; }
  .card{ display:flex; gap:8px; padding:7px; align-items:center; cursor:pointer; }
  .card.sel{ box-shadow:0 0 0 2px var(--gold), 0 4px 0 rgba(0,0,0,.5); }
  /* Canvases are authored at 1:1 and blown up by an integer factor in CSS so
     the pixels stay square — never resize the backing store to a fraction. */
  .card canvas{ image-rendering:pixelated; flex:0 0 auto; width:80px; height:80px; }
  .card .info{ flex:1; min-width:0; }
  .card .info b{ display:block; font-size:.82em; }
  .card .info small{ color:var(--dim); font-size:.7em; }
  .card .bar{ height:5px; border-radius:3px; background:#0d0812; margin-top:4px; overflow:hidden; }
  .card .bar > i{ display:block; height:100%; background:var(--hp-good); }
  .dexgrid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(96px,1fr)); gap:6px; }
  .dexcell{ padding:5px; text-align:center; cursor:pointer; }
  .dexcell canvas{ image-rendering:pixelated; width:80px; height:80px; }
  .dexcell b{ display:block; font-size:.7em; margin-top:2px; }
  .dexcell.unseen{ opacity:.35; }
  .dexcell small{ color:var(--dim); font-size:.65em; }
  .types{ display:flex; gap:4px; justify-content:center; margin-top:3px; }
  .hud .types{ justify-content:flex-start; margin:3px 0 1px; }
  .hud .tp{ font-size:.55em; padding:0 4px; }
  .tp{ font-size:.58em; letter-spacing:1px; text-transform:uppercase; padding:1px 5px; border-radius:3px; color:#120d18; font-weight:700; }

  /* ---------------- title ---------------- */
  #title{ position:absolute; inset:0; z-index:12; display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:14px; text-align:center; padding:20px;
    background:radial-gradient(120% 90% at 50% 20%,#3a1c3f,#0c0812 70%); }
  #title h1{ margin:0; font-size:clamp(30px,9vw,58px); letter-spacing:8px; color:var(--gold);
    text-shadow:0 3px 0 #7a3f13, 0 0 26px rgba(255,201,77,.45); }
  #title p{ margin:0; color:var(--dim); font-size:13px; letter-spacing:2px; text-transform:uppercase; }
  #title .btn{ padding:9px 20px; font-size:15px; cursor:pointer; letter-spacing:1px; }
  #title .btn:hover{ background:rgba(255,201,77,.16); }
  #titleArt{ image-rendering:pixelated; }

  /* ---------------- touch controls ---------------- */
  #pad{ position:absolute; z-index:8; left:8px; bottom:8px; width:118px; height:118px; opacity:.5; }
  /* On a phone the stage rarely fills the screen — park the controls in the
     dead space under it so they never sit on top of the text box. */
  body.ctlsbelow{ align-items:flex-start; padding-top:7vh; }
  body.ctlsbelow #pad{ bottom:auto; top:calc(100% + 14px); opacity:.9; }
  body.ctlsbelow #btns{ bottom:auto; top:calc(100% + 34px); opacity:.95; }
  #pad div{ position:absolute; width:38px; height:38px; border-radius:7px; background:#241a2e; border:2px solid var(--edge); }
  #pad .u{ left:40px; top:0; } #pad .d{ left:40px; top:80px; } #pad .l{ left:0; top:40px; } #pad .r{ left:80px; top:40px; }
  #btns{ position:absolute; z-index:8; right:8px; bottom:8px; display:flex; gap:8px; opacity:.55; }
  #btns div{ width:46px; height:46px; border-radius:50%; background:#241a2e; border:2px solid var(--edge);
    display:flex; align-items:center; justify-content:center; font-size:14px; font-weight:700; }
  .notouch #pad, .notouch #btns{ display:none; }

  #toast{ position:absolute; left:50%; top:8%; transform:translateX(-50%); z-index:11; padding:6px 14px;
    font-size:.82em; letter-spacing:1px; opacity:0; transition:opacity .25s; pointer-events:none; }
  #toast.on{ opacity:1; }
</style>
</head>
<body class="notouch">
<div id="stage">
  <canvas id="view" width="256" height="176"></canvas>

  <div id="hudFoe" class="hud panel hidden"></div>
  <div id="hudMine" class="hud panel hidden"></div>

  <div id="dialogue" class="panel hidden"></div>
  <div id="mainmenu" class="menu panel hidden"></div>
  <div id="battlemenu" class="menu panel hidden"></div>
  <div id="movemenu" class="menu panel hidden"></div>
  <div id="screen" class="hidden"></div>
  <div id="toast" class="panel"></div>

  <div id="pad"><div class="u"></div><div class="d"></div><div class="l"></div><div class="r"></div></div>
  <div id="btns"><div data-k="x">B</div><div data-k="z">A</div></div>

  <div id="title">
    <canvas id="titleArt" width="372" height="128"></canvas>
    <h1>EMBERKIN</h1>
    <p>cute enough to want one · armed enough to respect one</p>
    <div class="btn panel" data-act="new">New journey</div>
    <div class="btn panel hidden" data-act="cont">Continue</div>
    <p style="font-size:11px;letter-spacing:1px;text-transform:none">arrows / WASD to move · Z or Enter to talk · X to cancel</p>
  </div>
</div>

/* ============================================================ §1 — core ==
   Tiny helpers, the global game state G, and the save file. Everything below
   reads state from G; nothing keeps a second copy.
   ======================================================================== */
const HEADLESS = typeof window !== 'undefined' && !!window.__EK_HEADLESS__;
const SAVE_KEY = 'emberkin_save_v1';

const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const rnd = (n) => Math.floor(Math.random() * n);           // 0..n-1
const rrange = (a, b) => a + rnd(b - a + 1);                 // inclusive
const chance = (p) => Math.random() < p;

// The whole game lives here. `mode` drives the input router and the renderer.
const G = {
  mode: 'title',           // title | world | battle | screen | dialogue
  t: 0, dt: 0,
  map: null, mapId: '',
  player: { x: 5, y: 8, dir: 'down', px: 5, py: 8, moveT: 0, moveLen: 1, step: 0, bump: 0, hop: false },
  fade: 0, wipe: 0, evoAnim: null, alert: null, prevMode: 'world',
  party: [], box: [], bag: {}, money: 500,
  dex: {},                 // id -> 1 seen, 2 caught
  flags: {},               // story progress
  battle: null,
  dialogue: null,
  screen: null,
  menu: null,
  toastT: 0,
  steps: 0, playtime: 0, wins: 0, caught: 0,
};

const setToast = (msg) => {
  G.toastT = 2.2;
  if (!HEADLESS) { const el = document.getElementById('toast'); el.textContent = msg; el.classList.add('on'); }
};

// ---- save / load -------------------------------------------------------
// One JSON blob. Creatures are stored lean (species + level + hp + moves +
// xp) and rehydrated through mkMon so a stat formula change never needs a
// save migration.
function saveGame() {
  const packMon = (m) => ({ s: m.species, l: m.lvl, hp: m.hp, xp: m.xp, mv: m.moves.map((x) => [x.id, x.pp]), nm: m.nick || '', st: m.status || '' });
  const blob = {
    v: 1, map: G.mapId, x: G.player.x, y: G.player.y, dir: G.player.dir,
    party: G.party.map(packMon), box: G.box.map(packMon),
    bag: G.bag, money: G.money, dex: G.dex, flags: G.flags,
    steps: G.steps, playtime: Math.round(G.playtime), wins: G.wins, caught: G.caught,
  };
  try { localStorage.setItem(SAVE_KEY, JSON.stringify(blob)); return true; }
  catch (e) { return false; }
}

function hasSave() {
  try { return !!localStorage.getItem(SAVE_KEY); } catch (e) { return false; }
}

function loadGame() {
  let blob;
  try { blob = JSON.parse(localStorage.getItem(SAVE_KEY) || 'null'); } catch (e) { blob = null; }
  if (!blob || !blob.party) return false;
  const unpack = (p) => {
    const m = mkMon(p.s, p.l);
    if (!m) return null;
    m.hp = clamp(p.hp, 0, m.max); m.xp = p.xp || 0;
    m.nick = p.nm || ''; m.status = p.st || '';
    if (Array.isArray(p.mv) && p.mv.length) {
      m.moves = p.mv.filter((x) => MOVES[x[0]]).map((x) => ({ id: x[0], pp: x[1], max: MOVES[x[0]].pp }));
    }
    return m;
  };
  G.party = (blob.party || []).map(unpack).filter(Boolean);
  G.box = (blob.box || []).map(unpack).filter(Boolean);
  G.bag = blob.bag || {}; G.money = blob.money ?? 500;
  G.dex = blob.dex || {}; G.flags = blob.flags || {};
  G.steps = blob.steps || 0; G.playtime = blob.playtime || 0;
  G.wins = blob.wins || 0; G.caught = blob.caught || 0;
  enterMap(blob.map || 'hollowbrook', blob.x ?? 5, blob.y ?? 8, blob.dir || 'down');
  return G.party.length > 0;
}

// ---- levels, stats, creatures -----------------------------------------
const xpFor = (lvl) => Math.floor(0.8 * lvl * lvl * lvl);
const statAt = (base, lvl) => Math.floor(base * 2 * lvl / 100) + 5;
const hpAt = (base, lvl) => Math.floor(base * 2 * lvl / 100) + lvl + 10;

/** Moves a species knows by `lvl` — the last four it learned. */
function movesAt(id, lvl) {
  const sp = DEX[id];
  const known = sp.learn.filter((e) => e[0] <= lvl).map((e) => e[1]);
  const uniq = [...new Set(known)];
  return uniq.slice(-4).map((m) => ({ id: m, pp: MOVES[m].pp, max: MOVES[m].pp }));
}

/** Build a fresh creature. Everything derived (stats, moves) comes from here. */
function mkMon(id, lvl, opts = {}) {
  const sp = DEX[id];
  if (!sp) return null;
  const m = {
    species: id, name: sp.name, nick: opts.nick || '', lvl,
    types: sp.types.slice(),
    atk: statAt(sp.base[1], lvl), def: statAt(sp.base[2], lvl), spd: statAt(sp.base[3], lvl),
    max: hpAt(sp.base[0], lvl), hp: 0,
    xp: xpFor(lvl), status: '', moves: movesAt(id, lvl),
    stages: { atk: 0, def: 0, spd: 0 },
  };
  m.hp = m.max;
  return m;
}

/** Recompute stats after a level-up, keeping damage taken proportional. */
function refresh(m) {
  const sp = DEX[m.species];
  const oldMax = m.max;
  m.max = hpAt(sp.base[0], m.lvl);
  m.atk = statAt(sp.base[1], m.lvl);
  m.def = statAt(sp.base[2], m.lvl);
  m.spd = statAt(sp.base[3], m.lvl);
  m.hp = Math.min(m.max, m.hp + (m.max - oldMax));
  m.types = sp.types.slice();
}

const dispName = (m) => m.nick || m.name;
const alive = (m) => m.hp > 0;
const firstAlive = () => G.party.find(alive) || null;
const partyAlive = () => G.party.some(alive);

/** Effective stat including battle stages (−6…+6) and status. */
function effStat(m, key) {
  const st = clamp(m.stages ? m.stages[key] || 0 : 0, -6, 6);
  const mul = st >= 0 ? (2 + st) / 2 : 2 / (2 - st);
  let v = m[key] * mul;
  if (key === 'atk' && m.status === 'burn') v *= .85;
  if (key === 'spd' && m.status === 'chill') v *= .5;
  return Math.max(1, Math.floor(v));
}
