<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover">
<title>EMBERKIN — a creature collector</title>
<meta name="description" content="Catch, raise and battle 19 hand-drawn creatures across the Hollowbrook valley. Cute enough to want one, armed enough to respect one.">
<meta name="theme-color" content="#120d18">
<style>
  :root{
    /* How big a thumb is. Every touch-only target rule below is written in
       terms of this rather than repeating 44 in four places, so the next list
       or button someone adds gets a finger-sized box by asking for one. */
    --tap:44px;
    --ink:#f5ecdd; --dim:#a99cb4; --panel:#241a2e; --panel2:#170f1f; --edge:#4a3560;
    --gold:#ffc94d; --hp-good:#5fd77a; --hp-warn:#ffcf4d; --hp-bad:#ff5a5a;
    --xp:#5fc9ff;
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ margin:0; height:100%; background:#0a070e; color:var(--ink);
    font-family:'Trebuchet MS','Segoe UI',system-ui,sans-serif; overflow:hidden; }
  body{ display:flex; align-items:center; justify-content:center; touch-action:none; }

  /* The valley is 256x208 of pixels on a black page, and a rectangle on black
     reads as a screenshot rather than a made object. Three layers fix that and
     none of them cost a frame: the page carries a slow warm bloom so the screen
     is *in* somewhere, the stage has a bezel with light caught on its top edge,
     and the glass over it has the faintest scanline and a corner darkening. */
  body{ background:
    radial-gradient(90% 70% at 50% 0%, #1d1430 0%, #0e0918 42%, #060409 100%); }
  #stage{ position:relative; image-rendering:pixelated; font-size:16px;
    border-radius:10px;
    padding:6px;
    background:linear-gradient(180deg, #2a1f3c, #150e20 46%, #0d0814);
    box-shadow:
      inset 0 1px 0 rgba(255,236,205,.16),
      inset 0 -1px 0 rgba(0,0,0,.6),
      0 0 0 1px #382a4e,
      0 10px 30px rgba(0,0,0,.65),
      0 0 60px 6px rgba(120,70,190,.20),
      0 0 140px 30px rgba(255,170,90,.07); }
  #view{ display:block; image-rendering:pixelated; background:#0a070e;
    border-radius:4px; }
  /* Glass: a scanline fine enough to be texture rather than pattern, and the
     corners falling off so the picture has a middle. Pointer-events off so it
     never eats a tap. */
  #stage::after{
    content:''; position:absolute; inset:6px; border-radius:4px;
    pointer-events:none; z-index:40;
    background:
      radial-gradient(120% 100% at 50% 50%, transparent 58%, rgba(6,3,10,.34) 100%),
      repeating-linear-gradient(180deg, rgba(255,255,255,.028) 0 1px, transparent 1px 3px);
    mix-blend-mode:overlay; }
  @media (prefers-reduced-motion: reduce){ #stage{ box-shadow:0 0 0 1px #382a4e, 0 10px 30px rgba(0,0,0,.65); } }

  /* ---------------- shared panel look ---------------- */
  /* A panel is a lit object, not a rounded rectangle. Three things do the work
     and none of them cost a pixel of the canvas: a top-light gradient so the
     surface has a direction, a hairline INSIDE the border so the frame reads as
     two materials rather than one stroke, and a shadow with a warm violet in it
     rather than flat black — which is what stops the UI looking like it was cut
     out of a different picture from the valley behind it. */
  .panel{
    position:relative;
    background:
      linear-gradient(180deg, rgba(255,236,205,.07), rgba(255,236,205,0) 38%),
      linear-gradient(180deg, var(--panel), var(--panel2));
    border:2px solid var(--edge); border-radius:8px;
    box-shadow:0 4px 0 rgba(10,6,16,.6), 0 6px 14px rgba(28,14,44,.45),
      inset 0 1px 0 rgba(255,255,255,.10);
  }
  .panel::before{
    content:''; position:absolute; inset:1px; border-radius:6px; pointer-events:none;
    border:1px solid rgba(255,236,205,.07);
  }
  .hidden{ display:none !important; }

  /* ---------------- dialogue ---------------- */
  #dialogue{
    position:absolute; left:2.5%; right:2.5%; bottom:2.5%; min-height:16%;
    padding:.62em .82em; font-size:.95em; line-height:1.45; letter-spacing:.2px; z-index:6;
  }
  /* In battle the log is a single line sitting just above the hand. */
  #dialogue.narrow{ left:1.5%; right:1.5%; bottom:auto; top:62%; min-height:0; padding:4px 10px;
    font-size:.8em; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  #dialogue.narrow .more{ bottom:2px; }
  #dialogue .who{ color:var(--gold); font-weight:700; display:block; margin-bottom:2px; font-size:.8em; letter-spacing:1px; text-transform:uppercase; }
  #dialogue .more{ position:absolute; right:10px; bottom:6px; color:var(--gold); animation:bob .7s infinite; }
  @keyframes bob{ 50%{ transform:translateY(3px); } }

  /* ---------------- menus ---------------- */
  .menu{ position:absolute; z-index:7; padding:6px; min-width:118px; }
  .menu .row{
    padding:.38em .62em; cursor:pointer; border-radius:5px; font-size:.88em;
    display:flex; justify-content:space-between; gap:12px; align-items:center; white-space:nowrap;
  }
  .menu .row .sub{ color:var(--dim); font-size:.75em; }
  /* The aim, under the where-and-what-you-have line. Its own line because it
     is a sentence, not a stat, and quieter than the row labels so it reads as
     the answer to a question rather than another thing to select. */
  .menu .title .aim{ display:block; margin-top:.35em; font-weight:400;
    font-size:.92em; color:var(--dim); letter-spacing:0; text-transform:none; }
  .menu .row.sel{ background:rgba(255,201,77,.16); box-shadow:inset 0 0 0 1px rgba(255,201,77,.5); }
  .menu .row.sel::before{ content:'▸'; color:var(--gold); margin-right:-4px; }
  .menu .row.off{ opacity:.4; }
  .menu .title{ font-size:.7em; letter-spacing:1.5px; text-transform:uppercase; color:var(--dim); padding:2px 8px 5px; }

  #mainmenu{ right:2.5%; top:2.5%; }

  /* ---------------- the hand ---------------- */
  #battlebar{ position:absolute; inset:0; z-index:6; pointer-events:none; }
  #battlebar > *{ pointer-events:auto; }
  /* The outer cards need room to swing. Each pivots about a point below the
     hand, so its rotation is mostly a sideways translation — the fifth card of
     a full hand was sliced by the stage edge, badly at a phone's width, in the
     first hand a player is ever dealt. Margin here, and a shorter lever below. */
  /* MEASURED, NOT FIXED — see `handclip` in tools/emberkin/shot.mjs, which
     reports both numbers and throws on either.
     The outer cards of the fan rotate about a pivot below the row, so their
     lower corners swing past its box and card five is clipped by the stage at
     every layout: 4.3px on an overlay phone, 4.7 portrait, 5.8 in a landscape
     gutter, 9.8 on a tablet — the same 1.5% of stage height each time, which is
     exactly the clearance `bottom` gives them. Two passes ago this was recorded
     as "cannot tell whether the overhang is the fan's design"; it is not, and
     now there is a number instead of an impression.
     It is left alone because the row is squeezed from both ends. Raising it
     clears the floor and pushes the AIMED card — which lifts on its own — up
     under the description bar, hiding the cost pip, and cost is the first thing
     a player checks. At 264x760 the bar already eats 10.3px of the aimed card
     before anything is changed, which is three times what it takes at 390 —
     the narrow phone is much the worse end, and a sweep at one width never
     says so. Every value tried moved the damage rather than removing
     it: bottom 3.2% gave floor 0 / bar 8.4px at portrait, and 2.6% with a
     shorter row gave floor 1.3 / bar 6.6 there and 12.6px under the bar at 264.
     The fix is not a number, it is the fan's pivot or the bar's placement, and
     that is a design decision rather than a tuning one. */
  #hand{ position:absolute; left:5%; right:5%; bottom:1.5%; height:30%; touch-action:none;
    display:flex; justify-content:center; align-items:flex-end; }
  /* The fan. Cards overlap and pivot around a point below the hand, the way a
     hand of real cards splays from the heel of your thumb. The per-card angle
     and drop are inline, from fanStyle(). */
  #hand .cardel{ flex:0 0 20%; height:93%; margin:0 -.7%; transform-origin:50% 138%;
    transition:transform .14s cubic-bezier(.2,.9,.3,1.2), box-shadow .12s ease, filter .14s ease; }
  #hand .cardel.sel{ box-shadow:0 0 0 .14em var(--gold), 0 .7em .5em rgba(0,0,0,.5); }
  /* "▲ play" and the rarity pip both want the foot of the card; while a card is
     the one you are aiming at, the prompt wins. */
  #hand .cardel.sel .cpip{ visibility:hidden; }

  /* ---- the card face --------------------------------------------------
     Built the way a card game teaches you to scan one: cost on the frame,
     art in a lit window, name on a rule, rules text under it, rarity in the
     frame itself. Everything is in `em` off the stage font-size, so the same
     markup is a thumbnail in the hand and a full card on a screen.
     Percentage padding is banned here: it resolves against the ROW's width,
     not the card's, which once left a 32px content box inside an 82px card. */
  .cardel{
    flex:0 0 18%; height:100%; position:relative; overflow:hidden; cursor:pointer;
    border-radius:.55em; padding:.34em .34em .3em;
    background:
      radial-gradient(120% 62% at 50% 8%, color-mix(in srgb, var(--tint) 26%, transparent), transparent 70%),
      linear-gradient(180deg,#2a2036,#150e1d 62%,#100a17);
    border:.14em solid color-mix(in srgb, var(--tint) 55%, #2a2136);
    box-shadow:0 .22em 0 rgba(0,0,0,.55), inset 0 0 0 .07em rgba(255,255,255,.05);
    display:flex; flex-direction:column; align-items:center;
    transition:transform .12s ease, box-shadow .12s ease, filter .12s ease;
  }
  /* A hairline inside the border reads as a printed frame rather than a div. */
  .cardel .cframe{ position:absolute; inset:.16em; border-radius:.36em; pointer-events:none;
    border:.07em solid color-mix(in srgb, var(--tint) 30%, transparent); }

  .cardel .cart{ position:relative; width:100%; height:44%; margin-top:.9em;
    display:flex; align-items:center; justify-content:center; }
  /* The glow sits behind the art so a dark glyph still reads on a dark card. */
  .cardel .cart::before{ content:''; position:absolute; width:82%; aspect-ratio:1; border-radius:50%;
    background:radial-gradient(circle, color-mix(in srgb, var(--tint) 45%, transparent), transparent 68%); }
  .cardel .cart canvas{ position:relative; height:100%; width:auto; image-rendering:pixelated; }
  .cardel .cglyph{ position:relative; font-size:1.5em; font-weight:700; color:var(--tint);
    text-shadow:0 .06em 0 rgba(0,0,0,.7); }

  .cardel .cname{ width:100%; margin-top:.18em; padding:.1em 0 .12em; text-align:center;
    font-size:.8em; font-weight:700; line-height:1.05; letter-spacing:.2px;
    border-top:1px solid color-mix(in srgb, var(--tint) 40%, transparent);
    overflow-wrap:break-word; overflow:hidden; }
  .cardel .ctext{ width:100%; font-size:.6em; color:var(--dim); line-height:1.2; text-align:center;
    flex:1; overflow:hidden; }

  /* Cost is a gem punched through the frame — the first thing you check. */
  .cardel .ccost{ position:absolute; left:.16em; top:.1em; width:1.5em; height:1.5em; z-index:2;
    border-radius:50%; background:radial-gradient(circle at 34% 30%, #4a3a5e, #120c1c 70%);
    border:.1em solid var(--gold); color:var(--gold); font-size:.72em; font-weight:700;
    display:flex; align-items:center; justify-content:center;
    box-shadow:0 0 .5em rgba(255,201,77,.28); }
  .cardel .cslot{ position:absolute; right:.32em; top:.24em; font-size:.55em; color:var(--dim); font-weight:700; }
  .cardel .cgrow{ position:absolute; right:.24em; top:1.3em; font-size:.62em; font-weight:700;
    color:#0e0a14; background:var(--hp-good); border-radius:.3em; padding:0 .22em; z-index:2; }
  /* The foot is in normal flow, not two absolute lines fighting for the same
     few pixels: the note sits on the pip, and the pip closes the card. */
  .cardel .cfoot{ width:100%; margin-top:auto; }
  /* The note wraps rather than truncating. It carries the only numbers on the
     offer — "3 in your deck · 1 set aside", "none in your deck · to +12" — and
     they exist to answer take-or-skip. Held on one line with an ellipsis they
     read "3 in your deck · 1…" at a phone's width, which is the half of the
     sentence that does not decide anything. Two short lines beat one cut one. */
  .cardel .cnote{ font-size:.44em; color:var(--dim); line-height:1.15; text-align:center;
    overflow:hidden; }
  .cardel .cpip{ width:100%; text-align:center; padding-top:.15em;
    font-size:.44em; letter-spacing:.12em; text-transform:uppercase;
    color:color-mix(in srgb, var(--tint) 80%, #fff 20%); opacity:.85; }
  .cardel .cp{ position:absolute; left:0; right:0; bottom:.9em; text-align:center; z-index:2;
    font-size:.6em; letter-spacing:1px; color:var(--gold); text-transform:uppercase;
    text-shadow:0 0 .5em rgba(0,0,0,.9); }

  /* Rarity is the frame, not a label you have to read. Epic and legendary get
     a sheen that moves, because a card you were pleased to draw should look it. */
  .cardel.r-rare{ box-shadow:0 .22em 0 rgba(0,0,0,.55), 0 0 .7em rgba(95,201,255,.22); }
  .cardel.r-epic{ box-shadow:0 .22em 0 rgba(0,0,0,.55), 0 0 .9em rgba(200,107,255,.3); }
  .cardel.r-legendary{ box-shadow:0 .22em 0 rgba(0,0,0,.55), 0 0 1.1em rgba(255,201,77,.42); }
  .cardel.r-epic::after, .cardel.r-legendary::after{
    content:''; position:absolute; inset:0; pointer-events:none; border-radius:.4em;
    background:linear-gradient(115deg, transparent 38%, rgba(255,255,255,.16) 48%, transparent 58%);
    background-size:280% 100%; animation:sheen 3.6s linear infinite; }
  @keyframes sheen{ from{ background-position:180% 0; } to{ background-position:-80% 0; } }

  /* A kin's own move belongs to the creature, not the deck, and says so. */
  .cardel.kin{ border-color:var(--gold); }
  .cardel.kin .cname{ color:var(--gold); }

  .cardel.sel{ transform:translateY(-8%); box-shadow:0 0 0 .14em var(--gold), 0 .4em 0 rgba(0,0,0,.55); }
  /* What you cannot pay for goes cold and sits back in the fan, so the hand is
     readable at a glance rather than after reading five cost pips. */
  .cardel.dead{ filter:grayscale(.85) brightness(.5) contrast(.9); }
  #hand .cardel.dead{ opacity:.75; }
  .cardel.willplay{ box-shadow:0 0 0 .2em var(--gold), 0 0 1.5em rgba(255,201,77,.5); }

  /* Off a hand the same card gets room: a wrapping shelf of full-size faces,
     which is where you actually read the rules text and the growth. */
  .cardrow{ display:flex; flex-wrap:wrap; gap:.5em; margin-top:1.1em; }

  /* ---- a kin's papers -------------------------------------------------- */
  /* Centred, not flushed left. The panel is far wider than this content and the
     old layout left a quarter of it empty down the right-hand side — the same
     "content parked in a box it does not fill" as the title screen, the reward
     cards and the interior maps. Fourth time. */
  .profile{ display:flex; gap:1.2em; align-items:center; flex-wrap:wrap;
    justify-content:center; margin-top:.6em; }
  .profile .pcard{ padding:.6em; display:flex; flex-direction:column; align-items:center; gap:.4em;
    background:radial-gradient(120% 80% at 50% 12%, rgba(255,201,77,.14), transparent 70%),
      linear-gradient(180deg,#2a2036,#150e1d); }
  /* The kin is the reason this screen exists. At a fixed 150px it was a
     passport photo in a thousand-pixel panel, one second after the gotcha had
     filled the frame with the same creature — the drama fell off a cliff at
     exactly the moment the player got what they came for. Em-based so it tracks
     the stage instead of staying 150px on every size. */
  .profile .pcard canvas{ width:15em; height:15em; max-width:42vw; max-height:42vw;
    image-rendering:pixelated; }
  .profile .ptypes{ display:flex; gap:.25em; }
  /* Below a x2 stage the enlarged portrait pushed the dex line and both buttons
     under the fold — including "Take it along", which is how you leave this
     screen. The scroll cue makes that recoverable rather than broken, but the
     one action a player must find should not need to be looked for. Exactly the
     fault the bigger portrait was meant to fix, at the other end of the range,
     committed one pass after fixing it: a composition judged at one window. */
  body.tight .profile{ gap:.6em; }
  body.tight .profile .pcard{ padding:.35em; }
  body.tight .profile .pcard canvas{ width:8.5em; height:8.5em; max-width:34vw; max-height:34vw; }
  body.tight .profile .pdex{ margin:.45em 0; }
  .profile .pbody{ flex:1 1 15em; min-width:13em; }
  .profile .prow{ display:flex; align-items:center; gap:.5em; }
  .profile .prow label{ font-size:.72em; letter-spacing:.1em; text-transform:uppercase; color:var(--dim); }
  /* The field looks like a field, so it is obvious it can be typed in. */
  .profile #nickin{ flex:0 1 10em; min-width:6em; font:inherit; font-size:1em; padding:.28em .5em;
    color:var(--gold); background:#0d0812; border:2px solid var(--edge); border-radius:.35em; }
  .profile #nickin:focus{ outline:none; border-color:var(--gold); box-shadow:0 0 .6em rgba(255,201,77,.35); }
  .profile .phint{ font-size:.68em; color:var(--dim); margin:.3em 0; }
  .profile .pdex{ font-size:.8em; color:var(--dim); font-style:italic; margin:.8em 0; max-width:26em; line-height:1.4; }
  .profile .pstats{ display:flex; flex-wrap:wrap; gap:.7em; font-size:.78em; margin-top:.7em; }
  .profile .pstats span{ color:var(--dim); }
  .profile .pstats span:first-child{ color:var(--gold); font-weight:700; }
  .profile .bar{ margin-top:.35em; max-width:18em; height:.5em; border-radius:.25em;
    background:#0d0812; border:1px solid var(--edge); overflow:hidden; }
  .profile .bar i{ display:block; height:100%; }
  .profile .pacts{ display:flex; gap:.5em; margin-top:.8em; }
  .profile .pacts .abtn{ padding:.35em .9em; font-size:.8em; border-radius:.35em; cursor:pointer;
    background:linear-gradient(180deg,var(--panel),var(--panel2)); border:2px solid var(--edge); }
  .profile .pacts .abtn.sel{ border-color:var(--gold); color:var(--gold); }

  .cardel.big{ flex:0 0 8em; height:11.4em; font-size:1.2em; padding:.4em .4em .34em; }
  /* The offer is the one moment the card IS the decision, so it gets room —
     but it must never wrap: four cards side by side is the whole choice, and a
     card that has fallen onto a second row reads as a different question.
     They share the width instead, and the lifted one has space to lift into. */
  .cardrow.big{ flex-wrap:nowrap; gap:.7em; margin-top:1.7em; align-items:stretch; }
  /* Height comes from the wordiest card, not from a number. At a fixed 14.6em
     every card had a dead band between where its description stopped and the
     footer pinned to the bottom — about a seventh of the card on the shortest
     one, which is the same "content parked in a box it does not fill" the title
     screen and the interior maps both had. align-items:stretch already keeps
     the row level, so letting the tallest set the height costs nothing. */
  .cardrow.big .cardel{ flex:1 1 0; min-width:0; max-width:11em;
    height:auto; min-height:11.5em; font-size:1.4em; }
  .cardel.big .cart{ height:40%; margin-top:1em; }
  /* flex:0 0 auto, not 0 1 auto. Shrinkable text plus overflow:hidden means the
     wordiest card silently clips into its own footer rather than making the row
     taller — which is exactly what happened the moment the row stopped being a
     fixed height. The card grows; the text is never cut. */
  .cardel.big .ctext{ font-size:.56em; flex:0 0 auto; padding-bottom:.5em; }
  .cardel.off{ opacity:.45; }
  .cardel.skipcard{ flex:0 0 8em; height:11.4em; font-size:1.2em; justify-content:center; }
  .cardel.skipcard .cglyph{ font-size:2.4em; }

  /* Energy is a row of gems, not a fraction. "2/3" is a number you have to
     read; three gems with one gone dark is a thing you can see. */
  #energy{ position:absolute; left:1.5%; top:53%; padding:3px 7px; font-size:1em;
    display:flex; align-items:center; gap:3px; }
  #energy .gem{ width:.5em; height:.5em; border-radius:50%; flex:0 0 auto;
    background:radial-gradient(60% 60% at 35% 30%,#fff2c4,var(--gold) 60%,#a86b12);
    box-shadow:0 0 .35em rgba(255,201,77,.65), inset 0 -.08em .1em rgba(0,0,0,.35); }
  #energy .gem.spent{ background:#241b2e; box-shadow:inset 0 0 0 .09em #3a2f47; }
  #energy .ecount{ color:var(--gold); font-size:.72em; font-weight:700; margin-left:.15em; }
  /* The piles are stacks of cards, so they look like stacks of cards. */
  #piles{ position:absolute; left:13%; top:53%; padding:3px 8px; font-size:.82em; color:var(--dim);
    display:flex; align-items:center; gap:.55em; }
  #piles .pile{ display:inline-flex; align-items:center; gap:.32em; }
  #piles .stk{ position:relative; display:block; width:1.25em; height:1.15em; flex:0 0 auto; }
  #piles .stk i{ position:absolute; left:0; top:.14em; width:.6em; height:.9em; border-radius:.1em;
    border:1px solid #6b5f7f; background:linear-gradient(180deg,#3a2c4a,#221a2d); }
  #piles .stk i:nth-child(2){ left:.2em; top:.07em; }
  /* The top of the stack is the lit one, so a pile reads front to back. */
  #piles .stk i:nth-child(3){ left:.4em; top:0; background:linear-gradient(180deg,#57456e,#31253f); }
  #piles .pile.draw .stk i{ background:linear-gradient(180deg,#3f6490,#22364f); border-color:#6f92b8; }
  #piles .pile.exh .stk i{ background:linear-gradient(180deg,#6b3d59,#331d2c); border-color:#9c6a86; }
  #piles .pile b{ color:#e8e2f0; font-size:.95em; font-variant-numeric:tabular-nums; }
  #piles .pile.empty{ opacity:.4; }
  #piles .shieldpip{ color:var(--xp); font-weight:700; }
  #piles .shieldpip::before{ content:'◈'; margin-right:.15em; }
  #acts{ position:absolute; right:1.5%; top:54%; display:flex; gap:4px; }
  #acts .abtn{ padding:3px 9px; font-size:.72em; border-radius:5px; cursor:pointer;
    background:linear-gradient(180deg,var(--panel),var(--panel2)); border:2px solid var(--edge); }
  #acts .abtn .key{ color:var(--gold); }
  /* Nothing left you can pay for — say so rather than let the player hunt. */
  #acts .abtn.nag{ border-color:var(--gold); color:var(--gold); animation:nag 1s ease-in-out infinite; }
  @keyframes nag{ 50%{ box-shadow:0 0 10px rgba(255,201,77,.5); } }
  /* Fingers need more to hit than a mouse does — and a survey of every tappable
     thing at 390x760 put a number on "more" for the first time. A thumb is
     about 44px across. These four are pressed every single turn of every fight
     and their hit area measured 24px tall. `#acts` is absolutely positioned, so
     the taller button covers a little more arena and pushes nothing.

     The measurement that matters is not the border box: it is how far from the
     centre a tap can land and still resolve to this element. Padding, a
     pseudo-element and a sibling painted on top all move that number and none
     of them move the rect. */
  body.touch #acts .abtn{ min-height:var(--tap); box-sizing:border-box; padding:0 14px;
    display:flex; align-items:center; font-size:.8em; }
  /* `#acts` is anchored by its TOP, so the taller button grew entirely
     downward — straight under the panel that carries the selected card's text,
     which left the box 44px and the reachable area still 24. Above the row is
     open arena, so the row moves up by exactly what it gained. Growing a target
     into whatever is below it is not growing it. */
  body.touch #acts{ gap:7px; margin-top:-20px; }
  /* The way out of every screen was the smallest target in the game: an 8px
     tall hit area in the corner, on all eight screens that have one. It is a
     text chip and making it a block would make the corner shout, so the chip
     keeps its size and a transparent spacer gives the thumb something to land
     on. Nothing moves by a pixel; only the hit test changes.

     The spacer reaches down and left, not outward from the centre: the chip
     lives in the panel's top-right corner and `#screen` is a scroller, so a
     centred box is clipped by the panel's own top edge — measured 44 wide and
     30 tall for exactly that reason. Down and left is where the room is. */
  body.touch #screen .back::after{ content:''; position:absolute;
    top:-14px; height:calc(var(--tap) + 4px); left:-32px; right:-12px; }
  /* …and the room has to exist before the spacer can use it. On the party, box
     and dex the first row of content sits directly under the chip and, being
     positioned and later in the document, paints over it: the spacer reached 35
     of its 46px there and the full 46 on the five screens with a looser header.
     Twelve pixels of header on a touch layout is the whole difference, and it
     buys a little air above every screen title as well. */
  body.touch #screen{ padding-top:24px; }
  /* A list row is a thing you tap, so on a phone it is at least a finger tall.
     Every row in the game already cleared this except the chest shelf, which
     came in at 43 — but stating it as a rule about rows is worth more than two
     pixels on one screen, because the next list added gets it for free. */
  body.touch .items .item{ min-height:var(--tap); }
  /* Rename and Done end the profile screen, at 18px. These sit in the flow, so
     they grow the screen a little rather than covering it. */
  body.touch .profile .pacts .abtn{ min-height:var(--tap); display:flex;
    align-items:center; justify-content:center; }
  #intent{ position:absolute; left:3%; top:14%; padding:3px 9px; font-size:.72em; z-index:6; }
  #intent b{ color:var(--hp-bad); }
  /* The move name in this chip is already red, so a lethal warning written in
     more red does not read as an alarm — it reads as more chip. The frame is
     what changes. */
  #intent.lethal{ border-color:var(--hp-bad);
    box-shadow:0 0 0 1px var(--hp-bad), 0 0 14px rgba(255,90,90,.4);
    animation:intentpulse 1.1s ease-in-out infinite; }
  @keyframes intentpulse{ 50%{ box-shadow:0 0 0 1px var(--hp-bad), 0 0 6px rgba(255,90,90,.2); } }
  #shieldpip{ color:var(--xp); }

  #battlemenu{ right:2.5%; top:54%; }
  #movemenu{ left:2.5%; bottom:2.5%; right:32%; }
  #movemenu .row{ justify-content:space-between; }

  /* ---------------- battle HUD ---------------- */
  .hud{ position:absolute; z-index:5; width:44%; padding:6px 8px 7px; }
  #hudFoe{ left:3%; top:2%; }
  #hudMine{ right:3%; top:35%; }
  /* MEASURED, not guessed: a twelve-character nickname — the most the field
     accepts — is 108px inside a 180px plate at phone size and 120px inside a
     338px plate on a desktop, with scrollWidth === clientWidth at both. This
     needs no min-width:0 and no ellipsis. A screenshot appeared to show the
     name spilling out of the plate's left edge; that was the dialogue box drawn
     OVER the plate, and a fix was written for it before the DOM was measured. */
  .hud .nm{ font-size:.82em; font-weight:700; display:flex; justify-content:space-between; gap:8px; }
  .hud .nm .lv{ color:var(--gold); font-size:.75em; }
  /* The bar is a track with something in it, not a coloured div: a recessed
     channel, a fill lit along its top edge, and a bright cap at the head of the
     fill so the eye can find where it ends at a glance. */
  .hud .bar{ height:8px; border-radius:4px; margin-top:4px; overflow:hidden;
    background:linear-gradient(180deg,#080510,#15101f);
    border:1px solid #05030a; box-shadow:inset 0 1px 2px rgba(0,0,0,.8); }
  /* Shield on the health bar, because that is what it is.
     Your effective health is HP plus shield, and the two numbers lived in
     different places — the bar over here reading 63/63 and looking untouched,
     the shield a pip across the screen next to the draw and discard counts,
     which is where resources live rather than where survival does. The intent
     line now says how much gets "through" your shield; the bar it gets through
     to did not know the shield existed.
     A band behind the fill, in the cool blue the shield pip already uses, so a
     banked guard reads as extra bar rather than as a different statistic. */
  .hud .bar > u{ position:absolute; left:0; top:0; height:100%; border-radius:3px;
    background:linear-gradient(180deg, rgba(190,235,255,.55), rgba(95,201,255,.42));
    box-shadow:inset 0 0 0 1px rgba(190,235,255,.35); }
  .hud .hpnum .shd{ color:var(--xp); font-weight:700; }
  .hud .bar{ position:relative; }
  .hud .bar > i{ display:block; height:100%; position:relative; border-radius:3px;
    background:linear-gradient(180deg, rgba(255,255,255,.35), rgba(255,255,255,0) 55%), var(--hp-good);
    box-shadow:0 0 6px -1px currentColor;
    transition:width .35s ease, background .35s; }
  .hud .bar > i::after{ content:''; position:absolute; right:0; top:0; bottom:0; width:2px;
    background:rgba(255,255,255,.7); }
  .hud .xp{ height:4px; margin-top:3px; }
  .hud .xp > i{ background:linear-gradient(180deg, rgba(255,255,255,.3), rgba(255,255,255,0) 55%), var(--xp); }
  .hud .hpnum{ font-size:.7em; color:var(--dim); text-align:right; margin-top:2px; }
  /* A status is a state you are in, so it is the loudest thing on the panel:
     its own colour, and a pulse so a burn ticking away is visible from the
     corner of your eye rather than a word you have to notice. */
  .tp.st{ margin-left:5px; color:#120d18; animation:stpulse 1.4s ease-in-out infinite; }
  @keyframes stpulse{ 50%{ filter:brightness(1.45); } }
  .balls{ display:flex; gap:2px; margin-top:4px; }
  .balls i{ width:7px; height:7px; border-radius:50%; box-shadow:0 0 0 1px #05030a, 0 0 5px rgba(255,201,77,.5);
    background:radial-gradient(circle at 34% 30%, #fff2c4, var(--gold) 60%, #b07f1a); }
  .balls i.out{ background:radial-gradient(circle at 34% 30%, #6a5182, #362647 70%); box-shadow:0 0 0 1px #05030a; }

  /* ---------------- full-screen screens (party / dex / bag) ---------------- */
  /* A screen arrives rather than appearing. Everything in this game used to
     cut; the reward is the one that lands with weight, because it is the only
     screen you actually chose to open. */
  @keyframes screenRise{ from{ opacity:0; transform:translateY(6%); } to{ opacity:1; transform:none; } }
  @keyframes screenLand{ 0%{ opacity:0; transform:scale(1.06); } 60%{ opacity:1; transform:scale(.995); } 100%{ transform:none; } }
  #screen.rising{ animation:screenRise .17s cubic-bezier(.2,.8,.3,1) both; }
  #screen.landing{ animation:screenLand .26s cubic-bezier(.2,.9,.25,1) both; }
  /* Screens flowed from the top, so a short one — the card offer is three cards
     and a line of text — sat in the upper third with a dead half beneath it,
     the same mistake as the flat surround around a small map. `safe center`
     centres content that fits and falls back to flow-from-the-top when it does
     not, so the deck and the box still scroll from their first row. */
  /* A screen that scrolls says so. The deck is longer than the frame and its
     last row was cut clean off by the panel edge with nothing to suggest there
     was more — which reads as a broken screen, not a long one. These are the
     `local`/`scroll` background layers: the two covers scroll WITH the content
     and sit over the two shadows, which are pinned to the frame, so a shadow
     only appears at an edge you have actually scrolled away from. No JS, no
     element, and it disappears by itself on a screen that fits. */
  #screen{
    position:absolute; inset:0; z-index:9; padding:12px; overflow:auto;
    display:flex; flex-direction:column; justify-content:safe center;
    background:
      linear-gradient(180deg,#12101d 42%, #12101d00) top / 100% 26px local no-repeat,
      linear-gradient(0deg,#0d0913 42%, #0d091300) bottom / 100% 26px local no-repeat,
      linear-gradient(180deg, rgba(0,0,0,.55), rgba(0,0,0,0)) top / 100% 18px scroll no-repeat,
      linear-gradient(0deg, rgba(0,0,0,.6), rgba(0,0,0,0)) bottom / 100% 22px scroll no-repeat,
      linear-gradient(180deg,#1a1222fa,#0d0913fd);
    backdrop-filter:blur(3px);
    touch-action:pan-y; -webkit-overflow-scrolling:touch; overscroll-behavior:contain;
  }
  #screen h2{ margin:2px 0 10px; font-size:1em; letter-spacing:2px; text-transform:uppercase; color:var(--gold); }
  #screen .back{ position:absolute; right:12px; top:10px; font-size:.78em; color:var(--dim); cursor:pointer; }
  /* The chip floats over everything, so anything that LEADS a screen has to
     leave its corner alone. Every screen used to open with an <h2>, which is
     short and sits to the left of it; the box now opens with a full-width
     detail panel, and that panel drew straight through the only way off the
     screen. Reserve the corner rather than moving the chip — the chip being in
     the same place on every screen is the point of it. */
  #screen > .kindetail{ margin-top:20px; }
  /* In the portrait phone layout the stage is top-aligned at 4% of the window,
     so the panel's top-right corner lands underneath #fsbtn — fixed at right:8
     top:8, 34px square. The two were drawn on top of each other, which is only
     visible in a shot taken as a touch device, and until this pass the tool
     could not take one. Stepping left clears the button without pushing the
     label down into the first row of cards. */
  body.ctl-below #screen .back{ right:52px; }
  .cards{ display:grid; grid-template-columns:repeat(auto-fill,minmax(210px,1fr)); gap:8px; }
  /* The box screen's party is the list you swap OUT of, not the thing you came
     for. At 210px it is three tall rows and it ate the whole first screenful —
     with twenty-six boxed, the half of the screen you opened it for started
     below the fold with the cursor six rows away from it. Narrower here only:
     the party still shows everything, and the box now starts on the same
     screen as it. The cursor mapping is untouched, which is why this is the
     fix rather than putting the box first — `monCard` indexes party 0..n-1
     then box n+i, and the help text at the bottom describes that order. */
  .cards.slim{ grid-template-columns:repeat(auto-fill,minmax(148px,1fr)); }
  /* The kin line in a NARROW card, which is where it has to be composed rather
     than left to wrap. There is about 86px beside a 40px sprite here. Written
     as one string, "Lv26 · Verdant/Gloom" wrapped and left the separator
     stranded ("Lv26 ·"); written as chips — the way every other screen says a
     type — they are wider still, and letting them flow was worse than either:
     the level sat inline on a SHORT name and on its own line on a long one, so
     one row of three cards had three different bar heights, two of them the
     same species at different levels.
     So the level takes a whole line always and the chips share the next one.
     Every card in the grid is the same shape whatever is on it, and a layout
     that depended on how long a name happened to be is gone. */
  .card .info .kinsub{ column-gap:.25em; row-gap:.2em; }
  .card .info .kinsub .lv{ flex-basis:100%; font-size:.58em; }
  .card .info .kinsub .tp{ font-size:.52em; letter-spacing:.5px; padding:1px 4px; }
  /* An empty party slot: the frame without the card. Dashed, unlit and quiet
     enough that six of them never compete with the one kin you do have. */
  .cards .slot{ display:flex; align-items:center; justify-content:center;
    /* A card is a 40px sprite plus 7px of padding either side. Matching that
       here keeps all six slots one shape: without it a slot sharing a row with
       a real kin stretched to its height while a slot on a row of its own
       collapsed to the text, so a party of one drew three tall frames and
       three short ones. */
    min-height:54px; background:none; border-style:dashed;
    border-color:color-mix(in srgb, var(--edge) 55%, transparent);
    box-shadow:none; }
  .cards .slot span{ font-size:.7em; letter-spacing:.16em; text-transform:uppercase;
    color:color-mix(in srgb, var(--dim) 45%, transparent); }
  .card{ display:flex; gap:8px; padding:7px; align-items:center; cursor:pointer; }
  .card.sel{ box-shadow:0 0 0 2px var(--gold), 0 4px 0 rgba(0,0,0,.5); }
  /* Canvases are authored at 1:1 and blown up by an integer factor in CSS so
     the pixels stay square — never resize the backing store to a fraction. */
  .card canvas{ image-rendering:pixelated; flex:0 0 auto; width:80px; height:80px; }
  .card .info{ flex:1; min-width:0; }
  /* The box card is the narrowest thing in the game that takes a name: 74px of
     text beside a 40px sprite on a desktop, 69px on a phone. A twelve-character
     nickname measures 120px, so it ran 46px past its own card — measured with
     scrollWidth against clientWidth rather than judged from a screenshot.
     Ellipsis here, where the stat block wraps: these are grid cells and a name
     that wrapped would make its card a line taller than the five beside it,
     which is the ragged row pass 157 spent three attempts removing. */
  .card .info b{ display:block; font-size:.82em;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .card .info small{ color:var(--dim); font-size:.7em; }
  .card .bar{ height:5px; border-radius:3px; background:#0d0812; margin-top:4px; overflow:hidden; }
  .card .bar > i{ display:block; height:100%; background:var(--hp-good); }
  .chest{ flex:0 0 auto; width:34px; height:28px; border-radius:4px; position:relative;
    background:linear-gradient(180deg,var(--tint),#0000), #2a1f36;
    border:2px solid #1a1222; box-shadow:inset 0 -6px 0 rgba(0,0,0,.35); }
  .chest::before{ content:''; position:absolute; left:-2px; right:-2px; top:7px; height:4px;
    background:#1a1222; }
  .chest::after{ content:''; position:absolute; left:50%; top:5px; width:6px; height:9px;
    margin-left:-3px; border-radius:2px; background:var(--tint); box-shadow:0 0 0 2px #1a1222; }
  .dexgrid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(96px,1fr)); gap:6px; }
  .dexcell{ padding:5px 5px 6px; text-align:center; cursor:pointer; position:relative; }
  .dexcell canvas{ image-rendering:pixelated; width:80px; height:80px; }
  .dexcell b{ display:block; font-size:.7em; margin-top:2px; }
  /* Three states you can tell apart across the room. */
  .dexcell .dexno{ position:absolute; left:6px; top:4px; font-size:.55em; letter-spacing:1px;
    color:var(--dim); font-weight:700; }
  .dexcell.caught{ border-color:color-mix(in srgb,var(--gold) 55%,var(--edge)); }
  .dexcell.caught .dexno{ color:var(--gold); }
  /* A silhouette painted in the outline tone is darker than the panel it sits
     on, which makes "seen" and "never met" look the same. Lift it instead. */
  .dexcell.seen canvas{ filter:brightness(2.6) saturate(.2); opacity:.62; }
  .dexcell.seen b{ color:var(--dim); }
  .dexcell.unseen{ opacity:.5; }
  .dexcell .dexslot{ width:80px; height:80px; display:flex; align-items:center; justify-content:center;
    margin:0 auto; font-size:1.6em; font-weight:700; color:#2f2740;
    border-radius:.4em; background:repeating-linear-gradient(135deg,#171021 0 6px,#1c1428 6px 12px); }
  .tp.blank{ background:#3a3245; color:var(--dim); }
  .dexcell small{ color:var(--dim); font-size:.65em; }

  /* ---------------- the first choice ----------------
     Three cards, laid out the way the reward screen is, because that is the
     shape this game uses for "pick one of these and live with it". */
  #screen .lede{ font-size:.78em; color:var(--dim); margin:-.3em 0 .9em; max-width:34em; }
  /* Room above for the lift, or the chosen card climbs over the line of text
     that told you to choose. */
  .pickrow{ display:grid; grid-template-columns:repeat(auto-fit,minmax(11em,1fr)); gap:.7em;
    max-width:44em; align-items:stretch; padding-top:1em; }
  .pickcard{ padding:.7em .7em .5em; text-align:center; cursor:pointer;
    display:flex; flex-direction:column; align-items:center;
    border-color:color-mix(in srgb,var(--tint) 45%,var(--edge));
    transition:transform .14s cubic-bezier(.2,.9,.3,1.2), box-shadow .14s ease; }
  .pickcard .pportrait{ padding:.35em; border-radius:.45em; margin-bottom:.45em;
    background:radial-gradient(70% 70% at 40% 28%, color-mix(in srgb,var(--tint) 32%,#1a1222), #150e1d);
    border:2px solid color-mix(in srgb,var(--tint) 40%,var(--edge));
    box-shadow:inset 0 0 0 1px rgba(255,255,255,.06); }
  .pickcard .pportrait canvas{ image-rendering:pixelated; width:110px; height:110px; display:block; }
  /* Below a x2 stage the third starter sat almost entirely under the fold — a
     sliver of its top edge, easy to miss. Smaller portraits and tighter padding
     do not make all three fit (that would need cards a quarter of this height)
     but they lift enough of the third card into the frame that it is obviously
     a card rather than an edge. */
  body.tight .pickcard{ padding:.45em .45em .35em; }
  body.tight .pickcard .pportrait canvas{ width:74px; height:74px; }
  body.tight .pickcard .pflavour{ font-size:.72em; }
  .pickcard .pname{ font-size:.95em; font-weight:700; color:var(--tint); letter-spacing:.04em; }
  .pickcard .types{ margin:.3em 0 .5em; }
  .pickcard .pdexline{ font-size:.66em; color:var(--dim); line-height:1.35; margin:0 0 .6em;
    font-style:italic; }
  .pickcard .matchup{ width:100%; margin-top:auto; display:flex; flex-direction:column; gap:.25em;
    font-size:.58em; }
  .pickcard .matchup > div{ display:flex; align-items:center; gap:.3em; justify-content:center;
    flex-wrap:wrap; }
  .pickcard .matchup span{ color:var(--dim); letter-spacing:.08em; text-transform:uppercase; }
  .pickcard .matchup i{ color:var(--dim); }
  .pickcard .ptake{ height:1.2em; margin-top:.5em; font-size:.66em; color:var(--gold); font-weight:700; }
  .pickcard.sel{ transform:translateY(-5%) scale(1.03);
    box-shadow:0 0 0 .16em var(--gold), 0 .5em .5em rgba(0,0,0,.5); }

  /* ---------------- the kin page ----------------
     Roster on the left, whoever is picked on the right. A row of equal cards
     has no hierarchy: nothing on it says which one you are looking at, so
     every card has to carry every fact and none of them can be big. */
  .kinview{ display:grid; grid-template-columns:minmax(14em,20em) minmax(0,1fr); gap:.7em; align-items:start; }
  @media (max-width:640px){ .kinview{ grid-template-columns:1fr; } }
  .kinlist{ display:flex; flex-direction:column; gap:.4em; }
  .kinrow{ display:flex; gap:.5em; align-items:center; padding:.4em .5em; cursor:pointer; }
  .kinrow canvas{ image-rendering:pixelated; flex:0 0 auto; width:44px; height:44px; }
  .kinrow .info{ flex:1; min-width:0; }
  .kinrow .info b{ display:block; font-size:.82em; }
  /* One class, because one function writes it — see kinSub(). The party row and
     the box card both list kin and used to style that line separately, which is
     how they came to say a type two different ways. */
  .kinsub{ display:flex; gap:.25em; align-items:center; margin:.2em 0 .25em; flex-wrap:wrap; }
  .kinsub .lv{ font-size:.62em; color:var(--gold); font-weight:700; letter-spacing:.5px; }
  .kinrow .bar{ height:4px; border-radius:2px; background:#0d0812; overflow:hidden; }
  .kinrow .bar > i{ display:block; height:100%; }
  .kinrow .hpn{ font-size:.72em; color:var(--dim); font-variant-numeric:tabular-nums; }
  .kinrow .hpn small{ font-size:.8em; opacity:.7; }
  .kinrow.sel{ box-shadow:0 0 0 2px var(--gold), 0 4px 0 rgba(0,0,0,.5); }
  .kinrow.down{ opacity:.5; }

  .kindetail{ padding:.8em; }
  .kindetail .portrait{ float:right; margin:0 0 .4em .6em; padding:.35em; border-radius:.4em;
    background:radial-gradient(70% 70% at 40% 30%,#3a2b4a,#1a1222);
    border:2px solid var(--edge); box-shadow:inset 0 0 0 1px rgba(255,255,255,.05); }
  .kindetail .portrait canvas{ image-rendering:pixelated; width:120px; height:120px; display:block; }
  /* The portrait is float:right, and a FLEX container's contents are not line
     boxes — so nothing in here wrapped around it. At a twelve-character
     nickname (the most the field accepts) the level chip was drawn on top of
     the portrait frame. `overflow:hidden` makes this a formatting context of
     its own, which does keep clear of the float, and the ellipsis catches a
     name still too wide for whatever is left. */
  .kindetail .pname{ display:flex; flex-wrap:wrap; align-items:baseline; gap:.5em;
    overflow:hidden; }
  .kindetail .pname b{ font-size:1.05em; min-width:0; overflow-wrap:anywhere; }
  .kindetail .pname .lv{ flex:0 0 auto; }
  .kindetail .pname .lv{ font-size:.72em; color:var(--gold); font-weight:700; }
  .kindetail .sub{ display:flex; gap:.25em; margin:.35em 0 .7em; }
  /* A bar answers "is this one fast?" before you have read the number. */
  .statrow{ display:grid; grid-template-columns:4.6em minmax(0,1fr) 4.4em; gap:.6em;
    align-items:center; margin:.25em 0; font-size:.72em; }
  .statrow > span{ color:var(--dim); letter-spacing:.08em; text-transform:uppercase; }
  .statrow > b{ text-align:right; font-variant-numeric:tabular-nums; }
  .statrow > b small{ opacity:.6; font-size:.85em; }
  .statrow.big{ font-size:.8em; }
  .statrow.xp{ margin-top:.5em; }
  .sbar{ height:.55em; border-radius:.3em; background:#0d0812; overflow:hidden;
    box-shadow:inset 0 1px 2px rgba(0,0,0,.6); }
  .sbar > i{ display:block; height:100%; border-radius:.3em;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.28); }

  .movelist{ display:grid; grid-template-columns:repeat(auto-fill,minmax(9.5em,1fr)); gap:.4em;
    margin-top:.9em; clear:both; }
  .movecard{ padding:.4em .5em; border-radius:.4em; border-left:.22em solid var(--tint);
    background:linear-gradient(180deg,#241b30,#171021); }
  .movecard .mtop{ display:flex; justify-content:space-between; align-items:baseline; gap:.4em; }
  .movecard .mtop b{ font-size:.76em; color:var(--tint); }
  .movecard .cost{ font-size:.62em; color:var(--gold); font-weight:700; }
  .movecard .mbody{ display:flex; justify-content:space-between; gap:.4em;
    font-size:.64em; color:var(--dim); margin-top:.1em; }
  .movecard .pp.low{ color:var(--hp-bad); }
  .movecard .eff{ font-size:.85em; letter-spacing:.06em; }
  .movecard.eff-good{ border-left-color:var(--hp-good); }
  .movecard.eff-good .eff{ color:var(--hp-good); }
  .movecard.eff-bad .eff, .movecard.eff-none .eff{ color:var(--hp-bad); }
  .movecard.eff-none{ opacity:.6; }
  .movecard .mbar{ height:3px; border-radius:2px; background:#0d0812; margin-top:.3em; overflow:hidden; }
  .movecard .mbar > i{ display:block; height:100%; background:var(--tint); opacity:.75; }

  /* ---------------- the bag ----------------
     Grouping is what turns a list into a bag: you go looking for "an orb",
     not for "the fourth row". */
  #screen h3.shelf{ margin:.9em 0 .35em; font-size:.68em; letter-spacing:.16em;
    text-transform:uppercase; color:var(--dim); font-weight:700; }
  #screen h3.shelf:first-of-type{ margin-top:.2em; }
  .items{ display:grid; grid-template-columns:repeat(auto-fill,minmax(15em,1fr)); gap:.4em; }
  .item{ display:flex; gap:.55em; align-items:center; padding:.45em .55em; cursor:pointer; }
  .item canvas{ image-rendering:pixelated; flex:0 0 auto; width:40px; height:40px; }
  /* The row carries a name, a description and up to two tallies, and on a phone
     the shelf is two columns of about 180px. The tallies do not shrink, so the
     kin-and-HP one added with the field bag ate the description: "Wakes a
     fainted kin at half HP." came out as a six-line column one word wide.
     Letting the row wrap puts the tallies on their own line exactly when there
     is no room for them beside the text, at whatever width that happens to be,
     instead of guessing a breakpoint. The basis is the claim being made: give
     the description about six characters' worth of room before giving up and
     wrapping. Too greedy a basis (8em was the first try) wraps a desktop row
     that had plenty of space, which the phone shot cannot show you. */
  .item{ flex-wrap:wrap; }
  .item .info{ flex:1 1 6em; min-width:0; }
  .item .info b{ display:block; font-size:.8em; }
  .item .info small{ display:block; color:var(--dim); font-size:.66em; line-height:1.25; }
  .item .tally{ font-size:.86em; color:var(--gold); font-weight:700; font-variant-numeric:tabular-nums; }
  .item .tally small{ font-size:.6em; color:var(--dim); margin-left:.15em; }
  .item.sel{ box-shadow:0 0 0 2px var(--gold), 0 4px 0 rgba(0,0,0,.5); }
  .item.dead{ opacity:.45; }
  /* A chest is a distribution you are buying, so the odds are a shape rather
     than four percentages to compare in your head. */
  .chestrow .oddsbar{ display:flex; height:.42em; border-radius:.21em; overflow:hidden;
    margin:.3em 0 .25em; background:#0d0812; box-shadow:inset 0 1px 2px rgba(0,0,0,.6); }
  .chestrow .oddsbar i{ display:block; height:100%; }
  /* The odds line is a list, so it must break BETWEEN its items and never
     inside one — "45%" on one line and "epic" on the next is a different claim.
     nowrap on the whole line stated the second half and forgot the first: at
     980px the Prism row (widest price, so narrowest info column) ran its odds
     13px past the card edge with nowhere legal to break. Per-item nowrap plus a
     separator glued to the item before it wraps only where it should, and a
     wrapped line still opens with a number rather than a stray dot. */
  .chestrow .info small{ font-size:.6em; letter-spacing:.02em; }
  .chestrow .info small span{ white-space:nowrap; }
  .items.wide{ grid-template-columns:repeat(auto-fill,minmax(18em,1fr)); }
  .chestrow .chest{ box-shadow:inset 0 -6px 0 rgba(0,0,0,.35), 0 0 .7em color-mix(in srgb,var(--tint) 40%,transparent); }
  /* A type row had no wrap rule, so at a dex cell's width the longest pair —
     VERDANT + GLOOM — laid its second chip 8px past the cell and painted over
     the neighbour's. A chip is a word: it can move to the next line but it
     cannot be cut in half, and nothing in this row should ever be read as
     belonging to the creature beside it. */
  .types{ display:flex; flex-wrap:wrap; gap:4px; justify-content:center; margin-top:3px; }
  .hud .types{ justify-content:flex-start; margin:3px 0 1px; }
  .hud .tp{ font-size:.55em; padding:0 4px; }
  /* Below a x2 stage the HUD stops being proportional to the arena. The panel
     text is em-based off the stage font, which clamps at 11px for legibility, so
     on a half-size stage the panels are getting on for twice the share of the
     frame they take at x3 — and the pair of them plus the message box cover the
     ground the fight is happening on. Photographed at a phone's aspect, it is
     the same fault the title screen had: a composition that only worked at one
     window.

     The text does not shrink — that is what the clamp is protecting. The panel
     gives up its padding and its type badges instead. An element's type is on
     the creature and in the move menu; it is the one thing here that is said
     twice. */
  body.tight .hud{ padding:3px 5px 4px; width:47%; }
  body.tight .hud .tp{ display:none; }
  body.tight .hud .bar{ height:6px; margin-top:3px; }
  /* Clear of the action row, which is pinned at 54%. At 40% the panel's own
     height — taller in proportion on a small stage, because the text clamps at
     11px — ran its HP figure straight under the End turn button. */
  body.tight #hudMine{ top:32%; }
  /* While the orb is deciding, the panels step back with the world. They are
     the layer a canvas vignette cannot touch, and on a phone the player's own
     plate sits exactly over where the orb rests. Not hidden — a fight whose
     state you cannot read is a different kind of wrong — and back at full by
     the time it clicks. */
  #hudFoe, #hudMine, #acts, #intent, #piles, #energy, #battlebar,
  #dialogue, #toast{ transition:opacity .3s ease; }
  /* The bars slide in to hide a transition, and hid the world and nothing else.
     Measured: every battle panel is up at full strength ONE FRAME into the
     wipe — 0.53s of the 0.55s — so both HUDs, the intent chip, the whole card
     row and the action buttons sat over the closing bars and the map you were
     still walking on. A film could not show it; a film grabs the canvas and the
     panels are DOM, which is the same reason the fight's intent chip outlived
     its foe unnoticed until 169.
     They arrive with the arena instead. The .3s ease above means they come up
     as the bars retract rather than snapping in behind them.

     `#dialogue` is in the list and was not on the first attempt — six panels
     named and the seventh missed, which is the fault this project has now found
     in its own work four passes running. Shot at peak cover, it was the only
     thing left on the screen: the fight's opening line and the aimed card's
     text, floating over the closing bars. Whatever it says at that moment
     belongs either to the fight nobody has been shown yet or to the world being
     wiped away. */
  body.wiping #hudFoe, body.wiping #hudMine, body.wiping #acts,
  body.wiping #intent, body.wiping #piles, body.wiping #energy,
  body.wiping #battlebar, body.wiping #dialogue, body.wiping #toast{ opacity:0; }
  body.hushing #hudFoe, body.hushing #hudMine, body.hushing #acts,
  body.hushing #intent, body.hushing #piles, body.hushing #energy{ opacity:.18; }
  /* The hand cannot hold four rules-text blocks at this size: at 30% of a
     310px stage the cards are 86px tall and the text clipped into its own
     rarity pip on every one of them. So a card you are not aiming at shows its
     art, its name and its cost — which is what you choose between — and the
     card you ARE aiming at keeps its text, with the full wording also sitting
     in the description bar directly above the hand. Nothing is lost; it is
     read one place instead of five. */
  body.tight #hand{ height:28%; }
  body.tight #hand .cardel:not(.sel) .ctext{ display:none; }
  body.tight #hand .cardel:not(.sel) .cname{ margin-top:.35em; }
  body.tight #hand .cardel .cpip{ font-size:.4em; }
  /* The big cards — the deck screen, the reward, the swap — clip their own
     rules text at a phone's scale. `.cardel.big` is 11.4em tall with the art
     taking 40% of it plus a 1em margin, and at 11px there is not room left for
     a second line: "Every attack +2 for this battle" came out with the word
     "battle" sliced in half across the card's bottom edge.
     The room comes off the picture rather than off the type, because the type
     is already at .56em and the picture is the part that survives being
     smaller. This is scoped to the CARD, not to a screen: the same component
     is used on the deck, the reward and the swap, and the last two passes were
     both about a fix that reached one place and not the others. */
  body.tight .cardel.big .cart{ height:32%; margin-top:.5em; }
  /* The rule above hid the text on the four cards you are NOT aiming at, and
     left it on the one you are — which is the only card that also carries the
     "▲ play" badge. `.cp` is absolutely positioned at bottom:.9em, so on a
     phone, where the aimed card's wording runs to three lines, the badge was
     drawn straight through the last of them. Four cards out of five had been
     fixed and the fifth kept the collision, invisible because no phone shot
     existed to show it.
     Three attempts, and the two failures are the useful part. padding-bottom
     reserved nothing — `.ctext` clips with overflow:hidden and overflow clips
     at the PADDING edge, so the text painted through it and the picture came
     back identical. Hiding the text outright looked best of all, and was
     wrong: the description bar above the hand is the stated fallback, but
     renderHand only fills it while the battle's own line timer is at zero, so
     during any action line the wording would have been nowhere at all.
     Smaller type in reserved space keeps it on the card at every moment. */
  body.tight #hand .cardel.sel .ctext{ font-size:.5em; line-height:1.15; margin-bottom:1.1em; }
  /* No E key on a phone, and the button is a button there. Same fault as the
     screens naming A and X, in the one place that is not a screen. */
  body.touch #acts .abtn .key{ display:none; }
  .tp{ font-size:.58em; letter-spacing:1px; text-transform:uppercase; padding:1px 5px; border-radius:3px; color:#120d18; font-weight:700; }

  /* ---------------- title ---------------- */
  /* The title used to be a small framed picture floating in the middle of the
     stage, with a third of the bezel empty above it and a third empty below.
     Nothing in a title screen should be a picture ON the screen — it should BE
     the screen. The illustration is the backdrop now, at the game's own
     resolution so it scales by the same integer factor as the valley does, and
     the words sit on it: the logo against the sky, the kin on the ground
     between, the button on the near soil. */
  #title{ position:absolute; inset:0; z-index:12; display:flex; flex-direction:column;
    align-items:center; justify-content:space-between; text-align:center;
    padding:5% 16px 5.5%; overflow:hidden; border-radius:4px;
    background:radial-gradient(120% 90% at 50% 20%,#3a1c3f,#0c0812 70%); }
  #titleArt{ position:absolute; inset:0; width:100%; height:100%;
    image-rendering:pixelated; z-index:0; }
  #title .tgroup{ position:relative; z-index:1; display:flex; flex-direction:column;
    align-items:center; gap:7px; }
  /* When there is a run to come back to, Continue leads.
     `New journey` calls wipeSave(). It sat ABOVE Continue in reading order, in
     identical weight and colour, on the screen a returning player sees every
     session — and the keyboard already disagreed with the layout, because
     pressing A on the title runs startCont whenever a save exists. The order
     follows the key now, and the button that destroys a run stops presenting
     itself as the thing you came here to do. */
  #title.returning [data-act="cont"]{ order:-1; }
  #title.returning [data-act="new"]{ opacity:.55; font-size:clamp(10px,1.05em,13px); }
  #title.returning [data-act="new"]:hover{ opacity:1; }
  /* The logo carries weight: a hard dark rim so it reads against the sunset,
     a warm drop under it, and a glow that spills the way the sun does. */
  #title h1{ margin:0; font-size:clamp(24px,3.7em,56px); letter-spacing:8px; color:var(--gold);
    text-shadow:
      -2px 0 0 #2a1b2e, 2px 0 0 #2a1b2e, 0 -2px 0 #2a1b2e, 0 2px 0 #2a1b2e,
      0 5px 0 #7a3f13, 0 8px 14px rgba(0,0,0,.6), 0 0 34px rgba(255,201,77,.5); }
  #title p > span{ white-space:nowrap; }
  #title p{ margin:0; color:var(--dim); font-size:clamp(9px,1.05em,13px);
    letter-spacing:2px; text-transform:uppercase;
    text-shadow:0 1px 3px rgba(6,3,10,.9), 0 0 10px rgba(6,3,10,.8); }
  #title p.keys{ font-size:clamp(8px,.85em,11px); letter-spacing:1px; text-transform:none; }
  #title .btn{ padding:9px 22px; font-size:clamp(11px,1.25em,15px); cursor:pointer; letter-spacing:1px;
    transition:transform .12s ease, box-shadow .12s ease, color .12s ease; }
  #title .btn:hover{ color:var(--gold); border-color:var(--gold); transform:translateY(-2px);
    box-shadow:0 6px 0 rgba(10,6,16,.6), 0 0 18px rgba(255,201,77,.35); }
  /* Below a x2 stage the words and the picture cannot both have the room: five
     lines of text wrap to eight and the button lands on the kin's belly. The
     key hints are the part a player can find again in the menu, so they are the
     part that goes. */
  body.tight #title{ padding:3% 10px 4%; }
  body.tight #title p{ letter-spacing:1px; }
  body.tight #title p.keys{ display:none; }

  /* ---------------- touch controls ---------------- */
  /* ---------------- touch controls ----------------
     The pad and the buttons live outside the stage so they can take the
     margins the game does not use — the left gutter in landscape, the band
     under the stage in portrait — and only overlay the game when there is
     nowhere else for them to go. */
  /* Portrait puts the game at the top so the band underneath is all controls. */
  body.topalign{ align-items:flex-start; padding-top:4vh; }
  #pad, #btns{ position:fixed; z-index:20; display:none; touch-action:none; user-select:none; }
  body.touch #pad, body.touch #btns{ display:block; }

  body.ctl-side #pad{ left:0; top:0; bottom:0; width:var(--gutter,120px); }
  body.ctl-side #btns{ right:0; top:0; bottom:0; width:var(--gutter,120px); }
  body.ctl-below #pad{ left:0; width:50%; bottom:0; top:var(--stagebot,60%); }
  body.ctl-below #btns{ right:0; width:50%; bottom:0; top:var(--stagebot,60%); }
  body.ctl-overlay #pad{ left:0; bottom:0; width:36%; height:46%; }
  body.ctl-overlay #btns{ right:0; bottom:0; width:30%; height:34%; }

  /* The stick is wherever your thumb lands, not where the layout guessed. */
  #stick{ position:absolute; width:120px; height:120px; margin:-60px 0 0 -60px; border-radius:50%;
    border:2px solid var(--edge); background:rgba(30,22,40,.45); opacity:0; transition:opacity .12s;
    pointer-events:none; }
  #stick.on{ opacity:.9; }
  #knob{ position:absolute; left:50%; top:50%; width:52px; height:52px; margin:-26px 0 0 -26px;
    border-radius:50%; background:linear-gradient(180deg,#4a3560,#241a2e); border:2px solid var(--gold);
    box-shadow:0 0 12px rgba(255,201,77,.3); }
  body.touch #pad::after{ content:'move'; position:absolute; left:0; right:0; bottom:8%;
    text-align:center; font-size:12px; letter-spacing:2px; color:#4a3560; text-transform:uppercase; }

  #btns .rbtn{ position:absolute; left:50%; width:82px; height:82px; margin-left:-41px;
    border-radius:50%; background:linear-gradient(180deg,#2b2038,#171021); border:2px solid var(--edge);
    display:flex; align-items:center; justify-content:center; font-size:14px; font-weight:700;
    letter-spacing:.5px; color:var(--ink); box-shadow:0 4px 0 rgba(0,0,0,.5); }
  #btns .rbtn:active{ transform:translateY(2px); box-shadow:0 2px 0 rgba(0,0,0,.5); }
  #btns .rbtn[data-k="z"]{ bottom:calc(50% - 96px); border-color:var(--gold); color:var(--gold); }
  #btns .rbtn[data-k="x"]{ bottom:calc(50% + 10px); }
  /* Portrait: put the controls in the middle of the band, not at its floor.
     The two buttons are 82px and were placed at 26% and 68% of a band that is
     half the window wide, so their centres sit 0.21 * vw apart — which is less
     than 82px on any window under about 390. They overlapped each other and
     the outer one ran off the screen, and that is not an exotic size: an
     iPhone SE is 375. Nobody had seen it because every phone shot so far was
     taken at exactly 390.
     Sized from the window instead, capped at the old 82px so nothing changes
     on a roomy phone, and centred with a transform so the offsets cannot go
     stale the way the overlay layout's did when its buttons were shrunk. */
  body.ctl-below #btns .rbtn{
    width:min(82px, 22vw); height:min(82px, 22vw);
    bottom:auto; top:50%; margin-left:0; margin-top:0;
    transform:translate(-50%, -50%); }
  body.ctl-below #btns .rbtn:active{ transform:translate(-50%, calc(-50% + 2px)); }
  body.ctl-below #btns .rbtn[data-k="z"]{ left:75%; }
  body.ctl-below #btns .rbtn[data-k="x"]{ left:25%; }
  body.ctl-below #pad::after{ bottom:auto; top:calc(50% - 8px); }
  /* Overlay is the layout for a landscape phone too narrow to spare a gutter,
     and it had never been photographed. The buttons were shrunk to 64px here
     and given no vertical offsets of their own, so they kept the ones written
     for an 82px pair in a full-height column: bottom:calc(50% - 96px) inside a
     box 34% of 390px tall is -30px, and the Play button — the one you press
     every turn — was hanging off the bottom of the screen.
     Side by side, like the portrait band does it, because the box is wider
     than it is tall. */
  body.ctl-overlay #btns .rbtn{ width:64px; height:64px; margin-left:-32px; font-size:12px;
    bottom:14px; }
  body.ctl-overlay #btns .rbtn[data-k="z"]{ left:72%; }
  body.ctl-overlay #btns .rbtn[data-k="x"]{ left:28%; }
  /* And the pad's label sits at the foot of the pad, which in this layout is
     the middle of the hand — "move" was printed across the card you were
     aiming at. Moving it to the top of the pad fixed the battle and only the
     battle: a screen panel is inset:0 over the whole stage, so in overlay
     there is no height at which the label is not sitting on somebody's kin.
     It went from the aimed card to the middle of the party list.
     This is the one layout where the pad has no band of its own, so the label
     goes. The pad still works — it is a "stick lands where your thumb does"
     zone, not a drawn control — and the two buttons are labelled in the open. */
  body.ctl-overlay #pad::after{ display:none; }
  /* The buttons are 34% of the height in the bottom-right corner and the pad
     46% in the bottom-left, so on a full-screen panel the last row of whatever
     you are choosing from sits underneath them. The scroller gets a floor deep
     enough to lift that row clear — the usual answer to content under a fixed
     bar, and the alternative is a card you can see and cannot press. */
  body.ctl-overlay #screen{ padding-bottom:48%; }
  /* The buttons still sat on the last card of the fan — the one you would
     tap, with a control on top of it. The hand keeps clear of the button
     column instead: it is a fan, so it closes up rather than losing a card. */
  body.ctl-overlay #hand{ left:2%; right:26%; }

  /* Fullscreen: a corner button, out of the way until you want it. */
  #fsbtn{ position:fixed; right:8px; top:8px; z-index:22; width:34px; height:34px; border-radius:8px;
    background:rgba(36,26,46,.75); border:2px solid var(--edge); color:var(--dim);
    display:flex; align-items:center; justify-content:center; font-size:17px; cursor:pointer; }
  #fsbtn:hover{ color:var(--gold); border-color:var(--gold); }
  body.fs #fsbtn{ color:var(--gold); }

  #toast{ position:absolute; left:50%; top:27%; transform:translateX(-50%); z-index:11; padding:6px 14px;
    font-size:.82em; letter-spacing:1px; opacity:0; transition:opacity .25s; pointer-events:none; }
  #toast.on{ opacity:1; }
</style>
</head>
<body class="notouch">
<div id="stage">
  <canvas id="view" width="256" height="208"></canvas>

  <div id="hudFoe" class="hud panel hidden"></div>
  <div id="hudMine" class="hud panel hidden"></div>

  <div id="intent" class="panel hidden"></div>
  <div id="battlebar" class="hidden">
    <div id="energy" class="panel"><b>3</b><small>/3</small></div>
    <div id="piles" class="panel"></div>
    <div id="acts"></div>
    <div id="hand"></div>
  </div>

  <div id="dialogue" class="panel hidden"></div>
  <div id="mainmenu" class="menu panel hidden"></div>
  <div id="battlemenu" class="menu panel hidden"></div>
  <div id="movemenu" class="menu panel hidden"></div>
  <div id="screen" class="hidden"></div>
  <div id="toast" class="panel"></div>


  <div id="title">
    <canvas id="titleArt" width="256" height="208"></canvas>
    <div class="tgroup">
      <h1>EMBERKIN</h1>
      <!-- The two halves are the line. Each is held together so the only place
           it can break is the separator between them: at a phone's width it
           wrapped as "armed enough to / respect one", which orphans half a
           clause and loses the balance the line is made of. -->
      <p><span>cute enough to want one</span> · <span>armed enough to respect one</span></p>
    </div>
    <div class="tgroup">
      <div class="btn panel" data-act="new">New journey</div>
      <div class="btn panel hidden" data-act="cont">Continue</div>
      <p class="keys">arrows / WASD move · Z or Enter acts · X opens the menu · M mutes</p>
      <p class="keys">in a fight: ← → pick a card · ↑ or Z plays it · 1-5 plays one outright · E ends the turn</p>
    </div>
  </div>
</div>

<div id="pad"><div id="stick"><i id="knob"></i></div></div>
<div id="btns">
  <div class="rbtn" data-k="x">Menu</div>
  <div class="rbtn" data-k="z">Talk</div>
</div>
<div id="fsbtn" title="Fullscreen">⛶</div>

/* ============================================================ §1 — core ==
   Tiny helpers, the global game state G, and the save file. Everything below
   reads state from G; nothing keeps a second copy.
   ======================================================================== */
const HEADLESS = typeof window !== 'undefined' && !!window.__EK_HEADLESS__;
const SAVE_KEY = 'emberkin_save_v1';

const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const rnd = (n) => Math.floor(Math.random() * n);           // 0..n-1
const rrange = (a, b) => a + rnd(b - a + 1);                 // inclusive
const chance = (p) => Math.random() < p;

// The whole game lives here. `mode` drives the input router and the renderer.
const G = {
  mode: 'title',           // title | world | battle | screen | dialogue
  t: 0, dt: 0,
  map: null, mapId: '',
  player: { x: 5, y: 8, dir: 'down', px: 5, py: 8, moveT: 0, moveLen: 1, step: 0, bump: 0, hop: false },
  fade: 0, wipe: 0, warp: null, evoAnim: null, alert: null, flourish: null, prevMode: 'world',
  party: [], box: [], bag: {}, money: 500, gems: 0,
  cards: [], deck: [], nextUid: 0, chestsOpened: 0,
  dex: {},                 // id -> 1 seen, 2 caught
  // Where you have been. Four people in this valley exist to point somewhere,
  // and a signpost that keeps pointing after you have arrived is worse than no
  // signpost — see the npc lines that read this.
  been: {},                // mapId -> 1 once you have stood in it
  flags: {},               // story progress
  battle: null,
  dialogue: null,
  screen: null,
  menu: null,
  toastT: 0,
  toast: '',
  steps: 0, playtime: 0, wins: 0, caught: 0,
};

// The message is kept on G as well as pushed at the DOM, because until now the
// only copy of it lived in an element the headless suites do not have — so a
// toast could say anything at all and nothing outside a photograph could tell.
// Four call sites share one wording here; that is exactly the kind of agreement
// that drifts, and it needs to be readable to be checked.
const setToast = (msg) => {
  G.toastT = 2.2;
  G.toast = msg;
  if (!HEADLESS) { const el = document.getElementById('toast'); el.textContent = msg; el.classList.add('on'); }
};

// ---- save / load -------------------------------------------------------
// One JSON blob. Creatures are stored lean (species + level + hp + moves +
// xp) and rehydrated through mkMon so a stat formula change never needs a
// save migration.
function saveGame() {
  const packMon = (m) => ({ s: m.species, l: m.lvl, hp: m.hp, xp: m.xp, mv: m.moves.map((x) => [x.id, x.pp]), nm: m.nick || '', st: m.status || '' });
  const blob = {
    v: 2, map: G.mapId, x: G.player.x, y: G.player.y, dir: G.player.dir,
    party: G.party.map(packMon), box: G.box.map(packMon),
    bag: G.bag, money: G.money, gems: G.gems, dex: G.dex, been: G.been, flags: G.flags,
    cards: G.cards.map((c) => [c.u, c.id, c.plus, c.plays, c.kills]),
    deck: G.deck, uid: G.nextUid, chests: G.chestsOpened, might: G.might || 0,
    steps: G.steps, playtime: Math.round(G.playtime), wins: G.wins, caught: G.caught,
  };
  try { localStorage.setItem(SAVE_KEY, JSON.stringify(blob)); return true; }
  catch (e) { return false; }
}

function hasSave() {
  try { return !!localStorage.getItem(SAVE_KEY); } catch (e) { return false; }
}

function loadGame() {
  let blob;
  try { blob = JSON.parse(localStorage.getItem(SAVE_KEY) || 'null'); } catch (e) { blob = null; }
  if (!blob || !blob.party) return false;
  // Where you were last announced is a fact about a run, not about the browser.
  // It is deliberately not in the save blob — but it does have to be forgotten
  // when one run is swapped for another, or picking up a save in the same place
  // a previous run had already been arrives in silence.
  G.placeSeen = null; G.place = null;
  const unpack = (p) => {
    const m = mkMon(p.s, p.l);
    if (!m) return null;
    m.hp = clamp(p.hp, 0, m.max); m.xp = p.xp || 0;
    m.nick = p.nm || ''; m.status = p.st || '';
    if (Array.isArray(p.mv) && p.mv.length) {
      m.moves = p.mv.filter((x) => MOVES[x[0]]).map((x) => ({ id: x[0], pp: x[1], max: MOVES[x[0]].pp }));
    }
    return m;
  };
  G.party = (blob.party || []).map(unpack).filter(Boolean);
  G.box = (blob.box || []).map(unpack).filter(Boolean);
  G.bag = blob.bag || {}; G.money = blob.money ?? 500; G.gems = blob.gems ?? 0;
  // Cards carry their own permanent growth, so they round-trip per copy.
  G.cards = (blob.cards || []).filter((c) => CARDS[c[1]])
    .map((c) => ({ u: c[0], id: c[1], plus: c[2] || 0, plays: c[3] || 0, kills: c[4] || 0 }));
  G.nextUid = blob.uid || G.cards.reduce((m, c) => Math.max(m, c.u), 0);
  G.deck = (blob.deck || []).filter((u) => G.cards.some((c) => c.u === u));
  G.chestsOpened = blob.chests || 0;
  G.might = blob.might || 0;                 // permanent damage, earned card by card
  if (!G.cards.length) { STARTER_DECK.forEach(grantCard); }
  // A save written before anyone was keeping track loads with an empty `been`,
  // and enterMap below immediately marks wherever that run is standing. So the
  // worst an old save costs is a signpost or two offered again to somebody who
  // has already been, and it heals itself the next time they walk there.
  G.dex = blob.dex || {}; G.been = blob.been || {}; G.flags = blob.flags || {};
  G.steps = blob.steps || 0; G.playtime = blob.playtime || 0;
  G.wins = blob.wins || 0; G.caught = blob.caught || 0;
  enterMap(blob.map || 'hollowbrook', blob.x ?? 5, blob.y ?? 8, blob.dir || 'down');
  return G.party.length > 0;
}

 * it must not do is decide the fight before a card is played — and at a straight

 * into with the element was lost 6% of the time and never in doubt 69% of the

/**
 * Items wear the same 20×20 glyphs the cards do, so an orb in the bag and an
 * orb on a card are the same object rather than a name and a picture of one.
 * Grouped by what they are for, because a bag sorted by nothing is a list.
 */
const ITEM_ART = (k) => `item_${k}`;
const ITEM_GROUP = { orb: 'Orbs', heal: 'Salves', revive: 'Salves', draw: 'In a fight' };
const GROUP_ORDER = ['Orbs', 'Salves', 'In a fight'];
/**
 * What a bag item would do if you picked it right now, standing in the field.
 *
 * Out of a fight an item has to find its own target, and the screen never said
 * which — you pressed A on a Salve and a toast afterwards told you who had
 * drunk it. Four of the seven things in a full bag cannot be used out here at
 * all, and they were drawn exactly like the three that can, with the cursor
 * parked on one of them.
 *
 * Both the row and `screenSelect` read this one function, so the row cannot
 * promise something the button then refuses. They were two separate readings
 * of the same rules, and the screen's reading was simply missing.
 */
function fieldItemUse(id) {
  const it = ITEMS[id];
  if (!it) return { ok: false, why: 'Nothing to use.', target: null };
  if (it.kind === 'orb') return { ok: false, why: 'Save those for the wild.', target: null };
  if (it.kind === 'draw') return { ok: false, why: 'Save that for a battle.', target: null };
  const target = G.party.find((m) => (it.kind === 'revive' ? m.hp <= 0 : m.hp < m.max)) || G.party[0];
  if (!target) return { ok: false, why: 'Nobody to use it on.', target: null };
  if (it.kind === 'heal' && target.hp >= target.max) return { ok: false, why: 'Nobody needs that.', target: null };
  if (it.kind === 'revive' && target.hp > 0) return { ok: false, why: 'Nobody is down.', target: null };
  return { ok: true, why: '', target };
}

/** Items in shelf order: grouped, and in the order they are listed above. */
function shelve(keys) {
  const order = Object.keys(ITEMS);
  const groups = new Map(GROUP_ORDER.map((g) => [g, []]));
  for (const k of [...keys].sort((a, b) => order.indexOf(a) - order.indexOf(b))) {
    const g = ITEM_GROUP[(ITEMS[k] || {}).kind] || 'In a fight';
    groups.get(g).push(k);
  }
  return [...groups].filter(([, list]) => list.length);
}

/* ============================================================ §2b — cards ==
   A battle is played from a deck with two halves. The active kin contributes
   its own moves as cards — those are the attacks, and they are the ONLY thing
   in the game that deals damage. Everything in your own deck is support: it
   makes the kin's attacks land harder, more often, or with something nasty
   riding along. A support card that dealt damage by itself would make the kin
   an accessory to the deck, and it is meant to be the other way round.

   Every card has one growable number, `v`, and `vt` says what that number is.
   Growth is the point of the system:
     grow    — permanent, kept in the save, the card gets stronger forever
     bgrow   — grows while the battle lasts, resets after
     kill    — permanent, but only when the attack after it lands a kill
     exhaust — one use, then out of the deck for the rest of the battle

   What a support card can do, by `vt`:
     edge    — the NEXT attack hits for +v. Spend it on the right move.
     atk     — +v damage on every attack for the rest of the battle
     might   — +v damage on every attack, for ever, saved with the run
     shield  — soak v damage this round
     def     — take v less from every hit for the rest of the battle
     heal    — heal v      maxhp — +v maximum HP for the battle
     draw    — draw v      energy — +v energy (once, or every turn for a power)
   and `fx` riders: `st` puts a status on everything you hit, `hits` gives your
   attacks extra swings, `mul` multiplies their damage, `thorns` answers back.
   ======================================================================== */
