  // to a sliver without ever passing through full. The one thing an XP bar
  // exists to show was the one thing it never showed.
  //
  // The span at level 20 is ~1000 XP against ~70 at level 5, so the epsilon
  // scales with the span instead of the flat .6 the HP bars use.
  if (!Number.isFinite(b.dispXp)) b.dispXp = b.tgtXp = b.mine.xp;
  {
    const lv = b.barLv || b.mine.lvl;
    const eps = Math.max(1, (xpFor(lv + 1) - xpFor(lv)) * .01);
    b.dispXp = Math.abs(b.tgtXp - b.dispXp) < eps
      ? b.tgtXp : b.dispXp + (b.tgtXp - b.dispXp) * Math.min(1, dt * 4);
  }
  renderHUD();
  if (b.lineT > 0 && !b.log) {
    b.lineT -= dt;
    // When the message fades, the line goes back to explaining the aimed card.
    if (b.lineT <= 0) renderHand();
  }

  if (G.battleMsg) {
    if (justPressed('a') || justPressed('b')) advanceDialogue();
    return;
  }
  if (G.menu) { menuInput(); return; }
  if (G.screen) { screenInput(); return; }

  // ---- playing back what just happened
  if (b.log && b.li < b.log.length) {
    b.hold = Math.max(0, (b.hold || 0) - dt);
    // "Settled" gates the next line on the HP bars catching up. A bar that can
    // never catch up — a NaN from anywhere upstream — would gate it for ever and
    // hang the fight with the bar on screen and no way out, so a bar that is not
    // a real number counts as settled rather than as a wall.
    const done = (cur, tgt) => !(Number.isFinite(cur) && Number.isFinite(tgt)) || Math.abs(cur - tgt) < 1;
    // The XP bar gates the next line too, so "grew to level 6!" lands after the
    // bar has actually reached the top rather than alongside it. Cause, then
    // effect. Costs nothing in an ordinary turn: xp only moves on a foe going
    // down, so every other line finds this already settled.
    const settled = done(b.dispM, b.tgtM) && done(b.dispF, b.tgtF) && done(b.dispXp, b.tgtXp);
    if (b.li === 0 && !b.started) { b.started = true; playbackStep(); return; }
    if (orbBusy) return;                    // the orb is still in the air
    if ((justPressed('a') || b.hold <= 0) && settled) {
      b.li++;
      if (b.li < b.log.length) playbackStep();
      else if (!HEADLESS) show(els.dialogue, false);
    }
    return;
  }
  if (b.log) { b.log = null; b.started = false; renderHand(); }

  // The level gets the screen to itself, the same way it already gets the
  // sprite to itself.
  //
  // `b.flashM = 0; b.lungeM = 0; b.recoilM = 0` and the crit burst are cleared
  // when a level lands, under a comment that says why: two beats running at
  // once are indistinguishable, and the one that has not been read yet wins.
  // The rule was written and then applied to everything that came BEFORE the
  // level and to nothing that comes after. Measured: the rings run 3.50s to
  // 4.30s and the victory flourish started at 3.90s — so half the beat was
  // drawn underneath a field of gold motes rising in the same colour, which on
  // film is not a level-up at all.
  //
  // Waiting costs at most LVL_T (0.8s) and only on the fights that levelled,
  // which is the one case where the player has something extra to look at.
  // `lvT` decays every frame unconditionally, so this cannot stall.
  if (b.over) {
    if (b.lvT > 0) return;
    if (!b.finishing) { b.finishing = true; finishBattle(); }
    return;
  }
  if (G.dialogue) return;

  // ---- the player's turn: pick a card, play it, or end the turn
  //
  // Left/right walks the hand, up or A plays the card you are on — pushing it
  // forward, the way you would with a real one. 1-5 plays a card outright.
  // E ends the turn and X opens everything that is not a card. Nothing here
  // needs remembering: the buttons under the hand say the same thing.
  if (b.hand.length) b.sel = clamp(b.sel || 0, 0, b.hand.length - 1);
  let moved = false;
  if (justPressed('left')) { b.sel = (b.sel + b.hand.length - 1) % Math.max(1, b.hand.length); moved = true; }
  if (justPressed('right')) { b.sel = (b.sel + 1) % Math.max(1, b.hand.length); moved = true; }
  for (let n = 1; n <= 9; n++) {
    if (justPressed(String(n)) && b.hand[n - 1]) { b.sel = n - 1; playSelected(); return; }
  }
  if (justPressed('a') || justPressed('up')) { playSelected(); return; }
  if (justPressed('e') || justPressed('E')) { doEndTurn(); return; }
  if (justPressed('b')) { openBattleActions(); return; }
  if (moved) renderHand();
  else if (!b.barShown) { b.barShown = true; renderHand(); }
}

/** Up opens the non-card actions, so the whole fight is reachable by keyboard. */
function openBattleActions() {
  const b = B();
  openMenu('battlemenu', [
    { label: 'Kin', fn: () => { closeMenu(); openScreen('party'); } },
    { label: 'Bag', fn: () => { closeMenu(); openScreen('bag'); } },
    { label: b.wild ? 'Run' : 'Forfeit', fn: () => { closeMenu(); submitLog(doAction({ kind: 'run' })); } },
    { label: 'End turn', fn: () => { closeMenu(); doEndTurn(); } },
    { label: 'Back', fn: () => { closeMenu(); renderHand(); } },
  ], { cancel: () => { closeMenu(); renderHand(); }, title: 'Actions' });
}

// ---- full screens ------------------------------------------------------
function openScreen(kind, opt = {}) {
  closeMenu();
  // When you must send someone out, start the cursor on someone who can go.
  // On a profile, start it on the way out: confirm should always mean "that
  // will do", and renaming is a thing you go and choose, not a wall you have
  // to get past to leave the screen.
  // Same idea as the forced switch: out of a fight most of a full bag cannot be
  // used at all, and the shelf opens with the orbs, so the cursor landed on
  // something whose only possible answer is a refusal. The list comes from
  // `screenList` rather than being rebuilt here — an index into a second copy
  // of a list is an index into the wrong list the first time the copies drift.
  const bagStart = () => {
    const list = screenList({ kind: 'bag', opt });
    return Math.max(0, list.findIndex((k) => fieldItemUse(k).ok));
  };
  const i = opt.force && kind === 'party' ? Math.max(0, G.party.findIndex(alive))
    : kind === 'profile' ? 1
    : kind === 'bag' && !G.battle ? bagStart() : 0;
  G.screen = { kind, i, sel: null, opt, prev: G.mode };
  G.mode = 'screen';
  playCue(kind === 'reward' ? 'level' : 'menu');
  renderScreen();
  screenEntry(kind);
}

/**
 * A screen arrives rather than appearing.
 *
 * Everything in this game used to cut, which makes a menu feel like a modal
 * dialog rather than part of the world. A screen slides up from under its own
 * bottom edge; the reward screen is the one thing that lands with weight,
 * because it is the only screen you actually chose to open.
 */
function screenEntry(kind) {
  if (HEADLESS || !els.screen) return;
  // Two payoff screens, and only one of them landed.
  //
  // The reward drops in with weight and everything else slides up, which is
  // right — until you notice the papers after a catch are the *other* payoff
  // screen. The gotcha turns its rays and sounds its fanfare, and then the
  // thing you actually caught arrives on the same slide as the bag. Same shape
  // as the cue that was on the wrong beat: the signal exists, it was on one of
  // the two moments that deserve it.
  //
  // Only a fresh catch, not the same screen opened later from the party menu —
  // that one is a record, not a moment.
  const fresh = kind === 'profile' && G.screen && G.screen.opt && G.screen.opt.fresh;
  const cls = (kind === 'reward' || fresh) ? 'landing' : 'rising';
  els.screen.classList.remove('rising', 'landing');
  void els.screen.offsetWidth;              // restart the animation
  els.screen.classList.add(cls);
}
/**
 * Which screens refuse to close, in one place.
 *
 * This list lived twice and the copies disagreed. `renderScreen` puts an
 * "X — back" chip in the corner of every screen and three branches blanked it
 * by rewriting `html` — but the forced party screen locks on `opt.force`
 * rather than on its kind, so it kept the chip. Your kin is down, the game is
 * demanding a replacement, and the corner offers a way out that is not there.
 * On a phone that chip is the ONLY thing that closes a screen.
 *
 * `reward` is in here too. It was never in `closeScreen`'s list, only in
 * `renderScreen`'s — and closing a reward screen drops `s.opt.done`, which is
 * `settle`: the evolution that was waiting on the win, and the save.
 */
const screenLocked = (s) => !!s && (s.kind === 'starter' || s.kind === 'swap'
  || s.kind === 'reward' || (s.kind === 'party' && !!s.opt.force));

function closeScreen() {
  const s = G.screen;
  if (!s) return;
  // The refusal comes BEFORE the sound. This played the back blip and then
  // returned, so a locked screen made the noise of closing and stayed put.
  if (screenLocked(s)) return;
  playCue('back');
  if (s.kind === 'profile') {
    commitNick(s);                                       // never lose what was typed
    if (s.opt.fresh) { screenSelect(); return; }          // a fresh catch has one way out
    if (s.opt.back) { G.screen = null; openScreen(s.opt.back); saveGame(); return; }
  }
  G.screen = null;
  if (!HEADLESS) show(els.screen, false);
  if (G.battle) { G.mode = 'battle'; if (!G.battle.over) renderHand(); }
  else { G.mode = 'world'; }
}

/**
 * What a screen is listing. Built here rather than as a side effect of
 * rendering, so navigation and selection agree with the view even when there
 * is no view — the headless suites drive exactly these paths.
 */
function screenList(s) {
  if (!s) return [];
  if (s.kind === 'bag') return Object.keys(G.bag).filter((k) => G.bag[k] > 0);
  if (s.kind === 'shop') return Object.keys(ITEMS);
  if (s.kind === 'chests') return CHEST_IDS;
  // The offer plus "no thanks" — a deck you cannot decline to grow is a deck
  // that fills up with cards you never wanted.
  if (s.kind === 'reward') return (s.opt.offer || []).concat(['skip']);
  // Three kin and no way out: the first choice in the game is a choice.
  if (s.kind === 'starter') return STARTERS.slice();
  // Which card comes out. The deck, and nothing else — there is no "keep it as
  // it is", because you already chose to take the card.
  if (s.kind === 'swap') return G.deck.map(ownedCard).filter(Boolean);
  // The profile is one creature and two buttons; the list is what you can press.
  if (s.kind === 'profile') return ['name', 'done'];
  if (s.kind === 'deck') {
    const inDeck = G.deck.map(ownedCard).filter(Boolean);
    return inDeck.concat(G.cards.filter((c) => !G.deck.includes(c.u)));
  }
  if (s.kind === 'party') return G.party;
  if (s.kind === 'box') return G.party.concat(G.box);
  if (s.kind === 'dex') return DEX_ORDER;
  return [];
}

const typeChips = (types) => types.map((t) => `<span class="tp" style="background:${TYPES[t]}">${t}</span>`).join('');
const STATUS_TINT = { burn: '#ff8a2b', shock: '#ffe14d', snare: '#63c14a', chill: '#46b6e8' };
const statusChip = (st) => `<span class="tp st" style="background:${STATUS_TINT[st] || '#8f7aa8'}">${STATUS[st].tag}</span>`;

/**
 * How a kin is described in a LIST, in one place.
 *
 * The party screen and the box screen both list kin, and they described the
 * same creature two different ways: the party row drew type chips and a status
 * chip, the box row printed `Lv26 Verdant/Gloom` in plain grey text with no
 * status on it at all. Same fact, two idioms — and the one that dropped
 * information is the screen you stand in to decide who to bring. A kin with
 * BURN on it looked exactly like a healthy one, in the one place where that is
 * the whole question.
 */
const kinSub = (m) => `<div class="kinsub"><span class="lv">Lv${m.lvl}</span>`
  + `${typeChips(m.types)}${m.status ? statusChip(m.status) : ''}</div>`;

/**
 * How many kin you are carrying, and what they are called, in one place.
 *
 * Three screens named the same set three different ways: the pause menu said
 * `Kin  6/6`, the party screen said `Your kin` with no number on it at all, and
 * the box screen — listing the SAME six creatures — headed them `Party — 6/6`.
 * Every other collection in the game reads `Name — count`: `Dex — 13 caught /
 * 16 seen / 19`, `Box — 26`, `Deck — 8/12 (min 5)`, `Bag — 500 shards`. The one
 * you open most was the one that broke the pattern, and it broke it in the two
 * ways available: a different noun and a missing number.
 *
 * `kin` is the game's own word — the battle button, `Choose your kin`, every
 * card that mentions one. `Party` was the outlier.
 */
const PARTY_MAX = 6;
const partyTally = () => `${G.party.length}/${PARTY_MAX}`;
const kinHeading = () => `Kin — ${partyTally()}`;

/**
 * A kin's page: portrait, stats and moves.
 *
 * Numbers alone make you do arithmetic to answer "is this one fast?". A bar
 * answers it before you have read the number, so every stat gets one, measured
 * against the roster's own ceiling rather than an arbitrary 100 — the bars mean
 * "compared with the best thing in the valley", which is the question you are
 * actually asking.
 */
/**
 * What a full bar means, at the level the creature actually is.
 *
 * It was a flat 130, which is wrong at both ends of the game. Measured across
 * the whole dex: a Lv30 kin's stats run 21..71, so every bar sat in the bottom
 * half of its track and 29 was indistinguishable from 42 — the numbers did all
 * the work and the bars were decoration. At Lv100 they reach 225 and clamp off
 * the end instead, so the strongest creature in the valley looks identical to a
 * merely good one.
 *
 * The question a player is actually asking is "is this one fast FOR ITS LEVEL",
 * so the ceiling moves with the level. 110 is the highest base stat in the dex,
 * which puts the best creature in the game at a full bar whatever level it is.
 */
const STAT_CEIL_BASE = 110;
const statCeil = (lvl) => statAt(STAT_CEIL_BASE, lvl);
function statBlock(m) {
  if (!m) return '';
  const f = m.hp / m.max;
  // A hand-edited or half-migrated save can hold xp below its own level's
  // floor; the bar clamps rather than printing a negative.
  const floor = xpFor(m.lvl), span = Math.max(1, xpFor(m.lvl + 1) - floor);
  const into = clamp(m.xp - floor, 0, span);
  const bar = (label, v, tint) => `<div class="statrow"><span>${label}</span>
    <div class="sbar"><i style="width:${clamp(v / statCeil(m.lvl), 0, 1) * 100}%;background:${tint}"></i></div>
    <b>${v}</b></div>`;
  return `<div class="kindetail panel">
    <div class="portrait"><canvas width="40" height="40" data-mon="${m.species}"></canvas></div>
    <div class="pname"><b>${dispName(m)}</b><span class="lv">Lv${m.lvl}</span></div>
    <div class="sub">${typeChips(m.types)}${m.status ? statusChip(m.status) : ''}</div>
    <div class="statrow big"><span>HP</span>
      <div class="sbar"><i style="width:${f * 100}%;background:${hpColor(f)}"></i></div>
      <b>${m.hp}<small>/${m.max}</small></b></div>
    ${bar('ATK', m.atk, '#ff8a2b')}
    ${bar('GUARD', m.def, '#8f7aa8')}
    ${bar('SPD', m.spd, '#46b6e8')}
    <div class="statrow xp"><span>EXP</span>
      <div class="sbar"><i style="width:${(into / span) * 100}%;background:var(--xp)"></i></div>
      <b>${into}<small>/${span}</small></b></div>
    <div class="movelist">` + m.moves.map((slot) => {
      const mv = MOVES[slot.id];
      const pp = slot.pp / Math.max(1, slot.max);
      // These numbers were computed against a dummy with NO TYPES — foe-
      // agnostic by design, which is right in the town menu and exactly wrong
      // on the forced switch, where the screen is asking you to pick somebody
      // to send into a specific creature and the matchup is the whole decision.
      // `damageOf` takes any attacker, so the real answer was one call away.
      const vs = mv.pow ? (moveVersusFoe(m, slot.id) || moveDamageNeutral(m, slot.id)) : null;
      const mark = vs && vs.eff !== undefined ? EFF_MARK[String(vs.eff)] : null;
      return `<div class="${mark ? `movecard ${mark.cls}` : 'movecard'}" style="--tint:${TYPES[mv.type]}">
        <div class="mtop"><b>${mv.name}</b><span class="cost">${moveCost(slot.id)}</span></div>
        <div class="mbody">${vs ? `${rangeText(vs.lo, vs.hi)} dmg${mark ? ` <b class="eff">${mark.tag}</b>` : ''}` : 'status'}
          <span class="pp ${pp <= .25 ? 'low' : ''}">${slot.pp}/${slot.max} PP</span></div>
        <div class="mbar"><i style="width:${pp * 100}%"></i></div></div>`;
    }).join('') + `</div></div>`;
}

/** Where a species can be found — read straight off the encounter tables. */
function habitat(id) {
  const where = [];
  for (const [mapId, map] of Object.entries(MAPS)) {
    const row = ((map.enc && map.enc.table) || []).find((e) => e[0] === id);
    if (row) where.push(`${map.name} (Lv${row[1]}–${row[2]})`);
  }
  if (where.length) return 'Found in ' + where.join(' · ');
  // The one that does not live on a table. Read off the same map field the walk
  // reads, so the screen and the world cannot disagree about where it is.
  const shrine = Object.values(MAPS).find((m) => m.legend && m.legend.id === id);
  if (shrine) return `Waits in ${shrine.legend.where}.`;
  const from = DEX_ORDER.find((p) => DEX[p].evo && DEX[p].evo[0] === id);
  if (from) return `Evolves from ${DEX[from].name} at level ${DEX[from].evo[1]}.`;
  if (STARTERS.includes(id)) return 'A kin Elder Rowan hands out.';
  // Kept, but nothing in DEX_ORDER may reach it — the suite asserts that. This
  // line is what a nineteenth kin added with no home would say, and the whole
  // point of this pass is that it said it about the best one in the game.
  return 'Not found in the wild. Not anywhere, really.';
}

function renderScreen() {
  if (!G.screen) return;
  G.screen.list = screenList(G.screen);
  if (HEADLESS) return;
  const s = G.screen, el = els.screen;
  // On a phone this is the only thing in the corner that closes a screen, so it
  // is relabelled rather than hidden — but it stops naming a key that is not
  // there. On a keyboard it still reads "X — back". And on a screen that will
  // not close it is not drawn at all, off the same predicate the refusal uses.
  let html = screenLocked(s) ? ''
    : `<div class="back">${isTouch() ? backName() : `${backName()} — back`}</div>`;
  if (s.kind === 'party') {
    // Roster on the left, whoever is picked on the right. A row of equal cards
    // has no hierarchy: there is nothing on it saying which one you are looking
    // at, so every card has to carry every fact and none of them can be big.
    html += `<h2>${kinHeading()}</h2><div class="kinview">`;
    html += `<div class="kinlist">` + G.party.map((m, i) => {
      const f = m.hp / m.max;
      return `<div class="kinrow panel ${i === s.i ? 'sel' : ''} ${m.hp <= 0 ? 'down' : ''}" data-i="${i}">
        <canvas width="40" height="40" data-mon="${m.species}"></canvas>
        <div class="info"><b>${dispName(m)}</b>
        ${kinSub(m)}
        <div class="bar"><i style="width:${f * 100}%;background:${hpColor(f)}"></i></div></div>
        <div class="hpn">${m.hp}<small>/${m.max}</small></div></div>`;
    }).join('') + '</div>';
    html += statBlock(G.party[s.i]);
    html += '</div>';
    // Who they are stepping up AGAINST. The prompt asked for a choice and hid
    // the only thing the choice is about: the screen covers the arena, so the
    // foe's name, level and types are behind it at the exact moment they decide
    // everything. The marks on the moves above answer "how well"; this answers
    // "against what", and a player who knows the chart needs only this.
    if (s.opt.force) {
      const b = B();
      const foe = b && b.foe;
      html += `<p style="color:var(--gold);font-size:13px">Choose who steps up.${foe
        ? ` <span style="color:var(--dim)">${dispName(foe)} is out there — Lv${foe.lvl} ${foe.types.join('/')}.</span>`
        : ''}</p>`;
    }
  } else if (s.kind === 'dex') {
    html += `<h2>Dex — ${dexCount(2)} caught / ${dexCount(1)} seen / ${DEX_ORDER.length}</h2><div class="dexgrid">` +
      DEX_ORDER.map((id, i) => {
        // Three states, and they have to be distinguishable across the room:
        // caught is lit and framed in gold, seen is a silhouette, unseen is an
        // empty slot with its number still in it.
        // A creature you have never met should not leak its silhouette: an
        // unseen slot is empty, a seen one is a shape lifted off the panel, and
        // a caught one is the creature itself in a gold frame.
        const st = G.dex[id] || 0;
        const state = st > 1 ? 'caught' : st ? 'seen' : 'unseen';
        return `<div class="dexcell panel ${state} ${i === s.i ? 'sel' : ''}" data-i="${i}">
          <span class="dexno">${String(i + 1).padStart(2, '0')}</span>
          ${st ? `<canvas width="40" height="40" data-mon="${id}" data-sil="${st > 1 ? '' : '1'}"></canvas>`
               : '<div class="dexslot">?</div>'}
          <b>${st ? DEX[id].name : '???'}</b>
          ${st ? `<div class="types">${typeChips(DEX[id].types)}</div>` : '<div class="types"><span class="tp blank">—</span></div>'}</div>`;
      }).join('') + '</div>';
    const id = DEX_ORDER[s.i];
    if ((G.dex[id] || 0) > 0) {
      html += `<p style="font-size:.82em;max-width:520px">${DEX[id].dex}</p>`;
      html += `<p style="font-size:.75em;color:var(--dim)">${habitat(id)}</p>`;
    }
  } else if (s.kind === 'box') {
    // Party and box are one list, so a swap is just two indices.
    const monCard = (m, i) => {
      const f = m.hp / m.max;
      return `<div class="card panel ${i === s.i ? 'sel' : ''}" data-i="${i}" ${i === s.pick ? 'style="box-shadow:0 0 0 2px var(--xp)"' : ''}>
        <canvas width="40" height="40" data-mon="${m.species}"></canvas>
        <div class="info"><b>${dispName(m)}</b>${kinSub(m)}
        <div class="bar"><i style="width:${f * 100}%;background:${hpColor(f)}"></i></div></div></div>`;
    };
    // The empty slots are drawn. A party of one used to be a single card with
    // half the row blank beside it, which says nothing — the six slots are the
    // shape of the thing, and how many are free is what a player is standing
    // here to find out. Photographing the box for the first time is what showed
    // it; a full party had always been what got looked at in a test.
    const slot = () => '<div class="card panel slot"><span>empty</span></div>';
    // What the kin under the cursor can actually DO, before either grid.
    //
    // This screen is where you decide who to bring, and it was the one screen
    // that could not answer the question that decision turns on: the party
    // screen puts a stat block beside its list, the dex puts a detail pane
    // under its grid, and the box had neither — so "what does this one know"
    // meant withdrawing it, opening the party screen, and putting it back.
    //
    // Tried under the grids first, the way the dex does it. The dex's grid is
    // nineteen cells and fits; this one is a party plus a box that runs to
    // thirty-odd cards, so the pane landed below every one of them and off the
    // bottom of the screen. It was there and it was invisible — which is worse
    // than absent, because a test can see it. Above, it is the first thing on
    // the screen and it moves with the cursor.
    const under = G.party.concat(G.box)[s.i];
    if (under) html += statBlock(under);
    html += `<h2>${kinHeading()}</h2><div class="cards slim">`
      + G.party.map((m, i) => monCard(m, i)).join('')
      + Array.from({ length: Math.max(0, PARTY_MAX - G.party.length) }, slot).join('') + '</div>';
    html += `<h2 style="margin-top:12px">Box — ${G.box.length}</h2>`;
    html += G.box.length ? `<div class="cards slim">` + G.box.map((m, i) => monCard(m, G.party.length + i)).join('') + '</div>'
      : '<p style="color:var(--dim)">Nothing stored yet.</p>';
    html += `<p style="font-size:12px;color:var(--dim)">${pickName()} on a boxed kin withdraws it · ${pickName()} on a party kin stores it · with a full party, pick the newcomer then pick who it replaces.</p>`;
  } else if (s.kind === 'deck') {
    // Owned cards, deck first. Selecting one moves it in or out.
    const inDeck = G.deck.map(ownedCard).filter(Boolean);
    const rest = G.cards.filter((c) => !G.deck.includes(c.u));
    const shelf = (c, i, on) => cardHTML({ src: 'deck', u: c.u, id: c.id, bg: 0 }, {
      cls: `big ${i === s.i ? 'sel' : ''} ${on ? '' : 'off'}`,
      attr: `data-i="${i}"`,
      note: `played ${c.plays || 0}${c.kills ? ` · ${c.kills} kills` : ''}`,
    });
    html += `<h2>Deck — ${inDeck.length}/${DECK_MAX} (min ${DECK_MIN})</h2>`;
    html += `<div class="cardrow">` + inDeck.map((c, i) => shelf(c, i, true)).join('') + '</div>';
    html += `<h2 style="margin-top:12px">Collection — ${rest.length} spare</h2>`;
    html += rest.length ? `<div class="cardrow">` + rest.map((c, i) => shelf(c, inDeck.length + i, false)).join('') + '</div>'
      : '<p style="color:var(--dim)">Everything you own is in the deck.</p>';
  } else if (s.kind === 'starter') {
    // The first choice in the game, and it used to be a three-line menu. It is
    // three cards now, laid out the way the reward screen is, because that is
    // the shape this game uses for "pick one of these and live with it".
    html += `<h2>Choose your kin</h2>`;
    // The count is in the sentence. On a phone the row is two cards wide and
    // the third is below the fold — and two cards that fill the row read as the
    // whole set, so a player could make the one irreversible choice in the game
    // without knowing a third option existed. The scroll cue says there is more
    // below; the words say how much more.
    html += `<p class="lede">Three of them. One is yours from here on, and Rowan will not be talked round.</p>`;
    html += `<div class="pickrow">` + s.list.map((id, i) => {
      const d = DEX[id];
      const tint = TYPES[d.types[0]] || 'var(--gold)';
      const beats = TYPE_ORDER.filter((t) => (CHART[d.types[0]] || {})[t] > 1);
      const weak = TYPE_ORDER.filter((t) => (CHART[t] || {})[d.types[0]] > 1);
      return `<div class="pickcard panel ${i === s.i ? 'sel' : ''}" data-i="${i}" style="--tint:${tint}">
        <div class="pportrait"><canvas width="40" height="40" data-mon="${id}"></canvas></div>
        <div class="pname">${d.name}</div>
        <div class="types">${typeChips(d.types)}</div>
        <p class="pdexline">${d.dex}</p>
        <div class="matchup">
          <div><span>strong into</span>${beats.length ? typeChips(beats) : '<i>nothing much</i>'}</div>
          <div><span>soft against</span>${weak.length ? typeChips(weak) : '<i>nothing much</i>'}</div>
        </div>
        <div class="ptake">${i === s.i ? '▲ take it' : ''}</div></div>`;
    }).join('') + '</div>';
  } else if (s.kind === 'swap') {
    const coming = ownedCard(s.opt.newCard);
    html += `<h2>What comes out?</h2>`;
    html += `<p class="lede">A deck holds ${DECK_MAX}. ${coming ? CARDS[coming.id].name : 'The new card'} is going in — pick the one it replaces.</p>`;
    if (coming) {
      html += `<div class="cardrow">` + cardHTML({ src: 'deck', u: coming.u, id: coming.id, bg: 0 },
        { cls: 'big', note: 'coming in' }) + '</div>';
      html += `<h3 class="shelf">Your deck</h3>`;
    }
    html += `<div class="cardrow">` + s.list.map((c, i) => cardHTML(
      { src: 'deck', u: c.u, id: c.id, bg: 0 },
      { cls: `big ${i === s.i ? 'sel' : ''}`, attr: `data-i="${i}"`,
        // The mirror of the offer's count, asked deliberately rather than found
        // a pass later: the offer now says how many are in your deck, and this
        // screen — which asks which one comes OUT — said only what that copy
        // had done. Removing one of three Edges and removing your only Snack
        // are different decisions and read identically without this.
        note: `played ${c.plays || 0}${c.kills ? ` · ${c.kills} kills` : ''}`
          + ((n) => n > 1 ? ` · ${n} in deck` : ' · your only one')(
            s.list.filter((o) => o.id === c.id).length) })).join('') + '</div>';
  } else if (s.kind === 'reward') {
    html += `<h2>Take a card</h2>`;
    // The deck's vocabulary, glossed where it appears.
    //
    // Three words are printed on cards and were defined nowhere a player can
    // read — only in comments above the card table. Each fails the same test:
    // a player can guess wrong in a way that changes what they do.
    //
    //   Exhaust  guessed as "gone for ever", so the best cards get hoarded and
    //            never played — the exact opposite of what they are for.
    //   Chain    the big one. It takes a point off the cost for every card
    //            already played this turn, so a 3-cost is free after three
    //            cheap ones. Not knowing it makes Titanheart and Overkill look
    //            unaffordable, and turn sequencing is the whole skill of the
    //            deck.
    //   Retain   a kept card is a held resource; not knowing means playing it
    //            the moment it arrives.
    //
    // Glossed on the offer rather than in the opening speech, and only for the
    // words actually on the cards in front of you: a rule explained fifty
    // fights before you meet it is not explained, and a screen should not
    // define a word it never used.
    const GLOSS = [
      ['exhaust', 'Exhaust', 'one use per battle — it is back next fight'],
      ['chain', 'Chain', 'costs 1 less for every card you have already played this turn'],
      ['retain', 'Retain', 'stays in your hand at the end of the turn'],
    ];
    const shown = GLOSS.filter(([k]) => (s.list || []).some((id) => CARDS[id] && CARDS[id][k]));
    html += `<p style="font-size:.8em;color:var(--dim);max-width:520px">Your kin brings the attacks. These make them land harder.`
      + shown.map(([, word, means]) => ` <b style="color:var(--ink)">${word}</b> — ${means}.`).join('')
      + '</p>';
    html += `<div class="cardrow big">` + s.list.map((id, i) => {
      if (id === 'skip') {
        return `<div class="cardel skipcard ${i === s.i ? 'sel' : ''}" data-i="${i}" style="--tint:#6b6270">
          <div class="cframe"></div>
          <div class="cart"><span class="cglyph">×</span></div>
          <div class="cname">No thanks</div>
          <div class="ctext">Leave the deck as it is.</div>
          <div class="cfoot"><div class="cpip">skip</div></div></div>`;
      }
      // How many are in the DECK, not how many you own.
      //
      // Only deck cards are drawn, and you can own more than the deck holds —
      // the swap screen exists for exactly that. So "you own 3" covered three
      // in your deck, or two and one set aside, or three set aside and none
      // where they can ever be drawn, and the decision "should I take another
      // Edge?" is entirely about the first number. Same fault as the intent
      // line: true, and not the one you are deciding against.
      const inDeck = deckCards().filter((c) => c.id === id).length;
      const aside = G.cards.filter((c) => c.id === id).length - inDeck;
      return cardHTML({ src: 'deck', u: -1, id, bg: 0 }, {
        cls: `big ${i === s.i ? 'sel' : ''}`,
        attr: `data-i="${i}"`,
        note: `${inDeck ? `${inDeck} in your deck` : 'none in your deck'}${
          aside > 0 ? ` · ${aside} set aside` : ''}${
          (CARDS[id].grow || CARDS[id].kill) ? ` · to +${growCap(id)}` : ''}`,
      });
    }).join('') + '</div>';
  } else if (s.kind === 'profile') {
    const m = s.opt.mon;
    html = s.opt.fresh ? '' : html;             // a fresh catch has nothing behind it
    const f = m.hp / m.max;
    const boxed = !G.party.includes(m);
    html += `<h2>${s.opt.fresh ? (s.opt.legendary ? 'The valley lets it go' : 'Caught') : dispName(m)}</h2>`;
    html += `<div class="profile">
      <div class="pcard panel">
        <canvas width="40" height="40" data-mon="${m.species}"></canvas>
        <div class="ptypes">${typeChips(m.types)}</div>
      </div>
      <div class="pbody">
        <div class="prow"><label for="nickin">Name</label>
          <input id="nickin" maxlength="12" value="${(m.nick || m.name).replace(/"/g, '&quot;')}"
            placeholder="${m.name}" autocomplete="off" spellcheck="false"></div>
        <p class="phint">${m.nick && m.nick !== m.name ? `A ${m.name}, by any other name.` : 'It answers to its own name for now.'}</p>
        <div class="pstats">
          <span>Lv${m.lvl}</span><span>${m.hp}/${m.max} HP</span>
          <span>ATK ${m.atk}</span><span>GUARD ${m.def}</span><span>SPD ${m.spd}</span></div>
        <div class="bar"><i style="width:${f * 100}%;background:${hpColor(f)}"></i></div>
        <p class="pdex">${DEX[m.species].dex}</p>
        <p class="phint">${boxed ? 'Resting in the box until you send for it.' : 'Walking with you.'}</p>
        <div class="pacts">
          <div class="abtn ${s.i === 0 ? 'sel' : ''}" data-i="0">Rename</div>
          <div class="abtn ${s.i === 1 ? 'sel' : ''}" data-i="1">${s.opt.fresh ? 'Take it along' : 'Done'}</div>
        </div>
      </div></div>`;
  } else if (s.kind === 'chests') {
    // This screen never got the treatment the bag got: every chest carried a
    // full-strength coloured border, so all four glowed at once and the one
    // you had actually selected was invisible. The tint belongs to the chest;
    // the gold ring belongs to the cursor, and only one thing at a time gets it.
    html += `<h2>Gem chests — ${G.gems} gems</h2>`;
    html += `<p class="lede">Better chests do not hold more cards. They hold better odds.</p>`;
    html += `<div class="items wide">` + CHEST_IDS.map((k, i) => {
      const ch = CHESTS[k];
      const tint = CHEST_TINT[k];
      const afford = G.gems >= ch.cost;
      // The odds as a bar rather than four percentages: you are choosing
      // between distributions, and a distribution is a shape.
      const bar = RARITY_ORDER.filter((r) => ch.odds[r]).map((r) =>
        `<i style="width:${ch.odds[r]}%;background:${RARITY[r]}" title="${r} ${ch.odds[r]}%"></i>`).join('');
      const key = RARITY_ORDER.filter((r) => ch.odds[r] && r !== 'common')
        .map((r) => `<span style="color:${RARITY[r]}">${ch.odds[r]}% ${r}</span>`).join('&nbsp;· ');
      return `<div class="item chestrow panel ${i === s.i ? 'sel' : ''} ${afford ? '' : 'dead'}"
        data-i="${i}" style="--tint:${tint}">
        <div class="chest" style="--tint:${tint}"></div>
        <div class="info"><b style="color:${tint}">${ch.name}</b>
          <div class="oddsbar">${bar}</div>
          <small>${key || 'commons only'}</small></div>
        <div class="tally">${ch.cost}<small>gems</small></div></div>`;
    }).join('') + '</div>';
    if (s.got) {
      html += `<h3 class="shelf">You pulled</h3><div class="items">` + s.got.map((c) => {
        const def = CARDS[c.id];
        return `<div class="item panel" style="--tint:${RARITY[def.r]}">
          <canvas width="20" height="20" data-card="${c.id}"></canvas>
          <div class="info"><b style="color:${RARITY[def.r]}">${def.name}</b>
          <small>${cardText(c)}</small></div>
          <div class="tally">${def.cost}<small>en</small></div></div>`;
      }).join('') + '</div>';
    }
  } else if (s.kind === 'bag' || s.kind === 'shop') {
    // One renderer for both: the same shelf, priced or counted. Grouping is
    // what turns a list into a bag — you go looking for "an orb", not for
    // "the fourth row".
    const shop = s.kind === 'shop';
    const list = s.list;
    // In a fight, say how hurt you are.
    //
    // The screen is inset:0 with a blur over it, so opening the bag mid-fight
    // covers the arena and both HP bars — and choosing between a Salve that
    // restores 30 and a Great Salve that restores 90 is the one decision in the
    // game that needs the number the screen is hiding. Rather than let a panel
    // show through from underneath, the number goes where the decision is.
    const inFight = !shop && G.battle && B() && B().mine;
    const hurt = inFight ? B().mine : null;
    // …and the other operand, which this had been half of. The decision the
    // comment above names — a Salve that restores 30 against a Great Salve that
    // restores 90 — is a decision about surviving the next swing, and the swing
    // is telegraphed on the chip that this screen is covering. Bringing your HP
    // and not what is coming at it is the intent chip's own old fault: one side
    // of a subtraction. Same numbers, same words as the chip, so a player who
    // has learned to read one reads the other.
    const inc = inFight ? intentThrough(B(), B().intent) : null;
    const doomed = inFight && intentLethal(B(), B().intent);
    html += `<h2>${shop ? 'Supply' : 'Bag'} — ${G.money} shards`
      + (hurt ? ` <span style="color:${hpColor(hurt.hp / hurt.max)}">· ${dispName(hurt)} ${hurt.hp}/${hurt.max}</span>` : '')
      + (inc ? ` <span style="color:${doomed ? 'var(--hp-bad)' : 'var(--dim)'}">· ${rangeText(inc.lo, inc.hi)} coming${doomed ? ', enough to finish you' : ''}</span>` : '')
      + '</h2>';
    if (!list.length) html += '<p style="color:var(--dim)">Empty. Even the lint.</p>';
    for (const [group, keys] of shelve(list)) {
      html += `<h3 class="shelf">${group}</h3><div class="items">` + keys.map((k) => {
        const i = list.indexOf(k), it = ITEMS[k];
        const afford = !shop || G.money >= it.cost;
        // An orb in a wild fight says what it would actually do.
        //
        // Last pass put YOUR kin's HP here because choosing a salve needs it.
        // The other decision this screen carries needs the opposite number:
        // captureChance reads the FOE's HP fraction and its status, and the bag
        // covers that bar too. So the orb rows carry the answer rather than the
        // inputs — the chest shop already shows odds per chest, so odds on a
        // shelf are this game's own idiom.
        const odds = inFight && it.kind === 'orb' && G.battle.wild && B().foe
          ? Math.round(captureChance(B().foe, it.mul) * 100) : null;
        // The same row, out of a fight: who it would act on, or nothing and a
        // dimmed frame if it would only produce a refusal. An orb has odds in a
        // wild fight and no business at all on a footpath, and the shelf can
        // say both without either being a special case.
        const use = !shop && !inFight ? fieldItemUse(k) : null;
        const dead = !afford || (use && !use.ok);
        return `<div class="item panel ${i === s.i ? 'sel' : ''} ${dead ? 'dead' : ''}" data-i="${i}">
          <canvas width="20" height="20" data-card="${ITEM_ART(k)}"></canvas>
          <div class="info"><b>${it.name}</b><small>${it.desc}</small></div>
          ${odds !== null ? `<div class="tally" style="color:${odds >= 60 ? 'var(--hp-good)' : odds >= 30 ? 'var(--hp-warn)' : 'var(--hp-bad)'}">${odds}%<small>catch</small></div>` : ''}
          ${use && use.ok ? `<div class="tally" style="color:${hpColor(use.target.hp / use.target.max)}">${dispName(use.target)}<small>${use.target.hp}/${use.target.max}</small></div>` : ''}
          <div class="tally">${shop ? `${it.cost}<small>sh</small>` : `×${G.bag[k]}`}</div></div>`;
      }).join('') + '</div>';
    }
  }
  el.innerHTML = html;
  show(el, true);
  el.querySelectorAll('canvas[data-mon]').forEach((c) => paintTo(c, 'creature', c.dataset.mon, 1, !!c.dataset.sil));
  paintCardArt(el);
}

/**
 * How many columns the screen ACTUALLY has, counted off the rendered grid.
 *
 * These grids are `repeat(auto-fill, minmax(N, 1fr))`, so the column count is a
 * function of the stage width — the dex is four across on a x2 stage and seven
 * on a wide one. Up and down were hard-coded to five, which is right at exactly
 * one window and wrong at every other: the cursor jumped a row and a bit, in a
 * grid the player can see. Photographing the dex for the first time is what
 * showed it, and no test could have — the affordance was wired up correctly, it
 * was just wired to the wrong number.
 */
function gridCols(s) {
  if (HEADLESS) return s.kind === 'dex' ? 5 : 2;
  // Every grid a cursor can be in. The bag, the shop and the chest shelf were
  // missing from the first version of this list, so they fell to the `< 2`
  // branch and returned 1 — up and down moved by a single cell in a grid two
  // and three across. Found by photographing each screen with a cursor in it,
  // which is the only way to see that a fix reaches everything it claims to.
  const cells = els.screen.querySelectorAll(
    '.dexcell, .cards > .card, .cardrow > .cardel, .items > .item');
  if (cells.length < 2) return 1;
  const top = cells[0].offsetTop;
  let n = 0;
  for (const c of cells) { if (c.offsetTop !== top) break; n++; }
  return Math.max(1, n);
}

function screenInput() {
  const s = G.screen;
  if (!s) return;
  if (nickFocused()) return;                  // the field has the keyboard
  s.list = screenList(s);
  const len = (s.list || []).length;
  if (s.kind === 'chests' && s.got && (justPressed('left') || justPressed('right') || justPressed('up') || justPressed('down'))) s.got = null;
  let moved = false;
  const cols = gridCols(s);
  if (justPressed('left')) { s.i = (s.i + len - 1) % Math.max(1, len); moved = true; }
  if (justPressed('right')) { s.i = (s.i + 1) % Math.max(1, len); moved = true; }
  if (justPressed('up')) { s.i = clamp(s.i - cols, 0, Math.max(0, len - 1)); moved = true; }
  if (justPressed('down')) { s.i = clamp(s.i + cols, 0, Math.max(0, len - 1)); moved = true; }
  if (moved) renderScreen();
  if (justPressed('a')) screenSelect();
  if (justPressed('b')) {
    // The reward is a choice, not a menu — there is nothing behind it to go
    // back to. Back means "No thanks", which is a real option on the screen,
    // rather than a button that looks live and does nothing.
    if (s.kind === 'reward') { s.i = Math.max(0, (s.list || []).length - 1); screenSelect(); }
    else if (s.kind !== 'starter' && s.kind !== 'swap') closeScreen();
  }
}

/**
 * Withdraw, store, or swap. The party may never empty and never exceed six, so
 * a full party turns a withdrawal into a two-tap swap.
 */
function boxSelect(s) {
  const inParty = s.i < G.party.length;
  const boxIdx = s.i - G.party.length;
  if (s.pick != null) {
    const pickBox = s.pick - G.party.length;
    if (inParty && pickBox >= 0 && G.box[pickBox]) {
      const out = G.party[s.i];
      G.party[s.i] = G.box[pickBox];
      G.box[pickBox] = out;
      setToast(`${dispName(G.party[s.i])} steps in for ${dispName(out)}.`);
    } else setToast('Pick a party kin to swap out.');
    s.pick = null;
    renderScreen();
    return;
  }
  if (inParty) {
    if (G.party.length <= 1) { setToast('You cannot travel with nobody.'); return; }
    const m = G.party.splice(s.i, 1)[0];
    G.box.push(m);
    s.i = clamp(s.i, 0, G.party.length + G.box.length - 1);
    setToast(`${dispName(m)} rests in the box.`);
  } else {
    const m = G.box[boxIdx];
    if (!m) return;
    if (G.party.length < PARTY_MAX) {
      G.box.splice(boxIdx, 1);
      G.party.push(m);
      setToast(`${dispName(m)} joins you.`);
    } else {
      s.pick = s.i;
      setToast(`Now pick who ${dispName(m)} replaces.`);
    }
  }
  renderScreen();
}

function screenSelect() {
  const s = G.screen;
  if (!s) return;
  s.list = screenList(s);
  if (s.kind === 'profile') {
    if (s.i === 0) { focusNick(); return; }
    commitNick(s);
    const done = s.opt.done;
    G.screen = null; if (!HEADLESS) show(els.screen, false);
    G.mode = G.battle ? 'battle' : 'world';
    saveGame();
    if (done) done();
    return;
  }
  if (s.kind === 'starter') {
    const id = s.list[s.i];
    const done = s.opt.done;
    G.screen = null; if (!HEADLESS) show(els.screen, false);
    G.mode = 'world';
    const m = takeStarter(id);
    // The starter takes the same road as a catch, because it is the same moment
    // and the bigger one. Every kin you take off the grass gets a celebration
    // and then its papers — the screen the source elsewhere calls the one place
    // the name is still yours to choose. The kin you are handed here, and keep
    // longer than any of them, used to get the screen shut in its face and five
    // lines about energy and the chest shop. The rules can wait forty seconds.
    G.gotcha = {
      // The tally starts in front of you, one line long, forty seconds before
      // Rowan explains what the book is for. His speech lands on a page that
      // already has something on it.
      t: 0, species: id, name: m.name, where: 'from here on', head: 'YOUR KIN', note: dexTally(),
      done: () => {
        G.gotcha = null;
        openScreen('profile', {
          mon: m, fresh: true,
          done: () => say('Elder Rowan', [
            `${DEX[id].name}. Of course.`,
            'Five orbs, three salves, and a deck. Ten cards — half of them nothing special.',
            'Your kin brings its own moves to the fight. The deck is what you bring.',
            'Vane keeps the chest shop and takes gems, not shards. Win fights, buy chests, thicken the deck.',
            // Five lines of rules and not one of them said why. The menu carries
            // the running answer; this is the one that gets said out loud, and
            // it is last so it is the thing you are still holding at the door.
            `Now the part the rules do not cover. ${Spell(AIM_ORDER.length)} trainers between here and the top of Crown Hollow, and ${spell(AIM_ORDER.filter(([, who]) => who === 'Wick').length)} of them are Wick, so get used to him.`,
            `Past the last one there is something sitting on the shrine that was here before I was. And there are ${spell(DEX_ORDER.length)} kin in this valley — I want every one of them written down.`,
            'That is the errand. The door is behind you.',
          ], () => { saveGame(); if (done) done(); }),
        });
      },
    };
    playCue('gotcha');
    return;
  }
  if (s.kind === 'swap') {
    const out = s.list[s.i];
    if (!out) return;
    const done = s.opt.done, coming = s.opt.newCard;
    G.deck = G.deck.filter((u) => u !== out.u);
    if (!G.deck.includes(coming)) G.deck.push(coming);
    const inc = ownedCard(coming);
    playCue('select');                      // giving one up is a commitment too
    G.screen = null; if (!HEADLESS) show(els.screen, false);
    G.mode = G.battle ? 'battle' : 'world';
    setToast(`${CARDS[out.id].name} out, ${inc ? CARDS[inc.id].name : 'the new card'} in.`);
    saveGame();
    if (done) done();
    return;
  }
  if (s.kind === 'reward') {
    const id = s.list[s.i];
    const done = s.opt.done;
    G.screen = null; if (!HEADLESS) show(els.screen, false);
    G.mode = G.battle ? 'battle' : 'world';
    if (id && id !== 'skip') {
      // The moment of commitment makes a sound.
      //
      // Listing what the SCREENS cue — the beats having been done — turned up
      // the fanfare sitting on the wrong beat: `openScreen` plays 'level' when
      // the offer appears, and taking the card was silent. The offer appearing
      // is not the achievement; the card joining your deck is, and it is the
      // most consequential thing you do outside a fight.
      playCue('select');
      const c = grantCard(id, true);
      if (G.deck.includes(c.u)) setToast(`${CARDS[id].name} joins the deck.`);
      else {
        // A full deck makes taking a card the second half of a decision rather
        // than the end of one: something has to come out, and it is your call
        // which. The old rule picked for you, silently.
        openScreen('swap', { newCard: c.u, done });
        return;
      }
    }
    if (done) done();
    return;
  }
  if (s.kind === 'party') {
    const m = G.party[s.i];
    if (!m) return;
    if (G.battle) {
      if (!alive(m)) { setToast(`${dispName(m)} cannot fight.`); return; }
      if (m === G.battle.mine && !s.opt.force) { setToast('Already out there.'); return; }
      if (s.opt.force) {
        G.battle.mine = m; m.stages = { atk: 0, def: 0, spd: 0 };
        G.battle.dispM = m.hp; G.battle.tgtM = m.hp;
        G.battle.dispXp = G.battle.tgtXp = m.xp; G.battle.barLv = m.lvl;
        G.battle.barSlot = G.party.indexOf(m);
        G.battle.over = null; G.battle.finishing = false; G.battle.entry = 0;
        swapKinCards(G.battle);
        startPlayerTurn([]);
        s.opt.force = false;
        G.screen = null; if (!HEADLESS) show(els.screen, false);
        G.mode = 'battle';
        battleSay([`Go, ${dispName(m)}!`], () => renderHand());
        return;
      }
      G.screen = null; if (!HEADLESS) show(els.screen, false);
      G.mode = 'battle';
      submitLog(doAction({ kind: 'switch', idx: s.i }));
      return;
    }
    // Out of a fight, picking a kin opens its papers — the same screen a catch
    // hands you, so renaming is not a thing you only get one chance at.
    openScreen('profile', { mon: m, back: 'party' });
  } else if (s.kind === 'box') {
    boxSelect(s);
  } else if (s.kind === 'deck') {
    const c = (s.list || [])[s.i];
    if (!c) return;
    const at = G.deck.indexOf(c.u);
    if (at >= 0) {
      if (G.deck.length <= DECK_MIN) { setToast(`A deck needs at least ${DECK_MIN} cards.`); return; }
      G.deck.splice(at, 1);
      setToast(`${CARDS[c.id].name} set aside.`);
    } else {
      if (G.deck.length >= DECK_MAX) { setToast(`A deck holds at most ${DECK_MAX} cards.`); return; }
      G.deck.push(c.u);
      setToast(`${CARDS[c.id].name} shuffled in.`);
    }
    saveGame();
    renderScreen();
  } else if (s.kind === 'chests') {
    const kind = (s.list || [])[s.i];
    const ch = CHESTS[kind];
    if (!ch) return;
    if (G.gems < ch.cost) { setToast(`${countOf(ch.cost - G.gems, 'gem')} short.`); return; }
    s.got = openChest(kind);
    // Its own sound. It borrowed the catch cue, so the biggest thing you can
    // buy announced itself as something else happening.
    playCue('chest');
    saveGame();
    renderScreen();
    // The beat runs over the shop, and the screen is still behind it when it
    // ends — you came here to open several.
    G.chestOpen = {
      t: 0, tint: CHEST_TINT[kind] || '#ffc94d', label: `${ch.name.toUpperCase()} OPENED`,
      names: (s.got || []).filter(Boolean).map((c) => cardName(c)),
    };
  } else if (s.kind === 'bag') {
    const id = (s.list || [])[s.i];
    if (!id) return;
    if (G.battle) {
      G.screen = null; if (!HEADLESS) show(els.screen, false);
      G.mode = 'battle';
      submitLog(doAction({ kind: 'item', id }));
      return;
    }
    const it = ITEMS[id];
    // Same reading the row drew itself from, so the refusal and the row agree.
    const use = fieldItemUse(id);
    if (!use.ok) { setToast(use.why); return; }
    const target = use.target;
    G.bag[id]--; if (G.bag[id] <= 0) delete G.bag[id];
    if (it.kind === 'heal') target.hp = clamp(target.hp + it.amt, 0, target.max);
    if (it.kind === 'revive') target.hp = Math.floor(target.max / 2);
    setToast(`${dispName(target)} feels better.`);
    renderScreen();
  } else if (s.kind === 'shop') {
    const id = (s.list || [])[s.i];
    const it = ITEMS[id];
    if (!it) return;
    if (G.money < it.cost) { setToast('Not enough shards.'); return; }
    G.money -= it.cost;
    G.bag[id] = (G.bag[id] || 0) + 1;
    setToast(`Bought ${it.name}.`);
    renderScreen();
  } else if (s.kind === 'dex') {
    renderScreen();
  }
}
/* ============================================================ §8 — sound ==
   A tiny square-wave sequencer. Two looping themes and a handful of cues.
   Everything is guarded: no AudioContext, no sound, no crash.
   ======================================================================== */
let AC = null, muted = false, musicTimer = null, musicStep = 0, musicTrack = 'world';

// Each theme is a set of 16-step phrases (semitone offsets from A3, 0 = rest)
// plus an order to play them in, so a loop takes four bars to come round.

  },

  // rival, all playing the tune the long grass plays. Faster than the wild
  // theme and squarer, and its bass walks instead of rocking between two
  // chords, because somebody chose this fight.
  duel: {
    bpm: 158, order: [0, 1, 0, 2], bass: [0, 0, 7, 7, 3, 3, 5, 5],
    lead: [
      [12, 12, 14, 15, 17, 15, 14, 12, 10, 10, 12, 14, 15, 14, 12, 10],
      [15, 15, 17, 19, 20, 19, 17, 15, 14, 14, 15, 17, 19, 17, 15, 14],
      [24, 22, 20, 19, 17, 15, 14, 12, 10, 12, 14, 15, 17, 19, 20, 22],
    ],

  rival: {

  // The four places you TRAVEL get their own; the town and the rooms in it
  // keep `world`, which is the tune the valley hums.
  route: {                        // Route One: open, bright, walking pace
    bpm: 116, order: [0, 1, 0, 2], bass: [0, 0, 5, 5, 7, 7, 5, 5],
    lead: [
      [12, 0, 14, 16, 0, 16, 14, 0, 12, 0, 9, 0, 12, 14, 16, 0],
      [16, 0, 17, 19, 0, 17, 16, 0, 14, 0, 12, 0, 14, 0, 16, 0],
      [19, 0, 16, 0, 14, 12, 0, 14, 16, 0, 19, 0, 21, 0, 19, 0],
    ],
  },
  mere: {                         // Stillmere: wide and slow, water under it
    bpm: 92, order: [0, 1], bass: [0, 0, 0, 7, 5, 5, 5, 0],
    lead: [
      [12, 0, 0, 16, 0, 0, 19, 0, 0, 16, 0, 0, 14, 0, 0, 0],
      [17, 0, 0, 14, 0, 0, 12, 0, 0, 9, 0, 12, 0, 0, 7, 0],
    ],
  },
  wood: {                         // the Emberwood: close, low, never quite still
    bpm: 100, order: [0, 1, 0, 2], bass: [0, 0, 3, 3, 2, 2, 5, 5],
    lead: [
      [12, 0, 15, 0, 14, 0, 15, 0, 12, 0, 10, 0, 12, 0, 8, 0],
      [15, 0, 17, 0, 15, 14, 0, 12, 10, 0, 12, 0, 14, 0, 15, 0],
      [20, 0, 19, 0, 17, 0, 15, 14, 12, 0, 10, 0, 8, 0, 12, 0],

  },
