body .ldui{backdrop-filter:none}
body .ldui-sheet{border-radius:0!important;border:3px solid #1a0b26;box-shadow:inset 0 0 0 3px #e9dcff,inset 0 0 0 6px #1a0b26;font-family:var(--ld-font);font-size:20px;color:var(--ld-ink);image-rendering:pixelated}
body .ldui-head{padding:18px 18px 8px}
body .ldui-title{font-family:var(--ld-font-display);font-size:24px;color:#ffd84a;text-shadow:3px 3px 0 #1a0b26;text-transform:uppercase}
body .ldui-pts,body .ldui-tab,body .ldui-btn,body .ldui-lv,body .ldui-x,body .ldui-skin,body .ldui-sw,body .ldui-toast{border-radius:0!important;font-family:var(--ld-font-display)}
body .ldui-pts{border:3px solid #1a0b26;box-shadow:0 3px 0 #7a4f06;font-size:12px}
body .ldui-x{border:3px solid #1a0b26;background:#5b3d8a;color:#fff;box-shadow:0 4px 0 #1f1238;font:700 26px/1 system-ui,sans-serif}
body .ldui-tab{border:3px solid #1a0b26;background:#3a2560;color:#fff;font-size:12px;box-shadow:0 3px 0 #1f1238}
body .ldui-tab[aria-selected="true"]{background:#ffd84a;color:#1a0b26;box-shadow:0 3px 0 #7a4f06}
body .ldui-lv{border:3px solid #1a0b26;background:#3a2560;color:#fff;box-shadow:inset 3px 3px 0 #6b4a9a,0 4px 0 #1f1238;font-size:16px}
body .ldui-lv.solved{background:#78bd35;color:#1a0b26;box-shadow:inset 3px 3px 0 #b4f26a,0 4px 0 #24500c}
body .ldui-lv .st{color:#ffd84a;text-shadow:1px 1px 0 #1a0b26}
body .ldui-lv.now{outline:3px dashed #ffd84a;outline-offset:3px}
body .ldui-btn{border:3px solid #1a0b26;background:#78bd35;color:#1a0b26;box-shadow:inset 3px 3px 0 #b4f26a,inset -3px -3px 0 #3f7f18,0 5px 0 #24500c;font-size:14px;text-transform:uppercase}
body .ldui-btn.alt{background:#5b3d8a;color:#fff;box-shadow:inset 3px 3px 0 #9a7ad0,inset -3px -3px 0 #3a2560,0 5px 0 #1f1238}
body .ldui-btn.gold{background:#ffd84a;color:#1a0b26;box-shadow:inset 3px 3px 0 #fff7b0,inset -3px -3px 0 #c98a12,0 5px 0 #7a4f06}
body .ldui-btn:active,body .ldui-lv:active:not(:disabled),body .ldui-x:active,body .ldui-tab:active{transform:translateY(4px)!important;box-shadow:none}
body .ldui-skin{border:3px solid #1a0b26;background:#3a2560}
body .ldui-skin .nm{font-size:14px} body .ldui-skin .by,body .ldui-note,body .ldui-hero p,body .ldui-row small{color:#c9b8ee;font-size:18px}
body .ldui-hero h3{font-family:var(--ld-font-display);color:#ff9fc6;text-shadow:3px 3px 0 #1a0b26}
body .ldui-row{border-bottom:3px dotted #5b3d8a}
body .ldui-sw{border:3px solid #1a0b26;background:#3a2560} body .ldui-sw::after{border-radius:0;box-shadow:none;background:#fff6e0}
body .ldui-sw[aria-checked="true"]{background:#78bd35}

body .ldx-cheer{font-family:"Silkscreen",ui-monospace,monospace!important;font-size:13px!important;line-height:1.25!important;color:#ffd84a;text-shadow:2px 2px 0 #1a0b26}
body .ldx-pill{border-radius:0!important;border:2px solid #1a0b26;font-family:"Silkscreen",ui-monospace,monospace!important;font-size:10px!important;font-weight:400!important;background:#3a2560;color:#fff;box-shadow:0 2px 0 #1f1238}
body .ldx-pill.hot{background:#ff7fb2;color:#1a0b26} body .ldx-pill.gold{background:#ffd84a;color:#1a0b26}
body .ldx-goal i{border-radius:0!important;width:7px!important;height:7px!important}
body .ldx-look{font-size:16px!important;font-weight:400!important;grid-template-columns:28px 1fr!important}
body .ldx-look img{border-radius:0!important;width:28px!important;height:36px!important;border:2px solid #1a0b26!important;image-rendering:pixelated}
body .ldx-bar{border-radius:0!important;height:9px!important;border:2px solid #1a0b26!important;background:#1a0b26!important}

body .ldx-look.ready .ldx-bar b{background:repeating-linear-gradient(90deg,#ffd84a 0 6px,#fff7b0 6px 9px)!important}

.xslot .ldx{margin:0}
body .ldui-toast{border:3px solid #1a0b26;background:#ffd84a;color:#1a0b26;box-shadow:0 5px 0 #7a4f06;font-size:13px}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#120a22;overflow:hidden;overscroll-behavior:none}
body{position:fixed;inset:0;touch-action:manipulation;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;font:12px monospace;color:#fff}
canvas{image-rendering:pixelated;image-rendering:crisp-edges;display:block}

.screen.on{display:flex}

.row{display:flex;flex-direction:row;align-items:center;justify-content:center}
.sp{flex:1 1 0;min-height:0}

.pb canvas{pointer-events:none}
.pb.green{--n:var(--g-n);--h:var(--g-h);--p:var(--g-p);--d:var(--x-n)}

function parseFont(src, h) {
  const out = {};
  for (const ch in src) {
    const rows = src[ch].split('/');
    while (rows.length < h) rows.push('.'.repeat(rows[0].length));
    const px = [];
    rows.forEach((r, y) => { for (let x = 0; x < r.length; x++) if (r[x] === '#') px.push(x, y); });
    out[ch] = { w: rows[0].length, px };
  }

defScreen('outfits', { enter() { BG.mode = 'outfits'; }, frame: drawOutfits });


/* ============ BOOT: routing, main loop, desktop side panels ============ */
const SCREENS = ['title', 'game', 'demo'];
// hash routes: #title, #game (continue the current gig), #demo (the how-to-play autoplay); no hash = title
function routeHash(h) {
  h = (h || '').replace('#', '').toLowerCase();
  if (h === 'demo') { LD.audio.unlock(); show('game', { demo: true }); }
  else if (h === 'game') show('game', { id: LD.meta.currentId() });
  else show('title');
}
function route() { routeHash(location.hash); }
// desktop: the side space becomes a poster (the duo dancing) and a how-to-play card
const HOWTO = ['HOW TO PLAY', '', 'ONE PERFORMER IN EVERY', 'ROW, COLUMN AND ZONE.', 'PERFORMERS NEVER TOUCH,', 'NOT EVEN DIAGONALLY.', '', 'TAP ........... X', 'SLIDE ......... PAINT X\'S', 'ARROW ......... CROSS A LINE', 'DOUBLE-TAP .... PERFORMER', 'HOLD .......... PERFORMER', 'RIGHT-CLICK ... PERFORMER', '', 'KEYS: ARROWS, SPACE = X', 'ENTER = PERFORMER', 'Z = UNDO   H = ASK JASMIN'];
BG.side = function (x, t, W, H) {
  const free = LY.sx; if (free < 80) return;
  // left: poster
  const cx = Math.floor(free / 2), cy = Math.floor(H * 0.48), k = free >= 150 && H >= 220 ? 3 : 2;
  disc(x, cx, cy, 16 * k, '#c93f78'); disc(x, cx, cy, 15 * k, '#ff4f97'); disc(x, cx, cy, 15 * k, '#ff7fb2', 0.4);
  const f = BEAT.live && LD.loop.playing ? ((BEAT.step >> 2) % 2) : (((t / 500) | 0) % 2);
  const cheer = SCR.cur === 'win' || (G.winT && SCR.cur === 'game');
  const rx = charC('rox', cheer && f ? 'cheer' : 'idle', cheer ? ['happy', 'open'] : ((t % 3100) < 120 ? ['blink'] : [])), jx = charC('jas', cheer && !f ? 'cheer' : 'idle', cheer ? ['happy', 'open'] : (((t + 1400) % 3600) < 120 ? ['blink'] : []));
  const by = cy + 16 * k - 30 * k;
  x.fillStyle = '#12091f'; x.fillRect(cx - 21 * k, cy + 16 * k - 1, 42 * k, k);
  x.drawImage(rx, 0, 0, 22, 30, cx - 22 * k - 1, by - (f ? k : 0), 22 * k, 30 * k);
  x.drawImage(jx, 0, 0, 22, 30, cx + 1, by - (f ? 0 : k), 22 * k, 30 * k);
  if (SCR.cur !== 'title') { const L = logoC(); x.drawImage(L.c, Math.round(cx - L.c.width / 2), Math.max(4, cy - 16 * k - 34)); }
  else if (((t / 500) | 0) % 2) text(x, '1 PLAYER  *  PRESS START', cx, Math.max(4, cy - 16 * k - 20), { font: FONT5, color: '#fff27a', outline: '#1a0b26', align: 'center' });
  text(x, 'BEATBOX + SINGING DUO', cx, cy + 16 * k + 6, { font: FONT5, color: '#ffc9de', outline: '#1a0b26', align: 'center' });
  text(x, '100% ORGANIC MUSIC WITH THE HUMAN VOICE', cx, cy + 16 * k + 14, { font: FONT5, color: '#a9f060', outline: '#1a0b26', align: 'center' });
  // right: how to play card
  const rx0 = LY.sx + 130 + 8, rw = Math.min(118, W - rx0 - 6); if (rw < 90) return;
  const ry = Math.floor(H * 0.2);
  hudBox(x, rx0, ry, rw, HOWTO.length * 7 + 40, '#22143d');
  HOWTO.forEach((l, i) => text(x, l, rx0 + 6, ry + 6 + i * 7, { font: i === 0 ? FONT5 : FONT5, color: i === 0 ? '#fff27a' : /PERFORMER|X/.test(l) && i > 6 ? '#ffffff' : '#c9b8ee' }));
  const ly = ry + 8 + HOWTO.length * 7;
  x.fillStyle = '#1a0b26'; x.fillRect(rx0 + 6, ly, 18, 18); x.drawImage(tileC(REG[0].c, 0, 0, 16), rx0 + 7, ly + 1); x.drawImage(XS.x10(), rx0 + 10, ly + 4);
  x.fillStyle = '#1a0b26'; x.fillRect(rx0 + 28, ly, 18, 18); x.drawImage(padTileC('roxor', 0, 16), rx0 + 29, ly + 1); x.drawImage(tokenC('roxor', 16), rx0 + 29, ly + 1);
  x.fillStyle = '#1a0b26'; x.fillRect(rx0 + 50, ly, 18, 18); x.drawImage(padTileC('jasmin', 0, 16), rx0 + 51, ly + 1); x.drawImage(tokenC('jasmin', 16), rx0 + 51, ly + 1);
  text(x, 'X  ROXOR  JASMIN', rx0 + 6, ly + 21, { font: FONT5, color: '#b2acbc' });
};
let lastFrame = 0;
function frame() {
  requestAnimationFrame(frame);
  drawAll();
}
function drawAll() {
  const t = now(); lastFrame = t;
  try {
    if (t - BG.lastDraw > 32) { BG.lastDraw = t; bgDraw(t); }
    const d = SCR.defs[SCR.cur]; if (d && d.frame) d.frame(t);
    fxStep(t);
    if (SCR.cur === 'game') drawFinger(g2($('#fx')), t);
  } catch (e) { console.error(e); }
}
function init() {
  layout(); bgInit();
  buildTitle(); buildGameScreen(); buildWin(); buildOutfits();
  SET.muted = !LD.meta.settings().sound; setCRT(SET.crt);
  route();
  window.addEventListener('resize', layout);
  window.addEventListener('hashchange', () => routeHash(location.hash));
  window.addEventListener('keydown', (e) => { if (e.key === 'Escape') { if ($('#modal').classList.contains('on')) closeModal(); else if (SCR.cur === 'game' && !LD.ui.isOpen()) pauseMenu(); } });
  document.addEventListener('visibilitychange', () => { if (document.hidden) LD.loop.stop(); else if (SCR.cur === 'game' && G.game && G.game.t0 !== null && !G.game.over && !G.frozen) LD.loop.start(); });
  requestAnimationFrame(frame);
  setInterval(() => { if (now() - lastFrame > 180) drawAll(); }, 200);
  window.__ready = true;
  window.LDSKIN = {
    game: () => G.game,
    start: (id) => startGig(id),
    screen: () => (SCR.cur === 'game' && G.game && G.game.over && !G.game.won ? 'lose' : SCR.cur),
    arrowRect: (kind, i) => { const b = G.arrowBtns.find((q) => q.dataset.kind === kind && +q.dataset.i === i); return b ? b.getBoundingClientRect() : null; },
  };
}
init();

})();
