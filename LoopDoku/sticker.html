<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ff5aa8">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%27-40 -24 80 48%27%3E%3Cpath d=%27M0 0C-6-9-13-13-20-13C-28-13-33-7-33 0C-33 7-28 13-20 13C-13 13-6 9 0 0C6-9 13-13 20-13C28-13 33-7 33 0C33 7 28 13 20 13C13 13 6 9 0 0Z%27 fill=%27none%27 stroke=%27%23fff%27 stroke-width=%2716%27/%3E%3Cpath d=%27M0 0C-6-9-13-13-20-13C-28-13-33-7-33 0C-33 7-28 13-20 13C-13 13-6 9 0 0C6-9 13-13 20-13C28-13 33-7 33 0C33 7 28 13 20 13C13 13 6 9 0 0Z%27 fill=%27none%27 stroke=%27%2378bd35%27 stroke-width=%279%27/%3E%3C/svg%3E">
<title>LoopDoku</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Fredoka:wght@500;600;700&family=Gochi+Hand&display=swap" rel="stylesheet">
<style>
@property --peel{syntax:'<length>';inherits:true;initial-value:12px}
:root{
  --hot:#ff5aa8;--hot2:#e8388a;--cream:#fff6ec;--cream2:#f4e2d0;--ink:#3a1232;--ink2:#7b4a6f;
  --green:#78bd35;--green-dk:#3f7f18;--green-glow:#a9f060;--pink:#ff7fb2;--pink-dk:#c93f78;--pink-lt:#ffc9de;
  --sun:#ffd23f;--sky:#5cc8ff;--red:#ff3355;--lilac:#b99bff;--orange:#ff9a3c;--mint:#5fdcb8;
  --fd:'Fredoka','Baloo 2',system-ui,sans-serif;--fn:'Baloo 2','Fredoka',system-ui,sans-serif;--fh:'Gochi Hand','Comic Sans MS',cursive;
  --sh:0 3px 0 rgba(120,20,70,.2),0 10px 18px -6px rgba(80,0,40,.5);
  --shs:0 2px 0 rgba(120,20,70,.22),0 5px 8px -3px rgba(80,0,40,.4);
  --dsh:drop-shadow(0 3px 0 rgba(110,15,65,.26)) drop-shadow(0 7px 7px rgba(80,0,40,.24));
  /* the shared LoopDoku overlays, dressed as stickers */
  --ld-font:'Baloo 2','Fredoka',system-ui,sans-serif;--ld-font-display:'Fredoka','Baloo 2',system-ui,sans-serif;
  --ld-ink:#3a1232;--ld-muted:#7b4a6f;--ld-panel:#fff6ec;--ld-panel-2:#ffffff;--ld-backdrop:rgba(120,10,70,.55);
  --ld-accent:#78bd35;--ld-accent-ink:#ffffff;--ld-accent-2:#ffd23f;--ld-accent-2-ink:#3a1232;
  --ld-line:3px solid #ffffff;--ld-radius:22px;--ld-shadow:0 3px 0 rgba(120,20,70,.25),0 14px 30px -6px rgba(80,0,40,.6);--ld-lock:#d9c4cf;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden}
body{background:#ff5aa8;color:var(--ink);font-family:var(--fd);-webkit-font-smoothing:antialiased;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
button{font:inherit;color:inherit;border:0;background:none;padding:0;margin:0;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
svg{display:block;overflow:visible}
#defs{position:absolute;width:0;height:0;overflow:hidden;pointer-events:none}

/* ---------- the hot-pink laptop lid ---------- */
#world{position:fixed;inset:0;overflow:hidden;z-index:0;background:radial-gradient(140% 90% at 50% 18%,#ff7aba 0%,#ff57a5 46%,#e2378a 100%)}
#world::before{content:'';position:absolute;inset:0;background-image:var(--grain);opacity:.6;mix-blend-mode:multiply;pointer-events:none}
#world::after{content:'';position:absolute;inset:-36px;background:radial-gradient(circle,rgba(255,255,255,.16) 1.4px,transparent 2px) 0 0/18px 18px;animation:drift 26s linear infinite;pointer-events:none}
@keyframes drift{to{transform:translate(18px,18px)}}
.deco{position:absolute;width:var(--s);height:var(--s);will-change:transform;animation:bob var(--d,7s) ease-in-out var(--dl,0s) infinite alternate;transform:rotate(var(--r))}
.deco svg{width:100%;height:100%}
@media (max-width:700px){.deco.wideOnly{display:none}}
@keyframes bob{from{transform:translateY(0) rotate(var(--r))}to{transform:translateY(-12px) rotate(calc(var(--r) + 6deg))}}

/* ---------- app frame ---------- */
#app{position:relative;z-index:1;height:100%;height:100dvh;display:flex;flex-direction:column;align-items:center}
#stage{position:relative;flex:1 1 auto;width:100%;max-width:440px;min-height:0}
body.wide #stage{max-width:1080px}
.screen{position:absolute;inset:0;display:none;flex-direction:column}
.screen.on{display:flex}
.screen.scroll{overflow-y:auto;overflow-x:hidden;overflow-anchor:none;-webkit-overflow-scrolling:touch;padding-bottom:calc(28px + env(safe-area-inset-bottom,0px))}
.screen.scroll::-webkit-scrollbar{width:0;height:0}

/* ---------- sticker buttons: die-cut border, gloss, peel corner, squish ---------- */
.btn{--bg:var(--cream);--fg:var(--ink);--tilt:0deg;position:relative;display:inline-flex;transform:rotate(var(--tilt));filter:var(--dsh);transition:transform .34s cubic-bezier(.3,1.9,.45,1),filter .2s,--peel .22s ease;-webkit-user-select:none;user-select:none}
.btn .face{position:relative;flex:1;display:flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:8px 18px;background:var(--bg);color:var(--fg);border:4px solid #fff;border-radius:18px 18px 7px 18px;font:700 18px/1 var(--fd);letter-spacing:.01em;white-space:nowrap;clip-path:polygon(0 0,100% 0,100% calc(100% - var(--peel)),calc(100% - var(--peel)) 100%,0 100%)}
.btn .face::before{content:'';position:absolute;inset:0;border-radius:14px 14px 4px 14px;background:linear-gradient(172deg,rgba(255,255,255,.55),rgba(255,255,255,.12) 44%,rgba(255,255,255,0) 45%);pointer-events:none}
.btn .face::after{content:'';position:absolute;right:-4px;bottom:-4px;width:var(--peel);height:var(--peel);background:linear-gradient(135deg,#fff 0%,#f6eef2 30%,#cdb3c2 48%,transparent 49.5%);pointer-events:none}
.btn .face>*{position:relative}
.btn .face svg{width:24px;height:24px;flex:none}
@media (hover:hover){.btn:hover{--peel:22px;transform:translateY(-3px) rotate(calc(var(--tilt) - 1.5deg))}}
.btn.is-hover{--peel:22px;transform:translateY(-3px) rotate(calc(var(--tilt) - 1.5deg))}
.btn.is-press,.btn:active{--peel:8px;transform:translateY(3px) rotate(var(--tilt)) scale(.95,.86);filter:drop-shadow(0 1px 0 rgba(110,15,65,.3)) drop-shadow(0 2px 2px rgba(80,0,40,.2));transition-duration:.06s}
.btn:disabled,.btn.is-dis{filter:saturate(.15) opacity(.5);cursor:default;transform:rotate(var(--tilt));--peel:12px}
.btn.primary{--bg:var(--green);--fg:#fff}
.btn.pink{--bg:var(--pink);--fg:#fff}
.btn.sun{--bg:var(--sun)}
.btn.ink{--bg:var(--ink);--fg:#fff}
.btn.primary .face,.btn.pink .face,.btn.ink .face{text-shadow:0 2px 0 rgba(60,0,40,.22)}
.btn.icon .face{width:50px;height:50px;min-height:0;padding:0;border-radius:16px 16px 7px 16px}
.btn.icon.sm .face{width:44px;height:44px;border-radius:14px 14px 6px 14px}
.btn.icon.sm .face svg{width:21px;height:21px}
.btn.big .face{min-height:64px;font-size:27px;border-radius:22px 22px 8px 22px;gap:10px}
.btn.big .face svg{width:28px;height:28px}
.btn.wob{animation:wob .4s}
@keyframes wob{20%{transform:translateX(-6px) rotate(-4deg)}45%{transform:translateX(5px) rotate(3deg)}70%{transform:translateX(-3px)}}

/* generic peel-off label */
.peelbox{--peel:24px;position:relative;clip-path:polygon(0 0,100% 0,100% calc(100% - var(--peel)),calc(100% - var(--peel)) 100%,0 100%)}
.peelbox::after{content:'';position:absolute;right:0;bottom:0;width:var(--peel);height:var(--peel);background:linear-gradient(135deg,#fff 0%,#f4ecf0 30%,#c9adbe 48%,transparent 49.5%);pointer-events:none}
.card{background:var(--cream);border:4px solid #fff;border-radius:20px;box-shadow:var(--sh)}
.lbl{display:inline-flex;align-items:center;gap:5px;background:#fff;color:var(--ink);border-radius:10px 10px 4px 10px;padding:4px 8px;font:700 12px/1 var(--fd);box-shadow:var(--shs)}

/* ---------- logo ---------- */
.logo{display:inline-flex;align-items:center;font:700 var(--fs,60px)/1.05 var(--fd);letter-spacing:-.005em;filter:url(#dcL)}
.logo.sm{filter:url(#dcLs)}
.lg{display:inline-block;padding:.02em .005em}
.lg.g{background:linear-gradient(180deg,#9ad94f 0%,#7cc037 52%,#5b9c21 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.lg.p{background:var(--grain),linear-gradient(180deg,#ffa6cc 0%,#ff7fb2 52%,#ea5a99 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.inf{display:inline-block;width:1.5em;height:.78em;margin:0 .0em 0 -.01em}
.inf svg{width:100%;height:100%}

/* ---------- title ---------- */
#s-title{align-items:center;justify-content:center;padding:4px 14px calc(12px + env(safe-area-inset-bottom,0px));gap:4px}
.tHero{position:relative;width:100%;max-width:372px;height:min(31dvh,300px);flex:none;margin-top:18px}
.tCircle{position:absolute;left:50%;top:1%;height:90%;aspect-ratio:1;transform:translateX(-50%);border-radius:50%;background:var(--grain),radial-gradient(circle at 38% 32%,#ff8fc6,#f2579f 58%,#d53a85);border:7px solid #fff;box-shadow:var(--sh)}
.tCircle::after{content:'';position:absolute;inset:8%;border-radius:50%;background:radial-gradient(circle at 30% 25%,rgba(255,255,255,.4),rgba(255,255,255,0) 40%)}
.tFig{position:absolute;bottom:-3%;height:94%;will-change:transform}
.tFig svg{height:100%;width:auto}
.tFig.r{left:-3%;animation:hop 1.25s ease-in-out infinite}
.tFig.j{right:-4%;animation:hop 1.25s ease-in-out .31s infinite}
@keyframes hop{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.juiceBtn{position:absolute;right:-10px;top:-24px;width:122px;height:122px;z-index:3;transform:rotate(12deg);animation:jpulse 1.25s ease-in-out infinite;display:grid;place-items:center}
.juiceBtn svg{position:absolute;inset:0;width:100%;height:100%}
.juiceBtn span{position:relative;font:700 15px/1 var(--fd);color:var(--ink);text-align:center;letter-spacing:.02em}
.juiceBtn span b{display:block;font-size:17.5px;line-height:1.02;color:var(--pink-dk);letter-spacing:-.01em}
.juiceBtn span i{display:block;font-style:normal;font-size:13px;margin-top:2px}
.juiceBtn:active{transform:rotate(12deg) scale(.88)}
@keyframes jpulse{0%,100%{transform:rotate(12deg) scale(1)}12%{transform:rotate(8deg) scale(1.1)}24%{transform:rotate(13deg) scale(.98)}}
.tLabelW{position:relative;z-index:2;margin-top:-30px;filter:var(--dsh);transform:rotate(-2.5deg);flex:none}
.tLabel{--peel:28px;background:#fff;border-radius:24px 24px 10px 24px;padding:10px 20px 10px;text-align:center}
.tLabel .logo{--fs:clamp(44px,14.5vw,62px)}
.tag{font:400 21px/1 var(--fh);color:var(--pink-dk);margin-top:1px;letter-spacing:.02em}
.tMenu{display:grid;grid-template-columns:repeat(6,1fr);gap:10px 9px;width:100%;max-width:362px;margin-top:10px;flex:none}
.tMenu .btn{grid-column:span 2}
.tMenu #bDaily,.tMenu #bTourT{grid-column:span 3}
.tMenu .btn.play{grid-column:1/-1}
.tMenu #bSupport{grid-column:1/-1}
.tMenu #bSupport .face,.tMenu #bDaily .face,.tMenu #bTourT .face{flex-direction:row;min-height:48px;font-size:16px!important;gap:8px}
.tMenu .btn:not(.big) .face{flex-direction:column;gap:3px;min-height:58px;padding:6px 4px;font-size:14px!important}
.tMenu .btn:not(.big) .face svg{width:22px;height:22px}
.ptsChip{gap:4px;font:800 14px/1 var(--fn);padding:5px 9px 4px;background:var(--sun);color:var(--ink);border:3px solid #fff;transform:rotate(-3deg)}
.ptsChip .star{color:#fff;text-shadow:0 1px 0 rgba(120,60,0,.5);font-size:15px}
.tPts{position:absolute;left:0;top:-14px;z-index:4;font-size:16px;padding:7px 12px 6px;transform:rotate(-6deg)}
.arrows{position:absolute;inset:0;pointer-events:none;z-index:5}
.arw{position:absolute;pointer-events:auto;display:grid;place-items:center;padding:0;touch-action:manipulation;transition:opacity .25s,filter .25s}
.arw .arwIn{display:block;width:var(--ai,22px);height:var(--ai,22px);filter:drop-shadow(0 2px 0 rgba(110,15,65,.35)) drop-shadow(0 3px 3px rgba(80,0,40,.25));will-change:transform}
.arw svg{width:100%;height:100%;transform:rotate(var(--tl,0deg))}
.arw.dim{opacity:.4;filter:saturate(.25)}
@media (hover:hover){.arw:hover .arwIn{transform:scale(1.18)}}
.ptsBox{display:flex;align-items:center;gap:10px;width:100%;padding:6px 8px 2px;border-top:2px dashed rgba(58,18,50,.14);margin-top:2px}
.ptsBox.demo .ptsBig{opacity:.4}
.ptsBig{font:800 34px/1 var(--fn);color:var(--green-dk);display:flex;align-items:baseline;gap:2px;background:#fff;border:3px solid #fff;border-radius:14px 14px 5px 14px;padding:6px 10px 3px;box-shadow:var(--shs);transform:rotate(-4deg)}
.ptsBig b{color:var(--green)}
.ptsBig small{font:700 13px var(--fd);color:var(--ink2);margin-left:3px}
.ptsSide{flex:1;min-width:0}
.breaks{display:flex;flex-wrap:wrap;gap:4px}
.bchip{display:inline-block;font:700 11.5px/1 var(--fd);color:#fff;background:var(--c);border:2px solid #fff;border-radius:8px;padding:4px 6px 3px;box-shadow:0 2px 0 rgba(60,0,40,.2);transform:rotate(var(--r,0deg))}
.bchip b{font-weight:800}
.tot{font:600 12px/1.2 var(--fd);color:var(--ink2);margin-top:5px;letter-spacing:.06em;text-transform:uppercase}
.tot b{font:800 17px var(--fn);color:var(--ink);letter-spacing:0}
.menuGrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.menuGrid .wide{grid-column:1/-1}
.tMenu .play{grid-column:1/-1}
@media (max-height:760px){.tFoot{display:none}}
.tFoot{margin-top:10px;white-space:nowrap;font:400 clamp(14px,4.5vw,18px)/1 var(--fh);color:#fff;opacity:.92;text-align:center;letter-spacing:.03em;text-shadow:0 2px 0 rgba(160,20,90,.45)}
.tFoot b{font-weight:400;color:var(--pink-lt)}
/* encouragement cards (LD.ui extras), dressed as a peel-off sticker label */
.xWrap{width:100%}
.xWrap .ldx{border:3px solid #fff;border-radius:16px 16px 6px 16px;background:#fff;box-shadow:var(--shs);padding:8px 10px;gap:6px;transform:rotate(.6deg)}
.xWrap .ldx-cheer{font:400 17px/1.15 var(--fh);color:var(--pink-dk)}
.xWrap .ldx-pill{border:2px solid #fff;box-shadow:0 2px 0 rgba(60,0,40,.18);font-family:var(--fd);font-weight:700}
.tX{max-width:362px;margin-top:10px;flex:none}
.tX .ldx{transform:rotate(-1deg)}
#wExtras .ldx{padding:6px 8px;font-size:12px}
#wExtras .ldx-cheer{font-size:16px}
.overCard .xWrap{margin:-4px 0 12px;text-align:left}
.streakChip{gap:2px;font:800 14px/1 var(--fn);padding:5px 8px 4px;background:var(--red);color:#fff;border:3px solid #fff;transform:rotate(4deg);animation:jpulse2 1.25s ease-in-out infinite}
.streakChip[hidden]{display:none}
.btn .go{font-style:normal;display:inline-block;animation:goNudge .8s ease-in-out infinite;margin-left:2px}
@keyframes goNudge{0%,100%{transform:translateX(0)}50%{transform:translateX(5px)}}
#wNext .face{font-size:30px;min-height:70px;background:linear-gradient(180deg,#8fd645,#6cb22a)}
.tMenu .btn .face{font-size:17px}
.tMenu .btn.big .face{font-size:28px}

/* ---------- game ---------- */
#s-game{padding:0 0 calc(6px + env(safe-area-inset-bottom,0px))}
.hud{position:relative;margin:2px 10px 0;padding:7px 8px 7px;flex:none}
.hudTop{display:flex;align-items:center;gap:7px}
.gig{flex:1;min-width:0;padding:0 2px}
.gig .city{font:700 var(--cityfs,21px)/1 var(--fd);color:var(--ink);text-transform:uppercase;letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gig .venue{font:600 12.5px/1.25 var(--fn);color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.gig .venue b{color:var(--pink-dk);font-weight:800}
.timer{display:flex;align-items:center;gap:4px;padding:6px 9px 5px;background:var(--ink);color:#fff;border:3px solid #fff;border-radius:12px 12px 4px 12px;font:800 18px/1 var(--fn);box-shadow:var(--shs);transform:rotate(2deg);font-variant-numeric:tabular-nums;flex:none}
.timer svg{width:15px;height:15px}
.hudMid{display:flex;align-items:center;justify-content:space-between;margin-top:6px;gap:6px}
.lives{display:flex;gap:1px;align-items:center}
.life{position:relative;width:40px;height:40px;border-radius:50%;background:var(--c);border:3px solid #fff;box-shadow:0 2px 0 rgba(60,0,40,.22),0 4px 6px -2px rgba(80,0,40,.4);transform:rotate(var(--r,0deg));margin-right:3px}
.life::after{content:'';position:absolute;inset:1px;border-radius:50%;background:linear-gradient(160deg,rgba(255,255,255,.55),rgba(255,255,255,0) 50%);pointer-events:none}
.life svg{position:absolute;inset:-2px;width:calc(100% + 4px);height:calc(100% + 4px)}
.life.lost{background:transparent;border-color:transparent;box-shadow:none}
.life.lost svg{visibility:hidden}
.life.lost::after{display:none}
.life.lost::before{content:'';position:absolute;inset:1px;border-radius:50%;border:2px dashed rgba(58,18,50,.28);background:rgba(255,255,255,.35)}
.lsHead{text-align:right;line-height:1}
.lsHead .t{font:700 10.5px/1 var(--fd);letter-spacing:.14em;color:var(--ink2);text-transform:uppercase}
.lsHead .n{font:700 15px/1.1 var(--fd);color:var(--ink)}
.lsHead .n b{color:var(--pink-dk)}
.tracks{display:flex;justify-content:space-between;margin-top:6px;padding:0 1px}
.trk{width:33px;height:33px;position:relative;transform:rotate(var(--r,0deg))}
.trk .disc{position:absolute;inset:0;border-radius:50%;border:2px dashed rgba(58,18,50,.25);display:grid;place-items:center;color:rgba(58,18,50,.28);background:rgba(255,255,255,.4)}
.trk.on .disc{border:3px solid #fff;background:var(--c);color:#fff;box-shadow:0 2px 0 rgba(60,0,40,.22),0 4px 6px -2px rgba(80,0,40,.4)}
.trk.on .disc::before{content:'';position:absolute;inset:2px;border-radius:50%;background:linear-gradient(160deg,rgba(255,255,255,.5),rgba(255,255,255,0) 50%)}
.trk svg{width:17px;height:17px;position:relative}
.duoRow{display:flex;align-items:flex-end;gap:2px;padding:0 6px;flex:0 1 auto;height:clamp(64px,13.5dvh,124px);min-height:58px}
.bust{height:100%;aspect-ratio:228/236;flex:none;position:relative;will-change:transform}
.bust svg{width:100%;height:100%}
.bubble{flex:1;align-self:center;position:relative;background:#fff;border-radius:18px 18px 18px 18px;padding:7px 10px;font:400 19px/1.08 var(--fh);color:var(--ink);text-align:center;box-shadow:var(--shs);min-height:42px;display:grid;place-items:center;margin-bottom:6px}
.bubble::before{content:'';position:absolute;bottom:9px;width:16px;height:16px;background:#fff;transform:rotate(45deg);border-radius:3px}
.bubble.fromR::before{left:-6px}.bubble.fromJ::before{right:-6px}
.boardArea{flex:1 1 auto;min-height:0;position:relative;display:flex;align-items:center;justify-content:center;padding:4px 0}
.boardBox{position:relative;width:300px;height:300px;touch-action:none;flex:none}
.shakeW,.pulseW{position:absolute;inset:0;will-change:transform}
.boardBox canvas{position:absolute;pointer-events:none}
.finger{position:absolute;left:0;top:0;width:56px;height:68px;pointer-events:none;z-index:6;opacity:0;transition:opacity .25s}
.finger.on{opacity:1}
.finger .hand{width:100%;height:100%;transition:transform .12s cubic-bezier(.3,1.8,.5,1);transform-origin:26% 4%}
.finger.down .hand{transform:scale(.86) rotate(-8deg);transition-duration:.06s}
.ctrls{display:flex;gap:8px;justify-content:center;padding:6px 10px 4px;flex:none}
.ctrls .btn{flex:1 1 0}
.ctrls .btn.hint{flex:1.45 1 0}
.ctrls .btn .face{flex-direction:column;gap:3px;min-height:60px;padding:6px 6px 5px;font-size:13.5px;border-radius:16px 16px 7px 16px}
.ctrls .btn .face svg{width:23px;height:23px}
.ctrls .btn.hint .face svg{width:30px;height:30px}
.ctrls .btn.icon{flex:0 0 auto}
.ctrls .btn.icon .face{width:56px;min-height:60px;height:auto}
.overSheet{position:absolute;inset:0;display:none;align-items:center;justify-content:center;z-index:8}
.overSheet.on{display:flex}
.overCard{width:min(88%,330px);padding:16px 16px 18px;text-align:center;animation:slapIn .42s cubic-bezier(.3,1.7,.5,1) both;transform:rotate(-2deg)}
.overCard h2{margin:0;font:700 40px/1 var(--fd);color:var(--red);letter-spacing:.01em}
.overCard p{margin:6px 0 12px;font:400 20px/1.1 var(--fh);color:var(--ink2)}
.overCard .btns{display:flex;flex-direction:column;gap:10px;align-items:stretch}
@keyframes slapIn{0%{transform:scale(1.5) rotate(-10deg);opacity:0}55%{transform:scale(.94) rotate(1deg);opacity:1}80%{transform:scale(1.03) rotate(-2.5deg)}100%{transform:rotate(-2deg)}}

/* ---------- win ---------- */
#s-win{align-items:center;justify-content:flex-start;padding:6px 12px calc(14px + env(safe-area-inset-bottom,0px));overflow-x:hidden;overflow-y:auto}
#s-title{overflow-y:auto;justify-content:flex-start!important}
#bomb{position:fixed;left:0;top:0;width:100vw;height:100vh;pointer-events:none;z-index:0}
.winCard{position:relative;z-index:2;width:100%;max-width:370px;display:flex;flex-direction:column;align-items:center;gap:8px}
.encore{display:flex;margin-top:12px;font:700 clamp(46px,14vw,66px)/1 var(--fd);filter:url(#dcL);transform:rotate(-5deg);margin-bottom:-4px}
.encore span{display:inline-block;animation:eHop .9s ease-in-out infinite;animation-delay:calc(var(--i) * .08s)}
@keyframes eHop{0%,100%{transform:translateY(0)}30%{transform:translateY(-9px) rotate(-3deg)}}
.winPanel{--peel:26px;width:100%;padding:10px 10px 14px;display:flex;flex-direction:column;align-items:center;gap:6px;transform:rotate(-1deg);background:radial-gradient(120% 70% at 50% 45%,#fff 0%,var(--cream) 60%)}
.winGig{font-size:14px;padding:6px 12px;transform:rotate(1.5deg);background:var(--ink);color:#fff}

.winGig b{color:var(--pink-dk)}
.stars{display:flex;gap:6px;align-items:flex-end;height:60px}
.bigstar{width:50px;height:50px;position:relative}
.bigstar.mid{width:60px;height:60px;margin-bottom:6px}
.bigstar svg{width:100%;height:100%}
.bigstar .empty{position:absolute;inset:8%;}
.winDuo{display:flex;justify-content:center;align-items:flex-end;height:clamp(96px,14dvh,150px);margin:-2px 0 -6px}
.winDuo .fig{height:100%}
.winDuo .fig svg{height:100%;width:auto}
.winDuo .fig.r{margin-right:-34px;animation:hop .62s ease-in-out infinite}
.winDuo .fig.j{animation:hop .62s ease-in-out .31s infinite}
.stats{display:flex;gap:8px;justify-content:center}
.stat{flex-direction:column;align-items:center;gap:2px;padding:7px 12px 6px;min-width:84px}
.stat b{font:800 22px/1 var(--fn);color:var(--ink)}
.stat small{font:600 11px/1 var(--fd);letter-spacing:.1em;text-transform:uppercase;color:var(--ink2)}
.stat:nth-child(1){transform:rotate(-3deg)}.stat:nth-child(2){transform:rotate(2deg)}.stat:nth-child(3){transform:rotate(-1deg)}
.winBtns{display:grid;grid-template-columns:1fr auto;gap:10px;width:100%;margin-top:4px}
.winBtns .btn[hidden]{display:none}

/* ---------- pages (tour / outfits / kit) ---------- */
.pageHead{display:flex;align-items:center;gap:10px;padding:8px 12px 6px;position:relative;z-index:5}
.ptitle{font:700 30px/1 var(--fd);color:#fff;letter-spacing:.01em;text-shadow:0 3px 0 var(--hot2),0 6px 10px rgba(80,0,40,.35);transform:rotate(-2deg);flex:1}
.ptitle small{display:block;font:400 18px/1 var(--fh);color:var(--pink-lt);text-shadow:none;margin-top:2px}
.pstat{font-size:13px;padding:6px 10px;transform:rotate(3deg)}
.tourMap{position:relative;margin:0 10px}
.tourMap>svg{position:absolute;left:0;top:0;pointer-events:none}
.stop{position:absolute;display:flex;align-items:center;gap:8px;transform:translate(-31px,-31px)}
.stop.flip{flex-direction:row-reverse;transform:translate(calc(-100% + 31px),-31px)}
.pin{width:62px;height:62px;border-radius:50%;border:4px solid #fff;display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:var(--shs);flex:none;position:relative;font:700 17px/1 var(--fd);color:#fff}
.pin small{font:700 11px/1 var(--fn);opacity:.9}
.stop.done .pin{background:var(--green)}
.stop.cur .pin{background:var(--pink);animation:jpulse2 1.25s ease-in-out infinite}
.stop.lock .pin{background:#d9c4cf;color:#8d6b80}
.stop.lock .pin svg{width:22px;height:22px}
@keyframes jpulse2{0%,100%{transform:scale(1)}15%{transform:scale(1.12)}30%{transform:scale(.97)}}
.stag{background:var(--cream);border:3px solid #fff;border-radius:12px 12px 4px 12px;padding:5px 9px 5px;box-shadow:var(--shs);min-width:0;max-width:170px}
.stag .c{font:700 15px/1.05 var(--fd);color:var(--ink)}
.stag .v{font:600 11.5px/1.2 var(--fn);color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stag .st{display:flex;gap:1px;margin-top:2px}
.stag .st svg{width:15px;height:15px}
.stop.lock .stag{opacity:.72}
.stop.cur .stag{background:#fff}
.nowp{position:absolute;top:-12px;left:50%;transform:translateX(-50%) rotate(-6deg);background:var(--sun);color:var(--ink);font:700 9.5px/1 var(--fd);letter-spacing:.08em;padding:3px 6px;border-radius:6px;border:2px solid #fff;white-space:nowrap;box-shadow:var(--shs)}
.duoPin{position:absolute;display:flex;pointer-events:none}
.duoPin canvas{width:42px;height:42px}
.ofGrid{display:grid;grid-template-columns:1fr 1fr;gap:14px 12px;padding:6px 14px}
.ofCard{position:relative;padding:6px 6px 10px;text-align:center;display:flex;flex-direction:column;align-items:center}
.ofCard:nth-child(odd){transform:rotate(-1.5deg)}.ofCard:nth-child(even){transform:rotate(1.5deg)}
.ofCard .art{height:118px;width:100%;display:flex;justify-content:center;margin:4px 0 8px}
.ofCard .art svg{height:100%;width:auto}
.ofCard .nm{font:700 15px/1.1 var(--fd);color:var(--ink);margin-top:4px}
.ofCard .ds{font:400 15px/1.05 var(--fh);color:var(--ink2);min-height:16px}
.ofCard .btn{margin-top:6px}
.ofCard .btn .face{min-height:38px;font-size:14px;padding:5px 14px}
.ofCard.locked{background:#ead9e2}
.ofCard .spk{position:absolute;left:6px;right:6px;top:6px;height:118px;width:calc(100% - 12px);pointer-events:none;animation:twinkle 1.6s ease-in-out infinite alternate}
@keyframes twinkle{from{opacity:.35}to{opacity:1}}
.ofCard.locked .nm{color:#8d6b80}
.lockBadge{position:absolute;top:8px;right:8px;width:34px;height:34px;border-radius:50%;background:var(--ink);color:#fff;border:3px solid #fff;display:grid;place-items:center;box-shadow:var(--shs);transform:rotate(12deg)}
.lockBadge svg{width:17px;height:17px}
.equipped{position:absolute;top:6px;left:6px;transform:rotate(-10deg);background:var(--green);color:#fff;font:700 10px/1 var(--fd);letter-spacing:.08em;padding:4px 6px;border-radius:7px;border:2px solid #fff;box-shadow:var(--shs)}
.subh{font:700 20px/1 var(--fd);color:#fff;margin:18px 16px 8px;text-shadow:0 2px 0 var(--hot2);transform:rotate(-1deg)}
.kit{padding:4px 12px 30px;display:grid;gap:14px;grid-template-columns:1fr}

.ksec h4{font:600 11px/1 var(--fd);letter-spacing:.12em;text-transform:uppercase;margin:10px 0 6px;color:var(--ink2)}
.swrow{display:flex;flex-wrap:wrap;gap:10px 8px}
.sw{display:flex;flex-direction:column;align-items:center;gap:3px;width:62px}
.sw i{width:46px;height:46px;border-radius:50%;border:4px solid #fff;box-shadow:var(--shs);display:block}
.sw b{font:700 10.5px/1 var(--fd);color:var(--ink)}
.sw small{font:600 9.5px/1 var(--fn);color:var(--ink2)}

.krow{display:flex;flex-wrap:wrap;gap:12px 10px;align-items:flex-end}
.kcell{display:flex;flex-direction:column;align-items:center;gap:5px}
.kcell>small{font:600 10px/1 var(--fd);letter-spacing:.06em;color:var(--ink2);text-transform:uppercase}

.kbtns>small{font:600 10px/1.1 var(--fd);letter-spacing:.06em;color:var(--ink2);text-transform:uppercase;text-align:center}
.kbtns .btn .face{font-size:14px;min-height:42px;padding:6px 8px}

.ico{display:flex;flex-direction:column;align-items:center;gap:4px}
.ico i{width:46px;height:46px;border-radius:14px 14px 5px 14px;background:#fff;color:var(--ink);display:grid;place-items:center;box-shadow:var(--shs)}
.ico i svg{width:24px;height:24px}
.ico small{font:600 10px/1 var(--fd);color:var(--ink2)}
.typeS{display:flex;flex-direction:column;gap:6px}
.typeS .a{font:700 34px/1 var(--fd)}
.typeS .b{font:800 30px/1 var(--fn)}
.typeS .c{font:400 26px/1 var(--fh);color:var(--pink-dk)}
.typeS small{font:600 10.5px/1 var(--fd);letter-spacing:.06em;color:var(--ink2)}

/* ---------- modal ---------- */
.modal{position:fixed;inset:0;z-index:45;display:none;align-items:center;justify-content:center;background:rgba(58,18,50,.5);padding:16px}
.modal.on{display:flex}
.sheet{width:100%;max-width:370px;max-height:92dvh;overflow-y:auto;padding:14px 14px 16px;animation:slapIn .4s cubic-bezier(.3,1.7,.5,1) both}
.sheet h2{margin:0 0 10px;font:700 30px/1 var(--fd);color:var(--ink);display:flex;align-items:center;gap:8px}
.sheet h2 svg{width:26px;height:26px;color:var(--pink-dk)}
.trow{display:flex;align-items:center;justify-content:space-between;padding:8px 2px;border-bottom:2px dashed rgba(58,18,50,.12);font:600 16px/1 var(--fd)}
.tog{width:62px;height:36px;border-radius:999px;background:#d8c4cf;border:3px solid #fff;position:relative;box-shadow:inset 0 2px 3px rgba(60,0,40,.2);transition:background .2s}
.tog::after{content:'';position:absolute;top:2px;left:2px;width:26px;height:26px;border-radius:50%;background:#fff;box-shadow:0 2px 3px rgba(60,0,40,.35);transition:transform .3s cubic-bezier(.3,1.8,.5,1)}
.tog.on{background:var(--green)}
.tog.on::after{transform:translateX(26px)}
.gigs{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:10px 0 12px}
.gchip{display:flex;align-items:center;gap:6px;background:#fff;border-radius:10px 10px 4px 10px;padding:6px 7px;font:600 12.5px/1.05 var(--fd);text-align:left;box-shadow:var(--shs);min-height:40px}
.gchip i{font:800 11px/1 var(--fn);font-style:normal;background:var(--c,var(--green));color:#fff;border-radius:7px;padding:4px 5px;flex:none}
.gchip.on{outline:3px solid var(--pink);outline-offset:1px}
.sheet .btns{display:grid;grid-template-columns:1fr 1fr;gap:10px}

/* ---------- side duo (desktop) ---------- */
.side{position:fixed;top:50%;width:min(23vw,300px);display:none;z-index:1;pointer-events:none}
.side.l{right:calc(50% + 236px);transform:translateY(-50%) rotate(-4deg)}
.side.r{left:calc(50% + 236px);transform:translateY(-50%) rotate(4deg)}
.side .fig svg{width:100%;height:auto}
.side .fig{animation:hop 1.25s ease-in-out infinite}
.side.r .fig{animation-delay:.31s}
.side .note{margin:0 auto 10px;width:88%;padding:10px 12px;font:400 19px/1.15 var(--fh);color:var(--ink);transform:rotate(3deg)}
.side .note b{font:700 13px/1 var(--fd);letter-spacing:.1em;color:var(--pink-dk);display:block;margin-bottom:4px}
@media (min-width:1000px) and (min-height:560px){body:not(.wide) .side{display:block}}

#ov{position:fixed;left:0;top:0;width:100vw;height:100vh;pointer-events:none;z-index:60}
@media (prefers-reduced-motion:reduce){#world::after,.deco,.tFig,.juiceBtn,.encore span,.winDuo .fig,.side .fig{animation:none!important}}
</style>
</head>

'use strict';
/* =====================================================================================================================
   LOOPDOKU · STICKERBOMB skin
   Everything is a glossy die-cut vinyl sticker slapped onto a hot-pink laptop lid. X's slap on, and peel off.
   ===================================================================================================================== */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const now = () => performance.now();
const clamp = (v, a = 0, b = 1) => (v < a ? a : v > b ? b : v);
const lerp = (a, b, t) => a + (b - a) * t;
const EZ = LD.ease, oc = EZ.outCubic, oq = EZ.outQuad, ob = EZ.outBack;
const rnd = (a, b) => a + (b - a) * Math.random();
const pick = (a) => a[(Math.random() * a.length) | 0];
const hash = (n) => { const x = Math.sin(n * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };
const dpr = () => Math.min(2, window.devicePixelRatio || 1);
const RM = () => !!LD.reducedMotion;
let UIDN = 0; const uid = () => 'u' + (++UIDN).toString(36);
function cnv(w, h) { const c = document.createElement('canvas'); c.width = Math.max(1, Math.ceil(w)); c.height = Math.max(1, Math.ceil(h)); return c; }
function rrect(x, X, Y, W, H, r) { r = Math.min(r, W / 2, H / 2); x.beginPath(); x.moveTo(X + r, Y); x.arcTo(X + W, Y, X + W, Y + H, r); x.arcTo(X + W, Y + H, X, Y + H, r); x.arcTo(X, Y + H, X, Y, r); x.arcTo(X, Y, X + W, Y, r); x.closePath(); }
// tiny rAF keyframe tween for DOM stickers: stops = [[offset, {x,y,s,sx,sy,r,o}], ...]

    st.appendChild(d);

      setTimeout(() => {

}

function bombSprites() {
  if (BOMB.sprites) return BOMB.sprites;
  const S = [];
  const add = (f) => S.push(f);
  [[54, C.sun], [40, '#ffe680'], [46, C.sky]].forEach(([s, c]) => add(shapeSprite('star', s, c)));
  [[46, '#ff4f9a'], [36, C.pink]].forEach(([s, c]) => add(shapeSprite('heart', s, c)));
  [[70, C.green], [56, C.pink]].forEach(([s, c]) => add(shapeSprite('loop', s, c)));
  [[44, C.green], [40, C.pink], [38, '#a07cff']].forEach(([s, c]) => add(shapeSprite('note', s, c)));
  add(shapeSprite('sparkle', 40, C.sun)); add(shapeSprite('sparkle', 34, '#fff'));
  add(shapeSprite('bolt', 46, C.sun)); add(shapeSprite('disc', 56, '#2a2430', { label: C.green })); add(shapeSprite('burst', 50, '#ff8a2a'));
  ['ENCORE!', 'LOOP IT!', '100% VOICE'].forEach((t, k) => add(labelSprite(t, [C.pdk, C.green, '#a07cff'][k], '#fff', 28)));
  const tr = spriteFromImg('tok-roxor', 68, 0.36), tj = spriteFromImg('tok-jasmin', 68, 0.36), mg = spriteFromImg('mic-g', 52, 0.42), mp = spriteFromImg('mic-p', 52, 0.42);
  [tr, tj, mg, mp, tr, tj].forEach((s) => s && add(s));
  return (BOMB.sprites = S);
}
function startBomb() {
  const c = $('#bomb'), d = dpr();
  const W = innerWidth, H = innerHeight; if (!W || !H) return;
  c.width = Math.round(W * d); c.height = Math.round(H * d);
  const S = bombSprites(), t0 = now();
  const cols = Math.max(4, Math.round(W / 84)), rows = Math.max(6, Math.round(H / 90));
  const cells = []; for (let r = 0; r < rows; r++) for (let q = 0; q < cols; q++) cells.push([q, r]);
  cells.sort((a, b) => hash(a[0] * 31 + a[1] * 7) - hash(b[0] * 31 + b[1] * 7));
  BOMB.items = cells.map(([q, r], k) => ({ sp: S[(k * 7 + r) % S.length], x: ((q + 0.5 + (hash(k * 3.3) - 0.5) * 0.9) / cols) * W, y: ((r + 0.5 + (hash(k * 5.1) - 0.5) * 0.9) / rows) * H, rot: (hash(k * 9.7) - 0.5) * 1.1, sc: 0.85 + hash(k * 2.9) * 0.45, t0: t0 + 60 + k * (RM() ? 0 : 30), popped: false }));
  cancelAnimationFrame(BOMB.raf);
  const x = c.getContext('2d');
  const step = () => {
    const t = now(); let busy = false;
    x.setTransform(1, 0, 0, 1, 0, 0); x.clearRect(0, 0, c.width, c.height); x.setTransform(d, 0, 0, d, 0, 0);
    BOMB.items.forEach((it, k) => {
      const tt = t - it.t0; if (tt < 0) { busy = true; return; }
      if (!it.popped) { it.popped = true; if (k % 3 === 0) SFX.pop(k % 10); }
      let sc = it.sc, lift = 0, sx = 1, sy = 1;
      if (tt < 70 && !RM()) { const p = tt / 70; sc *= lerp(2.1, 0.9, p * p); lift = 1 - p; busy = true; }
      else if (tt < 400 && !RM()) { const q = tt - 70, dm = Math.exp(-q / 70), o = 0.2 * dm * Math.cos(q / 18); sx = 1 + o; sy = 1 - o; busy = true; }
      drawSticker(x, it.sp, it.x, it.y, sc, it.rot, Math.min(1, tt / 40 + 0.2), lift, sx, sy);
    });
    if (busy) BOMB.raf = requestAnimationFrame(step); else BOMB.raf = 0;
  };
  BOMB.raf = requestAnimationFrame(step);
}
function stopBomb() { cancelAnimationFrame(BOMB.raf); BOMB.raf = 0; const c = $('#bomb'); if (c.width > 1) c.getContext('2d').clearRect(0, 0, c.width, c.height); }

/* =====================================================================================================================
   PAUSE MENU + shared overlays
   ===================================================================================================================== */
function openMenu() {
  const playing = game && game.t0 !== null && !game.over;
  if (playing && !ST.pausedAt) { ST.pausedAt = now(); LD.loop.stop(); }
  $('#modal').classList.add('on');
}
function closeMenu(resume = true) {
  $('#modal').classList.remove('on');
  if (ST.pausedAt) { ST.pausedMs += now() - ST.pausedAt; ST.pausedAt = 0; }
  if (resume && ST.screen === 'game' && game && game.t0 !== null && !game.over && !LD.loop.playing) LD.loop.start();
}
function openTour() { LD.ui.levels({ onPlay: (id) => startGig(id) }); }
function openSettings() {
  LD.ui.settings({ onChange: (k, v) => {
    if (k === 'sound') setMuteIcon();
    if (k === 'assist' && game) game.opts.autoCross = !!v;
    if (k === 'reset') { renderPoints(); game = null; show('title', true); }

}

function wireUI() {

  document.addEventListener('click', (e) => { const b = e.target.closest && e.target.closest('.btn, .juiceBtn'); if (b) { LD.audio.unlock(); if (SFX.ok()) LD.audio.ui(); } }, true);
  $$('[data-go]').forEach((b) => b.addEventListener('click', () => show(b.dataset.go, true)));

  $('#bTourT').onclick = openTour;
  $('#bDaily').onclick = () => startGig(LD.meta.daily().id);
  $('#bLooks').onclick = () => LD.ui.skins();
  $('#bOutfits').onclick = () => show('outfits', true);
  $('#bSettings').onclick = openSettings;

  $('#bJuice').onclick = () => startDemo(true);
  $('#gBack').onclick = () => show('title', true);
  $('#gMute').onclick = () => { LD.meta.set('sound', LD.audio.muted); setMuteIcon(); };
  $('#cUndo').onclick = () => { stopDemo(); game.undo(); };
  $('#cHint').onclick = () => { stopDemo(); if (!game.over) game.hint(); };
  $('#cClear').onclick = () => { stopDemo(); game.clearCrosses(); };
  $('#cPause').onclick = openMenu;
  $('#bRetry').onclick = () => (ST.isDemoGame ? startDemo(true) : startGig(game.p.id));
  $('#bLoseTour').onclick = () => { hideLose(); openTour(); };
  $('#wNext').onclick = () => { const w = ST.lastWin; if (!w || w.demo) return startGig(LD.meta.currentId()); afterWin(() => startGig(w.r && w.r.nextId ? w.r.nextId : LD.meta.currentId())); };
  $('#wTour').onclick = () => afterWin(openTour);

    cellAt: (x, y) => { if (!game) return -1; const r = BD.box.getBoundingClientRect(), n = game.n; const c = Math.floor(((x - r.left) / r.width) * n), rr = Math.floor(((y - r.top) / r.height) * n); return c >= 0 && c < n && rr >= 0 && rr < n ? rr * n + c : -1; },
    onCursor: (i) => { BD.cursor = i; },

/* =====================================================================================================================
   BOOT
   ===================================================================================================================== */
function frame() {
  const t = now();
  if (ST.screen === 'game' && BD.ready) {
    if (BD.flashQ && BD.flashQ.length) { for (let k = BD.flashQ.length - 1; k >= 0; k--) { const q = BD.flashQ[k]; if (t >= q.t) { BD.flash[q.k] = q; BD.flashQ.splice(k, 1); } } }
    try { BD.frame(t); drawGhosts(t); } catch (e) { if (!frame.err) { frame.err = 1; console.warn('board frame', e); } }
  }
  try { OV.frame(t); } catch (e) { if (!frame.err2) { frame.err2 = 1; console.warn('overlay frame', e); } }
  requestAnimationFrame(frame);
}
function boot() {
  buildStatic();
  svgImage('tok-roxor', tokenSVG('roxor', ST.outfit.roxor));
  svgImage('tok-jasmin', tokenSVG('jasmin', ST.outfit.jasmin));
  svgImage('mic-g', micStickerSVG(C.green, true));
  svgImage('mic-p', micStickerSVG(C.pink, true));
  svgImage('life-g', lifeStickerSVG(C.green, C.glow));
  svgImage('life-p', lifeStickerSVG(C.pink, C.plt));
  ['tok-roxor', 'tok-jasmin'].forEach((k) => whenImg(k, () => { if (BD.cs) BD.buildTokens(); BOMB.sprites = null; }));
  BD.init(); OV.init();
  wireUI();
  renderPoints();
  route();
  window.addEventListener('hashchange', () => { const h = location.hash.replace('#', ''); if ((h === 'game' && ST.screen === 'game') || h === ST.screen) return; route(); });
  window.addEventListener('resize', () => { OV.resize(); if (ST.screen === 'game') BD.layout(); });
  if (window.ResizeObserver) new ResizeObserver(() => { if (ST.screen === 'game') requestAnimationFrame(() => BD.layout()); }).observe($('#boardArea'));
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { for (const k in LBL) delete LBL[k]; BOMB.sprites = null; if (ST.screen === 'game') BD.layout(); });
  setInterval(() => { if (ST.screen === 'game') tickTimer(); if (ST.screen === 'game' || ST.screen === 'title') renderPoints(); }, 400);
  requestAnimationFrame(frame);
  window.LDSKIN = {
    game: () => game,
    start: (id) => startGig(id),
    screen: () => (ST.lose ? 'lose' : ST.screen),
    arrowRect: (kind, i) => { if (ST.screen === 'game' && BD.ready) layoutArrows(); const el = ARW.els[kind] && ARW.els[kind][i]; return el ? el.getBoundingClientRect() : null; },
  };
}
boot();
