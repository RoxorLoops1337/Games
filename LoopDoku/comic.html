<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>LoopDoku</title>
<link rel="icon" href="thumbs/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bangers&family=Luckiest+Guy&family=Comic+Neue:wght@700&display=swap" rel="stylesheet">
<style>
:root{--ink:#141014;--paper:#fff4dc;--paper2:#ffe9b8;--grn:#6cc12e;--grnD:#2f7a12;--grnL:#a9f060;--pnk:#ff6fae;--pnkD:#c93f78;--pnkL:#ffc9de;
--yel:#ffe234;--red:#ff3b30;--cyan:#29c5f6;--org:#ff9a1f;--vio:#8b5cf6;--pickH:0px;--stageW:min(100vw,440px);
--fBang:'Bangers','Impact','Arial Black',sans-serif;--fLuck:'Luckiest Guy','Bangers','Arial Black',sans-serif;--fBody:'Comic Neue','Comic Sans MS','Chalkboard SE',sans-serif}
:root{--ld-font:'Comic Neue','Comic Sans MS',sans-serif;--ld-font-display:'Bangers','Impact',sans-serif;--ld-ink:#141014;--ld-muted:#5d5160;
--ld-panel:#fff4dc;--ld-panel-2:#ffffff;--ld-backdrop:rgba(20,16,20,.6);--ld-accent:#ff6fae;--ld-accent-ink:#141014;--ld-accent-2:#ffe234;
--ld-accent-2-ink:#141014;--ld-line:3.5px solid #141014;--ld-radius:14px;--ld-shadow:6px 6px 0 #141014;--ld-lock:#8a8278}
.ldui-sheet{box-shadow:6px 6px 0 #141014!important;background-image:radial-gradient(circle,rgba(255,170,60,.18) 1.4px,transparent 1.7px)!important;background-size:9px 9px!important}
.ldui-btn,.ldui-lv{box-shadow:3px 3px 0 #141014;font-family:'Luckiest Guy','Bangers',sans-serif!important;font-weight:400!important;letter-spacing:.5px}
.ldui-btn:active,.ldui-lv:active:not(:disabled){box-shadow:0 0 0 #141014}
.ldui-lv.solved{background:#6cc12e!important;color:#fff!important;-webkit-text-stroke:1px #141014}
.ldui h2,.ldui-hero h3{font-family:'Bangers','Impact',sans-serif!important;letter-spacing:1.5px}
.ldui-toast{font-family:'Bangers','Impact',sans-serif!important;letter-spacing:1px;font-size:20px!important;background:#ffe234!important;color:#141014!important;border:3.5px solid #141014;box-shadow:4px 4px 0 #141014}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#3a1238;color:var(--ink);font-family:var(--fBody);font-weight:700}
button{font:inherit;color:inherit}
/* ---------- page backdrop: pink halftone pop-art burst ---------- */
#bg{position:fixed;inset:0;overflow:hidden;background:#ff5ea8}
#bg::before{content:'';position:absolute;left:-50%;top:-50%;width:200%;height:200%;
 background:repeating-conic-gradient(from 0deg at 50% 50%,#ff79b8 0 7deg,#ff4f9d 7deg 14deg)}
#bg::after{content:'';position:absolute;inset:-40px;background-image:radial-gradient(circle,rgba(20,16,20,.22) 2.2px,transparent 2.6px);background-size:14px 14px;animation:drift 18s linear infinite}
@keyframes drift{to{transform:translate(28px,28px)}}
.side{position:fixed;top:50%;width:min(30vw,420px);transform:translateY(-50%);display:none;pointer-events:none}
.side.l{left:calc(50vw - 220px - min(30vw,420px) - 10px)}.side.r{right:calc(50vw - 220px - min(30vw,420px) - 10px)}
@media (min-width:980px){.side{display:block}}
.side .sb{position:absolute;top:-6%;background:#fff;border:4px solid var(--ink);border-radius:28px;padding:10px 16px;font:30px/1 var(--fBang);letter-spacing:1px;box-shadow:6px 6px 0 var(--ink)}
.side.l .sb{right:4%}.side.r .sb{left:4%}
.side .sb::after{content:'';position:absolute;bottom:-17px;width:22px;height:18px;background:#fff;border:4px solid var(--ink);border-top:0;border-left:0;clip-path:polygon(0 0,100% 0,100% 100%)}
.side.l .sb::after{right:30%;transform:skewX(-25deg) scaleX(-1)}.side.r .sb::after{left:30%;transform:skewX(25deg)}
/* ---------- stage ---------- */
#app{position:relative;margin:0 auto;width:var(--stageW);height:100vh;height:100dvh;overflow:hidden;background:var(--paper);
 background-image:radial-gradient(circle,rgba(255,170,60,.18) 1.4px,transparent 1.7px);background-size:9px 9px}
@media (min-width:460px){#app{border-left:5px solid var(--ink);border-right:5px solid var(--ink);box-shadow:0 0 0 6px #fff,0 0 0 11px var(--ink),18px 0 0 6px rgba(0,0,0,.25)}}
.screen{position:absolute;left:0;right:0;top:0;bottom:var(--pickH);display:none;flex-direction:column;padding:calc(env(safe-area-inset-top) + 8px) 10px 8px}
.screen.on{display:flex}
.scroll{overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch}
/* ---------- comic primitives ---------- */
.cap{background:var(--yel);border:3px solid var(--ink);box-shadow:3px 3px 0 var(--ink);padding:4px 8px;font-family:var(--fBang);letter-spacing:.6px}
.bang{font-family:var(--fBang);letter-spacing:1px}
.luck{font-family:var(--fLuck)}
.panel{border:4px solid var(--ink);background:#fff;box-shadow:5px 5px 0 var(--ink)}
.dots{background-image:radial-gradient(circle,rgba(20,16,20,.16) 1.3px,transparent 1.6px);background-size:7px 7px}
/* buttons: caption-box + burst buttons that press with an impact pop */
.btn{position:relative;border:3.5px solid var(--ink);background:#fff;border-radius:12px;box-shadow:4px 4px 0 var(--ink);cursor:pointer;
 font:20px/1 var(--fLuck);letter-spacing:.5px;padding:10px 14px 8px;min-height:44px;display:inline-flex;align-items:center;justify-content:center;gap:6px;
 transition:transform .22s cubic-bezier(.34,1.8,.5,1),box-shadow .22s cubic-bezier(.34,1.8,.5,1),filter .15s;user-select:none;-webkit-user-select:none;touch-action:manipulation}
.btn:hover,.btn.hov{transform:translate(-2px,-2px) rotate(-1deg);box-shadow:6px 6px 0 var(--ink);filter:brightness(1.05)}
.btn:active,.btn.prs{transform:translate(4px,4px) scale(.95);box-shadow:0 0 0 var(--ink);transition-duration:.05s}
.btn:disabled,.btn.dis{background:#d9d2c4!important;color:#8a8278;box-shadow:2px 2px 0 #8a8278;border-color:#8a8278;cursor:default;transform:none;filter:none;
 background-image:radial-gradient(circle,rgba(0,0,0,.12) 1.2px,transparent 1.5px)!important;background-size:6px 6px!important}
.btn.pri{background:var(--yel);color:var(--ink)}
.btn.pri .t{color:#fff;-webkit-text-stroke:1.5px var(--ink);paint-order:stroke fill;text-shadow:2px 2px 0 var(--ink)}
.btn.grn{background:var(--grn)}.btn.pnk{background:var(--pnk)}
.btn.grn .t,.btn.pnk .t{color:#fff;-webkit-text-stroke:1.5px var(--ink);paint-order:stroke fill;text-shadow:2px 2px 0 var(--ink)}
.btn.ico{width:46px;height:46px;min-height:46px;padding:0;border-radius:50%;flex:none}
.btn svg{width:24px;height:24px;flex:none;overflow:visible}
.btn.ico svg{width:26px;height:26px}
.pop{position:absolute;pointer-events:none;z-index:-1;left:50%;top:50%;width:150%;aspect-ratio:1;translate:-50% -50%}
/* ---------- title ---------- */
#s-title{align-items:center;justify-content:space-between;text-align:center;overflow:hidden}
#tRays{position:absolute;inset:0;background:repeating-conic-gradient(from 0deg at 50% 34%,#fff4dc 0 9deg,#ffe58f 9deg 18deg);opacity:.9}
#tRays::after{content:'';position:absolute;inset:0;background:radial-gradient(circle at 50% 34%,transparent 30%,var(--paper) 78%)}
.logo{position:relative;margin-top:22px;transform:rotate(-5deg);line-height:.86;z-index:2}
.logo .row{display:flex;align-items:center;justify-content:center}
.logo .w{font-family:var(--fLuck);font-size:76px;color:var(--grn);-webkit-text-stroke:3px var(--ink);paint-order:stroke fill;
 text-shadow:1px 1px 0 var(--ink),2px 2px 0 var(--ink),3px 3px 0 var(--ink),4px 4px 0 var(--ink),5px 5px 0 var(--ink),6px 6px 0 var(--ink),7px 7px 0 var(--grnD),8px 8px 0 var(--ink)}
.logo .w.p{color:var(--pnk);text-shadow:1px 1px 0 var(--ink),2px 2px 0 var(--ink),3px 3px 0 var(--ink),4px 4px 0 var(--ink),5px 5px 0 var(--ink),6px 6px 0 var(--ink),7px 7px 0 var(--pnkD),8px 8px 0 var(--ink)}
.logo .inf{width:118px;height:62px;margin:0 -2px;overflow:visible}
.logo .doku{margin-left:58px;margin-top:-4px}
.logo .burst{position:absolute;left:50%;top:50%;width:150%;translate:-50% -52%;z-index:-1;overflow:visible}
.sub{position:relative;z-index:2;display:inline-block;margin-top:14px;transform:rotate(-2deg);background:var(--pnk);color:#fff;font:19px/1 var(--fBang);letter-spacing:1.2px;padding:6px 12px 4px;border:3px solid var(--ink);box-shadow:3px 3px 0 var(--ink);-webkit-text-stroke:.6px var(--ink)}
#tDuo{position:relative;z-index:1;width:100%;flex:1;min-height:150px;display:flex;align-items:flex-end;justify-content:center}
#tDuo svg{height:100%;max-height:420px;width:auto;max-width:100%;overflow:visible}
.tBtns{position:relative;z-index:2;display:grid;grid-template-columns:1fr 1fr;gap:10px 10px;width:100%;max-width:380px;padding:0 6px 6px}
.tBtns .wide{grid-column:1/3}
#bPlay{font-size:27px;padding:12px 10px 9px;background:var(--pnk);transform:rotate(-1.5deg)}
#bPlay .t{color:#fff;-webkit-text-stroke:2px var(--ink);paint-order:stroke fill;text-shadow:3px 3px 0 var(--ink)}
#bPlay:hover{transform:translate(-2px,-2px) rotate(-2.5deg)}#bPlay:active{transform:translate(4px,4px) scale(.95)}
/* ---------- game ---------- */
#s-game{gap:6px;align-items:stretch}
.topbar{display:flex;align-items:center;gap:8px;flex:none}
#gCap{flex:1;min-width:0;position:relative;transform:rotate(-1deg);padding:5px 9px 4px;text-align:left}
#gCap .k{font-size:13px;line-height:1.05;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#gCap .v{font-size:21px;line-height:1.02;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#gCap.demo{background:#fff;}
#gCap.demo .k{color:var(--pnkD)}
.hudrow{display:flex;align-items:center;gap:8px;flex:none}
#timer{display:flex;align-items:center;gap:5px;background:#fff;border:3px solid var(--ink);box-shadow:3px 3px 0 var(--ink);padding:3px 9px 1px;font:22px/1 var(--fBang);letter-spacing:1px;min-width:86px;transform:rotate(1deg)}
#timer svg{width:18px;height:18px}
#lives{display:flex;gap:2px;align-items:center;background:#fff;border:3px solid var(--ink);border-radius:20px;padding:1px 8px;box-shadow:3px 3px 0 var(--ink);transform:rotate(-1deg)}
#lives .mic{position:relative;width:26px;height:34px}
#lives .mic svg{width:100%;height:100%;overflow:visible}
#lives .mic.dead svg{opacity:.35;filter:grayscale(1)}
#lives .mic.dead::after{content:'';position:absolute;left:2px;right:2px;top:50%;height:3px;background:var(--red);transform:rotate(-40deg);border:1px solid var(--ink)}
#gigBtn{margin-left:auto;font-size:17px;padding:7px 10px 5px;min-height:40px}
.duo{position:relative;display:flex;align-items:flex-end;justify-content:space-between;flex:1 1 100px;min-height:84px;max-height:150px;margin:0 -4px}
.bust{position:relative;height:100%;aspect-ratio:96/110;max-width:132px;flex:none;clip-path:inset(-80px -80px 0 -80px)}
.bust svg{width:100%;height:100%;overflow:visible}
.bust .bob{transform-origin:50% 100%;width:100%;height:100%}
.loopst{flex:1;margin:0 2px 2px;height:calc(100% - 6px);max-height:118px;min-height:78px;border:3.5px solid var(--ink);background:#2a1f2e;box-shadow:4px 4px 0 var(--ink);border-radius:10px;padding:4px 6px 5px;display:flex;flex-direction:column}
.loopst .lt{font:12px/1 var(--fBang);letter-spacing:1.2px;color:var(--yel);display:flex;justify-content:space-between;gap:6px;white-space:nowrap}
.loopst .lt b{color:#fff;font-weight:400}
.pads{flex:1;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);gap:3px;margin-top:3px}
.pad{border:2px solid #000;border-radius:4px;background:#4a3d50;font:9.5px/1 var(--fBang);letter-spacing:.5px;color:#9a8aa3;display:flex;align-items:center;justify-content:center;transition:background .2s}
.pad.on{color:var(--ink);background:var(--grnL)}
.pad.on.j{background:var(--pnkL)}
.pad.hit{filter:brightness(1.35)}
.bubble{position:absolute;z-index:12;top:6px;background:#fff;border:3px solid var(--ink);border-radius:18px;padding:6px 10px 4px;font:19px/1 var(--fBang);letter-spacing:1px;white-space:nowrap;box-shadow:3px 3px 0 var(--ink);pointer-events:none;opacity:0}
.bubble::after{content:'';position:absolute;bottom:-12px;width:16px;height:14px;background:#fff;border:3px solid var(--ink);border-top:0;border-left:0;clip-path:polygon(0 0,100% 0,100% 100%)}
.bubble.l{left:16%}.bubble.l::after{left:12px;transform:skewX(30deg)}
.bubble.r{right:16%}.bubble.r::after{right:12px;transform:scaleX(-1) skewX(30deg)}
.bubble.sing{border-radius:50%/60%;background:#fff6fb}
#boardWrap{position:relative;flex:none;align-self:center;display:grid;grid-template-columns:var(--aw) var(--bs);grid-template-rows:var(--aw) var(--bs);gap:var(--ag);margin:auto 8px auto 0}
#boardHit{position:relative;grid-column:2;grid-row:2;width:var(--bs);height:var(--bs)}
#colArrows{grid-column:2;grid-row:1;position:relative}#rowArrows{grid-column:1;grid-row:2;position:relative}
.arw{position:absolute;padding:0;border:0;background:none;cursor:pointer;touch-action:manipulation;display:flex;align-items:center;justify-content:center}
.arw svg{width:100%;height:100%;overflow:visible;transition:opacity .2s,filter .2s}
.arw.dim svg{opacity:.42;filter:grayscale(1)}
.arw:focus-visible{outline:3px solid var(--cyan);outline-offset:1px}
#ptsChip{margin-left:auto;display:flex;align-items:center;gap:4px;background:var(--yel);border:3px solid var(--ink);box-shadow:3px 3px 0 var(--ink);padding:3px 9px 1px;font:20px/1 var(--fBang);letter-spacing:1px;transform:rotate(-1.5deg);white-space:nowrap}
#ptsChip svg{width:18px;height:18px}
#boardDeco{position:absolute;inset:-5px;border:4px solid var(--ink);background:#fff;box-shadow:6px 6px 0 var(--ink);transform:rotate(-.6deg)}
#shake{position:absolute;inset:0}
#grid{position:absolute;inset:0;display:grid;gap:2px;background:var(--ink);border:4px solid var(--ink)}
.cell{position:relative;overflow:hidden;background:var(--ink)}
.cin{position:absolute;inset:0;transform-origin:50% 50%}
.lit{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none}
.imp{position:absolute;inset:-12%;pointer-events:none}.imp svg{width:100%;height:100%;display:block}
.cur .cin{box-shadow:inset 0 0 0 4px var(--cyan),inset 0 0 0 6px var(--ink)}
.mk{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none}
.mk svg{width:74%;height:74%;overflow:visible}
.mk.auto svg{width:52%;height:52%}
.tk{position:absolute;inset:-6%;pointer-events:none;z-index:3}
.tk svg{width:100%;height:100%;overflow:visible}
#borders{position:absolute;inset:0;pointer-events:none;overflow:visible}
#crack{position:absolute;inset:0;pointer-events:none;overflow:visible;opacity:0}
.btnrow{display:grid;grid-template-columns:1fr 1.35fr 1fr 46px;gap:8px;flex:none;align-items:center;margin-top:auto;padding-top:4px}
.btnrow .btn{font-size:16px;padding:8px 6px 6px;min-height:52px;flex-direction:column;gap:2px;line-height:.95}
.btnrow .btn svg{width:22px;height:22px}
.btnrow .btn.ico{width:46px;height:46px;min-height:46px}
/* line-up strip */
.lineup{flex:none;display:flex;align-items:center;gap:8px;margin-top:10px;padding:3px 8px 3px 4px;background:#fff;border:3px solid var(--ink);box-shadow:3px 3px 0 var(--ink);transform:rotate(.5deg);height:44px}
.lineup .lab{font:15px/1 var(--fBang);letter-spacing:1px;background:var(--yel);border:2.5px solid var(--ink);padding:4px 6px 2px;transform:rotate(-3deg);flex:none}
.lineup .slots{flex:1;display:flex;justify-content:space-between;gap:2px}
.slot{flex:1 1 0;max-width:32px;aspect-ratio:1;min-width:0;border:2.5px dashed #b9aeb9;border-radius:8px;display:flex;align-items:center;justify-content:center;font:14px/1 var(--fBang);color:#b9aeb9;position:relative}
.slot.on{border:0}
.slot svg{position:absolute;inset:-10%;width:120%;height:120%;overflow:visible}
.wpads{position:relative;z-index:4;display:flex;gap:4px;margin-top:10px;background:#2a1f2e;border:3px solid var(--ink);padding:4px;border-radius:8px;box-shadow:3px 3px 0 var(--ink)}
.wpads .pad{width:30px;height:22px;font-size:8px}
.wpads .pad.on{color:var(--ink)}
/* regions: flat pop colours + Ben-Day pattern per zone */
.rg0{background-color:#ffe14d;background-image:radial-gradient(circle,rgba(190,120,0,.38) 1.6px,transparent 2px);background-size:7px 7px}
.rg1{background-color:#6fd0ff;background-image:radial-gradient(circle,rgba(255,255,255,.75) 3.2px,transparent 3.7px);background-size:13px 13px}
.rg2{background-color:#ffa0c8;background-image:repeating-linear-gradient(45deg,rgba(201,63,120,.32) 0 2.5px,transparent 2.5px 8px)}
.rg3{background-color:#b6e95e;background-image:radial-gradient(circle,rgba(47,122,18,.35) 2.4px,transparent 2.8px);background-size:10px 10px;background-position:0 0}
.rg4{background-color:#bea6ff;background-image:linear-gradient(rgba(90,50,200,.22) 2px,transparent 2px),linear-gradient(90deg,rgba(90,50,200,.22) 2px,transparent 2px);background-size:9px 9px}
.rg5{background-color:#ffae63;background-image:repeating-linear-gradient(0deg,rgba(200,80,0,.28) 0 2.5px,transparent 2.5px 7px)}
.rg6{background-color:#62e3c2;background-image:radial-gradient(circle,transparent 2.2px,rgba(0,110,90,.4) 2.6px,rgba(0,110,90,.4) 3.4px,transparent 3.8px);background-size:12px 12px}
.rg7{background-color:#ff8577;background-image:repeating-linear-gradient(-45deg,rgba(255,255,255,.5) 0 2px,transparent 2px 9px),repeating-linear-gradient(45deg,rgba(255,255,255,.5) 0 2px,transparent 2px 9px)}
.rg8{background-color:#e3ddd2;background-image:radial-gradient(circle,rgba(20,16,20,.3) 1.2px,transparent 1.5px),radial-gradient(circle,rgba(20,16,20,.3) 1.2px,transparent 1.5px);background-size:8px 8px;background-position:0 0,4px 4px}
.rg9{background-color:#ddb27e;background-image:repeating-linear-gradient(60deg,rgba(120,70,20,.3) 0 2px,transparent 2px 7px),repeating-linear-gradient(-60deg,rgba(120,70,20,.3) 0 2px,transparent 2px 7px)}
/* fx */
#fx{position:absolute;inset:0;pointer-events:none;z-index:40;overflow:hidden}
#fxc{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:39}
.ono{position:absolute;left:0;top:0;font-family:var(--fBang);white-space:nowrap;color:#fff;-webkit-text-stroke:2px var(--ink);paint-order:stroke fill;letter-spacing:1px;line-height:1;will-change:transform,opacity;text-shadow:3px 3px 0 var(--ink)}
.ono.soft{font-family:var(--fLuck);letter-spacing:0;-webkit-text-stroke:1.5px var(--pnkD);text-shadow:2px 2px 0 var(--pnkD);color:#fff}
.fxel{position:absolute;left:0;top:0;will-change:transform,opacity}
.fxel svg{display:block;overflow:visible}
#finger{position:absolute;left:0;top:0;width:58px;height:58px;z-index:45;pointer-events:none;display:none;transition-property:transform;transition-timing-function:cubic-bezier(.3,.7,.3,1)}
#finger .fi{width:100%;height:100%;transform-origin:20% 10%;transition:transform .09s}
#finger.down .fi{transform:scale(.82) rotate(-6deg)}
#finger svg{width:100%;height:100%;overflow:visible}
/* overlays */
.ovl{position:absolute;inset:0;z-index:35;display:none;align-items:center;justify-content:center;flex-direction:column;gap:14px;background:rgba(20,16,20,.55);
 background-image:radial-gradient(circle,rgba(0,0,0,.35) 1.5px,transparent 1.8px);background-size:6px 6px}
.ovl.on{display:flex}
.ovl .panel{padding:16px;width:min(330px,88%);text-align:center;transform:rotate(-1deg)}
.ovl h2{margin:0 0 8px;font:40px/1 var(--fBang);letter-spacing:2px}
.ovl .rowb{display:flex;flex-direction:column;gap:10px;margin-top:8px}
.gigs{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:6px}
.gigs .btn{font-size:14px;padding:6px 4px 4px;min-height:44px;flex-direction:column;gap:1px;border-radius:8px}
.gigs .btn small{font:11px/1 var(--fBody);font-weight:700}
/* ---------- win ---------- */
#s-win{align-items:center;overflow:hidden;padding:0 0 8px}
#wRays{position:absolute;inset:-30%;background:repeating-conic-gradient(from 0deg at 50% 50%,#ffe234 0 6deg,#fff 6deg 12deg)}
#wDots{position:absolute;inset:0;background:radial-gradient(circle at 50% 40%,transparent 35%,rgba(255,111,174,.5) 70%),radial-gradient(circle,rgba(201,63,120,.45) 2.6px,transparent 3px);background-size:auto,12px 12px}
#wPanel{position:relative;margin-top:calc(env(safe-area-inset-top) + 10px);width:88%;height:29%;min-height:180px;perspective:700px;z-index:2}

<script>
'use strict';
/* =====================================================================
   KAPOW KENJI - LOOPDOKU comic-book pop-art skin  (art kit)
   ===================================================================== */
const INK = '#141014', WH = '#fff', SK = '#ffd5b4', SKS = '#f0a782';
const RH = '#7b3f1d', RHL = '#c06a34', RHD = '#4a2310', SHV = '#9c6a48';
const JH = '#6a381c', JHL = '#b06838', JHD = '#3a1d0b';
const GRN = '#6cc12e', GRND = '#2f7a12', GRNL = '#a9f060', PNK = '#ff6fae', PNKD = '#c93f78', PNKL = '#ffc9de';
const YEL = '#ffe234', ORG = '#ff9a1f', RED = '#ff3b30', CYA = '#29c5f6', FUR = '#3f8a24';
const pth = (d, f, w = 4, x = '') => `<path d="${d}" fill="${f}" stroke="${w ? INK : 'none'}" stroke-width="${w}" stroke-linejoin="round" stroke-linecap="round"${x}/>`;
const ln = (d, c = INK, w = 3, x = '') => `<path d="${d}" fill="none" stroke="${c}" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round"${x}/>`;
const cir = (x, y, r, f, w = 4, s = INK) => `<circle cx="${x}" cy="${y}" r="${r}" fill="${f}" stroke="${w ? s : 'none'}" stroke-width="${w}"/>`;
const ell = (x, y, rx, ry, f, w = 4, rot = 0) => `<ellipse cx="${x}" cy="${y}" rx="${rx}" ry="${ry}" fill="${f}" stroke="${w ? INK : 'none'}" stroke-width="${w}"${rot ? ` transform="rotate(${rot} ${x} ${y})"` : ''}/>`;
const limb = (d, c, w) => ln(d, INK, w + 6.5) + ln(d, c, w);
const blush = (x, y) => [[0, 0], [5.5, -1], [11, 0], [2.7, 4.3], [8.2, 4.3]].map(([a, b]) => `<circle cx="${x + a}" cy="${y + b}" r="2" fill="#ff7aa8"/>`).join('');
const f1 = (v) => Math.round(v * 10) / 10;
function rng(seed) { let a = seed >>> 0; return () => { a = (a + 0x6D2B79F5) >>> 0; let t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
function burstPts(n, ro, ri, seed, cx = 0, cy = 0, jit = 0.22) {
  const R = rng(seed); const p = [];
  for (let k = 0; k < n * 2; k++) { const a = (k / (n * 2)) * Math.PI * 2 - Math.PI / 2; const r = (k % 2 ? ri : ro) * (1 - jit / 2 + R() * jit); p.push(f1(cx + Math.cos(a) * r) + ',' + f1(cy + Math.sin(a) * r)); }
  return p.join(' ');
}
function scallop(cx, cy, rx, ry, n, amp) {
  let d = '';
  for (let k = 0; k < n; k++) {
    const a0 = (k / n) * Math.PI * 2, a1 = ((k + 0.5) / n) * Math.PI * 2, a2 = ((k + 1) / n) * Math.PI * 2;
    if (!k) d += `M${f1(cx + rx * Math.cos(a0))},${f1(cy + ry * Math.sin(a0))}`;
    d += `Q${f1(cx + (rx + amp * 2) * Math.cos(a1))},${f1(cy + (ry + amp * 2) * Math.sin(a1))} ${f1(cx + rx * Math.cos(a2))},${f1(cy + ry * Math.sin(a2))}`;
  }
  return d + 'Z';
}
function starPath(cx, cy, ro, ri) { let d = ''; for (let k = 0; k < 10; k++) { const a = (k / 10) * Math.PI * 2 - Math.PI / 2, r = k % 2 ? ri : ro; d += (k ? 'L' : 'M') + f1(cx + Math.cos(a) * r) + ',' + f1(cy + Math.sin(a) * r); } return d + 'Z'; }
function mic(x, y, rot, band) {
  return `<g transform="translate(${x} ${y}) rotate(${rot})">${pth('M-4.6,-2 L-3.2,27 Q0,30 3.2,27 L4.6,-2 Z', '#26262c', 3)}<rect x="-4.4" y="7" width="8.8" height="4.5" fill="${band}" stroke="${INK}" stroke-width="2"/>${cir(0, -8, 8.2, '#3b3b46', 3.5)}${ln('M-5,-12 L4,-4 M-6,-7 L1,-14 M-2,-3 L5,-10', '#7c7c90', 1.4)}${cir(-3, -11, 2.1, '#b4b4c8', 0)}</g>`;
}
/* ---------------- ROXORLOOPS ---------------- */
const MOHAWK = 'M-24,-38 C-32,-50 -32,-62 -24,-72 C-22,-62 -16,-57 -11,-58 C-14,-74 -6,-88 8,-96 C3,-80 7,-70 14,-65 C16,-80 27,-90 42,-93 C33,-80 32,-68 36,-59 C43,-66 54,-68 64,-63 C53,-57 49,-47 49,-39 C54,-39 60,-35 62,-29 C51,-29 41,-29 31,-25 C15,-30 -6,-34 -24,-38 Z';
function roxHead(o = {}) {
  const ex = o.expr || 'smirk', mon = o.outfit === 'monster';
  let s = '';
  if (mon) {
    s += pth('M-44,-14 L-66,-22 L-52,-4 L-72,2 L-55,14 L-70,26 L-51,28 L-60,44 L-40,36 Z', '#2f6f1a', 3.5);
    const hd = scallop(0, -4, 55, 52, 16, 3.2);
    s += pth(hd, FUR, 4) + `<path d="${hd}" fill="url(#htI)" opacity=".5"/>`;
    s += pth('M-28,-46 C-42,-58 -44,-76 -36,-92 C-28,-76 -18,-64 -12,-54 Z', '#f6dca6', 3.5) + ln('M-36,-70 L-27,-74 M-38,-80 L-31,-84 M-33,-60 L-23,-64', '#c99a52', 2);
    s += pth('M28,-46 C42,-58 44,-76 36,-92 C28,-76 18,-64 12,-54 Z', '#f6dca6', 3.5) + ln('M36,-70 L27,-74 M38,-80 L31,-84 M33,-60 L23,-64', '#c99a52', 2);
  } else {
    s += pth('M-30,6 C-36,20 -40,30 -52,40 C-45,41 -43,43 -42,47 C-37,42 -35,46 -31,52 C-29,44 -25,42 -19,42 C-22,30 -22,18 -21,8 Z', RH, 3.5);
  }
  s += pth('M-40,-6 C-41,-32 -20,-46 4,-46 C30,-46 46,-30 46,-4 C46,22 30,42 8,44 C-14,46 -38,30 -40,-6 Z', SK);
  s += `<path d="M-33,22 C-22,36 -4,44 12,42 C30,38 40,24 44,10 C40,30 24,46 4,45 C-12,44 -26,36 -33,22 Z" fill="url(#htS)"/>`;
  if (!mon) {
    const sv = 'M-40,-6 C-41,-28 -30,-42 -12,-46 C-19,-36 -22,-20 -22,-4 C-28,-2 -34,-3 -40,-6 Z';
    s += pth(sv, SHV, 3) + `<path d="${sv}" fill="url(#htI)"/>`;

  let n = 0; const W = PW || app.clientWidth;
  const conf = () => { for (let k = 0; k < 7; k++) addP({ t: pick(['dot', 'dot', 'conf', 'star']), x: rnd(0, W), y: rnd(-30, -5), vx: rnd(-50, 50), vy: rnd(60, 200), g: 140, r: rnd(3, 7.5), max: rnd(2.2, 3.4), c: pick([GRN, PNK, YEL, CYA, '#fff', PNKL]), vr: rnd(-5, 5), drag: 0.995, shrink: false, ink: Math.random() < 0.7 }); if (++n < 44) winTimers.push(setTimeout(conf, 110)); };
  winTimers.push(setTimeout(conf, 300));

/* ---------- win: points ---------- */
function showPoints(r) {
  const box = $('wPts');
  if (!r) { box.style.display = 'none'; $('wX').innerHTML = ''; $('bNext').innerHTML = '<span class="t">LET\'S PLAY \u25B6</span>'; $('bNext').style.display = ''; return; }
  box.style.display = '';
  $('bNext').innerHTML = (r.streak >= 2 ? '<small>ONE MORE! \uD83D\uDD25' + r.streak + '</small>' : '') + '<span class="t">NEXT GIG \u25B6</span>';
  $('bNext').style.display = r.nextId ? '' : 'none';
  const wx = $('wX'); wx.innerHTML = ''; wx.appendChild(LD.ui.winExtras(r));

    const q = relRect($('wX').firstElementChild || $('wPts'));

    if (LD.audio.ctx) { LD.audio.sparkle(); LD.audio.clap(0.6); }

  if (r.starBonus && r.firstClear) chips.push(`<span>★ BONUS +${r.starBonus}</span>`);
  if (r.daily) chips.push('<span class="p">DAILY JAM ×2</span>');
  $('wBrk').innerHTML = chips.join('');
  $('wTot').textContent = 'TOTAL ★ ' + r.total + ' PTS';
  const N = $('wPtsN'); N.textContent = '+0';
  const steps = 18;
  for (let k = 1; k <= steps; k++) winTimers.push(setTimeout(() => {
    N.textContent = '+' + Math.round(r.points * LD.ease.outCubic(k / steps));
    if (k % 3 === 0 && LD.audio.ctx) LD.audio.tick(k / 3);
    if (k === steps) { N.parentElement.animate([{ transform: 'scale(1.5) rotate(-4deg)' }, { transform: 'scale(1)' }], { duration: 260, easing: 'ease-out' }); const q = relRect(N); ring(q.cx, q.cy, 80, YEL, { w: 6, dur: 520 }); ono('KA-CHING!', q.cx, q.y - 4, { size: 24, color: GRNL, dur: 760, dy: -16 }); spray(q.cx, q.cy, 12, { c: [YEL, GRN, '#fff'], r0: 3, r1: 6, sp0: 120, sp1: 260, m0: 0.4, m1: 0.7, p: { t: 'star', g: 400 } }); }
  }, 700 + k * 40));
  if (r.affordable && r.affordable.length) winTimers.push(setTimeout(() => LD.ui.toast('New look affordable: ' + r.affordable[0].name), 1900));
}
function afterWin(go) {
  const r = lastRec;
  if (r && r.support && !r._supported) { r._supported = true; LD.ui.support({ onClose: go }); }
  else go();
}
/* ---------- lose ---------- */
function showLose() {
  settle(FX); parts = []; CX.setTransform(1, 0, 0, 1, 0, 0); CX.clearRect(0, 0, CV.width, CV.height);
  $('loseArt').innerHTML = `<svg viewBox="-150 -115 300 300"><g transform="translate(-62 0) rotate(-6)">${roxFig({ pose: 'hurt', expr: 'wince' })}</g><g transform="translate(66 4) rotate(5)">${jasFig({ pose: 'hurt', expr: 'wince' })}</g><g transform="translate(-6 128) rotate(-30)">${mic(0, 0, 0, GRN)}</g><g font-family="Bangers,Impact" font-size="24" fill="#fff" stroke="${INK}" stroke-width="3" paint-order="stroke"><text x="-140" y="-80" transform="rotate(-10 -140 -80)">CRIIICKETS...</text></g></svg>`;
  const lx = $('lX'); lx.innerHTML = ''; lx.appendChild(LD.ui.loseExtras(loseRec));

  document.querySelector('.lPanel').animate([{ transform: 'scale(.3) rotate(-14deg)', opacity: 0 }, { transform: 'scale(1.06) rotate(1deg)', opacity: 1, offset: 0.6 }, { transform: 'rotate(-2deg)' }], { duration: 420, easing: 'ease-out' });
  document.querySelector('.lH').animate([{ transform: 'rotate(-4deg) scale(3)', opacity: 0 }, { transform: 'rotate(-6deg) scale(.9)', opacity: 1, offset: 0.6 }, { transform: 'rotate(-4deg)' }], { duration: 380, delay: 300, fill: 'backwards', easing: 'ease-out' });

}
/* ---------- outfits ---------- */
let outBuilt = false;
function buildOutfits() {
  if (outBuilt) return; outBuilt = true;
  const card = (cls, name, tag, art) => `<div class="card ${cls}"><span class="tag">${tag}</span><div class="art"><svg viewBox="-100 -112 200 292">${art}</svg></div><div class="nm">${name}</div></div>`;
  const lock = (name, who, req) => `<div class="card lk"><span class="tag">${req}</span><div class="art"><svg viewBox="-100 -112 200 292">${crewSil(who)}<g transform="translate(0 -10)"><polygon points="${burstPts(9, 34, 25, 4)}" fill="${YEL}" stroke="${INK}" stroke-width="4"/><text x="0" y="13" text-anchor="middle" font-family="Bangers,Impact" font-size="40" fill="${INK}">?</text></g><g transform="translate(46 120) scale(1.4)">${ICONS.lock()}</g></svg></div><div class="nm">${name}</div></div>`;

   <div class="sect">THE CREW</div><div class="cards crew">${lock('RAWCLAW', 'rawclaw', 'GIG 6')}${lock('ANDY', 'andy', 'GIG 8')}${lock('JORDAN', 'jordan', 'GIG 10')}</div>

}
/* ---------- kit ---------- */

/* ---------- menus ---------- */
const openTour = () => { LD.ui.levels({ onPlay: (id) => startGig(id) }); };
function openMenu() {
  const P = $('menuPanel');
  P.innerHTML = `<h2>PAUSED!</h2><div class="rowb"><button class="btn pri" data-act="close"><span class="t">RESUME</span></button><button class="btn grn" data-act="tour">${icon('map')}<span class="t">WORLD TOUR</span></button><button class="btn" data-act="looks">${icon('looks')}LOOKS</button><button class="btn" data-act="settings">${icon('settings')}SETTINGS</button><button class="btn" data-act="restart">${icon('undo')}RESTART GIG</button><button class="btn" data-act="title">${icon('back')}TITLE</button></div>`;
  $('menuOvl').classList.add('on');
  P.animate([{ transform: 'scale(.3) rotate(-14deg)', opacity: 0 }, { transform: 'scale(1.06) rotate(2deg)', opacity: 1, offset: 0.65 }, { transform: 'rotate(-1deg)' }], { duration: 300, easing: 'ease-out' });
}
function closeMenu() { $('menuOvl').classList.remove('on'); }
function syncMute() { $('gMute').innerHTML = icon(LD.meta.settings().sound === false ? 'mute' : 'sound'); }
function setMute(muted) { LD.meta.set('sound', !muted); syncMute(); }
const openSettings = () => LD.ui.settings({ onChange: (k, v) => { if (k === 'sound') syncMute(); if (k === 'assist' && game && !DEMO) game.opts.autoCross = !!v; updatePts(); refreshTitle(); } });
$('menuOvl').addEventListener('click', (e) => {
  const b = e.target.closest('button');
  if (!b) { if (e.target === $('menuOvl')) closeMenu(); return; }
  const a = b.dataset.act; closeMenu();
  if (a === 'tour') openTour();
  else if (a === 'looks') LD.ui.skins();
  else if (a === 'settings') openSettings();
  else if (a === 'restart') startGig(DEMO ? undefined : game.p.id);
  else if (a === 'title') showScreen('title');
});
/* ---------- game setup ---------- */
let lastRec = null;
function setupGame(g) {
  if (demoCtl) { demoCtl.stop(); demoCtl = null; }
  hideFinger();
  gen++; parts = []; winRec = null;
  winTimers.forEach(clearTimeout); winTimers = []; CX.setTransform(1, 0, 0, 1, 0, 0); CX.clearRect(0, 0, CV.width, CV.height);
  LD.loop.stop(); LD.loop.setLayers(0);
  game = g;
  const gg = game; LD.audio.attach({ on: (t, fn) => gg.on(t, (e) => { if (audioOK()) fn(e); }) }); LD.loop.attach(game);
  wire(game);
  $('crack').innerHTML = ''; strokeCells = [];
  buildBoard(); buildLineup(); buildArrows(); renderAll(); updateHUD();
}
function startGig(id) {
  if (LD.ui.isOpen()) LD.ui.close(true);
  closeMenu();
  DEMO = false;
  setupGame(LD.meta.newGame(id || undefined));
  showScreen('game');
}
/* ---------- demo (How to play): a fresh showcase puzzle, never touches the save ---------- */
function startDemo() {
  if (audioOK()) LD.audio.unlock();
  DEMO = true;
  setupGame(new LD.Game(LD.PUZZLES[LD.DEFAULT_PUZZLE]));
  showScreen('game');
  const f = $('finger');
  f.style.display = 'block'; f.style.transitionDuration = '0ms'; f.style.transform = `translate(${app.clientWidth * 0.78}px,${app.clientHeight * 0.86}px)`;
  $('gCap').classList.add('demo'); $('gK').textContent = 'KAPOW! HOW TO PLAY'; $('gV').textContent = 'Watch the finger...';
  const g = gen;
  const fingerTo = (x, y, ms) => { f.style.transitionDuration = ms + 'ms'; f.style.transform = `translate(${x - 11}px,${y - 6}px)`; };
  demoCtl = LD.demo(game, {
    moveTo(i, ms) { if (g !== gen) return; const p = cellC(i); fingerTo(p.cx, p.cy, ms); },
    moveToLine(kind, i, ms) { if (g !== gen || !arrows[kind][i]) return; const p = relRect(arrows[kind][i]); fingerTo(p.cx, p.cy, ms); },
    press(i) { f.classList.add('down'); const p = cellC(i); speed(p.cx, p.cy, 8, 20, 7, { w: 2.5, dur: 180, c: CYA }); },
    pressLine(kind, i) { f.classList.add('down'); arrowSquish(kind, i, true); },
    releaseLine() { f.classList.remove('down'); },
    release() { f.classList.remove('down'); },
    say(s) { if (g !== gen) return; $('gV').textContent = s; $('gCap').animate([{ transform: 'rotate(-1deg) scale(1.08)' }, { transform: 'rotate(-1deg) scale(1)' }], { duration: 220, easing: 'ease-out' }); },
    hint() {},
    done() { later(hideFinger, 600); },
  });
}
/* ---------- router ---------- */
function route() {
  const h = (location.hash || '').replace('#', '').toLowerCase();
  if (h === 'demo') return startDemo();
  if (h === 'game') return startGig();
  showScreen('title');
}
function refreshTitle() {
  updatePts();
  try { const L = LD.meta.level(LD.meta.currentId()); $('bPlaySub').textContent = ('CONTINUE · ' + (L.packName || '') + (L.num != null ? ' ' + L.num : '')).toUpperCase(); } catch (_) { $('bPlaySub').textContent = ''; }
  const tx = $('tX'); tx.innerHTML = ''; try { tx.appendChild(LD.ui.titleExtras()); } catch (_) { /* meta without extras */ }
}
/* ---------- init ---------- */
function rectBurst(el) {
  const r = relRect(el), pad = 22, W = r.w + pad * 2, H = r.h + pad * 2; let l = '';
  for (let k = 0; k < 12; k++) { const a = (k / 12) * Math.PI * 2 + 0.2, ex = Math.cos(a), ey = Math.sin(a), rx = r.w / 2 + 3, ry = r.h / 2 + 3; l += `<line x1="${f1(W / 2 + ex * rx)}" y1="${f1(H / 2 + ey * ry)}" x2="${f1(W / 2 + ex * (rx + 13))}" y2="${f1(H / 2 + ey * (ry + 13))}"/>`; }
  const d = fxEl(`<svg width="${W}" height="${H}"><g stroke="${INK}" stroke-width="3.2" stroke-linecap="round">${l}</g></svg>`);
  anim(d, [{ transform: `translate(${r.x - pad}px,${r.y - pad}px) scale(.85)`, opacity: 1 }, { transform: `translate(${r.x - pad}px,${r.y - pad}px) scale(1.08)`, opacity: 0 }], { duration: 230, easing: 'ease-out' });
}
function init() {
  buildDefs(); buildTitle(); buildHUD();
  document.querySelectorAll('.btn[data-i]').forEach((b) => { const ic = icon(b.dataset.i); if (b.classList.contains('ico')) b.innerHTML = ic; else b.insertAdjacentHTML('afterbegin', ic); });
  document.querySelectorAll('[data-go]').forEach((b) => b.addEventListener('click', () => showScreen(b.dataset.go)));

  window.addEventListener('hashchange', route);
  window.LDSKIN = {
    game: () => game,
    start: (id) => startGig(id),
    screen: () => curScreen,
    arrowRect: (kind, i) => (arrows[kind] && arrows[kind][i] ? arrows[kind][i].getBoundingClientRect() : null),
  };
  route();
}
init();
