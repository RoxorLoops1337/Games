<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#c99d66">
<link rel="icon" href="data:,">
<title>LoopDoku</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat+Brush&family=Chewy&family=Patrick+Hand&display=swap" rel="stylesheet">
<style>
:root{--card:#dcab6c;--card-dk:#95632e;--paper:#fbf4e2;--ink:#3a271b;--ink2:#6e5643;
--green:#78bd35;--green-dk:#3f7f18;--green-lt:#a9f060;--pink:#ff7fb2;--pink-dk:#c93f78;--pink-lt:#ffc9de;--tape:#efe0b2;--red:#e2463a;--stage:#f2649f;
--fd:'Chewy','Comic Sans MS','Chalkboard SE',cursive;--fh:'Patrick Hand','Comic Sans MS','Chalkboard SE',cursive;--fs:'Caveat Brush','Patrick Hand',cursive;
--grain:none;--pick:0px;
--ld-font:'Patrick Hand','Comic Sans MS',cursive;--ld-font-display:'Chewy','Comic Sans MS',cursive;--ld-ink:#3a271b;--ld-muted:#6e5643;--ld-panel:#fbf4e2;--ld-panel-2:#efdcb6;--ld-backdrop:rgba(60,35,15,.58);--ld-accent:#ff7fb2;--ld-accent-ink:#fff;--ld-accent-2:#78bd35;--ld-accent-2-ink:#fff;--ld-line:2px solid #c9a46a;--ld-radius:14px;--ld-shadow:0 4px 0 #b08a55,0 16px 30px rgba(40,20,5,.45);--ld-lock:#a08870;--sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#c99d66;color:var(--ink);font-family:var(--fh);-webkit-font-smoothing:antialiased;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
button{font-family:inherit}
#bg{position:fixed;left:0;top:0;width:100vw;height:100vh;z-index:0;display:block}
#app{position:relative;z-index:1;height:100vh;height:100dvh;overflow:hidden}
#stage{position:relative;margin:0 auto;width:min(100vw,440px);height:100%;z-index:2}
#stage.wide{width:min(100vw,1180px)}
.screen{position:absolute;left:0;right:0;top:0;bottom:calc(var(--pick) + var(--sab));display:none;flex-direction:column;padding:calc(var(--sat) + 8px) 10px 6px}
.screen.on{display:flex}
.scroll{overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.scrap{position:fixed;z-index:0;pointer-events:none;width:var(--w);height:var(--h);background:var(--c);border-radius:2px;box-shadow:1px 3px 3px rgba(40,20,5,.3);animation:drift var(--d) steps(28) infinite;opacity:.85}
.scrap.n{background:none;box-shadow:none;width:auto;height:auto;font:var(--w) var(--fd);color:var(--c);text-shadow:0 2px 0 #fffaf0,0 3px 4px rgba(40,20,5,.3)}
@keyframes drift{0%{transform:translate(0,0) rotate(var(--r0))}50%{transform:translate(var(--dx),-18px) rotate(var(--r1))}100%{transform:translate(0,0) rotate(var(--r0))}}
@media (prefers-reduced-motion:reduce){.scrap{animation:none}}
#fx{position:fixed;left:0;top:0;width:100vw;height:100vh;z-index:60;pointer-events:none}
.side{position:fixed;bottom:0;z-index:1;pointer-events:none;display:none;width:min(24vw,330px);height:min(86vh,700px)}
.side.L{right:calc(50% + 250px)}.side.R{left:calc(50% + 250px)}
@media (min-width:1000px){.side.show{display:block}}
@media (min-width:900px) and (min-height:820px){#stage{width:500px}}

/* ---------- paper primitives ---------- */
.tapebar{background:var(--grain) 0 0/150px,rgba(239,224,178,.96);clip-path:polygon(0 9%,4% 0,50% 5%,96% 0,100% 10%,97% 32%,100% 52%,96% 74%,100% 93%,95% 100%,50% 95%,5% 100%,0 90%,3% 68%,0 48%,4% 27%)}
.card{position:relative;background:var(--grain) 0 0/200px,var(--cf,#d9a764);border-radius:10px 14px 9px 13px/13px 9px 14px 10px;box-shadow:0 3px 0 var(--cfd,#94622d),0 9px 16px -4px rgba(45,22,5,.45)}
.sheetp{position:relative;background:var(--grain) 0 0/200px,var(--paper);border-radius:4px 7px 5px 8px/8px 4px 7px 5px;box-shadow:0 1.5px 0 #d8c7a2,0 10px 18px -6px rgba(45,22,5,.5)}
.brads::before,.brads::after{content:"";position:absolute;top:7px;width:9px;height:9px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff3b8 0 14%,#e3b34c 42%,#8d6219 100%);box-shadow:.5px 1.5px 1px rgba(40,20,5,.45);z-index:3}
.brads::before{left:7px}.brads::after{right:7px}
.washi{position:absolute;width:62px;height:18px;background:repeating-linear-gradient(45deg,rgba(255,255,255,.35) 0 4px,transparent 4px 8px),var(--wc,#ff9cc6);opacity:.9;clip-path:polygon(0 12%,6% 0,94% 8%,100% 0,97% 50%,100% 100%,5% 92%,0 100%,3% 50%);z-index:4}

/* ---------- cardboard tab buttons ---------- */
.tab{--tf:#e6bb7e;--tb:#9a6a35;position:relative;display:inline-flex;border:0;padding:0;margin:0;background:none;font:inherit;color:var(--ink);cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation;min-width:44px;min-height:44px;border-radius:12px 9px 13px 10px/10px 13px 9px 12px;outline:none;vertical-align:top}
.tab>.base{position:absolute;left:0;right:0;top:5px;bottom:-4px;border-radius:inherit;background:var(--tb);box-shadow:0 7px 12px -3px rgba(45,22,5,.5);transition:box-shadow .2s}
.tab>.face{position:relative;flex:1;display:flex;align-items:center;justify-content:center;gap:6px;padding:0 10px;border-radius:inherit;background:var(--grain) 0 0/180px,var(--tf);box-shadow:inset 0 1.5px 0 rgba(255,255,255,.5),inset 0 -1.5px 0 rgba(0,0,0,.12);transform:translateY(-2px);transition:transform .34s cubic-bezier(.3,1.9,.45,1)}
.tab>.face::after{content:"";position:absolute;inset:4px;border-radius:inherit;border:1.5px dashed rgba(58,39,27,.25);pointer-events:none}
.tab:hover>.face,.tab.is-hover>.face{transform:translateY(-4px) rotate(-.8deg)}
.tab:active>.face,.tab.is-pressed>.face{transform:translateY(3px) scale(.96,.92);transition-duration:.05s}
.tab:active>.base,.tab.is-pressed>.base{box-shadow:0 2px 3px -1px rgba(45,22,5,.5)}
.tab:disabled,.tab.is-disabled{cursor:default;filter:grayscale(.8) opacity(.55)}
.tab:disabled>.face,.tab.is-disabled>.face{transform:translateY(2px) rotate(0)}
.tab:focus-visible>.face{outline:3px dashed var(--pink-dk);outline-offset:3px}
.tab.green{--tf:#80c53d;--tb:#3f7f18;color:#fff}
.tab.pink{--tf:#ff88b8;--tb:#c23c74;color:#fff}
.tab.cream{--tf:#fbf3df;--tb:#bfa477}
.tab.green .face::after,.tab.pink .face::after{border-color:rgba(255,255,255,.55)}
.tab.green b,.tab.pink b{text-shadow:0 2px 0 rgba(50,20,10,.35)}
.tab b{font:400 20px/1 var(--fd);letter-spacing:.4px}
.tab .lbl{font:16px/1 var(--fh)}
.tab .ic{flex:none}
.tab.sq{width:44px;height:44px;flex:none}
.tab.sq>.face{padding:0}
.tab.round{border-radius:50%}
.tab.col>.face{flex-direction:column;gap:2px;padding:4px 4px 2px}

/* ---------- GAME ---------- */
#scr-game{padding-left:8px;padding-right:8px;gap:4px}
.g-top{flex:none;display:flex;align-items:center;gap:7px;height:52px;position:relative;z-index:5}
.gig{flex:1;min-width:0;height:46px;filter:drop-shadow(0 2px 1.5px rgba(40,20,5,.35))}
.gig .tapebar{height:100%;padding:3px 12px 0 14px;display:flex;flex-direction:column;justify-content:center;transform:rotate(-1.3deg)}
.gig b{font:400 20px/1.05 var(--fd);display:block;letter-spacing:.3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gig span{font:14px/1.15 var(--fh);color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.timer{flex:none;height:40px;min-width:64px;filter:drop-shadow(0 2px 1.5px rgba(40,20,5,.4));transform:rotate(2deg)}
.timer div{height:100%;padding:0 9px 0 19px;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 9px 50%,#7a5530 0 2.6px,transparent 3.2px),var(--grain) 0 0/150px,var(--paper);clip-path:polygon(11px 0,100% 3%,98% 100%,11px 100%,0 50%);font:24px/1 var(--fs);color:var(--ink);font-variant-numeric:tabular-nums}
.lives{flex:none;display:flex;gap:0;align-items:center;height:46px}
.life{position:relative;width:22px;height:40px}
.life svg{position:absolute;inset:0;width:100%;height:100%;display:block;overflow:visible}
.life .on{filter:drop-shadow(0 1.5px 1px rgba(40,20,5,.45))}
.life .ghost{opacity:0}
.life.lost .on{opacity:0}.life.lost .ghost{opacity:.75}
.half{position:absolute;inset:0;pointer-events:none;z-index:70}
.g-hud{flex:none;position:relative;height:clamp(150px,24vh,200px);height:clamp(150px,24dvh,200px)}
.pup{position:absolute;bottom:0;height:100%;width:auto;aspect-ratio:138/200;z-index:1;pointer-events:none}
.pup.L{left:-6px}.pup.R{right:-6px}
.marquee{position:absolute;left:50%;top:max(4px,calc(100% - 178px));width:min(40%,176px);height:min(104px,calc(100% - 64px));transform:translateX(-50%) rotate(-1.2deg);z-index:1;display:flex;flex-direction:column;align-items:center;padding-top:6px;--cf:#e9bf86}
.marquee::before,.marquee::after{top:6px}
.marquee h4{margin:0;font:400 15px/1 var(--fd);letter-spacing:.8px;color:#5b3416}
.marquee svg{width:84%;height:44px;margin-top:2px;overflow:visible}
.marquee .lc{font:14px/1 var(--fh);color:var(--ink2);margin-top:-1px}
.hud-panel{position:absolute;left:0;right:0;bottom:0;height:56px;z-index:2;display:grid;grid-template-columns:repeat(9,1fr);gap:0;align-items:center;padding:4px 6px 2px;--cf:#d49a58;--cfd:#8a5823}
.hud-panel::before,.hud-panel::after{top:4px;width:8px;height:8px}
.pad{display:flex;flex-direction:column;align-items:center;gap:2px;min-width:0}
.pad i{display:block;width:24px;height:24px;border-radius:50%;background:radial-gradient(circle at 40% 35%,rgba(255,255,255,.25),transparent 60%),var(--grain) 0 0/90px,#9c8a74;box-shadow:inset 0 -2px 0 rgba(0,0,0,.18),0 1.5px 0 rgba(60,30,10,.45)}
.pad.on i{background-color:var(--pc);box-shadow:inset 0 -2px 0 rgba(0,0,0,.18),0 1.5px 0 rgba(60,30,10,.45),0 0 10px 2px color-mix(in srgb,var(--pc) 60%,transparent)}
.pad span{font:12px/1 var(--fh);color:#4d2f14;opacity:.55;white-space:nowrap}
.pad.on span{opacity:1}
#boardBox{flex:1;min-height:0;position:relative;display:flex;align-items:center;justify-content:center}
#boardWrap{position:relative;flex:none}
#boardShake{position:absolute;inset:0;pointer-events:none}
#boardCv{position:absolute;pointer-events:none}
#board{position:absolute;z-index:3;cursor:pointer;-webkit-tap-highlight-color:transparent}
.g-btns{flex:none;display:grid;grid-template-columns:1fr 1.3fr 1fr 1fr;gap:7px;height:70px;padding:2px 2px 8px}
.g-btns .tab{height:60px}
.g-btns .lbl{font-size:15px}
.bubble{position:absolute;left:50%;top:6px;z-index:6;width:max-content;max-width:min(250px,64vw);padding:9px 14px 10px;background:var(--grain) 0 0/160px,#fffaf0;border-radius:18px 22px 20px 16px/20px 16px 22px 18px;font:18px/1.12 var(--fh);color:var(--ink);text-align:center;box-shadow:0 2px 0 #d9c9a6,0 8px 14px -4px rgba(40,20,5,.45);transform:translateX(-50%);opacity:0;pointer-events:none}
.bubble::after{content:"";position:absolute;left:58%;bottom:-8px;width:16px;height:16px;background:#fffaf0;transform:rotate(45deg) skew(8deg,8deg);border-radius:0 0 4px 0;box-shadow:2px 2px 0 #d9c9a6}
.bubble.on{opacity:1}
.bubble .washi{left:-12px;top:-7px;transform:rotate(-24deg);width:44px;height:14px;--wc:#a9e070}

/* overlays */
.ov{position:absolute;inset:0;z-index:50;display:none;align-items:center;justify-content:center;background:rgba(40,22,10,.42);padding:16px}
.ov.on{display:flex}
.sheet{width:min(100%,360px);padding:24px 18px 18px;display:flex;flex-direction:column;gap:12px;align-items:stretch}
.sheet .tab{height:52px}
.sheet .row{display:flex;gap:8px}.sheet .row .tab{flex:1}
.chips{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.chips .tab{height:44px;min-width:60px}
.chips .tab .lbl{font-size:15px}
.sign{position:relative;width:min(100%,330px);padding:26px 18px 18px;text-align:center;transform-origin:50% -60px;animation:swing 2.4s ease-in-out infinite}
.sign::before,.sign::after{content:"";position:absolute;top:-70px;width:2px;height:74px;background:#5a4030}
.sign::before{left:22%;transform:rotate(8deg)}.sign::after{right:22%;transform:rotate(-8deg)}
@keyframes swing{0%,100%{transform:rotate(-2.5deg)}50%{transform:rotate(2.5deg)}}

/* cut-out ransom headline */
.cut{display:flex;flex-wrap:wrap;justify-content:center;gap:1px 0;margin:6px 0 10px;font:400 30px/1 var(--fd)}
.cut span{display:inline-block;padding:4px 5px 2px;margin:0 1px;color:#fff;background:var(--grain) 0 0/120px,var(--c);transform:rotate(var(--r)) translateY(var(--y));box-shadow:0 2px 0 rgba(0,0,0,.18),0 4px 6px -2px rgba(40,20,5,.4);border-radius:2px 4px 3px 2px;text-shadow:0 1.5px 0 rgba(40,20,10,.35)}
.cut span.sp{background:none;box-shadow:none;width:8px}
.cut span.dk{color:var(--ink);text-shadow:none}

/* ---------- TITLE ---------- */
#scr-title{align-items:center;gap:6px}
#logoBox{flex:none;width:100%;display:flex;flex-direction:column;align-items:center}
#logoCv{display:block;width:min(100%,372px);height:auto}
.tagline{margin-top:-6px;filter:drop-shadow(0 2px 1.5px rgba(40,20,5,.35));transform:rotate(-1.5deg)}
.tagline div{padding:5px 18px 4px;font:18px/1 var(--fh);color:var(--ink)}
#duoBox{flex:1;min-height:150px;width:100%;position:relative}
#duoCv{position:absolute;left:0;top:0;width:100%;height:100%}
.t-btns{flex:none;width:100%;display:flex;flex-direction:column;gap:10px;padding:0 4px 4px}
.t-btns .r2{display:grid;grid-template-columns:1fr 1.55fr;gap:10px}
.t-btns .r3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.t-btns .r2 .tab{height:64px}
.t-btns .r3 .tab{height:48px}
.t-btns .r3{row-gap:9px}
.t-btns .r2 b{font-size:22px;white-space:nowrap}
.t-btns .r2 .face{padding:0 6px;gap:5px}
.t-btns .r3 .lbl{font-size:16px}

/* ---------- WIN ---------- */
#scr-win{align-items:center;gap:6px}
.bunting{flex:none;width:100%;height:34px;position:relative}
.bunting svg{width:100%;height:100%;display:block;overflow:visible}
.w-stagebox{flex:1;min-height:110px;width:100%;position:relative;perspective:700px}
.w-book{position:absolute;left:3%;right:3%;bottom:0;height:16%;display:flex;gap:2px;transform:perspective(500px) rotateX(38deg);transform-origin:50% 100%}
.w-book i{flex:1;background:var(--grain) 0 0/160px,#c98d4c;border-radius:6px 2px 2px 10px;box-shadow:0 4px 0 #7c4f22,0 10px 16px -4px rgba(40,20,5,.5)}
.w-book i:last-child{border-radius:2px 6px 10px 2px}
.w-book i::after{content:"";display:block;margin:7px;height:calc(100% - 14px);background:repeating-linear-gradient(transparent 0 9px,rgba(110,140,190,.35) 9px 10px),var(--grain) 0 0/160px,var(--paper);border-radius:3px}
.w-book i:first-child::after{box-shadow:inset -14px 0 12px -10px rgba(60,30,10,.4)}.w-book i:last-child::after{box-shadow:inset 14px 0 12px -10px rgba(60,30,10,.4)}
.w-pop{position:absolute;left:0;right:0;top:0;bottom:9%;transform-origin:50% 100%}
#winCv{position:absolute;inset:0;width:100%;height:100%}
.w-stars{flex:none;display:flex;gap:10px;justify-content:center;height:52px;align-items:center}
.w-stars i{width:48px;height:48px;display:block;opacity:0}
.w-stars i svg{width:100%;height:100%;overflow:visible}
.w-stats{flex:none;display:flex;gap:8px;justify-content:center;width:100%}
.w-stats .sheetp{flex:1;max-width:120px;padding:7px 6px 6px;text-align:center}
.w-stats .sheetp:nth-child(1){transform:rotate(-2deg)}.w-stats .sheetp:nth-child(3){transform:rotate(2deg)}
.w-stats small{display:block;font:14px/1 var(--fh);color:var(--ink2)}
.w-stats b{display:block;font:26px/1.1 var(--fs);color:var(--ink)}
.w-btns{flex:none;display:grid;grid-template-columns:1fr 1.7fr;align-items:end;gap:10px;width:100%;padding:6px 4px 4px}
.w-btns .tab{height:60px}

/* ---------- OUTFITS ---------- */
.o-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:0 2px}
.o-card{position:relative;height:236px;padding:8px 6px 6px;display:flex;flex-direction:column;align-items:center}
.o-card:nth-child(odd){transform:rotate(-1.2deg)}.o-card:nth-child(even){transform:rotate(1deg)}
.o-card canvas{width:100%;flex:1;min-height:0}
.o-name{margin-top:2px;filter:drop-shadow(0 1.5px 1px rgba(40,20,5,.3))}
.o-name div{padding:4px 12px 3px;font:17px/1.05 var(--fh);text-align:center}
.o-tag{position:absolute;right:6px;top:6px;font:13px/1 var(--fh);background:#a9e070;padding:3px 6px;border-radius:3px;transform:rotate(6deg);box-shadow:0 1.5px 0 rgba(0,0,0,.2)}
.o-tag.p{background:#ffc0d9}
.o-crew{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:0 2px 16px}
.o-crew .o-card{height:190px}
.o-crew .lockb{position:absolute;right:8px;top:8px;width:40px;height:40px;border-radius:50%;background:var(--grain) 0 0/90px,#e5c070;display:flex;align-items:center;justify-content:center;box-shadow:0 3px 0 #8d6219,0 6px 8px rgba(40,20,5,.4)}
.sec-h{font:400 22px/1 var(--fd);margin:14px 4px 8px;color:var(--ink)}

/* ---------- LINE ARROWS (paper triangles on the frame) ---------- */
#arrows{position:absolute;left:0;top:0;width:0;height:0;z-index:4}
.arw{position:absolute;border:0;padding:0;margin:0;background:none;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation;outline:none}
.arw svg{display:block;width:100%;height:100%;overflow:visible;filter:drop-shadow(0 2px 1.2px rgba(40,20,5,.45));transition:opacity .15s}
.arw.dim svg{opacity:.42;filter:grayscale(.75) drop-shadow(0 1px .8px rgba(40,20,5,.3))}
.arw:hover svg{transform:translate(1px,-1px)}
.arw:focus-visible{outline:2px dashed var(--pink-dk);outline-offset:1px}
/* ---------- META bits ---------- */
.ptstag{margin-top:6px;filter:drop-shadow(0 2px 1.5px rgba(40,20,5,.35));transform:rotate(1.5deg)}
.ptstag div{padding:4px 14px 3px;font:400 18px/1 var(--fd);color:#fff;background:var(--grain) 0 0/120px,#78bd35;border-radius:3px 6px 4px 5px;letter-spacing:.4px}
.w-pts{flex:none;display:flex;flex-direction:column;align-items:center;width:100%}
.ptsbox{padding:4px 14px 5px;text-align:center;transform:rotate(-1.5deg);min-width:210px}
.ptsbox b{display:block;font:400 28px/1 var(--fd);color:#c93f78;letter-spacing:.5px}
.ptsbox .bd{display:flex;flex-wrap:wrap;gap:4px;justify-content:center;margin:4px 0 3px}
.ptsbox .bd span{font:13px/1 var(--fh);padding:3px 7px 2px;background:var(--grain) 0 0/120px,#efe0b2;border-radius:2px;transform:rotate(var(--r,0deg))}
.ptsbox small{display:block;font:15px/1 var(--fh);color:var(--ink2)}
.ldui-sheet{background-image:var(--grain)!important;background-size:200px!important}
.ldx{background-image:var(--grain)!important;background-size:200px!important;box-shadow:0 2px 0 #d8c7a2,0 8px 14px -6px rgba(45,22,5,.45)!important;position:relative}
.ldx::before{content:"";position:absolute;left:50%;top:-7px;width:54px;height:15px;transform:translateX(-50%) rotate(-3deg);background:repeating-linear-gradient(45deg,rgba(255,255,255,.35) 0 4px,transparent 4px 8px),#a9e070;opacity:.9;clip-path:polygon(0 12%,6% 0,94% 8%,100% 0,97% 50%,100% 100%,5% 92%,0 100%,3% 50%)}
.ldx-pill.hot,.ldx-pill.gold{box-shadow:0 1.5px 0 rgba(0,0,0,.18)}
#tX{flex:none;width:100%;padding:0 4px}
#tX .ldx{transform:rotate(-.6deg)}
#wX{width:min(100%,360px);margin-top:6px}
#wX .ldx{transform:rotate(.6deg);padding:8px 10px!important;gap:6px!important}
#loseX{width:100%;margin-top:10px;text-align:left}
.tab .sub{display:block;font:15px/1 var(--fh);opacity:.92;margin-top:2px;white-space:nowrap}

<script>

})();
