<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>LoopDoku</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cpath d='M32 32C26 20 10 20 10 32s16 12 22 0c6-12 22-12 22 0s-16 12-22 0z' fill='none' stroke='%232a0b45' stroke-width='14'/%3E%3Cpath d='M32 32C26 20 10 20 10 32s16 12 22 0' fill='none' stroke='%2378bd35' stroke-width='8'/%3E%3Cpath d='M32 32c6-12 22-12 22 0s-16 12-22 0' fill='none' stroke='%23ff7fb2' stroke-width='8'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#2a0b45; --ink2:#47136e; --plum:#3a1260; --grape:#7b2fd0; --grape-l:#b77cff;
  --rox:#78bd35; --rox-d:#3f7f18; --rox-g:#a9f060; --rox-l:#d8ff9a;
  --jas:#ff7fb2; --jas-d:#c93f78; --jas-l:#ffc9de;
  --gold:#ffcf3a; --gold-d:#d8860b; --cream:#fff6e8; --red:#ff3d5a;
  --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
  --fh:'Lilita One','Luckiest Guy','Arial Rounded MT Bold',system-ui,sans-serif;
  --fb:'Fredoka','Arial Rounded MT Bold',system-ui,sans-serif;
  /* shared LD.ui overlays, candy-themed */
  --ld-font:'Fredoka','Arial Rounded MT Bold',system-ui,sans-serif; --ld-font-display:'Lilita One','Arial Rounded MT Bold',system-ui,sans-serif;
  --ld-ink:#2a0b45; --ld-muted:#7a5a9e; --ld-panel:linear-gradient(180deg,#fff,#ffeaf5); --ld-panel-2:#f1e4ff; --ld-backdrop:rgba(40,6,80,.62);
  --ld-accent:#ff6fae; --ld-accent-ink:#fff; --ld-accent-2:#ffcf3a; --ld-accent-2-ink:#6a3000; --ld-line:3px solid #2a0b45; --ld-radius:28px;
  --ld-shadow:0 8px 0 #2a0b45,0 22px 44px rgba(20,0,40,.5); --ld-lock:#7a5a9e;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#2a0b52;color:#fff;font-family:var(--fb);font-weight:600}
body{min-height:100dvh;touch-action:manipulation}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer}
svg{display:block}
#defs{position:absolute;width:0;height:0;overflow:hidden}

/* ---------- SKY + BOKEH ---------- */
#sky{position:fixed;inset:0;background:
  radial-gradient(120% 60% at 50% 105%,#ff8fc4 0%,rgba(255,143,196,0) 60%),
  radial-gradient(90% 50% at 15% 0%,#6a2bd8 0%,rgba(106,43,216,0) 70%),
  linear-gradient(180deg,#2b0c63 0%,#5a1a9e 38%,#b23fae 72%,#ff86b8 100%);overflow:hidden;z-index:0}
#sky .bk{position:absolute;border-radius:50%;filter:blur(2px);opacity:.5;will-change:transform;animation:drift 18s ease-in-out infinite alternate}
#sky .bk.s{filter:none;opacity:.7}
@keyframes drift{from{transform:translate3d(0,0,0) scale(1)}to{transform:translate3d(var(--dx),var(--dy),0) scale(1.15)}}
#sky .rays{position:absolute;left:50%;top:-30%;width:180vmax;height:180vmax;margin-left:-90vmax;background:repeating-conic-gradient(from 0deg,rgba(255,255,255,.05) 0 7deg,rgba(255,255,255,0) 7deg 18deg);animation:spin 90s linear infinite;mask:radial-gradient(closest-side,#000 20%,transparent 75%);-webkit-mask:radial-gradient(closest-side,#000 20%,transparent 75%)}
@keyframes spin{to{transform:rotate(360deg)}}

/* ---------- STAGE ---------- */
#stage{position:relative;z-index:2;margin:0 auto;height:100dvh;max-width:clamp(440px,60dvh,560px);display:flex;flex-direction:column;overflow:hidden}
#stage.wide{max-width:1160px}
.screen{position:relative;flex:1 1 auto;min-height:0;display:none;flex-direction:column}
.screen.on{display:flex;animation:scrIn .42s cubic-bezier(.2,1.4,.4,1)}
@keyframes scrIn{from{opacity:0;transform:scale(.94) translateY(14px)}to{opacity:1;transform:none}}
.side{position:fixed;bottom:0;width:calc(50vw - 300px);max-width:380px;z-index:1;display:none;pointer-events:none}
.side.l{left:2vw}.side.r{right:2vw}
@media (min-width:980px){.side{display:block}}
.kitmode .side{display:none}
.side .fig{width:100%;animation:bob 1.25s ease-in-out infinite}
.side .podium{height:70px;margin:-34px 10% 4vh;border-radius:50%;background:radial-gradient(closest-side,rgba(255,255,255,.35),rgba(255,255,255,0))}

/* ---------- DOCK (screen picker) ---------- */
#dock{flex:0 0 auto;display:flex;gap:5px;justify-content:center;padding:6px 8px calc(6px + var(--safe-b));overflow-x:auto;scrollbar-width:none}
#dock::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;font-family:var(--fh);font-size:12px;letter-spacing:.3px;padding:7px 10px 6px;border-radius:999px;background:linear-gradient(#ffffff3a,#ffffff14);box-shadow:inset 0 1px 0 #ffffff70,0 2px 0 #00000040;color:#fff;text-shadow:0 1px 0 #3a0f60;transition:transform .12s}
.chip.on{background:linear-gradient(#fff,#ffd6ea);color:var(--jas-d);text-shadow:none;box-shadow:0 3px 0 var(--jas-d),inset 0 -2px 0 #ffb3d2}
.chip:active{transform:scale(.9)}

/* ---------- CANDY TEXT ---------- */
.ct{position:relative;display:inline-block;font-family:var(--fh);font-weight:400;line-height:1.05;color:var(--ink);-webkit-text-stroke:.2em var(--ink);text-shadow:0 .09em 0 var(--ink),0 .2em .18em rgba(20,0,40,.45);z-index:0}
.ct::after{content:attr(data-t);position:absolute;left:0;top:0;right:0;bottom:0;color:transparent;-webkit-text-stroke:0;text-shadow:none;background:linear-gradient(180deg,#fff 0%,#fff 42%,#ffe07a 56%,#ffb020 100%);-webkit-background-clip:text;background-clip:text;white-space:inherit}
.ct.pink{color:#6d0f3e;-webkit-text-stroke-color:#6d0f3e;text-shadow:0 .09em 0 #6d0f3e,0 .2em .18em rgba(20,0,40,.45)}
.ct.pink::after{background-image:linear-gradient(180deg,#fff 0%,#ffe4f0 40%,#ff8cc0 60%,#e9478f 100%)}
.ct.green{color:#1b4204;-webkit-text-stroke-color:#1b4204;text-shadow:0 .09em 0 #1b4204,0 .2em .18em rgba(20,0,40,.45)}
.ct.green::after{background-image:linear-gradient(180deg,#fbffe6 0%,#e7ffa8 40%,#9fe24a 60%,#4f9f1c 100%)}
.ct.red{color:#5e0012;-webkit-text-stroke-color:#5e0012;text-shadow:0 .09em 0 #5e0012,0 .2em .18em rgba(20,0,40,.45)}
.ct.red::after{background-image:linear-gradient(180deg,#fff 0%,#ffe0e4 40%,#ff6f86 60%,#d9123f 100%)}
.ot{font-family:var(--fh);color:#fff;text-shadow:0 2px 0 var(--ink),2px 0 0 var(--ink),-2px 0 0 var(--ink),0 -2px 0 var(--ink),1.5px 1.5px 0 var(--ink),-1.5px 1.5px 0 var(--ink),1.5px -1.5px 0 var(--ink),-1.5px -1.5px 0 var(--ink),0 4px 0 var(--ink)}

/* ---------- CHUNKY CANDY BUTTONS ---------- */
.btn{--c1:#c6ff6a;--c2:#79c62c;--c3:#3c8a12;--dk:#245a07;position:relative;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:52px;padding:6px 22px 8px;border-radius:20px;
  font-family:var(--fh);font-size:22px;letter-spacing:.4px;color:#fff;
  background:linear-gradient(180deg,var(--c1) 0%,var(--c2) 52%,var(--c3) 100%);
  box-shadow:0 7px 0 var(--dk),0 11px 14px rgba(30,0,60,.45),inset 0 2px 0 rgba(255,255,255,.75),inset 0 -5px 0 rgba(0,0,0,.14),0 0 0 3px var(--dk);
  text-shadow:0 2px 0 var(--dk),2px 0 0 var(--dk),-2px 0 0 var(--dk),0 -2px 0 var(--dk),1.5px 1.5px 0 var(--dk),-1.5px 1.5px 0 var(--dk),1.5px -1.5px 0 var(--dk),-1.5px -1.5px 0 var(--dk),0 3px 0 var(--dk);
  transform-origin:50% 100%;transition:filter .15s;user-select:none;-webkit-user-select:none;margin-bottom:7px}
.btn::before{content:'';position:absolute;left:9%;right:9%;top:4px;height:40%;border-radius:999px;background:linear-gradient(180deg,rgba(255,255,255,.85),rgba(255,255,255,.08));pointer-events:none}
.btn::after{content:'';position:absolute;right:10px;top:7px;width:7px;height:7px;border-radius:50%;background:#fff;opacity:.9;pointer-events:none}
.btn>*{position:relative}
.btn>svg{width:26px;height:26px;flex:0 0 auto;filter:drop-shadow(0 2px 0 var(--dk))}
.btn.big>svg{width:30px;height:30px}
.btn.pink{--c1:#ffd0e4;--c2:#ff7fb2;--c3:#e04a8a;--dk:#8c1e52}
.btn.gold{--c1:#fff6a8;--c2:#ffcf3a;--c3:#f08f0e;--dk:#9a4b00}
.btn.grape{--c1:#e2c8ff;--c2:#a46cf2;--c3:#7232c8;--dk:#3e1478}
.btn.sky{--c1:#c9f3ff;--c2:#5cc8ff;--c3:#2b8fd8;--dk:#0f4f8a}
.btn:hover{filter:brightness(1.07) saturate(1.05)}
.btn.press,.btn.st-press{transform:translateY(6px) scale(1.04,.9);box-shadow:0 1px 0 var(--dk),0 3px 6px rgba(30,0,60,.4),inset 0 2px 0 rgba(255,255,255,.6),inset 0 -2px 0 rgba(0,0,0,.14),0 0 0 3px var(--dk)}
.btn.boing{animation:boing .5s cubic-bezier(.3,1.6,.5,1)}
@keyframes boing{0%{transform:translateY(6px) scale(1.04,.9)}35%{transform:translateY(-3px) scale(.95,1.08)}60%{transform:scale(1.03,.97)}80%{transform:scale(.99,1.01)}100%{transform:none}}
.btn[disabled],.btn.st-dis{filter:grayscale(.85) brightness(.9);opacity:.75;cursor:default}
.btn.st-hover{filter:brightness(1.07) saturate(1.05)}
.btn.icon{width:56px;min-width:56px;padding:0;border-radius:18px;min-height:52px}
.btn.icon svg{width:30px;height:30px;filter:drop-shadow(0 2px 0 var(--dk))}
.btn.sm{min-height:42px;font-size:17px;padding:4px 14px 6px;border-radius:16px}
.btn.sm.icon{width:46px;min-width:46px;min-height:44px}
.btn.sm.icon svg{width:26px;height:26px}
.btn.big{min-height:66px;font-size:28px;border-radius:24px;padding:6px 30px 10px}

/* ---------- PILLS / HUD ---------- */
.pill{position:relative;display:flex;align-items:center;gap:6px;height:42px;padding:0 12px;border-radius:999px;
  background:linear-gradient(180deg,#6a2cb0,#40107a);box-shadow:inset 0 2px 0 rgba(255,255,255,.35),inset 0 -3px 0 rgba(0,0,0,.25),0 0 0 3px #22053f,0 5px 0 #22053f}
.pill::before{content:'';position:absolute;left:12px;right:12px;top:3px;height:12px;border-radius:999px;background:linear-gradient(rgba(255,255,255,.45),rgba(255,255,255,0));pointer-events:none}
.ribbon{position:relative;padding:6px 26px 8px;text-align:center;min-width:0}
.ribbon .rb{position:absolute;inset:0 6px;border-radius:12px;background:linear-gradient(180deg,#ff9cc8,#ff5fa2 55%,#d93a80);box-shadow:inset 0 2px 0 rgba(255,255,255,.6),inset 0 -4px 0 rgba(0,0,0,.15),0 0 0 3px #6d0f3e,0 5px 0 #6d0f3e}
.ribbon .rb::before,.ribbon .rb::after{content:'';position:absolute;top:10px;width:24px;height:30px;background:linear-gradient(#e0488c,#a8215e);z-index:-1;box-shadow:0 0 0 3px #6d0f3e}
.ribbon .rb::before{left:-16px;clip-path:polygon(0 0,100% 0,100% 100%,0 100%,38% 50%)}
.ribbon .rb::after{right:-16px;clip-path:polygon(0 0,100% 0,62% 50%,100% 100%,0 100%)}
.ribbon .t1,.ribbon .t2{position:relative;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ribbon .t1{font-family:var(--fh);font-size:21px;line-height:1.1;padding-top:1px}
.ribbon .t2{font-size:11.5px;font-weight:700;color:#fff3f8;letter-spacing:.3px;text-shadow:0 1px 0 #8c1e52}

/* ---------- GAME LAYOUT ---------- */
#scr-game{padding:calc(6px + var(--safe-t)) 10px 0}
.topbar{display:flex;align-items:center;gap:8px;justify-content:space-between;flex:0 0 auto}
.topbar .ribbon{flex:1 1 auto}
.statrow{display:flex;align-items:center;gap:8px;justify-content:space-between;margin-top:8px;flex:0 0 auto}
.lives{gap:2px;padding:0 8px}
.life{width:30px;height:34px;position:relative}
.life svg{width:100%;height:100%}
.life.gone{opacity:.35;filter:grayscale(1)}
.timer{min-width:96px;justify-content:center;font-family:var(--fh);font-size:21px;letter-spacing:.5px}
.timer svg{width:20px;height:20px}
.diffp{font-family:var(--fh);font-size:15px;padding:0 12px;background:linear-gradient(180deg,#ffe36a,#ffb01f);color:#7a3a00;box-shadow:inset 0 2px 0 rgba(255,255,255,.6),inset 0 -3px 0 rgba(0,0,0,.15),0 0 0 3px #7a3a00,0 5px 0 #7a3a00}
.duo{position:relative;flex:0 0 auto;height:clamp(96px,calc(100dvh - 666px),185px);margin-top:6px;display:flex;align-items:flex-end;justify-content:space-between}
.duo .hero{position:relative;flex:0 0 auto;width:auto;height:100%;aspect-ratio:200/300;max-width:27%;transform-origin:50% 100%}
.duo .hero .fig{position:absolute;inset:0;transform-origin:50% 100%;animation:bob .625s ease-in-out infinite alternate}
.duo .hero.j .fig{animation-delay:-.31s}
@keyframes bob{from{transform:translateY(0) scale(1,1)}to{transform:translateY(-3px) scale(.985,1.02)}}
.hero.react{animation:hop .55s cubic-bezier(.3,1.5,.5,1)}
@keyframes hop{0%{transform:scale(1.15,.82)}30%{transform:translateY(-16px) scale(.9,1.12)}60%{transform:translateY(0) scale(1.08,.92)}80%{transform:scale(.97,1.03)}100%{transform:none}}
.hero.wince{animation:wince .5s ease-out}
@keyframes wince{0%,100%{transform:none}15%{transform:translateX(-7px) rotate(-6deg) scale(.95)}35%{transform:translateX(6px) rotate(5deg)}55%{transform:translateX(-4px) rotate(-3deg)}75%{transform:translateX(2px)}}
.station{position:relative;flex:1 1 0;min-width:0;margin:0 4px 6px;height:84px;border-radius:20px;padding:6px 8px 4px;
  background:linear-gradient(180deg,#4b1586,#2c0957);box-shadow:inset 0 2px 0 rgba(255,255,255,.25),inset 0 -3px 0 rgba(0,0,0,.3),0 0 0 3px #1a0336,0 5px 0 #1a0336}
.station .lbl{display:flex;justify-content:space-between;align-items:center;gap:4px;font-family:var(--fh);font-size:12px;letter-spacing:.4px;color:#ffd6ea;white-space:nowrap}
.station .lbl b{font-family:var(--fh);font-weight:400;color:#fff;background:linear-gradient(#ff8cc0,#e9478f);padding:1px 7px;border-radius:99px;font-size:11px;box-shadow:0 2px 0 #6d0f3e}
.gems{display:flex;gap:3px;justify-content:center;margin-top:5px}
.gem{position:relative;flex:1 1 0;min-width:0;max-width:30px;display:flex;flex-direction:column;align-items:center;gap:2px}
.gem i{display:block;width:100%;aspect-ratio:1;border-radius:9px;background:linear-gradient(180deg,#3d1270,#25064a);box-shadow:inset 0 2px 3px rgba(0,0,0,.5),inset 0 -1px 0 rgba(255,255,255,.15);transform-origin:50% 80%}
.gem.on i{background:radial-gradient(70% 55% at 35% 25%,rgba(255,255,255,.95),rgba(255,255,255,0) 60%),linear-gradient(180deg,var(--gl),var(--gc) 55%,var(--gd));box-shadow:0 0 10px var(--gc),inset 0 -3px 0 rgba(0,0,0,.18),0 0 0 2px var(--gd)}
.gem span{font-size:7.5px;font-weight:700;letter-spacing:0;color:#c9a6f2;white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:clip}
.gem.on span{color:#fff}
.gems.many span{display:none}.gems.many{margin-top:9px}.gems.many .gem{max-width:24px}
.gem.pulse i{animation:gempulse .22s ease-out}
@keyframes gempulse{0%{transform:scale(1.22,.86)}60%{transform:scale(.95,1.06)}100%{transform:none}}
.gem.fill i{animation:gemfill .6s cubic-bezier(.3,1.7,.5,1)}
@keyframes gemfill{0%{transform:scale(.2)}45%{transform:scale(1.45,.75)}70%{transform:scale(.88,1.15)}100%{transform:none}}

/* ---------- BOARD ---------- */
#boardZone{position:relative;flex:1 1 auto;min-height:0;margin:4px 0}
#boardShake{position:absolute;left:0;top:0;will-change:transform}
#arrows{position:absolute;left:0;top:0;width:0;height:0;z-index:4}
.arw{position:absolute;display:flex;align-items:center;justify-content:center;padding:0;border:0;background:none;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.arw .gd{display:block;width:var(--gs,28px);height:var(--gs,28px);transform-origin:50% 50%;filter:drop-shadow(0 3px 0 rgba(30,0,60,.45));transition:opacity .25s,filter .25s}
.arw.col .gd svg{transform:rotate(90deg)}
.arw .gd svg{width:100%;height:100%;overflow:visible}
.arw:hover .gd{filter:drop-shadow(0 3px 0 rgba(30,0,60,.45)) brightness(1.12)}
.arw.dn .gd{transform:scale(.8,.72)}
.arw.dim .gd{opacity:.38;filter:saturate(.35) drop-shadow(0 2px 0 rgba(30,0,60,.3))}
#boardFrame{position:relative;border-radius:26px;padding:9px;background:linear-gradient(180deg,#fff 0%,#ffe0f0 40%,#ffb3d6 100%);
  box-shadow:0 0 0 4px #4a0f6e,0 9px 0 #4a0f6e,0 18px 30px rgba(30,0,60,.55),inset 0 3px 0 #fff,inset 0 -4px 0 #ff8fc0;transform-origin:50% 50%}
#boardFrame::before{content:'';position:absolute;left:18px;right:40%;top:3px;height:4px;border-radius:9px;background:#fff;opacity:.9}
#board{position:relative;border-radius:16px;background:linear-gradient(180deg,#2c0a4c,#1d0636);box-shadow:inset 0 3px 8px rgba(0,0,0,.6);overflow:visible;touch-action:none}
.cell{position:absolute;pointer-events:none}
.tile{position:absolute;background:
   radial-gradient(90% 70% at 30% 22%,rgba(255,255,255,.62) 0%,rgba(255,255,255,0) 52%),
   linear-gradient(180deg,var(--lt) 0%,var(--c) 55%,var(--dk) 100%);
  box-shadow:inset 0 2px 0 rgba(255,255,255,.7),inset 0 -3px 0 rgba(0,0,0,.13),inset 0 0 9px rgba(255,255,255,.45);will-change:transform}
.tile::before{content:'';position:absolute;left:14%;top:9%;width:30%;height:14%;border-radius:999px;background:rgba(255,255,255,.75);transform:rotate(-18deg);opacity:.85}
.tile::after{content:'';position:absolute;inset:0;border-radius:inherit;background:var(--pat);opacity:.22;mix-blend-mode:multiply}
.tile .glow{position:absolute;inset:0;border-radius:inherit;background:radial-gradient(closest-side,rgba(255,255,255,.95),rgba(255,255,255,.25));opacity:0;pointer-events:none}
.tile.wrongt{box-shadow:inset 0 0 0 3px rgba(255,40,70,.85),inset 0 0 14px rgba(255,40,70,.65)}
.tile.hov{filter:brightness(1.1) saturate(1.1)}
.tile.cur{outline:3px solid #fff;outline-offset:-3px;box-shadow:0 0 0 3px var(--ink),inset 0 0 12px #fff}
.tile.hintu .glow{opacity:.55;animation:hintglow .8s ease-in-out infinite alternate}
@keyframes hintglow{from{opacity:.15}to{opacity:.6}}
.mk{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none}
.mk svg{width:86%;height:86%;overflow:visible}
.mk.auto svg{width:70%;height:70%;opacity:.9}
.mk.tok svg{width:124%;height:124%;margin-top:-16%;flex:0 0 auto}
.mk.tok{z-index:3}
.mk.x,.mk.auto{z-index:2}
#fingerEl{position:absolute;left:0;top:0;width:64px;height:64px;margin:-6px 0 0 -12px;pointer-events:none;z-index:20;opacity:0;transition:opacity .3s}
#fingerEl .hand{width:100%;height:100%;transform-origin:22% 12%;transition:transform .12s cubic-bezier(.3,1.6,.5,1)}
#fingerEl.down .hand{transform:scale(.82) rotate(-6deg)}
#fingerEl .ring{position:absolute;left:-14px;top:-8px;width:44px;height:44px;border-radius:50%;border:4px solid #fff;opacity:0;transform:scale(.3)}
#fingerEl.down .ring{animation:fring .45s ease-out}
@keyframes fring{0%{opacity:.95;transform:scale(.3)}100%{opacity:0;transform:scale(1.4)}}
.say{position:absolute;left:50%;top:auto;bottom:var(--sayb,calc(100% - 20px));transform:translateX(-50%);z-index:30;max-width:86%;pointer-events:none}
.say .sb{position:relative;padding:9px 16px 10px;border-radius:20px;background:linear-gradient(#fff,#ffe6f2);color:var(--ink);font-family:var(--fh);font-size:18px;line-height:1.1;text-align:center;box-shadow:0 0 0 3px var(--ink),0 6px 0 var(--ink),0 10px 18px rgba(20,0,40,.4)}
.say .sb::after{content:'';position:absolute;left:50%;bottom:-12px;width:20px;height:16px;margin-left:-10px;background:#ffe6f2;clip-path:polygon(0 0,100% 0,50% 100%);filter:drop-shadow(0 3px 0 var(--ink))}
.say.pop{animation:sayp .42s cubic-bezier(.3,1.7,.5,1)}
@keyframes sayp{0%{transform:translateX(-50%) scale(.3)}60%{transform:translateX(-50%) scale(1.1,.92)}100%{transform:translateX(-50%) scale(1)}}
.btnrow{flex:0 0 auto;display:flex;gap:8px;justify-content:space-between;align-items:flex-end;padding:4px 2px 4px}
.btnrow .btn{flex-direction:column;gap:0;min-height:62px;padding:4px 6px 6px;font-size:13px;border-radius:18px;flex:1 1 0}

      <div class="wduo"><div class="tduo" style="position:absolute;inset:0;min-height:0"><div class="disc" style="bottom:2%;height:86%"></div></div><div class="tf r" style="position:relative;z-index:2;margin-right:-22px" id="wR"></div><div class="tf j" style="position:relative;z-index:2;margin-left:-22px" id="wJ"></div></div>
      <div class="wbtns"><button class="btn grape" id="wTour">${icon('map')}<span>World Tour</span></button><button class="btn big" id="wNext"><span class="nl">Next gig ▶</span><span class="badge" id="wOne">One more!</span></button></div>`;
    $$('#scr-win .wbtns svg').forEach((s) => { s.style.width = '22px'; s.style.height = '22px'; });
    $('#wR').innerHTML = roxor({ mood: 'happy', arms: 'up' });
    $('#wJ').innerHTML = jasmin({ mood: 'happy', arms: 'up' });
    // support screen first (when due), then continue where the player wanted to go
    const leave = (go) => { au.ui(); const r = this.r; if (r && r.support) { this.r = Object.assign({}, r, { support: false }); LD.ui.support({ onClose: go }); } else go(); };
    $('#wTour').innerHTML = icon('map') + '<span>Tour</span>';
    $('#wTour').onclick = () => leave(() => { show('title'); openTour(); });
    $('#wNext').onclick = () => leave(() => { if (this.demo) startGig(LD.meta.currentId()); else startGig((this.r && this.r.nextId) || LD.meta.currentId()); });
  },
  enter(o) {
    const st = o.stars || 3, ms = o.ms || 0, p = o.p || (Game.g && Game.g.p) || {};
    this.r = o.r || null; this.demo = !!o.demo;
    $('#wTime').textContent = LD.meta.formatTime(ms);
    $('#wMis').textContent = String(o.mistakes || 0);
    $('#wGig').textContent = this.demo ? 'That is how you play!' : `${p.packName === 'Daily Jam' ? 'Daily Jam' : (p.packName || '') + ' ' + (p.num || '')} · ${p.city || ''}`;
    const r = this.r;
    $('#wPts').style.display = r ? '' : 'none';
    const next = $('#wNext');
    next.querySelector('.nl').textContent = this.demo ? 'Play now ▶' : 'Next gig ▶';
    $('#wOne').style.display = r && r.streak >= 2 ? '' : 'none';
    $('#wOne').textContent = r && r.streak >= 3 ? `🔥 ${r.streak} in a row!` : 'One more!';
    const wx = $('#wX'); wx.innerHTML = ''; if (r) wx.appendChild(LD.ui.winExtras(r));
    if (r && (r.streak >= 3 || r.packUnlocked || (r.goal && r.goal.hit))) {
      const txt = r.packUnlocked ? 'New pack!' : r.goal && r.goal.hit ? 'Daily set!' : `${r.streak} in a row!`;
      this.tm.push(setTimeout(() => {
        banner(txt, 'pink', innerHeight * .42);
        const sb = stageBox(), cx = sb.left + sb.width / 2;
        FX.fountain(cx, innerHeight, 40, 60);
        for (let k = 0; k < 3; k++) FX.ring(cx, innerHeight * .42, 20, 160 + k * 60, ['#ff8cc6', '#b8f25a', '#ffd84a'][k], 8, .7, k * .12);
        FX.burst(cx, innerHeight * .42, { n: 24, kind: 'star', colors: ['#ffd23a', '#ff8cc6', '#b8f25a', '#62cdfb'], v0: 200, v1: 420, g: 400, s0: 5, s1: 9, l0: .7, l1: 1.1 });
        au.sparkle(); au.clap(0.8);
      }, 2200));
    }
    this.tm.forEach(clearTimeout); this.tm = [];
    if (r) {
      const chips = [];
      chips.push(r.firstClear ? `First clear +${r.base}` : `Replay +${r.points}`);
      if (r.starBonus && r.firstClear) chips.push(`Star bonus +${r.starBonus}`);
      if (r.daily) chips.push('Daily Jam ×2');
      if (r.newBest && !r.firstClear) chips.push('New best time!');
      $('#wChips').innerHTML = chips.map((c, k) => `<span class="wchip c${k % 3}">${c}</span>`).join('');
      const gain = $('#wGain'), tot = $('#wTotal'), from = r.total - r.points;
      gain.textContent = '+0 pts'; gain.dataset.t = '+0 pts'; tot.textContent = from;
      const steps = 24;
      for (let k = 1; k <= steps; k++) this.tm.push(setTimeout(() => {
        const v = Math.round(r.points * LD.ease.outCubic(k / steps));
        gain.textContent = gain.dataset.t = `+${v} pts`; tot.textContent = from + v;
        if (k % 3 === 0) au.tick(k / 3);
        if (k === steps) {
          const b = gain.getBoundingClientRect();
          gain.animate([{ transform: 'scale(1.45,.75)' }, { transform: 'scale(.85,1.2)', offset: .4 }, { transform: 'none' }], { duration: 420, easing: 'ease-out' });
          FX.burst(b.left + b.width / 2, b.top + b.height / 2, { n: 16, kind: 'coin', v0: 140, v1: 300, g: 700, s0: 6, s1: 9, l0: .6, l1: 1 });
          au.sparkle();
        }
      }, 900 + k * 40));
      $$('#wChips .wchip').forEach((c, k) => c.animate([{ transform: 'scale(0)', opacity: 0 }, { transform: 'scale(1.2)', opacity: 1, offset: .6 }, { transform: 'none', opacity: 1 }], { duration: 380, delay: 700 + k * 200, fill: 'backwards', easing: 'ease-out' }));
    }
    const stars = $$('#scr-win .st');
    stars.forEach((e) => { e.classList.remove('slam', 'empty'); e.style.opacity = 0; });
    stars.forEach((e, k) => this.tm.push(setTimeout(() => {
      e.style.opacity = ''; if (k >= st) e.classList.add('empty'); e.classList.add('slam');
      this.tm.push(setTimeout(() => {
        const rr = e.getBoundingClientRect(), x = rr.left + rr.width / 2, y = rr.top + rr.height / 2;
        if (k < st) {
          FX.burst(x, y, { n: 14, kind: 'star', colors: ['#ffd23a', '#fff6a8', '#fff'], v0: 160, v1: 340, g: 500, s0: 4, s1: 8, l0: .5, l1: .9 });
          FX.ring(x, y, rr.width * .3, rr.width * 1.1, 'rgba(255,220,90,.95)', 8, .45);
          au.kick(0.9); au.rim(0.6); au.vox(LD.audio.pent(72, k * 2), .25, { vowel: 'ah', vol: .25 });
        } else au.thud();
      }, 240));
    }, 300 + k * 380)));
    const fountain = () => { const sb = stageBox(), cx = sb.left + sb.width / 2, h = innerHeight; FX.fountain(cx - sb.width * .32, h, 22, 20); FX.fountain(cx + sb.width * .32, h, 22, 20); };
    this.tm.push(setTimeout(fountain, 200)); this.tm.push(setTimeout(fountain, 2600));
  },
};

function bokeh() {
  const sky = $('#sky'); let s = '';
  const cols = ['#ff9fcb', '#b8f25a', '#ffe36a', '#9fd8ff', '#d4b0ff', '#ffffff'];
  for (let k = 0; k < 16; k++) {
    const sz = 30 + ((k * 53) % 130), small = k % 3 === 0;
    s += `<div class="bk${small ? ' s' : ''}" style="left:${(k * 37) % 100}%;top:${(k * 61) % 100}%;width:${small ? sz / 5 : sz}px;height:${small ? sz / 5 : sz}px;background:radial-gradient(circle at 35% 35%,${cols[k % 6]}cc,${cols[k % 6]}22 60%,transparent 70%);--dx:${(k % 2 ? 1 : -1) * (20 + k * 3)}px;--dy:${(k % 3 - 1) * 30}px;animation-duration:${12 + k % 7 * 3}s;animation-delay:${-k * 1.3}s"></div>`;
  }
  sky.insertAdjacentHTML('beforeend', s);
}

/* =====================================================================================================
   HOW TO PLAY (the demo: a fresh copy of the 7x7 showcase, never saved) + ROUTING + TEST HOOK + BOOT
   ===================================================================================================== */
function startDemo() {
  if (gestured) LD.audio.unlock();
  if (LD.ui.isOpen && LD.ui.isOpen()) LD.ui.close(true);
  Game.build(null, { demo: true });
  show('game', { keep: true });
  requestAnimationFrame(() => {
    Game.layout();
    const f = $('#fingerEl');
    const arrowXY = (kind, i) => { const el = Game.arrows[kind][i], z = Game.zone.getBoundingClientRect(), r = el.getBoundingClientRect(); return { x: r.left - z.left + r.width / 2, y: r.top - z.top + r.height / 2 }; };
    Game.demo = LD.demo(Game.g, {
      moveTo: (i, ms) => Game.fingerTo(i, ms),
      moveToLine: (kind, i, ms) => { const p = arrowXY(kind, i); f.style.opacity = 1; f.style.transition = `transform ${ms}ms cubic-bezier(.45,.05,.25,1), opacity .3s`; f.style.transform = `translate(${p.x}px,${p.y}px)`; },
      pressLine: (kind, i) => { f.classList.remove('down'); void f.offsetWidth; f.classList.add('down'); Game.pressArrow(kind, i, true); },
      releaseLine: (kind, i) => { f.classList.remove('down'); Game.pressArrow(kind, i, false); },
      press: () => { f.classList.remove('down'); void f.offsetWidth; f.classList.add('down'); },
      release: () => f.classList.remove('down'),
      say: (s) => Game.say(s, 0),
      hint: () => {},
      done: () => { setTimeout(() => Game.hideFinger(), 500); },
    });
  });
}
function routeHash() {
  const h = location.hash.replace('#', '');
  if (h === 'demo') startDemo();
  else if (h === 'game') startGig(LD.meta.currentId());
  else if (h === 'outfits') show('outfits');
  else show('title');
}
window.LDSKIN = {
  game: () => Game.g,
  start: (id) => startGig(id),
  screen: () => curScreen,
  arrowRect: (kind, i) => { const a = Game.arrows && Game.arrows[kind] && Game.arrows[kind][i]; return a ? a.getBoundingClientRect() : null; },
};
function boot() {
  buildDefs(); bokeh();
  buildTitle(); Game.mount(); Win.build(); Lose.build(); buildOutfits();
  $('#sideRox').innerHTML = roxor({ arms: '' }); $('#sideJas').innerHTML = jasmin({});
  wireButtons(document);
  document.addEventListener('click', (e) => { if (e.target.closest('[data-back]')) { au.uiBack(); show('title'); } });
  setMuteIcon();
  addEventListener('hashchange', routeHash);
  routeHash();
}
boot();
