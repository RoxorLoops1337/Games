<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2a1458">
<title>LoopDoku</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;800;900&family=Mochiy+Pop+One&display=swap" rel="stylesheet">
<style>
:root{--ld-font:'M PLUS Rounded 1c',system-ui,sans-serif;--ld-font-display:'Mochiy Pop One','M PLUS Rounded 1c',sans-serif;--ld-ink:#3b1d5e;--ld-muted:#7a5fa6;--ld-panel:#fff8fd;--ld-panel-2:#f1e8ff;--ld-backdrop:rgba(28,10,60,.68);--ld-accent:#ff6fae;--ld-accent-ink:#fff;--ld-accent-2:#ffd84d;--ld-accent-2-ink:#5a3a00;--ld-line:3px solid #3b1d5e;--ld-radius:26px;--ld-shadow:0 6px 0 #a283e8,0 22px 44px rgba(10,0,30,.55);--ld-lock:#a68ae6;
--ink:#3b1d5e;--ink2:#22103f;--g:#78bd35;--gd:#3f7f18;--gl:#a9f060;--p:#ff7fb2;--pd:#c93f78;--pl:#ffc9de;--gold:#ffd84d;--gold2:#f5a524;
--lav:#efe6ff;--lav2:#d8c8ff;--lav3:#a68ae6;--cyan:#7fe3ff;--red:#ff4d6d;--paper:#fff8fd;
--disp:'Mochiy Pop One','M PLUS Rounded 1c',system-ui,sans-serif;--ui:'M PLUS Rounded 1c',system-ui,sans-serif;
--sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);--spring:cubic-bezier(.34,1.7,.5,1)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden}
body{background:#1c0d3c;font-family:var(--ui);color:var(--ink);-webkit-font-smoothing:antialiased;user-select:none;-webkit-user-select:none}
body::before{content:'';position:fixed;inset:0;background:radial-gradient(140% 62% at 50% 112%,#ff9ad0 0%,#c25cb6 22%,#62289a 48%,#2c1460 72%,#1c0d3c 100%);z-index:0}
canvas{display:block}
#bg{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:1}
.side{position:fixed;top:0;height:100%;pointer-events:none;z-index:1;display:none}
#sideL{left:0}#sideR{right:0}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:60}
#vig{position:fixed;inset:0;pointer-events:none;z-index:59;opacity:0;background:radial-gradient(ellipse at center,rgba(255,40,90,0) 42%,rgba(255,40,90,.55) 100%)}
#app{position:relative;z-index:2;margin:0 auto;width:100%;max-width:440px;height:100vh;height:100dvh;display:flex;flex-direction:column;padding-top:var(--sat)}
@media (min-width:900px){.side{display:block}#app{height:calc(100dvh - 24px);margin-top:12px;border-radius:32px;background:linear-gradient(180deg,rgba(28,13,60,.55),rgba(60,24,110,.35));box-shadow:0 0 0 2px rgba(255,255,255,.16),0 0 0 7px rgba(255,127,178,.12),0 0 70px rgba(255,127,178,.28),0 0 140px rgba(169,240,96,.12);overflow:hidden}}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer;touch-action:manipulation}
svg.ic{width:22px;height:22px;flex:0 0 auto}
/* ---------- picker ---------- */
/* ---------- screens ---------- */
#screens{position:relative;flex:1 1 auto;min-height:0}
.screen{position:absolute;inset:0;display:none;flex-direction:column;align-items:center}
.screen.on{display:flex;animation:scrIn .38s cubic-bezier(.2,1.3,.4,1)}
@keyframes scrIn{from{transform:translateY(18px) scale(.97)}}
.scroll{overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.3) transparent}
/* ---------- gem buttons ---------- */
.gem{--c1:#ffc4de;--c2:#ff78b3;--c3:#e04f8c;--lip:#a8285f;position:relative;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:0 26px;border-radius:999px;border:3px solid #fff;background:linear-gradient(180deg,var(--c1) 0%,var(--c2) 54%,var(--c3) 100%);color:#fff;font:400 18px/1 var(--disp);letter-spacing:.02em;text-shadow:0 2px 0 var(--lip),0 0 2px var(--lip);box-shadow:0 0 0 2.5px var(--ink),0 5px 0 0 var(--lip),0 5px 0 2.5px var(--ink),0 11px 16px rgba(20,4,50,.42);transform:translateY(0) scale(1);transition:transform .34s var(--spring),box-shadow .16s,filter .16s;isolation:isolate;white-space:nowrap;overflow:hidden}
.gem::before{content:'';position:absolute;left:14px;right:14px;top:3px;height:42%;border-radius:999px;background:linear-gradient(180deg,rgba(255,255,255,.92),rgba(255,255,255,.2));z-index:-1;pointer-events:none}
.gem::after{content:'';position:absolute;top:6px;left:16px;width:11px;height:11px;background:#fff;clip-path:polygon(50% 0,61% 39%,100% 50%,61% 61%,50% 100%,39% 61%,0 50%,39% 39%);pointer-events:none}
.gem svg.ic{filter:drop-shadow(0 2px 0 var(--lip))}
.gem:hover,.gem.is-hover{filter:brightness(1.07) saturate(1.1);transform:translateY(-2px) scale(1.025)}
.gem:active,.gem.is-pressed{transform:translateY(4px) scale(1.045,.9);box-shadow:0 0 0 2.5px var(--ink),0 1px 0 0 var(--lip),0 1px 0 2.5px var(--ink),0 3px 6px rgba(20,4,50,.35);transition-duration:.05s}
.gem:disabled,.gem.is-disabled{--c1:#f3eff7;--c2:#dcd5e6;--c3:#c4bad3;--lip:#9d92b1;color:#fbf9fd;text-shadow:0 1px 0 #9d92b1;filter:none;transform:none;cursor:not-allowed}
.gem.green{--c1:#dcfaab;--c2:#93d34a;--c3:#64aa2a;--lip:#3f7f18}
.gem.gold{--c1:#fff5b8;--c2:#ffd84d;--c3:#f7ab2a;--lip:#b26a00}
.gem.lav{--c1:#ffffff;--c2:#f3ecff;--c3:#dfd1ff;--lip:#a283e8;color:var(--ink);text-shadow:none}
.gem.lav::after{background:var(--p)}
.gem.lav svg.ic{filter:none}
.gem.big{min-height:62px;font-size:23px;padding:0 32px}
.gem.sm{min-height:40px;font-size:14px;padding:0 13px}
.bst .gbtn{flex:none;width:74px;height:58px}
.hudk .rib.gig{flex:0 0 260px;width:260px}
.gem.sm::after{width:8px;height:8px;top:5px;left:11px}
.gem.wide{width:100%}
.gem .shine{position:absolute;inset:0;pointer-events:none;z-index:-1;overflow:hidden;border-radius:inherit}
.gem .shine::before{content:'';position:absolute;top:-10%;bottom:-10%;width:34%;left:0;background:linear-gradient(100deg,transparent,rgba(255,255,255,.75),transparent);transform:translateX(-160%) skewX(-18deg);animation:shine 3.2s ease-in-out infinite}
@keyframes shine{0%,55%{transform:translateX(-160%) skewX(-18deg)}85%,100%{transform:translateX(420%) skewX(-18deg)}}
/* icon buttons */
.ibtn{--c1:#fff;--c2:#f4eeff;--c3:#ddd0ff;--lip:#9b80e0;position:relative;width:44px;height:44px;flex:0 0 44px;border-radius:50%;border:2.5px solid #fff;display:grid;place-items:center;background:radial-gradient(circle at 32% 26%,#fff 0 16%,transparent 17%),linear-gradient(180deg,var(--c1),var(--c2) 55%,var(--c3));color:var(--ink);box-shadow:0 0 0 2.5px var(--ink),0 4px 0 0 var(--lip),0 4px 0 2.5px var(--ink),0 8px 12px rgba(20,4,50,.35);transition:transform .34s var(--spring),box-shadow .15s,filter .15s}
.ibtn svg.ic{width:21px;height:21px}
.ibtn:hover,.ibtn.is-hover{filter:brightness(1.05);transform:translateY(-2px) rotate(-5deg)}
.ibtn:active,.ibtn.is-pressed{transform:translateY(3px) scale(1.07,.86);box-shadow:0 0 0 2.5px var(--ink),0 1px 0 0 var(--lip),0 1px 0 2.5px var(--ink);transition-duration:.05s}
.ibtn:disabled,.ibtn.is-disabled{--c1:#efebf4;--c2:#ded7e8;--c3:#ccc3d8;--lip:#a59bb4;color:#a59bb4;transform:none;filter:none;cursor:not-allowed}
.ibtn.pink{--c1:#ffd6e8;--c2:#ff9cc9;--c3:#ff6fae;--lip:#c93f78;color:#fff}
.ibtn.off{color:#c93f78}
/* game tile buttons */
.gbtn{--c1:#fff;--c2:#f4eeff;--c3:#ddcfff;--lip:#9b80e0;position:relative;flex:1 1 0;max-width:96px;height:62px;border-radius:20px;border:2.5px solid #fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;background:linear-gradient(180deg,var(--c1),var(--c2) 55%,var(--c3));color:var(--ink);font:900 11.5px/1 var(--ui);letter-spacing:.01em;box-shadow:0 0 0 2.5px var(--ink),0 5px 0 0 var(--lip),0 5px 0 2.5px var(--ink),0 9px 14px rgba(20,4,50,.4);transition:transform .34s var(--spring),box-shadow .15s,filter .15s;isolation:isolate;white-space:nowrap}
.gbtn::before{content:'';position:absolute;left:8px;right:8px;top:3px;height:36%;border-radius:12px;background:linear-gradient(rgba(255,255,255,.95),rgba(255,255,255,.1));z-index:-1}
.gbtn svg.ic{width:25px;height:25px}
.gbtn:hover,.gbtn.is-hover{filter:brightness(1.05);transform:translateY(-2px)}
.gbtn:active,.gbtn.is-pressed{transform:translateY(4px) scale(1.05,.88);box-shadow:0 0 0 2.5px var(--ink),0 1px 0 0 var(--lip),0 1px 0 2.5px var(--ink);transition-duration:.05s}
.gbtn:disabled,.gbtn.is-disabled{--c1:#efebf4;--c2:#ded7e8;--c3:#ccc3d8;--lip:#a59bb4;color:#a59bb4;transform:none;filter:none;cursor:not-allowed}
.gbtn.pink{--c1:#ffd8e9;--c2:#ff97c6;--c3:#ff68a8;--lip:#c93f78;color:#fff;text-shadow:0 1px 0 var(--lip);max-width:110px;flex-grow:1.3}
.gbtn .mini{width:30px;height:30px;margin-top:-6px}
.nudge{animation:nudge .4s}
@keyframes nudge{20%{transform:translateX(-5px) rotate(-3deg)}45%{transform:translateX(5px) rotate(3deg)}70%{transform:translateX(-3px)}}
/* ribbon */
.rib{position:relative;display:inline-flex}
.rib>svg{position:absolute;top:11px;width:24px;height:30px;fill:#d43f80;stroke:var(--ink);stroke-width:2.5;stroke-linejoin:round;z-index:0}
.rib>svg path.f{fill:#a8285f;stroke:none}
.rib>.tl{left:-15px}.rib>.tr{right:-15px}
.rib>.rb{position:relative;z-index:1;flex:1;min-width:0;border-radius:14px;border:2.5px solid #fff;background:linear-gradient(180deg,#ffbcdb,#ff7ab4 58%,#ee5c9d);box-shadow:0 0 0 2.5px var(--ink),0 4px 0 0 #b8336c,0 4px 0 2.5px var(--ink);color:#fff;text-align:center;overflow:hidden}
.rib>.rb::before{content:'';position:absolute;left:8px;right:8px;top:2px;height:38%;border-radius:10px;background:linear-gradient(rgba(255,255,255,.7),rgba(255,255,255,0))}
.rib.white>svg{fill:#e9defd}.rib.white>svg path.f{fill:#b7a0ef}
.rib.white>.rb{background:linear-gradient(180deg,#fff,#f6efff 60%,#e9ddff);color:var(--ink);box-shadow:0 0 0 2.5px var(--ink),0 4px 0 0 #a283e8,0 4px 0 2.5px var(--ink)}
.rib.green>svg{fill:#5ea428}.rib.green>svg path.f{fill:#3f7f18}
.rib.green>.rb{background:linear-gradient(180deg,#dcfaab,#8fd147 58%,#64aa2a);box-shadow:0 0 0 2.5px var(--ink),0 4px 0 0 #3f7f18,0 4px 0 2.5px var(--ink)}
.rtxt{position:relative;font:400 15px/1.05 var(--disp);text-shadow:0 2px 0 rgba(168,40,95,.8);padding:6px 14px 7px}
.rib.white .rtxt{text-shadow:none}
.rib.green .rtxt{text-shadow:0 2px 0 rgba(63,127,24,.85)}
/* pills */
.pill{display:inline-flex;align-items:center;gap:5px;height:32px;padding:0 12px 0 8px;border-radius:99px;background:linear-gradient(#fff,#f3ecff);border:2px solid #fff;box-shadow:0 0 0 2.5px var(--ink),0 3px 0 0 #a283e8,0 3px 0 2.5px var(--ink);font:900 16px/1 var(--ui);color:var(--ink);font-variant-numeric:tabular-nums;white-space:nowrap}
.pill svg.ic{width:19px;height:19px;color:var(--p)}
.pill.g svg.ic{color:var(--gold2)}
/* ---------- game screen ---------- */
#scr-game{padding:0 0 calc(6px + var(--sab))}
.topbar{display:flex;align-items:center;gap:6px;width:100%;padding:6px 12px 0;flex:0 0 auto}
.gig{flex:1;margin:0 20px;min-width:0}
.gig .rb{height:52px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0 8px}
.gig-k{position:relative;font:900 9.5px/1 var(--ui);letter-spacing:.12em;opacity:.95;text-transform:uppercase;margin-bottom:3px}
.gig-c{position:relative;font:400 17px/1 var(--disp);text-shadow:0 2px 0 rgba(168,40,95,.85);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.gig-v{position:relative;font:800 10.5px/1 var(--ui);margin-top:3px;opacity:.95;white-space:nowrap}
.hudrow{display:flex;align-items:center;justify-content:space-between;width:100%;padding:12px 14px 0;gap:6px;flex:0 0 auto}
.lives{display:flex;gap:3px;align-items:flex-end;height:44px;padding:0 9px 1px;border-radius:99px;background:linear-gradient(rgba(255,255,255,.16),rgba(255,255,255,.06));box-shadow:inset 0 0 0 2px rgba(255,255,255,.2)}
.life{position:relative;width:30px;height:42px}
.life svg{width:100%;height:100%;overflow:visible;transform-origin:50% 55%;filter:drop-shadow(0 0 5px rgba(255,216,77,.55))}
.life::before{content:'';position:absolute;left:4px;right:4px;top:3px;height:22px;border-radius:50%;border:2px dashed rgba(255,255,255,.5);opacity:0;transition:opacity .3s .5s}
.life.lost::before{opacity:1}
.life.lost svg{filter:grayscale(1) brightness(1.1);opacity:.6;transform:translate(1px,7px) rotate(82deg) scale(.72)}
.life.breaking svg{animation:micdrop .95s cubic-bezier(.3,0,.4,1) forwards}
@keyframes micdrop{0%{transform:none;filter:none;opacity:1}12%{transform:translateY(-9px) scale(1.25) rotate(-14deg);filter:brightness(1.6)}24%{transform:translateY(-6px) scale(1.15) rotate(18deg);filter:none}36%{transform:translateY(-3px) rotate(-10deg)}100%{transform:translate(1px,7px) rotate(82deg) scale(.72);filter:grayscale(1) brightness(1.1);opacity:.6}}
.life .crack{position:absolute;inset:0;opacity:0;pointer-events:none}
.life.lost .crack{opacity:1;transition:opacity .2s .25s}
.stagehud{position:relative;flex:1 1 auto;min-height:96px;width:100%}
.stagehud canvas{position:absolute;inset:0;width:100%;height:100%}
.boardhost{position:relative;flex:0 0 auto;margin:4px auto 0;touch-action:none}
.shake{position:absolute;inset:0;will-change:transform}
.shake canvas{position:relative;width:100%;height:100%}
.shake::before{content:'';position:absolute;inset:2px;border-radius:24px;box-shadow:0 12px 22px rgba(20,4,50,.55),0 0 34px rgba(255,150,210,.35)}
.wand{position:absolute;left:0;top:0;width:58px;height:66px;pointer-events:none;opacity:0;transition:opacity .3s;z-index:3;filter:drop-shadow(0 0 8px rgba(255,216,77,.85)) drop-shadow(0 3px 2px rgba(20,4,50,.4))}
.wand.on{opacity:1}
.wand .wi{width:100%;height:100%;transform-origin:14px 14px;transition:transform .22s var(--spring)}
.wand.press .wi{transform:scale(.78) rotate(-12deg);transition-duration:.06s}
.crowdbox{position:relative;flex:0 0 auto;width:100%;height:50px;margin-top:2px}
.crowdbox>canvas{position:absolute;inset:0;width:100%;height:100%}
.say{position:absolute;left:50%;bottom:4px;transform:translate(-50%,8px) scale(.8);opacity:0;display:flex;align-items:center;gap:8px;max-width:94%;padding:5px 16px 5px 5px;border-radius:99px;background:linear-gradient(#fff,#fff3f9);border:2.5px solid #fff;box-shadow:0 0 0 2.5px var(--ink),0 4px 0 0 #ff9cc9,0 4px 0 2.5px var(--ink),0 10px 18px rgba(20,4,50,.4);font:900 14px/1.15 var(--ui);color:var(--ink);white-space:nowrap;transition:transform .3s var(--spring),opacity .2s;z-index:4;pointer-events:none}
.say.on{opacity:1;transform:translate(-50%,0) scale(1)}
.say canvas{width:34px;height:34px;flex:0 0 auto}
.say::after{content:'';position:absolute;left:24px;top:-9px;width:14px;height:10px;background:#fff;clip-path:polygon(0 100%,50% 0,100% 100%)}
.btnrow{display:flex;gap:9px;justify-content:center;align-items:center;width:100%;padding:8px 12px 6px;flex:0 0 auto}
/* overlays */
.over{position:absolute;inset:0;z-index:20;display:none;align-items:center;justify-content:center;background:rgba(22,8,46,.62);padding:18px}
.over.on{display:flex}
@keyframes fadeIn{from{opacity:0}}
.card{position:relative;width:100%;max-width:360px;border-radius:28px;border:3px solid #fff;background:linear-gradient(180deg,#fff,#fbf4ff 60%,#f1e6ff);box-shadow:0 0 0 3px var(--ink),0 7px 0 0 #a283e8,0 7px 0 3px var(--ink),0 22px 40px rgba(10,0,30,.55);padding:26px 18px 18px;display:flex;flex-direction:column;align-items:center;gap:10px;animation:cardIn .45s cubic-bezier(.2,1.5,.4,1)}
@keyframes cardIn{from{transform:scale(.6) translateY(40px)}}
.card h2{margin:4px 0 0;font:400 26px/1.1 var(--disp);color:var(--pd);text-shadow:0 2px 0 #fff,0 3px 0 rgba(201,63,120,.25)}
.card p{margin:0;font:800 14px/1.35 var(--ui);color:#6b4f8f;text-align:center}
.card>.rib{position:absolute;top:-22px;left:50%;transform:translateX(-50%)}
.row2{display:flex;gap:10px;width:100%;justify-content:center;flex-wrap:wrap}
.setrow{display:flex;align-items:center;justify-content:space-between;width:100%;font:900 15px/1 var(--ui);padding:2px 4px}
.tog{position:relative;width:58px;height:32px;border-radius:99px;border:2.5px solid #fff;background:linear-gradient(#dcfaab,#7fc63c);box-shadow:0 0 0 2.5px var(--ink);transition:background .2s}
.tog::after{content:'';position:absolute;top:2px;left:28px;width:23px;height:23px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,#efe6ff);box-shadow:0 0 0 2px var(--ink);transition:left .3s var(--spring)}
.tog.off{background:linear-gradient(#efe9f5,#cfc5dd)}
.tog.off::after{left:2px}
.gigs{display:grid;grid-template-columns:repeat(2,1fr);gap:7px;width:100%;max-height:34vh;overflow-y:auto;padding:4px}
.gigs button{display:flex;align-items:center;gap:7px;padding:7px 9px;border-radius:14px;background:#fff;box-shadow:0 0 0 2px var(--lav2),0 3px 0 0 var(--lav2);font:800 12px/1.1 var(--ui);text-align:left;transition:transform .25s var(--spring)}
.gigs button:active{transform:scale(.94)}
.gigs button b{flex:0 0 auto;display:grid;place-items:center;width:30px;height:24px;border-radius:9px;background:linear-gradient(#ffb8d8,#ff73b0);color:#fff;font:900 11px/1 var(--ui)}
.gigs button.cur{box-shadow:0 0 0 2.5px var(--p),0 3px 0 0 var(--pd)}
#loseCv{width:220px;height:150px}
/* ---------- line arrows ---------- */
.bwrap{position:relative;flex:0 0 auto;margin:4px auto 0}
.bwrap .boardhost{position:absolute;margin:0}
.arws{position:absolute;inset:0}
.arw{position:absolute;display:grid;place-items:center;padding:0;border:0;background:none;cursor:pointer;touch-action:manipulation;transition:transform .34s var(--spring),opacity .25s,filter .25s;z-index:2}
.arw svg{width:var(--aw,24px);height:var(--aw,24px);max-width:92%;max-height:92%;overflow:visible;filter:drop-shadow(0 2px 0 rgba(20,4,50,.55))}
.arw.col svg{transform:rotate(90deg)}
.arw.r0{color:#8fd447}.arw.r1{color:#ff7fb2}.arw.col{color:#ffd84d}
.arw:hover{transform:scale(1.12)}
.arw.is-pressed{transform:scale(.62,.82);transition-duration:.05s}
.arw.col.is-pressed{transform:scale(.82,.62)}
.arw.dim{opacity:.4;filter:saturate(.35)}
.arw.pop{animation:arwPop .45s var(--spring)}
@keyframes arwPop{0%{transform:scale(.6)}45%{transform:scale(1.35)}100%{transform:scale(1)}}
/* ---------- title ---------- */
#scr-title{padding:0 14px calc(12px + var(--sab));gap:4px}
.logo-wrap{position:relative;width:100%;height:clamp(118px,19vh,180px);flex:0 0 auto;display:grid;place-items:center}
.burst{position:absolute;left:50%;top:50%;width:min(150%,560px);aspect-ratio:1;translate:-50% -50%;background:repeating-conic-gradient(from 0deg,rgba(255,236,170,.5) 0deg 7deg,rgba(255,255,255,0) 7deg 18deg);-webkit-mask:radial-gradient(circle,#000 6%,transparent 60%);mask:radial-gradient(circle,#000 6%,transparent 60%);animation:spin 50s linear infinite;pointer-events:none}
.burst2{position:absolute;left:50%;top:50%;width:70%;aspect-ratio:1.6;translate:-50% -50%;border-radius:50%;background:radial-gradient(closest-side,rgba(255,180,220,.55),rgba(255,180,220,0));pointer-events:none}
@keyframes spin{to{rotate:360deg}}
.logo-wrap canvas{position:relative;animation:bob .625s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0) scale(1)}14%{transform:translateY(-3px) scale(1.03,.975)}}
.subrib{margin-top:-6px;flex:0 0 auto}
.subrib .rtxt{font:900 13px/1 var(--ui);padding:7px 16px 8px;letter-spacing:.02em}
.subrib .rtxt i{font-style:normal}
.subrib .rtxt .gx{color:#5ea428}.subrib .rtxt .px{color:#e0498c}
.tstage{position:relative;flex:1 1 auto;min-height:120px;width:calc(100% + 28px);margin:0 -14px}

'use strict';
// =====================================================================================================================
// LOOPDOKU · IDOL STAGE  (artist #05 Kira Cel). Pastel concert UI around the owners' approved chibi kit (rj-cast.js).
// =====================================================================================================================
const TAU = Math.PI * 2;
const $ = (s, el) => (el || document).querySelector(s);
const $$ = (s, el) => Array.from((el || document).querySelectorAll(s));
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v), lerp = (a, b, k) => a + (b - a) * k;
const now = () => performance.now();
const EZ = LD.ease, AU = LD.audio;
// sounds only after the page has had a user gesture (no autoplay warnings when a link opens straight into the demo)
const canSnd = () => !navigator.userActivation || navigator.userActivation.hasBeenActive;
const S = {};
['tick', 'untick', 'pop', 'ripple', 'place', 'mistake', 'sparkle', 'kick', 'clap', 'ui', 'uiBack', 'blocked', 'thud', 'hint', 'win', 'lose', 'whoosh'].forEach((k) => { S[k] = (...a) => { if (canSnd()) AU[k](...a); }; });
const DPR = Math.min(2, window.devicePixelRatio || 1);
const RM = !!LD.reducedMotion;
const hexRgb = (h) => { const n = parseInt(h.slice(1), 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; };
const mix = (a, b, k) => { const A = hexRgb(a), B = hexRgb(b); return '#' + A.map((v, j) => Math.round(v + (B[j] - v) * k).toString(16).padStart(2, '0')).join(''); };

let seed = 20261007;
const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
const fmt = (ms) => { const s = Math.floor(ms / 1000); return String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0'); };

// ---------------------------------------------------------------------------------------------------------- palette
const C = { ink: '#3b1d5e', ink2: '#22103f', g: '#78bd35', gd: '#3f7f18', gl: '#a9f060', p: '#ff7fb2', pd: '#c93f78', pl: '#ffc9de', gold: '#ffd84d', gold2: '#f5a524', lav: '#efe6ff', cyan: '#7fe3ff', red: '#ff4d6d' };
const ACC = {
  roxor: { l2: '#d2f99c', m: '#7cc13a', d: '#3f7f18', lt: '#f1fde3', glow: '#a9f060', pen: '#b8f56c' },
  jasmin: { l2: '#ffd6e8', m: '#ff7fb2', d: '#c93f78', lt: '#fff1f7', glow: '#ffa6cc', pen: '#ff90c8' },
};
const accOf = (id) => (id.indexOf('roxor') === 0 ? ACC.roxor : ACC.jasmin);
// 9 stage zones: pastel hues ~40 degrees apart + a motif each (colour-blind helper)
const ZONES = [
  ['#ff9fcb', 'Sakura', 'heart'], ['#ffbd8a', 'Peach', 'star'], ['#ffe36b', 'Lemon', 'note'],
  ['#bce77a', 'Lime', 'clover'], ['#90e6b0', 'Mint', 'drop'], ['#84dfec', 'Aqua', 'diamond'],
  ['#97c3ff', 'Sky', 'ring'], ['#c3b4ff', 'Lilac', 'flower'], ['#df9ff6', 'Orchid', 'sparkle'], ['#f2dcc0', 'Cream', 'tri'],
].map(([c, name, motif]) => ({ c, name, motif, d: mix(c, '#4a1f7e', 0.42), hi: mix(c, '#ffffff', 0.5) }));
const PASTEL = ['#ffd84d', '#ff9fcb', '#a9f060', '#8ad9f0', '#cdb1fb', '#ffffff', '#ffbd8a'];
const pastel = () => PASTEL[(rnd() * PASTEL.length) | 0];

// ---------------------------------------------------------------------------------------------------------- shapes
const mkCanvas = (w, h) => { const c = document.createElement('canvas'); c.width = Math.max(1, Math.ceil(w)); c.height = Math.max(1, Math.ceil(h)); return c; };
function rrPath(g, x, y, w, h, r) { r = Math.max(0, Math.min(r, w / 2, h / 2)); g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r); g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath(); }
function rr(g, x, y, w, h, r) { g.beginPath(); rrPath(g, x, y, w, h, r); }
function pStar(g, x, y, R, r, n, rot) { g.beginPath(); n = n || 5; rot = rot == null ? -Math.PI / 2 : rot; for (let k = 0; k < n * 2; k++) { const a = rot + k * Math.PI / n, d = k % 2 ? r : R; g.lineTo(x + Math.cos(a) * d, y + Math.sin(a) * d); } g.closePath(); }

  g.fillStyle = col; g.strokeStyle = col;
  if (kind === 'heart') { pHeart(g, x, y, s * 0.85); g.fill(); }
  else if (kind === 'star') { pStar(g, x, y, s, s * 0.45); g.fill(); }
  else if (kind === 'note') { pNote(g, x, y, s); g.fill(); }
  else if (kind === 'clover') { for (let k = 0; k < 3; k++) { const a = -Math.PI / 2 + k * TAU / 3; g.beginPath(); g.arc(x + Math.cos(a) * s * 0.42, y + Math.sin(a) * s * 0.42, s * 0.42, 0, TAU); g.fill(); } }

  else if (kind === 'ring') { g.beginPath(); g.arc(x, y, s * 0.62, 0, TAU); g.lineWidth = s * 0.34; g.stroke(); }
  else if (kind === 'flower') { for (let k = 0; k < 5; k++) { const a = -Math.PI / 2 + k * TAU / 5; g.beginPath(); g.arc(x + Math.cos(a) * s * 0.5, y + Math.sin(a) * s * 0.5, s * 0.36, 0, TAU); g.fill(); } }

const BEAT = { pulse: 0, q: 0, step: 0, beatN: 0, last: 0, acc: 0, n: 0, hit: new Float32Array(9) };

  if (q === 4 || q === 12) H[2] = 1;
  if (q === 0 || q === 6 || q === 10) H[3] = 1;

      const b = $('#wPts'); if (b.animate) b.animate([{ transform: 'scale(1.6)' }, { transform: 'scale(1)' }], { duration: 380, easing: 'cubic-bezier(.2,1.6,.4,1)' });
      const rr2 = b.getBoundingClientRect(); burst(rr2.left + rr2.width / 2, rr2.top + rr2.height / 2, { n: 12, sp0: 120, sp1: 260, sz: 18, life: 0.6, add: 1, img: (j) => sparkSpr(j % 2 ? '#ffd84d' : '#ff9fcb') });
      S.sparkle(); updatePts();

  }, t0));

  drawLogoLabel();
  sizeCanvas(WIN.cv);
  const stars = $$('#wStars .wstar');

  [0, 1, 2].forEach((k) => WIN.timers.push(setTimeout(() => {
    const el = stars[k]; el.classList.add('in');
    if (k < st.stars) setTimeout(() => {
      const r3 = el.getBoundingClientRect(), x = r3.left + r3.width / 2, y = r3.top + r3.height / 2;
      burst(x, y, { n: 14, sp0: 160, sp1: 360, sz: 20, life: 0.7, add: 1, img: (j) => sparkSpr(j % 2 ? '#ffd84d' : '#ffffff') });
      addP({ type: 'ring', x, y, r0: 20, r1: 80, w: 6, col: '#ffd84d', life: 0.45 });
      const card = $('#wCard'); if (card.animate && !RM) card.animate([{ transform: 'translateY(0)' }, { transform: 'translateY(5px) scale(1.01,.98)' }, { transform: 'translateY(0)' }], { duration: 220 });
      S.kick(0.9); S.clap(0.5); if (k === 2) S.sparkle();
    }, 260);
  }, 650 + k * 430)));
  const rc = WIN.cv.getBoundingClientRect();
  setTimeout(() => { confetti(rc.left + 8, rc.bottom, 1, 50, 0); confetti(rc.right - 8, rc.bottom, -1, 50, 0); }, 120);
  setTimeout(() => { confetti(rc.left + 8, rc.bottom, 1, 34, 0); confetti(rc.right - 8, rc.bottom, -1, 34, 0); }, 1750);

// streak / new pack / daily set: an idol-show fanfare (gold stars rain, a big call, the duo cheer)
function flourish(r) {
  const txt = r.packUnlocked ? 'NEW STAGE OPEN!' : r.streak >= 3 ? r.streak + ' IN A ROW!' : 'DAILY SET!';

  const lb = labelSpr(txt, 30, '#fff6b0', '#ff5ea2');
  addP({ type: 'label', img: lb, x: cx, y: sc.top + sc.height * 0.38, life: 1.8, rise: 30, sc: Math.min(1, (sc.width - 20) / lb.w), fo: 0.75 });
  for (let k = 0; k < 26; k++) addP({ type: 'spr', img: k % 3 ? starSpr(k % 2 ? '#ffd84d' : '#ff9fcb') : sparkSpr('#ffffff'), x: sc.left + rnd() * sc.width, y: sc.top - 20, vx: (rnd() - 0.5) * 60, vy: 120 + rnd() * 160, g: 260, sz: 16 + rnd() * 14, life: 1.8, rot: rnd() * 6, vr: (rnd() - 0.5) * 6, delay: k * 40, fo: 0.7 });
  addP({ type: 'ring', x: cx, y: sc.top + sc.height * 0.38, r0: 30, r1: Math.min(W, sc.width) * 0.6, w: 8, col: '#ffd84d', life: 0.7 });

}
// leaving the win screen: the support screen first when it is due (never mid-puzzle)
function leaveWin(go) {
  if (WIN.r && WIN.r.support && !WIN.supDone) { WIN.supDone = true; LD.ui.support({ onClose: go }); }
  else go();
}
function drawLogoLabel() {
  const cv = $('#encoreCv'), W = Math.min($('#scr-win').clientWidth - 30, 380), H = 84;
  cv.width = W * DPR; cv.height = H * DPR; cv.style.width = W + 'px'; cv.style.height = H + 'px';
  const g = cv.getContext('2d'); g.setTransform(1, 0, 0, 1, 0, 0); g.clearRect(0, 0, cv.width, cv.height);
  SPR.delete('lbl' + 'ENCORE!' + 52 + '#ffe680' + '#ff4f9a');
  const L = labelSpr('ENCORE!', 52, '#ffe680', '#ff4f9a'), sc = Math.min(1, W / L.w);
  g.setTransform(DPR, 0, 0, DPR, 0, 0); g.drawImage(L.cv, W / 2 - L.w * sc / 2, H / 2 - L.h * sc / 2, L.w * sc, L.h * sc);
}

function starRow(n, of) { let s = ''; for (let k = 0; k < (of || 3); k++) s += '<svg viewBox="0 0 64 64"><use href="#i-bigstar' + (k < n ? '' : '-off') + '"/></svg>'; return s; }

// ---------------------------------------------------------------------------------------------------------- outfits
const OUTFITS = [
  { id: 'roxor', name: 'RoxorLoops', sub: 'Smiley Tee · beatbox', rar: 'R', stars: 3, eq: 1 },
  { id: 'jasmin', name: 'Jasmin', sub: 'Pink Pleats · vocals', rar: 'R', stars: 3, eq: 1 },
  { id: 'roxor_monster', name: 'Monster Roxor', sub: 'Monster Onesie', rar: 'SR', stars: 4 },
  { id: 'jasmin_unicorn', name: 'Unicorn Jasmin', sub: 'Unicorn Onesie', rar: 'SSR', stars: 5 },
  { id: 'jackets', name: 'Sparkle Jackets', sub: 'Unlock: Tour Finale', lock: 1 },
  { id: 'rawclaw', name: 'RawClaw', sub: 'Crew · unlock in Berlin', lock: 1 },
  { id: 'andy', name: 'Andy', sub: 'Crew · unlock in Paris', lock: 1 },
  { id: 'jordan', name: 'Jordan', sub: 'Crew · unlock in Athens', lock: 1 },
];
function silhouette(W, H, draws, fill, glitter) {
  const t = mkCanvas(W * DPR, H * DPR), g = t.getContext('2d'); g.scale(DPR, DPR); draws(g);
  g.setTransform(1, 0, 0, 1, 0, 0); g.globalCompositeOperation = 'source-in'; g.fillStyle = fill; g.fillRect(0, 0, t.width, t.height);
  if (glitter) { g.globalCompositeOperation = 'source-atop'; let r = 99; const R = () => (r = (r * 16807) % 2147483647) / 2147483647; for (let k = 0; k < 900; k++) { g.fillStyle = ['#ffffff', '#ff9fcb', '#a9f060', '#ffd84d', '#8f7fc0'][k % 5]; g.globalAlpha = 0.35 + R() * 0.65; const s = (0.6 + R() * 1.6) * DPR; g.fillRect(R() * t.width, R() * t.height, s, s); } g.globalAlpha = 1; }
  return t;
}
function buildOutfits() {
  const box = $('#oGrid'); if (box.dataset.built) return; box.dataset.built = 1;
  box.innerHTML = OUTFITS.map((o, k) => '<div class="ocard' + (o.lock ? ' lock' : '') + '"><canvas data-k="' + k + '"></canvas>'
    + (o.lock ? '<span class="rar lk">?</span>' : '<span class="rar ' + o.rar.toLowerCase() + '">' + o.rar + '</span>') + (o.eq ? '<span class="eq">ON STAGE</span>' : o.lock ? '' : '<span class="ostars">' + starRow(o.stars, o.stars) + '</span>')
    + '<div class="oname"><b>' + o.name + '</b><span>' + o.sub + '</span></div></div>').join('');
  requestAnimationFrame(() => $$('canvas', box).forEach((cv) => drawCard(cv, OUTFITS[+cv.dataset.k])));
}
function drawCard(cv, o) {
  sizeCanvas(cv); const W = cv._w, H = cv._h, g = cv.getContext('2d'); g.setTransform(DPR, 0, 0, DPR, 0, 0);
  const A = o.lock ? null : accOf(o.id);
  const bg = g.createLinearGradient(0, 0, 0, H);
  if (o.lock) { bg.addColorStop(0, '#4b3a78'); bg.addColorStop(1, '#22103f'); } else { bg.addColorStop(0, '#ffffff'); bg.addColorStop(0.55, A.lt); bg.addColorStop(1, A.l2); }
  g.fillStyle = bg; g.fillRect(0, 0, W, H);
  g.save(); g.translate(W / 2, H * 0.42); g.globalAlpha = o.lock ? 0.12 : 0.35; for (let k = 0; k < 16; k++) { g.rotate(TAU / 16); g.fillStyle = o.lock ? '#cdb1fb' : '#ffffff'; g.beginPath(); g.moveTo(0, 0); g.lineTo(W, -W * 0.12); g.lineTo(W, W * 0.12); g.fill(); } g.restore();
  for (let k = 0; k < 7; k++) { const s = 8 + (k * 7) % 12; g.globalAlpha = 0.8; g.drawImage(sparkSpr(o.lock ? '#8f7fc0' : ['#ffd84d', '#ffffff', A.glow][k % 3]), (k * 0.37 % 1) * W - s / 2, ((k * 0.61 + 0.1) % 0.7) * H - s / 2, s, s); }
  g.globalAlpha = 1;
  const s = Math.min((H * 0.86) / 345, W / 250), y = H * 0.83;
  halo(g, W / 2, y - 6, W * 0.42, o.lock ? '#000000' : A.d, 0.18);
  if (o.lock) {
    const draws = o.id === 'jackets'
      ? (gg) => { RJ.draw(gg, 'roxor', { x: W * 0.33, y, s: s * 0.92, pose: 'sing', t: 0.4 }); RJ.draw(gg, 'jasmin', { x: W * 0.68, y, s: s * 0.92, pose: 'sing', t: 0.9, flip: true }); }
      : (gg) => RJ.draw(gg, o.id, { x: W / 2, y, s: o.id === 'andy' ? s * 0.85 : s, pose: 'idle', t: 0.4 });
    const rim = silhouette(W, H, draws, '#a68ae6'), sil = silhouette(W, H, draws, o.id === 'jackets' ? '#120a22' : '#2a1850', o.id === 'jackets');
    g.drawImage(rim, -1.5, -1.5, W, H); g.drawImage(rim, 1.5, -1, W, H); g.drawImage(sil, 0, 0, W, H);
    g.font = '400 34px "Mochiy Pop One",sans-serif'; g.textAlign = 'center'; g.fillStyle = 'rgba(255,255,255,.85)'; g.strokeStyle = '#22103f'; g.lineWidth = 6; g.lineJoin = 'round';
    if (o.id !== 'jackets') { g.strokeText('?', W / 2, H * 0.44); g.fillText('?', W / 2, H * 0.44); }
  } else {
    RJ.draw(g, o.id, { x: W / 2, y, s, pose: o.id.indexOf('jasmin') === 0 ? 'cheer' : 'sing', t: 0.55, flip: o.id.indexOf('jasmin') === 0 });
  }
}

// ---------------------------------------------------------------------------------------------------------- caption bubble + demo wand
function say(text, ms) {
  const el = $('#say'); $('#sayT').textContent = text; el.classList.add('on');
  clearTimeout(sayTimer); sayTimer = setTimeout(() => el.classList.remove('on'), ms || 2600);
}
const WAND = $('#wand');
function wandTo(i, ms) {
  const n = game.n; wandXY(BD.ox + BD.m + (i % n + 0.5) * BD.c, BD.ox + BD.m + (((i / n) | 0) + 0.5) * BD.c, ms);
}
function wandXY(x, y, ms) {
  if (!WAND.classList.contains('on')) { WAND.style.transition = 'none'; WAND.style.transform = 'translate(' + (BD.S * 0.8) + 'px,' + (BD.S + BD.A + 30) + 'px)'; void WAND.offsetWidth; WAND.classList.add('on'); }
  WAND.style.transition = 'transform ' + ms + 'ms cubic-bezier(.45,.05,.25,1),opacity .3s';
  WAND.style.transform = 'translate(' + (x - 14) + 'px,' + (y - 14) + 'px)';
}
function wandOff() { WAND.classList.remove('on', 'press'); }
// How to play: a fresh copy of the 7x7 showcase puzzle that never touches the player's save
function startDemo() {
  if (canSnd()) AU.unlock();
  show('game');
  setupGame(new LD.Game(LD.PUZZLES[LD.DEFAULT_PUZZLE]), true);
  layoutGame(true);
  const arrowXY = (kind, i) => { const el = arrowEl(kind, i), w = $('#bwrap').getBoundingClientRect(); if (!el) return null; const r = el.getBoundingClientRect(); return [r.left - w.left + r.width / 2, r.top - w.top + r.height / 2]; };
  demo = LD.demo(game, {
    moveTo(i, ms) { wandTo(i, ms); },
    press(i) { WAND.classList.add('press'); const p = cellPt(i); addP({ type: 'ring', x: p.x, y: p.y, r0: BD.c * 0.15, r1: BD.c * 0.5, w: 3, col: '#ffd84d', life: 0.3 }); },
    release() { WAND.classList.remove('press'); },
    moveToLine(kind, i, ms) { const q = arrowXY(kind, i); if (q) wandXY(q[0], q[1], ms); },
    pressLine(kind, i) { WAND.classList.add('press'); const el = arrowEl(kind, i); if (el) el.classList.add('is-pressed'); },
    releaseLine(kind, i) { WAND.classList.remove('press'); const el = arrowEl(kind, i); if (el) el.classList.remove('is-pressed'); },
    say(s2) { say(s2, 3600); },
    hint() { const b = $('#hintBtn'); b.classList.add('is-pressed'); setTimeout(() => b.classList.remove('is-pressed'), 260); },
    done() { setTimeout(wandOff, 400); },
  });
}

// ---------------------------------------------------------------------------------------------------------- screens + routing
const SCREENS = ['title', 'game', 'win', 'outfits'];
function show(name, opt) {
  if (SCREENS.indexOf(name) < 0) name = 'title';
  if (scr === 'game' && name !== 'game' && demo) { demo.stop(); demo = null; wandOff(); }
  scr = name;
  SCREENS.forEach((s) => $('#scr-' + s).classList.toggle('on', s === name));
  $('#sheet').classList.remove('on');
  if (name === 'title') layoutTitle();
  if (name === 'game') { if (!game) setupGame(LD.meta.newGame(), false); layoutGame(true); }
  if (name === 'win') enterWin(opt && opt.stats);
  if (name === 'title') { updatePts(); const tx = $('#tX'); tx.innerHTML = ''; tx.appendChild(LD.ui.titleExtras()); const L = LD.meta.level(LD.meta.currentId()); $('#playSub').textContent = L ? ' · ' + (L.packName === 'Daily Jam' ? 'Daily Jam' : L.packName + ' ' + L.num) : ''; layoutTitle(); }
  if (name === 'outfits') buildOutfits();
}
function layoutTitle() {
  const w = $('#scr-title').clientWidth - 20, h = $('.logo-wrap').clientHeight;
  drawLogo($('#logoT'), Math.min(w, 420), h, true);
  sizeCanvas(TT.cv);
}
function route() {
  const h = (location.hash || '').replace('#', '').toLowerCase();
  if (h === 'demo') startDemo();
  else if (h === 'game') ACT.play();
  else show('title');
}
window.addEventListener('hashchange', () => route());

// ---------------------------------------------------------------------------------------------------------- actions + buttons
const openTour = () => LD.ui.levels({ onPlay: (id) => startGig(id) });
const ACT = {
  play() { if (game && !isDemo && !game.over && game.p.id === LD.meta.currentId()) show('game'); else startGig(); },
  demo() { startDemo(); },
  daily() { startGig(LD.meta.daily().id); say('Daily Jam! Double points today ♪', 2200); },
  tour() { $('#sheet').classList.remove('on'); openTour(); },
  looks() { $('#sheet').classList.remove('on'); LD.ui.skins(); },
  support() { LD.ui.support(); },
  outfits() { show('outfits'); }, title() { show('title'); },
  settings() { $('#sheet').classList.remove('on'); LD.ui.settings({ onChange(k, v) { if (k === 'sound') syncSound(); if (k === 'assist' && game && !isDemo) game.opts.autoCross = !!v; if (k === 'reset') updatePts(); } }); },
  pause() { $('#sheetT').textContent = 'MENU'; $('#sheet').classList.add('on'); },
  resume() { $('#sheet').classList.remove('on'); },
  sound() { LD.meta.set('sound', AU.muted); syncSound(); },
  undo() { if (demo) stopDemo(); game.undo(); },
  hint() { if (demo) stopDemo(); if (!game.hint()) nudge('#hintBtn'); },
  clear() { if (demo) stopDemo(); game.clearCrosses(); },
  restart() { $('#sheet').classList.remove('on'); if (isDemo) startDemo(); else startGig(game.p.id); },
  retry() { if (isDemo) startDemo(); else startGig(game.p.id); },
  encore() { const st = WIN.st; leaveWin(() => (st && st.demo ? startDemo() : startGig(st ? st.id : undefined))); },
  next() { const r = WIN.r, st = WIN.st; leaveWin(() => (r && r.nextId ? startGig(r.nextId) : st && st.demo ? startGig() : (show('title'), openTour()))); },
  wtour() { leaveWin(() => { show('title'); openTour(); }); },
};
function stopDemo() { if (demo) { demo.stop(); demo = null; wandOff(); } }
function syncSound() { $('#sndBtn use').setAttribute('href', AU.muted ? '#i-mute' : '#i-sound'); $('#sndBtn').classList.toggle('off', AU.muted); }
document.addEventListener('click', (e) => {
  const b = e.target.closest('[data-act]'); if (!b || b.disabled) return;
  const f = ACT[b.dataset.act]; if (f) f(b);
});
document.addEventListener('pointerdown', (e) => {
  const b = e.target.closest('.gem,.ibtn,.gbtn,.arw'); if (!b || b.disabled) return;
  if (canSnd()) AU.unlock();
  if (b.dataset.act !== 'undo' && !b.classList.contains('arw')) S.ui();
});
$('#sheet').addEventListener('click', (e) => { if (e.target.id === 'sheet') $('#sheet').classList.remove('on'); });
// keyboard only drives the board while the game screen is up
window.addEventListener('keydown', (e) => { if (scr !== 'game' || $('#sheet').classList.contains('on') || $('#lose').classList.contains('on') || LD.ui.isOpen()) e.stopImmediatePropagation(); else if (demo && /^(Arrow| |x|X|Enter|p|P|z|Z|h|H)/.test(e.key)) stopDemo(); }, true);

// input: hit-test against the non-shaking host
input = LD.bindInput(BD.host, () => game, {
  cellAt(x, y) { const r = BD.host.getBoundingClientRect(), n = BD.n || game.n; const cc = Math.floor((x - r.left - BD.m) / BD.c), rr2 = Math.floor((y - r.top - BD.m) / BD.c); return cc >= 0 && cc < n && rr2 >= 0 && rr2 < n ? rr2 * n + cc : -1; },
  onCursor(i) { if (V) V.cursor = i; },
  onHover(i) { if (V) V.hover = i; },
});
BD.host.addEventListener('pointerdown', () => { if (demo) stopDemo(); }, true);
BD.host.addEventListener('pointerleave', () => { if (V) V.hover = -1; });

// ---------------------------------------------------------------------------------------------------------- resize + main loop
function resize() {
  const W = innerWidth, H = innerHeight;
  FXC.width = Math.round(W * DPR); FXC.height = Math.round(H * DPR); fxDirty = true;
  BG.cv.width = W; BG.cv.height = H; BG.w = W; BG.h = H;
  SIDE.on = W >= 900;
  if (SIDE.on) { const sw = Math.max(0, (W - 440) / 2); for (const cv of [SIDE.L, SIDE.R]) { cv.style.width = sw + 'px'; } sizeCanvas(SIDE.L); sizeCanvas(SIDE.R); }
  if (scr === 'game') layoutGame(false);
  if (scr === 'title') layoutTitle();
  if (scr === 'win') { sizeCanvas(WIN.cv); drawLogoLabel(); }
}
window.addEventListener('resize', resize);
let lastT = now(), frameN = 0;
function frame() {
  const t = now(), dt = Math.min(0.5, (t - lastT) / 1000), T = t / 1000; lastT = t; frameN++;
  tickBeat(dt);
  drawBg(T);
  const odd = frameN % 2 === 0;
  if (SIDE.on && odd) { drawSide(SIDE.L, 'roxor', SIDE.crowdL, T); drawSide(SIDE.R, 'jasmin', SIDE.crowdR, T); }
  if (scr === 'game' && game) {
    BD.rect = BD.host.getBoundingClientRect();
    if (arrowsDirty) refreshArrows();
    drawBoard(t, T);
    if (odd) drawHud(T);
    drawCrowdCanvas(CRW.cv, CRW.list);
    const tx = fmt(game.elapsed()); if (tx !== frame.tx) { frame.tx = tx; $('#time').textContent = tx; }
    if ($('#lose').classList.contains('on') && odd) drawLose(T);
  } else if (scr === 'title' && odd) drawTitle(T);
  else if (scr === 'win' && odd) drawWinStage(T);
  drawFx();
  requestAnimationFrame(frame);
}

// ---------------------------------------------------------------------------------------------------------- boot
syncSound();
setupGame(LD.meta.newGame(), false);
resize();
route();
resize();
requestAnimationFrame(frame);
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => {
  for (const k of Array.from(SPR.keys())) if (k.indexOf('lbl') === 0) SPR.delete(k);
  if (scr === 'title') layoutTitle();
  if (scr === 'win') drawLogoLabel();
});
// test hook used by tools/skin_check.mjs
window.LDSKIN = {
  game: () => game,
  start: (id) => startGig(id),
  screen: () => (scr === 'game' && $('#lose').classList.contains('on') ? 'lose' : scr),
  arrowRect: (kind, i) => { const el = arrowEl(kind, i); return el ? el.getBoundingClientRect() : null; },
};
})();
