<html lang="zh-CN">

<title>LoopDoku 口技数独</title>
<meta name="description" content="LoopDoku 口技数独：RoxorLoops 与 Jasmin 的逻辑谜题。每行、每列、每个颜色区域各放一位表演者，而且互不相邻。没有广告。">

<style>
/* system fonts only: no web fonts, so nothing has to load from outside the page */
:root{--bg:#fff6e6;--ink:#2b1d16;--muted:#7a6656;--panel:#fff;--red:#d93a3a;--red2:#b72b2b;--gold:#ffc94a;--line:#2b1d16;--blue:#2f6fde;--pink:#e2468f;
  --font:-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC","Source Han Sans SC","WenQuanYi Micro Hei",sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:500 16px/1.45 var(--font);overflow:hidden}
body{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation;border:0;background:none}
.scr{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;padding:max(10px,env(safe-area-inset-top)) 12px max(10px,env(safe-area-inset-bottom));overflow-y:auto}
.scr.on{display:flex}
.btn{display:block;width:100%;max-width:320px;padding:13px 16px;margin:6px auto;border-radius:14px;background:var(--red);color:#fff;font-weight:800;font-size:18px;
  box-shadow:0 4px 0 var(--red2);transition:transform .08s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--red2)}
.btn.alt{background:#fff;color:var(--ink);box-shadow:0 4px 0 #d8c7b4;border:2px solid #ead9c4}
.btn.gold{background:var(--gold);color:var(--ink);box-shadow:0 4px 0 #d9a21f}
.small{font-size:13px;color:var(--muted)}
/* title */
#title{justify-content:center;text-align:center}
.logo{font-size:44px;font-weight:900;letter-spacing:1px;margin:0;color:var(--red);text-shadow:3px 3px 0 var(--gold)}
.logo small{display:block;font-size:22px;color:var(--ink);text-shadow:none;letter-spacing:6px;margin-top:2px}
.duo{margin:8px 0 14px;color:var(--muted);font-size:14px}
.pts{display:inline-block;background:#fff;border:2px solid #ead9c4;border-radius:99px;padding:4px 14px;font-weight:800;margin-bottom:10px}
.mini{display:flex;gap:6px;justify-content:center;margin:10px 0 18px}
.mini i{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;font-style:normal;font-weight:900;color:#fff}
/* levels */
.top{width:100%;max-width:520px;display:flex;align-items:center;gap:8px;margin-bottom:8px}
.top h2{flex:1;margin:0;font-size:22px;text-align:center}
.ib{width:44px;height:44px;border-radius:12px;background:#fff;border:2px solid #ead9c4;font-size:20px;font-weight:900;flex:none}
.tabs{display:flex;gap:6px;overflow-x:auto;width:100%;max-width:520px;padding-bottom:6px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;padding:8px 12px;border-radius:99px;background:#fff;border:2px solid #ead9c4;font-weight:700;font-size:15px;white-space:nowrap}
.tab[aria-selected=true]{background:var(--red);border-color:var(--red);color:#fff}
.tab span{font-size:12px;opacity:.75;margin-left:4px}
.note{width:100%;max-width:520px;margin:6px 0 10px;color:var(--muted);font-size:14px;text-align:center}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;width:100%;max-width:520px}
.lv{aspect-ratio:1;border-radius:12px;background:#fff;border:2px solid #ead9c4;font-weight:800;font-size:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.1}
.lv small{font-size:11px;color:#e0a100;letter-spacing:-1px;min-height:12px}
.lv.done{background:#fff3c9;border-color:var(--gold)}
.lv.cur{border-color:var(--red);box-shadow:0 0 0 2px var(--red) inset}
.lv[disabled]{opacity:.4}
/* game */
#game{padding-top:max(6px,env(safe-area-inset-top))}
.hud{width:100%;max-width:520px;display:flex;align-items:center;gap:8px}
.hud .t{flex:1;min-width:0;text-align:center}
.hud b{display:block;font-size:18px;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hud span{display:block;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat{width:100%;max-width:520px;display:flex;justify-content:space-between;align-items:center;margin:6px 0 4px;font-weight:700;font-size:15px}
.mics{letter-spacing:2px;font-size:18px}
.mics .gone{opacity:.2;filter:grayscale(1)}
.loopbar{display:flex;gap:3px}
.loopbar i{width:7px;height:14px;border-radius:2px;background:#e8d6c0}
.loopbar i.on{background:var(--red)}
.loopbar i.beat{transform:scaleY(1.35)}
.play{position:relative;display:grid;margin:4px auto 0}
.colarr,.rowarr{display:grid}
.arr{display:grid;place-items:center;padding:0;color:var(--red);transition:transform .1s,opacity .2s}
.arr svg{width:15px;height:15px;fill:currentColor}
.arr.dim{opacity:.3}
.arr:active,.arr.press{transform:scale(.78)}
.board{position:relative;display:grid;border:3px solid var(--line);border-radius:8px;overflow:hidden;background:var(--line);-webkit-touch-callout:none;touch-action:none}
.c{position:relative;display:grid;place-items:center;font-weight:900}
.c .x{color:rgba(43,29,22,.55);font-size:.55em;line-height:1;animation:pop .18s ease-out}
.c.w .x{color:#d11}
.c .pc{width:78%;height:78%;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:.5em;border:2px solid rgba(0,0,0,.25);animation:land .35s cubic-bezier(.3,1.6,.5,1)}
.pc.roxor{background:var(--blue)}
.pc.jasmin{background:var(--pink)}
.c.hl::after{content:"";position:absolute;inset:0;background:rgba(255,255,255,.55);animation:fade 1.6s forwards;pointer-events:none}
.c.cur{outline:3px solid var(--blue);outline-offset:-3px}
.glow{animation:glow 1s ease-in-out infinite;position:relative;z-index:2}
.c.glow::before{content:"";position:absolute;inset:2px;border:3px solid #fff;border-radius:6px;box-shadow:0 0 0 2px var(--red);pointer-events:none}
.shake{animation:shake .35s}
.wob{animation:wob .3s}
@keyframes pop{from{transform:scale(1.8);opacity:0}to{transform:none;opacity:1}}
@keyframes land{from{transform:scale(0) rotate(-40deg)}to{transform:none}}
@keyframes fade{from{opacity:1}to{opacity:0}}
@keyframes glow{50%{filter:brightness(1.18)}}
@keyframes shake{20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}
@keyframes wob{30%{transform:rotate(-8deg)}70%{transform:rotate(6deg)}}
.tools{width:100%;max-width:520px;display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:10px}
.tools button{padding:9px 2px;border-radius:12px;background:#fff;border:2px solid #ead9c4;font-weight:800;font-size:15px}
.tools button:active{transform:translateY(2px)}
.tools .hint{background:var(--gold);border-color:#e8b02c}
.tools button.glow{box-shadow:0 0 0 3px var(--red)}
.arr.glow{background:var(--gold);border-radius:8px;box-shadow:0 0 0 2px var(--red);opacity:1}
.coach{width:100%;max-width:520px;margin-top:10px;background:#fff;border:2px solid var(--red);border-radius:14px;padding:10px 12px;display:none;gap:8px;align-items:flex-start}
.coach.on{display:flex}
.coach .face{flex:none;width:36px;height:36px;border-radius:50%;background:var(--pink);color:#fff;display:grid;place-items:center;font-weight:900}
.coach p{margin:0;flex:1;font-size:15px}
.coach .st{display:block;font-size:12px;color:var(--muted)}
.coach button{flex:none;font-size:13px;color:var(--muted);text-decoration:underline;padding:4px}
/* modal */
.modal{position:fixed;inset:0;background:rgba(43,29,22,.55);display:none;align-items:center;justify-content:center;padding:16px;z-index:20}
.modal.on{display:flex}
.card{width:100%;max-width:380px;max-height:100%;overflow-y:auto;background:var(--panel);border-radius:20px;padding:20px 18px;text-align:center;box-shadow:0 10px 30px rgba(0,0,0,.25);animation:up .25s ease-out}
@keyframes up{from{transform:translateY(30px);opacity:0}}
.card h3{margin:0 0 6px;font-size:24px;color:var(--red)}
.card p{margin:6px 0}
.stars{font-size:40px;color:var(--gold);letter-spacing:4px;text-shadow:0 2px 0 #c98f00}
.stars .no{color:#e8d6c0;text-shadow:none}
.big{font-size:30px;font-weight:900;color:var(--red)}
.rules{text-align:left;margin:10px 0;padding:0;list-style:none}
.rules li{display:flex;gap:10px;align-items:center;margin:8px 0;font-size:16px}
.rules li i{flex:none;width:30px;height:30px;border-radius:9px;background:#fff3c9;display:grid;place-items:center;font-style:normal;font-weight:900;color:var(--red)}
.row2{display:flex;gap:8px}
.row2 .btn{margin:6px 0}
.toast{position:fixed;left:50%;bottom:max(18px,env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:#fff;padding:9px 16px;border-radius:12px;font-size:15px;max-width:92vw;text-align:center;z-index:30;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<section id="title" class="scr">

</section>

</section>

    <div class="colarr" id="colArr"></div>
    <div class="rowarr" id="rowArr"></div>
    <div class="board" id="board"></div>
  </div>

  <div class="tools">
    <button id="tUndo"></button><button id="tClear"></button><button class="hint" id="tHint"></button><button id="tRestart"></button>
  </div>
</section>

<div class="modal" id="modal"><div class="card" id="card"></div></div>
<div class="toast" id="toast"></div>

<script>
(function () {

  const GIGS = [
    { city: 'Copenhagen', venue: 'Harbour Stage', country: 'DK' },
    { city: 'Aarhus', venue: 'Confirmation Party', country: 'DK' },
    { city: 'Odense', venue: 'Wedding Reception', country: 'DK' },
    { city: 'Berlin', venue: 'Club Night', country: 'DE' },
    { city: 'Brussels', venue: 'Street Festival', country: 'BE' },
    { city: 'Amsterdam', venue: 'Canal Boat Gig', country: 'NL' },
    { city: 'Paris', venue: 'Rooftop Session', country: 'FR' },
    { city: 'Stockholm', venue: 'Corporate Gala', country: 'SE' },
    { city: 'Athens', venue: 'Open-Air Theatre', country: 'GR' },
    { city: 'Quito', venue: 'World Tour Finale', country: 'EC' },
  ];
  const DIFF = { 5: 'Easy', 6: 'Normal', 7: 'Normal', 8: 'Hard', 9: 'Extreme' };
  LD.makePuzzle = function (p, extra) {
    const region = [];
    for (const row of p.rows) for (const ch of row) region.push(ch.charCodeAt(0) - 65);

  };
  LD.GIGS = GIGS;
  LD.PUZZLES = RAW.map((p, k) => LD.makePuzzle(p, Object.assign({ id: 'gig' + (k + 1), index: k }, GIGS[k] || { city: 'Encore', venue: 'Bonus', country: '' })));
  LD.DEFAULT_PUZZLE = Math.max(0, LD.PUZZLES.findIndex((p) => p.n === 7));
  const CELL = (LD.CELL = { EMPTY: 0, CROSS: 1, AUTO: 2, PIECE: 3 });
  const now = () => (typeof performance !== 'undefined' ? performance.now() : Date.now());
  function Game(p, opts) {
    if (typeof p === 'number') p = LD.PUZZLES[p];
    else if (typeof p === 'string') p = LD.PUZZLES.find((q) => q.id === p);
    if (!p) p = LD.PUZZLES[LD.DEFAULT_PUZZLE];
    if (!p.region) p = LD.makePuzzle(p, p);
    this.p = p; this.n = p.n; this.N = p.n * p.n; this.region = p.region;
    this.opts = Object.assign({ autoCross: false, lives: 3, doubleTapMs: 320, longPressMs: 430 }, opts || {});
    this.solSet = new Set(p.sol.map((c, r) => r * p.n + c));
    this.handlers = {};
    this.reset();
  }
  const G = Game.prototype;
  G.on = function (type, fn) { (this.handlers[type] = this.handlers[type] || []).push(fn); return this; };
  G.off = function (type, fn) { const h = this.handlers[type]; if (h) this.handlers[type] = h.filter((f) => f !== fn); return this; };
  G.emit = function (type, data) {
    const d = data || {};
    for (const f of this.handlers[type] || []) { try { f(d); } catch (e) { console.error('LD handler', type, e); } }
    for (const f of this.handlers['*'] || []) { try { f(type, d); } catch (e) { console.error('LD handler *', e); } }
  };
  G.reset = function () {
    this.cells = new Uint8Array(this.N); this.wrong = new Uint8Array(this.N);
    this.lives = this.opts.lives; this.mistakes = 0; this.hints = 0; this.placed = 0;
    this.over = false; this.won = false; this.t0 = null; this.tEnd = null;
    this.undoStack = []; this.stroke = null; this.lastTap = null;
    this.emit('reset', {});
  };
  G.rc = function (i) { return { r: (i / this.n) | 0, c: i % this.n }; };
  G.idx = function (r, c) { return r * this.n + c; };
  G.who = function (i) { return ((i / this.n) | 0) % 2 === 0 ? 'roxor' : 'jasmin'; };
  G.isSolution = function (i) { return this.solSet.has(i); };
  G.rowCells = function (r) { const a = []; for (let c = 0; c < this.n; c++) a.push(r * this.n + c); return a; };
  G.colCells = function (c) { const a = []; for (let r = 0; r < this.n; r++) a.push(r * this.n + c); return a; };
  G.regionCells = function (k) { const a = []; for (let i = 0; i < this.N; i++) if (this.region[i] === k) a.push(i); return a; };
  G.units = function () {
    if (this._units) return this._units;
    const u = [];
    for (let r = 0; r < this.n; r++) u.push({ kind: 'row', index: r, cells: this.rowCells(r) });
    for (let c = 0; c < this.n; c++) u.push({ kind: 'col', index: c, cells: this.colCells(c) });
    for (let k = 0; k < this.n; k++) u.push({ kind: 'region', index: k, cells: this.regionCells(k) });
    return (this._units = u);
  };
  G.attacks = function (i, j) {
    if (i === j) return false;
    const n = this.n, ri = (i / n) | 0, ci = i % n, rj = (j / n) | 0, cj = j % n;
    return ri === rj || ci === cj || this.region[i] === this.region[j] || (Math.abs(ri - rj) <= 1 && Math.abs(ci - cj) <= 1);
  };
  G.dist = function (i, j) { const a = this.rc(i), b = this.rc(j); return Math.max(Math.abs(a.r - b.r), Math.abs(a.c - b.c)); };
  G.peers = function (i) {
    const out = [];
    for (let j = 0; j < this.N; j++) if (this.attacks(i, j)) out.push(j);
    out.sort((a, b) => this.dist(i, a) - this.dist(i, b) || a - b);
    return out;
  };
  G.pieceAttacking = function (i) {
    for (let j = 0; j < this.N; j++) if (this.cells[j] === CELL.PIECE && this.attacks(j, i)) return j;
    return -1;
  };
  G.elapsed = function () { if (this.t0 === null) return 0; return (this.tEnd !== null ? this.tEnd : now()) - this.t0; };
  G._start = function () { if (this.t0 === null) { this.t0 = now(); this.emit('start', {}); } };
  G._mark = function (i, value, extra) {
    this.cells[i] = value;
    const rc = this.rc(i);
    this.emit('mark', Object.assign({ i, r: rc.r, c: rc.c, value, on: value === CELL.CROSS || value === CELL.AUTO, source: 'tap', k: 0, delay: 0, dist: 0, from: -1 }, extra || {}));
  };

    if (this.over || i < 0 || i >= this.N) return false;

    if (this.over || i < 0 || i >= this.N || this.cells[i] === CELL.PIECE) return false;

    tutT: '怎么玩',                                              // How to play
    rules: [                                                     // the rules
      ['行', '每一行放一位表演者'],                                // one performer in every row
      ['列', '每一列放一位表演者'],                                // one performer in every column
      ['色', '每个颜色区域放一位表演者'],                          // one performer in every colour zone
      ['邻', '表演者互不相邻，斜角也不行'],                        // performers never touch, not even at a corner
    ],
    rulesP: '每一关只有一个答案，只靠逻辑就能解开，不用猜。',          // Every board has one answer, solvable by logic alone.
    tutGo: '开始教学', tutSkip: '跳过',                           // Start tutorial, Skip
    tutStep: (a, b) => '第 ' + a + ' 步 / 共 ' + b + ' 步',         // Step a of b
    tut1: '点一下高亮的格子，打一个叉 ✕。叉的意思是：这里不会有表演者。',  // Tap the lit square to put an X: no performer here.
    tut2: '按住并在高亮的这一行上滑动，可以一口气打好几个叉。',        // Hold and slide along the lit row to paint several X's.
    tut3: '黄色区域只有一个格子，表演者一定在这里！快速点两下放置表演者。', // The yellow zone has one square, so the performer must be here. Double-tap to place.
    tut3bad: '放错了！正式演出里，放错会失去一个麦克风 🎤，一共只有 3 个。再找找黄色格子。', // Wrong! In a real gig that costs a mic (you have 3). Find the yellow square.
    tut4: '表演者会排除同一行、同一列、同一颜色区域和周围八格。点一下这一行前面的箭头 ▶，把整行剩下的格子都打叉。', // A performer rules out its row, column, zone and the 8 squares around it. Tap the arrow to cross the whole row.
    tut5: '不知道下一步？点「提示」，Jasmin 会帮你。',                 // Stuck? Tap Hint and Jasmin helps.
    tut6: '现在靠自己完成这一关吧！小技巧：也可以按住格子不放来放置表演者。', // Now finish the board yourself! Tip: press and hold also places a performer.
    tutDoneT: '教学完成！',                                      // Tutorial done!
    tutDoneP: '你已经会玩了。每放一位表演者，背景音乐就会多一层口技节奏。', // You know how to play. Each performer adds a beatbox layer to the music.
    tutDoneB: '开始第一场演出',                                   // Start the first gig
    tutName: '教学',                                             // Tutorial
    tutGig: '排练室',                                            // Rehearsal room
  };
  const PACK_ZH = { easy: '简单', normal: '普通', chill: '休闲大盘', hard: '困难', expert: '专家', terror: '恐怖', extreme: '极限', melt: '崩溃', nightmare: '噩梦' };
  // the duo's tour cities and gig types (same order and formula as the English game, so gig N is the same gig)
  const CITIES = ['哥本哈根', '奥胡斯', '欧登塞', '奥尔堡', '埃斯比约', '罗斯基勒', '瓦埃勒', '柏林', '汉堡', '科隆', '布鲁塞尔', '安特卫普', '根特', '巴黎',
    '里昂', '斯德哥尔摩', '马尔默', '哥德堡', '阿姆斯特丹', '鹿特丹', '乌得勒支', '雅典', '塞萨洛尼基', '基多', '瓜亚基尔'];
  const VENUES = ['港口舞台', '坚信礼派对', '婚礼', '俱乐部之夜', '街头音乐节', '运河游船', '屋顶专场', '公司年会', '露天剧场', '校园工作坊', '城市广场',
    '海滩派对', '夏日音乐节', '圣诞派对', '生日派对', '爵士咖啡馆', '图书馆夜场', '花园派对', '口技对战', '剧院午场'];

  // ===================================================================================================================
  // LEVELS AND SAVE  (own key, so it never touches the English game's save on the same site)
  // ===================================================================================================================
  const RAW = window.LD_LEVELS;
  const POINTS = { easy: 15, normal: 30, chill: 40, hard: 60, expert: 100, terror: 150, extreme: 200, melt: 300, nightmare: 350 };
  const NEEDS = { normal: ['easy', 3], chill: ['normal', 3], hard: ['normal', 5], expert: ['hard', 5], terror: ['hard', 8], extreme: ['expert', 5], melt: ['terror', 5], nightmare: ['extreme', 5] };
  const AHEAD = 3;
  const PACKS = RAW.plan.map((p, pk) => ({ id: p.id, name: PACK_ZH[p.id] || p.name, levels: (RAW.packs[p.id] || []).map((q, k) => ({ q, id: p.id + '-' + (k + 1), num: k + 1, pk })) }));
  const BY = new Map();
  let gn = 0;
  for (const pack of PACKS) for (const L of pack.levels) {
    L.city = CITIES[(gn * 7) % CITIES.length]; L.venue = VENUES[(gn * 3 + L.pk) % VENUES.length]; gn++;
    L.pack = pack.id; L.packName = pack.name; BY.set(L.id, L);
  }
  const KEY = 'loopdoku_cn_v1';
  let S = { points: 0, solved: {}, current: null, tut: false, sound: true, music: true };
  try { Object.assign(S, JSON.parse(localStorage.getItem(KEY) || '{}')); } catch (e) { /* private mode */ }
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { /* ignore */ } };
  const solvedIn = (pack) => pack.levels.filter((L) => S.solved[L.id]).length;
  function packInfo(pack) {
    const need = NEEDS[pack.id];
    const unlocked = !need || solvedIn(PACKS.find((p) => p.id === need[0])) >= need[1];
    let left = AHEAD;
    const levels = pack.levels.map((L) => {
      const s = S.solved[L.id];
      const open = unlocked && (!!s || left > 0);
      if (unlocked && !s && left > 0) left--;
      return { L, open, s };
    });
    return { pack, unlocked, need, levels, solved: solvedIn(pack) };
  }
  function currentId() {
    if (S.current && BY.has(S.current) && !S.solved[S.current]) return S.current;
    for (const p of PACKS) { const pi = packInfo(p); for (const x of pi.levels) if (x.open && !x.s) return x.L.id; }
    return PACKS[0].levels[0].id;
  }
  function nextId(id) {
    const L = BY.get(id), pack = PACKS[L.pk];
    const pi = packInfo(pack);
    const nx = pi.levels.find((x) => x.open && !x.s && x.L.id !== id);
    if (nx) return nx.L.id;
    for (const p of PACKS) { const q = packInfo(p); for (const x of q.levels) if (x.open && !x.s && x.L.id !== id) return x.L.id; }
    return null;
  }
  function puzzle(L) { return LD.makePuzzle(L.q, { id: L.id, pack: L.pack, packName: L.packName, num: L.num, city: L.city, venue: L.venue }); }

  // ===================================================================================================================
  // HELPERS
  // ===================================================================================================================
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const fmt = (ms) => { const s = Math.floor(ms / 1000); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); };
  let toastT = 0;
  function toast(t, ms) { const el = $('toast'); el.textContent = t; el.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(() => el.classList.remove('on'), ms || 2400); }
  function show(id) { for (const s of document.querySelectorAll('.scr')) s.classList.toggle('on', s.id === id); screen = id; }
  function modal(html, wire) { $('card').innerHTML = html; $('modal').classList.add('on'); if (wire) wire($('card')); }
  function closeModal() { $('modal').classList.remove('on'); }
  function tapSound() { LD.audio.unlock(); if (LD.audio.uiTap) LD.audio.uiTap(); }
  const ARROW_R = '<svg viewBox="0 0 10 10"><path d="M2 1l7 4-7 4z"/></svg>';
  const ARROW_D = '<svg viewBox="0 0 10 10"><path d="M1 2l4 7 4-7z"/></svg>';
  // colour zones: zone 4 is yellow (the tutorial points at it)
  const ZONE = ['#f4a3a3', '#9ccdf2', '#a8dcae', '#d6b7ef', '#ffd95e', '#ffbf8a', '#9fe0dc', '#f3b6d8', '#c9d38d', '#c5c0f7'];

  // ===================================================================================================================
  // GAME SCREEN
  // ===================================================================================================================
  let screen = 'title', game = null, cs = 40, cellEls = [], rowEls = [], colEls = [], tut = null, cur = null, timerT = 0, recorded = false;
  const board = $('board');
  LD.bindInput(board, () => game, {
    cellAt(x, y) {
      if (!game) return -1;
      const r = board.getBoundingClientRect(), b = 3;
      const c = Math.floor((x - r.left - b) / cs), rr = Math.floor((y - r.top - b) / cs);
      if (c < 0 || rr < 0 || c >= game.n || rr >= game.n) return -1;
      return rr * game.n + c;
    },
    onCursor(i) { for (const el of cellEls) el.classList.remove('cur'); if (cellEls[i]) cellEls[i].classList.add('cur'); },
  });

  function layout() {
    if (!game) return;
    const n = game.n, gut = 30;
    const w = Math.min(window.innerWidth, 520) - 24 - gut - 6;
    const used = 150 + ($('coach').classList.contains('on') ? 90 : 0);
    const h = window.innerHeight - used - gut - 6;
    cs = Math.max(24, Math.min(64, Math.floor(Math.min(w, h) / n)));
    const play = $('play');
    play.style.gridTemplateColumns = gut + 'px ' + (n * cs + 6) + 'px';
    play.style.gridTemplateRows = gut + 'px ' + (n * cs + 6) + 'px';
    board.style.gridTemplateColumns = 'repeat(' + n + ',' + cs + 'px)';
    board.style.gridTemplateRows = 'repeat(' + n + ',' + cs + 'px)';
    board.style.fontSize = cs + 'px';
    $('colArr').style.cssText = 'grid-template-columns:repeat(' + n + ',' + cs + 'px);padding:0 3px';
    $('rowArr').style.cssText = 'grid-template-rows:repeat(' + n + ',' + cs + 'px);padding:3px 0';
  }

  function buildBoard() {
    const n = game.n, reg = game.region;
    board.innerHTML = ''; $('rowArr').innerHTML = ''; $('colArr').innerHTML = '';
    cellEls = []; rowEls = []; colEls = [];
    for (let i = 0; i < n * n; i++) {
      const r = (i / n) | 0, c = i % n, el = document.createElement('div');
      el.className = 'c';
      // thick ink line where the zone changes, a thin one inside a zone
      const right = c < n - 1 ? (reg[i + 1] !== reg[i] ? 3 : 1) : 0, down = r < n - 1 ? (reg[i + n] !== reg[i] ? 3 : 1) : 0;
      el.style.background = ZONE[reg[i] % ZONE.length];
      el.style.boxShadow = (right ? 'inset -' + right + 'px 0 0 rgba(43,29,22,' + (right > 1 ? 1 : .18) + ')' : '') + (right && down ? ',' : '') + (down ? 'inset 0 -' + down + 'px 0 rgba(43,29,22,' + (down > 1 ? 1 : .18) + ')' : '');
      board.appendChild(el); cellEls.push(el);
    }
    for (let k = 0; k < n; k++) {
      const a = document.createElement('button'); a.className = 'arr'; a.innerHTML = ARROW_R; a.setAttribute('aria-label', 'row ' + (k + 1));
      a.onclick = () => { LD.audio.unlock(); game.crossLine('row', k); };
      $('rowArr').appendChild(a); rowEls.push(a);
      const b = document.createElement('button'); b.className = 'arr'; b.innerHTML = ARROW_D; b.setAttribute('aria-label', 'column ' + (k + 1));
      b.onclick = () => { LD.audio.unlock(); game.crossLine('col', k); };
      $('colArr').appendChild(b); colEls.push(b);
    }
    layout();
    for (let i = 0; i < n * n; i++) drawCell(i);
    refreshArrows(); drawMics();
  }
  function drawCell(i) {
    const v = game.cells[i], el = cellEls[i];
    if (!el) return;
    el.classList.toggle('w', !!game.wrong[i]);
    if (v === LD.CELL.PIECE) { const who = game.who(i); el.innerHTML = '<span class="pc ' + who + '">' + (who === 'roxor' ? 'R' : 'J') + '</span>'; }
    else if (v === LD.CELL.CROSS || v === LD.CELL.AUTO) el.innerHTML = '<span class="x">✕</span>';
    else el.innerHTML = '';
  }
  let arrowRaf = 0;
  function refreshArrows() {
    if (arrowRaf) return;
    arrowRaf = requestAnimationFrame(() => {
      arrowRaf = 0; if (!game) return;
      rowEls.forEach((a, k) => a.classList.toggle('dim', !game.lineHasEmpty('row', k)));
      colEls.forEach((a, k) => a.classList.toggle('dim', !game.lineHasEmpty('col', k)));
    });
  }
  function drawMics() {
    const el = $('gMics');
    if (!game.opts.lives) { el.textContent = ''; return; }
    let h = ''; for (let k = 0; k < game.opts.lives; k++) h += '<span class="' + (k < game.lives ? '' : 'gone') + '">🎤</span>';
    el.innerHTML = h;
  }
  function flash(cells) { for (const j of cells) { const el = cellEls[j]; if (!el) continue; el.classList.remove('hl'); void el.offsetWidth; el.classList.add('hl'); } }
  function bump(el, cls) { if (!el) return; el.classList.remove(cls); void el.offsetWidth; el.classList.add(cls); }

  // the loop station: one bar per layer, lit as performers land
  const loopEl = $('gLoop');
  for (let k = 0; k < 9; k++) loopEl.appendChild(document.createElement('i'));
  LD.loop.on((b) => {
    if (!b.onBeat || screen !== 'game') return;
    const bars = loopEl.children;
    for (let k = 0; k < 9; k++) { bars[k].classList.toggle('on', k < LD.loop.layers); bars[k].classList.toggle('beat', k < LD.loop.layers && b.beat % 2 === 0 && k % 2 === b.beat / 2 % 2); }
  });

  function startGame(g, info) {
    if (game) { game.handlers = {}; }
    game = g; recorded = false; cur = info;
    LD.audio.attach(game); LD.loop.attach(game);
    game.on('mark', (e) => {
      if (e.delay) setTimeout(() => drawCell(e.i), e.delay); else drawCell(e.i);
      refreshArrows();
    });
    game.on('place', (e) => { drawCell(e.i); refreshArrows(); flash(game.peers(e.i).filter((j) => game.cells[j] === LD.CELL.EMPTY)); });
    game.on('mistake', (e) => { drawCell(e.i); drawMics(); bump(board, 'shake'); if (navigator.vibrate) try { navigator.vibrate(60); } catch (x) { /* ignore */ } });
    game.on('blocked', (e) => { bump(cellEls[e.i], 'wob'); if (!tut) toast(T.blocked); });
    game.on('locked', (e) => bump(cellEls[e.i], 'wob'));
    game.on('line', (e) => { const a = (e.kind === 'row' ? rowEls : colEls)[e.index]; bump(a, 'press'); setTimeout(() => a && a.classList.remove('press'), 160); });
    game.on('hint', (e) => {
      flash(e.unit);
      if (tut) return;
      if (e.kind === 'place') toast(e.unitKind === 'col' ? T.hintCol : e.unitKind === 'region' ? T.hintReg : T.hintRow, 3200);
      else toast(T.hintX(e.unitKind === 'col' ? T.uCol : e.unitKind === 'region' ? T.uReg : T.uRow), 3800);
    });
    game.on('undo', redraw); game.on('clear', () => setTimeout(redraw, 0)); game.on('reset', () => { if (cellEls.length) redraw(); });
    game.on('win', (e) => setTimeout(() => onWin(e), 1100));
    game.on('lose', () => setTimeout(onLose, 900));
    $('gName').textContent = info.name; $('gGig').textContent = info.gig;
    show('game'); buildBoard();
    clearInterval(timerT);
    timerT = setInterval(() => { if (game && screen === 'game') $('gTime').textContent = fmt(game.elapsed()); }, 500);
    $('gTime').textContent = '0:00';
  }
  function redraw() { for (let i = 0; i < game.N; i++) drawCell(i); refreshArrows(); drawMics(); }

  function startGig(id) {
    const L = BY.get(id) || BY.get(currentId());
    S.current = L.id; save();
    endTutorial(false);
    startGame(new LD.Game(puzzle(L)), { id: L.id, name: T.lvName(L.packName, L.num), gig: L.city + ' · ' + L.venue + ' · ' + L.q.n + '×' + L.q.n });
  }

  function onWin(e) {
    if (tut) { const done = () => { S.tut = true; save(); endTutorial(false); startGig(PACKS[0].levels[0].id); };
      modal('<h3>' + T.tutDoneT + '</h3><div class="stars">★★★</div><p>' + T.tutDoneP + '</p><button class="btn" data-go>' + T.tutDoneB + '</button>', (c) => { c.querySelector('[data-go]').onclick = () => { closeModal(); done(); }; });
      return; }
    if (recorded) return; recorded = true;
    const L = BY.get(cur.id), first = !S.solved[L.id];
    const unlockedBefore = PACKS.filter((p) => packInfo(p).unlocked).map((p) => p.id);
    const base = POINTS[L.pack] || 15, mult = e.stars >= 3 ? 1.5 : e.stars === 2 ? 1.2 : 1;
    const pts = Math.round(base * mult * (first ? 1 : 0.2));
    const prev = S.solved[L.id];
    S.solved[L.id] = { stars: Math.max(e.stars, prev ? prev.stars : 0), ms: prev ? Math.min(prev.ms, e.ms) : e.ms };
    S.points += pts; S.current = null; save();
    const newPack = PACKS.find((p) => packInfo(p).unlocked && !unlockedBefore.includes(p.id));
    const nx = nextId(L.id);
    let stars = ''; for (let k = 1; k <= 3; k++) stars += k <= e.stars ? '★' : '<span class="no">★</span>';
    const notes = [first ? T.first : T.replay]; if (e.stars >= 2 && first) notes.push(T.starB(e.stars));
    modal('<h3>' + T.winT + '</h3><div class="stars">' + stars + '</div><p class="small">' + T.winTime(fmt(e.ms), e.mistakes) + '</p>'
      + '<div class="big" id="wPts">+0</div><p class="small">' + esc(notes.join(' · ')) + '</p><p><b>' + T.total(S.points) + '</b></p>'
      + (newPack ? '<p style="color:var(--red);font-weight:800">' + esc(T.newPack(newPack.name)) + '</p>' : '')
      + (nx ? '<button class="btn" data-n>' + T.next + '</button>' : '') + '<button class="btn alt" data-l>' + T.toList + '</button>', (c) => {
      if (nx) c.querySelector('[data-n]').onclick = () => { tapSound(); closeModal(); startGig(nx); };
      c.querySelector('[data-l]').onclick = () => { tapSound(); closeModal(); openLevels(L.pack); };
      const el = c.querySelector('#wPts'), t0 = performance.now();
      const step = () => { const k = Math.min(1, (performance.now() - t0) / 700); el.textContent = T.winPts(Math.round(pts * k)); if (k < 1) requestAnimationFrame(step); };
      requestAnimationFrame(step);
    });
  }
  function onLose() {
    if (tut) return;
    const id = cur.id;
    modal('<h3>' + T.loseT + '</h3><p style="font-size:44px;margin:4px">🎤💤</p><p>' + T.loseP + '</p><button class="btn" data-r>' + T.retry + '</button><button class="btn alt" data-l>' + T.toList + '</button>', (c) => {
      c.querySelector('[data-r]').onclick = () => { tapSound(); closeModal(); startGig(id); };
      c.querySelector('[data-l]').onclick = () => { tapSound(); closeModal(); openLevels(); };
    });
  }

  // ===================================================================================================================
  // TUTORIAL: a real game on the first Easy board, guided step by step. It never touches the save.
  // ===================================================================================================================
  const TUT = [
    { txt: 'tut1', at: (g) => [g.idx(0, 0)], done: (ev, d) => ev === 'mark' && d.on && (d.source === 'tap' || d.source === 'drag') },
    { txt: 'tut2', at: (g) => [0, 1, 2, 3].map((c) => g.idx(3, c)), done: (ev, d) => ev === 'stroke' && d.count >= 2 },
    { txt: 'tut3', at: (g) => [g.idx(4, 2)], done: (ev) => ev === 'place' },
    { txt: 'tut4', arrow: ['row', 4], done: (ev) => ev === 'line' },
    { txt: 'tut5', btn: 'tHint', done: (ev) => ev === 'hint' },
    { txt: 'tut6', done: () => false },
  ];
  function intro(onGo) {
    const li = T.rules.map((r) => '<li><i>' + r[0] + '</i>' + esc(r[1]) + '</li>').join('');
    modal('<h3>' + T.tutT + '</h3><ul class="rules">' + li + '</ul><p class="small">' + T.rulesP + '</p><button class="btn" data-go>' + T.tutGo + '</button><button class="btn alt" data-sk>' + T.tutSkip + '</button>', (c) => {
      c.querySelector('[data-go]').onclick = () => { tapSound(); closeModal(); onGo(); };
      c.querySelector('[data-sk]').onclick = () => { tapSound(); closeModal(); S.tut = true; save(); startGig(currentId()); };
    });
  }
  function startTutorial() {
    const L = PACKS[0].levels[0];
    tut = { step: 0 };
    $('coach').classList.add('on');
    startGame(new LD.Game(puzzle(L), { lives: 0 }), { id: null, name: T.tutName, gig: T.tutGig + ' · 5×5' });
    game.on('*', (ev, d) => {
      if (!tut) return;
      if (ev === 'mistake' && tut.step === 2) { coach(T.tut3bad); return; }
      const st = TUT[tut.step];
      if (st && st.done(ev, d)) setTimeout(() => tutStep(tut ? tut.step + 1 : 0), ev === 'place' || ev === 'line' ? 650 : 250);
    });
    tutStep(0);
  }
  function coach(txt) { $('coachTxt').innerHTML = '<span class="st">' + T.tutStep(Math.min(tut.step + 1, TUT.length), TUT.length) + '</span>' + esc(txt); }
  function clearGlow() { for (const el of document.querySelectorAll('.glow')) el.classList.remove('glow'); }
  function tutStep(k) {
    if (!tut || !game) return;
    tut.step = k; clearGlow();
    const st = TUT[k]; if (!st) return;
    coach(T[st.txt]);
    if (st.at) for (const i of st.at(game)) cellEls[i] && cellEls[i].classList.add('glow');
    if (st.arrow) { const a = (st.arrow[0] === 'row' ? rowEls : colEls)[st.arrow[1]]; a && a.classList.add('glow'); }
    if (st.btn) $(st.btn).classList.add('glow');
  }
  function endTutorial(toTitle) {
    if (!tut) return;
    tut = null; clearGlow(); $('coach').classList.remove('on');
    if (toTitle) openTitle();
  }
  $('coachSkip').onclick = () => { tapSound(); S.tut = true; save(); endTutorial(false); startGig(currentId()); };

  // ===================================================================================================================
  // TITLE, LEVELS, MENU
  // ===================================================================================================================
  function applySound() {
    LD.audio.setMuted ? LD.audio.setMuted(!S.sound) : (LD.audio.muted = !S.sound);
    LD.loop.silent = !S.music;
    $('bSound').textContent = S.sound ? T.soundOn : T.soundOff;
    $('bMusic').textContent = S.music ? T.musicOn : T.musicOff;
  }
  function openTitle() {
    endTutorial(false); LD.loop.stop();
    if (game) { game.handlers = {}; game = null; }
    const L = BY.get(currentId());
    $('bPlay').textContent = Object.keys(S.solved).length ? T.cont(T.lvName(L.packName, L.num)) : T.play;
    $('tPts').textContent = T.pts(S.points);
    show('title');
  }
  let lvSel = 'easy';
  function openLevels(sel) {
    endTutorial(false);
    if (game && (game.over || game.won)) { game.handlers = {}; game = null; LD.loop.stop(); }
    if (sel) lvSel = sel; else lvSel = BY.get(currentId()).pack;
    renderLevels(); show('levels');
    const t = $('lvTabs').querySelector('[aria-selected=true]'); if (t) t.scrollIntoView({ inline: 'center', block: 'nearest' });
  }
  function renderLevels() {
    const infos = PACKS.map(packInfo), pi = infos.find((x) => x.pack.id === lvSel) || infos[0];
    $('lvTabs').innerHTML = infos.map((x) => '<button class="tab" role="tab" data-p="' + x.pack.id + '" aria-selected="' + (x.pack.id === pi.pack.id) + '">' + esc(x.pack.name) + '<span>' + (x.unlocked ? x.solved + '/' + x.levels.length : '🔒') + '</span></button>').join('');
    const sizes = [...new Set(pi.pack.levels.map((x) => x.q.n))].sort((a, b) => a - b).map((n) => n + '×' + n).join(' ');
    $('lvNote').textContent = pi.unlocked ? T.lvNote(sizes, pi.solved, pi.levels.length) : T.lvLocked(pi.need[1], PACK_ZH[pi.need[0]]);
    const curId = currentId();
    $('lvGrid').innerHTML = pi.levels.map((x) => '<button class="lv' + (x.s ? ' done' : '') + (x.L.id === curId ? ' cur' : '') + '" data-id="' + x.L.id + '"' + (x.open ? '' : ' disabled') + '>'
      + (x.open ? x.L.num : '🔒') + '<small>' + (x.s ? '★'.repeat(x.s.stars) : '') + '</small></button>').join('');
  }
  $('lvTabs').onclick = (e) => { const b = e.target.closest('[data-p]'); if (b) { tapSound(); lvSel = b.dataset.p; renderLevels(); } };
  $('lvGrid').onclick = (e) => { const b = e.target.closest('[data-id]'); if (b && !b.disabled) { tapSound(); startGig(b.dataset.id); } };
  $('lvBack').onclick = () => { tapSound(); openTitle(); };

  $('bPlay').onclick = () => { tapSound(); if (!S.tut) intro(startTutorial); else startGig(currentId()); };
  $('bLevels').onclick = () => { tapSound(); openLevels(); };
  $('bTut').onclick = () => { tapSound(); intro(startTutorial); };
  $('bSound').onclick = () => { S.sound = !S.sound; save(); applySound(); tapSound(); };
  $('bMusic').onclick = () => { S.music = !S.music; save(); applySound(); tapSound(); };
  $('gHome').onclick = () => { tapSound(); openTitle(); };
  $('gMenu').onclick = () => {
    tapSound();
    modal('<h3>' + T.menu + '</h3><button class="btn" data-c>' + T.resume + '</button><button class="btn alt" data-l>' + T.levels + '</button><button class="btn alt" data-t>' + T.tut + '</button><button class="btn alt" data-h>' + T.home + '</button>', (c) => {
      c.querySelector('[data-c]').onclick = () => { tapSound(); closeModal(); };
      c.querySelector('[data-l]').onclick = () => { tapSound(); closeModal(); openLevels(); };
      c.querySelector('[data-t]').onclick = () => { tapSound(); closeModal(); intro(startTutorial); };
      c.querySelector('[data-h]').onclick = () => { tapSound(); closeModal(); openTitle(); };
    });
  };
  $('tUndo').onclick = () => { if (game) game.undo(); };
  $('tClear').onclick = () => { if (game) game.clearCrosses(); };
  $('tHint').onclick = () => { LD.audio.unlock(); if (!game) return; if (game.over || game.won) { toast(T.noHint); return; } game.hint(); };
  $('tRestart').onclick = () => {
    if (!game) return; tapSound();
    if (tut) { startTutorial(); return; }
    modal('<h3>' + T.restart + '</h3><p>' + T.rConfirm + '</p><div class="row2"><button class="btn alt" data-n>' + T.no + '</button><button class="btn" data-y>' + T.yes + '</button></div>', (c) => {
      c.querySelector('[data-n]').onclick = () => closeModal();
      c.querySelector('[data-y]').onclick = () => { closeModal(); startGig(cur.id); };
    });
  };

  $('tDuo').textContent = T.duo; $('tFoot').textContent = T.foot;
  $('bLevels').textContent = T.levels; $('bTut').textContent = T.tut; $('coachSkip').textContent = T.tutSkip;
  $('lvTitle').textContent = T.levels;
  $('tUndo').textContent = T.undo; $('tClear').textContent = T.clear; $('tHint').textContent = T.hint; $('tRestart').textContent = T.restart;
  applySound();
  window.addEventListener('resize', () => { if (game && screen === 'game') layout(); });
  // pause the groove when the app goes to the background (WeChat, switching apps)
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) LD.loop.stop();
    else if (game && screen === 'game' && game.t0 !== null && !game.over && !game.won) LD.loop.start();
  });
  // test hook
  window.LDCN = { game: () => game, screen: () => screen, start: startGig, tutorial: () => tut && tut.step, state: () => S };

  openTitle();
  // first visit: go straight to the tutorial intro
  if (!S.tut) intro(startTutorial);
})();
</script>
</body>
</html>
