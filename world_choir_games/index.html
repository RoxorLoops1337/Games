<script>
/* ============================================================================
   ADJUDICATOR — World Choir Games (Helsingborg 2026)
   ---------------------------------------------------------------------------
   You are the fifth adjudicator on an INTERKULTUR jury. Choirs sing; the
   performance is synthesised live (four SATB part-voices, three detuned
   singers each, formant-filtered). Flaws are injected into the *part state* —
   a cents offset, a gain multiplier, a timing offset, a brightness shift —
   which the audio graph and the renderer both read. So what you hear and what
   you see are the same data: the tell is never faked.

   Flag flaws on the five criteria while the choir sings, then set your score
   on the 30-point card. The other four jurors reveal, the panel takes a
   trimmed mean, and the diploma is awarded. You are scored on Accuracy
   (how close to the truth), Attention (what you caught) and Integrity
   (holding a correct score when the panel drifted to the crowd favourite).
   ========================================================================= */

const VW = 1000, VH = 620;                 // virtual canvas, letterboxed to fit
const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
let DPR = 1, SCALE = 1;

/* ------------------------------------------------------------------ random */
let SEED = 20260806;
function reseed(s){ SEED = (s >>> 0) || 1; }
function rng(){
  SEED |= 0; SEED = (SEED + 0x6D2B79F5) | 0;
  let t = Math.imul(SEED ^ (SEED >>> 15), 1 | SEED);
  t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
  return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
}
const rnd = (a, b) => a + rng() * (b - a);
const rint = (a, b) => Math.floor(a + rng() * (b - a + 1));
const pick = (arr) => arr[Math.floor(rng() * arr.length)];
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const lerp = (a, b, t) => a + (b - a) * t;

/* ================================================================= the data */

/* The five MUSICA MUNDI-style criteria the jury marks on. Keys 1..5. */
const CRITS = [
  { id:'int', key:'1', name:'Intonation',          short:'INTONATION',  col:'#6ee7ff',
    blurb:'Is the choir in tune with itself and with the pitch it started on?' },
  { id:'snd', key:'2', name:'Sound Quality',       short:'SOUND',       col:'#ffb35c',
    blurb:'Tone, vowel, resonance. Is it a healthy sound or a pushed one?' },
  { id:'bln', key:'3', name:'Blend & Balance',     short:'BLEND',       col:'#b48cff',
    blurb:'Do the four parts weigh the same? Is anyone sticking out, or missing?' },
  { id:'fid', key:'4', name:'Fidelity to Score',   short:'FIDELITY',    col:'#5eff9e',
    blurb:'Entries, rhythm, tempo, text. Is the choir singing what is written?' },
  { id:'art', key:'5', name:'Artistic Impression', short:'ARTISTRY',    col:'#ff6fa8',
    blurb:'Phrasing, dynamics, intent. Is anybody actually saying anything?' },
];
const CRIT_BY_ID = {};
for (const c of CRITS) CRIT_BY_ID[c.id] = c;

/* Voice parts, low index = highest voice. `state` is what audio and render share. */
const PART_DEFS = [
  { name:'Soprano', plural:'Sopranos', abbr:'S', lo:60, hi:79, col:'#ffd8ea', ink:'#b0246a', clef:'G', up:true },
  { name:'Alto',    plural:'Altos',    abbr:'A', lo:55, hi:72, col:'#cfe0ff', ink:'#1d5aa6', clef:'G', up:false },
  { name:'Tenor',   plural:'Tenors',   abbr:'T', lo:48, hi:64, col:'#d8ffd9', ink:'#1c7038', clef:'F', up:true },
  { name:'Bass',    plural:'Basses',   abbr:'B', lo:40, hi:57, col:'#ffe8c2', ink:'#8f5410', clef:'F', up:false },
];

/* Every flaw names a criterion, a severity in card points, and how it bends
   the part state. `apply(P, k)` runs each frame with k = 0..1 intensity, so
   flaws fade in and out instead of snapping. */
const FLAWS = [
  { id:'flat_part',   crit:'int', sev:1.5, dur:5.0, label:'{part} settles flat',
    note:'the {part} line sags roughly a third of a semitone under pitch',
    setup:(f) => { f.part = rint(0, 3); },
    apply:(f, P, k) => { P[f.part].cents -= 34 * k; } },
  { id:'sharp_top',   crit:'int', sev:1.2, dur:4.2, label:'Sopranos push sharp',
    note:'the top line rides sharp as the phrase climbs',
    setup:(f) => { f.part = 0; },
    apply:(f, P, k) => { P[0].cents += 27 * k; } },
  { id:'pitch_drop',  crit:'int', sev:2.0, dur:6.0, label:'The whole choir drops pitch',
    note:'a cappella pitch drift — the ensemble is a quarter-tone below where it began',
    setup:(f) => { f.part = -1; },
    apply:(f, P, k) => { for (const p of P) p.cents -= 42 * k; } },

  { id:'strained',    crit:'snd', sev:1.6, dur:4.6, label:'{part} tone turns strained',
    note:'pushed, edgy tone in the {part} — volume bought with tension',
    setup:(f) => { f.part = rint(0, 2); },
    apply:(f, P, k) => { P[f.part].bright += 1.5 * k; P[f.part].gain *= 1 + 0.5 * k; } },
  { id:'breathy',     crit:'snd', sev:1.1, dur:4.0, label:'{part} goes breathy',
    note:'the {part} loses core to breath — air, not tone',
    setup:(f) => { f.part = rint(0, 3); },
    apply:(f, P, k) => { P[f.part].air += 0.85 * k; P[f.part].gain *= 1 - 0.28 * k; } },
  { id:'spread',      crit:'snd', sev:1.3, dur:4.4, label:'Vowels spread and whiten',
    note:'the vowel unravels across the ensemble — bright, shallow, unsupported',
    setup:(f) => { f.part = -1; },
    apply:(f, P, k) => { for (const p of P){ p.bright += 0.75 * k; p.air += 0.3 * k; } } },

  { id:'soloist',     crit:'bln', sev:1.4, dur:4.4, label:'A {part} sticks out',
    note:'one {part} voice is singing a recital over the top of the section',
    setup:(f) => { f.part = rint(0, 3); },
    apply:(f, P, k) => { P[f.part].gain *= 1 + 1.5 * k; P[f.part].rogue = k; } },
  { id:'buried',      crit:'bln', sev:1.5, dur:5.0, label:'{part} line disappears',
    note:'the {part} part is inaudible under the rest of the texture',
    setup:(f) => { f.part = rint(1, 3); },
    apply:(f, P, k) => { P[f.part].gain *= 1 - 0.78 * k; } },
  { id:'bass_heavy',  crit:'bln', sev:1.2, dur:4.2, label:'Bottom-heavy texture',
    note:'basses and tenors swamp the upper parts — the chord loses its top',
    setup:(f) => { f.part = 3; },
    apply:(f, P, k) => { P[3].gain *= 1 + 1.1 * k; P[2].gain *= 1 + 0.6 * k; P[0].gain *= 1 - 0.4 * k; } },

  { id:'late_entry',  crit:'fid', sev:1.5, dur:3.6, label:'{part} entry is late',
    note:'the {part} come in behind the beat and never quite catch up',
    setup:(f) => { f.part = rint(0, 3); },
    apply:(f, P, k) => { P[f.part].lag += 0.19 * k; } },
  { id:'drag',        crit:'fid', sev:1.7, dur:5.4, label:'The tempo drags',
    note:'the pulse sags — the phrase arrives late to every bar line',
    setup:(f) => { f.part = -1; },
    apply:(f, P, k, S) => { S.tempoMul *= 1 - 0.17 * k; } },
  { id:'rush',        crit:'fid', sev:1.4, dur:4.4, label:'The choir rushes',
    note:'the ensemble runs ahead of the conductor',
    setup:(f) => { f.part = -1; },
    apply:(f, P, k, S) => { S.tempoMul *= 1 + 0.16 * k; } },
  { id:'wrong_note',  crit:'fid', sev:1.6, dur:3.4, label:'{part} sing a wrong note',
    note:'the {part} are a step away from what is written',
    setup:(f) => { f.part = rint(0, 3); f.by = rng() < 0.5 ? -1 : 2; },
    apply:(f, P, k) => { if (k > 0.3) P[f.part].wrongBy = f.by; } },
  { id:'ragged',      crit:'fid', sev:1.3, dur:4.0, label:'Ragged ensemble',
    note:'entries and releases are untidy — no two parts agree where the bar ends',
    setup:(f) => { f.part = -1; },
    apply:(f, P, k) => { P[0].lag += 0.10 * k; P[2].lag += 0.16 * k; P[3].lag -= 0.09 * k; } },

  { id:'flat_dyn',    crit:'art', sev:1.6, dur:5.6, label:'Dynamics go flat',
    note:'one unvaried mezzo-forte from bar to bar — the shape has gone',
    setup:(f) => { f.part = -1; },
    apply:(f, P, k, S) => { S.expression *= 1 - 0.8 * k; } },
  { id:'no_phrase',   crit:'art', sev:1.4, dur:5.0, label:'Phrases stop arriving',
    note:'nothing is being said — every phrase ends where it started',
    setup:(f) => { f.part = -1; },
    apply:(f, P, k, S) => { S.expression *= 1 - 0.55 * k; S.phrasing *= 1 - 0.75 * k; } },
  { id:'stiff',       crit:'art', sev:1.2, dur:4.4, label:'Delivery turns stiff',
    note:'accurate and completely uninhabited — the choir has stopped listening to itself',
    setup:(f) => { f.part = -1; },
    apply:(f, P, k, S) => { S.expression *= 1 - 0.4 * k; S.life *= 1 - 0.7 * k; } },
];
const FLAW_BY_ID = {};
for (const f of FLAWS) FLAW_BY_ID[f.id] = f;

/* Flags are drawn from a tiny description, not from images. */
const COUNTRIES = [

/* Diploma bands on the 30-point card. */
const BANDS = [

/* Part state, rebuilt every frame from the base plus whatever flaws are live. */
const PARTS = PART_DEFS.map((d) => ({

const fx = [];
function spawnFx(o){ fx.push(Object.assign({ t:0, life:0.8 }, o)); }
function fxTick(dt){
  for (let i = fx.length - 1; i >= 0; i--){
    const p = fx[i]; p.t += dt;
    p.y += (p.vy || 0) * dt; p.x += (p.vx || 0) * dt;
    if (p.t >= p.life) fx.splice(i, 1);
  }
}

/* ================================================================== audio */
/* Five formants make a vowel; five slightly disagreeing singers make a section;
   a hall makes a choir. Each part is five sawtooth voices — every one with its
   own vibrato rate, its own slow drift and its own tuning error — mixed into a
   parallel bank of five band-passes whose centres are the formants of whatever
   vowel the sopranos are currently on. The whole thing goes through a
   convolution hall and a compressor.
   Nothing here decides anything: AUDIO.frame() only reads PARTS and SING, so
   the sound and the picture can never disagree about what the choir is doing. */
const VOWELS = {
  a: { f:[ 800, 1150, 2900, 3900, 4950], g:[1.00, 0.50, 0.36, 0.26, 0.10] },
  e: { f:[ 400, 1620, 2700, 3300, 4950], g:[1.00, 0.46, 0.34, 0.20, 0.08] },
  i: { f:[ 350, 2000, 2800, 3600, 4950], g:[1.00, 0.30, 0.26, 0.20, 0.08] },
  o: { f:[ 450,  800, 2830, 3500, 4950], g:[1.00, 0.58, 0.20, 0.15, 0.06] },
  u: { f:[ 325,  700, 2530, 3500, 4950], g:[1.00, 0.42, 0.14, 0.10, 0.04] },
};
const VOWEL_KEYS = ['a', 'e', 'i', 'o', 'u'];
/* Sopranos have a longer vocal tract than nobody and a shorter one than a bass. */
const FORMANT_SCALE = [1.16, 1.06, 0.97, 0.88];

/* The vowel a sung syllable actually lands on. */
function vowelOf(syl){
  const t = String(syl || '').toLowerCase();
  let last = 'a';
  for (let i = 0; i < t.length; i++){
    const ch = t[i];
    if ('aáàâä'.indexOf(ch) >= 0) last = 'a';
    else if ('eéèêë'.indexOf(ch) >= 0) last = 'e';
    else if ('iíìîï'.indexOf(ch) >= 0) last = 'i';
    else if ('oóòôöø'.indexOf(ch) >= 0) last = 'o';
    else if ('uúùûüy'.indexOf(ch) >= 0) last = 'u';
  }
  return last;
}

const AUDIO = {
  ac:null, ok:false, muted:false, master:null, comp:null, voices:[],
  hall:null, wet:null, dry:null, noiseGain:null, noiseFilter:null, applause:0,
  SINGERS:5,

  /* A concert hall, made rather than recorded: noise under an exponential
     decay, with a couple of early reflections so it has walls. */
  makeIR(ac, seconds, decay){
    const n = Math.floor(ac.sampleRate * seconds);
    const buf = ac.createBuffer(2, n, ac.sampleRate);
    for (let ch = 0; ch < 2; ch++){
      const d = buf.getChannelData(ch);
      for (let i = 0; i < n; i++){
        const t = i / n;
        d[i] = (Math.random() * 2 - 1) * Math.pow(1 - t, decay);
      }
      for (const [ms, amp] of [[19, 0.42], [31, 0.30], [47, 0.22]]){
        const k = Math.floor((ms + ch * 3) * 0.001 * ac.sampleRate);
        if (k < n) d[k] += amp;
      }
    }
    return buf;
  },

  init(){
    if (this.ac || this.ok) return;
    const AC = (typeof window !== 'undefined') && (window.AudioContext || window.webkitAudioContext);
    if (!AC) return;
    try {
      const ac = new AC();

      const comp = ac.createDynamicsCompressor();
      comp.threshold.value = -16; comp.knee.value = 22;
      comp.ratio.value = 3.2; comp.attack.value = 0.012; comp.release.value = 0.28;
      const master = ac.createGain(); master.gain.value = 0.0001;
      comp.connect(master); master.connect(ac.destination);

      const hall = ac.createConvolver();
      hall.buffer = this.makeIR(ac, 2.6, 2.4);
      const wet = ac.createGain(); wet.gain.value = 0.62;
      const dry = ac.createGain(); dry.gain.value = 0.72;
      hall.connect(wet); wet.connect(comp); dry.connect(comp);

      const voices = PART_DEFS.map((d, pi) => {
        const mix = ac.createGain(); mix.gain.value = 1;
        // `out` only sums the formant bank — the part's dynamic level is set
        // further down the chain, on `gain`. Leaving this near zero is how you
        // build a choir that looks perfect and makes no sound.
        const out = ac.createGain(); out.gain.value = 1;
        // the formant bank — this is what turns a buzz into a voice
        const bank = [];
        for (let k = 0; k < 5; k++){
          const bp = ac.createBiquadFilter();
          bp.type = 'bandpass';
          bp.frequency.value = VOWELS.a.f[k];
          bp.Q.value = k === 0 ? 7 : 9 + k;
          const g = ac.createGain(); g.gain.value = VOWELS.a.g[k];
          mix.connect(bp); bp.connect(g); g.connect(out);
          bank.push({ bp, g });
        }
        // a little unfiltered body so the low parts do not vanish
        const body = ac.createBiquadFilter();
        body.type = 'lowpass'; body.frequency.value = 900; body.Q.value = 0.6;
        const bodyG = ac.createGain(); bodyG.gain.value = 0.30;
        mix.connect(body); body.connect(bodyG); bodyG.connect(out);

        const gain = ac.createGain(); gain.gain.value = 0.0001;
        out.connect(gain);
        const send = ac.createGain(); send.gain.value = 0.55;
        gain.connect(dry); gain.connect(send); send.connect(hall);

        const singers = [];
        for (let k = 0; k < AUDIO.SINGERS; k++){
          const o = ac.createOscillator();
          o.type = 'sawtooth';
          o.frequency.value = 220;
          // every singer is a little out, in their own fixed direction
          const off = (k - (AUDIO.SINGERS - 1) / 2) * 5.5 + ((k * 37 + pi * 11) % 7) - 3;
          o.detune.value = off;
          const g = ac.createGain(); g.gain.value = 0.9 / AUDIO.SINGERS;
          o.connect(g); g.connect(mix);
          // vibrato, and a much slower wander underneath it
          const vib = ac.createOscillator();
          vib.frequency.value = 4.4 + k * 0.42 + pi * 0.13;
          const vibG = ac.createGain(); vibG.gain.value = 11;
          vib.connect(vibG); vibG.connect(o.detune);
          const drift = ac.createOscillator();
          drift.frequency.value = 0.17 + k * 0.031 + pi * 0.011;
          const driftG = ac.createGain(); driftG.gain.value = 6;
          drift.connect(driftG); driftG.connect(o.detune);
          try { o.start(); vib.start(); drift.start(); } catch (e) { /* already going */ }
          singers.push({ o, g, vibG, driftG, off });
        }
        return { mix, out, gain, send, bank, body, singers };
      });

      // breath and applause share one noise bed
      const buf = ac.createBuffer(1, Math.floor(ac.sampleRate * 2), ac.sampleRate);
      const chd = buf.getChannelData(0);
      for (let i = 0; i < chd.length; i++) chd[i] = Math.random() * 2 - 1;
      const noise = ac.createBufferSource(); noise.buffer = buf; noise.loop = true;
      const nf = ac.createBiquadFilter(); nf.type = 'bandpass';
      nf.frequency.value = 2400; nf.Q.value = 0.8;
      const ng = ac.createGain(); ng.gain.value = 0.0001;
      noise.connect(nf); nf.connect(ng); ng.connect(dry); ng.connect(hall);
      try { noise.start(); } catch (e) { /* noop */ }

      this.ac = ac; this.comp = comp; this.master = master; this.voices = voices;
      this.hall = hall; this.wet = wet; this.dry = dry;
      this.noise = noise; this.noiseGain = ng; this.noiseFilter = nf;
      this.ok = true;
    } catch (e) { this.ok = false; }
  },

  resume(){
    this.init();
    if (this.ok && this.ac.state === 'suspended') { try { this.ac.resume(); } catch (e) { /* noop */ } }
  },

  /* Reads PARTS and SING. This is the whole instrument. */
  frame(){
    if (!this.ok) return;
    const ac = this.ac, now = ac.currentTime, SM = 0.05;
    const on = !this.muted && G.phase === 'perform' && !G.paused;
    const vw = VOWELS[SING.vowel] || VOWELS.a;
    try {
      this.master.gain.setTargetAtTime(this.muted ? 0.0001 : 1.9, now, 0.08);
      for (let i = 0; i < PARTS.length; i++){
        const p = PARTS[i], v = this.voices[i];
        const hz = 440 * Math.pow(2, (p.midi - 69) / 12 + p.cents / 1200);
        const expr = clamp(SING.expression, 0, 1);
        for (const sg of v.singers){
          sg.o.frequency.setTargetAtTime(hz, now, 0.045);
          // a dead-eyed choir stops vibrating; a live one breathes
          sg.vibG.gain.setTargetAtTime(4 + 9 * expr * clamp(SING.life, 0, 1), now, 0.12);
        }
        const fs = FORMANT_SCALE[i] * (1 + 0.22 * clamp(p.bright, 0, 2));
        for (let k = 0; k < 5; k++){
          v.bank[k].bp.frequency.setTargetAtTime(vw.f[k] * fs, now, 0.07);
          // strain pushes energy up into the higher formants
          const lift = k >= 2 ? 1 + 0.9 * clamp(p.bright, 0, 2) : 1;
          v.bank[k].g.gain.setTargetAtTime(vw.g[k] * lift, now, 0.07);
          v.bank[k].bp.Q.setTargetAtTime(clamp((k === 0 ? 7 : 9 + k) - 3.5 * p.air, 1.2, 14), now, 0.09);
        }
        v.body.frequency.setTargetAtTime(760 + 340 * FORMANT_SCALE[i], now, 0.1);
        const lvl = on
          ? clamp(p.gain, 0, 3) * (0.16 + 0.14 * SING.level) * clamp(p.artic == null ? 1 : p.artic, 0.15, 1)
          : 0.0001;
        v.gain.gain.setTargetAtTime(Math.max(0.0001, lvl), now, SM);
      }
      let air = 0;
      for (const p of PARTS) air += p.air;
      const hall = (G.phase === 'panel' || G.phase === 'round') ? this.applause : 0;
      this.noiseFilter.frequency.setTargetAtTime(hall > 0 ? 1500 : 2700, now, 0.1);
      this.noiseGain.gain.setTargetAtTime(
        Math.max(0.0001, this.muted ? 0.0001 : (on ? air * 0.014 : 0) + hall * 0.10), now, 0.12);
      this.wet.gain.setTargetAtTime(0.62, now, 0.2);
    } catch (e) { /* an audio hiccup must never stop the game */ }
  },

  cheer(amount){ this.applause = clamp(amount, 0, 1); },
  fadeCheer(dt){ this.applause = Math.max(0, this.applause - dt * 0.35); },

  /* Short UI blips — a marked card, a rejected one. */
  blip(freq, dur, type){
    if (!this.ok || this.muted) return;
    try {
      const ac = this.ac, now = ac.currentTime;
      const o = ac.createOscillator(); o.type = type || 'sine'; o.frequency.value = freq;
      const g = ac.createGain(); g.gain.value = 0.0001;
      o.connect(g); g.connect(this.dry);
      g.gain.setValueAtTime(0.0001, now);
      g.gain.exponentialRampToValueAtTime(0.14, now + 0.012);
      g.gain.exponentialRampToValueAtTime(0.0001, now + (dur || 0.16));
      o.start(now); o.stop(now + (dur || 0.16) + 0.05);
    } catch (e) { /* noop */ }
  },
};

/* ---------------------------------------------------------------- theory */
const MAJOR_STEPS = [0, 2, 4, 5, 7, 9, 11];
const MINOR_STEPS = [0, 2, 3, 5, 7, 8, 10];
/* How each pitch class is spelled, sharp-side and flat-side: letter 0..6 = C..B. */
const SHARP_LETTER = [0, 0, 1, 1, 2, 3, 3, 4, 4, 5, 5, 6];
const SHARP_ALTER  = [0, 1, 0, 1, 0, 0, 1, 0, 1, 0, 1, 0];
const FLAT_LETTER  = [0, 1, 1, 2, 2, 3, 4, 4, 5, 5, 6, 6];
const FLAT_ALTER   = [0, -1, 0, -1, 0, 0, -1, 0, -1, 0, -1, 0];
/* The order sharps and flats appear in a key signature, as letter indices. */
const SHARP_ORDER = [3, 0, 4, 1, 5, 2, 6];   // F C G D A E B
const FLAT_ORDER  = [6, 2, 5, 1, 4, 0, 3];   // B E A D G C F

function tonicPc(key, mode){
  let pc = (((key * 7) % 12) + 12) % 12;
  if (mode === 'minor') pc = (pc + 9) % 12;
  return pc;
}
function scaleOf(def){
  const t = tonicPc(def.key, def.mode);
  const steps = def.mode === 'minor' ? MINOR_STEPS : MAJOR_STEPS;
  return steps.map((s) => (t + s) % 12);
}
/* The diatonic triads worth writing, with the leading note raised for the
   dominant of a minor key so the cadence actually cadences. */
function triadsOf(def){
  const sc = scaleOf(def);
  const minor = def.mode === 'minor';
  const out = [];
  for (let d = 0; d < 7; d++){
    if (d === 6) continue;                                   // no diminished triads
    let pcs = [sc[d], sc[(d + 2) % 7], sc[(d + 4) % 7]];
    if (minor && d === 4) pcs = [sc[4], (sc[4] + 4) % 12, sc[(d + 4) % 7]];
    out.push({ deg:d, pcs });
  }
  return out;
}
/* Progressions a harmony teacher would not complain about cost nothing. */
const GOOD_MOVES = new Set(['4>0','3>4','1>4','5>1','5>3','0>3','0>4','0>5','2>5',
                            '3>0','0>1','4>5','5>4','2>4','3>1']);
function moveCost(a, b){
  if (a === b) return 0.22;                 // staying put is fine, just not free
  if (GOOD_MOVES.has(a + '>' + b)) return 0;
  if (a === 4 && b === 3) return 0.95;      // V back to IV is the one to avoid
  return 0.5;
}

/* Lay the melody out in absolute beats. */
function layMelody(def){
  const out = [];
  const syl = def.text.split(/\s+/);
  let at = 0;
  for (let i = 0; i < def.mel.length; i++){
    out.push({ midi:def.mel[i][0], at, dur:def.mel[i][1], lyric:syl[i] || '' });
    at += def.mel[i][1];
  }
  return out;
}

/* Chop the piece into harmonic spans: one chord per bar in triple time, one
   per half bar in common time, with the pickup getting its own short span. */
function spansOf(def, total){
  const step = def.meter === 3 ? 3 : 2;
  const spans = [];
  let at = 0;
  if (def.pickup){ spans.push({ at:0, dur:def.pickup }); at = def.pickup; }
  while (at < total - 1e-9){
    spans.push({ at, dur: Math.min(step, total - at) });
    at += step;
  }
  return spans;
}

/* Viterbi over the spans: pick the chord sequence that best explains the tune. */
function harmonise(def, melody, spans){
  const triads = triadsOf(def);
  const last = spans.length - 1;
  const emit = (span, i, tri) => {
    let cost = 0, weight = 0;
    for (const n of melody){
      const ov = Math.min(n.at + n.dur, span.at + span.dur) - Math.max(n.at, span.at);
      if (ov <= 1e-9) continue;
      weight += ov;
      const pc = ((n.midi % 12) + 12) % 12;
      if (tri.pcs.indexOf(pc) >= 0) continue;
      cost += ov * (n.dur <= 1 ? 0.55 : 2.0);       // short notes may pass through
    }
    if (weight > 0) cost /= weight;
    if (i === 0) cost += tri.deg === 0 ? 0 : 2.4;                    // open on the tonic
    if (i === last) cost += tri.deg === 0 ? 0 : 3.0;                 // and close on it
    if (i === last - 1) cost += (tri.deg === 4 || tri.deg === 3) ? 0 : 0.7;
    return cost;
  };
  const N = triads.length;
  let prev = triads.map((t, k) => ({ cost: emit(spans[0], 0, t), from: -1, k }));
  const back = [prev.map(() => -1)];
  for (let i = 1; i < spans.length; i++){
    const cur = [];
    const row = [];
    for (let k = 0; k < N; k++){
      let best = Infinity, bestFrom = 0;
      for (let j = 0; j < N; j++){
        const c = prev[j].cost + moveCost(triads[j].deg, triads[k].deg);
        if (c < best){ best = c; bestFrom = j; }
      }
      cur.push({ cost: best + emit(spans[i], i, triads[k]), from: bestFrom, k });
      row.push(bestFrom);
    }
    back.push(row);
    prev = cur;
  }
  let k = 0;
  for (let j = 1; j < N; j++) if (prev[j].cost < prev[k].cost) k = j;
  const chosen = new Array(spans.length);
  for (let i = spans.length - 1; i >= 0; i--){ chosen[i] = triads[k]; k = back[i][k]; }
  return chosen;
}

/* The nearest midi with a given pitch class, inside a range and near a target. */
function nearestPc(pc, target, lo, hi){
  let best = null, bestD = Infinity;
  for (let m = lo; m <= hi; m++){
    if ((((m % 12) + 12) % 12) !== pc) continue;
    const d = Math.abs(m - target);
    if (d < bestD){ bestD = d; best = m; }
  }
  return best;
}

/* Alto, tenor and bass under the tune: chord tones, in range, moving as little
   as they have to. Chosen strictly top down — each part's ceiling is the part
   above it — so the voices can never cross, which no amount of luck in the
   chord picker would otherwise guarantee. */
function voiceParts(def, melody, spans, chords){
  const A = [], T = [], B = [];
  let pa = 67, pt = 55, pb = 48;
  /* Nearest chord tone to `target`, inside [lo,hi]; widens rather than fail. */
  const pickTone = (pcs, target, lo, hi, avoid) => {
    let best = null, bestD = Infinity;
    for (const pc of pcs){
      const m = nearestPc(pc, target, lo, hi);
      if (m == null) continue;
      const d = Math.abs(m - target) + (avoid && avoid.indexOf(pc) >= 0 ? 5 : 0);
      if (d < bestD){ bestD = d; best = m; }
    }
    return best;
  };
  for (let i = 0; i < spans.length; i++){
    const sp = spans[i], ch = chords[i];
    let sopLow = PART_DEFS[0].hi;
    for (const n of melody){
      const ov = Math.min(n.at + n.dur, sp.at + sp.dur) - Math.max(n.at, sp.at);
      if (ov > 1e-9) sopLow = Math.min(sopLow, n.midi);
    }
    // alto: the highest chord tone that still sits at or under the sopranos
    const aHi = clamp(sopLow, PART_DEFS[1].lo, PART_DEFS[1].hi);
    let alto = pickTone(ch.pcs, Math.min(pa, aHi), PART_DEFS[1].lo, aHi);
    if (alto == null) alto = pickTone(ch.pcs, aHi, 48, aHi);
    if (alto == null) alto = aHi;
    // tenor: under the alto, filling whatever tone of the triad is missing
    const tHi = clamp(alto, PART_DEFS[2].lo, PART_DEFS[2].hi);
    let tenor = pickTone(ch.pcs, Math.min(pt, tHi), PART_DEFS[2].lo, tHi,
                         [(((alto % 12) + 12) % 12)]);
    if (tenor == null) tenor = pickTone(ch.pcs, tHi, 40, tHi);
    if (tenor == null) tenor = tHi;
    // bass: the root, under the tenor
    const bHi = clamp(tenor, PART_DEFS[3].lo, PART_DEFS[3].hi);
    let bass = nearestPc(ch.pcs[0], Math.min(pb, bHi), PART_DEFS[3].lo, bHi);
    if (bass == null) bass = nearestPc(ch.pcs[0], bHi, 28, bHi);
    if (bass == null) bass = pickTone(ch.pcs, bHi, PART_DEFS[3].lo, bHi);
    if (bass == null) bass = bHi;
    A.push({ midi:alto, at:sp.at, dur:sp.dur });
    T.push({ midi:tenor, at:sp.at, dur:sp.dur });
    B.push({ midi:bass, at:sp.at, dur:sp.dur });
    pa = alto; pt = tenor; pb = bass;
  }
  return [A, T, B].map(tie);
}
/* Two spans on the same note are one longer note, not two. */
function tie(list){
  const out = [];
  for (const n of list){
    const p = out[out.length - 1];
    if (p && p.midi === n.midi && Math.abs(p.at + p.dur - n.at) < 1e-9) p.dur += n.dur;
    else out.push({ midi:n.midi, at:n.at, dur:n.dur });
  }
  return out;
}

const PIECE_CACHE = {};
function buildPiece(id){
  if (PIECE_CACHE[id]) return PIECE_CACHE[id];
  const def = REP_BY_ID[id];
  if (!def) throw new Error('unknown piece ' + id);
  const melody = layMelody(def);
  const total = melody.reduce((a, n) => a + n.dur, 0);
  const spans = spansOf(def, total);
  const chords = harmonise(def, melody, spans);
  const [A, T, B] = voiceParts(def, melody, spans, chords);
  const piece = {
    def, id, title:def.title, composer:def.composer, origin:def.origin,
    key:def.key, mode:def.mode, meter:def.meter, tempo:def.tempo, pickup:def.pickup || 0,
    totalBeats:total, chords, spans,
    barOffset: ((def.meter - (def.pickup || 0)) % def.meter + def.meter) % def.meter,
    voices:[melody, A, T, B],
  };
  PIECE_CACHE[id] = piece;
  return piece;
}

/* Which note a part is on at a musical position, wrapping round the excerpt. */
function noteOf(piece, part, beat){
  const list = piece.voices[part];
  let b = beat % piece.totalBeats;
  if (b < 0) b += piece.totalBeats;
  for (let i = 0; i < list.length; i++){
    const n = list[i];
    if (b >= n.at - 1e-9 && b < n.at + n.dur - 1e-9) return n;
  }
  return list[list.length - 1];
}
/* All four written pitches at a musical position. */
function noteAt(piece, beat){
  const out = [];
  for (let i = 0; i < 4; i++) out.push(noteOf(piece, i, beat).midi);
  return out;
}
/* Where the bar lines fall, allowing for a pickup. */
const barIndexAt = (piece, beat) => Math.floor((beat + piece.barOffset) / piece.meter);
const isBarLine = (piece, beat) =>
  Math.abs(((beat + piece.barOffset) % piece.meter + piece.meter) % piece.meter) < 1e-6;

/* Pick a piece for a category, without handing the same choir the same tune. */
function pickPiece(flavour, used){
  const want = CAT_MOODS[flavour] || ['hymn'];
  const fits = REPERTOIRE.filter((r) => r.moods.some((m) => want.indexOf(m) >= 0));
  const pool = (fits.length ? fits : REPERTOIRE).filter((r) => !used || !used.has(r.id));
  const from = pool.length ? pool : (fits.length ? fits : REPERTOIRE);
  return buildPiece(from[Math.floor(rng() * from.length)].id);
}

/* ============================================================ competition */

function makeChoirName(){
  const a = pick(NAME_A), b = pick(NAME_B), c = pick(NAME_C);
  return (a + ' ' + b + (c ? ' ' + c : '')).trim();
}

function makeChoir(stageIdx, seatIdx, used){
  const st = STAGES[stageIdx];
  const cat = pick(CATEGORIES);
  const country = pick(COUNTRIES);
  const quality = clamp(0.30 + st.diff * 0.5 + rnd(-0.18, 0.22), 0, 1);
  // A better choir goes wrong less often and less badly. Quality never moves
  // the top of the card, only what comes off it — so a player who hears
  // everything and marks it can land exactly on the truth.
  const nFlaws = clamp(3 + Math.round(st.diff * 3 - quality * 1.6) + rint(-1, 1), 2, 7);
  // The programme is however long the piece is: sing the excerpt, repeating it
  // if it is short, so nobody is cut off mid-phrase.
  const piece = pickPiece(cat.flavour, used);
  const once = (piece.totalBeats / piece.tempo) * 60;
  const repeats = Math.max(1, Math.ceil(30 / once));
  const dur = Math.min(46, once * repeats);

  // Pick flaws, no two of the same criterion overlapping, spaced out in time.
  const chosen = [];
  const pool = FLAWS.slice();
  let guard = 0;
  while (chosen.length < nFlaws && guard++ < 200){
    const f = pool[Math.floor(rng() * pool.length)];
    const d = f.dur * (1 - st.diff * 0.42);
    const at = rnd(2.4, dur - d - 1.6);
    const clash = chosen.some((o) =>
      o.def.crit === f.crit && at < o.at + o.dur + 0.8 && o.at < at + d + 0.8);
    if (clash) continue;
    if (chosen.some((o) => o.def.id === f.id)) continue;
    const sev = Math.round(f.sev * (0.75 + rng() * 0.5) * (1 - quality * 0.25) * 10) / 10;
    const inst = { def:f, at, dur:d, sev, part:-1,
      caught:false, catchT:0, missed:false, sharp:0 };
    if (f.setup) f.setup(inst);
    chosen.push(inst);
  }
  chosen.sort((a, b) => a.at - b.at);

  // The truth: every choir starts at the same place on the card and pays for
  // exactly what went wrong. CARD_TOP is public knowledge — the player's own
  // suggested score is built from it — so hearing everything means landing on
  // the truth, and the dial is only there for what you are unsure about.
  let truth = CARD_TOP;
  for (const f of chosen) truth -= f.sev;
  truth = Math.round(clamp(truth, 9, 30) * 10) / 10;

  return {
    id: stageIdx + ':' + seatIdx,
    stage: stageIdx, seat: seatIdx,
    name: makeChoirName(), country, cat,
    venue: pick(VENUES),
    piece, repeats,
    flaws: chosen, dur, quality,
    truth: Math.round(truth * 10) / 10,
    favourite: rng() < (stageIdx === 0 ? 0.25 : 0.45),   // the hall already loves them
    singers: 18 + rint(0, 14),
  };
}

function buildCompetition(){
  G.field = [];
  // No two choirs in a round bring the same piece if the shelf can avoid it.
  for (let s = 0; s < STAGES.length; s++){
    const used = new Set();
    for (let i = 0; i < STAGES[s].choirs; i++){
      const c = makeChoir(s, i, used);
      used.add(c.piece.id);
      G.field.push(c);
    }
  }
}
const totalChoirs = () => STAGES.reduce((n, s) => n + s.choirs, 0);
function choirAt(stage, idx){
  return G.field.find((c) => c.stage === stage && c.seat === idx) || null;
}

/* ------------------------------------------------------------- the jurors */
/* Each juror produces a score for a choir. They are not random noise: they
   are consistently wrong in their own direction, which is the whole point. */
function jurorScore(juror, choir){
  const t = choir.truth;
  let s = t;
  switch (juror.style){
    case 'hawk':   s = t - 1.3 - choir.quality * 0.4; break;
    case 'dove':   s = t + 1.6 - (t > 27 ? 0.8 : 0); break;
    case 'crowd':  s = t + (choir.favourite ? 2.2 : -0.7); break;
    case 'pedant': s = t - 0.35; break;
    default: break;
  }
  // A little hearing error, deterministic per juror+choir so the panel never
  // changes its mind between renders.
  const h = hash32(juror.id + '|' + choir.id);
  s += ((h % 1000) / 1000 - 0.5) * 1.1;
  return clamp(Math.round(s * 10) / 10, 8, 30);
}
function hash32(str){
  let h = 2166136261;
  for (let i = 0; i < str.length; i++){ h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); }
  return h >>> 0;
}

/* The panel result: drop the highest and the lowest, average the middle
   three. That is genuinely how a five-judge card is usually resolved. */
function trimmedMean(scores){
  if (scores.length < 3) return scores.reduce((a, b) => a + b, 0) / Math.max(1, scores.length);
  const s = scores.slice().sort((a, b) => a - b);
  const mid = s.slice(1, s.length - 1);
  return Math.round((mid.reduce((a, b) => a + b, 0) / mid.length) * 10) / 10;
}

/* ============================================================ performance */

function startChoir(){
  const c = choirAt(G.stage, G.idx);
  if (!c){ finishStage(); return; }
  G.cur = c;
  G.card = null;
  G.myScore = 25;
  setPhase('brief');
}

function beginPerformance(){
  const c = G.cur;
  G.perf = {
    t:0, dur:c.dur, bar:0, beat:0, beatF:0, musT:0,
    caught:[], phantoms:[], cool:{}, active:[],
    flash:{}, lastPress:{},
  };
  for (const f of c.flaws){ f.caught = false; f.catchT = 0; f.missed = false; }
  for (const p of PARTS){
    p.cents = 0; p.gain = 1; p.bright = 0; p.air = 0; p.lag = 0; p.rogue = 0;
    p.midi = p.def.lo; p.targetMidi = p.def.lo;
  }
  SING.tempoMul = 1; SING.expression = 1; SING.phrasing = 1; SING.life = 1; SING.level = 0;
  AUDIO.resume();
  setPhase('perform');
}

/* A flaw's intensity: fades in over the first 18% and out over the last 22%. */
function flawIntensity(f, t){
  if (t < f.at || t > f.at + f.dur) return 0;
  const u = (t - f.at) / f.dur;
  if (u < 0.18) return u / 0.18;
  if (u > 0.78) return (1 - u) / 0.22;
  return 1;
}

function perfTick(dt){
  const P = G.perf, c = G.cur;
  if (!P || !c) return;
  P.t += dt;

  // ---- reset part state, then let every live flaw bend it -----------------
  SING.tempoMul = 1; SING.expression = 1; SING.phrasing = 1; SING.life = 1;
  for (const p of PARTS){ p.cents = 0; p.gain = 1; p.bright = 0; p.air = 0; p.lag = 0; p.rogue = 0; p.wrongBy = 0; }
  P.active.length = 0;
  for (const f of c.flaws){
    const k = flawIntensity(f, P.t);
    if (k > 0){
      P.active.push(f);
      f.def.apply(f, PARTS, k, SING);
    } else if (!f.missed && !f.caught && P.t > f.at + f.dur){
      f.missed = true;
    }
  }

  // ---- musical clock ------------------------------------------------------
  const piece = c.piece;
  const bps = (piece.tempo / 60) * SING.tempoMul;
  P.musT += dt * bps;
  P.bar = barIndexAt(piece, P.musT);
  P.beat = Math.floor(P.musT) % piece.meter;
  P.beatF = P.musT - Math.floor(P.musT);

  // The phrase shape: a slow arch across the excerpt, flattened when the
  // artistry drains out of the singing.
  const through = (P.musT % piece.totalBeats) / piece.totalBeats;
  const dyn = 0.55 + 0.45 * Math.sin(through * Math.PI);
  SING.level = lerp(0.62, dyn, SING.phrasing) * lerp(0.55, 1, SING.expression);

  // Each part sits on its own written note, at its own (possibly lagged) place
  // in the bar. `written` is what the score says; `midi` is what comes out.
  for (let i = 0; i < PARTS.length; i++){
    const p = PARTS[i];
    const lagB = P.musT - p.lag * bps;
    const n = noteOf(piece, i, lagB);
    p.written = n.midi;
    p.targetMidi = n.midi + (p.wrongBy || 0);
    p.midi += (p.targetMidi - p.midi) * Math.min(1, dt * 13);
    p.at = lagB;
    // Articulation: a fresh note starts with a consonant and blooms.
    let into = (lagB % piece.totalBeats) - n.at;
    if (into < 0) into += piece.totalBeats;
    p.since = into;
    p.artic = clamp(0.30 + into * 2.6, 0, 1) * (1 - 0.25 * Math.max(0, 1 - into * 3));
    p.mouth = (0.30 + 0.55 * p.artic) * SING.level * lerp(0.5, 1, SING.life);
    p.sway = Math.sin(P.musT * 0.9 + i * 1.3) * lerp(0.25, 1, SING.life);
  }
  // The vowel everybody is on comes from the syllable the sopranos are singing.
  P.syllable = noteOf(piece, 0, P.musT).lyric || '';
  SING.vowel = vowelOf(P.syllable);

  // ---- key cooldowns ------------------------------------------------------
  for (const k in P.cool) P.cool[k] = Math.max(0, P.cool[k] - dt);
  for (const k in P.flash) P.flash[k] = Math.max(0, P.flash[k] - dt);

  if (P.t >= c.dur) endPerformance();
}

/* The player marks a criterion. */
function flagCrit(critId){
  if (G.phase !== 'perform' || G.paused) return null;
  const P = G.perf, c = G.cur;
  if (!P) return null;
  if ((P.cool[critId] || 0) > 0) return null;
  P.cool[critId] = 0.28;

  const win = STAGES[G.stage].win;
  // A live flaw on this criterion — or one that ended within the grace window.
  let hit = null;
  for (const f of c.flaws){
    if (f.def.crit !== critId || f.caught) continue;
    const early = P.t >= f.at - 0.25;
    const late  = P.t <= f.at + f.dur + Math.min(1.1, win * 0.35);
    if (early && late){ hit = f; break; }
  }
  if (hit){
    hit.caught = true;
    hit.catchT = P.t;
    // Reaction bonus: catching it while it is still arriving is worth more.
    const react = clamp((P.t - hit.at) / Math.max(0.6, hit.dur), 0, 1.4);
    hit.sharp = clamp(1 - react * 0.7, 0, 1);
    P.caught.push(hit);
    P.flash[critId] = 0.5;
    G.shake = Math.min(6, G.shake + 2);
    AUDIO.blip(660 + hit.sharp * 260, 0.13, 'triangle');
    spawnFx({ kind:'mark', crit:critId, x:critX(critId), y:VH - 96, vy:-42, life:1.1,
      text:fmtFlaw(hit) });
    return hit;
  }
  // Nothing there. You have written down something that did not happen.
  const ph = { crit:critId, t:P.t };
  P.phantoms.push(ph);
  P.flash[critId] = 0.24;
  AUDIO.blip(150, 0.1, 'sawtooth');
  spawnFx({ kind:'phantom', crit:critId, x:critX(critId), y:VH - 96, vy:-26, life:0.8 });
  return null;
}

function fmtFlaw(f){
  const part = f.part >= 0 ? PART_DEFS[f.part].plural : '';
  return f.def.label.replace('{part}', part || 'The choir');
}
function fmtNote(f){
  const part = f.part >= 0 ? PART_DEFS[f.part].name.toLowerCase() : '';
  return f.def.note.replace(/\{part\}/g, part || 'ensemble');
}

function endPerformance(){
  const P = G.perf, c = G.cur;
  let deduct = 0;
  for (const f of P.caught) deduct += f.sev;
  const phantomCost = P.phantoms.length * PHANTOM_COST;
  // The card the player's own notes suggest. They can still override it.
  const suggested = clamp(CARD_TOP - deduct - phantomCost, 8, 30);
  G.myScore = Math.round(suggested * 2) / 2;
  G.card = {
    caught: P.caught.slice(),
    missed: c.flaws.filter((f) => !f.caught),
    phantoms: P.phantoms.slice(),
    suggested: Math.round(suggested * 10) / 10,
  };
  for (const p of PARTS){ p.gain = 1; p.cents = 0; p.bright = 0; p.air = 0; }
  setPhase('deliberate');
}

/* The player locks their score; the panel reveals; the diploma is awarded. */
function submitScore(){
  if (G.phase !== 'deliberate') return;
  const c = G.cur;
  const mine = G.myScore;
  const others = JURORS.map((j) => ({ juror:j, score: jurorScore(j, c) }));
  const all = others.map((o) => o.score).concat([mine]);
  const panel = trimmedMean(all);
  const panelNoMe = trimmedMean(others.map((o) => o.score));

  const accuracy = clamp(1 - Math.abs(mine - c.truth) / 5, 0, 1);
  const total = c.flaws.length || 1;
  const attention = clamp(
    (G.card.caught.length / total) - (G.card.phantoms.length * 0.12), 0, 1);

  // Integrity: the panel drifted off the truth, and you were the one closer to it.
  const panelErr = Math.abs(panelNoMe - c.truth);
  const myErr = Math.abs(mine - c.truth);
  let integrity = 0.5;
  if (panelErr > 1.0) integrity = clamp(0.5 + (panelErr - myErr) / 3, 0, 1);
  else integrity = clamp(1 - myErr / 3, 0, 1);

  G.acc.push(accuracy); G.att.push(attention); G.integ.push(integrity);

  const entry = {
    choir:c, mine, others, panel, panelNoMe, truth:c.truth,
    band: bandFor(panel), accuracy, attention, integrity,
    caught:G.card.caught.length, total, phantoms:G.card.phantoms.length,
  };
  G.log.push(entry);
  G.result = entry;
  AUDIO.cheer(clamp(0.35 + (panel - 18) / 16, 0.2, 1));
  setPhase('panel');
}

function finishStage(){
  G.stage++;
  if (G.stage >= STAGES.length) setPhase('results');
  else { G.idx = 0; setPhase('round'); }
}

function nextChoir(){
  G.idx++;
  if (G.idx >= STAGES[G.stage].choirs) finishStage();
  else startChoir();
}

const avg = (a) => (a.length ? a.reduce((x, y) => x + y, 0) / a.length : 0);
function overallScore(){
  return clamp(avg(G.acc) * 0.45 + avg(G.att) * 0.30 + avg(G.integ) * 0.25, 0, 1);
}
function rankFor(v){
  for (const r of RANKS) if (v >= r.min) return r;
  return RANKS[RANKS.length - 1];
}
/* The choir the whole competition crowns, by panel score. */
function championOfTheGames(){
  let best = null;
  for (const e of G.log) if (!best || e.panel > best.panel) best = e;
  return best;
}

/* ================================================================= saving */
function loadSave(){
  try {
    const raw = localStorage.getItem(SAVE_KEY);
    if (!raw) return;
    const s = JSON.parse(raw);
    if (s && typeof s === 'object'){
      G.best = s.best || null;
      G.firstRun = s.firstRun !== false ? (s.seen ? false : true) : false;
      if (s.seen) G.firstRun = false;
    }
  } catch (e) { /* a broken save must never block the door */ }
}
function writeSave(){
  try {
    localStorage.setItem(SAVE_KEY, JSON.stringify({ best:G.best, seen:true }));
  } catch (e) { /* noop */ }
}
function recordBest(){
  const v = overallScore();
  const r = rankFor(v);
  if (!G.best || v > G.best.score) G.best = { score:v, rank:r.name, at:G.log.length };
  writeSave();
}

/* ============================================================ phase plumbing */
function setPhase(p){
  G.phase = p;
  G.t = 0;
  if (p === 'results') recordBest();
}
function startRun(){
  reseed((SEED ^ (G.log.length * 7919 + 13)) >>> 0);
  G.stage = 0; G.idx = 0; G.log = []; G.acc = []; G.att = []; G.integ = [];
  G.result = null;
  buildCompetition();
  setPhase('parade');
}

/* ================================================================ layout */
const CRIT_W = 176, CRIT_GAP = 12;
const CRIT_X0 = (VW - (CRITS.length * CRIT_W + (CRITS.length - 1) * CRIT_GAP)) / 2;
function critX(id){
  const i = CRITS.findIndex((c) => c.id === id);
  return CRIT_X0 + i * (CRIT_W + CRIT_GAP) + CRIT_W / 2;
}
function critRect(i){
  return { x: CRIT_X0 + i * (CRIT_W + CRIT_GAP), y: VH - 86, w: CRIT_W, h: 64 };
}
const inRect = (r, x, y) => x >= r.x && x <= r.x + r.w && y >= r.y && y <= r.y + r.h;

/* ================================================================ drawing */
function fit(){
  const w = window.innerWidth, h = window.innerHeight;
  DPR = Math.min(2, window.devicePixelRatio || 1);
  SCALE = Math.min(w / VW, h / VH);
  cv.width = Math.round(VW * SCALE * DPR);
  cv.height = Math.round(VH * SCALE * DPR);
  cv.style.width = Math.round(VW * SCALE) + 'px';
  cv.style.height = Math.round(VH * SCALE) + 'px';
}
function toVirtual(clientX, clientY){
  const r = cv.getBoundingClientRect();
  return { x: (clientX - r.left) / (r.width || 1) * VW, y: (clientY - r.top) / (r.height || 1) * VH };
}

function rr(x, y, w, h, r){
  const k = Math.min(r, w / 2, h / 2);
  ctx.beginPath();
  ctx.moveTo(x + k, y);
  ctx.arcTo(x + w, y, x + w, y + h, k);
  ctx.arcTo(x + w, y + h, x, y + h, k);
  ctx.arcTo(x, y + h, x, y, k);
  ctx.arcTo(x, y, x + w, y, k);
  ctx.closePath();
}
function txt(s, x, y, size, col, align, weight){
  ctx.fillStyle = col || '#f2eeff';
  ctx.font = (weight || 600) + ' ' + size + 'px "Segoe UI",system-ui,sans-serif';
  ctx.textAlign = align || 'left';
  ctx.textBaseline = 'alphabetic';
  ctx.fillText(s, x, y);
}
/* Trims a label to fit a column, so a long flaw name never runs into the
   number sitting at the end of its row. */
function clipTxt(s, maxW, size, weight){
  ctx.font = (weight || 600) + ' ' + size + 'px "Segoe UI",system-ui,sans-serif';
  if (ctx.measureText(s).width <= maxW) return s;
  let out = s;
  while (out.length > 2 && ctx.measureText(out + '…').width > maxW) out = out.slice(0, -1);
  return out + '…';
}
function wrapTxt(s, x, y, maxW, size, col, lh, align){
  ctx.font = '400 ' + size + 'px "Segoe UI",system-ui,sans-serif';
  ctx.fillStyle = col; ctx.textAlign = align || 'left';
  const words = String(s).split(' ');
  let line = '', yy = y;
  for (const w of words){
    const test = line ? line + ' ' + w : w;
    if (ctx.measureText(test).width > maxW && line){ ctx.fillText(line, x, yy); line = w; yy += lh || size + 6; }
    else line = test;
  }
  if (line) ctx.fillText(line, x, yy);
  return yy;
}

function drawFlag(c, x, y, w, h){
  const f = c.f;
  ctx.save();
  ctx.beginPath(); ctx.rect(x, y, w, h); ctx.clip();
  switch (c.t){
    case 'h2':
      ctx.fillStyle = f[0]; ctx.fillRect(x, y, w, h / 2);
      ctx.fillStyle = f[1]; ctx.fillRect(x, y + h / 2, w, h / 2); break;
    case 'h3':
      for (let i = 0; i < 3; i++){ ctx.fillStyle = f[i]; ctx.fillRect(x, y + h * i / 3, w, h / 3 + 1); } break;
    case 'v3':
      for (let i = 0; i < 3; i++){ ctx.fillStyle = f[i]; ctx.fillRect(x + w * i / 3, y, w / 3 + 1, h); } break;
    case 'nordic':
      ctx.fillStyle = f[0]; ctx.fillRect(x, y, w, h);
      ctx.fillStyle = f[1];
      ctx.fillRect(x + w * 0.30, y, w * 0.16, h);
      ctx.fillRect(x, y + h * 0.40, w, h * 0.20); break;
    case 'nordic3':
      ctx.fillStyle = f[0]; ctx.fillRect(x, y, w, h);
      ctx.fillStyle = f[1];
      ctx.fillRect(x + w * 0.27, y, w * 0.22, h);
      ctx.fillRect(x, y + h * 0.36, w, h * 0.28);
      ctx.fillStyle = f[2];
      ctx.fillRect(x + w * 0.33, y, w * 0.10, h);
      ctx.fillRect(x, y + h * 0.43, w, h * 0.14); break;
    case 'sun':
      ctx.fillStyle = f[0]; ctx.fillRect(x, y, w, h);
      ctx.fillStyle = f[1];
      ctx.beginPath(); ctx.arc(x + w / 2, y + h / 2, Math.min(w, h) * 0.30, 0, Math.PI * 2); ctx.fill(); break;
    default:
      ctx.fillStyle = f[0] || '#555'; ctx.fillRect(x, y, w, h);
  }
  ctx.restore();
  ctx.strokeStyle = 'rgba(255,255,255,.28)'; ctx.lineWidth = 1;
  ctx.strokeRect(x + 0.5, y + 0.5, w - 1, h - 1);
}

/* ---------------------------------------------------------------- the hall */
/* Staging, front to back. Row 0 (soprano) stands nearest the audience, so it
   is the widest, the lowest on screen and the largest; each row behind steps
   up a riser, narrows, and shrinks. */
const STAGE_FRONT = 402;   // baseline of the front row
const ROW_DY = 38;         // how much higher each row behind sits
const ROW_INSET = 104;     // side inset of the front row
const ROW_STEP = 26;       // extra inset for each row further back
const rowY = (d) => STAGE_FRONT - d * ROW_DY;
const rowInset = (d) => ROW_INSET + d * ROW_STEP;
const rowSize = (d) => 16 - d * 1.15;

function drawHall(){
  const g = ctx.createLinearGradient(0, 0, 0, VH);
  g.addColorStop(0, '#0d0a16'); g.addColorStop(0.55, '#160f22'); g.addColorStop(1, '#08060e');
  ctx.fillStyle = g; ctx.fillRect(0, 0, VW, VH);

  // proscenium arch
  ctx.fillStyle = '#0a0812';
  ctx.fillRect(0, 0, 62, VH); ctx.fillRect(VW - 62, 0, 62, VH);
  ctx.fillStyle = '#171129';
  ctx.fillRect(52, 0, 12, VH); ctx.fillRect(VW - 64, 0, 12, VH);

  // house lights / spots washing the stage
  for (let i = 0; i < 3; i++){
    const sx = VW / 2 + (i - 1) * 210;
    const sg = ctx.createRadialGradient(sx, 40, 10, sx, 380, 340);
    const warm = i === 1 ? 'rgba(255,226,180,.16)' : 'rgba(190,180,255,.10)';
    sg.addColorStop(0, warm); sg.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = sg;
    ctx.beginPath(); ctx.moveTo(sx - 26, 0); ctx.lineTo(sx + 26, 0);
    ctx.lineTo(sx + 200, 420); ctx.lineTo(sx - 200, 420); ctx.closePath(); ctx.fill();
  }

  // the arch at the back of the platform, with an organ behind it
  const archL = 168, archR = VW - 168, archTop = 268, archBase = 470;
  const arch = () => {
    ctx.beginPath();
    ctx.moveTo(archL, archBase); ctx.lineTo(archL, 352);
    ctx.quadraticCurveTo(VW / 2, archTop, archR, 352);
    ctx.lineTo(archR, archBase);
  };
  ctx.save();
  arch(); ctx.closePath(); ctx.clip();
  const wg = ctx.createLinearGradient(0, archTop, 0, archBase);
  wg.addColorStop(0, '#1d1636'); wg.addColorStop(1, '#0e0a1a');
  ctx.fillStyle = wg; ctx.fill();
  for (let i = 0; i < 28; i++){
    const px = 186 + i * 24;
    const ph = 46 + Math.abs(Math.sin(i * 0.63)) * 62;
    ctx.fillStyle = i % 2 ? 'rgba(255,235,200,.055)' : 'rgba(255,235,200,.028)';
    ctx.fillRect(px, 356 - ph, 15, ph);
    ctx.fillStyle = 'rgba(255,235,200,.08)';
    ctx.fillRect(px, 356 - ph, 15, 3);
  }
  ctx.restore();
  ctx.strokeStyle = 'rgba(255,235,200,.09)'; ctx.lineWidth = 2;
  arch(); ctx.stroke();

  // risers, back row first so the front ones overlap them
  for (let d = 3; d >= 0; d--){
    const y = rowY(d);
    const inset = rowInset(d) - 26;
    ctx.fillStyle = d % 2 ? '#1b1430' : '#181128';
    ctx.fillRect(inset, y, VW - inset * 2, ROW_DY + 8);
    ctx.fillStyle = 'rgba(255,255,255,.055)';
    ctx.fillRect(inset, y, VW - inset * 2, 2);
    ctx.fillStyle = 'rgba(0,0,0,.30)';
    ctx.fillRect(inset, y + ROW_DY + 6, VW - inset * 2, 2);
  }
  // stage floor in front of the choir, where the conductor stands
  const fg = ctx.createLinearGradient(0, STAGE_FRONT + ROW_DY, 0, VH);
  fg.addColorStop(0, '#120d1f'); fg.addColorStop(1, '#07050d');
  ctx.fillStyle = fg;
  ctx.fillRect(0, STAGE_FRONT + ROW_DY + 8, VW, VH - STAGE_FRONT - ROW_DY - 8);

  // the backs of a few heads in the stalls, just in front of you
  ctx.fillStyle = '#07050c';
  for (let i = 0; i < 22; i++){
    const x = 26 + i * 45 + ((i % 3) * 6);
    const y = 556 + (i % 2) * 7;
    ctx.beginPath(); ctx.arc(x, y, 13, 0, Math.PI * 2); ctx.fill();
    ctx.fillRect(x - 16, y + 8, 32, 40);
  }
}

/* One singer. Everything about them is read off their part's live state. */
function drawSinger(x, y, s, p, tell){
  const off = -(p.cents / 100) * 9 * tell;               // flat = physically sags
  const yy = y + off + Math.sin(p.sway + x * 0.02) * 1.6;
  const glow = clamp((p.gain - 1) * 0.7, -0.6, 1.2) * tell;
  const heat = clamp(p.bright, 0, 2) * tell;
  const fade = clamp(1 - p.air * 0.5 * tell, 0.35, 1);

  let col = p.def.col;
  if (heat > 0.05) col = mixHex(col, '#fff3b0', Math.min(0.85, heat * 0.5));
  const dead = 1 - clamp(SING.life, 0, 1);
  if (dead > 0.02) col = mixHex(col, '#6f6a80', dead * 0.75);

  ctx.globalAlpha = fade * clamp(0.55 + p.gain * 0.45, 0.18, 1);
  if (glow > 0.04){
    ctx.fillStyle = 'rgba(255,255,255,' + (0.10 * glow).toFixed(3) + ')';
    ctx.beginPath(); ctx.arc(x, yy - s * 0.5, s * (1.6 + glow), 0, Math.PI * 2); ctx.fill();
  }
  // gown
  ctx.fillStyle = mixHex('#241a3a', col, 0.18);
  ctx.beginPath();
  ctx.moveTo(x - s * 0.62, yy + s * 1.5);
  ctx.lineTo(x - s * 0.42, yy - s * 0.05);
  ctx.lineTo(x + s * 0.42, yy - s * 0.05);
  ctx.lineTo(x + s * 0.62, yy + s * 1.5);
  ctx.closePath(); ctx.fill();
  // head
  ctx.fillStyle = col;
  ctx.beginPath(); ctx.arc(x, yy - s * 0.55, s * 0.46, 0, Math.PI * 2); ctx.fill();
  // mouth — opens with the note, and lags when the part is behind the beat
  const m = clamp(p.mouth, 0, 1);
  ctx.fillStyle = 'rgba(20,10,26,.85)';
  ctx.beginPath();
  ctx.ellipse(x, yy - s * 0.42, s * 0.13, s * 0.10 + s * 0.20 * m, 0, 0, Math.PI * 2);
  ctx.fill();
  // a rogue voice gets a little halo of its own
  if (p.rogue > 0.05 && tell > 0.05){
    ctx.strokeStyle = 'rgba(180,140,255,' + (0.5 * p.rogue * tell).toFixed(3) + ')';
    ctx.lineWidth = 1.6;
    ctx.beginPath(); ctx.arc(x, yy - s * 0.5, s * 1.25, 0, Math.PI * 2); ctx.stroke();
  }
  ctx.globalAlpha = 1;
}

function mixHex(a, b, t){
  const pa = hex2rgb(a), pb = hex2rgb(b);
  const r = Math.round(lerp(pa[0], pb[0], t)), g = Math.round(lerp(pa[1], pb[1], t)), bl = Math.round(lerp(pa[2], pb[2], t));
  return 'rgb(' + r + ',' + g + ',' + bl + ')';
}
function hex2rgb(h){
  if (h[0] !== '#') {
    const m = /rgb\((\d+),(\d+),(\d+)\)/.exec(h.replace(/\s/g, ''));
    return m ? [+m[1], +m[2], +m[3]] : [200, 200, 200];
  }
  const v = h.length === 4
    ? [h[1] + h[1], h[2] + h[2], h[3] + h[3]]
    : [h.slice(1, 3), h.slice(3, 5), h.slice(5, 7)];
  return v.map((s) => parseInt(s, 16));
}

/* Rows are drawn back to front so a nearer singer overlaps the one behind. */
function drawRows(perRow, tell){
  for (let d = 3; d >= 0; d--){
    const p = PARTS[d];
    const y = rowY(d) - 4;
    const inset = rowInset(d);
    const w = VW - inset * 2;
    const n = Math.max(4, perRow - d);
    const s = rowSize(d);
    for (let i = 0; i < n; i++){
      drawSinger(inset + (w / (n + 1)) * (i + 1), y, s, p, tell);
    }
  }
  drawConductor(tell);
}
function drawChoir(tell){
  const c = G.cur;
  if (!c) return;
  drawRows(clamp(Math.ceil(c.singers / 4) + 1, 6, 10), tell);
}

function drawConductor(tell){
  const P = G.perf;
  const x = VW / 2, y = 470;
  const beatPhase = P ? (P.beatF || 0) : (G.t % 1);
  const amp = lerp(4, 24, clamp(SING.expression, 0, 1)) * lerp(0.35, 1, clamp(SING.life, 0, 1));
  const bx = Math.cos(beatPhase * Math.PI * 2) * amp;
  const by = Math.sin(beatPhase * Math.PI * 4) * amp * 0.5;
  // Lit from the stage behind, so the conductor reads as a silhouette with a rim.
  ctx.fillStyle = '#1b1430';
  ctx.beginPath();
  ctx.moveTo(x - 26, y + 68); ctx.lineTo(x - 15, y - 6);
  ctx.lineTo(x + 15, y - 6); ctx.lineTo(x + 26, y + 68);
  ctx.closePath(); ctx.fill();
  ctx.strokeStyle = 'rgba(255,232,190,.22)'; ctx.lineWidth = 1.5; ctx.stroke();
  ctx.fillStyle = '#241b3c';
  ctx.beginPath(); ctx.arc(x, y - 19, 13, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = 'rgba(255,232,190,.26)'; ctx.lineWidth = 1.5; ctx.stroke();
  // baton
  ctx.strokeStyle = 'rgba(255,240,200,' + (0.35 + 0.4 * clamp(SING.expression, 0, 1)).toFixed(2) + ')';
  ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(x + 12, y + 4); ctx.lineTo(x + 12 + bx, y + 4 - 26 + by); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(x - 12, y + 4); ctx.lineTo(x - 12 - bx * 0.7, y + 4 - 20 - by); ctx.stroke();
}

/* ------------------------------------------------------------------ score */
/* The jury's copy, on the desk: a real grand staff that scrolls past a fixed
   playhead. Sopranos and altos share the treble staff, tenors and basses the
   bass staff, stems apart in the usual way.
   The point of it is not decoration. Each part also gets a live dot at the
   playhead drawn at the pitch it is ACTUALLY singing — so a section sitting
   flat has its dot below the notehead, a late entry has its dot still on the
   previous note, and a wrong note is simply on the wrong line. Fidelity to
   the score stops being a matter of opinion. */
const SCORE = { x:28, y:106, w:VW - 56, h:146 };
const LG = 7;                       // gap between staff lines
const TREBLE_TOP = 136;
const BASS_TOP = 208;
const LYRIC_Y = TREBLE_TOP + 4 * LG + 22;   // between the staves, as in a closed score
const GUTTER = 148;                 // clefs, key and time signature live here
const PPB = 42;                     // pixels per beat
const PLAYHEAD = SCORE.x + GUTTER + 72;
const PAPER = '#efe7d6', INK = '#241d14';

/* Where a pitch sits on the staff. Diatonic, so C sharp and D flat are on
   different lines even though they are the same key. */
function diatonicIndex(midi, flats){
  const pc = (((midi % 12) + 12) % 12);
  const oct = Math.floor(midi / 12) - 1;
  return oct * 7 + (flats ? FLAT_LETTER[pc] : SHARP_LETTER[pc]);
}
/* What the key signature already does to each letter, so we only draw the
   accidentals a real engraver would draw. */
function keyAlterations(key){
  const alt = [0, 0, 0, 0, 0, 0, 0];
  if (key > 0) for (let i = 0; i < Math.min(7, key); i++) alt[SHARP_ORDER[i]] = 1;
  if (key < 0) for (let i = 0; i < Math.min(7, -key); i++) alt[FLAT_ORDER[i]] = -1;
  return alt;
}
const TREBLE_BOTTOM_IDX = 30;       // E4 on the bottom line
const BASS_BOTTOM_IDX = 18;         // G2 on the bottom line
function staffY(midi, clef, flats){
  const idx = diatonicIndex(midi, flats);
  return clef === 'F'
    ? (BASS_TOP + 4 * LG) - (idx - BASS_BOTTOM_IDX) * (LG / 2)
    : (TREBLE_TOP + 4 * LG) - (idx - TREBLE_BOTTOM_IDX) * (LG / 2);
}
/* Exactly the same, for a pitch that is not a whole number of semitones —
   which is how a section drifting flat shows up between two lines. */
function staffYFine(midiFloat, clef, flats){
  const lo = Math.floor(midiFloat), hi = lo + 1;
  const a = staffY(lo, clef, flats), b = staffY(hi, clef, flats);
  return a + (b - a) * (midiFloat - lo);
}

/* Note head shape from its length in beats. */
function noteShape(dur){
  if (dur >= 5.5) return { fill:false, stem:false, flags:0, dot:false };
  if (dur >= 4)   return { fill:false, stem:false, flags:0, dot:false };
  if (dur >= 3)   return { fill:false, stem:true,  flags:0, dot:true  };
  if (dur >= 2)   return { fill:false, stem:true,  flags:0, dot:false };
  if (dur >= 1.5) return { fill:true,  stem:true,  flags:0, dot:true  };
  if (dur >= 1)   return { fill:true,  stem:true,  flags:0, dot:false };
  if (dur >= 0.75)return { fill:true,  stem:true,  flags:1, dot:true  };
  return { fill:true, stem:true, flags:1, dot:false };
}

function drawNoteHead(x, y, filled, col){
  ctx.save();
  ctx.translate(x, y); ctx.rotate(-0.32);
  ctx.beginPath(); ctx.ellipse(0, 0, 5.0, 3.6, 0, 0, Math.PI * 2);
  if (filled){ ctx.fillStyle = col; ctx.fill(); }
  else { ctx.lineWidth = 1.6; ctx.strokeStyle = col; ctx.stroke(); }
  ctx.restore();
}
function drawLedgers(x, y, clef){
  const top = clef === 'F' ? BASS_TOP : TREBLE_TOP;
  const bottom = top + 4 * LG;
  ctx.strokeStyle = INK; ctx.lineWidth = 1.2;
  for (let ly = top - LG; ly >= y - 1.5; ly -= LG){
    ctx.beginPath(); ctx.moveTo(x - 8, ly); ctx.lineTo(x + 8, ly); ctx.stroke();
  }
  for (let ly = bottom + LG; ly <= y + 1.5; ly += LG){
    ctx.beginPath(); ctx.moveTo(x - 8, ly); ctx.lineTo(x + 8, ly); ctx.stroke();
  }
}
function drawAccidental(kind, x, y){
  ctx.strokeStyle = INK; ctx.lineWidth = 1.3; ctx.fillStyle = INK;
  if (kind === 1){                       // sharp
    ctx.beginPath();
    ctx.moveTo(x - 2.6, y - 5); ctx.lineTo(x - 2.6, y + 5);
    ctx.moveTo(x + 1.4, y - 6); ctx.lineTo(x + 1.4, y + 4);
    ctx.moveTo(x - 4.6, y - 1.4); ctx.lineTo(x + 3.4, y - 2.8);
    ctx.moveTo(x - 4.6, y + 2.4); ctx.lineTo(x + 3.4, y + 1.0);
    ctx.stroke();
  } else if (kind === -1){               // flat
    ctx.beginPath();
    ctx.moveTo(x - 2, y - 7); ctx.lineTo(x - 2, y + 4);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(x - 2, y + 4);
    ctx.bezierCurveTo(x + 4, y + 1, x + 4, y - 3, x - 2, y - 0.5);
    ctx.stroke();
  } else {                               // natural
    ctx.beginPath();
    ctx.moveTo(x - 2.4, y - 6); ctx.lineTo(x - 2.4, y + 3);
    ctx.moveTo(x + 2.0, y - 3); ctx.lineTo(x + 2.0, y + 6);
    ctx.moveTo(x - 2.4, y - 1.6); ctx.lineTo(x + 2.0, y - 2.8);
    ctx.moveTo(x - 2.4, y + 1.6); ctx.lineTo(x + 2.0, y + 0.4);
    ctx.stroke();
  }
}
/* The clefs, drawn to the proportions an engraver uses: the treble curls
   around the G line and hangs a little below the staff, the bass puts its head
   on the F line with its two dots either side of it. */
function drawTrebleClef(x, top){
  const u = LG, g = top + 3 * u;                 // G line: second from the bottom
  ctx.strokeStyle = INK; ctx.lineWidth = 1.7;
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  ctx.beginPath();
  ctx.moveTo(x + 0.10 * u, g + 2.55 * u);
  ctx.bezierCurveTo(x + 1.35 * u, g + 2.70 * u, x + 1.80 * u, g + 1.55 * u, x + 0.70 * u, g + 1.05 * u);
  ctx.bezierCurveTo(x - 0.70 * u, g + 0.45 * u, x - 1.15 * u, g - 0.40 * u, x + 0.20 * u, g - 0.90 * u);
  ctx.bezierCurveTo(x + 1.55 * u, g - 1.40 * u, x + 1.90 * u, g - 3.00 * u, x + 0.80 * u, g - 3.60 * u);
  ctx.bezierCurveTo(x - 0.15 * u, g - 4.10 * u, x - 0.80 * u, g - 2.55 * u, x + 0.10 * u, g - 1.00 * u);
  ctx.bezierCurveTo(x + 0.80 * u, g + 0.30 * u, x + 1.30 * u, g + 1.35 * u, x + 1.15 * u, g + 2.45 * u);
  ctx.bezierCurveTo(x + 1.05 * u, g + 3.10 * u, x + 0.15 * u, g + 3.20 * u, x + 0.02 * u, g + 2.55 * u);
  ctx.stroke();
  ctx.lineCap = 'butt'; ctx.lineJoin = 'miter';
}
function drawBassClef(x, top){
  const u = LG, f = top + u;                     // F line: second from the top
  ctx.strokeStyle = INK; ctx.fillStyle = INK; ctx.lineWidth = 1.8;
  ctx.lineCap = 'round';
  ctx.beginPath(); ctx.arc(x + 0.45 * u, f, 0.48 * u, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath();
  ctx.moveTo(x + 0.80 * u, f - 0.40 * u);
  ctx.bezierCurveTo(x + 2.00 * u, f - 0.85 * u, x + 2.55 * u, f + 1.10 * u, x + 1.45 * u, f + 2.20 * u);
  ctx.bezierCurveTo(x + 0.75 * u, f + 2.90 * u, x - 0.20 * u, f + 3.05 * u, x - 0.85 * u, f + 2.75 * u);
  ctx.stroke();
  ctx.beginPath(); ctx.arc(x + 2.70 * u, f - 0.5 * u, 1.4, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(x + 2.70 * u, f + 0.5 * u, 1.4, 0, Math.PI * 2); ctx.fill();
  ctx.lineCap = 'butt';
}
/* Sharps and flats of the key signature, at the pitches an engraver uses. */
const SIG_SHARP_MIDI = { G:[77, 72, 79, 74, 69, 76, 71], F:[53, 48, 55, 50, 45, 52, 47] };
const SIG_FLAT_MIDI  = { G:[71, 76, 69, 74, 67, 72, 65], F:[47, 52, 45, 50, 43, 48, 41] };
function drawKeySignature(x, key, clef, flats){
  const n = Math.min(7, Math.abs(key));
  const list = key >= 0 ? SIG_SHARP_MIDI[clef] : SIG_FLAT_MIDI[clef];
  for (let i = 0; i < n; i++){
    drawAccidental(key >= 0 ? 1 : -1, x + i * 9, staffY(list[i], clef, flats));
  }
  return n * 9;
}
function drawStaffLines(x0, x1, top){
  ctx.strokeStyle = 'rgba(36,29,20,.55)'; ctx.lineWidth = 1;
  for (let k = 0; k < 5; k++){
    const y = top + k * LG + 0.5;
    ctx.beginPath(); ctx.moveTo(x0, y); ctx.lineTo(x1, y); ctx.stroke();
  }
}

function drawScore(){
  const c = G.cur, P = G.perf;
  if (!c || !P) return;
  const piece = c.piece;
  const flats = piece.key < 0;
  const right = SCORE.x + SCORE.w;

  // the paper
  ctx.fillStyle = PAPER;
  rr(SCORE.x, SCORE.y, SCORE.w, SCORE.h, 6); ctx.fill();
  ctx.strokeStyle = 'rgba(0,0,0,.5)'; ctx.lineWidth = 1; ctx.stroke();

  const cur = P.musT;
  const beatFromX = (x) => cur + (x - PLAYHEAD) / PPB;
  const xOfBeat = (b) => PLAYHEAD + (b - cur) * PPB;
  const bLo = beatFromX(SCORE.x + GUTTER - 30), bHi = beatFromX(right + 30);

  // --- scrolling music, clipped to the paper right of the gutter ----------
  ctx.save();
  ctx.beginPath();
  ctx.rect(SCORE.x + GUTTER, SCORE.y + 2, SCORE.w - GUTTER - 4, SCORE.h - 4);
  ctx.clip();

  drawStaffLines(SCORE.x + GUTTER - 40, right, TREBLE_TOP);
  drawStaffLines(SCORE.x + GUTTER - 40, right, BASS_TOP);

  // bar lines
  const firstBar = Math.floor((bLo + piece.barOffset) / piece.meter);
  const lastBar = Math.ceil((bHi + piece.barOffset) / piece.meter);
  ctx.strokeStyle = 'rgba(36,29,20,.65)'; ctx.lineWidth = 1.2;
  for (let bi = firstBar; bi <= lastBar; bi++){
    const bx = xOfBeat(bi * piece.meter - piece.barOffset);
    ctx.beginPath();
    ctx.moveTo(bx + 0.5, TREBLE_TOP); ctx.lineTo(bx + 0.5, TREBLE_TOP + 4 * LG);
    ctx.moveTo(bx + 0.5, BASS_TOP); ctx.lineTo(bx + 0.5, BASS_TOP + 4 * LG);
    ctx.stroke();
  }

  const alter = keyAlterations(piece.key);
  const lapLo = Math.floor(bLo / piece.totalBeats) - 1;
  const lapHi = Math.ceil(bHi / piece.totalBeats) + 1;

  for (let pi = 0; pi < 4; pi++){
    const def = PART_DEFS[pi];
    const clef = def.clef;
    for (const n of piece.voices[pi]){
      for (let lap = lapLo; lap <= lapHi; lap++){
        const at = n.at + lap * piece.totalBeats;
        if (at < bLo - 2 || at > bHi + 2) continue;
        const x = xOfBeat(at);
        const y = staffY(n.midi, clef, flats);
        const sh = noteShape(n.dur);
        // accidental, only where the key signature does not already say it
        const pc = (((n.midi % 12) + 12) % 12);
        const letter = flats ? FLAT_LETTER[pc] : SHARP_LETTER[pc];
        const a = flats ? FLAT_ALTER[pc] : SHARP_ALTER[pc];
        if (a !== alter[letter]) drawAccidental(a, x - 12, y);
        drawLedgers(x, y, clef);
        drawNoteHead(x, y, sh.fill, INK);
        if (sh.stem){
          const up = def.up;
          ctx.strokeStyle = def.ink; ctx.lineWidth = 1.6;
          ctx.beginPath();
          ctx.moveTo(x + (up ? 4.6 : -4.6), y + (up ? -0.6 : 0.6));
          ctx.lineTo(x + (up ? 4.6 : -4.6), y + (up ? -3.4 * LG : 3.4 * LG));
          ctx.stroke();
          for (let f = 0; f < sh.flags; f++){
            const fy = y + (up ? -3.4 * LG : 3.4 * LG) + (up ? f * 5 : -f * 5);
            ctx.beginPath();
            ctx.moveTo(x + (up ? 4.6 : -4.6), fy);
            ctx.quadraticCurveTo(x + (up ? 12 : -12), fy + (up ? 4 : -4),
                                 x + (up ? 8 : -8), fy + (up ? 11 : -11));
            ctx.stroke();
          }
        }
        if (sh.dot){
          ctx.fillStyle = INK;
          ctx.beginPath(); ctx.arc(x + 10, y - (Math.round(y / (LG / 2)) % 2 ? 0 : LG / 2), 1.5, 0, Math.PI * 2);
          ctx.fill();
        }
        // the words, under the treble staff, from the soprano line
        if (pi === 0 && n.lyric){
          txt(n.lyric, x, LYRIC_Y, 11, 'rgba(36,29,20,.85)', 'center', 600);
        }
      }
    }
  }

  // --- what the choir is actually doing, right now ------------------------
  ctx.fillStyle = 'rgba(180,40,20,.13)';
  ctx.fillRect(PLAYHEAD - 8, SCORE.y + 4, 16, SCORE.h - 8);
  ctx.strokeStyle = 'rgba(180,40,20,.75)'; ctx.lineWidth = 1.6;
  ctx.beginPath();
  ctx.moveTo(PLAYHEAD + 0.5, SCORE.y + 4); ctx.lineTo(PLAYHEAD + 0.5, SCORE.y + SCORE.h - 8);
  ctx.stroke();

  const tell = STAGES[G.stage].tell;
  for (let pi = 0; pi < 4; pi++){
    const p = PARTS[pi], def = PART_DEFS[pi];
    // Where the sound really is. A wrong note lands exactly on the line it is
    // actually singing; a section merely sitting flat is only a third of a
    // semitone out, which on a real staff is a pixel — so the fractional part
    // is drawn larger than life. Nothing is invented: the dot is off if and
    // only if the pitch is.
    const heard = p.midi + p.cents / 100;
    const sung = Math.round(heard);
    const frac = heard - sung;
    const written = staffY(p.written, def.clef, flats);
    const y = clamp(staffY(sung, def.clef, flats) - frac * LG * 1.5,
                    SCORE.y + 6, SCORE.y + SCORE.h - 10);
    const off = Math.abs(y - written) > 1.4;
    ctx.globalAlpha = clamp(0.45 + 0.55 * clamp(p.gain, 0, 2) * tell, 0.15, 1);
    if (off && tell > 0.05){
      ctx.strokeStyle = def.ink; ctx.lineWidth = 1.4;
      ctx.beginPath(); ctx.moveTo(PLAYHEAD, written); ctx.lineTo(PLAYHEAD, y); ctx.stroke();
    }
    ctx.beginPath(); ctx.arc(PLAYHEAD, y, off ? 4.4 : 3.2, 0, Math.PI * 2);
    ctx.fillStyle = def.ink; ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,.85)'; ctx.lineWidth = 1.1; ctx.stroke();
    ctx.globalAlpha = 1;
  }
  ctx.restore();

  // --- the fixed gutter, painted over the scroll --------------------------
  ctx.fillStyle = PAPER;
  ctx.fillRect(SCORE.x + 1, SCORE.y + 1, GUTTER, SCORE.h - 2);
  drawStaffLines(SCORE.x + 14, SCORE.x + GUTTER, TREBLE_TOP);
  drawStaffLines(SCORE.x + 14, SCORE.x + GUTTER, BASS_TOP);
  // the brace joining the two staves
  ctx.strokeStyle = INK; ctx.lineWidth = 2.2;
  ctx.beginPath();
  ctx.moveTo(SCORE.x + 14, TREBLE_TOP);
  ctx.bezierCurveTo(SCORE.x + 5, TREBLE_TOP + 22, SCORE.x + 5, BASS_TOP + 6, SCORE.x + 14, BASS_TOP + 4 * LG);
  ctx.stroke();
  drawTrebleClef(SCORE.x + 26, TREBLE_TOP);
  drawBassClef(SCORE.x + 26, BASS_TOP);
  const kw = Math.max(
    drawKeySignature(SCORE.x + 58, piece.key, 'G', flats),
    drawKeySignature(SCORE.x + 58, piece.key, 'F', flats));
  const tsx = SCORE.x + 66 + kw;
  txt(String(piece.meter), tsx, TREBLE_TOP + 2 * LG - 1, 15, INK, 'center', 800);
  txt('4', tsx, TREBLE_TOP + 4 * LG + 1, 15, INK, 'center', 800);
  txt(String(piece.meter), tsx, BASS_TOP + 2 * LG - 1, 15, INK, 'center', 800);
  txt('4', tsx, BASS_TOP + 4 * LG + 1, 15, INK, 'center', 800);

  // title of the piece, on the paper
  txt(piece.title, right - 10, SCORE.y + 15, 11, 'rgba(36,29,20,.85)', 'right', 700);
  txt(piece.composer, right - 10, SCORE.y + 28, 10, 'rgba(36,29,20,.55)', 'right', 500);
  // which stem colour belongs to which part
  for (let i = 0; i < 4; i++){
    txt(PART_DEFS[i].abbr, SCORE.x + 40 + i * 13, SCORE.y + 14, 10, PART_DEFS[i].ink, 'center', 800);
  }
}

/* ---------------------------------------------------------- the criterion bar */
function drawCritBar(){
  const P = G.perf;
  for (let i = 0; i < CRITS.length; i++){
    const c = CRITS[i], r = critRect(i);
    const flash = P ? (P.flash[c.id] || 0) : 0;
    const cool = P ? (P.cool[c.id] || 0) : 0;
    ctx.save();
    rr(r.x, r.y, r.w, r.h, 10);
    ctx.fillStyle = flash > 0.26 ? 'rgba(255,255,255,.14)' : 'rgba(20,16,34,.86)';
    ctx.fill();
    ctx.strokeStyle = flash > 0 ? c.col : 'rgba(120,110,160,.35)';
    ctx.lineWidth = flash > 0 ? 2.4 : 1.2;
    ctx.stroke();
    if (flash > 0){
      ctx.globalAlpha = clamp(flash, 0, 1) * 0.4;
      rr(r.x, r.y, r.w, r.h, 10); ctx.fillStyle = c.col; ctx.fill();
      ctx.globalAlpha = 1;
    }
    ctx.restore();
    txt(c.key, r.x + 12, r.y + 26, 15, 'rgba(255,255,255,.45)', 'left', 700);
    txt(c.short, r.x + r.w / 2 + 6, r.y + 26, 14, c.col, 'center', 700);
    // how many of this criterion you have already written down
    const n = P ? P.caught.filter((f) => f.def.crit === c.id).length : 0;
    const ph = P ? P.phantoms.filter((f) => f.crit === c.id).length : 0;
    let dots = '';
    for (let k = 0; k < n; k++) dots += '● ';
    for (let k = 0; k < ph; k++) dots += '○ ';
    txt(dots.trim() || '—', r.x + r.w / 2, r.y + 48, 13, n ? c.col : 'rgba(150,143,180,.5)', 'center', 600);
    if (cool > 0){
      ctx.fillStyle = 'rgba(0,0,0,.35)';
      rr(r.x, r.y, r.w * (cool / 0.28), r.h, 10); ctx.fill();
    }
  }
}

function drawFx(){
  for (const p of fx){
    const u = p.t / p.life;
    ctx.globalAlpha = clamp(1 - u, 0, 1);
    if (p.kind === 'mark'){
      const col = CRIT_BY_ID[p.crit].col;
      txt(p.text, p.x, p.y + (p.vy || 0) * p.t * 0.02, 13, col, 'center', 700);
    } else if (p.kind === 'phantom'){
      txt('nothing there', p.x, p.y + (p.vy || 0) * p.t * 0.02, 12, '#ff6b6b', 'center', 600);
    }
    ctx.globalAlpha = 1;
  }
}

/* -------------------------------------------------------- the score dial */
function dialGeom(){ return { cx: VW / 2, cy: 356, r: 128 }; }
function scoreFromPoint(x, y){
  const d = dialGeom();
  let a = Math.atan2(y - d.cy, x - d.cx);
  // The arc runs from 180deg round the top to 0deg.
  a = (a + Math.PI * 2) % (Math.PI * 2);
  if (a < Math.PI) return null;                    // below the dial
  const u = (a - Math.PI) / Math.PI;
  return Math.round(clamp(8 + u * 22, 8, 30) * 2) / 2;
}
function drawDial(score){
  const { cx, cy, r } = dialGeom();
  ctx.lineWidth = 16;
  ctx.strokeStyle = 'rgba(255,255,255,.07)';
  ctx.beginPath(); ctx.arc(cx, cy, r, Math.PI, Math.PI * 2); ctx.stroke();
  // diploma bands painted straight onto the arc
  for (const b of BANDS){
    const from = clamp((b.min - 8) / 22, 0, 1);
    const above = BANDS[BANDS.indexOf(b) - 1];
    const to = above ? clamp((above.min - 8) / 22, 0, 1) : 1;
    if (to <= from) continue;
    ctx.strokeStyle = b.col; ctx.globalAlpha = 0.55;
    ctx.beginPath(); ctx.arc(cx, cy, r, Math.PI + Math.PI * from, Math.PI + Math.PI * to); ctx.stroke();
    ctx.globalAlpha = 1;
    // a tick and the point value where each band begins
    if (b.min > 0){
      const a0 = Math.PI + Math.PI * from;
      ctx.strokeStyle = 'rgba(255,255,255,.35)'; ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.moveTo(cx + Math.cos(a0) * (r - 9), cy + Math.sin(a0) * (r - 9));
      ctx.lineTo(cx + Math.cos(a0) * (r + 9), cy + Math.sin(a0) * (r + 9));
      ctx.stroke();
      txt(String(b.min), cx + Math.cos(a0) * (r + 24), cy + Math.sin(a0) * (r + 24) + 4,
          11, 'rgba(180,172,205,.8)', 'center', 600);
      ctx.lineWidth = 16;
    }
  }
  const u = clamp((score - 8) / 22, 0, 1);
  const a = Math.PI + Math.PI * u;
  const band = bandFor(score);
  ctx.lineWidth = 16; ctx.strokeStyle = band.col;
  ctx.beginPath(); ctx.arc(cx, cy, r, Math.PI + Math.PI * Math.max(0, u - 0.012), a); ctx.stroke();
  // needle
  ctx.strokeStyle = '#f2eeff'; ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.moveTo(cx + Math.cos(a) * (r - 30), cy + Math.sin(a) * (r - 30));
  ctx.lineTo(cx + Math.cos(a) * (r + 14), cy + Math.sin(a) * (r + 14));
  ctx.stroke();
  txt(score.toFixed(1), cx, cy - 12, 62, band.col, 'center', 800);
  txt('of 30', cx, cy + 12, 14, '#6d6788', 'center', 600);
  txt(band.name.toUpperCase(), cx, cy + 40, 13, band.col, 'center', 700);
  txt('8', cx - r, cy + 30, 12, '#4e4a63', 'center', 600);
  txt('30', cx + r, cy + 30, 12, '#4e4a63', 'center', 600);
}
