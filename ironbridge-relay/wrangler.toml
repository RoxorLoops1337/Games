name = "ironbridge-relay"
main = "worker.js"
compatibility_date = "2025-04-01"

# One Durable Object per room, keyed by the four-letter code. A room that is
# never joined is never instantiated, and an idle room hibernates.
[[durable_objects.bindings]]
name = "ROOM"
class_name = "Room"

# SQLite-backed Durable Objects are the ones available on the Workers free
# plan. new_sqlite_classes (rather than new_classes) is what selects that
# storage backend — on the free plan the key-value backend is not available and
# a migration using new_classes will be rejected at deploy time.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]

[observability]
enabled = true
