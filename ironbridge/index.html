    // the trees behind them read as further back
    for (const st of WOOD_LOT.stumps){
      const q = bp(N.gx + st[0], N.gy + st[1]);
      ell(c, q[0], q[1] + 1 * B, 6 * B, 3 * B, 'rgba(0,0,0,.18)');
      c.fillStyle = '#5c4326'; c.fillRect(q[0] - 4.5 * B, q[1] - 4 * B, 9 * B, 4 * B);
      ell(c, q[0], q[1] - 4 * B, 4.5 * B, 2.4 * B, '#a3814f');
      ell(c, q[0], q[1] - 4 * B, 2.2 * B, 1.2 * B, '#8a6a3c');
    }
    const lg = bp(N.gx + WOOD_LOT.logs[0], N.gy + WOOD_LOT.logs[1]);
    ell(c, lg[0], lg[1] + 2 * B, 15 * B, 5 * B, 'rgba(0,0,0,.18)');
    for (let i = 0; i < 3; i++){
      const ox = (i === 2 ? 5 : i * 10) * B, oy = (i === 2 ? -6 : 0) * B;
      c.fillStyle = '#6b4f2e'; c.fillRect(lg[0] - 12 * B + ox, lg[1] - 6 * B + oy, 12 * B, 6 * B);
      ell(c, lg[0] - 12 * B + ox, lg[1] - 3 * B + oy, 2.2 * B, 3 * B, '#a3814f');
      ell(c, lg[0] - 12 * B + ox, lg[1] - 3 * B + oy, 1.1 * B, 1.5 * B, '#7d6038');
    }
    // the chopping block, with the axe left in it
    const bl = bp(N.gx + WOOD_LOT.block[0], N.gy + WOOD_LOT.block[1]);
    ell(c, bl[0], bl[1] + 1 * B, 7 * B, 3 * B, 'rgba(0,0,0,.20)');
    c.fillStyle = '#5c4326'; c.fillRect(bl[0] - 5.5 * B, bl[1] - 6 * B, 11 * B, 6 * B);
    ell(c, bl[0], bl[1] - 6 * B, 5.5 * B, 2.8 * B, '#b08d56');
    c.strokeStyle = '#7a5a34'; c.lineWidth = Math.max(1, 1.8 * B); c.lineCap = 'round';
    c.beginPath(); c.moveTo(bl[0] + 1 * B, bl[1] - 7 * B); c.lineTo(bl[0] + 7 * B, bl[1] - 17 * B); c.stroke();
    c.lineCap = 'butt';
    poly(c, [[bl[0] + 5 * B, bl[1] - 15 * B], [bl[0] + 11 * B, bl[1] - 18 * B],
             [bl[0] + 10 * B, bl[1] - 12 * B], [bl[0] + 6 * B, bl[1] - 12 * B]], '#b9c2ce');
    for (const ch of WOOD_LOT.chips){                 // chips where the axe fell
      const q = bp(N.gx + ch[0], N.gy + ch[1]);
      ell(c, q[0], q[1], 2.2 * B, 1.2 * B, '#c9a978');
    }
    // and the standing timber, drawn back to front
    for (let i = 0; i < WOOD_LOT.trees.length; i++){
      const q = bp(N.gx + WOOD_LOT.trees[i][0], N.gy + WOOD_LOT.trees[i][1]);
      const sc = .88 + (i % 3) * .12;
      ell(c, q[0], q[1] + 2 * B, 10 * B * sc, 4 * B * sc, 'rgba(0,0,0,.20)');
      c.fillStyle = '#5c4326'; c.fillRect(q[0] - 2 * B, q[1] - 12 * B * sc, 4 * B, 12 * B * sc);
      poly(c, [[q[0] - 11 * B * sc, q[1] - 9 * B * sc], [q[0], q[1] - 27 * B * sc], [q[0] + 11 * B * sc, q[1] - 9 * B * sc]], i % 2 ? '#3f7a3a' : '#457f3d');
      poly(c, [[q[0] - 8.5 * B * sc, q[1] - 16 * B * sc], [q[0], q[1] - 32 * B * sc], [q[0] + 8.5 * B * sc, q[1] - 16 * B * sc]], i % 2 ? '#4c8c42' : '#54974a');
      poly(c, [[q[0] - 5.5 * B * sc, q[1] - 23 * B * sc], [q[0], q[1] - 36 * B * sc], [q[0] + 5.5 * B * sc, q[1] - 23 * B * sc]], '#5aa04c');
      // the sun is on the same side as it is on every roof in this game
      poly(c, [[q[0], q[1] - 36 * B * sc], [q[0] + 5.5 * B * sc, q[1] - 23 * B * sc], [q[0], q[1] - 23 * B * sc]], '#4a8b40');
    }
  } else {
    // A mine used to be a flat trapezoid with a black rectangle punched in it
    // and four pebbles on the ground line: no shadow, no depth, nothing to say
    // anyone worked there. These are the economy and you look at them all game.
    const rock = key === 'gold' ? '#8c7a52' : '#6a7382';
    const ore = key === 'gold' ? '#e8b53d' : '#93a1b3';
    const oreLit = key === 'gold' ? '#ffe08a' : '#c3cede';
    const P = (pts, fill) => poly(c, pts.map(q => [p[0] + q[0] * B, p[1] + q[1] * B]), fill);
    ell(c, p[0], p[1] + 3 * B, 40 * B, 15 * B, 'rgba(0,0,0,.22)');
    // the spoil heap the diggings came out of, behind the mouth
    P([[-40, 4], [-22, -30], [10, -35], [40, 4]], shade(rock, .82));
    P([[-22, -30], [10, -35], [17, -20], [-13, -15]], shade(rock, 1.14));
    P([[-40, 4], [-22, -30], [-13, -15], [-18, 4]], shade(rock, .96));
    P([[17, -20], [10, -35], [40, 4], [22, 4]], shade(rock, .70));
    // the adit: a tunnel that gets darker as it goes in, not a flat hole
    P([[-13, 4], [-10, -19], [10, -19], [13, 4]], '#2b241d');
    P([[-9, 4], [-7, -15], [7, -15], [9, 4]], '#150f0b');
    // timbered, because a hole in rock without a frame reads as a cave
    const wood = '#6b4f2e', woodLit = '#8c6a3e';
    P([[-17, 5], [-12, 5], [-12, -22], [-17, -22]], wood);
    P([[12, 5], [17, 5], [17, -22], [12, -22]], wood);
    P([[-17, -22], [17, -22], [17, -27], [-17, -27]], woodLit);
    P([[-19, -27], [19, -27], [19, -29], [-19, -29]], wood);
    // corner braces, not one beam straight across the opening — the first pass
    // put a diagonal through the middle of the mouth and it read as a barred
    // door rather than a mine you could walk into
    P([[-17, -18], [-12, -22], [-12, -18], [-17, -14]], shade(wood, .82));
    P([[17, -18], [12, -22], [12, -18], [17, -14]], shade(wood, .82));
    // a lantern hung at the head
    c.globalAlpha = .17;
    ell(c, p[0] + 15 * B, p[1] - 24 * B, 5.5 * B, 4.5 * B, '#ffca6a');
    c.globalAlpha = 1;
    ell(c, p[0] + 15 * B, p[1] - 24 * B, 1.9 * B, 2.2 * B, '#ffe9b0');
    // rails out of the mouth, and a cart working them
    c.strokeStyle = '#4b4239'; c.lineWidth = Math.max(1, 1.6 * B);
    for (let i = 0; i < 5; i++){
      const t = i / 4;
      const a = [p[0] + lerp(-7, -13, t) * B, p[1] + lerp(2, 19, t) * B];
      const b = [p[0] + lerp(7, 13, t) * B, p[1] + lerp(2, 19, t) * B];
      c.beginPath(); c.moveTo(a[0], a[1]); c.lineTo(b[0], b[1]); c.stroke();
    }
    c.strokeStyle = '#5d5346'; c.lineWidth = Math.max(1, 1.8 * B);
    for (const sx of [-1, 1]){
      c.beginPath();
      c.moveTo(p[0] + sx * 7 * B, p[1] + 2 * B);
      c.lineTo(p[0] + sx * 13 * B, p[1] + 19 * B);
      c.stroke();
    }
    // The cart runs on the clock, not on a random stream — both machines see
    // it in the same place, and the simulation never hears about it.
    const ph = cyc(G.t * .17 + (key === 'gold' ? 0 : .5));
    const tri = ph < .5 ? ph * 2 : 2 - ph * 2;      // out of the mine, and back in
    const cx = p[0], cy = p[1] + lerp(-2, 17, tri) * B;
    const w = lerp(5, 8.5, tri) * B, hgt = lerp(4, 6.5, tri) * B;
    ell(c, cx, cy + hgt * .5, w * 1.05, hgt * .42, 'rgba(0,0,0,.24)');
    c.fillStyle = '#5b4a34'; c.fillRect(cx - w, cy - hgt, w * 2, hgt);
    c.fillStyle = '#725d40'; c.fillRect(cx - w, cy - hgt, w * 2, hgt * .28);
    for (let i = 0; i < 3; i++)
      ell(c, cx - w * .55 + i * w * .55, cy - hgt - hgt * .18, w * .30, hgt * .26, i % 2 ? oreLit : ore);
    ell(c, cx - w * .6, cy, w * .22, hgt * .22, '#3a3128');
    ell(c, cx + w * .6, cy, w * .22, hgt * .22, '#3a3128');
    // and the ore already brought out, stacked to one side
    for (let i = 0; i < 4; i++){
      const q = [p[0] + (-30 + i * 9) * B, p[1] + (6 + (i % 2) * 3) * B];
      ell(c, q[0], q[1], 5 * B, 3 * B, ore);
      ell(c, q[0] - 1.6 * B, q[1] - 1.6 * B, 2.4 * B, 1.6 * B, oreLit);
    }
  }
  if (holdSide !== MY) return;                      // their crews are their business
  const n = Math.min(s.workers[key], nodeCap(s, key));
  const home = bp(KEEP.gx + .6, KEEP.gy + .5);
  for (let i = 0; i < n; i++){
    const ph = cyc(G.t * .22 + i * .19);
    const tri = ph < .5 ? ph * 2 : 2 - ph * 2;
    const x = lerp(p[0], home[0], tri), y = lerp(p[1] - 6 * B, home[1], tri);
    drawWorkerFig(c, x, y, N.col, ph >= .5, .9, ph * 12.6 + i);
  }
  labelQ.push({ x:p[0], y:p[1] + (key === 'wood' ? 26 : 36) * B, txt:N.n + '  ' + n + '/' + nodeCap(s, key), col:N.col });
}

// The seat of the hold. It was one plain box with a flag on it, smaller than
// the barracks and with no shadow when every plot building had one — so the
// most important building on the island read as the least. It stands on a
// stone footing now, with a door, lit windows and a chimney going.
function drawKeep(c){
  const s = G.sides[holdSide], B = bu();
  const gx = KEEP.gx, gy = KEEP.gy;
  ell(c, ...bp(gx, gy + .12), BSC * .95, BSC * .46, 'rgba(0,0,0,.24)');
  // a flagged stone terrace, so it sits ON something
  poly(c, [bp(gx - .78, gy - .62), bp(gx + .78, gy - .62), bp(gx + .78, gy + .66), bp(gx - .78, gy + .66)], '#8b8778');
  poly(c, [bp(gx - .70, gy - .55), bp(gx + .70, gy - .55), bp(gx + .70, gy + .58), bp(gx - .70, gy + .58)], '#9d9989');
  c.strokeStyle = 'rgba(60,58,50,.35)'; c.lineWidth = Math.max(1, 1.2 * B);
  for (let i = -1; i <= 1; i++){
    const a = bp(gx - .70, gy + i * .38), b = bp(gx + .70, gy + i * .38);
    c.beginPath(); c.moveTo(a[0], a[1]); c.lineTo(b[0], b[1]); c.stroke();
  }
  const W = .62, D = .48, WH = FIT.townhall.wh;
  drawHouse(c, gx, gy, W, D, WH, FIT.townhall.rh, '#c4ab84', '#7a4a3c');
  // Openings go on the two faces this projection actually shows: the near face
  // at y = gy + D, and the right-hand face at x = gx + W. Anything drawn on the
  // other two ends up floating over the roof, which is where the first pass put
  // the windows.
  const face = (x0, x1, y0, y1, z0, z1, fill) =>
    poly(c, [bp(x0, y0, z0), bp(x1, y1, z0), bp(x1, y1, z1), bp(x0, y0, z1)], fill);
  face(gx - .17, gx + .17, gy + D, gy + D, 0, .66, '#4a3526');          // the door
  face(gx - .15, gx + .15, gy + D, gy + D, .62, .68, '#8a6a48');        // its lintel
  for (const [a, b] of [[-.50, -.30], [.30, .50]])                      // windows, near face
    face(gx + a, gx + b, gy + D, gy + D, .56, .92, '#f0cf82');
  for (const [a, b] of [[-.30, -.10], [.12, .32]])                      // and on the right face
    face(gx + W, gx + W, gy + a, gy + b, .56, .92, '#e6c179');
  // chimney: based low enough that the roof swallows its foot
  const ch = bp(gx + .24, gy - .16, FIT.townhall.chimney);
  c.fillStyle = '#6f6252'; c.fillRect(ch[0] - 4.5 * B, ch[1] - 18 * B, 9 * B, 26 * B);
  c.fillStyle = '#8a7a66'; c.fillRect(ch[0] - 4.5 * B, ch[1] - 18 * B, 9 * B, 3 * B);
  c.fillStyle = '#3a3128'; c.fillRect(ch[0] - 3 * B, ch[1] - 19 * B, 6 * B, 2 * B);
  for (let i = 0; i < 4; i++){
    const ph = cyc(G.t * .32 + i * .25);
    c.globalAlpha = .24 * (1 - ph);
    ell(c, ch[0] + Math.sin(ph * 5 + i) * 5 * B, ch[1] - 22 * B - ph * 32 * B,
      (2.6 + ph * 7) * B, (2.2 + ph * 5.5) * B, '#cfd6dc');
  }
  c.globalAlpha = 1;
  const p = bp(gx - .34, gy + D, WH + .55);
  c.fillStyle = '#6a5540'; c.fillRect(p[0] - 1.6 * B, p[1] - 20 * B, 3.2 * B, 20 * B);
  poly(c, [[p[0] + 1.6 * B, p[1] - 20 * B], [p[0] + 17 * B, p[1] - 15.5 * B], [p[0] + 1.6 * B, p[1] - 11 * B]], sideCol());
  poly(c, [[p[0] + 1.6 * B, p[1] - 15.5 * B], [p[0] + 17 * B, p[1] - 15.5 * B], [p[0] + 1.6 * B, p[1] - 11 * B]], shade(sideCol(), .78));
  if (holdSide !== MY) return;
  const lb = bp(KEEP.gx, KEEP.gy, 2.7);
  labelQ.push({ x:lb[0], y:lb[1], txt:'Town Hall · ' + s.workers.idle + ' idle', col:'#ffe7b0' });
  for (let i = 0; i < Math.min(6, s.workers.idle); i++){
    const a = G.t * .3 + i * 1.1;
    const q = bp(gx + Math.cos(a) * 1.15, gy + 1.15 + Math.sin(a) * .38);
    drawWorkerFig(c, q[0], q[1], '#8d99b0', false, .85, a * 3.4);
  }
}
const sideCol = () => SIDE_COL[holdSide];

// Deterministic countryside so the corners of the isometric diamond read as
// land instead of empty felt. Nothing here touches the simulation.
const hash2 = (i, j) => { const n = Math.sin(i * 127.1 + j * 311.7) * 43758.5453; return n - Math.floor(n); };

// The countryside never changes, so it is laid out once per hold and then only
// culled — it used to be re-rolled every single frame, for both holds.
const scatterCache = [null, null];
function scatterFor(side){
  if (scatterCache[side]) return scatterCache[side];
  const was = holdSide;
  holdSide = side;
  const out = [];
  const busy = (gx, gy) => {
    const wy = gy * TILE;
    if (wy < PLAT.far + 4 || wy > PLAT.near - 3) return true;          // off the mesa
    const wx = holdWorld(gx, gy)[0];
    const inner = holdSide === 0 ? 3 : C.LANE_LEN - 3;
    const outer = inner - (holdSide === 0 ? 1 : -1) * (PLAT.back + 34);
    if (holdSide === 0 ? (wx > inner - 4 || wx < outer + 4) : (wx < inner + 4 || wx > outer - 4)) return true;
    if (Math.abs(gx) < (PLOT_W - 1) / 2 + 1.1 && Math.abs(gy) < (PLOT_H - 1) / 2 + 1.1) return true;
    if (hyp(gx - KEEP.gx, gy - KEEP.gy) < 1.9) return true;
    for (const k in NODES) if (hyp(gx - NODES[k].gx, gy - NODES[k].gy) < 1.9) return true;
    return false;
  };
  for (let gx = -14; gx <= 13; gx++) for (let gy = -16; gy <= 8; gy++){
    const r = hash2(gx, gy);
    if (r > .40 || busy(gx, gy)) continue;
    const ox = (hash2(gx + 31, gy) - .5) * .8, oy = (hash2(gx, gy + 17) - .5) * .8;
    out.push({ gx:gx + ox, gy:gy + oy, r });
  }
  out.sort((a, b) => (a.gx + a.gy) - (b.gx + b.gy));
  holdSide = was;
  scatterCache[side] = out;
  return out;
}

// The main road: the gate, the plots, the hall. It used to stop dead thirty
// world units short of the buildings, so the hold read as a set of objects
// dropped on a lawn rather than a place people live in and walk around.
const ROAD = [[8.3, 0], [5.6, .35], [2.6, .15], [-.1, -.25], [-2.3, -1.05]];
function drawGround(c){
  const home = bp(KEEP.gx + .6, KEEP.gy + .7);
  const lay = (pts, w, col) => {
    c.strokeStyle = col; c.lineWidth = Math.max(2, BSC * w);
    c.lineCap = 'round'; c.lineJoin = 'round';
    c.beginPath(); c.moveTo(pts[0][0], pts[0][1]);
    for (let i = 1; i < pts.length; i++) c.lineTo(pts[i][0], pts[i][1]);
    c.stroke();
  };
  const main = ROAD.map(p => bp(p[0], p[1]));
  lay(main, .34, 'rgba(74,58,34,.34)');            // the rut either side
  lay(main, .24, 'rgba(150,124,80,.36)');          // and the packed earth down the middle
  // trodden paths from the hall out to every job
  for (const k in NODES){
    const q = bp(NODES[k].gx, NODES[k].gy);
    const mid = [(home[0] + q[0]) / 2 + BSC * .3, (home[1] + q[1]) / 2];
    for (const [w, col] of [[.22, 'rgba(74,58,34,.26)'], [.13, 'rgba(150,124,80,.30)']]){
      c.strokeStyle = col; c.lineWidth = Math.max(2, BSC * w); c.lineCap = 'round';
      c.beginPath(); c.moveTo(home[0], home[1]);
      c.quadraticCurveTo(mid[0], mid[1], q[0], q[1]);
      c.stroke();
    }
  }
  c.lineCap = 'butt'; c.lineJoin = 'miter';
  const s = BSC / 34;
  for (const it of scatterFor(holdSide)){
    const r = it.r;
    const p = bp(it.gx, it.gy);
    if (p[0] < -60 || p[0] > LW + 60) continue;
    if (p[1] < -60 || p[1] > LH + 60) continue;
    if (r < .16){                                     // tree
      ell(c, p[0], p[1] + 2, 9 * s, 4 * s, 'rgba(0,0,0,.20)');
      c.fillStyle = '#57431f'; c.fillRect(p[0] - 1.6 * s, p[1] - 9 * s, 3.2 * s, 9 * s);
      poly(c, [[p[0] - 9 * s, p[1] - 7 * s], [p[0], p[1] - 26 * s], [p[0] + 9 * s, p[1] - 7 * s]], r < .08 ? '#3f7a3a' : '#4b8c42');
      poly(c, [[p[0] - 6 * s, p[1] - 14 * s], [p[0], p[1] - 30 * s], [p[0] + 6 * s, p[1] - 14 * s]], '#57a04c');
    } else if (r < .26){                              // boulder
      ell(c, p[0], p[1] + 1, 8 * s, 3.5 * s, 'rgba(0,0,0,.18)');
      poly(c, [[p[0] - 8 * s, p[1]], [p[0] - 4 * s, p[1] - 7 * s], [p[0] + 4 * s, p[1] - 8 * s], [p[0] + 8 * s, p[1]]], '#7d7f77');
      poly(c, [[p[0] - 4 * s, p[1] - 7 * s], [p[0] + 4 * s, p[1] - 8 * s], [p[0] + 2 * s, p[1] - 3 * s], [p[0] - 3 * s, p[1] - 3 * s]], '#93958c');
    } else if (r < .34){                              // shrub
      ell(c, p[0], p[1] - 3 * s, 7 * s, 5 * s, '#3f6f38');
      ell(c, p[0] - 3 * s, p[1] - 5 * s, 4 * s, 3.5 * s, '#4b8542');
    } else {                                          // grass tuft
      c.strokeStyle = 'rgba(150,190,120,.55)'; c.lineWidth = 1.2;
      for (let i = -1; i <= 1; i++){
        c.beginPath(); c.moveTo(p[0] + i * 3 * s, p[1]); c.lineTo(p[0] + i * 4.5 * s, p[1] - 6 * s); c.stroke();
      }
    }
  }
}

// The mesa your hold stands on: grass on top, rock walls falling into the
// chasm on every side you can actually see.
// `back` is how far the mesa reaches away from the bridge. It was 48, which
// put the outer cliff at world x -79 — and the town hall at -83, hanging in
// the air off the back of the island. The mesa reaches far enough now that
// the hall, and the workers who wander around it, stand on solid ground.
const PLAT = { far:-58, near:40, back:60 };
// The three walls of the mesa you can ever see, each as a segment in the
// ground plane that gets extruded down into the chasm. `outer` is the back
// wall: invisible from your own hold, and the whole reason it spent this long
// as a single flat quad while the other two had rock in them.
function platFaces(side){
  const d = side === 0 ? 1 : -1;
  const inner = side === 0 ? 3 : C.LANE_LEN - 3;
  const outer = inner - d * (PLAT.back + 34);
  const F = PLAT.far, N = PLAT.near;
  return [
    { k:'near',  a:[outer, N], b:[inner, N], base:'#4a4038', band:'#6a5c4c', band2:'#544738', lip:'#6f6350' },
    { k:'inner', a:[inner, F], b:[inner, N], base:'#40382e', band:'#5e5142', band2:'#4a3f32', lip:'#655a49' },
    { k:'outer', a:[outer, F], b:[outer, N], base:'#453c33', band:'#615343', band2:'#4c4133', lip:'#665b4a' },
  ];
}
function drawPlateau(c){
  const d = holdSide === 0 ? 1 : -1;
  const inner = holdSide === 0 ? 3 : C.LANE_LEN - 3;         // where it meets the bridge
  const outer = inner - d * (PLAT.back + 34);
  const F = PLAT.far, N = PLAT.near;
  const e = (x, y, z) => lp(x, y, z);
  const DROP = 46;
  // Every visible wall of the mesa, walked as a list. The bedding planes, the
  // joints, the weathered lip and the dissolve into the chasm used to be
  // written out per face, and the BACK wall got none of them — one flat brown
  // quad. You never see it from your own hold, so it looked fine right up
  // until you pressed FOE and the enemy island turned out to be sitting on a
  // slab. Iterating means a face cannot be added and then forgotten.
  for (const f of platFaces(holdSide)){
    const q = (t0, t1, z0, z1, col) => {
      const ax = lerp(f.a[0], f.b[0], t0), ay = lerp(f.a[1], f.b[1], t0);
      const bx = lerp(f.a[0], f.b[0], t1), by = lerp(f.a[1], f.b[1], t1);
      poly(c, [e(ax, ay, z0), e(bx, by, z0), e(bx, by, z1), e(ax, ay, z1)], col);
    };
    q(0, 1, 0, -DROP, f.base);
    q(0, 1, -DROP * .45, -DROP, shade(f.base, .78));
    c.globalAlpha = .30;
    for (let i = 1; i < 7; i++){
      const z = -DROP * (i / 7), h = 1.1 + (i % 3) * .8;
      q(0, 1, z, z - h, i % 2 ? f.band : f.band2);
    }
    c.globalAlpha = .22;
    for (let i = 0; i < 9; i++){                     // joints running down the rock
      const t = (i + .5) / 9, w = (.8 + (i % 2) * .5) / 90;
      q(t, t + w, -2, -DROP * .78, '#2b251e');
    }
    c.globalAlpha = .5;
    q(0, 1, 0, -1.8, f.lip);                         // weathered under the turf
    c.globalAlpha = 1;
    for (let i = 0; i < 3; i++){                     // and the foot of it going dark
      const z0 = -DROP * (.55 + i * .15), z1 = z0 - DROP * .15;
      c.globalAlpha = .22 + i * .26;
      q(0, 1, z0, z1, '#0c1414');
    }
    c.globalAlpha = 1;
  }
  // grass top
  poly(c, [e(outer, F), e(inner, F), e(inner, N), e(outer, N)], '#4c7040');
  c.globalAlpha = .35;
  poly(c, [e(outer, N - 8), e(inner, N - 8), e(inner, N), e(outer, N)], '#3d5c33');
  poly(c, [e(inner - d * 9, F), e(inner, F), e(inner, N), e(inner - d * 9, N)], '#43663a');
  c.globalAlpha = 1;
  // Dapple. The mesa is by a distance the largest thing on screen and it was
  // one flat fill, which made the whole hold read as objects dropped on felt.
  // The patches are laid out once per side and never move.
  const S = LS();
  for (const g of grassFor(holdSide)){
    const p = e(g.x, g.y);
    if (p[0] < -90 || p[0] > LW + 90 || p[1] < -70 || p[1] > LH + 70) continue;
    c.globalAlpha = g.a;
    ell(c, p[0], p[1], g.rw * .96 * S, g.rh * .60 * S, g.col);
  }
  c.globalAlpha = 1;
  // the far edge fades into the valley haze instead of ending on a hard line
  for (let i = 0; i < 3; i++){
    c.globalAlpha = .15 - i * .045;
    poly(c, [e(outer, F + i * 4), e(inner, F + i * 4), e(inner, F + i * 4 + 4), e(outer, F + i * 4 + 4)], '#8ea9ac');
  }
  c.globalAlpha = 1;
  // where the road leaves the mesa and meets the bridge
  c.globalAlpha = .5;
  poly(c, [e(inner, -5), e(inner - d * 12, -5), e(inner - d * 12, 5), e(inner, 5)], '#7d6a44');
  c.globalAlpha = 1;
}

// The mottling on the mesa top: patches of longer and shorter grass and a few
// bare scrapes of earth. Deterministic and computed once per side, like the
// countryside — this is decoration and never touches the simulation.
const grassCache = [null, null];
function grassFor(side){
  if (grassCache[side]) return grassCache[side];
  const inner = side === 0 ? 3 : C.LANE_LEN - 3;
  const outer = inner - (side === 0 ? 1 : -1) * (PLAT.back + 34);
  const x0 = Math.min(inner, outer), x1 = Math.max(inner, outer);
  const COLS = ['#54804a', '#436236', '#5b8a4e', '#6b6042'];
  const out = [];
  for (let i = 0; i < 34; i++){
    const hx = hash2(i * 3 + 1 + side * 97, 7), hy = hash2(11, i * 5 + 3 + side * 53);
    const k = hash2(i + side * 31, i * 2 + 5);
    const ci = k > .90 ? 3 : (k > .58 ? 2 : (k > .28 ? 1 : 0));
    const rw = 5 + hash2(i, 13) * 12;
    out.push({
      x:x0 + hx * (x1 - x0), y:PLAT.far + 4 + hy * (PLAT.near - PLAT.far - 8),
      rw, rh:rw * (.5 + hash2(i, 19) * .3),
      col:COLS[ci], a:ci === 3 ? .22 : .18 + hash2(i, 23) * .14,
    });
  }
  grassCache[side] = out;
  return out;
}

// Is any part of this hold's mesa on screen? Both mesas are ~80 world units
// wide, so drawing the far one while you watch the fight is pure fill-rate.
function holdOnScreen(side){
  const inner = side === 0 ? 3 : C.LANE_LEN - 3;
  const outer = inner - (side === 0 ? 1 : -1) * (PLAT.back + 34);
  const a = lp(Math.min(inner, outer), PLAT.near)[0], b = lp(Math.max(inner, outer), PLAT.far)[0];
  return Math.max(a, b) > -80 && Math.min(a, b) < LW + 80;
}

function drawHold(c, side){
  if (!holdOnScreen(side)) return;
  holdSide = side;
  const fog = side !== MY;              // the OTHER hold reads as distant, whichever it is
  drawPlateau(c);
  drawGround(c);
  const s = G.sides[side];
  for (let t = 0; t < s.plot.length; t++){
    const gx = tileGX(t), gy = tileGY(t);
    const hot = !fog && t === sel.tile && !sel.node;
    // An empty plot is ground somebody has already cleared and pegged out, not
    // a hole. It used to be a dark translucent wash, which against the dappled
    // grass read as one muddy rectangle in the middle of the hold.
    drawTile(c, gx, gy, s.plot[t] ? '#4d4739' : (hot ? 'rgba(78,163,255,.30)' : 'rgba(132,114,76,.38)'),
      hot ? '#4ea3ff' : (s.plot[t] ? 'rgba(0,0,0,.35)' : null));
    if (!s.plot[t] && !fog){
      // pegs at the corners, and the line run between them
      c.strokeStyle = 'rgba(214,198,152,.34)'; c.lineWidth = Math.max(1, 1.2 * cam.z);
      const k = .22;
      for (const [sx, sy] of [[-1, -1], [1, -1], [1, 1], [-1, 1]]){
        const a = bp(gx + sx * .5, gy + sy * .5), b = bp(gx + sx * (.5 - k), gy + sy * .5);
        const d = bp(gx + sx * .5, gy + sy * (.5 - k));
        c.beginPath(); c.moveTo(b[0], b[1]); c.lineTo(a[0], a[1]); c.lineTo(d[0], d[1]); c.stroke();
      }
      const p = bp(gx, gy, .12);
      c.fillStyle = hot ? '#9ad0ff' : 'rgba(226,214,178,.40)';
      c.font = 'bold ' + Math.round(15 * bu()) + 'px system-ui';
      c.textAlign = 'center'; c.textBaseline = 'middle';
      c.fillText('+', p[0], p[1]); c.textBaseline = 'alphabetic';
    }
  }
  if (!fog && sel.node && NODES[sel.node]){
    const q = bp(NODES[sel.node].gx, NODES[sel.node].gy);
    c.strokeStyle = '#4ea3ff'; c.lineWidth = Math.max(1.5, 2.4 * cam.z);
    c.beginPath(); c.ellipse(q[0], q[1], BSC * .62, BSC * .32, 0, 0, 6.2832); c.stroke();
  }
  const items = [];
  items.push({ y:bp(KEEP.gx, KEEP.gy)[1], f:() => drawKeep(c) });
  for (const k in NODES) items.push({ y:bp(NODES[k].gx, NODES[k].gy)[1], f:() => drawNode(c, k) });
  for (const b of s.plot) if (b) items.push({ y:bp(tileGX(b.tile), tileGY(b.tile))[1], f:() => drawBuilding(c, b) });
  items.sort((a, b) => a.y - b.y);
  for (const it of items) it.f();
  if (!fog){
    const farms = bList(s, 'farm');
    const nf = Math.min(s.workers.food, fieldSlots(s));
    for (let i = 0; i < nf && farms.length; i++){
      const f = farms[i % farms.length];
      const a = G.t * .5 + i * 1.7;
      const q = bp(tileGX(f.tile) + Math.cos(a) * .34, tileGY(f.tile) + .1 + Math.sin(a) * .3, .05);
      drawWorkerFig(c, q[0], q[1], '#7fdc8a', (Math.sin(a) > 0), .85, a * 2.8);
    }
  }
  // Their hold reads as distant through the alpha above. It used to also get a
  // full-height translucent wash the width of their mesa — 8ms of fill-rate a
  // frame, most of it over empty sky.
  c.globalAlpha = 1;
  holdSide = MY;
}

/* ------------------------------------------------------------------ camera + frame */
// The attract battle behind the menu is the first thing anybody sees, and it
// used to sit at one fixed wide zoom with the fighting a few pixels tall in
// the middle of the panel. It sweeps the length of the world now — hold,
// bridge, their gates and back — breathing in and out as it goes.
function demoCam(dt){
  const k = Math.sin(G.t * .085) * .5 + .5;
  const ease = k * k * (3 - 2 * k);
  cam.x = lerp(cam.x, lerp(HOLD_X + 4, C.LANE_LEN + 6, ease), 1 - Math.pow(.25, dt));
  cam.tz = clamp(LW / 1500, .62, 1.05) * (1 + Math.sin(G.t * .13) * .07);
}

function camStep(dt){
  if (G.demo && G.state === 'play'){ demoCam(dt); }
  else if (cam.follow){
    let fx = null;
    const mine = me().heroes.filter(h => !h.dead);
    if (mine.length) fx = mine.reduce((a, h) => a + h.x, 0) / mine.length;
    else fx = frontlineX(0);
    cam.x = lerp(cam.x, clamp(fx, CAM_MIN, CAM_MAX), 1 - Math.pow(.02, dt));
  }
  cam.z = lerp(cam.z, cam.tz, 1 - Math.pow(.005, dt));
  if (cam.shake > 0){
    cam.shake = Math.max(0, cam.shake - dt * 26);
    const a = G.t * 47;
    cam.sx = Math.sin(a) * cam.shake; cam.sy = Math.cos(a * 1.7) * cam.shake * .6;
  } else { cam.sx = 0; cam.sy = 0; }
}

const CAM_MIN = HOLD_X - 26, CAM_MAX = C.LANE_LEN - HOLD_X + 26;
function draw(){
  const c = lctx;
  if (!c) return;
  BSC = LS() * TILE;
  c.save();
  drawSky(c);
  drawChasm(c);            // rock and mist in the gap, behind everything solid
  drawHold(c, 0);
  drawHold(c, 1);
  drawEnds(c);
  drawPiers(c);            // what the deck stands on, so the deck can cap them
  gorgeDepth(c);           // and everything below it falling away into the dark
  drawDeck(c);
  drawLane(c);
  if (sel.struct && !sel.struct.dead){
    const q = lp(sel.struct.x, sel.struct.y);
    c.strokeStyle = '#ffcf4d'; c.lineWidth = Math.max(1.5, 2.2 * cam.z);
    c.beginPath(); c.ellipse(q[0], q[1], (sel.struct.key === 'gate' ? 52 : 20) * cam.z, 11 * cam.z, 0, 0, 6.2832);
    c.stroke();
  }
  if (sel.unit && !sel.unit.dead){
    const q = lp(sel.unit.x, sel.unit.y);
    c.strokeStyle = '#ffcf4d'; c.lineWidth = Math.max(1.2, 1.8 * cam.z);
    c.beginPath(); c.ellipse(q[0], q[1], 9 * cam.z, 4.5 * cam.z, 0, 0, 6.2832); c.stroke();
  }
  flushLabels(c);
  drawMinimap(c);
  c.restore();
}

const $ = (id) => document.getElementById(id);
const RES_CLASS = { gold:'g', iron:'i', wood:'w', food:'f' };
const RES_ICON = { gold:'🪙', iron:'⛏️', wood:'🪵', food:'🌾' };

function costHtml(cost){
  const s = me();
  return '<span class="cost">' + Object.keys(cost).map(k =>
    '<i class="' + RES_CLASS[k] + (s.res[k] < cost[k] ? ' bad' : '') + '">' + RES_ICON[k] + cost[k] + '</i>'
  ).join(' ') + '</span>';
}
function fmt(n){ return n >= 1000 ? (n / 1000).toFixed(1) + 'k' : String(Math.floor(n)); }

// What one job actually pays, per second, right now. The HUD ticker and the
// war report both read this, so they cannot drift apart.
function gatherRate(s, k){
  return Math.min(s.workers[k], nodeCap(s, k)) * nodeRate(s, k) * gatherMul(s);
}
const laneArmy = (side) => G.units.filter(u => !u.dead && !u.isHero && u.side === side).length;

function syncHud(){
  const s = me();
  for (const k of ['gold','iron','wood','food']){
    const el = $('r' + k[0].toUpperCase() + k.slice(1));
    if (!el) continue;
    el.querySelector('b').textContent = fmt(s.res[k]);
    const rate = gatherRate(s, k);
    el.querySelector('.rate').textContent = rate > 0 ? '+' + rate.toFixed(1) : '';
  }
  const pop = $('rPop');
  pop.querySelector('b').textContent = popUsed(s) + '/' + popCap(s);
  pop.classList.toggle('full', popUsed(s) >= popCap(s));
  const wb = $('waveBox');
  wb.querySelector('b').textContent = G.wave;
  $('waveT').textContent = Math.floor(G.waveT / 60) + ':' + String(Math.floor(G.waveT % 60)).padStart(2, '0');
}

// The dock is one row of columns under the world: jobs, training, whatever plot
// you have selected, the forge, and your heroes.
// What the Host put on the bridge this wave, and the one thing that answers
// it. Reads the shape that already spawned — nothing is rolled here, so this
// panel cannot move a single thing in the simulation.
const WAVE_ANSWER = {
  levy:   'A quiet wave — spend it on your hold.',
  shield: 'Tougher bodies. Turret damage cuts through.',
  volley: 'Casters at range. Bodies smother them.',
  siege:  'It tears at stone. Reinforced Stone holds.',
  ogres:  'Heavy and slow. Worth everything you have.',
};
function foeWarning(){
  const f = G.sides[foe()];        // what is coming AT me, not what side 1 happens to be sending
  const k = WAVE_KINDS.find(x => x.id === (f.waveKind || 'levy')) || WAVE_KINDS[0];
  // (no countdown here: the top bar already prints the wave clock)
  return '<b>' + k.n.replace(/^an? /, '') + '</b> — ' + (WAVE_ANSWER[k.id] || '');
}

  if (!narrow)
    return order.map(k => '<div class="dsec' + (k === 'sel' ? ' grow' : '') + '">' + sec[k] + '</div>').join('');

  // Narrow: one section at a time behind tabs, so nothing needs a sideways scroll.
  if (!sec[dockTab]) dockTab = 'jobs';
  const label = { jobs:'JOBS', train:'TRAIN', sel:'BUILD', heroes:'HEROES', forge:'FORGE' };

    label[k] + (alert[k] && k !== dockTab ? '<span class="dot"></span>' : '') + '</button>').join('');
  return '<div class="dtabs">' + tabs + '</div><div class="dsec">' + sec[dockTab] + '</div>';

// The build, at a glance: one pip per skill with its rank, dimmed and filling
// back up while it is on cooldown. You pick these; you should see them work.
function skillPipsHtml(h){
  if (!h.skills.length) return '<div class="pips3"><span class="pip empty">no skills yet</span></div>';
  return '<div class="pips3">' + h.skills.map(sk => {
    const d = SKILL[sk.id];
    const cd = d.cd * (1 - h.cdr - bsum(h, 'bcdr'));
    const rem = clamp(sk.cdT / Math.max(.1, cd), 0, 1);
    const col = castCol(d);
    return '<span class="pip' + (sk.ult ? ' ult' : '') + (rem > 0 ? ' cool' : '') + '" title="' +
      d.n + ' — rank ' + sk.rank + '" style="border-color:' + col + '55">' +
      '<i style="height:' + Math.round(rem * 100) + '%;background:' + col + '44"></i>' +
      '<b>' + d.n.replace(/[^A-Za-z]/g, '').slice(0, 2) + '</b>' +
      '<u>' + sk.rank + '</u></span>';
  }).join('') + '</div>';
}

function heroBarHtml(){

    h += '<button class="hcard' + (hero.dead ? ' dead' : '') + '" data-hero="' + hero.id + '">' +

      '<div class="hc">' + CLS[hero.cls].name + (hero.dead ? ' · down ' + Math.ceil(hero.respawnT) + 's' : '') + '</div>' +
      '<div class="bar hp"><i style="width:' + Math.round(clamp(hero.hp / hero.mhp, 0, 1) * 100) + '%"></i></div>' +
      '<div class="bar mp"><i style="width:' + Math.round(clamp(hero.mana / hero.mmana, 0, 1) * 100) + '%"></i></div>' +
      '<div class="bar xp"><i style="width:' + Math.round(clamp(hero.xp / need, 0, 1) * 100) + '%"></i></div>' +
      skillPipsHtml(hero) +
      '</button>';
  }
  const cap = heroCap(s);
  if (s.heroes.length < cap)
    h += '<button class="hnew" data-act="newhero"' + (canPay(s, HERO_COST) ? '' : ' disabled') + '>＋ Forge Hero<br><span style="font-size:10px">' +
      Object.keys(HERO_COST).map(k => RES_ICON[k] + HERO_COST[k]).join(' ') + '</span></button>';
  else if (cap === 0)
    h += '<button class="hnew" disabled>Build a<br>Hero Factory</button>';
  return h;
}

// What a decent player would do next. Purely advisory — it never acts for you,
// and it goes quiet once the hold is running itself.
function adviceFor(s){
  const bl = barracksLvl(s);
  // Sampled once a second across eight twelve-minute matches, this bar spent
  // 40% of the whole match on one line — 'Every worker is busy, so there is
  // nobody to arm. Train one more.' — because it never looked at what was
  // already in the training queue, so it kept asking for a worker while three
  // were on the way. And 'Build a Hero Factory' held it for an unbroken 152
  // seconds, because it repeated an instruction the hold could not yet pay
  // for and gave no sign of progress toward it.
  //
  // Two rules now: never ask for something already queued, and never ask for
  // something unaffordable without naming what is missing.
  const queued = (type) => s.trainQ.some(q => q.type === type);
  const shortOf = (cost) => {
    const k = ['gold','iron','wood','food']
      .filter(x => (cost[x] || 0) > s.res[x])
      .sort((a, b) => (cost[b] - s.res[b]) - (cost[a] - s.res[a]))[0];
    return k ? { k, n:Math.ceil(cost[k] - s.res[k]) } : null;
  };
  // 'Build X' when you can pay, 'X needs N more wood' when you cannot, so the
  // line moves as the pile fills instead of sitting there for two minutes.
  const buildAdvice = (type, blurb) => {
    const miss = shortOf(buildCost(type, 1));
    return { tab:'sel', txt:miss
      ? BUILDINGS[type].n + ': ' + miss.n + ' more ' + miss.k + ' and you can put one up.'
      : blurb };
  };
  // Nothing in here used to look at the bridge at all. Simulated a player who
  // does nothing: their outer turret crossed 50% health at t=200s, 25% at
  // t=296s and fell at t=300s, and at every one of those instants this bar
  // said the same thing — '1 worker is standing around. Put one on gold.'
  // Damage to an off-screen structure deliberately produces no shake, the
  // minimap draws a dying turret exactly like a healthy one, and the only
  // signal is a toast that fires AFTER it is gone and lasts 2.2 seconds. A
  // player following this bar could lose the front of the bridge and never
  // learn why. A structure in real trouble outranks any economy note.
  // Only the FRONT structure though: everything behind it is shielded and
  // cannot be attacked at all, so a battered turret two ranks back is not news.
  // Restricting it to the one in play barely moved the share, as it turns out
  // (29% vs 28%) — in practice the front structure IS the one being ground
  // down — but it is still the right rule, because a battered turret behind
  // the front cannot be attacked at all. The threshold is what made it mean
  // something: at half health this line held the bar for 29% of a match, at a
  // third it holds it for 14%, at a quarter 9%. A third is the point where the
  // front is genuinely about to break.
  //
  // And for a year it was tested LAST, which meant it never fired for the one
  // player who needed it. Sampled once a second across nine seeded Veteran
  // matches with no input at all, this bar returned the identical eleven words
  // — '1 worker is standing around. Put one on gold.' — in 100% of 3,967
  // samples, the longest unbroken run being 484 seconds, and all nine of those
  // matches were lost. Across the same samples the front structure sat under a
  // third of its health for 630 seconds and the bar named it in NONE of them.
  // The reason is one of ordering: a player who touches nothing always has an
  // idle worker and there is always a job below its cap, so the idle-worker
  // note returned before this block was ever reached. The comment above has
  // claimed this outranks any economy note since the day it was written; it
  // only became true when the block moved up here. Same nine seeds after the
  // move: 630 of 630 danger-seconds named, longest run 484s -> 244s.
  //
  // Deliberately no dwell timer on top. Capping this branch's airtime at 40s
  // was the obvious next step and it is wrong: it drops coverage back to 75%,
  // muting a live 'your turret is at 12%' to make room for 'put a worker on
  // gold'. A structure that is still dying is still the most useful thing the
  // bar can say, and it stops on its own the moment the structure is safe.
  {
    const front = frontStruct(s.i);
    if (front && front.hp < front.mhp * .35)
      return { tab:'sel', txt:(STRUCT_SHORT[front.key] || front.n) + ' is down to ' +
        Math.max(1, Math.round(front.hp / front.mhp * 100)) + '% — they are on it now.' };
  }
  // Arming a fighter eats an idle worker, so once a barracks stands, keep one
  // spare rather than telling you to staff every job and then to arm nobody.
  const spare = bl > 0 ? 1 : 0;
  const idleJob = ['gold','wood','iron','food'].find(k => s.workers[k] < nodeCap(s, k));
  if (s.workers.idle > spare && idleJob){
    const n = s.workers.idle - spare;
    return { tab:'jobs', txt:n + ' worker' + (n > 1 ? 's are' : ' is') + ' standing around. Put ' +
      (n > 1 ? 'them' : 'one') + ' on ' + idleJob + '.' };
  }
  if (popUsed(s) >= popCap(s) - 1)
    return buildAdvice('farm', 'Population is full at ' + popCap(s) + '. Build a Farm on an empty plot.');
  if (bl === 0)
    return buildAdvice('barracks', 'Nothing is armed yet. Build a Barracks to turn workers into fighters.');
  const pend = s.heroes.find(h => h.pend.length);
  if (pend) return { tab:'heroes', txt:pend.name + ' has a choice waiting — tap the hero card.' };
  if (heroCap(s) === 0)
    return buildAdvice('tavern', 'Build a Hero Factory. Heroes fight on their own, and they carry a push.');
  if (s.heroes.length < heroCap(s) && canPay(s, HERO_COST))
    return { tab:'heroes', txt:'You can afford another hero. Forge one.' };
  const armable = Object.keys(TRAIN).filter(k => bl >= TRAIN[k].barracks && canPay(s, TRAIN[k].cost));
  const mustering = s.muster.length > 0 || s.trainQ.some(q => q.type !== 'worker');
  if (!mustering){
    if (s.workers.idle > 0 && armable.length)
      return { tab:'train', txt:'Nothing is mustering. Arm a ' + TRAIN[armable[0]].n +
        ' before wave ' + (G.wave + 1) + ' leaves.' };
    // ...unless one is already on the way, which is what made this the single
    // most-repeated line in the game.
    if (s.workers.idle === 0 && popUsed(s) < popCap(s) && !queued('worker'))
      return { tab:'train', txt:'Every worker is busy, so there is nobody to arm. Train one more.' };
    if (armable.length === 0)
      return { tab:'jobs', txt:'You cannot afford a fighter. Put more workers on iron and wood.' };
  }
  if (bLvl(s, 'forge') === 0 && s.res.iron > 120)
    return buildAdvice('forge', 'You have iron spare. A Forge unlocks turret and minion upgrades.');
  if (workerCount(s) < 10 && popUsed(s) < popCap(s) - 1 && !queued('worker'))
    return { tab:'train', txt:'More workers means more of everything. Train another.' };
  return null;
}

let uiT = 0, saveT = 0;
function syncAdvice(){
  const el = $('advice');
  if (!el) return;
  // A lockstep match waiting on the other machine looks exactly like a frozen
  // game unless it says so, and a desync looks like nothing at all. Both
  // outrank any coaching: there is no point advising a player about their
  // economy in a match that has stopped being the same match.
  const net = netBanner();
  if (net){
    el.classList.remove('hide');
    // A drift or a dead socket is the moment somebody wants to know WHY, so the
    // bar stops being only a sentence and becomes the way in to the report.
    const bad = NET.desyncAt >= 0 || NET.peerLost;
    el.querySelector('.at').textContent = net + (bad ? '  ·  tap for the report' : '');
    el.dataset.tab = '';
    el.dataset.net = bad ? '1' : '';
    return;
  }
  el.dataset.net = '';
  const a = (G.state === 'play' && !G.demo) ? adviceFor(me()) : null;
  el.classList.toggle('hide', !a);
  if (a){ el.querySelector('.at').textContent = a.txt; el.dataset.tab = a.tab; }
}

// A selection can go stale on its own — the minion you were reading about
// takes an arrow. Logic, not rendering, so it runs headless too.
function pruneSel(){
  if (sel.unit && sel.unit.dead) sel.unit = null;
}
function syncUI(){
  if (HEADLESS || !G.sides.length) return;      // resize can fire before the first match exists
  syncHud();
  $('dock').innerHTML = dockHtml();
  syncAdvice();
}
// A click is a press AND a release on the same element. The dock throws away
// its entire innerHTML and rebuilds it five times a second, which destroys
// every button in it — so a click whose press-to-release straddled a rebuild
// released onto an element that no longer existed, and did nothing at all. A
// deliberate click takes 80-150ms against a 220ms rebuild, so this was landing
// often enough to read as "I have to click things twice". It was never a
// multiplayer problem; it has been in the one-player game the whole time.
//
// The fix is to not rebuild the dock out from under a finger that is already
// down. Refreshing is what waits, and it waits at most a fifth of a second —
// every action calls syncUI() directly when it completes, so nothing on screen
// goes stale because of this. Capped, so a press whose release is never
// delivered (dragged off the window, a lost pointer) cannot freeze the dock.
let uiDown = false, uiWaited = 0;
const UI_WAIT_CAP = .66;

function uiTick(dt){
  uiT -= dt;
  if (uiT <= 0){
    uiT = .22;
    if (uiDown && uiWaited < UI_WAIT_CAP) uiWaited += .22;
    else { uiWaited = 0; syncUI(); }
  }
  saveT -= dt;
  if (saveT <= 0){ saveT = 10; saveMatch(); }
}

/* =====================================================================
   LOBBY
   ===================================================================== */
// The relay only introduces the two machines: it hands out a seed and a side
// and copies bytes. Everything about the match happens in the two browsers.
// PLACEHOLDER until the relay is deployed. Durable Objects cannot live in a
// Pages project, so the relay is a separate Worker that has to be deployed
// once by hand (`cd ironbridge-relay && npx wrangler deploy`), and its address
// depends on the workers.dev subdomain of whichever account deploys it — which
// this file cannot know. Point the game at the real one by editing this line,
// or without editing anything:
//     localStorage.setItem('ib_relay', 'ironbridge-relay.YOURNAME.workers.dev')
const RELAY_HOST = 'ironbridge-relay.danhieux-senjka.workers.dev';
const RELAY_UNSET = () => relayHost().includes('.example.workers.dev');
const relayHost = () => {
  try { return localStorage.getItem('ib_relay') || RELAY_HOST; } catch (e) { return RELAY_HOST; }
};
const LOBBY = { sock:null, code:'', state:'idle', err:'' };

function lobbyHtml(){
  const code = LOBBY.code
    ? '<div style="font-size:34px;letter-spacing:10px;font-weight:800;margin:14px 0 4px">' + LOBBY.code + '</div>' +
      '<p class="sub">Send those four letters to whoever you are playing. They pick <b>Play a friend</b>, then <b>Join</b>.</p>'
    : '';
  const body = {
    idle:  (RELAY_UNSET()
             ? '<p class="sub" style="color:#ffcf4d">No relay is set up yet, so this will not connect. ' +
               'It needs a small Cloudflare Worker deployed once — see <b>ironbridge-relay/README.md</b>.</p>'
             : '') +
           '<p class="sub">One of you starts a match and reads out the code. The other types it in.</p>' +
           '<div class="picks">' +
             '<button class="pick" data-act="mphost"><div class="pk">start</div><div class="pt">Start a match</div>' +
             '<div class="pd">You get a four-letter code to pass on.</div></button>' +
             '<button class="pick" data-act="mpjoin"><div class="pk">join</div><div class="pt">Join with a code</div>' +
             '<div class="pd">Type the four letters they read you.</div></button>' +
           '</div>',
    hosting: code + '<p class="sub">Waiting for them to join…</p>',
    joining: '<p class="sub">Type the four letters.</p>' +
             '<div style="margin:14px 0"><input id="mpCode" maxlength="4" autocomplete="off" autocapitalize="characters" ' +
             'style="font-size:30px;letter-spacing:10px;text-align:center;width:190px;padding:8px;text-transform:uppercase;' +
             'background:#0d1117;color:#e6edf3;border:1px solid #30363d;border-radius:8px"></div>' +
             '<div class="picks"><button class="pick" data-act="mpgo"><div class="pt">Join</div></button></div>',
    connecting: '<p class="sub">Connecting…</p>',
    ready:  code + '<p class="sub">Both here. Starting…</p>',
    error:  '<p class="sub" style="color:#ff8f6a">' + (LOBBY.err || 'Something went wrong.') + '</p>' +
            '<div class="picks"><button class="pick" data-act="mp"><div class="pt">Try again</div></button></div>',
  }[LOBBY.state] || '';
  return '<h2>Play a friend</h2>' + body +
    '<div class="picks" style="margin-top:10px"><button class="pick" data-act="mpback"><div class="pt">Back</div></button></div>';
}

function showLobby(){ openModal(lobbyHtml()); if (!HEADLESS && LOBBY.state === 'joining'){ const el = $('mpCode'); if (el) el.focus(); } }
function lobbySet(state, err){ LOBBY.state = state; LOBBY.err = err || ''; showLobby(); }

function lobbyClose(){
  if (LOBBY.sock){ try { LOBBY.sock.close(); } catch (e) {} LOBBY.sock = null; }
  LOBBY.code = ''; LOBBY.state = 'idle'; LOBBY.err = '';
}

async function lobbyHost(){
  lobbySet('connecting');
  try {
    const r = await fetch('https://' + relayHost() + '/new', { method:'POST' });
    const j = await r.json();
    if (!j.code) throw new Error('no code');
    LOBBY.code = j.code;
    lobbyConnect(j.code);
    lobbySet('hosting');
  } catch (e){
    // Naming the host it tried turns "check your connection" — which sends you
    // to look at the wrong thing entirely — into something you can act on. By
    // far the likeliest cause is that the relay has simply never been deployed.
    lobbySet('error', RELAY_UNSET()
      ? 'No relay is set up yet. Two-player needs a small Cloudflare Worker deployed once ' +
        '(see ironbridge-relay/README.md), then set its address in localStorage under "ib_relay". ' +
        'One-player works either way.'
      : 'Could not reach the relay at ' + relayHost() + '. It may be down, or the address may be wrong. ' +
        'One-player works either way.');
  }
}

function lobbyJoin(raw){
  const code = String(raw || '').toUpperCase().replace(/[^A-Z]/g, '');
  if (code.length !== 4) return lobbySet('error', 'A code is four letters.');
  LOBBY.code = code;
  lobbySet('connecting');
  lobbyConnect(code);
}

function lobbyConnect(code){
  let sock;
  try { sock = new WebSocket('wss://' + relayHost() + '/room/' + code); }
  catch (e){ return lobbySet('error', 'Could not open a connection.'); }
  LOBBY.sock = sock;
  sock.onerror = () => lobbySet('error', RELAY_UNSET()
    ? 'No relay is set up yet — see ironbridge-relay/README.md. One-player works either way.'
    : 'Could not reach the relay at ' + relayHost() + '. If the code is right, the room may be full.');
  sock.onclose = (ev) => {
    netDiary('SOCKET CLOSED', 'code ' + ((ev && ev.code) || '?') +
      (ev && ev.reason ? ' "' + ev.reason + '"' : '') + (ev && ev.wasClean ? ' (clean)' : ' (not clean)'));
    // OUR socket, not theirs. A dropped link used to end the match outright; a
    // match seven minutes deep deserves an attempt to get back into it, and the
    // relay holds the room and the seat open for exactly that.
    if (NET.on){ NET.linkLost = true; if (!HEADLESS) syncUI(); netRetry(); }
    else if (LOBBY.state !== 'error') lobbySet('error', 'The connection closed.');
  };
  sock.onmessage = (ev) => {
    let m; try { m = JSON.parse(ev.data); } catch (e){ return; }
    if (m.k === 'hello' || m.k === 'peers') return;
    if (m.k === 'start'){
      // Both machines get here within a few milliseconds of each other, with
      // the same seed and different sides. From this point the relay is only
      // carrying command batches.
      NET.send = (o) => { if (sock.readyState === 1) try { sock.send(JSON.stringify(o)); } catch (e) {} };
      NET.peerLost = false;
      netStart({ me:m.side, seed:m.seed, diff:'veteran' });
      LOBBY.state = 'idle';
      closeModal(); syncUI();
      return;
    }
    if (m.k === 'rejoin'){
      // The room was already playing. `start` is deliberately NOT sent again —
      // it would put the player who never left back on the first tick — so the
      // relay says which of the two is returning and which stayed. The one who
      // stayed is the only one that still knows anything, whichever seat it
      // happens to be sitting in, and it simply hands the board over.
      NET.send = (o) => { if (sock.readyState === 1) try { sock.send(JSON.stringify(o)); } catch (e) {} };
      NET.peerLost = false; NET.linkLost = false; NET.retry = 0;
      netDiary('rejoin', 'role ' + m.role + '  seat ' + m.side);
      if (m.role === 'staying' && NET.on){
        netSendSnap(true);
      } else {
        netStart({ me:m.side, seed:m.seed, diff:'veteran' });
        NET.awaitSync = true;                    // hold until we are told where we are
        netDiary('awaiting board', 'from the player who stayed');
        LOBBY.state = 'idle';
      }
      closeModal(); syncUI();
      return;
    }
    netRecv(m);
  };
}

// One line, only while something is wrong. A lockstep match that is waiting on
// the other machine looks exactly like a frozen game unless it says so.
function netBanner(){
  if (!NET.on) return '';
  if (NET.desyncAt >= 0)
    return NET.resyncs >= SYNC_MAX
      ? 'The two matches keep drifting apart. This one has stopped — it is no longer the same game.'
      : 'The two matches drifted apart. Putting them back together…';
  if (NET.awaitSync) return 'Back in. Picking the match up where it was…';
  if (NET.linkLost) return NET.retry > 0
    ? 'Connection lost — trying to get back in (' + NET.retry + ')…'
    : 'Connection lost.';
  if (NET.peerLost) return 'The other player dropped out. Waiting for them to come back…';
  if (NET.stallT > .4) return 'Waiting for the other player…';
  return '';
}

function optCard(h, kind, id, i){
  if (kind === 'passive'){

      '<div class="pt">' + p.n + '</div><div class="pd">' + p.d + '</div></button>';
  }
  if (kind === 'rank'){
    if (id.startsWith('P:')){
      const p = PASS[id.slice(2)];
      return '<button class="pick" data-act="pick" data-i="' + i + '"><div class="pk">rank ' + (h.passRank + 1) + '</div>' +
        '<div class="pt">' + p.n + '</div><div class="pd">' + p.d + '</div><div class="pm">Strengthens the passive.</div></button>';
    }
    const s = SKILL[id], own = h.skills.find(o => o.id === id);
    return '<button class="pick" data-act="pick" data-i="' + i + '"><div class="pk">rank ' + (own.rank + 1) + '</div>' +
      '<div class="pt">' + s.n + '</div><div class="pd">' + skNums(s, own.rank + 1) + '</div></button>';
  }

function tierRow(h, label, level, kind, filled){
  const pend = h.pend[0];
  const active = pend && pend.kind === kind && (kind !== 'skill' || pend.lvl === level);
  let body;
  if (active) body = '<div class="picks">' + pend.opts.map((id, i) => optCard(h, kind, id, i)).join('') + '</div>';
  else if (filled){
    const s = SKILL[filled.id];
    body = '<div class="chosen"><b>' + s.n + '</b> <span class="pips">' +
      '●'.repeat(filled.rank) + '<span style="opacity:.3">' + '●'.repeat(C.MAX_HERO_RANK - filled.rank) + '</span></span>' +
      '<div class="pd">' + skNums(s, filled.rank) + '</div></div>';
  } else body = '<div class="locked">' + (h.lvl >= level ? 'nothing chosen' : 'unlocks at level ' + level) + '</div>';
  return '<div class="tier' + (active ? ' hot' : '') + '"><div class="tl">' + label + '</div><div class="tb">' + body + '</div></div>';
}

// Health and the road to the next choice, as bars you can read at a glance —
// the numbers alone never said "two thirds of the way to a new skill".
function heroMeters(h){
  const need = xpNeed(h.lvl), maxed = h.lvl >= C.MAX_LEVEL;
  const xpPct = maxed ? 100 : clamp(h.xp / Math.max(1, need), 0, 1) * 100;
  const nextPick = h.lvl < C.SKILL_TIERS[0] ? C.SKILL_TIERS[0]
    : C.SKILL_TIERS.concat([C.ULT_LEVEL], C.RANK_LEVELS).find(l => l > h.lvl);
  return '<div class="hp-meter"><i class="hm-hp" style="width:' +
      (clamp(h.hp / h.mhp, 0, 1) * 100).toFixed(1) + '%"></i>' +
      '<em>' + Math.round(h.hp) + ' / ' + Math.round(h.mhp) + '</em></div>' +
    '<div class="hp-meter sm"><i class="hm-xp" style="width:' + xpPct.toFixed(1) + '%"></i>' +
      '<em>' + (maxed ? 'fully grown' : nextPick ? 'level ' + nextPick + ' unlocks a pick' : 'level ' + (h.lvl + 1)) + '</em></div>';
}
function heroDoing(h){
  if (h.dead) return 'Reforging — back in ' + Math.ceil(h.respawnT) + 's.';
  if (h.pend.length) return 'Waiting on you to choose.';
  if (!h.inLane) return 'In the hold, ready to march.';
  if (h.target) return 'Fighting on the bridge.';
  return 'Marching.';
}

// The board holds only for a choice the PLAYER has to make: an unresolved pick
// on a hero of theirs, with the sheet actually open. A pending pick alone must
// not freeze anything — the match would stop with nothing on screen to explain
// why — and the Host's own picks are resolved by autoPick in the same tick.
function holdsBoard(h){
  // A two-player match belongs to two people and cannot stop for one of them
  // reading three cards. This is not merely a courtesy: update() returns early
  // on G.held, while netStep() advances the tick and publishes orders either
  // way — so a held board meant one machine stopped simulating while its clock
  // and its opponent carried on. Every match desynced the first time anybody
  // levelled a hero, which is to say every match.
  if (NET.on) return false;
  return !!(h && h.pend && h.pend.length && h.side === MY && !me().ai && G.state === 'play');
}

function showHeroSheet(h){
  // A held sheet used to look exactly like an idle peek at a hero: the same
  // 42%-opacity 1px-blur backdrop, and the pause button still reading the
  // 'currently running' icon. A player who had once opened this sheet mid-fight
  // out of curiosity — which correctly does NOT hold — had no way to tell that
  // this time the whole match had stopped for them, so they might panic-pick,
  // or tab away believing their hero was still out there undefended. A real
  // pause looks like a pause; so does this now.
  G.held = holdsBoard(h);
  const pend = h.pend[0];
  const passRow = (() => {
    if (pend && pend.kind === 'passive')
      return '<div class="tier hot"><div class="tl">Creation (Passive)</div><div class="tb"><div class="picks">' +
        pend.opts.map((id, i) => optCard(h, 'passive', id, i)).join('') + '</div></div></div>';
    const p = PASS[h.passive];
    return '<div class="tier"><div class="tl">Creation (Passive)</div><div class="tb"><div class="chosen"><b>' + (p ? p.n : '—') + '</b>' +
      ' <span class="pips">' + '●'.repeat(h.passRank) + '<span style="opacity:.3">' + '●'.repeat(C.MAX_HERO_RANK - h.passRank) + '</span></span>' +
      '<div class="pd">' + (p ? p.d : '') + '</div></div></div></div>';
  })();
  const basics = h.skills.filter(s => !s.ult), ult = h.skills.find(s => s.ult);
  let rows = passRow;
  C.SKILL_TIERS.forEach((lv, i) => { rows += tierRow(h, 'Level ' + lv + ' Skill', lv, 'skill', basics[i]); });
  rows += tierRow(h, 'Level 12 (Ultimate)', C.ULT_LEVEL, 'ult', ult);
  const rankPend = pend && pend.kind === 'rank';
  rows += '<div class="tier' + (rankPend ? ' hot' : '') + '"><div class="tl">Skill Progression (15+)</div><div class="tb">' +
    (rankPend ? '<div class="picks">' + pend.opts.map((id, i) => optCard(h, 'rank', id, i)).join('') + '</div>'
      : '<div class="locked">A rank at levels ' + C.RANK_LEVELS.join(', ') + '. Next at ' +
        (C.RANK_LEVELS.find(l => l > h.lvl) || 'max') + '.</div>') + '</div></div>';

  openModal('<div class="parch"><h2>Hero Profile</h2>' +
    (G.held ? '<div class="heldbar">The match is held while you choose.</div>' : '') +
    '<div class="hp-grid"><div class="hp-left">' +
    '<div class="portrait" data-cls="' + h.cls + '"><span>' + classGlyph(h.cls) + '</span>' +
    '<span class="pcls">' + CLS[h.cls].name + '</span></div>' +
    '<div class="hp-name">' + h.name + '</div>' +
    '<div class="hp-lvl">Level ' + h.lvl + ' · ' + CLS[h.cls].name + '</div>' +
    heroMeters(h) +
    // one column: two columns of 79px cut "2692 / 2692" in half
    '<div class="hp-stats">' +
    '<span>Damage<b>' + Math.round(attackDamage(h)) + '</b></span>' +
    (h.ap >= 1 ? '<span>Power<b>' + Math.round(h.ap) + '</b></span>' : '') +
    // the two numbers either side of these already report what the sim uses
    // rather than the stored stat; these two reported the stored one, which is
    // exactly the number that was wrong
    '<span>Armour<b>' + Math.round(effArmor(h, false)) + '</b></span>' +
    '<span>Resist<b>' + Math.round(effArmor(h, true)) + '</b></span>' +
    '<span>Atk speed<b>' + attackSpeedOf(h).toFixed(2) + '</b></span>' +
    '<span>Record<b>' + h.kills + ' / ' + h.deaths + '</b></span>' +
    '</div><div class="hp-doing">' + heroDoing(h) + '</div>' +
    '<div class="hp-blurb">' + CLS[h.cls].blurb + '</div></div>' +
    '<div class="hp-right"><div class="grid-title">Skill Selection Grid</div>' + rows + '</div></div>' +
    '<div class="rowbtn"><button class="big ghost" data-act="close">Back to the bridge</button></div></div>', G.held);
}
const classGlyph = (cls) => ({ tank:'🛡️', fighter:'⚔️', marksman:'🏹', mage:'🔮', assassin:'🗡️', support:'✨' })[cls] || '⚔️';

// How the match actually went: every structure that fell, in order, on a
// shared time axis. A win that was never in doubt looks nothing like one that
// turned at the twelfth minute, and the card should show which you had.
function timelineHtml(){
  if (!G.timeline.length) return '<div class="tl-empty">Not a single wall came down.</div>';
  const end = Math.max(G.t, 1);
  const rows = [0, 1].map(side => {
    const marks = G.timeline.filter(e => e.side === side).map(e => {
      const left = clamp(e.t / end, 0, 1) * 100;
      const cls = e.key === 'gate' ? ' gate' : e.key === 'inhib' ? ' inhib' : '';
      return '<i class="tl-m' + cls + '" style="left:' + left.toFixed(2) + '%" title="' +
        e.n + ' — ' + mmss(e.t) + '"></i>';
    }).join('');
    // "Yours" read as "walls you broke"; the marks are walls that FELL, so it
    // has to say whose walls they were.
    return '<div class="tl-row"><span class="tl-lbl" style="color:' + SIDE_COL[side] + '">' +
      (side === MY ? 'You lost' : 'They lost') + '</span><span class="tl-track">' + marks + '</span></div>';
  }).join('');
  return '<div class="tl">' + rows +
    '<div class="tl-axis"><span>0:00</span><span>' + mmss(end) + '</span></div>' +
    '<div class="legend"><span><i class="tl-m dot"></i> turret</span>' +
    '<span><i class="tl-m inhib dot"></i> inhibitor</span>' +
    '<span><i class="tl-m gate dot"></i> gates</span></div></div>';
}

/* ------------------------------------------------------------------ pause
   Pausing used to just stop the clock. A ten-minute match is long enough that
   the useful question at that moment is "how am I actually doing?", so the
   pause is a war report: the line of battle on both sides, and every number
   that decides the next five minutes, yours next to theirs.                 */
function lineOfBattle(side){
  const front = frontStruct(side);
  return '<div class="lob">' + G.sides[side].structs.map(st => {
    const cls = st.dead ? ' gone' : st === front ? ' front' : '';
    const pct = st.dead ? 0 : Math.round(clamp(st.hp / st.mhp, 0, 1) * 100);
    return '<span class="lb' + cls + '" title="' + st.n + '">' +
      '<i style="height:' + pct + '%"></i><em>' + (st.dead ? '—' : pct + '%') + '</em>' +
      '<u>' + (st.key === 'gate' ? 'gates' : st.key === 'inhib' ? 'inhib' : st.key.toUpperCase()) + '</u></span>';
  }).join('') + '</div>';
}

// One row of "yours against theirs", green when you are ahead. Shared by the
// pause report and the result card so a match reads the same way all through.
function wrRow(label, mine, theirs, better){
  const win = better === undefined ? 0 : (better ? (mine > theirs ? 1 : mine < theirs ? -1 : 0)
                                                 : (mine < theirs ? 1 : mine > theirs ? -1 : 0));
  return '<div class="wr-row"><b class="' + (win > 0 ? 'good' : win < 0 ? 'bad' : '') + '">' + mine + '</b>' +
    '<span>' + label + '</span><b>' + theirs + '</b></div>';
}

function pauseHtml(){
  const s = me(), f = G.sides[foe()];
  const row = wrRow;
  const inc = (sd) => ['gold','iron','wood','food'].reduce((a, k) => a + gatherRate(sd, k), 0).toFixed(1);
  const heroLine = (sd) => sd.heroes.length
    ? sd.heroes.map(h => h.name + ' ' + h.lvl).join(', ') : 'none';
  return '<h2>Paused</h2>' +
    '<p class="sub">Wave ' + G.wave + ' · ' + mmss(G.t) + ' · ' + G.diff.n + '</p>' +
    '<div class="wr">' +
    '<div class="wr-head"><b style="color:' + SIDE_COL[MY] + '">' + SIDE_NAME[MY] + '</b>' +
    '<span>line of battle</span><b style="color:' + SIDE_COL[foe()] + '">' + SIDE_NAME[foe()] + '</b></div>' +
    '<div class="wr-lob">' + lineOfBattle(MY) + lineOfBattle(foe()) + '</div>' +
    row('structures standing', liveStructs(MY).length, liveStructs(foe()).length, true) +
    row('walls broken', s.structsKilled, f.structsKilled, true) +
    row('kills', s.kills, f.kills, true) +
    row('on the bridge', laneArmy(MY), laneArmy(foe()), true) +
    row('population', popUsed(s) + '/' + popCap(s), popUsed(f) + '/' + popCap(f)) +
    row('gathering /s', inc(s), inc(f), true) +
    row('forge ranks', bsumUp(s), bsumUp(f), true) +
    row('heroes', heroLine(s), heroLine(f)) +
    '</div>' +
    (() => { const a = adviceFor(s); return a ? '<div class="wr-next"><b>NEXT</b> ' + a.txt + '</div>' : ''; })() +
    '<div class="rowbtn"><button class="big" data-act="unpause">Resume</button>' +
    '<button class="big ghost" data-act="menu">Menu</button></div>';
}
const bsumUp = (sd) => Object.values(sd.towerUp).reduce((a, v) => a + v, 0) +
                       Object.values(sd.troopUp).reduce((a, v) => a + v, 0);

function setPaused(v){
  // A two-player match cannot stop for one of the two people in it.
  //
  // This was not merely useless, it was a trap. The network loop never read
  // G.paused — it steps on its own clock — so pausing did not stop the board.
  // It only threw a blocking, opaque sheet over a match that was still being
  // fought, with the other player still building and the wave still walking
  // into your gates, and no way to see any of it. The one control on screen
  // that promises the board has stopped was lying.
  //
  // Refused outright rather than made to work. Making it work means both
  // players agreeing to stop, which is a negotiation the relay would have to
  // carry and a new way for a match to get stuck if the message is lost.
  if (v && NET.on){
    if (!HEADLESS) fxToast('A two-player match cannot be paused — the other player is still playing.', 'bad');
    return;
  }
  G.paused = v;
  if (HEADLESS) return;
  paintHeld();
  if (v) openModal(pauseHtml(), true); else closeModal();
}

// What your hero actually became. The build is the whole point of the hero
// system and the result card used to throw it away with the match.
function heroCard(h, star){
  const p = PASS[h.passive];
  const skills = h.skills.slice().sort((a, b) => (a.ult ? 1 : 0) - (b.ult ? 1 : 0));
  return '<div class="hc"><div class="hc-top"><span class="hc-g">' + classGlyph(h.cls) + '</span>' +
    '<b>' + (star ? '★ ' : '') + h.name + '</b>' +
    '<span class="hc-lv">Lv ' + h.lvl + ' · ' + CLS[h.cls].name + '</span>' +
    '<span class="hc-kd">' + h.kills + '/' + h.deaths + '</span></div>' +
    '<div class="hc-build">' + (p ? '<i>' + p.n + '</i>' : '') +
    skills.map(s => '<i' + (s.ult ? ' class="ult"' : '') + '>' + SKILL[s.id].n +
      (s.rank > 1 ? ' ' + s.rank : '') + '</i>').join('') +
    (h.skills.length ? '' : '<span class="hc-none">no skills chosen</span>') + '</div></div>';
}

function overHtml(){
  const win = G.winner === MY;
  const s = me(), f = G.sides[foe()];
  const meta = loadMeta();
  const record = win && meta.best && G.t <= meta.best;
  const star = s.heroes.slice().sort((a, b) => (b.kills - b.deaths) - (a.kills - a.deaths))[0];
  const heroes = s.heroes.length
    ? '<div class="hcs">' + s.heroes.map(h => heroCard(h, h === star && h.kills > 0)).join('') + '</div>'
    : '<div class="wr-next">You never forged a hero. A Hero Factory pays for itself.</div>';
  return '<h2>' + (win ? 'The Ember gates are down.' : 'Your gates are down.') + '</h2>' +
    '<p class="sub">' + (win ? 'Ironbridge is yours' : 'The Host walks across your bridge') +
    ' — ' + mmss(G.t) + ', wave ' + G.wave + ' on ' + G.diff.n + '.' +
    (record ? ' <b style="color:var(--gold)">Your fastest win yet.</b>' : '') + '</p>' +
    timelineHtml() +
    '<div class="wr">' +
    '<div class="wr-head"><b style="color:' + SIDE_COL[MY] + '">' + SIDE_NAME[MY] + '</b>' +
    '<span>final tally</span><b style="color:' + SIDE_COL[foe()] + '">' + SIDE_NAME[foe()] + '</b></div>' +
    wrRow('walls broken', s.structsKilled, f.structsKilled, true) +
    wrRow('kills', s.kills, f.kills, true) +
    wrRow('gathered', Math.round(s.gathered), Math.round(f.gathered), true) +
    wrRow('forge ranks', bsumUp(s), bsumUp(f), true) +
    wrRow('best hero', s.heroes.length ? Math.max(...s.heroes.map(h => h.lvl)) : 0,
                      f.heroes.length ? Math.max(...f.heroes.map(h => h.lvl)) : 0, true) +
    '</div>' + heroes +
    '<div class="rowbtn"><button class="big" data-act="again">Fight again</button>' +
    '<button class="big ghost" data-act="menu">Menu</button></div>';
}

function showOver(){

}
