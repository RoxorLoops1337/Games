  const base = dead ? '#4a4740' : shade(col, .42);
  if (st.key === 'gate'){
    const w = 26 * cam.z, h = 62 * cam.z;
    poly(c, [[p[0] - w * 2.1, p[1]], [p[0] + w * 2.1, p[1]], [p[0] + w * 1.9, p[1] - h], [p[0] - w * 1.9, p[1] - h]],
      dead ? '#3d3a34' : '#6b6558');
    if (!dead){
      c.fillStyle = shade(col, .55);
      c.fillRect(p[0] - w * .55, p[1] - h * .8, w * 1.1, h * .8);
      c.strokeStyle = 'rgba(20,18,14,.7)'; c.lineWidth = 1.5;
      for (let i = -2; i <= 2; i++){ c.beginPath(); c.moveTo(p[0] + i * w * .22, p[1] - h * .8); c.lineTo(p[0] + i * w * .22, p[1]); c.stroke(); }
      for (const sx of [-1, 1]){
        c.fillStyle = '#7a7365';
        c.fillRect(p[0] + sx * w * 1.6 - 11 * cam.z, p[1] - h * 1.35, 22 * cam.z, h * 1.35);
        c.fillStyle = col;
        c.fillRect(p[0] + sx * w * 1.6 - 4 * cam.z, p[1] - h * 1.5, 8 * cam.z, 16 * cam.z);
      }
    }
  } else if (st.key === 'inhib'){
    const h = 40 * cam.z;
    poly(c, [[p[0] - 20 * cam.z, p[1]], [p[0] + 20 * cam.z, p[1]], [p[0] + 14 * cam.z, p[1] - 12 * cam.z], [p[0] - 14 * cam.z, p[1] - 12 * cam.z]], base);
    if (!dead){
      const t = Math.sin(G.t * 2 + st.side) * .5 + .5;
      poly(c, [[p[0], p[1] - h - 12 * cam.z], [p[0] + 13 * cam.z, p[1] - h * .5], [p[0], p[1] - 10 * cam.z], [p[0] - 13 * cam.z, p[1] - h * .5]],
        shade(col, .8 + t * .3), '#ffffff', 1);
      c.globalAlpha = .25 + t * .2;
      ell(c, p[0], p[1] - h * .6, 26 * cam.z, 26 * cam.z, col);
      c.globalAlpha = 1;
    } else {
      c.fillStyle = 'rgba(90,80,70,.7)';
      poly(c, [[p[0] - 12 * cam.z, p[1]], [p[0] + 8 * cam.z, p[1] - 10 * cam.z], [p[0] + 14 * cam.z, p[1]]], '#57514a');
    }
  } else {
    const h = (dead ? 16 : 52) * cam.z, w = 15 * cam.z;
    poly(c, [[p[0] - w * 1.5, p[1]], [p[0] + w * 1.5, p[1]], [p[0] + w * 1.15, p[1] - 10 * cam.z], [p[0] - w * 1.15, p[1] - 10 * cam.z]], '#5d574d');
    poly(c, [[p[0] - w, p[1] - 8 * cam.z], [p[0] + w, p[1] - 8 * cam.z], [p[0] + w * .74, p[1] - h], [p[0] - w * .74, p[1] - h]],
      dead ? '#4b463f' : '#837b6b');
    if (!dead){
      c.fillStyle = shade(col, .6);
      for (let i = -2; i <= 2; i++) c.fillRect(p[0] + i * w * .38 - 2 * cam.z, p[1] - h - 7 * cam.z, 4.5 * cam.z, 8 * cam.z);
      c.fillStyle = '#6f6858'; c.fillRect(p[0] - w * .86, p[1] - h - 4 * cam.z, w * 1.72, 5 * cam.z);
      const glow = st.cd < .35 ? 1 : .45;
      c.globalAlpha = glow;
      ell(c, p[0], p[1] - h * .62, 5.5 * cam.z, 5.5 * cam.z, col);
      c.globalAlpha = 1;
      // banner
      c.fillStyle = col;
      poly(c, [[p[0] + w * .8, p[1] - h * .82], [p[0] + w * 1.7, p[1] - h * .74], [p[0] + w * 1.6, p[1] - h * .42], [p[0] + w * .8, p[1] - h * .5]], col);
    }
  }
  if (!dead) hpBar(c, p[0], p[1] - (st.key === 'gate' ? 88 : st.key === 'inhib' ? 62 : 68) * cam.z, st, 44 * cam.z, true);
  else if (st.downT > 0){
    c.fillStyle = '#d8c49a'; c.font = (11 * cam.z) + 'px system-ui'; c.textAlign = 'center';
    c.fillText(Math.ceil(st.downT) + 's', p[0], p[1] - 18 * cam.z);
  }
  if (st.hitT > 0 && !dead){
    c.globalAlpha = st.hitT * 2.2; ell(c, p[0], p[1] - 20 * cam.z, 26 * cam.z, 20 * cam.z, '#ffffff'); c.globalAlpha = 1;
  }
}

function hpBar(c, x, y, u, w, big){
  const f = clamp(u.hp / u.mhp, 0, 1);
  const h = big ? 5 * cam.z : 3.2 * cam.z;
  c.fillStyle = 'rgba(8,10,14,.8)'; c.fillRect(x - w / 2 - 1, y - 1, w + 2, h + 2);
  c.fillStyle = u.side === 0 ? '#54d06a' : '#e0544a';
  c.fillRect(x - w / 2, y, w * f, h);
  if (u.shield > 0){
    const sf = clamp(u.shield / u.mhp, 0, 1);
    c.fillStyle = 'rgba(220,235,255,.85)';
    c.fillRect(x - w / 2, y, w * Math.min(1, sf), h * .45);
  }
}

function drawUnit(c, u){
  const p = lp(u.x, u.y), S = LS();
  const col = SIDE_COL[u.side], sc = (u.isHero ? 1.75 : u.kind === 'cannon' || u.kind === 'super' ? 1.45 : 1.18) * cam.z;
  ell(c, p[0], p[1] + 1, 7 * sc, 3.4 * sc, 'rgba(0,0,0,.32)');
  const bob = Math.sin(G.t * 7 + u.ph) * (u.target && Math.hypot(u.target.x - u.x, u.target.y - u.y) < u.rng + 1 ? .6 : 1.4) * sc * .4;
  const bx = p[0], by = p[1] - 2 * sc + bob;
  // legs + body
  c.strokeStyle = shade(col, .45); c.lineWidth = 2 * sc;
  c.beginPath(); c.moveTo(bx - 2 * sc, by); c.lineTo(bx - 2.6 * sc, p[1]); c.moveTo(bx + 2 * sc, by); c.lineTo(bx + 2.6 * sc, p[1]); c.stroke();
  const body = u.hitT > 0 ? '#ffffff' : col;
  c.fillStyle = body;
  c.beginPath();
  c.moveTo(bx - 4.2 * sc, by); c.lineTo(bx + 4.2 * sc, by);
  c.lineTo(bx + 3.2 * sc, by - 9 * sc); c.lineTo(bx - 3.2 * sc, by - 9 * sc);
  c.closePath(); c.fill();
  c.fillStyle = shade(body, .72);
  c.fillRect(bx - 4.2 * sc, by - 4 * sc, 8.4 * sc, 1.6 * sc);
  // head
  ell(c, bx, by - 11.6 * sc, 3 * sc, 3.2 * sc, u.hitT > 0 ? '#ffffff' : '#e8d6b8');
  c.fillStyle = shade(col, .55);
  c.fillRect(bx - 3.1 * sc, by - 14.4 * sc, 6.2 * sc, 2.6 * sc);
  // weapon by role
  const sw = u.swing > 0 ? 1 : 0;
  c.strokeStyle = '#d8dbe2'; c.lineWidth = 1.7 * sc; c.lineCap = 'round';
  const dir = dirOf(u.side);
  c.beginPath();
  if (u.kind === 'caster' || u.cls === 'mage' || u.cls === 'support'){
    c.moveTo(bx + dir * 4 * sc, by - 2 * sc); c.lineTo(bx + dir * 5 * sc, by - 15 * sc);
    c.stroke();
    ell(c, bx + dir * 5 * sc, by - 16 * sc, 2.2 * sc, 2.2 * sc, u.side === 0 ? '#9ad8ff' : '#ffb08a');
    c.beginPath();
  } else if (u.rng > 3){
    c.moveTo(bx + dir * 3 * sc, by - 9 * sc); c.lineTo(bx + dir * 6 * sc, by - 3 * sc);
  } else {
    c.moveTo(bx + dir * 3.5 * sc, by - 6 * sc);
    c.lineTo(bx + dir * (7 + sw * 3) * sc, by - (10 - sw * 7) * sc);
  }
  c.stroke(); c.lineCap = 'butt';
  if (u.kind === 'cannon'){
    c.fillStyle = '#4a4640';
    c.fillRect(bx - 6 * sc, by - 5 * sc, 12 * sc, 5 * sc);
    ell(c, bx + dir * 7 * sc, by - 3 * sc, 3 * sc, 3 * sc, '#33302b');
  }
  if (u.shield > 0){
    c.globalAlpha = .3; ell(c, bx, by - 6 * sc, 9 * sc, 11 * sc, '#cfe6ff'); c.globalAlpha = 1;
  }
  if (u.burn){ c.globalAlpha = .5; ell(c, bx, by - 6 * sc, 5 * sc, 8 * sc, '#ff8a3d'); c.globalAlpha = 1; }
  if (u.stunT > 0){
    c.fillStyle = '#ffcf4d';
    for (let i = 0; i < 3; i++){
      const a = G.t * 6 + i * 2.1;
      ell(c, bx + Math.cos(a) * 6 * sc, by - 17 * sc + Math.sin(a) * 2 * sc, 1.5 * sc, 1.5 * sc, '#ffcf4d');
    }
  }
  hpBar(c, bx, by - (u.isHero ? 22 : 18) * sc, u, (u.isHero ? 30 : 17) * sc, u.isHero);
  if (u.isHero){
    c.fillStyle = '#0b0f18'; c.strokeStyle = col; c.lineWidth = 1.4;
    c.beginPath(); c.arc(bx - 20 * sc, by - 20 * sc, 6.5 * sc, 0, 6.2832); c.fill(); c.stroke();
    c.fillStyle = '#ffcf4d'; c.font = 'bold ' + (7.5 * sc) + 'px system-ui'; c.textAlign = 'center'; c.textBaseline = 'middle';
    c.fillText(String(u.lvl), bx - 20 * sc, by - 19.6 * sc);
    c.fillStyle = '#e7ecf6'; c.font = (7 * sc) + 'px system-ui'; c.textBaseline = 'alphabetic';
    c.fillText(u.name, bx, by - 26 * sc);
    c.strokeStyle = 'rgba(255,255,255,.25)'; c.lineWidth = 1;
    c.beginPath(); c.ellipse(bx, p[1], 11 * sc, 5 * sc, 0, 0, 6.2832); c.stroke();
  }
}

function drawLane(){
  const c = lctx;
  if (!c) return;
  c.save();
  drawSky(c);
  drawEnds(c);
  drawDeck(c);
  // zones under everyone
  for (const z of G.zones){
    const p = lp(z.x, z.y);
    c.globalAlpha = .22 + .1 * Math.sin(G.t * 6);
    ell(c, p[0], p[1], z.r * LS() * .96, z.r * LS() * .55, z.magic ? '#a06bff' : '#ff8a3d');
    c.globalAlpha = 1;
  }
  const draws = [];
  for (const s of G.sides) for (const st of s.structs) draws.push({ y:lp(st.x, st.y)[1], f:() => drawStructure(c, st) });
  for (const u of G.units){ if (!u.dead) draws.push({ y:lp(u.x, u.y)[1], f:() => drawUnit(c, u) }); }
  draws.sort((a, b) => a.y - b.y);
  for (const d of draws) d.f();
  // projectiles
  for (const p of G.projs){
    const q = lp(p.x, p.y, p.z);
    c.globalAlpha = .55; ell(c, q[0], q[1], 4.5 * cam.z, 4.5 * cam.z, p.col); c.globalAlpha = 1;
    ell(c, q[0], q[1], 2.2 * cam.z, 2.2 * cam.z, '#ffffff');
  }
  // particles
  for (const p of G.fx){
    const a = clamp(p.t / p.dur, 0, 1);
    if (p.k === 'p'){
      const q = lp(p.x, p.y, p.z);
      c.globalAlpha = a; ell(c, q[0], q[1], p.r * cam.z, p.r * cam.z, p.col);
    } else if (p.k === 'ring'){
      const q = lp(p.x, p.y);
      c.globalAlpha = a * .8; c.strokeStyle = p.col; c.lineWidth = 2.5 * cam.z;
      c.beginPath(); c.ellipse(q[0], q[1], p.r * LS() * (1.35 - a * .35), p.r * LS() * .55 * (1.35 - a * .35), 0, 0, 6.2832); c.stroke();
    } else if (p.k === 'bolt'){
      const q = lp(p.x, p.y, .8), q2 = lp(p.x2, p.y2, .8);
      c.globalAlpha = a; c.strokeStyle = p.col; c.lineWidth = 2.4 * cam.z;
      c.beginPath(); c.moveTo(q[0], q[1]); c.lineTo(q2[0], q2[1]); c.stroke();
    }
    c.globalAlpha = 1;
  }
  // damage numbers
  c.textAlign = 'center';
  for (const f of G.floats){
    const q = lp(f.x, f.y, 1.4);
    c.globalAlpha = clamp(f.t / f.dur, 0, 1);
    c.fillStyle = f.col; c.font = 'bold ' + (11 * f.sc * cam.z) + 'px system-ui';
    c.fillText(String(f.txt), q[0], q[1] - (1 - f.t / f.dur) * 22);
    c.globalAlpha = 1;
  }
  drawMinimap(c);
  c.restore();
}

function drawMinimap(c){
  const w = Math.min(300, LW - 24), h = 30, x0 = LW - w - 12, y0 = LH - h - 10;
  c.fillStyle = 'rgba(8,12,18,.72)'; c.fillRect(x0, y0, w, h);
  c.strokeStyle = '#2a3446'; c.lineWidth = 1; c.strokeRect(x0 + .5, y0 + .5, w - 1, h - 1);
  const mx = (x) => x0 + 6 + (x / C.LANE_LEN) * (w - 12);
  c.fillStyle = '#3d4658'; c.fillRect(x0 + 6, y0 + h / 2 - 2, w - 12, 4);
  for (const s of G.sides) for (const st of s.structs){
    if (st.dead) continue;
    c.fillStyle = SIDE_COL[s.i];
    const sz = st.key === 'gate' ? 5 : st.key === 'inhib' ? 4 : 3;
    c.fillRect(mx(st.x) - sz / 2, y0 + h / 2 - sz, sz, sz * 2);
  }
  for (const u of G.units){
    if (u.dead) continue;
    c.fillStyle = u.isHero ? '#ffffff' : SIDE_COL2[u.side];
    const sz = u.isHero ? 3 : 1.6;
    c.fillRect(mx(u.x) - sz / 2, y0 + h / 2 + u.y * .8 - sz / 2, sz, sz);
  }
  // camera window
  const halfW = (LW * .5) / (LS() * .96);
  c.strokeStyle = 'rgba(255,255,255,.5)';
  c.strokeRect(mx(cam.x - halfW), y0 + 3, Math.max(4, (halfW * 2 / C.LANE_LEN) * (w - 12)), h - 6);
}

/* =====================================================================
   RENDERING — your hold
   ===================================================================== */
const sel = { tile:-1, build:null, hero:null };
let BSC = 30, BOX = { cx:0, cy:0 };
function bp(gx, gy, z){
  const S = BSC;
  return [ (gx - gy - BOX.cx) * S * .88 + BW * .5,
           (gx + gy - BOX.cy) * S * .50 + BH * .54 - (z || 0) * S * .82 ];
}
// Fit the whole hold — plot, mines, woodland, hall — into whatever space the
// panel leaves us, so the view never drifts into a corner of empty grass.
function baseFit(){
  let minA = 1e9, maxA = -1e9, minB = 1e9, maxB = -1e9;
  const add = (gx, gy, pad) => {
    const a = gx - gy, b = gx + gy;
    minA = Math.min(minA, a - pad); maxA = Math.max(maxA, a + pad);
    minB = Math.min(minB, b - pad); maxB = Math.max(maxB, b + pad);
  };
  for (let t = 0; t < PLOT_W * PLOT_H; t++) add(tileGX(t), tileGY(t), .8);
  for (const k in NODES) add(NODES[k].gx, NODES[k].gy, 1.3);
  add(KEEP.gx, KEEP.gy, 1.2);
  const sx = (BW - 14) / ((maxA - minA) * .88);
  const sy = (BH - 26) / ((maxB - minB) * .50 + 3.2 * .82);
  BSC = clamp(Math.min(sx, sy), 12, 64);
  BOX.cx = (minA + maxA) / 2; BOX.cy = (minB + maxB) / 2;
}
const tileGX = (t) => (t % PLOT_W) - (PLOT_W - 1) / 2;
const tileGY = (t) => Math.floor(t / PLOT_W) - (PLOT_H - 1) / 2;
const NODES = {
  gold: { gx:4.8, gy:-1.6, n:'Gold Mine', col:'#ffcf4d' },
  iron: { gx:5.2, gy:2.2,  n:'Iron Mine', col:'#b9c6d8' },
  wood: { gx:0.4, gy:5.0,  n:'Woodland',  col:'#6fbf5a' },
};
const KEEP = { gx:-3.5, gy:-2.0 };

function drawTile(c, gx, gy, fill, stroke){
  poly(c, [bp(gx - .5, gy - .5), bp(gx + .5, gy - .5), bp(gx + .5, gy + .5), bp(gx - .5, gy + .5)], fill, stroke, 1);
}

function drawHouse(c, gx, gy, w, d, wh, rh, wall, roof){
  const A = bp(gx - w, gy - d), B = bp(gx + w, gy - d), Cc = bp(gx + w, gy + d), D = bp(gx - w, gy + d);
  const A1 = bp(gx - w, gy - d, wh), B1 = bp(gx + w, gy - d, wh), C1 = bp(gx + w, gy + d, wh), D1 = bp(gx - w, gy + d, wh);
  poly(c, [D, Cc, C1, D1], shade(wall, .70));
  poly(c, [Cc, B, B1, C1], shade(wall, .92));
  poly(c, [A1, B1, C1, D1], shade(wall, 1.05));
  const R1 = bp(gx, gy - d * 1.15, wh + rh), R2 = bp(gx, gy + d * 1.15, wh + rh);
  const E1 = bp(gx - w * 1.18, gy - d * 1.18, wh), E2 = bp(gx + w * 1.18, gy - d * 1.18, wh);
  const E3 = bp(gx + w * 1.18, gy + d * 1.18, wh), E4 = bp(gx - w * 1.18, gy + d * 1.18, wh);
  poly(c, [E1, E2, R1], shade(roof, .8));
  poly(c, [E2, E3, R2, R1], shade(roof, 1.06));
  poly(c, [E4, E3, R2], shade(roof, .62));
  poly(c, [E1, R1, R2, E4], shade(roof, .74));
}

function drawBuilding(c, b){
  const gx = tileGX(b.tile), gy = tileGY(b.tile);
  const raise = (b.raise || 0);
  const z = raise * 1.2;
  const t = b.type;
  c.globalAlpha = raise > 0 ? clamp(1 - raise * .5, .35, 1) : 1;
  ell(c, ...bp(gx, gy + .1), BSC * .62, BSC * .3, 'rgba(0,0,0,.22)');
  if (t === 'farm'){
    drawTile(c, gx, gy, '#6d5a34');
    c.strokeStyle = '#8a7440'; c.lineWidth = 1.6;
    for (let i = -3; i <= 3; i++){
      const a = bp(gx - .45, gy + i * .12 + z, 0), e = bp(gx + .45, gy + i * .12 + z, 0);
      c.beginPath(); c.moveTo(a[0], a[1]); c.lineTo(e[0], e[1]); c.stroke();
    }
    for (let i = 0; i < 5; i++){
      const p = bp(gx - .3 + i * .16, gy - .28 + (i % 2) * .5, z + .1);
      ell(c, p[0], p[1], BSC * .07, BSC * .1, '#9ec95c');
    }
    drawHouse(c, gx - .28, gy - .3, .22, .18, .5 + z, .3, '#a9825a', '#b8503f');
  } else if (t === 'pit'){
    drawTile(c, gx, gy, '#4a4038');
    ell(c, ...bp(gx, gy, z), BSC * .42, BSC * .22, '#2a2420');
    ell(c, ...bp(gx, gy, z + .04), BSC * .3, BSC * .15, '#6b3a2c');
    for (const s of [-1, 1]){
      const p0 = bp(gx + s * .42, gy - .35, z), p1 = bp(gx + s * .42, gy - .35, z + .9);
      c.strokeStyle = '#6a5540'; c.lineWidth = 3; c.beginPath(); c.moveTo(p0[0], p0[1]); c.lineTo(p1[0], p1[1]); c.stroke();
      c.fillStyle = SIDE_COL[0]; c.fillRect(p1[0] - 2, p1[1], 8 * (s > 0 ? 1 : -1), 9);
    }
  } else if (t === 'barracks'){
    drawTile(c, gx, gy, '#5e5748');
    drawHouse(c, gx, gy, .42, .34, .62 + z, .40, '#b08a5e', '#a34438');
    const p = bp(gx - .5, gy + .1, z + .95);
    c.fillStyle = SIDE_COL[0]; c.fillRect(p[0], p[1], 7, 12);
    c.strokeStyle = '#d8dbe2'; c.lineWidth = 2;
    for (let i = 0; i < 3; i++){
      const a = bp(gx + .5, gy - .3 + i * .3, z), e = bp(gx + .55, gy - .3 + i * .3, z + .55);
      c.beginPath(); c.moveTo(a[0], a[1]); c.lineTo(e[0], e[1]); c.stroke();
    }
  } else if (t === 'forge'){
    drawTile(c, gx, gy, '#4f4a44');
    drawHouse(c, gx, gy, .40, .32, .55 + z, .3, '#8d8579', '#5c5750');
    const ch = bp(gx + .22, gy - .22, z + 1.15);
    c.fillStyle = '#6d6459'; c.fillRect(ch[0] - 4, ch[1], 9, 16);
    const glow = .45 + .25 * Math.sin(G.t * 4);
    c.globalAlpha = glow * (raise > 0 ? .4 : 1);
    ell(c, ch[0], ch[1] - 4, 7, 6, '#ff8a3d');
    ell(c, ...bp(gx, gy + .3, z + .2), BSC * .18, BSC * .1, '#ff8a3d');
    c.globalAlpha = 1;
  } else if (t === 'tavern'){
    drawTile(c, gx, gy, '#575044');
    drawHouse(c, gx, gy, .40, .32, .95 + z, .38, '#c49a68', '#3f6b8c');
    const s0 = bp(gx + .5, gy + .1, z + .7);
    c.strokeStyle = '#6a5540'; c.lineWidth = 2;
    c.beginPath(); c.moveTo(s0[0], s0[1]); c.lineTo(s0[0] + 10, s0[1] - 3); c.stroke();
    c.fillStyle = '#e2c88a'; c.fillRect(s0[0] + 6, s0[1] - 2, 11, 8);
    c.fillStyle = '#4b3a22'; c.fillRect(s0[0] + 9, s0[1] + 1, 5, 2);
  } else {
    drawTile(c, gx, gy, '#514b42');
    drawHouse(c, gx, gy, .38, .3, .48 + z, .26, '#9a8f7d', '#6f6455');
    const g = bp(gx + .1, gy - .05, z + .82);
    c.strokeStyle = '#c8a24a'; c.lineWidth = 2.4;
    c.beginPath(); c.arc(g[0], g[1], 7, 0, 6.2832); c.stroke();
    for (let i = 0; i < 6; i++){
      const a = G.t * .8 + i * 1.047;
      c.beginPath(); c.moveTo(g[0] + Math.cos(a) * 7, g[1] + Math.sin(a) * 7);
      c.lineTo(g[0] + Math.cos(a) * 10, g[1] + Math.sin(a) * 10); c.stroke();
    }
  }
  c.globalAlpha = 1;
  // Labels are queued and laid out after every building is drawn, so a packed
  // plot does not turn into a pile of overlapping text.
  const s = G.sides[0];
  let sub = 'Lv ' + b.lvl;
  if (t === 'farm') sub = '+' + (C.POP_PER_FARM * b.lvl) + ' pop';
  if (t === 'barracks') sub = 'Lv ' + b.lvl + (b.lvl >= 3 ? ' · cannons' : b.lvl >= 2 ? ' · casters' : '');
  if (t === 'tavern') sub = heroCap(s) + ' hero slot' + (heroCap(s) === 1 ? '' : 's');
  const lp0 = bp(gx, gy, 1.55 + z);
  labelQ.push({ x:lp0[0], y:lp0[1], txt:BUILDINGS[t].n + '  ' + sub, col:'#d8dee9', hot:b.tile === sel.tile });
}

let labelQ = [];
function flushLabels(c){
  c.font = '9px system-ui'; c.textAlign = 'center';
  const placed = [];
  labelQ.sort((a, b) => a.y - b.y);
  for (const L of labelQ){
    const w = c.measureText(L.txt).width + 8, h = 13;
    let y = L.y - 11;
    // nudge upward until this label is clear of the ones already placed
    for (let guard = 0; guard < 12; guard++){
      const hit = placed.find(r => Math.abs(r.x - L.x) < (r.w + w) / 2 && Math.abs(r.y - y) < h + 1);
      if (!hit) break;
      y = hit.y - h - 2;
    }
    placed.push({ x:L.x, y, w, h });
    c.fillStyle = L.hot ? 'rgba(30,66,110,.88)' : 'rgba(9,13,20,.72)';
    c.fillRect(L.x - w / 2, y, w, h);
    if (L.hot){ c.strokeStyle = '#4ea3ff'; c.lineWidth = 1; c.strokeRect(L.x - w / 2 + .5, y + .5, w - 1, h - 1); }
    c.fillStyle = L.col; c.fillText(L.txt, L.x, y + 10);
  }
  labelQ = [];
}

function drawWorkerFig(c, x, y, col, carry, sc){
  sc = sc || 1;
  ell(c, x, y + 1, 3.2 * sc, 1.6 * sc, 'rgba(0,0,0,.25)');
  c.fillStyle = '#3f6f9e';
  c.fillRect(x - 2 * sc, y - 7 * sc, 4 * sc, 6 * sc);
  ell(c, x, y - 8.6 * sc, 2 * sc, 2.1 * sc, '#e8d6b8');
  if (carry){ c.fillStyle = col; c.fillRect(x - 2.6 * sc, y - 11.6 * sc, 5.2 * sc, 3 * sc); }
}

function drawNode(c, key){
  const N = NODES[key], s = G.sides[0];
  const p = bp(N.gx, N.gy);
  if (key === 'wood'){
    for (let i = 0; i < 5; i++){
      const q = bp(N.gx + (i % 3 - 1) * .55, N.gy + (i > 2 ? .55 : 0) - .2);
      c.fillStyle = '#5c4326'; c.fillRect(q[0] - 2, q[1] - 12, 4, 12);
      poly(c, [[q[0] - 11, q[1] - 10], [q[0], q[1] - 30], [q[0] + 11, q[1] - 10]], i % 2 ? '#3f7a3a' : '#4c8c42');
      poly(c, [[q[0] - 8, q[1] - 17], [q[0], q[1] - 34], [q[0] + 8, q[1] - 17]], i % 2 ? '#4c8c42' : '#5aa04c');
    }
  } else {
    poly(c, [[p[0] - 34, p[1] + 4], [p[0] - 14, p[1] - 24], [p[0] + 12, p[1] - 20], [p[0] + 34, p[1] + 4]],
      key === 'gold' ? '#8c7a52' : '#6a7382');
    poly(c, [[p[0] - 12, p[1] + 4], [p[0] - 8, p[1] - 13], [p[0] + 8, p[1] - 13], [p[0] + 12, p[1] + 4]], '#241f1b');
    c.fillStyle = '#4a4038';
    c.fillRect(p[0] - 13, p[1] - 15, 26, 3);
    for (let i = 0; i < 4; i++){
      const q = [p[0] - 24 + i * 15, p[1] + 2];
      ell(c, q[0], q[1], 5, 3, key === 'gold' ? '#e8b53d' : '#93a1b3');
      ell(c, q[0] - 2, q[1] - 2, 2.4, 1.6, key === 'gold' ? '#ffe08a' : '#c3cede');
    }
  }
  // workers on the job, shuttling to the keep
  const n = Math.min(s.workers[key], nodeCap(s, key));
  const home = bp(KEEP.gx + .6, KEEP.gy + .5);
  for (let i = 0; i < n; i++){
    const ph = (G.t * .22 + i * .19) % 1;
    const tri = ph < .5 ? ph * 2 : 2 - ph * 2;
    const x = lerp(p[0], home[0], tri), y = lerp(p[1] - 6, home[1], tri);
    drawWorkerFig(c, x, y, N.col, ph >= .5, .9);
  }
  labelQ.push({ x:p[0], y:p[1] + 26, txt:N.n + '  ' + n + '/' + nodeCap(s, key), col:N.col });
}

function drawKeep(c){
  const s = G.sides[0];
  drawHouse(c, KEEP.gx, KEEP.gy, .52, .42, 1.0, .48, '#b9a17c', '#7a4a3c');
  const p = bp(KEEP.gx, KEEP.gy, 1.9);
  c.fillStyle = SIDE_COL[0]; c.fillRect(p[0] - 2, p[1] - 20, 4, 20);
  poly(c, [[p[0] + 2, p[1] - 20], [p[0] + 18, p[1] - 15], [p[0] + 2, p[1] - 10]], SIDE_COL[0]);
  const lb = bp(KEEP.gx, KEEP.gy, 2.5);
  labelQ.push({ x:lb[0], y:lb[1], txt:'Town Hall · ' + s.workers.idle + ' idle', col:'#ffe7b0' });
  // idle workers milling about the hall
  for (let i = 0; i < Math.min(6, s.workers.idle); i++){
    const a = G.t * .3 + i * 1.1;
    const q = bp(KEEP.gx + Math.cos(a) * .9, KEEP.gy + .9 + Math.sin(a) * .35);
    drawWorkerFig(c, q[0], q[1], '#8d99b0', false, .85);
  }
}

// Deterministic countryside so the corners of the isometric diamond read as
// land instead of empty felt. Nothing here touches the simulation.
const hash2 = (i, j) => { const n = Math.sin(i * 127.1 + j * 311.7) * 43758.5453; return n - Math.floor(n); };
function drawGround(c){
  const busy = (gx, gy) => {
    if (Math.abs(gx) < (PLOT_W - 1) / 2 + 1.1 && Math.abs(gy) < (PLOT_H - 1) / 2 + 1.1) return true;
    if (Math.hypot(gx - KEEP.gx, gy - KEEP.gy) < 1.9) return true;
    for (const k in NODES) if (Math.hypot(gx - NODES[k].gx, gy - NODES[k].gy) < 1.9) return true;
    return false;
  };
  // trodden paths from the hall out to every job
  const home = bp(KEEP.gx + .6, KEEP.gy + .7);
  c.strokeStyle = 'rgba(120,98,62,.30)'; c.lineCap = 'round';
  for (const k in NODES){
    const q = bp(NODES[k].gx, NODES[k].gy);
    c.lineWidth = Math.max(4, BSC * .22);
    c.beginPath(); c.moveTo(home[0], home[1]);
    c.quadraticCurveTo((home[0] + q[0]) / 2 + BSC * .3, (home[1] + q[1]) / 2, q[0], q[1]);
    c.stroke();
  }
  c.lineCap = 'butt';
  for (let gx = -9; gx <= 9; gx++) for (let gy = -9; gy <= 9; gy++){
    const r = hash2(gx, gy);
    if (r > .40 || busy(gx, gy)) continue;
    const ox = (hash2(gx + 31, gy) - .5) * .8, oy = (hash2(gx, gy + 17) - .5) * .8;
    const p = bp(gx + ox, gy + oy);
    if (p[0] < -60 || p[0] > BW + 60 || p[1] < -60 || p[1] > BH + 60) continue;
    const s = BSC / 34;
    if (r < .16){                                     // tree
      ell(c, p[0], p[1] + 2, 9 * s, 4 * s, 'rgba(0,0,0,.20)');
      c.fillStyle = '#57431f'; c.fillRect(p[0] - 1.6 * s, p[1] - 9 * s, 3.2 * s, 9 * s);
      poly(c, [[p[0] - 9 * s, p[1] - 7 * s], [p[0], p[1] - 26 * s], [p[0] + 9 * s, p[1] - 7 * s]], r < .08 ? '#3f7a3a' : '#4b8c42');
      poly(c, [[p[0] - 6 * s, p[1] - 14 * s], [p[0], p[1] - 30 * s], [p[0] + 6 * s, p[1] - 14 * s]], '#57a04c');
    } else if (r < .26){                              // boulder
      ell(c, p[0], p[1] + 1, 8 * s, 3.5 * s, 'rgba(0,0,0,.18)');
      poly(c, [[p[0] - 8 * s, p[1]], [p[0] - 4 * s, p[1] - 7 * s], [p[0] + 4 * s, p[1] - 8 * s], [p[0] + 8 * s, p[1]]], '#7d7f77');
      poly(c, [[p[0] - 4 * s, p[1] - 7 * s], [p[0] + 4 * s, p[1] - 8 * s], [p[0] + 2 * s, p[1] - 3 * s], [p[0] - 3 * s, p[1] - 3 * s]], '#93958c');
    } else if (r < .34){                              // shrub
      ell(c, p[0], p[1] - 3 * s, 7 * s, 5 * s, '#3f6f38');
      ell(c, p[0] - 3 * s, p[1] - 5 * s, 4 * s, 3.5 * s, '#4b8542');
    } else {                                          // grass tuft
      c.strokeStyle = 'rgba(150,190,120,.55)'; c.lineWidth = 1.2;
      for (let i = -1; i <= 1; i++){
        c.beginPath(); c.moveTo(p[0] + i * 3 * s, p[1]); c.lineTo(p[0] + i * 4.5 * s, p[1] - 6 * s); c.stroke();
      }
    }
  }
}

function drawBase(){
  const c = bctx;
  if (!c) return;
  baseFit();
  const g = c.createLinearGradient(0, 0, 0, BH);
  g.addColorStop(0, '#3d5b3c'); g.addColorStop(.55, '#33502f'); g.addColorStop(1, '#22381f');
  c.fillStyle = g; c.fillRect(0, 0, BW, BH);
  drawGround(c);
  // plot floor
  const s = G.sides[0];
  for (let t = 0; t < s.plot.length; t++){
    const gx = tileGX(t), gy = tileGY(t);
    const hot = t === sel.tile;
    drawTile(c, gx, gy, s.plot[t] ? '#4d4739' : (hot ? 'rgba(78,163,255,.30)' : 'rgba(46,52,40,.55)'),
      hot ? '#4ea3ff' : 'rgba(0,0,0,.35)');
    if (!s.plot[t]){
      const p = bp(gx, gy, .12);
      c.fillStyle = hot ? '#9ad0ff' : 'rgba(200,215,190,.35)';
      c.font = 'bold 15px system-ui'; c.textAlign = 'center'; c.textBaseline = 'middle';
      c.fillText('+', p[0], p[1]); c.textBaseline = 'alphabetic';
    }
  }
  const items = [];
  items.push({ y:bp(KEEP.gx, KEEP.gy)[1], f:() => drawKeep(c) });
  for (const k in NODES) items.push({ y:bp(NODES[k].gx, NODES[k].gy)[1], f:() => drawNode(c, k) });
  for (const b of s.plot) if (b) items.push({ y:bp(tileGX(b.tile), tileGY(b.tile))[1], f:() => drawBuilding(c, b) });
  items.sort((a, b) => a.y - b.y);
  for (const it of items) it.f();
  // food workers tending the farms
  const farms = bList(s, 'farm');
  const nf = Math.min(s.workers.food, fieldSlots(s));
  flushLabels(c);
  for (let i = 0; i < nf && farms.length; i++){
    const f = farms[i % farms.length];
    const a = G.t * .5 + i * 1.7;
    const q = bp(tileGX(f.tile) + Math.cos(a) * .34, tileGY(f.tile) + .1 + Math.sin(a) * .3, .05);
    drawWorkerFig(c, q[0], q[1], '#7fdc8a', (Math.sin(a) > 0), .85);
  }
}

function camStep(dt){
  if (cam.follow){
    let fx = null;
    const mine = G.sides[0].heroes.filter(h => !h.dead);
    if (mine.length) fx = mine.reduce((a, h) => a + h.x, 0) / mine.length;
    else fx = frontlineX(0);
    cam.x = lerp(cam.x, clamp(fx, 8, C.LANE_LEN - 8), 1 - Math.pow(.02, dt));
  }
  cam.z = lerp(cam.z, cam.tz, 1 - Math.pow(.005, dt));
}

  drawLane();
  drawBase();

function costHtml(cost){
  const s = G.sides[0];
  return '<span class="cost">' + Object.keys(cost).map(k =>
    '<i class="' + RES_CLASS[k] + (s.res[k] < cost[k] ? ' bad' : '') + '">' + RES_ICON[k] + cost[k] + '</i>'

function fmt(n){ return n >= 1000 ? (n / 1000).toFixed(1) + 'k' : String(Math.floor(n)); }

function syncHud(){
  const s = G.sides[0], m = gatherMul(s);
  for (const k of ['gold','iron','wood','food']){
    const el = $('r' + k[0].toUpperCase() + k.slice(1));
    if (!el) continue;
    el.querySelector('b').textContent = fmt(s.res[k]);
    const rate = Math.min(s.workers[k], nodeCap(s, k)) * C.GATHER[k] * m;
    el.querySelector('.rate').textContent = rate > 0 ? '+' + rate.toFixed(1) : '';
  }
  const pop = $('rPop');
  pop.querySelector('b').textContent = popUsed(s) + '/' + popCap(s);
  pop.classList.toggle('full', popUsed(s) >= popCap(s));
  const wb = $('waveBox');
  wb.querySelector('b').textContent = G.wave;
  $('waveT').textContent = Math.floor(G.waveT / 60) + ':' + String(Math.floor(G.waveT % 60)).padStart(2, '0');

function basePanelHtml(){

  let h = '';
  h += '<div class="ptitle">Workers — ' + s.workers.idle + ' idle</div><div class="prow">';

    const cap = nodeCap(s, k);
    h += '<div class="job"><span>' + RES_ICON[k] + '</span><span class="nm">' + k + '</span>' +
      '<span class="ct">' + s.workers[k] + '/' + cap + '</span>' +

      '<button class="sq" data-act="job" data-node="' + k + '" data-d="1"' + (s.workers.idle && s.workers[k] < cap ? '' : ' disabled') + '>+</button></div>';

  h += '</div>';

  h += '<div class="ptitle">Train</div><div class="prow">';
  h += '<button class="abtn" data-act="worker"><span class="t">Worker</span><span class="c">' + costHtml(C.WORKER_COST) + '</span></button>';

    const d = TRAIN[k], ok = barracksLvl(s) >= d.barracks;

  }
  h += '</div>';

  const q = s.trainQ.map(x => {
    const pc = Math.round(clamp(x.t / x.dur, 0, 1) * 100);
    const nm = x.type === 'worker' ? 'Worker' : TRAIN[x.type].n;
    return '<span class="qchip"><i class="fill" style="width:' + pc + '%"></i><span>' + nm + '</span></span>';
  }).join('');
  h += '<div class="ptitle">In training</div><div id="queue">' + (q || '<span class="qchip"><span>idle</span></span>') + '</div>';

  const cnt = {};
  for (const m of s.muster) cnt[m.type] = (cnt[m.type] || 0) + 1;
  const mus = Object.keys(cnt).map(k => '<span class="mchip">' + TRAIN[k].n + ' ×' + cnt[k] + '</span>').join('');
  h += '<div class="ptitle">Next wave' + (s.superT > 0 ? ' — SIEGE OGRES ' + Math.ceil(s.superT) + 's' : '') + '</div>' +
    '<div id="musterRow">' + (mus || '<span class="mchip">levies only</span>') + '</div>';

  // selected plot
  const b = sel.tile >= 0 ? s.plot[sel.tile] : null;
  if (sel.tile >= 0 && !b){
    h += '<div class="ptitle">Build on plot ' + (sel.tile + 1) + '</div><div class="prow" style="flex-wrap:wrap">';
    for (const t of BUILD_ORDER){
      const cost = buildCost(t, 1);
      h += '<button class="abtn" data-act="build" data-type="' + t + '" style="flex:1 1 44%"' + (canPay(s, cost) ? '' : ' disabled') + '>' +
        '<span class="t">' + BUILDINGS[t].n + '</span><span class="c">' + costHtml(cost) + '</span></button>';
    }
    h += '</div>';
  } else if (b){
    const B = BUILDINGS[b.type];
    h += '<div class="ptitle">' + B.n + ' — level ' + b.lvl + '</div>';
    h += '<div style="font-size:11px;color:var(--dim);margin-bottom:5px">' + B.d + '</div><div class="prow">';
    if (b.lvl < B.maxLvl){
      const cost = buildCost(b.type, b.lvl + 1);
      h += '<button class="abtn" data-act="upgrade"' + (canPay(s, cost) ? '' : ' disabled') + '>' +
        '<span class="t">Upgrade to Lv ' + (b.lvl + 1) + '</span><span class="c">' + costHtml(cost) + '</span></button>';
    } else h += '<div class="job"><span class="nm">Fully upgraded.</span></div>';
    h += '</div>';
  }

  if (bLvl(s, 'forge') > 0){
    h += '<div class="ptitle">Forge — rank cap ' + upCap(s) + '</div><div class="prow" style="flex-wrap:wrap">';
    for (const u of [...TOWER_UPS, ...TROOP_UPS]){
      const bag = TOWER_UPS.includes(u) ? s.towerUp : s.troopUp;
      const lv = bag[u.id], maxed = lv >= upCap(s);
      const cost = upCostFor(u, lv);

        '<span class="c">' + (maxed ? 'at the cap' : costHtml(cost)) + '</span></button>';
    }
    h += '</div>';
  }
  return h;
}

function optCard(h, kind, id, i){
  if (kind === 'passive'){
    const p = PASS[id];
    return '<button class="pick" data-act="pick" data-i="' + i + '"><div class="pk">passive</div>' +
      '<div class="pt">' + p.n + '</div><div class="pd">' + p.d + '</div></button>';
  }
  if (kind === 'rank'){
    if (id.startsWith('P:')){
      const p = PASS[id.slice(2)];
      return '<button class="pick" data-act="pick" data-i="' + i + '"><div class="pk">rank ' + (h.passRank + 1) + '</div>' +
        '<div class="pt">' + p.n + '</div><div class="pd">' + p.d + '</div><div class="pm">Strengthens the passive.</div></button>';
    }
    const s = SKILL[id], own = h.skills.find(o => o.id === id);
    return '<button class="pick" data-act="pick" data-i="' + i + '"><div class="pk">rank ' + (own.rank + 1) + '</div>' +
      '<div class="pt">' + s.n + '</div><div class="pd">' + skNums(s, own.rank + 1) + '</div></button>';
  }
  const s = SKILL[id];
  return '<button class="pick" data-act="pick" data-i="' + i + '"><div class="pk">' + (s.ult ? 'ultimate' : s.cls === 'any' ? 'common' : s.cls) + '</div>' +
    '<div class="pt">' + s.n + '</div><div class="pd">' + s.f + '</div>' +
    '<div class="pm">' + skNums(s, 1) + ' · ' + s.cd + 's</div></button>';
}

function tierRow(h, label, level, kind, filled){
  const pend = h.pend[0];
  const active = pend && pend.kind === kind && (kind !== 'skill' || pend.lvl === level);
  let body;
  if (active) body = '<div class="picks">' + pend.opts.map((id, i) => optCard(h, kind, id, i)).join('') + '</div>';
  else if (filled){
    const s = SKILL[filled.id];
    body = '<div class="chosen"><b>' + s.n + '</b> <span class="pips">' +
      '●'.repeat(filled.rank) + '<span style="opacity:.3">' + '●'.repeat(C.MAX_HERO_RANK - filled.rank) + '</span></span>' +
      '<div class="pd">' + skNums(s, filled.rank) + '</div></div>';
  } else body = '<div class="locked">' + (h.lvl >= level ? 'nothing chosen' : 'unlocks at level ' + level) + '</div>';
  return '<div class="tier' + (active ? ' hot' : '') + '"><div class="tl">' + label + '</div><div class="tb">' + body + '</div></div>';
}

/* ------------------------------------------------------------------ meta */
const META_KEY = 'ib_meta';
function loadMeta(){
  try { return Object.assign({ wins:0, losses:0, best:0 }, JSON.parse(localStorage.getItem(META_KEY) || '{}')); }
  catch (e){ return { wins:0, losses:0, best:0 }; }
}
function saveMeta(won){
  const m = loadMeta();
  if (won){ m.wins++; if (!m.best || G.t < m.best) m.best = G.t; } else m.losses++;
  try { localStorage.setItem(META_KEY, JSON.stringify(m)); } catch (e){}
}

let tab = 'lane';
function applyTab(){
  if (!document.body.classList.contains('narrow')) return;
  $('left').classList.toggle('hide', tab !== 'base');
  $('right').classList.toggle('hide', tab !== 'lane');
  $('tabBase').classList.toggle('on', tab === 'base');
  $('tabLane').classList.toggle('on', tab === 'lane');
  resizeSoon();

let rsT = 0;
function resizeSoon(){ clearTimeout(rsT); rsT = setTimeout(resize, 30); }

function say(msg){ if (msg) fxToast(msg, 'bad'); }

function wire(){
  const s0 = () => G.sides[0];
  $('basePanel').addEventListener('click', (e) => {
    const b = e.target.closest('[data-act]');
    if (!b || b.disabled) return;
    const s = s0(), a = b.dataset.act;
    if (a === 'job') say(assign(s, b.dataset.node, +b.dataset.d));
    else if (a === 'worker') say(trainWorker(s));
    else if (a === 'unit') say(trainUnit(s, b.dataset.unit));
    else if (a === 'build') say(build(s, sel.tile, b.dataset.type));
    else if (a === 'upgrade') say(upgradeBuilding(s, sel.tile));
    else if (a === 'up') say(buyUp(s, b.dataset.up));
    syncUI();
  });
  $('heroBar').addEventListener('click', (e) => {
    const b = e.target.closest('[data-hero],[data-act]');
    if (!b || b.disabled) return;
    if (b.dataset.hero){
      const h = s0().heroes.find(x => x.id === +b.dataset.hero);
      if (h){ sel.hero = h; showHeroSheet(h); }
    } else if (b.dataset.act === 'newhero') showHeroCreate();
  });
  $('modal').addEventListener('click', (e) => {
    if (e.target === $('modal')){ if (G.state === 'play') closeModal(); return; }
    const b = e.target.closest('[data-act]');
    if (!b) return;
    const a = b.dataset.act;
    if (a === 'start'){ newMatch({ diff:b.dataset.diff }); closeModal(); syncUI(); }
    else if (a === 'close') closeModal();
    else if (a === 'menu'){ G.state = 'menu'; showMenu(); }
    else if (a === 'again'){ newMatch({ diff:G.diff.id }); closeModal(); syncUI(); }
    else if (a === 'mkhero'){
      const err = createHero(s0(), b.dataset.cls);
      if (err){ say(err); return; }
      const h = s0().heroes[s0().heroes.length - 1];
      sel.hero = h; showHeroSheet(h); syncUI();
    } else if (a === 'pick'){
      const h = sel.hero;
      if (!h) return;
      say(pickOption(h, +b.dataset.i));
      showHeroSheet(h); syncUI();
    }
  });
  $('btnMenu').addEventListener('click', () => { showMenu(); });
  $('btnHelpBase').addEventListener('click', showHelp);
  $('btnPause').addEventListener('click', () => {
    G.paused = !G.paused;
    $('btnPause').textContent = G.paused ? '▶' : '❚❚';
    $('btnPause').classList.toggle('on', G.paused);
  });
  $('btnSpeed').addEventListener('click', () => {
    G.speed = G.speed === 1 ? 2 : G.speed === 2 ? 3 : 1;
    $('btnSpeed').textContent = G.speed + '×';
    $('btnSpeed').classList.toggle('on', G.speed > 1);
  });
  $('tabBase').addEventListener('click', () => { tab = 'base'; applyTab(); });
  $('tabLane').addEventListener('click', () => { tab = 'lane'; applyTab(); });
  const camTo = (x) => { cam.follow = false; cam.x = x; $('camFollow').classList.remove('on'); };
  $('camHome').addEventListener('click', () => camTo(14));
  $('camMid').addEventListener('click', () => camTo(C.LANE_LEN / 2));
  $('camFoe').addEventListener('click', () => camTo(C.LANE_LEN - 14));
  $('camFollow').addEventListener('click', () => { cam.follow = !cam.follow; $('camFollow').classList.toggle('on', cam.follow); });

  // base canvas — pick a plot
  bcv.addEventListener('pointerdown', (e) => {
    const r = bcv.getBoundingClientRect();
    const sx = e.clientX - r.left, sy = e.clientY - r.top;
    const a = (sx - BW * .5) / (BSC * .88), b = (sy - BH * .30) / (BSC * .50);
    const gx = (a + b) / 2, gy = (b - a) / 2;
    const col = Math.round(gx + (PLOT_W - 1) / 2), row = Math.round(gy + (PLOT_H - 1) / 2);
    sel.tile = (col >= 0 && col < PLOT_W && row >= 0 && row < PLOT_H) ? row * PLOT_W + col : -1;
    syncUI();
  });

  // lane canvas — drag to pan, wheel to zoom
  let drag = null;
  lcv.addEventListener('pointerdown', (e) => { drag = { x:e.clientX, cx:cam.x }; lcv.setPointerCapture(e.pointerId); });
  lcv.addEventListener('pointermove', (e) => {
    if (!drag) return;
    const dx = (e.clientX - drag.x) / (LS() * .96);
    if (Math.abs(e.clientX - drag.x) > 4){ cam.follow = false; $('camFollow').classList.remove('on'); }
    cam.x = clamp(drag.cx - dx, 0, C.LANE_LEN);
  });
  lcv.addEventListener('pointerup', () => { drag = null; });
  lcv.addEventListener('pointercancel', () => { drag = null; });
  lcv.addEventListener('dblclick', () => { cam.follow = true; $('camFollow').classList.add('on'); });
  lcv.addEventListener('wheel', (e) => {
    e.preventDefault();
    cam.tz = clamp(cam.tz * (e.deltaY > 0 ? .88 : 1.14), .55, 2.2);
  }, { passive:false });

  window.addEventListener('resize', resizeSoon);
  window.addEventListener('keydown', (e) => {
    if (e.key === 'Escape'){ if (G.state === 'play') closeModal(); }
    else if (e.key === ' '){ e.preventDefault(); $('btnPause').click(); }
    else if (e.key === '1' || e.key === '2' || e.key === '3'){
      G.speed = +e.key; $('btnSpeed').textContent = G.speed + '×';
      $('btnSpeed').classList.toggle('on', G.speed > 1);
    }
  });
}

let last = 0;
function frame(ts){
  const raw = Math.min(.1, (ts - last) / 1000 || 0);
  last = ts;
  if (G.state === 'play' && !G.paused){
    let left = raw * G.speed;
    let guard = 0;
    while (left > 0 && guard++ < 12){ const st = Math.min(1 / 30, left); update(st); left -= st; }
  }
  camStep(raw);
  draw();
  uiTick(raw);
  requestAnimationFrame(frame);
}

function boot(){
  lcv = $('lcv'); bcv = $('bcv');
  resize();
  wire();
  newMatch({ diff:'veteran' });
  G.state = 'menu';
  showMenu();
  syncUI();
  requestAnimationFrame(frame);
}
if (!HEADLESS) boot();
else { newMatch({ diff:'veteran' }); G.state = 'menu'; }

/* ------------------------------------------------------------------ headless seam */
window.IB = {
  G, C, DIFFS, CLASSES, CLS, PASSIVES, PASS, SKILLS, SKILL, UNITS, TRAIN, STRUCTS,
  BUILDINGS, TOWER_UPS, TROOP_UPS, MAX_UP, HERO_COST, PLOT_W, PLOT_H,
  newMatch, update, draw, spawnWave, spawnUnit, dealDmg, mitigate, healUnit,
  trainWorker, trainUnit, assign, build, upgradeBuilding, buyUp, buildCost, upCostFor,
  createHero, makeHero, pickOption, autoPick, gainXp, recalcHero, offer, enterLane, heroStep,
  popCap, popUsed, workerCount, fieldSlots, nodeCap, heroCap, upCap, barracksLvl, trainSlots,
  barrackSlots, gatherMul, bLvl, bList, canPay, xpNeed, skNums, basicPool, ultPool, passVal, bsum,
  frontStruct, liveStructs, structMaxHp, gateX, frontlineX, aiStep, ecoStep, endMatch,
  attackDamage, attackSpeedOf, castSkill, rebuildGrid, reseed, cam, sel, loadMeta,
};
