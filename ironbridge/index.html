      const h = abHw(t), y = abY(t), z = AB_DZ * t;
      const x0 = -h + r * (h * 2 - 2.4);
      poly(c, [lp(bxx + d * x0, y, z - .3), lp(bxx + d * (x0 + 2.2), y, z - .3),
               lp(bxx + d * (x0 + 2.2), y, z - 1.4), lp(bxx + d * x0, y, z - 1.4)], STONE.lit);
    }
    c.globalAlpha = 1;
    // a spur down the middle of the face, the way a real one is buttressed
    const sp = 1.5, spz = AB_DZ * .74;
    poly(c, [lp(bxx - d * sp, W, -1.2), lp(bxx + d * sp, W, -1.2),
             lp(bxx + d * sp * .6, W + 3.2, spz), lp(bxx - d * sp * .6, W + 3.2, spz)], '#8b8170');
    poly(c, [lp(bxx + d * sp, W, -1.2), lp(bxx + d * sp * .6, W + 3.2, spz),
             lp(bxx + d * sp * .6, abY(.74), spz), lp(bxx + d * sp, abY(0), -1.2)], '#443e34');
    // the cap the deck actually rests on, oversailing the courses below it
    poly(c, [lp(bxx - d * AB_CAP, W + .6, 1.0), lp(bxx + d * AB_CAP, W + .6, 1.0),
             lp(bxx + d * AB_CAP, W + .6, -1.2), lp(bxx - d * AB_CAP, W + .6, -1.2)], '#7f7666');
    poly(c, [lp(bxx + d * AB_CAP, -W, 1.0), lp(bxx + d * AB_CAP, W + .6, 1.0),
             lp(bxx + d * AB_CAP, W + .6, -1.2), lp(bxx + d * AB_CAP, -W, -1.2)], '#69604f');
    poly(c, [lp(bxx - d * AB_CAP, -W, 1.0), lp(bxx + d * AB_CAP, -W, 1.0),
             lp(bxx + d * AB_CAP, W + .6, 1.0), lp(bxx - d * AB_CAP, W + .6, 1.0)], '#8b8170');
    poly(c, [a0, a1, a2, a3], '#6f6759');
  }
}

/* ------------------------------------------------------------- under the span
   The gap used to be a flat wash of dark teal over about a quarter of the
   screen, and the only thing in it was three filled half-ellipses hanging
   under the deck — "arches" that sprang from nothing and rested on nothing.
   The bridge stands on piers now, with the spandrels between them, and the
   canyon has rock in it and a floor you cannot quite see. */
const AB_N = 7, AB_DZ = -12, AB_CAP = 5.6;
const abHw = (t) => 5 - t * 1.1;                 // half-length, narrowing downward
const abY = (t) => C.LANE_W / 2 + .6 - t * 1.4;  // and the face pulling back with it

const PIER_SPAN = 16, PIER_HW = 3.2, PIER_TOP = -1.6, PIER_BOT = -30, PIER_SEGS = 7;
function drawPiers(c){
  const W = C.LANE_W / 2 + .6;
  const z = cam.z;
  for (let x = PIER_SPAN / 2; x < C.LANE_LEN; x += PIER_SPAN){
    const p = lp(x, W, PIER_TOP);
    if (p[0] < -170 || p[0] > LW + 170) continue;
    // Drawn in bands rather than as one quad so the foot can dissolve into the
    // gorge. A pier that runs solid to the bottom of the screen is a bar, not
    // a thing standing in a canyon whose floor you never see.
    for (let k = 0; k < PIER_SEGS; k++){
      const t0 = k / PIER_SEGS, t1 = (k + 1) / PIER_SEGS;
      const z0 = lerp(PIER_TOP, PIER_BOT, t0), z1 = lerp(PIER_TOP, PIER_BOT, t1);
      const w0 = lerp(PIER_HW, PIER_HW * .58, t0), w1 = lerp(PIER_HW, PIER_HW * .58, t1);
      c.globalAlpha = clamp(1.15 - t0 * 1.25, 0, 1);
      poly(c, [lp(x - w0, W, z0), lp(x + w0, W, z0), lp(x + w1, W, z1), lp(x - w1, W, z1)],
        k % 2 ? '#3e3a32' : '#443f36');
      poly(c, [lp(x - w0, W, z0), lp(x - w0, -W, z0), lp(x - w1, -W, z1), lp(x - w1, W, z1)], '#2b2922');
    }
    c.globalAlpha = 1;
    // a corbel where it takes the deck
    poly(c, [lp(x - PIER_HW * 1.2, W, PIER_TOP + .2), lp(x + PIER_HW * 1.2, W, PIER_TOP + .2),
             lp(x + PIER_HW * 1.2, W, PIER_TOP - 1.5), lp(x - PIER_HW * 1.2, W, PIER_TOP - 1.5)], '#4e4a3e');
    c.globalAlpha = .26; c.strokeStyle = '#7a7161'; c.lineWidth = Math.max(1, 1.2 * z);
    for (let k = 1; k < 4; k++){
      const t = k / 6, zz = lerp(PIER_TOP, PIER_BOT, t), hwk = lerp(PIER_HW, PIER_HW * .58, t);
      const a = lp(x - hwk, W, zz), b = lp(x + hwk, W, zz);
      c.beginPath(); c.moveTo(a[0], a[1]); c.lineTo(b[0], b[1]); c.stroke();
    }
    c.globalAlpha = 1;
  }
  // the spandrels: the solid stone between one arch and the next
  c.fillStyle = 'rgba(32,30,25,.88)';
  for (let x = PIER_SPAN / 2; x + PIER_SPAN < C.LANE_LEN; x += PIER_SPAN){
    const a = lp(x + PIER_HW, W, PIER_TOP), b = lp(x + PIER_SPAN - PIER_HW, W, PIER_TOP);
    if (b[0] < -80 || a[0] > LW + 80) continue;
    const m = lp(x + PIER_SPAN / 2, W, PIER_TOP - 11);
    c.beginPath();
    c.moveTo(a[0], a[1]); c.lineTo(b[0], b[1]);
    c.quadraticCurveTo(m[0], m[1], a[0], a[1]);
    c.closePath(); c.fill();
  }
}

// Rock standing up out of the gorge, and the mist it disappears into. Laid
// out once from the same fixed hash the clouds use — no RNG the simulation
// can see — and only ever culled.
let SPIRES = null;
function spires(){
  if (SPIRES) return SPIRES;
  SPIRES = [];
  for (let i = 0; i < 11; i++){
    const r = hash2(i * 7.1, 3.3), r2 = hash2(i * 2.3, 19.7), r3 = hash2(i * 4.7, 31.1);
    SPIRES.push({
      x:4 + i * 12 + r * 7, y:-22 - r2 * 30, zb:-52 - r3 * 10,
      h:20 + r * 26, w:3.4 + r2 * 4.2, near:r3 > .55,
    });
  }
  return SPIRES;
}
function drawChasm(c){
  const S = LS();
  for (const s of spires()){
    const b = lp(s.x, s.y, s.zb), t = lp(s.x, s.y, s.zb + s.h);
    if (b[0] < -110 || b[0] > LW + 110 || t[1] > LH + 40) continue;
    const w = s.w * .96 * S;
    poly(c, [[b[0] - w, b[1]], [t[0], t[1]], [b[0] + w, b[1]]], s.near ? '#1b2a28' : '#22322f');
    poly(c, [[t[0], t[1]], [b[0] + w, b[1]], [b[0] + w * .3, b[1]]], s.near ? '#263733' : '#2c403b');
  }
}

// Mist banked across the gorge, anchored to the world so it drifts past with
// everything else instead of sitting at a fixed fraction of the canvas.
function gorgeDepth(c){
  const W = C.LANE_W / 2 + .6, S = LS();
  for (let i = 0; i < 4; i++){
    const a = lp(cam.x, W, -13 - i * 7), h = (4 + i * 2.4) * .95 * S;
    if (a[1] < -20 || a[1] > LH + 60) continue;
    c.globalAlpha = .055 + .03 * Math.sin(G.t * .3 + i * 1.4);
    c.fillStyle = '#cfe2e6';
    c.fillRect(0, a[1] - h * .5, LW, h);
  }
  c.globalAlpha = 1;
}

// The great keep behind the gates, as stations measured from the wall head.
// Everything here used to be loose numbers in the draw call, and the thing
// that went wrong was exactly what loose numbers do: the wall grew a hard
// bottom edge sitting on the grass with no footing and no shadow under it,
// while the gate standing in front of it had both. A table can be checked —
// that the crown sits ON the wall, that the towers and the wall share a
// ground line, that the plinth is under all of it and the door inside it.
const KEEP_ART = {
  wallTop:-44, wallH:56, crownTop:-52, crownH:7,
  towerTop:-74, towerH:86, roofApex:-108, roofEave:-72,
  plinthH:8, plinthOver:4,
  doorTop:-4, doorR:14, doorH:16,
};
const keepBase = () => KEEP_ART.wallTop + KEEP_ART.wallH;
function drawEnds(c){
  for (const s of G.sides){
    const dir = dirOf(s.i);
    const bx = s.i === 0 ? -5 : C.LANE_LEN + 5;
    const p = lp(bx, 0);
    if (p[0] < -420 || p[0] > LW + 420) continue;
    const z = cam.z;
    // the keep behind the gates, in the same masonry as everything else
    const col = SIDE_COL[s.i];
    const kp = lp(bx - dir * 11, 0);
    const wallY = kp[1] - 34 * z;
    // It stood on nothing — a flat block with a hard bottom edge sitting on
    // the grass, no shadow under it, while the gate in front of it has a
    // stone footing. And block()'s lit edge is a sixteenth of the height,
    // which on a wall this tall came out as a pale slab across the middle of
    // it rather than a highlight along the top.
    const base = wallY + keepBase() * z;
    c.globalAlpha = .22;
    ell(c, kp[0], base + 2 * z, 92 * z, 15 * z, '#1d2a1c');
    c.globalAlpha = 1;
    block(c, kp[0] - 48 * z, wallY - 44 * z, 96 * z, 56 * z, STONE.mid);
    block(c, kp[0] - 48 * z, wallY - 44 * z, 96 * z, 3.5 * z, STONE.lit);
    masonry(c, kp[0] - 46 * z, wallY - 40 * z, 92 * z, 46 * z, z, 41 + s.i);
    // buttresses, so a wall this wide is not one unbroken face
    for (const bxo of [-38, -20, 20, 38]){
      block(c, kp[0] + bxo * z - 4 * z, wallY - 40 * z, 8 * z, 52 * z, STONE.mid2);
      block(c, kp[0] + bxo * z - 4 * z, wallY - 40 * z, 3 * z, 52 * z, STONE.dark);
      poly(c, [[kp[0] + bxo * z - 6 * z, wallY - 40 * z], [kp[0] + bxo * z + 6 * z, wallY - 40 * z],
               [kp[0] + bxo * z, wallY - 47 * z]], STONE.mid2);
    }
    // a plinth the whole thing stands on
    block(c, kp[0] - 52 * z, base - 8 * z, 104 * z, 8 * z, STONE.deep, STONE.dark);
    block(c, kp[0] - 54 * z, base - 10 * z, 108 * z, 3 * z, STONE.mid2, STONE.lit);
    crown(c, kp[0], wallY - 52 * z, 100 * z, z, 9);
    // the way in, with a timber gate in it rather than a painted hole
    c.fillStyle = '#3a332b';
    c.beginPath(); c.arc(kp[0], wallY - 4 * z, 14 * z, Math.PI, 0); c.fill();
    c.fillRect(kp[0] - 14 * z, wallY - 4 * z, 28 * z, 16 * z);
    c.fillStyle = WOOD.mid;
    c.beginPath(); c.arc(kp[0], wallY - 3 * z, 11 * z, Math.PI, 0); c.fill();
    c.fillRect(kp[0] - 11 * z, wallY - 3 * z, 22 * z, 15 * z);
    c.strokeStyle = WOOD.dark; c.lineWidth = Math.max(1, 1.1 * z);
    for (let i = -1; i <= 1; i++){
      c.beginPath(); c.moveTo(kp[0] + i * 6 * z, wallY - 13 * z); c.lineTo(kp[0] + i * 6 * z, base); c.stroke();
    }
    block(c, kp[0] - 11 * z, wallY - 1 * z, 22 * z, 2.6 * z, '#6b7078');
    block(c, kp[0] - 11 * z, wallY + 7 * z, 22 * z, 2.6 * z, '#6b7078');
    for (const sx of [-1, 1]){
      const tx = kp[0] + sx * 58 * z;
      c.globalAlpha = .22;
      ell(c, tx, base + 2 * z, 22 * z, 7 * z, '#1d2a1c');
      c.globalAlpha = 1;
      block(c, tx - 16 * z, wallY - 74 * z, 32 * z, 86 * z, STONE.mid);
      block(c, tx - 16 * z, wallY - 74 * z, 32 * z, 4 * z, STONE.lit);
      masonry(c, tx - 15 * z, wallY - 70 * z, 30 * z, 76 * z, z, 51 + sx * 3 + s.i);
      block(c, tx - 18 * z, base - 8 * z, 36 * z, 8 * z, STONE.deep, STONE.dark);
      poly(c, [[tx - 23 * z, wallY - 72 * z], [tx, wallY - 108 * z], [tx + 23 * z, wallY - 72 * z]], shade(col, .98));
      poly(c, [[tx, wallY - 108 * z], [tx + 23 * z, wallY - 72 * z], [tx + 8 * z, wallY - 72 * z]], shade(col, .72));
      block(c, tx - 24 * z, wallY - 74 * z, 48 * z, 3 * z, STONE.mid2, STONE.lit);   // the eaves course
      c.fillStyle = STONE.line; c.fillRect(tx - 3 * z, wallY - 56 * z, 6 * z, 14 * z);
    }
    // banners hung either side of the gateway
    for (const sx of [-1, 1]){
      const nx = kp[0] + sx * 30 * z;
      c.fillStyle = shade(col, .92); c.fillRect(nx - 5 * z, wallY - 34 * z, 10 * z, 24 * z);
      c.fillStyle = shade(col, 1.16); c.fillRect(nx - 5 * z, wallY - 34 * z, 3.5 * z, 24 * z);
      poly(c, [[nx - 5 * z, wallY - 10 * z], [nx, wallY - 15 * z], [nx + 5 * z, wallY - 10 * z]], shade(col, .78));
    }
    pennant(c, kp[0] + dir * 20 * z, wallY - 76 * z, z, col, dir);
    c.fillStyle = '#e7ecf6'; c.font = 'bold ' + Math.max(9, Math.round(11 * z)) + 'px system-ui'; c.textAlign = 'center';
    c.fillText(SIDE_NAME[s.i], kp[0], wallY - 118 * z);
  }
}

/* Storybook masonry: pale blocks with a lit top edge, warm timber, a team
   roof and a lit eye. Everything is laid out in units around the ground
   anchor and multiplied by the zoom, so one set of numbers serves all sizes. */
const STONE = { lit:'#dde2da', mid:'#c8cec6', mid2:'#b4bbb3', dark:'#9aa29a', deep:'#7f877f', line:'#69716a' };
const WOOD = { lit:'#cda063', mid:'#ad8146', dark:'#8a6533' };

function block(c, x, y, w, h, face, top){
  c.fillStyle = face; c.fillRect(x, y, w, h);
  if (top){ c.fillStyle = top; c.fillRect(x, y, w, Math.max(1, h * .16)); }
}
// A crenellated crown: the solid band plus its merlons.
function crown(c, cx, y, w, u, n, wear){
  block(c, cx - w / 2, y, w, 7 * u, STONE.mid, STONE.lit);
  const step = w / n;
  for (let i = 0; i < n; i++){
    if (i % 2) continue;
    // a battered turret loses its teeth, and loses them in the same places
    // every frame — the wear is hashed, not rolled
    if (wear > 0 && hash2(i * 5.1, wear * 13.7) < wear * .55) continue;
    block(c, cx - w / 2 + i * step, y - 8 * u, step * 1.02, 9 * u, STONE.mid, STONE.lit);
  }
}

// A turret at a fifth of its health used to look exactly like a fresh one, so
// the only way to know which wall was about to fall was to read its bar. Now
// they crack, lose their crenellations, scorch and finally smoke.
const WEAR = (st) => {
  if (st.dead || !st.mhp) return 0;
  const f = clamp(st.hp / st.mhp, 0, 1);
  return f > .72 ? 0 : f > .42 ? 1 : f > .22 ? 2 : 3;
};
function battleDamage(c, st, X, top, w, h, u){
  const wear = WEAR(st);
  if (!wear) return;
  const seed = st.ord * 3.3 + st.side * 11.7;
  c.strokeStyle = 'rgba(38,34,30,.55)';
  c.lineWidth = Math.max(1, 1.3 * u);
  for (let i = 0; i < wear * 2; i++){
    const r1 = hash2(i * 2.7, seed), r2 = hash2(i * 4.3, seed + 1), r3 = hash2(i * 6.1, seed + 2);
    // a crack has to stay on the stone it is cracking
    const seg = Math.min(7 * u, h * .3);
    const x0 = X - w / 2 + r1 * w, y0 = top + r2 * (h - seg * 2);
    c.beginPath();
    c.moveTo(x0, y0);
    c.lineTo(x0 + (r3 - .5) * 8 * u, y0 + seg);
    c.lineTo(x0 + (r1 - .5) * 10 * u, y0 + seg * 2);
    c.stroke();
  }
  if (wear >= 2){
    // soot around the hits, not stains stuck on the stone
    c.globalAlpha = .16;
    for (let i = 0; i < 4; i++){
      const r = hash2(i * 8.9, seed + 5);
      ell(c, X - w / 2 + r * w, top + h * (.35 + r * .55), (2.4 + r * 2.6) * u, (1.8 + r * 1.8) * u, '#2b2622');
    }
    c.globalAlpha = 1;
  }
  if (wear >= 3){
    // smoke, drifting the way the wind takes the clouds
    for (let i = 0; i < 3; i++){
      const ph = G.t * .55 + i * .66 + seed;
      const k = ph % 1;
      c.globalAlpha = (1 - k) * .30;
      ell(c, X + (hash2(i, seed) - .5) * w * .5 + k * 9 * u, top - k * 26 * u,
        (3 + k * 7) * u, (2.6 + k * 6) * u, '#6d6a66');
    }
    c.globalAlpha = 1;
  }
}
// Scattered raised blocks so a flat wall reads as masonry.
function masonry(c, x, y, w, h, u, seed){
  for (let i = 0; i < 7; i++){
    const r = hash2(seed + i * 13, seed * 3 + i * 7);
    const bw = (4 + r * 5) * u, bh = 3.2 * u;
    const bx = x + r * (w - bw), by = y + hash2(seed + i, seed - i) * (h - bh);
    c.fillStyle = i % 2 ? STONE.lit : STONE.mid2;
    c.fillRect(bx, by, bw, bh);
  }
}
function pennant(c, x, y, u, col, dir){
  c.fillStyle = STONE.deep; c.fillRect(x - 1 * u, y - 4 * u, 2 * u, 16 * u);
  const w = 20 * u * dir, h = 13 * u;
  poly(c, [[x, y - 2 * u], [x + w, y - 4 * u], [x + w, y + h - 4 * u], [x, y + h - 2 * u]], col);
  poly(c, [[x, y - 2 * u], [x + w * .55, y - 3 * u], [x + w * .55, y + h - 3 * u], [x, y + h - 2 * u]], shade(col, 1.12));
}

// How the inhibitor's shard hangs and turns. A function rather than arithmetic
// inline because two of these would break the illusion and neither shows in a
// still frame: a facet split that wanders outside the outline turns the shard
// back into the flat diamond it used to be, and a lift out of range either
// sinks it into its own plinth or leaves it hanging in the sky.
// How lit a turret's eye is, and how far its mount has lurched back. `cd`
// counts down from a full reload to zero, so this is 1 the instant it looses
// and 0 when it is ready again. Named so a test can hold it to exactly that: a
// flash that never fades is a lamp, and one that never lights means the thing
// shoots you with no sign of it having done so.
const TURRET_KICK = 3.4;
function turretShot(st){
  const as = attackSpeedOf(st);
  if (!(as > 0) || !(st.cd > 0)) return { hot:0, kick:0 };
  const hot = clamp(st.cd * as, 0, 1);
  return { hot, kick:hot * hot * TURRET_KICK };
}
const SHARD = { w:14, top:62, bot:16, rise:3.2 };
function shardAt(t){
  return {
    lift: (Math.sin(t * 1.6) * .5 + .5) * SHARD.rise,
    split: Math.cos(t * 1.15) * SHARD.w * .62,   // where the lit facet meets the dark
    glint: cyc(t * .21),                         // the highlight travelling down it
    aura: .22 + (Math.sin(t * 2) * .5 + .5) * .18,
  };
}
function drawStructure(c, st){
  const p = lp(st.x, st.y);
  const u = cam.z, col = SIDE_COL[st.side], dead = st.dead;
  const dir = dirOf(st.side);          // which way this side faces the bridge
  const X = p[0], Y = p[1];
  ell(c, X, Y + 2 * u, (st.key === 'gate' ? 74 : 26) * u, (st.key === 'gate' ? 16 : 8) * u, 'rgba(0,0,0,.28)');

  if (st.key === 'gate'){
    if (dead){
      // knocked in: stumps of the two towers and a heap of blocks
      for (const sx of [-1, 1]){
        block(c, X + sx * 46 * u - 15 * u, Y - 26 * u, 30 * u, 26 * u, STONE.deep, STONE.dark);
        poly(c, [[X + sx * 46 * u - 15 * u, Y - 26 * u], [X + sx * 46 * u + 15 * u, Y - 20 * u], [X + sx * 46 * u + 15 * u, Y - 26 * u]], STONE.dark);
      }
      for (let i = 0; i < 9; i++){
        const r = hash2(i, st.side * 7);
        block(c, X - 40 * u + r * 80 * u, Y - (4 + r * 7) * u, (7 + r * 6) * u, (5 + r * 4) * u, STONE.dark, STONE.mid2);
      }
      c.globalAlpha = .5; ell(c, X, Y - 10 * u, 60 * u, 16 * u, 'rgba(60,55,50,.7)'); c.globalAlpha = 1;
    } else {
      // outbuilding with a tall team-coloured pyramid roof, set behind
      const ox = X - dir * 78 * u;
      block(c, ox - 20 * u, Y - 50 * u, 40 * u, 50 * u, STONE.mid, STONE.lit);
      masonry(c, ox - 20 * u, Y - 50 * u, 40 * u, 50 * u, u, 11 + st.side);
      poly(c, [[ox - 26 * u, Y - 48 * u], [ox, Y - 88 * u], [ox + 26 * u, Y - 48 * u]], shade(col, .95));
      poly(c, [[ox, Y - 88 * u], [ox + 26 * u, Y - 48 * u], [ox + 10 * u, Y - 48 * u]], shade(col, .74));
      c.fillStyle = STONE.line; c.fillRect(ox - 3 * u, Y - 40 * u, 6 * u, 14 * u);
      // curtain wall between the towers
      block(c, X - 30 * u, Y - 62 * u, 60 * u, 62 * u, STONE.mid, STONE.lit);
      masonry(c, X - 30 * u, Y - 60 * u, 60 * u, 56 * u, u, 3 + st.side);
      // timber lintel spanning both towers
      block(c, X - 62 * u, Y - 70 * u, 124 * u, 8 * u, WOOD.mid, WOOD.lit);
      block(c, X - 62 * u, Y - 62 * u, 124 * u, 3 * u, WOOD.dark);
      // ribbed roof over the gateway
      const ry = Y - 66 * u;
      poly(c, [[X - 34 * u, ry + 14 * u], [X - 26 * u, ry], [X + 26 * u, ry], [X + 34 * u, ry + 14 * u]], shade(col, 1.02));
      c.strokeStyle = shade(col, .72); c.lineWidth = Math.max(1, 1.4 * u);
      for (let i = -4; i <= 4; i++){
        const t = i / 4;
        c.beginPath(); c.moveTo(X + t * 26 * u, ry); c.lineTo(X + t * 34 * u, ry + 14 * u); c.stroke();
      }
      block(c, X - 35 * u, ry + 13 * u, 70 * u, 4 * u, shade(col, .66));
      // arched doorway: voussoir ring, then the doors
      c.fillStyle = STONE.lit;
      c.beginPath(); c.arc(X, Y - 30 * u, 24 * u, Math.PI, 0); c.fill();
      c.fillRect(X - 24 * u, Y - 30 * u, 48 * u, 30 * u);
      c.fillStyle = WOOD.mid;
      c.beginPath(); c.arc(X, Y - 30 * u, 18 * u, Math.PI, 0); c.fill();
      c.fillRect(X - 18 * u, Y - 30 * u, 36 * u, 30 * u);
      c.strokeStyle = WOOD.dark; c.lineWidth = Math.max(1, 1.2 * u);
      for (let i = -2; i <= 2; i++){
        c.beginPath(); c.moveTo(X + i * 7 * u, Y - 44 * u); c.lineTo(X + i * 7 * u, Y); c.stroke();
      }
      block(c, X - 18 * u, Y - 26 * u, 36 * u, 3.5 * u, '#6b7078');
      block(c, X - 18 * u, Y - 11 * u, 36 * u, 3.5 * u, '#6b7078');
      // the two gate towers
      for (const sx of [-1, 1]){
        const tx = X + sx * 46 * u;
        block(c, tx - 16 * u, Y - 86 * u, 32 * u, 86 * u, STONE.mid, STONE.lit);
        masonry(c, tx - 16 * u, Y - 84 * u, 32 * u, 80 * u, u, 21 + sx + st.side * 5);
        crown(c, tx, Y - 96 * u, 36 * u, u, 5, WEAR(st));
        battleDamage(c, st, tx, Y - 82 * u, 30 * u, 70 * u, u);
        c.fillStyle = STONE.line; c.fillRect(tx - 3 * u, Y - 66 * u, 6 * u, 15 * u);
        // timber palisade skirting the base
        for (let i = 0; i < 4; i++)
          block(c, tx + (sx > 0 ? 14 : -30) * u + i * 4 * u, Y - 20 * u, 3.4 * u, 20 * u, i % 2 ? WOOD.mid : WOOD.lit);
        block(c, tx - 18 * u, Y - 8 * u, 36 * u, 8 * u, STONE.deep, STONE.dark);
      }
      pennant(c, X + dir * 62 * u, Y - 92 * u, u, col, dir);
    }
  } else if (st.key === 'inhib'){
    // The thing that, when it breaks, lets the other side's ogres through —
    // and it was a flat diamond sitting dead still on a plain grey box, next
    // to a gate with masonry, timber and a pennant.
    const S = shardAt(G.t + st.side * 1.7);
    block(c, X - 22 * u, Y - 12 * u, 44 * u, 12 * u, STONE.deep, STONE.dark);
    masonry(c, X - 21 * u, Y - 11 * u, 42 * u, 10 * u, u, 61 + st.side);
    block(c, X - 17 * u, Y - 20 * u, 34 * u, 9 * u, STONE.mid, STONE.lit);
    if (!dead){
      const cy = Y - S.lift * u;
      c.globalAlpha = .30 - S.lift * .045;
      ell(c, X, Y - 19 * u, (13 - S.lift) * u, (4.4 - S.lift * .55) * u, '#2c2a26');
      c.globalAlpha = S.aura;
      ell(c, X, cy - 38 * u, 30 * u, 30 * u, col);
      c.globalAlpha = 1;
      const top = cy - SHARD.top * u, bot = cy - SHARD.bot * u, mid = cy - 36 * u;
      const L = X - SHARD.w * u, R = X + SHARD.w * u, M = X + S.split * u;
      poly(c, [[X, top], [R, mid], [X, bot], [L, mid]], shade(col, .78));
      poly(c, [[X, top], [M, mid], [X, bot], [L, mid]], shade(col, 1.18));
      poly(c, [[X, top], [M, mid], [X, bot]], shade(col, 1.42));
      poly(c, [[X, top], [R, mid], [X, bot], [L, mid]], null, '#eef6ff', 1);
      // a glint running down the shard as it turns
      const gy = lerp(top, bot, S.glint), gw = SHARD.w * u * (1 - Math.abs(S.glint - .5) * 2) * .34;
      if (gw > 0){
        c.globalAlpha = .7 * Math.sin(S.glint * Math.PI);
        poly(c, [[X - gw * .2, gy + 1.6 * u], [X + gw, gy - 2.2 * u],
                 [X + gw, gy - .8 * u], [X - gw * .2, gy + 3 * u]], '#ffffff');
        c.globalAlpha = 1;
      }
      // and light coming off it
      for (let i = 0; i < 3; i++){
        const ph = cyc(G.t * .3 + i * .34 + st.side * .5);
        c.globalAlpha = .45 * (1 - ph);
        ell(c, X + Math.sin(ph * 6 + i * 2) * 11 * u, bot - ph * 44 * u, 1.6 * u, 1.9 * u, SIDE_COL2[st.side]);
      }
      c.globalAlpha = 1;
      battleDamage(c, st, X, Y - 20 * u, 34 * u, 18 * u, u);
    } else {
      for (let i = 0; i < 5; i++){
        const r = hash2(i, 3 + st.side);
        block(c, X - 16 * u + r * 30 * u, Y - (5 + r * 6) * u, (6 + r * 5) * u, (5 + r * 3) * u, STONE.dark, STONE.mid2);
      }
    }
  } else {
    if (dead){
      block(c, X - 16 * u, Y - 14 * u, 32 * u, 14 * u, STONE.deep, STONE.dark);
      for (let i = 0; i < 6; i++){
        const r = hash2(i, st.ord + st.side * 9);
        block(c, X - 22 * u + r * 40 * u, Y - (4 + r * 6) * u, (6 + r * 5) * u, (4 + r * 4) * u, STONE.dark, STONE.mid2);
      }
      c.globalAlpha = .35; ell(c, X, Y - 6 * u, 26 * u, 8 * u, 'rgba(50,46,42,.8)'); c.globalAlpha = 1;
    } else {
      // flared footing → tapered shaft → crenellated crown → the eye
      poly(c, [[X - 21 * u, Y], [X + 21 * u, Y], [X + 16 * u, Y - 13 * u], [X - 16 * u, Y - 13 * u]], STONE.deep);
      block(c, X - 21 * u, Y - 5 * u, 42 * u, 5 * u, STONE.dark, STONE.mid2);
      for (const sx of [-1, 1]) block(c, X + sx * 15 * u - 5 * u, Y - 11 * u, 10 * u, 11 * u, STONE.dark, STONE.mid2);
      poly(c, [[X - 16 * u, Y - 12 * u], [X + 16 * u, Y - 12 * u], [X + 13 * u, Y - 58 * u], [X - 13 * u, Y - 58 * u]], STONE.mid);
      poly(c, [[X - 16 * u, Y - 12 * u], [X - 13 * u, Y - 58 * u], [X - 7 * u, Y - 58 * u], [X - 9 * u, Y - 12 * u]], STONE.lit);
      poly(c, [[X + 16 * u, Y - 12 * u], [X + 13 * u, Y - 58 * u], [X + 8 * u, Y - 58 * u], [X + 10 * u, Y - 12 * u]], STONE.mid2);
      masonry(c, X - 12 * u, Y - 54 * u, 24 * u, 40 * u, u, st.ord * 7 + st.side * 3);
      // a string course round the shaft, and slits to shoot out of
      block(c, X - 15 * u, Y - 48 * u, 30 * u, 4 * u, STONE.mid2, STONE.lit);
      for (const sx of [-1, 1]){
        const slx = X + sx * 8 * u;
        c.fillStyle = '#3f4440'; c.fillRect(slx - 1.5 * u, Y - 26 * u, 3 * u, 7 * u);
        c.fillStyle = STONE.deep; c.fillRect(slx - 2.8 * u, Y - 27.4 * u, 5.6 * u, 1.4 * u);
      }
      // the timber hoarding it fights from, overhanging the side the enemy is on
      const hx = X + dir * 13 * u, hy = Y - 62 * u;
      block(c, X - 14 * u, hy, 28 * u, 10 * u, WOOD.mid, WOOD.lit);
      poly(c, [[hx, hy], [hx + dir * 9 * u, hy + 2 * u], [hx + dir * 9 * u, hy + 9 * u], [hx, hy + 10 * u]], WOOD.dark);
      poly(c, [[hx, hy], [hx + dir * 9 * u, hy + 2 * u], [hx + dir * 9 * u, hy + 3.5 * u], [hx, hy + 1.6 * u]], WOOD.lit);
      for (let i = 0; i < 3; i++)                        // the props under it
        block(c, X - 11 * u + i * 9 * u, hy + 10 * u, 2.4 * u, 5 * u, WOOD.dark);
      crown(c, X, Y - 68 * u, 32 * u, u, 5, WEAR(st));
      battleDamage(c, st, X, Y - 56 * u, 26 * u, 44 * u, u);
      // The eye. It was a painted circle that brightened; it is a weapon in a
      // socket now, and it lurches back on the shot — the same trick that made
      // the cannon read as firing instead of standing still.
      const S = turretShot(st);
      const ex = X - dir * S.kick * u, ey = Y - 38 * u;
      c.globalAlpha = .18 + S.hot * .45;
      ell(c, X + dir * S.hot * 6 * u, ey, (16 + S.hot * 5) * u, (16 + S.hot * 5) * u, col);
      c.globalAlpha = 1;
      ell(c, ex, ey, 11 * u, 11 * u, STONE.mid2);        // the iron ring
      ell(c, ex, ey, 9 * u, 9 * u, STONE.lit);
      ell(c, ex, ey, 7.4 * u, 7.4 * u, '#3a3f3c');       // the socket behind it
      ell(c, ex, ey, 6.2 * u, 6.2 * u, shade(col, .8 + S.hot * .5));
      ell(c, ex - 2 * u, ey - 2 * u, 2.4 * u, 2.4 * u, '#ffffff');
      // and the flash, for the moment after it looses
      if (S.hot > .74){
        const f = (S.hot - .74) / .26;
        c.globalAlpha = f * .8;
        const mx = X + dir * (11 + f * 7) * u;
        poly(c, [[mx, ey - 5 * u * f], [mx + dir * 13 * u * f, ey], [mx, ey + 5 * u * f]], '#fff2c4');
        c.globalAlpha = 1;
      }
      pennant(c, X + dir * 14 * u, Y - 78 * u, u, col, dir);
    }
  }
  if (!dead) hpBar(c, X, Y - (st.key === 'gate' ? 116 : st.key === 'inhib' ? 72 : 84) * cam.z, st, 44 * cam.z, true);
  else if (st.downT > 0){
    c.fillStyle = '#d8c49a'; c.font = Math.max(9, Math.round(11 * cam.z)) + 'px system-ui'; c.textAlign = 'center';
    c.fillText(Math.ceil(st.downT) + 's', p[0], p[1] - 18 * cam.z);
  }
  if (st.hitT > 0 && !dead){
    c.globalAlpha = st.hitT * 2.2; ell(c, p[0], p[1] - 20 * cam.z, 26 * cam.z, 20 * cam.z, '#ffffff'); c.globalAlpha = 1;
  }
  // Every building in the hold carries its name; nothing on the bridge did.
  // Nine identical towers and two diamonds, and the only place their names
  // appeared was a toast that had already scrolled away ('Ember Host loses
  // Inner Turret') or a panel you had to click each one to read. Worse, the
  // rule that decides the whole match — only the outermost standing structure
  // can be attacked — was invisible: you could not see where your wave would
  // land or which of yours was in the firing line. So: short names on the
  // bridge, in the side's colour, and the one in play says so.
  //
  // Short names, not the full ones: measured at the zoom the camera buttons
  // actually land on (0.95 desktop, 0.75-0.78 on a phone) adjacent structures
  // sit 79px apart on the desktop and 62px on the narrowest phone, and 'Inner
  // Turret' is ~68px of 9px type. 'Inner' is ~34.
  const lab = structLabel(st);
  if (lab) labelQ.push({ x:X, y:Y - (st.key === 'gate' ? 128 : st.key === 'inhib' ? 84 : 96) * cam.z,
    txt:lab.txt, col:lab.col, small:true });
}
// The bridge is read at a glance and a full name is twice the width of the gap
// between two towers, so the world gets the short form and the inspect panel
// keeps the full one.
const STRUCT_SHORT = { gate:'Gates', inhib:'Inhibitor', t3:'Inner', t2:'Mid', t1:'Outer' };
// Kept out of the draw call so it can be checked without a canvas: a rubble
// heap already prints its own rebuild countdown, so only standing structures
// get a name.
function structLabel(st){
  if (st.dead) return null;
  return { txt:(STRUCT_SHORT[st.key] || st.n) + (st === frontStruct(st.side) ? ' · in play' : ''),
    col:st.side === 0 ? '#bfe0ff' : '#ffc4bd' };
}

// A bar is a flat block of colour on a black block, twenty of them at once in
// a brawl. It tells you the number but not the story — how hard that last hit
// landed, or how close to the next chunk this thing is.
//
// The chip is the pale trail behind the fill, showing health that has JUST
// gone. It lives in the simulation (see chipTick) rather than in the renderer,
// so both machines agree on it and a resync carries it; nothing reads it for
// any decision and the hash does not mix it.
const HP_TICK = 220;              // one notch per this much health, up to HP_TICKS
const HP_TICKS = 6;
function hpBar(c, x, y, u, w, big){
  const f = clamp(u.hp / u.mhp, 0, 1);
  const h = big ? 5 * cam.z : 3.2 * cam.z;
  const x0 = x - w / 2;
  c.fillStyle = 'rgba(8,10,14,.82)'; c.fillRect(x0 - 1.4, y - 1.4, w + 2.8, h + 2.8);
  c.fillStyle = 'rgba(46,52,60,.9)'; c.fillRect(x0, y, w, h);
  const chip = clamp((u.chipHp === undefined ? u.hp : u.chipHp) / u.mhp, 0, 1);
  if (chip > f){
    c.fillStyle = 'rgba(255,226,168,.85)';
    c.fillRect(x0 + w * f, y, w * (chip - f), h);
  }
  const col = u.side === 0 ? '#54d06a' : '#e0544a';
  c.fillStyle = col; c.fillRect(x0, y, w * f, h);
  c.fillStyle = shade(col, 1.28); c.fillRect(x0, y, w * f, h * .38);
  // notches, so a long bar reads as an amount rather than a length
  const n = clamp(Math.round(u.mhp / HP_TICK), 0, HP_TICKS);
  if (n > 1 && w > 14){
    c.fillStyle = 'rgba(8,10,14,.42)';
    for (let i = 1; i < n; i++) c.fillRect(x0 + (w * i / n) - .5, y, 1, h);
  }
  if (u.shield > 0){
    const sf = clamp(u.shield / u.mhp, 0, 1);
    c.fillStyle = 'rgba(220,235,255,.85)';
    c.fillRect(x0, y, w * Math.min(1, sf), h * .45);
  }
}
// How fast the chip runs down to meet the bar. Named so a test can hold it to
// what a chip is for: it has to LAG a hit (or it shows nothing) and it has to
// catch up (or a body that took one hit wears a pale stripe for the rest of
// the match).
const CHIP_RATE = .55, CHIP_FLOOR = 60;
function chipTick(u, dt){
  if (u.chipHp === undefined || u.chipHp < u.hp) u.chipHp = u.hp;
  else if (u.chipHp > u.hp) u.chipHp = Math.max(u.hp, u.chipHp - (u.mhp * CHIP_RATE + CHIP_FLOOR) * dt);
}

// A brawl is twenty bodies deep and every one of them used to carry a health
// bar, which turned the middle of the bridge into a staircase of green and
// red. A minion earns its bar by being hurt or shielded; a hero always keeps
// one, because a hero is the thing you are watching.
const showsBar = (u) => !!u.isHero || u.hp < u.mhp - .5 || u.shield > 0;

// A siege engine is worth about four bodies and used to look like a man
// carrying a crate. Each kind gets its own silhouette, so what is walking at
// you is legible from across the bridge instead of from the health bar.
// The gun rolls back into its carriage when it fires. `swing` is set the
// instant a unit attacks and was doing nothing for the cannon, so a cannon
// firing looked exactly like a cannon standing still with a puff of smoke
// somewhere else. Pulled out of the draw call because the sign matters and a
// still frame will not show it to you: recoil that pushed the gun TOWARD the
// enemy would read as a lunge, and it would read as one on only one side.
const RECOIL = 2.6, RECOIL_T = .25;
function recoilOf(u){
  if (!(u.swing > 0)) return 0;
  return -dirOf(u.side) * clamp(u.swing / RECOIL_T, 0, 1) * RECOIL;
}
function drawCannon(c, u, bx, by, floor, sc, col){
  const dir = dirOf(u.side), hit = u.hitT > 0;
  const wood = hit ? '#ffffff' : '#6b5334', iron = hit ? '#ffffff' : '#3d3a35';
  const kick = recoilOf(u) * sc;
  // wheels, with spokes and a hub — they were flat discs with a dot
  for (const wx of [-5, 4.5]){
    const wcx = bx + wx * sc, wcy = floor - 3 * sc;
    ell(c, wcx, wcy, 3.4 * sc, 3.4 * sc, iron);
    ell(c, wcx, wcy, 2.7 * sc, 2.7 * sc, hit ? '#ffffff' : shade(wood, .82));
    if (!hit){
      c.strokeStyle = shade(wood, 1.2); c.lineWidth = Math.max(.6, .9 * sc);
      const roll = cyc(u.x * .28 + wx * .1) * 6.2832;
      for (let i = 0; i < 4; i++){
        const a = roll + i * .7854;
        c.beginPath();
        c.moveTo(wcx - Math.cos(a) * 2.5 * sc, wcy - Math.sin(a) * 2.5 * sc);
        c.lineTo(wcx + Math.cos(a) * 2.5 * sc, wcy + Math.sin(a) * 2.5 * sc);
        c.stroke();
      }
    }
    ell(c, wcx, wcy, 1.2 * sc, 1.2 * sc, iron);
  }
  // carriage, with a lit top edge like every other timber in the game
  poly(c, [[bx - 7 * sc + kick, floor - 4 * sc], [bx + 6 * sc + kick, floor - 5 * sc],
           [bx + 6 * sc + kick, floor - 8 * sc], [bx - 7 * sc + kick, floor - 7 * sc]], wood);
  poly(c, [[bx - 7 * sc + kick, floor - 7 * sc], [bx + 6 * sc + kick, floor - 8 * sc],
           [bx + 6 * sc + kick, floor - 9 * sc], [bx - 7 * sc + kick, floor - 8 * sc]], hit ? '#ffffff' : shade(wood, 1.28));
  // barrel, angled the way it fires
  const y0 = floor - 8.5 * sc;
  poly(c, [[bx - dir * 4 * sc + kick, y0], [bx + dir * 8 * sc + kick, y0 - 5 * sc],
           [bx + dir * 8 * sc + kick, y0 - 8 * sc], [bx - dir * 4 * sc + kick, y0 - 3.5 * sc]], iron);
  poly(c, [[bx - dir * 4 * sc + kick, y0 - 3.5 * sc], [bx + dir * 8 * sc + kick, y0 - 8 * sc],
           [bx + dir * 8 * sc + kick, y0 - 9 * sc], [bx - dir * 4 * sc + kick, y0 - 4.4 * sc]],
    hit ? '#ffffff' : shade(iron, 1.9));
  for (const t of [.25, .62]){                                  // reinforcing bands
    const mx = bx + dir * lerp(-4, 8, t) * sc + kick, my = y0 - lerp(0, 5, t) * sc;
    poly(c, [[mx - dir * .7 * sc, my + .4 * sc], [mx + dir * .7 * sc, my + .4 * sc],
             [mx + dir * .7 * sc, my - 5 * sc], [mx - dir * .7 * sc, my - 5 * sc]],
      hit ? '#ffffff' : shade(iron, 1.5));
  }
  ell(c, bx + dir * 8 * sc + kick, y0 - 6.4 * sc, 1.9 * sc, 2.2 * sc, hit ? '#ffffff' : shade(iron, .7));
  // team pennant so you can still tell whose it is
  c.fillStyle = hit ? '#ffffff' : col;
  c.fillRect(bx - dir * 7 * sc, floor - 15 * sc, 1.2 * sc, 8 * sc);
  poly(c, [[bx - dir * 7 * sc, floor - 15 * sc], [bx - dir * 12 * sc, floor - 13.5 * sc],
           [bx - dir * 7 * sc, floor - 11.5 * sc]], hit ? '#ffffff' : col);
}

// The ogre missed the pass that gave the infantry legs, a lit shoulder and a
// face — so the biggest, most dangerous thing on the bridge ended up the least
// detailed thing on it, standing next to levies with more going on than it had.
function drawOgre(c, u, bx, by, floor, sc, col){
  const dir = dirOf(u.side), hit = u.hitT > 0;
  const skin = hit ? '#ffffff' : shade(col, .62);
  const body = hit ? '#ffffff' : col;
  // legs, on the same stride the infantry walks
  const st = strideOf(u) * sc * .9;
  for (const s of [-1, 1]){
    const hipx = bx + s * 3.4 * sc, ftx = bx + s * 3.8 * sc + s * st;
    poly(c, [[hipx - 1.9 * sc, by - 1 * sc], [hipx + 1.9 * sc, by - 1 * sc],
             [ftx + 1.8 * sc, floor], [ftx - 1.8 * sc, floor]], shade(body, hit ? 1 : .44));
    c.fillStyle = shade(body, hit ? 1 : .32);
    c.fillRect(ftx - 2.2 * sc, floor - 1.7 * sc, 4.4 * sc, 1.9 * sc);
  }
  // hunched barrel of a body — wide at the shoulders, small head sunk into it.
  // It has to tower over the infantry: an ogre is worth a whole wave.
  poly(c, [[bx - 6.5 * sc, by], [bx + 6.5 * sc, by], [bx + 8 * sc, by - 13 * sc],
           [bx - 8 * sc, by - 13 * sc]], body);
  poly(c, [[bx + 2 * sc, by], [bx + 6.5 * sc, by], [bx + 8 * sc, by - 13 * sc], [bx + 2.6 * sc, by - 13 * sc]],
    shade(body, hit ? 1 : LIT.bodyDark));
  poly(c, [[bx - 8 * sc, by - 13 * sc], [bx - 1 * sc, by - 13 * sc], [bx - 1.4 * sc, by - 9.6 * sc], [bx - 7.4 * sc, by - 9.6 * sc]],
    shade(body, hit ? 1 : LIT.bodyLit));
  c.fillStyle = shade(body, hit ? 1 : .5);
  c.fillRect(bx - 8 * sc, by - 9 * sc, 16 * sc, 2.4 * sc);            // the belt
  // pauldrons, so the shoulders read as bulk rather than a wide box
  for (const s of [-1, 1])
    ell(c, bx + s * 7.4 * sc, by - 12.4 * sc, 3.2 * sc, 2.4 * sc, shade(body, hit ? 1 : .56));
  // and a head with something in it: a heavy brow, two small eyes, a tusk
  const hx = bx + dir * 1.5 * sc, hy = by - 15.4 * sc;
  ell(c, hx, hy, 3.6 * sc, 3.2 * sc, skin);
  if (!hit){
    ell(c, hx, hy - 2.1 * sc, 3.4 * sc, 1.3 * sc, shade(skin, .72));  // brow
    for (const s of [-1, 1]) ell(c, hx + dir * .5 * sc + s * 1.1 * sc, hy - .2 * sc, .52 * sc, .62 * sc, '#2a2320');
    poly(c, [[hx + dir * .9 * sc, hy + 2.2 * sc], [hx + dir * 1.7 * sc, hy + 2.0 * sc],
             [hx + dir * 1.4 * sc, hy + .7 * sc]], '#e8e2d2');        // tusk, at the jaw
  }
  // club, raised on the swing
  const sw = u.swing > 0 ? 1 : 0;
  c.strokeStyle = '#5b4426'; c.lineWidth = 3.4 * sc; c.lineCap = 'round';
  c.beginPath();
  c.moveTo(bx + dir * 5.5 * sc, by - 7 * sc);
  c.lineTo(bx + dir * (11 + sw * 2) * sc, by - (16 - sw * 11) * sc);
  c.stroke(); c.lineCap = 'butt';
  const kx = bx + dir * (12 + sw * 2) * sc, ky = by - (17.5 - sw * 12) * sc;
  ell(c, kx, ky, 3.4 * sc, 3.8 * sc, '#6f5730');
  ell(c, kx - dir * 1 * sc, ky - 1.1 * sc, 1.5 * sc, 1.7 * sc, '#8a6f3e');
  for (let i = 0; i < 3; i++)                                          // banded with iron
    ell(c, kx + (i - 1) * 1.7 * sc, ky + (i - 1) * 1.4 * sc, .7 * sc, .8 * sc, '#4a4038');
}

// How far this body's feet are apart right now. Pulled out of the draw call so
// it can be checked: a body that is stood in reach of the thing it is hitting
// must PLANT, and one walking up the bridge must not. Reads the clock and the
// unit's own fixed phase, never a random stream, so both machines see the same
// legs at the same tick.
const BODY_STRIDE = 2.4;
function strideOf(u){
  if (u.stunT > 0 || u.pullT > 0) return 0;
  if (u.target && hyp(u.target.x - u.x, u.target.y - u.y) <= u.rng + (u.target.r || .4) + u.r) return 0;
  return Math.sin(G.t * 7 + u.ph) * BODY_STRIDE;
}
function drawUnit(c, u){
  const p = lp(u.x, u.y), S = LS();
  const col = SIDE_COL[u.side], sc = (u.isHero ? 1.75 : u.kind === 'super' ? 1.6 : u.kind === 'cannon' ? 1.45 : 1.18) * cam.z;
  ell(c, p[0], p[1] + 1, (u.kind === 'cannon' ? 9 : 7) * sc, 3.4 * sc, 'rgba(0,0,0,.32)');
  const bob = Math.sin(G.t * 7 + u.ph) * (u.target && hyp(u.target.x - u.x, u.target.y - u.y) < u.rng + 1 ? .6 : 1.4) * sc * .4;
  // Whoever just cast lifts off the ground for a third of a second over a
  // brightening pool of their skill's colour. Without it the effects all happen
  // somewhere ELSE — at the target, in the air, on the ground — and the hero
  // that did the thing is the one part of it you cannot see.
  // Getting hit knocks you back. hitT already existed and only ever changed the
  // body's COLOUR for a frame — so twenty bodies trading blows read as twenty
  // bodies standing still, occasionally flashing. A flinch away from the enemy
  // costs nothing and makes a brawl look like one.
  const flinch = u.hitT > 0 ? (u.hitT / .18) * 2.6 * sc * -dirOf(u.side) : 0;
  let cast = 0;
  if (u.castT > 0){
    cast = clamp(u.castT / .32, 0, 1);
    const gr = (7 + cast * 9) * sc;
    c.globalAlpha = cast * .55;
    ell(c, p[0], p[1] + 1, gr, gr * .45, u.castCol || '#ffe08a');
    c.globalAlpha = 1;
  }
  const bx = p[0] + flinch, by = p[1] - 2 * sc + bob - cast * 3.2 * sc;
  if (u.kind === 'cannon'){ drawCannon(c, u, bx, by, p[1], sc, col); return drawUnitMarks(c, u, bx, by, p, sc); }
  if (u.kind === 'super'){ drawOgre(c, u, bx, by, p[1], sc, col); return drawUnitMarks(c, u, bx, by, p, sc); }
  const dir0 = dirOf(u.side);
  const body = u.hitT > 0 ? '#ffffff' : col;
  // Legs that stride. Every body on the bridge used to be two 2px sticks under
  // a torso that bobbed on the spot, so a wave marching up the span read as a
  // row of pieces sliding along it. They walk on the same clock as the bob and
  // plant when the thing they are hitting is in reach.
  const st = strideOf(u) * sc;
  for (const s of [-1, 1]){
    const hipx = bx + s * 2.1 * sc, ftx = bx + s * 2.4 * sc + s * st;
    poly(c, [[hipx - 1.5 * sc, by - 1 * sc], [hipx + 1.5 * sc, by - 1 * sc],
             [ftx + 1.4 * sc, p[1]], [ftx - 1.4 * sc, p[1]]], shade(body, .52));
    c.fillStyle = shade(body, .38);
    c.fillRect(ftx - 1.8 * sc, p[1] - 1.4 * sc, 3.6 * sc, 1.6 * sc);   // the boot
  }
  // Torso, with a lit face and a shaded one. It was a single flat fill — the
  // only thing left in the game without a light side, next to houses, mines,
  // cliffs and masonry that all have one.
  c.fillStyle = body;
  c.beginPath();
  c.moveTo(bx - 4.2 * sc, by); c.lineTo(bx + 4.2 * sc, by);
  c.lineTo(bx + 3.2 * sc, by - 9 * sc); c.lineTo(bx - 3.2 * sc, by - 9 * sc);
  c.closePath(); c.fill();
  poly(c, [[bx + 1.1 * sc, by], [bx + 4.2 * sc, by], [bx + 3.2 * sc, by - 9 * sc], [bx + 1.1 * sc, by - 9 * sc]],
    shade(body, u.hitT > 0 ? 1 : LIT.bodyDark));
  poly(c, [[bx - 3.2 * sc, by - 9 * sc], [bx - .4 * sc, by - 9 * sc], [bx - .4 * sc, by - 6.4 * sc], [bx - 3.5 * sc, by - 6.4 * sc]],
    shade(body, u.hitT > 0 ? 1 : LIT.bodyLit));
  c.fillStyle = shade(body, .60);
  c.fillRect(bx - 4.2 * sc, by - 4 * sc, 8.4 * sc, 1.6 * sc);          // the belt
  // an arm reaching to whatever it is holding, so the weapon leaves a hand
  c.strokeStyle = shade(body, .66); c.lineWidth = 2.1 * sc; c.lineCap = 'round';
  c.beginPath();
  c.moveTo(bx + dir0 * 2.4 * sc, by - 7.4 * sc);
  c.lineTo(bx + dir0 * (4 + (u.swing > 0 ? 1.4 : 0)) * sc, by - (5 - (u.swing > 0 ? 1.6 : 0)) * sc);
  c.stroke(); c.lineCap = 'butt';
  // head
  ell(c, bx, by - 11.6 * sc, 3 * sc, 3.2 * sc, u.hitT > 0 ? '#ffffff' : '#e8d6b8');
  const hooded = u.kind === 'caster' || u.cls === 'mage' || u.cls === 'support';
  if (hooded){
    // a hood, not a helmet — the caster reads as a caster before it casts
    poly(c, [[bx - 3.6 * sc, by - 10.2 * sc], [bx, by - 16.4 * sc], [bx + 3.6 * sc, by - 10.2 * sc]],
      u.hitT > 0 ? '#ffffff' : shade(col, .58));
  } else {
    c.fillStyle = shade(col, .55);
    c.fillRect(bx - 3.1 * sc, by - 14.4 * sc, 6.2 * sc, 2.6 * sc);
    // a footman is the one wearing real armour, and it shows
    if (u.kind === 'melee' || u.isHero){
      c.fillStyle = shade(col, u.hitT > 0 ? 1 : .38);
      c.fillRect(bx - 3.6 * sc, by - 15.6 * sc, 7.2 * sc, 1.4 * sc);
    }
    // a visor slot, on the side it is facing — a bare oval reads as looking
    // nowhere, and every body on the bridge is supposed to be facing the fight
    c.fillStyle = 'rgba(40,34,28,.55)';
    c.fillRect(bx + dir0 * .4 * sc - 1.9 * sc, by - 12.3 * sc, 3.8 * sc, 1.3 * sc);
  }
  // weapon by role
  const sw = u.swing > 0 ? 1 : 0;
  c.strokeStyle = '#d8dbe2'; c.lineWidth = 1.7 * sc; c.lineCap = 'round';
  const dir = dirOf(u.side);
  c.beginPath();
  if (u.kind === 'caster' || u.cls === 'mage' || u.cls === 'support'){
    c.moveTo(bx + dir * 4 * sc, by - 2 * sc); c.lineTo(bx + dir * 5 * sc, by - 15 * sc);
    c.stroke();
    ell(c, bx + dir * 5 * sc, by - 16 * sc, 2.2 * sc, 2.2 * sc, u.side === 0 ? '#9ad8ff' : '#ffb08a');
    c.beginPath();
  } else if (u.rng > 3){
    c.moveTo(bx + dir * 3 * sc, by - 9 * sc); c.lineTo(bx + dir * 6 * sc, by - 3 * sc);
  } else {
    c.moveTo(bx + dir * 3.5 * sc, by - 6 * sc);
    c.lineTo(bx + dir * (7 + sw * 3) * sc, by - (10 - sw * 7) * sc);
  }
  c.stroke(); c.lineCap = 'butt';
  // shield arm, on the side away from the enemy — levies carry a round buckler,
  // footmen a kite shield, which is most of the difference between them
  if (u.kind === 'grunt' || u.kind === 'melee' || (u.isHero && u.rng <= 3)){
    const sx = bx - dir * 3.6 * sc;
    if (u.kind === 'grunt') ell(c, sx, by - 5 * sc, 2.6 * sc, 2.8 * sc, shade(col, u.hitT > 0 ? 1 : .5));
    else poly(c, [[sx - 2.6 * sc, by - 8.4 * sc], [sx + 2.6 * sc, by - 8.4 * sc],
                  [sx + 2.6 * sc, by - 3.4 * sc], [sx, by - .8 * sc], [sx - 2.6 * sc, by - 3.4 * sc]],
              shade(col, u.hitT > 0 ? 1 : .46));
  }
  drawUnitMarks(c, u, bx, by, p, sc);
}

// Shields, burns, stuns, the health bar and everything a hero carries — shared
// by the three silhouettes so a cannon can catch fire like anybody else.
function drawUnitMarks(c, u, bx, by, p, sc){
  const col = SIDE_COL[u.side];
  // A shield is a thing that BREAKS, so it reads as a surface rather than a
  // smudge — and it flickers harder as it runs out of time.
  if (u.shield > 0){
    const fade = u.shT > 0 ? clamp(u.shT / 2, .35, 1) : 1;
    c.globalAlpha = .18 * fade;
    ell(c, bx, by - 6 * sc, 9.5 * sc, 11.5 * sc, '#cfe6ff');
    c.globalAlpha = (.5 + .25 * Math.sin(G.t * 9)) * fade;
    c.strokeStyle = '#dceaff'; c.lineWidth = Math.max(1, 1.5 * cam.z);
    c.beginPath(); c.ellipse(bx, by - 6 * sc, 9.5 * sc, 11.5 * sc, 0, 0, 6.2832); c.stroke();
    c.globalAlpha = 1;
  }
  if (u.burn){
    c.globalAlpha = .45; ell(c, bx, by - 6 * sc, 5 * sc, 8 * sc, '#ff8a3d');
    // flames rather than a wash, so burning reads as burning
    for (let i = 0; i < 3; i++){
      const a = G.t * 9 + i * 2.1, lift = (Math.sin(a) * .5 + .5);
      c.globalAlpha = .5 - lift * .3;
      ell(c, bx + Math.cos(a * .7 + i) * 3 * sc, by - (7 + lift * 7) * sc, 1.9 * sc, 2.8 * sc, i & 1 ? '#ffd06a' : '#ff8a3d');
    }
    c.globalAlpha = 1;
  }
  // Slowed. There was no sign of this at all, and it is half of what crowd
  // control does — a body walking at 40% looked exactly like one walking.
  if (u.slowT > 0 && u.slowP > 0){
    c.globalAlpha = .35 + .2 * Math.sin(G.t * 4);
    c.strokeStyle = '#9ad8ff'; c.lineWidth = Math.max(1, 1.4 * cam.z);
    c.beginPath(); c.ellipse(bx, p[1], 8 * sc, 3.6 * sc, 0, 0, 6.2832); c.stroke();
    for (let i = 0; i < 3; i++){
      const a = -G.t * 2 + i * 2.1;
      c.globalAlpha = .5;
      ell(c, bx + Math.cos(a) * 7 * sc, p[1] + Math.sin(a) * 3 * sc, 1.1 * sc, 1.1 * sc, '#9ad8ff');
    }
    c.globalAlpha = 1;
  }
  // Marked for extra damage — the reason a hero suddenly evaporates.
  if (u.markT > 0){
    const puls = .6 + .4 * Math.sin(G.t * 8);
    c.globalAlpha = puls;
    c.strokeStyle = '#ff7ad9'; c.lineWidth = Math.max(1.2, 2 * cam.z);
    const my = by - 26 * sc, r = 4 * sc;
    c.beginPath(); c.arc(bx, my, r, 0, 6.2832); c.stroke();
    c.beginPath();
    c.moveTo(bx - r * 1.8, my); c.lineTo(bx - r * .6, my);
    c.moveTo(bx + r * .6, my); c.lineTo(bx + r * 1.8, my);
    c.moveTo(bx, my - r * 1.8); c.lineTo(bx, my - r * .6);
    c.moveTo(bx, my + r * .6); c.lineTo(bx, my + r * 1.8);
    c.stroke();
    c.globalAlpha = 1;
  }
  if (u.stunT > 0){
    c.fillStyle = '#ffcf4d';
    for (let i = 0; i < 3; i++){
      const a = G.t * 6 + i * 2.1;
      ell(c, bx + Math.cos(a) * 6 * sc, by - 17 * sc + Math.sin(a) * 2 * sc, 1.5 * sc, 1.5 * sc, '#ffcf4d');
    }
  }
  if (showsBar(u)) hpBar(c, bx, by - (u.isHero ? 22 : u.kind === 'super' ? 21 : 18) * sc, u, (u.isHero ? 30 : 17) * sc, u.isHero);
  if (u.isHero && u.buffs && u.buffs.some(b => b.t > 0)){
    c.globalAlpha = .5 + .2 * Math.sin(G.t * 5);
    c.strokeStyle = '#ffcf4d'; c.lineWidth = Math.max(1.2, 2 * cam.z);
    c.beginPath(); c.ellipse(bx, p[1], 13 * sc, 6 * sc, 0, 0, 6.2832); c.stroke();
    c.globalAlpha = 1;
  }
  if (u.isHero){
    // The badge was a big flat black disc floating out to the side of the
    // hero, and in a brawl it was the loudest thing on the bridge. It is a
    // roundel seated on the end of the hero's own bar now, with a lit rim so
    // it belongs to the same set of objects as everything else.
    const lx = bx - 18.5 * sc, ly = by - 22 * sc, lr = 5.4 * sc;
    ell(c, lx, ly, lr + 1.1, lr + 1.1, 'rgba(8,10,14,.82)');
    ell(c, lx, ly, lr, lr, shade(col, .34));
    ell(c, lx, ly - lr * .34, lr * .86, lr * .5, shade(col, .52));
    c.strokeStyle = shade(col, 1.1); c.lineWidth = Math.max(1, 1.2 * cam.z);
    c.beginPath(); c.arc(lx, ly, lr, 0, 6.2832); c.stroke();
    c.fillStyle = '#ffe7a8'; c.font = 'bold ' + Math.max(7, Math.round(7 * sc)) + 'px system-ui'; c.textAlign = 'center'; c.textBaseline = 'middle';
    c.fillText(String(u.lvl), lx, ly + .4 * sc);
    labelQ.push({ x:bx, y:by - 26 * sc, txt:u.name, col:u.side === 0 ? '#bfe0ff' : '#ffc4bd', small:true });
    c.strokeStyle = 'rgba(255,255,255,.25)'; c.lineWidth = 1;
    c.beginPath(); c.ellipse(bx, p[1], 11 * sc, 5 * sc, 0, 0, 6.2832); c.stroke();
  }
}

function drawLane(c){
  // zones under everyone
  for (const z of G.zones){
    const p = lp(z.x, z.y);
    const rx = z.r * LS() * .96, ry = z.r * LS() * .55;
    const col = z.magic ? '#a06bff' : '#ff8a3d', hot = z.magic ? '#d9b6ff' : '#ffd06a';
    // A lingering zone is one of the few things on this board that keeps
    // hurting after the cast is over, and it was a flat pulsing disc. It now
    // has an edge you can stand outside of, a churn inside it, and it visibly
    // runs down — the three things a player needs to decide whether to walk in.
    const life = clamp(z.t / Math.max(.1, z.dur), 0, 1);
    c.globalAlpha = (.16 + .07 * Math.sin(G.t * 6)) * (.35 + .65 * life);
    ell(c, p[0], p[1], rx, ry, col);
    c.globalAlpha = (.45 + .2 * Math.sin(G.t * 6)) * (.35 + .65 * life);
    c.strokeStyle = hot; c.lineWidth = Math.max(1, 2 * cam.z);
    c.beginPath(); c.ellipse(p[0], p[1], rx, ry, 0, 0, 6.2832); c.stroke();
    // the churn: a few motes turning inside the circle, keyed off the clock so
    // it costs nothing and stays put
    for (let i = 0; i < 5; i++){
      const a = G.t * (z.magic ? 1.6 : 2.2) + i * 1.257;
      const rr2 = .45 + .45 * ((i * 7 % 5) / 5);
      c.globalAlpha = (.3 + .3 * Math.sin(G.t * 5 + i)) * life;
      ell(c, p[0] + Math.cos(a) * rx * rr2, p[1] + Math.sin(a) * ry * rr2, 2.2 * cam.z, 2.2 * cam.z, hot);
    }
    c.globalAlpha = 1;
  }
  // Anything still on the end of a chain, drawn under the bodies so the links
  // pass behind whoever is being reeled in.
  for (const u of G.units)
    if (u.pullT > 0 && u.pullBy && !u.pullBy.dead) chainLine(c, u.pullBy.x, u.pullBy.y, .9, u.x, u.y, .7, '#d9c49a');
  const draws = [];
  for (const s of G.sides) for (const st of s.structs) draws.push({ y:lp(st.x, st.y)[1], f:() => drawStructure(c, st) });
  for (const u of G.units){ if (!u.dead) draws.push({ y:lp(u.x, u.y)[1], f:() => drawUnit(c, u) }); }
  draws.sort((a, b) => a.y - b.y);
  for (const d of draws) d.f();
  // projectiles
  for (const p of G.projs){
    const q = lp(p.x, p.y, p.z);
    // the streak it has just cut through the air
    if (p.tr.length >= 6){
      c.lineCap = 'round';
      for (let i = 0; i + 5 < p.tr.length; i += 3){
        const a = lp(p.tr[i], p.tr[i + 1], p.tr[i + 2]);
        const b = lp(p.tr[i + 3], p.tr[i + 4], p.tr[i + 5]);
        c.globalAlpha = .10 + .5 * (i / p.tr.length);
        c.strokeStyle = p.col; c.lineWidth = (p.kind === 'bolt' ? 3.2 : 1.9) * cam.z * (.4 + i / p.tr.length);
        c.beginPath(); c.moveTo(a[0], a[1]); c.lineTo(b[0], b[1]); c.stroke();
      }
      c.lineCap = 'butt';
    }
    c.globalAlpha = 1;
    if (p.kind === 'hook'){
      // a chain paid out from the thrower, with the claw on the end of it
      if (p.src && !p.src.dead) chainLine(c, p.src.x, p.src.y, .9, p.x, p.y, p.z, p.col);
      const nx = p.ax || 1, ny = (p.ay || 0) * .55, L = 5 * cam.z;
      c.strokeStyle = '#8f8168'; c.lineWidth = 2.6 * cam.z; c.lineCap = 'round';
      c.beginPath();
      c.moveTo(q[0] + nx * L, q[1] + ny * L);
      c.lineTo(q[0] - nx * L * .4 - ny * L * .8, q[1] - ny * L * .4 + nx * L * .8);
      c.moveTo(q[0] + nx * L, q[1] + ny * L);
      c.lineTo(q[0] - nx * L * .4 + ny * L * .8, q[1] - ny * L * .4 - nx * L * .8);
      c.stroke(); c.lineCap = 'butt';
      ell(c, q[0], q[1], 2.6 * cam.z, 2.6 * cam.z, p.col);
    } else if (p.kind === 'bolt'){
      // a spell: a soft body around a hot core
      c.globalAlpha = .5; ell(c, q[0], q[1], 5.2 * cam.z, 5.2 * cam.z, p.col); c.globalAlpha = 1;
      ell(c, q[0], q[1], 2.4 * cam.z, 2.4 * cam.z, '#ffffff');
    } else {
      // a shaft: drawn along the direction it is travelling, not as a dot
      const nx = p.ax || 1, ny = (p.ay || 0) * .55;
      const L = 7 * cam.z;
      c.strokeStyle = p.col; c.lineWidth = 2 * cam.z; c.lineCap = 'round';
      c.beginPath(); c.moveTo(q[0] - nx * L, q[1] - ny * L); c.lineTo(q[0] + nx * L * .5, q[1] + ny * L * .5); c.stroke();
      c.lineCap = 'butt';
      ell(c, q[0] + nx * L * .5, q[1] + ny * L * .5, 1.7 * cam.z, 1.7 * cam.z, '#ffffff');
    }
  }
  // particles
  for (const p of G.fx){
    const a = clamp(p.t / p.dur, 0, 1);
    if (p.k === 'p'){
      const q = lp(p.x, p.y, p.z);
      c.globalAlpha = a; ell(c, q[0], q[1], p.r * cam.z, p.r * cam.z, p.col);
    } else if (p.k === 'ring'){
      const q = lp(p.x, p.y);
      c.globalAlpha = a * .8; c.strokeStyle = p.col; c.lineWidth = 2.5 * cam.z;
      c.beginPath(); c.ellipse(q[0], q[1], p.r * LS() * (1.35 - a * .35), p.r * LS() * .55 * (1.35 - a * .35), 0, 0, 6.2832); c.stroke();
    } else if (p.k === 'ghost'){
      const q = lp(p.x, p.y);
      c.globalAlpha = a * .45;
      ell(c, q[0], q[1] - 7 * cam.z, 4.5 * cam.z, 9 * cam.z, p.col);
    } else if (p.k === 'bolt'){
      const q = lp(p.x, p.y, .8), q2 = lp(p.x2, p.y2, .8);
      c.globalAlpha = a; c.strokeStyle = p.col; c.lineWidth = 2.4 * cam.z;
      c.beginPath(); c.moveTo(q[0], q[1]); c.lineTo(q2[0], q2[1]); c.stroke();
    } else if (p.k === 'beam'){
      // A thrown bolt or a falling shaft: a bright core with a soft body, so it
      // reads at a glance without washing out what is behind it.
      const q = lp(p.x, p.y, .9), q2 = lp(p.x2, p.y2, .9);
      c.lineCap = 'round';
      c.globalAlpha = a * .35; c.strokeStyle = p.col; c.lineWidth = p.w * 2.2 * cam.z;
      c.beginPath(); c.moveTo(q[0], q[1]); c.lineTo(q2[0], q2[1]); c.stroke();
      c.globalAlpha = a; c.strokeStyle = '#ffffff'; c.lineWidth = Math.max(1, p.w * .7) * cam.z;
      c.beginPath(); c.moveTo(q[0], q[1]); c.lineTo(q2[0], q2[1]); c.stroke();
      c.lineCap = 'butt';
    } else if (p.k === 'arc'){
      // A swept slash through the target, opening out as it fades.
      const q = lp(p.x, p.y, .7);
      const rx = p.r * LS() * (.7 + (1 - a) * .8), ry = rx * .55;
      c.globalAlpha = a * .9; c.strokeStyle = p.col; c.lineWidth = Math.max(1.5, 3.4 * cam.z);
      c.lineCap = 'round';
      c.beginPath(); c.ellipse(q[0], q[1], rx, ry, p.a, -1.15, 1.15); c.stroke();
      c.lineCap = 'butt';
    } else if (p.k === 'wave'){
      // Grows outward and thins as it goes, unlike `ring` which barely moves.
      const q = lp(p.x, p.y);
      const g = 1 + (1 - a) * 1.35;
      c.globalAlpha = a * .75; c.strokeStyle = p.col;
      c.lineWidth = Math.max(1, (1 + a * 3) * cam.z);
      c.beginPath(); c.ellipse(q[0], q[1], p.r * LS() * g, p.r * LS() * .5 * g, 0, 0, 6.2832); c.stroke();
    } else if (p.k === 'link'){
      const q = lp(p.x, p.y, 1.1), q2 = lp(p.x2, p.y2, 1.1);
      const g = 1 - a;                                  // it draws itself ON over its life
      const mx = q[0] + (q2[0] - q[0]) * Math.min(1, g * 1.6);
      const my = q[1] + (q2[1] - q[1]) * Math.min(1, g * 1.6);
      c.lineCap = 'round';
      c.globalAlpha = a * .55; c.strokeStyle = p.col; c.lineWidth = 4.5 * cam.z;
      c.beginPath(); c.moveTo(q[0], q[1]); c.lineTo(mx, my); c.stroke();
      c.globalAlpha = a; c.lineWidth = 1.6 * cam.z;
      c.beginPath(); c.moveTo(q[0], q[1]); c.lineTo(mx, my); c.stroke();
      c.lineCap = 'butt';
    } else if (p.k === 'mote'){
      const q = lp(p.x, p.y, p.z);
      c.globalAlpha = a * .9; ell(c, q[0], q[1], p.r * cam.z, p.r * cam.z, p.col);
    }
    c.globalAlpha = 1;
  }
  // damage numbers
  c.textAlign = 'center';
  for (const f of G.floats){
    const q = lp(f.x, f.y, f.cast ? 2.4 : 1.4);
    c.globalAlpha = clamp(f.t / f.dur, 0, 1);
    const y = q[1] - (1 - f.t / f.dur) * (f.cast ? 30 : 22);
    if (f.cast){
      c.font = 'bold ' + Math.max(9, Math.round((f.ult ? 13 : 11) * cam.z)) + 'px system-ui';
      c.lineWidth = Math.max(2, 3 * cam.z); c.strokeStyle = 'rgba(6,9,14,.85)';
      c.strokeText(String(f.txt), q[0], y);
      c.fillStyle = f.ult ? '#ffe08a' : f.col;
      c.fillText(String(f.txt), q[0], y);
    } else {
      // The cast names have been outlined since they were written; the damage
      // numbers, in the other half of the same branch, never were — so yellow
      // digits landed on a pale body and vanished. And a number punches in
      // rather than appearing at full size, which is most of what makes a big
      // hit feel like one.
      const age = 1 - f.t / f.dur;
      const pop = age < FLOAT_POP ? .55 + .45 * (age / FLOAT_POP) : 1;
      c.font = 'bold ' + Math.max(9, Math.round(11 * f.sc * pop * cam.z)) + 'px system-ui';
      c.lineWidth = Math.max(2, 2.6 * f.sc * cam.z); c.strokeStyle = 'rgba(6,9,14,.8)';
      c.strokeText(String(f.txt), q[0], y);
      c.fillStyle = f.col;
      c.fillText(String(f.txt), q[0], y);
    }
    c.globalAlpha = 1;
  }
}

// One strip covering the whole world: your hold, the span, their hold.
// One rect, used by both the drawing and the hit test, so a tap always lands
// where the strip actually is.
function minimapRect(){
  const narrow = LW < 760;
  // On a phone the strip is nearly as wide as the screen, so it goes up into
  // the empty sky under the camera buttons rather than across the battlefield.
  const w = Math.min(340, LW - 24), h = narrow ? 24 : 34;
  return { x0:LW - w - 12, y0:narrow ? 46 : LH - h - 10, w, h,
    W0:CAM_MIN - 10, W1:CAM_MAX + 10 };
}
function minimapWorldX(sx){
  const m = minimapRect();
  return m.W0 + clamp((sx - m.x0 - 6) / (m.w - 12), 0, 1) * (m.W1 - m.W0);
}
function drawMinimap(c){
  const m = minimapRect();
  const w = m.w, h = m.h, x0 = m.x0, y0 = m.y0;
  const W0 = m.W0, W1 = m.W1;
  c.fillStyle = 'rgba(8,12,18,.76)'; c.fillRect(x0, y0, w, h);
  c.strokeStyle = '#2a3446'; c.lineWidth = 1; c.strokeRect(x0 + .5, y0 + .5, w - 1, h - 1);
  const mx = (x) => x0 + 6 + ((x - W0) / (W1 - W0)) * (w - 12);
  // the two holds, then the span between them
  for (const i of [0, 1]){
    const hx = i === 0 ? HOLD_X : C.LANE_LEN - HOLD_X;
    c.fillStyle = i === 0 ? 'rgba(76,112,64,.85)' : 'rgba(112,76,64,.85)';
    c.fillRect(mx(hx - 22), y0 + 5, Math.max(6, mx(hx + 22) - mx(hx - 22)), h - 10);
  }
  c.fillStyle = '#3d4658'; c.fillRect(mx(0), y0 + h / 2 - 2, mx(C.LANE_LEN) - mx(0), 4);
  for (const s of G.sides) for (const st of s.structs){
    if (st.dead) continue;
    c.fillStyle = SIDE_COL[s.i];
    const sz = st.key === 'gate' ? 5 : st.key === 'inhib' ? 4 : 3;
    c.fillRect(mx(st.x) - sz / 2, y0 + h / 2 - sz, sz, sz * 2);
  }
  for (const u of G.units){
    if (u.dead) continue;
    c.fillStyle = u.isHero ? '#ffffff' : SIDE_COL2[u.side];
    const sz = u.isHero ? 3 : 1.6;
    c.fillRect(mx(u.x) - sz / 2, y0 + h / 2 + u.y * .8 - sz / 2, sz, sz);
  }
  // camera window
  const halfW = (LW * .5) / (LS() * .96);
  c.strokeStyle = 'rgba(255,255,255,.5)';
  c.strokeRect(mx(cam.x - halfW), y0 + 3, Math.max(4, mx(cam.x + halfW) - mx(cam.x - halfW)), h - 6);
}

/* =====================================================================
   RENDERING — your hold
   ===================================================================== */
const sel = { tile:-1, node:null, build:null, hero:null, struct:null, unit:null };
// The hold lives in the same world as the bridge, just off to one side of it,
// so one camera covers your farms, the whole span and their gates. Everything
// below is written in hold-grid units and projected through the world.
const HOLD_X = -58, TILE = 7.2;
// Where MY hold stands. Both are always drawn; this is only about where the
// camera opens and what the HOLD and FOE buttons mean.
const myHoldX = () => MY === 0 ? HOLD_X : C.LANE_LEN - HOLD_X;
let holdSide = 0, BSC = 1;
function holdWorld(gx, gy){
  const d = holdSide === 0 ? 1 : -1;
  const ox = holdSide === 0 ? HOLD_X : C.LANE_LEN - HOLD_X;
  return [ ox + gx * TILE * d, gy * TILE ];
}
function bp(gx, gy, z){
  const w = holdWorld(gx, gy);
  return lp(w[0], w[1], (z || 0) * TILE * .62);
}
// Old base art was tuned against a ~45px grid cell; keep those numbers honest
// at any zoom by expressing them in cells too.
const bu = () => LS() * TILE / 45;
const tileGX = (t) => (t % PLOT_W) - (PLOT_W - 1) / 2;
const tileGY = (t) => Math.floor(t / PLOT_W) - (PLOT_H - 1) / 2;
// Where the furniture stands. These are not free numbers: the great keep in
// drawEnds() stands at world (-16, 0), which is hold-grid (5.8, 0), and it is
// painted over the hold. The gold mine used to sit at (4.8, -1.6) — close
// enough in screen space that the castle swallowed it whole and all you saw
// was its label. Everything here is spread so that no two things share a
// screen column, and so the town hall is well inside the outer cliff.
const NODES = {
  gold: { gx:2.2, gy:-4.8, n:'Gold Mine', col:'#ffcf4d' },
  iron: { gx:5.4, gy:3.4,  n:'Iron Mine', col:'#b9c6d8' },
  wood: { gx:-1.0, gy:4.3, n:'Woodland',  col:'#6fbf5a' },
};
const KEEP = { gx:-3.0, gy:-1.2 };
// The logging camp, as grid offsets from the woodland node rather than as
// numbers buried in the draw call — so a test can walk them and check they all
// land on the island. The first pass put the wood chips at +0.95, and with the
// node at gy 4.6 against a near edge of 5.56 they were being drawn on the lip
// of the cliff. That is the same mistake the town hall used to make.
const WOOD_LOT = {
  stumps: [[-.78, .16], [-.38, .24]],
  logs: [.74, .14],
  block: [-.16, .30],
  chips: [[-.48, .40], [-.22, .40], [.04, .40], [-.48, .50], [-.22, .50]],
  trees: [[-.85, -.42], [-.30, -.60], [.28, -.48], [.78, -.20], [-.60, .08], [.05, .02]],
};

// Where a building's fittings sit, in the same z its house is built in: `wh`
// is the wall height and `rh` the roof, so the ridge is at wh + rh. A chimney
// anchored ABOVE the ridge stands in mid-air — which is exactly what the
// forge's did, at z + 1.15 against a ridge at z + 0.85, with its glow drawn as
// an opaque orange disc floating over the roof. Kept as a table so a test can
// check every fitting lands on the building it belongs to.
const FIT = {
  forge:   { wh:.55, rh:.30, chimney:.72 },
  townhall:{ wh:1.15, rh:.55, chimney:1.34 },
};

function drawTile(c, gx, gy, fill, stroke){
  poly(c, [bp(gx - .5, gy - .5), bp(gx + .5, gy - .5), bp(gx + .5, gy + .5), bp(gx - .5, gy + .5)], fill, stroke, 1);
}

// Every building in the game went through here, and every one of them was lit
// from the opposite side to the island it stands on.
//
// The sun in this game is up and to the LEFT of the viewer. The mesa proves
// it: platFaces gives its near wall the lightest stone and its right-hand wall
// the darkest, and that is the biggest object on screen. Bodies agree — a
// torso's screen-left is its bright side. Mines agree, turrets agree, the
// abutments agree, the deck kerbs agree.
//
// drawHouse had it backwards: the near face, which points down-LEFT in this
// projection, was the darkest at .70, while the right-hand face was .92. So a
// town hall was shaded against the cliff it stood on and against the worker
// walking past its door. Nothing in one screenshot says which of the two is
// wrong — you have to hold them side by side and pick the majority.
// One table for the whole convention, so the next thing that needs a lit face
// and a shaded one takes them from here instead of picking a direction on its
// own — which is how the buildings ended up disagreeing with their island.
const LIT = {
  near:1.02, right:.74, cap:1.05,                       // house walls
  roofNear:.86, roofFar:.66, roofLeft:1.06, roofRight:.78,
  bodyLit:1.16, bodyDark:.74,                           // a torso's two sides
  coatLit:1.22, coatDark:.68,                           // and a worker's
};
function drawHouse(c, gx, gy, w, d, wh, rh, wall, roof){
  const A = bp(gx - w, gy - d), B = bp(gx + w, gy - d), Cc = bp(gx + w, gy + d), D = bp(gx - w, gy + d);
  const A1 = bp(gx - w, gy - d, wh), B1 = bp(gx + w, gy - d, wh), C1 = bp(gx + w, gy + d, wh), D1 = bp(gx - w, gy + d, wh);
  poly(c, [D, Cc, C1, D1], shade(wall, LIT.near));
  poly(c, [Cc, B, B1, C1], shade(wall, LIT.right));
  poly(c, [A1, B1, C1, D1], shade(wall, LIT.cap));
  const R1 = bp(gx, gy - d * 1.15, wh + rh), R2 = bp(gx, gy + d * 1.15, wh + rh);
  const E1 = bp(gx - w * 1.18, gy - d * 1.18, wh), E2 = bp(gx + w * 1.18, gy - d * 1.18, wh);
  const E3 = bp(gx + w * 1.18, gy + d * 1.18, wh), E4 = bp(gx - w * 1.18, gy + d * 1.18, wh);
  poly(c, [E1, E2, R1], shade(roof, LIT.roofFar));
  poly(c, [E2, E3, R2, R1], shade(roof, LIT.roofRight));
  poly(c, [E4, E3, R2], shade(roof, LIT.roofNear));
  poly(c, [E1, R1, R2, E4], shade(roof, LIT.roofLeft));
}

// What a house has cut into it. Every plot building goes through drawHouse and
// only the town hall and the forge ever had a door — the rest were blank boxes
// standing next to a hall with a door, four lit windows and a chimney.
//
// Returned as data rather than drawn inline so a test can check every opening
// lands on a face this projection actually shows: the near face at y = +d and
// the right-hand face at x = +w. An opening on either of the other two is
// hidden by the building itself and surfaces over the roof instead — which is
// exactly what the town hall's windows did on the first pass.
// Keyed by building type, and every type in BUILDINGS has to appear — a null
// means "this one deliberately has no house openings", which is a decision
// somebody made rather than a case that was never written. Add a building and
// the test fails until you say what its walls look like.
const TRIM = {
  pit:      null,                              // no house at all, it is a hole
  forge:    null,                              // its opening is the fire door
  farm:     { win:1, side:0, lit:false },
  barracks: { win:2, side:1, lit:false },
  tavern:   { win:2, side:2, lit:true },
  workshop: { win:2, side:1, lit:true },
};
function houseOpenings(w, d, wh, spec){
  const out = [{ plane:'near', a:-w * .26, b:w * .26, z0:0, z1:wh * .60, kind:'door' }];
  const z0 = wh * .50, z1 = wh * .80;
  const near = [[-w * .82, -w * .46], [w * .46, w * .82]];
  for (let i = 0; i < (spec.win || 0); i++)
    out.push({ plane:'near', a:near[i % 2][0], b:near[i % 2][1], z0, z1, kind:'win' });
  const side = [[-d * .64, -d * .22], [d * .20, d * .62]];
  for (let i = 0; i < (spec.side || 0); i++)
    out.push({ plane:'right', a:side[i % 2][0], b:side[i % 2][1], z0, z1, kind:'win' });
  return out;
}
function houseTrim(c, gx, gy, w, d, wh, spec, base){
  const b0 = base || 0;
  for (const o of houseOpenings(w, d, wh - b0, spec)){
    const fill = o.kind === 'door' ? '#4a3526' : (spec.lit ? '#f0cf82' : '#5d5140');
    const pts = o.plane === 'near'
      ? [bp(gx + o.a, gy + d, b0 + o.z0), bp(gx + o.b, gy + d, b0 + o.z0),
         bp(gx + o.b, gy + d, b0 + o.z1), bp(gx + o.a, gy + d, b0 + o.z1)]
      : [bp(gx + w, gy + o.a, b0 + o.z0), bp(gx + w, gy + o.b, b0 + o.z0),
         bp(gx + w, gy + o.b, b0 + o.z1), bp(gx + w, gy + o.a, b0 + o.z1)];
    poly(c, pts, fill);
  }
}

function drawBuilding(c, b){
  const gx = tileGX(b.tile), gy = tileGY(b.tile), B = bu();
  const raise = (b.raise || 0);
  const z = raise * 1.2;
  const t = b.type;
  c.globalAlpha = raise > 0 ? clamp(1 - raise * .5, .35, 1) : 1;
  ell(c, ...bp(gx, gy + .1), BSC * .62, BSC * .3, 'rgba(0,0,0,.22)');
  if (t === 'farm'){
    drawTile(c, gx, gy, '#6d5a34');
    // The furrows used to add the raise to the tile's gy instead of to its
    // height, so while a farm was being built its field slid sideways across
    // the plot rather than rising with it.
    for (let i = -4; i <= 4; i++){
      poly(c, [bp(gx - .46, gy + i * .10, z), bp(gx + .46, gy + i * .10, z),
               bp(gx + .46, gy + i * .10 + .05, z), bp(gx - .46, gy + i * .10 + .05, z)],
        i % 2 ? '#7d6739' : '#5d4d2c');
    }
    for (let i = 0; i < 9; i++){
      const p = bp(gx - .36 + (i % 5) * .18, gy - .22 + Math.floor(i / 5) * .34, z + .1);
      ell(c, p[0], p[1], BSC * .07, BSC * .1, i % 3 ? '#9ec95c' : '#87b64d');
    }
    drawHouse(c, gx - .28, gy - .3, .22, .18, .5 + z, .3, '#a9825a', '#b8503f');
    houseTrim(c, gx - .28, gy - .3, .22, .18, .5 + z, TRIM.farm, z);
  } else if (t === 'pit'){
    // This is the building your army comes out of and it was two flat
    // ellipses on a dark tile — it read as a puddle. It is a mustering pit
    // now: a stone kerb, steps cut down into it, a plank ramp somebody walks
    // up, and a brazier burning at the head of it.
    drawTile(c, gx, gy, '#4a4038');
    ell(c, ...bp(gx, gy, z), BSC * .46, BSC * .24, '#6d6355');          // the kerb
    ell(c, ...bp(gx, gy, z + .01), BSC * .40, BSC * .205, '#514a3f');
    ell(c, ...bp(gx, gy, z + .02), BSC * .33, BSC * .17, '#3a332b');    // first step down
    ell(c, ...bp(gx, gy, z + .03), BSC * .25, BSC * .13, '#251f1a');    // and the dark of it
    c.globalAlpha = .34 + .12 * Math.sin(G.t * 2.2 + gx);
    ell(c, ...bp(gx, gy, z + .04), BSC * .17, BSC * .09, '#c2632c');    // torchlight from below
    c.globalAlpha = 1;
    // the ramp out, running toward the front of the plot
    poly(c, [bp(gx - .16, gy + .18, z + .02), bp(gx + .16, gy + .18, z + .02),
             bp(gx + .22, gy + .52, z), bp(gx - .22, gy + .52, z)], '#7a5c38');
    c.strokeStyle = '#5c4326'; c.lineWidth = Math.max(1, 1.2 * B);
    for (let i = 1; i < 4; i++){
      const tt = i / 4;
      const a = bp(lerp(gx - .16, gx - .22, tt), lerp(gy + .18, gy + .52, tt), z + .02 - tt * .02);
      const e = bp(lerp(gx + .16, gx + .22, tt), lerp(gy + .18, gy + .52, tt), z + .02 - tt * .02);
      c.beginPath(); c.moveTo(a[0], a[1]); c.lineTo(e[0], e[1]); c.stroke();
    }
    // Kit stacked ready to be handed out. This was a rack of spears first, and
    // at the size a plot building actually gets on screen four 1px lines read
    // as four floating sticks whatever you do to the frame behind them. Round
    // shields are a shape that survives being small.
    const rk = bp(gx - .44, gy + .20, z);
    ell(c, rk[0], rk[1], 10 * B, 3.6 * B, 'rgba(0,0,0,.20)');
    for (let i = 0; i < 3; i++){
      const sx = rk[0] - 4 * B + i * 3.6 * B, sy = rk[1] - 4 * B - (i % 2) * 1.2 * B;
      ell(c, sx, sy, 4.4 * B, 4.7 * B, shade(sideCol(), .48));
      ell(c, sx, sy, 3.3 * B, 3.6 * B, shade(sideCol(), .88));
      ell(c, sx, sy, 1.2 * B, 1.3 * B, '#c9d2dd');
    }
    // the brazier at the head of the pit
    const br = bp(gx + .42, gy - .30, z);
    c.fillStyle = '#4a4038'; c.fillRect(br[0] - 1.6 * B, br[1] - 8 * B, 3.2 * B, 8 * B);
    ell(c, br[0], br[1] - 9 * B, 4.4 * B, 2.2 * B, '#5e5449');
    const fl = .6 + .3 * Math.sin(G.t * 7 + gy);
    c.globalAlpha = .55;
    ell(c, br[0], br[1] - 11 * B, 5 * B * fl, 5 * B * fl, '#ff8a3d');
    c.globalAlpha = 1;
    ell(c, br[0], br[1] - 11 * B, 2.2 * B * fl, 2.6 * B * fl, '#ffd58a');
    for (const s of [-1, 1]){
      const p0 = bp(gx + s * .42, gy - .35, z), p1 = bp(gx + s * .42, gy - .35, z + .9);
      c.strokeStyle = '#6a5540'; c.lineWidth = 3 * B; c.beginPath(); c.moveTo(p0[0], p0[1]); c.lineTo(p1[0], p1[1]); c.stroke();
      c.fillStyle = sideCol(); c.fillRect(p1[0] - 2 * B, p1[1], 8 * B * (s > 0 ? 1 : -1), 9 * B);
    }
  } else if (t === 'barracks'){
    drawTile(c, gx, gy, '#5e5748');
    drawHouse(c, gx, gy, .42, .34, .62 + z, .40, '#b08a5e', '#a34438');
    houseTrim(c, gx, gy, .42, .34, .62 + z, TRIM.barracks, z);
    const p = bp(gx - .5, gy + .1, z + .95);
    c.fillStyle = sideCol(); c.fillRect(p[0], p[1], 7 * B, 12 * B);
    // Shields hung on the wall. These were three thin white lines standing at
    // gx + .5 against a house half-width of .42 — a hand's breadth outside the
    // wall, so they floated beside it, and at this size a 2px line reads as a
    // floating line however you dress it. The same thing happened at the
    // mustering pit; a round shield is a shape that survives being small.
    for (let i = 0; i < 2; i++){
      const q = bp(gx + .42, gy + .04 + i * .20, z + .32);
      ell(c, q[0], q[1], 4.6 * B, 4.9 * B, shade(sideCol(), .46));
      ell(c, q[0], q[1], 3.4 * B, 3.7 * B, shade(sideCol(), .86));
      ell(c, q[0], q[1], 1.2 * B, 1.3 * B, '#c9d2dd');
    }
  } else if (t === 'forge'){
    const F = FIT.forge;
    drawTile(c, gx, gy, '#4f4a44');
    drawHouse(c, gx, gy, .40, .32, F.wh + z, F.rh, '#8d8579', '#5c5750');
    // The stack. Its old anchor was z + 1.15 against a ridge at z + 0.85, so
    // it stood in mid-air over the roof — and fillRect draws DOWNWARD, so the
    // masonry hung below the anchor while the "glow" was an opaque orange disc
    // floating above it. It is bedded into the roof now and drawn upward.
    const ch = bp(gx + .20, gy - .16, z + F.chimney);
    c.fillStyle = '#6d6459'; c.fillRect(ch[0] - 5 * B, ch[1] - 12 * B, 10 * B, 20 * B);
    c.fillStyle = '#857b6d'; c.fillRect(ch[0] - 6 * B, ch[1] - 14 * B, 12 * B, 3 * B);
    c.fillStyle = '#2c251f'; c.fillRect(ch[0] - 3.5 * B, ch[1] - 15 * B, 7 * B, 2 * B);
    for (let i = 0; i < 3; i++){                       // smoke off the flue
      const ph = cyc(G.t * .34 + i * .33 + gx);
      c.globalAlpha = .24 * (1 - ph) * (raise > 0 ? .4 : 1);
      ell(c, ch[0] + Math.sin(ph * 5 + i) * 4 * B, ch[1] - 18 * B - ph * 24 * B,
        (2.4 + ph * 6) * B, (2 + ph * 4.6) * B, '#9b968c');
    }
    c.globalAlpha = 1;
    // the fire is in the doorway, on the face you can see, not in the sky
    const glow = .55 + .25 * Math.sin(G.t * 6 + gx);
    const face = (x0, x1, z0, z1, fill) =>
      poly(c, [bp(x0, gy + .32, z0), bp(x1, gy + .32, z0), bp(x1, gy + .32, z1), bp(x0, gy + .32, z1)], fill);
    face(gx - .17, gx + .17, z, z + .36 + F.wh * .1, '#2a1c14');
    c.globalAlpha = glow * (raise > 0 ? .4 : 1);
    face(gx - .12, gx + .12, z + .02, z + .30, '#ff8a3d');
    c.globalAlpha = 1;
    c.globalAlpha = (.13 + .05 * Math.sin(G.t * 6)) * (raise > 0 ? .4 : 1);
    ell(c, ...bp(gx, gy + .46, z), BSC * .20, BSC * .10, '#ff8a3d');   // spill on the ground
    c.globalAlpha = 1;
    // the anvil it is all for
    const an = bp(gx - .44, gy + .30, z);
    c.fillStyle = '#3c3630'; c.fillRect(an[0] - 2 * B, an[1] - 4 * B, 4 * B, 4 * B);
    poly(c, [[an[0] - 6 * B, an[1] - 5 * B], [an[0] + 6 * B, an[1] - 5 * B],
             [an[0] + 4 * B, an[1] - 8 * B], [an[0] - 5 * B, an[1] - 8 * B]], '#565049');
  } else if (t === 'tavern'){
    drawTile(c, gx, gy, '#575044');
    drawHouse(c, gx, gy, .40, .32, .95 + z, .38, '#c49a68', '#3f6b8c');
    houseTrim(c, gx, gy, .40, .32, .95 + z, TRIM.tavern, z);
    const s0 = bp(gx + .5, gy + .1, z + .7);
    c.strokeStyle = '#6a5540'; c.lineWidth = 2 * B;
    c.beginPath(); c.moveTo(s0[0], s0[1]); c.lineTo(s0[0] + 10 * B, s0[1] - 3 * B); c.stroke();
    c.fillStyle = '#e2c88a'; c.fillRect(s0[0] + 6 * B, s0[1] - 2 * B, 11 * B, 8 * B);
    c.fillStyle = '#4b3a22'; c.fillRect(s0[0] + 9 * B, s0[1] + 1 * B, 5 * B, 2 * B);
  } else {
    drawTile(c, gx, gy, '#514b42');
    drawHouse(c, gx, gy, .38, .3, .48 + z, .26, '#9a8f7d', '#6f6455');
    houseTrim(c, gx, gy, .38, .3, .48 + z, TRIM[t] || TRIM.workshop, z);
    const g = bp(gx + .1, gy - .05, z + .82);
    c.strokeStyle = '#c8a24a'; c.lineWidth = 2.4 * B;
    c.beginPath(); c.arc(g[0], g[1], 7 * B, 0, 6.2832); c.stroke();
    for (let i = 0; i < 6; i++){
      const a = G.t * .8 + i * 1.047;
      c.beginPath(); c.moveTo(g[0] + Math.cos(a) * 7 * B, g[1] + Math.sin(a) * 7 * B);
      c.lineTo(g[0] + Math.cos(a) * 10 * B, g[1] + Math.sin(a) * 10 * B); c.stroke();
    }
  }
  c.globalAlpha = 1;
  // Labels are queued and laid out after every building is drawn, so a packed
  // plot does not turn into a pile of overlapping text.
  const s = G.sides[holdSide];
  let sub = 'Lv ' + b.lvl;
  if (t === 'farm') sub = '+' + (C.POP_PER_FARM * b.lvl) + ' pop';
  if (t === 'barracks') sub = 'Lv ' + b.lvl + (b.lvl >= 3 ? ' · cannons' : b.lvl >= 2 ? ' · casters' : '');
  if (t === 'tavern') sub = heroCap(s) + ' hero slot' + (heroCap(s) === 1 ? '' : 's');
  if (holdSide === MY && (cam.z > .72 || b.tile === sel.tile)){
    const lp0 = bp(gx, gy, 1.55 + z);
    // A packed hold is six labels in a hand's width, so only the one you have
    // selected spells itself out; the rest carry a name and a level digit.
    const hot = b.tile === sel.tile;
    const txt = BUILDINGS[t].n + (hot ? '  ' + sub : b.lvl > 1 ? '  ' + b.lvl : '');
    labelQ.push({ x:lp0[0], y:lp0[1], txt, col:'#d8dee9', hot });
  }
}

let labelQ = [];
function flushLabels(c){
  c.textAlign = 'center';
  const placed = [];
  labelQ.sort((a, b) => a.y - b.y);
  for (const L of labelQ){
    c.font = (L.small ? 8 : 9) + 'px system-ui';
    const w = c.measureText(L.txt).width + 8, h = L.small ? 11 : 13;
    let y = L.y - 11;
    // nudge upward until this label is clear of the ones already placed
    for (let guard = 0; guard < 12; guard++){
      const hit = placed.find(r => Math.abs(r.x - L.x) < (r.w + w) / 2 + 3 && Math.abs(r.y - y) < h + 4);
      if (!hit) break;
      y = hit.y - h - 4;
    }
    placed.push({ x:L.x, y, w, h });
    // A label pushed clear of its neighbours has to keep pointing at the thing
    // it names, or a packed plot reads as a pile of loose text.
    if (y < L.y - 12){
      c.strokeStyle = 'rgba(160,180,205,.30)'; c.lineWidth = 1;
      c.beginPath(); c.moveTo(L.x + .5, y + h); c.lineTo(L.x + .5, L.y - 3); c.stroke();
    }
    c.fillStyle = L.hot ? 'rgba(30,66,110,.88)' : (L.small ? 'rgba(9,13,20,.55)' : 'rgba(9,13,20,.72)');
    c.fillRect(L.x - w / 2, y, w, h);
    if (L.hot){ c.strokeStyle = '#4ea3ff'; c.lineWidth = 1; c.strokeRect(L.x - w / 2 + .5, y + .5, w - 1, h - 1); }
    c.fillStyle = L.col; c.fillText(L.txt, L.x, y + (L.small ? 8.5 : 10));
  }
  labelQ = [];
}

// There are more of these on screen than anything else in the game — every
// mine crew, every field hand, every idle body round the hall — and each one
// was a rectangle with a circle on top, next to soldiers on the bridge with
// legs, boots, an arm and a visor.
//
// The tunic was also a hardcoded blue. That is fine right up until you are the
// Ember Host: workers are only ever drawn on your OWN hold, MY can be 1, and
// player two's crews came out wearing the other side's colour.
const WORKER_STRIDE = 1.5;
const workerCoat = () => shade(sideCol(), .72);
function drawWorkerFig(c, x, y, col, carry, sc, ph){
  sc = (sc || 1) * bu();
  const coat = workerCoat();
  const st = Math.sin(ph || 0) * WORKER_STRIDE * sc;
  ell(c, x, y + 1, 3.2 * sc, 1.6 * sc, 'rgba(0,0,0,.25)');
  c.fillStyle = shade(coat, .54);
  for (const s of [-1, 1]) c.fillRect(x + s * 1.05 * sc - .85 * sc + s * st, y - 2.6 * sc, 1.7 * sc, 2.8 * sc);
  c.fillStyle = coat; c.fillRect(x - 2 * sc, y - 7.4 * sc, 4 * sc, 5.2 * sc);
  c.fillStyle = shade(coat, LIT.coatLit); c.fillRect(x - 2 * sc, y - 7.4 * sc, 1.4 * sc, 5.2 * sc);
  c.fillStyle = shade(coat, LIT.coatDark); c.fillRect(x - 2 * sc, y - 4.4 * sc, 4 * sc, 1 * sc);
  c.strokeStyle = shade(coat, .84); c.lineWidth = 1.5 * sc; c.lineCap = 'round';
  c.beginPath();
  c.moveTo(x + 1.5 * sc, y - 6.4 * sc);
  c.lineTo(x + (carry ? 2.4 : 2.3) * sc, y - (carry ? 8.4 : 4.6) * sc);
  c.stroke(); c.lineCap = 'butt';
  ell(c, x, y - 8.6 * sc, 2 * sc, 2.1 * sc, '#e8d6b8');
  c.fillStyle = shade(coat, .48); c.fillRect(x - 2.2 * sc, y - 10.3 * sc, 4.4 * sc, 1.5 * sc);
  if (carry){
    c.fillStyle = col; c.fillRect(x - 2.6 * sc, y - 12.6 * sc, 5.2 * sc, 3 * sc);
    c.fillStyle = shade(col, 1.16); c.fillRect(x - 2.6 * sc, y - 12.6 * sc, 5.2 * sc, .9 * sc);
  }
}

function drawNode(c, key){
  const N = NODES[key], s = G.sides[holdSide], B = bu();
  const p = bp(N.gx, N.gy);
  if (key === 'wood'){
    // Five flat triangles with no shadows read as worse than the scenery trees
    // scattered around them, which at least have a shadow and a lit side — and
    // nothing said anybody was felling anything here.
    ell(c, p[0], p[1] + 4 * B, 36 * B, 14 * B, 'rgba(0,0,0,.16)');
    // stumps, felled logs and the block, laid out before the standing timber so
