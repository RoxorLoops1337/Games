  try { d[1](); } catch (e){ return false; }
  return true;
}

/* =====================================================================
   EFFECTS
   ===================================================================== */
function burstFx(x, y, col, n){
  if (HEADLESS) return;
  if (G.fx.length > 260) return;
  for (let i = 0; i < n; i++){
    const a = rnd() * 6.283, sp = rr(1, 6);
    G.fx.push({ k:'p', x, y, z:rr(.2, 1.2), vx:Math.cos(a) * sp, vy:Math.sin(a) * sp * .5, vz:rr(1, 5),
      t:rr(.35, .8), dur:.8, col, r:rr(1.4, 3.2) });
  }
}
function ringFx(x, y, r, col){ if (!HEADLESS) G.fx.push({ k:'ring', x, y, r, t:.42, dur:.42, col }); }
function boltFx(x, y, x2, y2, col){ if (!HEADLESS) G.fx.push({ k:'bolt', x, y, x2, y2, t:.22, dur:.22, col }); }
function addFloat(x, y, txt, col, sc){
  if (HEADLESS) return;
  if (G.floats.length > 90) G.floats.shift();
  G.floats.push({ x, y:y + rr(-.2, .2), txt, col, t:.95, dur:.95, sc:sc || 1, vy:rr(-.5, -.9) });
}
const CAST_COL = { dmg:'#ffa96a', heal:'#7fdc8a', buff:'#ffcf4d', cc:'#9ad8ff', move:'#bfe0ff', summon:'#c9a6ff' };
function castCol(s){ return s.magic ? '#b98bff' : (CAST_COL[s.tag] || '#ffa96a'); }

// You choose these skills, so you should be able to see them happen: the name
// of the ability rises off the hero that cast it, in the colour of its type.
function castFx(h, s){
  const col = castCol(s);
  ringFx(h.x, h.y, s.aoe || 2, col);
  burstFx(h.x, h.y, col, 8);
  if (G.floats.length < 80)
    G.floats.push({ x:h.x + rr(-.8, .8), y:h.y + rr(-.3, .3), txt:s.n.toUpperCase(), col,
      t:1.4, dur:1.4, sc:1, vy:-.55, cast:true, ult:!!s.ult });
}
// A blur of where the hero came from, so a dash reads as movement.
function dashFx(h, x0, y0){
  if (HEADLESS || G.fx.length > 220) return;
  for (let i = 1; i <= 5; i++)
    G.fx.push({ k:'ghost', x:lerp(x0, h.x, i / 6), y:lerp(y0, h.y, i / 6),
      col:SIDE_COL[h.side], t:.16 + i * .03, dur:.34, r:1 });
}
function healFx(x, y, col){
  if (HEADLESS || G.fx.length > 240) return;
  for (let i = 0; i < 6; i++)
    G.fx.push({ k:'p', x:x + rr(-.6, .6), y:y + rr(-.4, .4), z:rr(.3, 1),
      vx:0, vy:0, vz:rr(3, 5.5), t:rr(.4, .7), dur:.7, col:col || '#7fdc8a', r:rr(1, 2) });
}
function fxStep(dt){
  for (let i = G.fx.length - 1; i >= 0; i--){
    const p = G.fx[i]; p.t -= dt;
    if (p.k === 'p'){ p.x += p.vx * dt; p.y += p.vy * dt; p.z += p.vz * dt; p.vz -= 12 * dt; if (p.z < 0){ p.z = 0; p.vz *= -.35; } }
    if (p.t <= 0) G.fx.splice(i, 1);
  }
  for (let i = G.floats.length - 1; i >= 0; i--){
    const f = G.floats[i]; f.t -= dt; f.y += f.vy * dt;
    if (f.t <= 0) G.floats.splice(i, 1);
  }
  for (const z of G.zones) if (z.follow){ z.x = z.follow.x; z.y = z.follow.y; }
}
function fxToast(msg, kind){
  G.log.push({ t:G.t, msg });
  if (G.log.length > 40) G.log.shift();
  if (HEADLESS) return;
  const el = document.createElement('div');
  el.className = 'tst' + (kind ? ' ' + kind : '');
  el.textContent = msg;
  const box = document.getElementById('toast');
  box.appendChild(el);
  setTimeout(() => el.remove(), 2200);
  while (box.children.length > 3) box.firstChild.remove();
}

/* =====================================================================
   RENDERING — shared
   ===================================================================== */
const cam = { x:26, z:1, follow:true, tz:1, shake:0, sx:0, sy:0 };
let lcv, lctx, LW = 900, LH = 560;

function resize(){
  if (HEADLESS) return;
  const dpr = Math.min(window.innerWidth < 760 ? 1.6 : 2, window.devicePixelRatio || 1);
  const r = lcv.getBoundingClientRect();
  LW = Math.max(80, r.width); LH = Math.max(80, r.height);
  lcv.width = Math.round(LW * dpr); lcv.height = Math.round(LH * dpr);
  lctx = lcv.getContext('2d');
  lctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  const wasNarrow = document.body.classList.contains('narrow');
  const narrow = window.innerWidth < 760;
  document.body.classList.toggle('narrow', narrow);
  for (const el of document.querySelectorAll('#viewbtns [data-long]'))
    el.textContent = narrow ? el.dataset.short : el.dataset.long;
  if (wasNarrow !== narrow) syncUI();
}

const shade = (hex, f) => {
  const n = parseInt(hex.slice(1), 16);
  const r = clamp(Math.round(((n >> 16) & 255) * f), 0, 255);
  const g = clamp(Math.round(((n >> 8) & 255) * f), 0, 255);
  const b = clamp(Math.round((n & 255) * f), 0, 255);
  return '#' + ((1 << 24) | (r << 16) | (g << 8) | b).toString(16).slice(1);
};
function poly(c, pts, fill, stroke, lw){
  c.beginPath();
  c.moveTo(pts[0][0], pts[0][1]);
  for (let i = 1; i < pts.length; i++) c.lineTo(pts[i][0], pts[i][1]);
  c.closePath();
  if (fill){ c.fillStyle = fill; c.fill(); }
  if (stroke){ c.strokeStyle = stroke; c.lineWidth = lw || 1; c.stroke(); }
}
function ell(c, x, y, rx, ry, fill){
  c.beginPath(); c.ellipse(x, y, rx, ry, 0, 0, 6.2832); c.fillStyle = fill; c.fill();
}

/* =====================================================================
   RENDERING — the bridge
   ===================================================================== */
const LS = () => 9.4 * cam.z;
function lp(x, y, z){
  const S = LS();
  return [
    (x - cam.x) * S * .96 - y * S * .52 + LW * .5 + cam.sx,
    (x - cam.x) * S * .07 + y * S * .60 + LH * .60 - (z || 0) * S * .95 + cam.sy,
  ];
}
// A knock felt through the camera. Capped, and only when the hit is on screen,
// so a brawl at the far end of the world never rattles the hold you are in.
function shake(amount, worldX){
  if (HEADLESS) return;
  const p = (worldX - cam.x) * LS() * .96 + LW * .5;
  if (p < -120 || p > LW + 120) return;
  cam.shake = Math.min(14, cam.shake + amount);
}
const DECK = { top:'#938b79', top2:'#a09884', side:'#544c42', edge:'#3f3931', rail:'#7a7060' };

function drawSky(c){
  const g = c.createLinearGradient(0, 0, 0, LH);
  g.addColorStop(0, '#6f97ab'); g.addColorStop(.34, '#87a9ac'); g.addColorStop(.55, '#5e7f72'); g.addColorStop(1, '#1b2a26');
  c.fillStyle = g; c.fillRect(0, 0, LW, LH);
  // three parallax ridges receding into haze
  const bands = [
    { d:.10, y:.30, h:.26, col:'rgba(96,124,132,.55)' },
    { d:.20, y:.38, h:.24, col:'rgba(72,101,96,.68)' },
    { d:.34, y:.47, h:.22, col:'rgba(48,74,64,.85)' },
  ];
  for (const b of bands){
    c.fillStyle = b.col;
    c.beginPath();
    c.moveTo(-40, LH);
    for (let i = -1; i < 9; i++){
      const bx = ((i * 230 - cam.x * LS() * b.d) % (LW + 690) + LW + 690) % (LW + 690) - 230;
      c.lineTo(bx, LH * (b.y + b.h));
      c.lineTo(bx + 70, LH * b.y - (i % 3) * 16);
      c.lineTo(bx + 140, LH * (b.y + b.h * .55));
      c.lineTo(bx + 215, LH * (b.y + .04));
    }
    c.lineTo(LW + 60, LH); c.closePath(); c.fill();
  }
  // valley floor + the mist that hides how far down it goes
  const vg = c.createLinearGradient(0, LH * .55, 0, LH);
  vg.addColorStop(0, 'rgba(38,60,52,.85)'); vg.addColorStop(.5, 'rgba(20,34,32,.92)'); vg.addColorStop(1, '#0c1414');
  c.fillStyle = vg; c.fillRect(0, LH * .55, LW, LH * .45);
  for (let i = 0; i < 5; i++){
    const y = LH * (.60 + i * .07), a = .05 + .03 * Math.sin(G.t * .3 + i);
    c.fillStyle = 'rgba(200,225,230,' + a.toFixed(3) + ')';
    c.fillRect(0, y, LW, LH * .05);
  }
}

function drawDeck(c){
  const W = C.LANE_W / 2 + .6;
  const seg = 4;
  for (let x = 0; x < C.LANE_LEN; x += seg){
    const x2 = Math.min(C.LANE_LEN, x + seg);
    const a = lp(x, -W), b = lp(x2, -W), d = lp(x2, W), e = lp(x, W);
    if (Math.max(a[0], b[0]) < -80 || Math.min(a[0], b[0]) > LW + 80) continue;
    const k = (Math.floor(x / seg) % 2) === 0;
    poly(c, [a, b, d, e], k ? DECK.top : DECK.top2);
    // underside so the bridge reads as stone with weight
    const a2 = lp(x, W, -1.6), b2 = lp(x2, W, -1.6);
    poly(c, [e, d, b2, a2], DECK.side);
    poly(c, [a, b, lp(x2, -W, -1.1), lp(x, -W, -1.1)], DECK.edge);
    // planks / joint lines
    c.strokeStyle = 'rgba(40,36,30,.35)'; c.lineWidth = 1;
    c.beginPath(); c.moveTo(b[0], b[1]); c.lineTo(d[0], d[1]); c.stroke();
  }
  // railings
  for (const side of [-1, 1]){
    const y = side * W;
    for (let x = 0; x <= C.LANE_LEN; x += 4){
      const p0 = lp(x, y), p1 = lp(x, y, 1.1);
      if (p0[0] < -40 || p0[0] > LW + 40) continue;
      c.strokeStyle = DECK.rail; c.lineWidth = Math.max(1, 2.4 * cam.z);
      c.beginPath(); c.moveTo(p0[0], p0[1]); c.lineTo(p1[0], p1[1]); c.stroke();
      const q = lp(Math.min(C.LANE_LEN, x + 4), y, 1.1);
      c.strokeStyle = shade(DECK.rail, 1.15);
      c.beginPath(); c.moveTo(p1[0], p1[1]); c.lineTo(q[0], q[1]); c.stroke();
    }
  }
  // Abutments: the span has to visibly land ON the rock at both ends, or the
  // deck just disappears into the cliff face.
  for (const i of [0, 1]){
    const bxx = i === 0 ? 0 : C.LANE_LEN;
    const d = i === 0 ? 1 : -1;
    const a0 = lp(bxx - d * 5, -W), a1 = lp(bxx + d * 5, -W), a2 = lp(bxx + d * 5, W), a3 = lp(bxx - d * 5, W);
    if (a0[0] < -200 || a0[0] > LW + 200) continue;
    const dz = -9;
    poly(c, [a3, a2, lp(bxx + d * 5, W, dz), lp(bxx - d * 5, W, dz)], '#5b5348');
    poly(c, [a1, a2, lp(bxx + d * 5, W, dz), lp(bxx + d * 5, -W, dz)], '#4a4339');
    poly(c, [a0, a1, a2, a3], '#6f6759');
    c.globalAlpha = .4;
    for (let k = -2; k <= 2; k++)
      poly(c, [lp(bxx - d * 5, k * 2), lp(bxx + d * 5, k * 2), lp(bxx + d * 5, k * 2 + .5), lp(bxx - d * 5, k * 2 + .5)], '#3f392f');
    c.globalAlpha = 1;
  }
  // arches under the span
  c.fillStyle = 'rgba(46,42,36,.75)';
  for (let x = 8; x < C.LANE_LEN; x += 16){
    const p = lp(x, W, -1.6);
    if (p[0] < -60 || p[0] > LW + 60) continue;
    c.beginPath(); c.ellipse(p[0], p[1] + 6 * cam.z, 22 * cam.z, 30 * cam.z, 0, 0, Math.PI); c.fill();
  }
}

function drawEnds(c){
  for (const s of G.sides){
    const dir = dirOf(s.i);
    const bx = s.i === 0 ? -5 : C.LANE_LEN + 5;
    const p = lp(bx, 0);
    if (p[0] < -420 || p[0] > LW + 420) continue;
    const z = cam.z;
    // the keep behind the gates, in the same masonry as everything else
    const col = SIDE_COL[s.i];
    const kp = lp(bx - dir * 11, 0);
    const wallY = kp[1] - 34 * z;
    block(c, kp[0] - 48 * z, wallY - 44 * z, 96 * z, 56 * z, STONE.mid, STONE.lit);
    masonry(c, kp[0] - 46 * z, wallY - 42 * z, 92 * z, 50 * z, z, 41 + s.i);
    crown(c, kp[0], wallY - 52 * z, 100 * z, z, 9);
    c.fillStyle = '#3a332b';
    c.beginPath(); c.arc(kp[0], wallY - 4 * z, 14 * z, Math.PI, 0); c.fill();
    c.fillRect(kp[0] - 14 * z, wallY - 4 * z, 28 * z, 16 * z);
    for (const sx of [-1, 1]){
      const tx = kp[0] + sx * 58 * z;
      block(c, tx - 16 * z, wallY - 74 * z, 32 * z, 86 * z, STONE.mid, STONE.lit);
      masonry(c, tx - 15 * z, wallY - 72 * z, 30 * z, 80 * z, z, 51 + sx * 3 + s.i);
      poly(c, [[tx - 23 * z, wallY - 72 * z], [tx, wallY - 108 * z], [tx + 23 * z, wallY - 72 * z]], shade(col, .98));
      poly(c, [[tx, wallY - 108 * z], [tx + 23 * z, wallY - 72 * z], [tx + 8 * z, wallY - 72 * z]], shade(col, .72));
      c.fillStyle = STONE.line; c.fillRect(tx - 3 * z, wallY - 56 * z, 6 * z, 14 * z);
    }
    pennant(c, kp[0] + dir * 20 * z, wallY - 76 * z, z, col, dir);
    c.fillStyle = '#e7ecf6'; c.font = 'bold ' + Math.max(9, Math.round(11 * z)) + 'px system-ui'; c.textAlign = 'center';
    c.fillText(SIDE_NAME[s.i], kp[0], wallY - 118 * z);
  }
}

/* Storybook masonry: pale blocks with a lit top edge, warm timber, a team
   roof and a lit eye. Everything is laid out in units around the ground
   anchor and multiplied by the zoom, so one set of numbers serves all sizes. */
const STONE = { lit:'#dde2da', mid:'#c8cec6', mid2:'#b4bbb3', dark:'#9aa29a', deep:'#7f877f', line:'#69716a' };
const WOOD = { lit:'#cda063', mid:'#ad8146', dark:'#8a6533' };

function block(c, x, y, w, h, face, top){
  c.fillStyle = face; c.fillRect(x, y, w, h);
  if (top){ c.fillStyle = top; c.fillRect(x, y, w, Math.max(1, h * .16)); }
}
// A crenellated crown: the solid band plus its merlons.
function crown(c, cx, y, w, u, n){
  block(c, cx - w / 2, y, w, 7 * u, STONE.mid, STONE.lit);
  const step = w / n;
  for (let i = 0; i < n; i++){
    if (i % 2) continue;
    block(c, cx - w / 2 + i * step, y - 8 * u, step * 1.02, 9 * u, STONE.mid, STONE.lit);
  }
}
// Scattered raised blocks so a flat wall reads as masonry.
function masonry(c, x, y, w, h, u, seed){
  for (let i = 0; i < 7; i++){
    const r = hash2(seed + i * 13, seed * 3 + i * 7);
    const bw = (4 + r * 5) * u, bh = 3.2 * u;
    const bx = x + r * (w - bw), by = y + hash2(seed + i, seed - i) * (h - bh);
    c.fillStyle = i % 2 ? STONE.lit : STONE.mid2;
    c.fillRect(bx, by, bw, bh);
  }
}
function pennant(c, x, y, u, col, dir){
  c.fillStyle = STONE.deep; c.fillRect(x - 1 * u, y - 4 * u, 2 * u, 16 * u);
  const w = 20 * u * dir, h = 13 * u;
  poly(c, [[x, y - 2 * u], [x + w, y - 4 * u], [x + w, y + h - 4 * u], [x, y + h - 2 * u]], col);
  poly(c, [[x, y - 2 * u], [x + w * .55, y - 3 * u], [x + w * .55, y + h - 3 * u], [x, y + h - 2 * u]], shade(col, 1.12));
}

function drawStructure(c, st){
  const p = lp(st.x, st.y);
  const u = cam.z, col = SIDE_COL[st.side], dead = st.dead;
  const dir = dirOf(st.side);          // which way this side faces the bridge
  const X = p[0], Y = p[1];
  ell(c, X, Y + 2 * u, (st.key === 'gate' ? 74 : 26) * u, (st.key === 'gate' ? 16 : 8) * u, 'rgba(0,0,0,.28)');

  if (st.key === 'gate'){
    if (dead){
      // knocked in: stumps of the two towers and a heap of blocks
      for (const sx of [-1, 1]){
        block(c, X + sx * 46 * u - 15 * u, Y - 26 * u, 30 * u, 26 * u, STONE.deep, STONE.dark);
        poly(c, [[X + sx * 46 * u - 15 * u, Y - 26 * u], [X + sx * 46 * u + 15 * u, Y - 20 * u], [X + sx * 46 * u + 15 * u, Y - 26 * u]], STONE.dark);
      }
      for (let i = 0; i < 9; i++){
        const r = hash2(i, st.side * 7);
        block(c, X - 40 * u + r * 80 * u, Y - (4 + r * 7) * u, (7 + r * 6) * u, (5 + r * 4) * u, STONE.dark, STONE.mid2);
      }
      c.globalAlpha = .5; ell(c, X, Y - 10 * u, 60 * u, 16 * u, 'rgba(60,55,50,.7)'); c.globalAlpha = 1;
    } else {
      // outbuilding with a tall team-coloured pyramid roof, set behind
      const ox = X - dir * 78 * u;
      block(c, ox - 20 * u, Y - 50 * u, 40 * u, 50 * u, STONE.mid, STONE.lit);
      masonry(c, ox - 20 * u, Y - 50 * u, 40 * u, 50 * u, u, 11 + st.side);
      poly(c, [[ox - 26 * u, Y - 48 * u], [ox, Y - 88 * u], [ox + 26 * u, Y - 48 * u]], shade(col, .95));
      poly(c, [[ox, Y - 88 * u], [ox + 26 * u, Y - 48 * u], [ox + 10 * u, Y - 48 * u]], shade(col, .74));
      c.fillStyle = STONE.line; c.fillRect(ox - 3 * u, Y - 40 * u, 6 * u, 14 * u);
      // curtain wall between the towers
      block(c, X - 30 * u, Y - 62 * u, 60 * u, 62 * u, STONE.mid, STONE.lit);
      masonry(c, X - 30 * u, Y - 60 * u, 60 * u, 56 * u, u, 3 + st.side);
      // timber lintel spanning both towers
      block(c, X - 62 * u, Y - 70 * u, 124 * u, 8 * u, WOOD.mid, WOOD.lit);
      block(c, X - 62 * u, Y - 62 * u, 124 * u, 3 * u, WOOD.dark);
      // ribbed roof over the gateway
      const ry = Y - 66 * u;
      poly(c, [[X - 34 * u, ry + 14 * u], [X - 26 * u, ry], [X + 26 * u, ry], [X + 34 * u, ry + 14 * u]], shade(col, 1.02));
      c.strokeStyle = shade(col, .72); c.lineWidth = Math.max(1, 1.4 * u);
      for (let i = -4; i <= 4; i++){
        const t = i / 4;
        c.beginPath(); c.moveTo(X + t * 26 * u, ry); c.lineTo(X + t * 34 * u, ry + 14 * u); c.stroke();
      }
      block(c, X - 35 * u, ry + 13 * u, 70 * u, 4 * u, shade(col, .66));
      // arched doorway: voussoir ring, then the doors
      c.fillStyle = STONE.lit;
      c.beginPath(); c.arc(X, Y - 30 * u, 24 * u, Math.PI, 0); c.fill();
      c.fillRect(X - 24 * u, Y - 30 * u, 48 * u, 30 * u);
      c.fillStyle = WOOD.mid;
      c.beginPath(); c.arc(X, Y - 30 * u, 18 * u, Math.PI, 0); c.fill();
      c.fillRect(X - 18 * u, Y - 30 * u, 36 * u, 30 * u);
      c.strokeStyle = WOOD.dark; c.lineWidth = Math.max(1, 1.2 * u);
      for (let i = -2; i <= 2; i++){
        c.beginPath(); c.moveTo(X + i * 7 * u, Y - 44 * u); c.lineTo(X + i * 7 * u, Y); c.stroke();
      }
      block(c, X - 18 * u, Y - 26 * u, 36 * u, 3.5 * u, '#6b7078');
      block(c, X - 18 * u, Y - 11 * u, 36 * u, 3.5 * u, '#6b7078');
      // the two gate towers
      for (const sx of [-1, 1]){
        const tx = X + sx * 46 * u;
        block(c, tx - 16 * u, Y - 86 * u, 32 * u, 86 * u, STONE.mid, STONE.lit);
        masonry(c, tx - 16 * u, Y - 84 * u, 32 * u, 80 * u, u, 21 + sx + st.side * 5);
        crown(c, tx, Y - 96 * u, 36 * u, u, 5);
        c.fillStyle = STONE.line; c.fillRect(tx - 3 * u, Y - 66 * u, 6 * u, 15 * u);
        // timber palisade skirting the base
        for (let i = 0; i < 4; i++)
          block(c, tx + (sx > 0 ? 14 : -30) * u + i * 4 * u, Y - 20 * u, 3.4 * u, 20 * u, i % 2 ? WOOD.mid : WOOD.lit);
        block(c, tx - 18 * u, Y - 8 * u, 36 * u, 8 * u, STONE.deep, STONE.dark);
      }
      pennant(c, X + dir * 62 * u, Y - 92 * u, u, col, dir);
    }
  } else if (st.key === 'inhib'){
    block(c, X - 22 * u, Y - 12 * u, 44 * u, 12 * u, STONE.deep, STONE.dark);
    block(c, X - 17 * u, Y - 20 * u, 34 * u, 9 * u, STONE.mid, STONE.lit);
    if (!dead){
      const t = Math.sin(G.t * 2 + st.side) * .5 + .5;
      c.globalAlpha = .22 + t * .18;
      ell(c, X, Y - 38 * u, 30 * u, 30 * u, col);
      c.globalAlpha = 1;
      poly(c, [[X, Y - 62 * u], [X + 14 * u, Y - 36 * u], [X, Y - 16 * u], [X - 14 * u, Y - 36 * u]], shade(col, .9 + t * .25));
      poly(c, [[X, Y - 62 * u], [X, Y - 16 * u], [X - 14 * u, Y - 36 * u]], shade(col, 1.25));
      c.strokeStyle = '#ffffff'; c.lineWidth = 1;
      poly(c, [[X, Y - 62 * u], [X + 14 * u, Y - 36 * u], [X, Y - 16 * u], [X - 14 * u, Y - 36 * u]], null, '#eef6ff', 1);
    } else {
      for (let i = 0; i < 5; i++){
        const r = hash2(i, 3 + st.side);
        block(c, X - 16 * u + r * 30 * u, Y - (5 + r * 6) * u, (6 + r * 5) * u, (5 + r * 3) * u, STONE.dark, STONE.mid2);
      }
    }
  } else {
    if (dead){
      block(c, X - 16 * u, Y - 14 * u, 32 * u, 14 * u, STONE.deep, STONE.dark);
      for (let i = 0; i < 6; i++){
        const r = hash2(i, st.ord + st.side * 9);
        block(c, X - 22 * u + r * 40 * u, Y - (4 + r * 6) * u, (6 + r * 5) * u, (4 + r * 4) * u, STONE.dark, STONE.mid2);
      }
      c.globalAlpha = .35; ell(c, X, Y - 6 * u, 26 * u, 8 * u, 'rgba(50,46,42,.8)'); c.globalAlpha = 1;
    } else {
      // flared footing → tapered shaft → crenellated crown → the eye
      poly(c, [[X - 21 * u, Y], [X + 21 * u, Y], [X + 16 * u, Y - 13 * u], [X - 16 * u, Y - 13 * u]], STONE.deep);
      block(c, X - 21 * u, Y - 5 * u, 42 * u, 5 * u, STONE.dark, STONE.mid2);
      for (const sx of [-1, 1]) block(c, X + sx * 15 * u - 5 * u, Y - 11 * u, 10 * u, 11 * u, STONE.dark, STONE.mid2);
      poly(c, [[X - 16 * u, Y - 12 * u], [X + 16 * u, Y - 12 * u], [X + 13 * u, Y - 58 * u], [X - 13 * u, Y - 58 * u]], STONE.mid);
      poly(c, [[X - 16 * u, Y - 12 * u], [X - 13 * u, Y - 58 * u], [X - 7 * u, Y - 58 * u], [X - 9 * u, Y - 12 * u]], STONE.lit);
      poly(c, [[X + 16 * u, Y - 12 * u], [X + 13 * u, Y - 58 * u], [X + 8 * u, Y - 58 * u], [X + 10 * u, Y - 12 * u]], STONE.mid2);
      masonry(c, X - 12 * u, Y - 54 * u, 24 * u, 40 * u, u, st.ord * 7 + st.side * 3);
      crown(c, X, Y - 68 * u, 32 * u, u, 5);
      // the eye — bright the instant it fires, dimming as it reloads
      const glow = clamp(st.cd * attackSpeedOf(st), 0, 1);
      c.globalAlpha = .18 + glow * .45;
      ell(c, X, Y - 38 * u, 16 * u, 16 * u, col);
      c.globalAlpha = 1;
      ell(c, X, Y - 38 * u, 9 * u, 9 * u, STONE.lit);
      ell(c, X, Y - 38 * u, 7 * u, 7 * u, shade(col, .8 + glow * .5));
      ell(c, X - 2 * u, Y - 40 * u, 2.6 * u, 2.6 * u, '#ffffff');
      pennant(c, X + dir * 14 * u, Y - 50 * u, u, col, dir);
    }
  }
  if (!dead) hpBar(c, X, Y - (st.key === 'gate' ? 116 : st.key === 'inhib' ? 72 : 84) * cam.z, st, 44 * cam.z, true);
  else if (st.downT > 0){
    c.fillStyle = '#d8c49a'; c.font = Math.max(9, Math.round(11 * cam.z)) + 'px system-ui'; c.textAlign = 'center';
    c.fillText(Math.ceil(st.downT) + 's', p[0], p[1] - 18 * cam.z);
  }
  if (st.hitT > 0 && !dead){
    c.globalAlpha = st.hitT * 2.2; ell(c, p[0], p[1] - 20 * cam.z, 26 * cam.z, 20 * cam.z, '#ffffff'); c.globalAlpha = 1;
  }
}

function hpBar(c, x, y, u, w, big){
  const f = clamp(u.hp / u.mhp, 0, 1);
  const h = big ? 5 * cam.z : 3.2 * cam.z;
  c.fillStyle = 'rgba(8,10,14,.8)'; c.fillRect(x - w / 2 - 1, y - 1, w + 2, h + 2);
  c.fillStyle = u.side === 0 ? '#54d06a' : '#e0544a';
  c.fillRect(x - w / 2, y, w * f, h);
  if (u.shield > 0){
    const sf = clamp(u.shield / u.mhp, 0, 1);
    c.fillStyle = 'rgba(220,235,255,.85)';
    c.fillRect(x - w / 2, y, w * Math.min(1, sf), h * .45);
  }
}

function drawUnit(c, u){
  const p = lp(u.x, u.y), S = LS();
  const col = SIDE_COL[u.side], sc = (u.isHero ? 1.75 : u.kind === 'cannon' || u.kind === 'super' ? 1.45 : 1.18) * cam.z;
  ell(c, p[0], p[1] + 1, 7 * sc, 3.4 * sc, 'rgba(0,0,0,.32)');
  const bob = Math.sin(G.t * 7 + u.ph) * (u.target && Math.hypot(u.target.x - u.x, u.target.y - u.y) < u.rng + 1 ? .6 : 1.4) * sc * .4;
  const bx = p[0], by = p[1] - 2 * sc + bob;
  // legs + body
  c.strokeStyle = shade(col, .45); c.lineWidth = 2 * sc;
  c.beginPath(); c.moveTo(bx - 2 * sc, by); c.lineTo(bx - 2.6 * sc, p[1]); c.moveTo(bx + 2 * sc, by); c.lineTo(bx + 2.6 * sc, p[1]); c.stroke();
  const body = u.hitT > 0 ? '#ffffff' : col;
  c.fillStyle = body;
  c.beginPath();
  c.moveTo(bx - 4.2 * sc, by); c.lineTo(bx + 4.2 * sc, by);
  c.lineTo(bx + 3.2 * sc, by - 9 * sc); c.lineTo(bx - 3.2 * sc, by - 9 * sc);
  c.closePath(); c.fill();
  c.fillStyle = shade(body, .72);
  c.fillRect(bx - 4.2 * sc, by - 4 * sc, 8.4 * sc, 1.6 * sc);
  // head
  ell(c, bx, by - 11.6 * sc, 3 * sc, 3.2 * sc, u.hitT > 0 ? '#ffffff' : '#e8d6b8');
  c.fillStyle = shade(col, .55);
  c.fillRect(bx - 3.1 * sc, by - 14.4 * sc, 6.2 * sc, 2.6 * sc);
  // weapon by role
  const sw = u.swing > 0 ? 1 : 0;
  c.strokeStyle = '#d8dbe2'; c.lineWidth = 1.7 * sc; c.lineCap = 'round';
  const dir = dirOf(u.side);
  c.beginPath();
  if (u.kind === 'caster' || u.cls === 'mage' || u.cls === 'support'){
    c.moveTo(bx + dir * 4 * sc, by - 2 * sc); c.lineTo(bx + dir * 5 * sc, by - 15 * sc);
    c.stroke();
    ell(c, bx + dir * 5 * sc, by - 16 * sc, 2.2 * sc, 2.2 * sc, u.side === 0 ? '#9ad8ff' : '#ffb08a');
    c.beginPath();
  } else if (u.rng > 3){
    c.moveTo(bx + dir * 3 * sc, by - 9 * sc); c.lineTo(bx + dir * 6 * sc, by - 3 * sc);
  } else {
    c.moveTo(bx + dir * 3.5 * sc, by - 6 * sc);
    c.lineTo(bx + dir * (7 + sw * 3) * sc, by - (10 - sw * 7) * sc);
  }
  c.stroke(); c.lineCap = 'butt';
  if (u.kind === 'cannon'){
    c.fillStyle = '#4a4640';
    c.fillRect(bx - 6 * sc, by - 5 * sc, 12 * sc, 5 * sc);
    ell(c, bx + dir * 7 * sc, by - 3 * sc, 3 * sc, 3 * sc, '#33302b');
  }
  if (u.shield > 0){
    c.globalAlpha = .3; ell(c, bx, by - 6 * sc, 9 * sc, 11 * sc, '#cfe6ff'); c.globalAlpha = 1;
  }
  if (u.burn){ c.globalAlpha = .5; ell(c, bx, by - 6 * sc, 5 * sc, 8 * sc, '#ff8a3d'); c.globalAlpha = 1; }
  if (u.stunT > 0){
    c.fillStyle = '#ffcf4d';
    for (let i = 0; i < 3; i++){
      const a = G.t * 6 + i * 2.1;
      ell(c, bx + Math.cos(a) * 6 * sc, by - 17 * sc + Math.sin(a) * 2 * sc, 1.5 * sc, 1.5 * sc, '#ffcf4d');
    }
  }
  hpBar(c, bx, by - (u.isHero ? 22 : 18) * sc, u, (u.isHero ? 30 : 17) * sc, u.isHero);
  if (u.isHero && u.buffs && u.buffs.some(b => b.t > 0)){
    c.globalAlpha = .5 + .2 * Math.sin(G.t * 5);
    c.strokeStyle = '#ffcf4d'; c.lineWidth = Math.max(1.2, 2 * cam.z);
    c.beginPath(); c.ellipse(bx, p[1], 13 * sc, 6 * sc, 0, 0, 6.2832); c.stroke();
    c.globalAlpha = 1;
  }
  if (u.isHero){
    c.fillStyle = '#0b0f18'; c.strokeStyle = col; c.lineWidth = 1.4;
    c.beginPath(); c.arc(bx - 20 * sc, by - 20 * sc, 6.5 * sc, 0, 6.2832); c.fill(); c.stroke();
    c.fillStyle = '#ffcf4d'; c.font = 'bold ' + Math.max(7, Math.round(7.5 * sc)) + 'px system-ui'; c.textAlign = 'center'; c.textBaseline = 'middle';
    c.fillText(String(u.lvl), bx - 20 * sc, by - 19.6 * sc);
    labelQ.push({ x:bx, y:by - 26 * sc, txt:u.name, col:u.side === 0 ? '#bfe0ff' : '#ffc4bd', small:true });
    c.strokeStyle = 'rgba(255,255,255,.25)'; c.lineWidth = 1;
    c.beginPath(); c.ellipse(bx, p[1], 11 * sc, 5 * sc, 0, 0, 6.2832); c.stroke();
  }
}

function drawLane(c){
  // zones under everyone
  for (const z of G.zones){
    const p = lp(z.x, z.y);
    c.globalAlpha = .22 + .1 * Math.sin(G.t * 6);
    ell(c, p[0], p[1], z.r * LS() * .96, z.r * LS() * .55, z.magic ? '#a06bff' : '#ff8a3d');
    c.globalAlpha = 1;
  }
  const draws = [];
  for (const s of G.sides) for (const st of s.structs) draws.push({ y:lp(st.x, st.y)[1], f:() => drawStructure(c, st) });
  for (const u of G.units){ if (!u.dead) draws.push({ y:lp(u.x, u.y)[1], f:() => drawUnit(c, u) }); }
  draws.sort((a, b) => a.y - b.y);
  for (const d of draws) d.f();
  // projectiles
  for (const p of G.projs){
    const q = lp(p.x, p.y, p.z);
    c.globalAlpha = .55; ell(c, q[0], q[1], 4.5 * cam.z, 4.5 * cam.z, p.col); c.globalAlpha = 1;
    ell(c, q[0], q[1], 2.2 * cam.z, 2.2 * cam.z, '#ffffff');
  }
  // particles
  for (const p of G.fx){
    const a = clamp(p.t / p.dur, 0, 1);
    if (p.k === 'p'){
      const q = lp(p.x, p.y, p.z);
      c.globalAlpha = a; ell(c, q[0], q[1], p.r * cam.z, p.r * cam.z, p.col);
    } else if (p.k === 'ring'){
      const q = lp(p.x, p.y);
      c.globalAlpha = a * .8; c.strokeStyle = p.col; c.lineWidth = 2.5 * cam.z;
      c.beginPath(); c.ellipse(q[0], q[1], p.r * LS() * (1.35 - a * .35), p.r * LS() * .55 * (1.35 - a * .35), 0, 0, 6.2832); c.stroke();
    } else if (p.k === 'ghost'){
      const q = lp(p.x, p.y);
      c.globalAlpha = a * .45;
      ell(c, q[0], q[1] - 7 * cam.z, 4.5 * cam.z, 9 * cam.z, p.col);
    } else if (p.k === 'bolt'){
      const q = lp(p.x, p.y, .8), q2 = lp(p.x2, p.y2, .8);
      c.globalAlpha = a; c.strokeStyle = p.col; c.lineWidth = 2.4 * cam.z;
      c.beginPath(); c.moveTo(q[0], q[1]); c.lineTo(q2[0], q2[1]); c.stroke();
    }
    c.globalAlpha = 1;
  }
  // damage numbers
  c.textAlign = 'center';
  for (const f of G.floats){
    const q = lp(f.x, f.y, f.cast ? 2.4 : 1.4);
    c.globalAlpha = clamp(f.t / f.dur, 0, 1);
    const y = q[1] - (1 - f.t / f.dur) * (f.cast ? 30 : 22);
    if (f.cast){
      c.font = 'bold ' + Math.max(9, Math.round((f.ult ? 13 : 11) * cam.z)) + 'px system-ui';
      c.lineWidth = Math.max(2, 3 * cam.z); c.strokeStyle = 'rgba(6,9,14,.85)';
      c.strokeText(String(f.txt), q[0], y);
      c.fillStyle = f.ult ? '#ffe08a' : f.col;
      c.fillText(String(f.txt), q[0], y);
    } else {
      c.fillStyle = f.col; c.font = 'bold ' + Math.max(9, Math.round(11 * f.sc * cam.z)) + 'px system-ui';
      c.fillText(String(f.txt), q[0], y);
    }
    c.globalAlpha = 1;
  }
}

// One strip covering the whole world: your hold, the span, their hold.
// One rect, used by both the drawing and the hit test, so a tap always lands
// where the strip actually is.
function minimapRect(){
  const narrow = LW < 760;
  // On a phone the strip is nearly as wide as the screen, so it goes up into
  // the empty sky under the camera buttons rather than across the battlefield.
  const w = Math.min(340, LW - 24), h = narrow ? 24 : 34;
  return { x0:LW - w - 12, y0:narrow ? 46 : LH - h - 10, w, h,
    W0:CAM_MIN - 10, W1:CAM_MAX + 10 };
}
function minimapWorldX(sx){
  const m = minimapRect();
  return m.W0 + clamp((sx - m.x0 - 6) / (m.w - 12), 0, 1) * (m.W1 - m.W0);
}
function drawMinimap(c){
  const m = minimapRect();
  const w = m.w, h = m.h, x0 = m.x0, y0 = m.y0;
  const W0 = m.W0, W1 = m.W1;
  c.fillStyle = 'rgba(8,12,18,.76)'; c.fillRect(x0, y0, w, h);
  c.strokeStyle = '#2a3446'; c.lineWidth = 1; c.strokeRect(x0 + .5, y0 + .5, w - 1, h - 1);
  const mx = (x) => x0 + 6 + ((x - W0) / (W1 - W0)) * (w - 12);
  // the two holds, then the span between them
  for (const i of [0, 1]){
    const hx = i === 0 ? HOLD_X : C.LANE_LEN - HOLD_X;
    c.fillStyle = i === 0 ? 'rgba(76,112,64,.85)' : 'rgba(112,76,64,.85)';
    c.fillRect(mx(hx - 22), y0 + 5, Math.max(6, mx(hx + 22) - mx(hx - 22)), h - 10);
  }
  c.fillStyle = '#3d4658'; c.fillRect(mx(0), y0 + h / 2 - 2, mx(C.LANE_LEN) - mx(0), 4);
  for (const s of G.sides) for (const st of s.structs){
    if (st.dead) continue;
    c.fillStyle = SIDE_COL[s.i];
    const sz = st.key === 'gate' ? 5 : st.key === 'inhib' ? 4 : 3;
    c.fillRect(mx(st.x) - sz / 2, y0 + h / 2 - sz, sz, sz * 2);
  }
  for (const u of G.units){
    if (u.dead) continue;
    c.fillStyle = u.isHero ? '#ffffff' : SIDE_COL2[u.side];
    const sz = u.isHero ? 3 : 1.6;
    c.fillRect(mx(u.x) - sz / 2, y0 + h / 2 + u.y * .8 - sz / 2, sz, sz);
  }
  // camera window
  const halfW = (LW * .5) / (LS() * .96);
  c.strokeStyle = 'rgba(255,255,255,.5)';
  c.strokeRect(mx(cam.x - halfW), y0 + 3, Math.max(4, mx(cam.x + halfW) - mx(cam.x - halfW)), h - 6);
}

/* =====================================================================
   RENDERING — your hold
   ===================================================================== */
const sel = { tile:-1, node:null, build:null, hero:null };
// The hold lives in the same world as the bridge, just off to one side of it,
// so one camera covers your farms, the whole span and their gates. Everything
// below is written in hold-grid units and projected through the world.
const HOLD_X = -58, TILE = 7.2;
let holdSide = 0, BSC = 1;
function holdWorld(gx, gy){
  const d = holdSide === 0 ? 1 : -1;
  const ox = holdSide === 0 ? HOLD_X : C.LANE_LEN - HOLD_X;
  return [ ox + gx * TILE * d, gy * TILE ];
}
function bp(gx, gy, z){
  const w = holdWorld(gx, gy);
  return lp(w[0], w[1], (z || 0) * TILE * .62);
}
// Old base art was tuned against a ~45px grid cell; keep those numbers honest
// at any zoom by expressing them in cells too.
const bu = () => LS() * TILE / 45;
const tileGX = (t) => (t % PLOT_W) - (PLOT_W - 1) / 2;
const tileGY = (t) => Math.floor(t / PLOT_W) - (PLOT_H - 1) / 2;
const NODES = {
  gold: { gx:4.8, gy:-1.6, n:'Gold Mine', col:'#ffcf4d' },
  iron: { gx:5.2, gy:2.2,  n:'Iron Mine', col:'#b9c6d8' },
  wood: { gx:0.4, gy:5.0,  n:'Woodland',  col:'#6fbf5a' },
};
const KEEP = { gx:-3.5, gy:-2.0 };

function drawTile(c, gx, gy, fill, stroke){
  poly(c, [bp(gx - .5, gy - .5), bp(gx + .5, gy - .5), bp(gx + .5, gy + .5), bp(gx - .5, gy + .5)], fill, stroke, 1);
}

function drawHouse(c, gx, gy, w, d, wh, rh, wall, roof){
  const A = bp(gx - w, gy - d), B = bp(gx + w, gy - d), Cc = bp(gx + w, gy + d), D = bp(gx - w, gy + d);
  const A1 = bp(gx - w, gy - d, wh), B1 = bp(gx + w, gy - d, wh), C1 = bp(gx + w, gy + d, wh), D1 = bp(gx - w, gy + d, wh);
  poly(c, [D, Cc, C1, D1], shade(wall, .70));
  poly(c, [Cc, B, B1, C1], shade(wall, .92));
  poly(c, [A1, B1, C1, D1], shade(wall, 1.05));
  const R1 = bp(gx, gy - d * 1.15, wh + rh), R2 = bp(gx, gy + d * 1.15, wh + rh);
  const E1 = bp(gx - w * 1.18, gy - d * 1.18, wh), E2 = bp(gx + w * 1.18, gy - d * 1.18, wh);
  const E3 = bp(gx + w * 1.18, gy + d * 1.18, wh), E4 = bp(gx - w * 1.18, gy + d * 1.18, wh);
  poly(c, [E1, E2, R1], shade(roof, .8));
  poly(c, [E2, E3, R2, R1], shade(roof, 1.06));
  poly(c, [E4, E3, R2], shade(roof, .62));
  poly(c, [E1, R1, R2, E4], shade(roof, .74));
}

function drawBuilding(c, b){
  const gx = tileGX(b.tile), gy = tileGY(b.tile), B = bu();
  const raise = (b.raise || 0);
  const z = raise * 1.2;
  const t = b.type;
  c.globalAlpha = raise > 0 ? clamp(1 - raise * .5, .35, 1) : 1;
  ell(c, ...bp(gx, gy + .1), BSC * .62, BSC * .3, 'rgba(0,0,0,.22)');
  if (t === 'farm'){
    drawTile(c, gx, gy, '#6d5a34');
    c.strokeStyle = '#8a7440'; c.lineWidth = 1.6;
    for (let i = -3; i <= 3; i++){
      const a = bp(gx - .45, gy + i * .12 + z, 0), e = bp(gx + .45, gy + i * .12 + z, 0);
      c.beginPath(); c.moveTo(a[0], a[1]); c.lineTo(e[0], e[1]); c.stroke();
    }
    for (let i = 0; i < 5; i++){
      const p = bp(gx - .3 + i * .16, gy - .28 + (i % 2) * .5, z + .1);
      ell(c, p[0], p[1], BSC * .07, BSC * .1, '#9ec95c');
    }
    drawHouse(c, gx - .28, gy - .3, .22, .18, .5 + z, .3, '#a9825a', '#b8503f');
  } else if (t === 'pit'){
    drawTile(c, gx, gy, '#4a4038');
    ell(c, ...bp(gx, gy, z), BSC * .42, BSC * .22, '#2a2420');
    ell(c, ...bp(gx, gy, z + .04), BSC * .3, BSC * .15, '#6b3a2c');
    for (const s of [-1, 1]){
      const p0 = bp(gx + s * .42, gy - .35, z), p1 = bp(gx + s * .42, gy - .35, z + .9);
      c.strokeStyle = '#6a5540'; c.lineWidth = 3 * B; c.beginPath(); c.moveTo(p0[0], p0[1]); c.lineTo(p1[0], p1[1]); c.stroke();
      c.fillStyle = sideCol(); c.fillRect(p1[0] - 2 * B, p1[1], 8 * B * (s > 0 ? 1 : -1), 9 * B);
    }
  } else if (t === 'barracks'){
    drawTile(c, gx, gy, '#5e5748');
    drawHouse(c, gx, gy, .42, .34, .62 + z, .40, '#b08a5e', '#a34438');
    const p = bp(gx - .5, gy + .1, z + .95);
    c.fillStyle = sideCol(); c.fillRect(p[0], p[1], 7 * B, 12 * B);
    c.strokeStyle = '#d8dbe2'; c.lineWidth = 2 * B;
    for (let i = 0; i < 3; i++){
      const a = bp(gx + .5, gy - .3 + i * .3, z), e = bp(gx + .55, gy - .3 + i * .3, z + .55);
      c.beginPath(); c.moveTo(a[0], a[1]); c.lineTo(e[0], e[1]); c.stroke();
    }
  } else if (t === 'forge'){
    drawTile(c, gx, gy, '#4f4a44');
    drawHouse(c, gx, gy, .40, .32, .55 + z, .3, '#8d8579', '#5c5750');
    const ch = bp(gx + .22, gy - .22, z + 1.15);
    c.fillStyle = '#6d6459'; c.fillRect(ch[0] - 4 * B, ch[1], 9 * B, 16 * B);
    const glow = .45 + .25 * Math.sin(G.t * 4);
    c.globalAlpha = glow * (raise > 0 ? .4 : 1);
    ell(c, ch[0], ch[1] - 4 * B, 7 * B, 6 * B, '#ff8a3d');
    ell(c, ...bp(gx, gy + .3, z + .2), BSC * .18, BSC * .1, '#ff8a3d');
    c.globalAlpha = 1;
  } else if (t === 'tavern'){
    drawTile(c, gx, gy, '#575044');
    drawHouse(c, gx, gy, .40, .32, .95 + z, .38, '#c49a68', '#3f6b8c');
    const s0 = bp(gx + .5, gy + .1, z + .7);
    c.strokeStyle = '#6a5540'; c.lineWidth = 2 * B;
    c.beginPath(); c.moveTo(s0[0], s0[1]); c.lineTo(s0[0] + 10 * B, s0[1] - 3 * B); c.stroke();
    c.fillStyle = '#e2c88a'; c.fillRect(s0[0] + 6 * B, s0[1] - 2 * B, 11 * B, 8 * B);
    c.fillStyle = '#4b3a22'; c.fillRect(s0[0] + 9 * B, s0[1] + 1 * B, 5 * B, 2 * B);
  } else {
    drawTile(c, gx, gy, '#514b42');
    drawHouse(c, gx, gy, .38, .3, .48 + z, .26, '#9a8f7d', '#6f6455');
    const g = bp(gx + .1, gy - .05, z + .82);
    c.strokeStyle = '#c8a24a'; c.lineWidth = 2.4 * B;
    c.beginPath(); c.arc(g[0], g[1], 7 * B, 0, 6.2832); c.stroke();
    for (let i = 0; i < 6; i++){
      const a = G.t * .8 + i * 1.047;
      c.beginPath(); c.moveTo(g[0] + Math.cos(a) * 7 * B, g[1] + Math.sin(a) * 7 * B);
      c.lineTo(g[0] + Math.cos(a) * 10 * B, g[1] + Math.sin(a) * 10 * B); c.stroke();
    }
  }
  c.globalAlpha = 1;
  // Labels are queued and laid out after every building is drawn, so a packed
  // plot does not turn into a pile of overlapping text.
  const s = G.sides[holdSide];
  let sub = 'Lv ' + b.lvl;
  if (t === 'farm') sub = '+' + (C.POP_PER_FARM * b.lvl) + ' pop';
  if (t === 'barracks') sub = 'Lv ' + b.lvl + (b.lvl >= 3 ? ' · cannons' : b.lvl >= 2 ? ' · casters' : '');
  if (t === 'tavern') sub = heroCap(s) + ' hero slot' + (heroCap(s) === 1 ? '' : 's');
  if (holdSide === 0 && (cam.z > .72 || b.tile === sel.tile)){
    const lp0 = bp(gx, gy, 1.55 + z);
    labelQ.push({ x:lp0[0], y:lp0[1], txt:BUILDINGS[t].n + '  ' + sub, col:'#d8dee9', hot:b.tile === sel.tile });
  }
}

let labelQ = [];
function flushLabels(c){
  c.textAlign = 'center';
  const placed = [];
  labelQ.sort((a, b) => a.y - b.y);
  for (const L of labelQ){
    c.font = (L.small ? 8 : 9) + 'px system-ui';
    const w = c.measureText(L.txt).width + 8, h = L.small ? 11 : 13;
    let y = L.y - 11;
    // nudge upward until this label is clear of the ones already placed
    for (let guard = 0; guard < 12; guard++){
      const hit = placed.find(r => Math.abs(r.x - L.x) < (r.w + w) / 2 && Math.abs(r.y - y) < h + 1);
      if (!hit) break;
      y = hit.y - h - 2;
    }
    placed.push({ x:L.x, y, w, h });
    c.fillStyle = L.hot ? 'rgba(30,66,110,.88)' : (L.small ? 'rgba(9,13,20,.55)' : 'rgba(9,13,20,.72)');
    c.fillRect(L.x - w / 2, y, w, h);
    if (L.hot){ c.strokeStyle = '#4ea3ff'; c.lineWidth = 1; c.strokeRect(L.x - w / 2 + .5, y + .5, w - 1, h - 1); }
    c.fillStyle = L.col; c.fillText(L.txt, L.x, y + (L.small ? 8.5 : 10));
  }
  labelQ = [];
}

function drawWorkerFig(c, x, y, col, carry, sc){
  sc = (sc || 1) * bu();
  ell(c, x, y + 1, 3.2 * sc, 1.6 * sc, 'rgba(0,0,0,.25)');
  c.fillStyle = '#3f6f9e';
  c.fillRect(x - 2 * sc, y - 7 * sc, 4 * sc, 6 * sc);
  ell(c, x, y - 8.6 * sc, 2 * sc, 2.1 * sc, '#e8d6b8');
  if (carry){ c.fillStyle = col; c.fillRect(x - 2.6 * sc, y - 11.6 * sc, 5.2 * sc, 3 * sc); }
}

function drawNode(c, key){
  const N = NODES[key], s = G.sides[holdSide], B = bu();
  const p = bp(N.gx, N.gy);
  if (key === 'wood'){
    for (let i = 0; i < 5; i++){
      const q = bp(N.gx + (i % 3 - 1) * .55, N.gy + (i > 2 ? .55 : 0) - .2);
      c.fillStyle = '#5c4326'; c.fillRect(q[0] - 2 * B, q[1] - 12 * B, 4 * B, 12 * B);
      poly(c, [[q[0] - 11 * B, q[1] - 10 * B], [q[0], q[1] - 30 * B], [q[0] + 11 * B, q[1] - 10 * B]], i % 2 ? '#3f7a3a' : '#4c8c42');
      poly(c, [[q[0] - 8 * B, q[1] - 17 * B], [q[0], q[1] - 34 * B], [q[0] + 8 * B, q[1] - 17 * B]], i % 2 ? '#4c8c42' : '#5aa04c');
    }
  } else {
    poly(c, [[p[0] - 34 * B, p[1] + 4 * B], [p[0] - 14 * B, p[1] - 24 * B], [p[0] + 12 * B, p[1] - 20 * B], [p[0] + 34 * B, p[1] + 4 * B]],
      key === 'gold' ? '#8c7a52' : '#6a7382');
    poly(c, [[p[0] - 12 * B, p[1] + 4 * B], [p[0] - 8 * B, p[1] - 13 * B], [p[0] + 8 * B, p[1] - 13 * B], [p[0] + 12 * B, p[1] + 4 * B]], '#241f1b');
    c.fillStyle = '#4a4038';
    c.fillRect(p[0] - 13 * B, p[1] - 15 * B, 26 * B, 3 * B);
    for (let i = 0; i < 4; i++){
      const q = [p[0] - 24 * B + i * 15 * B, p[1] + 2 * B];
      ell(c, q[0], q[1], 5 * B, 3 * B, key === 'gold' ? '#e8b53d' : '#93a1b3');
      ell(c, q[0] - 2 * B, q[1] - 2 * B, 2.4 * B, 1.6 * B, key === 'gold' ? '#ffe08a' : '#c3cede');
    }
  }
  if (holdSide !== 0) return;                      // their crews are their business
  const n = Math.min(s.workers[key], nodeCap(s, key));
  const home = bp(KEEP.gx + .6, KEEP.gy + .5);
  for (let i = 0; i < n; i++){
    const ph = (G.t * .22 + i * .19) % 1;
    const tri = ph < .5 ? ph * 2 : 2 - ph * 2;
    const x = lerp(p[0], home[0], tri), y = lerp(p[1] - 6 * B, home[1], tri);
    drawWorkerFig(c, x, y, N.col, ph >= .5, .9);
  }
  labelQ.push({ x:p[0], y:p[1] + 26 * B, txt:N.n + '  ' + n + '/' + nodeCap(s, key), col:N.col });
}

function drawKeep(c){
  const s = G.sides[holdSide], B = bu();
  drawHouse(c, KEEP.gx, KEEP.gy, .52, .42, 1.0, .48, '#b9a17c', '#7a4a3c');
  const p = bp(KEEP.gx, KEEP.gy, 1.9);
  c.fillStyle = sideCol(); c.fillRect(p[0] - 2 * B, p[1] - 20 * B, 4 * B, 20 * B);
  poly(c, [[p[0] + 2 * B, p[1] - 20 * B], [p[0] + 18 * B, p[1] - 15 * B], [p[0] + 2 * B, p[1] - 10 * B]], sideCol());
  if (holdSide !== 0) return;
  const lb = bp(KEEP.gx, KEEP.gy, 2.5);
  labelQ.push({ x:lb[0], y:lb[1], txt:'Town Hall · ' + s.workers.idle + ' idle', col:'#ffe7b0' });
  for (let i = 0; i < Math.min(6, s.workers.idle); i++){
    const a = G.t * .3 + i * 1.1;
    const q = bp(KEEP.gx + Math.cos(a) * .9, KEEP.gy + .9 + Math.sin(a) * .35);
    drawWorkerFig(c, q[0], q[1], '#8d99b0', false, .85);
  }
}
const sideCol = () => SIDE_COL[holdSide];

// Deterministic countryside so the corners of the isometric diamond read as
// land instead of empty felt. Nothing here touches the simulation.
const hash2 = (i, j) => { const n = Math.sin(i * 127.1 + j * 311.7) * 43758.5453; return n - Math.floor(n); };

// The countryside never changes, so it is laid out once per hold and then only
// culled — it used to be re-rolled every single frame, for both holds.
const scatterCache = [null, null];
function scatterFor(side){
  if (scatterCache[side]) return scatterCache[side];
  const was = holdSide;
  holdSide = side;
  const out = [];
  const busy = (gx, gy) => {
    const wy = gy * TILE;
    if (wy < PLAT.far + 4 || wy > PLAT.near - 3) return true;          // off the mesa
    const wx = holdWorld(gx, gy)[0];
    const inner = holdSide === 0 ? 3 : C.LANE_LEN - 3;
    const outer = inner - (holdSide === 0 ? 1 : -1) * (PLAT.back + 34);
    if (holdSide === 0 ? (wx > inner - 4 || wx < outer + 4) : (wx < inner + 4 || wx > outer - 4)) return true;
    if (Math.abs(gx) < (PLOT_W - 1) / 2 + 1.1 && Math.abs(gy) < (PLOT_H - 1) / 2 + 1.1) return true;
    if (Math.hypot(gx - KEEP.gx, gy - KEEP.gy) < 1.9) return true;
    for (const k in NODES) if (Math.hypot(gx - NODES[k].gx, gy - NODES[k].gy) < 1.9) return true;
    return false;
  };
  for (let gx = -14; gx <= 13; gx++) for (let gy = -16; gy <= 8; gy++){
    const r = hash2(gx, gy);
    if (r > .40 || busy(gx, gy)) continue;
    const ox = (hash2(gx + 31, gy) - .5) * .8, oy = (hash2(gx, gy + 17) - .5) * .8;
    out.push({ gx:gx + ox, gy:gy + oy, r });
  }
  out.sort((a, b) => (a.gx + a.gy) - (b.gx + b.gy));
  holdSide = was;
  scatterCache[side] = out;
  return out;
}

function drawGround(c){
  // trodden paths from the hall out to every job
  const home = bp(KEEP.gx + .6, KEEP.gy + .7);
  c.strokeStyle = 'rgba(120,98,62,.30)'; c.lineCap = 'round';
  for (const k in NODES){
    const q = bp(NODES[k].gx, NODES[k].gy);
    c.lineWidth = Math.max(4, BSC * .22);
    c.beginPath(); c.moveTo(home[0], home[1]);
    c.quadraticCurveTo((home[0] + q[0]) / 2 + BSC * .3, (home[1] + q[1]) / 2, q[0], q[1]);
    c.stroke();
  }
  c.lineCap = 'butt';
  const s = BSC / 34;
  for (const it of scatterFor(holdSide)){
    const r = it.r;
    const p = bp(it.gx, it.gy);
    if (p[0] < -60 || p[0] > LW + 60) continue;
    if (p[1] < -60 || p[1] > LH + 60) continue;
    if (r < .16){                                     // tree
      ell(c, p[0], p[1] + 2, 9 * s, 4 * s, 'rgba(0,0,0,.20)');
      c.fillStyle = '#57431f'; c.fillRect(p[0] - 1.6 * s, p[1] - 9 * s, 3.2 * s, 9 * s);
      poly(c, [[p[0] - 9 * s, p[1] - 7 * s], [p[0], p[1] - 26 * s], [p[0] + 9 * s, p[1] - 7 * s]], r < .08 ? '#3f7a3a' : '#4b8c42');
      poly(c, [[p[0] - 6 * s, p[1] - 14 * s], [p[0], p[1] - 30 * s], [p[0] + 6 * s, p[1] - 14 * s]], '#57a04c');
    } else if (r < .26){                              // boulder
      ell(c, p[0], p[1] + 1, 8 * s, 3.5 * s, 'rgba(0,0,0,.18)');
      poly(c, [[p[0] - 8 * s, p[1]], [p[0] - 4 * s, p[1] - 7 * s], [p[0] + 4 * s, p[1] - 8 * s], [p[0] + 8 * s, p[1]]], '#7d7f77');
      poly(c, [[p[0] - 4 * s, p[1] - 7 * s], [p[0] + 4 * s, p[1] - 8 * s], [p[0] + 2 * s, p[1] - 3 * s], [p[0] - 3 * s, p[1] - 3 * s]], '#93958c');
    } else if (r < .34){                              // shrub
      ell(c, p[0], p[1] - 3 * s, 7 * s, 5 * s, '#3f6f38');
      ell(c, p[0] - 3 * s, p[1] - 5 * s, 4 * s, 3.5 * s, '#4b8542');
    } else {                                          // grass tuft
      c.strokeStyle = 'rgba(150,190,120,.55)'; c.lineWidth = 1.2;
      for (let i = -1; i <= 1; i++){
        c.beginPath(); c.moveTo(p[0] + i * 3 * s, p[1]); c.lineTo(p[0] + i * 4.5 * s, p[1] - 6 * s); c.stroke();
      }
    }
  }
}

// The mesa your hold stands on: grass on top, rock walls falling into the
// chasm on every side you can actually see.
const PLAT = { far:-54, near:38, back:48 };
function drawPlateau(c){
  const d = holdSide === 0 ? 1 : -1;
  const inner = holdSide === 0 ? 3 : C.LANE_LEN - 3;         // where it meets the bridge
  const outer = inner - d * (PLAT.back + 34);
  const F = PLAT.far, N = PLAT.near;
  const e = (x, y, z) => lp(x, y, z);
  const DROP = 46;
  // rock walls first, so the grass caps them cleanly
  poly(c, [e(outer, N), e(inner, N), e(inner, N, -DROP), e(outer, N, -DROP)], '#4a4038');
  poly(c, [e(outer, N, -DROP * .45), e(inner, N, -DROP * .45), e(inner, N, -DROP), e(outer, N, -DROP)], '#39322b');
  poly(c, [e(inner, F), e(inner, N), e(inner, N, -DROP), e(inner, F, -DROP)], '#40382e');
  poly(c, [e(inner, F, -DROP * .4), e(inner, N, -DROP * .4), e(inner, N, -DROP), e(inner, F, -DROP)], '#2f2922');
  poly(c, [e(outer, F), e(outer, N), e(outer, N, -DROP), e(outer, F, -DROP)], '#453c33');
  // strata across the face
  c.globalAlpha = .35;
  for (let i = 1; i < 4; i++){
    const z = -DROP * (i / 4);
    poly(c, [e(outer, N, z), e(inner, N, z), e(inner, N, z - 1.6), e(outer, N, z - 1.6)], '#6a5c4c');
  }
  c.globalAlpha = 1;
  // and the bottom of the cliff dissolving into the dark of the chasm
  for (let i = 0; i < 3; i++){
    const z0 = -DROP * (.55 + i * .15), z1 = z0 - DROP * .15;
    c.globalAlpha = .22 + i * .26;
    poly(c, [e(outer, N, z0), e(inner, N, z0), e(inner, N, z1), e(outer, N, z1)], '#0c1414');
    poly(c, [e(inner, F, z0), e(inner, N, z0), e(inner, N, z1), e(inner, F, z1)], '#0c1414');
  }
  c.globalAlpha = 1;
  // grass top
  poly(c, [e(outer, F), e(inner, F), e(inner, N), e(outer, N)], '#4c7040');
  c.globalAlpha = .35;
  poly(c, [e(outer, N - 8), e(inner, N - 8), e(inner, N), e(outer, N)], '#3d5c33');
  poly(c, [e(inner - d * 9, F), e(inner, F), e(inner, N), e(inner - d * 9, N)], '#43663a');
  c.globalAlpha = 1;
  // the far edge fades into the valley haze instead of ending on a hard line
  for (let i = 0; i < 3; i++){
    c.globalAlpha = .15 - i * .045;
    poly(c, [e(outer, F + i * 4), e(inner, F + i * 4), e(inner, F + i * 4 + 4), e(outer, F + i * 4 + 4)], '#8ea9ac');
  }
  c.globalAlpha = 1;
  // the road out to the gates
  c.globalAlpha = .5;
  poly(c, [e(inner, -5), e(inner - d * 30, -5), e(inner - d * 30, 5), e(inner, 5)], '#7d6a44');
  c.globalAlpha = 1;
}

// Is any part of this hold's mesa on screen? Both mesas are ~80 world units
// wide, so drawing the far one while you watch the fight is pure fill-rate.
function holdOnScreen(side){
  const inner = side === 0 ? 3 : C.LANE_LEN - 3;
  const outer = inner - (side === 0 ? 1 : -1) * (PLAT.back + 34);
  const a = lp(Math.min(inner, outer), PLAT.near)[0], b = lp(Math.max(inner, outer), PLAT.far)[0];
  return Math.max(a, b) > -80 && Math.min(a, b) < LW + 80;
}

function drawHold(c, side){
  if (!holdOnScreen(side)) return;
  holdSide = side;
  const fog = side !== 0;
  drawPlateau(c);
  drawGround(c);
  const s = G.sides[side];
  for (let t = 0; t < s.plot.length; t++){
    const gx = tileGX(t), gy = tileGY(t);
    const hot = !fog && t === sel.tile && !sel.node;
    drawTile(c, gx, gy, s.plot[t] ? '#4d4739' : (hot ? 'rgba(78,163,255,.30)' : 'rgba(46,52,40,.55)'),
      hot ? '#4ea3ff' : 'rgba(0,0,0,.35)');
    if (!s.plot[t] && !fog){
      const p = bp(gx, gy, .12);
      c.fillStyle = hot ? '#9ad0ff' : 'rgba(200,215,190,.35)';
      c.font = 'bold ' + Math.round(15 * bu()) + 'px system-ui';
      c.textAlign = 'center'; c.textBaseline = 'middle';
      c.fillText('+', p[0], p[1]); c.textBaseline = 'alphabetic';
    }
  }
  if (!fog && sel.node && NODES[sel.node]){
    const q = bp(NODES[sel.node].gx, NODES[sel.node].gy);
    c.strokeStyle = '#4ea3ff'; c.lineWidth = Math.max(1.5, 2.4 * cam.z);
    c.beginPath(); c.ellipse(q[0], q[1], BSC * .62, BSC * .32, 0, 0, 6.2832); c.stroke();
  }
  const items = [];
  items.push({ y:bp(KEEP.gx, KEEP.gy)[1], f:() => drawKeep(c) });
  for (const k in NODES) items.push({ y:bp(NODES[k].gx, NODES[k].gy)[1], f:() => drawNode(c, k) });
  for (const b of s.plot) if (b) items.push({ y:bp(tileGX(b.tile), tileGY(b.tile))[1], f:() => drawBuilding(c, b) });
  items.sort((a, b) => a.y - b.y);
  for (const it of items) it.f();
  if (!fog){
    const farms = bList(s, 'farm');
    const nf = Math.min(s.workers.food, fieldSlots(s));
    for (let i = 0; i < nf && farms.length; i++){
      const f = farms[i % farms.length];
      const a = G.t * .5 + i * 1.7;
      const q = bp(tileGX(f.tile) + Math.cos(a) * .34, tileGY(f.tile) + .1 + Math.sin(a) * .3, .05);
      drawWorkerFig(c, q[0], q[1], '#7fdc8a', (Math.sin(a) > 0), .85);
    }
  }
  // Their hold reads as distant through the alpha above. It used to also get a
  // full-height translucent wash the width of their mesa — 8ms of fill-rate a
  // frame, most of it over empty sky.
  c.globalAlpha = 1;
  holdSide = 0;
}

/* ------------------------------------------------------------------ camera + frame */
function camStep(dt){
  if (cam.follow){
    let fx = null;
    const mine = G.sides[0].heroes.filter(h => !h.dead);
    if (mine.length) fx = mine.reduce((a, h) => a + h.x, 0) / mine.length;
    else fx = frontlineX(0);
    cam.x = lerp(cam.x, clamp(fx, CAM_MIN, CAM_MAX), 1 - Math.pow(.02, dt));
  }
  cam.z = lerp(cam.z, cam.tz, 1 - Math.pow(.005, dt));
  if (cam.shake > 0){
    cam.shake = Math.max(0, cam.shake - dt * 26);
    const a = G.t * 47;
    cam.sx = Math.sin(a) * cam.shake; cam.sy = Math.cos(a * 1.7) * cam.shake * .6;
  } else { cam.sx = 0; cam.sy = 0; }
}

const CAM_MIN = HOLD_X - 26, CAM_MAX = C.LANE_LEN - HOLD_X + 26;
function draw(){
  const c = lctx;
  if (!c) return;
  BSC = LS() * TILE;
  c.save();
  drawSky(c);
  drawHold(c, 0);
  drawHold(c, 1);
  drawEnds(c);
  drawDeck(c);
  drawLane(c);
  flushLabels(c);
  drawMinimap(c);
  c.restore();
}

const $ = (id) => document.getElementById(id);
const RES_CLASS = { gold:'g', iron:'i', wood:'w', food:'f' };
const RES_ICON = { gold:'🪙', iron:'⛏️', wood:'🪵', food:'🌾' };

function costHtml(cost){
  const s = G.sides[0];
  return '<span class="cost">' + Object.keys(cost).map(k =>
    '<i class="' + RES_CLASS[k] + (s.res[k] < cost[k] ? ' bad' : '') + '">' + RES_ICON[k] + cost[k] + '</i>'
  ).join(' ') + '</span>';
}
function fmt(n){ return n >= 1000 ? (n / 1000).toFixed(1) + 'k' : String(Math.floor(n)); }

function syncHud(){
  const s = G.sides[0], m = gatherMul(s);
  for (const k of ['gold','iron','wood','food']){
    const el = $('r' + k[0].toUpperCase() + k.slice(1));
    if (!el) continue;
    el.querySelector('b').textContent = fmt(s.res[k]);
    const rate = Math.min(s.workers[k], nodeCap(s, k)) * nodeRate(s, k) * m;
    el.querySelector('.rate').textContent = rate > 0 ? '+' + rate.toFixed(1) : '';
  }
  const pop = $('rPop');
  pop.querySelector('b').textContent = popUsed(s) + '/' + popCap(s);
  pop.classList.toggle('full', popUsed(s) >= popCap(s));
  const wb = $('waveBox');
  wb.querySelector('b').textContent = G.wave;
  $('waveT').textContent = Math.floor(G.waveT / 60) + ':' + String(Math.floor(G.waveT % 60)).padStart(2, '0');
}

// The dock is one row of columns under the world: jobs, training, whatever plot
// you have selected, the forge, and your heroes.
let dockTab = 'jobs';
const NARROW = () => !HEADLESS && document.body.classList.contains('narrow');

function dockHtml(){
  const s = G.sides[0];
  const narrow = NARROW();
  const sec = {};

  // ---- jobs
  let h = '<div class="ptitle">Workers — ' + s.workers.idle + ' idle</div><div class="pgrid">';
  for (const k of ['gold','iron','wood','food']){
    const cap = nodeCap(s, k);
    h += '<div class="job"><span>' + RES_ICON[k] + '</span>' +
      '<span class="ct">' + s.workers[k] + '/' + cap + '</span>' +
      '<button class="sq" data-act="job" data-node="' + k + '" data-d="-1"' + (s.workers[k] ? '' : ' disabled') + '>−</button>' +
      '<button class="sq" data-act="job" data-node="' + k + '" data-d="1"' + (s.workers.idle && s.workers[k] < cap ? '' : ' disabled') + '>+</button></div>';
  }
  sec.jobs = h + '</div>';

  // ---- training
  h = '<div class="ptitle">Train</div><div class="pgrid">';
  h += '<button class="abtn" data-act="worker"><span class="t">Worker</span><span class="c">' + costHtml(C.WORKER_COST) + '</span></button>';
  for (const k in TRAIN){
    const d = TRAIN[k], ok = barracksLvl(s) >= d.barracks;
    h += '<button class="abtn" data-act="unit" data-unit="' + k + '"' + (ok ? '' : ' disabled') + '>' +
      '<span class="t">' + d.n + '</span><span class="c">' + (ok ? costHtml(d.cost) + ' +1👥' : 'barracks Lv' + d.barracks) + '</span></button>';
  }
  const q = s.trainQ.map(x => {
    const pc = Math.round(clamp(x.t / x.dur, 0, 1) * 100);
    const nm = x.type === 'worker' ? 'Worker' : TRAIN[x.type].n;
    return '<span class="qchip"><i class="fill" style="width:' + pc + '%"></i><span>' + nm + '</span></span>';
  }).join('');
  const cnt = {};
  for (const m of s.muster) cnt[m.type] = (cnt[m.type] || 0) + 1;
  const mus = Object.keys(cnt).map(k => '<span class="mchip">' + TRAIN[k].n + ' ×' + cnt[k] + '</span>').join('');
  sec.train = h + '</div><div id="queue">' + (q || '<span class="qchip"><span>pits idle</span></span>') + '</div>' +
    '<div class="ptitle">Next wave' + (s.superT > 0 ? ' — OGRES ' + Math.ceil(s.superT) + 's' : '') + '</div>' +
    '<div id="musterRow">' + (mus || '<span class="mchip">levies only</span>') + '</div>';

  // ---- whatever is selected out on the plot
  const b = sel.tile >= 0 ? s.plot[sel.tile] : null;
  h = '';
  if (sel.node){
    const N = NODES[sel.node], lv = nodeLvl(s, sel.node), maxed = lv >= C.NODE_MAX_LVL;
    const cost = nodeUpCost(s, sel.node);
    h += '<div class="ptitle">' + N.n + ' — level ' + lv + '</div>' +
      '<div style="font-size:11px;color:var(--dim);max-width:260px">Working ' +
      s.workers[sel.node] + ' of ' + nodeCap(s, sel.node) + ' places at ' +
      nodeRate(s, sel.node).toFixed(2) + '/s each. Digging deeper adds ' + C.NODE_CAP_PER_LVL +
      ' places and ' + Math.round(C.NODE_RATE_PER_LVL * 100) + '% output.</div><div class="prow">' +
      '<button class="abtn" data-act="nodeup" data-node="' + sel.node + '"' +
      (!maxed && canPay(s, cost) ? '' : ' disabled') + '><span class="t">' +
      (maxed ? 'Fully dug' : 'Dig deeper — level ' + (lv + 1)) + '</span><span class="c">' +
      (maxed ? 'at the bottom' : costHtml(cost)) + '</span></button>' +
      '<button class="sq" data-act="job" data-node="' + sel.node + '" data-d="-1"' + (s.workers[sel.node] ? '' : ' disabled') + '>−</button>' +
      '<button class="sq" data-act="job" data-node="' + sel.node + '" data-d="1"' +
      (s.workers.idle && s.workers[sel.node] < nodeCap(s, sel.node) ? '' : ' disabled') + '>+</button>' +
      '</div>';
  } else if (sel.tile >= 0 && !b){
    h += '<div class="ptitle">Build on plot ' + (sel.tile + 1) + '</div><div class="pgrid">';
    for (const t of BUILD_ORDER){
      const cost = buildCost(t, 1);
      h += '<button class="abtn" data-act="build" data-type="' + t + '"' + (canPay(s, cost) ? '' : ' disabled') + '>' +
        '<span class="t">' + BUILDINGS[t].n + '</span><span class="c">' + costHtml(cost) + '</span></button>';
    }
    h += '</div>';
  } else if (b){
    const B = BUILDINGS[b.type];
    h += '<div class="ptitle">' + B.n + ' — level ' + b.lvl + '</div>' +
      '<div style="font-size:11px;color:var(--dim);max-width:250px">' + B.d + '</div><div class="prow">';
    if (b.lvl < B.maxLvl){
      const cost = buildCost(b.type, b.lvl + 1);
      h += '<button class="abtn" data-act="upgrade"' + (canPay(s, cost) ? '' : ' disabled') + '>' +
        '<span class="t">Upgrade to Lv ' + (b.lvl + 1) + '</span><span class="c">' + costHtml(cost) + '</span></button>';
    } else h += '<div class="job"><span class="nm">Fully upgraded.</span></div>';
    h += '</div>';
  } else {
    h += '<div class="ptitle">Your hold</div><div style="font-size:12px;color:var(--dim);max-width:250px;line-height:1.5">' +
      'Click a plot to build, a building to upgrade it, or a mine to dig it deeper. Drag to look around, pinch or scroll to zoom.</div>';
  }
  sec.sel = h;

  if (bLvl(s, 'forge') > 0){
    h = '<div class="ptitle">Forge — rank cap ' + upCap(s) + '</div><div class="pgrid">';
    for (const u of [...TOWER_UPS, ...TROOP_UPS]){
      const bag = TOWER_UPS.includes(u) ? s.towerUp : s.troopUp;
      const lv = bag[u.id], maxed = lv >= upCap(s);
      const cost = upCostFor(u, lv);
      h += '<button class="abtn" data-act="up" data-up="' + u.id + '"' + (!maxed && canPay(s, cost) ? '' : ' disabled') + '>' +
        '<span class="t">' + u.n + ' <span style="color:var(--gold)">' + lv + '/' + upCap(s) + '</span></span>' +
        '<span class="c">' + (maxed ? 'at the cap' : costHtml(cost)) + '</span></button>';
    }
    sec.forge = h + '</div>';
  }

  sec.heroes = '<div class="ptitle">Heroes</div><div id="heroBar">' + heroBarHtml() + '</div>';

  const order = ['jobs','train','sel','heroes','forge'].filter(k => sec[k] !== undefined);
  if (!narrow)
    return order.map(k => '<div class="dsec' + (k === 'sel' ? ' grow' : '') + '">' + sec[k] + '</div>').join('');

  // Narrow: one section at a time behind tabs, so nothing needs a sideways scroll.
  if (!sec[dockTab]) dockTab = 'jobs';
  const label = { jobs:'JOBS', train:'TRAIN', sel:'BUILD', heroes:'HEROES', forge:'FORGE' };
  const alert = { sel:sel.tile >= 0 || !!sel.node, heroes:s.heroes.some(x => x.pend.length) };
  const tabs = order.map(k => '<button class="dtab' + (k === dockTab ? ' on' : '') + '" data-tab="' + k + '">' +
    label[k] + (alert[k] && k !== dockTab ? '<span class="dot"></span>' : '') + '</button>').join('');
  return '<div class="dtabs">' + tabs + '</div><div class="dsec">' + sec[dockTab] + '</div>';
}

// The build, at a glance: one pip per skill with its rank, dimmed and filling
// back up while it is on cooldown. You pick these; you should see them work.
function skillPipsHtml(h){
  if (!h.skills.length) return '<div class="pips3"><span class="pip empty">no skills yet</span></div>';
  return '<div class="pips3">' + h.skills.map(sk => {
    const d = SKILL[sk.id];
    const cd = d.cd * (1 - h.cdr - bsum(h, 'bcdr'));
    const rem = clamp(sk.cdT / Math.max(.1, cd), 0, 1);
    const col = castCol(d);
    return '<span class="pip' + (sk.ult ? ' ult' : '') + (rem > 0 ? ' cool' : '') + '" title="' +
      d.n + ' — rank ' + sk.rank + '" style="border-color:' + col + '55">' +
      '<i style="height:' + Math.round(rem * 100) + '%;background:' + col + '44"></i>' +
      '<b>' + d.n.replace(/[^A-Za-z]/g, '').slice(0, 2) + '</b>' +
      '<u>' + sk.rank + '</u></span>';
  }).join('') + '</div>';
}

      '<div class="bar hp"><i style="width:' + Math.round(clamp(hero.hp / hero.mhp, 0, 1) * 100) + '%"></i></div>' +
      '<div class="bar mp"><i style="width:' + Math.round(clamp(hero.mana / hero.mmana, 0, 1) * 100) + '%"></i></div>' +
      '<div class="bar xp"><i style="width:' + Math.round(clamp(hero.xp / need, 0, 1) * 100) + '%"></i></div>' +
      skillPipsHtml(hero) +
      '</button>';
  }
  const cap = heroCap(s);
  if (s.heroes.length < cap)
    h += '<button class="hnew" data-act="newhero"' + (canPay(s, HERO_COST) ? '' : ' disabled') + '>＋ Forge Hero<br><span style="font-size:10px">' +
      Object.keys(HERO_COST).map(k => RES_ICON[k] + HERO_COST[k]).join(' ') + '</span></button>';
  else if (cap === 0)
    h += '<button class="hnew" disabled>Build a<br>Hero Factory</button>';
  return h;
}

// What a decent player would do next. Purely advisory — it never acts for you,
// and it goes quiet once the hold is running itself.
function adviceFor(s){
  const bl = barracksLvl(s);
  // Arming a fighter eats an idle worker, so once a barracks stands, keep one
  // spare rather than telling you to staff every job and then to arm nobody.
  const spare = bl > 0 ? 1 : 0;
  const idleJob = ['gold','wood','iron','food'].find(k => s.workers[k] < nodeCap(s, k));
  if (s.workers.idle > spare && idleJob){
    const n = s.workers.idle - spare;
    return { tab:'jobs', txt:n + ' worker' + (n > 1 ? 's are' : ' is') + ' standing around. Put ' +
      (n > 1 ? 'them' : 'one') + ' on ' + idleJob + '.' };
  }
  if (popUsed(s) >= popCap(s) - 1)
    return { tab:'sel', txt:'Population is full at ' + popCap(s) + '. Build a Farm on an empty plot.' };
  if (bl === 0)
    return { tab:'sel', txt:'Nothing is armed yet. Build a Barracks to turn workers into fighters.' };
  const pend = s.heroes.find(h => h.pend.length);
  if (pend) return { tab:'heroes', txt:pend.name + ' has a choice waiting — tap the hero card.' };
  if (heroCap(s) === 0)
    return { tab:'sel', txt:'Build a Hero Factory. Heroes fight on their own, and they carry a push.' };
  if (s.heroes.length < heroCap(s) && canPay(s, HERO_COST))
    return { tab:'heroes', txt:'You can afford another hero. Forge one.' };
  const armable = Object.keys(TRAIN).filter(k => bl >= TRAIN[k].barracks && canPay(s, TRAIN[k].cost));
  const mustering = s.muster.length > 0 || s.trainQ.some(q => q.type !== 'worker');
  if (!mustering){
    if (s.workers.idle > 0 && armable.length)
      return { tab:'train', txt:'Nothing is mustering. Arm a ' + TRAIN[armable[0]].n +
        ' before wave ' + (G.wave + 1) + ' leaves.' };
    if (s.workers.idle === 0 && popUsed(s) < popCap(s))
      return { tab:'train', txt:'Every worker is busy, so there is nobody to arm. Train one more.' };
    if (armable.length === 0)
      return { tab:'jobs', txt:'You cannot afford a fighter. Put more workers on iron and wood.' };
  }
  if (bLvl(s, 'forge') === 0 && s.res.iron > 120)
    return { tab:'sel', txt:'You have iron spare. A Forge unlocks turret and minion upgrades.' };
  if (workerCount(s) < 10 && popUsed(s) < popCap(s) - 1)
    return { tab:'train', txt:'More workers means more of everything. Train another.' };
  return null;
}

let rsT = 0;
function resizeSoon(){ clearTimeout(rsT); rsT = setTimeout(resize, 30); }

function say(msg){ if (msg) fxToast(msg, 'bad'); }

// Screen point → world ground point (the inverse of lp with z = 0).
function unproject(sx, sy){
  const S = LS();
  const A = (sx - LW * .5) / S, B = (sy - LH * .60) / S;
  const det = .96 * .60 + .52 * .07;
  return [ (A * .60 + .52 * B) / det + cam.x, (.96 * B - .07 * A) / det ];
}

// What you click is what you see. A building is drawn standing UP from its
// ground cell, so testing the cell under the cursor misses the thing you
// actually aimed at — every clickable is tested against its drawn box first,
// nearest-to-camera first, and only then do we fall back to the bare ground.
function clickTargets(){
  const s = G.sides[0], out = [];
  holdSide = 0;
  // Each clickable is an ellipse around the middle of the shape you can SEE —
  // for a building that is up the screen from its ground cell, not on it.
  const at = (gx, gy, lift, rx, ry) => {
    const p = bp(gx, gy);
    return { cx:p[0], cy:p[1] - lift * BSC, rx:rx * BSC, ry:ry * BSC, sy:p[1] };
  };
  for (const h of G.sides[0].heroes){
    if (h.dead) continue;
    const p = lp(h.x, h.y);
    out.push({ kind:'hero', hero:h, cx:p[0], cy:p[1] - 18 * cam.z, rx:16 * cam.z, ry:26 * cam.z, sy:p[1], pri:3 });
  }
  for (let t = 0; t < s.plot.length; t++){
    const b = s.plot[t];
    out.push(Object.assign(b ? at(tileGX(t), tileGY(t), .32, .52, .46) : at(tileGX(t), tileGY(t), 0, .5, .34),
      b ? { kind:'build', tile:t, pri:2 } : { kind:'plot', tile:t, pri:1 }));
  }
  for (const k in NODES)
    out.push(Object.assign(at(NODES[k].gx, NODES[k].gy, .26, .62, .44), { kind:'node', node:k, pri:2 }));
  return out;
}

// Pure: given a point on the canvas, what did the player mean? Split out from
// the event handler so the tests can aim at things the way a thumb does.
function resolvePick(sx, sy){
  BSC = LS() * TILE;
  let best = null, bd = Infinity;
  for (const t of clickTargets()){
    const dx = (sx - t.cx) / t.rx, dy = (sy - t.cy) / t.ry;
    const d = dx * dx + dy * dy;
    if (d > 1) continue;                       // outside its own footprint
    const score = d - t.pri * .02;             // heroes and buildings edge out bare ground
    if (score < bd){ bd = score; best = t; }
  }
  if (best) return best;
  // nothing under the finger — fall back to the plot cell on the ground
  const w = unproject(sx, sy);
  const gx = (w[0] - HOLD_X) / TILE, gy = w[1] / TILE;
  const col = Math.round(gx + (PLOT_W - 1) / 2), row = Math.round(gy + (PLOT_H - 1) / 2);
  const near = Math.abs(gx - (col - (PLOT_W - 1) / 2)) < .8 && Math.abs(gy - (row - (PLOT_H - 1) / 2)) < .8;
  if (near && col >= 0 && col < PLOT_W && row >= 0 && row < PLOT_H)
    return { kind:s0Plot(row * PLOT_W + col) ? 'build' : 'plot', tile:row * PLOT_W + col };
  return { kind:'none' };
}
const s0Plot = (t) => G.sides[0].plot[t];

function pickAt(clientX, clientY){
  const r = lcv.getBoundingClientRect();
  const sx = clientX - r.left, sy = clientY - r.top;
  const m = minimapRect();
  if (sx >= m.x0 && sx <= m.x0 + m.w && sy >= m.y0 && sy <= m.y0 + m.h){
    cam.follow = false;
    const fb = $('camFollow'); if (fb) fb.classList.remove('on');
    cam.x = clamp(minimapWorldX(sx), CAM_MIN, CAM_MAX);
    sfx('click');
    return;
  }
  const t = resolvePick(sx, sy);
  if (t.kind !== 'none') sfx('click');
  if (t.kind === 'hero'){ sel.hero = t.hero; showHeroSheet(t.hero); return; }
  sel.node = t.kind === 'node' ? t.node : null;
  sel.tile = (t.kind === 'build' || t.kind === 'plot') ? t.tile : -1;
  if (NARROW() && (sel.node || sel.tile >= 0)) dockTab = 'sel';
  syncUI();
}

function wire(){
  const s0 = () => G.sides[0];
  $('dock').addEventListener('click', (e) => {
    const tab = e.target.closest('[data-tab]');
    if (tab){ dockTab = tab.dataset.tab; syncUI(); return; }
    const b = e.target.closest('[data-hero],[data-act]');
    if (!b || b.disabled) return;
    if (b.dataset.hero){
      const h = s0().heroes.find(x => x.id === +b.dataset.hero);
      if (h){ sel.hero = h; showHeroSheet(h); }
      return;
    }
    const s = s0(), a = b.dataset.act;
    if (a === 'job') say(assign(s, b.dataset.node, +b.dataset.d));
    else if (a === 'worker') say(trainWorker(s));
    else if (a === 'unit') say(trainUnit(s, b.dataset.unit));
    else if (a === 'build') say(build(s, sel.tile, b.dataset.type));
    else if (a === 'upgrade') say(upgradeBuilding(s, sel.tile));
    else if (a === 'up') say(buyUp(s, b.dataset.up));
    else if (a === 'nodeup') say(upgradeNode(s, b.dataset.node));
    else if (a === 'newhero'){ showHeroCreate(); return; }
    syncUI();
  });
  $('modal').addEventListener('click', (e) => {
    if (e.target === $('modal')){ if (G.state === 'play') closeModal(); return; }
    const b = e.target.closest('[data-act]');
    if (!b) return;
    const a = b.dataset.act;
    if (a === 'start'){ audioStart(); newMatch({ diff:b.dataset.diff }); closeModal(); syncUI(); }
    else if (a === 'close') closeModal();
    else if (a === 'menu'){ startDemo(); showMenu(); }
    else if (a === 'again'){ newMatch({ diff:G.diff.id }); closeModal(); syncUI(); }
    else if (a === 'mkhero'){
      const err = createHero(s0(), b.dataset.cls);
      if (err){ say(err); return; }
      const h = s0().heroes[s0().heroes.length - 1];
      sel.hero = h; showHeroSheet(h); syncUI();
    } else if (a === 'pick'){
      const h = sel.hero;
      if (!h) return;
      say(pickOption(h, +b.dataset.i));
      showHeroSheet(h); syncUI();
    }
  });
  $('advice').addEventListener('click', () => {
    const t = $('advice').dataset.tab;
    if (t){ dockTab = t; syncUI(); }
  });
  const paintSound = () => { $('btnSound').textContent = AU.muted ? '🔇' : '🔊'; $('btnSound').classList.toggle('on', !AU.muted); };
  $('btnSound').addEventListener('click', () => { audioStart(); setMuted(!AU.muted); paintSound(); sfx('click'); });
  paintSound();
  // browsers will not make a sound until the player has touched the page
  const kick = () => { audioStart(); window.removeEventListener('pointerdown', kick); };
  window.addEventListener('pointerdown', kick);
  $('btnMenu').addEventListener('click', () => { showMenu(); });
  $('btnHelpBase').addEventListener('click', showHelp);
  $('btnPause').addEventListener('click', () => {
    G.paused = !G.paused;
    $('btnPause').textContent = G.paused ? '▶' : '❚❚';
    $('btnPause').classList.toggle('on', G.paused);
  });
  $('btnSpeed').addEventListener('click', () => {
    G.speed = G.speed === 1 ? 2 : G.speed === 2 ? 3 : 1;
    $('btnSpeed').textContent = G.speed + '×';
    $('btnSpeed').classList.toggle('on', G.speed > 1);
  });
  const camTo = (x) => { cam.follow = false; cam.x = x; $('camFollow').classList.remove('on'); };
  $('camHold').addEventListener('click', () => camTo(HOLD_X));
  $('camGate').addEventListener('click', () => camTo(12));
  $('camMid').addEventListener('click', () => camTo(C.LANE_LEN / 2));
  $('camFoe').addEventListener('click', () => camTo(C.LANE_LEN - 12));
  $('camFollow').addEventListener('click', () => { cam.follow = !cam.follow; $('camFollow').classList.toggle('on', cam.follow); });
  const zoomBy = (f) => { cam.tz = clamp(cam.tz * f, .42, 2.2); };
  $('camOut').addEventListener('click', () => zoomBy(.8));
  $('camIn').addEventListener('click', () => zoomBy(1.25));

  // one canvas: drag to pan, wheel to zoom, click to select a plot or a hero
  let drag = null;
  lcv.addEventListener('pointerdown', (e) => {
    drag = { x:e.clientX, y:e.clientY, cx:cam.x, moved:false };
    lcv.setPointerCapture(e.pointerId);
  });
  lcv.addEventListener('pointermove', (e) => {
    if (!drag) return;
    const dx = (e.clientX - drag.x) / (LS() * .96);
    if (Math.abs(e.clientX - drag.x) + Math.abs(e.clientY - drag.y) > 5){
      drag.moved = true; cam.follow = false; $('camFollow').classList.remove('on');
    }
    if (drag.moved) cam.x = clamp(drag.cx - dx, CAM_MIN, CAM_MAX);
  });
  lcv.addEventListener('pointerup', (e) => {
    if (drag && !drag.moved) pickAt(e.clientX, e.clientY);
    drag = null;
  });
  lcv.addEventListener('pointercancel', () => { drag = null; });
  // two-finger pinch, for the screens with no wheel
  const touches = new Map();
  let pinch = 0;
  lcv.addEventListener('pointerdown', (e) => { touches.set(e.pointerId, e); });
  lcv.addEventListener('pointermove', (e) => {
    if (!touches.has(e.pointerId)) return;
    touches.set(e.pointerId, e);
    if (touches.size !== 2) return;
    drag = null;
    const [a, b2] = [...touches.values()];
    const d = Math.hypot(a.clientX - b2.clientX, a.clientY - b2.clientY);
    if (pinch) cam.tz = cam.z = clamp(cam.z * (d / pinch), .42, 2.2);
    pinch = d;
  });
  const drop = (e) => { touches.delete(e.pointerId); if (touches.size < 2) pinch = 0; };
  lcv.addEventListener('pointerup', drop);
  lcv.addEventListener('pointercancel', drop);
  lcv.addEventListener('dblclick', () => { cam.follow = true; $('camFollow').classList.add('on'); });
  lcv.addEventListener('wheel', (e) => {
    e.preventDefault();
    cam.tz = clamp(cam.tz * (e.deltaY > 0 ? .88 : 1.14), .42, 2.2);
  }, { passive:false });

  window.addEventListener('resize', resizeSoon);
  window.addEventListener('orientationchange', resizeSoon);
  window.addEventListener('keydown', (e) => {
    if (e.key === 'Escape'){ if (G.state === 'play') closeModal(); }
    else if (e.key === ' '){ e.preventDefault(); $('btnPause').click(); }
    else if (e.key === '1' || e.key === '2' || e.key === '3'){
      G.speed = +e.key; $('btnSpeed').textContent = G.speed + '×';
      $('btnSpeed').classList.toggle('on', G.speed > 1);
    }
  });
}

let last = 0;
function frame(ts){
  const raw = Math.min(.1, (ts - last) / 1000 || 0);
  last = ts;
  if (G.state === 'play' && !G.paused){
    let left = raw * G.speed;
    let guard = 0;
    while (left > 0 && guard++ < 12){ const st = Math.min(1 / 30, left); update(st); left -= st; }
  }
  camStep(raw);
  draw();
  uiTick(raw);
  requestAnimationFrame(frame);
}

function boot(){
  lcv = $('wcv');
  resize();
  wire();
  startDemo();
  showMenu();
  syncUI();
  requestAnimationFrame(frame);
}
if (!HEADLESS) boot();
else { newMatch({ diff:'veteran' }); G.state = 'menu'; }
