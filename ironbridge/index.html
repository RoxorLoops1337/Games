// Measured over 61 heroes in 12 full matches: the median hero finished at
// level 10, only a third ever reached their ultimate at 12, and one in nine
// ever bought a rank — so the 15/18/21/24 ladder the game is built around was
// content almost nobody saw. The curve is flatter now, and a hero behind the
// match earns faster, which lifts the ones forged late without raising the
// ceiling for the one that was there from the first minute.
const xpNeed = (lvl) => Math.round(100 + 50 * lvl + 2.0 * lvl * lvl);
// Measured against the hero setting the pace, not the average of everyone
// alive: an average moves when a hold forges a fourth hero, which quietly paid
// the side that spammed heroes and cost the side that did not.
const CATCHUP_PER_LVL = .10, CATCHUP_MAX = 2.0;
function xpCatchup(h){
  let best = 0;
  for (const s of G.sides) for (const o of s.heroes) if (o.lvl > best) best = o.lvl;
  return clamp(1 + CATCHUP_PER_LVL * (best - h.lvl), 1, CATCHUP_MAX);
}

function gainXp(h, amt){
  if (h.lvl >= C.MAX_LEVEL) return;
  h.xp += amt * (1 + passVal(h, 'xpM')) * xpCatchup(h);
  let guard = 0;
  while (h.lvl < C.MAX_LEVEL && h.xp >= xpNeed(h.lvl) && guard++ < 40){
    h.xp -= xpNeed(h.lvl);
    h.lvl++;
    recalcHero(h);
    h.hp = Math.min(h.mhp, h.hp + h.mhp * .18);
    if (C.SKILL_TIERS.includes(h.lvl)) offer(h, 'skill');
    else if (h.lvl === C.ULT_LEVEL) offer(h, 'ult');
    else if (C.RANK_LEVELS.includes(h.lvl)) offer(h, 'rank');
    if (h.side === 0 && !HEADLESS){ fxToast(h.name + ' reaches level ' + h.lvl + '.', 'good'); sfx('level'); }
    if (G.sides[h.side].ai) autoPick(h);
  }
  if (h.lvl >= C.MAX_LEVEL) h.xp = 0;
}

/* ------------------------------------------------------------------ choices */
function offer(h, kind){
  let opts = [];
  if (kind === 'passive'){
    const pool = PASSIVES.slice();
    for (let i = 0; i < 3; i++){ const p = pool.splice(Math.floor(rnd() * pool.length), 1)[0]; opts.push(p.id); }
  } else if (kind === 'skill'){
    const owned = new Set(h.skills.map(s => s.id));
    const pool = basicPool(h.cls).filter(s => !owned.has(s.id));
    for (let i = 0; i < 3 && pool.length; i++) opts.push(pool.splice(Math.floor(rnd() * pool.length), 1)[0].id);
  } else if (kind === 'ult'){
    const pool = ultPool(h.cls).slice();
    while (pool.length && opts.length < 3) opts.push(pool.splice(Math.floor(rnd() * pool.length), 1)[0].id);
  } else if (kind === 'rank'){
    const pool = [];
    if (h.passRank < C.MAX_HERO_RANK) pool.push('P:' + h.passive);
    for (const s of h.skills) if (s.rank < C.MAX_HERO_RANK) pool.push(s.id);
    while (pool.length && opts.length < 3) opts.push(pool.splice(Math.floor(rnd() * pool.length), 1)[0]);
  }
  if (!opts.length) return null;
  const p = { kind, opts, lvl:h.lvl };
  h.pend.push(p);
  return p;
}

function pickOption(h, idx){
  const p = h.pend[0];
  if (!p) return 'nothing to choose';
  const id = p.opts[idx];
  if (id === undefined) return 'no such option';
  if (p.kind === 'passive'){ h.passive = id; h.passRank = 1; }
  else if (p.kind === 'skill' || p.kind === 'ult'){
    h.skills.push({ id, rank:1, cdT:0, ult:p.kind === 'ult' });
  } else if (p.kind === 'rank'){
    if (id.startsWith('P:')) h.passRank = Math.min(C.MAX_HERO_RANK, h.passRank + 1);
    else { const s = h.skills.find(o => o.id === id); if (s) s.rank = Math.min(C.MAX_HERO_RANK, s.rank + 1); }
  }
  h.pend.shift();
  recalcHero(h);
  if (h.side === 0 && !HEADLESS) syncUI();
  return null;
}

// What one skill is worth to one hero, without the die. Pulled out of autoPick
// so a harness and the tests can read the real number instead of keeping a
// copy of it — a copy that was quietly two terms out of date the first time it
// was used, and produced a confident explanation of the wrong thing.
//
// autoPick adds a die roll in [0,1) to this, so an option more than 1.0 behind
// the best in its menu can NEVER be chosen, however often it is offered.
// Measured over 400 ultimate offers per class, five of the eighteen ultimates
// came up zero times and the Fighter and Marksman were locked to one apiece:
//
//   Fighter   Bladestorm 100%  Champion's Edge 0%  War Banner 0%
//   Marksman  Arrow Rain 100%  Headhunter 1%       Trueshot 0%
//   Mage      Cataclysm 67%    Arcane Torrent 34%  Frost Prison 0%
//   Support   Sanctuary 81%    Hymn of Valour 19%  Chain of Dawn 0%
//
// The cause is that skRate measures DAMAGE. A summon, a stun, a shield or a
// heal rates near zero, and the class bonuses below only rescued five
// hand-picked class/tag pairs — so every ultimate whose job fell outside them
// was being scored on damage it does not do. TAG_WORTH pays for the job
// itself, for any class; the class lines on top are still the class fantasy.
// 'move' was missing from this table, so a mobility skill scored the die and
// nothing else. Sprint is in all six class pools and rates 0.19 in every one
// of them — the floor of every pool, 1.4 to 2.6 behind its best. Measured
// three ways and they agree: 0 of 1200 AI heroes took it; 18,000 heroes over
// 54,000 offers took it 0-8 times per class (0 of 1762 for the Mage); and a
// Monte Carlo over real three-option menus puts it at 0.0-0.6% everywhere.
// Fighter's Dash Strike was the same story at 2%, because the dash bonus
// below was written for the Assassin only.
const TAG_WORTH = { dmg:0, cc:.5, buff:.45, heal:.5, summon:.55, move:.45 };
function skillWorth(h, d){
  let sc = skRate(d, 1, ad0(h), ap0(h)) / 30;
  sc += TAG_WORTH[d.tag] || 0;
  if (d.shield && d.tag !== 'buff') sc += .2;
  if (h.cls === 'tank' && (d.tag === 'cc' || d.shield)) sc += .7;
  // ...and a skill that heals is a support skill whatever its tag says: Chain
  // of Dawn is tagged 'cc' and heals an ally for 150, so the support bonus
  // stepped straight over it.
  if (h.cls === 'support' && (d.tag === 'heal' || d.tag === 'buff' || d.heal || d.healAlly)) sc += .9;
  if ((h.cls === 'mage' || h.cls === 'marksman') && d.tag === 'dmg') sc += .5;
  if (h.cls === 'assassin' && (d.k === 'dash' || d.exec)) sc += .6;
  if (h.cls === 'fighter' && (d.aoe || d.tag === 'buff' || d.k === 'dash')) sc += .4;
  // An execute is worth having and skRate cannot see it — it is the reason a
  // Champion's Edge beats a bigger sustained number in a real fight.
  if (d.exec) sc += .35;
  return sc;
}
// What one more rank of this option is actually worth to this hero: the step
// from its current rank to the next, not a flat number per kind.
function rankWorth(h, id){
  if (id.startsWith('P:')){
    // a rank of the passive is valued at a share of its own full worth
    const p = PASS[h.passive];
    return .3 + (p ? passiveWorth(h, p) : 0) * .35;
  }
  const s = h.skills.find(o => o.id === id), d = SKILL[id];
  if (!s || !d) return .4;
  const ad = ad0(h), ap = ap0(h);
  const step = skRate(d, s.rank + 1, ad, ap) - skRate(d, s.rank, ad, ap);
  // an ultimate carries the fight, so a rank of one is worth more than its
  // raw rate step suggests
  return .3 + step / 30 + (s.ult ? .25 : 0);
}

const ad0 = (h) => CLS[h.cls].b.ad + CLS[h.cls].g.ad * 8;
const ap0 = (h) => CLS[h.cls].b.ap + CLS[h.cls].g.ap * 8;

// What one passive is worth to one hero, without the die. Replaces the old
// hand sum that read only 9 of the 69 modifier keys the 100 PASSIVES use —
// measured over 300k offers, the other 60 keys sat in a flat 0.58-0.65% pick
// band (uniform is 1.00%), i.e. the die alone decided them. Coefficients are
// anchored to the nine that were already load-bearing (ad:.04 ap:.03
// hpPct:8 armor:.04 as:4 ls:5 hp:.004 mdmg:2 tdmg:2 — UNCHANGED below) so the
// old and new keys sit on one scale instead of two. Where a key mirrors one
// of the nine exactly (same formula, same mechanic) it gets the same or a
// derived fraction of that coefficient; where there is no clean anchor the
// value is a reasoned guess, called out inline.
const PASSIVE_W = {
  // ---- the original nine — load-bearing, do not change ------------------
  ad:.04, ap:.03, hpPct:8, armor:.04, as:4, ls:5, hp:.004, mdmg:2, tdmg:2,
  // ---- direct mechanical mirrors -----------------------------------------
  mr:.04,        // mitigate() treats magic and physical identically — exact mirror of armor
  hdmg:2,        // same dealDmg %-vs-target-category multiplier as mdmg/tdmg, gated on tgt.isHero
  gateDmg:1.0,   // stacks on tdmg but only on 1 of 5 structures — GUESS, half of tdmg's coefficient
  // ---- fractional stats without a raw-point anchor -----------------------
  crit:3,        // dps-equivalent ~= crit*.75 (base 1.75x crit mult in basicAttack); 4*.75~=3, anchored off 'as'
  critD:1,       // only pays off if the SAME hero also has crit chance from elsewhere (a skill buff, mid-run) —
                 // a hero gets exactly one passive ever, so this is a conditional stat. GUESS, deliberately low
  tenacity:3, cdr:3, ms:3,                 // no clean anchor for any of these three — GUESS
  xpM:2,         // a %-of-a-flow stat like mdmg/tdmg, same order
  gatherM:5,     // hold-wide economy multiplier that compounds for the whole match — GUESS, deliberately high
  goldM:2.5,     // %  bonus but only on this hero's own kills, narrower than gatherM — GUESS
  spellVamp:3,   // mirrors ls(5) but only triggers on ability damage (cooldown-gated, lands less often) — discounted
  dmgAll:3,      // unconditional, always-on version of mdmg/tdmg/hdmg at once — GUESS, above the restricted 2's
  takeLess:3,    // defensive mirror of dmgAll — GUESS
  takeMore:-3,   // THE ONE INVERTED KEY: a bigger number here is worse (more damage taken), so it is penalized,
                 // not rewarded — mirrors takeLess's magnitude as a matching drawback
  // ---- same mechanic as an anchor, but only active part of the time ------
  armorLow:.02,  // half of armor's .04 — active only under 50% hp
  asLow:2,       // half of as's 4 — active only under 50% hp
  dmgLow:1.5,    // half of dmgAll's 3 — active only under 40% hp
  dmgHigh:1.2,   // discounted further than dmgLow — the "above 80% hp" band sees less uptime in a real fight
  crowd:1.5, lone:1.5, pack:1.5,   // conditional multi-target / isolation / peel bonuses — GUESS
  asDuel:2.2,    // half-ish of as's 4 — only active near an enemy hero
  exec:1.2,      // ramps 0 -> full only as the target's hp falls toward the threshold; ~40% average uptime of a
                 // dmgAll-level(3) bonus
  // ---- on-hit / proc effects, converted through the same "dps" lens ------
  truOn:.045,    // flat TRUE damage every hit, bypasses armor entirely — slightly above ad's .04 since armor never mitigates it
  burn:.016,     // proc DoT (bn/3 over ~3s, pure) that REFRESHES rather than stacks (applyBurn takes max()), so its
                 // steady-state value does not scale with attack speed the way truOn's flat add does — discounted hard
  burnDur:.05,   // extends how long an un-refreshed burn coasts through a gap between hits; small utility, not extra dps
  slowOn:1.2,    // per-hit % slow — a control stat with no raw-point anchor. GUESS
  everyFourth:.01,  // flat aoe proc every 4th attack, converted at ~dps-equivalent/4 then discounted for target availability
  chainHit:.011,    // flat chain proc every 5th attack hitting 2 more targets — similar conversion, slightly higher
  firstHit:.008,    // once-per-UNIQUE-TARGET bonus, but minions are constantly freshly spawned so it recurs often — GUESS
  killHeal:.006, killMana:.004, killGold:.05,   // small per-point, but kills are frequent for an active hero — GUESS
  structGold:1.5,   // % bonus but only on the rarer, far-more-valuable structure kills — GUESS
  killAd:.12,       // stacking (x5, 30s) +ad proc after a kill — coefficient assumes ~2-2.5 average stacks in a fight
  killAs:2.5,       // temporary (12s) +as proc after a kill — as's 4, discounted for partial uptime
  shieldLow:.003, spawnShield:.003,  // one-shot shields that DO retrigger (shieldLow every 45s under 30% hp,
                                     // spawnShield on every respawn) but are not a permanent stat — GUESS
  deathHeal:.003,   // one-shot team heal on this hero's own death — GUESS
  respawn:-3,       // INVERTED like takeMore: a NEGATIVE value here is good (shorter respawn), so the coefficient
                     // must be negative too, for the signs to net out positive on the one passive that uses it
  towerRes:1.5,     // % less damage taken, but only from structures specifically — narrower than takeLess — GUESS
  // ---- flat resource pools -------------------------------------------------
  hreg:.1, mreg:.08, mana:.0015,   // sustain/pool stats with no combat-output anchor — GUESS
  rage:25,          // per-STACK fraction (.02, caps at .20 over 10 stacks); anchored off 'as'(4) assuming ~70% of
                     // max stacks (.14) is realistic mid-fight: 4*.14/.02 ~= 28, rounded down for the ramp-up time
  rng:.25,          // flat attack-range bonus — no anchor; marksman/mage get an extra push in the class bonus below
  thorns:3,         // % of melee damage taken reflected back — GUESS, no direct anchor
  grudge:1.5,       // conditional %dmg vs your last killer — narrower than hdmg — GUESS
  echo:1.5,         // abilities repeat 12% of their own damage — scales with the hero's whole kit — GUESS
  // ---- army-composition auras: these buff LANE UNITS, not the hero itself,
  // so their value is roughly constant regardless of which class is holding
  // them (positioning matters more than class — see classPassiveBonus).
  // NOTE units: auraDmg/auraMs/auraHp/meleeHp/cannonDmg/casterDmg are all
  // FRACTIONS (same dimension as as/ms/mdmg); auraArm and auraHeal are FLAT
  // POINTS (same dimension as armor/hreg) — do not give them the same scale.
  auraDmg:2,      // fraction, mirrors mdmg/tdmg's order — nearby allied minions hit harder
  auraArm:.05,    // FLAT armor points (armor's own .04/pt), slightly bumped since it lands on several bodies at once
  auraHeal:.08,   // FLAT hp/s (hreg's .1/pt order), again landing on several allies at once
  auraMs:2,       // fraction, minions-only and proximity-gated — narrower than a personal ms
  auraHp:5,       // fraction, but UNCONDITIONAL and army-wide (every minion the hold ever spawns, no
                  // proximity check at all) — priced close to hpPct's own 8
  meleeHp:2.5,    // mirrors auraHp exactly, just kind-restricted to footman spawns (~half as broad)
  cannonDmg:1.5, casterDmg:1.5,   // fraction, kind-restricted AND proximity-gated (narrower than auraDmg)
  // onHitAp and apPct are intentionally NOT listed here — see below, they are
  // priced off the hero's own ap0(h) instead of a flat per-point coefficient,
  // because the modifier itself multiplies against the hero's live ap stat.
};

// A hero's class fantasy nudges a handful of situational keys the same way
// skillWorth nudges skill picks. Each entry is a KEY -> BOOST FRACTION: the
// bonus is that fraction of the key's own PASSIVE_W-priced value, never an
// independently-guessed raw number — so it can never be dimensionally wrong
// (a flat-point key like auraArm and a fraction key like auraMs cannot
// accidentally end up on the same scale here, because both ride on top of
// the already-correctly-scaled base term). None of this can invert an
// ordering PASSIVE_W already set: every term is added independently per
// key, so a passive that is a strict superset of another's keys/values
// still scores at least as high, for every class.
const CLASS_KEY_BOOST = {
  // front-liners are the ones usually standing in range of their own lane army
  tank:     { auraDmg:.3, auraArm:.3, auraHeal:.3, auraMs:.3, auraHp:.3, meleeHp:.3, cannonDmg:.3, casterDmg:.3,
              armorLow:1, tenacity:.5, thorns:.75 },
  support:  { auraDmg:.3, auraArm:.3, auraHeal:.5, auraMs:.3, auraHp:.3, meleeHp:.3, cannonDmg:.3, casterDmg:.3,
              tenacity:.5, mreg:.5, mana:.3, spellVamp:.3 },
  // a Marksman's whole kit (per its blurb) is range and turret damage
  marksman: { tdmg:.5, hdmg:.5, rng:1, crit:.5 },
  mage:     { mana:.5, mreg:.5, spellVamp:.5 },
  assassin: { exec:.5, firstHit:.5, lone:.5, crit:.5 },
  fighter:  { crowd:.5, pack:.5, ls:.3 },
};
function classPassiveBonus(h, m){
  const boosts = CLASS_KEY_BOOST[h.cls];
  if (!boosts) return 0;
  let b = 0;
  for (const k in boosts) if (m[k]) b += m[k] * (PASSIVE_W[k] || 0) * boosts[k];
  return b;
}

function passiveWorth(h, p){
  const m = p.m;
  let sc = 0;
  for (const k in m) sc += (m[k] || 0) * (PASSIVE_W[k] || 0);
  // these two literally multiply against the hero's own live ap stat
  // (recalcHero / basicAttack), so price them off ap0(h) at ap's own rate
  // instead of guessing a flat number that would be wrong for 5 of 6 classes
  sc += (m.onHitAp || 0) * ap0(h) * .03;
  sc += (m.apPct || 0) * ap0(h) * .03;
  sc += classPassiveBonus(h, m);
  return sc;
}

// The Host picks with a light preference for its class fantasy, then at random.
function autoPick(h){
  const side = G.sides[h.side];
  let guard = 0;
  while (h.pend.length && guard++ < 12){
    const p = h.pend[0];
    let best = 0, bs = -1e9;
    p.opts.forEach((id, i) => {
      // its own stream, so the two holds cannot draw off each other
      let sc = side ? arnd(side) : rnd();
      if (p.kind === 'passive'){
        sc += passiveWorth(h, PASS[id]);
      } else if (p.kind === 'rank'){
        // This was a flat constant that never looked at WHICH skill it was
        // ranking: 0.8 for any skill, 0.4 for the passive. Driving 216,000
        // rank offers, the option with the larger real gain was chosen 52% of
        // the time from a menu of two (chance is 50%) and 32% from a menu of
        // three (chance is 33%) — no correlation with value whatsoever, and
        // half of all heroes reach this choice. Score the actual step instead.
        sc += rankWorth(h, id);
      }
      else {
        // skills and ultimates were picked at pure random, so the Host built
        // incoherent heroes — a tank hoarding nukes, a support with none.
        const d = SKILL[id];
        if (d) sc += skillWorth(h, d);
      }
      if (sc > bs){ bs = sc; best = i; }
    });
    pickOption(h, best);
  }
}

/* ------------------------------------------------------------------ lane presence */
function enterLane(h){
  if (h.inLane) return;
  h.inLane = true; h.dead = false;
  h.x = gateX(h.side) + dirOf(h.side) * 2; h.y = rr(-1.2, 1.2);
  h.hp = h.mhp; h.mana = h.mmana; h.buffs.length = 0; h.rage = 0; h.retreat = false;
  // A hero's timed state does not decay while it is dead: statusTick runs from
  // heroStep, and heroStep returns after counting down respawnT. So whatever
  // was on the hero at the instant it died was FROZEN, not spent, and started
  // ticking again the moment it walked back out. Clearing the buffs array made
  // that look handled; these are bare fields and were missed. A burst kill is
  // supposed to land on a target that is already stunned or slowed, so this was
  // not a corner: heroes respawned at full health and could not move.
  h.stunT = 0; h.slowT = 0; h.slowP = 0; h.taunt = 0;
  h.pullT = 0; h.pullBy = null;
  h.markT = 0; h.markBy = undefined; h.markAmp = 0;
  h.burn = null; h.shield = 0; h.shT = 0; h.target = null;
  const sh = passVal(h, 'spawnShield');
  if (sh){ h.shield = sh; h.shT = 20; }
  G.units.push(h);
}

function onHeroDeath(h, src){
  h.dead = true; h.inLane = false; h.deaths++;
  const i = G.units.indexOf(h); if (i >= 0) G.units.splice(i, 1);
  const tav = bList(G.sides[h.side], 'tavern').reduce((a, b) => Math.max(a, b.lvl), 1);
  h.respawnT = (C.RESPAWN_BASE + C.RESPAWN_PER_LVL * h.lvl) * (1 + passVal(h, 'respawn')) * (1 - .08 * (tav - 1));
  const dh = passVal(h, 'deathHeal');
  if (dh) nearby(h.x, 8, (u) => { if (!u.dead && u.side === h.side) healUnit(u, dh); });
  if (src && src.side !== undefined){
    const s = G.sides[src.side];
    s.res.gold += C.BOUNTY_HERO + h.lvl * 8; s.heroKills++;
    if (src.isHero){ src.kills++; h.lastKiller = src; }
    awardXp(src, 130 + h.lvl * 11, h.x);
  }
  fxToast(h.name + ' has fallen.', h.side === 0 ? 'bad' : 'good');
  sfx('heroDown', h.x);
  if (!HEADLESS){
    burstFx(h.x, h.y, SIDE_COL[h.side], 22);
    ringFx(h.x, h.y, 3.2, SIDE_COL[h.side]);
    shake(6, h.x);
    sfx('hero', h.x);
  }
}

/* ------------------------------------------------------------------ hero brain */
// Would chasing this target put us under an enemy turret with nobody to soak
// for us? Measured at the target, not at the hunter.
// How many real bodies of `side` are standing under this turret taking shots
// that would otherwise land on a hero. Two things this has to get right and
// the two places that used to count it separately did not. A hero is never its
// own cover — and nearby() bins purely by x into width-6 cells and applies no
// distance test of its own, so without the check below a minion nine units from
// the turret, further out than some turrets can even shoot, counted as a shield.
function towerCover(st, side){
  let n = 0;
  nearby(st.x, 7, (u) => {
    if (u.dead || u.side !== side || u.isHero) return;
    if (hyp(u.x - st.x, u.y - st.y) > 7) return;
    n++;
  });
  return n;
}
const COVERED = 2;                  // fewer than two bodies is not cover
function towerCovered(h, tgt){
  for (const st of G.sides[enemyOf(h.side)].structs){
    if (st.dead || !st.ad) continue;
    if (hyp(st.x - tgt.x, st.y - tgt.y) > st.rng + 1) continue;
    if (towerCover(st, h.side) < COVERED) return true;
  }
  return false;
}

function inTowerFire(h){
  for (const st of G.sides[enemyOf(h.side)].structs){
    if (st.dead || !st.ad) continue;
    if (hyp(st.x - h.x, st.y - h.y) < st.rng + 1.5) return st;
  }
  return null;
}
function frontlineX(side){
  const dir = dirOf(side);
  let best = null;
  for (const u of G.units){
    if (u.dead || u.side !== side || u.isHero) continue;
    if (best === null || (u.x - best) * dir > 0) best = u.x;
  }
  if (best === null){
    const st = frontStruct(enemyOf(side));
    return st ? st.x - dir * 9 : C.LANE_LEN / 2;
  }
  return best;
}

// How far a hero will go out of its way for an enemy hero. An assassin whose
// whole point is killing heroes had the same nine as everyone else, and ended
// the match with the fewest hero kills of any class.
const HUNT = { assassin:15, marksman:10, mage:10, fighter:10, tank:9, support:8 };
const huntRange = (h) => HUNT[h.cls] || 9;

function heroTarget(h){
  const foe = enemyOf(h.side);
  const eh = nearestFoe(h, huntRange(h), true);
  // Hunt further, but not into a turret on your own. Giving the assassin a
  // long reach without this simply walked it under their guns.
  if (eh && !towerCovered(h, eh)) return eh;
  const em = nearestFoe(h, Math.max(7, h.rng + 2.5));
  if (em) return em;
  const st = frontStruct(foe);
  if (st && Math.abs(st.x - h.x) < h.rng + 3) return st;
  return null;
}

function heroStep(h, dt){
  if (h.dead){
    h.respawnT -= dt;
    if (h.respawnT <= 0) enterLane(h);
    return;
  }
  statusTick(h, dt);
  const homeX = gateX(h.side), dir = dirOf(h.side);
  const atHome = Math.abs(h.x - homeX) < 7;
  // Out of combat a hero mends where it stands. Without this they spend a
  // third of the match walking the length of the bridge to heal and back.
  const calm = G.t - h.dmgTaken > 6 ? 1 : 0;
  h.hp = Math.min(h.mhp, h.hp + (1.5 + h.lvl * .25 + passVal(h, 'hreg')
    + (atHome ? 34 : 0) + calm * (6 + h.lvl * .9)) * dt);
  h.mana = Math.min(h.mmana, h.mana + (3.5 + h.lvl * .35 + passVal(h, 'mreg')
    + (atHome ? 22 : 0) + calm * 4) * dt);
  gainXp(h, 8.0 * dt);                       // standing in the lane is worth something
  // Attack range is still baked by recalcHero (ten call sites read h.rng), so
  // when a buff carrying 'brng' runs out the stat has to be rebuilt or it never
  // comes back down: Trueshot's ten-second +2 range was permanent, because the
  // only thing that ever recalculated was the next level-up, and past level 24
  // gainXp returns before it.
  let dropped = false;
  for (let i = h.buffs.length - 1; i >= 0; i--){
    h.buffs[i].t -= dt;
    if (h.buffs[i].t <= 0){ if (h.buffs[i].brng) dropped = true; h.buffs.splice(i, 1); }
  }
  if (dropped) recalcHero(h);
  if (h.rage > 0 && G.t - h.dmgTaken > 3) h.rage = Math.max(0, h.rage - dt * .05);
  const shieldLow = passVal(h, 'shieldLow');
  if (shieldLow && h.hp / h.mhp < .3 && (h.lowT || 0) <= 0){ h.shield = Math.max(h.shield, shieldLow); h.shT = 18; h.lowT = 45; }
  if (h.lowT > 0) h.lowT -= dt;
  // hero auras that heal
  const ah = passVal(h, 'auraHeal');
  if (ah) nearby(h.x, 7, (u) => { if (!u.dead && u.side === h.side && u !== h) healUnit(u, ah * dt); });
  if (pullStep(h, dt)) return;
  if (h.stunT > 0) return;

  const frac = h.hp / h.mhp;
  const tower = inTowerFire(h);
  // This asked alliesNear whether anyone was standing under the turret, and
  // handed it a fresh {x,y,side} literal to measure from. alliesNear's only
  // exclusion is `o !== u`, and a literal is never identical to any real unit,
  // so the hero counted ITSELF. Alone under an enemy turret at half health it
  // read cover = 1 against a true 0, which made the frac < .58 withdrawal below
  // unreachable — and with it the `finishing` guard and the "do not walk past
  // turret range with nothing to hit" clamp, all three of which read this one
  // flag. The hero coasted to the unconditional .28 floor instead and turned
  // around at 0.279, well inside a turret that reaches 11, which is why nearly
  // every hero death in the game happens with the retreat flag already set.
  // It now asks the same question, the same way, as towerCovered's "is it safe
  // to walk in" — those two decisions disagreeing was its own bug.
  const cover = tower && towerCover(tower, h.side) >= COVERED ? 1 : 0;
  // A wounded enemy hero within reach is worth finishing — heroes used to
  // break off every duel the moment either side dipped, so they traded for
  // twenty minutes and nobody ever died to a hero.
  const prey = nearestFoe(h, huntRange(h) + 2, true);
  const finishing = prey && prey.hp / prey.mhp < .35 && frac > .32 && !(tower && !cover);
  if (h.retreat && (frac > .66 || finishing)) h.retreat = false;
  if (!finishing && (frac < .28 || (tower && !cover && frac < .58))) h.retreat = true;

  const tgt = h.target = h.retreat ? null : (finishing ? prey : heroTarget(h));
  castLoop(h, tgt, dt);

  let gx, gy = 0;
  if (h.retreat){ gx = homeX; gy = 0; }
  else if (tgt){ gx = tgt.x; gy = tgt.y; }
  else {
    const fl = frontlineX(h.side);
    gx = fl + dir * 2.5; gy = h.y * .5;
    if (tower && !cover) gx = Math.min(gx * dir, (tower.x - dir * (tower.rng + 2)) * dir) * dir;
  }
  const dx = gx - h.x, dy = gy - h.y, dist = hyp(dx, dy) || .001;
  const reach = tgt ? h.rng + (tgt.r || .4) + h.r : 0;
  if (tgt && dist <= reach){
    h.cd -= dt;
    if (h.cd <= 0){ h.cd = 1 / attackSpeedOf(h); basicAttack(h, tgt); }
  } else {
    const sp = speedOf(h) * dt;
    h.x += dx / dist * sp; h.y += dy / dist * sp;
  }
  h.y = clamp(h.y, -C.LANE_W / 2 + h.r, C.LANE_W / 2 - h.r);
  h.x = clamp(h.x, 1, C.LANE_LEN - 1);
}

/* ------------------------------------------------------------------ casting */
const skVal = (arr, rank) => arr ? arr[0] + arr[1] * (rank - 1) : 0;
// A skill from the shared pool scales off whichever stat its owner is better
// at. Without this, every magic skill in that pool is a trap pick for the four
// classes that have no ability power at all.
const apBase = (h, s) => s.cls === 'any' ? Math.max(h.ap, attackDamage(h) * .7) : h.ap;
const adBase = (h, s) => s.cls === 'any' ? Math.max(attackDamage(h), h.ap) : attackDamage(h);
function skPower(h, s, rank){
  return skVal(s.dmg, rank) + (s.adR || 0) * adBase(h, s) + (s.apR || 0) * apBase(h, s);
}
function abilityDmg(h, tgt, amt, magic){
  const done = dealDmg(h, tgt, amt, { magic, ability:true, exec:0 });
  const e = passVal(h, 'echo');
  if (e > 0 && !tgt.dead) dealDmg(h, tgt, amt * e, { magic, ability:true });
  return done;
}

function castLoop(h, tgt, dt){
  for (const sk of h.skills){
    if (sk.cdT > 0) sk.cdT -= dt;
  }
  if (h.castLock > 0){ h.castLock -= dt; return; }
  for (const sk of h.skills){
    const s = SKILL[sk.id];
    if (!s || sk.cdT > 0 || h.mana < s.mana) continue;
    if (!wantCast(h, s, tgt)) continue;
    castSkill(h, sk, tgt);
    h.mana -= s.mana;
    sk.cdT = s.cd * (1 - h.cdr - bsum(h, 'bcdr'));
    h.castLock = .35;
    return;                       // one cast per beat keeps it readable
  }
}

function wantCast(h, s, tgt){
  const frac = h.hp / h.mhp;
  if (s.tag === 'heal') return frac < .7 || (s.ally && lowAlly(h, s.rng || 6));
  if (s.tag === 'buff' && (s.shield || s.barm)) return frac < .8 && (tgt || h.retreat);
  if (s.tag === 'move' && h.retreat) return true;
  if (!tgt) return false;
  const d = hyp(tgt.x - h.x, tgt.y - h.y);
  if (s.ult){
    const worth = tgt.isHero || foesNear(h, 6) >= 3 || (tgt.struct && tgt.hp / tgt.mhp < .7);
    if (!worth) return false;
  }
  // A hook thrown at somebody already standing on you does nothing but damage,
  // and a hook thrown at a turret does not even do that — it cannot be dragged.
  if (s.k === 'hook') return !tgt.struct && d > h.r + (tgt.r || 0) + 1.8 && d <= (s.rng || 9) + (tgt.r || 0);
  if (s.tag === 'summon') return d < 14;
  if (s.tag === 'buff') return d < Math.max(6, h.rng + 2);
  return d <= (s.rng || h.rng + 2) + (tgt.r || 0);
}
// The most hurt friend within reach. With only a hero or two on a side, an
// ally-only heal was often cast on nobody, which is why supports lost most.
function lowAlly(h, rad){
  let hero = null, any = null;
  nearby(h.x, rad, (u) => {
    if (u.dead || u.side !== h.side || u === h) return;
    const f = u.hp / u.mhp;
    if (f >= .7) return;
    if (u.isHero){ if (!hero || f < hero.hp / hero.mhp) hero = u; }
    else if (!any || f < any.hp / any.mhp) any = u;
  });
  return hero || any;
}

// A team heal or team buff used to hit every minion in a wide radius, so its
// worth grew with the size of the wave while every other class only ever
// helped itself. Measured over 120 matches that made Support a 72% class. It
// now covers the nearest few bodies — the front line, which is what it is for
// — and the rest of the wave fights on its own.
const TEAM_CAP = 6;
function teamTargets(h, aoe){
  const out = [];
  nearby(h.x, aoe, (u) => { if (!u.dead && u.side === h.side && !u.isHero) out.push(u); });
  if (out.length <= TEAM_CAP) return out;
  out.sort((a, b) => Math.abs(a.x - h.x) - Math.abs(b.x - h.x));
  return out.slice(0, TEAM_CAP);
}

function castSkill(h, sk, tgt){
  const s = SKILL[sk.id], r = sk.rank, foe = enemyOf(h.side);
  const pw = skPower(h, s, r);
  const dur = s.dur || 0;
  h.swing = .3;
  if (!HEADLESS){ castFx(h, s, tgt); sfx('cast', h.x); }
  switch (s.k){
    case 'strike': {
      if (!tgt) break;
      abilityDmg(h, tgt, pw, s.magic);
      if (s.aoe) areaHit(h, tgt.x, tgt.y, s.aoe, pw * .55, { magic:s.magic, ability:true });
      if (s.stun) applyStun(tgt, s.stun);
      if (s.slow) applySlow(tgt, s.slow, s.slowT || 2);
      break;
    }
    case 'bolt': {
      if (!tgt) break;
      const land = () => {
        if (tgt.dead) return;
        abilityDmg(h, tgt, pw, s.magic);
        if (s.aoe) areaHit(h, tgt.x, tgt.y, s.aoe, pw * .6, { magic:s.magic, ability:true });
        if (s.slow) applySlow(tgt, s.slow, s.slowT || 2);
        if (s.pierce) areaHit(h, tgt.x + dirOf(h.side) * 2, tgt.y, 1.6, pw * .5, { magic:s.magic, ability:true });
      };
      shoot(h, tgt, land, s.magic ? '#c69bff' : '#ffe08a', s.magic ? 'bolt' : 'shaft');
      break;
    }
    case 'volley': {
      if (!tgt) break;
      for (let i = 0; i < (s.shots || 3); i++) shoot(h, tgt, () => { if (!tgt.dead) abilityDmg(h, tgt, pw, s.magic); }, '#ffe08a', 'shaft');
      break;
    }
    // The chain. It flies out slow enough to watch, and whatever it bites gets
    // dragged to the caster's feet — which is the whole point, because a hook
    // that only did damage would just be a worse bolt.
    case 'hook': {
      if (!tgt) break;
      const land = () => {
        if (tgt.dead) return;
        abilityDmg(h, tgt, pw, s.magic);
        if (s.stun) applyStun(tgt, s.stun);
        // where the chain ends: just off the caster's shield, on the line it flew
        const dx = tgt.x - h.x, dy = tgt.y - h.y, d = hyp(dx, dy) || 1;
        const stop = h.r + (tgt.r || .4) + .5;
        const ex = h.x + dx / d * stop, ey = h.y + dy / d * stop;
        applyPull(tgt, ex, ey, s.pull || .45, h);
        if (!HEADLESS) hookSnapFx(h, tgt);
      };
      shoot(h, tgt, land, s.ult ? '#ffd27a' : '#d9c49a', 'hook', s.ult ? 26 : 20);
      break;
    }
    case 'nova': {
      areaHit(h, h.x, h.y, s.aoe, pw, { magic:s.magic, ability:true });
      if (s.stun || s.slow) nearby(h.x, s.aoe + 2, (u) => {
        if (u.dead || u.side !== foe) return;
        if (hyp(u.x - h.x, u.y - h.y) > s.aoe + u.r) return;
        if (s.stun) applyStun(u, s.stun);
        if (s.slow) applySlow(u, s.slow, s.slowT || 2);
      });
      if (s.healAlly) nearby(h.x, s.aoe + 2, (u) => { if (!u.dead && u.side === h.side) healUnit(u, s.healAlly); });
      break;
    }
    case 'dash': {
      const dist = s.dist || 5;
      const dx0 = h.x, dy0 = h.y;
      if (tgt){
        const dx = tgt.x - h.x, dy = tgt.y - h.y, d = hyp(dx, dy) || 1;
        const go = Math.min(dist, Math.max(0, d - (h.rng * .6)));
        h.x += dx / d * go; h.y += dy / d * go;
        abilityDmg(h, tgt, pw, s.magic);
        if (s.exec && tgt.hp / tgt.mhp < .4) abilityDmg(h, tgt, pw * s.exec * .5, s.magic);
      } else {
        h.x += -dirOf(h.side) * dist;
      }
      h.x = clamp(h.x, 1, C.LANE_LEN - 1);
      dashFx(h, dx0, dy0);
      break;
    }
    case 'heal': {
      const t = s.ally ? (lowAlly(h, s.rng || 6) || h) : h;
      healUnit(t, skVal(s.heal, r) + (s.apR || 0) * apBase(h, s));
      healFx(t.x, t.y);
      if (t !== h) linkFx(h.x, h.y, t.x, t.y, '#7fdc8a');
      break;
    }
    case 'regen': {
      addBuff(h, { t:dur, tag:'regen', hps:(skVal(s.heal, r) + (s.apR || 0) * apBase(h, s)) / dur });
      break;
    }
    case 'shield': {
      const t = s.ally ? (lowAlly(h, s.rng || 6) || h) : h;
      if (t !== h && !HEADLESS) linkFx(h.x, h.y, t.x, t.y, '#cfe6ff');
      t.shield = Math.max(t.shield, skVal(s.shield, r) + (s.apR || 0) * apBase(h, s));
      t.shT = dur || 6;
      if (s.barm && t.isHero) addBuff(t, { t:dur || 6, barm:s.barm, bmr:s.bmr || 0, tag:'fort' });
      break;
    }
    case 'buff': {
      addBuff(h, { t:dur || 5, tag:s.id, bas:s.bas || 0, bad:s.bad || 0, bms:s.bms || 0, barm:s.barm || 0,
        bmr:s.bmr || 0, bls:s.bls || 0, bcrit:s.bcrit || 0, bburn:s.bburn || 0, brng:s.brng || 0 });
      recalcHero(h);
      break;
    }
    case 'teambuff': {
      const aoe = s.aoe || 8;
      for (const a of G.sides[h.side].heroes)
        if (!a.dead && Math.abs(a.x - h.x) < aoe) addBuff(a, { t:dur, tag:s.id, bas:s.bas || 0, bad:s.bad || 0, bms:s.bms || 0, barm:s.barm || 0 });
      for (const u of teamTargets(h, aoe)){
        u.mb = { t:dur, ad:(s.bad || 0) / 40 + (s.bas || 0), ms:s.bms || 0 };
        if (!HEADLESS) linkFx(h.x, h.y, u.x, u.y, '#ffcf4d');
      }
      break;
    }
    case 'teamheal': {
      const aoe = s.aoe || 8;
      const amt = skVal(s.heal, r) + (s.apR || 0) * apBase(h, s);
      for (const a of G.sides[h.side].heroes){
        if (a.dead || Math.abs(a.x - h.x) >= aoe) continue;
        healUnit(a, amt); healFx(a.x, a.y);
        if (a !== h && !HEADLESS) linkFx(h.x, h.y, a.x, a.y, '#7fdc8a');
        if (s.shield){ a.shield = Math.max(a.shield, skVal(s.shield, r)); a.shT = 6; }
      }
      for (const u of teamTargets(h, aoe)){
        healUnit(u, amt); healFx(u.x, u.y);
        if (!HEADLESS) linkFx(h.x, h.y, u.x, u.y, '#7fdc8a');
      }
      break;
    }
    case 'dot': case 'storm': {
      const at = s.k === 'storm' ? h : (tgt || h);
      G.zones.push({ x:at.x, y:at.y, r:s.aoe, dps:skVal(s.dps, r) + (s.adR || 0) * adBase(h, s) + (s.apR || 0) * apBase(h, s),
        t:s.dur, dur:s.dur, tick:0, side:h.side, src:h, magic:!!s.magic, slow:s.slow || 0, follow:s.k === 'storm' ? h : null });
      break;
    }
    case 'chain': {
      if (!tgt) break;
      abilityDmg(h, tgt, pw, s.magic);
      chainHit(h, tgt, pw * .75, s.jumps || 2);
      break;
    }
    case 'mark': {
      if (!tgt) break;
      tgt.markT = dur; tgt.markBy = h.side; tgt.markAmp = s.amp;
      break;
    }
    case 'taunt': {
      nearby(h.x, s.aoe, (u) => {
        if (u.dead || u.side === h.side) return;
        if (hyp(u.x - h.x, u.y - h.y) > s.aoe) return;
        u.target = h; u.taunt = s.dur;
        if (s.dmg) abilityDmg(h, u, pw, s.magic);
      });
      break;
    }
    case 'summon': {
      const n = (s.count || 1) + (r - 1) * (s.nPer || 0);
      for (let i = 0; i < n; i++){
        const su = spawnUnit(h.side, s.kind, { x:h.x - dirOf(h.side) * 1.5, y:h.y + rr(-1.5, 1.5), life:s.dur, hpM:1 + h.lvl * .05, adM:1 + h.lvl * .05 });
        if (su && !HEADLESS) burstFx(su.x, su.y, '#c9a6ff', 6);
      }
      if (s.buffTeam) nearby(h.x, 9, (u) => { if (!u.dead && u.side === h.side && !u.isHero) u.mb = { t:12, ad:.15, ms:.1 }; });
      break;
    }
  }
}

/* =====================================================================
   THE EMBER HOST — the opposing hold, run by the same public actions the
   player uses. If the AI can do it, so can you.
   ===================================================================== */
// Both holds used to draw from one shared random stream, and whichever acted
// first each tick got first pick of it. Each hold now rolls its own.
function arnd(s){
  s.rs = (s.rs + 0x6D2B79F5) | 0;
  let t = Math.imul(s.rs ^ (s.rs >>> 15), 1 | s.rs);
  t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
  return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
}
const apick = (s, arr) => arr[Math.floor(arnd(s) * arr.length)];

// Indexed `AI_BUILD_PLAN[built - 2]` where `built` is how many buildings stand,
// and the branch that reads it is gated on `built < s.plot.length` — so with a
// 4x4 plot and two buildings pre-placed, the last index that can ever drive a
// build is 13. This list had SIXTEEN entries: indices 14 and 15 were dead, and
// index 14 was the second Tavern. It never once got built. Measured over 32
// holds: every one finished with exactly one Tavern, heroCap was 1 in 28 of
// them and 3 in none, and the mean peak was 1.13 heroes on the field.
//
// The dead entries are gone. Moving the second Tavern into the reachable range
// was tried three ways and REVERTED — every version bought the second hero by
// taking something else the game had only just got working:
//   drop the 5th Farm     peak heroes 1.13 -> 2.13, but holds arming a Cannon
//                         fell 5 of 12 -> 2 (heroes and Cannons want the same gold)
//   drop the 2nd Workshop peak heroes 2.00, Cannons 2 of 12
//   drop the 2nd Pit      Cannons 7 of 12, but heroes reaching an ultimate
//                         collapsed 69% -> 51% and mean level 13.0 -> 11.4,
//                         because a lost training slot shortens the whole match
// The plot is full at 16 tiles and every tile is doing work. A second Tavern
// needs a tile somebody has to give up, or heroCap has to come from LEVELLING
// the one Tavern rather than building a second.
const AI_BUILD_PLAN = ['farm','barracks','farm','pit','tavern','forge','workshop','farm','barracks','farm','pit','workshop','forge','farm'];

function aiStep(s, dt){
  s.aiT -= dt;
  if (s.aiT > 0) return;
  s.aiT = 1.4 / G.diff.ai;

  // --- jobs: keep the four piles roughly matched to what it wants to buy.
  // Arming a worker needs an IDLE one, and this loop used to shovel every idle
  // worker into a mine the instant it appeared — so the barracks starved and
  // seven minutes of play produced a single Footman out of an army of levies.
  // Hold one back when there is a barracks standing and something it can pay
  // to arm.
  // A Footman takes one worker off the piles; a Caster and a Cannon take TWO.
  // This reserve used to be a flat 1, so the second idle worker was shovelled
  // into a mine the instant it appeared and `s.workers.idle < d.need` refused
  // every Caster and every Cannon the hold ever tried to arm — at any barracks
  // level. Measured over sixteen eight-minute matches: 218 Footmen armed, zero
  // of anything else. Hold back as many as the dearest thing it could actually
  // pay for right now needs.
  const armable = Object.keys(TRAIN).filter(k =>
    TRAIN[k].barracks <= barracksLvl(s) && canPay(s, TRAIN[k].cost));
  const armNeed = barracksLvl(s) > 0 && armable.length
    ? Math.max(...armable.map(k => TRAIN[k].need)) : 0;
  // Every worker costs 20 food to train, so a hold that under-staffs the
  // fields throttles its own growth and then cannot afford a hero (45 food).
  // Traced: food sat under 35 all match while iron piled up unspent.
  const want = { wood:.28, gold:.30, iron:.18, food:.24 };
  if (s.workers.idle > armNeed){
    let bestNode = 'wood', bestGap = -9;
    for (const n of ['gold','iron','wood','food']){
      const room = nodeCap(s, n) - s.workers[n];
      if (room <= 0) continue;
      const have = s.workers[n] / Math.max(1, workerCount(s));
      const gap = want[n] - have + (s.res[n] < 60 ? .18 : 0);
      if (gap > bestGap){ bestGap = gap; bestNode = n; }
    }
    assign(s, bestNode, 1);
  }
  // --- grow the workforce
  if (workerCount(s) < 6 + Math.floor(G.t / 55) && popUsed(s) < popCap(s) - 1) trainWorker(s);
  // --- build out, in order, keeping a farm ahead of the population
  const built = s.plot.filter(Boolean).length;
  const tight = popUsed(s) > popCap(s) - 4;
  if (built < s.plot.length){
    const next = tight ? 'farm' : AI_BUILD_PLAN[Math.min(built - 2, AI_BUILD_PLAN.length - 1)] || 'farm';
    const free = s.plot.indexOf(null);
    // For most buildings a copy and a level are the same thing — bLvl SUMS the
    // levels standing — but the Caster and Cannon gate reads barracksLvl, the
    // HIGHEST level, so a second level-1 barracks unlocks nothing. Sampling
    // once a second over sixteen matches, the Host could not pay the barracks
    // upgrade 99% of the time and 99% of those were short of wood — the wood
    // the plan was spending on the duplicate. When the plan calls for
    // something that already stands, level it instead of copying it.
    const dup = next === 'barracks' && bList(s, next).find(o => o.lvl < BUILDINGS[next].maxLvl);
    if (dup && canPay(s, buildCost(next, dup.lvl + 1))) upgradeBuilding(s, dup.tile);
    else if (free >= 0 && canPay(s, buildCost(next, 1))) build(s, free, next);
  }
  // --- level the important buildings once the plot is full
  if (built >= s.plot.length - 1 && arnd(s) < .5){
    // This list only meant "priority" while the top of it was affordable. A
    // farm level is cheap and a hold has five farms, so every tick the loop
    // fell through to a farm and ate the wood in small bites: measured over
    // twelve matches it spent 741 wood levelling farms — and 423 food, for
    // population it was nowhere near using — while never once saving the 188
    // the barracks wanted for the level that unlocks Cannons. It finished at
    // level 3 in 1 match of 12.
    //
    // So: walk the list in order, and if something near the top is close
    // enough to pay for within about half a minute of digging, hold the pile
    // for it instead of spending it further down.
    const pri = ['barracks','tavern','forge','farm','workshop','pit'];
    for (const type of pri){
      const b = bList(s, type).find(o => o.lvl < BUILDINGS[type].maxLvl);
      if (!b) continue;
      const cost = buildCost(type, b.lvl + 1);
      if (canPay(s, cost)){ upgradeBuilding(s, b.tile); break; }
      if (Object.keys(cost).every(k => s.res[k] >= cost[k] ||
          cost[k] - s.res[k] <= gatherRate(s, k) * 30)) break;      // nearly there — save up
    }
  }
  // --- arm the workers
  const bl = barracksLvl(s);
  if (bl > 0){
    const roll = arnd(s);
    const order = bl >= 3 ? (roll < .45 ? ['melee','cannon','caster'] : roll < .8 ? ['cannon','caster','melee'] : ['caster','melee','cannon'])
      : bl === 2 ? (roll < .6 ? ['melee','caster'] : ['caster','melee']) : ['melee'];
    for (const t of order){
      // A Footman is always affordable, so it won every race for the pair of
      // workers the hold was banking for a Caster: measured, a Caster was
      // never once clear to arm at a one-second sample even after the tier
      // was up — idle workers blocked it 100% of the time. Leave the pair
      // alone unless there is a spare worker beyond it — and step OVER the
      // Footman rather than stopping, or the pass never reaches the Cannon
      // and the Caster it is being kept for. (This was a `break`, which is
      // why a level-3 barracks armed a Cannon in only 3 holds of 12.)
      if (TRAIN[t].need < armNeed && s.workers.idle <= armNeed) continue;
      if (!trainUnit(s, t)) break;
    }
  }
  // --- forge work
  if (bLvl(s, 'forge') > 0 && arnd(s) < .7){
    const all = [...TOWER_UPS, ...TROOP_UPS];
    const pool = all.filter(u => (TOWER_UPS.includes(u) ? s.towerUp : s.troopUp)[u.id] < upCap(s));
    // buy the best value it can actually pay for, with a little noise so two
    // holds do not shop identically
    pool.sort((a, b) => upRate(s, b.id) * (.85 + arnd(s) * .3) - upRate(s, a.id));
    for (const u of pool) if (!buyUp(s, u.id)) break;
  }
  // --- heroes
  if (s.heroes.length < heroCap(s) && canPay(s, HERO_COST)){
    const roster = ['tank','fighter','marksman','mage','assassin','support'];
    const taken = new Set(s.heroes.map(h => h.cls));
    const cls = apick(s, roster.filter(c => !taken.has(c))) || apick(s, roster);
    createHero(s, cls);
  }
  for (const h of s.heroes) if (h.pend.length) autoPick(h);
}

/* =====================================================================
   MAIN LOOP
   ===================================================================== */
function update(dt){
  // A level-up choice used to leave the match running underneath it. Measured
  // on a real page: with the choice sheet open for ten seconds, the hero lost
  // 27% of its health on desktop and 32% on a phone — and the health bar
  // printed ON the card was a snapshot from the moment it opened, so it read
  // full while the hero was dying. On a 390px screen the sheet covers the lane
  // entirely, so there was nothing to glance at either. The very first hero
  // decision a new player makes taught them that a menu is safe when it was
  // not. The board now waits while a pick is open.
  if (G.state !== 'play' || G.paused || G.held) return;
  dt = Math.min(dt, .05);
  G.dt = dt; G.t += dt;
  // Every per-side loop below swaps which hold goes first each tick: acting
  // first is a small edge that compounds into a measurable win-rate bias.
  G.frame = (G.frame || 0) + 1;
  const order = G.frame % 2 ? [1, 0] : [0, 1];
  for (const i of order){
    const s = G.sides[i];
    ecoStep(s, dt);
    if (s.ai) aiStep(s, dt);
  }
  G.waveT -= dt;
  if (G.waveT <= 0){ G.waveT = C.WAVE_PERIOD; spawnWave(); }
  rebuildGrid();
  const list = G.units.slice();
  // Acting first is a real advantage over thousands of ticks. Reversing the
  // list only alternated cleanly while it was still grouped by side, so walk
  // it once per side instead, swapping which side moves first each tick.
  for (const sd of order) for (const u of list){
    if (u.dead || u.side !== sd) continue;
    if (u.isHero) heroStep(u, dt); else unitStep(u, dt);
  }
  for (const sd of order) for (const h of G.sides[sd].heroes) if (h.dead) heroStep(h, dt);
  separate();
  for (const i of order) for (const st of G.sides[i].structs) structStep(st, dt);
  projStep(dt); zoneStep(dt);
  fxStep(dt);
  // heal-over-time buffs and expiring minion buffs
  for (const s of G.sides) for (const h of s.heroes){
    if (h.dead) continue;
    const hps = bsum(h, 'hps');
    if (hps) healUnit(h, hps * dt);
  }
  for (const u of G.units) if (u.mb){ u.mb.t -= dt; if (u.mb.t <= 0) u.mb = null; }
  pruneSel();
}

/* =====================================================================
   SOUND — everything is synthesised, so there is nothing to download and
   nothing to go stale. Silent under HEADLESS, silent until the first tap
   (browsers require a gesture), and hard-throttled so a wave-on-wave brawl
   cannot turn into a wall of noise.
   ===================================================================== */
const MUTE_KEY = 'ib_mute';
const AU = { ctx:null, master:null, noise:null, muted:false, last:{}, voices:0 };
try { AU.muted = localStorage.getItem(MUTE_KEY) === '1'; } catch (e){}

function audioStart(){
  if (HEADLESS || AU.ctx) return AU.ctx;
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return null;
  AU.ctx = new AC();
  AU.master = AU.ctx.createGain();
  AU.master.gain.value = AU.muted ? 0 : .5;
  AU.master.connect(AU.ctx.destination);
  // one shared noise buffer for every percussive sound
  const n = AU.ctx.sampleRate * .5;
  AU.noise = AU.ctx.createBuffer(1, n, AU.ctx.sampleRate);
  const d = AU.noise.getChannelData(0);
  for (let i = 0; i < n; i++) d[i] = Math.random() * 2 - 1;
  return AU.ctx;
}
function setMuted(m){
  AU.muted = m;
  try { localStorage.setItem(MUTE_KEY, m ? '1' : '0'); } catch (e){}
  if (AU.master) AU.master.gain.value = m ? 0 : .5;
}

function tone(o){
  const c = AU.ctx;
  const osc = c.createOscillator(), g = c.createGain();
  osc.type = o.type || 'sine';
  const t = c.currentTime + (o.at || 0);
  osc.frequency.setValueAtTime(o.f, t);
  if (o.f2) osc.frequency.exponentialRampToValueAtTime(Math.max(1, o.f2), t + o.dur);
  g.gain.setValueAtTime(0, t);
  g.gain.linearRampToValueAtTime(o.v, t + Math.min(.02, o.dur * .3));
  g.gain.exponentialRampToValueAtTime(.0001, t + o.dur);
  osc.connect(g); g.connect(AU.master);
  osc.start(t); osc.stop(t + o.dur + .02);
  AU.voices++;
  osc.onended = () => { AU.voices = Math.max(0, AU.voices - 1); };
}
function noiseHit(o){
  const c = AU.ctx;
  const src = c.createBufferSource(), g = c.createGain(), f = c.createBiquadFilter();
  src.buffer = AU.noise;
  f.type = o.hp ? 'highpass' : 'lowpass';
  f.frequency.value = o.cut || 900;
  const t = c.currentTime + (o.at || 0);
  g.gain.setValueAtTime(o.v, t);
  g.gain.exponentialRampToValueAtTime(.0001, t + o.dur);
  src.connect(f); f.connect(g); g.connect(AU.master);
  src.start(t); src.stop(t + o.dur + .02);
  AU.voices++;
  src.onended = () => { AU.voices = Math.max(0, AU.voices - 1); };
}

// key -> [minimum gap in seconds, player, important?]
// An important sound is never dropped by the voice cap: it is already rare by
// its own gap, and going deaf to a falling gate because six swords are
// swinging is exactly backwards.
const SFX = {
  hit:    [.055, () => noiseHit({ v:.14, dur:.05, cut:2600, hp:true })],
  hitBig: [.09,  () => { noiseHit({ v:.22, dur:.09, cut:1400 }); tone({ f:180, f2:90, dur:.09, v:.10, type:'square' }); }],
  stone:  [.10,  () => noiseHit({ v:.16, dur:.13, cut:700 })],
  die:    [.07,  () => tone({ f:340, f2:120, dur:.13, v:.10, type:'square' })],
  shot:   [.06,  () => tone({ f:900, f2:420, dur:.07, v:.06, type:'triangle' })],
  cast:   [.10,  () => { tone({ f:520, f2:1180, dur:.16, v:.09, type:'triangle' }); }],
  fall:   [.35,  () => { noiseHit({ v:.34, dur:.75, cut:420 }); tone({ f:110, f2:44, dur:.7, v:.24, type:'sine' });
                         tone({ f:70, f2:32, dur:.9, v:.18, type:'triangle', at:.05 }); }, 1],
  wave:   [1.0,  () => { tone({ f:196, dur:.34, v:.16, type:'sawtooth' }); tone({ f:262, dur:.42, v:.15, type:'sawtooth', at:.16 }); }, 1],
  level:  [.30,  () => { [523, 659, 784].forEach((f, i) => tone({ f, dur:.16, v:.11, type:'triangle', at:i * .06 })); }, 1],
  build:  [.20,  () => { tone({ f:660, dur:.10, v:.10, type:'sine' }); tone({ f:880, dur:.16, v:.09, type:'sine', at:.08 }); }, 1],
  hero:   [.40,  () => { [392, 330, 262].forEach((f, i) => tone({ f, dur:.22, v:.12, type:'sawtooth', at:i * .1 })); }, 1],
  win:    [1.0,  () => { [392, 523, 659, 784].forEach((f, i) => tone({ f, dur:.42, v:.15, type:'triangle', at:i * .13 })); }, 1],
  lose:   [1.0,  () => { [392, 311, 262, 196].forEach((f, i) => tone({ f, dur:.5, v:.15, type:'sawtooth', at:i * .15 })); }, 1],
  click:  [.03,  () => noiseHit({ v:.06, dur:.03, cut:3200, hp:true })],
  // A hero falling is the loudest thing that happens in a match and it used to
  // make no noise at all — a toast slid past and that was the whole event.
  heroDown:[.5, () => { tone({ f:330, f2:98, dur:.55, v:.17, type:'sawtooth' });
                        tone({ f:165, f2:60, dur:.7, v:.13, type:'triangle', at:.06 });
                        noiseHit({ v:.16, dur:.3, cut:900, at:.02 }); }, 1],
  // An inhibitor is not just another wall: it puts Siege Ogres on the bridge.
  inhib:  [.8,   () => { [262, 349, 523].forEach((f, i) => tone({ f, f2:f * .5, dur:.5, v:.14, type:'sawtooth', at:i * .11 }));
                         noiseHit({ v:.24, dur:.5, cut:520, at:.1 }); }, 1],
};

// worldX is optional: a sound from off the edge of the screen is not played.
function sfx(key, worldX){
  if (HEADLESS || AU.muted || !AU.ctx) return false;
  const d = SFX[key];
  if (!d) return false;
  const now = AU.ctx.currentTime;
  // If nothing has been asked for in a while the counter cannot legitimately
  // be high — reset it, so one lost onended callback cannot mute the session.
  if (now - (AU.lastAny || 0) > 1.5) AU.voices = 0;
  if ((AU.last[key] || -9) + d[0] > now) return false;
  if (!d[2] && AU.voices > 20) return false;
  if (worldX !== undefined){
    const p = (worldX - cam.x) * LS() * .96 + LW * .5;
    if (p < -140 || p > LW + 140) return false;
  }
  AU.last[key] = now; AU.lastAny = now;
  try { d[1](); } catch (e){ return false; }
  return true;
}

/* =====================================================================
   EFFECTS
   ===================================================================== */
function burstFx(x, y, col, n){
  if (HEADLESS) return;
  if (G.fx.length > 260) return;
  for (let i = 0; i < n; i++){
    const a = fxRnd() * 6.283, sp = fxRr(1, 6);
    G.fx.push({ k:'p', x, y, z:fxRr(.2, 1.2), vx:Math.cos(a) * sp, vy:Math.sin(a) * sp * .5, vz:fxRr(1, 5),
      t:fxRr(.35, .8), dur:.8, col, r:fxRr(1.4, 3.2) });
  }
}
function ringFx(x, y, r, col){ if (!HEADLESS) G.fx.push({ k:'ring', x, y, r, t:.42, dur:.42, col }); }
function boltFx(x, y, x2, y2, col){ if (!HEADLESS) G.fx.push({ k:'bolt', x, y, x2, y2, t:.22, dur:.22, col }); }
// How big a damage number is drawn, and how hard it punches in. A scratch and
// a hit that took a third of somebody printed at exactly the same size, so a
// brawl was a wall of identical digits and the one number you cared about was
// the same weight as the twenty you did not.
//
// Scaled by the FRACTION of the target it removed, which is what a player is
// actually reading. The floor matters as much as the ceiling: a gate has
// thousands of health, so every hit on it is a rounding error by fraction and
// would print unreadably small without one.
const FLOAT_SC = { min:.74, max:1.75, full:.32 };
const FLOAT_POP = .16;
function floatScale(amt, mhp){
  if (!(mhp > 0) || !(amt > 0)) return FLOAT_SC.min;
  const f = clamp(amt / (mhp * FLOAT_SC.full), 0, 1);
  return FLOAT_SC.min + (FLOAT_SC.max - FLOAT_SC.min) * f;
}
// Where a new number goes when others are still rising near it. The step and
// the window were fixed numbers, written when every damage number was the same
// size — now that a big hit prints at nearly two and a half times a scratch,
// a fixed step lets the big ones smear straight back over each other. Both
// scale with the larger of the two numbers involved.
// The step was .55 world units against a three-digit number about 2.2 world
// units wide at the standard zoom, so two numbers landing together printed
// "51" and "105" as "5105". It clears the text now.
const FLOAT_GAP = { win:2.4, step:1.15, rise:.34 };
// It also never fanned both ways. The old line read
//   ox = (Math.abs(ox) + step) * (ox > 0 ? -1 : 1)
// which looks like it alternates — but ox starts at 0, so the first step goes
// negative and every step after it reads `ox > 0` as false and goes negative
// again. Numbers marched off to the left in a line instead of spreading around
// the body they belong to.
function floatSlot(x, y, sc){
  let n = 0, s = sc;
  for (const f of G.floats){
    if (f.t < .35) continue;
    const sm = Math.max(sc, f.sc || 1);
    if (Math.abs(f.x - x) > FLOAT_GAP.win * sm || Math.abs(f.y - y) > 1.2) continue;
    n++; s = Math.max(s, f.sc || 1);
  }
  if (!n) return [0, 0];
  const k = Math.ceil(n / 2) * (n % 2 ? -1 : 1);
  return [k * FLOAT_GAP.step * s, -n * FLOAT_GAP.rise * s];
}
function addFloat(x, y, txt, col, sc){
  if (HEADLESS) return;
  if (G.floats.length > 90) G.floats.shift();
  // Three numbers landing on one body in the same tenth of a second used to
  // print on top of each other. Step each new one clear of whatever is still
  // rising near it, so a brawl reads as a column of numbers, not a smear.
  const [ox, oy] = floatSlot(x, y, sc || 1);
  G.floats.push({ x:x + ox, y:y + oy + fxRr(-.15, .15), txt, col, t:.95, dur:.95, sc:sc || 1, vy:fxRr(-.5, -.9) });
}
const CAST_COL = { dmg:'#ffa96a', heal:'#7fdc8a', buff:'#ffcf4d', cc:'#9ad8ff', move:'#bfe0ff', summon:'#c9a6ff' };
function castCol(s){ return s.magic ? '#b98bff' : (CAST_COL[s.tag] || '#ffa96a'); }

// You choose these skills, so you should be able to see them happen: the name
// of the ability rises off the hero that cast it, in the colour of its type.
/* ---------------------------------------------------------------- cast shapes
   Every skill in the game used to look like every other skill: one ring, eight
   sparks and the name floating up. There are SEVENTEEN distinct shapes of skill
   and you could not tell any of them apart on the board — the only way to know
   what a hero had just done was to read the word.

   Each shape has a picture now. All of it is drawing and nothing else: it is
   skipped whole under HEADLESS, it draws from the effects stream and never the
   simulation's, and how much of it gets made depends on how busy the frame is —
   which is precisely why it must not share a generator with the game. */
const FX_CAP = 300;
// Decoration must cost NOTHING when nobody is watching — the headless suite
// plays hundreds of matches and every spark it does not make is time it does
// not spend. But the suite also has to be able to look at what a cast draws,
// because the strict stub context is where a bad colour string gets caught.
//
// So it is off under HEADLESS and the suite opts in around the block that
// inspects it, rather than one of those two needs losing to the other.
let fxForce = false;
const fxRoom = (n) => (fxForce || !HEADLESS) && G.fx.length + n < FX_CAP;

function beamFx(x, y, x2, y2, col, w, life){
  if (!fxRoom(1)) return;
  G.fx.push({ k:'beam', x, y, x2, y2, col, w:w || 3, t:life || .22, dur:life || .22 });
}
function arcFx(x, y, ang, r, col){
  if (!fxRoom(1)) return;
  G.fx.push({ k:'arc', x, y, a:ang, r, col, t:.26, dur:.26 });
}
function waveFx(x, y, r, col, life, follow){
  if (!fxRoom(1)) return;
  G.fx.push({ k:'wave', x, y, r, col, t:life || .45, dur:life || .45, follow:follow || null });
}
function moteFx(x, y, col, n, spread){
  if (!fxRoom(n)) return;
  const sp = spread || .8;
  for (let i = 0; i < n; i++)
    G.fx.push({ k:'mote', x:x + fxRr(-sp, sp), y:y + fxRr(-sp * .6, sp * .6), z:fxRr(0, .5),
      vx:fxRr(-.25, .25), vz:fxRr(1.7, 3.4), col, r:fxRr(.7, 1.6), t:fxRr(.5, .85), dur:.85 });
}

// The gold second wave and the shake are what mark an ultimate apart from an
// ordinary cast at a glance, without anyone having to read anything.
function ultFlourish(h, r){
  waveFx(h.x, h.y, r * 1.5, '#ffe08a', .62);
  moteFx(h.x, h.y, '#ffe9a8', 8, 1.2);
  shake(1.6, h.x);
}

function castFx(h, s, tgt){
  const col = castCol(s);
  const ult = !!s.ult;
  const aoe = s.aoe || 0;
  const tx = tgt ? tgt.x : h.x, ty = tgt ? tgt.y : h.y;
  const ang = Math.atan2(ty - h.y, tx - h.x);
  const big = ult ? 1.6 : 1;
  h.castT = ult ? .5 : .32;                      // the caster itself pops
  h.castCol = ult ? '#ffe08a' : col;

  switch (s.k){
    // it goes off around the caster
    case 'nova': case 'taunt':
      waveFx(h.x, h.y, Math.max(2.2, aoe) * big, col, .5);
      burstFx(h.x, h.y, col, ult ? 16 : 10);
      break;

    // it reaches out and hits one thing
    case 'bolt': case 'mark': case 'chain':
      beamFx(h.x, h.y, tx, ty, col, ult ? 5 : 3, .2);
      burstFx(tx, ty, col, ult ? 13 : 7);
      if (aoe) waveFx(tx, ty, aoe, col, .4);
      break;

    // it swings
    case 'strike':
      arcFx(tx, ty, ang, Math.max(1.6, aoe || 1.8) * big, col);
      burstFx(tx, ty, col, ult ? 14 : 8);
      if (aoe) waveFx(tx, ty, aoe, col, .38);
      break;

    // it comes down out of the sky
    case 'volley': case 'storm': {
      const r = Math.max(2, aoe);
      waveFx(tx, ty, r, col, .55, s.k === 'storm' ? h : null);
      for (let i = 0; i < (ult ? 7 : 5); i++){
        const ox = fxRr(-r, r), oy = fxRr(-r * .6, r * .6);
        beamFx(tx + ox, ty + oy - 7, tx + ox, ty + oy, col, 2, fxRr(.16, .3));
      }
      break;
    }

    // it lingers on the ground
    case 'dot': {
      const r = Math.max(1.6, aoe || 2);
      waveFx(tx, ty, r, col, .6);
      moteFx(tx, ty, col, ult ? 10 : 6, r * .8);
      break;
    }

    // it puts something back
    case 'heal': case 'teamheal': case 'regen':
      moteFx(tx, ty, '#7fdc8a', ult ? 14 : 9, 1);
      ringFx(tx, ty, Math.max(1.6, aoe || 1.8), '#7fdc8a');
      break;

    // it wraps somebody up
    case 'buff': case 'teambuff': case 'shield':
      waveFx(h.x, h.y, Math.max(2, aoe || 2.4), col, .42);
      moteFx(h.x, h.y, col, ult ? 12 : 7, .9);
      break;

    // it arrives
    case 'summon':
      waveFx(h.x, h.y, 2.4 * big, col, .5);
      moteFx(h.x, h.y, col, ult ? 14 : 9, 1.1);
      burstFx(h.x, h.y, col, 8);
      break;

    // it moves the hero — dashFx already draws the trail, this is the kick-off
    case 'dash':
      burstFx(h.x, h.y, col, 9);
      waveFx(h.x, h.y, 1.8, col, .3);
      break;

    // it throws a chain — the projectile is the effect, so this is only the
    // shoulder going back. The snap is drawn when the chain actually bites.
    case 'hook':
      waveFx(h.x, h.y, 1.5 * big, col, .26);
      burstFx(h.x, h.y, '#d9c49a', ult ? 8 : 5);
      break;

    default:
      ringFx(h.x, h.y, aoe || 2, col);
      burstFx(h.x, h.y, col, 8);
  }

  if (ult) ultFlourish(h, Math.max(2.2, aoe || 2.4));
  if (G.floats.length < 80)
    G.floats.push({ x:h.x + fxRr(-.8, .8), y:h.y + fxRr(-.3, .3), txt:s.n.toUpperCase(), col,
      t:1.4, dur:1.4, sc:1, vy:-.55, cast:true, ult });
}
// A blur of where the hero came from, so a dash reads as movement.
// A dash is the most physical thing a hero does and it looked like five faint
// copies. It now leaves a streak along the whole path, afterimages that fade
// back along it, and a puff at both ends — so you can see WHERE FROM and WHERE
// TO, which is the entire point of a gap-closer.
function dashFx(h, x0, y0){
  if (!fxRoom(10)) return;
  const col = SIDE_COL[h.side];
  beamFx(x0, y0, h.x, h.y, col, 6, .26);
  for (let i = 1; i <= 7; i++)
    G.fx.push({ k:'ghost', x:lerp(x0, h.x, i / 8), y:lerp(y0, h.y, i / 8),
      col, t:.10 + i * .035, dur:.4, r:1 });
  waveFx(x0, y0, 1.6, col, .3);            // the ground it pushed off
  burstFx(h.x, h.y, col, 7);               // and where it arrived
}
// The moment the chain bites: a hard flash on the body, a jerk on the line,
// and dust kicked up along the path it is about to be dragged down. The chain
// itself keeps being drawn for as long as the pull lasts — see drawChains.
function hookSnapFx(h, tgt){
  if (!fxRoom(9)) return;
  burstFx(tgt.x, tgt.y, '#ffe6b0', 9);
  waveFx(tgt.x, tgt.y, 1.4, '#ffe6b0', .3);
  for (let i = 1; i <= 4; i++)
    G.fx.push({ k:'ghost', x:lerp(tgt.x, h.x, i / 6), y:lerp(tgt.y, h.y, i / 6),
      col:'#d9c49a', t:.12 + i * .04, dur:.34, r:.8 });
  shake(4, tgt.x);
}
// Who did that to whom. A heal landed on somebody four bodies away with
// nothing connecting the two, so the only way to know a support had done
// anything was to watch a health bar and guess. A line that lives for a third
// of a second answers it.
function linkFx(x, y, x2, y2, col){
  if (!fxRoom(1)) return;
  G.fx.push({ k:'link', x, y, x2, y2, col, t:.38, dur:.38 });
}

function healFx(x, y, col){
  if (HEADLESS || G.fx.length > 240) return;
  for (let i = 0; i < 6; i++)
    G.fx.push({ k:'p', x:x + fxRr(-.6, .6), y:y + fxRr(-.4, .4), z:fxRr(.3, 1),
      vx:0, vy:0, vz:fxRr(3, 5.5), t:fxRr(.4, .7), dur:.7, col:col || '#7fdc8a', r:fxRr(1, 2) });
}
function fxStep(dt){
  for (let i = G.fx.length - 1; i >= 0; i--){
    const p = G.fx[i]; p.t -= dt;
    if (p.k === 'p'){ p.x += p.vx * dt; p.y += p.vy * dt; p.z += p.vz * dt; p.vz -= 12 * dt; if (p.z < 0){ p.z = 0; p.vz *= -.35; } }
    // A mote rises and drifts instead of falling — the difference between magic
    // leaving a body and debris coming off one.
    else if (p.k === 'mote'){ p.z += p.vz * dt; p.x += p.vx * dt; p.vz *= (1 - .8 * dt); }
    // A wave sits still and grows; the renderer reads its age for the radius.
    else if (p.k === 'wave' && p.follow){ p.x = p.follow.x; p.y = p.follow.y; }
    if (p.t <= 0) G.fx.splice(i, 1);
  }
  // The pop on whoever just cast. Purely a picture — nothing reads it back, and
  // it is never hashed, so it cannot take the two machines out of step.
  for (const s of G.sides) for (const h of s.heroes) if (h.castT > 0) h.castT -= dt;
  for (let i = G.floats.length - 1; i >= 0; i--){
    const f = G.floats[i]; f.t -= dt; f.y += f.vy * dt;
    if (f.t <= 0) G.floats.splice(i, 1);
  }
  for (const z of G.zones) if (z.follow){ z.x = z.follow.x; z.y = z.follow.y; }
}
function fxToast(msg, kind){
  G.log.push({ t:G.t, msg });
  if (G.log.length > 40) G.log.shift();
  if (HEADLESS) return;
  const el = document.createElement('div');
  el.className = 'tst' + (kind ? ' ' + kind : '');
  el.textContent = msg;
  const box = document.getElementById('toast');
  box.appendChild(el);
  setTimeout(() => el.remove(), 2200);
  while (box.children.length > 3) box.firstChild.remove();
}

/* =====================================================================
   RENDERING — shared
   ===================================================================== */
const cam = { x:26, z:1, follow:true, tz:1, shake:0, sx:0, sy:0 };
let lcv, lctx, LW = 900, LH = 560;

function resize(){
  if (HEADLESS) return;
  const dpr = Math.min(window.innerWidth < 760 ? 1.6 : 2, window.devicePixelRatio || 1);
  const r = lcv.getBoundingClientRect();
  LW = Math.max(80, r.width); LH = Math.max(80, r.height);
  lcv.width = Math.round(LW * dpr); lcv.height = Math.round(LH * dpr);
  lctx = lcv.getContext('2d');
  lctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  const wasNarrow = document.body.classList.contains('narrow');
  const narrow = window.innerWidth < 760;
  document.body.classList.toggle('narrow', narrow);
  for (const el of document.querySelectorAll('#viewbtns [data-long]'))
    el.textContent = narrow ? el.dataset.short : el.dataset.long;
  if (wasNarrow !== narrow) syncUI();
}

const shade = (hex, f) => {
  const n = parseInt(hex.slice(1), 16);
  const r = clamp(Math.round(((n >> 16) & 255) * f), 0, 255);
  const g = clamp(Math.round(((n >> 8) & 255) * f), 0, 255);
  const b = clamp(Math.round((n & 255) * f), 0, 255);
  return '#' + ((1 << 24) | (r << 16) | (g << 8) | b).toString(16).slice(1);
};
function poly(c, pts, fill, stroke, lw){
  c.beginPath();
  c.moveTo(pts[0][0], pts[0][1]);
  for (let i = 1; i < pts.length; i++) c.lineTo(pts[i][0], pts[i][1]);
  c.closePath();
  if (fill){ c.fillStyle = fill; c.fill(); }
  if (stroke){ c.strokeStyle = stroke; c.lineWidth = lw || 1; c.stroke(); }
}
function ell(c, x, y, rx, ry, fill){
  c.beginPath(); c.ellipse(x, y, rx, ry, 0, 0, 6.2832); c.fillStyle = fill; c.fill();
}
// A length of chain between two points in the world. Drawn as discrete links
// with a slack sag, because one straight line reads as a laser and this is
// supposed to be iron. Purely cosmetic: nothing here touches the simulation.
function chainLine(c, x, y, z, x2, y2, z2, col){
  const a = lp(x, y, z), b = lp(x2, y2, z2);
  const dx = b[0] - a[0], dy = b[1] - a[1];
  const len = Math.sqrt(dx * dx + dy * dy);
  if (len < 1) return;
  const n = clamp(Math.round(len / Math.max(4, 6 * cam.z)), 2, 30);
  const sag = Math.min(13 * cam.z, len * .07);
  const at = (t) => [a[0] + dx * t, a[1] + dy * t + Math.sin(t * Math.PI) * sag];
  // the dark line the links hang on, so gaps between them never look like breaks
  c.strokeStyle = 'rgba(28,24,20,.55)'; c.lineWidth = Math.max(1, 2.2 * cam.z); c.lineCap = 'round';
  c.beginPath();
  for (let i = 0; i <= n; i++){ const p = at(i / n); if (i === 0) c.moveTo(p[0], p[1]); else c.lineTo(p[0], p[1]); }
  c.stroke();
  // and the links themselves: short bright bars with iron between them
  c.lineWidth = Math.max(1.4, 3.6 * cam.z);
  for (let i = 0; i < n; i++){
    const p = at(i / n), q = at((i + .62) / n);
    c.strokeStyle = i % 2 ? (col || '#d9c49a') : '#8b7d66';
    c.beginPath(); c.moveTo(p[0], p[1]); c.lineTo(q[0], q[1]); c.stroke();
  }
  c.lineCap = 'butt';
}

/* =====================================================================
   RENDERING — the bridge
   ===================================================================== */
const LS = () => 9.4 * cam.z;
// A phone got the same zoom floor as a laptop, which left the world a thin
// ribbon in a very large sky. A narrow screen starts closer in: you see less
// of the bridge at once, but you can actually read what is on it.
const ZOOM_MIN = .42, ZOOM_MAX = 2.2;
const startZoom = (w) => w < 760 ? clamp(w / 520, .72, .95) : clamp(w / 1100, .55, .95);
function lp(x, y, z){
  const S = LS();
  return [
    (x - cam.x) * S * .96 - y * S * .52 + LW * .5 + cam.sx,
    (x - cam.x) * S * .07 + y * S * .60 + LH * .60 - (z || 0) * S * .95 + cam.sy,
  ];
}
// A knock felt through the camera. Capped, and only when the hit is on screen,
// so a brawl at the far end of the world never rattles the hold you are in.
function shake(amount, worldX){
  if (HEADLESS) return;
  const p = (worldX - cam.x) * LS() * .96 + LW * .5;
  if (p < -120 || p > LW + 120) return;
  cam.shake = Math.min(14, cam.shake + amount);
}
const DECK = { top:'#938b79', top2:'#a09884', side:'#544c42', edge:'#3f3931', rail:'#7a7060' };
// The cross-section of the span, in the same units the simulation clamps
// bodies with. `track` is the strip worn down the middle by everything that
// marches over it and `kerb` is where the raised edging starts — so the two
// have to bracket C.LANE_W / 2: a track wider than the lane is worn ground
// nobody walks on, and a kerb inside it is a raised edge bodies stand on.
const DECK_XS = { track:2.4, kerb:4.9, railH:1.35 };

function drawSky(c){
  const g = c.createLinearGradient(0, 0, 0, LH);
  g.addColorStop(0, '#6f97ab'); g.addColorStop(.34, '#87a9ac'); g.addColorStop(.55, '#5e7f72'); g.addColorStop(1, '#1b2a26');
  c.fillStyle = g; c.fillRect(0, 0, LW, LH);
  // three parallax ridges receding into haze
  const bands = [
    { d:.10, y:.30, h:.26, col:'rgba(96,124,132,.55)' },
    { d:.20, y:.38, h:.24, col:'rgba(72,101,96,.68)' },
    { d:.34, y:.47, h:.22, col:'rgba(48,74,64,.85)' },
  ];
  for (const b of bands){
    c.fillStyle = b.col;
    c.beginPath();
    c.moveTo(-40, LH);
    for (let i = -1; i < 9; i++){
      const bx = ((i * 230 - cam.x * LS() * b.d) % (LW + 690) + LW + 690) % (LW + 690) - 230;
      c.lineTo(bx, LH * (b.y + b.h));
      c.lineTo(bx + 70, LH * b.y - (i % 3) * 16);
      c.lineTo(bx + 140, LH * (b.y + b.h * .55));
      c.lineTo(bx + 215, LH * (b.y + .04));
    }
    c.lineTo(LW + 60, LH); c.closePath(); c.fill();
  }
  drawClouds(c);
  // valley floor + the mist that hides how far down it goes
  const vg = c.createLinearGradient(0, LH * .55, 0, LH);
  vg.addColorStop(0, 'rgba(38,60,52,.85)'); vg.addColorStop(.5, 'rgba(20,34,32,.92)'); vg.addColorStop(1, '#0c1414');
  c.fillStyle = vg; c.fillRect(0, LH * .55, LW, LH * .45);
  for (let i = 0; i < 5; i++){
    const y = LH * (.60 + i * .07), a = .05 + .03 * Math.sin(G.t * .3 + i);
    c.fillStyle = 'rgba(200,225,230,' + a.toFixed(3) + ')';
    c.fillRect(0, y, LW, LH * .05);
  }
  drawBirds(c);
}

/* -------------------------------------------------------------- the sky
   Half of a 9:16 phone is sky. It used to be a flat gradient, so the world
   read as a thin ribbon in an empty room. Clouds and birds are laid out once
   from a fixed hash — no RNG the simulation can see — and only ever drift.  */
const SKY_SPAN = 2600;                    // one world-length of cloud, wrapped
let CLOUDS = null;
function clouds(){
  if (CLOUDS) return CLOUDS;
  CLOUDS = [];
  for (let i = 0; i < 14; i++){
    const r = hash2(i * 3.7, 11.3), r2 = hash2(i * 1.9, 47.1), r3 = hash2(i * 5.3, 7.7);
    CLOUDS.push({
      x:(i / 14 + r * .05) * SKY_SPAN,
      y:.05 + r2 * .30,                   // fraction of the canvas height
      s:.55 + r3 * 1.1,                   // size
      d:.05 + (i % 3) * .045,             // parallax depth
      a:.13 + r2 * .16,
      w:2 + Math.floor(r3 * 3),           // puffs
    });
  }
  return CLOUDS;
}
function drawClouds(c){
  const drift = G.t * 3.5;
  for (const cl of clouds()){
    let x = ((cl.x - cam.x * LS() * cl.d - drift * cl.d * 8) % SKY_SPAN + SKY_SPAN) % SKY_SPAN - 200;
    if (x < -260 || x > LW + 260) continue;
    const y = LH * cl.y, R = 26 * cl.s * (.7 + cam.z * .5);
    // one path, one fill — puffs drawn separately stack their alpha and read
    // as a row of flat discs instead of a cloud
    c.beginPath();
    for (let i = 0; i <= cl.w; i++){
      const f = 1 - Math.abs(i - cl.w / 2) / (cl.w + 1);
      c.ellipse(x + i * R * .82, y - f * R * .22, R * (.55 + f * .55), R * (.30 + f * .24), 0, 0, 6.2832);
    }
    c.fillStyle = 'rgba(236,244,246,' + cl.a.toFixed(3) + ')';
    c.fill();
  }
}
const FLOCKS = [{ y:.20, sp:11, ph:0 }, { y:.27, sp:8, ph:.45 }, { y:.16, sp:14, ph:.78 }];
function drawBirds(c){
  c.strokeStyle = 'rgba(30,44,48,.42)';
  c.lineWidth = Math.max(1, 1.2 * cam.z);
  for (let f = 0; f < FLOCKS.length; f++){
    const fl = FLOCKS[f];
    const span = LW + 360;
    const x0 = (((G.t * fl.sp + fl.ph * span) % span) + span) % span - 180;
    for (let i = 0; i < 3; i++){
      const x = x0 - i * 15, y = LH * fl.y + Math.sin(G.t * .6 + f + i) * 5 + i * 7;
      if (x < -30 || x > LW + 30) continue;
      const w = 4 + Math.sin(G.t * 5 + i + f) * 2.2;      // wingbeat
      c.beginPath();
      c.moveTo(x - 5, y); c.quadraticCurveTo(x - 2, y - w, x, y);
      c.quadraticCurveTo(x + 2, y - w, x + 5, y);
      c.stroke();
    }
  }
}

function drawDeck(c){
  const W = C.LANE_W / 2 + .6;
  const D = DECK_XS, seg = 4;
  for (let x = 0; x < C.LANE_LEN; x += seg){
    const x2 = Math.min(C.LANE_LEN, x + seg);
    const a = lp(x, -W), b = lp(x2, -W), d = lp(x2, W), e = lp(x, W);
    if (Math.max(a[0], b[0]) < -80 || Math.min(a[0], b[0]) > LW + 80) continue;
    const i = Math.floor(x / seg);
    // The lane you spend the whole match fighting on was two tones alternating
    // every four units, which at any distance is a stripe. The courses vary
    // per bay off the same fixed hash the countryside uses, so it reads as
    // stone somebody laid rather than a repeat.
    const r = hash2(i * 3.1, 5.7);
    poly(c, [a, b, d, e], shade(i % 2 ? DECK.top : DECK.top2, .94 + r * .12));
    // the track worn down the middle by everything that has marched over it
    const t0 = lp(x, -D.track), t1 = lp(x2, -D.track), t2 = lp(x2, D.track), t3 = lp(x, D.track);
    poly(c, [t0, t1, t2, t3], shade(DECK.top, .88 + hash2(i * 1.7, 9.3) * .06));
    // kerbs, outside the walkable lane so nothing ever stands on them
    for (const s of [-1, 1]){
      const k0 = lp(x, s * D.kerb), k1 = lp(x2, s * D.kerb), k2 = lp(x2, s * W), k3 = lp(x, s * W);
      poly(c, [k0, k1, k2, k3], s < 0 ? shade(DECK.top2, 1.06) : shade(DECK.top2, .86));
    }
    // underside so the bridge reads as stone with weight
    const a2 = lp(x, W, -1.6), b2 = lp(x2, W, -1.6);
    poly(c, [e, d, b2, a2], DECK.side);
    poly(c, [a, b, lp(x2, -W, -1.1), lp(x, -W, -1.1)], DECK.edge);
    // joints: one at every bay, a finer one halfway across it
    c.strokeStyle = 'rgba(40,36,30,.38)'; c.lineWidth = 1;
    c.beginPath(); c.moveTo(b[0], b[1]); c.lineTo(d[0], d[1]); c.stroke();
    const h0 = lp(x + seg / 2, -W), h1 = lp(x + seg / 2, W);
    c.strokeStyle = 'rgba(40,36,30,.16)';
    c.beginPath(); c.moveTo(h0[0], h0[1]); c.lineTo(h1[0], h1[1]); c.stroke();
  }
  // railings: posts with a capped top, a top rail and a lower one
  for (const side of [-1, 1]){
    const y = side * W;
    for (let x = 0; x <= C.LANE_LEN; x += 4){
      const p0 = lp(x, y), p1 = lp(x, y, D.railH);
      if (p0[0] < -40 || p0[0] > LW + 40) continue;
      c.strokeStyle = DECK.rail; c.lineWidth = Math.max(1, 2.6 * cam.z);
      c.beginPath(); c.moveTo(p0[0], p0[1]); c.lineTo(p1[0], p1[1]); c.stroke();
      c.fillStyle = shade(DECK.rail, 1.3);
      c.fillRect(p1[0] - 2 * cam.z, p1[1] - 2 * cam.z, 4 * cam.z, 2.4 * cam.z);
      const xn = Math.min(C.LANE_LEN, x + 4);
      const q = lp(xn, y, D.railH), qm = lp(xn, y, D.railH * .48), pm = lp(x, y, D.railH * .48);
      c.strokeStyle = shade(DECK.rail, 1.15); c.lineWidth = Math.max(1, 2.2 * cam.z);
      c.beginPath(); c.moveTo(p1[0], p1[1]); c.lineTo(q[0], q[1]); c.stroke();
      c.strokeStyle = shade(DECK.rail, .82); c.lineWidth = Math.max(1, 1.6 * cam.z);
      c.beginPath(); c.moveTo(pm[0], pm[1]); c.lineTo(qm[0], qm[1]); c.stroke();
    }
  }
  // Abutments: the span has to visibly land ON the rock at both ends, or the
  // deck just disappears into the cliff face.
  // It was three flat quads and five faint stripes: a brown box the width of
  // the span, sitting at both ends of the bridge with nothing on it. This is
  // masonry taking the thrust of an arch, so it batters inward as it goes down
  // and it is laid in courses. The taper is a pair of named functions rather
  // than arithmetic inline, so a test can prove it leans IN — a batter that
  // went the other way would put the whole block on an overhang.
  for (const i of [0, 1]){
    const bxx = i === 0 ? 0 : C.LANE_LEN;
    const d = i === 0 ? 1 : -1;
    const a0 = lp(bxx - d * 5, -W), a1 = lp(bxx + d * 5, -W), a2 = lp(bxx + d * 5, W), a3 = lp(bxx - d * 5, W);
    if (a0[0] < -220 || a0[0] > LW + 220) continue;
    for (let k = 0; k < AB_N; k++){
      const t0 = k / AB_N, t1 = (k + 1) / AB_N;
      const z0 = AB_DZ * t0, z1 = AB_DZ * t1;
      const h0 = abHw(t0), h1 = abHw(t1), y0 = abY(t0), y1 = abY(t1);
      const dim = 1 - t0 * .24;                       // it loses light as it falls
      poly(c, [lp(bxx - d * h0, y0, z0), lp(bxx + d * h0, y0, z0),
               lp(bxx + d * h1, y1, z1), lp(bxx - d * h1, y1, z1)],
        shade(k % 2 ? '#6a6254' : '#5d5648', dim));
      poly(c, [lp(bxx + d * h0, -W, z0), lp(bxx + d * h0, y0, z0),
               lp(bxx + d * h1, y1, z1), lp(bxx + d * h1, -W, z1)],
        shade(k % 2 ? '#544d41' : '#4a4438', dim));
    }
    // individual stones picked out of the courses, deterministic per end
    c.globalAlpha = .22;
    for (let k = 0; k < 9; k++){
      const r = hash2(k * 5.3 + i * 41, 9.1), t = (k % AB_N) / AB_N;
