    if (r < .16){                                     // tree
      ell(c, p[0], p[1] + 2, 9 * s, 4 * s, 'rgba(0,0,0,.20)');
      c.fillStyle = '#57431f'; c.fillRect(p[0] - 1.6 * s, p[1] - 9 * s, 3.2 * s, 9 * s);
      poly(c, [[p[0] - 9 * s, p[1] - 7 * s], [p[0], p[1] - 26 * s], [p[0] + 9 * s, p[1] - 7 * s]], r < .08 ? '#3f7a3a' : '#4b8c42');
      poly(c, [[p[0] - 6 * s, p[1] - 14 * s], [p[0], p[1] - 30 * s], [p[0] + 6 * s, p[1] - 14 * s]], '#57a04c');
    } else if (r < .26){                              // boulder
      ell(c, p[0], p[1] + 1, 8 * s, 3.5 * s, 'rgba(0,0,0,.18)');
      poly(c, [[p[0] - 8 * s, p[1]], [p[0] - 4 * s, p[1] - 7 * s], [p[0] + 4 * s, p[1] - 8 * s], [p[0] + 8 * s, p[1]]], '#7d7f77');
      poly(c, [[p[0] - 4 * s, p[1] - 7 * s], [p[0] + 4 * s, p[1] - 8 * s], [p[0] + 2 * s, p[1] - 3 * s], [p[0] - 3 * s, p[1] - 3 * s]], '#93958c');
    } else if (r < .34){                              // shrub
      ell(c, p[0], p[1] - 3 * s, 7 * s, 5 * s, '#3f6f38');
      ell(c, p[0] - 3 * s, p[1] - 5 * s, 4 * s, 3.5 * s, '#4b8542');
    } else {                                          // grass tuft
      c.strokeStyle = 'rgba(150,190,120,.55)'; c.lineWidth = 1.2;
      for (let i = -1; i <= 1; i++){
        c.beginPath(); c.moveTo(p[0] + i * 3 * s, p[1]); c.lineTo(p[0] + i * 4.5 * s, p[1] - 6 * s); c.stroke();
      }
    }
  }
}

// The mesa your hold stands on: grass on top, rock walls falling into the
// chasm on every side you can actually see.
const PLAT = { far:-54, near:38, back:48 };
function drawPlateau(c){
  const d = holdSide === 0 ? 1 : -1;
  const inner = holdSide === 0 ? 3 : C.LANE_LEN - 3;         // where it meets the bridge
  const outer = inner - d * (PLAT.back + 34);
  const F = PLAT.far, N = PLAT.near;
  const e = (x, y, z) => lp(x, y, z);
  const DROP = 46;
  // rock walls first, so the grass caps them cleanly
  poly(c, [e(outer, N), e(inner, N), e(inner, N, -DROP), e(outer, N, -DROP)], '#4a4038');
  poly(c, [e(outer, N, -DROP * .45), e(inner, N, -DROP * .45), e(inner, N, -DROP), e(outer, N, -DROP)], '#39322b');
  poly(c, [e(inner, F), e(inner, N), e(inner, N, -DROP), e(inner, F, -DROP)], '#40382e');
  poly(c, [e(inner, F, -DROP * .4), e(inner, N, -DROP * .4), e(inner, N, -DROP), e(inner, F, -DROP)], '#2f2922');
  poly(c, [e(outer, F), e(outer, N), e(outer, N, -DROP), e(outer, F, -DROP)], '#453c33');
  // strata across the face
  c.globalAlpha = .35;
  for (let i = 1; i < 4; i++){
    const z = -DROP * (i / 4);
    poly(c, [e(outer, N, z), e(inner, N, z), e(inner, N, z - 1.6), e(outer, N, z - 1.6)], '#6a5c4c');
  }
  c.globalAlpha = 1;
  // and the bottom of the cliff dissolving into the dark of the chasm
  for (let i = 0; i < 3; i++){
    const z0 = -DROP * (.55 + i * .15), z1 = z0 - DROP * .15;
    c.globalAlpha = .22 + i * .26;
    poly(c, [e(outer, N, z0), e(inner, N, z0), e(inner, N, z1), e(outer, N, z1)], '#0c1414');
    poly(c, [e(inner, F, z0), e(inner, N, z0), e(inner, N, z1), e(inner, F, z1)], '#0c1414');
  }
  c.globalAlpha = 1;
  // grass top
  poly(c, [e(outer, F), e(inner, F), e(inner, N), e(outer, N)], '#4c7040');
  c.globalAlpha = .35;
  poly(c, [e(outer, N - 8), e(inner, N - 8), e(inner, N), e(outer, N)], '#3d5c33');
  poly(c, [e(inner - d * 9, F), e(inner, F), e(inner, N), e(inner - d * 9, N)], '#43663a');
  c.globalAlpha = 1;
  // the far edge fades into the valley haze instead of ending on a hard line
  for (let i = 0; i < 3; i++){
    c.globalAlpha = .15 - i * .045;
    poly(c, [e(outer, F + i * 4), e(inner, F + i * 4), e(inner, F + i * 4 + 4), e(outer, F + i * 4 + 4)], '#8ea9ac');
  }
  c.globalAlpha = 1;
  // the road out to the gates
  c.globalAlpha = .5;
  poly(c, [e(inner, -5), e(inner - d * 30, -5), e(inner - d * 30, 5), e(inner, 5)], '#7d6a44');
  c.globalAlpha = 1;
}

// Is any part of this hold's mesa on screen? Both mesas are ~80 world units
// wide, so drawing the far one while you watch the fight is pure fill-rate.
function holdOnScreen(side){
  const inner = side === 0 ? 3 : C.LANE_LEN - 3;
  const outer = inner - (side === 0 ? 1 : -1) * (PLAT.back + 34);
  const a = lp(Math.min(inner, outer), PLAT.near)[0], b = lp(Math.max(inner, outer), PLAT.far)[0];
  return Math.max(a, b) > -80 && Math.min(a, b) < LW + 80;
}

function drawHold(c, side){
  if (!holdOnScreen(side)) return;
  holdSide = side;
  const fog = side !== 0;
  drawPlateau(c);
  drawGround(c);
  const s = G.sides[side];
  for (let t = 0; t < s.plot.length; t++){
    const gx = tileGX(t), gy = tileGY(t);
    const hot = !fog && t === sel.tile && !sel.node;
    drawTile(c, gx, gy, s.plot[t] ? '#4d4739' : (hot ? 'rgba(78,163,255,.30)' : 'rgba(46,52,40,.55)'),
      hot ? '#4ea3ff' : 'rgba(0,0,0,.35)');
    if (!s.plot[t] && !fog){
      const p = bp(gx, gy, .12);
      c.fillStyle = hot ? '#9ad0ff' : 'rgba(200,215,190,.35)';
      c.font = 'bold ' + Math.round(15 * bu()) + 'px system-ui';
      c.textAlign = 'center'; c.textBaseline = 'middle';
      c.fillText('+', p[0], p[1]); c.textBaseline = 'alphabetic';
    }
  }
  if (!fog && sel.node && NODES[sel.node]){
    const q = bp(NODES[sel.node].gx, NODES[sel.node].gy);
    c.strokeStyle = '#4ea3ff'; c.lineWidth = Math.max(1.5, 2.4 * cam.z);
    c.beginPath(); c.ellipse(q[0], q[1], BSC * .62, BSC * .32, 0, 0, 6.2832); c.stroke();
  }
  const items = [];
  items.push({ y:bp(KEEP.gx, KEEP.gy)[1], f:() => drawKeep(c) });
  for (const k in NODES) items.push({ y:bp(NODES[k].gx, NODES[k].gy)[1], f:() => drawNode(c, k) });
  for (const b of s.plot) if (b) items.push({ y:bp(tileGX(b.tile), tileGY(b.tile))[1], f:() => drawBuilding(c, b) });
  items.sort((a, b) => a.y - b.y);
  for (const it of items) it.f();
  if (!fog){
    const farms = bList(s, 'farm');
    const nf = Math.min(s.workers.food, fieldSlots(s));
    for (let i = 0; i < nf && farms.length; i++){
      const f = farms[i % farms.length];
      const a = G.t * .5 + i * 1.7;
      const q = bp(tileGX(f.tile) + Math.cos(a) * .34, tileGY(f.tile) + .1 + Math.sin(a) * .3, .05);
      drawWorkerFig(c, q[0], q[1], '#7fdc8a', (Math.sin(a) > 0), .85);
    }
  }
  // Their hold reads as distant through the alpha above. It used to also get a
  // full-height translucent wash the width of their mesa — 8ms of fill-rate a
  // frame, most of it over empty sky.
  c.globalAlpha = 1;
  holdSide = 0;
}

/* ------------------------------------------------------------------ camera + frame */
// The attract battle behind the menu is the first thing anybody sees, and it
// used to sit at one fixed wide zoom with the fighting a few pixels tall in
// the middle of the panel. It sweeps the length of the world now — hold,
// bridge, their gates and back — breathing in and out as it goes.
function demoCam(dt){
  const k = Math.sin(G.t * .085) * .5 + .5;
  const ease = k * k * (3 - 2 * k);
  cam.x = lerp(cam.x, lerp(HOLD_X + 4, C.LANE_LEN + 6, ease), 1 - Math.pow(.25, dt));
  cam.tz = clamp(LW / 1500, .62, 1.05) * (1 + Math.sin(G.t * .13) * .07);
}

function camStep(dt){
  if (G.demo && G.state === 'play'){ demoCam(dt); }
  else if (cam.follow){
    let fx = null;
    const mine = G.sides[0].heroes.filter(h => !h.dead);
    if (mine.length) fx = mine.reduce((a, h) => a + h.x, 0) / mine.length;
    else fx = frontlineX(0);
    cam.x = lerp(cam.x, clamp(fx, CAM_MIN, CAM_MAX), 1 - Math.pow(.02, dt));
  }
  cam.z = lerp(cam.z, cam.tz, 1 - Math.pow(.005, dt));
  if (cam.shake > 0){
    cam.shake = Math.max(0, cam.shake - dt * 26);
    const a = G.t * 47;
    cam.sx = Math.sin(a) * cam.shake; cam.sy = Math.cos(a * 1.7) * cam.shake * .6;
  } else { cam.sx = 0; cam.sy = 0; }
}

const CAM_MIN = HOLD_X - 26, CAM_MAX = C.LANE_LEN - HOLD_X + 26;
function draw(){
  const c = lctx;
  if (!c) return;
  BSC = LS() * TILE;
  c.save();
  drawSky(c);
  drawHold(c, 0);
  drawHold(c, 1);
  drawEnds(c);
  drawDeck(c);
  drawLane(c);
  if (sel.struct && !sel.struct.dead){
    const q = lp(sel.struct.x, sel.struct.y);
    c.strokeStyle = '#ffcf4d'; c.lineWidth = Math.max(1.5, 2.2 * cam.z);
    c.beginPath(); c.ellipse(q[0], q[1], (sel.struct.key === 'gate' ? 52 : 20) * cam.z, 11 * cam.z, 0, 0, 6.2832);
    c.stroke();
  }
  if (sel.unit && !sel.unit.dead){
    const q = lp(sel.unit.x, sel.unit.y);
    c.strokeStyle = '#ffcf4d'; c.lineWidth = Math.max(1.2, 1.8 * cam.z);
    c.beginPath(); c.ellipse(q[0], q[1], 9 * cam.z, 4.5 * cam.z, 0, 0, 6.2832); c.stroke();
  }
  flushLabels(c);
  drawMinimap(c);
  c.restore();
}

const $ = (id) => document.getElementById(id);
const RES_CLASS = { gold:'g', iron:'i', wood:'w', food:'f' };
const RES_ICON = { gold:'🪙', iron:'⛏️', wood:'🪵', food:'🌾' };

function costHtml(cost){
  const s = G.sides[0];
  return '<span class="cost">' + Object.keys(cost).map(k =>
    '<i class="' + RES_CLASS[k] + (s.res[k] < cost[k] ? ' bad' : '') + '">' + RES_ICON[k] + cost[k] + '</i>'
  ).join(' ') + '</span>';
}
function fmt(n){ return n >= 1000 ? (n / 1000).toFixed(1) + 'k' : String(Math.floor(n)); }

// What one job actually pays, per second, right now. The HUD ticker and the
// war report both read this, so they cannot drift apart.
function gatherRate(s, k){
  return Math.min(s.workers[k], nodeCap(s, k)) * nodeRate(s, k) * gatherMul(s);
}
const laneArmy = (side) => G.units.filter(u => !u.dead && !u.isHero && u.side === side).length;

function syncHud(){
  const s = G.sides[0];
  for (const k of ['gold','iron','wood','food']){
    const el = $('r' + k[0].toUpperCase() + k.slice(1));
    if (!el) continue;
    el.querySelector('b').textContent = fmt(s.res[k]);
    const rate = gatherRate(s, k);
    el.querySelector('.rate').textContent = rate > 0 ? '+' + rate.toFixed(1) : '';
  }
  const pop = $('rPop');
  pop.querySelector('b').textContent = popUsed(s) + '/' + popCap(s);
  pop.classList.toggle('full', popUsed(s) >= popCap(s));
  const wb = $('waveBox');
  wb.querySelector('b').textContent = G.wave;
  $('waveT').textContent = Math.floor(G.waveT / 60) + ':' + String(Math.floor(G.waveT % 60)).padStart(2, '0');
}

      (!maxed && canPay(s, cost) ? '' : ' disabled') + '><span class="t">' +
      (maxed ? 'Fully dug' : 'Dig deeper — level ' + (lv + 1)) + '</span><span class="c">' +
      (maxed ? 'at the bottom' : costHtml(cost)) + '</span></button>' +
      '<button class="sq" data-act="job" data-node="' + sel.node + '" data-d="-1"' + (s.workers[sel.node] ? '' : ' disabled') + '>−</button>' +
      '<button class="sq" data-act="job" data-node="' + sel.node + '" data-d="1"' +
      (s.workers.idle && s.workers[sel.node] < nodeCap(s, sel.node) ? '' : ' disabled') + '>+</button>' +
      '</div>';
  } else if (sel.tile >= 0 && !b){
    h += '<div class="ptitle">Build on plot ' + (sel.tile + 1) + '</div><div class="pgrid">';
    for (const t of BUILD_ORDER){
      const cost = buildCost(t, 1);
      h += '<button class="abtn" data-act="build" data-type="' + t + '"' + (canPay(s, cost) ? '' : ' disabled') + '>' +
        '<span class="t">' + BUILDINGS[t].n + '</span><span class="c">' + costHtml(cost) + '</span></button>';
    }
    h += '</div>';
  } else if (b){
    const B = BUILDINGS[b.type];
    h += '<div class="ptitle">' + B.n + ' — level ' + b.lvl + '</div>' +
      '<div style="font-size:11px;color:var(--dim);max-width:250px">' + B.d + '</div><div class="prow">';
    if (b.lvl < B.maxLvl){
      const cost = buildCost(b.type, b.lvl + 1);
      h += '<button class="abtn" data-act="upgrade"' + (canPay(s, cost) ? '' : ' disabled') + '>' +
        '<span class="t">Upgrade to Lv ' + (b.lvl + 1) + '</span><span class="c">' + costHtml(cost) + '</span></button>';
    } else h += '<div class="job"><span class="nm">Fully upgraded.</span></div>';
    h += '</div>';
  } else {
    h += '<div class="ptitle">Your hold</div><div style="font-size:12px;color:var(--dim);max-width:250px;line-height:1.5">' +
      'Click a plot to build, a building to upgrade it, or a mine to dig it deeper. Drag to look around, pinch or scroll to zoom.</div>';
    h += '<div class="ptitle" style="margin-top:8px">On the bridge</div>' +
      '<div class="insp note" style="margin-top:2px">' + foeWarning() + '</div>';
  }
  sec.sel = h;

  if (bLvl(s, 'forge') > 0){
    h = '<div class="ptitle">Forge — rank cap ' + upCap(s) + '</div><div class="pgrid">';
    for (const u of [...TOWER_UPS, ...TROOP_UPS]){
      const bag = TOWER_UPS.includes(u) ? s.towerUp : s.troopUp;
      const lv = bag[u.id], maxed = lv >= upCap(s);
      const cost = upCostFor(u, lv);
      h += '<button class="abtn" data-act="up" data-up="' + u.id + '"' + (!maxed && canPay(s, cost) ? '' : ' disabled') + '>' +
        '<span class="t">' + u.n + ' <span style="color:var(--gold)">' + lv + '/' + upCap(s) + '</span></span>' +
        '<span class="c">' + (maxed ? 'at the cap' : costHtml(cost)) + '</span></button>';
    }
    sec.forge = h + '</div>';
  }

  sec.heroes = '<div class="ptitle">Heroes</div><div id="heroBar">' + heroBarHtml() + '</div>';

  const order = ['jobs','train','sel','heroes','forge'].filter(k => sec[k] !== undefined);
  if (!narrow)
    return order.map(k => '<div class="dsec' + (k === 'sel' ? ' grow' : '') + '">' + sec[k] + '</div>').join('');

  // Narrow: one section at a time behind tabs, so nothing needs a sideways scroll.
  if (!sec[dockTab]) dockTab = 'jobs';
  const label = { jobs:'JOBS', train:'TRAIN', sel:'BUILD', heroes:'HEROES', forge:'FORGE' };
  const alert = { sel:sel.tile >= 0 || !!sel.node, heroes:s.heroes.some(x => x.pend.length) };
  const tabs = order.map(k => '<button class="dtab' + (k === dockTab ? ' on' : '') + '" data-tab="' + k + '">' +
    label[k] + (alert[k] && k !== dockTab ? '<span class="dot"></span>' : '') + '</button>').join('');
  return '<div class="dtabs">' + tabs + '</div><div class="dsec">' + sec[dockTab] + '</div>';
}

// The build, at a glance: one pip per skill with its rank, dimmed and filling
// back up while it is on cooldown. You pick these; you should see them work.
function skillPipsHtml(h){
  if (!h.skills.length) return '<div class="pips3"><span class="pip empty">no skills yet</span></div>';
  return '<div class="pips3">' + h.skills.map(sk => {
    const d = SKILL[sk.id];
    const cd = d.cd * (1 - h.cdr - bsum(h, 'bcdr'));
    const rem = clamp(sk.cdT / Math.max(.1, cd), 0, 1);
    const col = castCol(d);
    return '<span class="pip' + (sk.ult ? ' ult' : '') + (rem > 0 ? ' cool' : '') + '" title="' +
      d.n + ' — rank ' + sk.rank + '" style="border-color:' + col + '55">' +
      '<i style="height:' + Math.round(rem * 100) + '%;background:' + col + '44"></i>' +
      '<b>' + d.n.replace(/[^A-Za-z]/g, '').slice(0, 2) + '</b>' +
      '<u>' + sk.rank + '</u></span>';
  }).join('') + '</div>';
}

function heroBarHtml(){
  const s = G.sides[0];
  let h = '';
  for (const hero of s.heroes){
    const need = xpNeed(hero.lvl);
    h += '<button class="hcard' + (hero.dead ? ' dead' : '') + '" data-hero="' + hero.id + '">' +
      (hero.pend.length ? '<span class="badge">' + hero.pend.length + '</span>' : '') +
      '<div class="hn">' + hero.name + '<span class="hl">Lv ' + hero.lvl + '</span></div>' +
      '<div class="hc">' + CLS[hero.cls].name + (hero.dead ? ' · down ' + Math.ceil(hero.respawnT) + 's' : '') + '</div>' +
      '<div class="bar hp"><i style="width:' + Math.round(clamp(hero.hp / hero.mhp, 0, 1) * 100) + '%"></i></div>' +
      '<div class="bar mp"><i style="width:' + Math.round(clamp(hero.mana / hero.mmana, 0, 1) * 100) + '%"></i></div>' +
      '<div class="bar xp"><i style="width:' + Math.round(clamp(hero.xp / need, 0, 1) * 100) + '%"></i></div>' +
      skillPipsHtml(hero) +
      '</button>';
  }
  const cap = heroCap(s);
  if (s.heroes.length < cap)
    h += '<button class="hnew" data-act="newhero"' + (canPay(s, HERO_COST) ? '' : ' disabled') + '>＋ Forge Hero<br><span style="font-size:10px">' +
      Object.keys(HERO_COST).map(k => RES_ICON[k] + HERO_COST[k]).join(' ') + '</span></button>';
  else if (cap === 0)
    h += '<button class="hnew" disabled>Build a<br>Hero Factory</button>';
  return h;
}

// What a decent player would do next. Purely advisory — it never acts for you,
// and it goes quiet once the hold is running itself.
function adviceFor(s){
  const bl = barracksLvl(s);
  // Sampled once a second across eight twelve-minute matches, this bar spent
  // 40% of the whole match on one line — 'Every worker is busy, so there is
  // nobody to arm. Train one more.' — because it never looked at what was
  // already in the training queue, so it kept asking for a worker while three
  // were on the way. And 'Build a Hero Factory' held it for an unbroken 152
  // seconds, because it repeated an instruction the hold could not yet pay
  // for and gave no sign of progress toward it.
  //
  // Two rules now: never ask for something already queued, and never ask for
  // something unaffordable without naming what is missing.
  const queued = (type) => s.trainQ.some(q => q.type === type);
  const shortOf = (cost) => {
    const k = ['gold','iron','wood','food']
      .filter(x => (cost[x] || 0) > s.res[x])
      .sort((a, b) => (cost[b] - s.res[b]) - (cost[a] - s.res[a]))[0];
    return k ? { k, n:Math.ceil(cost[k] - s.res[k]) } : null;
  };
  // 'Build X' when you can pay, 'X needs N more wood' when you cannot, so the
  // line moves as the pile fills instead of sitting there for two minutes.
  const buildAdvice = (type, blurb) => {
    const miss = shortOf(buildCost(type, 1));
    return { tab:'sel', txt:miss
      ? BUILDINGS[type].n + ': ' + miss.n + ' more ' + miss.k + ' and you can put one up.'
      : blurb };
  };
  // Arming a fighter eats an idle worker, so once a barracks stands, keep one
  // spare rather than telling you to staff every job and then to arm nobody.
  const spare = bl > 0 ? 1 : 0;
  const idleJob = ['gold','wood','iron','food'].find(k => s.workers[k] < nodeCap(s, k));
  if (s.workers.idle > spare && idleJob){
    const n = s.workers.idle - spare;
    return { tab:'jobs', txt:n + ' worker' + (n > 1 ? 's are' : ' is') + ' standing around. Put ' +
      (n > 1 ? 'them' : 'one') + ' on ' + idleJob + '.' };
  }
  if (popUsed(s) >= popCap(s) - 1)
    return buildAdvice('farm', 'Population is full at ' + popCap(s) + '. Build a Farm on an empty plot.');
  if (bl === 0)
    return buildAdvice('barracks', 'Nothing is armed yet. Build a Barracks to turn workers into fighters.');
  const pend = s.heroes.find(h => h.pend.length);
  if (pend) return { tab:'heroes', txt:pend.name + ' has a choice waiting — tap the hero card.' };
  if (heroCap(s) === 0)
    return buildAdvice('tavern', 'Build a Hero Factory. Heroes fight on their own, and they carry a push.');
  if (s.heroes.length < heroCap(s) && canPay(s, HERO_COST))
    return { tab:'heroes', txt:'You can afford another hero. Forge one.' };
  const armable = Object.keys(TRAIN).filter(k => bl >= TRAIN[k].barracks && canPay(s, TRAIN[k].cost));
  const mustering = s.muster.length > 0 || s.trainQ.some(q => q.type !== 'worker');
  if (!mustering){
    if (s.workers.idle > 0 && armable.length)
      return { tab:'train', txt:'Nothing is mustering. Arm a ' + TRAIN[armable[0]].n +
        ' before wave ' + (G.wave + 1) + ' leaves.' };
    // ...unless one is already on the way, which is what made this the single
    // most-repeated line in the game.
    if (s.workers.idle === 0 && popUsed(s) < popCap(s) && !queued('worker'))
      return { tab:'train', txt:'Every worker is busy, so there is nobody to arm. Train one more.' };
    if (armable.length === 0)
      return { tab:'jobs', txt:'You cannot afford a fighter. Put more workers on iron and wood.' };
  }
  if (bLvl(s, 'forge') === 0 && s.res.iron > 120)
    return buildAdvice('forge', 'You have iron spare. A Forge unlocks turret and minion upgrades.');
  if (workerCount(s) < 10 && popUsed(s) < popCap(s) - 1 && !queued('worker'))
    return { tab:'train', txt:'More workers means more of everything. Train another.' };
  return null;
}

let uiT = 0, saveT = 0;
function syncAdvice(){
  const el = $('advice');
  if (!el) return;
  const a = (G.state === 'play' && !G.demo) ? adviceFor(G.sides[0]) : null;
  el.classList.toggle('hide', !a);
  if (a){ el.querySelector('.at').textContent = a.txt; el.dataset.tab = a.tab; }
}

// A selection can go stale on its own — the minion you were reading about
// takes an arrow. Logic, not rendering, so it runs headless too.
function pruneSel(){
  if (sel.unit && sel.unit.dead) sel.unit = null;
}
function syncUI(){
  if (HEADLESS || !G.sides.length) return;      // resize can fire before the first match exists
  syncHud();
  $('dock').innerHTML = dockHtml();
  syncAdvice();
}
function uiTick(dt){
  uiT -= dt;
  if (uiT <= 0){ uiT = .22; syncUI(); }
  saveT -= dt;
  if (saveT <= 0){ saveT = 10; saveMatch(); }
}

const mmss = (t) => Math.floor(t / 60) + ':' + String(Math.floor(t % 60)).padStart(2, '0');

function showHeroCreate(){
  openModal(
    '<h2>Forge a hero</h2><p class="sub">Pick a class. You choose a passive right away, a skill at levels 3, 6 and 9, an ultimate at 12, then a rank every three levels after.</p>' +
    '<div class="picks">' + CLASSES.map(c =>
      '<button class="pick" data-act="mkhero" data-cls="' + c.id + '"><div class="pk">' + c.id + '</div>' +
      '<div class="pt">' + c.name + '</div><div class="pd">' + c.blurb + '</div>' +
      '<div class="pm">' + Math.round(c.b.hp) + ' hp · ' + Math.round(c.b.ad) + ' ad · ' +

function optCard(h, kind, id, i){
  if (kind === 'passive'){
    const p = PASS[id];
    return '<button class="pick" data-act="pick" data-i="' + i + '"><div class="pk">passive</div>' +
      '<div class="pt">' + p.n + '</div><div class="pd">' + p.d + '</div></button>';
  }
  if (kind === 'rank'){
    if (id.startsWith('P:')){
      const p = PASS[id.slice(2)];
      return '<button class="pick" data-act="pick" data-i="' + i + '"><div class="pk">rank ' + (h.passRank + 1) + '</div>' +
        '<div class="pt">' + p.n + '</div><div class="pd">' + p.d + '</div><div class="pm">Strengthens the passive.</div></button>';
    }
    const s = SKILL[id], own = h.skills.find(o => o.id === id);
    return '<button class="pick" data-act="pick" data-i="' + i + '"><div class="pk">rank ' + (own.rank + 1) + '</div>' +
      '<div class="pt">' + s.n + '</div><div class="pd">' + skNums(s, own.rank + 1) + '</div></button>';
  }
  const s = SKILL[id];
  return '<button class="pick" data-act="pick" data-i="' + i + '"><div class="pk">' + (s.ult ? 'ultimate' : s.cls === 'any' ? 'common' : s.cls) + '</div>' +
    '<div class="pt">' + s.n + '</div><div class="pd">' + s.f + '</div>' +
    '<div class="pm">' + skNums(s, 1) + ' · ' + s.cd + 's</div></button>';
}

function tierRow(h, label, level, kind, filled){
  const pend = h.pend[0];
  const active = pend && pend.kind === kind && (kind !== 'skill' || pend.lvl === level);
  let body;
  if (active) body = '<div class="picks">' + pend.opts.map((id, i) => optCard(h, kind, id, i)).join('') + '</div>';
  else if (filled){
    const s = SKILL[filled.id];
    body = '<div class="chosen"><b>' + s.n + '</b> <span class="pips">' +
      '●'.repeat(filled.rank) + '<span style="opacity:.3">' + '●'.repeat(C.MAX_HERO_RANK - filled.rank) + '</span></span>' +
      '<div class="pd">' + skNums(s, filled.rank) + '</div></div>';
  } else body = '<div class="locked">' + (h.lvl >= level ? 'nothing chosen' : 'unlocks at level ' + level) + '</div>';
  return '<div class="tier' + (active ? ' hot' : '') + '"><div class="tl">' + label + '</div><div class="tb">' + body + '</div></div>';
}

// Health and the road to the next choice, as bars you can read at a glance —
// the numbers alone never said "two thirds of the way to a new skill".
function heroMeters(h){
  const need = xpNeed(h.lvl), maxed = h.lvl >= C.MAX_LEVEL;
  const xpPct = maxed ? 100 : clamp(h.xp / Math.max(1, need), 0, 1) * 100;
  const nextPick = h.lvl < C.SKILL_TIERS[0] ? C.SKILL_TIERS[0]
    : C.SKILL_TIERS.concat([C.ULT_LEVEL], C.RANK_LEVELS).find(l => l > h.lvl);
  return '<div class="hp-meter"><i class="hm-hp" style="width:' +
      (clamp(h.hp / h.mhp, 0, 1) * 100).toFixed(1) + '%"></i>' +
      '<em>' + Math.round(h.hp) + ' / ' + Math.round(h.mhp) + '</em></div>' +
    '<div class="hp-meter sm"><i class="hm-xp" style="width:' + xpPct.toFixed(1) + '%"></i>' +
      '<em>' + (maxed ? 'fully grown' : nextPick ? 'level ' + nextPick + ' unlocks a pick' : 'level ' + (h.lvl + 1)) + '</em></div>';
}
function heroDoing(h){
  if (h.dead) return 'Reforging — back in ' + Math.ceil(h.respawnT) + 's.';
  if (h.pend.length) return 'Waiting on you to choose.';
  if (!h.inLane) return 'In the hold, ready to march.';
  if (h.target) return 'Fighting on the bridge.';
  return 'Marching.';
}

function showHeroSheet(h){
  const pend = h.pend[0];
  const passRow = (() => {
    if (pend && pend.kind === 'passive')
      return '<div class="tier hot"><div class="tl">Creation (Passive)</div><div class="tb"><div class="picks">' +
        pend.opts.map((id, i) => optCard(h, 'passive', id, i)).join('') + '</div></div></div>';
    const p = PASS[h.passive];
    return '<div class="tier"><div class="tl">Creation (Passive)</div><div class="tb"><div class="chosen"><b>' + (p ? p.n : '—') + '</b>' +
      ' <span class="pips">' + '●'.repeat(h.passRank) + '<span style="opacity:.3">' + '●'.repeat(C.MAX_HERO_RANK - h.passRank) + '</span></span>' +
      '<div class="pd">' + (p ? p.d : '') + '</div></div></div></div>';
  })();
  const basics = h.skills.filter(s => !s.ult), ult = h.skills.find(s => s.ult);
  let rows = passRow;
  C.SKILL_TIERS.forEach((lv, i) => { rows += tierRow(h, 'Level ' + lv + ' Skill', lv, 'skill', basics[i]); });
  rows += tierRow(h, 'Level 12 (Ultimate)', C.ULT_LEVEL, 'ult', ult);
  const rankPend = pend && pend.kind === 'rank';
  rows += '<div class="tier' + (rankPend ? ' hot' : '') + '"><div class="tl">Skill Progression (15+)</div><div class="tb">' +
    (rankPend ? '<div class="picks">' + pend.opts.map((id, i) => optCard(h, 'rank', id, i)).join('') + '</div>'
      : '<div class="locked">A rank at levels ' + C.RANK_LEVELS.join(', ') + '. Next at ' +
        (C.RANK_LEVELS.find(l => l > h.lvl) || 'max') + '.</div>') + '</div></div>';

  openModal('<div class="parch"><h2>Hero Profile</h2>' +
    '<div class="hp-grid"><div class="hp-left">' +
    '<div class="portrait" data-cls="' + h.cls + '"><span>' + classGlyph(h.cls) + '</span>' +
    '<span class="pcls">' + CLS[h.cls].name + '</span></div>' +
    '<div class="hp-name">' + h.name + '</div>' +
    '<div class="hp-lvl">Level ' + h.lvl + ' · ' + CLS[h.cls].name + '</div>' +
    heroMeters(h) +
    // one column: two columns of 79px cut "2692 / 2692" in half
    '<div class="hp-stats">' +
    '<span>Damage<b>' + Math.round(attackDamage(h)) + '</b></span>' +
    (h.ap >= 1 ? '<span>Power<b>' + Math.round(h.ap) + '</b></span>' : '') +
    '<span>Armour<b>' + Math.round(h.armor) + '</b></span>' +
    '<span>Resist<b>' + Math.round(h.mr) + '</b></span>' +
    '<span>Atk speed<b>' + attackSpeedOf(h).toFixed(2) + '</b></span>' +
    '<span>Record<b>' + h.kills + ' / ' + h.deaths + '</b></span>' +
    '</div><div class="hp-doing">' + heroDoing(h) + '</div>' +
    '<div class="hp-blurb">' + CLS[h.cls].blurb + '</div></div>' +
    '<div class="hp-right"><div class="grid-title">Skill Selection Grid</div>' + rows + '</div></div>' +
    '<div class="rowbtn"><button class="big ghost" data-act="close">Back to the bridge</button></div></div>');
}
const classGlyph = (cls) => ({ tank:'🛡️', fighter:'⚔️', marksman:'🏹', mage:'🔮', assassin:'🗡️', support:'✨' })[cls] || '⚔️';

// How the match actually went: every structure that fell, in order, on a
// shared time axis. A win that was never in doubt looks nothing like one that
// turned at the twelfth minute, and the card should show which you had.
function timelineHtml(){
  if (!G.timeline.length) return '<div class="tl-empty">Not a single wall came down.</div>';
  const end = Math.max(G.t, 1);
  const rows = [0, 1].map(side => {
    const marks = G.timeline.filter(e => e.side === side).map(e => {
      const left = clamp(e.t / end, 0, 1) * 100;
      const cls = e.key === 'gate' ? ' gate' : e.key === 'inhib' ? ' inhib' : '';
      return '<i class="tl-m' + cls + '" style="left:' + left.toFixed(2) + '%" title="' +
        e.n + ' — ' + mmss(e.t) + '"></i>';
    }).join('');
    // "Yours" read as "walls you broke"; the marks are walls that FELL, so it
    // has to say whose walls they were.
    return '<div class="tl-row"><span class="tl-lbl" style="color:' + SIDE_COL[side] + '">' +
      (side === 0 ? 'You lost' : 'They lost') + '</span><span class="tl-track">' + marks + '</span></div>';
  }).join('');
  return '<div class="tl">' + rows +
    '<div class="tl-axis"><span>0:00</span><span>' + mmss(end) + '</span></div>' +
    '<div class="legend"><span><i class="tl-m dot"></i> turret</span>' +
    '<span><i class="tl-m inhib dot"></i> inhibitor</span>' +
    '<span><i class="tl-m gate dot"></i> gates</span></div></div>';
}

/* ------------------------------------------------------------------ pause
   Pausing used to just stop the clock. A ten-minute match is long enough that
   the useful question at that moment is "how am I actually doing?", so the
   pause is a war report: the line of battle on both sides, and every number
   that decides the next five minutes, yours next to theirs.                 */
function lineOfBattle(side){
  const front = frontStruct(side);
  return '<div class="lob">' + G.sides[side].structs.map(st => {
    const cls = st.dead ? ' gone' : st === front ? ' front' : '';
    const pct = st.dead ? 0 : Math.round(clamp(st.hp / st.mhp, 0, 1) * 100);
    return '<span class="lb' + cls + '" title="' + st.n + '">' +
      '<i style="height:' + pct + '%"></i><em>' + (st.dead ? '—' : pct + '%') + '</em>' +
      '<u>' + (st.key === 'gate' ? 'gates' : st.key === 'inhib' ? 'inhib' : st.key.toUpperCase()) + '</u></span>';
  }).join('') + '</div>';
}

// One row of "yours against theirs", green when you are ahead. Shared by the
// pause report and the result card so a match reads the same way all through.
function wrRow(label, mine, theirs, better){
  const win = better === undefined ? 0 : (better ? (mine > theirs ? 1 : mine < theirs ? -1 : 0)
                                                 : (mine < theirs ? 1 : mine > theirs ? -1 : 0));
  return '<div class="wr-row"><b class="' + (win > 0 ? 'good' : win < 0 ? 'bad' : '') + '">' + mine + '</b>' +
    '<span>' + label + '</span><b>' + theirs + '</b></div>';
}

/* ------------------------------------------------------------------ resume
   A match runs ten to fifteen minutes. Losing one to a backgrounded tab is
   the worst thing this game could do to you, so the whole match — hold,
   heroes with their builds, structures and everyone standing on the bridge —
   is written to local storage and can be picked back up.                    */
const SAVE_KEY = 'ib_save', SAVE_VER = 1;

const packHero = (h) => ({
  cls:h.cls, name:h.name, lvl:h.lvl, xp:h.xp, kills:h.kills, deaths:h.deaths,
  passive:h.passive, passRank:h.passRank,
  skills:h.skills.map(s => ({ id:s.id, rank:s.rank, cdT:s.cdT, ult:!!s.ult })),
  pend:h.pend.map(p => ({ kind:p.kind, opts:p.opts.slice(), lvl:p.lvl })),
  x:h.x, y:h.y, hp:h.hp, mana:h.mana, dead:h.dead, inLane:h.inLane, respawnT:h.respawnT,
});
const packUnit = (u) => ({
  kind:u.kind, side:u.side, x:u.x, y:u.y, hp:u.hp, mhp:u.mhp, ad:u.ad, armor:u.armor, mr:u.mr,
  paid:!!u.paid, life:u.life, cd:u.cd,
});
const packSide = (s) => ({
  res:Object.assign({}, s.res), workers:Object.assign({}, s.workers),
  nodeLvl:Object.assign({}, s.nodeLvl), towerUp:Object.assign({}, s.towerUp),
  troopUp:Object.assign({}, s.troopUp), superT:s.superT, aiT:s.aiT, rs:s.rs,
  kills:s.kills, structsKilled:s.structsKilled, gathered:s.gathered, spent:s.spent, heroKills:s.heroKills,
  plot:s.plot.map(b => b ? { type:b.type, lvl:b.lvl, tile:b.tile } : null),
  trainQ:s.trainQ.map(q => ({ type:q.type, t:q.t, dur:q.dur })),
  muster:s.muster.map(m => ({ type:m.type })),
  structs:s.structs.map(st => ({ key:st.key, hp:st.hp, dead:st.dead, downT:st.downT })),
  heroes:s.heroes.map(packHero),
});

function saveMatch(){
  if (G.state !== 'play' || G.demo) return false;
  try {
    localStorage.setItem(SAVE_KEY, JSON.stringify({
      v:SAVE_VER, at:Date.now(), diff:G.diff.id, t:G.t, wave:G.wave, waveT:G.waveT,
      seed:_seed, sides:G.sides.map(packSide),
      units:G.units.filter(u => !u.isHero).map(packUnit),
    }));
    return true;
  } catch (e){ return false; }
}
function savedMatch(){
  try {
    const o = JSON.parse(localStorage.getItem(SAVE_KEY) || 'null');
    return (o && o.v === SAVE_VER && o.sides && o.sides.length === 2) ? o : null;
  } catch (e){ return null; }
}
function clearSave(){ try { localStorage.removeItem(SAVE_KEY); } catch (e){} }

function loadMatch(pack){
  pack = pack || savedMatch();
  if (!pack) return 'no saved match';
  newMatch({ diff:pack.diff, seed:pack.seed || 1 });
  reseed(pack.seed || 1);
  G.t = pack.t; G.wave = pack.wave; G.waveT = pack.waveT;
  pack.sides.forEach((ps, i) => {
    const s = G.sides[i];
    Object.assign(s.res, ps.res); Object.assign(s.workers, ps.workers);
    Object.assign(s.nodeLvl, ps.nodeLvl); Object.assign(s.towerUp, ps.towerUp);
    Object.assign(s.troopUp, ps.troopUp);
    s.superT = ps.superT; s.aiT = ps.aiT; s.rs = ps.rs;
    s.kills = ps.kills; s.structsKilled = ps.structsKilled;
    s.gathered = ps.gathered; s.spent = ps.spent; s.heroKills = ps.heroKills;
    s.plot = ps.plot.map(b => b ? { type:b.type, lvl:b.lvl, tile:b.tile, raise:0 } : null);
    s.trainQ = ps.trainQ.map(q => ({ type:q.type, t:q.t, dur:q.dur }));
    s.muster = ps.muster.map(m => ({ type:m.type }));
    for (const st of s.structs){
      const p = ps.structs.find(o => o.key === st.key);
      if (!p) continue;
      st.mhp = structMaxHp(s, st);
      st.hp = Math.min(p.hp, st.mhp); st.dead = p.dead; st.downT = p.downT;
    }
    s.heroes = ps.heroes.map(ph => {
      const h = makeHero(i, ph.cls, ph.name);
      h.pend.length = 0;
      h.lvl = ph.lvl; h.xp = ph.xp; h.kills = ph.kills; h.deaths = ph.deaths;
      h.passive = ph.passive; h.passRank = ph.passRank;
      h.skills = ph.skills.map(sk => ({ id:sk.id, rank:sk.rank, cdT:sk.cdT, ult:sk.ult }));
      h.pend = ph.pend.map(p => ({ kind:p.kind, opts:p.opts.slice(), lvl:p.lvl }));
      recalcHero(h, true);
      h.x = ph.x; h.y = ph.y; h.hp = Math.min(ph.hp, h.mhp); h.mana = Math.min(ph.mana, h.mmana);
      h.dead = ph.dead; h.respawnT = ph.respawnT; h.inLane = false;
      if (!ph.dead){ h.inLane = true; G.units.push(h); }
      return h;
    });
  });
  for (const pu of pack.units || []){
    const u = spawnUnit(pu.side, pu.kind, { x:pu.x, y:pu.y, paid:pu.paid, life:pu.life });
    if (!u) continue;
    u.mhp = pu.mhp; u.hp = Math.min(pu.hp, u.mhp); u.ad = pu.ad;
    u.armor = pu.armor; u.mr = pu.mr; u.cd = pu.cd;
  }
  scatterCache[0] = scatterCache[1] = null;
  rebuildGrid();
  return null;
}

let rsT = 0;

function say(msg){ if (msg) fxToast(msg, 'bad'); }

// Screen point → world ground point (the inverse of lp with z = 0).
function unproject(sx, sy){
  const S = LS();
  const A = (sx - LW * .5) / S, B = (sy - LH * .60) / S;
  const det = .96 * .60 + .52 * .07;
  return [ (A * .60 + .52 * B) / det + cam.x, (.96 * B - .07 * A) / det ];
}

// What you click is what you see. A building is drawn standing UP from its
// ground cell, so testing the cell under the cursor misses the thing you
// actually aimed at — every clickable is tested against its drawn box first,
// nearest-to-camera first, and only then do we fall back to the bare ground.
function clickTargets(){
  const s = G.sides[0], out = [];
  holdSide = 0;
  // Each clickable is an ellipse around the middle of the shape you can SEE —
  // for a building that is up the screen from its ground cell, not on it.
  const at = (gx, gy, lift, rx, ry) => {
    const p = bp(gx, gy);
    return { cx:p[0], cy:p[1] - lift * BSC, rx:rx * BSC, ry:ry * BSC, sy:p[1] };
  };
  for (const h of G.sides[0].heroes){
    if (h.dead) continue;
    const p = lp(h.x, h.y);
    out.push({ kind:'hero', hero:h, cx:p[0], cy:p[1] - 18 * cam.z, rx:16 * cam.z, ry:26 * cam.z, sy:p[1], pri:3 });
  }
  for (let t = 0; t < s.plot.length; t++){
    const b = s.plot[t];
    out.push(Object.assign(b ? at(tileGX(t), tileGY(t), .32, .52, .46) : at(tileGX(t), tileGY(t), 0, .5, .34),
      b ? { kind:'build', tile:t, pri:2 } : { kind:'plot', tile:t, pri:1 }));
  }
  for (const k in NODES)
    out.push(Object.assign(at(NODES[k].gx, NODES[k].gy, .26, .62, .44), { kind:'node', node:k, pri:2 }));
  // ...and everything standing on the bridge, so you can ask what it is
  for (const sd of G.sides) for (const st of sd.structs){
    if (st.dead && !st.downT) continue;
    const p = lp(st.x, st.y);
    const tall = st.key === 'gate' ? 60 : st.key === 'inhib' ? 34 : 44;
    out.push({ kind:'struct', struct:st, cx:p[0], cy:p[1] - tall * .5 * cam.z,
      rx:(st.key === 'gate' ? 56 : 20) * cam.z, ry:tall * .6 * cam.z, sy:p[1], pri:2 });
  }
  for (const u of G.units){
    if (u.dead || u.isHero) continue;
    const p = lp(u.x, u.y);
    out.push({ kind:'unit', unit:u, cx:p[0], cy:p[1] - 9 * cam.z, rx:9 * cam.z, ry:14 * cam.z, sy:p[1], pri:1 });
  }
  return out;
}

// Pure: given a point on the canvas, what did the player mean? Split out from
// the event handler so the tests can aim at things the way a thumb does.
function resolvePick(sx, sy){
  BSC = LS() * TILE;
  let best = null, bd = Infinity;
  for (const t of clickTargets()){
    const dx = (sx - t.cx) / t.rx, dy = (sy - t.cy) / t.ry;
    const d = dx * dx + dy * dy;
    if (d > 1) continue;                       // outside its own footprint
    const score = d - t.pri * .02;             // heroes and buildings edge out bare ground
    if (score < bd){ bd = score; best = t; }
  }
  if (best) return best;
  // nothing under the finger — fall back to the plot cell on the ground
  const w = unproject(sx, sy);
  const gx = (w[0] - HOLD_X) / TILE, gy = w[1] / TILE;
  const col = Math.round(gx + (PLOT_W - 1) / 2), row = Math.round(gy + (PLOT_H - 1) / 2);
  const near = Math.abs(gx - (col - (PLOT_W - 1) / 2)) < .8 && Math.abs(gy - (row - (PLOT_H - 1) / 2)) < .8;
  if (near && col >= 0 && col < PLOT_W && row >= 0 && row < PLOT_H)
    return { kind:s0Plot(row * PLOT_W + col) ? 'build' : 'plot', tile:row * PLOT_W + col };
  return { kind:'none' };
}
const s0Plot = (t) => G.sides[0].plot[t];

function pickAt(clientX, clientY){
  const r = lcv.getBoundingClientRect();
  const sx = clientX - r.left, sy = clientY - r.top;
  const m = minimapRect();
  if (sx >= m.x0 && sx <= m.x0 + m.w && sy >= m.y0 && sy <= m.y0 + m.h){
    cam.follow = false;
    const fb = $('camFollow'); if (fb) fb.classList.remove('on');
    cam.x = clamp(minimapWorldX(sx), CAM_MIN, CAM_MAX);
    sfx('click');
    return;
  }
  const t = resolvePick(sx, sy);
  if (t.kind !== 'none') sfx('click');
  if (t.kind === 'hero'){ sel.hero = t.hero; showHeroSheet(t.hero); return; }
  sel.node = t.kind === 'node' ? t.node : null;
  sel.tile = (t.kind === 'build' || t.kind === 'plot') ? t.tile : -1;
  sel.struct = t.kind === 'struct' ? t.struct : null;
  sel.unit = t.kind === 'unit' ? t.unit : null;
  if (NARROW() && (sel.node || sel.struct || sel.unit || sel.tile >= 0)) dockTab = 'sel';
  syncUI();
}

/* ------------------------------------------------------------------ controls
   Every view control is one named action, so the buttons and the keyboard
   drive exactly the same code and cannot fall out of step. KEYS is also what
   the help sheet prints, so the printed shortcut is always the real one.    */
const KEYS = [
  { k:'Space', a:'pause',   d:'pause and read the war report' },
  { k:'1 2 3', a:'speed',   d:'run at 1×, 2× or 3× speed' },
  { k:'H',     a:'camHold', d:'look at your hold' },
  { k:'G',     a:'camGate', d:'look at your gates' },
  { k:'M',     a:'camMid',  d:'look at the middle of the bridge' },
  { k:'B',     a:'camFoe',  d:'look at their base' },
  { k:'F',     a:'follow',  d:'follow the fighting' },
  { k:'+ −',   a:'zoom',    d:'zoom in and out' },
  { k:'?',     a:'help',    d:'this sheet' },
  { k:'Esc',   a:'close',   d:'close whatever is open' },
];
function keyAction(key){
  const k = (key || '').toLowerCase();
  if (key === ' ' || k === 'p') return 'pause';
  if (k === '1' || k === '2' || k === '3') return 'speed' + k;
  if (k === 'h') return 'camHold';
  if (k === 'g') return 'camGate';
  if (k === 'm') return 'camMid';
  if (k === 'b') return 'camFoe';
  if (k === 'f') return 'follow';
  if (k === '+' || k === '=') return 'zoomIn';
  if (k === '-' || k === '_') return 'zoomOut';
  if (k === '?' || k === '/') return 'help';
  if (key === 'Escape') return 'close';
  return null;
}
function doAction(a){
  const paint = (id, on) => { if (!HEADLESS) $(id).classList.toggle('on', on); };
  const camTo = (x) => { cam.follow = false; cam.x = clamp(x, CAM_MIN, CAM_MAX); paint('camFollow', false); };
  if (a === 'pause'){ if (G.state === 'play') setPaused(!G.paused); return; }
  if (a === 'speedUp' || /^speed[123]$/.test(a)){
    G.speed = a === 'speedUp' ? (G.speed === 1 ? 2 : G.speed === 2 ? 3 : 1) : +a.slice(5);
    if (!HEADLESS) $('btnSpeed').textContent = G.speed + '×';
    paint('btnSpeed', G.speed > 1);
    return;
  }
  if (a === 'camHold') return camTo(HOLD_X);
  if (a === 'camGate') return camTo(12);
  if (a === 'camMid') return camTo(C.LANE_LEN / 2);
  if (a === 'camFoe') return camTo(C.LANE_LEN - 12);
  if (a === 'follow'){ cam.follow = !cam.follow; paint('camFollow', cam.follow); return; }
  if (a === 'zoomIn') { cam.tz = clamp(cam.tz * 1.25, ZOOM_MIN, ZOOM_MAX); return; }
  if (a === 'zoomOut'){ cam.tz = clamp(cam.tz * .8, ZOOM_MIN, ZOOM_MAX); return; }
  if (a === 'help'){ if (G.state === 'play' && !HEADLESS) showHelp(); return; }
  if (a === 'close'){ if (G.paused) setPaused(false); else if (G.state === 'play' && !HEADLESS) closeModal(); return; }
}

function wire(){
  const s0 = () => G.sides[0];
  $('dock').addEventListener('click', (e) => {
    const tab = e.target.closest('[data-tab]');
    if (tab){ dockTab = tab.dataset.tab; syncUI(); return; }
    const b = e.target.closest('[data-hero],[data-act]');
    if (!b || b.disabled) return;
    if (b.dataset.hero){
      const h = s0().heroes.find(x => x.id === +b.dataset.hero);
      if (h){ sel.hero = h; showHeroSheet(h); }
      return;
    }
    const s = s0(), a = b.dataset.act;
    if (a === 'job') say(assign(s, b.dataset.node, +b.dataset.d));
    else if (a === 'worker') say(trainWorker(s));
    else if (a === 'unit') say(trainUnit(s, b.dataset.unit));
    else if (a === 'build') say(build(s, sel.tile, b.dataset.type));
    else if (a === 'upgrade') say(upgradeBuilding(s, sel.tile));
    else if (a === 'up') say(buyUp(s, b.dataset.up));
    else if (a === 'nodeup') say(upgradeNode(s, b.dataset.node));
    else if (a === 'newhero'){ showHeroCreate(); return; }
    syncUI();
  });
  $('modal').addEventListener('click', (e) => {
    if (e.target === $('modal')){ if (G.state === 'play') doAction('close'); return; }
    const b = e.target.closest('[data-act]');
    if (!b) return;
    const a = b.dataset.act;
    if (a === 'start'){
      audioStart(); clearSave();
      if (!seenIntro()){ showIntro(b.dataset.diff); return; }   // first time: explain it once
      newMatch({ diff:b.dataset.diff }); closeModal(); syncUI();
    }
    else if (a === 'introgo'){
      markSeen();
      newMatch({ diff:b.dataset.diff }); closeModal(); syncUI();
    }
    else if (a === 'resume'){
      audioStart();
      const err = loadMatch();
      if (err){ say(err); return; }
      closeModal(); syncUI();
    }
    else if (a === 'close') doAction('close');
    else if (a === 'unpause') setPaused(false);
    else if (a === 'replay') showIntro(G.diff.id);
    else if (a === 'menu'){ setPaused(false); startDemo(); showMenu(); }
    else if (a === 'again'){ clearSave(); newMatch({ diff:G.diff.id }); closeModal(); syncUI(); }
    else if (a === 'mkhero'){
      const err = createHero(s0(), b.dataset.cls);
      if (err){ say(err); return; }
      const h = s0().heroes[s0().heroes.length - 1];
      sel.hero = h; showHeroSheet(h); syncUI();
    } else if (a === 'pick'){
      const h = sel.hero;
      if (!h) return;
      say(pickOption(h, +b.dataset.i));
      showHeroSheet(h); syncUI();
    }
  });
  $('advice').addEventListener('click', () => {
    const t = $('advice').dataset.tab;
    if (t){ dockTab = t; syncUI(); }
  });
  const paintSound = () => { $('btnSound').textContent = AU.muted ? '🔇' : '🔊'; $('btnSound').classList.toggle('on', !AU.muted); };
  $('btnSound').addEventListener('click', () => { audioStart(); setMuted(!AU.muted); paintSound(); sfx('click'); });
  paintSound();
  // browsers will not make a sound until the player has touched the page
  const kick = () => { audioStart(); window.removeEventListener('pointerdown', kick); };
  window.addEventListener('pointerdown', kick);
  $('btnMenu').addEventListener('click', () => { showMenu(); });
  $('btnHelpBase').addEventListener('click', showHelp);
  $('btnPause').addEventListener('click', () => doAction('pause'));
  $('btnSpeed').addEventListener('click', () => doAction('speedUp'));
  $('camHold').addEventListener('click', () => doAction('camHold'));
  $('camGate').addEventListener('click', () => doAction('camGate'));
  $('camMid').addEventListener('click', () => doAction('camMid'));
  $('camFoe').addEventListener('click', () => doAction('camFoe'));
  $('camFollow').addEventListener('click', () => doAction('follow'));
  $('camOut').addEventListener('click', () => doAction('zoomOut'));
  $('camIn').addEventListener('click', () => doAction('zoomIn'));

  // one canvas: drag to pan, wheel to zoom, click to select a plot or a hero
  let drag = null;
  lcv.addEventListener('pointerdown', (e) => {
    drag = { x:e.clientX, y:e.clientY, cx:cam.x, moved:false };
    lcv.setPointerCapture(e.pointerId);
  });
  lcv.addEventListener('pointermove', (e) => {
    if (!drag) return;
    const dx = (e.clientX - drag.x) / (LS() * .96);
    if (Math.abs(e.clientX - drag.x) + Math.abs(e.clientY - drag.y) > 5){
      drag.moved = true; cam.follow = false; $('camFollow').classList.remove('on');
    }
    if (drag.moved) cam.x = clamp(drag.cx - dx, CAM_MIN, CAM_MAX);
  });
  lcv.addEventListener('pointerup', (e) => {
    if (drag && !drag.moved) pickAt(e.clientX, e.clientY);
    drag = null;
  });
  lcv.addEventListener('pointercancel', () => { drag = null; });
  // two-finger pinch, for the screens with no wheel
  const touches = new Map();
  let pinch = 0;
  lcv.addEventListener('pointerdown', (e) => { touches.set(e.pointerId, e); });
  lcv.addEventListener('pointermove', (e) => {
    if (!touches.has(e.pointerId)) return;
    touches.set(e.pointerId, e);
    if (touches.size !== 2) return;
    drag = null;
    const [a, b2] = [...touches.values()];
    const d = Math.hypot(a.clientX - b2.clientX, a.clientY - b2.clientY);
    if (pinch) cam.tz = cam.z = clamp(cam.z * (d / pinch), ZOOM_MIN, ZOOM_MAX);
    pinch = d;
  });
  const drop = (e) => { touches.delete(e.pointerId); if (touches.size < 2) pinch = 0; };
  lcv.addEventListener('pointerup', drop);
  lcv.addEventListener('pointercancel', drop);
  lcv.addEventListener('dblclick', () => { cam.follow = true; $('camFollow').classList.add('on'); });
  lcv.addEventListener('wheel', (e) => {
    e.preventDefault();
    cam.tz = clamp(cam.tz * (e.deltaY > 0 ? .88 : 1.14), ZOOM_MIN, ZOOM_MAX);
  }, { passive:false });

  const stash = () => { if (G.state === 'play' && !G.demo) saveMatch(); };
  window.addEventListener('pagehide', stash);
  window.addEventListener('blur', stash);
  document.addEventListener('visibilitychange', () => { if (document.hidden) stash(); });
  window.addEventListener('resize', resizeSoon);
  window.addEventListener('orientationchange', resizeSoon);
  window.addEventListener('keydown', (e) => {
    const a = keyAction(e.key);
    if (!a) return;
    if (e.key === ' ' || e.key === '/') e.preventDefault();
    doAction(a);
  });
}

let last = 0, lastDraw = 0;
function frame(ts){
  const raw = Math.min(.1, (ts - last) / 1000 || 0);
  last = ts;
  if (G.state === 'play' && !G.paused){
    let left = raw * G.speed;
    let guard = 0;
    while (left > 0 && guard++ < 12){ const st = Math.min(1 / 30, left); update(st); left -= st; }
  }
  camStep(raw);
  // Nothing on the board moves while the result card or the pause report is
  // up, but the card blurs the whole canvas behind it — and re-blurring a live
  // 1400x820 layer sixty times a second for a still picture cost half the
  // frame rate. Redraw a few times a second instead; the DOM stays live.
  const frozen = (G.state === 'over' || G.paused) && !G.demo;
  if (!frozen || ts - lastDraw > 90){ draw(); lastDraw = ts; }
  uiTick(raw);
  requestAnimationFrame(frame);
}

function boot(){
  lcv = $('wcv');
  resize();
  wire();
  startDemo();
  showMenu();
  syncUI();
  requestAnimationFrame(frame);
}
if (!HEADLESS) boot();
else { newMatch({ diff:'veteran' }); G.state = 'menu'; }
