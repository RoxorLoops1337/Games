  h.hp = Math.min(h.mhp, h.hp + (1.5 + h.lvl * .25 + passVal(h, 'hreg')
    + (atHome ? 34 : 0) + calm * (6 + h.lvl * .9)) * dt);
  h.mana = Math.min(h.mmana, h.mana + (3.5 + h.lvl * .35 + passVal(h, 'mreg')
    + (atHome ? 22 : 0) + calm * 4) * dt);
  gainXp(h, 8.0 * dt);                       // standing in the lane is worth something
  for (let i = h.buffs.length - 1; i >= 0; i--){ h.buffs[i].t -= dt; if (h.buffs[i].t <= 0) h.buffs.splice(i, 1); }
  if (h.rage > 0 && G.t - h.dmgTaken > 3) h.rage = Math.max(0, h.rage - dt * .05);
  const shieldLow = passVal(h, 'shieldLow');
  if (shieldLow && h.hp / h.mhp < .3 && (h.lowT || 0) <= 0){ h.shield = Math.max(h.shield, shieldLow); h.shT = 18; h.lowT = 45; }
  if (h.lowT > 0) h.lowT -= dt;
  // hero auras that heal
  const ah = passVal(h, 'auraHeal');
  if (ah) nearby(h.x, 7, (u) => { if (!u.dead && u.side === h.side && u !== h) healUnit(u, ah * dt); });
  if (h.stunT > 0) return;

  const frac = h.hp / h.mhp;
  const tower = inTowerFire(h);
  const cover = tower ? alliesNear({ x:tower.x, y:tower.y, side:h.side, r:0 }, 6) : 0;
  // A wounded enemy hero within reach is worth finishing — heroes used to
  // break off every duel the moment either side dipped, so they traded for
  // twenty minutes and nobody ever died to a hero.
  const prey = nearestFoe(h, huntRange(h) + 2, true);
  const finishing = prey && prey.hp / prey.mhp < .35 && frac > .32 && !(tower && !cover);
  if (h.retreat && (frac > .66 || finishing)) h.retreat = false;
  if (!finishing && (frac < .28 || (tower && !cover && frac < .58))) h.retreat = true;

  const tgt = h.target = h.retreat ? null : (finishing ? prey : heroTarget(h));
  castLoop(h, tgt, dt);

  let gx, gy = 0;
  if (h.retreat){ gx = homeX; gy = 0; }
  else if (tgt){ gx = tgt.x; gy = tgt.y; }
  else {
    const fl = frontlineX(h.side);
    gx = fl + dir * 2.5; gy = h.y * .5;
    if (tower && !cover) gx = Math.min(gx * dir, (tower.x - dir * (tower.rng + 2)) * dir) * dir;
  }
  const dx = gx - h.x, dy = gy - h.y, dist = Math.hypot(dx, dy) || .001;
  const reach = tgt ? h.rng + (tgt.r || .4) + h.r : 0;
  if (tgt && dist <= reach){
    h.cd -= dt;
    if (h.cd <= 0){ h.cd = 1 / attackSpeedOf(h); basicAttack(h, tgt); }
  } else {
    const sp = speedOf(h) * dt;
    h.x += dx / dist * sp; h.y += dy / dist * sp;
  }
  h.y = clamp(h.y, -C.LANE_W / 2 + h.r, C.LANE_W / 2 - h.r);
  h.x = clamp(h.x, 1, C.LANE_LEN - 1);
}

/* ------------------------------------------------------------------ casting */
const skVal = (arr, rank) => arr ? arr[0] + arr[1] * (rank - 1) : 0;
// A skill from the shared pool scales off whichever stat its owner is better
// at. Without this, every magic skill in that pool is a trap pick for the four
// classes that have no ability power at all.
const apBase = (h, s) => s.cls === 'any' ? Math.max(h.ap, attackDamage(h) * .7) : h.ap;
const adBase = (h, s) => s.cls === 'any' ? Math.max(attackDamage(h), h.ap) : attackDamage(h);
function skPower(h, s, rank){
  return skVal(s.dmg, rank) + (s.adR || 0) * adBase(h, s) + (s.apR || 0) * apBase(h, s);
}
function abilityDmg(h, tgt, amt, magic){
  const done = dealDmg(h, tgt, amt, { magic, ability:true, exec:0 });
  const e = passVal(h, 'echo');
  if (e > 0 && !tgt.dead) dealDmg(h, tgt, amt * e, { magic, ability:true });
  return done;
}

function castLoop(h, tgt, dt){
  for (const sk of h.skills){
    if (sk.cdT > 0) sk.cdT -= dt;
  }
  if (h.castLock > 0){ h.castLock -= dt; return; }
  for (const sk of h.skills){
    const s = SKILL[sk.id];
    if (!s || sk.cdT > 0 || h.mana < s.mana) continue;
    if (!wantCast(h, s, tgt)) continue;
    castSkill(h, sk, tgt);
    h.mana -= s.mana;
    sk.cdT = s.cd * (1 - h.cdr - bsum(h, 'bcdr'));
    h.castLock = .35;
    return;                       // one cast per beat keeps it readable
  }
}

function wantCast(h, s, tgt){
  const frac = h.hp / h.mhp;
  if (s.tag === 'heal') return frac < .7 || (s.ally && lowAlly(h, s.rng || 6));
  if (s.tag === 'buff' && (s.shield || s.barm)) return frac < .8 && (tgt || h.retreat);
  if (s.tag === 'move' && h.retreat) return true;
  if (!tgt) return false;
  const d = Math.hypot(tgt.x - h.x, tgt.y - h.y);
  if (s.ult){
    const worth = tgt.isHero || foesNear(h, 6) >= 3 || (tgt.struct && tgt.hp / tgt.mhp < .7);
    if (!worth) return false;
  }
  if (s.tag === 'summon') return d < 14;
  if (s.tag === 'buff') return d < Math.max(6, h.rng + 2);
  return d <= (s.rng || h.rng + 2) + (tgt.r || 0);
}
// The most hurt friend within reach. With only a hero or two on a side, an
// ally-only heal was often cast on nobody, which is why supports lost most.
function lowAlly(h, rad){
  let hero = null, any = null;
  nearby(h.x, rad, (u) => {
    if (u.dead || u.side !== h.side || u === h) return;
    const f = u.hp / u.mhp;
    if (f >= .7) return;
    if (u.isHero){ if (!hero || f < hero.hp / hero.mhp) hero = u; }
    else if (!any || f < any.hp / any.mhp) any = u;
  });
  return hero || any;
}

// A team heal or team buff used to hit every minion in a wide radius, so its
// worth grew with the size of the wave while every other class only ever
// helped itself. Measured over 120 matches that made Support a 72% class. It
// now covers the nearest few bodies — the front line, which is what it is for
// — and the rest of the wave fights on its own.
const TEAM_CAP = 6;
function teamTargets(h, aoe){
  const out = [];
  nearby(h.x, aoe, (u) => { if (!u.dead && u.side === h.side && !u.isHero) out.push(u); });
  if (out.length <= TEAM_CAP) return out;
  out.sort((a, b) => Math.abs(a.x - h.x) - Math.abs(b.x - h.x));
  return out.slice(0, TEAM_CAP);
}

function castSkill(h, sk, tgt){
  const s = SKILL[sk.id], r = sk.rank, foe = enemyOf(h.side);
  const pw = skPower(h, s, r);
  const dur = s.dur || 0;
  h.swing = .3;
  if (!HEADLESS){ castFx(h, s); sfx('cast', h.x); }
  switch (s.k){
    case 'strike': {
      if (!tgt) break;
      abilityDmg(h, tgt, pw, s.magic);
      if (s.aoe) areaHit(h, tgt.x, tgt.y, s.aoe, pw * .55, { magic:s.magic, ability:true });
      if (s.stun) applyStun(tgt, s.stun);
      if (s.slow) applySlow(tgt, s.slow, s.slowT || 2);
      break;
    }
    case 'bolt': {
      if (!tgt) break;
      const land = () => {
        if (tgt.dead) return;
        abilityDmg(h, tgt, pw, s.magic);
        if (s.aoe) areaHit(h, tgt.x, tgt.y, s.aoe, pw * .6, { magic:s.magic, ability:true });
        if (s.slow) applySlow(tgt, s.slow, s.slowT || 2);
        if (s.pierce) areaHit(h, tgt.x + dirOf(h.side) * 2, tgt.y, 1.6, pw * .5, { magic:s.magic, ability:true });
      };
      shoot(h, tgt, land, s.magic ? '#c69bff' : '#ffe08a');
      break;
    }
    case 'volley': {
      if (!tgt) break;
      for (let i = 0; i < (s.shots || 3); i++) shoot(h, tgt, () => { if (!tgt.dead) abilityDmg(h, tgt, pw, s.magic); }, '#ffe08a');
      break;
    }
    case 'nova': {
      areaHit(h, h.x, h.y, s.aoe, pw, { magic:s.magic, ability:true });
      if (s.stun || s.slow) nearby(h.x, s.aoe + 2, (u) => {
        if (u.dead || u.side !== foe) return;
        if (Math.hypot(u.x - h.x, u.y - h.y) > s.aoe + u.r) return;
        if (s.stun) applyStun(u, s.stun);
        if (s.slow) applySlow(u, s.slow, s.slowT || 2);
      });
      if (s.healAlly) nearby(h.x, s.aoe + 2, (u) => { if (!u.dead && u.side === h.side) healUnit(u, s.healAlly); });
      break;
    }
    case 'dash': {
      const dist = s.dist || 5;
      const dx0 = h.x, dy0 = h.y;
      if (tgt){
        const dx = tgt.x - h.x, dy = tgt.y - h.y, d = Math.hypot(dx, dy) || 1;
        const go = Math.min(dist, Math.max(0, d - (h.rng * .6)));
        h.x += dx / d * go; h.y += dy / d * go;
        abilityDmg(h, tgt, pw, s.magic);
        if (s.exec && tgt.hp / tgt.mhp < .4) abilityDmg(h, tgt, pw * s.exec * .5, s.magic);
      } else {
        h.x += -dirOf(h.side) * dist;
      }
      h.x = clamp(h.x, 1, C.LANE_LEN - 1);
      dashFx(h, dx0, dy0);
      break;
    }
    case 'heal': {
      const t = s.ally ? (lowAlly(h, s.rng || 6) || h) : h;
      healUnit(t, skVal(s.heal, r) + (s.apR || 0) * apBase(h, s));
      healFx(t.x, t.y);
      break;
    }
    case 'regen': {
      addBuff(h, { t:dur, tag:'regen', hps:(skVal(s.heal, r) + (s.apR || 0) * apBase(h, s)) / dur });
      break;
    }
    case 'shield': {
      const t = s.ally ? (lowAlly(h, s.rng || 6) || h) : h;
      t.shield = Math.max(t.shield, skVal(s.shield, r) + (s.apR || 0) * apBase(h, s));
      t.shT = dur || 6;
      if (s.barm && t.isHero) addBuff(t, { t:dur || 6, barm:s.barm, bmr:s.bmr || 0, tag:'fort' });
      break;
    }
    case 'buff': {
      addBuff(h, { t:dur || 5, tag:s.id, bas:s.bas || 0, bad:s.bad || 0, bms:s.bms || 0, barm:s.barm || 0,
        bmr:s.bmr || 0, bls:s.bls || 0, bcrit:s.bcrit || 0, bburn:s.bburn || 0, brng:s.brng || 0 });
      recalcHero(h);
      break;
    }
    case 'teambuff': {
      const aoe = s.aoe || 8;
      for (const a of G.sides[h.side].heroes)
        if (!a.dead && Math.abs(a.x - h.x) < aoe) addBuff(a, { t:dur, tag:s.id, bas:s.bas || 0, bad:s.bad || 0, bms:s.bms || 0, barm:s.barm || 0 });
      for (const u of teamTargets(h, aoe))
        u.mb = { t:dur, ad:(s.bad || 0) / 40 + (s.bas || 0), ms:s.bms || 0 };
      break;
    }
    case 'teamheal': {
      const aoe = s.aoe || 8;
      const amt = skVal(s.heal, r) + (s.apR || 0) * apBase(h, s);
      for (const a of G.sides[h.side].heroes){
        if (a.dead || Math.abs(a.x - h.x) >= aoe) continue;
        healUnit(a, amt); healFx(a.x, a.y);
        if (s.shield){ a.shield = Math.max(a.shield, skVal(s.shield, r)); a.shT = 6; }
      }
      for (const u of teamTargets(h, aoe)){ healUnit(u, amt); healFx(u.x, u.y); }
      break;
    }
    case 'dot': case 'storm': {
      const at = s.k === 'storm' ? h : (tgt || h);
      G.zones.push({ x:at.x, y:at.y, r:s.aoe, dps:skVal(s.dps, r) + (s.adR || 0) * adBase(h, s) + (s.apR || 0) * apBase(h, s),
        t:s.dur, dur:s.dur, tick:0, side:h.side, src:h, magic:!!s.magic, slow:s.slow || 0, follow:s.k === 'storm' ? h : null });
      break;
    }
    case 'chain': {
      if (!tgt) break;
      abilityDmg(h, tgt, pw, s.magic);
      chainHit(h, tgt, pw * .75, s.jumps || 2);
      break;
    }
    case 'mark': {
      if (!tgt) break;
      tgt.markT = dur; tgt.markBy = h.side; tgt.markAmp = s.amp;
      break;
    }
    case 'taunt': {
      nearby(h.x, s.aoe, (u) => {
        if (u.dead || u.side === h.side) return;
        if (Math.hypot(u.x - h.x, u.y - h.y) > s.aoe) return;
        u.target = h; u.taunt = s.dur;
        if (s.dmg) abilityDmg(h, u, pw, s.magic);
      });
      break;
    }
    case 'summon': {
      const n = (s.count || 1) + (r - 1) * (s.nPer || 0);
      for (let i = 0; i < n; i++){
        const su = spawnUnit(h.side, s.kind, { x:h.x - dirOf(h.side) * 1.5, y:h.y + rr(-1.5, 1.5), life:s.dur, hpM:1 + h.lvl * .05, adM:1 + h.lvl * .05 });
        if (su && !HEADLESS) burstFx(su.x, su.y, '#c9a6ff', 6);
      }
      if (s.buffTeam) nearby(h.x, 9, (u) => { if (!u.dead && u.side === h.side && !u.isHero) u.mb = { t:12, ad:.15, ms:.1 }; });
      break;
    }
  }
}

/* =====================================================================
   THE EMBER HOST — the opposing hold, run by the same public actions the
   player uses. If the AI can do it, so can you.
   ===================================================================== */
// Both holds used to draw from one shared random stream, and whichever acted
// first each tick got first pick of it. Each hold now rolls its own.
function arnd(s){
  s.rs = (s.rs + 0x6D2B79F5) | 0;
  let t = Math.imul(s.rs ^ (s.rs >>> 15), 1 | s.rs);
  t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
  return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
}
const apick = (s, arr) => arr[Math.floor(arnd(s) * arr.length)];

const AI_BUILD_PLAN = ['farm','barracks','farm','pit','tavern','forge','workshop','farm','barracks','farm','pit','workshop','forge','farm','tavern','farm'];

function aiStep(s, dt){
  s.aiT -= dt;
  if (s.aiT > 0) return;
  s.aiT = 1.4 / G.diff.ai;

  // --- jobs: keep the four piles roughly matched to what it wants to buy.
  // Arming a worker needs an IDLE one, and this loop used to shovel every idle
  // worker into a mine the instant it appeared — so the barracks starved and
  // seven minutes of play produced a single Footman out of an army of levies.
  // Hold one back when there is a barracks standing and something it can pay
  // to arm.
  // A Footman takes one worker off the piles; a Caster and a Cannon take TWO.
  // This reserve used to be a flat 1, so the second idle worker was shovelled
  // into a mine the instant it appeared and `s.workers.idle < d.need` refused
  // every Caster and every Cannon the hold ever tried to arm — at any barracks
  // level. Measured over sixteen eight-minute matches: 218 Footmen armed, zero
  // of anything else. Hold back as many as the dearest thing it could actually
  // pay for right now needs.
  const armable = Object.keys(TRAIN).filter(k =>
    TRAIN[k].barracks <= barracksLvl(s) && canPay(s, TRAIN[k].cost));
  const armNeed = barracksLvl(s) > 0 && armable.length
    ? Math.max(...armable.map(k => TRAIN[k].need)) : 0;
  // Every worker costs 20 food to train, so a hold that under-staffs the
  // fields throttles its own growth and then cannot afford a hero (45 food).
  // Traced: food sat under 35 all match while iron piled up unspent.
  const want = { wood:.28, gold:.30, iron:.18, food:.24 };
  if (s.workers.idle > armNeed){
    let bestNode = 'wood', bestGap = -9;
    for (const n of ['gold','iron','wood','food']){
      const room = nodeCap(s, n) - s.workers[n];
      if (room <= 0) continue;
      const have = s.workers[n] / Math.max(1, workerCount(s));
      const gap = want[n] - have + (s.res[n] < 60 ? .18 : 0);
      if (gap > bestGap){ bestGap = gap; bestNode = n; }
    }
    assign(s, bestNode, 1);
  }
  // --- grow the workforce
  if (workerCount(s) < 6 + Math.floor(G.t / 55) && popUsed(s) < popCap(s) - 1) trainWorker(s);
  // --- build out, in order, keeping a farm ahead of the population
  const built = s.plot.filter(Boolean).length;
  const tight = popUsed(s) > popCap(s) - 4;
  if (built < s.plot.length){
    const next = tight ? 'farm' : AI_BUILD_PLAN[Math.min(built - 2, AI_BUILD_PLAN.length - 1)] || 'farm';
    const free = s.plot.indexOf(null);
    // For most buildings a copy and a level are the same thing — bLvl SUMS the
    // levels standing — but the Caster and Cannon gate reads barracksLvl, the
    // HIGHEST level, so a second level-1 barracks unlocks nothing. Sampling
    // once a second over sixteen matches, the Host could not pay the barracks
    // upgrade 99% of the time and 99% of those were short of wood — the wood
    // the plan was spending on the duplicate. When the plan calls for
    // something that already stands, level it instead of copying it.
    const dup = next === 'barracks' && bList(s, next).find(o => o.lvl < BUILDINGS[next].maxLvl);
    if (dup && canPay(s, buildCost(next, dup.lvl + 1))) upgradeBuilding(s, dup.tile);
    else if (free >= 0 && canPay(s, buildCost(next, 1))) build(s, free, next);
  }
  // --- level the important buildings once the plot is full
  if (built >= s.plot.length - 1 && arnd(s) < .5){
    // This list only meant "priority" while the top of it was affordable. A
    // farm level is cheap and a hold has five farms, so every tick the loop
    // fell through to a farm and ate the wood in small bites: measured over
    // twelve matches it spent 741 wood levelling farms — and 423 food, for
    // population it was nowhere near using — while never once saving the 188
    // the barracks wanted for the level that unlocks Cannons. It finished at
    // level 3 in 1 match of 12.
    //
    // So: walk the list in order, and if something near the top is close
    // enough to pay for within about half a minute of digging, hold the pile
    // for it instead of spending it further down.
    const pri = ['barracks','tavern','forge','farm','workshop','pit'];
    for (const type of pri){
      const b = bList(s, type).find(o => o.lvl < BUILDINGS[type].maxLvl);
      if (!b) continue;
      const cost = buildCost(type, b.lvl + 1);
      if (canPay(s, cost)){ upgradeBuilding(s, b.tile); break; }
      if (Object.keys(cost).every(k => s.res[k] >= cost[k] ||
          cost[k] - s.res[k] <= gatherRate(s, k) * 30)) break;      // nearly there — save up
    }
  }
  // --- arm the workers
  const bl = barracksLvl(s);
  if (bl > 0){
    const roll = arnd(s);
    const order = bl >= 3 ? (roll < .45 ? ['melee','cannon','caster'] : roll < .8 ? ['cannon','caster','melee'] : ['caster','melee','cannon'])
      : bl === 2 ? (roll < .6 ? ['melee','caster'] : ['caster','melee']) : ['melee'];
    for (const t of order){
      // A Footman is always affordable, so it won every race for the pair of
      // workers the hold was banking for a Caster: measured, a Caster was
      // never once clear to arm at a one-second sample even after the tier
      // was up — idle workers blocked it 100% of the time. Leave the pair
      // alone unless there is a spare worker beyond it — and step OVER the
      // Footman rather than stopping, or the pass never reaches the Cannon
      // and the Caster it is being kept for. (This was a `break`, which is
      // why a level-3 barracks armed a Cannon in only 3 holds of 12.)
      if (TRAIN[t].need < armNeed && s.workers.idle <= armNeed) continue;
      if (!trainUnit(s, t)) break;
    }
  }
  // --- forge work
  if (bLvl(s, 'forge') > 0 && arnd(s) < .7){
    const all = [...TOWER_UPS, ...TROOP_UPS];
    const pool = all.filter(u => (TOWER_UPS.includes(u) ? s.towerUp : s.troopUp)[u.id] < upCap(s));
    // buy the best value it can actually pay for, with a little noise so two
    // holds do not shop identically
    pool.sort((a, b) => upRate(s, b.id) * (.85 + arnd(s) * .3) - upRate(s, a.id));
    for (const u of pool) if (!buyUp(s, u.id)) break;
  }
  // --- heroes
  if (s.heroes.length < heroCap(s) && canPay(s, HERO_COST)){
    const roster = ['tank','fighter','marksman','mage','assassin','support'];
    const taken = new Set(s.heroes.map(h => h.cls));
    const cls = apick(s, roster.filter(c => !taken.has(c))) || apick(s, roster);
    createHero(s, cls);
  }
  for (const h of s.heroes) if (h.pend.length) autoPick(h);
}

/* =====================================================================
   MAIN LOOP
   ===================================================================== */
function update(dt){
  if (G.state !== 'play' || G.paused) return;
  dt = Math.min(dt, .05);
  G.dt = dt; G.t += dt;
  // Every per-side loop below swaps which hold goes first each tick: acting
  // first is a small edge that compounds into a measurable win-rate bias.
  G.frame = (G.frame || 0) + 1;
  const order = G.frame % 2 ? [1, 0] : [0, 1];
  for (const i of order){
    const s = G.sides[i];
    ecoStep(s, dt);
    if (s.ai) aiStep(s, dt);
  }
  G.waveT -= dt;
  if (G.waveT <= 0){ G.waveT = C.WAVE_PERIOD; spawnWave(); }
  rebuildGrid();
  const list = G.units.slice();
  // Acting first is a real advantage over thousands of ticks. Reversing the
  // list only alternated cleanly while it was still grouped by side, so walk
  // it once per side instead, swapping which side moves first each tick.
  for (const sd of order) for (const u of list){
    if (u.dead || u.side !== sd) continue;
    if (u.isHero) heroStep(u, dt); else unitStep(u, dt);
  }
  for (const sd of order) for (const h of G.sides[sd].heroes) if (h.dead) heroStep(h, dt);
  separate();
  for (const i of order) for (const st of G.sides[i].structs) structStep(st, dt);
  projStep(dt); zoneStep(dt);
  fxStep(dt);
  // heal-over-time buffs and expiring minion buffs
  for (const s of G.sides) for (const h of s.heroes){
    if (h.dead) continue;
    const hps = bsum(h, 'hps');
    if (hps) healUnit(h, hps * dt);
  }
  for (const u of G.units) if (u.mb){ u.mb.t -= dt; if (u.mb.t <= 0) u.mb = null; }
  pruneSel();
}

/* =====================================================================
   SOUND — everything is synthesised, so there is nothing to download and
   nothing to go stale. Silent under HEADLESS, silent until the first tap
   (browsers require a gesture), and hard-throttled so a wave-on-wave brawl
   cannot turn into a wall of noise.
   ===================================================================== */
const MUTE_KEY = 'ib_mute';
const AU = { ctx:null, master:null, noise:null, muted:false, last:{}, voices:0 };
try { AU.muted = localStorage.getItem(MUTE_KEY) === '1'; } catch (e){}

function audioStart(){
  if (HEADLESS || AU.ctx) return AU.ctx;
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return null;
  AU.ctx = new AC();
  AU.master = AU.ctx.createGain();
  AU.master.gain.value = AU.muted ? 0 : .5;
  AU.master.connect(AU.ctx.destination);
  // one shared noise buffer for every percussive sound
  const n = AU.ctx.sampleRate * .5;
  AU.noise = AU.ctx.createBuffer(1, n, AU.ctx.sampleRate);
  const d = AU.noise.getChannelData(0);
  for (let i = 0; i < n; i++) d[i] = Math.random() * 2 - 1;
  return AU.ctx;
}
function setMuted(m){
  AU.muted = m;
  try { localStorage.setItem(MUTE_KEY, m ? '1' : '0'); } catch (e){}
  if (AU.master) AU.master.gain.value = m ? 0 : .5;
}

function tone(o){
  const c = AU.ctx;
  const osc = c.createOscillator(), g = c.createGain();
  osc.type = o.type || 'sine';
  const t = c.currentTime + (o.at || 0);
  osc.frequency.setValueAtTime(o.f, t);
  if (o.f2) osc.frequency.exponentialRampToValueAtTime(Math.max(1, o.f2), t + o.dur);
  g.gain.setValueAtTime(0, t);
  g.gain.linearRampToValueAtTime(o.v, t + Math.min(.02, o.dur * .3));
  g.gain.exponentialRampToValueAtTime(.0001, t + o.dur);
  osc.connect(g); g.connect(AU.master);
  osc.start(t); osc.stop(t + o.dur + .02);
  AU.voices++;
  osc.onended = () => { AU.voices = Math.max(0, AU.voices - 1); };
}
function noiseHit(o){
  const c = AU.ctx;
  const src = c.createBufferSource(), g = c.createGain(), f = c.createBiquadFilter();
  src.buffer = AU.noise;
  f.type = o.hp ? 'highpass' : 'lowpass';
  f.frequency.value = o.cut || 900;
  const t = c.currentTime + (o.at || 0);
  g.gain.setValueAtTime(o.v, t);
  g.gain.exponentialRampToValueAtTime(.0001, t + o.dur);
  src.connect(f); f.connect(g); g.connect(AU.master);
  src.start(t); src.stop(t + o.dur + .02);
  AU.voices++;
  src.onended = () => { AU.voices = Math.max(0, AU.voices - 1); };
}

// key -> [minimum gap in seconds, player, important?]
// An important sound is never dropped by the voice cap: it is already rare by
// its own gap, and going deaf to a falling gate because six swords are
// swinging is exactly backwards.
const SFX = {
  hit:    [.055, () => noiseHit({ v:.14, dur:.05, cut:2600, hp:true })],
  hitBig: [.09,  () => { noiseHit({ v:.22, dur:.09, cut:1400 }); tone({ f:180, f2:90, dur:.09, v:.10, type:'square' }); }],
  stone:  [.10,  () => noiseHit({ v:.16, dur:.13, cut:700 })],
  die:    [.07,  () => tone({ f:340, f2:120, dur:.13, v:.10, type:'square' })],
  shot:   [.06,  () => tone({ f:900, f2:420, dur:.07, v:.06, type:'triangle' })],
  cast:   [.10,  () => { tone({ f:520, f2:1180, dur:.16, v:.09, type:'triangle' }); }],
  fall:   [.35,  () => { noiseHit({ v:.34, dur:.75, cut:420 }); tone({ f:110, f2:44, dur:.7, v:.24, type:'sine' });
                         tone({ f:70, f2:32, dur:.9, v:.18, type:'triangle', at:.05 }); }, 1],
  wave:   [1.0,  () => { tone({ f:196, dur:.34, v:.16, type:'sawtooth' }); tone({ f:262, dur:.42, v:.15, type:'sawtooth', at:.16 }); }, 1],
  level:  [.30,  () => { [523, 659, 784].forEach((f, i) => tone({ f, dur:.16, v:.11, type:'triangle', at:i * .06 })); }, 1],
  build:  [.20,  () => { tone({ f:660, dur:.10, v:.10, type:'sine' }); tone({ f:880, dur:.16, v:.09, type:'sine', at:.08 }); }, 1],
  hero:   [.40,  () => { [392, 330, 262].forEach((f, i) => tone({ f, dur:.22, v:.12, type:'sawtooth', at:i * .1 })); }, 1],
  win:    [1.0,  () => { [392, 523, 659, 784].forEach((f, i) => tone({ f, dur:.42, v:.15, type:'triangle', at:i * .13 })); }, 1],
  lose:   [1.0,  () => { [392, 311, 262, 196].forEach((f, i) => tone({ f, dur:.5, v:.15, type:'sawtooth', at:i * .15 })); }, 1],
  click:  [.03,  () => noiseHit({ v:.06, dur:.03, cut:3200, hp:true })],
  // A hero falling is the loudest thing that happens in a match and it used to
  // make no noise at all — a toast slid past and that was the whole event.
  heroDown:[.5, () => { tone({ f:330, f2:98, dur:.55, v:.17, type:'sawtooth' });
                        tone({ f:165, f2:60, dur:.7, v:.13, type:'triangle', at:.06 });
                        noiseHit({ v:.16, dur:.3, cut:900, at:.02 }); }, 1],
  // An inhibitor is not just another wall: it puts Siege Ogres on the bridge.
  inhib:  [.8,   () => { [262, 349, 523].forEach((f, i) => tone({ f, f2:f * .5, dur:.5, v:.14, type:'sawtooth', at:i * .11 }));
                         noiseHit({ v:.24, dur:.5, cut:520, at:.1 }); }, 1],
};

// worldX is optional: a sound from off the edge of the screen is not played.
function sfx(key, worldX){
  if (HEADLESS || AU.muted || !AU.ctx) return false;
  const d = SFX[key];
  if (!d) return false;
  const now = AU.ctx.currentTime;
  // If nothing has been asked for in a while the counter cannot legitimately
  // be high — reset it, so one lost onended callback cannot mute the session.
  if (now - (AU.lastAny || 0) > 1.5) AU.voices = 0;
  if ((AU.last[key] || -9) + d[0] > now) return false;
  if (!d[2] && AU.voices > 20) return false;
  if (worldX !== undefined){
    const p = (worldX - cam.x) * LS() * .96 + LW * .5;
    if (p < -140 || p > LW + 140) return false;
  }
  AU.last[key] = now; AU.lastAny = now;
  try { d[1](); } catch (e){ return false; }
  return true;
}

/* =====================================================================
   EFFECTS
   ===================================================================== */
function burstFx(x, y, col, n){
  if (HEADLESS) return;
  if (G.fx.length > 260) return;
  for (let i = 0; i < n; i++){
    const a = rnd() * 6.283, sp = rr(1, 6);
    G.fx.push({ k:'p', x, y, z:rr(.2, 1.2), vx:Math.cos(a) * sp, vy:Math.sin(a) * sp * .5, vz:rr(1, 5),
      t:rr(.35, .8), dur:.8, col, r:rr(1.4, 3.2) });
  }
}
function ringFx(x, y, r, col){ if (!HEADLESS) G.fx.push({ k:'ring', x, y, r, t:.42, dur:.42, col }); }
function boltFx(x, y, x2, y2, col){ if (!HEADLESS) G.fx.push({ k:'bolt', x, y, x2, y2, t:.22, dur:.22, col }); }
function addFloat(x, y, txt, col, sc){
  if (HEADLESS) return;
  if (G.floats.length > 90) G.floats.shift();
  // Three numbers landing on one body in the same tenth of a second used to
  // print on top of each other. Step each new one clear of whatever is still
  // rising near it, so a brawl reads as a column of numbers, not a smear.
  let ox = 0, oy = 0;
  for (const f of G.floats){
    if (f.t < .35 || Math.abs(f.x - x) > 1.6 || Math.abs(f.y - y) > 1.2) continue;
    ox = (Math.abs(ox) + .55) * (ox > 0 ? -1 : 1);
    oy -= .28;
  }
  G.floats.push({ x:x + ox, y:y + oy + rr(-.15, .15), txt, col, t:.95, dur:.95, sc:sc || 1, vy:rr(-.5, -.9) });
}
const CAST_COL = { dmg:'#ffa96a', heal:'#7fdc8a', buff:'#ffcf4d', cc:'#9ad8ff', move:'#bfe0ff', summon:'#c9a6ff' };
function castCol(s){ return s.magic ? '#b98bff' : (CAST_COL[s.tag] || '#ffa96a'); }

// You choose these skills, so you should be able to see them happen: the name
// of the ability rises off the hero that cast it, in the colour of its type.
function castFx(h, s){
  const col = castCol(s);
  ringFx(h.x, h.y, s.aoe || 2, col);
  burstFx(h.x, h.y, col, 8);
  if (G.floats.length < 80)
    G.floats.push({ x:h.x + rr(-.8, .8), y:h.y + rr(-.3, .3), txt:s.n.toUpperCase(), col,
      t:1.4, dur:1.4, sc:1, vy:-.55, cast:true, ult:!!s.ult });
}
// A blur of where the hero came from, so a dash reads as movement.
function dashFx(h, x0, y0){
  if (HEADLESS || G.fx.length > 220) return;
  for (let i = 1; i <= 5; i++)
    G.fx.push({ k:'ghost', x:lerp(x0, h.x, i / 6), y:lerp(y0, h.y, i / 6),
      col:SIDE_COL[h.side], t:.16 + i * .03, dur:.34, r:1 });
}
function healFx(x, y, col){
  if (HEADLESS || G.fx.length > 240) return;
  for (let i = 0; i < 6; i++)
    G.fx.push({ k:'p', x:x + rr(-.6, .6), y:y + rr(-.4, .4), z:rr(.3, 1),
      vx:0, vy:0, vz:rr(3, 5.5), t:rr(.4, .7), dur:.7, col:col || '#7fdc8a', r:rr(1, 2) });
}
function fxStep(dt){
  for (let i = G.fx.length - 1; i >= 0; i--){
    const p = G.fx[i]; p.t -= dt;
    if (p.k === 'p'){ p.x += p.vx * dt; p.y += p.vy * dt; p.z += p.vz * dt; p.vz -= 12 * dt; if (p.z < 0){ p.z = 0; p.vz *= -.35; } }
    if (p.t <= 0) G.fx.splice(i, 1);
  }
  for (let i = G.floats.length - 1; i >= 0; i--){
    const f = G.floats[i]; f.t -= dt; f.y += f.vy * dt;
    if (f.t <= 0) G.floats.splice(i, 1);
  }
  for (const z of G.zones) if (z.follow){ z.x = z.follow.x; z.y = z.follow.y; }
}
function fxToast(msg, kind){
  G.log.push({ t:G.t, msg });
  if (G.log.length > 40) G.log.shift();
  if (HEADLESS) return;
  const el = document.createElement('div');
  el.className = 'tst' + (kind ? ' ' + kind : '');
  el.textContent = msg;
  const box = document.getElementById('toast');
  box.appendChild(el);
  setTimeout(() => el.remove(), 2200);
  while (box.children.length > 3) box.firstChild.remove();
}

/* =====================================================================
   RENDERING — shared
   ===================================================================== */
const cam = { x:26, z:1, follow:true, tz:1, shake:0, sx:0, sy:0 };
let lcv, lctx, LW = 900, LH = 560;

function resize(){
  if (HEADLESS) return;
  const dpr = Math.min(window.innerWidth < 760 ? 1.6 : 2, window.devicePixelRatio || 1);
  const r = lcv.getBoundingClientRect();
  LW = Math.max(80, r.width); LH = Math.max(80, r.height);
  lcv.width = Math.round(LW * dpr); lcv.height = Math.round(LH * dpr);
  lctx = lcv.getContext('2d');
  lctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  const wasNarrow = document.body.classList.contains('narrow');
  const narrow = window.innerWidth < 760;
  document.body.classList.toggle('narrow', narrow);
  for (const el of document.querySelectorAll('#viewbtns [data-long]'))
    el.textContent = narrow ? el.dataset.short : el.dataset.long;
  if (wasNarrow !== narrow) syncUI();
}

const shade = (hex, f) => {
  const n = parseInt(hex.slice(1), 16);
  const r = clamp(Math.round(((n >> 16) & 255) * f), 0, 255);
  const g = clamp(Math.round(((n >> 8) & 255) * f), 0, 255);
  const b = clamp(Math.round((n & 255) * f), 0, 255);
  return '#' + ((1 << 24) | (r << 16) | (g << 8) | b).toString(16).slice(1);
};
function poly(c, pts, fill, stroke, lw){
  c.beginPath();
  c.moveTo(pts[0][0], pts[0][1]);
  for (let i = 1; i < pts.length; i++) c.lineTo(pts[i][0], pts[i][1]);
  c.closePath();
  if (fill){ c.fillStyle = fill; c.fill(); }
  if (stroke){ c.strokeStyle = stroke; c.lineWidth = lw || 1; c.stroke(); }
}
function ell(c, x, y, rx, ry, fill){
  c.beginPath(); c.ellipse(x, y, rx, ry, 0, 0, 6.2832); c.fillStyle = fill; c.fill();
}

/* =====================================================================
   RENDERING — the bridge
   ===================================================================== */
const LS = () => 9.4 * cam.z;
// A phone got the same zoom floor as a laptop, which left the world a thin
// ribbon in a very large sky. A narrow screen starts closer in: you see less
// of the bridge at once, but you can actually read what is on it.
const ZOOM_MIN = .42, ZOOM_MAX = 2.2;
const startZoom = (w) => w < 760 ? clamp(w / 520, .72, .95) : clamp(w / 1100, .55, .95);
function lp(x, y, z){
  const S = LS();
  return [
    (x - cam.x) * S * .96 - y * S * .52 + LW * .5 + cam.sx,
    (x - cam.x) * S * .07 + y * S * .60 + LH * .60 - (z || 0) * S * .95 + cam.sy,
  ];
}
// A knock felt through the camera. Capped, and only when the hit is on screen,
// so a brawl at the far end of the world never rattles the hold you are in.
function shake(amount, worldX){
  if (HEADLESS) return;
  const p = (worldX - cam.x) * LS() * .96 + LW * .5;
  if (p < -120 || p > LW + 120) return;
  cam.shake = Math.min(14, cam.shake + amount);
}
const DECK = { top:'#938b79', top2:'#a09884', side:'#544c42', edge:'#3f3931', rail:'#7a7060' };

function drawSky(c){
  const g = c.createLinearGradient(0, 0, 0, LH);
  g.addColorStop(0, '#6f97ab'); g.addColorStop(.34, '#87a9ac'); g.addColorStop(.55, '#5e7f72'); g.addColorStop(1, '#1b2a26');
  c.fillStyle = g; c.fillRect(0, 0, LW, LH);
  // three parallax ridges receding into haze
  const bands = [
    { d:.10, y:.30, h:.26, col:'rgba(96,124,132,.55)' },
    { d:.20, y:.38, h:.24, col:'rgba(72,101,96,.68)' },
    { d:.34, y:.47, h:.22, col:'rgba(48,74,64,.85)' },
  ];
  for (const b of bands){
    c.fillStyle = b.col;
    c.beginPath();
    c.moveTo(-40, LH);
    for (let i = -1; i < 9; i++){
      const bx = ((i * 230 - cam.x * LS() * b.d) % (LW + 690) + LW + 690) % (LW + 690) - 230;
      c.lineTo(bx, LH * (b.y + b.h));
      c.lineTo(bx + 70, LH * b.y - (i % 3) * 16);
      c.lineTo(bx + 140, LH * (b.y + b.h * .55));
      c.lineTo(bx + 215, LH * (b.y + .04));
    }
    c.lineTo(LW + 60, LH); c.closePath(); c.fill();
  }
  drawClouds(c);
  // valley floor + the mist that hides how far down it goes
  const vg = c.createLinearGradient(0, LH * .55, 0, LH);
  vg.addColorStop(0, 'rgba(38,60,52,.85)'); vg.addColorStop(.5, 'rgba(20,34,32,.92)'); vg.addColorStop(1, '#0c1414');
  c.fillStyle = vg; c.fillRect(0, LH * .55, LW, LH * .45);
  for (let i = 0; i < 5; i++){
    const y = LH * (.60 + i * .07), a = .05 + .03 * Math.sin(G.t * .3 + i);
    c.fillStyle = 'rgba(200,225,230,' + a.toFixed(3) + ')';
    c.fillRect(0, y, LW, LH * .05);
  }
  drawBirds(c);
}

/* -------------------------------------------------------------- the sky
   Half of a 9:16 phone is sky. It used to be a flat gradient, so the world
   read as a thin ribbon in an empty room. Clouds and birds are laid out once
   from a fixed hash — no RNG the simulation can see — and only ever drift.  */
const SKY_SPAN = 2600;                    // one world-length of cloud, wrapped
let CLOUDS = null;
function clouds(){
  if (CLOUDS) return CLOUDS;
  CLOUDS = [];
  for (let i = 0; i < 14; i++){
    const r = hash2(i * 3.7, 11.3), r2 = hash2(i * 1.9, 47.1), r3 = hash2(i * 5.3, 7.7);
    CLOUDS.push({
      x:(i / 14 + r * .05) * SKY_SPAN,
      y:.05 + r2 * .30,                   // fraction of the canvas height
      s:.55 + r3 * 1.1,                   // size
      d:.05 + (i % 3) * .045,             // parallax depth
      a:.13 + r2 * .16,
      w:2 + Math.floor(r3 * 3),           // puffs
    });
  }
  return CLOUDS;
}
function drawClouds(c){
  const drift = G.t * 3.5;
  for (const cl of clouds()){
    let x = ((cl.x - cam.x * LS() * cl.d - drift * cl.d * 8) % SKY_SPAN + SKY_SPAN) % SKY_SPAN - 200;
    if (x < -260 || x > LW + 260) continue;
    const y = LH * cl.y, R = 26 * cl.s * (.7 + cam.z * .5);
    // one path, one fill — puffs drawn separately stack their alpha and read
    // as a row of flat discs instead of a cloud
    c.beginPath();
    for (let i = 0; i <= cl.w; i++){
      const f = 1 - Math.abs(i - cl.w / 2) / (cl.w + 1);
      c.ellipse(x + i * R * .82, y - f * R * .22, R * (.55 + f * .55), R * (.30 + f * .24), 0, 0, 6.2832);
    }
    c.fillStyle = 'rgba(236,244,246,' + cl.a.toFixed(3) + ')';
    c.fill();
  }
}
const FLOCKS = [{ y:.20, sp:11, ph:0 }, { y:.27, sp:8, ph:.45 }, { y:.16, sp:14, ph:.78 }];
function drawBirds(c){
  c.strokeStyle = 'rgba(30,44,48,.42)';
  c.lineWidth = Math.max(1, 1.2 * cam.z);
  for (let f = 0; f < FLOCKS.length; f++){
    const fl = FLOCKS[f];
    const span = LW + 360;
    const x0 = (((G.t * fl.sp + fl.ph * span) % span) + span) % span - 180;
    for (let i = 0; i < 3; i++){
      const x = x0 - i * 15, y = LH * fl.y + Math.sin(G.t * .6 + f + i) * 5 + i * 7;
      if (x < -30 || x > LW + 30) continue;
      const w = 4 + Math.sin(G.t * 5 + i + f) * 2.2;      // wingbeat
      c.beginPath();
      c.moveTo(x - 5, y); c.quadraticCurveTo(x - 2, y - w, x, y);
      c.quadraticCurveTo(x + 2, y - w, x + 5, y);
      c.stroke();
    }
  }
}

function drawDeck(c){
  const W = C.LANE_W / 2 + .6;
  const seg = 4;
  for (let x = 0; x < C.LANE_LEN; x += seg){
    const x2 = Math.min(C.LANE_LEN, x + seg);
    const a = lp(x, -W), b = lp(x2, -W), d = lp(x2, W), e = lp(x, W);
    if (Math.max(a[0], b[0]) < -80 || Math.min(a[0], b[0]) > LW + 80) continue;
    const k = (Math.floor(x / seg) % 2) === 0;
    poly(c, [a, b, d, e], k ? DECK.top : DECK.top2);
    // underside so the bridge reads as stone with weight
    const a2 = lp(x, W, -1.6), b2 = lp(x2, W, -1.6);
    poly(c, [e, d, b2, a2], DECK.side);
    poly(c, [a, b, lp(x2, -W, -1.1), lp(x, -W, -1.1)], DECK.edge);
    // planks / joint lines
    c.strokeStyle = 'rgba(40,36,30,.35)'; c.lineWidth = 1;
    c.beginPath(); c.moveTo(b[0], b[1]); c.lineTo(d[0], d[1]); c.stroke();
  }
  // railings
  for (const side of [-1, 1]){
    const y = side * W;
    for (let x = 0; x <= C.LANE_LEN; x += 4){
      const p0 = lp(x, y), p1 = lp(x, y, 1.1);
      if (p0[0] < -40 || p0[0] > LW + 40) continue;
      c.strokeStyle = DECK.rail; c.lineWidth = Math.max(1, 2.4 * cam.z);
      c.beginPath(); c.moveTo(p0[0], p0[1]); c.lineTo(p1[0], p1[1]); c.stroke();
      const q = lp(Math.min(C.LANE_LEN, x + 4), y, 1.1);
      c.strokeStyle = shade(DECK.rail, 1.15);
      c.beginPath(); c.moveTo(p1[0], p1[1]); c.lineTo(q[0], q[1]); c.stroke();
    }
  }
  // Abutments: the span has to visibly land ON the rock at both ends, or the
  // deck just disappears into the cliff face.
  for (const i of [0, 1]){
    const bxx = i === 0 ? 0 : C.LANE_LEN;
    const d = i === 0 ? 1 : -1;
    const a0 = lp(bxx - d * 5, -W), a1 = lp(bxx + d * 5, -W), a2 = lp(bxx + d * 5, W), a3 = lp(bxx - d * 5, W);
    if (a0[0] < -200 || a0[0] > LW + 200) continue;
    const dz = -9;
    poly(c, [a3, a2, lp(bxx + d * 5, W, dz), lp(bxx - d * 5, W, dz)], '#5b5348');
    poly(c, [a1, a2, lp(bxx + d * 5, W, dz), lp(bxx + d * 5, -W, dz)], '#4a4339');
    poly(c, [a0, a1, a2, a3], '#6f6759');
    c.globalAlpha = .4;
    for (let k = -2; k <= 2; k++)
      poly(c, [lp(bxx - d * 5, k * 2), lp(bxx + d * 5, k * 2), lp(bxx + d * 5, k * 2 + .5), lp(bxx - d * 5, k * 2 + .5)], '#3f392f');
    c.globalAlpha = 1;
  }
  // arches under the span
  c.fillStyle = 'rgba(46,42,36,.75)';
  for (let x = 8; x < C.LANE_LEN; x += 16){
    const p = lp(x, W, -1.6);
    if (p[0] < -60 || p[0] > LW + 60) continue;
    c.beginPath(); c.ellipse(p[0], p[1] + 6 * cam.z, 22 * cam.z, 30 * cam.z, 0, 0, Math.PI); c.fill();
  }
}

function drawEnds(c){
  for (const s of G.sides){
    const dir = dirOf(s.i);
    const bx = s.i === 0 ? -5 : C.LANE_LEN + 5;
    const p = lp(bx, 0);
    if (p[0] < -420 || p[0] > LW + 420) continue;
    const z = cam.z;
    // the keep behind the gates, in the same masonry as everything else
    const col = SIDE_COL[s.i];
    const kp = lp(bx - dir * 11, 0);
    const wallY = kp[1] - 34 * z;
    block(c, kp[0] - 48 * z, wallY - 44 * z, 96 * z, 56 * z, STONE.mid, STONE.lit);
    masonry(c, kp[0] - 46 * z, wallY - 42 * z, 92 * z, 50 * z, z, 41 + s.i);
    crown(c, kp[0], wallY - 52 * z, 100 * z, z, 9);
    c.fillStyle = '#3a332b';
    c.beginPath(); c.arc(kp[0], wallY - 4 * z, 14 * z, Math.PI, 0); c.fill();
    c.fillRect(kp[0] - 14 * z, wallY - 4 * z, 28 * z, 16 * z);
    for (const sx of [-1, 1]){
      const tx = kp[0] + sx * 58 * z;
      block(c, tx - 16 * z, wallY - 74 * z, 32 * z, 86 * z, STONE.mid, STONE.lit);
      masonry(c, tx - 15 * z, wallY - 72 * z, 30 * z, 80 * z, z, 51 + sx * 3 + s.i);
      poly(c, [[tx - 23 * z, wallY - 72 * z], [tx, wallY - 108 * z], [tx + 23 * z, wallY - 72 * z]], shade(col, .98));
      poly(c, [[tx, wallY - 108 * z], [tx + 23 * z, wallY - 72 * z], [tx + 8 * z, wallY - 72 * z]], shade(col, .72));
      c.fillStyle = STONE.line; c.fillRect(tx - 3 * z, wallY - 56 * z, 6 * z, 14 * z);
    }
    pennant(c, kp[0] + dir * 20 * z, wallY - 76 * z, z, col, dir);
    c.fillStyle = '#e7ecf6'; c.font = 'bold ' + Math.max(9, Math.round(11 * z)) + 'px system-ui'; c.textAlign = 'center';
    c.fillText(SIDE_NAME[s.i], kp[0], wallY - 118 * z);
  }
}

/* Storybook masonry: pale blocks with a lit top edge, warm timber, a team
   roof and a lit eye. Everything is laid out in units around the ground
   anchor and multiplied by the zoom, so one set of numbers serves all sizes. */
const STONE = { lit:'#dde2da', mid:'#c8cec6', mid2:'#b4bbb3', dark:'#9aa29a', deep:'#7f877f', line:'#69716a' };
const WOOD = { lit:'#cda063', mid:'#ad8146', dark:'#8a6533' };

function block(c, x, y, w, h, face, top){
  c.fillStyle = face; c.fillRect(x, y, w, h);
  if (top){ c.fillStyle = top; c.fillRect(x, y, w, Math.max(1, h * .16)); }
}
// A crenellated crown: the solid band plus its merlons.
function crown(c, cx, y, w, u, n, wear){
  block(c, cx - w / 2, y, w, 7 * u, STONE.mid, STONE.lit);
  const step = w / n;
  for (let i = 0; i < n; i++){
    if (i % 2) continue;
    // a battered turret loses its teeth, and loses them in the same places
    // every frame — the wear is hashed, not rolled
    if (wear > 0 && hash2(i * 5.1, wear * 13.7) < wear * .55) continue;
    block(c, cx - w / 2 + i * step, y - 8 * u, step * 1.02, 9 * u, STONE.mid, STONE.lit);
  }
}

// A turret at a fifth of its health used to look exactly like a fresh one, so
// the only way to know which wall was about to fall was to read its bar. Now
// they crack, lose their crenellations, scorch and finally smoke.
const WEAR = (st) => {
  if (st.dead || !st.mhp) return 0;
  const f = clamp(st.hp / st.mhp, 0, 1);
  return f > .72 ? 0 : f > .42 ? 1 : f > .22 ? 2 : 3;
};
function battleDamage(c, st, X, top, w, h, u){
  const wear = WEAR(st);
  if (!wear) return;
  const seed = st.ord * 3.3 + st.side * 11.7;
  c.strokeStyle = 'rgba(38,34,30,.55)';
  c.lineWidth = Math.max(1, 1.3 * u);
  for (let i = 0; i < wear * 2; i++){
    const r1 = hash2(i * 2.7, seed), r2 = hash2(i * 4.3, seed + 1), r3 = hash2(i * 6.1, seed + 2);
    // a crack has to stay on the stone it is cracking
    const seg = Math.min(7 * u, h * .3);
    const x0 = X - w / 2 + r1 * w, y0 = top + r2 * (h - seg * 2);
    c.beginPath();
    c.moveTo(x0, y0);
    c.lineTo(x0 + (r3 - .5) * 8 * u, y0 + seg);
    c.lineTo(x0 + (r1 - .5) * 10 * u, y0 + seg * 2);
    c.stroke();
  }
  if (wear >= 2){
    // soot around the hits, not stains stuck on the stone
    c.globalAlpha = .16;
    for (let i = 0; i < 4; i++){
      const r = hash2(i * 8.9, seed + 5);
      ell(c, X - w / 2 + r * w, top + h * (.35 + r * .55), (2.4 + r * 2.6) * u, (1.8 + r * 1.8) * u, '#2b2622');
    }
    c.globalAlpha = 1;
  }
  if (wear >= 3){
    // smoke, drifting the way the wind takes the clouds
    for (let i = 0; i < 3; i++){
      const ph = G.t * .55 + i * .66 + seed;
      const k = ph % 1;
      c.globalAlpha = (1 - k) * .30;
      ell(c, X + (hash2(i, seed) - .5) * w * .5 + k * 9 * u, top - k * 26 * u,
        (3 + k * 7) * u, (2.6 + k * 6) * u, '#6d6a66');
    }
    c.globalAlpha = 1;
  }
}
// Scattered raised blocks so a flat wall reads as masonry.
function masonry(c, x, y, w, h, u, seed){
  for (let i = 0; i < 7; i++){
    const r = hash2(seed + i * 13, seed * 3 + i * 7);
    const bw = (4 + r * 5) * u, bh = 3.2 * u;
    const bx = x + r * (w - bw), by = y + hash2(seed + i, seed - i) * (h - bh);
    c.fillStyle = i % 2 ? STONE.lit : STONE.mid2;
    c.fillRect(bx, by, bw, bh);
  }
}
function pennant(c, x, y, u, col, dir){
  c.fillStyle = STONE.deep; c.fillRect(x - 1 * u, y - 4 * u, 2 * u, 16 * u);
  const w = 20 * u * dir, h = 13 * u;
  poly(c, [[x, y - 2 * u], [x + w, y - 4 * u], [x + w, y + h - 4 * u], [x, y + h - 2 * u]], col);
  poly(c, [[x, y - 2 * u], [x + w * .55, y - 3 * u], [x + w * .55, y + h - 3 * u], [x, y + h - 2 * u]], shade(col, 1.12));
}

function drawStructure(c, st){
  const p = lp(st.x, st.y);
  const u = cam.z, col = SIDE_COL[st.side], dead = st.dead;
  const dir = dirOf(st.side);          // which way this side faces the bridge
  const X = p[0], Y = p[1];
  ell(c, X, Y + 2 * u, (st.key === 'gate' ? 74 : 26) * u, (st.key === 'gate' ? 16 : 8) * u, 'rgba(0,0,0,.28)');

  if (st.key === 'gate'){
    if (dead){
      // knocked in: stumps of the two towers and a heap of blocks
      for (const sx of [-1, 1]){
        block(c, X + sx * 46 * u - 15 * u, Y - 26 * u, 30 * u, 26 * u, STONE.deep, STONE.dark);
        poly(c, [[X + sx * 46 * u - 15 * u, Y - 26 * u], [X + sx * 46 * u + 15 * u, Y - 20 * u], [X + sx * 46 * u + 15 * u, Y - 26 * u]], STONE.dark);
      }
      for (let i = 0; i < 9; i++){
        const r = hash2(i, st.side * 7);
        block(c, X - 40 * u + r * 80 * u, Y - (4 + r * 7) * u, (7 + r * 6) * u, (5 + r * 4) * u, STONE.dark, STONE.mid2);
      }
      c.globalAlpha = .5; ell(c, X, Y - 10 * u, 60 * u, 16 * u, 'rgba(60,55,50,.7)'); c.globalAlpha = 1;
    } else {
      // outbuilding with a tall team-coloured pyramid roof, set behind
      const ox = X - dir * 78 * u;
      block(c, ox - 20 * u, Y - 50 * u, 40 * u, 50 * u, STONE.mid, STONE.lit);
      masonry(c, ox - 20 * u, Y - 50 * u, 40 * u, 50 * u, u, 11 + st.side);
      poly(c, [[ox - 26 * u, Y - 48 * u], [ox, Y - 88 * u], [ox + 26 * u, Y - 48 * u]], shade(col, .95));
      poly(c, [[ox, Y - 88 * u], [ox + 26 * u, Y - 48 * u], [ox + 10 * u, Y - 48 * u]], shade(col, .74));
      c.fillStyle = STONE.line; c.fillRect(ox - 3 * u, Y - 40 * u, 6 * u, 14 * u);
      // curtain wall between the towers
      block(c, X - 30 * u, Y - 62 * u, 60 * u, 62 * u, STONE.mid, STONE.lit);
      masonry(c, X - 30 * u, Y - 60 * u, 60 * u, 56 * u, u, 3 + st.side);
      // timber lintel spanning both towers
      block(c, X - 62 * u, Y - 70 * u, 124 * u, 8 * u, WOOD.mid, WOOD.lit);
      block(c, X - 62 * u, Y - 62 * u, 124 * u, 3 * u, WOOD.dark);
      // ribbed roof over the gateway
      const ry = Y - 66 * u;
      poly(c, [[X - 34 * u, ry + 14 * u], [X - 26 * u, ry], [X + 26 * u, ry], [X + 34 * u, ry + 14 * u]], shade(col, 1.02));
      c.strokeStyle = shade(col, .72); c.lineWidth = Math.max(1, 1.4 * u);
      for (let i = -4; i <= 4; i++){
        const t = i / 4;
        c.beginPath(); c.moveTo(X + t * 26 * u, ry); c.lineTo(X + t * 34 * u, ry + 14 * u); c.stroke();
      }
      block(c, X - 35 * u, ry + 13 * u, 70 * u, 4 * u, shade(col, .66));
      // arched doorway: voussoir ring, then the doors
      c.fillStyle = STONE.lit;
      c.beginPath(); c.arc(X, Y - 30 * u, 24 * u, Math.PI, 0); c.fill();
      c.fillRect(X - 24 * u, Y - 30 * u, 48 * u, 30 * u);
      c.fillStyle = WOOD.mid;
      c.beginPath(); c.arc(X, Y - 30 * u, 18 * u, Math.PI, 0); c.fill();
      c.fillRect(X - 18 * u, Y - 30 * u, 36 * u, 30 * u);
      c.strokeStyle = WOOD.dark; c.lineWidth = Math.max(1, 1.2 * u);
      for (let i = -2; i <= 2; i++){
        c.beginPath(); c.moveTo(X + i * 7 * u, Y - 44 * u); c.lineTo(X + i * 7 * u, Y); c.stroke();
      }
      block(c, X - 18 * u, Y - 26 * u, 36 * u, 3.5 * u, '#6b7078');
      block(c, X - 18 * u, Y - 11 * u, 36 * u, 3.5 * u, '#6b7078');
      // the two gate towers
      for (const sx of [-1, 1]){
        const tx = X + sx * 46 * u;
        block(c, tx - 16 * u, Y - 86 * u, 32 * u, 86 * u, STONE.mid, STONE.lit);
        masonry(c, tx - 16 * u, Y - 84 * u, 32 * u, 80 * u, u, 21 + sx + st.side * 5);
        crown(c, tx, Y - 96 * u, 36 * u, u, 5, WEAR(st));
        battleDamage(c, st, tx, Y - 82 * u, 30 * u, 70 * u, u);
        c.fillStyle = STONE.line; c.fillRect(tx - 3 * u, Y - 66 * u, 6 * u, 15 * u);
        // timber palisade skirting the base
        for (let i = 0; i < 4; i++)
          block(c, tx + (sx > 0 ? 14 : -30) * u + i * 4 * u, Y - 20 * u, 3.4 * u, 20 * u, i % 2 ? WOOD.mid : WOOD.lit);
        block(c, tx - 18 * u, Y - 8 * u, 36 * u, 8 * u, STONE.deep, STONE.dark);
      }
      pennant(c, X + dir * 62 * u, Y - 92 * u, u, col, dir);
    }
  } else if (st.key === 'inhib'){
    block(c, X - 22 * u, Y - 12 * u, 44 * u, 12 * u, STONE.deep, STONE.dark);
    block(c, X - 17 * u, Y - 20 * u, 34 * u, 9 * u, STONE.mid, STONE.lit);
    if (!dead){
      const t = Math.sin(G.t * 2 + st.side) * .5 + .5;
      c.globalAlpha = .22 + t * .18;
      ell(c, X, Y - 38 * u, 30 * u, 30 * u, col);
      c.globalAlpha = 1;
      poly(c, [[X, Y - 62 * u], [X + 14 * u, Y - 36 * u], [X, Y - 16 * u], [X - 14 * u, Y - 36 * u]], shade(col, .9 + t * .25));
      poly(c, [[X, Y - 62 * u], [X, Y - 16 * u], [X - 14 * u, Y - 36 * u]], shade(col, 1.25));
      c.strokeStyle = '#ffffff'; c.lineWidth = 1;
      poly(c, [[X, Y - 62 * u], [X + 14 * u, Y - 36 * u], [X, Y - 16 * u], [X - 14 * u, Y - 36 * u]], null, '#eef6ff', 1);
      battleDamage(c, st, X, Y - 20 * u, 34 * u, 18 * u, u);
    } else {
      for (let i = 0; i < 5; i++){
        const r = hash2(i, 3 + st.side);
        block(c, X - 16 * u + r * 30 * u, Y - (5 + r * 6) * u, (6 + r * 5) * u, (5 + r * 3) * u, STONE.dark, STONE.mid2);
      }
    }
  } else {
    if (dead){
      block(c, X - 16 * u, Y - 14 * u, 32 * u, 14 * u, STONE.deep, STONE.dark);
      for (let i = 0; i < 6; i++){
        const r = hash2(i, st.ord + st.side * 9);
        block(c, X - 22 * u + r * 40 * u, Y - (4 + r * 6) * u, (6 + r * 5) * u, (4 + r * 4) * u, STONE.dark, STONE.mid2);
      }
      c.globalAlpha = .35; ell(c, X, Y - 6 * u, 26 * u, 8 * u, 'rgba(50,46,42,.8)'); c.globalAlpha = 1;
    } else {
      // flared footing → tapered shaft → crenellated crown → the eye
      poly(c, [[X - 21 * u, Y], [X + 21 * u, Y], [X + 16 * u, Y - 13 * u], [X - 16 * u, Y - 13 * u]], STONE.deep);
      block(c, X - 21 * u, Y - 5 * u, 42 * u, 5 * u, STONE.dark, STONE.mid2);
      for (const sx of [-1, 1]) block(c, X + sx * 15 * u - 5 * u, Y - 11 * u, 10 * u, 11 * u, STONE.dark, STONE.mid2);
      poly(c, [[X - 16 * u, Y - 12 * u], [X + 16 * u, Y - 12 * u], [X + 13 * u, Y - 58 * u], [X - 13 * u, Y - 58 * u]], STONE.mid);
      poly(c, [[X - 16 * u, Y - 12 * u], [X - 13 * u, Y - 58 * u], [X - 7 * u, Y - 58 * u], [X - 9 * u, Y - 12 * u]], STONE.lit);
      poly(c, [[X + 16 * u, Y - 12 * u], [X + 13 * u, Y - 58 * u], [X + 8 * u, Y - 58 * u], [X + 10 * u, Y - 12 * u]], STONE.mid2);
      masonry(c, X - 12 * u, Y - 54 * u, 24 * u, 40 * u, u, st.ord * 7 + st.side * 3);
      crown(c, X, Y - 68 * u, 32 * u, u, 5, WEAR(st));
      battleDamage(c, st, X, Y - 56 * u, 26 * u, 44 * u, u);
      // the eye — bright the instant it fires, dimming as it reloads
      const glow = clamp(st.cd * attackSpeedOf(st), 0, 1);
      c.globalAlpha = .18 + glow * .45;
      ell(c, X, Y - 38 * u, 16 * u, 16 * u, col);
      c.globalAlpha = 1;
      ell(c, X, Y - 38 * u, 9 * u, 9 * u, STONE.lit);
      ell(c, X, Y - 38 * u, 7 * u, 7 * u, shade(col, .8 + glow * .5));
      ell(c, X - 2 * u, Y - 40 * u, 2.6 * u, 2.6 * u, '#ffffff');
      pennant(c, X + dir * 14 * u, Y - 50 * u, u, col, dir);
    }
  }
  if (!dead) hpBar(c, X, Y - (st.key === 'gate' ? 116 : st.key === 'inhib' ? 72 : 84) * cam.z, st, 44 * cam.z, true);
  else if (st.downT > 0){
    c.fillStyle = '#d8c49a'; c.font = Math.max(9, Math.round(11 * cam.z)) + 'px system-ui'; c.textAlign = 'center';
    c.fillText(Math.ceil(st.downT) + 's', p[0], p[1] - 18 * cam.z);
  }
  if (st.hitT > 0 && !dead){
    c.globalAlpha = st.hitT * 2.2; ell(c, p[0], p[1] - 20 * cam.z, 26 * cam.z, 20 * cam.z, '#ffffff'); c.globalAlpha = 1;
  }
  // Every building in the hold carries its name; nothing on the bridge did.
  // Nine identical towers and two diamonds, and the only place their names
  // appeared was a toast that had already scrolled away ('Ember Host loses
  // Inner Turret') or a panel you had to click each one to read. Worse, the
  // rule that decides the whole match — only the outermost standing structure
  // can be attacked — was invisible: you could not see where your wave would
  // land or which of yours was in the firing line. So: short names on the
  // bridge, in the side's colour, and the one in play says so.
  //
  // Short names, not the full ones: measured at the zoom the camera buttons
  // actually land on (0.95 desktop, 0.75-0.78 on a phone) adjacent structures
  // sit 79px apart on the desktop and 62px on the narrowest phone, and 'Inner
  // Turret' is ~68px of 9px type. 'Inner' is ~34.
  const lab = structLabel(st);
  if (lab) labelQ.push({ x:X, y:Y - (st.key === 'gate' ? 128 : st.key === 'inhib' ? 84 : 96) * cam.z,
    txt:lab.txt, col:lab.col, small:true });
}
// The bridge is read at a glance and a full name is twice the width of the gap
// between two towers, so the world gets the short form and the inspect panel
// keeps the full one.
const STRUCT_SHORT = { gate:'Gates', inhib:'Inhibitor', t3:'Inner', t2:'Mid', t1:'Outer' };
// Kept out of the draw call so it can be checked without a canvas: a rubble
// heap already prints its own rebuild countdown, so only standing structures
// get a name.
function structLabel(st){
  if (st.dead) return null;
  return { txt:(STRUCT_SHORT[st.key] || st.n) + (st === frontStruct(st.side) ? ' · in play' : ''),
    col:st.side === 0 ? '#bfe0ff' : '#ffc4bd' };
}

function hpBar(c, x, y, u, w, big){
  const f = clamp(u.hp / u.mhp, 0, 1);
  const h = big ? 5 * cam.z : 3.2 * cam.z;
  c.fillStyle = 'rgba(8,10,14,.8)'; c.fillRect(x - w / 2 - 1, y - 1, w + 2, h + 2);
  c.fillStyle = u.side === 0 ? '#54d06a' : '#e0544a';
  c.fillRect(x - w / 2, y, w * f, h);
  if (u.shield > 0){
    const sf = clamp(u.shield / u.mhp, 0, 1);
    c.fillStyle = 'rgba(220,235,255,.85)';
    c.fillRect(x - w / 2, y, w * Math.min(1, sf), h * .45);
  }
}

// A brawl is twenty bodies deep and every one of them used to carry a health
// bar, which turned the middle of the bridge into a staircase of green and
// red. A minion earns its bar by being hurt or shielded; a hero always keeps
// one, because a hero is the thing you are watching.
const showsBar = (u) => !!u.isHero || u.hp < u.mhp - .5 || u.shield > 0;

// A siege engine is worth about four bodies and used to look like a man
// carrying a crate. Each kind gets its own silhouette, so what is walking at
// you is legible from across the bridge instead of from the health bar.
function drawCannon(c, u, bx, by, floor, sc, col){
  const dir = dirOf(u.side), hit = u.hitT > 0;
  const wood = hit ? '#ffffff' : '#6b5334', iron = hit ? '#ffffff' : '#3d3a35';
  // two wheels
  for (const wx of [-5, 4.5]){
    ell(c, bx + wx * sc, floor - 3 * sc, 3.4 * sc, 3.4 * sc, iron);
    ell(c, bx + wx * sc, floor - 3 * sc, 1.4 * sc, 1.4 * sc, shade(wood, 1.25));
  }
  // carriage
  poly(c, [[bx - 7 * sc, floor - 4 * sc], [bx + 6 * sc, floor - 5 * sc],
           [bx + 6 * sc, floor - 8 * sc], [bx - 7 * sc, floor - 7 * sc]], wood);
  // barrel, angled the way it fires
  const y0 = floor - 8.5 * sc;
  poly(c, [[bx - dir * 4 * sc, y0], [bx + dir * 8 * sc, y0 - 5 * sc],
           [bx + dir * 8 * sc, y0 - 8 * sc], [bx - dir * 4 * sc, y0 - 3.5 * sc]], iron);
  ell(c, bx + dir * 8 * sc, y0 - 6.4 * sc, 1.9 * sc, 2.2 * sc, shade(iron, .7));
  // team pennant so you can still tell whose it is
  c.fillStyle = hit ? '#ffffff' : col;
  c.fillRect(bx - dir * 7 * sc, floor - 15 * sc, 1.2 * sc, 8 * sc);
  poly(c, [[bx - dir * 7 * sc, floor - 15 * sc], [bx - dir * 12 * sc, floor - 13.5 * sc],
           [bx - dir * 7 * sc, floor - 11.5 * sc]], hit ? '#ffffff' : col);
}

function drawOgre(c, u, bx, by, floor, sc, col){
  const dir = dirOf(u.side), hit = u.hitT > 0;
  const skin = hit ? '#ffffff' : shade(col, .62);
  c.strokeStyle = shade(col, .40); c.lineWidth = 3.2 * sc;
  c.beginPath();
  c.moveTo(bx - 3 * sc, by); c.lineTo(bx - 4 * sc, floor);
  c.moveTo(bx + 3 * sc, by); c.lineTo(bx + 4 * sc, floor); c.stroke();
  // hunched barrel of a body — wide at the shoulders, small head sunk into it.
  // It has to tower over the infantry: an ogre is worth a whole wave.
  poly(c, [[bx - 6.5 * sc, by], [bx + 6.5 * sc, by], [bx + 8 * sc, by - 13 * sc],
           [bx - 8 * sc, by - 13 * sc]], hit ? '#ffffff' : col);
  ell(c, bx + dir * 1.5 * sc, by - 15.4 * sc, 3.6 * sc, 3.2 * sc, skin);
  c.fillStyle = shade(col, .5);
  c.fillRect(bx - 8 * sc, by - 9 * sc, 16 * sc, 2.4 * sc);
  // club, raised on the swing
  const sw = u.swing > 0 ? 1 : 0;
  c.strokeStyle = '#5b4426'; c.lineWidth = 3.4 * sc; c.lineCap = 'round';
  c.beginPath();
  c.moveTo(bx + dir * 5.5 * sc, by - 7 * sc);
  c.lineTo(bx + dir * (11 + sw * 2) * sc, by - (16 - sw * 11) * sc);
  c.stroke(); c.lineCap = 'butt';
  ell(c, bx + dir * (12 + sw * 2) * sc, by - (17.5 - sw * 12) * sc, 3.4 * sc, 3.8 * sc, '#6f5730');
}

function drawUnit(c, u){
  const p = lp(u.x, u.y), S = LS();
  const col = SIDE_COL[u.side], sc = (u.isHero ? 1.75 : u.kind === 'super' ? 1.6 : u.kind === 'cannon' ? 1.45 : 1.18) * cam.z;
  ell(c, p[0], p[1] + 1, (u.kind === 'cannon' ? 9 : 7) * sc, 3.4 * sc, 'rgba(0,0,0,.32)');
  const bob = Math.sin(G.t * 7 + u.ph) * (u.target && Math.hypot(u.target.x - u.x, u.target.y - u.y) < u.rng + 1 ? .6 : 1.4) * sc * .4;
  const bx = p[0], by = p[1] - 2 * sc + bob;
  if (u.kind === 'cannon'){ drawCannon(c, u, bx, by, p[1], sc, col); return drawUnitMarks(c, u, bx, by, p, sc); }
  if (u.kind === 'super'){ drawOgre(c, u, bx, by, p[1], sc, col); return drawUnitMarks(c, u, bx, by, p, sc); }
  // legs + body
  c.strokeStyle = shade(col, .45); c.lineWidth = 2 * sc;
  c.beginPath(); c.moveTo(bx - 2 * sc, by); c.lineTo(bx - 2.6 * sc, p[1]); c.moveTo(bx + 2 * sc, by); c.lineTo(bx + 2.6 * sc, p[1]); c.stroke();
  const body = u.hitT > 0 ? '#ffffff' : col;
  c.fillStyle = body;
  c.beginPath();
  c.moveTo(bx - 4.2 * sc, by); c.lineTo(bx + 4.2 * sc, by);
  c.lineTo(bx + 3.2 * sc, by - 9 * sc); c.lineTo(bx - 3.2 * sc, by - 9 * sc);
  c.closePath(); c.fill();
  c.fillStyle = shade(body, .72);
  c.fillRect(bx - 4.2 * sc, by - 4 * sc, 8.4 * sc, 1.6 * sc);
  // head
  ell(c, bx, by - 11.6 * sc, 3 * sc, 3.2 * sc, u.hitT > 0 ? '#ffffff' : '#e8d6b8');
  const hooded = u.kind === 'caster' || u.cls === 'mage' || u.cls === 'support';
  if (hooded){
    // a hood, not a helmet — the caster reads as a caster before it casts
    poly(c, [[bx - 3.6 * sc, by - 10.2 * sc], [bx, by - 16.4 * sc], [bx + 3.6 * sc, by - 10.2 * sc]],
      u.hitT > 0 ? '#ffffff' : shade(col, .58));
  } else {
    c.fillStyle = shade(col, .55);
    c.fillRect(bx - 3.1 * sc, by - 14.4 * sc, 6.2 * sc, 2.6 * sc);
    // a footman is the one wearing real armour, and it shows
    if (u.kind === 'melee' || u.isHero){
      c.fillStyle = shade(col, u.hitT > 0 ? 1 : .38);
      c.fillRect(bx - 3.6 * sc, by - 15.6 * sc, 7.2 * sc, 1.4 * sc);
    }
  }
  // weapon by role
  const sw = u.swing > 0 ? 1 : 0;
  c.strokeStyle = '#d8dbe2'; c.lineWidth = 1.7 * sc; c.lineCap = 'round';
  const dir = dirOf(u.side);
  c.beginPath();
  if (u.kind === 'caster' || u.cls === 'mage' || u.cls === 'support'){
    c.moveTo(bx + dir * 4 * sc, by - 2 * sc); c.lineTo(bx + dir * 5 * sc, by - 15 * sc);
    c.stroke();
    ell(c, bx + dir * 5 * sc, by - 16 * sc, 2.2 * sc, 2.2 * sc, u.side === 0 ? '#9ad8ff' : '#ffb08a');
    c.beginPath();
  } else if (u.rng > 3){
    c.moveTo(bx + dir * 3 * sc, by - 9 * sc); c.lineTo(bx + dir * 6 * sc, by - 3 * sc);
  } else {
    c.moveTo(bx + dir * 3.5 * sc, by - 6 * sc);
    c.lineTo(bx + dir * (7 + sw * 3) * sc, by - (10 - sw * 7) * sc);
  }
  c.stroke(); c.lineCap = 'butt';
  // shield arm, on the side away from the enemy — levies carry a round buckler,
  // footmen a kite shield, which is most of the difference between them
  if (u.kind === 'grunt' || u.kind === 'melee' || (u.isHero && u.rng <= 3)){
    const sx = bx - dir * 3.6 * sc;
    if (u.kind === 'grunt') ell(c, sx, by - 5 * sc, 2.6 * sc, 2.8 * sc, shade(col, u.hitT > 0 ? 1 : .5));
    else poly(c, [[sx - 2.6 * sc, by - 8.4 * sc], [sx + 2.6 * sc, by - 8.4 * sc],
                  [sx + 2.6 * sc, by - 3.4 * sc], [sx, by - .8 * sc], [sx - 2.6 * sc, by - 3.4 * sc]],
              shade(col, u.hitT > 0 ? 1 : .46));
  }
  drawUnitMarks(c, u, bx, by, p, sc);
}

// Shields, burns, stuns, the health bar and everything a hero carries — shared
// by the three silhouettes so a cannon can catch fire like anybody else.
function drawUnitMarks(c, u, bx, by, p, sc){
  const col = SIDE_COL[u.side];
  if (u.shield > 0){
    c.globalAlpha = .3; ell(c, bx, by - 6 * sc, 9 * sc, 11 * sc, '#cfe6ff'); c.globalAlpha = 1;
  }
  if (u.burn){ c.globalAlpha = .5; ell(c, bx, by - 6 * sc, 5 * sc, 8 * sc, '#ff8a3d'); c.globalAlpha = 1; }
  if (u.stunT > 0){
    c.fillStyle = '#ffcf4d';
    for (let i = 0; i < 3; i++){
      const a = G.t * 6 + i * 2.1;
      ell(c, bx + Math.cos(a) * 6 * sc, by - 17 * sc + Math.sin(a) * 2 * sc, 1.5 * sc, 1.5 * sc, '#ffcf4d');
    }
  }
  if (showsBar(u)) hpBar(c, bx, by - (u.isHero ? 22 : u.kind === 'super' ? 21 : 18) * sc, u, (u.isHero ? 30 : 17) * sc, u.isHero);
  if (u.isHero && u.buffs && u.buffs.some(b => b.t > 0)){
    c.globalAlpha = .5 + .2 * Math.sin(G.t * 5);
    c.strokeStyle = '#ffcf4d'; c.lineWidth = Math.max(1.2, 2 * cam.z);
    c.beginPath(); c.ellipse(bx, p[1], 13 * sc, 6 * sc, 0, 0, 6.2832); c.stroke();
    c.globalAlpha = 1;
  }
  if (u.isHero){
    c.fillStyle = '#0b0f18'; c.strokeStyle = col; c.lineWidth = 1.4;
    c.beginPath(); c.arc(bx - 20 * sc, by - 20 * sc, 6.5 * sc, 0, 6.2832); c.fill(); c.stroke();
    c.fillStyle = '#ffcf4d'; c.font = 'bold ' + Math.max(7, Math.round(7.5 * sc)) + 'px system-ui'; c.textAlign = 'center'; c.textBaseline = 'middle';
    c.fillText(String(u.lvl), bx - 20 * sc, by - 19.6 * sc);
    labelQ.push({ x:bx, y:by - 26 * sc, txt:u.name, col:u.side === 0 ? '#bfe0ff' : '#ffc4bd', small:true });
    c.strokeStyle = 'rgba(255,255,255,.25)'; c.lineWidth = 1;
    c.beginPath(); c.ellipse(bx, p[1], 11 * sc, 5 * sc, 0, 0, 6.2832); c.stroke();
  }
}

function drawLane(c){
  // zones under everyone
  for (const z of G.zones){
    const p = lp(z.x, z.y);
    c.globalAlpha = .22 + .1 * Math.sin(G.t * 6);
    ell(c, p[0], p[1], z.r * LS() * .96, z.r * LS() * .55, z.magic ? '#a06bff' : '#ff8a3d');
    c.globalAlpha = 1;
  }
  const draws = [];
  for (const s of G.sides) for (const st of s.structs) draws.push({ y:lp(st.x, st.y)[1], f:() => drawStructure(c, st) });
  for (const u of G.units){ if (!u.dead) draws.push({ y:lp(u.x, u.y)[1], f:() => drawUnit(c, u) }); }
  draws.sort((a, b) => a.y - b.y);
  for (const d of draws) d.f();
  // projectiles
  for (const p of G.projs){
    const q = lp(p.x, p.y, p.z);
    c.globalAlpha = .55; ell(c, q[0], q[1], 4.5 * cam.z, 4.5 * cam.z, p.col); c.globalAlpha = 1;
    ell(c, q[0], q[1], 2.2 * cam.z, 2.2 * cam.z, '#ffffff');
  }
  // particles
  for (const p of G.fx){
    const a = clamp(p.t / p.dur, 0, 1);
    if (p.k === 'p'){
      const q = lp(p.x, p.y, p.z);
      c.globalAlpha = a; ell(c, q[0], q[1], p.r * cam.z, p.r * cam.z, p.col);
    } else if (p.k === 'ring'){
      const q = lp(p.x, p.y);
      c.globalAlpha = a * .8; c.strokeStyle = p.col; c.lineWidth = 2.5 * cam.z;
      c.beginPath(); c.ellipse(q[0], q[1], p.r * LS() * (1.35 - a * .35), p.r * LS() * .55 * (1.35 - a * .35), 0, 0, 6.2832); c.stroke();
    } else if (p.k === 'ghost'){
      const q = lp(p.x, p.y);
      c.globalAlpha = a * .45;
      ell(c, q[0], q[1] - 7 * cam.z, 4.5 * cam.z, 9 * cam.z, p.col);
    } else if (p.k === 'bolt'){
      const q = lp(p.x, p.y, .8), q2 = lp(p.x2, p.y2, .8);
      c.globalAlpha = a; c.strokeStyle = p.col; c.lineWidth = 2.4 * cam.z;
      c.beginPath(); c.moveTo(q[0], q[1]); c.lineTo(q2[0], q2[1]); c.stroke();
    }
    c.globalAlpha = 1;
  }
  // damage numbers
  c.textAlign = 'center';
  for (const f of G.floats){
    const q = lp(f.x, f.y, f.cast ? 2.4 : 1.4);
    c.globalAlpha = clamp(f.t / f.dur, 0, 1);
    const y = q[1] - (1 - f.t / f.dur) * (f.cast ? 30 : 22);
    if (f.cast){
      c.font = 'bold ' + Math.max(9, Math.round((f.ult ? 13 : 11) * cam.z)) + 'px system-ui';
      c.lineWidth = Math.max(2, 3 * cam.z); c.strokeStyle = 'rgba(6,9,14,.85)';
      c.strokeText(String(f.txt), q[0], y);
      c.fillStyle = f.ult ? '#ffe08a' : f.col;
      c.fillText(String(f.txt), q[0], y);
    } else {
      c.fillStyle = f.col; c.font = 'bold ' + Math.max(9, Math.round(11 * f.sc * cam.z)) + 'px system-ui';
      c.fillText(String(f.txt), q[0], y);
    }
    c.globalAlpha = 1;
  }
}

// One strip covering the whole world: your hold, the span, their hold.
// One rect, used by both the drawing and the hit test, so a tap always lands
// where the strip actually is.
function minimapRect(){
  const narrow = LW < 760;
  // On a phone the strip is nearly as wide as the screen, so it goes up into
  // the empty sky under the camera buttons rather than across the battlefield.
  const w = Math.min(340, LW - 24), h = narrow ? 24 : 34;
  return { x0:LW - w - 12, y0:narrow ? 46 : LH - h - 10, w, h,
    W0:CAM_MIN - 10, W1:CAM_MAX + 10 };
}
function minimapWorldX(sx){
  const m = minimapRect();
  return m.W0 + clamp((sx - m.x0 - 6) / (m.w - 12), 0, 1) * (m.W1 - m.W0);
}
function drawMinimap(c){
  const m = minimapRect();
  const w = m.w, h = m.h, x0 = m.x0, y0 = m.y0;
  const W0 = m.W0, W1 = m.W1;
  c.fillStyle = 'rgba(8,12,18,.76)'; c.fillRect(x0, y0, w, h);
  c.strokeStyle = '#2a3446'; c.lineWidth = 1; c.strokeRect(x0 + .5, y0 + .5, w - 1, h - 1);
  const mx = (x) => x0 + 6 + ((x - W0) / (W1 - W0)) * (w - 12);
  // the two holds, then the span between them
  for (const i of [0, 1]){
    const hx = i === 0 ? HOLD_X : C.LANE_LEN - HOLD_X;
    c.fillStyle = i === 0 ? 'rgba(76,112,64,.85)' : 'rgba(112,76,64,.85)';
    c.fillRect(mx(hx - 22), y0 + 5, Math.max(6, mx(hx + 22) - mx(hx - 22)), h - 10);
  }
  c.fillStyle = '#3d4658'; c.fillRect(mx(0), y0 + h / 2 - 2, mx(C.LANE_LEN) - mx(0), 4);
  for (const s of G.sides) for (const st of s.structs){
    if (st.dead) continue;
    c.fillStyle = SIDE_COL[s.i];
    const sz = st.key === 'gate' ? 5 : st.key === 'inhib' ? 4 : 3;
    c.fillRect(mx(st.x) - sz / 2, y0 + h / 2 - sz, sz, sz * 2);
  }
  for (const u of G.units){
    if (u.dead) continue;
    c.fillStyle = u.isHero ? '#ffffff' : SIDE_COL2[u.side];
    const sz = u.isHero ? 3 : 1.6;
    c.fillRect(mx(u.x) - sz / 2, y0 + h / 2 + u.y * .8 - sz / 2, sz, sz);
  }
  // camera window
  const halfW = (LW * .5) / (LS() * .96);
  c.strokeStyle = 'rgba(255,255,255,.5)';
  c.strokeRect(mx(cam.x - halfW), y0 + 3, Math.max(4, mx(cam.x + halfW) - mx(cam.x - halfW)), h - 6);
}

/* =====================================================================
   RENDERING — your hold
   ===================================================================== */
const sel = { tile:-1, node:null, build:null, hero:null, struct:null, unit:null };
// The hold lives in the same world as the bridge, just off to one side of it,
// so one camera covers your farms, the whole span and their gates. Everything
// below is written in hold-grid units and projected through the world.
const HOLD_X = -58, TILE = 7.2;
let holdSide = 0, BSC = 1;
function holdWorld(gx, gy){
  const d = holdSide === 0 ? 1 : -1;
  const ox = holdSide === 0 ? HOLD_X : C.LANE_LEN - HOLD_X;
  return [ ox + gx * TILE * d, gy * TILE ];
}
function bp(gx, gy, z){
  const w = holdWorld(gx, gy);
  return lp(w[0], w[1], (z || 0) * TILE * .62);
}
// Old base art was tuned against a ~45px grid cell; keep those numbers honest
// at any zoom by expressing them in cells too.
const bu = () => LS() * TILE / 45;
const tileGX = (t) => (t % PLOT_W) - (PLOT_W - 1) / 2;
const tileGY = (t) => Math.floor(t / PLOT_W) - (PLOT_H - 1) / 2;
const NODES = {
  gold: { gx:4.8, gy:-1.6, n:'Gold Mine', col:'#ffcf4d' },
  iron: { gx:5.2, gy:2.2,  n:'Iron Mine', col:'#b9c6d8' },
  wood: { gx:0.4, gy:5.0,  n:'Woodland',  col:'#6fbf5a' },
};
const KEEP = { gx:-3.5, gy:-2.0 };

function drawTile(c, gx, gy, fill, stroke){
  poly(c, [bp(gx - .5, gy - .5), bp(gx + .5, gy - .5), bp(gx + .5, gy + .5), bp(gx - .5, gy + .5)], fill, stroke, 1);
}

function drawHouse(c, gx, gy, w, d, wh, rh, wall, roof){
  const A = bp(gx - w, gy - d), B = bp(gx + w, gy - d), Cc = bp(gx + w, gy + d), D = bp(gx - w, gy + d);
  const A1 = bp(gx - w, gy - d, wh), B1 = bp(gx + w, gy - d, wh), C1 = bp(gx + w, gy + d, wh), D1 = bp(gx - w, gy + d, wh);
  poly(c, [D, Cc, C1, D1], shade(wall, .70));
  poly(c, [Cc, B, B1, C1], shade(wall, .92));
  poly(c, [A1, B1, C1, D1], shade(wall, 1.05));
  const R1 = bp(gx, gy - d * 1.15, wh + rh), R2 = bp(gx, gy + d * 1.15, wh + rh);
  const E1 = bp(gx - w * 1.18, gy - d * 1.18, wh), E2 = bp(gx + w * 1.18, gy - d * 1.18, wh);
  const E3 = bp(gx + w * 1.18, gy + d * 1.18, wh), E4 = bp(gx - w * 1.18, gy + d * 1.18, wh);
  poly(c, [E1, E2, R1], shade(roof, .8));
  poly(c, [E2, E3, R2, R1], shade(roof, 1.06));
  poly(c, [E4, E3, R2], shade(roof, .62));
  poly(c, [E1, R1, R2, E4], shade(roof, .74));
}

function drawBuilding(c, b){
  const gx = tileGX(b.tile), gy = tileGY(b.tile), B = bu();
  const raise = (b.raise || 0);
  const z = raise * 1.2;
  const t = b.type;
  c.globalAlpha = raise > 0 ? clamp(1 - raise * .5, .35, 1) : 1;
  ell(c, ...bp(gx, gy + .1), BSC * .62, BSC * .3, 'rgba(0,0,0,.22)');
  if (t === 'farm'){
    drawTile(c, gx, gy, '#6d5a34');
    c.strokeStyle = '#8a7440'; c.lineWidth = 1.6;
    for (let i = -3; i <= 3; i++){
      const a = bp(gx - .45, gy + i * .12 + z, 0), e = bp(gx + .45, gy + i * .12 + z, 0);
      c.beginPath(); c.moveTo(a[0], a[1]); c.lineTo(e[0], e[1]); c.stroke();
    }
    for (let i = 0; i < 5; i++){
      const p = bp(gx - .3 + i * .16, gy - .28 + (i % 2) * .5, z + .1);
      ell(c, p[0], p[1], BSC * .07, BSC * .1, '#9ec95c');
    }
    drawHouse(c, gx - .28, gy - .3, .22, .18, .5 + z, .3, '#a9825a', '#b8503f');
  } else if (t === 'pit'){
    drawTile(c, gx, gy, '#4a4038');
    ell(c, ...bp(gx, gy, z), BSC * .42, BSC * .22, '#2a2420');
    ell(c, ...bp(gx, gy, z + .04), BSC * .3, BSC * .15, '#6b3a2c');
    for (const s of [-1, 1]){
      const p0 = bp(gx + s * .42, gy - .35, z), p1 = bp(gx + s * .42, gy - .35, z + .9);
      c.strokeStyle = '#6a5540'; c.lineWidth = 3 * B; c.beginPath(); c.moveTo(p0[0], p0[1]); c.lineTo(p1[0], p1[1]); c.stroke();
      c.fillStyle = sideCol(); c.fillRect(p1[0] - 2 * B, p1[1], 8 * B * (s > 0 ? 1 : -1), 9 * B);
    }
  } else if (t === 'barracks'){
    drawTile(c, gx, gy, '#5e5748');
    drawHouse(c, gx, gy, .42, .34, .62 + z, .40, '#b08a5e', '#a34438');
    const p = bp(gx - .5, gy + .1, z + .95);
    c.fillStyle = sideCol(); c.fillRect(p[0], p[1], 7 * B, 12 * B);
    c.strokeStyle = '#d8dbe2'; c.lineWidth = 2 * B;
    for (let i = 0; i < 3; i++){
      const a = bp(gx + .5, gy - .3 + i * .3, z), e = bp(gx + .55, gy - .3 + i * .3, z + .55);
      c.beginPath(); c.moveTo(a[0], a[1]); c.lineTo(e[0], e[1]); c.stroke();
    }
  } else if (t === 'forge'){
    drawTile(c, gx, gy, '#4f4a44');
    drawHouse(c, gx, gy, .40, .32, .55 + z, .3, '#8d8579', '#5c5750');
    const ch = bp(gx + .22, gy - .22, z + 1.15);
    c.fillStyle = '#6d6459'; c.fillRect(ch[0] - 4 * B, ch[1], 9 * B, 16 * B);
    const glow = .45 + .25 * Math.sin(G.t * 4);
    c.globalAlpha = glow * (raise > 0 ? .4 : 1);
    ell(c, ch[0], ch[1] - 4 * B, 7 * B, 6 * B, '#ff8a3d');
    ell(c, ...bp(gx, gy + .3, z + .2), BSC * .18, BSC * .1, '#ff8a3d');
    c.globalAlpha = 1;
  } else if (t === 'tavern'){
    drawTile(c, gx, gy, '#575044');
    drawHouse(c, gx, gy, .40, .32, .95 + z, .38, '#c49a68', '#3f6b8c');
    const s0 = bp(gx + .5, gy + .1, z + .7);
    c.strokeStyle = '#6a5540'; c.lineWidth = 2 * B;
    c.beginPath(); c.moveTo(s0[0], s0[1]); c.lineTo(s0[0] + 10 * B, s0[1] - 3 * B); c.stroke();
    c.fillStyle = '#e2c88a'; c.fillRect(s0[0] + 6 * B, s0[1] - 2 * B, 11 * B, 8 * B);
    c.fillStyle = '#4b3a22'; c.fillRect(s0[0] + 9 * B, s0[1] + 1 * B, 5 * B, 2 * B);
  } else {
    drawTile(c, gx, gy, '#514b42');
    drawHouse(c, gx, gy, .38, .3, .48 + z, .26, '#9a8f7d', '#6f6455');
    const g = bp(gx + .1, gy - .05, z + .82);
    c.strokeStyle = '#c8a24a'; c.lineWidth = 2.4 * B;
    c.beginPath(); c.arc(g[0], g[1], 7 * B, 0, 6.2832); c.stroke();
    for (let i = 0; i < 6; i++){
      const a = G.t * .8 + i * 1.047;
      c.beginPath(); c.moveTo(g[0] + Math.cos(a) * 7 * B, g[1] + Math.sin(a) * 7 * B);
      c.lineTo(g[0] + Math.cos(a) * 10 * B, g[1] + Math.sin(a) * 10 * B); c.stroke();
    }
  }
  c.globalAlpha = 1;
  // Labels are queued and laid out after every building is drawn, so a packed
  // plot does not turn into a pile of overlapping text.
  const s = G.sides[holdSide];
  let sub = 'Lv ' + b.lvl;
  if (t === 'farm') sub = '+' + (C.POP_PER_FARM * b.lvl) + ' pop';
  if (t === 'barracks') sub = 'Lv ' + b.lvl + (b.lvl >= 3 ? ' · cannons' : b.lvl >= 2 ? ' · casters' : '');
  if (t === 'tavern') sub = heroCap(s) + ' hero slot' + (heroCap(s) === 1 ? '' : 's');
  if (holdSide === 0 && (cam.z > .72 || b.tile === sel.tile)){
    const lp0 = bp(gx, gy, 1.55 + z);
    // A packed hold is six labels in a hand's width, so only the one you have
    // selected spells itself out; the rest carry a name and a level digit.
    const hot = b.tile === sel.tile;
    const txt = BUILDINGS[t].n + (hot ? '  ' + sub : b.lvl > 1 ? '  ' + b.lvl : '');
    labelQ.push({ x:lp0[0], y:lp0[1], txt, col:'#d8dee9', hot });
  }
}

let labelQ = [];
function flushLabels(c){
  c.textAlign = 'center';
  const placed = [];
  labelQ.sort((a, b) => a.y - b.y);
  for (const L of labelQ){
    c.font = (L.small ? 8 : 9) + 'px system-ui';
    const w = c.measureText(L.txt).width + 8, h = L.small ? 11 : 13;
    let y = L.y - 11;
    // nudge upward until this label is clear of the ones already placed
    for (let guard = 0; guard < 12; guard++){
      const hit = placed.find(r => Math.abs(r.x - L.x) < (r.w + w) / 2 + 3 && Math.abs(r.y - y) < h + 4);
      if (!hit) break;
      y = hit.y - h - 4;
    }
    placed.push({ x:L.x, y, w, h });
    // A label pushed clear of its neighbours has to keep pointing at the thing
    // it names, or a packed plot reads as a pile of loose text.
    if (y < L.y - 12){
      c.strokeStyle = 'rgba(160,180,205,.30)'; c.lineWidth = 1;
      c.beginPath(); c.moveTo(L.x + .5, y + h); c.lineTo(L.x + .5, L.y - 3); c.stroke();
    }
    c.fillStyle = L.hot ? 'rgba(30,66,110,.88)' : (L.small ? 'rgba(9,13,20,.55)' : 'rgba(9,13,20,.72)');
    c.fillRect(L.x - w / 2, y, w, h);
    if (L.hot){ c.strokeStyle = '#4ea3ff'; c.lineWidth = 1; c.strokeRect(L.x - w / 2 + .5, y + .5, w - 1, h - 1); }
    c.fillStyle = L.col; c.fillText(L.txt, L.x, y + (L.small ? 8.5 : 10));
  }
  labelQ = [];
}

function drawWorkerFig(c, x, y, col, carry, sc){
  sc = (sc || 1) * bu();
  ell(c, x, y + 1, 3.2 * sc, 1.6 * sc, 'rgba(0,0,0,.25)');
  c.fillStyle = '#3f6f9e';
  c.fillRect(x - 2 * sc, y - 7 * sc, 4 * sc, 6 * sc);
  ell(c, x, y - 8.6 * sc, 2 * sc, 2.1 * sc, '#e8d6b8');
  if (carry){ c.fillStyle = col; c.fillRect(x - 2.6 * sc, y - 11.6 * sc, 5.2 * sc, 3 * sc); }
}

function drawNode(c, key){
  const N = NODES[key], s = G.sides[holdSide], B = bu();
  const p = bp(N.gx, N.gy);
  if (key === 'wood'){
    for (let i = 0; i < 5; i++){
      const q = bp(N.gx + (i % 3 - 1) * .55, N.gy + (i > 2 ? .55 : 0) - .2);
      c.fillStyle = '#5c4326'; c.fillRect(q[0] - 2 * B, q[1] - 12 * B, 4 * B, 12 * B);
      poly(c, [[q[0] - 11 * B, q[1] - 10 * B], [q[0], q[1] - 30 * B], [q[0] + 11 * B, q[1] - 10 * B]], i % 2 ? '#3f7a3a' : '#4c8c42');
      poly(c, [[q[0] - 8 * B, q[1] - 17 * B], [q[0], q[1] - 34 * B], [q[0] + 8 * B, q[1] - 17 * B]], i % 2 ? '#4c8c42' : '#5aa04c');
    }
  } else {
    poly(c, [[p[0] - 34 * B, p[1] + 4 * B], [p[0] - 14 * B, p[1] - 24 * B], [p[0] + 12 * B, p[1] - 20 * B], [p[0] + 34 * B, p[1] + 4 * B]],
      key === 'gold' ? '#8c7a52' : '#6a7382');
    poly(c, [[p[0] - 12 * B, p[1] + 4 * B], [p[0] - 8 * B, p[1] - 13 * B], [p[0] + 8 * B, p[1] - 13 * B], [p[0] + 12 * B, p[1] + 4 * B]], '#241f1b');
    c.fillStyle = '#4a4038';
    c.fillRect(p[0] - 13 * B, p[1] - 15 * B, 26 * B, 3 * B);
    for (let i = 0; i < 4; i++){
      const q = [p[0] - 24 * B + i * 15 * B, p[1] + 2 * B];
      ell(c, q[0], q[1], 5 * B, 3 * B, key === 'gold' ? '#e8b53d' : '#93a1b3');
      ell(c, q[0] - 2 * B, q[1] - 2 * B, 2.4 * B, 1.6 * B, key === 'gold' ? '#ffe08a' : '#c3cede');
    }
  }
  if (holdSide !== 0) return;                      // their crews are their business
  const n = Math.min(s.workers[key], nodeCap(s, key));
  const home = bp(KEEP.gx + .6, KEEP.gy + .5);
  for (let i = 0; i < n; i++){
    const ph = (G.t * .22 + i * .19) % 1;
    const tri = ph < .5 ? ph * 2 : 2 - ph * 2;
    const x = lerp(p[0], home[0], tri), y = lerp(p[1] - 6 * B, home[1], tri);
    drawWorkerFig(c, x, y, N.col, ph >= .5, .9);
  }
  labelQ.push({ x:p[0], y:p[1] + 26 * B, txt:N.n + '  ' + n + '/' + nodeCap(s, key), col:N.col });
}

function drawKeep(c){
  const s = G.sides[holdSide], B = bu();
  drawHouse(c, KEEP.gx, KEEP.gy, .52, .42, 1.0, .48, '#b9a17c', '#7a4a3c');
  const p = bp(KEEP.gx, KEEP.gy, 1.9);
  c.fillStyle = sideCol(); c.fillRect(p[0] - 2 * B, p[1] - 20 * B, 4 * B, 20 * B);
  poly(c, [[p[0] + 2 * B, p[1] - 20 * B], [p[0] + 18 * B, p[1] - 15 * B], [p[0] + 2 * B, p[1] - 10 * B]], sideCol());
  if (holdSide !== 0) return;
  const lb = bp(KEEP.gx, KEEP.gy, 2.5);
  labelQ.push({ x:lb[0], y:lb[1], txt:'Town Hall · ' + s.workers.idle + ' idle', col:'#ffe7b0' });
  for (let i = 0; i < Math.min(6, s.workers.idle); i++){
    const a = G.t * .3 + i * 1.1;
    const q = bp(KEEP.gx + Math.cos(a) * .9, KEEP.gy + .9 + Math.sin(a) * .35);
    drawWorkerFig(c, q[0], q[1], '#8d99b0', false, .85);
  }
}
const sideCol = () => SIDE_COL[holdSide];

// Deterministic countryside so the corners of the isometric diamond read as
// land instead of empty felt. Nothing here touches the simulation.
const hash2 = (i, j) => { const n = Math.sin(i * 127.1 + j * 311.7) * 43758.5453; return n - Math.floor(n); };

// The countryside never changes, so it is laid out once per hold and then only
// culled — it used to be re-rolled every single frame, for both holds.
const scatterCache = [null, null];
function scatterFor(side){
  if (scatterCache[side]) return scatterCache[side];
  const was = holdSide;
  holdSide = side;
  const out = [];
  const busy = (gx, gy) => {
    const wy = gy * TILE;
    if (wy < PLAT.far + 4 || wy > PLAT.near - 3) return true;          // off the mesa
    const wx = holdWorld(gx, gy)[0];
    const inner = holdSide === 0 ? 3 : C.LANE_LEN - 3;
    const outer = inner - (holdSide === 0 ? 1 : -1) * (PLAT.back + 34);
    if (holdSide === 0 ? (wx > inner - 4 || wx < outer + 4) : (wx < inner + 4 || wx > outer - 4)) return true;
    if (Math.abs(gx) < (PLOT_W - 1) / 2 + 1.1 && Math.abs(gy) < (PLOT_H - 1) / 2 + 1.1) return true;
    if (Math.hypot(gx - KEEP.gx, gy - KEEP.gy) < 1.9) return true;
    for (const k in NODES) if (Math.hypot(gx - NODES[k].gx, gy - NODES[k].gy) < 1.9) return true;
    return false;
  };
  for (let gx = -14; gx <= 13; gx++) for (let gy = -16; gy <= 8; gy++){
    const r = hash2(gx, gy);
    if (r > .40 || busy(gx, gy)) continue;
    const ox = (hash2(gx + 31, gy) - .5) * .8, oy = (hash2(gx, gy + 17) - .5) * .8;
    out.push({ gx:gx + ox, gy:gy + oy, r });
  }
  out.sort((a, b) => (a.gx + a.gy) - (b.gx + b.gy));
  holdSide = was;
  scatterCache[side] = out;
  return out;
}

function drawGround(c){
  // trodden paths from the hall out to every job
  const home = bp(KEEP.gx + .6, KEEP.gy + .7);
  c.strokeStyle = 'rgba(120,98,62,.30)'; c.lineCap = 'round';
  for (const k in NODES){
    const q = bp(NODES[k].gx, NODES[k].gy);
    c.lineWidth = Math.max(4, BSC * .22);
    c.beginPath(); c.moveTo(home[0], home[1]);
    c.quadraticCurveTo((home[0] + q[0]) / 2 + BSC * .3, (home[1] + q[1]) / 2, q[0], q[1]);
    c.stroke();
  }
  c.lineCap = 'butt';
  const s = BSC / 34;
  for (const it of scatterFor(holdSide)){
    const r = it.r;
    const p = bp(it.gx, it.gy);
    if (p[0] < -60 || p[0] > LW + 60) continue;
    if (p[1] < -60 || p[1] > LH + 60) continue;
