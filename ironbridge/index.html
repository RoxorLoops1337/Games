<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Ironbridge</title>
<meta name="description" content="Isometric lane war — run an RTS base on the left while your minions, turrets and bot heroes fight for one bloody bridge on the right.">
<style>
  :root{
    --bg:#0a0d14; --panel:#141a26; --panel2:#1b2333; --line:#2a3446;
    --ink:#e7ecf6; --dim:#8d99b0; --dim2:#5f6b82;
    --blue:#4ea3ff; --red:#ff5a52; --gold:#ffcf4d; --iron:#b9c6d8; --wood:#c08a4a;
    --pop:#7fdc8a; --mana:#5fa8ff; --xp:#c69bff;
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ margin:0; padding:0; height:100%; overflow:hidden; background:var(--bg); color:var(--ink);
    font-family:'Segoe UI',system-ui,-apple-system,sans-serif; font-size:14px; }
  button{ font-family:inherit; color:inherit; cursor:pointer; }

  #app{ position:fixed; inset:0; display:flex; flex-direction:column; }

  /* ---------------- top HUD ---------------- */
  #top{ flex:0 0 auto; display:flex; align-items:center; gap:10px; padding:6px 10px;
    background:linear-gradient(180deg,#1a2232,#111722); border-bottom:2px solid var(--line); }
  .res{ display:flex; align-items:center; gap:5px; padding:4px 9px; background:#0e1421;
    border:1px solid var(--line); border-radius:8px; font-variant-numeric:tabular-nums; white-space:nowrap; }
  .res .ic{ font-size:14px; }
  .res b{ font-weight:700; letter-spacing:.3px; }
  .res .rate{ color:var(--dim2); font-size:11px; }
  #rGold b{ color:var(--gold); } #rIron b{ color:var(--iron); } #rWood b{ color:var(--wood); }
  #rFood b{ color:#e8d36a; }
  #rPop b{ color:var(--pop); } #rPop.full b{ color:var(--red); }
  #clock{ margin-left:auto; display:flex; align-items:center; gap:8px; }
  #waveBox{ padding:4px 10px; background:#0e1421; border:1px solid var(--line); border-radius:8px;
    font-variant-numeric:tabular-nums; }
  #waveBox b{ color:var(--gold); }
  .tbtn{ padding:5px 10px; background:var(--panel2); border:1px solid var(--line); border-radius:8px;
    font-size:13px; font-weight:600; }
  .tbtn:hover{ background:#26314a; }
  .tbtn.on{ background:var(--blue); border-color:var(--blue); color:#08111f; }

  /* ---------------- one world, one camera ---------------- */
  #stage{ flex:1 1 auto; position:relative; min-height:0; overflow:hidden; }
  canvas{ position:absolute; inset:0; width:100%; height:100%; display:block; touch-action:none; }
  #viewbtns{ position:absolute; top:8px; left:10px; right:10px; display:flex; gap:5px; z-index:6;
    flex-wrap:wrap; justify-content:flex-end; pointer-events:none; }
  #viewbtns .vbtn{ pointer-events:auto; }
  .vbtn{ padding:7px 11px; font-size:11px; letter-spacing:1px; background:rgba(20,26,38,.85);
    border:1px solid var(--line); border-radius:6px; color:var(--dim); backdrop-filter:blur(2px); }
  .vbtn:hover{ color:var(--ink); }
  .vbtn.on{ background:var(--blue); color:#08111f; border-color:var(--blue); }

  #advice{ position:absolute; left:10px; bottom:10px; max-width:min(58%,420px); display:flex; align-items:center;
    gap:8px; padding:7px 12px; text-align:left; background:rgba(16,22,34,.9); border:1px solid var(--line);
    border-left:3px solid var(--gold); border-radius:9px; z-index:6; backdrop-filter:blur(2px); }
  #advice:hover{ background:rgba(26,34,50,.95); }
  #advice.hide{ display:none; }
  #advice .ah{ font-size:9px; letter-spacing:2px; color:var(--gold); font-weight:800; }
  #advice .at{ font-size:12px; color:var(--ink); line-height:1.35; }
  @media (max-width:760px){ #advice{ max-width:calc(100% - 20px); bottom:8px; } }
  body.narrow #toast{ top:84px; max-width:calc(100% - 20px); }

  /* ---------------- command dock ---------------- */
  #dock{ flex:0 0 auto; display:flex; gap:8px; align-items:stretch; padding:7px 9px;
    background:linear-gradient(180deg,#151c2b,#0c111b); border-top:2px solid var(--line);
    overflow-x:auto; overflow-y:hidden; height:200px; }
  .dsec{ flex:0 0 auto; display:flex; flex-direction:column; gap:4px; padding:0 9px 0 0;
    border-right:1px solid #1e2736; min-width:150px; overflow-y:auto; overflow-x:hidden; }
  .dsec:last-child{ border-right:none; padding-right:0; }
  .dsec.grow{ flex:1 1 260px; min-width:240px; }
  .ptitle{ font-size:10px; letter-spacing:2px; text-transform:uppercase; color:var(--dim2);
    white-space:nowrap; }
  .prow{ display:flex; align-items:center; gap:5px; }
  .pcol{ display:flex; flex-direction:column; gap:4px; }
  .pgrid{ display:grid; grid-template-columns:repeat(2,minmax(96px,1fr)); gap:4px; }
  .job{ display:flex; align-items:center; gap:5px; padding:4px 6px; background:#0e1421;
    border:1px solid var(--line); border-radius:8px; min-width:0; }
  .job .nm{ font-size:11px; color:var(--dim); flex:1 1 auto; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .job .ct{ font-weight:700; font-variant-numeric:tabular-nums; flex:0 0 auto; text-align:right;
    white-space:nowrap; }
  .sq{ width:30px; height:30px; padding:0; font-size:17px; line-height:1; background:var(--panel2);
    border:1px solid var(--line); border-radius:7px; font-weight:700; flex:0 0 auto; }
  .sq:hover{ background:#28324a; }
  .sq:disabled{ opacity:.32; cursor:not-allowed; }
  .abtn{ display:flex; flex-direction:column; align-items:flex-start; gap:2px; padding:7px 10px; text-align:left;
    background:var(--panel2); border:1px solid var(--line); border-radius:8px; min-width:0; flex:1 1 0;
    min-height:44px; justify-content:center; }
  /* 44px is a thumb; a mouse does not need one, and the extra 6px per row is
     the difference between the whole forge fitting in the dock and its last
     rank being sliced off at 820px tall. */
  @media (hover:hover) and (pointer:fine){ .abtn{ min-height:38px; padding:5px 10px; } }
  .abtn:hover:not(:disabled){ background:#28324a; border-color:#3c4a66; }
  .abtn:disabled{ opacity:.4; cursor:not-allowed; }
  .abtn .t{ font-size:12px; font-weight:700; white-space:nowrap; }
  .abtn .c{ font-size:10px; color:var(--dim); white-space:nowrap; }
  .cost i{ font-style:normal; }
  .cost .g{ color:var(--gold); } .cost .i{ color:var(--iron); } .cost .w{ color:var(--wood); }
  .cost .bad{ color:var(--red); }
  #queue{ display:flex; flex-wrap:wrap; gap:4px; }
  .qchip{ padding:2px 7px; font-size:11px; background:#0e1421; border:1px solid var(--line);
    border-radius:999px; color:var(--dim); position:relative; overflow:hidden; }
  .qchip .fill{ position:absolute; inset:0; background:rgba(78,163,255,.22); width:0; }
  .qchip span{ position:relative; }
  #musterRow{ display:flex; flex-wrap:wrap; gap:4px; min-height:20px; }
  .mchip{ padding:2px 7px; font-size:11px; border-radius:999px; border:1px solid var(--line); background:#0e1421; }

  /* ---------------- hero cards ---------------- */
  #heroBar{ display:flex; gap:6px; flex-wrap:wrap; }
  .hcard{ flex:0 0 auto; width:160px; padding:5px 7px; background:#0e1421; border:1px solid var(--line);
    border-radius:9px; text-align:left; position:relative; }
  .hcard:hover{ border-color:#43536f; }
  .hcard.dead{ opacity:.55; }
  .hcard .hn{ display:flex; align-items:baseline; gap:5px; font-size:12px; font-weight:700; }
  .hcard .hl{ color:var(--gold); font-size:11px; }
  .hcard .hc{ font-size:10px; color:var(--dim); letter-spacing:1px; text-transform:uppercase; }
  .bar{ height:5px; border-radius:3px; background:#1e2636; overflow:hidden; margin-top:3px; }
  .bar i{ display:block; height:100%; }
  .bar.hp i{ background:linear-gradient(90deg,#4fd873,#39a85a); }
  .bar.mp i{ background:linear-gradient(90deg,#5fa8ff,#3a6fd8); }
  .bar.xp i{ background:linear-gradient(90deg,#c69bff,#8b5fd8); }
  .pips3{ display:flex; gap:3px; margin-top:4px; }
  .pip{ position:relative; flex:1 1 0; height:19px; border-radius:4px; background:#1b2434;
    border:1px solid #2b3648; overflow:hidden; display:flex; align-items:center; justify-content:center; }
  .pip.ult{ border-color:#8a6a2a; background:#2a2418; }
  .pip i{ position:absolute; left:0; right:0; bottom:0; background:rgba(90,110,150,.55); }
  .pip.ult i{ background:rgba(160,120,40,.5); }
  .pip b{ position:relative; font-size:9px; font-weight:800; color:#c3cfe2; letter-spacing:.5px; }
  .pip.ult b{ color:#ffcf4d; }
  .pip.cool b{ opacity:.45; }
  .pip u{ position:absolute; right:1px; top:0; font-size:7px; color:#6b7a92; text-decoration:none; }
  .pip.empty{ font-size:9px; color:var(--dim2); background:none; border:none; justify-content:flex-start; }
  .badge{ position:absolute; top:-6px; right:-6px; min-width:19px; height:19px; padding:0 5px; border-radius:999px;
    background:var(--gold); color:#20180a; font-size:11px; font-weight:800; line-height:19px; text-align:center;
    box-shadow:0 0 0 2px #0d121d; animation:pulse 1.1s infinite; }
  @keyframes pulse{ 50%{ transform:scale(1.13); } }
  .hnew{ flex:0 0 auto; width:104px; padding:4px; border:1px dashed var(--line); border-radius:9px;
    background:#0c1120; color:var(--dim); font-size:12px; font-weight:600; }
  .hnew:hover:not(:disabled){ color:var(--ink); border-color:var(--blue); }
  .hnew:disabled{ opacity:.4; cursor:not-allowed; }

  /* ---------------- modal ---------------- */
  #modal{ position:fixed; inset:0; display:none; align-items:center; justify-content:center; padding:16px;
    background:rgba(5,8,14,.42); backdrop-filter:blur(1px); z-index:40; overflow-y:auto; }
  #modal.solid{ background:rgba(5,8,14,.86); backdrop-filter:blur(4px); }
  #modal.on{ display:flex; }
  .sheet{ width:min(860px,100%); max-height:92vh; overflow-y:auto; padding:18px 18px 16px; background:var(--panel);
    border:2px solid var(--line); border-radius:14px; box-shadow:0 20px 60px rgba(0,0,0,.6); }
  .sheet h2{ margin:0 0 4px; font-size:22px; letter-spacing:1px; }
  .sheet .sub{ margin:0 0 14px; color:var(--dim); font-size:13px; }
  .picks{ display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:10px; }
  .pick{ padding:11px 12px; background:var(--panel2); border:2px solid var(--line); border-radius:11px;
    text-align:left; transition:transform .1s ease,border-color .1s ease; }
  .pick:hover{ transform:translateY(-3px); border-color:var(--blue); }
  .pick .pt{ font-size:15px; font-weight:800; margin-bottom:3px; }
  .pick .pk{ font-size:10px; letter-spacing:1.5px; text-transform:uppercase; color:var(--gold); margin-bottom:5px; }
  .pick .pd{ font-size:12px; color:var(--dim); line-height:1.45; }
  .pick .pm{ margin-top:6px; font-size:11px; color:var(--blue); }
  .pick.resume{ border-color:var(--gold); background:linear-gradient(180deg,#2a2417,#1d1a12); }
  .pick.resume:hover{ border-color:#ffe08a; }
  .pick.resume .pk{ color:var(--gold); }
  .rowbtn{ display:flex; gap:8px; flex-wrap:wrap; margin-top:14px; }
  .big{ flex:1 1 160px; padding:11px 16px; font-size:15px; font-weight:800; letter-spacing:.5px;
    background:linear-gradient(180deg,#5ab0ff,#2f7fd8); border:none; border-radius:10px; color:#08111f; }
  .big.ghost{ background:var(--panel2); border:1px solid var(--line); color:var(--ink); }
  .big:hover{ filter:brightness(1.08); }
  .statline{ display:flex; flex-wrap:wrap; gap:8px 16px; margin:10px 0 0; font-size:12px; color:var(--dim); }
  .insp{ display:flex; flex-wrap:wrap; gap:2px 14px; font-size:11px; color:var(--dim); max-width:270px;
    margin-top:4px; }
  .insp span{ display:flex; gap:5px; }
  .insp b{ color:var(--ink); }
  .insp.note{ color:var(--dim2); font-style:italic; display:block; line-height:1.4; }
  /* the war report behind the pause button */
  .wr{ margin:12px 0 4px; padding:10px 12px; background:#0e1421; border:1px solid var(--line); border-radius:10px; }
  .wr-head{ display:flex; align-items:center; gap:8px; font-size:11px; }
  .wr-head b{ flex:1 1 0; font-size:12px; }
  .wr-head b:last-child{ text-align:right; }
  .wr-head span{ flex:0 0 auto; color:var(--dim2); letter-spacing:1px; text-transform:uppercase; font-size:9px; }
  .wr-lob{ display:flex; gap:10px; margin:8px 0 10px; }
  .lob{ flex:1 1 0; display:flex; gap:3px; align-items:flex-end; }
  .lob:last-child{ flex-direction:row-reverse; }
  .lb{ flex:1 1 0; position:relative; height:46px; background:#182031; border:1px solid var(--line);
    border-radius:5px; overflow:hidden; display:block; min-width:0; }
  .lb i{ position:absolute; left:0; right:0; bottom:0; background:linear-gradient(180deg,#3f7fd0,#2a5fa0); opacity:.75; }
  .lob:last-child .lb i{ background:linear-gradient(180deg,#d06a52,#a03a2a); }
  .lb.front{ border-color:var(--gold); }
  .lb.gone{ opacity:.32; }
  .lb em{ position:absolute; top:3px; left:0; right:0; text-align:center; font-style:normal;
    font-size:9px; font-weight:800; color:var(--ink); text-shadow:0 1px 2px #000; }
  .lb u{ position:absolute; bottom:2px; left:0; right:0; text-align:center; text-decoration:none;
    font-size:8px; letter-spacing:.5px; color:var(--dim2); text-shadow:0 1px 2px #000; }
  .wr-row{ display:flex; align-items:center; gap:8px; font-size:12px; color:var(--dim2);
    padding:3px 0; border-top:1px solid #18202e; }
  .wr-row b{ flex:1 1 0; color:var(--ink); font-variant-numeric:tabular-nums; font-weight:700; }
  .wr-row b:last-child{ text-align:right; }
  .wr-row span{ flex:0 0 auto; font-size:10px; letter-spacing:1px; text-transform:uppercase; }
  .wr-row b.good{ color:#7fe08a; } .wr-row b.bad{ color:#ff8f86; }
  .wr-next{ margin-top:9px; font-size:12px; color:var(--dim); }
  .wr-next b{ color:var(--gold); font-size:9px; letter-spacing:2px; margin-right:6px; }
  /* what your heroes finished the match as */
  .hcs{ display:grid; grid-template-columns:repeat(auto-fit,minmax(230px,1fr)); gap:6px; margin-top:8px; }
  .hc{ padding:7px 9px; background:#0e1421; border:1px solid var(--line); border-radius:10px; min-width:0; }
  .hc-top{ display:flex; align-items:baseline; gap:6px; }
  .hc-g{ font-size:13px; }
  .hc-top b{ font-size:13px; }
  .hc-lv{ font-size:10px; color:var(--dim2); flex:1 1 auto; }
  .hc-kd{ font-size:11px; color:var(--dim); font-variant-numeric:tabular-nums; }
  .hc-build{ display:flex; flex-wrap:wrap; gap:3px; margin-top:5px; }
  .hc-build i{ font-style:normal; font-size:10px; padding:2px 6px; border-radius:20px;
    background:#1a2231; border:1px solid var(--line); color:var(--dim); }
  .hc-build i.ult{ border-color:var(--gold); color:var(--gold); }
  .hc-none{ font-size:10px; color:var(--dim2); font-style:italic; }
  .keys{ display:grid; grid-template-columns:repeat(auto-fit,minmax(190px,1fr)); gap:3px 14px;
    font-size:11px; color:var(--dim2); }
  .keys span{ display:flex; align-items:center; gap:5px; }
  kbd{ display:inline-block; min-width:15px; text-align:center; padding:1px 4px; border-radius:4px;
    background:#1a2231; border:1px solid var(--line); border-bottom-width:2px; color:var(--ink);
    font:600 10px system-ui; }
  .tl{ margin:12px 0 4px; padding:10px 12px; background:#0e1421; border:1px solid var(--line); border-radius:10px; }
  .tl-row{ display:flex; align-items:center; gap:9px; margin-bottom:7px; }
  .tl-lbl{ flex:0 0 58px; font-size:10px; letter-spacing:1px; text-transform:uppercase; font-weight:700; }
  .tl-track{ position:relative; flex:1 1 auto; height:12px; background:#1a2231; border-radius:6px; }
  .tl-m{ position:absolute; top:1px; width:5px; height:10px; margin-left:-2px; border-radius:2px;
    background:#8d99b0; }
  .tl-m.inhib{ background:#5fa8ff; width:7px; margin-left:-3px; }
  .tl-m.gate{ background:var(--gold); width:9px; margin-left:-4px; }
  .tl-m.dot{ position:relative; display:inline-block; top:2px; margin:0 3px 0 0; }
  .tl-axis{ display:flex; justify-content:space-between; font-size:10px; color:var(--dim2);
    padding-left:55px; }
  .tl-empty{ margin:12px 0; padding:10px 12px; background:#0e1421; border:1px solid var(--line);
    border-radius:10px; font-size:12px; color:var(--dim); }
  .statline b{ color:var(--ink); }
  .legend{ display:flex; gap:12px; flex-wrap:wrap; margin-top:10px; font-size:11px; color:var(--dim2); }
  /* on a phone the menu panel is the whole screen; the two lines of small
     print at the bottom of it are the first thing worth losing so the world
     behind can show */
  body.narrow #sheet > .legend{ display:none; }
  .intro{ display:flex; flex-direction:column; gap:9px; }
  .ib{ display:flex; gap:11px; align-items:flex-start; padding:10px 12px; background:var(--panel2);
    border:1px solid var(--line); border-radius:10px; font-size:13px; line-height:1.5; color:var(--dim); }
  .ib .ic{ font-size:20px; line-height:1.2; flex:0 0 auto; }
  .ib b{ color:var(--ink); }

  /* ---------------- toast / narrator ---------------- */
  #toast{ position:absolute; left:10px; top:52px; display:flex; flex-direction:column;
    gap:4px; align-items:flex-start; pointer-events:none; z-index:20; max-width:min(46%,340px); }
  .tst{ padding:4px 11px; font-size:12px; font-weight:600; letter-spacing:.4px; border-radius:999px;
    background:rgba(10,14,22,.86); border:1px solid var(--line); animation:tin .28s ease;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:100%; }
  @keyframes tin{ from{ opacity:0; transform:translateX(-10px); } }
  .tst.good{ color:#7fdc8a; border-color:#2f5c3c; } .tst.bad{ color:#ff8a84; border-color:#5c2f2f; }

  /* ---------------- hero profile (parchment) ---------------- */
  .parch{ margin:-18px; padding:16px 18px 14px; border-radius:12px;
    background:linear-gradient(180deg,#c9a978,#b08e5e); color:#2b1d0e;
    box-shadow:inset 0 0 0 3px #8a6a3d, inset 0 0 60px rgba(90,60,20,.35); }
  .parch h2{ color:#40290f; text-align:center; letter-spacing:2px; font-size:20px; }
  .hp-grid{ display:grid; grid-template-columns:200px 1fr; gap:12px; margin-top:10px; }
  .hp-left{ padding:10px; background:linear-gradient(180deg,#e0c79b,#c9aa78); border:2px solid #8a6a3d;
    border-radius:10px; text-align:center; }
  /* Every class wore the same blue plate with a different emoji on it. Each
     one gets its own colours and its own field now, so the sheet tells you
     what you are looking at before you read a word of it. */
  .portrait{ position:relative; height:104px; display:flex; align-items:center; justify-content:center;
    font-size:52px; background:radial-gradient(circle at 50% 32%,#5d7fa8,#2f4763);
    border:2px solid #8a6a3d; border-radius:8px; overflow:hidden; }
  .portrait::before{ content:''; position:absolute; inset:0;
    background:repeating-linear-gradient(135deg,rgba(255,255,255,.07) 0 9px,transparent 9px 18px); }
  .portrait > span{ position:relative; z-index:1; filter:drop-shadow(0 2px 3px rgba(0,0,0,.45)); }
  .portrait[data-cls=tank]    { background:radial-gradient(circle at 50% 32%,#6f8fa6,#2f4450); }
  .portrait[data-cls=fighter] { background:radial-gradient(circle at 50% 32%,#a86b52,#5b2f26); }
  .portrait[data-cls=marksman]{ background:radial-gradient(circle at 50% 32%,#7fa86b,#2f4d2a); }
  .portrait[data-cls=mage]    { background:radial-gradient(circle at 50% 32%,#8a72c4,#392b5e); }
  .portrait[data-cls=assassin]{ background:radial-gradient(circle at 50% 32%,#6a6f86,#26262f); }
  .portrait[data-cls=support] { background:radial-gradient(circle at 50% 32%,#c9a86b,#5e4526); }
  .portrait .pcls{ position:absolute; left:0; right:0; bottom:0; z-index:1; padding:3px 0;
    background:rgba(12,10,8,.42); font-size:9px; letter-spacing:2px; text-transform:uppercase;
    font-weight:800; color:#f2e6cc; text-align:center; }
  .hp-name{ margin-top:7px; font-size:16px; font-weight:800; }
  .hp-lvl{ font-size:12px; color:#6b4f28; }
  .hp-stats{ display:flex; flex-direction:column; gap:2px; margin-top:8px; font-size:11px; text-align:left; }
  .hp-stats span{ display:flex; justify-content:space-between; gap:6px; border-bottom:1px dotted rgba(90,60,25,.35); }
  .hp-stats b{ font-weight:800; white-space:nowrap; }
  .hp-meter{ position:relative; height:16px; margin-top:8px; border-radius:8px; overflow:hidden;
    background:rgba(74,51,22,.30); border:1px solid #8a6a3d; }
  .hp-meter.sm{ height:13px; margin-top:4px; }
  .hp-meter i{ position:absolute; inset:0 auto 0 0; display:block; }
  .hm-hp{ background:linear-gradient(180deg,#77c46a,#3f8f45); }
  .hm-xp{ background:linear-gradient(180deg,#78a6de,#3f6ba8); }
  .hp-meter em{ position:absolute; inset:0; display:flex; align-items:center; justify-content:center;

let _seed = 12345;
const reseed = (s) => { _seed = (s >>> 0) || 1; };
const seedNow = () => _seed;
const rnd = () => { // mulberry32 — deterministic so a match can be replayed in tests
  _seed |= 0; _seed = (_seed + 0x6D2B79F5) | 0;
  let t = Math.imul(_seed ^ (_seed >>> 15), 1 | _seed);
  t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
  return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
};
const rr = (a, b) => a + rnd() * (b - a);
const ri = (a, b) => Math.floor(rr(a, b + 1));
const pick = (arr) => arr[Math.floor(rnd() * arr.length)];
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;

// Roughly what a skill is worth to a hero — the Host's brain picks with it,
// and the tests use it to prove no skill is a trap. It counts the things a
// raw damage number misses: how many bodies an area hits, how many shots go
// out, what a stun is worth, what a summon brings.
function skOutput(s, rank, ad, ap){
  const v = (arr) => arr ? arr[0] + arr[1] * (rank - 1) : 0;
  // mirror the hybrid scaling the shared pool gets in the sim
  const A = s.cls === 'any' ? Math.max(ad, ap) : ad;
  const P = s.cls === 'any' ? Math.max(ap, ad * .7) : ap;
  let out = v(s.dmg) + (s.adR || 0) * A + (s.apR || 0) * P;
  if (s.dps) out = (v(s.dps) + (s.adR || 0) * A + (s.apR || 0) * P) * (s.dur || 1);
  if (s.heal) out += v(s.heal) + (s.apR || 0) * P;
  if (s.shield) out += v(s.shield) + (s.apR || 0) * P;
  if (s.shots) out *= s.shots;
  if (s.jumps) out *= 1 + s.jumps * .75;
  if (s.aoe) out *= 1 + s.aoe * .5;
  if (s.pierce) out *= 1.5;
  if (s.magic) out *= 1.12;                       // ignores the armour everyone stacks
  if (s.exec) out *= 1 + s.exec * .5;             // finishing a hero is the point
  // Utility priced by what it actually grants, rather than one flat number for
  // "this is a buff" — which could not tell a crit buff from a poison blade.
  let util = 0;
  if (s.count) util += (s.count + (rank - 1) * (s.nPer || 0)) * 220;
  if (s.stun) util += s.stun * 130;
  if (s.slow) util += s.slow * 70 * (s.dur ? 2 : 1);
  if (s.k === 'taunt') util += 90 + (s.dur || 0) * 110;
  const buff = (s.bad || 0) * 6 + (s.bas || 0) * 400 + (s.bcrit || 0) * 300 + (s.bms || 0) * 200
    + (s.barm || 0) * 8 + (s.bmr || 0) * 8 + (s.bls || 0) * 350 + (s.bburn || 0) * 8
    + (s.brng || 0) * 90 + (s.amp || 0) * 400;
  if (buff) util += buff * (1 + (s.dur || 4) / 8);
  // anything that lands on the whole line is worth more the wider it reaches
  if (s.k === 'teambuff' || s.k === 'teamheal' || s.k === 'taunt') util *= 1 + (s.aoe || 0) * .35;
  return out + util;
}
const skRate = (s, rank, ad, ap) => skOutput(s, rank, ad, ap) / Math.max(4, s.cd);

// Pools a hero of a given class may be offered.
const basicPool = (cls) => SKILLS.filter(s => !s.ult && (s.cls === 'any' || s.cls === cls));
const ultPool = (cls) => SKILLS.filter(s => s.ult && s.cls === cls);

// Human-readable numbers for a skill at a rank — used by the pick cards and
// the hero profile, so what the player reads is what the sim computes.
function skNums(s, rank){
  const out = [];
  const r = Math.max(1, rank);
  if (s.dmg) out.push(Math.round(s.dmg[0] + s.dmg[1] * (r - 1)) + (s.magic ? ' magic' : '') + ' damage');
  if (s.dps) out.push(Math.round(s.dps[0] + s.dps[1] * (r - 1)) + ' damage/s for ' + s.dur + 's');
  if (s.heal) out.push(Math.round(s.heal[0] + s.heal[1] * (r - 1)) + ' healing');
  if (s.shield) out.push(Math.round(s.shield[0] + s.shield[1] * (r - 1)) + ' shield');
  if (s.stun) out.push(s.stun.toFixed(1) + 's stun');
  if (s.slow) out.push(Math.round(s.slow * 100) + '% slow');
  if (s.aoe) out.push('area ' + s.aoe.toFixed(1));
  if (s.count) out.push((s.count + (r - 1) * (s.nPer || 0)) + ' summons');
  if (s.bas) out.push('+' + Math.round(s.bas * 100) + '% attack speed');
  if (s.bad) out.push('+' + s.bad + ' damage');
  if (s.bms) out.push('+' + Math.round(s.bms * 100) + '% move speed');
  if (s.barm) out.push('+' + s.barm + ' armour');
  if (s.bls) out.push('+' + Math.round(s.bls * 100) + '% lifesteal');
  if (s.bcrit) out.push('+' + Math.round(s.bcrit * 100) + '% crit');
  if (s.amp) out.push('+' + Math.round(s.amp * 100) + '% damage to the mark');
  if (s.exec) out.push('up to +' + Math.round(s.exec * 100) + '% versus the wounded');
  return out.join(' · ');
}

const TROOP_UPS = [

  { id:'tarm',  n:'Levy Armour',      d:'+18 minion armour and resist.',  cost:{ iron:50, wood:35 },  step:1.6 },
  { id:'thp',   n:'Rations',          d:'+16% minion health.',            cost:{ food:60, wood:40 },  step:1.55 },
];
const MAX_UP = 5;

// Roughly what one rank buys, in hitpoints-equivalent (a point of damage per
// second is worth about twelve hitpoints), divided by what it costs to gather.
// The Host shops with this, and the tests use it to prove no upgrade is a trap.
const RES_SECONDS = () => ({ gold:1 / C.GATHER.gold, iron:1 / C.GATHER.iron,
  wood:1 / C.GATHER.wood, food:1 / C.GATHER.food });
function upValue(id){
  const structHp = STRUCTS.reduce((a, x) => a + x.hp, 0);
  const structDps = STRUCTS.reduce((a, x) => a + x.ad * x.as, 0);
  const armor = STRUCTS.reduce((a, x) => a + x.armor, 0) / STRUCTS.length;
  const army = 14, aHp = 340, aAd = 30, aArm = 20;
  const gain = (base, add) => (1 + (base + add) / 100) / (1 + base / 100) - 1;
  switch (id){
    case 'hp':    return structHp * UP_EFFECT.hp;
    case 'armor': return structHp * gain(armor, UP_EFFECT.armor);
    case 'atk':   return structDps * UP_EFFECT.atk * 12;
    case 'as':    return structDps * UP_EFFECT.as * 12;
    case 'regen': return UP_EFFECT.regen * STRUCTS.length * 60 * 6;
    case 'tad':   return army * aAd * UP_EFFECT.tad * 12;
    case 'tarm':  return army * aHp * gain(aArm, UP_EFFECT.tarm);
    case 'thp':   return army * aHp * UP_EFFECT.thp;
  }
  return 0;
}
function upRate(s, id){
  const def = TOWER_UPS.find(u => u.id === id) || TROOP_UPS.find(u => u.id === id);
  if (!def) return 0;
  const ws = RES_SECONDS(), c = upCostFor(def, (TOWER_UPS.includes(def) ? s.towerUp : s.troopUp)[id]);
  let spend = 0;
  for (const k in c) spend += c[k] * ws[k];
  return spend > 0 ? upValue(id) / spend : 0;
}

// Each pile has a job: WOOD builds, IRON arms, GOLD buys heroes and the forge's
// work, FOOD feeds. Iron used to be in the price of nearly every building as
// well as every weapon, which is why it was the missing pile for 68% of
// everything a hold could not afford while wood sat in surplus.
const BUILDINGS = {
  pit:      { n:'Spawning Pit', d:'Trains workers. Each pit adds a training slot.',
              cost:{ wood:70, gold:20 }, up:{ wood:90, gold:60 }, maxLvl:3, ico:'pit' },
  farm:     { n:'Farm', d:'+' + C.POP_PER_FARM + ' population and 3 field jobs for food.',
              cost:{ wood:45, gold:25 }, up:{ wood:70, food:40 }, maxLvl:3, ico:'farm' },
  // Levelling this is the only route to Casters and Cannons, and it used to
  // cost 90 iron — the one resource a hold arming Footmen (28 iron each) never
  // has. Traced over a match: wood climbs past 500 unspent while iron sits
  // under 60. The price moved onto the pile that actually accumulates.
  barracks: { n:'Barracks', d:'Turns workers into fighters. Level 2 unlocks casters, level 3 cannons.',
              cost:{ wood:115, iron:15 }, up:{ wood:125, iron:12, gold:20 }, maxLvl:3, ico:'barracks' },
  forge:    { n:'Forge', d:'Unlocks turret and minion upgrades. Each level raises the rank cap.',
              cost:{ wood:80, iron:40, gold:55 }, up:{ wood:110, iron:60, gold:110 }, maxLvl:3, ico:'forge' },
  tavern:   { n:'Hero Factory', d:'Forges heroes. Each level adds a hero slot and speeds respawns.',
              cost:{ gold:150, wood:70 }, up:{ gold:230, iron:90 }, maxLvl:3, ico:'tavern' },
  workshop: { n:'Workshop', d:'+12% gathering from every worker, per level.',
              cost:{ wood:110, iron:18 }, up:{ wood:150, iron:30 }, maxLvl:3, ico:'workshop' },
};
const BUILD_ORDER = ['farm','pit','barracks','forge','tavern','workshop'];
const PLOT_W = 4, PLOT_H = 4;

/* =====================================================================
   STATE
   ===================================================================== */
const DIFFS = [
  { id:'recruit', n:'Recruit',  d:'The Host gathers slower and its heroes hit softer.', eco:.74, ai:.8, hero:.85 },
  { id:'veteran', n:'Veteran',  d:'Same economy, same heroes. An even fight.',           eco:1.0, ai:1.0, hero:1.0 },
  { id:'warlord', n:'Warlord',  d:'They out-gather you by a third. Out-play them.',      eco:1.34, ai:1.2, hero:1.14 },
];

const G = {
  state:'menu', t:0, dt:0, wave:0, waveT:C.FIRST_WAVE, speed:1, paused:false,
  sides:[], units:[], projs:[], fx:[], floats:[], zones:[],
  winner:null, diff:DIFFS[1], uid:1, toasts:[], log:[], timeline:[], demo:false,
};

function makeSide(i, ai){
  const s = {
    i, ai, name:SIDE_NAME[i], col:SIDE_COL[i],
    res:{ gold:200, iron:110, wood:170, food:130 },
    // Four workers standing idle is where this game used to open, and a player
    // who spent a minute reading the screen came back to an economy that had
    // earned nothing while the Host — which assigns on its first tick — was
    // three waves in. Three of them start on a job; the fourth is left for you
    // to place, which is the first thing the game asks you to do.
    workers:{ idle:1, gold:1, iron:0, wood:1, food:1 },
    plot:new Array(PLOT_W * PLOT_H).fill(null),
    trainQ:[], muster:[], heroes:[],
    nodeLvl:{ gold:1, iron:1, wood:1 },
    // Its own decision stream (see arnd) — mixed with a draw from the match
    // seed, or every hold makes exactly the same decisions in every match it
    // ever plays. It did: side 1's fixed sequence happened to be the better
    // one, and it won 49 of 66 mirror matches on a difficulty that promises an
    // even fight.
    rs:((Math.floor(rnd() * 0xFFFFFFFF) ^ ((i + 1) * 0x9E3779B1)) | 0) || 1,

    towerUp:{ hp:0, armor:0, atk:0, as:0, regen:0 },
    troopUp:{ tad:0, tarm:0, thp:0 },
    structs:[], superT:0, aiT:0, aiBuild:0, waveKind:'levy',
    kills:0, structsKilled:0, gathered:0, spent:0, heroKills:0,
  };
  // Every hold opens with a pit and a farm already standing.
  s.plot[5] = { type:'pit', lvl:1, tile:5 };
  s.plot[6] = { type:'farm', lvl:1, tile:6 };
  for (const d of STRUCTS){
    const x = i === 0 ? d.x : C.LANE_LEN - d.x;
    // The stagger has to mirror with the map: both holds used to put their
    // outer turret on the same side of the deck, so the two lanes were not
    // actually the same lane.
    const yo = d.key === 't1' ? -2.6 : d.key === 't2' ? 2.6 : d.key === 't3' ? -2.6 : 0;
    s.structs.push({
      struct:true, side:i, key:d.key, n:d.n, ord:0, x, y:yo,
      hp:d.hp, base:d, mhp:d.hp, ad:d.ad, as:d.as, rng:d.rng, armor:d.armor, mr:d.mr, r:d.r,
      cd:0, dead:false, downT:0, target:null, hitT:0, id:G.uid++,
    });
  }
  // Attack order runs from the bridge inward: outer turret first, gates last.
  s.structs.sort((a, b) => (i === 0 ? b.x - a.x : a.x - b.x));
  s.structs.forEach((st, k) => { st.ord = k; });
  return s;
}

function newMatch(opt){
  opt = opt || {};
  reseed(opt.seed || (HEADLESS ? 1337 : (Date.now() & 0x7fffffff)));
  G.diff = DIFFS.find(d => d.id === (opt.diff || 'veteran')) || DIFFS[1];
  G.state = 'play'; G.t = 0; G.wave = 0; G.waveT = C.FIRST_WAVE; G.winner = null;
  G.units.length = 0; G.projs.length = 0; G.fx.length = 0; G.floats.length = 0; G.zones.length = 0;
  G.log.length = 0; G.timeline.length = 0; G.paused = false; G.speed = 1; G.demo = false;
  G.sides = [makeSide(0, false), makeSide(1, true)];
  // The Host gets its handicap as a straight resource multiplier, not as
  // cheating in the sim — everything it does, you can also do.
  const e = G.diff.eco;
  const r = G.sides[1].res;
  r.gold = Math.round(r.gold * e); r.iron = Math.round(r.iron * e);
  r.wood = Math.round(r.wood * e); r.food = Math.round(r.food * e);
  sel.tile = -1; sel.node = null; sel.build = null; sel.struct = null; sel.unit = null;
  scatterCache[0] = scatterCache[1] = null;
  cam.shake = 0; cam.sx = 0; cam.sy = 0;
  cam.follow = false; cam.z = cam.tz = startZoom(LW);
  // Sit the hold a touch left of centre so the bridge is in shot too. In world
  // units that offset depends on how much world the screen is showing, or a
  // zoomed-in phone opens with half the plot grid off the left edge.
  cam.x = HOLD_X + .10 * (LW / (LS() * .96));
  return G;
}

// The menu sits over a live battle rather than a dark sheet. It is a real
// match with both holds played by the AI; it never touches the save file and
// simply starts again when someone wins.
function startDemo(){
  newMatch({ diff:'veteran' });
  G.demo = true;
  G.sides[0].ai = true;
  G.speed = 1;
  cam.follow = false; cam.x = HOLD_X + 4; cam.tz = cam.z = clamp(LW / 1500, .62, 1.05);
  return G;
}

/* ------------------------------------------------------------------ hold queries */
const bList = (s, type) => s.plot.filter(b => b && b.type === type);
const bLvl = (s, type) => bList(s, type).reduce((a, b) => a + b.lvl, 0);
const popCap = (s) => C.POP_BASE + bLvl(s, 'farm') * C.POP_PER_FARM;
const fieldSlots = (s) => bLvl(s, 'farm') * C.FARM_SLOTS;
const NODE_UPGRADABLE = ['gold','iron','wood'];
const nodeLvl = (s, node) => (s.nodeLvl && s.nodeLvl[node]) || 1;
const nodeCap = (s, node) => node === 'food' ? fieldSlots(s)
  : C.NODE_CAP[node] + C.NODE_CAP_PER_LVL * (nodeLvl(s, node) - 1);
const nodeRate = (s, node) => C.GATHER[node] * (1 + C.NODE_RATE_PER_LVL * (nodeLvl(s, node) - 1));
const nodeUpCost = (s, node) => {
  const l = nodeLvl(s, node);
  return { wood: Math.round(70 * Math.pow(1.65, l - 1)), gold: Math.round(50 * Math.pow(1.65, l - 1)) };
};
function upgradeNode(s, node){
  if (!NODE_UPGRADABLE.includes(node)) return 'the fields are grown by building farms';
  if (nodeLvl(s, node) >= C.NODE_MAX_LVL) return 'already dug as deep as it goes';
  const cost = nodeUpCost(s, node);
  if (!canPay(s, cost)) return 'not enough resources';
  pay(s, cost);
  s.nodeLvl[node]++;
  return null;
}
const workerCount = (s) => s.workers.idle + s.workers.gold + s.workers.iron + s.workers.wood + s.workers.food;
const fielded = (s) => G.units.reduce((a, u) => a + ((u.side === s.i && !u.dead && u.paid) ? 1 : 0), 0);
const popUsed = (s) => workerCount(s) + s.muster.length + fielded(s)
  + s.trainQ.reduce((a, q) => a + (q.type === 'worker' ? 1 : 0), 0);
const trainSlots = (s) => Math.max(1, bLvl(s, 'pit'));
const barrackSlots = (s) => bLvl(s, 'barracks');
const gatherMul = (s) => {
  let m = 1 + .12 * bLvl(s, 'workshop');
  for (const h of s.heroes) m += passVal(h, 'gatherM');
  return m;
};
const heroMul = (side) => side === 1 ? G.diff.hero : 1;
// Slots came from the BEST tavern, not from all of them, so a second Hero
// Factory was sixteen plots' worth of nothing — and the Host's build plan
// asks for two. Every level of every tavern counts now, up to the cap of 3.
const heroCap = (s) => Math.min(3, bLvl(s, 'tavern'));
const upCap = (s) => Math.min(MAX_UP, bLvl(s, 'forge') * 2);
const barracksLvl = (s) => bList(s, 'barracks').reduce((a, b) => Math.max(a, b.lvl), 0);

const canPay = (s, cost) => { for (const k in cost) if (s.res[k] < cost[k]) return false; return true; };
const pay = (s, cost) => { for (const k in cost){ s.res[k] -= cost[k]; s.spent += cost[k]; } };
const scaleCost = (cost, mul) => { const o = {}; for (const k in cost) o[k] = Math.round(cost[k] * mul); return o; };

/* ------------------------------------------------------------------ hold actions
   Every one of these returns a string on refusal and null on success, so the
   UI, the AI and the tests all learn the same reason.                        */
function trainWorker(s){
  if (s.trainQ.filter(q => q.type === 'worker').length >= trainSlots(s)) return 'every pit is busy';
  if (popUsed(s) >= popCap(s)) return 'population is full — build a farm';
  if (!canPay(s, C.WORKER_COST)) return 'not enough gold or food';
  pay(s, C.WORKER_COST);
  s.trainQ.push({ type:'worker', t:0, dur:C.WORKER_TIME * (1 - .06 * (bLvl(s, 'pit') - 1)) });
  return null;
}

function trainUnit(s, type){
  const d = TRAIN[type];
  if (!d) return 'unknown unit';
  if (barracksLvl(s) < d.barracks) return 'needs a level ' + d.barracks + ' barracks';
  if (s.trainQ.filter(q => q.type !== 'worker').length >= barrackSlots(s)) return 'the barracks are busy';
  if (s.workers.idle < d.need) return 'no idle worker to arm';
  if (!canPay(s, d.cost)) return 'not enough resources';
  pay(s, d.cost);
  s.workers.idle -= d.need;
  s.trainQ.push({ type, t:0, dur:d.time });
  return null;
}

function assign(s, node, delta){
  if (delta > 0){
    const room = nodeCap(s, node) - s.workers[node];
    const n = Math.min(delta, s.workers.idle, room);
    if (n <= 0) return room <= 0 ? 'that job is full' : 'no idle workers';
    s.workers[node] += n; s.workers.idle -= n;
  } else {
    const n = Math.min(-delta, s.workers[node]);
    if (n <= 0) return 'nobody works there';
    s.workers[node] -= n; s.workers.idle += n;
  }
  return null;
}

function buildCost(type, lvl){
  const B = BUILDINGS[type];
  return lvl <= 1 ? B.cost : scaleCost(B.up, Math.pow(1.5, lvl - 2));
}

function build(s, tile, type){
  if (tile < 0 || tile >= s.plot.length) return 'no such plot';
  if (s.plot[tile]) return 'that plot is taken';
  const B = BUILDINGS[type];
  if (!B) return 'unknown building';
  const cost = buildCost(type, 1);
  if (!canPay(s, cost)) return 'not enough resources';
  pay(s, cost);
  s.plot[tile] = { type, lvl:1, tile, raise:1 };
  return null;
}

function upgradeBuilding(s, tile){
  const b = s.plot[tile];
  if (!b) return 'nothing there';
  const B = BUILDINGS[b.type];
  if (b.lvl >= B.maxLvl) return 'already at the top level';
  const cost = buildCost(b.type, b.lvl + 1);
  if (!canPay(s, cost)) return 'not enough resources';
  pay(s, cost);
  b.lvl++; b.raise = 1;
  return null;
}

function upCostFor(def, lvl){ return scaleCost(def.cost, Math.pow(def.step, lvl)); }

function buyUp(s, id){
  const def = TOWER_UPS.find(u => u.id === id) || TROOP_UPS.find(u => u.id === id);
  if (!def) return 'unknown upgrade';
  const bag = TOWER_UPS.includes(def) ? s.towerUp : s.troopUp;
  if (bLvl(s, 'forge') === 0) return 'build a forge first';
  if (bag[id] >= upCap(s)) return 'the forge cannot go higher — upgrade it';
  const cost = upCostFor(def, bag[id]);
  if (!canPay(s, cost)) return 'not enough resources';
  pay(s, cost);
  bag[id]++;
  if (TOWER_UPS.includes(def) && id === 'hp') for (const st of s.structs){
    const nm = structMaxHp(s, st);
    st.hp = Math.min(nm, st.hp + (nm - st.mhp)); st.mhp = nm;    // the new stone is already in place
  }
  return null;
}

const structMaxHp = (s, st) => Math.round(st.base.hp * (1 + UP_EFFECT.hp * s.towerUp.hp));

/* ------------------------------------------------------------------ economy tick */
function ecoStep(s, dt){
  // The Host's handicap is an open, ongoing resource multiplier — the same
  // levers you have, just more of them. A one-off opening purse was noise
  // across a fifteen-minute match, which made the difficulties identical.
  const m = gatherMul(s) * (s.i === 1 ? G.diff.eco : 1);
  let got = 0;
  for (const node of ['gold','iron','wood','food']){
    const n = Math.min(s.workers[node], nodeCap(s, node));
    if (n <= 0) continue;
    const amt = n * nodeRate(s, node) * m * dt;
    s.res[node] += amt; got += amt;
  }
  s.gathered += got;
  // Idle workers drift home; overfull jobs (a farm was destroyed) spill back.
  for (const node of ['gold','iron','wood','food']){
    const cap = nodeCap(s, node);
    if (s.workers[node] > cap){ const over = s.workers[node] - cap; s.workers[node] = cap; s.workers.idle += over; }
  }
  for (let i = s.trainQ.length - 1; i >= 0; i--){
    const q = s.trainQ[i];
    const slots = q.type === 'worker' ? trainSlots(s) : barrackSlots(s);
    const rank = s.trainQ.filter(o => (o.type === 'worker') === (q.type === 'worker')).indexOf(q);
    if (rank >= slots) continue;                 // waiting for a free slot
    q.t += dt;
    if (q.t >= q.dur){
      s.trainQ.splice(i, 1);
      if (q.type === 'worker') s.workers.idle++;
      else s.muster.push({ type:q.type });
      if (s.i === 0) sfx('build');
    }
  }
  for (const b of s.plot) if (b && b.raise > 0) b.raise = Math.max(0, b.raise - dt * 1.6);
  if (s.superT > 0) s.superT = Math.max(0, s.superT - dt);
}

/* =====================================================================
   THE BRIDGE — units, waves, damage
   ===================================================================== */
const dirOf = (side) => side === 0 ? 1 : -1;
const enemyOf = (side) => side === 0 ? 1 : 0;
const gateX = (side) => side === 0 ? STRUCTS[0].x : C.LANE_LEN - STRUCTS[0].x;

function spawnUnit(side, kind, o){
  o = o || {};
  const d = UNITS[kind], s = G.sides[side];
  if (G.units.length >= C.MAX_UNITS) return null;
  const waveScale = 1 + .055 * G.wave;
  let heroHp = 0;
  for (const h of s.heroes){
    heroHp += passVal(h, 'auraHp');
    if (kind === 'melee') heroHp += passVal(h, 'meleeHp');
  }
  const hpUp = (1 + UP_EFFECT.thp * s.troopUp.thp) * (1 + heroHp),
        adUp = 1 + UP_EFFECT.tad * s.troopUp.tad, armUp = UP_EFFECT.tarm * s.troopUp.tarm;
  const u = {
    id:G.uid++, side, kind, isHero:false, struct:false, paid:!!o.paid,
    x:o.x !== undefined ? o.x : gateX(side) + dirOf(side) * 2.5,
    y:o.y !== undefined ? o.y : rr(-2.6, 2.6),
    mhp:Math.round(d.hp * waveScale * hpUp * (o.hpM || 1)), hp:0,
    ad:d.ad * waveScale * adUp * (o.adM || 1), armor:d.armor + armUp, mr:d.mr + armUp,
    as:d.as, rng:d.rng, spd:d.spd, r:d.r, tdmg:d.tdmg, magic:!!d.magic, bounty:d.bounty,
    cd:rr(0, .5), target:null, dead:false, slowT:0, slowP:0, stunT:0, shield:0, shT:0,
    burn:null, hitT:0, swing:0, life:o.life || 0, ph:rnd() * 6.28, dmgTaken:0,
  };
  u.hp = u.mhp;
  G.units.push(u);
  return u;
}

function spawnWave(){
  G.wave++;
  const kinds = [];
  // Whoever spawns first sits earlier in the unit list, and the unit list is
  // what breaks ties in targeting and in the separation push. update() already
  // alternates its per-side loops for exactly this reason; the wave has to too.
  for (const s of (G.wave % 2 ? G.sides : [G.sides[1], G.sides[0]])){
    const k = waveKindFor(s);
    kinds[s.i] = k;
    s.waveKind = k.id;
    const n = Math.max(1, 3 + (G.wave >= 8 ? 1 : 0) + k.grunt);
    for (let i = 0; i < n; i++)
      spawnUnit(s.i, 'grunt', { y:lerp(-2.4, 2.4, i / Math.max(1, n - 1)), hpM:k.hpM });
    for (let i = 0; i < k.caster; i++) spawnUnit(s.i, 'caster', { y:i ? 1.8 : -1.8 });
    for (let i = 0; i < k.sup; i++) spawnUnit(s.i, 'super', { y:0 });
    // A free siege engine rolls out every third wave, then every second, then
    // every wave — so a stalemate slowly stops being an option.
    const every = G.wave >= 20 ? 1 : G.wave >= 12 ? 2 : 3;
    const cannons = (G.wave % every === 0 ? 1 : 0) + k.cannon;
    for (let i = 0; i < cannons; i++) spawnUnit(s.i, 'cannon', { y:i ? 1.4 : 0 });
    for (const m of s.muster) spawnUnit(s.i, m.type, { paid:true, y:rr(-2.6, 2.6) });
    s.muster.length = 0;
    if (s.superT > 0) for (let i = 0; i < 2; i++) spawnUnit(s.i, 'super', { y:i ? 1.6 : -1.6 });
  }
  const foe = kinds[1];
  fxToast('Wave ' + G.wave + ' — the Host sends ' + foe.n + '.', foe.id === 'levy' ? '' : 'bad');
  sfx('wave');
}

// Every wave used to be the same shape. These swap the free trickle around
// rather than adding to it — a shield wall trades its siege engine for bodies,
// a volley trades bodies for range — so the shape changes without the wave
// quietly becoming stronger.
// Trading a siege engine away for two levies badly under-pays — a cannon is
// worth about four bodies — so the deltas below are priced against each other
// rather than picked by eye. Some shapes are still heavier than others; that
// is what variety means.
const WAVE_KINDS = [
  { id:'levy',   n:'levies',        grunt:0,  caster:0, cannon:0,  sup:0, hpM:1,    min:0 },
  { id:'shield', n:'a shield wall', grunt:2,  caster:0, cannon:0,  sup:0, hpM:1.15, min:4 },
  { id:'volley', n:'a volley wave', grunt:-2, caster:2, cannon:0,  sup:0, hpM:1,    min:6 },
  { id:'siege',  n:'siege engines', grunt:-3, caster:0, cannon:1,  sup:0, hpM:1,    min:8 },
  { id:'ogres',  n:'ogres',         grunt:-2, caster:0, cannon:-1, sup:1, hpM:1,    min:20 },
];
function waveKindFor(s){
  const pool = WAVE_KINDS.filter(k => G.wave >= k.min);
  // weighted so plain levies stay the common case
  const roll = arnd(s);
  if (roll < .45 || pool.length === 1) return WAVE_KINDS[0];
  return pool[1 + Math.floor(arnd(s) * (pool.length - 1))] || WAVE_KINDS[0];
}

/* ------------------------------------------------------------------ lookup grid */
let grid = new Map();
function rebuildGrid(){
  grid.clear();
  for (const u of G.units){
    if (u.dead) continue;
    const k = Math.floor(u.x / 6);
    let a = grid.get(k); if (!a){ a = []; grid.set(k, a); }
    a.push(u);
  }
}
function nearby(x, rad, fn){
  const k0 = Math.floor((x - rad) / 6), k1 = Math.floor((x + rad) / 6);
  for (let k = k0; k <= k1; k++){ const a = grid.get(k); if (a) for (const u of a) fn(u); }
}

function liveStructs(side){ return G.sides[side].structs.filter(st => !st.dead); }
function frontStruct(side){                 // the only structure of `side` that may be attacked
  const list = G.sides[side].structs;
  for (const st of list) if (!st.dead) return st;
  return null;
}

function nearestFoe(u, rad, wantHero){
  let best = null, bd = rad * rad;
  const foe = enemyOf(u.side);
  nearby(u.x, rad, (o) => {
    if (o.dead || o.side !== foe) return;
    if (wantHero && !o.isHero) return;
    const dx = o.x - u.x, dy = o.y - u.y, d = dx * dx + dy * dy;
    if (d < bd){ bd = d; best = o; }
  });
  return best;
}

/* ------------------------------------------------------------------ damage */
// A minion's armour, plus whatever a hero standing beside it is lending.
function effArmor(u, magic){
  let r = magic ? (u.mr || 0) : (u.armor || 0);
  // Armour Plating: bought, priced, described — and read by nothing until now.
  if (u.struct && G.sides[u.side]) r += UP_EFFECT.armor * G.sides[u.side].towerUp.armor;
  if (!u.isHero && !u.struct && u.side !== undefined){
    for (const h of G.sides[u.side].heroes)
      if (!h.dead && h.inLane && Math.abs(h.x - u.x) < 8) r += passVal(h, 'auraArm');
  }
  return r;
}
function mitigate(amt, tgt, magic){
  return amt * 100 / (100 + Math.max(-90, effArmor(tgt, magic)));
}

function alliesNear(u, rad){
  let n = 0;
  nearby(u.x, rad, (o) => { if (!o.dead && o.side === u.side && o !== u && Math.abs(o.y - u.y) < rad) n++; });
  return n;
}
function foesNear(u, rad){
  let n = 0;
  nearby(u.x, rad, (o) => { if (!o.dead && o.side !== u.side && Math.abs(o.y - u.y) < rad) n++; });
  return n;
}

function dealDmg(src, tgt, amt, o){
  o = o || {};
  if (!tgt || tgt.dead || amt <= 0) return 0;
  const magic = !!o.magic;
  if (src && src.isHero){
    let m = 1 + passVal(src, 'dmgAll') + bsum(src, 'bdmg');
    if (tgt.struct) m += passVal(src, 'tdmg') + (tgt.key === 'gate' ? passVal(src, 'gateDmg') : 0);
    else if (tgt.isHero) m += passVal(src, 'hdmg') + (src.lastKiller === tgt ? passVal(src, 'grudge') : 0);
    else m += passVal(src, 'mdmg');
    const frac = tgt.hp / tgt.mhp;
    const ex = passVal(src, 'exec') + (o.exec || 0);
    if (ex > 0 && frac < .4) m += ex * clamp((.4 - frac) / .3, 0, 1);
    if (src.hp / src.mhp < .4) m += passVal(src, 'dmgLow');
    if (src.hp / src.mhp > .8) m += passVal(src, 'dmgHigh');
    const cr = passVal(src, 'crowd');
    if (cr > 0) m += Math.min(3, foesNear(src, 5)) * cr;
    if (passVal(src, 'lone') && alliesNear(src, 7) === 0) m += passVal(src, 'lone');
    if (tgt.markT > 0 && tgt.markBy === src.side) m += tgt.markAmp || 0;
    amt *= Math.max(.1, m);
  } else if (src && !src.struct && src.side !== undefined){
    const s = G.sides[src.side];
    // Hero auras lift the minions fighting beside them.
    let m = 1;
    for (const h of s.heroes) if (!h.dead && h.inLane && Math.abs(h.x - src.x) < 9) m += passVal(h, 'auraDmg');
    if (src.kind === 'cannon') for (const h of s.heroes) m += passVal(h, 'cannonDmg');
    if (src.kind === 'caster') for (const h of s.heroes) m += passVal(h, 'casterDmg');
    amt *= m;
  }
  if (tgt.isHero){
    let t = 1 + passVal(tgt, 'takeMore') - passVal(tgt, 'takeLess');
    if (src && src.struct) t -= passVal(tgt, 'towerRes');
    if (passVal(tgt, 'pack') && alliesNear(tgt, 7) > 0) t -= passVal(tgt, 'pack');
    amt *= Math.max(.15, t);
  }
  let dmg = o.pure ? amt : mitigate(amt, tgt, magic);
  if (tgt.shield > 0){
    const ab = Math.min(tgt.shield, dmg);
    tgt.shield -= ab; dmg -= ab;
  }
  tgt.hp -= dmg; tgt.hitT = .18; tgt.dmgTaken = G.t;
  // A spark where the blow lands. Capped hard so a wave-on-wave brawl cannot
  // bury the frame in particles.
  if (!HEADLESS && dmg > 0 && G.fx.length < 150){
    const big = tgt.isHero || tgt.struct || dmg > 60;
    if (big || rnd() < .4){
      const col = magic ? '#c9a6ff' : tgt.struct ? '#e8d9b4' : '#ffd08a';
      for (let i = 0, n = big ? 4 : 2; i < n; i++){
        const a = rnd() * 6.283, sp = rr(1.5, big ? 6 : 3.5);
        G.fx.push({ k:'p', x:tgt.x, y:tgt.y, z:rr(.5, 1.4), vx:Math.cos(a) * sp, vy:Math.sin(a) * sp * .5,
          vz:rr(1, 4), t:rr(.16, .34), dur:.34, col, r:rr(.9, big ? 2.4 : 1.5) });
      }
    }
    if (tgt.struct && dmg > 40) shake(Math.min(3, dmg / 90), tgt.x);
    sfx(tgt.struct ? 'stone' : (big ? 'hitBig' : 'hit'), tgt.x);
  }
  if (dmg > 0 && !HEADLESS) addFloat(tgt.x, tgt.y, Math.round(dmg), magic ? '#c69bff' : (src && src.isHero ? '#ffe08a' : '#ffffff'), tgt.isHero || tgt.struct ? 1 : .8);
  if (src && src.isHero && dmg > 0){
    const vamp = o.ability ? passVal(src, 'spellVamp') + bsum(src, 'bvamp') : passVal(src, 'ls') + bsum(src, 'bls');
    if (vamp > 0) healUnit(src, dmg * vamp);
  }
  if (tgt.isHero && !o.ability && src && !src.struct && passVal(tgt, 'thorns') > 0 && src.hp !== undefined)
    dealDmg(tgt, src, dmg * passVal(tgt, 'thorns'), { pure:true, noHooks:true });
  if (tgt.hp <= 0) killThing(tgt, src);
  return dmg;
}

function healUnit(u, amt){
  if (!u || u.dead || amt <= 0) return;
  u.hp = Math.min(u.mhp, u.hp + amt);
  if (!HEADLESS && amt > 4) addFloat(u.x, u.y, '+' + Math.round(amt), '#7fdc8a', .8);
}

function killThing(t, src){
  if (t.dead) return;
  t.dead = true; t.hp = 0;
  if (t.struct){ onStructDown(t, src); return; }
  const s = src && src.side !== undefined ? G.sides[src.side] : null;
  if (s && !t.isHero){
    let g = C.BOUNTY_MINION + (t.bounty || 0);
    if (src.isHero) g = g * (1 + passVal(src, 'goldM')) + passVal(src, 'killGold');
    s.res.gold += g; s.kills++;
  }
  if (src && src.isHero){
    healUnit(src, passVal(src, 'killHeal'));
    src.mana = Math.min(src.mmana, src.mana + passVal(src, 'killMana'));
    const kad = passVal(src, 'killAd');
    if (kad) addBuff(src, { t:30, bad:kad, stackMax:5, tag:'momentum' });
    const kas = passVal(src, 'killAs');
    if (kas) addBuff(src, { t:12, bas:kas, tag:'ravage' });
  }
  if (t.isHero) onHeroDeath(t, src);
  else {
    shareXp(t.x, 36 + 3.6 * G.wave, src);
    if (!HEADLESS){ burstFx(t.x, t.y, SIDE_COL[t.side], 7); sfx('die', t.x); }
    const i = G.units.indexOf(t); if (i >= 0) G.units.splice(i, 1);
  }
}

// A dying minion pays experience to every hero standing near it, whichever
// side it belonged to — the killer just gets the bigger cut.
function shareXp(x, amt, src){
  for (const s of G.sides) for (const h of s.heroes){
    if (h.dead || !h.inLane) continue;
    if (Math.abs(h.x - x) > 15) continue;
    gainXp(h, amt * (h === src ? 1 : .7));
  }
}

function awardXp(src, amt, x){
  if (!src || src.side === undefined || amt <= 0) return;
  const s = G.sides[src.side];
  for (const h of s.heroes){
    if (h.dead || !h.inLane) continue;
    const near = Math.abs(h.x - x) < 15;
    if (!near && h !== src) continue;
    gainXp(h, amt * (h === src ? 1 : .55));
  }
}

function onStructDown(st, src){
  const s = G.sides[st.side], foe = G.sides[enemyOf(st.side)];
  let g = C.BOUNTY_STRUCT;
  if (src && src.isHero) g *= 1 + passVal(src, 'structGold');
  foe.res.gold += g; foe.structsKilled++;
  awardXp(src, 70, st.x);
  fxToast(SIDE_NAME[st.side] + ' loses ' + st.n + '.', st.side === 0 ? 'bad' : 'good');
  if (!HEADLESS){
    burstFx(st.x, st.y, '#d8c49a', 30);
    ringFx(st.x, st.y, st.key === 'gate' ? 7 : 4.5, '#ffd9a0');
    shake(st.key === 'gate' ? 14 : st.key === 'inhib' ? 9 : 7, st.x);
    sfx('fall', st.x);
    if (st.key === 'inhib') sfx('inhib', st.x);
  }
  G.timeline.push({ t:G.t, side:st.side, key:st.key, n:st.n });
  if (st.key === 'inhib'){ foe.superT = C.SUPER_DUR; st.downT = C.INHIB_RESPAWN; }
  if (st.key === 'gate'){ endMatch(enemyOf(st.side)); }
}

function endMatch(winner){
  if (G.state !== 'play') return;
  if (G.demo){ startDemo(); return; }          // the attract battle just starts over
  G.state = 'over'; G.winner = winner;
  sfx(winner === 0 ? 'win' : 'lose');
  clearSave();
  saveMeta(winner === 0);
  if (!HEADLESS) showOver();
}

/* ------------------------------------------------------------------ attacks */
function attackSpeedOf(u){
  let as = u.as;
  if (u.isHero){
    as *= (u.asMul || 1) * (1 + bsum(u, 'bas') + (u.rage || 0));
    if (u.hp / u.mhp < .5) as *= 1 + passVal(u, 'asLow');
    if (passVal(u, 'asDuel') && nearestFoe(u, 8, true)) as *= 1 + passVal(u, 'asDuel');
  }
  if (u.struct) as *= 1 + UP_EFFECT.as * G.sides[u.side].towerUp.as;
  return Math.max(.15, as);
}

function attackDamage(u){
  let ad = u.ad;
  if (u.isHero) ad += bsum(u, 'bad');
  if (u.struct) ad *= 1 + UP_EFFECT.atk * G.sides[u.side].towerUp.atk;
  if (u.mb && u.mb.t > 0) ad *= 1 + u.mb.ad;
  return ad;
}

function basicAttack(u, tgt){
  const dmg = attackDamage(u);
  const magic = !!u.magic;
  const ranged = u.rng > 3;
  u.swing = .22;
  const land = () => {
    if (u.dead || tgt.dead) return;
    let amt = dmg, crit = false;
    if (u.isHero){
      const cc = passVal(u, 'crit') + bsum(u, 'bcrit');
      if (cc > 0 && rnd() < cc){ crit = true; amt *= 1.75 + passVal(u, 'critD'); }
      amt += passVal(u, 'onHitAp') * u.ap;
    }
    const done = dealDmg(u, tgt, amt * (tgt.struct ? (u.tdmg || 1) : 1), { magic });
    if (u.isHero && !tgt.dead){
      const tru = passVal(u, 'truOn'); if (tru) dealDmg(u, tgt, tru, { pure:true });
      const bn = passVal(u, 'burn') + bsum(u, 'bburn');
      if (bn) applyBurn(tgt, bn / 3, passVal(u, 'burnDur') || 3, u);
      const sl = passVal(u, 'slowOn'); if (sl) applySlow(tgt, sl, 1.5);
      if (!u.hitOnce) u.hitOnce = new Set();
      const fh = passVal(u, 'firstHit');
      if (fh && !u.hitOnce.has(tgt.id)){ u.hitOnce.add(tgt.id); dealDmg(u, tgt, fh, { pure:true }); }
      const rg = passVal(u, 'rage'); if (rg) u.rage = Math.min(.2, (u.rage || 0) + rg);
      u.atkN = (u.atkN || 0) + 1;
      const ef = passVal(u, 'everyFourth');
      if (ef && u.atkN % 4 === 0) areaHit(u, tgt.x, tgt.y, 2.6, ef, { magic:true, ability:true });
      const ch = passVal(u, 'chainHit');
      if (ch && u.atkN % 5 === 0) chainHit(u, tgt, ch, 2);
    }
    if (crit && !HEADLESS) burstFx(tgt.x, tgt.y, '#ffcf4d', 5);
    return done;
  };
  if (ranged) shoot(u, tgt, land, magic ? '#c69bff' : (u.struct ? '#ffd98a' : SIDE_COL2[u.side]));
  else land();
}

function shoot(u, tgt, onHit, col){
  sfx('shot', u.x);
  G.projs.push({ x:u.x, y:u.y, z:u.struct ? 2.6 : .8, tgt, onHit, col, sp:tgt.struct ? 34 : 26, dead:false, tr:[] });
}

function areaHit(src, x, y, rad, amt, o){
  const foe = enemyOf(src.side);
  const hits = [];
  nearby(x, rad + 2, (u) => {
    if (u.dead || u.side !== foe) return;
    if (Math.hypot(u.x - x, u.y - y) <= rad + u.r) hits.push(u);
  });
  for (const st of G.sides[foe].structs)
    if (!st.dead && st === frontStruct(foe) && Math.hypot(st.x - x, st.y - y) <= rad + st.r) hits.push(st);
  for (const h of hits) dealDmg(src, h, amt, o);
  if (!HEADLESS) ringFx(x, y, rad, o && o.magic ? '#a98bff' : '#ffbe6a');
  return hits.length;
}

function chainHit(src, first, amt, jumps){
  let cur = first; const seen = new Set([first.id]);
  for (let i = 0; i < jumps; i++){
    let nxt = null, bd = 36;
    nearby(cur.x, 6, (u) => {
      if (u.dead || u.side !== enemyOf(src.side) || seen.has(u.id)) return;
      const d = (u.x - cur.x) ** 2 + (u.y - cur.y) ** 2;
      if (d < bd){ bd = d; nxt = u; }
    });
    if (!nxt) break;
    seen.add(nxt.id);
    if (!HEADLESS) boltFx(cur.x, cur.y, nxt.x, nxt.y, '#9ad8ff');
    dealDmg(src, nxt, amt, { magic:true, ability:true });
    cur = nxt;
  }
}

function applySlow(t, pct, dur){
  if (t.struct) return;
  const ten = t.isHero ? passVal(t, 'tenacity') : 0;
  dur *= (1 - ten);
  if (pct >= t.slowP || t.slowT < dur){ t.slowP = Math.max(t.slowP, pct); t.slowT = Math.max(t.slowT, dur); }
}
function applyStun(t, dur){
  if (t.struct) return;
  const ten = t.isHero ? passVal(t, 'tenacity') : 0;
  t.stunT = Math.max(t.stunT, dur * (1 - ten));
}
function applyBurn(t, dps, dur, src){
  if (t.struct) return;
  t.burn = { dps:Math.max(dps, t.burn ? t.burn.dps : 0), t:Math.max(dur, t.burn ? t.burn.t : 0), src };
}

/* ------------------------------------------------------------------ unit tick */
function speedOf(u){
  let sp = u.spd * (1 - Math.min(.75, u.slowP > 0 && u.slowT > 0 ? u.slowP : 0));
  if (u.isHero) sp *= 1 + bsum(u, 'bms');
  else {
    const s = G.sides[u.side];
    for (const h of s.heroes) if (!h.dead && h.inLane && Math.abs(h.x - u.x) < 9) sp *= 1 + passVal(h, 'auraMs');
    if (u.mb && u.mb.t > 0) sp *= 1 + u.mb.ms;
  }
  return sp;
}

function statusTick(u, dt){
  if (u.slowT > 0){ u.slowT -= dt; if (u.slowT <= 0) u.slowP = 0; }
  if (u.stunT > 0) u.stunT -= dt;
  if (u.markT > 0) u.markT -= dt;
  if (u.taunt > 0) u.taunt -= dt;
  if (u.shT > 0){ u.shT -= dt; if (u.shT <= 0) u.shield = 0; }
  if (u.hitT > 0) u.hitT -= dt;
  if (u.swing > 0) u.swing -= dt;
  if (u.burn){
    u.burn.t -= dt;
    dealDmg(u.burn.src, u, u.burn.dps * dt, { magic:true, pure:true, noHooks:true });
    if (u.burn.t <= 0) u.burn = null;
  }
}

function acquire(u){
  const foe = enemyOf(u.side);
  if (u.taunt > 0 && u.target && !u.target.dead) return u.target;
  if (u.target && !u.target.dead){
    const d = Math.hypot(u.target.x - u.x, u.target.y - u.y);
    if (d < 13 && (!u.target.struct || u.target === frontStruct(foe))) return u.target;
  }
  const f = nearestFoe(u, 9.5);
  if (f) return f;
  const st = frontStruct(foe);
  if (st && Math.abs(st.x - u.x) < 60) return st;
  return null;
}

function unitStep(u, dt){
  statusTick(u, dt);
  if (u.life > 0){
    u.life -= dt;
    if (u.life <= 0){ u.dead = true; const i = G.units.indexOf(u); if (i >= 0) G.units.splice(i, 1); return; }
  }
  if (u.stunT > 0) return;
  const tgt = u.target = acquire(u);
  const dir = dirOf(u.side);
  let mx = dir, my = 0, moving = true;
  if (tgt){
    const dx = tgt.x - u.x, dy = tgt.y - u.y;
    const dist = Math.hypot(dx, dy) || .001;
    const reach = u.rng + (tgt.r || .4) + u.r;
    if (dist <= reach){
      moving = false;
      u.cd -= dt;
      if (u.cd <= 0){ u.cd = 1 / attackSpeedOf(u); basicAttack(u, tgt); }
    } else { mx = dx / dist; my = dy / dist; }
  }
  if (moving){
    const sp = speedOf(u) * dt;
    u.x += mx * sp; u.y += my * sp;
  }
  u.y = clamp(u.y, -C.LANE_W / 2 + u.r, C.LANE_W / 2 - u.r);
  u.x = clamp(u.x, -2, C.LANE_LEN + 2);
}

function separate(){
  // Cheap neighbour push so ranks look like ranks instead of one stacked dot.
  for (const [, arr] of grid){
    for (let i = 0; i < arr.length; i++){
      const a = arr[i];
      for (let j = i + 1; j < arr.length; j++){
        const b = arr[j];
        const dx = b.x - a.x, dy = b.y - a.y;
        const rr2 = (a.r + b.r) * (a.r + b.r);
        const d2 = dx * dx + dy * dy;
        if (d2 > rr2 || d2 < 1e-6) continue;
        const d = Math.sqrt(d2), ov = (a.r + b.r - d) * .5;
        const nx = dx / d * ov, ny = dy / d * ov;
        const wa = a.isHero ? .35 : 1, wb = b.isHero ? .35 : 1;
        a.x -= nx * wa; a.y -= ny * wa; b.x += nx * wb; b.y += ny * wb;
      }
    }
  }
  for (const u of G.units) u.y = clamp(u.y, -C.LANE_W / 2 + u.r, C.LANE_W / 2 - u.r);
}

/* ------------------------------------------------------------------ structures */
function structStep(st, dt){
  if (st.dead){
    if (st.downT > 0){
      st.downT -= dt;
      if (st.downT <= 0){ st.dead = false; st.mhp = structMaxHp(G.sides[st.side], st); st.hp = st.mhp;
        fxToast(SIDE_NAME[st.side] + '’s inhibitor is rebuilt.', st.side === 0 ? 'good' : 'bad'); }
    }
    return;
  }
  if (st.hitT > 0) st.hitT -= dt;
  const s = G.sides[st.side];
  st.mhp = structMaxHp(s, st);
  const reg = UP_EFFECT.regen * s.towerUp.regen;
  if (reg > 0 && G.t - st.dmgTaken > 5) st.hp = Math.min(st.mhp, st.hp + reg * dt);
  if (!st.ad) return;
  st.cd -= dt;
  if (st.cd > 0) return;
  // Turrets shoot the nearest minion; with the lane clear they turn on heroes.
  let best = null, bd = st.rng * st.rng, hero = null, hd = st.rng * st.rng;
  nearby(st.x, st.rng + 1, (u) => {
    if (u.dead || u.side === st.side) return;
    const d = (u.x - st.x) ** 2 + (u.y - st.y) ** 2;
    if (d > st.rng * st.rng) return;
    if (u.isHero){ if (d < hd){ hd = d; hero = u; } }
    else if (d < bd){ bd = d; best = u; }
  });
  const tgt = best || hero;
  if (!tgt) return;
  st.cd = 1 / attackSpeedOf(st);
  st.target = tgt;
  basicAttack(st, tgt);
}

/* ------------------------------------------------------------------ projectiles / zones */
function projStep(dt){
  for (let i = G.projs.length - 1; i >= 0; i--){
    const p = G.projs[i];
    const t = p.tgt;
    if (!t || t.dead){ G.projs.splice(i, 1); continue; }
    const dx = t.x - p.x, dy = t.y - p.y, d = Math.hypot(dx, dy);
    const step = p.sp * dt;
    if (d <= step + .3){ p.onHit(); G.projs.splice(i, 1); continue; }
    p.x += dx / d * step; p.y += dy / d * step;
    p.z = Math.max(.6, p.z - dt * 2);
  }
}

function zoneStep(dt){
  for (let i = G.zones.length - 1; i >= 0; i--){
    const z = G.zones[i];
    z.t -= dt; z.tick -= dt;
    if (z.tick <= 0){
      z.tick = .5;
      const src = z.src;
      const foe = enemyOf(z.side);
      nearby(z.x, z.r + 2, (u) => {
        if (u.dead || u.side !== foe) return;
        if (Math.hypot(u.x - z.x, u.y - z.y) > z.r + u.r) return;
        dealDmg(src, u, z.dps * .5, { magic:z.magic, ability:true });
        if (z.slow) applySlow(u, z.slow, 1);
      });
      const st = frontStruct(foe);
      if (st && Math.hypot(st.x - z.x, st.y - z.y) <= z.r + st.r) dealDmg(src, st, z.dps * .5, { magic:z.magic, ability:true });
    }
    if (z.t <= 0) G.zones.splice(i, 1);
  }
}

/* =====================================================================
   HEROES
   ===================================================================== */
function passVal(h, key){
  if (!h || !h.passive) return 0;
  const m = PASS[h.passive].m, v = m[key];
  if (!v) return 0;
  return v * (1 + .45 * ((h.passRank || 1) - 1));
}
function bsum(h, key){
  if (!h || !h.buffs) return 0;
  let v = 0;
  for (const b of h.buffs) if (b.t > 0 && b[key]) v += b[key] * (b.stacks || 1);
  return v;
}
function addBuff(h, b){
  if (!h.buffs) h.buffs = [];
  if (b.tag){
    const ex = h.buffs.find(o => o.tag === b.tag && o.t > 0);
    if (ex){ ex.t = b.t; if (b.stackMax) ex.stacks = Math.min(b.stackMax, (ex.stacks || 1) + 1); return ex; }
  }
  b.stacks = 1; h.buffs.push(b); return b;
}
// Priced in worker-seconds, not in round numbers. 130 gold + 60 iron + 45 food
// is 153 + 97 + 50 = 300 seconds of one worker's digging, but iron is the pile
// a hold never has: instrumented over sixteen six-minute matches the Host was
// short of iron for 96% of the samples where a tavern slot stood empty (gold
// 71%, wood 0%), because iron also arms every soldier and pays every weapon
// upgrade, and it mines only ~410 of it in that time while spending ~480. The
// same 300 worker-seconds asked for in gold instead — 200 + 48 + 50 = 298 —
// leaves the hero exactly as dear and actually payable.
const HERO_COST = { gold:170, iron:30, food:45 };

// Two heroes on one side answering to the same name made the result card read
// like a bug. Take a name nobody in this hold is already using.
function freeName(side){
  const taken = new Set((G.sides[side] ? G.sides[side].heroes : []).map(h => h.name));
  const free = HERO_NAMES.filter(n => !taken.has(n));
  return pick(free.length ? free : HERO_NAMES);
}

function makeHero(side, cls, name){
  const cl = CLS[cls] || CLASSES[0];
  const h = {
    id:G.uid++, side, isHero:true, struct:false, cls:cl.id, name:name || freeName(side),
    lvl:1, xp:0, kills:0, deaths:0, passive:null, passRank:1, skills:[], pend:[], buffs:[],
    x:gateX(side) + dirOf(side) * 2, y:0, r:.62, dead:false, inLane:false, respawnT:0,
    hp:1, mhp:1, mana:1, mmana:1, cd:0, slowT:0, slowP:0, stunT:0, shield:0, shT:0, burn:null,
    hitT:0, swing:0, target:null, ph:rnd() * 6.28, rage:0, atkN:0, dmgTaken:-99, retreat:false,
    lastKiller:null, dmgDealt:0, magic:false, tdmg:1,
  };
  recalcHero(h, true);
  h.hp = h.mhp; h.mana = h.mmana;
  offer(h, 'passive');
  return h;
}

function createHero(s, cls, name){
  if (heroCap(s) <= 0) return 'build a Hero Factory first';
  if (s.heroes.length >= heroCap(s)) return 'no free hero slot — upgrade the factory';
  if (!CLS[cls]) return 'unknown class';
  if (!canPay(s, HERO_COST)) return 'not enough resources';
  pay(s, HERO_COST);
  const h = makeHero(s.i, cls, name);
  s.heroes.push(h);
  enterLane(h);
  if (s.ai) autoPick(h);
  return null;
}

function recalcHero(h, fresh){
  const cl = CLS[h.cls], L = h.lvl - 1;
  const hpFrac = fresh ? 1 : h.hp / h.mhp;
  const dm = heroMul(h.side);
  h.mhp = Math.round((cl.b.hp + cl.g.hp * L + passVal(h, 'hp')) * (1 + passVal(h, 'hpPct')) * dm);
  h.ad = (cl.b.ad + cl.g.ad * L + passVal(h, 'ad')) * dm;
  h.ap = (cl.b.ap + cl.g.ap * L + passVal(h, 'ap')) * (1 + passVal(h, 'apPct')) * dm;
  h.armor = cl.b.armor + cl.g.armor * L + passVal(h, 'armor') + bsum(h, 'barm')
    + (h.hp / h.mhp < .5 ? passVal(h, 'armorLow') : 0);
  h.mr = cl.b.mr + cl.g.mr * L + passVal(h, 'mr') + bsum(h, 'bmr');
  h.as = cl.b.as + cl.g.as * L;
  h.asMul = 1 + passVal(h, 'as');
  h.spd = cl.b.spd * (1 + passVal(h, 'ms'));
  h.rng = cl.b.rng + passVal(h, 'rng') + bsum(h, 'brng');
  h.mmana = Math.round(cl.b.mana + cl.g.mana * L + passVal(h, 'mana'));
  h.cdr = Math.min(.55, passVal(h, 'cdr'));
  h.hp = Math.min(h.mhp, h.mhp * hpFrac);
  h.mana = Math.min(h.mmana, h.mana);
}
// The one hook the sim uses for hero attack speed lives in attackSpeedOf; keep
// the passive multiplier folded in here so both agree.
const heroAs = (h) => h.as * h.asMul;

// Measured over 61 heroes in 12 full matches: the median hero finished at
// level 10, only a third ever reached their ultimate at 12, and one in nine
// ever bought a rank — so the 15/18/21/24 ladder the game is built around was
// content almost nobody saw. The curve is flatter now, and a hero behind the
// match earns faster, which lifts the ones forged late without raising the
// ceiling for the one that was there from the first minute.
const xpNeed = (lvl) => Math.round(100 + 50 * lvl + 2.0 * lvl * lvl);
// Measured against the hero setting the pace, not the average of everyone
// alive: an average moves when a hold forges a fourth hero, which quietly paid
// the side that spammed heroes and cost the side that did not.
const CATCHUP_PER_LVL = .10, CATCHUP_MAX = 2.0;
function xpCatchup(h){
  let best = 0;
  for (const s of G.sides) for (const o of s.heroes) if (o.lvl > best) best = o.lvl;
  return clamp(1 + CATCHUP_PER_LVL * (best - h.lvl), 1, CATCHUP_MAX);
}

function gainXp(h, amt){
  if (h.lvl >= C.MAX_LEVEL) return;
  h.xp += amt * (1 + passVal(h, 'xpM')) * xpCatchup(h);
  let guard = 0;
  while (h.lvl < C.MAX_LEVEL && h.xp >= xpNeed(h.lvl) && guard++ < 40){
    h.xp -= xpNeed(h.lvl);
    h.lvl++;
    recalcHero(h);
    h.hp = Math.min(h.mhp, h.hp + h.mhp * .18);
    if (C.SKILL_TIERS.includes(h.lvl)) offer(h, 'skill');
    else if (h.lvl === C.ULT_LEVEL) offer(h, 'ult');
    else if (C.RANK_LEVELS.includes(h.lvl)) offer(h, 'rank');
    if (h.side === 0 && !HEADLESS){ fxToast(h.name + ' reaches level ' + h.lvl + '.', 'good'); sfx('level'); }
    if (G.sides[h.side].ai) autoPick(h);
  }
  if (h.lvl >= C.MAX_LEVEL) h.xp = 0;
}

/* ------------------------------------------------------------------ choices */
function offer(h, kind){
  let opts = [];
  if (kind === 'passive'){
    const pool = PASSIVES.slice();
    for (let i = 0; i < 3; i++){ const p = pool.splice(Math.floor(rnd() * pool.length), 1)[0]; opts.push(p.id); }
  } else if (kind === 'skill'){
    const owned = new Set(h.skills.map(s => s.id));
    const pool = basicPool(h.cls).filter(s => !owned.has(s.id));
    for (let i = 0; i < 3 && pool.length; i++) opts.push(pool.splice(Math.floor(rnd() * pool.length), 1)[0].id);
  } else if (kind === 'ult'){
    const pool = ultPool(h.cls).slice();
    while (pool.length && opts.length < 3) opts.push(pool.splice(Math.floor(rnd() * pool.length), 1)[0].id);
  } else if (kind === 'rank'){
    const pool = [];
    if (h.passRank < C.MAX_HERO_RANK) pool.push('P:' + h.passive);
    for (const s of h.skills) if (s.rank < C.MAX_HERO_RANK) pool.push(s.id);
    while (pool.length && opts.length < 3) opts.push(pool.splice(Math.floor(rnd() * pool.length), 1)[0]);
  }
  if (!opts.length) return null;
  const p = { kind, opts, lvl:h.lvl };
  h.pend.push(p);
  return p;
}

function pickOption(h, idx){
  const p = h.pend[0];
  if (!p) return 'nothing to choose';
  const id = p.opts[idx];
  if (id === undefined) return 'no such option';
  if (p.kind === 'passive'){ h.passive = id; h.passRank = 1; }
  else if (p.kind === 'skill' || p.kind === 'ult'){
    h.skills.push({ id, rank:1, cdT:0, ult:p.kind === 'ult' });
  } else if (p.kind === 'rank'){
    if (id.startsWith('P:')) h.passRank = Math.min(C.MAX_HERO_RANK, h.passRank + 1);
    else { const s = h.skills.find(o => o.id === id); if (s) s.rank = Math.min(C.MAX_HERO_RANK, s.rank + 1); }
  }
  h.pend.shift();
  recalcHero(h);
  if (h.side === 0 && !HEADLESS) syncUI();
  return null;
}

// What one skill is worth to one hero, without the die. Pulled out of autoPick
// so a harness and the tests can read the real number instead of keeping a
// copy of it — a copy that was quietly two terms out of date the first time it
// was used, and produced a confident explanation of the wrong thing.
//
// autoPick adds a die roll in [0,1) to this, so an option more than 1.0 behind
// the best in its menu can NEVER be chosen, however often it is offered.
// Measured over 400 ultimate offers per class, five of the eighteen ultimates
// came up zero times and the Fighter and Marksman were locked to one apiece:
//
//   Fighter   Bladestorm 100%  Champion's Edge 0%  War Banner 0%
//   Marksman  Arrow Rain 100%  Headhunter 1%       Trueshot 0%
//   Mage      Cataclysm 67%    Arcane Torrent 34%  Frost Prison 0%
//   Support   Sanctuary 81%    Hymn of Valour 19%  Chain of Dawn 0%
//
// The cause is that skRate measures DAMAGE. A summon, a stun, a shield or a
// heal rates near zero, and the class bonuses below only rescued five
// hand-picked class/tag pairs — so every ultimate whose job fell outside them
// was being scored on damage it does not do. TAG_WORTH pays for the job
// itself, for any class; the class lines on top are still the class fantasy.
// 'move' was missing from this table, so a mobility skill scored the die and
// nothing else. Sprint is in all six class pools and rates 0.19 in every one
// of them — the floor of every pool, 1.4 to 2.6 behind its best. Measured
// three ways and they agree: 0 of 1200 AI heroes took it; 18,000 heroes over
// 54,000 offers took it 0-8 times per class (0 of 1762 for the Mage); and a
// Monte Carlo over real three-option menus puts it at 0.0-0.6% everywhere.
// Fighter's Dash Strike was the same story at 2%, because the dash bonus
// below was written for the Assassin only.
const TAG_WORTH = { dmg:0, cc:.5, buff:.45, heal:.5, summon:.55, move:.45 };
function skillWorth(h, d){
  let sc = skRate(d, 1, ad0(h), ap0(h)) / 30;
  sc += TAG_WORTH[d.tag] || 0;
  if (d.shield && d.tag !== 'buff') sc += .2;
  if (h.cls === 'tank' && (d.tag === 'cc' || d.shield)) sc += .7;
  // ...and a skill that heals is a support skill whatever its tag says: Chain
  // of Dawn is tagged 'cc' and heals an ally for 150, so the support bonus
  // stepped straight over it.
  if (h.cls === 'support' && (d.tag === 'heal' || d.tag === 'buff' || d.heal || d.healAlly)) sc += .9;
  if ((h.cls === 'mage' || h.cls === 'marksman') && d.tag === 'dmg') sc += .5;
  if (h.cls === 'assassin' && (d.k === 'dash' || d.exec)) sc += .6;
  if (h.cls === 'fighter' && (d.aoe || d.tag === 'buff' || d.k === 'dash')) sc += .4;
  // An execute is worth having and skRate cannot see it — it is the reason a
  // Champion's Edge beats a bigger sustained number in a real fight.
  if (d.exec) sc += .35;
  return sc;
}
// What one more rank of this option is actually worth to this hero: the step
// from its current rank to the next, not a flat number per kind.
function rankWorth(h, id){
  if (id.startsWith('P:')){
    // the passive's own scoring is still the nine-key sum autoPick has always
    // used, so a rank of it is valued at a share of that
    const m = (PASS[h.passive] || { m:{} }).m;
    const v = (m.ad || 0) * .04 + (m.ap || 0) * .03 + (m.hpPct || 0) * 8 + (m.armor || 0) * .04
      + (m.as || 0) * 4 + (m.ls || 0) * 5 + (m.hp || 0) * .004 + (m.mdmg || 0) * 2 + (m.tdmg || 0) * 2;
    return .3 + v * .35;
  }
  const s = h.skills.find(o => o.id === id), d = SKILL[id];
  if (!s || !d) return .4;
  const ad = ad0(h), ap = ap0(h);
  const step = skRate(d, s.rank + 1, ad, ap) - skRate(d, s.rank, ad, ap);
  // an ultimate carries the fight, so a rank of one is worth more than its
  // raw rate step suggests
  return .3 + step / 30 + (s.ult ? .25 : 0);
}

const ad0 = (h) => CLS[h.cls].b.ad + CLS[h.cls].g.ad * 8;
const ap0 = (h) => CLS[h.cls].b.ap + CLS[h.cls].g.ap * 8;

// The Host picks with a light preference for its class fantasy, then at random.
function autoPick(h){
  const side = G.sides[h.side];
  let guard = 0;
  while (h.pend.length && guard++ < 12){
    const p = h.pend[0];
    let best = 0, bs = -1e9;
    p.opts.forEach((id, i) => {
      // its own stream, so the two holds cannot draw off each other
      let sc = side ? arnd(side) : rnd();
      if (p.kind === 'passive'){
        const m = PASS[id].m;
        sc += (m.ad || 0) * .04 + (m.ap || 0) * .03 + (m.hpPct || 0) * 8 + (m.armor || 0) * .04
            + (m.as || 0) * 4 + (m.ls || 0) * 5 + (m.hp || 0) * .004 + (m.mdmg || 0) * 2 + (m.tdmg || 0) * 2;
      } else if (p.kind === 'rank'){
        // This was a flat constant that never looked at WHICH skill it was
        // ranking: 0.8 for any skill, 0.4 for the passive. Driving 216,000
        // rank offers, the option with the larger real gain was chosen 52% of
        // the time from a menu of two (chance is 50%) and 32% from a menu of
        // three (chance is 33%) — no correlation with value whatsoever, and
        // half of all heroes reach this choice. Score the actual step instead.
        sc += rankWorth(h, id);
      }
      else {
        // skills and ultimates were picked at pure random, so the Host built
        // incoherent heroes — a tank hoarding nukes, a support with none.
        const d = SKILL[id];
        if (d) sc += skillWorth(h, d);
      }
      if (sc > bs){ bs = sc; best = i; }
    });
    pickOption(h, best);
  }
}

/* ------------------------------------------------------------------ lane presence */
function enterLane(h){
  if (h.inLane) return;
  h.inLane = true; h.dead = false;
  h.x = gateX(h.side) + dirOf(h.side) * 2; h.y = rr(-1.2, 1.2);
  h.hp = h.mhp; h.mana = h.mmana; h.buffs.length = 0; h.rage = 0; h.retreat = false;
  const sh = passVal(h, 'spawnShield');
  if (sh){ h.shield = sh; h.shT = 20; }
  G.units.push(h);
}

function onHeroDeath(h, src){
  h.dead = true; h.inLane = false; h.deaths++;
  const i = G.units.indexOf(h); if (i >= 0) G.units.splice(i, 1);
  const tav = bList(G.sides[h.side], 'tavern').reduce((a, b) => Math.max(a, b.lvl), 1);
  h.respawnT = (C.RESPAWN_BASE + C.RESPAWN_PER_LVL * h.lvl) * (1 + passVal(h, 'respawn')) * (1 - .08 * (tav - 1));
  const dh = passVal(h, 'deathHeal');
  if (dh) nearby(h.x, 8, (u) => { if (!u.dead && u.side === h.side) healUnit(u, dh); });
  if (src && src.side !== undefined){
    const s = G.sides[src.side];
    s.res.gold += C.BOUNTY_HERO + h.lvl * 8; s.heroKills++;
    if (src.isHero){ src.kills++; h.lastKiller = src; }
    awardXp(src, 130 + h.lvl * 11, h.x);
  }
  fxToast(h.name + ' has fallen.', h.side === 0 ? 'bad' : 'good');
  sfx('heroDown', h.x);
  if (!HEADLESS){
    burstFx(h.x, h.y, SIDE_COL[h.side], 22);
    ringFx(h.x, h.y, 3.2, SIDE_COL[h.side]);
    shake(6, h.x);
    sfx('hero', h.x);
  }
}

/* ------------------------------------------------------------------ hero brain */
// Would chasing this target put us under an enemy turret with nobody to soak
// for us? Measured at the target, not at the hunter.
function towerCovered(h, tgt){
  for (const st of G.sides[enemyOf(h.side)].structs){
    if (st.dead || !st.ad) continue;
    if (Math.hypot(st.x - tgt.x, st.y - tgt.y) > st.rng + 1) continue;
    let cover = 0;
    nearby(st.x, 7, (u) => { if (!u.dead && u.side === h.side && !u.isHero) cover++; });
    if (cover < 2) return true;
  }
  return false;
}

function inTowerFire(h){
  for (const st of G.sides[enemyOf(h.side)].structs){
    if (st.dead || !st.ad) continue;
    if (Math.hypot(st.x - h.x, st.y - h.y) < st.rng + 1.5) return st;
  }
  return null;
}
function frontlineX(side){
  const dir = dirOf(side);
  let best = null;
  for (const u of G.units){
    if (u.dead || u.side !== side || u.isHero) continue;
    if (best === null || (u.x - best) * dir > 0) best = u.x;
  }
  if (best === null){
    const st = frontStruct(enemyOf(side));
    return st ? st.x - dir * 9 : C.LANE_LEN / 2;
  }
  return best;
}

// How far a hero will go out of its way for an enemy hero. An assassin whose
// whole point is killing heroes had the same nine as everyone else, and ended
// the match with the fewest hero kills of any class.
const HUNT = { assassin:15, marksman:10, mage:10, fighter:10, tank:9, support:8 };
const huntRange = (h) => HUNT[h.cls] || 9;

function heroTarget(h){
  const foe = enemyOf(h.side);
  const eh = nearestFoe(h, huntRange(h), true);
  // Hunt further, but not into a turret on your own. Giving the assassin a
  // long reach without this simply walked it under their guns.
  if (eh && !towerCovered(h, eh)) return eh;
  const em = nearestFoe(h, Math.max(7, h.rng + 2.5));
  if (em) return em;
  const st = frontStruct(foe);
  if (st && Math.abs(st.x - h.x) < h.rng + 3) return st;
  return null;
}

function heroStep(h, dt){
  if (h.dead){
    h.respawnT -= dt;
    if (h.respawnT <= 0) enterLane(h);
    return;
  }
  statusTick(h, dt);
  const homeX = gateX(h.side), dir = dirOf(h.side);
  const atHome = Math.abs(h.x - homeX) < 7;
  // Out of combat a hero mends where it stands. Without this they spend a
  // third of the match walking the length of the bridge to heal and back.
  const calm = G.t - h.dmgTaken > 6 ? 1 : 0;
