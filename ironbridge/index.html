/* ------------------------------------------------------------------ meta */
/* ------------------------------------------------------------------ resume
   A match runs ten to fifteen minutes. Losing one to a backgrounded tab is
   the worst thing this game could do to you, so the whole match — hold,
   heroes with their builds, structures and everyone standing on the bridge —
   is written to local storage and can be picked back up.                    */
const SAVE_KEY = 'ib_save', SAVE_VER = 1;

const packHero = (h) => ({
  cls:h.cls, name:h.name, lvl:h.lvl, xp:h.xp, kills:h.kills, deaths:h.deaths,
  passive:h.passive, passRank:h.passRank,
  skills:h.skills.map(s => ({ id:s.id, rank:s.rank, cdT:s.cdT, ult:!!s.ult })),
  pend:h.pend.map(p => ({ kind:p.kind, opts:p.opts.slice(), lvl:p.lvl })),
  x:h.x, y:h.y, hp:h.hp, mana:h.mana, dead:h.dead, inLane:h.inLane, respawnT:h.respawnT,
  // A hero that has decided to pull back stays pulled back until it is either
  // healthy again or has something worth finishing — the two thresholds are 66%
  // and 28%, and between them the flag is the only thing holding the decision.
  // Dropped from the save, a wounded hero mid-withdrawal turned round on resume
  // and walked back into whatever it was leaving. That was rare while the
  // uncovered-under-a-turret branch above could never fire; it is not rare now.
  retreat:!!h.retreat,
});
const packUnit = (u) => ({
  kind:u.kind, side:u.side, x:u.x, y:u.y, hp:u.hp, mhp:u.mhp, ad:u.ad, armor:u.armor, mr:u.mr,
  paid:!!u.paid, life:u.life, cd:u.cd,
});
const packSide = (s) => ({
  res:Object.assign({}, s.res), workers:Object.assign({}, s.workers),
  nodeLvl:Object.assign({}, s.nodeLvl), towerUp:Object.assign({}, s.towerUp),
  troopUp:Object.assign({}, s.troopUp), superT:s.superT, aiT:s.aiT, rs:s.rs, waveKind:s.waveKind,
  kills:s.kills, structsKilled:s.structsKilled, gathered:s.gathered, spent:s.spent, heroKills:s.heroKills,
  plot:s.plot.map(b => b ? { type:b.type, lvl:b.lvl, tile:b.tile } : null),
  trainQ:s.trainQ.map(q => ({ type:q.type, t:q.t, dur:q.dur })),
  muster:s.muster.map(m => ({ type:m.type })),
  structs:s.structs.map(st => ({ key:st.key, hp:st.hp, dead:st.dead, downT:st.downT })),
  heroes:s.heroes.map(packHero),
});

function saveMatch(){
  if (G.state !== 'play' || G.demo) return false;
  try {
    localStorage.setItem(SAVE_KEY, JSON.stringify({
      v:SAVE_VER, at:Date.now(), diff:G.diff.id, t:G.t, wave:G.wave, waveT:G.waveT,
      seed:_seed, sides:G.sides.map(packSide),
      units:G.units.filter(u => !u.isHero).map(packUnit),
    }));
    return true;
  } catch (e){ return false; }
}
function savedMatch(){
  try {
    const o = JSON.parse(localStorage.getItem(SAVE_KEY) || 'null');
    return (o && o.v === SAVE_VER && o.sides && o.sides.length === 2) ? o : null;
  } catch (e){ return null; }
}
function clearSave(){ try { localStorage.removeItem(SAVE_KEY); } catch (e){} }

function loadMatch(pack){
  pack = pack || savedMatch();
  if (!pack) return 'no saved match';
  newMatch({ diff:pack.diff, seed:pack.seed || 1 });
  reseed(pack.seed || 1);
  G.t = pack.t; G.wave = pack.wave; G.waveT = pack.waveT;
  pack.sides.forEach((ps, i) => {
    const s = G.sides[i];
    Object.assign(s.res, ps.res); Object.assign(s.workers, ps.workers);
    Object.assign(s.nodeLvl, ps.nodeLvl); Object.assign(s.towerUp, ps.towerUp);
    Object.assign(s.troopUp, ps.troopUp);
    s.superT = ps.superT; s.aiT = ps.aiT; s.rs = ps.rs;
    // Without this a resumed match reported the quiet wave for up to a full
    // 22-second period, however heavy the wave actually on the bridge was —
    // the briefing reads sides[1].waveKind and it was falling back to the
    // makeSide default of 'levy'.
    s.waveKind = ps.waveKind || 'levy';
    s.kills = ps.kills; s.structsKilled = ps.structsKilled;
    s.gathered = ps.gathered; s.spent = ps.spent; s.heroKills = ps.heroKills;
    s.plot = ps.plot.map(b => b ? { type:b.type, lvl:b.lvl, tile:b.tile, raise:0 } : null);
    s.trainQ = ps.trainQ.map(q => ({ type:q.type, t:q.t, dur:q.dur }));
    s.muster = ps.muster.map(m => ({ type:m.type }));
    for (const st of s.structs){
      const p = ps.structs.find(o => o.key === st.key);
      if (!p) continue;
      st.mhp = structMaxHp(s, st);
      st.hp = Math.min(p.hp, st.mhp); st.dead = p.dead; st.downT = p.downT;
    }
    s.heroes = ps.heroes.map(ph => {
      const h = makeHero(i, ph.cls, ph.name);
      h.pend.length = 0;
      h.lvl = ph.lvl; h.xp = ph.xp; h.kills = ph.kills; h.deaths = ph.deaths;
      h.passive = ph.passive; h.passRank = ph.passRank;
      h.skills = ph.skills.map(sk => ({ id:sk.id, rank:sk.rank, cdT:sk.cdT, ult:sk.ult }));
      h.pend = ph.pend.map(p => ({ kind:p.kind, opts:p.opts.slice(), lvl:p.lvl }));
      recalcHero(h, true);
      h.x = ph.x; h.y = ph.y; h.hp = Math.min(ph.hp, h.mhp); h.mana = Math.min(ph.mana, h.mmana);
      h.dead = ph.dead; h.respawnT = ph.respawnT; h.inLane = false; h.retreat = !!ph.retreat;
      if (!ph.dead){ h.inLane = true; G.units.push(h); }
      return h;
    });
  });
  for (const pu of pack.units || []){
    const u = spawnUnit(pu.side, pu.kind, { x:pu.x, y:pu.y, paid:pu.paid, life:pu.life });
    if (!u) continue;
    u.mhp = pu.mhp; u.hp = Math.min(pu.hp, u.mhp); u.ad = pu.ad;
    u.armor = pu.armor; u.mr = pu.mr; u.cd = pu.cd;
  }
  scatterCache[0] = scatterCache[1] = null;
  grassCache[0] = grassCache[1] = null;
  rebuildGrid();
  return null;
}

const META_KEY = 'ib_meta';
function loadMeta(){
  try { return Object.assign({ wins:0, losses:0, best:0 }, JSON.parse(localStorage.getItem(META_KEY) || '{}')); }
  catch (e){ return { wins:0, losses:0, best:0 }; }
}
function saveMeta(won){
  const m = loadMeta();
  if (won){ m.wins++; if (!m.best || G.t < m.best) m.best = G.t; } else m.losses++;
  try { localStorage.setItem(META_KEY, JSON.stringify(m)); } catch (e){}
}

/* =====================================================================
   INPUT + BOOT
   ===================================================================== */
let rsT = 0;
function resizeSoon(){ clearTimeout(rsT); rsT = setTimeout(resize, 30); }

function say(msg){ if (msg) fxToast(msg, 'bad'); }

// Screen point → world ground point (the inverse of lp with z = 0).
function unproject(sx, sy){
  const S = LS();
  const A = (sx - LW * .5) / S, B = (sy - LH * .60) / S;
  const det = .96 * .60 + .52 * .07;
  return [ (A * .60 + .52 * B) / det + cam.x, (.96 * B - .07 * A) / det ];
}

// What you click is what you see. A building is drawn standing UP from its
// ground cell, so testing the cell under the cursor misses the thing you
// actually aimed at — every clickable is tested against its drawn box first,
// nearest-to-camera first, and only then do we fall back to the bare ground.
function clickTargets(){
  const s = me(), out = [];
  // Every position below is computed through bp() -> holdWorld(), which reads
  // holdSide. This said 0, so for the player who joined the clickable regions
  // were laid out over the LEFT hold while their actual buildings stood on the
  // right — their own plot could not be clicked at all, because nothing was
  // where the game thought it was.
  holdSide = MY;
  // Each clickable is an ellipse around the middle of the shape you can SEE —
  // for a building that is up the screen from its ground cell, not on it.
  const at = (gx, gy, lift, rx, ry) => {
    const p = bp(gx, gy);
    return { cx:p[0], cy:p[1] - lift * BSC, rx:rx * BSC, ry:ry * BSC, sy:p[1] };
  };
  for (const h of me().heroes){
    if (h.dead) continue;
    const p = lp(h.x, h.y);
    out.push({ kind:'hero', hero:h, cx:p[0], cy:p[1] - 18 * cam.z, rx:16 * cam.z, ry:26 * cam.z, sy:p[1], pri:3 });
  }
  for (let t = 0; t < s.plot.length; t++){
    const b = s.plot[t];
    out.push(Object.assign(b ? at(tileGX(t), tileGY(t), .32, .52, .46) : at(tileGX(t), tileGY(t), 0, .5, .34),
      b ? { kind:'build', tile:t, pri:2 } : { kind:'plot', tile:t, pri:1 }));
  }
  for (const k in NODES)
    out.push(Object.assign(at(NODES[k].gx, NODES[k].gy, .26, .62, .44), { kind:'node', node:k, pri:2 }));
  // ...and everything standing on the bridge, so you can ask what it is
  for (const sd of G.sides) for (const st of sd.structs){
    if (st.dead && !st.downT) continue;
    const p = lp(st.x, st.y);
    const tall = st.key === 'gate' ? 60 : st.key === 'inhib' ? 34 : 44;
    out.push({ kind:'struct', struct:st, cx:p[0], cy:p[1] - tall * .5 * cam.z,
      rx:(st.key === 'gate' ? 56 : 20) * cam.z, ry:tall * .6 * cam.z, sy:p[1], pri:2 });
  }
  for (const u of G.units){
    if (u.dead || u.isHero) continue;
    const p = lp(u.x, u.y);
    out.push({ kind:'unit', unit:u, cx:p[0], cy:p[1] - 9 * cam.z, rx:9 * cam.z, ry:14 * cam.z, sy:p[1], pri:1 });
  }
  return out;
}

// Pure: given a point on the canvas, what did the player mean? Split out from
// the event handler so the tests can aim at things the way a thumb does.
function resolvePick(sx, sy){
  BSC = LS() * TILE;
  let best = null, bd = Infinity;
  for (const t of clickTargets()){
    const dx = (sx - t.cx) / t.rx, dy = (sy - t.cy) / t.ry;
    const d = dx * dx + dy * dy;
    if (d > 1) continue;                       // outside its own footprint
    const score = d - t.pri * .02;             // heroes and buildings edge out bare ground
    if (score < bd){ bd = score; best = t; }
  }
  if (best) return best;
  // nothing under the finger — fall back to the plot cell on the ground
  const w = unproject(sx, sy);
  // The inverse of holdWorld(), which places the grid at myHoldX() and runs it
  // in -x for the right-hand hold. Hardcoding HOLD_X here meant the fallback
  // landed on the wrong end of the map for the joiner.
  const dir = MY === 0 ? 1 : -1;
  const gx = (w[0] - myHoldX()) / (TILE * dir), gy = w[1] / TILE;
  const col = Math.round(gx + (PLOT_W - 1) / 2), row = Math.round(gy + (PLOT_H - 1) / 2);
  const near = Math.abs(gx - (col - (PLOT_W - 1) / 2)) < .8 && Math.abs(gy - (row - (PLOT_H - 1) / 2)) < .8;
  if (near && col >= 0 && col < PLOT_W && row >= 0 && row < PLOT_H)
    return { kind:s0Plot(row * PLOT_W + col) ? 'build' : 'plot', tile:row * PLOT_W + col };
  return { kind:'none' };
}
const s0Plot = (t) => me().plot[t];

function pickAt(clientX, clientY){
  const r = lcv.getBoundingClientRect();
  const sx = clientX - r.left, sy = clientY - r.top;
  const m = minimapRect();
  if (sx >= m.x0 && sx <= m.x0 + m.w && sy >= m.y0 && sy <= m.y0 + m.h){
    cam.follow = false;
    const fb = $('camFollow'); if (fb) fb.classList.remove('on');
    cam.x = clamp(minimapWorldX(sx), CAM_MIN, CAM_MAX);
    sfx('click');
    return;
  }
  const t = resolvePick(sx, sy);
  if (t.kind !== 'none') sfx('click');
  if (t.kind === 'hero'){ sel.hero = t.hero; showHeroSheet(t.hero); return; }
  sel.node = t.kind === 'node' ? t.node : null;
  sel.tile = (t.kind === 'build' || t.kind === 'plot') ? t.tile : -1;
  sel.struct = t.kind === 'struct' ? t.struct : null;
  sel.unit = t.kind === 'unit' ? t.unit : null;
  if (NARROW() && (sel.node || sel.struct || sel.unit || sel.tile >= 0)) dockTab = 'sel';
  syncUI();
}

/* ------------------------------------------------------------------ controls
   Every view control is one named action, so the buttons and the keyboard
   drive exactly the same code and cannot fall out of step. KEYS is also what
   the help sheet prints, so the printed shortcut is always the real one.    */
const KEYS = [
  { k:'Space', a:'pause',   d:'pause and read the war report' },
  { k:'1 2 3', a:'speed',   d:'run at 1×, 2× or 3× speed' },
  { k:'H',     a:'camHold', d:'look at your hold' },
  { k:'G',     a:'camGate', d:'look at your gates' },
  { k:'M',     a:'camMid',  d:'look at the middle of the bridge' },
  { k:'B',     a:'camFoe',  d:'look at their base' },
  { k:'F',     a:'follow',  d:'follow the fighting' },
  { k:'+ −',   a:'zoom',    d:'zoom in and out' },
  { k:'?',     a:'help',    d:'this sheet' },
  { k:'Esc',   a:'close',   d:'close whatever is open' },
];
// Is this event coming out of somewhere the player is entering text? Checked
// against the element rather than a flag, so it keeps working for any field
// added later without anyone having to remember this exists.
function typingInto(el){
  if (!el || !el.tagName) return false;
  const t = ('' + el.tagName).toUpperCase();
  return t === 'INPUT' || t === 'TEXTAREA' || t === 'SELECT' || el.isContentEditable === true;
}

function keyAction(key){
  const k = (key || '').toLowerCase();
  if (key === ' ' || k === 'p') return 'pause';
  if (k === '1' || k === '2' || k === '3') return 'speed' + k;
  if (k === 'h') return 'camHold';
  if (k === 'g') return 'camGate';
  if (k === 'm') return 'camMid';
  if (k === 'b') return 'camFoe';
  if (k === 'f') return 'follow';
  if (k === '+' || k === '=') return 'zoomIn';
  if (k === '-' || k === '_') return 'zoomOut';
  if (k === '?' || k === '/') return 'help';
  if (key === 'Escape') return 'close';
  return null;
}
function doAction(a){
  const paint = (id, on) => { if (!HEADLESS) $(id).classList.toggle('on', on); };
  const camTo = (x) => { cam.follow = false; cam.x = clamp(x, CAM_MIN, CAM_MAX); paint('camFollow', false); };
  if (a === 'pause'){ if (G.state === 'play') setPaused(!G.paused); return; }
  if (a === 'speedUp' || /^speed[123]$/.test(a)){
    G.speed = a === 'speedUp' ? (G.speed === 1 ? 2 : G.speed === 2 ? 3 : 1) : +a.slice(5);
    if (!HEADLESS) $('btnSpeed').textContent = G.speed + '×';
    paint('btnSpeed', G.speed > 1);
    return;
  }
  if (a === 'camHold') return camTo(myHoldX());
  if (a === 'camGate') return camTo(MY === 0 ? 12 : C.LANE_LEN - 12);
  if (a === 'camMid') return camTo(C.LANE_LEN / 2);
  if (a === 'camFoe') return camTo(MY === 0 ? C.LANE_LEN - 12 : 12);
  if (a === 'follow'){ cam.follow = !cam.follow; paint('camFollow', cam.follow); return; }
  if (a === 'zoomIn') { cam.tz = clamp(cam.tz * 1.25, ZOOM_MIN, ZOOM_MAX); return; }
  if (a === 'zoomOut'){ cam.tz = clamp(cam.tz * .8, ZOOM_MIN, ZOOM_MAX); return; }
  if (a === 'help'){ if (G.state === 'play' && !HEADLESS) showHelp(); return; }
  if (a === 'close'){ if (G.paused) setPaused(false); else if (G.state === 'play' && !HEADLESS) closeModal(); return; }
}

function wire(){
  const s0 = () => me();
  // Held while a press is in flight anywhere in the dock, so the refresh above
  // does not delete the button between press and release. Release and cancel
  // are listened for on the window, not the button: a press that drifts a few
  // pixels off the control still has to clear the flag.
  $('dock').addEventListener('pointerdown', () => { uiDown = true; });
  window.addEventListener('pointerup', () => { uiDown = false; });
  window.addEventListener('pointercancel', () => { uiDown = false; });
  window.addEventListener('blur', () => { uiDown = false; });

  $('dock').addEventListener('click', (e) => {
    const tab = e.target.closest('[data-tab]');
    if (tab){ dockTab = tab.dataset.tab; syncUI(); return; }
    const b = e.target.closest('[data-hero],[data-act]');
    if (!b || b.disabled) return;
    if (b.dataset.hero){
      const h = s0().heroes.find(x => x.id === +b.dataset.hero);
      if (h){ sel.hero = h; showHeroSheet(h); }
      return;
    }
    const s = s0(), a = b.dataset.act;
    // Every one of these goes through sendCmd, which runs it immediately in
    // one-player and schedules it for an agreed tick in multiplayer.
    if (a === 'job') say(sendCmd('job', { node:b.dataset.node, d:+b.dataset.d }));
    else if (a === 'worker') say(sendCmd('worker', {}));
    else if (a === 'unit') say(sendCmd('unit', { unit:b.dataset.unit }));
    else if (a === 'build') say(sendCmd('build', { tile:sel.tile, type:b.dataset.type }));
    else if (a === 'upgrade') say(sendCmd('upgrade', { tile:sel.tile }));
    else if (a === 'up') say(sendCmd('up', { up:b.dataset.up }));
    else if (a === 'nodeup') say(sendCmd('nodeup', { node:b.dataset.node }));
    else if (a === 'newhero'){ showHeroCreate(); return; }
    syncUI();
  });
  $('modal').addEventListener('click', (e) => {
    if (e.target === $('modal')){ if (G.state === 'play') doAction('close'); return; }
    const b = e.target.closest('[data-act]');
    if (!b) return;
    const a = b.dataset.act;
    if (a === 'start'){
      audioStart(); clearSave(); netEnd();
      if (!seenIntro()){ showIntro(b.dataset.diff); return; }   // first time: explain it once
      newMatch({ diff:b.dataset.diff }); closeModal(); syncUI();
    }
    else if (a === 'introgo'){
      markSeen(); netEnd();
      newMatch({ diff:b.dataset.diff }); closeModal(); syncUI();
    }
    else if (a === 'resume'){
      audioStart(); netEnd();
      const err = loadMatch();
      if (err){ say(err); return; }
      closeModal(); syncUI();
    }
    else if (a === 'close') doAction('close');
    else if (a === 'unpause') setPaused(false);
    else if (a === 'replay') showIntro(G.diff.id);
    else if (a === 'menu'){ setPaused(false); netEnd(); startDemo(); showMenu(); }
    else if (a === 'mp'){ netEnd(); showLobby(); }
    else if (a === 'mpback'){ netEnd(); showMenu(); }
    else if (a === 'netlog'){ showNetReport(); }
    else if (a === 'netcopy'){
      const txt = G.netReportText || netReport();
      try { navigator.clipboard.writeText(txt); fxToast('Report copied.', 'good'); }
      catch (e){ fxToast('Could not copy — select the text instead.', 'bad'); }
    }
    else if (a === 'mphost'){ lobbyHost(); }
    else if (a === 'mpjoin'){ lobbySet('joining'); }
    else if (a === 'mpgo'){ lobbyJoin(HEADLESS ? '' : ($('mpCode') || {}).value); }
    else if (a === 'again'){ clearSave(); netEnd(); newMatch({ diff:G.diff.id }); closeModal(); syncUI(); }
    else if (a === 'mkhero'){
      // In multiplayer the hero does not exist yet — it is forged on an agreed
      // tick a fraction of a second from now — so there is nothing to select
      // and nothing to open. The hero card appears on its own when it lands.
      if (NET.on){ sendCmd('hero', { cls:b.dataset.cls }); closeModal(); syncUI(); return; }
      const err = sendCmd('hero', { cls:b.dataset.cls });
      if (err){ say(err); return; }
      const h = s0().heroes[s0().heroes.length - 1];
      sel.hero = h; showHeroSheet(h); syncUI();
    } else if (a === 'pick'){
      const h = sel.hero;
      if (!h) return;
      // Keyed by hero id, not by the selection, because the two machines do not
      // share a selection — and by the time this runs on the other one, `sel`
      // there is pointing at whatever that player was looking at.
      say(sendCmd('pick', { hero:h.id, opt:+b.dataset.i }));
      showHeroSheet(h); syncUI();
    }
  });
  $('advice').addEventListener('click', () => {
    if ($('advice').dataset.net === '1'){ showNetReport(); return; }
    const t = $('advice').dataset.tab;
    if (t){ dockTab = t; syncUI(); }
  });
  const paintSound = () => { $('btnSound').textContent = AU.muted ? '🔇' : '🔊'; $('btnSound').classList.toggle('on', !AU.muted); };
  $('btnSound').addEventListener('click', () => { audioStart(); setMuted(!AU.muted); paintSound(); sfx('click'); });
  paintSound();
  // browsers will not make a sound until the player has touched the page
  const kick = () => { audioStart(); window.removeEventListener('pointerdown', kick); };
  window.addEventListener('pointerdown', kick);
  $('btnMenu').addEventListener('click', () => { showMenu(); });
  $('btnHelpBase').addEventListener('click', showHelp);
  $('btnPause').addEventListener('click', () => doAction('pause'));
  $('btnSpeed').addEventListener('click', () => doAction('speedUp'));
  $('camHold').addEventListener('click', () => doAction('camHold'));
  $('camGate').addEventListener('click', () => doAction('camGate'));
  $('camMid').addEventListener('click', () => doAction('camMid'));
  $('camFoe').addEventListener('click', () => doAction('camFoe'));
  $('camFollow').addEventListener('click', () => doAction('follow'));
  $('camOut').addEventListener('click', () => doAction('zoomOut'));
  $('camIn').addEventListener('click', () => doAction('zoomIn'));

  // one canvas: drag to pan, wheel to zoom, click to select a plot or a hero
  let drag = null;
  lcv.addEventListener('pointerdown', (e) => {
    drag = { x:e.clientX, y:e.clientY, cx:cam.x, moved:false };
    lcv.setPointerCapture(e.pointerId);
  });
  lcv.addEventListener('pointermove', (e) => {
    if (!drag) return;
    const dx = (e.clientX - drag.x) / (LS() * .96);
    if (Math.abs(e.clientX - drag.x) + Math.abs(e.clientY - drag.y) > 5){
      drag.moved = true; cam.follow = false; $('camFollow').classList.remove('on');
    }
    if (drag.moved) cam.x = clamp(drag.cx - dx, CAM_MIN, CAM_MAX);
  });
  lcv.addEventListener('pointerup', (e) => {
    if (drag && !drag.moved) pickAt(e.clientX, e.clientY);
    drag = null;
  });
  lcv.addEventListener('pointercancel', () => { drag = null; });
  // two-finger pinch, for the screens with no wheel
  const touches = new Map();
  let pinch = 0;
  lcv.addEventListener('pointerdown', (e) => { touches.set(e.pointerId, e); });
  lcv.addEventListener('pointermove', (e) => {
    if (!touches.has(e.pointerId)) return;
    touches.set(e.pointerId, e);
    if (touches.size !== 2) return;
    drag = null;
    const [a, b2] = [...touches.values()];
    const d = hyp(a.clientX - b2.clientX, a.clientY - b2.clientY);
    if (pinch) cam.tz = cam.z = clamp(cam.z * (d / pinch), ZOOM_MIN, ZOOM_MAX);
    pinch = d;
  });
  const drop = (e) => { touches.delete(e.pointerId); if (touches.size < 2) pinch = 0; };
  lcv.addEventListener('pointerup', drop);
  lcv.addEventListener('pointercancel', drop);
  lcv.addEventListener('dblclick', () => { cam.follow = true; $('camFollow').classList.add('on'); });
  lcv.addEventListener('wheel', (e) => {
    e.preventDefault();
    cam.tz = clamp(cam.tz * (e.deltaY > 0 ? .88 : 1.14), ZOOM_MIN, ZOOM_MAX);
  }, { passive:false });

  const stash = () => { if (G.state === 'play' && !G.demo) saveMatch(); };
  window.addEventListener('pagehide', stash);
  window.addEventListener('blur', stash);
  document.addEventListener('visibilitychange', () => { if (document.hidden) stash(); });
  window.addEventListener('resize', resizeSoon);
  window.addEventListener('orientationchange', resizeSoon);
  window.addEventListener('keydown', (e) => {
    // Not while somebody is typing. The join box asks for four letters and the
    // shortcut list owns B, F, G, H, M and P — all of which are in the room-code
    // alphabet — so typing a code like MVPR used to swing the camera twice and
    // then open the pause sheet over the box you were typing in. Every shortcut
    // in this game is a single character, which is exactly what makes a text
    // field and a keymap unable to share a window.
    if (typingInto(e.target)) return;
    const a = keyAction(e.key);
    if (!a) return;
    if (e.key === ' ' || e.key === '/') e.preventDefault();
    doAction(a);
  });
}

let last = 0, lastDraw = 0;
/* =====================================================================
   LOCKSTEP
   =====================================================================
   Two machines run the same match from the same seed and trade only inputs.
   Nothing about the world is ever sent — no positions, no health — so the
   traffic is a few dozen bytes a second and the relay never has to understand
   the game.

   That only works if the simulation is a pure function of (seed, inputs), so
   three rules hold this together and each one is a test:

     1. ONE STEP SIZE. update() is called with exactly 1/30, never a partial
        remainder. The old loop ran `Math.min(1/30, left)` and fed the leftover
        through as a short tick, so the step size depended on the frame rate.
        Time left over is banked in `acc` and spent on the next whole tick.
     2. INPUTS ARE SCHEDULED, NOT APPLIED. Pressing a button does not change
        the world. It appends a command to the batch for tick + NET.delay,
        which is far enough ahead that the other machine has it before that
        tick comes up. Both machines then apply the same commands on the same
        tick.
     3. ORDER IS FIXED. Commands are applied sorted by (side, seq), never in
        arrival order, because arrival order is a property of the network.

   A tick is simulated only when BOTH sides' batches for it have arrived —
   including the empty ones, which is why a batch is published every tick even
   when the player did nothing. That is what makes the stall visible rather
   than silent: if the peer's batch is late, the game holds still instead of
   running ahead into a state the peer will never reach.
   ===================================================================== */
const NET = {
  on:false,           // multiplayer running
  peerLost:false,     // the socket went away mid-match
  me:0,               // the side this machine controls
  delay:6,            // ticks of input delay — 200ms at 30Hz
  tick:0,             // next tick to simulate
  seq:0,              // per-command counter, for a total order within a side
  box:new Map(),      // tick -> { 0:[cmds] | undefined, 1:[cmds] | undefined }
  peerHashes:new Map(),// tick -> the other machine's hash, kept until ours exists
  resyncs:0,          // how many times this match has been put back together
  syncId:0, rx:null,  // a snapshot in flight, reassembled from its pieces
  awaitSync:false,    // rejoined, holding until the other machine says where we are
  linkLost:false,     // OUR socket died, as opposed to theirs
  retry:0,            // reconnection attempts since the link dropped
  diary:[],           // what happened, in order, for when it goes wrong
  pending:[],         // commands issued since the last publish
  send:null,          // transport, injected by the lobby
  stallT:0,           // seconds spent waiting on the peer
  hashes:new Map(),   // tick -> my own state hash, for desync detection
  desyncAt:-1,
};

// Every player action that can change the world, and nothing that cannot.
// Camera, zoom, speed and pause are deliberately absent: they are per-machine
// view state, and routing them through here would let one player's zoom desync
// the other's match.
const CMD = {
  job:     (s, c) => assign(s, c.node, c.d),
  worker:  (s)    => trainWorker(s),
  unit:    (s, c) => trainUnit(s, c.unit),
  build:   (s, c) => build(s, c.tile, c.type),
  upgrade: (s, c) => upgradeBuilding(s, c.tile),
  up:      (s, c) => buyUp(s, c.up),
  nodeup:  (s, c) => upgradeNode(s, c.node),
  hero:    (s, c) => createHero(s, c.cls, c.name),
  pick:    (s, c) => { const h = s.heroes.find(x => x.id === c.hero); return h ? pickOption(h, c.opt) : ''; },
};

// The single door every player action goes through. In one-player it runs the
// action immediately, exactly as before — so single-player behaviour, and every
// existing test, is untouched. In multiplayer it schedules instead.
// The command's own kind lives under `k`, not `type`.
//
// It used to be `Object.assign({ type }, args)` — and exactly one command
// carries an argument of its own called `type`: build, whose `type` is the
// BUILDING. So `sendCmd('build', { tile:3, type:'pit' })` produced a command
// whose kind was "pit". CMD has no "pit", so netStep looked it up, found
// nothing, and dropped the order without a word. Nobody could build anything
// in a two-player match, in either seat, and it failed silently — the button
// worked, the resources were never spent, and no message was ever printed.
//
// `k` cannot collide with a game noun, which is the point of choosing it.
function sendCmd(kind, args){
  const c = Object.assign({}, args, { k:kind });
  if (!NET.on) return CMD[kind](me(), c) || '';
  c.side = NET.me; c.seq = NET.seq++;
  NET.pending.push(c);
  return '';                      // no feedback yet: it has not happened yet
}

// Publish this machine's batch for a tick NET.delay ahead, every tick, empty or
// not. The empty ones are not waste — they are how the other machine learns it
// is safe to proceed.
function netPublish(){
  const at = NET.tick + NET.delay;
  const batch = NET.pending; NET.pending = [];
  netDeliver(at, NET.me, batch);
  if (NET.send) NET.send({ k:'cmd', tick:at, side:NET.me, cmds:batch });
}

function netDeliver(tick, side, cmds){
  let slot = NET.box.get(tick);
  if (!slot){ slot = {}; NET.box.set(tick, slot); }
  if (slot[side]) return;                       // a duplicate delivery is not a second batch
  slot[side] = cmds;
}

const netReady = (tick) => { const s = NET.box.get(tick); return !!(s && s[0] && s[1]); };

// A cheap fingerprint of simulation state. Exchanged every second or so; if the
// two disagree the match has already diverged and saying so beats letting the
// two players watch different games and argue about who won.
// What the two machines compare every second to know they are still playing the
// same match.
//
// This used to hash the wave, the clock, every unit's position and health, the
// four resources and the structures — and nothing else. That is a thin net over
// a wide floor. It contained none of the RANDOM CURSORS, so two streams that
// had parted were invisible until the difference worked its way out into a
// position, which is a symptom appearing seconds to minutes after its cause. It
// contained no economy at all — a hold could have a different number of
// workers, a different building, a different training queue — and no hero
// progression, so two machines could disagree about a hero's level, its
// passive, or which three cards it was offered, and say nothing.
//
// Everything a tick can change is in here now. The cursors go first, because
// every other number below is downstream of them: when they disagree, that is
// the cause and the rest is consequence.
//
// Floats stay quantised (1/4096 on positions, 1/64 on health and money). The
// determinism work means there should be no float noise to absorb, but a hash
// that halts a match is not the place to discover otherwise, and drift in a
// simulation like this one grows quickly enough that the resolution costs
// nothing in practice.
function netHash(){
  let a = 2166136261 >>> 0;
  const mix = (n) => { a ^= n | 0; a = Math.imul(a, 16777619) >>> 0; };
  const mixs = (v) => { const t = '' + (v == null ? '' : v); for (let i = 0; i < t.length; i++) mix(t.charCodeAt(i)); mix(0); };
  mix(seedNow());
  mix(G.wave); mix(Math.round(G.t * 30)); mix(Math.round(G.waveT * 30));
  for (const u of G.units){ mix(u.side); mix(Math.round(u.x * 4096)); mix(Math.round(u.y * 4096)); mix(Math.round(u.hp * 64)); }
  for (const s of G.sides){
    mix(s.rs);                                   // this hold's own decision stream
    mix(Math.round(s.res.gold * 64)); mix(Math.round(s.res.iron * 64));
    mix(Math.round(s.res.wood * 64)); mix(Math.round(s.res.food * 64));
    for (const k of ['idle', 'gold', 'iron', 'wood', 'food']) mix(s.workers[k]);
    for (const k of ['gold', 'iron', 'wood']) mix(s.nodeLvl[k]);
    for (const k of ['hp', 'armor', 'atk', 'as', 'regen']) mix(s.towerUp[k]);
    for (const k of ['tad', 'tarm', 'thp']) mix(s.troopUp[k]);
    for (const b of s.plot){ if (!b){ mix(0); continue; } mixs(b.type); mix(b.lvl); }
    mix(s.trainQ.length);
    for (const q of s.trainQ){ mixs(q.type); mix(Math.round(q.t * 30)); }
    mix(s.muster.length);
    for (const st of s.structs) mix(Math.round(st.hp * 64));
    mix(s.heroes.length);
    for (const h of s.heroes){
      mixs(h.cls); mixs(h.passive); mix(h.lvl); mix(Math.round(h.xp)); mix(h.passRank);
      mix(Math.round(h.hp * 64)); mix(Math.round(h.mana * 64));
      mix(h.dead ? 1 : 0); mix(Math.round(h.respawnT * 30));
      mix(h.skills.length);
      for (const sk of h.skills){ mixs(sk.id); mix(sk.rank); }
      mix(h.pend.length);
      for (const p of h.pend) for (const o of p.opts) mixs(o);
    }
  }
  return a >>> 0;
}

// One simulated tick, or nothing at all. Returns false when the peer's batch
// has not arrived, which the caller shows as a stall.
// Compare the two machines' hashes for one tick, from whichever side arrives
// second. This used to live inline in netRecv and was guarded on
// `NET.hashes.has(m.tick)` — so a hash that arrived BEFORE this machine had
// computed its own was dropped and never looked at again. That is not a rare
// case: lockstep keeps the two within a few ticks of each other, so whichever
// machine is trailing receives the other's hash early almost every time, and
// silently skipped half the comparisons in the pair. Both hashes are now kept
// until both exist.
function netCheckHash(tick){
  if (NET.desyncAt >= 0) return;
  const mine = NET.hashes.get(tick), theirs = NET.peerHashes.get(tick);
  if (mine === undefined || theirs === undefined) return;
  if (mine !== theirs){
    NET.desyncAt = tick;
    netDiary('DESYNC', 'tick ' + tick + '  mine ' + mine + '  theirs ' + theirs +
      '  wave ' + G.wave + '  units ' + G.units.length + '  seed ' + seedNow());
    // Recoverable. The host packs its board and the joiner adopts it; the board
    // stops for as long as that takes and then carries on. Only after this has
    // happened SYNC_MAX times does the match really end — a drift that keeps
    // coming back is a bug, and papering over it forever would hide it.
    if (NET.me === 0) netSendSnap();
  }
}

/* ---------------------------------------------------------------- resync
   A desync used to end the match: the board stopped, the bar said the two games
   had drifted apart, and that was that. It is recoverable — one machine can
   simply tell the other what the board looks like.

   The host is the authority, chosen by seat rather than by argument so both
   machines reach the same answer without exchanging a word about it. It packs
   its whole simulation, ships it, and the joiner adopts it wholesale.

   The pack is built by walking the objects rather than by listing their fields,
   because a hand-written list is a list that goes stale the first time somebody
   adds a field — and a field missing from a resync is a resync that desyncs
   again immediately. Everything primitive is copied; the handful of values that
   are references to other bodies are stored as indices into one table and
   re-linked on the way back in. */
const NET_REFS = { target:1, markBy:1, lastKiller:1, pullBy:1 };

// One table of every body on the board. Heroes live in BOTH sides[].heroes and
// G.units while they are in the lane, and they are the same object — so the
// table is built from the heroes first and G.units second, and identity does
// the de-duplicating.
function netBodies(){
  const list = [], seen = new Set();
  const add = (o) => { if (o && !seen.has(o)){ seen.add(o); list.push(o); } };
  for (const s of G.sides) for (const h of s.heroes) add(h);
  for (const u of G.units) add(u);
  return list;
}

function netSnap(){
  const bodies = netBodies();
  const at = new Map();
  bodies.forEach((o, i) => at.set(o, i + 1));      // 1-based; 0 means nothing
  const ref = (o) => !o ? 0 : (o.struct ? ['s', o.side, o.ord] : (at.get(o) || 0));

  const packBody = (o) => {
    const out = {};
    for (const k in o){
      const v = o[k];
      if (NET_REFS[k]){ out[k] = ref(v); continue; }
      if (k === 'burn'){ out[k] = v ? { dps:v.dps, t:v.t, src:ref(v.src) } : 0; continue; }
      if (k === 'hitOnce'){ out[k] = v ? [...v] : 0; continue; }
      if (k === 'buffs'){ out[k] = (v || []).map(b => { const c = {}; for (const j in b) if (typeof b[j] !== 'object') c[j] = b[j]; return c; }); continue; }
      if (k === 'skills'){ out[k] = (v || []).map(s => ({ id:s.id, rank:s.rank, cdT:s.cdT, ult:!!s.ult })); continue; }
      if (k === 'pend'){ out[k] = (v || []).map(p => ({ kind:p.kind, opts:p.opts.slice(), lvl:p.lvl })); continue; }
      const t = typeof v;
      if (t === 'number' || t === 'string' || t === 'boolean') out[k] = v;
    }
    return out;
  };

  return {
    seed: seedNow(), t:G.t, wave:G.wave, waveT:G.waveT, frame:G.frame || 0, uid:G.uid,
    state:G.state, winner:G.winner,
    // In-flight arrows carry a callback and ground zones carry live references;
    // both last under a second and neither is worth re-linking. They are
    // dropped on BOTH machines so the two still match exactly.
    bodies: bodies.map(packBody),
    heroesOf: G.sides.map(s => s.heroes.map(h => at.get(h) || 0)),
    unitsOf: G.units.map(u => at.get(u) || 0),
    sides: G.sides.map(s => ({
      res:Object.assign({}, s.res), workers:Object.assign({}, s.workers),
      nodeLvl:Object.assign({}, s.nodeLvl), towerUp:Object.assign({}, s.towerUp),
      troopUp:Object.assign({}, s.troopUp),
      rs:s.rs, superT:s.superT, aiT:s.aiT, aiBuild:s.aiBuild, waveKind:s.waveKind,
      kills:s.kills, structsKilled:s.structsKilled, gathered:s.gathered, spent:s.spent, heroKills:s.heroKills,
      plot:s.plot.map(b => b ? { type:b.type, lvl:b.lvl, tile:b.tile } : 0),
      trainQ:s.trainQ.map(q => ({ type:q.type, t:q.t, dur:q.dur })),
      muster:s.muster.map(m => ({ type:m.type })),
      structs:s.structs.map(st => ({ key:st.key, hp:st.hp, mhp:st.mhp, dead:st.dead, downT:st.downT, cd:st.cd })),
    })),
    timeline: G.timeline.map(e => ({ t:e.t, side:e.side, key:e.key, n:e.n })),
  };
}

function netLoad(p){
  if (!p || !p.bodies || !p.sides) return false;
  const bodies = p.bodies.map(b => {
    const o = {};
    for (const k in b) o[k] = b[k];
    o.hitOnce = Array.isArray(b.hitOnce) ? new Set(b.hitOnce) : null;
    o.buffs = (b.buffs || []).map(x => Object.assign({}, x));
    return o;
  });
  const struct = (side, ord) => (G.sides[side].structs.find(x => x.ord === ord) || null);
  const deref = (v) => {
    if (!v) return null;
    if (Array.isArray(v)) return struct(v[1], v[2]);
    return bodies[v - 1] || null;
  };

  p.sides.forEach((ps, i) => {
    const s = G.sides[i];
    Object.assign(s.res, ps.res); Object.assign(s.workers, ps.workers);
    Object.assign(s.nodeLvl, ps.nodeLvl); Object.assign(s.towerUp, ps.towerUp);
    Object.assign(s.troopUp, ps.troopUp);
    s.rs = ps.rs; s.superT = ps.superT; s.aiT = ps.aiT; s.aiBuild = ps.aiBuild;
    s.waveKind = ps.waveKind; s.kills = ps.kills; s.structsKilled = ps.structsKilled;
    s.gathered = ps.gathered; s.spent = ps.spent; s.heroKills = ps.heroKills;
    s.plot = ps.plot.map(b => b ? { type:b.type, lvl:b.lvl, tile:b.tile, raise:0 } : null);
    s.trainQ = ps.trainQ.map(q => ({ type:q.type, t:q.t, dur:q.dur }));
    s.muster = ps.muster.map(m => ({ type:m.type }));
    ps.structs.forEach((st, k) => {
      const live = s.structs[k];
      if (!live) return;
      live.hp = st.hp; live.mhp = st.mhp; live.dead = st.dead; live.downT = st.downT; live.cd = st.cd;
    });
  });
  // Re-link after every body exists, or a target could point at nothing.
  bodies.forEach((o, i) => {
    const b = p.bodies[i];
    for (const k in NET_REFS) if (k in b) o[k] = deref(b[k]);
    o.burn = b.burn ? { dps:b.burn.dps, t:b.burn.t, src:deref(b.burn.src) } : null;
  });
  G.sides.forEach((s, i) => { s.heroes = (p.heroesOf[i] || []).map(n => bodies[n - 1]).filter(Boolean); });
  G.units.length = 0;
  for (const n of p.unitsOf || []){ const o = bodies[n - 1]; if (o) G.units.push(o); }
  G.projs.length = 0; G.zones.length = 0;
  G.timeline.length = 0;
  for (const e of p.timeline || []) G.timeline.push({ t:e.t, side:e.side, key:e.key, n:e.n });
  G.t = p.t; G.wave = p.wave; G.waveT = p.waveT; G.frame = p.frame; G.uid = p.uid;
  G.state = p.state; G.winner = p.winner;
  scatterCache[0] = scatterCache[1] = null;
  grassCache[0] = grassCache[1] = null;
  rebuildGrid();
  reseed(p.seed);                       // last, so nothing above can disturb it
  return true;
}

/* ------------------------------------------------------------ the diary
   When a match drifts apart or a socket dies, the only thing anybody had to go
   on was one sentence in the advice bar. That is enough to know something went
   wrong and nothing at all to work out what.

   Every network event is written down here as it happens — seats, ticks, hash
   mismatches with BOTH numbers, snapshots in and out, stalls, the socket's own
   close code. It is capped and it is plain text, so it costs nothing to leave
   on and it can be pasted straight into a bug report. `IB.netReport()` in the
   console prints it; the match-stopped sheet has a button. */
const DIARY_MAX = 240;

// Every sheet in this game is a string handed to innerHTML. The report is the
// first one built out of values rather than out of prose — a relay host, a
// close reason off a socket — so it gets escaped on the way in.
const esc = (v) => ('' + (v == null ? '' : v)).replace(/[&<>"']/g,
  (c) => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));

function netDiary(kind, detail){
  if (!NET.diary) NET.diary = [];
  NET.diary.push({ ms:netNow(), tick:NET.tick, kind, detail:detail === undefined ? '' : detail });
  if (NET.diary.length > DIARY_MAX) NET.diary.shift();
}
const netNow = () => Math.round((typeof performance !== 'undefined' && performance.now) ? performance.now() : Date.now());

// Everything a report needs to be worth reading without the reporter having to
// know what any of it means.
function netReport(){
  const L = [];
  L.push('IRONBRIDGE — network report');
  L.push('when      ' + new Date().toISOString());
  L.push('seat      ' + (NET.on ? NET.me + (NET.me === 0 ? ' (host)' : ' (joined)') : 'not in a network match'));
  L.push('room      ' + (LOBBY.code || '—') + '   relay ' + relayHost());
  L.push('tick      ' + NET.tick + '   match clock ' + mmss(G.t) + '   wave ' + G.wave);
  L.push('state     ' + G.state + (NET.peerLost ? '   PEER LOST' : '') +
         (NET.desyncAt >= 0 ? '   DESYNCED at tick ' + NET.desyncAt : ''));
  L.push('resyncs   ' + (NET.resyncs || 0) + ' of ' + SYNC_MAX + '   stall ' + (NET.stallT || 0).toFixed(1) + 's');
  L.push('seed      ' + seedNow() + '   hash now ' + (G.sides.length ? netHash() : '—'));
  L.push('bodies    ' + G.units.length + ' on the bridge, heroes ' +
         G.sides.map(s => s.heroes.length).join('/') + ', buildings ' +
         G.sides.map(s => s.plot.filter(Boolean).length).join('/'));
  L.push('orders    ' + NET.pending.length + ' queued, ' + NET.box.size + ' ticks in the box');
  L.push('');
  L.push('log (most recent last, ms since the page loaded)');
  const d = NET.diary || [];
  if (!d.length) L.push('  (nothing recorded)');
  for (const e of d) L.push('  ' + String(e.ms).padStart(8) + '  t' + String(e.tick).padStart(6) + '  ' +
    e.kind + (e.detail ? '  ' + e.detail : ''));
  return L.join('\n');
}

// The same thing, offered rather than hidden in a console nobody opens.
function showNetReport(){
  const txt = netReport();
  openModal('<h2>Network report</h2>' +
    '<p class="sub">What the two machines did, in order. Copy this into a bug report — it says which seat, which tick, and what disagreed.</p>' +
    '<pre class="netlog">' + esc(txt) + '</pre>' +
    '<div class="rowbtn"><button class="big" data-act="netcopy">Copy</button>' +
    '<button class="big ghost" data-act="close">Close</button></div>', true);
  G.netReportText = txt;
}

// Getting back in after our own link drops. The room keeps its seed and holds
// the seat, so reconnecting to the same code lands in the same match — and the
// relay then tells both machines who is returning and who stayed.
const RETRY_MAX = 6;
const STALL_DEAD = 4;            // seconds of stall before a non-open socket counts as gone
function netRetry(){
  if (!NET.on || !NET.linkLost) return;
  if (NET.retry >= RETRY_MAX){ netDiary('gave up reconnecting', 'after ' + NET.retry + ' tries'); return; }
  NET.retry++;
  const wait = Math.min(8000, 500 * ipow(2, NET.retry - 1));
  netDiary('reconnecting', 'attempt ' + NET.retry + ' in ' + wait + 'ms to room ' + (LOBBY.code || '?'));
  if (HEADLESS) return;
  setTimeout(() => {
    if (!NET.on || !NET.linkLost || !LOBBY.code) return;
    lobbyConnect(LOBBY.code);
  }, wait);
}

/* ------------------------------------------------------------ resync wire
   A snapshot is bigger than the relay will carry in one message — 13KB at wave
   three, 20KB in a busy one, against a 16KB limit — so it goes in pieces and is
   put back together on the other side. Chunking rather than raising the cap
   keeps this working against a relay that is already deployed. */
const SYNC_CHUNK = 12000;
const SYNC_MAX = 4;              // give up rather than loop forever on a repeat

// `force` is a rejoin rather than a drift: the machine that stayed is the only
// one that knows anything, whichever seat it happens to be sitting in, and
// handing a returning player the board is not a failure to be budgeted.
function netSendSnap(force){
  if (!force){
    if (NET.me !== 0) return;                     // on a drift, the host is the authority
    if (NET.resyncs >= SYNC_MAX) return;
    NET.resyncs++;
  }
  const at = NET.tick;
  const body = JSON.stringify(netSnap());
  const id = (NET.syncId = (NET.syncId || 0) + 1);
  const n = Math.ceil(body.length / SYNC_CHUNK) || 1;
  netDiary('sync out', body.length + ' bytes in ' + n + ' piece(s) at tick ' + at + ' (resync ' + NET.resyncs + ')');
  for (let i = 0; i < n; i++)
    if (NET.send) NET.send({ k:'sync', id, i, n, tick:at, part:body.slice(i * SYNC_CHUNK, (i + 1) * SYNC_CHUNK) });
  netResumeAt(at);                                 // the host restarts its own pipe too
}

function netTakeSnap(m){
  if (!NET.on) return;
  if (!NET.rx || NET.rx.id !== m.id) NET.rx = { id:m.id, n:m.n, parts:[], got:0 };
  const rx = NET.rx;
  if (rx.parts[m.i] === undefined){ rx.parts[m.i] = m.part; rx.got++; }
  if (rx.got < rx.n) return;
  let snap = null;
  try { snap = JSON.parse(rx.parts.join('')); } catch (e){ NET.rx = null; return; }
  NET.rx = null;
  if (!netLoad(snap)) { netDiary('sync in FAILED', 'snapshot would not load'); return; }
  NET.resyncs++;
  netDiary('sync in', 'adopted the other machine’s board at tick ' + (m.tick | 0) + ' (resync ' + NET.resyncs + ')');
  NET.awaitSync = false;
  netResumeAt(m.tick | 0);
}

// Both machines restart their order pipeline from the same tick, exactly the
// way netStart primes a new match — otherwise one of them is still holding
// orders addressed to ticks that no longer mean anything.
function netResumeAt(tick){
  netDiary('resume', 'from tick ' + (tick | 0));
  NET.tick = tick | 0;
  NET.box.clear(); NET.pending.length = 0;
  NET.hashes.clear(); NET.peerHashes.clear();
  NET.desyncAt = -1; NET.stallT = 0;
  acc = 0; netLast = 0;
  for (let i = 0; i < NET.delay; i++){ netDeliver(NET.tick + i, 0, []); netDeliver(NET.tick + i, 1, []); }
  netPublish();
  if (!HEADLESS) syncUI();
}

// Nothing may quietly skip a tick's simulation. update() bails out on G.paused
// and G.held, and this function advances the clock regardless — so if anything
// ever sets either of them during a network match, the two machines stop
// agreeing without a single line of the simulation being wrong. holdsBoard and
// setPaused both refuse in multiplayer; this makes it impossible rather than
// merely refused, because the cost of being wrong here is the whole match.
function netStep(){
  // Two machines that have stopped agreeing are playing two different games,
  // and every tick after the first disagreement widens it. Detecting that and
  // then carrying on — which is what this did, with only a banner to show for
  // it — means both players keep giving orders to a board the other one cannot
  // see, and whoever "wins" did not. The match stops here.
  if (NET.awaitSync) return false;                // nothing on this board is real yet
  if (NET.desyncAt >= 0) return false;
  if (!netReady(NET.tick)) return false;
  const slot = NET.box.get(NET.tick);
  // Sorted by side then seq — never by arrival order, which differs per machine.
  const all = [...slot[0], ...slot[1]].sort((p, q) => p.side - q.side || p.seq - q.seq);
  for (const c of all){
    const fn = CMD[c.k];
    if (fn) fn(G.sides[c.side], c);
  }
  G.paused = false; G.held = false;
  update(1 / 30);
  NET.box.delete(NET.tick);
  NET.tick++;
  netPublish();
  if (NET.tick % 30 === 0){
    const h = netHash();
    NET.hashes.set(NET.tick, h);
    if (NET.send) NET.send({ k:'hash', tick:NET.tick, h });
    netCheckHash(NET.tick);
  }
  return true;
}

// Start a networked match. Both machines call this with the same seed and the
// same difficulty; the only thing that differs is `me`.
function netStart(opt){
  NET.on = true; NET.me = opt.me | 0; NET.tick = 0; NET.seq = 0;
  MY = NET.me;                                       // the interface follows the seat
  NET.diary = [];
  netDiary('start', 'seat ' + NET.me + '  seed ' + (opt.seed >>> 0) + '  delay ' + NET.delay + ' ticks');
  netLast = 0; acc = 0;
  netClockStart();                                   // a clock that survives being in the background
  NET.box.clear(); NET.pending.length = 0; NET.hashes.clear(); NET.peerHashes.clear();
  NET.desyncAt = -1; NET.stallT = 0; NET.resyncs = 0; NET.rx = null;
  NET.awaitSync = false; NET.linkLost = false; NET.retry = 0;
  newMatch({ diff:opt.diff || 'veteran', seed:opt.seed, pvp:true });
  G.sides[0].ai = false; G.sides[1].ai = false;      // both holds are people now
  // Prime the pipe: the first NET.delay ticks have no player input by
  // definition, so publish empty batches for them or nothing can ever start.
  for (let i = 0; i < NET.delay; i++){ netDeliver(i, 0, []); netDeliver(i, 1, []); }
  netPublish();
}

// Leaving a network match.
//
// NET.on was set in netStart and then never cleared anywhere, by anything. Go
// to the menu or start a one-player game and the frame loop was still taking
// its NET.on branch — driving netStep() against a brand new match with a tick
// counter and an order box left over from the finished one. The new match
// would sit frozen waiting for orders from a player who had gone.
function netEnd(){
  NET.on = false; NET.peerLost = false;
  MY = 0;                                            // back to the left-hand hold
  netClockStop();
  NET.tick = 0; NET.seq = 0; NET.desyncAt = -1; NET.stallT = 0; NET.resyncs = 0; NET.rx = null;
  NET.awaitSync = false; NET.linkLost = false; NET.retry = 0;
  NET.box.clear(); NET.peerHashes.clear(); NET.hashes.clear(); NET.pending.length = 0;
  acc = 0;
  lobbyClose();
}

// Incoming from the relay. Anything malformed is dropped rather than trusted.
// Everything the other machine can say, in one place. `hello`, `peers` and
// `start` are the socket coming up and stay with the socket; from here down it
// is the match talking, and keeping it together is what lets the suite drive
// the whole protocol without a WebSocket.
function netRecv(m){
  if (!m || typeof m !== 'object') return;
  if (m.k === 'cmd' && typeof m.tick === 'number' && (m.side === 0 || m.side === 1) && Array.isArray(m.cmds))
    netDeliver(m.tick, m.side, m.cmds.filter(c => c && CMD[c.k] && (c.side === 0 || c.side === 1)));
  else if (m.k === 'hash' && typeof m.tick === 'number' && typeof m.h === 'number'){
    NET.peerHashes.set(m.tick, m.h);
    netCheckHash(m.tick);
  }
  else if (m.k === 'sync' && typeof m.tick === 'number' && typeof m.part === 'string') netTakeSnap(m);
  else if (m.k === 'peerGone'){
    NET.peerLost = true;
    netDiary('PEER GONE', 'the relay says the other player’s socket closed');
    if (!HEADLESS) syncUI();
  }
}

let acc = 0, netLast = 0;

// The network clock, deliberately NOT on requestAnimationFrame.
//
// A browser throttles rAF to about one frame a second in a window that is not
// in front, and stops it entirely in one that is fully covered. On your own
// that is harmless — the game simply waits while you are not looking at it. In
// a network match it is fatal, because the two machines advance in lockstep and
// neither may pass a tick the other has not published. A backgrounded window
// therefore drags its opponent down to its own frame rate.
//
// Two windows on one computer is the ordinary way to try two-player out, and
// exactly what this does to it, measured: forty seconds of real time produced
// four seconds of match — a tenth of speed — with "Waiting for the other
// player…" on both screens the whole time. It reads as the game being frozen
// and the other player being unable to do anything, which is precisely what it
// was reported as.
//
// So a timer drives this as well as rAF, and takes its elapsed time from its
// own clock rather than being handed a frame delta — that way it does not
// matter which of the two calls it, or how often, and neither can double-count
// the time. The per-pump budget is big enough to pay off well over a second of
// arrears in one go, so a coarse pump still keeps real-time pace.
const NET_BUDGET = 50;           // ticks one pump may run — 1.67s of catch-up
const NET_ARREARS = 1.5;         // seconds of debt worth paying; older than this is dropped

function netPump(){
  if (!NET.on) return;
  const now = (typeof performance !== 'undefined' && performance.now) ? performance.now() : Date.now();
  if (!netLast){ netLast = now; return; }
  const raw = Math.min(NET_ARREARS, (now - netLast) / 1000);
  netLast = now;
  acc += raw;
  let ran = 0, blocked = false;
  while (acc >= 1 / 30 && ran < NET_BUDGET){
    if (!netStep()){ blocked = true; break; }
    acc -= 1 / 30; ran++;
  }
  // Never hoard arrears. A window that was away for five minutes owes nine
  // thousand ticks and is not going to pay them.
  if (acc > NET_ARREARS) acc = NET_ARREARS;
  if (blocked && NET.stallT === 0) netDiary('stalled', 'waiting on the other player at tick ' + NET.tick);
  // A socket does not always announce its own death: the close event can be
  // slow or never arrive at all, and the match then waits on a peer it can no
  // longer reach. A long stall with a socket that is not OPEN is that, and it
  // is treated as a dropped link rather than as patience.
  if (blocked && NET.stallT > STALL_DEAD && !NET.linkLost && LOBBY.sock && LOBBY.sock.readyState !== 1){
    netDiary('link looks dead', 'stalled ' + NET.stallT.toFixed(1) + 's with the socket in state ' + LOBBY.sock.readyState);
    NET.linkLost = true;
    netRetry();
  }
  else if (!blocked && NET.stallT > 1) netDiary('resumed', 'after ' + NET.stallT.toFixed(1) + 's of waiting');
  NET.stallT = blocked ? NET.stallT + raw : 0;
}

// A dedicated worker's timer keeps running at full rate in a backgrounded page,
// where the page's own setInterval is clamped to once a second and, after a few
// minutes of being hidden, considerably worse than that. If a worker cannot be
// created — an unusual CSP, an old browser — fall back to setInterval, which is
// still far better than rAF alone.
let netClock = null;
function netClockStart(){
  if (netClock || HEADLESS) return;
  try {
    const src = 'let h=0;onmessage=function(e){if(e.data===1&&!h){h=setInterval(function(){postMessage(0);},40);}' +
                'else if(e.data===0){clearInterval(h);h=0;}};';
    const w = new Worker(URL.createObjectURL(new Blob([src], { type:'text/javascript' })));
    w.onmessage = netPump;
    w.postMessage(1);
    netClock = { stop(){ try { w.postMessage(0); w.terminate(); } catch (e){} } };
  } catch (e){
    const id = setInterval(netPump, 40);
    netClock = { stop(){ clearInterval(id); } };
  }
}
function netClockStop(){
  if (netClock){ netClock.stop(); netClock = null; }
  netLast = 0; acc = 0;
}

function frame(ts){
  const raw = Math.min(.1, (ts - last) / 1000 || 0);
  last = ts;
  if (NET.on){
    netPump();
  } else if (G.state === 'play' && !G.paused && !G.held){
    let left = raw * G.speed;
    let guard = 0;
    while (left > 0 && guard++ < 12){ const st = Math.min(1 / 30, left); update(st); left -= st; }
  }
  camStep(raw);
  // Nothing on the board moves while the result card or the pause report is
  // up, but the card blurs the whole canvas behind it — and re-blurring a live
  // 1400x820 layer sixty times a second for a still picture cost half the
  // frame rate. Redraw a few times a second instead; the DOM stays live.
  const frozen = (G.state === 'over' || G.paused || G.held) && !G.demo;
  if (!frozen || ts - lastDraw > 90){ draw(); lastDraw = ts; }
  uiTick(raw);
  requestAnimationFrame(frame);
}

function boot(){
  lcv = $('wcv');
  resize();
  wire();
  startDemo();
  showMenu();
  syncUI();
  requestAnimationFrame(frame);
}
if (!HEADLESS) boot();
else {
  // Headless: no rAF loop and no resize(), but the render path still has to be
  // REACHABLE. draw() opens `const c = lctx; if (!c) return;` and lctx is
  // assigned only inside resize(), which returns immediately under HEADLESS —
  // so across the whole test suite draw() was called 200 times and its body ran
  // ZERO times. Seventeen hundred lines of drawing had no coverage at all while
  // the suite's own header claimed otherwise. Only the canvas handle is wired
  // here; nothing schedules a frame, so a picture is drawn exactly when a test
  // asks for one.

  newMatch({ diff:'veteran' }); G.state = 'menu';
}
