<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#d2412b">
<title>Ludus Maximus</title>
<style>
:root{
  --ink:#14100f;--cream:#f5ead2;--cream2:#e9d3a3;--sand:#e6c27d;--terra:#d2412b;--terra2:#a8321f;--gold:#f6b82d;--gold2:#c98a1a;
  --night:#241713;--night2:#3a2118;--teal:#22b5a0;--blue:#2f78c4;--green:#2a9d6f;--violet:#7b4fb8;--grey:#6b6b73;
  --font:"Arial Black","Segoe UI Black","Roboto Black","Helvetica Neue",system-ui,sans-serif;
  --body:"Trebuchet MS","Segoe UI",Roboto,system-ui,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden}
body{background:var(--ink);color:var(--ink);font-family:var(--body);font-weight:700;display:flex;justify-content:center;overscroll-behavior:none;user-select:none;-webkit-user-select:none;touch-action:manipulation}
body::before{content:"";position:fixed;inset:0;background:
  repeating-linear-gradient(45deg,#1d1411 0 18px,#241713 18px 36px);z-index:-1}
#app{width:100%;max-width:540px;height:100%;height:100dvh;background:var(--night);display:flex;flex-direction:column;position:relative;box-shadow:0 0 0 4px var(--ink),0 0 60px #000;overflow:hidden}
h1,h2,h3,.h{font-family:var(--font);text-transform:uppercase;letter-spacing:.5px;margin:0;font-weight:900}
.hide{display:none!important}
.ic{flex:none;vertical-align:middle}

/* HUD */
#hud{display:flex;align-items:center;gap:6px;padding:calc(env(safe-area-inset-top) + 8px) 10px 8px;background:var(--terra);border-bottom:4px solid var(--ink);flex:none}
.chip{display:inline-flex;align-items:center;gap:5px;background:var(--ink);color:var(--cream);border-radius:20px;padding:4px 10px 4px 6px;font-family:var(--font);font-size:13px;white-space:nowrap}
.chip b{font-weight:900}
#hud .grow{flex:1}
#nextBtn{font-size:13px;padding:8px 12px}
/* main */
#main{flex:1;overflow-y:auto;overflow-x:hidden;padding:12px 12px 24px;-webkit-overflow-scrolling:touch;background:
  radial-gradient(circle at 20% 0,#4a2a1e 0,transparent 55%),var(--night)}
#tabs{display:flex;flex:none;background:var(--ink);padding:6px 6px calc(env(safe-area-inset-bottom) + 6px);gap:6px;border-top:4px solid var(--ink)}
.tab{flex:1;background:var(--night2);color:var(--cream2);border:3px solid var(--ink);border-radius:12px;padding:5px 0 4px;font-family:var(--font);font-size:10px;text-transform:uppercase;display:flex;flex-direction:column;align-items:center;gap:2px;position:relative;cursor:pointer;box-shadow:0 3px 0 #000}
.tab.on{background:var(--gold);color:var(--ink)}
.tab .dot{position:absolute;top:-6px;right:6px;background:var(--terra);color:#fff;border:2px solid var(--ink);border-radius:10px;font-size:10px;min-width:18px;height:18px;line-height:14px;text-align:center;padding:0 3px}

/* components */
.card{background:var(--cream);border:3px solid var(--ink);border-radius:14px;box-shadow:0 4px 0 var(--ink);padding:10px;margin-bottom:12px;position:relative}
.card.dark{background:var(--night2);color:var(--cream)}
.card h3{font-size:14px;margin-bottom:6px}
.row{display:flex;align-items:center;gap:8px}
.col{display:flex;flex-direction:column;gap:6px}
.sp{flex:1}
.wrap{flex-wrap:wrap}
.muted{opacity:.7;font-weight:600;font-size:12px}
.small{font-size:12px}
.tiny{font-size:10px}
.btn{font-family:var(--font);text-transform:uppercase;background:var(--gold);color:var(--ink);border:3px solid var(--ink);border-radius:12px;padding:10px 14px;font-size:14px;box-shadow:0 4px 0 var(--ink);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;position:relative;top:0}
.btn:active{top:3px;box-shadow:0 1px 0 var(--ink)}
.btn.red{background:var(--terra);color:#fff}.btn.green{background:var(--green);color:#fff}.btn.blue{background:var(--blue);color:#fff}.btn.ghost{background:var(--cream);}
.btn.sm{padding:6px 10px;font-size:12px;border-radius:10px}
.btn[disabled],.btn.off{filter:grayscale(1);opacity:.55;pointer-events:none}
.btn.full{width:100%}
.pill{display:inline-flex;align-items:center;gap:4px;border:2px solid var(--ink);border-radius:20px;padding:1px 8px;font-size:11px;font-family:var(--font);background:var(--cream2);white-space:nowrap}
.sbadge{display:inline-flex;align-items:center;justify-content:center;border:2.5px solid var(--ink);border-radius:50%;flex:none}
.bar{height:11px;background:var(--ink);border-radius:8px;overflow:hidden;border:2px solid var(--ink);position:relative}
.bar i{display:block;height:100%;background:var(--green);transition:width .2s}
.bar.en i{background:var(--gold)}.bar.mo i{background:var(--blue)}.bar.xp i{background:var(--violet)}.bar.hp i{background:var(--terra)}
.st{display:inline-flex;flex-direction:column;align-items:center;min-width:46px;border:2.5px solid var(--ink);border-radius:9px;background:var(--cream);overflow:hidden;font-family:var(--font);font-size:12px;line-height:1.15}
.st span{display:block;width:100%;text-align:center;color:#fff;font-size:9px;padding:1px 0}
.st b{padding:1px 0 2px}
.pips{letter-spacing:-1px;font-size:10px;color:var(--gold2)}
.tag{font-family:var(--font);font-size:10px;text-transform:uppercase;border:2px solid var(--ink);border-radius:6px;padding:0 5px;background:var(--gold);color:var(--ink)}
.tag.red{background:var(--terra);color:#fff}.tag.green{background:var(--green);color:#fff}.tag.blue{background:var(--blue);color:#fff}.tag.grey{background:var(--grey);color:#fff}
.sec{font-family:var(--font);text-transform:uppercase;color:var(--gold);font-size:13px;margin:14px 2px 8px;display:flex;align-items:center;gap:8px;text-shadow:2px 2px 0 var(--ink)}
.sec::after{content:"";flex:1;height:4px;background:var(--ink);border-radius:2px}
.empty{color:var(--cream2);text-align:center;padding:24px 10px;opacity:.8}

/* Ludus map */
.banner{background:var(--terra);border:4px solid var(--ink);border-radius:14px;padding:10px 12px;margin-bottom:12px;color:#fff;box-shadow:0 5px 0 var(--ink);display:flex;align-items:center;gap:10px;position:relative;overflow:hidden}
.banner h2{font-size:18px;text-shadow:2px 2px 0 var(--ink)}
.banner::after{content:"";position:absolute;right:-20px;top:-20px;width:90px;height:90px;border-radius:50%;background:var(--gold);opacity:.25}
.map{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;background:#b28a4a;padding:6px;border:4px solid var(--ink);border-radius:14px;box-shadow:0 5px 0 var(--ink);background-image:radial-gradient(#a37c3e 2px,transparent 3px);background-size:16px 16px}
.tile{aspect-ratio:1/1.05;background:var(--sand);border:3px solid var(--ink);border-radius:10px;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;cursor:pointer;overflow:hidden;padding-bottom:2px}
.tile.empty{background:rgba(230,194,125,.45);border-style:dashed;color:rgba(20,16,15,.5);justify-content:center;align-items:center}
.tile.locked{background:#6f5a3a;border-style:dashed;color:#d8c391;justify-content:center;align-items:center;text-align:center;font-size:10px;font-family:var(--font)}
.tile .bld{position:absolute;top:2px;left:50%;transform:translateX(-50%);width:92%;height:auto}
.tile .lbl{position:relative;background:var(--ink);color:var(--cream);font-family:var(--font);font-size:8.5px;text-transform:uppercase;padding:1px 4px;border-radius:5px 5px 0 0;white-space:nowrap}
.tile .lv{position:absolute;top:2px;left:3px;background:var(--gold);border:2px solid var(--ink);border-radius:8px;font-family:var(--font);font-size:9px;padding:0 4px}
.tile .sy{position:absolute;top:2px;right:3px;background:var(--terra);color:#fff;border:2px solid var(--ink);border-radius:8px;font-family:var(--font);font-size:9px;padding:0 4px}
.tile .people{position:absolute;bottom:14px;left:0;right:0;display:flex;justify-content:center;gap:0;z-index:2;pointer-events:none}
.tile .people svg{width:24px;height:auto;margin:0 -3px}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-2px)}}
.tile .people svg .gl-body{animation:bob 1s ease-in-out infinite}
.menu-opt{display:flex;gap:8px;align-items:center;padding:8px;border:3px solid var(--ink);border-radius:12px;background:var(--cream);margin-bottom:6px;cursor:pointer}
.menu-opt.on{background:var(--gold)}
.menu-opt.lock{opacity:.5}

/* roster */
.gcard{padding:8px}
.gcard .spr{width:66px;flex:none;display:flex;justify-content:center;cursor:pointer;background:var(--cream2);border:3px solid var(--ink);border-radius:12px;height:84px;align-items:flex-end;overflow:hidden}
.gcard .spr svg{width:62px;height:auto;margin-bottom:-2px}
.gname{font-family:var(--font);font-size:14px;text-transform:uppercase;line-height:1.1}
.stats{display:flex;gap:4px;margin:8px 0}
.acts{display:flex;flex-wrap:wrap;gap:4px}
.act{font-family:var(--font);font-size:10px;text-transform:uppercase;border:2.5px solid var(--ink);border-radius:8px;padding:5px 7px;background:var(--cream2);cursor:pointer;flex:1 1 auto;text-align:center;min-width:44px}
.act.on{background:var(--gold);box-shadow:inset 0 -3px 0 rgba(0,0,0,.25)}
.act.off{opacity:.4;pointer-events:none}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
.pulse{animation:pulse 1s infinite}

/* arena */
.ltabs{display:flex;gap:6px;margin-bottom:10px;overflow-x:auto;padding-bottom:4px}
.ltab{flex:1 0 auto;font-family:var(--font);font-size:11px;text-transform:uppercase;border:3px solid var(--ink);border-radius:10px;padding:6px 8px;background:var(--night2);color:var(--cream2);cursor:pointer;white-space:nowrap;box-shadow:0 3px 0 #000;text-align:center}
.ltab.on{background:var(--gold);color:var(--ink)}
.ltab.lock{opacity:.55}
.wtabs{display:flex;gap:6px;margin-bottom:10px;overflow-x:auto}
.wtab{flex:1 0 auto;font-family:var(--font);font-size:11px;border:3px solid var(--ink);border-radius:10px;padding:5px 10px;background:var(--cream2);cursor:pointer;white-space:nowrap}
.wtab.on{background:var(--terra);color:#fff}
.wtab.lock{opacity:.4}
.ev{padding:0;overflow:hidden}
.ev .hd{display:flex;align-items:center;gap:8px;padding:6px 10px;background:var(--terra);color:#fff;border-bottom:3px solid var(--ink)}
.ev.t .hd{background:var(--violet)}.ev.g .hd{background:var(--ink);color:var(--gold)}.ev.m .hd{background:var(--blue)}
.ev .hd .h{font-size:13px;text-shadow:1px 1px 0 var(--ink)}
.ev .bd{padding:8px 10px}
.opp{display:flex;align-items:center;gap:8px;cursor:pointer}
.opp .spr{width:54px;height:62px;overflow:hidden;background:var(--cream2);border:3px solid var(--ink);border-radius:10px;display:flex;align-items:flex-end;justify-content:center;flex:none}
.opp .spr svg{width:52px;height:auto}
.opp .spr.fog svg{filter:brightness(.35) contrast(1.2)}
.reward{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}

/* modal */
#modal{position:fixed;inset:0;background:rgba(10,6,5,.72);display:flex;align-items:flex-end;justify-content:center;z-index:50;opacity:0;pointer-events:none;transition:opacity .15s}
#modal.on{opacity:1;pointer-events:auto}
#modal .sheet{width:100%;max-width:540px;max-height:92dvh;max-height:92vh;overflow-y:auto;background:var(--cream);border:4px solid var(--ink);border-bottom:0;border-radius:22px 22px 0 0;padding:14px 14px calc(env(safe-area-inset-bottom) + 16px);transform:translateY(40px);transition:transform .18s;box-shadow:0 -6px 0 var(--ink)}
#modal.on .sheet{transform:none}
#modal.mid{align-items:center}
#modal.mid .sheet{border-radius:22px;border-bottom:4px solid var(--ink);width:calc(100% - 24px);padding-bottom:16px}
.sheet h2{padding-right:44px;font-size:20px;margin-bottom:8px;text-shadow:2px 2px 0 var(--gold)}
.sheet .x{position:absolute;right:12px;top:10px}
.sheetwrap{position:relative}
#toast{position:fixed;top:calc(env(safe-area-inset-top) + 64px);left:50%;transform:translate(-50%,-20px);background:var(--ink);color:var(--cream);font-family:var(--font);font-size:13px;padding:10px 16px;border-radius:14px;border:3px solid var(--gold);z-index:100;opacity:0;pointer-events:none;transition:all .2s;max-width:90%;text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}
.big{font-size:42px;font-family:var(--font);text-transform:uppercase;text-align:center;line-height:1;text-shadow:3px 3px 0 var(--ink)}
.win{color:var(--gold)}.lose{color:var(--terra)}
.itm{display:flex;gap:8px;align-items:center;padding:6px;border:3px solid var(--ink);border-radius:12px;background:var(--cream);cursor:pointer;margin-bottom:6px}
.igrid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.icell{border:3px solid var(--ink);border-radius:12px;background:var(--cream);padding:4px;text-align:center;cursor:pointer;position:relative;font-size:10px;line-height:1.15;box-shadow:0 3px 0 var(--ink)}
.icell.sel{outline:4px solid var(--terra)}
.icell .nm{font-family:var(--font);font-size:9.5px;text-transform:uppercase;margin-top:2px;min-height:22px}
.icell .up{position:absolute;top:2px;right:3px;font-family:var(--font);font-size:10px}
.slotbox{width:54px;height:54px;border:3px dashed var(--ink);border-radius:12px;display:flex;align-items:center;justify-content:center;background:var(--cream2);cursor:pointer;flex:none}
.slotbox.has{border-style:solid}
.kv{display:flex;justify-content:space-between;gap:10px;padding:3px 0;border-bottom:2px dotted rgba(20,16,15,.25);font-size:13px}
.kv b{font-family:var(--font);font-weight:900}
.tech{border:3px solid var(--ink);border-radius:10px;padding:6px 8px;background:var(--cream2);margin-bottom:6px;font-size:12px}
.tech b{font-family:var(--font);text-transform:uppercase}
.adv{display:inline-flex;align-items:center;gap:4px;font-family:var(--font);font-size:10px;text-transform:uppercase;border:2px solid var(--ink);border-radius:8px;padding:1px 6px}
.adv.up{background:var(--green);color:#fff}.adv.dn{background:var(--terra);color:#fff}.adv.eq{background:var(--cream2)}

/* fight */
#fight{position:fixed;inset:0;z-index:70;background:var(--night);display:flex;flex-direction:column;align-items:center}
#fight .inner{width:100%;max-width:540px;height:100%;display:flex;flex-direction:column;background:var(--night)}
.f-top{display:flex;gap:6px;padding:calc(env(safe-area-inset-top) + 8px) 8px 6px;background:var(--terra);border-bottom:4px solid var(--ink);flex:none}
.f-top .side{flex:1;display:flex;flex-direction:column;gap:4px;min-width:0}
.f-top .side.r{align-items:flex-end}
.fu{width:100%}
.fu .nm{font-family:var(--font);font-size:10px;text-transform:uppercase;color:#fff;text-shadow:1px 1px 0 var(--ink);display:flex;align-items:center;gap:4px;white-space:nowrap;overflow:hidden}
.side.r .fu .nm{justify-content:flex-end}
.fu .bar{height:12px}
.fu.dead{opacity:.35}

.f-stage{position:relative;flex:1 1 auto;min-height:0;overflow:hidden;border-bottom:4px solid var(--ink);background:#3a1d14}
#cam{position:absolute;inset:0;transform-origin:50% 62%;will-change:transform}
#world{position:absolute;inset:0}
#fxc{position:absolute;inset:0;pointer-events:none;z-index:900}
.f-flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:950}
.arena-bg{position:absolute;inset:0;width:100%;height:100%}
.cw{animation:cheer 1.3s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
@keyframes cheer{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
.arena-bg.roar .cw{animation-duration:.22s}
.fs{position:absolute;left:0;top:0;transform-origin:50% 93%;cursor:default}
.fs.foe{cursor:pointer}
.fshadow{position:absolute;left:16%;right:16%;bottom:2%;height:9%;background:rgba(0,0,0,.38);border-radius:50%}
.fsb{position:absolute;inset:0}
.fsi{position:absolute;inset:0;transform-origin:50% 60%}
.fsi svg{width:100%;height:auto;display:block;overflow:visible}
.fs .gl-body{animation:bob 1.1s ease-in-out infinite}
.fs.walk .gl-body{animation:walkb .3s ease-in-out infinite}
@keyframes walkb{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-4px) rotate(2deg)}}
.fs.hurt .fsi{filter:brightness(2.4) saturate(.2)}
.fs.winding .gl-arm{transform:rotate(-14deg);transform-box:view-box;transform-origin:78px 66px}
.fs.dead{pointer-events:none}
.fs.dead .fsb{transform:rotate(84deg) translate(8px,26px);opacity:.55;filter:grayscale(1);transition:all .5s}
.fs.dead .fhb,.fs.dead .fsts,.fs.dead .fstk{display:none}
.fhb{position:absolute;left:10%;right:10%;top:-4px;height:8px;background:var(--ink);border:2px solid var(--ink);border-radius:5px;overflow:hidden}
.fhp{display:block;height:100%;width:100%;background:#2a9d6f;transition:width .12s}
.fshd{position:absolute;left:0;top:0;height:100%;background:#f5ead2;opacity:.85}
.fsts{position:absolute;top:-17px;left:0;right:0;display:flex;justify-content:center;gap:3px}
.fsts i{width:10px;height:10px;border:2px solid var(--ink);border-radius:50%}
.fstk{position:absolute;top:-30px;right:4%;font-family:var(--font);font-size:12px;color:var(--gold);text-shadow:1px 1px 0 var(--ink),-1px -1px 0 var(--ink)}
.fs .tgt{position:absolute;top:-34px;left:50%;transform:translateX(-50%);font-size:10px;font-family:var(--font);background:var(--ink);color:var(--gold);padding:0 5px;border-radius:6px;display:none}
.fs.focus .tgt{display:block}
.fs.focus .fshadow{background:rgba(246,184,45,.75);box-shadow:0 0 0 3px var(--ink)}
.float{position:absolute;font-family:var(--font);font-size:20px;color:#fff;text-shadow:2px 2px 0 var(--ink),-1px -1px 0 var(--ink);pointer-events:none;z-index:800;white-space:nowrap;animation:fl 1s ease-out forwards}
.float.crit{font-size:30px;color:var(--gold)}
.float.heal{color:#7dffb4}.float.miss{color:#ddd;font-size:14px}.float.tech{font-size:15px;color:var(--gold)}.float.st{font-size:12px;color:#ffd0a0}
@keyframes fl{0%{transform:translate(-50%,0) scale(.6);opacity:0}15%{transform:translate(-50%,-8px) scale(1.2);opacity:1}100%{transform:translate(-50%,-58px) scale(1);opacity:0}}
.f-banner{position:absolute;left:0;right:0;top:34%;text-align:center;font-family:var(--font);font-size:34px;color:var(--gold);text-shadow:3px 3px 0 var(--ink),-2px -2px 0 var(--ink);pointer-events:none;opacity:0;text-transform:uppercase;z-index:980}
.f-banner.on{animation:ban 1.3s ease-out}
@keyframes ban{0%{opacity:0;transform:scale(.4)}15%{opacity:1;transform:scale(1.18)}70%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(1.25)}}
.f-top{display:flex;gap:6px;padding:calc(env(safe-area-inset-top) + 8px) 8px 6px;background:var(--terra);border-bottom:4px solid var(--ink);flex:none}
.f-top .side{flex:1;display:flex;flex-direction:column;gap:4px;min-width:0}
.f-top .side.r{align-items:flex-end}
.fu{width:100%}
.fu .nm{font-family:var(--font);font-size:10px;text-transform:uppercase;color:#fff;text-shadow:1px 1px 0 var(--ink);display:flex;align-items:center;gap:4px;white-space:nowrap;overflow:hidden}
.fu .nm .lv{background:var(--ink);border-radius:8px;padding:0 5px;color:var(--gold);font-size:9px}
.side.r .fu .nm{flex-direction:row-reverse}
.fu .bar{height:15px;position:relative}
.fu .bar em{position:absolute;left:0;top:0;height:100%;background:#f5ead2;opacity:.85}
.fu .hnum{position:absolute;inset:0;text-align:center;font-size:9px;line-height:11px;color:#fff;font-family:var(--font);text-shadow:1px 1px 0 var(--ink);font-style:normal}
.fu.dead{opacity:.35}
.f-hype{height:16px;background:var(--ink);flex:none;position:relative;border-bottom:3px solid var(--ink)}
.f-hype i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--terra));width:0}
.f-hype span{position:absolute;inset:0;text-align:center;font-family:var(--font);font-size:9px;color:#fff;line-height:16px;text-transform:uppercase;text-shadow:1px 1px 0 var(--ink)}
.f-log{flex:none;height:30px;padding:4px 10px;font-size:12px;color:var(--cream);overflow:hidden;background:var(--night2);line-height:1.2}
.f-aug{flex:none;display:flex;gap:4px;padding:3px 8px;background:var(--night2);overflow-x:auto}
.achip{font-family:var(--font);font-size:9px;border:2px solid;border-radius:10px;padding:0 6px;background:var(--ink);color:var(--cream);white-space:nowrap}
.f-ults{flex:none;display:flex;flex-direction:column;gap:5px;padding:6px 8px;background:var(--night2)}
.ur{display:flex;gap:6px;align-items:stretch}
.ur .who{width:54px;font-family:var(--font);font-size:9px;text-transform:uppercase;color:var(--cream2);line-height:1.1;display:flex;align-items:center}
.ub{position:relative;flex:1;height:62px;border:3px solid var(--ink);border-radius:14px;background:var(--c);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;cursor:pointer;box-shadow:0 4px 0 var(--ink);overflow:hidden}
.ub:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.ubn{font-family:var(--font);font-size:10px;color:#fff;text-transform:uppercase;text-shadow:1px 1px 0 var(--ink);position:relative}
.ubi{position:relative;filter:drop-shadow(1px 1px 0 var(--ink))}
.ubcd{position:absolute;inset:0}
.ubt{position:absolute;right:8px;top:4px;font-family:var(--font);font-size:15px;color:#fff;text-shadow:2px 2px 0 var(--ink),-1px -1px 0 var(--ink)}
.ub.ready{animation:rdy 0.9s ease-in-out infinite}
@keyframes rdy{0%,100%{box-shadow:0 4px 0 var(--ink),0 0 0 0 rgba(246,184,45,.0)}50%{box-shadow:0 4px 0 var(--ink),0 0 14px 5px rgba(246,184,45,.9)}}
.ub.dead{filter:grayscale(1);opacity:.5;pointer-events:none}

.f-speed{flex:none;display:flex;gap:6px;padding:6px 8px calc(env(safe-area-inset-bottom) + 8px);background:var(--ink)}
.f-speed .btn{flex:1;padding:8px 4px;font-size:12px}
.f-speed .btn.on{background:var(--terra);color:#fff}

h1,h2,h3,.h,.btn,.chip,.tab,.pill,.tag,.st,.act,.ltab,.wtab,.tb,.sec,.adv,.float,.big,.gname,.f-banner,.who{font-weight:900}
@keyframes cheerj{0%,100%{transform:translateY(0)}50%{transform:translateY(-14px)}}
.fs.cheer .fsb{animation:cheerj .45s ease-in-out infinite}
.fs.cheer .gl-arm{transform:rotate(-38deg);transform-box:view-box;transform-origin:78px 66px}
.fs.mine .fhb{box-shadow:0 0 0 2px #22b5a0}.fs.foe .fhb{box-shadow:0 0 0 2px #d2412b}
.f-vs{position:absolute;inset:0;z-index:990;background:rgba(20,16,15,.88);display:flex;align-items:center;justify-content:space-around;animation:vsout .35s ease-in 1.45s forwards;pointer-events:none}
.vsc{display:flex;flex-direction:column;align-items:center;gap:2px;max-height:100%;overflow:hidden}
.vsc.l{animation:vsl .5s ease-out}.vsc.r{animation:vsr .5s ease-out}
@keyframes vsl{from{transform:translateX(-140%)}to{transform:none}}@keyframes vsr{from{transform:translateX(140%)}to{transform:none}}
@keyframes vsout{to{opacity:0}}
.vsp{filter:drop-shadow(0 6px 0 rgba(0,0,0,.5))}
.vsn{font-family:var(--font);font-weight:900;color:var(--cream);text-transform:uppercase;font-size:15px;text-shadow:2px 2px 0 var(--ink)}
.vsm{display:flex;gap:4px;align-items:center;font-family:var(--font);font-size:11px;color:var(--gold)}
.vsv small{display:block;font-size:10px;color:var(--cream);text-shadow:1px 1px 0 var(--ink);text-align:center;margin-top:4px;letter-spacing:.5px}
.vsv{font-family:var(--font);font-weight:900;font-size:54px;color:var(--gold);text-shadow:4px 4px 0 var(--terra),-2px -2px 0 var(--ink);animation:vspop .6s ease-out .3s both}
@keyframes vspop{from{transform:scale(3);opacity:0}to{transform:scale(1);opacity:1}}
.ubu{display:none;position:relative;font-family:var(--font);font-size:8px;color:var(--cream);text-transform:uppercase;opacity:.9}
.f-ults.many{flex-direction:row;flex-wrap:wrap}.f-ults.many .ur{display:contents}.f-ults.many .who{display:none}
.f-ults.many .ub{flex:1 1 30%;height:50px}.f-ults.many .ubu{display:block}.f-ults.many .ubn{font-size:8px}.f-ults.many .ubi{display:none}
.lvlup{font-family:var(--font);font-weight:900;text-align:center;font-size:26px;color:#fff;background:linear-gradient(90deg,var(--violet),var(--terra));border:4px solid var(--ink);border-radius:14px;padding:6px;margin:8px 0;text-shadow:2px 2px 0 var(--ink);animation:lvp .7s ease-out}
@keyframes lvp{0%{transform:scale(.3) rotate(-6deg);opacity:0}60%{transform:scale(1.15) rotate(2deg);opacity:1}100%{transform:none}}
#tip{position:absolute;left:10px;right:10px;bottom:84px;z-index:40;background:var(--ink);color:var(--cream);border:3px solid var(--gold);border-radius:14px;padding:10px 12px;font-size:13px;display:none;gap:8px;align-items:center;box-shadow:0 5px 0 #000}
#tip.on{display:flex;animation:tabin .25s ease-out}#tip b{font-family:var(--font);color:var(--gold);text-transform:uppercase;font-size:11px}#tip .btn{flex:none}
@keyframes favp{0%,100%{transform:scale(1)}50%{transform:scale(1.04)}}
.favor{display:none;flex:1 1 100%;text-align:center;font-family:var(--font);font-weight:900;text-transform:uppercase;font-size:12px;color:var(--ink);background:linear-gradient(90deg,#f6b82d,#ffe38a,#f6b82d);border:3px solid var(--ink);border-radius:12px;padding:10px 6px;cursor:pointer;box-shadow:0 4px 0 var(--ink),0 0 18px 4px rgba(246,184,45,.8);animation:favp .7s ease-in-out infinite}
.favor.on{display:block}
.bark{position:absolute;transform:translate(-50%,-100%);background:#fff;color:var(--ink);font-family:var(--font);font-weight:900;font-size:11px;border:3px solid var(--ink);border-radius:12px;padding:3px 8px;white-space:nowrap;pointer-events:none;z-index:850;animation:barkin 1.3s ease-out forwards}
.bark::after{content:"";position:absolute;left:50%;bottom:-9px;margin-left:-5px;border:5px solid transparent;border-top:6px solid var(--ink)}
@keyframes barkin{0%{opacity:0;transform:translate(-50%,-70%) scale(.5)}12%{opacity:1;transform:translate(-50%,-100%) scale(1.1)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-120%)}}
.fest{display:inline-block;font-family:var(--font);font-size:10px;text-transform:uppercase;color:#fff;border:2px solid var(--ink);border-radius:8px;padding:1px 7px}
.troph{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.tr1{aspect-ratio:1;border:3px solid var(--ink);border-radius:12px;background:var(--gold);display:flex;align-items:center;justify-content:center;box-shadow:0 3px 0 var(--ink)}
.tr1.lock{background:#6b6b73;opacity:.55;filter:grayscale(1)}
.drillbar{position:relative;height:46px;background:var(--ink);border:3px solid var(--ink);border-radius:14px;overflow:hidden;margin:12px 0}
.drillz{position:absolute;top:0;bottom:0;background:rgba(246,184,45,.45)}.drillz.g{left:30%;width:40%}.drillz.p{left:45%;width:10%;background:rgba(42,157,111,.8)}
.drillm{position:absolute;top:-2px;bottom:-2px;width:8px;background:#fff;border:2px solid var(--ink);border-radius:5px}
body.rm *:not(.f-banner):not(.float):not(.bark):not(.f-vs):not(.vsc):not(.vsv){animation-duration:.001s!important;animation-iteration-count:1!important;transition-duration:.001s!important}
body.big #main{zoom:1.14}body.big .sheet{zoom:1.1}
.tile .people svg{animation:pace 3.6s linear infinite}
.tile .people svg:nth-child(2){animation-duration:4.4s;animation-delay:-1.3s}.tile .people svg:nth-child(3){animation-duration:3.1s;animation-delay:-2.2s}
@keyframes pace{0%{transform:translateX(-9px) scaleX(1)}49%{transform:translateX(9px) scaleX(1)}51%{transform:translateX(9px) scaleX(-1)}100%{transform:translateX(-9px) scaleX(-1)}}
.tile.b-kitchen::before,.tile.b-bath::before,.tile.b-forge::before{content:"";position:absolute;right:22%;top:10px;width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.85);z-index:3;animation:puff 2.2s ease-out infinite;pointer-events:none}
.tile.b-forge::before{background:#ffb347;right:30%;top:30px}
.tile.b-bath::before{right:50%}
@keyframes puff{0%{transform:translateY(8px) scale(.5);opacity:0}25%{opacity:.9}100%{transform:translateY(-18px) scale(1.5);opacity:0}}
.brk{display:flex;gap:6px;overflow-x:auto;margin:6px 0}.brk .col{flex:1;display:flex;flex-direction:column;justify-content:space-around;gap:8px;min-width:96px}
.brk .m{border:2px solid var(--ink);border-radius:8px;overflow:hidden;background:var(--cream);font-size:10px}
.brk .p{display:flex;align-items:center;gap:4px;padding:2px 5px;white-space:nowrap;overflow:hidden}.brk .p.me{background:var(--gold)}.brk .p.w{font-weight:900}.brk .p.l{opacity:.4;text-decoration:line-through}
.brk h4{margin:0 0 2px;font-family:var(--font);font-size:9px;text-transform:uppercase;text-align:center;color:var(--terra)}
@keyframes bump{0%{transform:scale(1)}35%{transform:scale(1.22);background:var(--gold);color:var(--ink)}100%{transform:scale(1)}}
.chip.bump{animation:bump .5s ease-out}
@keyframes tabin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
#main.tabin>*{animation:tabin .22s ease-out}
.tile{transition:transform .12s}.tile:active{transform:scale(.96)}
@media (min-width:700px){#app{max-width:560px;border-radius:0}#modal{align-items:center}#modal .sheet{border-radius:22px;border-bottom:4px solid var(--ink);width:520px;max-height:88vh}}
</style>
</head>
<body>
<div id="app">
  <div id="hud"></div>
  <div id="main"></div>
  <div id="tabs"></div>
</div>
<div id="modal"><div class="sheet" id="sheet"></div></div>
<div id="toast"></div>
<div id="fightRoot"></div>
<script src="data.js"></script>
<script src="sim.js"></script>
<script src="arena.js"></script>
<script src="art.js"></script>
<script src="ui.js"></script>
<script src="fight.js"></script>
<script src="play.js"></script>
</body>
</html>
