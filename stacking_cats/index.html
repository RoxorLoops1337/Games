<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#2a1d4a">
<title>Stacking Cats</title>
<style>
:root{
  --ink:#271c33; --paper:#fff8ef; --pink:#ff8fb7; --peach:#ffc38a; --mint:#8fe0b4; --sky:#8fd3ff; --grape:#6b4fc9;
  --panel:rgba(32,22,58,.82); --font:"Baloo 2","Nunito","Hiragino Maru Gothic ProN","Arial Rounded MT Bold","Trebuchet MS",system-ui,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#150f26;font-family:var(--font);color:var(--ink);touch-action:manipulation;user-select:none;-webkit-user-select:none}
body{background:radial-gradient(circle at 50% 30%,#3a2a66,#150f26 70%)}
#app{position:absolute;left:0;top:0;width:960px;height:540px;transform-origin:0 0;overflow:hidden;border-radius:14px;box-shadow:0 10px 60px #000a}
#cv{position:absolute;inset:0;width:960px;height:540px;display:block;image-rendering:auto}
#hud{position:absolute;inset:0;pointer-events:none}
#hud>*{pointer-events:auto}
.pill{position:absolute;background:var(--panel);color:#fff;border-radius:999px;padding:4px 14px;font-weight:700;font-size:16px;letter-spacing:.2px;border:1.5px solid rgba(255,255,255,.18);backdrop-filter:blur(4px)}
#waveBox{left:12px;top:10px;display:flex;gap:10px;align-items:center}
#waveBox b{font-size:20px;color:var(--peach)}
#waveBox small{opacity:.8;font-size:13px}
#nestPips{display:flex;gap:4px;align-items:center}
#nestPips i{width:10px;height:10px;border-radius:50%;background:rgba(255,255,255,.22);border:1px solid rgba(255,255,255,.35)}
#nestPips i.on{background:var(--mint)} #nestPips i.boss{background:#ff5d5d;border-color:#fff;box-shadow:0 0 8px #ff5d5d}
#bossBar{left:50%;top:10px;transform:translateX(-50%);width:340px;padding:4px 10px;text-align:center;display:none}
#bossBar .nm{font-size:14px;color:#ffb0b0;line-height:1}
#bossBar .bar{height:12px;border-radius:7px;background:#2a1530;margin-top:3px;overflow:hidden;border:1px solid #fff4}
#bossBar .bar i{display:block;height:100%;background:linear-gradient(#ff8a8a,#e03a4a);width:100%;transition:width .12s}
#tools{right:12px;top:8px;display:flex;gap:6px;background:none;border:0;padding:0;backdrop-filter:none}
.ib{width:40px;height:40px;border-radius:50%;border:1.5px solid rgba(255,255,255,.25);background:var(--panel);color:#fff;font-size:18px;cursor:pointer;font-family:inherit;font-weight:700}
.ib:active{transform:scale(.92)}
#zoom{right:12px;top:56px;width:84px;height:84px;border-radius:50%;border:3px solid #fff8;background:conic-gradient(var(--pink) 0%,var(--pink) var(--p,0%),rgba(32,22,58,.85) var(--p,0%));color:#fff;font-family:inherit;font-weight:800;font-size:13px;cursor:pointer;position:absolute;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.05;box-shadow:0 4px 18px #0007}
#zoom span{background:rgba(32,22,58,.86);border-radius:50%;width:64px;height:64px;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none}
#zoom.ready{animation:pulse .7s infinite alternate;border-color:#fff}
#zoom.on{background:conic-gradient(#ffd23f 0%,#ffd23f var(--p,0%),rgba(32,22,58,.85) var(--p,0%))}
@keyframes pulse{to{transform:scale(1.09);box-shadow:0 0 26px var(--pink)}}
#snackBar{left:12px;bottom:12px;display:flex;gap:6px;flex-wrap:wrap;max-width:560px;background:none;border:0;padding:0}
.chip{background:var(--panel);color:#fff;border-radius:999px;padding:2px 9px 2px 6px;font-size:13px;font-weight:700;border:1.5px solid rgba(255,255,255,.18);display:flex;gap:4px;align-items:center}
.chip.temp{border-color:var(--peach)} .chip.lives{border-color:#ffd23f}
#banner{position:absolute;left:0;right:0;top:150px;text-align:center;pointer-events:none;font-size:58px;font-weight:800;color:#fff;text-shadow:0 3px 0 var(--grape),0 0 22px #000a,3px 3px 0 var(--ink),-3px -3px 0 var(--ink),3px -3px 0 var(--ink),-3px 3px 0 var(--ink);opacity:0;transform:scale(.7)}
#banner small{display:block;font-size:22px;color:var(--peach);margin-top:-8px}
#banner.show{animation:ban 2.2s ease-out forwards}
#banner.boss{color:#ffb0b0;text-shadow:0 3px 0 #9a1a2a,0 0 24px #f00a,3px 3px 0 var(--ink),-3px -3px 0 var(--ink),3px -3px 0 var(--ink),-3px 3px 0 var(--ink)}
@keyframes ban{0%{opacity:0;transform:scale(.6)}15%{opacity:1;transform:scale(1.08)}25%{transform:scale(1)}75%{opacity:1}100%{opacity:0;transform:scale(1.05)}}
#toasts{position:absolute;left:50%;bottom:120px;transform:translateX(-50%);display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none}
.toast{background:var(--paper);color:var(--ink);border-radius:14px;padding:6px 16px;font-weight:800;font-size:17px;box-shadow:0 4px 14px #0006;border:2px solid var(--pink);animation:toast 3.2s forwards}
@keyframes toast{0%{opacity:0;transform:translateY(12px)}10%{opacity:1;transform:none}85%{opacity:1}100%{opacity:0;transform:translateY(-8px)}}

.screen{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(24,14,48,.58);backdrop-filter:blur(3px);color:#fff;padding:14px 24px;text-align:center}
.screen.clear{background:none;backdrop-filter:none}
.screen h2{margin:0 0 2px;font-size:34px;font-weight:800;text-shadow:0 3px 0 var(--grape),2px 2px 0 var(--ink),-2px -2px 0 var(--ink),2px -2px 0 var(--ink),-2px 2px 0 var(--ink)}
.screen .sub{margin:0 0 12px;font-size:17px;color:#ffe3c4;font-weight:600;max-width:700px;line-height:1.15}
.logo{font-size:84px;line-height:.86;font-weight:800;margin:0;color:#fff;letter-spacing:1px;text-shadow:0 6px 0 var(--grape),0 0 30px #ff8fb788,4px 4px 0 var(--ink),-4px -4px 0 var(--ink),4px -4px 0 var(--ink),-4px 4px 0 var(--ink)}
.logo span{display:block;font-size:56px;color:var(--pink)}
.tag{font-size:15px;color:#ffe3c4;font-weight:700;margin:8px 0 18px}
.btn{font-family:inherit;font-weight:800;font-size:22px;color:var(--ink);background:linear-gradient(#fff3c8,#ffc38a);border:3px solid var(--ink);border-radius:16px;padding:6px 26px;cursor:pointer;box-shadow:0 5px 0 var(--ink);margin:6px;transition:transform .06s}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 var(--ink)}
.btn.big{font-size:30px;padding:8px 44px;background:linear-gradient(#ffd0e4,#ff8fb7)}
.btn.small{font-size:16px;padding:3px 16px;border-radius:12px;box-shadow:0 3px 0 var(--ink)}
.btn.grey{background:linear-gradient(#f2eef8,#cfc4e0)}
.btn[disabled]{opacity:.45;pointer-events:none}
.row{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;align-items:center}
.cards{display:flex;gap:14px;justify-content:center;align-items:stretch}
.card{width:210px;background:var(--paper);color:var(--ink);border-radius:20px;border:3px solid var(--ink);box-shadow:0 6px 0 var(--ink),0 12px 24px #0006;padding:6px 10px 10px;cursor:pointer;position:relative;display:flex;flex-direction:column;align-items:center;transition:transform .12s;text-align:center}
.card:hover{transform:translateY(-6px) rotate(-1deg)} .card:active{transform:translateY(0)}
.card canvas{width:112px;height:112px;margin:-4px 0 -6px}
.card h3{margin:0;font-size:22px;line-height:1.05}
.card .role{font-size:13px;font-weight:800;color:#fff;background:var(--grape);border-radius:10px;padding:0 10px;margin:3px 0}
.card p{margin:3px 0 0;font-size:14px;line-height:1.15;font-weight:600;color:#4a3a5c}
.card .ttl{font-size:13px;color:#8a6aa8;font-weight:700}
.card .ribbon{position:absolute;top:-10px;right:-8px;background:#ff5d7a;color:#fff;font-weight:800;font-size:13px;padding:1px 10px;border-radius:10px;border:2px solid var(--ink);transform:rotate(6deg)}
.card.snack{width:190px;padding-top:12px}
.card.snack .ic{font-size:54px;line-height:1.1}
.card.snack .kind{font-size:12px;font-weight:800;border-radius:8px;padding:0 8px;margin-top:2px;color:#fff}
.k-perm{background:#3fa86b}.k-temp{background:#e0803a}.k-instant{background:#c0489a}
.hint{margin-top:12px;font-size:14px;color:#ffe3c4;font-weight:600}

.tower{display:flex;gap:26px;align-items:flex-start;justify-content:center}
.col{display:flex;flex-direction:column;gap:5px;align-items:stretch}
.col h4{margin:0 0 2px;font-size:16px;color:var(--peach)}
.slot{width:300px;height:50px;border-radius:14px;border:2.5px dashed #ffffff55;background:rgba(255,255,255,.07);display:flex;align-items:center;gap:8px;padding:0 10px 0 4px;color:#fff;cursor:pointer;text-align:left;position:relative}
.slot.has{border:2.5px solid #fff;background:rgba(255,248,239,.95);color:var(--ink)}
.slot.sel{outline:4px solid var(--pink);transform:scale(1.03)}
.slot.can{outline:4px solid #7dffb0}
.slot canvas{width:48px;height:48px;flex:none}
.slot b{font-size:17px;line-height:1}
.slot small{display:block;font-size:12px;font-weight:700;color:#7a5a98}
.slot .hp{height:6px;background:#d8cfe6;border-radius:4px;overflow:hidden;margin-top:2px;width:150px}
.slot .hp i{display:block;height:100%;background:#4fcf7a}
.slot .lv{margin-left:auto;font-size:17px;color:#e0a000;font-weight:800;letter-spacing:-1px}
.slot .base{position:absolute;right:8px;bottom:1px;font-size:10px;color:#9a7ab8}
.bench-slot{width:240px}

.dex{display:grid;grid-template-columns:repeat(10,1fr);gap:6px;width:900px}
.tile{background:rgba(255,248,239,.95);border-radius:12px;border:2px solid var(--ink);padding:2px;color:var(--ink);cursor:pointer;height:92px;display:flex;flex-direction:column;align-items:center;overflow:hidden}
.tile canvas{width:56px;height:56px;margin-top:-2px}
.tile b{font-size:12px;line-height:1}
.tile small{font-size:10px;color:#7a5a98;font-weight:700;line-height:1.05}
.tile.locked{background:rgba(120,100,160,.85);color:#fff}
.tile.locked small{color:#e8dcff}
.tile.sel{outline:3px solid var(--pink)}
.detail{margin-top:8px;min-height:52px;width:760px;background:var(--paper);color:var(--ink);border-radius:14px;border:3px solid var(--ink);padding:6px 14px;font-weight:700;font-size:15px;text-align:left;line-height:1.15}
.pbar{height:6px;width:80%;background:#0003;border-radius:4px;overflow:hidden;margin-top:1px}.pbar i{display:block;height:100%;background:var(--mint)}
.stats{display:grid;grid-template-columns:repeat(4,auto);gap:6px 26px;margin:8px 0 12px;font-weight:700;font-size:17px}
.stats b{display:block;font-size:28px;color:var(--peach);line-height:1}
.how{max-width:760px;text-align:left;font-size:17px;font-weight:600;line-height:1.2;background:rgba(0,0,0,.28);border-radius:16px;padding:10px 20px}
.how li{margin:3px 0}
.newcats{display:flex;gap:10px;justify-content:center;margin:6px 0 10px}
.newcats .card{width:150px;transform:scale(.9)}
.paused{font-size:64px}
@media (orientation:portrait) and (max-width:700px){body::after{content:'Turn your phone sideways for the best view';position:fixed;left:0;right:0;bottom:12px;text-align:center;color:#ffe3c4;font-weight:700;font-size:15px}}
</style>
</head>
<body>
<div id="app">
  <canvas id="cv" width="960" height="540"></canvas>
  <div id="hud">
    <div class="pill" id="waveBox"><b id="waveTxt">Wave 1</b><small id="themeTxt"></small><span id="nestPips"></span></div>
    <div class="pill" id="bossBar"><div class="nm" id="bossName">Nest</div><div class="bar"><i id="bossHp"></i></div></div>
    <div class="pill" id="tools">
      <button class="ib" id="bPause" title="Pause (P)">&#10074;&#10074;</button>
      <button class="ib" id="bSpeed" title="Speed (F)">x1</button>
      <button class="ib" id="bSound" title="Sound (M)">&#9835;</button>
    </div>
    <button id="zoom" title="Zoomies (Space)"><span>Zoomies<br><small id="zoomSub">0%</small></span></button>
    <div class="pill" id="snackBar"></div>
    <div id="banner"></div>
    <div id="toasts"></div>
  </div>
  <div id="screen"></div>
</div>
<script type="module" src="main.js"></script>
</body>
</html>
