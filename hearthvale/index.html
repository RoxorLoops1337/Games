<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#7fc8ee">
<title>Hearthvale</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ctext y='26' font-size='26'%3E%F0%9F%8F%A1%3C/text%3E%3C/svg%3E">
<script type="importmap">{ "imports": { "three": "./vendor/three.module.min.js", "three/addons/": "./vendor/jsm/" } }</script>
<link rel="stylesheet" href="style.css">
</head>
<body>
<canvas id="gl"></canvas>
<div id="popups"></div>
<canvas id="confetti"></canvas>
<div id="hud" hidden>
  <div id="bunting" hidden></div>
  <div id="top">
    <button id="card" aria-label="Your village">
      <span class="av"><svg viewBox="0 0 52 52" aria-hidden="true"><circle class="trk" cx="26" cy="26" r="22"/><circle class="arc" id="xparc" cx="26" cy="26" r="22" transform="rotate(-90 26 26)"/></svg><span class="face" id="pface"></span><b class="lv" id="plvl">1</b></span>
      <span class="cinfo"><b id="pname">Villager</b><small id="ptitle" hidden></small><span class="xpb"><i id="xpbar"></i></span></span>
      <span class="charm" id="pcharm"></span>
    </button>
    <div id="wallet">
      <button class="pill coin" id="pCoins" aria-label="Coins"><span class="gi"></span><b class="num">0</b></button>
      <button class="pill scr" id="pScrolls" aria-label="Scrolls"><span class="gi"></span><b class="num">0</b></button>
    </div>
  </div>
  <div id="strip"></div>
  <div id="tools"></div>
  <div id="left"><div id="festival" hidden></div><div id="track" hidden></div></div>
  <div id="toasts"></div>
  <div id="mini" hidden></div>
  <button id="quick" class="b b-gold" hidden aria-label="Send an idle villager to work"></button>
  <nav id="dock">
    <button id="bHome" class="rb alt" aria-label="Home" title="Home"></button>
    <button id="bVil" class="rb alt" aria-label="Villagers" title="Villagers"></button>
    <button id="bBuild" class="b b-green shine" aria-label="Build"></button>
    <button id="bValley" class="rb alt" aria-label="Valley" title="Valley"></button>
    <button id="bShop" class="rb alt" hidden aria-label="Travelling merchant" title="Merchant"></button>
  </nav>
  <div id="place" hidden><span id="placeName"></span><button id="placeOk" class="b b-green" data-snd="confirm"><span data-ic="tick" data-s="20"></span> Place</button><button id="placeNo" class="b b-red round" aria-label="Cancel" data-snd="back"><span data-ic="close" data-s="20"></span></button></div>
  <div id="photoBar" hidden><button id="phExit" class="rb alt" aria-label="Leave photo mode"></button><button id="phShot" class="shutter" aria-label="Take photo"></button><span id="phHint">Drag to look around</span></div>
  <div id="connb"></div>
</div>
<div id="scrim" hidden></div>
<section id="sheet" class="sheet" hidden role="dialog" aria-modal="true">
  <div class="grab" data-drag></div>
  <header class="sh-head" data-drag><span class="sh-ic"></span><span class="sh-tt"><b class="sh-title"></b><span class="sh-sub"></span></span><button class="x b b-red round" aria-label="Close" data-snd="none"></button></header>
  <nav class="sh-tabs" hidden></nav>
  <div class="sh-body"></div>
</section>
<div id="banners"></div>
<div id="over"></div>
<div id="tour" hidden></div>
<div id="fxl"></div>
<div id="title">
  <div class="sun"></div>
  <div class="cloud c1"></div><div class="cloud c2"></div><div class="cloud c3"></div><div class="cloud c4"></div>
  <div class="leaves"><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
  <div class="hills"><div class="hill h1"></div><div class="hill h2"></div><div class="hill h3"></div><div class="hflowers"></div><i class="tr t1"></i><i class="tr t2"></i><i class="tr t3 pink"></i><i class="tr t4 pink"></i><div class="cot"></div></div>
  <div class="tcard">
    <div class="logo"><span class="lf" data-ic="leaf" data-s="44"></span><span class="w1">Hearth</span><span class="w2">vale</span></div>
    <div class="tag">Build a cozy village. Share a valley with up to 15 friends.</div>
    <div class="tform">
      <div id="saveCard" hidden></div>
      <input id="nameIn" maxlength="16" placeholder="Your village name" autocomplete="off">
      <div class="row"><button id="goSolo" class="b b-green big shine"><span data-ic="sprout" data-s="30"></span><span id="goSoloT">Play solo</span></button><button id="goServer" class="b b-gold big"><span data-ic="players" data-s="30"></span><span>Join a server</span></button></div>
      <button id="goNew" class="b b-cream small-b" hidden>Start a new game</button>
      <input id="srvIn" placeholder="Server address, e.g. ws://192.168.1.5:7788" autocomplete="off" spellcheck="false">
      <div id="titleMsg"></div>
      <div class="fine">Original game inspired by cozy village builders. Solo play saves in your browser.</div>
    </div>
  </div>
</div>
<script type="module" src="js/main.js"></script>
</body>
</html>
