<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#7fc8ee">
<title>Hearthvale</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ctext y='26' font-size='26'%3E%F0%9F%8F%A1%3C/text%3E%3C/svg%3E">
<script type="importmap">{ "imports": { "three": "./vendor/three.module.min.js", "three/addons/": "./vendor/jsm/" } }</script>
<link rel="stylesheet" href="style.css">
</head>
<body>
<canvas id="gl"></canvas>
<div id="popups"></div>
<div id="hud" hidden>
  <div id="top">
    <div id="card"><div class="badge"><span data-ic="badge" data-s="46"></span><b id="plvl">1</b></div><div class="cinfo"><b id="pname">Villager</b><div class="bar"><i id="xpbar"></i></div></div></div>
    <div id="res"></div>
    <div id="tools"><button data-p="quests" title="Quests" aria-label="Quests"><span data-ic="quests" data-s="28"></span></button><button data-p="valley" title="Valley board" aria-label="Valley board"><span data-ic="scrolls" data-s="28"></span></button><button data-p="players" title="Villages" aria-label="Villages"><span data-ic="players" data-s="28"></span></button><button data-p="chat" title="Chat" aria-label="Chat"><span data-ic="chat" data-s="28"></span></button><button data-p="menu" title="Menu" aria-label="Menu"><span data-ic="menu" data-s="28"></span></button></div>
    <div id="track" hidden></div>
    <div id="toast"></div>
  </div>
  <div id="bottom">
    <button id="bBuild" class="big"><span data-ic="hammer" data-s="30"></span><span>Build</span></button>
    <button id="bHome" class="big alt round" title="Home" aria-label="Home"><span data-ic="house" data-s="32"></span></button>
    <button id="bValley" class="big alt round" title="Valley" aria-label="Valley"><span data-ic="valley" data-s="32"></span></button>
    <div id="conn"></div>
  </div>
  <div id="place" hidden><span id="placeName"></span><button id="placeOk" class="ok"><span data-ic="tick" data-s="20"></span> Place</button><button id="placeNo" class="no round" aria-label="Cancel"><span data-ic="close" data-s="20"></span></button></div>
  <div id="sheet" class="panel" hidden></div>
  <div id="panel" class="panel" hidden></div>
</div>
<div id="title">
  <div class="sun"></div>
  <div class="cloud c1"></div><div class="cloud c2"></div><div class="cloud c3"></div><div class="cloud c4"></div>
  <div class="leaves"><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
  <div class="hills"><div class="hill h1"></div><div class="hill h2"></div><div class="hill h3"></div><div class="hflowers"></div><i class="tr t1"></i><i class="tr t2"></i><i class="tr t3 pink"></i><i class="tr t4 pink"></i><div class="cot"></div></div>
  <div class="tcard">
    <div class="logo"><span class="lf" data-ic="leaf" data-s="44"></span><span class="w1">Hearth</span><span class="w2">vale</span></div>
    <div class="tag">Build a cozy village. Share a valley with up to 15 friends.</div>
    <div class="tform">
    <input id="nameIn" maxlength="16" placeholder="Your village name" autocomplete="off">
    <div class="row"><button id="goSolo" class="big"><span data-ic="sprout" data-s="30"></span><span>Play solo</span></button><button id="goServer" class="big alt"><span data-ic="players" data-s="30"></span><span>Join a server</span></button></div>
    <input id="srvIn" placeholder="Server address, e.g. ws://192.168.1.5:7788" autocomplete="off" spellcheck="false">
    <div id="titleMsg"></div>
    <div class="fine">Original game inspired by cozy village builders. Solo play saves in your browser.</div>
    </div>
  </div>
</div>
<script type="module" src="js/main.js"></script>
</body>
</html>
