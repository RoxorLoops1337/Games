<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hearthvale interface styles</title>
<style>
body{margin:0;font:600 15px system-ui,sans-serif;background:#1d2230;color:#eef}
header{position:sticky;top:0;z-index:5;display:flex;gap:10px;flex-wrap:wrap;align-items:center;padding:10px 16px;background:#0f1320;border-bottom:1px solid #334}
header select,header button{font:inherit;padding:6px 10px;border-radius:8px;border:1px solid #556;background:#242b40;color:#eef}
.grid{display:flex;flex-wrap:wrap;gap:22px;padding:20px;justify-content:center}
.card{width:234px}
.card h3{margin:0 0 2px;font-size:15px}.card small{display:block;opacity:.7;margin-bottom:8px;min-height:30px}
.frame{width:234px;height:480px;border-radius:22px;overflow:hidden;border:3px solid #556;position:relative;background:#000}
.frame iframe{position:absolute;left:0;top:0;width:390px;height:800px;border:0;transform:scale(.6);transform-origin:0 0}
.card a{color:#9cf;font-size:13px}
</style></head><body>
<header><b>Hearthvale interface styles</b>
<label>Scene <select id="scene"></select></label>
<span style="opacity:.7">Every style shows the same real game markup. Tap a button to feel its press.</span>
<a href="../index.html?solo" style="color:#9cf">Play the game</a> (then Settings, Interface style)</header>
<div class="grid" id="grid"></div>
<script type="module">
import { THEMES } from '../js/ui/theme.js';
const SCENES = ['hud', 'banner', 'build', 'building', 'valley', 'villagers', 'inventory', 'settings', 'levelup'];
const sel = document.getElementById('scene'); sel.innerHTML = SCENES.map((s) => `<option>${s}</option>`).join('');
const q = new URLSearchParams(location.search); sel.value = q.get('scene') || 'hud'; const only = q.get('only');
function draw() { const g = document.getElementById('grid'); g.innerHTML = THEMES.filter((t) => !only || only.split(',').includes(t.id)).map((t) => `<div class="card"><h3>${t.name}</h3><small>${t.tech}</small><div class="frame"><iframe loading="lazy" src="ui_sheet.html?ui=${t.id}&scene=${sel.value}" title="${t.name}"></iframe></div><a href="ui_sheet.html?ui=${t.id}&scene=${sel.value}" target="_blank">open full size</a></div>`).join(''); }
sel.onchange = draw; draw();
</script></body></html>
