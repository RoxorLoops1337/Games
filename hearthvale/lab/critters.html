<!doctype html><meta charset="utf-8"><title>Hearthvale critters, props, fx</title>
<style>
#ui{position:fixed;left:8px;top:8px;display:flex;flex-wrap:wrap;gap:4px;max-width:70vw;z-index:2;font:12px sans-serif}
#ui button{border:0;border-radius:6px;padding:4px 8px;background:#fffc;cursor:pointer}
#ui button.on{background:#ffd24a}
#hud{position:fixed;right:8px;top:8px;font:12px monospace;color:#223;background:#fffa;padding:4px 6px;border-radius:6px;z-index:2;white-space:pre}
</style>
<div id="ui"></div><div id="hud"></div>
<script type="importmap">{ "imports": { "three": "../vendor/three.module.min.js", "three/addons/": "../vendor/jsm/" } }</script>
<script type="module">
import * as THREE from 'three';
import { mountStage } from './stage.js';
import * as C from '../art/critters.js';
import * as PR from '../art/props.js';
import { Fx } from '../art/fx.js';

const q = new URLSearchParams(location.search), st = mountStage(), L = st.look;
const zoom = q.get('zoom'), sec = q.get('sec') || 'critters', night = +(q.get('night') || 0), LOD = q.get('lod') || undefined; let animMode = q.get('anim') || 'cycle';
const PRESET = { critters: { x: 0, z: 1.0, dist: zoom ? 6.5 : 22, pitch: zoom ? 0.4 : 0.8, yaw: 0.0 }, props: { x: 0, z: 31, dist: 26, pitch: 0.8, yaw: 0.0 }, fx: { x: 0, z: -31, dist: q.get('solo') ? 9 : 25, pitch: 0.7, yaw: 0.0 }, meadow: { x: 60, z: 0, dist: 30, pitch: 0.9, yaw: 0.5 }, sky: { x: 0, z: 0, y: 4, dist: 14, pitch: 0.3, yaw: 0.0 } }[sec] || {};
for (const k of ['x', 'z', 'y', 'dist', 'pitch', 'yaw']) if (!q.has(k) && PRESET[k] !== undefined) L[k] = PRESET[k];
const hud = document.getElementById('hud'), ui = document.getElementById('ui'); if (q.get('ui') === '0') { ui.style.display = 'none'; }
if (q.get('hud') === '0') hud.style.display = 'none';

// night
if (night) { PR.lampMat.emissiveIntensity = 2.2; PR.lanternMat.emissiveIntensity = 2.0; }
const fx = new Fx(st.scene); if (night) fx.setLight(0.4);

/* ------------------------------------------------------------ critters */
const crit = []; // {g, air}
const critGroup = new THREE.Group(); st.scene.add(critGroup);
const ALL = [['sheep', 9], ['chicken', 4], ['cow', 3], ['dog', 4], ['puppy', 4], ['cat', 4], ['kitten', 4], ['bunny', 4], ['duck', 3], ['duckling', 4], ['snail', 4], ['froggy', 3], ['lamb', 4], ['calf', 3], ['goat', 3], ['piglet', 3], ['horse', 3]];
const AIR = ['bird', 'butterfly', 'fish', 'bee'];
let rows = [];
if (zoom) { const n = q.has('n') ? +q.get('n') : 4; rows = zoom.split(',').map((k) => Array.from({ length: n }, (_, i) => [k, i])); }
else {
  const flat = []; for (const [k, n] of ALL) for (let i = 0; i < n; i++) flat.push([k, i]);
  for (let i = 0; i < flat.length; i += 10) rows.push(flat.slice(i, i + 10));
  rows.push([['bird', 0], ['bird', 1], ['bird', 2], ['butterfly', 0], ['butterfly', 1], ['butterfly', 2], ['fish', 0], ['fish', 1], ['bee', 0], ['bee', 1]]);
}
const mk = (k, a) => C.CRITTERS[k](a, LOD);
const sp = zoom ? 2.4 : 2.1, sc = 1;
rows.forEach((row, ri) => row.forEach(([k, a], ci) => {
  const g = mk(k, a), air = AIR.includes(k);
  g.position.set((ci - (row.length - 1) / 2) * sp * sc, air ? 0.9 : 0, (ri - (rows.length - 1) / 2) * 2.2 * sc); g.rotation.y = +(q.get('ry') || 0.4); g.scale.multiplyScalar(zoom ? 1.7 : 1); if (g.userData._a) g.userData._a.ph = (ri * 10 + ci) * 0.7;
  critGroup.add(g); crit.push({ g, air, k });
}));
// clouds (sky)
const clouds = [];
if (q.get('clouds') !== '0' && (sec === 'sky' || q.get('clouds'))) for (let i = 0; i < 5; i++) { const c = C.cloudModel(i); c.position.set((i - 2) * 6, 7 + (i % 2) * 1.2, -4 + (i % 3) * 3); c.scale.setScalar(1 + (i % 3) * 0.3); st.scene.add(c); clouds.push(c); }

/* ------------------------------------------------------------ props */
const props = []; const propGroup = new THREE.Group(); st.scene.add(propGroup);
const only = q.get('only'), names = only ? only.split(',') : Object.keys(PR.PROPS), cols = only ? Math.min(names.length, +(q.get('cols') || 5)) : 8, gap = only ? +(q.get('gap') || 2.6) : 3.0;
names.forEach((n, i) => {
  const g = n === 'bannerPole' ? PR.bannerPoleModel('#d9503d') : n === 'fence' ? PR.fenceModel(3) : n === 'lanternString' ? PR.lanternStringModel(3.2) : PR.PROPS[n]();
  g.position.set((i % cols - (cols - 1) / 2) * gap, 0, 31 + (Math.floor(i / cols) - (only ? (Math.ceil(names.length / cols) - 1) / 2 : 2)) * (only ? gap : 3.2)); g.userData.phase = i; propGroup.add(g); props.push({ g, n });
});

/* ------------------------------------------------------------ fx stations */
const FX = ['smoke', 'dust', 'sparkle', 'confetti', 'coinPop', 'leaf', 'splash', 'ring', 'hearts', 'heartsBurst', 'note', 'petal', 'star', 'mote', 'cheer', 'levelUp', 'build', 'harvest', 'craft', 'coinBurst', 'fireworks', 'rainbow', 'sparkleTrail', 'ripple', 'groundPulse'];
const solo = q.get('solo'), stations = (solo ? solo.split(',') : FX).map((n, i, arr) => (solo ? { n, x: (i - (arr.length - 1) / 2) * 5, z: -31 } : { n, x: (i % 5 - 2) * 3.6, z: -31 + (Math.floor(i / 5) - 2) * 4.6 }));
const fire = (n, x, z) => {
  const y = n === 'smoke' ? 1.2 : n === 'dust' || n === 'splash' || n === 'ring' || n === 'build' || n === 'levelUp' || n === 'harvest' || n === 'ripple' ? 0 : n === 'petal' ? 1.8 : n === 'star' ? 1.3 : n === 'cheer' ? 1.2 : n === 'coinBurst' ? 1.0 : 0.6;
  if (n === 'sparkle') fx.sparkle(x, y, z); else if (n === 'star') fx.star(x, y, z, '#ffd84a'); else if (n === 'ring') fx.ring(x, y, z, '#7fe0ff');
  else if (n === 'build') fx.build(x, y, z, 2, 2); else if (n === 'harvest') fx.harvest(x, y, z, ['#ffd84a', '#ff8f6f', '#b79cff'][(Math.random() * 3) | 0]);
  else if (n === 'coinBurst') fx.coinBurst(x, y, z, 10); else if (n === 'fireworks') fx.fireworks(x, 0.3, z); else if (n === 'rainbow') fx.rainbow(x, 0, z - 1, 0);
  else if (n === 'sparkleTrail') fx.sparkleTrail([x - 2, 0.6, z], { x: x + 2, y: 1.6, z }); else if (n === 'ripple') fx.ripple(x, 0, z); else if (n === 'groundPulse') fx.groundPulse(x, z, '#ffe27a'); else fx[n](x, y, z);
};
let sel = q.get('sel') || 'confetti';
FX.forEach((n) => { const b = document.createElement('button'); b.textContent = n; b.onclick = (e) => { sel = n; [...ui.children].forEach((c) => c.classList.toggle('on', c === b)); e.stopPropagation(); }; if (n === sel) b.className = 'on'; ui.appendChild(b); });
{ const mr = document.createElement('div'); mr.style.cssText = 'display:flex;gap:4px;width:100%'; for (const [lab, f] of [['slow-mo', () => { Fx.timeScale = Fx.timeScale === 1 ? 0.25 : 1; }], ['clear', () => Fx.clear()]]) { const b = document.createElement('button'); b.textContent = lab; b.onclick = (e) => { f(); e.stopPropagation(); }; mr.appendChild(b); } ui.appendChild(mr);
  const ar = document.createElement('div'); ar.style.cssText = 'display:flex;gap:4px;width:100%;flex-wrap:wrap'; for (const m of ['cycle', 'idle', 'walk', 'graze', 'eat', 'sleep', 'happy', 'follow', 'fly']) { const b = document.createElement('button'); b.textContent = 'anim:' + m; b.onclick = (e) => { animMode = m; e.stopPropagation(); }; ar.appendChild(b); } ui.appendChild(ar); }
// station platforms + labels via little pedestals
for (const s of stations) { const m = new THREE.Mesh(new THREE.CylinderGeometry(0.6, 0.7, 0.08, 12), new THREE.MeshStandardMaterial({ color: '#d9c493' })); m.position.set(s.x, 0.04, s.z); m.receiveShadow = true; st.scene.add(m); }
const ray = new THREE.Raycaster(), ndc = new THREE.Vector2(), plane = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0), hit = new THREE.Vector3(); let down = null;
addEventListener('pointerdown', (e) => { down = [e.clientX, e.clientY]; });
addEventListener('pointerup', (e) => { if (!down || Math.hypot(e.clientX - down[0], e.clientY - down[1]) > 5 || e.target.tagName === 'BUTTON') return; ndc.set((e.clientX / innerWidth) * 2 - 1, -(e.clientY / innerHeight) * 2 + 1); ray.setFromCamera(ndc, st.cam); if (ray.ray.intersectPlane(plane, hit)) fire(sel, hit.x, hit.z); });
const loopAll = q.get('fx') === 'all' || q.get('fx') === 'sync' || sec === 'fx'; let acc = 0, fxTimes = FX.map((_, i) => q.get('fx') === 'sync' ? 0.3 : i * 0.25);
const stepT = q.has('step') ? +q.get('step') : null;
if (stepT !== null) { for (const s of stations) fire(s.n, s.x, s.z); for (let i = 0; i < Math.round(stepT * 60); i++) fx.update(1 / 60); }
// night: add a lamp glow in the prop area
if (night) { const pl = new THREE.PointLight('#ffb84a', 8, 9); pl.position.set(0, 2, 31); st.scene.add(pl); }

/* ------------------------------------------------------------ meadow (game-camera scene) */
const MX = 60, meadow = [];
if (sec === 'meadow') { const gp = new THREE.Mesh(new THREE.PlaneGeometry(400, 400), new THREE.MeshStandardMaterial({ color: '#9ad464', roughness: 1 })); gp.rotation.x = -Math.PI / 2; gp.position.set(MX, -0.01, 0); gp.receiveShadow = true; st.scene.add(gp); }
if (sec === 'meadow' || q.get('meadow')) {
  const fenceN = [[-7, -6, 0], [0, -6, 0], [7, -6, 0], [-7, 6, 0], [0, 6, 0], [7, 6, 0]]; for (const [x, z] of fenceN) { const f = PR.fenceModel(7); f.position.set(MX + x, 0, z); st.scene.add(f); }
  for (const s of [-1, 1]) for (const z of [-3, 0, 3]) { const f = PR.fenceModel(3); f.rotation.y = Math.PI / 2; f.position.set(MX + s * 10.5, 0, z); st.scene.add(f); }
  const place = (m, x, z, ry = 0) => { m.position.set(MX + x, 0, z); m.rotation.y = ry; st.scene.add(m); return m; };
  place(PR.hayBaleModel(), 6, -4, 0.3); place(PR.hayBaleModel(), 7.2, -3.4, -0.2); place(PR.wellModel(), -7.5, 3.5); place(PR.cartModel(), -6, -3.5, 0.6); place(PR.crateModel(), 8, 3.5, 0.2); place(PR.barrelModel(), 8.9, 4.4);
  place(PR.scarecrowModel(), 3, 4); place(PR.lampPostModel(), -3, 4.5); place(PR.campfireModel(), -9, -1); place(PR.tentModel(), -9.2, 1.2, 1.57); place(PR.benchModel(), 4.5, -5, 0); place(PR.flowerPotModel(), 2, -5); place(PR.logPileModel(), -4, -5, 0); place(PR.sackModel(), 0.5, -5.2);
  place(PR.signpostModel(['Farm', 'Mill']), 10, 0, -0.5); place(PR.bannerPoleModel('#4f86c6'), -10, 5, 0); place(PR.chestModel(), 9.2, -4.3, -0.5); place(PR.stonePileModel(), -2, 5.2); place(PR.beehiveModel(), 5.5, 5, 0.3); place(PR.mailboxModel(), -9.5, -5); place(PR.coinPileModel(), 3.5, 1.5);
  for (let i = 0; i < 9; i++) { const m = C.sheepModel(i); m.position.set(MX + Math.cos(i * 0.7) * 5, 0, Math.sin(i * 0.7) * 3); m.userData.w = { tx: m.position.x, tz: m.position.z, wait: Math.random() * 3, mode: 'idle' }; st.scene.add(m); meadow.push(m); }
  for (let i = 0; i < 4; i++) { const m = C.chickenModel(i); m.position.set(MX - 2 + i * 1.1, 0, 2 + (i % 2)); m.userData.w = { tx: m.position.x, tz: m.position.z, wait: Math.random() * 3, mode: 'graze' }; st.scene.add(m); meadow.push(m); }
  for (const [k, a, x, z] of [['cow', 0, 4, -1], ['cow', 1, -1, -3], ['dog', 0, 1, 1], ['cat', 0, 7, 1], ['bunny', 0, -5, 0], ['duck', 0, 0, 2.5]]) { const m = C[k + 'Model'](a); m.position.set(MX + x, 0, z); m.userData.w = { tx: m.position.x, tz: m.position.z, wait: Math.random() * 3, mode: 'idle' }; st.scene.add(m); meadow.push(m); }
  for (let i = 0; i < 8; i++) { const m = C.butterflyModel(['#ff8fb3', '#ffd24a', '#7fb8ff'][i % 3]); m.userData.fly = { cx: MX + Math.cos(i) * 6, cz: Math.sin(i * 2) * 4, ph: i }; st.scene.add(m); meadow.push(m); }
  for (let i = 0; i < 3; i++) { const m = C.birdModel(i); m.userData.fly = { cx: MX + i * 4 - 4, cz: -2 + i, ph: i * 2, high: 3 }; st.scene.add(m); meadow.push(m); }
  for (let i = 0; i < 2; i++) { const m = C.beeModel(); m.userData.fly = { cx: MX + 5 + i, cz: 5, ph: i * 3, small: 1 }; st.scene.add(m); meadow.push(m); }
  for (let i = 0; i < 4; i++) { const c = C.cloudModel(i + 7); c.position.set(MX + (i - 1.5) * 14, 20 + (i % 2) * 3, -10 + i * 4); c.scale.setScalar(2.2); st.scene.add(c); clouds.push(c); }
}

/* ------------------------------------------------------------ tick */
const tri = (o) => C.triCount(o);
let hudDone = false;
st.onTick((dt, t) => {
  const MODES = ['idle', 'walk', 'graze', 'eat', 'sleep', 'happy', 'follow', 'fly'], cyc = ((t / 3.2) | 0) % MODES.length, mode = animMode === 'cycle' ? MODES[cyc] : animMode;
  for (const c of crit) C.animateCritter(c.g, mode, t, 1);
  for (const c of clouds) { C.animateCritter(c, 'idle', t, 1); }
  for (const p of props) PR.animateProp(p.g, t, { open: 0.5 + 0.5 * Math.sin(t * 1.2) });
  for (const p of props) { if (p.n === 'cart' || p.n === 'flowerCart') { p.g.getObjectByName('wheelL').rotation.x = p.g.getObjectByName('wheelR').rotation.x = t * 2; } }
  // meadow wander
  for (const m of meadow) {
    const w = m.userData.w, f = m.userData.fly;
    if (w) {
      w.wait -= dt; const dx = w.tx - m.position.x, dz = w.tz - m.position.z, d = Math.hypot(dx, dz);
      if (d > 0.1) { const sp = m.userData.critter === 'dog' ? 2.2 : 0.9; m.position.x += (dx / d) * dt * sp; m.position.z += (dz / d) * dt * sp; m.rotation.y += (Math.atan2(dx, dz) - m.rotation.y + Math.PI * 3) % (Math.PI * 2) > Math.PI ? 0 : 0; m.rotation.y = Math.atan2(dx, dz); w.mode = 'walk'; }
      else if (w.wait <= 0) { w.wait = 2 + Math.random() * 4; const r = Math.random(); w.mode = r < 0.5 ? 'idle' : 'graze'; if (Math.random() < 0.6) { w.tx = MX + (Math.random() - 0.5) * 17; w.tz = (Math.random() - 0.5) * 9; } }
      else if (w.mode === 'walk') w.mode = 'idle';
      C.animateCritter(m, w.mode, t, m.userData.critter === 'dog' ? 1.3 : 1);
    } else if (f) {
      const a = t * 0.5 + f.ph; m.position.set(f.cx + Math.cos(a) * 2, (f.high || 0) + (f.small ? 1.2 : 1) + Math.sin(a * 1.7) * 0.4, f.cz + Math.sin(a) * 2); m.rotation.y = -a + Math.PI; C.animateCritter(m, 'fly', t, 1);
    }
  }
  for (const c of clouds) if (sec === 'meadow') { c.position.x += dt * 0.8; if (c.position.x > MX + 60) c.position.x = MX - 60; }
  // fx loop
  if (loopAll && stepT === null) { for (let i = 0; i < stations.length; i++) { fxTimes[i] -= dt; if (fxTimes[i] <= 0) { fxTimes[i] = n2(stations[i].n); fire(stations[i].n, stations[i].x, stations[i].z); } } }
  fx.update(stepT === null ? dt : 0);
  if (!hudDone || ((t * 2) | 0) % 2 === 0) { hud.textContent = `mode ${mode}  fx particles ${fx.count}  click: ${sel}`; hudDone = true; }
});
function n2(n) { if (q.get('fx') === 'sync') return 2; return n === 'smoke' ? 1.1 : n === 'sparkle' ? 1.3 : n === 'mote' ? 1.5 : n === 'note' ? 1.0 : 2.2; }
window.__fx = fx; window.__tris = Object.fromEntries([...crit.map((c) => [c.k + '_' + c.g.userData.critter, tri(c.g)]), ...props.map((p) => [p.n, tri(p.g)])]);
st.ready();
</script>
