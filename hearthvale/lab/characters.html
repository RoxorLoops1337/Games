<!doctype html><meta charset="utf-8"><title>Villager lab</title>
<script type="importmap">{ "imports": { "three": "../vendor/three.module.min.js", "three/addons/": "../vendor/jsm/" } }</script>
<style>
#hud{position:fixed;left:8px;bottom:6px;font:12px/1.3 monospace;color:#234;background:#fff8;padding:3px 6px;border-radius:6px;pointer-events:none;white-space:pre}
#ui{position:fixed;left:8px;top:6px;display:flex;flex-direction:column;gap:3px;z-index:2;font:11px sans-serif;max-width:60vw}
#ui .row{display:flex;flex-wrap:wrap;gap:3px;align-items:center}
#ui b{background:#fff9;border-radius:5px;padding:2px 5px}
#ui button{border:0;border-radius:6px;padding:3px 7px;background:#fffc;cursor:pointer}
#ui button.on{background:#ffd24a}
</style>
<div id="ui"></div><div id="hud"></div>
<script type="module">
import * as K from '../art/artkit.js'; import { mountStage } from './stage.js'; import { P } from '../art/palette.js';
import { setVillagerLight, villagerModel, setPose, setMood, setEmote, setCarry, randomVillager, PROFESSIONS, triangles, POSES, MOODS, EMOTES, CARRY_KINDS } from '../art/characters.js';
const q = new URLSearchParams(location.search); const st = mountStage();
const anims = []; let maxTri = 0, sumTri = 0, n = 0;
let LOD = q.get('lod') || undefined; if (+q.get('night')) setVillagerLight(0.3);
const state = { pose: q.get('pose') || null, mood: q.get('mood') || null, emote: q.get('emote') || null, carry: q.get('carry') || null };
function put(g, x, z, pose = 'idle', ph = 0) { st.add(g, x, z); anims.push({ g, pose, ph }); const t = triangles(g); maxTri = Math.max(maxTri, t); sumTri += t; n++; return g; }
const V = (c, h, o = {}) => villagerModel(c, h, { lod: LOD, ...o });
const TOOLS = ['none', 'axe', 'pick', 'hoe', 'hammer', 'ladle', 'scroll', 'basket'];
if (q.get('gears')) {
  // every hair / headwear style once (skins cycle), to judge each silhouette
  const GL = ['short', 'messy', 'bun', 'twinbuns', 'topknot', 'pigtails', 'long', 'bob', 'afro', 'afroPuffs', 'curly', 'braids', 'baldcap', 'turban', 'headscarf', 'straw', 'cap', 'hood', 'bandana', 'chef', 'flowers', 'crown', 'beanie', 'elf', 'hard'];
  GL.forEach((gr, i) => put(V('#e8564a', 3 + i * 4, { gear: gr, skin: i % 5, seed: i, age: 'adult', tool: 'none', build: 'normal' }), ((i % 9) - 4) * 1.4, Math.floor(i / 9) * 1.7 - 1.7, 'idle', i));
  if (!q.has('dist')) st.look.dist = 11; if (!q.has('pitch')) st.look.pitch = 0.5;
} else if (q.get('skins')) {
  // 5 skin tones x 3 hair/hat looks, same face grammar: judge warmth and brightness of every tone
  for (let r = 0; r < 3; r++) for (let k = 0; k < 5; k++) put(V('#e8564a', 5 + r * 13, { skin: k, seed: 5 + r * 13, tool: 'none', gear: ['short', 'afro', 'turban'][r], age: 'adult', build: 'normal' }), (k - 2) * 1.5, r * 1.6 - 1.6, 'idle', k + r);
  if (!q.has('dist')) st.look.dist = 9; if (!q.has('pitch')) st.look.pitch = 0.5;
} else if (q.get('div')) {
  // diversity: 40 villagers of ONE village (single owner colour, like the game), 2 rows of 20. Camera: ?pitch=0.9&dist=26 = game; ?pitch=1.5 = top-down.
  const cnt = +(q.get('n') || 40), per = Math.ceil(cnt / 2), poses = ['idle', 'walk', 'work', 'idle', 'cheer'], off = +(q.get('off') || 0);
  for (let i = 0; i < cnt; i++) { const id = i + off, tl = TOOLS[(id * 5) % 8]; const g = V('#e8564a', (id * 37 + 11) % 100, { tool: tl, seed: (id * 37 + 11) % 100 }); put(g, ((i % per) - (per - 1) / 2) * 1.35, Math.floor(i / per) * 1.8 - 0.9, poses[id % 5], id * 0.7); }
  if (!q.has('dist')) st.look.dist = 15; if (!q.has('pitch')) st.look.pitch = 0.35;
} else if (q.get('game')) {
  // game-camera test: a little plaza with houses and 40 busy villagers
  for (const [x, z, c] of [[-6, -5, P.roofRed], [0, -6, P.roofBlue], [6, -5, P.roofOrange], [-7, 4, P.roofTeal], [7, 5, P.roofPurple]]) st.add(K.group(K.rbox(2.4, 1.2, 2.4, P.plasterWarm), K.gable(2.8, 1.1, 2.7, c, 0, 1.2)), x, z);
  const poses = ['walk', 'work', 'idle', 'carry', 'cheer', 'walk'];
  for (let i = 0; i < 40; i++) { const a = i * 2.4, r = 2 + (i % 7) * 1.5; const g = randomVillager(i + 3, P.outfit[i % 8], { lod: LOD }); g.rotation.y = a; if (i % 4 === 3) setCarry(g, CARRY_KINDS[(i >> 2) % 5]); put(g, Math.cos(a) * r, Math.sin(a * 1.3) * r * 0.8, poses[i % 6], i * 0.7); }
  if (!q.has('dist')) st.look.dist = 30; if (!q.has('pitch')) st.look.pitch = 0.9;
} else if (q.get('lods')) {
  // the same villagers at low / mid / high, side by side (rows = 3 looks)
  const only = q.has('r') ? +q.get('r') : -1;
  for (let r = 0; r < 3; r++) if (only < 0 || only === r) ['low', 'mid', 'high'].forEach((l, k) => { const g = villagerModel('#e8564a', +(q.get('hat') || 7) + r * 19, { lod: l, seed: +(q.get('hat') || 7) + r * 19, tool: TOOLS[(r * 3 + 1) % 8], age: 'adult', build: 'normal' }); put(g, (k - 1) * 1.7, only < 0 ? r * 1.9 - 1.9 : 0, q.get('pose') || 'idle', r + k); });
  if (!q.has('dist')) st.look.dist = 8; if (!q.has('pitch')) st.look.pitch = 0.4;
} else {
  const sec = q.get('sec'); const on = (k) => !sec || sec === k; const Z = (k, z) => (sec ? 0 : z);
  // 1. line-up of 24
  if (on('line')) for (let i = 0; i < 24; i++) { const g = randomVillager(i * 5 + 1, P.outfit[i % 8], { lod: LOD }); put(g, ((i % 12) - 5.5) * 1.3, Math.floor(i / 12) * 1.5, 'idle', i * 0.9); }
  // 2. poses (every pose once)
  if (on('pose')) POSES.forEach((p, i) => put(V(P.outfit[i % 8], +(q.get('hat') || 11) + i * 7, { tool: p === 'work' ? 'axe' : 'none' }), q.get('strip') ? (i - (POSES.length - 1) / 2) * 1.35 : ((i % 6) - 2.5) * 1.6, Z('pose', 6) + (q.get('strip') ? 0 : Math.floor(i / 6) * 1.9), p, i));
  // 3. tools
  if (on('tools')) TOOLS.forEach((tl, i) => put(V(P.outfit[i], 20 + i * 9, { tool: tl }), (i - 3.5) * 1.5, Z('tools', 9), tl === 'none' ? 'idle' : 'work', i));
  // 4. children and elders
  if (on('age')) { for (let i = 0; i < 5; i++) put(V(P.outfit[i + 1], 30 + i * 11, { age: 'child', tool: TOOLS[i + 1] }), (i - 5) * 1.25 - 0.3, Z('age', 12), 'idle', i);
  for (let i = 0; i < 5; i++) put(V(P.outfit[i + 2], 40 + i * 9, { age: 'elder', tool: i === 4 ? 'scroll' : 'none' }), i * 1.25 + 0.8, Z('age', 12), 'idle', i); }
  // 5. moods x faces
  if (on('mood')) MOODS.forEach((m, i) => [0, 1, 2].forEach((f, j) => { const g = V(P.outfit[(i + j) % 8], 3 + f * 10 + j, {}); setMood(g, m); put(g, ((i * 3 + j) % 9 - 4) * 1.3, Z('mood', 15) + Math.floor((i * 3 + j) / 9) * 1.8, 'idle', i + j); }));
  // 6. professions
  if (on('prof')) PROFESSIONS.forEach((p, i) => put(V(P.outfit[i], 50 + i * 3, { tool: p.tool }), (i - 3.5) * 1.5, Z('prof', 18), 'work', i));
  // 7. emotes (each bubble once)
  if (on('emote')) EMOTES.forEach((e, i) => { const g = V(P.outfit[i], 60 + i * 5, {}); setEmote(g, e); put(g, (i - 3.5) * 1.5, Z('emote', 21), 'idle', i); });
  // 8. loads (carry)
  if (on('carry')) CARRY_KINDS.forEach((k, i) => { const g = V(P.outfit[i], 70 + i * 5, {}); setCarry(g, k); put(g, (i - 2) * 1.6, Z('carry', 24), 'carry', i); });
  if (!q.has('dist')) st.look.dist = 20;
}
if (q.has('focus') && anims[+q.get('focus')]) { const f = anims[+q.get('focus')].g.position; st.look.x = f.x; st.look.z = f.z; st.look.y = +(q.get('fy') || 0.7); }
const ui = document.getElementById('ui');
function row(label, items, cur, on) {
  const r = document.createElement('div'); r.className = 'row'; const b = document.createElement('b'); b.textContent = label; r.appendChild(b);
  for (const it of items) { const btn = document.createElement('button'); btn.textContent = it; btn.onclick = (e) => { on(it); [...r.querySelectorAll('button')].forEach((x) => x.classList.toggle('on', x === btn)); e.stopPropagation(); }; if (it === cur) btn.className = 'on'; r.appendChild(btn); } ui.appendChild(r);
}
if (q.get('ui') !== '0') {
  row('pose', POSES, state.pose, (p) => { state.pose = p; for (const a of anims) a.pose = p; });
  row('mood', MOODS, state.mood, (m) => { state.mood = m; for (const a of anims) setMood(a.g, m); });
  row('emote', ['none', ...EMOTES], state.emote, (e) => { state.emote = e; for (const a of anims) setEmote(a.g, e); });
  row('carry', CARRY_KINDS, state.carry, (k) => { state.carry = k; for (const a of anims) { setCarry(a.g, k); a.pose = 'carry'; } });
  const lodRow = document.createElement('div'); lodRow.className = 'row'; lodRow.innerHTML = '<b>lod</b> (reload)'; for (const l of ['low', 'mid', 'high']) { const a = document.createElement('button'); a.textContent = l; a.onclick = () => { const u = new URL(location.href); u.searchParams.set('lod', l); location.href = u; }; if (l === (LOD || 'mid')) a.className = 'on'; lodRow.appendChild(a); } ui.appendChild(lodRow);
}
if (state.pose) for (const a of anims) a.pose = state.pose;
if (state.mood) for (const a of anims) setMood(a.g, state.mood);
if (state.emote && state.emote !== 'none') for (const a of anims) setEmote(a.g, state.emote);
if (state.carry) for (const a of anims) { setCarry(a.g, state.carry); if (!state.pose) a.pose = 'carry'; }
const fr = q.has('t') ? +q.get('t') : null;
st.onTick((dt, t) => { const tt = fr ?? t + 1; for (const a of anims) setPose(a.g, a.pose, tt, a.ph); });
document.getElementById('hud').textContent = q.get('hud') === '0' ? '' : `villagers ${n}  lod ${LOD || 'mid'}  tris max ${Math.round(maxTri)} avg ${Math.round(sumTri / n)}`;
if (q.get('hud') === '0') document.getElementById('hud').style.display = 'none';
if (q.get('ui') === '0') ui.style.display = 'none';
window.__tris = { max: maxTri, avg: sumTri / n }; window.__lab = { st, anims };
st.ready();
</script>
