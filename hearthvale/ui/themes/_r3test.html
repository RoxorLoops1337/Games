<!doctype html><html><head><meta charset="utf-8"><title>r3 test</title>
<style>body{margin:0;background:#8fcf6a;font:12px sans-serif;padding:8px}.g{display:flex;flex-wrap:wrap;gap:6px;align-items:flex-start}.g img{zoom:2}h4{margin:6px 0 2px}</style></head><body>
<div id="o"></div>
<script type="module">
import {renderAll} from './render3d.js';
const o=document.getElementById('o'); const fams={};
const q=new URLSearchParams(location.search); const only=q.get('only')?q.get('only').split(','):undefined;
const t0=performance.now();
await renderAll({only,onSprite:(k,v,r)=>{ if(!v.startsWith('url'))return; const m=k.match(/--r3-(\w+?)-/)[1]; (fams[m]??=(()=>{const h=document.createElement('h4');h.textContent=m;o.append(h);const d=document.createElement('div');d.className='g';o.append(d);return d})()).append(Object.assign(document.createElement('img'),{src:v.slice(5,-2),title:k}));}});
document.title='done '+Math.round(performance.now()-t0);
window.__ready=true;
</script></body></html>
