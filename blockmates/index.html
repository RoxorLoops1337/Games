<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Blockmates</title>
<meta name="description" content="A cozy 2D block-building sandbox for up to 16 friends. Dig, craft, build, trade and explore together.">
<meta name="theme-color" content="#3c9cf0">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%278%27 fill=%27%235fb844%27/%3E%3Crect x=%277%27 y=%277%27 width=%2718%27 height=%2718%27 rx=%276%27 fill=%27%23ffd9b5%27/%3E%3Crect x=%2711%27 y=%2713%27 width=%273%27 height=%275%27 fill=%27%23222%27/%3E%3Crect x=%2718%27 y=%2713%27 width=%273%27 height=%275%27 fill=%27%23222%27/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --wood:#9a6a3a; --wood-d:#6b4423; --wood-l:#c28e52; --paper:#f6e6bf; --paper-d:#e5c98c; --ink:#3a2512; --pop:#ffcf4a; --good:#5fc24a; --bad:#e2574c;
  --font:'Fredoka','Trebuchet MS','Segoe UI',system-ui,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#0b1020;font-family:var(--font);color:var(--ink);user-select:none;-webkit-user-select:none;touch-action:none}
canvas#game{position:fixed;inset:0;width:100%;height:100%;display:block;outline:none;cursor:crosshair}
#hud{position:fixed;inset:0;pointer-events:none;display:none}
body.playing #hud{display:block}
body.playing #menu{display:none}
#hud *{pointer-events:auto}
#hud .vitals,#hud .clock,#hud .mapbox,#hud .toast,#hud .status,#hud .tip,#hud .death,#hud .touchpad,#hud .touchpad *{pointer-events:none}
#hud .touchpad button{pointer-events:auto}
.vitals{position:absolute;left:14px;top:12px;filter:drop-shadow(0 2px 2px rgba(0,0,0,.5))}
.vitals .row{display:flex;gap:1px;min-height:18px;margin-bottom:2px}
.vitals img{width:18px;height:18px;image-rendering:auto}
.clock{position:absolute;right:14px;top:128px;background:rgba(20,14,30,.55);color:#fff;border-radius:10px;padding:3px 10px;font-weight:600;font-size:13px;letter-spacing:.3px}
.mapbox{position:absolute;right:12px;top:12px;border:3px solid var(--wood-d);border-radius:12px;overflow:hidden;box-shadow:0 3px 10px rgba(0,0,0,.5);background:#000;width:180px;height:110px}
.mapbox canvas{display:block;width:180px;height:110px;image-rendering:pixelated}
.hotbar{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);display:flex;gap:4px;padding:6px;background:linear-gradient(#b98450,#8a5a2e);border:3px solid var(--wood-d);border-radius:14px;box-shadow:0 4px 14px rgba(0,0,0,.5)}
.slot{position:relative;width:48px;height:48px;border-radius:9px;background:linear-gradient(#e9d3a3,#d6b87c);border:2px solid #8a6a3a;box-shadow:inset 0 2px 3px rgba(255,255,255,.5),inset 0 -3px 4px rgba(0,0,0,.18)}
.slot img{position:absolute;inset:3px;width:40px;height:40px;pointer-events:none;image-rendering:auto;filter:drop-shadow(0 2px 1px rgba(0,0,0,.35))}
.slot .cnt{position:absolute;right:3px;bottom:1px;font-weight:700;font-size:13px;color:#fff;text-shadow:0 0 3px #000,0 1px 1px #000,1px 0 1px #000}
.slot .key{position:absolute;left:4px;top:1px;font-size:10px;font-weight:600;color:rgba(60,35,10,.7)}
.slot .dur{position:absolute;left:5px;right:5px;bottom:3px;height:4px;background:rgba(0,0,0,.45);border-radius:2px;display:none}
.slot .dur i{display:block;height:100%;border-radius:2px}
.slot.sel{outline:3px solid var(--pop);outline-offset:1px;transform:translateY(-3px);transition:transform .08s}
.slot.pick{outline:3px solid #4ad8ff;outline-offset:1px}
.slot.arm::before{content:attr(data-ph);position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:10px;color:rgba(60,35,10,.4);font-weight:600}
.slot.hot{border-color:#b8872e}
.chat{position:absolute;left:12px;bottom:78px;width:min(440px,60vw)}
.chat .log{max-height:200px;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end;pointer-events:none}
.chat.open .log{pointer-events:auto;overflow-y:auto;background:rgba(10,8,20,.45);border-radius:10px;padding:4px}
.msg{color:#fff;font-size:14px;line-height:1.35;text-shadow:0 1px 2px #000,0 0 3px #000;padding:1px 6px;transition:opacity 1s}
.msg b{color:var(--pop)}.msg.sys{color:#bfe8ff;font-style:italic}.msg.old{opacity:0}
.chatin{display:none;width:100%;margin-top:4px;padding:8px 12px;border-radius:10px;border:2px solid var(--wood-d);background:rgba(255,250,235,.95);font:inherit;font-size:15px;color:var(--ink);outline:none;pointer-events:auto}
.chat.open .chatin{display:block}
.feed{position:absolute;left:14px;top:96px;display:flex;flex-direction:column;gap:3px;pointer-events:none}.feedrow{display:flex;align-items:center;gap:6px;color:#fff;font-weight:500;font-size:14px;text-shadow:0 1px 3px #000;background:rgba(20,14,30,.5);border-radius:10px;padding:2px 10px 2px 4px;animation:feedin .2s ease-out;transition:opacity .5s,transform .5s}.feedrow img{width:22px;height:22px}.feedrow b{color:var(--pop)}.feedrow.gone{opacity:0;transform:translateX(-14px)}@keyframes feedin{from{opacity:0;transform:translateX(-14px)}}
.toast{position:absolute;left:50%;top:70px;transform:translate(-50%,-14px);opacity:0;background:rgba(20,14,30,.8);color:#fff;padding:8px 18px;border-radius:14px;font-weight:600;transition:all .25s}
.toast.on{opacity:1;transform:translate(-50%,0)}
.status{position:absolute;left:50%;top:40%;transform:translateX(-50%);color:#fff;font-size:22px;font-weight:600;text-shadow:0 2px 4px #000}
.playerlist{position:absolute;left:50%;top:60px;transform:translateX(-50%);min-width:300px;background:linear-gradient(#f6e6bf,#e5c98c);border:3px solid var(--wood-d);border-radius:14px;padding:10px 16px;display:none;box-shadow:0 6px 18px rgba(0,0,0,.5)}
.playerlist.on{display:block}
.playerlist h3{margin:0 0 6px;font-size:18px}.playerlist h3 small{opacity:.6;font-weight:500}
.pl{display:flex;align-items:center;gap:10px;padding:2px 0;border-top:1px dashed rgba(90,60,30,.3)}.pl span{margin-left:auto;opacity:.6;font-size:13px}.pl canvas{width:26px;height:34px}
.tip{position:fixed;display:none;background:rgba(25,16,10,.92);color:#fff;border:1px solid #ffcf4a;border-radius:8px;padding:6px 10px;font-size:13px;line-height:1.4;z-index:50;max-width:240px}
.tip.on{display:block}
.hovertip{position:fixed;display:none;pointer-events:none;background:rgba(20,14,30,.78);color:#fff;border-radius:8px;padding:3px 9px;font-size:13px;font-weight:500;z-index:40;white-space:nowrap}
.panel{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);display:flex;gap:18px;padding:18px 22px;background:linear-gradient(#f6e6bf,#e5c98c);border:4px solid var(--wood-d);border-radius:20px;box-shadow:0 12px 40px rgba(0,0,0,.6);max-height:92vh;max-width:96vw}
.panel.hidden,.modal.hidden,.death.hidden{display:none}
.panel .col{display:flex;flex-direction:column;gap:6px}
.panel h3{margin:0;font-size:18px}
.panel .grid{display:grid;grid-template-columns:repeat(10,48px);gap:4px}
.panel .grid.chest{grid-template-columns:repeat(8,48px);margin-bottom:8px}
.panel .armor{display:flex;gap:6px;align-items:center}.armsum{margin-left:10px;font-weight:600}
.panel .hint{font-size:12px;opacity:.7;margin:4px 0 0;max-width:500px}
.panel .x{position:absolute;right:8px;top:6px;border:0;background:none;font-size:28px;line-height:1;cursor:pointer;color:var(--wood-d);font-family:inherit}
.craft{width:340px;min-width:300px}
.craft .tools{display:flex;gap:4px;flex-wrap:wrap}
.craft .tools input{flex:1 1 100%;padding:6px 10px;border-radius:8px;border:2px solid #8a6a3a;background:#fff8e4;font:inherit;outline:none}
.craft .tools button{border:2px solid #8a6a3a;background:#e9d3a3;border-radius:8px;padding:2px 9px;font:inherit;font-size:13px;cursor:pointer;color:var(--ink)}
.craft .tools button.on{background:var(--pop)}
.goal{position:absolute;left:50%;top:10px;transform:translateX(-50%);max-width:min(620px,70vw);background:rgba(20,14,30,.62);color:#fff;border-radius:14px;padding:6px 14px;font-size:14px;font-weight:500;pointer-events:none;text-align:center;text-shadow:0 1px 2px #000}.goal small{color:var(--pop);font-weight:700;margin-right:6px}.goal i{opacity:.55;font-size:11px}
.bossbar{position:absolute;left:50%;top:56px;transform:translateX(-50%);width:min(420px,70vw);text-align:center;color:#fff;font-weight:700;text-shadow:0 2px 3px #000;display:none;pointer-events:none}.bossbar.on{display:block}.bossbar div{height:14px;border-radius:8px;background:rgba(0,0,0,.6);border:2px solid #fff;overflow:hidden}.bossbar i{display:block;height:100%;background:linear-gradient(#ff7a3a,#d0301a)}
.card.wide{max-width:96vw}.card.wide canvas{width:min(1500px,88vw);min-width:min(600px,88vw);image-rendering:pixelated;border:3px solid var(--wood-d);border-radius:10px;background:#000}
.tradecols{display:flex;gap:18px}.tcol{padding:8px;border-radius:12px;background:rgba(255,255,255,.35);border:3px solid transparent}.tcol.ok{border-color:var(--good)}.panel .grid.three{grid-template-columns:repeat(3,48px)}.emotes{display:flex;gap:8px;flex-wrap:wrap;max-width:360px}.emotes button{width:56px;height:56px;border-radius:14px;border:3px solid var(--wood-d);background:linear-gradient(#fff8e4,#f0dca8);font:inherit;font-size:24px;cursor:pointer}.emotes button:hover{background:var(--pop)}
.way.cur{border-color:var(--pop);background:#fff2c0}
.recipes{overflow-y:auto;max-height:52vh;display:flex;flex-direction:column;gap:4px;padding-right:4px}
.rec{display:flex;gap:8px;align-items:center;padding:4px 8px;border-radius:10px;background:rgba(255,255,255,.35);border:2px solid transparent;cursor:pointer;opacity:.62}
.rec.can{opacity:1;background:rgba(255,255,255,.7);border-color:#7ab85a}
.rec img{width:36px;height:36px}.rec .info{display:flex;flex-direction:column;font-size:13px;gap:1px}
.rec .ing{display:flex;gap:6px;flex-wrap:wrap}.rec .ing span{display:flex;align-items:center;gap:2px;font-size:12px}.rec .ing img{width:16px;height:16px}
.rec .ok{color:#2c7a1a}.rec .no{color:#b8362c}.rec em{font-size:11px;font-style:normal}
.modal{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(10,8,20,.5)}
.card{background:linear-gradient(#f6e6bf,#e5c98c);border:4px solid var(--wood-d);border-radius:20px;padding:20px 26px;min-width:300px;max-width:min(520px,92vw);box-shadow:0 12px 40px rgba(0,0,0,.6)}
.card h2{margin:0 0 10px}.card label{display:flex;justify-content:space-between;gap:12px;margin:6px 0;font-weight:500}.card input[type=text],.card input:not([type]){width:100%;padding:8px 12px;border-radius:10px;border:2px solid #8a6a3a;background:#fff8e4;font:inherit;outline:none;margin-bottom:8px}
.card select{font:inherit;padding:3px 8px;border-radius:8px;border:2px solid #8a6a3a;background:#fff8e4}
.card .keys{font-size:12px;line-height:1.7;margin:10px 0;opacity:.85}.card .hint{font-size:12px;opacity:.7}
.card .inl{width:16px;height:16px;vertical-align:middle}
.btns{display:flex;gap:10px;justify-content:flex-end;margin-top:12px}
button.big,.btns button{border:3px solid var(--wood-d);background:linear-gradient(#ffd96a,#f0b030);color:var(--ink);border-radius:12px;padding:8px 20px;font:inherit;font-weight:600;font-size:16px;cursor:pointer;box-shadow:0 3px 0 var(--wood-d)}
.btns button:active,button.big:active{transform:translateY(2px);box-shadow:0 1px 0 var(--wood-d)}
.ways{display:flex;flex-direction:column;gap:6px;max-height:40vh;overflow-y:auto}.way{display:flex;flex-direction:column;align-items:flex-start;border:2px solid #8a6a3a;background:#fff8e4;border-radius:10px;padding:6px 12px;font:inherit;cursor:pointer}.way small{opacity:.6}
.death{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:radial-gradient(rgba(120,0,0,.2),rgba(80,0,0,.6));color:#fff;text-align:center;text-shadow:0 2px 6px #000}
.death h1{font-size:56px;margin:0}
.touchpad{position:absolute;inset:0}.touchpad button{position:absolute;width:64px;height:64px;border-radius:50%;border:3px solid rgba(255,255,255,.7);background:rgba(20,14,30,.45);color:#fff;font-size:24px;font-family:inherit;pointer-events:auto}
.touchpad .l{left:14px;bottom:100px}.touchpad .r{left:96px;bottom:100px}.touchpad .j{right:20px;bottom:100px}.touchpad .d{right:98px;bottom:70px;width:52px;height:52px}
.touchpad .mode{right:20px;bottom:174px;width:76px;border-radius:14px;height:44px;font-size:15px}.touchpad .invb{right:104px;bottom:174px;width:56px;border-radius:14px;height:44px;font-size:14px}.touchpad .chatb{left:14px;bottom:176px;width:56px;border-radius:14px;height:44px;font-size:14px}
.touchpad button.down{background:rgba(255,207,74,.7)}
body:not(.touch) .touchpad{display:none}
body.touch .chat{left:14px;bottom:250px;width:min(300px,38vw)}body.touch .chat .log{max-height:90px}body.touch .goal{top:6px;font-size:12px;max-width:50vw}
/* ---------- menu ---------- */
#menu{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:16px;overflow:auto}
#menu .wrap{display:flex;flex-direction:column;align-items:center;gap:14px;max-width:760px;width:100%}
#menu h1{margin:0;font-size:clamp(46px,9vw,92px);line-height:1;letter-spacing:2px;color:#fff;text-shadow:0 4px 0 #6b4423,0 7px 0 rgba(0,0,0,.25),0 0 30px rgba(255,255,255,.3);font-weight:700}
#menu h1 span{color:var(--pop)}
#menu .sub{color:#fff;text-shadow:0 2px 4px rgba(0,0,0,.6);font-size:18px;font-weight:500;text-align:center;margin-top:-4px}
.mcard{background:linear-gradient(#f6e6bf,#e5c98c);border:4px solid var(--wood-d);border-radius:22px;padding:18px 22px;display:flex;gap:22px;flex-wrap:wrap;justify-content:center;box-shadow:0 12px 40px rgba(0,0,0,.5);width:100%}
.mcard .who{display:flex;flex-direction:column;align-items:center;gap:8px;min-width:200px}
.mcard canvas{width:110px;height:150px;background:linear-gradient(#bfe6ff,#e8f8ff);border:3px solid var(--wood-d);border-radius:14px}
.mcard input[type=text],.mcard input:not([type]){padding:9px 12px;border-radius:10px;border:2px solid #8a6a3a;background:#fff8e4;font:inherit;font-size:16px;outline:none;width:100%}
.mcard .go{display:flex;flex-direction:column;gap:10px;flex:1;min-width:260px}
.mcard .row{display:flex;gap:6px;align-items:center;justify-content:space-between;font-weight:500;font-size:14px}
.mcard .row button{border:2px solid #8a6a3a;background:#e9d3a3;border-radius:8px;width:30px;height:28px;font:inherit;cursor:pointer;color:var(--ink)}
.mcard .sw{display:flex;gap:4px}.mcard .sw i{width:20px;height:20px;border-radius:6px;border:2px solid rgba(0,0,0,.35);cursor:pointer}.mcard .sw i.on{outline:3px solid var(--pop)}
.mcard h3{margin:0;font-size:16px}
.mcard .small{font-size:12px;opacity:.7;line-height:1.4}
.mcard .err{color:var(--bad);font-weight:600;min-height:20px}
.mcard .net{display:flex;gap:8px}
.mcard .net input{flex:1}
.mcard button.big.alt{background:linear-gradient(#a8e0ff,#5ab8f0)}
.mcard .srv{font-size:12px;opacity:.75;min-height:16px}
.foot{color:rgba(255,255,255,.8);font-size:12px;text-align:center;text-shadow:0 1px 3px #000}
.foot a{color:#fff}
@media (max-width:700px){.panel{flex-direction:column;overflow-y:auto;padding:12px}.panel .grid{grid-template-columns:repeat(5,44px)}.slot{width:44px;height:44px}.hotbar{gap:2px;padding:4px}.hotbar .slot{width:36px;height:36px}.hotbar .slot img{width:30px;height:30px;inset:2px}.mapbox{display:none}.clock{top:12px}.craft{width:auto}}
</style>
</head>
<body>
<canvas id="game" tabindex="0"></canvas>
<div id="hud"></div>
<div id="menu">
  <div class="wrap">
    <h1>Block<span>mates</span></h1>
    <div class="sub">Dig, build and explore with up to 16 friends</div>
    <div class="mcard">
      <div class="who">
        <canvas id="prev" width="110" height="150"></canvas>
        <input id="name" maxlength="16" placeholder="Your name" autocomplete="off" spellcheck="false">
        <button class="big" id="rand" style="font-size:13px;padding:4px 12px">Randomize look</button>
      </div>
      <div class="go">
        <div id="look"></div>
        <button class="big" id="solo">Play solo</button>
        <div class="small"><span id="soloinfo"></span> <a href="#" id="newworld" style="color:#7a3b12;display:none">Start a new world</a></div>
        <h3>Join a server</h3>
        <div class="net"><input id="addr" placeholder="Server address, e.g. my-world.example.workers.dev" autocomplete="off" spellcheck="false"><button class="big alt" id="online">Join</button></div>
        <div class="srv" id="srv"></div>
        <div class="err" id="err"></div>
      </div>
    </div>
    <div class="foot">An original block-building sandbox. Hosting your own 16-player world: see the README in this folder.</div>
  </div>
</div>
<script type="module" src="client/main.js"></script>
</body>
</html>
