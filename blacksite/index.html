<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BLACKSITE</title>
<meta name="description" content="A first-person shooter built in Three.js.">
<meta name="theme-color" content="#08090b">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%2308090b'/%3E%3Cg stroke='%23ffb648' stroke-width='2.5' fill='none'%3E%3Ccircle cx='16' cy='16' r='7'/%3E%3Cpath d='M16 2v6M16 24v6M2 16h6M24 16h6'/%3E%3C/g%3E%3C/svg%3E">
<style>
  /* The whole UI is DOM on top of one canvas. A HUD drawn into the 3D scene
     costs a pass and fights the post chain; DOM is sharper, free, and scales
     with the device pixel ratio without any work. */
  :root {
    --amber:#ffb648; --amber-dim:#c07d22; --ink:#08090b; --steel:#9fb0bd;
    --bad:#ff4d3d; --good:#5fd28a; --hud:rgba(232,240,247,.92);
    --ui: ui-monospace, "SF Mono", "Cascadia Mono", Menlo, Consolas, monospace;
  }
  *,*::before,*::after{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--ink);overflow:hidden;
    font-family:var(--ui);color:var(--hud);
    -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
  #app{position:fixed;inset:0;overflow:hidden;background:#000}
  canvas#gl{position:absolute;inset:0;width:100%;height:100%;display:block;
    cursor:none;touch-action:none}
  #app:not(.locked) canvas#gl{cursor:crosshair}

  /* ── loading ─────────────────────────────────────────────────────────── */
  #boot{position:absolute;inset:0;display:grid;place-content:center;gap:18px;
    background:radial-gradient(120% 90% at 50% 40%,#14171c 0%,#08090b 70%);
    z-index:60;transition:opacity .6s ease,visibility .6s}
  #app.ready #boot{opacity:0;visibility:hidden}
  #boot h1{margin:0;font-size:clamp(28px,7vw,58px);letter-spacing:.42em;font-weight:600;
    text-indent:.42em;color:#e8f0f7;text-shadow:0 0 40px rgba(255,182,72,.25)}
  #boot .rule{height:1px;background:linear-gradient(90deg,transparent,var(--amber-dim),transparent)}
  #load-status{text-align:center;font-size:12px;letter-spacing:.26em;text-transform:uppercase;
    color:var(--amber-dim);min-height:1.2em}

  /* ── menus ───────────────────────────────────────────────────────────── */
  #menu{position:absolute;inset:0;z-index:50;display:none;place-content:center;
    background:rgba(6,7,9,.72);backdrop-filter:blur(14px) saturate(.7)}
  #menu.on{display:grid}
  .panel{min-width:min(460px,92vw);padding:30px 34px;
    background:linear-gradient(180deg,rgba(22,26,32,.92),rgba(12,14,18,.94));
    border:1px solid rgba(159,176,189,.16);border-radius:2px;
    box-shadow:0 30px 90px rgba(0,0,0,.7),inset 0 1px 0 rgba(255,255,255,.05)}
  .panel h2{margin:0 0 4px;font-size:15px;letter-spacing:.34em;text-transform:uppercase;color:var(--amber)}
  .panel .sub{margin:0 0 22px;font-size:11px;letter-spacing:.16em;color:#7d8b97;text-transform:uppercase}
  .panel button{display:block;width:100%;margin:0 0 8px;padding:12px 16px;text-align:left;
    background:rgba(255,255,255,.03);color:var(--hud);cursor:pointer;font:inherit;font-size:13px;
    border:1px solid rgba(159,176,189,.14);border-left:2px solid transparent;
    letter-spacing:.14em;text-transform:uppercase;transition:background .12s,border-color .12s,transform .12s}
  .panel button:hover,.panel button:focus-visible{background:rgba(255,182,72,.10);
    border-left-color:var(--amber);transform:translateX(3px);outline:none}
  .row{display:flex;align-items:center;justify-content:space-between;gap:14px;
    padding:9px 2px;font-size:12px;letter-spacing:.1em;color:#b8c6d2;
    border-bottom:1px solid rgba(159,176,189,.08)}
  .row input[type=range]{flex:0 0 190px;accent-color:var(--amber)}
  .row select{background:#12151a;color:var(--hud);border:1px solid rgba(159,176,189,.2);
    padding:5px 8px;font:inherit;font-size:12px}
  .keys{font-size:11px;line-height:1.9;color:#7d8b97;letter-spacing:.08em}
  .keys b{color:var(--amber-dim);font-weight:600}

  /* ── HUD ─────────────────────────────────────────────────────────────── */
  #hud{position:absolute;inset:0;z-index:20;pointer-events:none;
    opacity:0;transition:opacity .35s ease}
  #app.playing #hud{opacity:1}
  /* 200px, not 44: a reticle bloomed out to the edge of a 8° hip-fire cone
     needs the room, and an SVG that clips its own ticks looks like a bug. */
  #crosshair{position:absolute;left:50%;top:50%;width:200px;height:200px;
    transform:translate(-50%,-50%);will-change:transform,opacity;overflow:visible}
  #hitmark{position:absolute;left:50%;top:50%;width:40px;height:40px;
    transform:translate(-50%,-50%) scale(.7);opacity:0;will-change:transform,opacity}
  /* No transition here. The HUD decays this per frame, and a transition that is
     restarted every frame never reaches its target — it just lags. */
  #dmg{position:absolute;inset:0;opacity:0;
    background:radial-gradient(120% 100% at 50% 50%,transparent 42%,rgba(150,12,8,.55) 100%)}
  #dmgnum{position:absolute;inset:0;overflow:hidden}
  #dmgnum span{position:absolute;font-size:15px;font-weight:600;letter-spacing:.06em;
    text-shadow:0 2px 10px rgba(0,0,0,.95);will-change:transform,opacity;pointer-events:none}
  #lowhp{position:absolute;inset:0;opacity:0;pointer-events:none;
    background:radial-gradient(115% 95% at 50% 50%,transparent 30%,rgba(120,8,6,.62) 100%)}
  #ammo{position:absolute;right:38px;bottom:30px;text-align:right;line-height:1}
  /* inline-block so the per-shot punch animation has something to transform;
     transforms do not apply to inline boxes. */
  #ammo .mag{display:inline-block;font-size:44px;font-weight:600;letter-spacing:.04em;
    text-shadow:0 2px 14px rgba(0,0,0,.9);will-change:transform}
  #ammo .mag.low{color:var(--bad)}
  #ammo .res{font-size:16px;color:#8d9caa;margin-left:6px}
  #ammo .name{font-size:11px;letter-spacing:.3em;color:var(--amber-dim);
    text-transform:uppercase;margin-bottom:6px}
  #ammo .fire{font-size:10px;letter-spacing:.24em;color:#6c7a86;margin-top:5px}
  #health{position:absolute;left:38px;bottom:30px;width:210px}
  #health .bar{position:relative;height:3px;background:rgba(255,255,255,.10);overflow:hidden}
  /* Two bars stacked: the live one, and a ghost that lags behind it so the size
     of a hit stays readable for a moment after the hit itself. No transition —
     the HUD drives both per frame, and a transition here only adds lag. */
  #health .bar i{position:absolute;inset:0;height:100%;width:100%;background:var(--hud);
    transform-origin:left;transition:background .3s;will-change:transform}
  #health .bar i.ghost{background:rgba(255,77,61,.55)}
  #health .num{display:inline-block;font-size:26px;font-weight:600;margin-bottom:5px;
    line-height:1;will-change:transform}
  #health .label{font-size:10px;letter-spacing:.3em;color:#6c7a86;text-transform:uppercase;margin-bottom:8px}
  #compass{position:absolute;left:50%;top:22px;transform:translateX(-50%);
    width:min(420px,54vw);height:34px;overflow:hidden;
    -webkit-mask-image:linear-gradient(90deg,transparent,#000 18%,#000 82%,transparent);
            mask-image:linear-gradient(90deg,transparent,#000 18%,#000 82%,transparent)}
  #objective{position:absolute;left:38px;top:26px;font-size:11px;letter-spacing:.2em;
    text-transform:uppercase;color:#8d9caa}
  #objective b{display:block;color:var(--amber);font-size:13px;letter-spacing:.28em;margin-bottom:4px}
  #killfeed{position:absolute;right:38px;top:26px;text-align:right;font-size:11.5px;
    letter-spacing:.1em;line-height:2}
  #killfeed div{opacity:0;transform:translateX(14px);animation:feed .3s forwards}
  @keyframes feed{to{opacity:1;transform:none}}
  #dmgdir{position:absolute;inset:0}
  #dmgdir i{position:absolute;left:50%;top:50%;width:150px;height:150px;margin:-75px 0 0 -75px;
    opacity:0;background:conic-gradient(from -18deg,rgba(255,60,40,.85),transparent 36deg);
    -webkit-mask:radial-gradient(closest-side,transparent 62%,#000 66%,#000 78%,transparent 82%);
            mask:radial-gradient(closest-side,transparent 62%,#000 66%,#000 78%,transparent 82%)}
  #toast{position:absolute;left:50%;top:58%;transform:translateX(-50%);text-align:center;
    font-size:13px;letter-spacing:.3em;text-transform:uppercase;color:var(--amber);opacity:0}
  /* Lives in #app rather than #hud: the HUD fades to nothing outside play, and
     a profiler that disappears the moment you open a menu is no use. Opaque,
     because it overlaps the objective block. */
  #perf{position:absolute;left:6px;top:6px;z-index:30;font-size:10px;color:#8fa0ac;
    letter-spacing:.06em;display:none;white-space:pre;line-height:1.5;
    padding:6px 8px;background:rgba(6,7,9,.82);border:1px solid rgba(159,176,189,.14);
    pointer-events:none}
  #app.debug #perf{display:block}

  /* ── touch controls ──────────────────────────────────────────────────────
     Hidden until the input layer confirms a real touch. A device with both a
     touchscreen and a mouse should not get thumb buttons for existing. */
  #touch{position:absolute;inset:0;z-index:25;display:none;touch-action:none;
    -webkit-user-select:none;user-select:none}
  #app.touch #touch{display:block}
  #app.touch canvas#gl{cursor:none}
  /* Everything sits above the safe area — a home indicator or a notch will
     otherwise swallow whichever control is nearest the edge. */
  #touch .pad{position:absolute;display:grid;place-content:center;
    border:1px solid rgba(159,176,189,.30);border-radius:50%;
    background:rgba(10,13,17,.34);backdrop-filter:blur(2px);
    color:rgba(232,240,247,.86);font-size:10px;letter-spacing:.14em;
    text-transform:uppercase;text-shadow:0 1px 4px rgba(0,0,0,.9);
    transition:background .08s,transform .08s,border-color .08s;
    will-change:transform}
  #touch .pad.on{background:rgba(255,182,72,.30);border-color:var(--amber);
    transform:scale(.94)}
  #touch .pad[hidden]{display:none}

  /* The fire button is the biggest thing on screen and sits where the right
     thumb already rests. Everything else is arranged around it. */
  #tfire{right:calc(22px + env(safe-area-inset-right));bottom:calc(96px + env(safe-area-inset-bottom));
    width:104px;height:104px;font-size:11px}
  #tads{right:calc(140px + env(safe-area-inset-right));bottom:calc(150px + env(safe-area-inset-bottom));
    width:74px;height:74px}
  /* Above the fire button rather than inboard of it: inboard put it straight on
     top of the ammo counter, which is the one readout you check *because* you
     are about to reload. */
  #treload{right:calc(216px + env(safe-area-inset-right));bottom:calc(232px + env(safe-area-inset-bottom));
    width:64px;height:64px;color:var(--amber)}
  #tjump{right:calc(28px + env(safe-area-inset-right));bottom:calc(216px + env(safe-area-inset-bottom));
    width:66px;height:66px}
  #tcrouch{right:calc(112px + env(safe-area-inset-right));bottom:calc(238px + env(safe-area-inset-bottom));
    width:62px;height:62px}

  /* The movement stick is floating: it is drawn wherever the thumb lands, so
     it never has to be found. Hidden until then. */
  #tstick{position:absolute;left:0;top:0;width:104px;height:104px;margin:-52px 0 0 -52px;
    border:1px solid rgba(159,176,189,.26);border-radius:50%;
    background:rgba(10,13,17,.26);opacity:0;transition:opacity .12s;pointer-events:none}
  #tstick.on{opacity:1}
  #tstick i{position:absolute;left:50%;top:50%;width:46px;height:46px;
    transform:translate(-50%,-50%);border-radius:50%;
    background:rgba(232,240,247,.30);border:1px solid rgba(232,240,247,.5)}
  /* A hint on the left, only before the player has ever touched down. */
  #thint{position:absolute;left:calc(26px + env(safe-area-inset-left));
    bottom:calc(96px + env(safe-area-inset-bottom));width:180px;
    font-size:10px;letter-spacing:.16em;text-transform:uppercase;
    color:rgba(159,176,189,.5);line-height:1.8;pointer-events:none;
    transition:opacity .4s}
  #app.touched #thint{opacity:0}

  @media (prefers-reduced-motion:reduce){ #touch .pad{transition:none} }

  /* Portrait on a phone. The HUD was laid out for a 16:9 desktop frame, where
     there is room to the side of everything; in portrait the same rules put the
     objective over four lines and push the vitals into the movement stick. */
  @media (max-width:520px) and (orientation:portrait){
    /* In portrait the bottom of the screen belongs to the thumbs, so every
       readout moves to the top. A number you have to lift your thumb to read
       is a number you will not read in a firefight. */
    /* Height pinned rather than inherited: the compass is a wide, mostly empty
       SVG, and letting the browser size it meant its box reached down into the
       row below and collided with both corner readouts. */
    #compass{width:66vw;height:20px;top:calc(6px + env(safe-area-inset-top))}
    #objective{left:calc(12px + env(safe-area-inset-left));top:calc(38px + env(safe-area-inset-top));
      max-width:54vw;font-size:9.5px;letter-spacing:.1em}
    #objective b{font-size:10.5px;letter-spacing:.16em;margin-bottom:2px}
    /* Two lines, then ellipsis. A four-line objective in portrait eats the
       whole corner and none of it is more useful than the first line. */
    #objective span{display:-webkit-box;-webkit-line-clamp:2;line-clamp:2;
      -webkit-box-orient:vertical;overflow:hidden}
    #killfeed{right:calc(12px + env(safe-area-inset-right));top:calc(84px + env(safe-area-inset-top));
      font-size:9.5px;line-height:1.7;max-width:44vw}

    /* Clear of the objective above it: that block is two clamped lines plus its
       heading, about 83 px, starting at 40. Anything higher and the health
       number prints straight through the mission text. */
    #health{left:calc(12px + env(safe-area-inset-left));top:calc(134px + env(safe-area-inset-top));
      bottom:auto;width:104px}
    #health .label{display:none}
    #health .num{font-size:19px;margin-bottom:3px}
    #ammo{right:calc(12px + env(safe-area-inset-right));top:calc(38px + env(safe-area-inset-top));
      bottom:auto}
    #ammo .mag{font-size:26px}
    #ammo .res{font-size:12px}
    #ammo .name{font-size:8.5px;letter-spacing:.18em;margin-bottom:3px}
    #ammo .fire{font-size:8.5px;letter-spacing:.18em;margin-top:2px}
    #crosshair{width:36px;height:36px}
  }
  /* Landscape on a short screen: the desktop layout is nearly right, but the
     bottom corners are where the thumbs live. */
  @media (max-height:520px) and (orientation:landscape) and (pointer:coarse){
    /* Landscape has width to spare and no height. Readouts go to the top, out
       of both thumbs' reach, rather than into the corners the thumbs occupy. */
    #health{left:calc(14px + env(safe-area-inset-left));top:12px;bottom:auto;width:118px}
    #health .label{display:none}
    #health .num{font-size:18px;margin-bottom:3px}
    #ammo{right:calc(14px + env(safe-area-inset-right));top:12px;bottom:auto}
    #ammo .mag{font-size:24px}
    #ammo .res{font-size:12px}
    #ammo .name,#ammo .fire{font-size:8.5px;letter-spacing:.16em}
    #objective{left:calc(150px + env(safe-area-inset-left));top:34px;max-width:32vw;font-size:9.5px}
    #objective span{display:-webkit-box;-webkit-line-clamp:2;line-clamp:2;
      -webkit-box-orient:vertical;overflow:hidden}
    #killfeed{right:calc(150px + env(safe-area-inset-right));top:34px;font-size:9.5px;max-width:28vw}
    #compass{top:6px;height:20px;width:34vw}
  }

  #fatal{position:absolute;inset:0;z-index:99;display:grid;place-content:center;
    gap:12px;padding:40px;text-align:center;background:#08090b}
  #fatal[hidden]{display:none}
  #fatal .msg{font-size:15px;letter-spacing:.14em;color:var(--bad)}
  #fatal .detail{font-size:11px;color:#6c7a86;max-width:60ch}

  @media (prefers-reduced-motion:reduce){
    #boot,#menu,.panel button{transition:none}
    #killfeed div{animation:none;opacity:1;transform:none}
  }
</style>
</head>
<body>
<div id="app">
  <canvas id="gl"></canvas>

  <div id="hud" aria-hidden="true">
    <div id="dmg"></div>
    <div id="lowhp"></div>
    <div id="dmgdir"><i></i><i></i><i></i><i></i><i></i></div>
    <div id="dmgnum"></div>
    <svg id="crosshair" viewBox="0 0 200 200" aria-hidden="true"></svg>
    <!-- Contents are rebuilt from JS: hit, headshot and kill are three different
         shapes, not three tints of the same one. -->
    <svg id="hitmark" viewBox="0 0 40 40" aria-hidden="true"></svg>
    <svg id="compass" aria-hidden="true"></svg>
    <div id="objective"><b>Objective</b><span></span></div>
    <div id="killfeed"></div>
    <div id="ammo">
      <div class="name">—</div>
      <div><span class="mag">0</span><span class="res">/ 0</span></div>
      <div class="fire">—</div>
    </div>
    <div id="health">
      <div class="label">Vitals</div>
      <div class="num">100</div>
      <div class="bar"><i></i></div>
    </div>
    <div id="toast"></div>
  </div>

  <div id="touch" aria-hidden="true">
    <div id="tstick"><i></i></div>
    <div id="thint">Left — move<br>Right — look, tap to fire</div>
    <div class="pad" id="tjump"   data-act="jump">Jump</div>
    <div class="pad" id="tcrouch" data-act="crouch" data-toggle="1">Crouch</div>
    <div class="pad" id="tads"    data-act="ads"    data-toggle="1">Aim</div>
    <div class="pad" id="treload" data-act="reload" hidden>Reload</div>
    <div class="pad" id="tfire"   data-act="fire">Fire</div>
  </div>

  <div id="perf"></div>

  <div id="menu"></div>

  <div id="boot">
    <h1>BLACKSITE</h1>
    <div class="rule"></div>
    <div id="load-status">initialising</div>
  </div>

  <div id="fatal" hidden>
    <div class="msg"></div>
    <div class="detail"></div>
  </div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "./vendor/three.module.min.js",
    "three/addons/": "./vendor/addons/"
  }
}
</script>
<script type="module">
  import { boot } from './src/main.js';
  const root = document.getElementById('app');
  boot(root).catch((err) => {
    console.error(err);
    const el = document.getElementById('fatal');
    el.hidden = false;
    el.querySelector('.msg').textContent = 'Failed to start.';
    el.querySelector('.detail').textContent = String(err && err.stack || err);
    root.classList.add('ready');
  });
</script>
</body>
</html>
