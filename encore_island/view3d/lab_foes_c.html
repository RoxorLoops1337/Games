<!doctype html><meta charset="utf-8"><title>foes C lab</title>
<script type="importmap">{ "imports": { "three": "../../encore_island_3d/vendor/three.module.min.js", "three/addons/": "../../encore_island_3d/vendor/jsm/" } }</script>
<style>#hud{position:fixed;left:6px;top:4px;font:11px/1.3 monospace;color:#2d170f;background:#fff8;padding:3px 6px;border-radius:4px;white-space:pre;pointer-events:none}
.tag{position:fixed;font:10px/1.2 monospace;color:#2d170f;background:#fffa;padding:1px 4px;border-radius:3px;pointer-events:none;transform:translate(-50%,0);white-space:pre;text-align:center}</style>
<div id="hud"></div>
<script type="module">
// Foes C lab (act 3). ?m=row (default): all 9 in a row, walking along x, game-like camera (el 55).
// ?m=grid: close-up, rows = creatures, columns = variants.  Params: only=storm_drone,boss_editor  v=idle,walk,atk,hurt,die,elite,gold  dieAt=0.45
// atk@0.2 starts the attack at t=0.2 s, die@0.2 dies from t=0.2 s: a row of atk@0,atk@0.2,... shoots one frame of the attack in several phases
// gap=2.6  tags=0  bake=0 (skip baking)  plus az el d tx ty tz w h (lab.js). Draw calls and triangles are those AFTER baking.
import { lab } from './lab.js';
import { bakeActor } from './bake.js';
import * as CH from '../../encore_island_3d/js/characters.js';
import { FOES_C } from './foes_c.js';
const P = new URLSearchParams(location.search), NAMES = Object.keys(FOES_C), mode = P.get('m') || 'row';
const only = P.get('only') ? P.get('only').split(',') : NAMES, VARS = (P.get('v') || 'idle,walk,atk,hurt,die,elite,gold').split(','), dieAt = +(P.get('dieAt') || 0.45), GAP = +(P.get('gap') || (mode === 'row' ? 2.6 : 2.8));
lab({ az: 0, el: mode === 'row' ? 55 : 18, d: mode === 'row' ? 21 : 12, ty: mode === 'row' ? 0 : 1.2, tx: mode === 'row' ? 0.8 : 0, build(V) {
  CH.STYLE.flat = false; const slots = [], hud = document.getElementById('hud'), lines = [], doBake = P.get('bake') !== '0';
  const mk = (name, variant) => { const a = FOES_C[name]({ elite: variant === 'elite', gold: variant === 'gold' }); V.scene.add(a.group); const info = doBake ? bakeActor(a) : { calls: 0, meshes: [] }; return { a, info }; };
  const tag = (s) => { const d = document.createElement('div'); d.className = 'tag'; document.body.appendChild(d); s.tag = d; d.textContent = `${s.name}${mode === 'row' ? '' : '/' + s.variant}\n${s.info.calls} calls ${Math.round(s.tris)} tris`; };
  const place = (s, x, z) => { s.x = x; s.z = z; s.a.group.position.set(x, 0, z); s.x0 = x; };
  if (mode === 'row') NAMES.forEach((n, i) => { const s = { name: n, variant: 'walk', ...mk(n, 'walk') }; place(s, -11 + i * GAP + (i === 8 ? 1.8 : 0), 0); s.ph = i * 0.7; slots.push(s); });
  else only.forEach((n, r) => VARS.forEach((v, c) => { const s = { name: n, variant: v, ...mk(n, v) }; place(s, (c - (VARS.length - 1) / 2) * GAP * (n.startsWith('boss') ? 1.5 : 1), -r * (n.startsWith('boss') ? 5 : 3.2)); slots.push(s); }));
  for (const s of slots) { s.tris = s.info.meshes.reduce((n, m) => n + m.geometry.attributes.position.count / 3, 0); lines.push(`${s.name}/${s.variant}: ${s.info.calls} calls ${Math.round(s.tris)} tris h=${s.a.height.toFixed(2)}`); if (P.get('tags') !== '0') tag(s); }
  window.__stat = { foes: lines }; if (P.get('hud') !== '0') hud.textContent = lines.filter((_, i) => mode === 'row' || i % VARS.length === 0).join('\n'); else hud.style.display = 'none';
  const st = { speed: 0, atk: false, hurt: 0, die: 0, elite: false, gold: false, slow: false, glow: false, singing: false }, v3 = new V.THREE.Vector3();
  return { update(dt, t) {
    V.blobs.begin();
    for (const s of slots) {
      const v = s.variant, [vn, vx] = v.split('@'), at = vx === undefined ? 0 : +vx; st.speed = 0; st.atk = false; st.hurt = 0; st.die = 0; st.elite = v === 'elite'; st.gold = v === 'gold';
      if (mode === 'row') { const k = Math.sin(t * 0.5 + s.ph), vx = Math.cos(t * 0.5 + s.ph); st.speed = 1; s.a.group.position.x = s.x0 + k * 0.9; s.a.group.rotation.y = Math.atan2(vx, 0.35); if (Math.floor(t / 2 + s.ph) % 3 === 0 && (t / 2 + s.ph) % 1 < 0.5) st.atk = true; }
      else if (vn === 'walk') st.speed = 1; else if (vn === 'atk') st.atk = t >= at; else if (vn === 'hurt') st.hurt = 1; else if (vn === 'die') st.die = vx === undefined ? dieAt : Math.max(0, Math.min(1, (t - at) / 0.8));
      s.a.update(dt, t, st); V.blobs.add(s.a.group.position.x, s.a.group.position.z, s.a.radius * 1.1, 0.35);
      if (s.tag) { v3.set(s.a.group.position.x, 0, s.a.group.position.z + 0.2).project(V.camera); s.tag.style.left = (v3.x * 0.5 + 0.5) * innerWidth + 'px'; s.tag.style.top = (-v3.y * 0.5 + 0.5) * innerHeight + 8 + 'px'; }
    }
    V.blobs.end();
  } };
} });
</script>
