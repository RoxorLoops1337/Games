<!doctype html><meta charset="utf-8"><title>foes B lab</title>
<script type="importmap">{ "imports": { "three": "../../encore_island_3d/vendor/three.module.min.js", "three/addons/": "../../encore_island_3d/vendor/jsm/" } }</script>
<style>#hud{position:fixed;left:6px;top:4px;font:11px/1.3 monospace;color:#2d170f;background:#fff8;padding:3px 6px;border-radius:4px;white-space:pre;pointer-events:none}</style>
<div id="hud"></div>
<script type="module">
// Foes B lab (act 2 + Scrollspinner). ?m=row (default): all 9 in a row, walking (live camera, el 55). ?m=grid: close-up grid, rows = creatures, cols = variants.
// Params: only=chochin,nopperabo  v=idle,walk,atk,hurt,die,elite,gold  dieAt=0.45  gap=2.8  hud=0  + az el d tx ty tz w h (lab.js).  Variants: elite / gold are built with the opts AND driven by st.
import { lab } from './lab.js';
import { bakeActor } from './bake.js';
import * as CH from '../../encore_island_3d/js/characters.js';
import { FOES_B } from './foes_b.js';
const P = new URLSearchParams(location.search), NAMES = Object.keys(FOES_B), mode = P.get('m') || 'row';
const only = P.get('only') ? P.get('only').split(',') : NAMES, VARS = (P.get('v') || 'idle,walk,atk,hurt,die,elite,gold').split(','), dieAt = +(P.get('dieAt') || 0.45);
const GAP = +(P.get('gap') || 2.8), row = (n) => (n.startsWith('boss') ? 5.6 : 3.1);
lab({ az: 0, el: mode === 'row' ? 55 : 22, d: mode === 'row' ? 21 : 13, ty: mode === 'row' ? 0.5 : 1.1, build(V) {
  CH.STYLE.flat = false; const slots = [], hud = document.getElementById('hud'), lines = [];
  const mk = (name, variant) => { const a = FOES_B[name]({ elite: variant === 'elite', gold: variant === 'gold' }); V.scene.add(a.group); const info = bakeActor(a); return { a, info }; };
  const place = (s, x, z) => { s.x = x; s.z = z; s.x0 = x; s.a.group.position.set(x, 0, z); };
  if (mode === 'row') NAMES.forEach((n, i) => { const s = { name: n, variant: 'walk', ...mk(n, 'walk') }; place(s, -11.5 + i * GAP + (i === 8 ? 1.8 : 0), 0); s.ph = i * 0.7; slots.push(s); });
  else { let z = 0; only.forEach((n) => { VARS.forEach((v, c) => { const s = { name: n, variant: v, ...mk(n, v) }; place(s, (c - (VARS.length - 1) / 2) * GAP, z); slots.push(s); }); z -= row(n); }); }
  for (const s of slots) { s.tris = s.info.meshes.reduce((n, m) => n + m.geometry.attributes.position.count / 3, 0); lines.push(`${s.name}/${s.variant}: ${s.info.calls} calls ${Math.round(s.tris)} tris ${s.info.bones} bones h=${s.a.height.toFixed(2)}`); }
  window.__stat = { foes: lines };
  if (P.get('hud') !== '0') hud.textContent = lines.filter((_, i) => mode === 'row' || i % VARS.length === 0).join('\n'); else hud.style.display = 'none';
  const st = { speed: 0, atk: false, hurt: 0, die: 0, elite: false, gold: false, slow: false, glow: false, singing: false };
  return { update(dt, t) {
    V.blobs.begin();
    for (const s of slots) {
      const v = s.variant; st.speed = 0; st.atk = false; st.hurt = 0; st.die = 0; st.elite = v === 'elite'; st.gold = v === 'gold'; st.singing = false;
      if (mode === 'row') { const k = Math.sin(t * 0.5 + s.ph), vx = Math.cos(t * 0.5 + s.ph); st.speed = 1; s.a.group.position.x = s.x0 + k * 0.9; s.a.group.rotation.y = Math.atan2(vx, 0.35); if (Math.floor(t / 2 + s.ph) % 3 === 0 && (t / 2 + s.ph) % 1 < 0.5) st.atk = true; }
      else if (v === 'walk') st.speed = 1; else if (v === 'atk') st.atk = (t % 1.2) < 0.45; else if (v === 'hurt') st.hurt = 1; else if (v === 'die') st.die = dieAt;
      s.a.update(dt, t, st); V.blobs.add(s.a.group.position.x, s.a.group.position.z, s.a.radius * 1.1, 0.35);
    }
    V.blobs.end();
  } };
} });
</script>
