<!doctype html><meta charset="utf-8"><title>heroes lab</title>
<!-- Static rigs:   ?show=rawclaw,andy,... (default all 8) &pose=idle|walk|sing|atk|cast|hurt|cheer|dash &d= &el= &az= &tx= &sp=spacing &fan=1 &w= &h=
     Game sync:     ?game=1 &skin=jasmin|roxor|rawclaw|andy|unicorn|monster|goat|legend &fans=30 &helm=6 &pose=cast|dash|hurt|cheer|atk|walk &spec=1 (careers) &shield=1 &encore=1
                    loads the REAL game scripts, runs heroes3d.init(V) against live state S (hero, companion, fans, stall keeper). -->
<script type="importmap">{ "imports": { "three": "../../encore_island_3d/vendor/three.module.min.js", "three/addons/": "../../encore_island_3d/vendor/jsm/" } }</script>
<script type="module">
import { lab } from './lab.js';
import { bakeActor, countCalls } from './bake.js';
import { makeHero, init } from './heroes3d.js';
const P = new URLSearchParams(location.search), num = (k, d) => (P.has(k) ? +P.get(k) : d);
const ALL = ['jasmin', 'roxor', 'rawclaw', 'andy', 'jasmin_unicorn', 'roxor_monster', 'rawclaw_goat', 'jordan'];
const tris = (root) => { let n = 0; root.traverse((o) => { if (o.isMesh && o.visible && o.layers.test({ mask: 1 })) n += (o.geometry.index ? o.geometry.index.count : o.geometry.attributes.position.count) / 3; }); return Math.round(n); };
if (P.get('game') === '1') {
  const { loadGame } = await import('./gamelab.js');
  const g = await loadGame({ lands: 2, wallet: 5e5, gems: 9, fans: num('fans', 12) });
  const S = g.S();
  if (P.has('skin')) S.skins.active = P.get('skin');
  for (let i = 0; i < num('helm', 6); i++) S.player.helmets.push(i % 7 === 3 ? { k: 4, bar: true } : i % 11 === 5 ? { k: 1, crown: true } : { k: 1 + (i * 3) % 9 });
  S.houses = 8;
  lab({ ground: true, groundR: 40, d: num('d', 12), el: num('el', 55), ty: 0, az: num('az', 0), w: num('w', 900), h: num('h', 600), async build(V) {
    const mod = init(V); V.mods.heroes3d = mod; const p = S.player, pose = P.get('pose') || '';
    p.x = -330; p.y = -150; S.comp.x = p.x - 60; S.comp.y = p.y + 24;
    S.pop.forEach((f, i) => { f.x = p.x + 100 + (i % 6) * 55 - 100 + (i > 5 ? 20 : 0); f.y = p.y + 120 + Math.floor(i / 6) * 55; if (f.role === 'fight' && i % 2 === 0) f.atkT = 0.3; if (P.has('spec')) f.spec = ['roadie', 'manager', 'scout', 'bodyguard', 'drummer'][i % 5]; if (i % 3 === 0 && f.role === 'gather') for (let k = 0; k < 4 + (i % 5); k++) f.carry.push({ k: 1 + k }); });
    if (P.has('encore')) S.encoreT = 99;
    window.__stat = { fans: S.pop.length };
    return { update(dt, t) {
      S.t += dt;
      if (pose === 'walk') { p.vx = 150; p.moving = true; p.x += 150 * dt; S.comp.x += 150 * dt; S.comp.mv = 0.15; S.pop.forEach((f) => { f.mv = 0.1; f.x += 40 * dt; }); }
      if (pose === 'cast') S.ultCasting = Math.max(0.3, S.ultCasting - 0) || 1.4, S.ultCasting = 0.7;
      if (pose === 'dash') { p.dashT = 0.2; p.vx = 780; p.x += 780 * dt * 0.1; p.moving = true; }
      if (pose === 'hurt') p.hurtT = 0.12;
      if (pose === 'cheer') p.cheerT = 1;
      if (pose === 'atk') { p.atkT = 0.3; }
      if (P.has('shield')) FEATS.find((f) => f.id === 'gear').api.T.shield = 2;
      if (P.get('pose') === 'walk') V.camera.userData.follow = 1;
      mod.update(dt, t, { x: p.x * 0.02, z: p.y * 0.02 });
      for (const a of [mod.hero, mod.companion]) if (a && !window.__stat.hero) window.__stat.hero = { calls: countCalls(a.group), tris: tris(a.group) };
    } };
  } });
} else {
  lab({ d: num('d', 12), el: num('el', 14), ty: num('ty', 1), tx: num('tx', 0), az: num('az', 0), build(V) {
    const list = [], names = (P.get('show') || ALL.join(',')).split(','), sp = num('sp', 2.1), pose = P.get('pose') || 'idle', fan = P.get('fan') === '1';
    names.forEach((n, i) => { const a = makeHero(n, { fan, seed: i + 1, acc: i }); a.group.position.set((i - (names.length - 1) / 2) * sp, 0, 0); V.scene.add(a.group); bakeActor(a); list.push(a); });
    const st = { speed: pose === 'walk' ? 0.8 : 0, singing: pose === 'sing', atk: pose === 'atk', cast: pose === 'cast', cheer: pose === 'cheer', dash: pose === 'dash', hurt: pose === 'hurt' ? 0.8 : 0, role: 'fight' };
    window.__stat = { calls: list.map((a) => countCalls(a.group)), tris: list.map((a) => tris(a.group)) };
    return { update(dt, t) { for (const a of list) a.update(dt, t, st); } };
  } });
}
</script>
