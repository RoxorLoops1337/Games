<title>INKWOVEN -- a rogue storybook</title>
<meta name="description" content="Two heroes, one living book. Paint the fog away with ink, build a deck of gem-socketed cards, and rewrite the ending. An anime deckbuilding roguelike.">

<style id="boot-css">
/* Painted from the HTML while the scripts download; UI removes #boot on the first frame. */
html,body{margin:0;height:100%;background:#0d0b1e;overflow:hidden}
#boot{position:fixed;inset:0;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;
  background:radial-gradient(ellipse at 50% 40%,#2a1d5a 0%,#0d0b1e 70%);font-family:Georgia,"Hiragino Mincho ProN","Yu Mincho",serif;color:#f3e6c8;transition:opacity .4s}
#boot.out{opacity:0;pointer-events:none}
#boot b{font-size:clamp(34px,8vw,72px);letter-spacing:.18em;font-weight:700;text-shadow:0 0 22px #ff7eb6,0 3px 0 #0d0b1e}
#boot i{display:block;width:14px;height:20px;border-radius:50% 50% 50% 50%/62% 62% 38% 38%;background:#7a6bff;box-shadow:0 0 14px #5ff5ff;animation:bootDrip 1.1s ease-in infinite}
@keyframes bootDrip{0%{transform:translateY(-14px) scaleY(.8);opacity:0}30%{opacity:1}100%{transform:translateY(16px) scaleY(1.2);opacity:0}}
@media (prefers-reduced-motion:reduce){#boot i{animation:none}}
</style>
</head>
<body>
<div id="boot"><b>INKWOVEN</b><i></i></div>
<div id="wrap">
  <div id="stage">
    <canvas id="view" width="1280" height="720"></canvas>
    <div id="screens"></div>
    <div id="overlays"></div>
    <div id="toasts"></div>
  </div>
</div>
