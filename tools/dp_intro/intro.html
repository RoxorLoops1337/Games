<!doctype html><meta charset="utf-8">
<title>DP intro renderer</title>
<style>body{margin:0;background:#000}canvas{display:block}</style>
<canvas id="cv" width="720" height="1260"></canvas>
<script src="font.js"></script>
<script>
'use strict';
// ============================================================================
// Dungeon Pusher — 20s intro. Deterministic: renderFrame(t) draws second t.
// ============================================================================
const W = 720, H = 1260, CX = W / 2;
const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
Grimcut.install(ctx);

// ---- deterministic helpers -------------------------------------------------
function h1(n) { n = Math.imul(n ^ (n >>> 16), 2246822519); n = Math.imul(n ^ (n >>> 13), 3266489917); return ((n ^= n >>> 16) >>> 0) / 4294967296; }
function hx(i, s) { return h1((i * 374761393 + s * 668265263) | 0); }
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, k) => a + (b - a) * k;
// eases — everything confident overshoots, nothing drifts in politely
function outBack(x, k) { k = k === undefined ? 2.2 : k; x = clamp(x, 0, 1); const c = k + 1; return 1 + c * Math.pow(x - 1, 3) + k * Math.pow(x - 1, 2); }
function outCubic(x) { x = clamp(x, 0, 1); return 1 - Math.pow(1 - x, 3); }
function outQuint(x) { x = clamp(x, 0, 1); return 1 - Math.pow(1 - x, 5); }
function inCubic(x) { x = clamp(x, 0, 1); return x * x * x; }
function seg(t, a, b) { return clamp((t - a) / (b - a), 0, 1); }   // 0..1 inside [a,b]

// ---- assets -----------------------------------------------------------------
const IMG = {};
const LOAD = ['marquee', 'room', 'battle_pour', 'tilt', 'wheel_meter', 'boss'];
let ready = false;
Promise.all(LOAD.map(n => new Promise(res => {
  const im = new Image(); im.onload = () => { IMG[n] = im; res(); }; im.onerror = res;
  im.src = n + '.png';
}))).then(() => { ready = true; });

// ---- palette (the game's gold) ----------------------------------------------
const GOLD = ['#fffbe6', '#ffd94c', '#e89a10', '#a85c05', '#713801'];

// ---- coin --------------------------------------------------------------------
// A gold piece seen edge-on to face-on: sq is cos(spin), 1 = full face.
function coin(x, y, r, sq, glow) {
  ctx.save();
  ctx.translate(x, y);
  const ry = r * Math.max(0.08, Math.abs(sq));
  if (glow) { ctx.shadowColor = 'rgba(255,196,64,' + (0.8 * glow) + ')'; ctx.shadowBlur = r * 1.3; }
  // edge
  ctx.fillStyle = '#8a5206';
  ctx.beginPath(); ctx.ellipse(0, r * 0.10, r, ry, 0, 0, 7); ctx.fill();
  // face
  const g = ctx.createLinearGradient(0, -ry, 0, ry);
  g.addColorStop(0, '#ffe98a'); g.addColorStop(0.45, '#ffc93c'); g.addColorStop(1, '#d07f0a');
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.ellipse(0, 0, r, ry, 0, 0, 7); ctx.fill();
  // rim + stamp
  ctx.strokeStyle = 'rgba(122,66,4,0.9)'; ctx.lineWidth = Math.max(1, r * 0.10);
  ctx.beginPath(); ctx.ellipse(0, 0, r * 0.72, ry * 0.72, 0, 0, 7); ctx.stroke();
  if (Math.abs(sq) > 0.55 && r > 7) {
    ctx.fillStyle = 'rgba(122,66,4,0.75)';
    ctx.beginPath(); ctx.ellipse(0, 0, r * 0.34, ry * 0.34, 0, 0, 7); ctx.fill();
    ctx.fillStyle = 'rgba(255,233,138,0.8)';
    ctx.beginPath(); ctx.ellipse(-r * 0.08, -ry * 0.10, r * 0.13, ry * 0.13, 0, 0, 7); ctx.fill();
  }
  ctx.restore();
}

// ---- torch flame (procedural, deterministic in t) ----------------------------
function flame(x, y, s, t, seed) {
  ctx.save(); ctx.translate(x, y); ctx.scale(s, s);
  ctx.globalCompositeOperation = 'lighter';
  for (let i = 0; i < 3; i++) {
    const ph = t * (7 + i * 2.3) + seed * 9;
    const wob = Math.sin(ph) * 3 + Math.sin(ph * 1.7 + 1) * 2;
    const hgt = 26 - i * 6 + Math.sin(ph * 1.3) * 3;
    const g = ctx.createRadialGradient(wob * 0.4, -hgt * 0.5, 1, wob * 0.4, -hgt * 0.5, hgt);
    const cols = [['rgba(255,120,20,', 0.35], ['rgba(255,190,60,', 0.45], ['rgba(255,245,180,', 0.55]];
    g.addColorStop(0, cols[i][0] + cols[i][1] + ')'); g.addColorStop(1, cols[i][0] + '0)');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.moveTo(-9 + i * 2.5, 0);
    ctx.quadraticCurveTo(-10 + wob * 0.5, -hgt * 0.55, wob, -hgt);
    ctx.quadraticCurveTo(10 - wob * 0.5, -hgt * 0.55, 9 - i * 2.5, 0);
    ctx.fill();
  }
  ctx.restore();
}

// ---- shockwave ring ----------------------------------------------------------
function ring(x, y, r, w, a, col) {
  if (a <= 0 || r <= 0) return;
  ctx.save(); ctx.globalAlpha = a; ctx.strokeStyle = col || '#ffd94c';
  ctx.lineWidth = Math.max(0.5, w);
  ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.stroke(); ctx.restore();
}

// ---- spark burst (radial, per-particle hashed) --------------------------------
function sparks(x, y, t0, t, n, spd, seed, grav) {
  const age = t - t0; if (age < 0 || age > 1.2) return;
  ctx.save(); ctx.globalCompositeOperation = 'lighter';
  for (let i = 0; i < n; i++) {
    const a = hx(i, seed) * Math.PI * 2, v = spd * (0.4 + hx(i, seed + 1) * 0.9);
    const life = 0.5 + hx(i, seed + 2) * 0.7; if (age > life) continue;
    const k = age / life, d = v * age * (1 - 0.45 * k);
    const px = x + Math.cos(a) * d, py = y + Math.sin(a) * d * 0.85 + (grav || 260) * age * age;
    const al = (1 - k) * 0.9;
    ctx.fillStyle = 'rgba(' + (hx(i, seed + 3) > 0.4 ? '255,214,80' : '255,244,200') + ',' + al + ')';
    const r = (1 - k * 0.6) * (1.6 + hx(i, seed + 4) * 2.4);
    ctx.fillRect(px - r / 2, py - r / 2, r, r);
  }
  ctx.restore();
}

// ---- GRIMCUT word slam --------------------------------------------------------
function slam(word, y, t0, t1, t, sz, style, sub) {
  if (t < t0 || t > t1) return 0;
  const inK = seg(t, t0, t0 + 0.22), outK = seg(t, t1 - 0.18, t1);
  const sc = lerp(2.6, 1, outBack(inK, 1.6));
  const al = (1 - inCubic(outK)) * Math.min(1, inK * 4);
  ctx.save();
  ctx.globalAlpha = al;
  ctx.translate(CX, y); ctx.scale(sc, sc);
  ctx.font = '900 ' + sz + 'px Grimcut ' + (style || 'Gold');
  ctx.textAlign = 'center';
  ctx.shadowColor = 'rgba(0,0,0,0.85)'; ctx.shadowBlur = 18; ctx.shadowOffsetY = 6;
  ctx.fillText(word, 0, 0);
  ctx.restore();
  if (sub && inK >= 1) {
    ctx.save(); ctx.globalAlpha = al * 0.9;
    ctx.font = '600 21px Georgia, serif'; ctx.textAlign = 'center';
    ctx.fillStyle = '#d8c9a8';
    ctx.fillText(sub, CX, y + 40);
    ctx.restore();
  }
  return inK;
}

// impact flash frame: first frames after a beat go bright
function flash(t, t0, col) {
  const k = t - t0;
  if (k < 0 || k > 0.12) return;
  ctx.save(); ctx.globalAlpha = 0.85 * (1 - k / 0.12);
  ctx.fillStyle = col || '#ffedc2'; ctx.fillRect(0, 0, W, H); ctx.restore();
}

// screen shake offset for a hit at t0
function shake(t, t0, amp, freq, decay) {
  const k = t - t0; if (k < 0 || k > 1.1) return [0, 0];
  const d = Math.exp(-(decay || 6) * k) * amp;
  return [Math.sin(k * (freq || 55)) * d, Math.cos(k * (freq || 55) * 1.31) * d * 0.8];
}

// ============================================================================
// SCENES
// ============================================================================
const CUTS = [                                     // the montage table
  { img: 'room',        w: 'DELVE',  t0: 5.0,  t1: 6.6,  dir: 1 },
  { img: 'battle_pour', w: 'PUSH',   t0: 6.6,  t1: 8.2,  dir: -1 },
  { img: 'tilt',        w: 'TILT!',  t0: 8.2,  t1: 9.7,  dir: 1,  rage: 1 },
  { img: 'wheel_meter', w: 'PRESS YOUR LUCK', t0: 9.7, t1: 11.4, dir: -1, small: 1 },
  { img: 'boss',        w: 'SLAY',   t0: 11.4, t1: 13.0, dir: 1,  punch: 1 },
];

function bgStone(t, heat) {
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, 'rgb(' + (14 + 12 * heat | 0) + ',' + (9 + 6 * heat | 0) + ',' + (8 + 3 * heat | 0) + ')');
  g.addColorStop(0.55, 'rgb(' + (26 + 20 * heat | 0) + ',' + (15 + 10 * heat | 0) + ',' + (10 + 5 * heat | 0) + ')');
  g.addColorStop(1, 'rgb(' + (10 + 8 * heat | 0) + ',' + (6 + 4 * heat | 0) + ',6)');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
}

// --- A: one coin falls out of the dark and detonates ------------------------
const HIT = 1.55, HITY = 880;
function sceneA(t) {
  bgStone(t, 0.06);
  const fall = seg(t, 0.22, HIT);
  if (t < HIT) {
    const y = lerp(-60, HITY, fall * fall);            // gravity
    const spin = t * 9;
    // motion streak
    ctx.save(); ctx.globalCompositeOperation = 'lighter';
    const L = 90 * fall * fall;
    const g = ctx.createLinearGradient(CX, y - L, CX, y);
    g.addColorStop(0, 'rgba(255,200,80,0)'); g.addColorStop(1, 'rgba(255,214,90,0.5)');
    ctx.fillStyle = g; ctx.fillRect(CX - 5, y - L, 10, L);
    ctx.restore();
    coin(CX, y, 26, Math.cos(spin), 0.7);
  } else {
    // aftermath: rings + sparks + the coin sat proud where it struck
    const k = t - HIT;
    ring(CX, HITY, k * 900, 26 * (1 - k), (1 - k / 0.8) * 0.9);
    ring(CX, HITY, k * 520, 12 * (1 - k), (1 - k / 0.9) * 0.7, '#fff2c0');
    sparks(CX, HITY, HIT, t, 90, 620, 7, 420);
    coin(CX, HITY, 26, 1, 0.9);
    // ground glow
    ctx.save(); ctx.globalCompositeOperation = 'lighter';
    const gg = ctx.createRadialGradient(CX, HITY, 4, CX, HITY, 300);
    gg.addColorStop(0, 'rgba(255,180,60,' + 0.5 * Math.max(0, 1 - k / 0.8) + ')'); gg.addColorStop(1, 'rgba(255,180,60,0)');
    ctx.fillStyle = gg; ctx.fillRect(0, 0, W, H);
    ctx.restore();
  }
  flash(t, HIT);
}

// --- B: the storm, and three words that mean business ------------------------
function sceneB(t) {
  const k = seg(t, 2.3, 5.0);
  bgStone(t, 0.10 + 0.5 * k);
  // rain of coins with streaks
  for (let i = 0; i < 90; i++) {
    const born = 2.1 + hx(i, 11) * 2.4, spd = 900 + hx(i, 12) * 700;
    const age = t - born; if (age < 0) continue;
    const x = hx(i, 13) * W + Math.sin(age * 3 + i) * 18;
    const y = -40 + age * spd; if (y > H + 40) continue;
    const r = 8 + hx(i, 14) * 12;
    ctx.save(); ctx.globalAlpha = 0.30;
    const sg = ctx.createLinearGradient(x, y - spd * 0.05, x, y);
    sg.addColorStop(0, 'rgba(255,206,79,0)'); sg.addColorStop(1, 'rgba(255,206,79,0.9)');
    ctx.fillStyle = sg; ctx.fillRect(x - r * 0.22, y - spd * 0.05, r * 0.44, spd * 0.05);
    ctx.restore();
    coin(x, y, r, Math.cos(age * 11 + i), 0);
  }
  // torches wake along both walls
  for (let i = 0; i < 4; i++) {
    const on = seg(t, 2.5 + i * 0.28, 2.8 + i * 0.28);
    if (on <= 0) continue;
    ctx.save(); ctx.globalAlpha = on;
    flame(34, 240 + i * 260, 1.5, t, i);
    flame(W - 34, 240 + i * 260, 1.5, t, i + 9);
    ctx.restore();
  }
  // GOLD. GLORY. GRAVITY.
  slam('GOLD.',    560, 2.55, 3.35, t, 112, 'Gold');
  slam('GLORY.',   560, 3.35, 4.15, t, 112, 'Silver');
  slam('GRAVITY.', 560, 4.15, 5.00, t, 104, 'Ember');
  flash(t, 2.55, 'rgba(255,220,120,1)');
  flash(t, 3.35, 'rgba(235,235,255,1)');
  flash(t, 4.15, 'rgba(255,160,60,1)');
}

// --- C: montage of the real machine ------------------------------------------
function sceneC(t) {
  const c = CUTS.find(c => t >= c.t0 && t < c.t1) || CUTS[CUTS.length - 1];
  const k = seg(t, c.t0, c.t1);
  const img = IMG[c.img];
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);
  if (img) {
    // kinetic move: land hard, then keep drifting; SLAY punches INTO the banner
    const z0 = c.punch ? 1.0 : 1.16, z1 = c.punch ? 1.28 : 1.04;
    const z = lerp(z0, z1, c.punch ? inCubic(k) : outQuint(k));
    const rot = (c.dir * (1 - k) * 0.010) - c.dir * 0.004;
    const panX = c.dir * lerp(14, -10, outCubic(k));
    const panY = c.punch ? lerp(0, -140, inCubic(k)) : lerp(-16, 10, outCubic(k));
    ctx.save();
    ctx.translate(CX + panX, H / 2 + panY);
    ctx.rotate(rot); ctx.scale(z, z);
    ctx.drawImage(img, -W / 2, -H / 2, W, H);
    ctx.restore();
  }
  // the label, on a black band that cuts across like a stamp
  const sz = c.small ? 52 : 88;
  const bandIn = seg(t, c.t0 + 0.05, c.t0 + 0.22), bandOut = seg(t, c.t1 - 0.22, c.t1 - 0.06);
  const bh = sz * 1.7;
  if (bandIn > 0 && bandOut < 1) {
    ctx.save();
    ctx.globalAlpha = 0.82 * Math.min(1, bandIn * 2) * (1 - bandOut);
    ctx.fillStyle = '#0a0705';
    const bw = W * outQuint(bandIn);
    ctx.fillRect(c.dir > 0 ? 0 : W - bw, 940 - bh / 2, bw, bh);
    ctx.fillStyle = '#ffd94c';
    ctx.fillRect(c.dir > 0 ? 0 : W - bw, 940 - bh / 2 - 3, bw, 3);
    ctx.fillRect(c.dir > 0 ? 0 : W - bw, 940 + bh / 2, bw, 3);
    ctx.restore();
  }
  slam(c.w, 940 + sz * 0.36, c.t0 + 0.12, c.t1 - 0.05, t, sz, c.rage ? 'Blood' : 'Gold');
  flash(t, c.t0, c.rage ? 'rgba(255,120,80,1)' : undefined);
}

// --- D: every coin in the dungeon answers the call ----------------------------
function sceneD(t) {
  const k = seg(t, 13.0, 15.2);
  bgStone(t, 0.30 * (1 - k));
  const cx = CX, cy = 560;
  // center glow builds
  ctx.save(); ctx.globalCompositeOperation = 'lighter';
  const gg = ctx.createRadialGradient(cx, cy, 2, cx, cy, 90 + 340 * k);
  gg.addColorStop(0, 'rgba(255,220,120,' + (0.16 + 0.66 * k * k) + ')');
  gg.addColorStop(1, 'rgba(255,160,40,0)');
  ctx.fillStyle = gg; ctx.fillRect(0, 0, W, H);
  ctx.restore();
  // the spiral — everyone arrives at k=1
  for (let i = 0; i < 180; i++) {
    const off = hx(i, 21);
    const p = clamp(k * 1.35 - off * 0.35, 0, 1);
    if (p >= 1) continue;
    const a0 = hx(i, 22) * Math.PI * 2;
    const r0 = 320 + hx(i, 23) * 620;
    const a = a0 + p * (5.5 + hx(i, 24) * 2.5);
    const r = r0 * (1 - inCubic(p));
    const x = cx + Math.cos(a) * r, y = cy + Math.sin(a) * r * 1.15;
    if (y < -40 || y > H + 40) continue;
    const cr = (8 + hx(i, 25) * 14) * (0.55 + 0.45 * (1 - p));
    coin(x, y, cr, Math.cos(p * 22 + i), p > 0.6 ? (p - 0.6) * 2 : 0);
  }
  if (k > 0.94) {                                  // converge → detonate
    ctx.save(); ctx.globalAlpha = (k - 0.94) / 0.06;
    ctx.fillStyle = '#fff7de'; ctx.fillRect(0, 0, W, H); ctx.restore();
  }
}

// --- E/F: the sign comes down off the wall -------------------------------------
const SLAM_T = 15.30;
function sceneE(t) {
  const heat = 0.5 + 0.2 * Math.sin(t * 0.9);
  bgStone(t, 0.35);
  // warm halo behind the sign
  ctx.save(); ctx.globalCompositeOperation = 'lighter';
  const gg = ctx.createRadialGradient(CX, 470, 30, CX, 470, 460);
  gg.addColorStop(0, 'rgba(255,190,80,' + (0.22 * heat) + ')'); gg.addColorStop(1, 'rgba(255,150,40,0)');
  ctx.fillStyle = gg; ctx.fillRect(0, 0, W, H);
  ctx.restore();
  // slow bokeh coins drifting behind
  for (let i = 0; i < 26; i++) {
    const y = ((hx(i, 31) * 1500 + (t - 15) * (30 + hx(i, 32) * 45)) % 1500) - 120;
    const x = hx(i, 33) * W;
    ctx.save(); ctx.globalAlpha = 0.16 + hx(i, 34) * 0.12;
    coin(x, y, 10 + hx(i, 35) * 22, Math.cos(t * 2 + i * 2.4), 0);
    ctx.restore();
  }
  // the marquee arrives like it was dropped from the floor above
  const mq = IMG.marquee;
  const inK = seg(t, SLAM_T, SLAM_T + 0.42);
  if (mq && t >= SLAM_T) {
    const sc = lerp(3.1, 1, outBack(inK, 1.35));
    const wobble = Math.sin((t - SLAM_T) * 1.7) * 3 * (t > SLAM_T + 1 ? 1 : 0);
    const mw = 672, mh = mw * mq.height / mq.width;
    ctx.save();
    ctx.translate(CX, 470 + wobble);
    ctx.scale(sc, sc);
    ctx.globalAlpha = Math.min(1, inK * 3);
    ctx.shadowColor = 'rgba(0,0,0,0.7)'; ctx.shadowBlur = 30; ctx.shadowOffsetY = 14;
    ctx.drawImage(mq, -mw / 2, -mh / 2, mw, mh);
    ctx.restore();
    ring(CX, 470, (t - SLAM_T - 0.30) * 1300, 12 * Math.max(0, 1 - (t - SLAM_T - 0.30)), Math.max(0, 0.8 - (t - SLAM_T - 0.30) * 1.4) * 0.55, '#ffe9a8');
    sparks(CX, 470, SLAM_T + 0.30, t, 130, 780, 41, 300);
  }
  flash(t, SLAM_T + 0.30);
  // tagline wipes in under the sign
  const tagK = seg(t, 16.15, 16.75);
  if (tagK > 0) {
    ctx.save();
    ctx.beginPath(); ctx.rect(CX - 300 * outCubic(tagK), 610, 600 * outCubic(tagK), 60); ctx.clip();
    ctx.font = '900 30px Grimcut Silver'; ctx.textAlign = 'center';
    ctx.fillText('THE COIN·PUSHER ROGUELIKE', CX, 652);
    ctx.restore();
    // gold rules either side
    ctx.save(); ctx.globalAlpha = tagK; ctx.fillStyle = '#b98a2c';
    ctx.fillRect(CX - 290, 668, 580 * outCubic(tagK), 2); ctx.restore();
  }
  // INSERT COIN — the arcade's oldest promise
  if (t > 17.4) {
    const blink = (Math.floor((t - 17.4) / 0.55) % 2) === 0;
    if (blink) {
      ctx.save();
      ctx.font = '900 42px Grimcut Gold'; ctx.textAlign = 'center';
      ctx.shadowColor = 'rgba(255,190,60,0.9)'; ctx.shadowBlur = 28;
      ctx.fillText('INSERT COIN', CX, 900);
      ctx.restore();
    }
    coin(CX, 952 + Math.sin(t * 2.2) * 4, 18, Math.cos(t * 3), 0.6);
  }
}

// ---- post: grain + vignette ----------------------------------------------------
function post(t) {
  // vignette
  const v = ctx.createRadialGradient(CX, H * 0.46, H * 0.28, CX, H * 0.52, H * 0.78);
  v.addColorStop(0, 'rgba(0,0,0,0)'); v.addColorStop(1, 'rgba(0,0,0,0.5)');
  ctx.fillStyle = v; ctx.fillRect(0, 0, W, H);
  // film grain — cheap deterministic sparkle
  const f = Math.floor(t * 30);
  ctx.save(); ctx.globalAlpha = 0.05;
  for (let i = 0; i < 240; i++) {
    const x = hx(i, f * 7 + 1) * W, y = hx(i, f * 7 + 2) * H;
    ctx.fillStyle = hx(i, f * 7 + 3) > 0.5 ? '#fff' : '#000';
    ctx.fillRect(x, y, 1.6, 1.6);
  }
  ctx.restore();
  // ending fade
  const out = seg(t, 19.45, 19.98);
  if (out > 0) { ctx.fillStyle = 'rgba(0,0,0,' + inCubic(out) + ')'; ctx.fillRect(0, 0, W, H); }
}

// ============================================================================
function renderFrame(t) {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.clearRect(0, 0, W, H);
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);
  // camera shake from whichever hit is freshest
  let sx = 0, sy = 0;
  const hits = [[HIT, 16], [2.55, 9], [3.35, 9], [4.15, 11], [5.0, 8], [6.6, 8], [8.2, 22], [9.7, 8], [11.4, 12], [15.3 + 0.30, 20]];
  for (const [t0, amp] of hits) { const [a, b] = shake(t, t0, amp); sx += a; sy += b; }
  ctx.save();
  ctx.translate(sx, sy);
  if (t < 2.3) sceneA(t);
  else if (t < 5.0) sceneB(t);
  else if (t < 13.0) sceneC(t);
  else if (t < 15.2) sceneD(t);
  else sceneE(t);
  ctx.restore();
  post(t);
}
window.renderFrame = renderFrame;
window.frameJpeg = function (t, q) { renderFrame(t); return cv.toDataURL('image/jpeg', q || 0.95); };
window.introReady = () => ready;

// live preview when opened by hand
if (location.hash === '#play') {
  const t0 = performance.now();
  (function loop() { if (ready) renderFrame(((performance.now() - t0) / 1000) % 20); requestAnimationFrame(loop); })();
}
</script>
