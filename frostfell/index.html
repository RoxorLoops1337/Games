  *{ box-sizing:border-box; margin:0; padding:0; }
  html,body{
    width:100%; height:100%; overflow:hidden; background:#05080f; color:#e9f2ff;
    font-family:'Frostwork','Trebuchet MS',system-ui,sans-serif;
    -webkit-user-select:none; user-select:none; -webkit-touch-callout:none;
    -webkit-tap-highlight-color:transparent; touch-action:none; overscroll-behavior:none;
  }
  #stage{ position:fixed; inset:0; display:grid; place-items:center; background:#05080f; }
  #game{ display:block; touch-action:none; image-rendering:auto; }

  /* Portrait gate — the whole game is authored landscape, so a phone held the
     wrong way gets a proper screen rather than a squeezed board. */
  #rotate{
    position:fixed; inset:0; display:none; place-items:center; text-align:center;
    background:radial-gradient(120% 90% at 50% 20%, #14294a 0%, #070c17 70%); z-index:20;
    padding:24px;
  }
  body.portrait #rotate{ display:grid; }
  body.portrait #stage{ visibility:hidden; }
  #rotate .inner{ max-width:340px; }
  #rotate .glyph{
    width:96px; height:150px; margin:0 auto 26px; border:5px solid #cfe4ff; border-radius:14px;
    position:relative; animation:tip 2.4s ease-in-out infinite;
    box-shadow:0 0 0 4px rgba(0,0,0,.45), 0 10px 40px rgba(80,160,255,.25);
  }
  #rotate .glyph::after{ content:''; position:absolute; left:50%; bottom:8px; width:28px; height:4px;
    transform:translateX(-50%); background:#cfe4ff; border-radius:2px; opacity:.75; }
  @keyframes tip{ 0%,35%{ transform:rotate(0deg);} 65%,100%{ transform:rotate(-90deg);} }
  #rotate h2{ font-family:'Frostcut','Trebuchet MS',sans-serif; font-size:26px; letter-spacing:3px;
    color:#eaf4ff; text-shadow:0 3px 0 #0a1830; }
  #rotate p{ margin-top:12px; color:#8fb2dd; font-size:15px; line-height:1.5; letter-spacing:.5px; }

  /* First-touch gate: audio + fullscreen + orientation lock all need a gesture. */
  #boot{ position:fixed; inset:0; display:grid; place-items:center; z-index:15;
    background:radial-gradient(120% 90% at 50% 30%, #16304f 0%, #05080f 72%); }
  #boot.gone{ display:none; }
  #boot .card{ text-align:center; padding:30px 40px; }
  #boot h1{ font-family:'Frostcut','Trebuchet MS',sans-serif; font-size:clamp(38px,9vw,74px);
    letter-spacing:8px; color:#dff0ff;
    text-shadow:0 4px 0 #17385f, 0 8px 0 #0d2039, 0 14px 34px rgba(90,180,255,.4); }
  #boot .sub{ margin-top:14px; color:#7fa6d6; letter-spacing:4px; font-size:13px; text-transform:uppercase; }
  #boot .go{ margin-top:34px; display:inline-block; padding:15px 42px; cursor:pointer;
    font-family:'Frostcut','Trebuchet MS',sans-serif; font-size:22px; letter-spacing:4px; color:#08131f;
    background:linear-gradient(#9fe6ff,#4fb8f0); border-radius:14px;
    box-shadow:0 6px 0 #1c6b9c, 0 12px 26px rgba(0,0,0,.5); animation:pulse 2.2s ease-in-out infinite; }
  #boot .go:active{ transform:translateY(4px); box-shadow:0 2px 0 #1c6b9c, 0 6px 14px rgba(0,0,0,.5); }
  @keyframes pulse{ 50%{ filter:brightness(1.12); } }
</style>

<script>
/* ===========================================================================
   FROSTFELL — one file, no dependencies. Markup, CSS and this script are the
   whole game.

     1  utilities, rng, tween helpers
     2  palette + art language
     3  statuses and keywords
     4  card data (wardens, gear, charms) and the bestiary
     5  run + battle state
     6  battle engine — the bell, counters, targeting, damage, death
     7  run layer — the trail map, rewards, shop, camp, saving
     8  juice — shake, particles, floaters, the beat queue
     9  rendering — creatures, cards, board, trail, screens
    10  input — pointer, drag and drop, hit testing
    11  audio — a small procedural kit
    12  boot + main loop

   Headless tests set window.__FF_HEADLESS__ before evaluating this script and
   drive the game through window.FF; nothing here may require a real canvas.
   =========================================================================== */
(function(){
'use strict';

const HEADLESS = typeof window !== 'undefined' && !!window.__FF_HEADLESS__;

/* ========================================================== 1. utilities === */

const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const lerp = (a, b, t) => a + (b - a) * t;
const TAU = Math.PI * 2;
const easeOut = (t) => 1 - Math.pow(1 - t, 3);
const easeIn = (t) => t * t * t;
const easeInOut = (t) => (t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2);
// A soft overshoot — the shape every card that lands on the board uses.
const easeBack = (t) => { const c = 1.70158 + 1; return 1 + c * Math.pow(t - 1, 3) + 1.70158 * Math.pow(t - 1, 2); };
const cap = (s) => s.charAt(0).toUpperCase() + s.slice(1);

/* A small deterministic PRNG. Runs are seeded so a trail can be replayed and
   so the suites get the same board twice. */
function mulberry(seed) {
  let a = seed >>> 0;
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
let RNG = mulberry(1);
const rnd = () => RNG();
const rint = (n) => Math.floor(RNG() * n);
const rrange = (a, b) => a + Math.floor(RNG() * (b - a + 1));
const pick = (arr) => arr[Math.floor(RNG() * arr.length)];
function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(RNG() * (i + 1));
    const t = arr[i]; arr[i] = arr[j]; arr[j] = t;
  }
  return arr;
}
/* Draw without repeats, tolerating a pool smaller than the ask. */
function sample(arr, n) {
  const c = arr.slice();
  shuffle(c);
  return c.slice(0, Math.min(n, c.length));
}

/* ================================================ 2. palette + art language */

const C = {

const STATUS_ORDER = ['frost', 'ember', 'shell', 'spice', 'weak', 'swift', 'slow', 'regen', 'thorns', 'bounty'];

/* Keywords live on the card, not on the unit — they never decay. */
const KEYWORD = {

const LOCKED = {};
for (const u of UNLOCKS) LOCKED[u.id] = u;

const found = (id) => !LOCKED[id] || !!(G.meta.found && G.meta.found[id]);
const statOf = (k) => (G.meta.stats && G.meta.stats[k]) || 0;

/* Called wherever a counter moves. Anything that has come due is announced
   once and remembered. */
function checkUnlocks(g) {
  const out = [];
  for (const u of UNLOCKS) {
    if (found(u.id)) continue;
    if (statOf(u.stat) < u.n) continue;
    G.meta.found[u.id] = true;
    if (u.kind === 'tribe' && G.meta.unlocked.indexOf(u.id) < 0) G.meta.unlocked.push(u.id);
    out.push(u);
  }
  if (out.length) {
    saveMeta();
    for (const u of out) {
      const name = u.kind === 'tribe' ? TRIBES[u.id].name : (CARDS[u.id] || CHARMS[u.id] || {}).name || u.id;
      fx.toast(name.toUpperCase() + ' UNLOCKED', C.gold);
      sfx('get');
    }
  }
  return out;
}
function bumpStat(k, v, mode) {
  G.meta.stats = G.meta.stats || {};
  const cur = G.meta.stats[k] || 0;
  G.meta.stats[k] = mode === 'max' ? Math.max(cur, v) : cur + v;
}

/* ============================================ 5. run + battle state ======= */

/* The board is two LANES deep three columns. Column 0 is the front — the side
   of the slot nearest the middle of the table — and a swing hits the
   front-most foe standing in the attacker's own lane. Everything about
   positioning falls out of those two sentences. */
const LANES = 2;
const COLS = 3;
const HAND = 6;
const BELL_CHARGE = 4;   // turns without ringing before a free redraw
const bellNeed = (g) => BELL_CHARGE + ((g.run && g.run.bellSlow) || 0);

const G = {
  screen: 'title',
  t: 0,                 // seconds since boot, for every idle animation
  run: null,
  battle: null,
  ui: {},               // transient per-screen scratch (reward picks, shop stock…)
  hitStop: 0,
  meta: { runs: 0, wins: 0, best: 0, unlocked: ['hearth', 'frost'], found: {},
    stats: { kills: 0, bestCombo: 0, flawless: 0, wins: 0, zones: 0 },
    winter: {}, mute: false, taught: false },
};

let UID = 1;
const nextUid = () => UID++;

/* A card instance: a copy of the definition that a run owns and can charm. */
function mkCard(id) {
  const d = CARDS[id];
  if (!d) throw new Error('no card ' + id);
  const c = {
    uid: nextUid(), def: id, name: d.name, type: d.type, tribe: d.tribe || null,
    rare: d.rare || 1, text: d.text || '', art: d.art, leader: !!d.leader,
    kw: Object.assign({}, d.kw || {}), charms: [], bonusDeploy: [], dmg: 0,
  };
  if (d.type === 'unit') { c.hp = d.hp; c.atk = d.atk; c.cnt = d.cnt; }
  if (d.type === 'item') { c.target = d.target; }
  return c;
}

/* Charms and scars both bolt onto an instance and are re-applied from scratch
   so a stat can never drift by being applied twice. */
function attachCharm(card, ch) {
  card.charms.push(ch.id);
  rebuildCard(card);
}
function rebuildCard(card) {
  const d = CARDS[card.def];
  card.kw = Object.assign({}, d.kw || {});
  card.bonusDeploy = [];
  if (d.type === 'unit') { card.hp = d.hp; card.atk = d.atk; card.cnt = d.cnt; }
  for (const id of card.charms) {
    const ch = chOf(id);
    if (ch) ch.apply(card);
  }
  if (card.hp !== undefined) card.dmg = Math.min(card.dmg, card.hp - 1);
}

/* A unit is a card standing on the board. */
function mkUnit(card, side, lane, col) {
  const d = CARDS[card.def] || FOES[card.def];
  const inj = card.injured ? 0.5 : 1;
  const maxHp = Math.max(1, Math.round(card.hp * inj));
  return {
    uid: nextUid(), card, def: card.def, name: card.name, side, lane, col,
    maxHp, hp: Math.max(1, maxHp - (card.dmg || 0)),
    atk: Math.max(0, Math.round(card.atk * inj)) + (card.kw && card.kw.hoard ? Math.min(HOARD_CAP, card.held || 0) : 0),
    cntMax: card.cnt, cnt: card.cnt,
    st: {}, kw: Object.assign({}, card.kw), hooks: (d && d.hooks) || {},
    art: card.art, leader: !!card.leader, boss: !!(d && d.boss),
    alive: true,
    // presentation only
    px: 0, py: 0, sq: 0, flash: 0, hitT: 0, bob: rnd() * TAU, born: 0, dead: 0, blink: rnd() * 4,
  };
}

/* Enemies are built straight from the bestiary with a zone scale. */
function mkFoeCard(id, scale) {
  const d = FOES[id];
  const s = scale || 1;
  return {
    uid: nextUid(), def: id, name: d.name, type: 'unit', tribe: null, rare: 1,
    text: d.text || '', art: d.art, leader: false, foe: true, boss: !!d.boss,
    kw: Object.assign({}, d.kw || {}), charms: [], bonusDeploy: [], dmg: 0,
    hp: Math.max(1, Math.round(d.hp * s)), atk: Math.max(0, Math.round(d.atk * s)), cnt: d.cnt,
  };
}

/* --------------------------------------------------------- board queries -- */
const B = () => G.battle;
const units = (g) => (g.battle ? g.battle.units.filter((u) => u.alive) : []);
const playerUnits = (g) => units(g).filter((u) => u.side === 'p');
const enemyUnits = (g) => units(g).filter((u) => u.side === 'e');
const sideUnits = (g, side) => units(g).filter((u) => u.side === side);
const allies = (g, u) => sideUnits(g, u.side);
const foes = (g, u) => sideUnits(g, u.side === 'p' ? 'e' : 'p');
const unitAt = (g, side, lane, col) => units(g).find((u) => u.side === side && u.lane === lane && u.col === col) || null;
const slotFree = (g, side, lane, col) => !unitAt(g, side, lane, col);
const laneOf = (g, side, lane) => units(g).filter((u) => u.side === side && u.lane === lane).sort((a, b) => a.col - b.col);
const other = (side) => (side === 'p' ? 'e' : 'p');
function freeSlots(g, side) {
  const out = [];
  for (let l = 0; l < LANES; l++) for (let c = 0; c < COLS; c++) if (slotFree(g, side, l, c)) out.push({ lane: l, col: c });
  return out;
}

/* Everything a swing has to know about who is standing where.

   A unit looks down its OWN lane first. If that lane is empty it reaches
   across to the other one rather than idling — which is what stops two lines
   that can no longer see each other from standing there until the sun comes
   back. Lane position still decides who gets hit first, and that is where the
   tactics live. */
function enemyLine(g, u, laneOverride) {
  const s = other(u.side);
  const home = laneOverride !== undefined ? laneOverride : u.lane;
  const order = [home];
  for (let i = 0; i < LANES; i++) if (i !== home) order.push(i);
  for (const l of order) {
    const line = laneOf(g, s, l);
    if (line.length) return line;
  }
  return [];
}
function frontTarget(g, u) {
  const line = enemyLine(g, u);
  return line[0] || null;
}
function targetFor(g, u, laneOverride) {
  const line = enemyLine(g, u, laneOverride);
  if (!line.length) return null;
  if (u.kw.aimless) return pick(line);
  // Soak is a taunt: whatever the attacker would rather hit, the soaker is in
  // the way. It is the only thing that overrides Longshot.
  const soaker = line.find((x) => x.kw.soak);
  if (soaker) return soaker;
  if (u.kw.longshot) return line[line.length - 1];
  return line[0];
}
function laneTargets(g, u, lane) { return laneOf(g, other(u.side), lane); }
function neighbours(g, u) {
  const out = [];
  for (const v of units(g)) {
    if (v === u || v.side !== u.side) continue;
    if (Math.abs(v.lane - u.lane) + Math.abs(v.col - u.col) === 1) out.push(v);
  }
  return out;
}

/* The resolution order, which the player can see before committing: every foe
   ticks before every warden, and inside a side the front of the table goes
   first, top lane before bottom. */
function turnOrder(g) {
  return units(g).slice().sort((a, b) => {
    if (a.side !== b.side) return a.side === 'e' ? -1 : 1;
    if (a.col !== b.col) return a.col - b.col;
    return a.lane - b.lane;
  });
}

/* ==================================== 6. the battle engine =============== */

/* Beats are how the game breathes. Every state change that a player should be
   able to *see* is queued as a beat; the loop drains one at a time so a round
   plays out as a readable sequence instead of a single frame of arithmetic.
   Headless runs drain instantly, so the suites see the same state a player
   would see once the dust settles. */
const Q = { items: [], wait: 0, draining: false };
function beat(delay, fn) {
  Q.items.push({ d: delay, fn });
  if (HEADLESS) drainAll();
}
function drainAll() {
  if (Q.draining) return;
  Q.draining = true;
  let guard = 0;
  while (Q.items.length && guard++ < 20000) {
    const it = Q.items.shift();
    if (it.fn) it.fn();
  }
  Q.draining = false;
}
function clearBeats() { Q.items.length = 0; Q.wait = 0; }
const beatsBusy = () => Q.items.length > 0 || Q.wait > 0;

/* ------------------------------------------------------------- statuses -- */
function addStatus(g, u, key, n) {
  if (!u || !u.alive || !n) return;
  u.st[key] = (u.st[key] || 0) + n;
  if (u.st[key] <= 0) delete u.st[key];
  fx.pop(u, cap(STATUS[key] ? STATUS[key].name : key) + ' ' + n, STATUS[key] ? STATUS[key].col : C.snow);
  if (key === 'frost') {
    // Glacierling and friends listen for a foe going cold.
    for (const a of sideUnits(g, u.side === 'p' ? 'e' : 'p')) if (a.hooks.frosted) a.hooks.frosted(g, a, u);
  }
}
const stat = (u, key) => u.st[key] || 0;
function spend(u, key, n) {
  if (!u.st[key]) return 0;
  const took = Math.min(u.st[key], n === undefined ? u.st[key] : n);
  u.st[key] -= took;
  if (u.st[key] <= 0) delete u.st[key];
  return took;
}

/* ---------------------------------------------------------------- damage -- */
function hurt(g, u, amount, src) {
  if (!u || !u.alive || amount <= 0) return 0;
  let dmg = Math.round(amount);
  const sh = stat(u, 'shell');
  if (sh > 0) {
    const soaked = Math.min(sh, dmg);
    spend(u, 'shell', soaked);
    dmg -= soaked;
    fx.pop(u, '-' + soaked, STATUS.shell.col);
    fx.burst(u, STATUS.shell.col, 8);
  }
  if (dmg > 0) {
    u.hp -= dmg;
    u.flash = 1; u.hitT = 1; u.sq = 1;
    fx.pop(u, '-' + dmg, C.blood);
    fx.burst(u, C.blood, 10);
    fx.shake(Math.min(9, 2 + dmg * 0.5));
    if (dmg >= 6) G.hitStop = Math.min(0.12, 0.03 + dmg * 0.008);
    sfx('hit');
  }
  const th = stat(u, 'thorns');
  if (th > 0 && src && src.alive && src !== u) hurt(g, src, th, null);
  if (u.hp <= 0) die(g, u, src);
  return dmg;
}
function heal(g, u, n) {
  if (!u || !u.alive || n <= 0) return;
  const before = u.hp;
  u.hp = Math.min(u.maxHp, u.hp + n);
  if (u.hp > before) { fx.pop(u, '+' + (u.hp - before), C.leaf); fx.burst(u, C.leaf, 8); sfx('heal'); }
}
function die(g, u, killer) {
  if (!u.alive) return;
  u.alive = false;
  u.dead = 0.0001;
  sfx('die');
  fx.burst(u, u.side === 'p' ? C.snowDim : '#c9d6ea', 22);
  fx.shake(7);
  const b = stat(u, 'bounty');
  if (b > 0 && u.side === 'e' && g.run) { g.run.gold += b; fx.pop(u, '+' + b + ' scrip', C.gold); }
  // Kills inside one turn are counted together: clearing a board in a single
  // action is the play the whole game is pointed at, and it should pay.
  if (u.side === 'e' && g.battle) {
    g.battle.combo = (g.battle.combo || 0) + 1;
    bumpStat('kills', 1);
    if (g.run) g.run.kills = (g.run.kills || 0) + 1;
  }
  if (u.side === 'p' && !u.leader && g.run) g.run.fellThisZone = (g.run.fellThisZone || 0) + 1;
  if (u.kw.explode) neighbours(g, u).concat(foes(g, u).filter((f) => f.lane === u.lane)).forEach((n2) => hurt(g, n2, u.kw.explode, null));
  if (u.hooks.death) u.hooks.death(g, u, killer);
  for (const a of allies(g, u)) if (a.hooks.allyDeath) a.hooks.allyDeath(g, a, u);
  if (killer && killer.alive && killer.hooks.kill) killer.hooks.kill(g, killer, u);
  if (u.side === 'p' && u.card && !u.card.foe) u.card.fainted = true;
  checkOver(g);
}

/* ------------------------------------------------------------- triggering -- */

/* A trigger is the whole event: the card's ability fires AND it swings, and
   Frenzy repeats the pair. Nothing on a card ever happens because it was
   played — it happens because it triggered. */
function triggerUnit(g, u) {
  if (!u || !u.alive) return;
  // Nothing in front of it? It goes looking. Clearing a lane buys you a turn
  // of quiet, not a foe that stands there for the rest of the fight.
  if (!laneOf(g, other(u.side), u.lane).length && shuffleToward(g, u)) return;
  const times = 1 + (u.kw.frenzy || 0);
  for (let i = 0; i < times; i++) {
    if (!u.alive || g.battle.over) break;
    if (u.hooks.trigger) u.hooks.trigger(g, u);
    if (u.atk > 0) attackOnce(g, u);
  }
  // Spice and its sour twin are burned off by the whole chain, not per hit.
  spend(u, 'spice');
  spend(u, 'weak');
}

function attackOnce(g, u) {
  const primary = targetFor(g, u);
  if (!primary) { fx.pop(u, 'no target', C.snowDim); return; }
  const targets = u.kw.barrage ? laneTargets(g, u, primary.lane) : [primary];
  let dmg = u.atk + stat(u, 'spice');
  // Crush reads the line it is swinging into: the more of them are stacked up
  // in that lane, the harder every one of them is hit.
  if (u.kw.crush) dmg += u.kw.crush * Math.max(0, laneTargets(g, u, primary.lane).length - 1);
  if (stat(u, 'weak') > 0) dmg = Math.floor(dmg / 2);
  fx.lunge(u, primary);
  sfx('swing');
  for (const t of targets.slice()) {
    if (!t.alive) continue;
    const dealt = hurt(g, t, dmg, u);
    if (u.kw.leech && dealt > 0) heal(g, u, dealt);
    if (u.alive && u.hooks.hit) u.hooks.hit(g, u, t);
    if (u.kw.shove && t.alive && dealt > 0) shoveUnit(g, t, 1);
    // Smackback answers a landed hit with half the defender's own attack.
    if (t.alive && t.kw.smack && dmg > 0) hurt(g, u, Math.max(1, Math.floor(t.atk / 2)), t);
  }
}

/* Push somebody along their own lane. If the slot behind is taken the two of
   them trade places instead, so a shove is never simply refused. */
function shoveUnit(g, u, dir) {
  if (!u || !u.alive) return false;
  const nc = clamp(u.col + dir, 0, COLS - 1);
  if (nc === u.col) return false;
  const there = unitAt(g, u.side, u.lane, nc);
  if (there) { there.col = u.col; there.moveT = 1; }
  u.col = nc;
  u.moveT = 1;
  fx.pop(u, dir > 0 ? 'SHOVED' : 'HAULED', C.snowDim);
  sfx('move');
  return true;
}

/* Walk into the lane where the fighting is, if there is a slot going. Costs
   the trigger — a unit that repositions does not also swing. */
function shuffleToward(g, u) {
  const s = other(u.side);
  let want = -1;
  for (let l = 0; l < LANES; l++) if (l !== u.lane && laneOf(g, s, l).length) { want = l; break; }
  if (want < 0) return false;
  for (let c = 0; c < COLS; c++) {
    if (slotFree(g, u.side, want, c)) {
      u.lane = want; u.col = c; u.moveT = 1;
      fx.pop(u, 'MOVES', C.snowDim);
      sfx('move');
      return true;
    }
  }
  return false;
}

/* Every counter movement in the game goes through here. A counter driven to
   zero by a card fires straight away — that is the combo engine, and it is
   also why Frost has to sit in front of it. */
function tickCounter(g, u, n, natural) {
  if (!u || !u.alive || n <= 0) return false;
  if (stat(u, 'frost') > 0) {
    if (natural) { spend(u, 'frost', 1); fx.pop(u, 'FROZEN', STATUS.frost.col); fx.burst(u, STATUS.frost.col, 8); }
    else fx.pop(u, 'FROZEN', STATUS.frost.col);
    return false;
  }
  let ticks = n;
  if (natural) ticks += spend(u, 'swift');
  if (natural && stat(u, 'slow') > 0) { spend(u, 'slow', 1); fx.pop(u, 'SLOW', STATUS.slow.col); return false; }
  u.cnt = Math.max(0, u.cnt - ticks);
  if (u.cnt > 0) return false;
  u.cnt = u.cntMax;
  u.tick = 1;
  triggerUnit(g, u);
  return true;
}

/* ------------------------------------------------------- the turn ------- */

/* One action per turn: play a card, ring the bell, or pass. Moving a warden
   already on the board is free and does not spend the turn. That single rule
   is what prices everything else in the game. */
function resolveTurn(g) {
  const b = g.battle;
  if (!b || b.over || b.busy) return;
  b.busy = true;
  b.turn++;
  fx.bell();
  payCombo(g);

  for (const u of turnOrder(g)) {
    beat(0.13, () => {
      if (!u.alive || b.over) return;
      tickCounter(g, u, 1, true);
    });
  }

  // Anything still in hand at the end of the turn has waited another turn.
  beat(0.01, () => {
    for (const c of b.hand) if (c.kw && c.kw.hoard) c.held = Math.min(HOARD_CAP, (c.held || 0) + 1);
  });

  /* End of turn: burns bite, mending mends, both fade. */
  beat(0.18, () => {
    if (b.over) return;
    for (const u of units(g).slice()) {
      const em = stat(u, 'ember');
      if (em > 0) { hurt(g, u, em, null); u.st.ember = Math.floor(em / 2); if (!u.st.ember) delete u.st.ember; }
      const rg = stat(u, 'regen');
      if (rg > 0) { heal(g, u, rg); u.st.regen = Math.floor(rg / 2); if (!u.st.regen) delete u.st.regen; }
    }
    checkOver(g);
  });

  beat(0.12, () => {
    if (b.over) return;
    if (b.waves && b.waves.length) {
      b.waveCnt--;
      if (b.waveCnt <= 0) deployWave(g);
    }
  });

  beat(0.1, () => {
    b.busy = false;
    if (b.over) return;
    if (b.bell < bellNeed(g)) b.bell++;
    if (!b.hand.length && b.bell < bellNeed(g)) b.bell = bellNeed(g);  // never softlock an empty hand
  });
}

/* Settle up whatever the last action killed. Two in one turn is a combo, and
   it climbs from there. */
function payCombo(g) {
  const b = g.battle;
  const n = b.combo || 0;
  b.combo = 0;
  if (n < 2 || !g.run) return 0;
  const paid = n * 4 + (n >= 4 ? 12 : 0);
  g.run.gold += paid;
  b.bestCombo = Math.max(b.bestCombo || 0, n);
  bumpStat('bestCombo', n, 'max');
  g.run.bestTurn = Math.max(g.run.bestTurn || 0, n);
  checkUnlocks(g);
  fx.toast(n + ' IN ONE TURN   +' + paid, n >= 4 ? '#ff9a3c' : C.gold);
  fx.flash('#ffd9a0', 0.2 + n * 0.03);
  fx.shake(4 + n);
  sfx('combo');
  return paid;
}

/* The redraw bell: throws the hand away and deals a fresh one. Free once it
   has charged, otherwise it costs you the turn. */
function ringBell(g) {
  const b = g.battle;
  if (!b || b.over || b.busy) return false;
  const free = b.bell >= bellNeed(g);
  sfx('bell');
  while (b.hand.length) b.discard.push(b.hand.pop());
  for (let i = 0; i < handSize(g); i++) if (!drawToHand(g)) break;
  b.bell = 0;
  b.rang = 1;
  if (!free) resolveTurn(g);
  return true;
}

function passTurn(g) {
  const b = g.battle;
  if (!b || b.over || b.busy) return false;
  resolveTurn(g);
  return true;
}

/* Repositioning is free — the whole tactical layer lives here. */
function moveUnit(g, u, lane, col) {
  const b = g.battle;
  if (!b || b.over || b.busy || !u || !u.alive || u.side !== 'p') return false;
  if (u.lane === lane && u.col === col) return false;
  const at = unitAt(g, 'p', lane, col);
  if (at) { at.lane = u.lane; at.col = u.col; at.moveT = 1; }   // swap places
  u.lane = lane; u.col = col; u.moveT = 1;
  sfx('move');
  return true;
}

function checkOver(g) {
  const b = g.battle;
  if (!b || b.over) return;
  const leader = b.units.find((u) => u.side === 'p' && u.leader);
  if (leader && !leader.alive) { b.over = true; b.won = false; beat(0.6, () => endBattle(g, false)); return; }
  if (enemyUnits(g).length) return;
  payCombo(g);
  // A cleared board with a wave still coming is not a win — it walks straight
  // on, which is what stops the fight going quiet.
  if (b.waves && b.waves.length) { beat(0.35, () => deployWave(g)); return; }
  b.over = true; b.won = true;
  beat(0.7, () => endBattle(g, true));
}

/* -------------------------------------------------------------- the hand -- */
const handSize = (g) => HAND + ((g.run && g.run.bonusHand) || 0);

function drawToHand(g) {
  const b = g.battle;
  if (b.hand.length >= handSize(g)) return null;
  if (!b.draw.length) {
    if (!b.discard.length) return null;
    b.draw = shuffle(b.discard.slice());
    b.discard.length = 0;
  }
  const c = b.draw.shift();
  c.handT = 0;
  c.held = 0;
  b.hand.push(c);
  return c;
}

/* Can this card be played onto this spot? `spot` is {lane,col} for wardens,
   a unit for aimed gear. */
function canPlay(g, card, spot) {
  const b = g.battle;
  if (!b || b.over || b.busy) return false;
  if (card.type === 'unit') {
    if (!spot || spot.lane === undefined) return false;
    return slotFree(g, 'p', spot.lane, spot.col);
  }
  const tg = CARDS[card.def].target;
  if (tg === 'none') return true;
  if (!spot || !spot.uid || !spot.alive) return false;
  if (tg === 'ally') return spot.side === 'p';
  if (tg === 'enemy') return spot.side === 'e';
  return true;
}

function playCard(g, idx, spot) {
  const b = g.battle;
  const card = b.hand[idx];
  if (!card || !canPlay(g, card, spot)) return false;
  b.hand.splice(idx, 1);
  const d = CARDS[card.def];
  if (card.type === 'unit') {
    const u = mkUnit(card, 'p', spot.lane, spot.col);
    u.born = 0.0001;
    b.units.push(u);
    sfx('place');
    fx.thump(u);
    for (const [k, n] of card.bonusDeploy) addStatus(g, u, k, n);
    if (d.hooks && d.hooks.deploy) d.hooks.deploy(g, u);
  } else {
    sfx('item');
    if (spot && spot.uid) fx.burst(spot, (d.art && d.art.col) || C.snow, 14);
    d.effect(g, spot, card);
  }
  card.held = 0;
  b.discard.push(card);
  checkOver(g);
  if (!b.over) resolveTurn(g);
  return true;
}

/* --------------------------------------------------------------- summons -- */
function summon(g, foeId, count) {
  for (let i = 0; i < (count || 1); i++) {
    const free = freeSlots(g, 'e');
    if (!free.length) return;
    const s = pick(free);
    const u = mkUnit(mkFoeCard(foeId, g.run ? foeScale(g.run) : 1), 'e', s.lane, s.col);
    u.born = 0.0001;
    g.battle.units.push(u);
    fx.thump(u);
  }
}

/* ------------------------------------------------------- starting a fight -- */
function foeScale(run) {
  // Enemies grow with the trail, gently: the deck should outpace them if the
  // player picks well, and fall behind if they do not.
  return (1 + run.step * 0.035 + run.zone * 0.10) * (run.foeMul || 1);
}

/* An encounter is a list of WAVES. The first walks on at the bell; the rest
   arrive on their own counter, or early if the player rings for them —
   which is a real choice, because a wave pulled onto a board you have already
   set up dies faster than one that arrives while you are rebuilding. */
const WAVE_GAP = 5;
const waveGap = (g) => Math.max(2, WAVE_GAP + ((g.run && g.run.waveBonus) || 0));

/* Locked in per run so a reload does not reroll the beast you were beaten by. */
function zoneBoss(g, zi) {
  const zone = ZONES[clamp(zi, 0, ZONES.length - 1)];
  const list = zone.bosses || [zone.boss];
  const run = g.run;
  if (!run) return list[0];
  run.bosses = run.bosses || {};
  if (!run.bosses[zi]) run.bosses[zi] = list[Math.floor(mulberry((run.seed + zi * 7717) >>> 0)() * list.length)] || list[0];
  return run.bosses[zi];
}

function foePool(zone) {
  const tiers = zone.tiers;
  const pool = Object.values(FOES).filter((f) => !f.boss && tiers.indexOf(f.tier) >= 0);
  if (pool.length) return pool;
  return Object.values(FOES).filter((f) => !f.boss && f.tier <= Math.max.apply(null, tiers));
}
function frontFirstSpots() {
  const spots = [];
  for (let c = 0; c < COLS; c++) for (let l = 0; l < LANES; l++) spots.push({ lane: l, col: c });
  return spots;
}
function buildEncounter(g, kind) {
  const run = g.run;
  const zone = ZONES[clamp(run.zone, 0, ZONES.length - 1)];
  const scale = foeScale(run) * (kind === 'elite' ? 1.25 : 1);
  const src = foePool(zone);
  const waves = [];

  if (kind === 'boss') {
    const guard = Object.values(FOES).filter((f) => !f.boss && f.tier <= zone.tiers[2]);
    // Which beast waits at the end of a zone is drawn per run, so the trail is
    // not the same trail twice.
    const bossId = zoneBoss(g, run.zone);
    waves.push([
      { id: bossId, lane: 0, col: 2, scale: 1 },
      { id: pick(guard).id, lane: 0, col: 0, scale },
      { id: pick(guard).id, lane: 1, col: 0, scale },
    ]);
    waves.push([{ id: pick(guard).id, lane: 0, col: 1, scale }]);
    if (run.zone > 0) waves.push([{ id: pick(guard).id, lane: 1, col: 1, scale }]);
    return waves;
  }

  // One wave of reinforcements, two for a pack. A fight is meant to be won
  // and then survived, not outlasted.
  // The first two skirmishes of a run are deliberately gentle: a caravan that
  // has not drawn its second warden yet cannot answer a wave.
  const opening = run.zone === 0 && run.step < 2;
  const first = (opening ? 2 : kind === 'elite' ? 3 : 2 + (run.step > 3 ? 1 : 0)) + (run.extraFoe || 0);
  const spots = frontFirstSpots();
  waves.push(spots.slice(0, first).map((s) => ({ id: pick(src).id, lane: s.lane, col: s.col, scale })));
  const later = opening ? (run.step === 0 ? 0 : 1) : 1;
  for (let w = 0; w < later; w++) {
    const n = kind === 'elite' ? 2 : 1 + (run.step > 4 ? 1 : 0);
    waves.push(new Array(n).fill(0).map(() => ({ id: pick(src).id, scale })));
  }
  return waves;
}

/* Bring the next wave on. Anything without a named slot takes whatever is
   free, front first; if the board is packed the wave waits a turn. */
function deployWave(g) {
  const b = g.battle;
  if (!b || !b.waves || !b.waves.length) return false;
  const wave = b.waves[0];
  const placed = [];
  for (const e of wave) {
    let lane = e.lane, col = e.col;
    if (lane === undefined || !slotFree(g, 'e', lane, col)) {
      const free = freeSlots(g, 'e').sort((a, x) => a.col - x.col || a.lane - x.lane);
      if (!free.length) break;
      lane = free[0].lane; col = free[0].col;
    }
    const u = mkUnit(mkFoeCard(e.id, e.scale), 'e', lane, col);
    u.born = 0.0001;
    b.units.push(u);
    const fd = FOES[e.id];
    if (fd.hooks && fd.hooks.deploy) fd.hooks.deploy(g, u);
    fx.thump(u);
    placed.push(u);
  }
  if (!placed.length) return false;
  b.waves.shift();
  b.waveCnt = waveGap(g);
  b.waveNo = (b.waveNo || 1) + 1;
  if (b.units.length && b.turn > 0) { fx.shake(6); fx.flash('#ffb0b0', 0.18); sfx('die'); fx.toast('WAVE ' + b.waveNo, '#ff9a3c'); }
  return true;
}

/* Pull the next wave in early. Free, and often the strongest play on the
   board — a wave that lands on your terms is half a wave. */
function ringWave(g) {
  const b = g.battle;
  if (!b || b.over || b.busy || !b.waves || !b.waves.length) return false;
  sfx('bell');
  return deployWave(g);
}

function startBattle(g, kind) {
  const run = g.run;
  clearBeats();
  const b = {
    kind: kind || 'fight', turn: 0, units: [], hand: [], draw: [], discard: [],
    bell: run.bellCharged ? bellNeed(g) : 0, over: false, won: false, busy: false, t: 0,
    order: [],
  };
  g.battle = b;

  // The leader walks on first, into the back of the top lane. Nothing stops
  // the player moving it — repositioning is free.
  const lead = mkUnit(run.leader, 'p', 0, 2);
  lead.born = 0.0001;
  b.units.push(lead);
  const ld = CARDS[run.leader.def];
  if (ld.hooks && ld.hooks.deploy) ld.hooks.deploy(g, lead);
  for (const [k, n] of run.leader.bonusDeploy) addStatus(g, lead, k, n);

  b.waves = buildEncounter(g, kind);
  b.waveNo = 0;
  b.waveCnt = waveGap(g);
  deployWave(g);

  // Sigil-marked wardens are already standing when the bell rings; they never
  // sit in the deck waiting to be drawn.
  for (const card of run.deck) {
    if (!card.sigil || card.type !== 'unit') continue;
    const free = freeSlots(g, 'p').sort((a, x) => a.col - x.col || a.lane - x.lane);
    if (!free.length) break;
    const u = mkUnit(card, 'p', free[0].lane, free[0].col);
    u.born = 0.0001;
    b.units.push(u);
    for (const [k, n] of card.bonusDeploy) addStatus(g, u, k, n);
    const cd = CARDS[card.def];
    if (cd.hooks && cd.hooks.deploy) cd.hooks.deploy(g, u);
  }
  b.draw = shuffle(run.deck.filter((c) => !c.leader && !c.sigil).slice());
  for (let i = 0; i < handSize(g); i++) if (!drawToHand(g)) break;
  b.banner = { text: kind === 'boss' ? 'THE BEAST' : kind === 'elite' ? 'A PACK' : 'SKIRMISH',
    sub: ZONES[clamp(run.zone, 0, ZONES.length - 1)].name, t: 0,
    col: kind === 'boss' ? '#ff9a3c' : kind === 'elite' ? '#ff8b7a' : '#9fe0ff' };
  g.screen = 'battle';
  drainAll();
  return b;
}

function endBattle(g, won) {
  const run = g.run;
  // Carry damage home: a warden that survived stays hurt, one that fainted
  // comes back whole but scarred.
  for (const u of g.battle.units) {
    if (u.side !== 'p' || !u.card) continue;
    if (u.alive) u.card.dmg = Math.max(0, u.maxHp - u.hp);
  }
  // A warden that fell is Hurt — half its attack and half its health until it
  // sees a fight through. One that came home standing shakes it off.
  for (const c of run.deck.concat([run.leader])) {
    if (c.fainted) {
      c.fainted = false;
      c.dmg = 0;
      c.injured = true;
      run.log.push(c.name + ' was hurt.');
    } else if (won && c.injured) {
      c.injured = false;
      run.log.push(c.name + ' recovered.');
    }
  }
  if (!won) { g.screen = 'gameover'; G.meta.runs++; saveMeta(); saveRun(null); return; }
  if (g.battle.bestCombo >= 3) run.log.push('A ' + g.battle.bestCombo + '-kill turn.');
  if (run.mend) run.deck.concat([run.leader]).forEach((c) => { c.dmg = Math.max(0, c.dmg - run.mend); });

  run.fights = (run.fights || 0) + 1;
  run.gold += Math.round((g.battle.kind === 'boss' ? 55 : g.battle.kind === 'elite' ? 34 : 22) * (run.purse || 1));
  g.ui.reward = rollReward(g, g.battle.kind);
  g.screen = 'reward';
  sfx('win');
  saveRun(run);
}

/* ================================================ 7. the run layer ======= */

const STARTERS = {
  hearth: { leader: 'bramblewick', deck: ['cinderpup', 'cinderpup', 'kettlebeak', 'snowpup', 'emberflask', 'emberflask', 'stew', 'whetstone'] },
  frost:  { leader: 'vesper',      deck: ['rimefox', 'rimefox', 'chillfin', 'snowpup', 'icepick', 'icepick', 'gearshield', 'whetstone'] },
  scrap:  { leader: 'gundy',       deck: ['clunkbot', 'springjaw', 'scrapcrow', 'snowpup', 'blastcap', 'gearshield', 'bellrope', 'whetstone'] },
  wyrd:   { leader: 'stranger',    deck: ['rimefox', 'cinderpup', 'ratchet', 'snowpup', 'pryrod', 'whetstone', 'stew', 'icepick'] },
};

function genTrail(zoneIdx) {
  const steps = [];
  steps.push([{ kind: 'fight' }]);
  const pools = [
    ['fight', 'event'], ['fight', 'shop'], ['elite', 'event'],
    ['camp', 'cache'], ['fight', 'elite'],
  ];
  for (const p of pools) {
    const a = p[0], b2 = p[1];
    steps.push(rnd() < 0.5 ? [{ kind: a }, { kind: b2 }] : [{ kind: b2 }, { kind: a }]);
  }
  steps.push([{ kind: 'boss' }]);
  return steps;
}

function newRun(g, tribeId, seed, winters) {
  const sd = (seed === undefined ? Math.floor(Math.random() * 1e9) : seed) >>> 0;
  RNG = mulberry(sd || 1);
  UID = 1;
  const s = STARTERS[tribeId] || STARTERS.hearth;
  const run = {
    seed: sd, tribe: tribeId, zone: 0, step: 0, gold: 25, bonusRedraw: 0,
    deck: [], leader: mkCard(s.leader), trail: genTrail(0), log: [], path: [],
    kills: 0, fights: 0, taken: 0, bestTurn: 0, node: null,
    bells: [], bonusHand: 0, bellCharged: false, waveBonus: 0,
    purse: 1, mend: 0, bosses: {},
  };
  for (const id of s.deck) run.deck.push(mkCard(id));
  run.winters = (winters || []).slice();
  run.winterPts = winterPts(run.winters);
  for (const id of run.winters) {
    const w = WINTERS.find((x) => x.id === id);
    if (w) w.apply(run);
  }
  g.run = run;
  g.battle = null;
  g.screen = 'trail';
  g.tut = G.meta.taught ? null : { i: 0, t: 0, over: false };
  G.meta.runs++;
  saveMeta();
  saveRun(run);
  return run;
}

function nodeAt(run) { return run.trail[run.step] || null; }

function enterNode(g, choiceIdx) {
  const run = g.run;
  const step = nodeAt(run);
  if (!step) return;
  const node = step[clamp(choiceIdx, 0, step.length - 1)];
  run.node = node.kind;
  run.path.push(node.kind);
  if (node.kind === 'fight' || node.kind === 'elite' || node.kind === 'boss') {
    startBattle(g, node.kind);
  } else if (node.kind === 'shop') {
    g.ui.shop = rollShop(g);
    g.screen = 'shop';
  } else if (node.kind === 'camp') {
    g.ui.camp = { done: false };
    g.screen = 'camp';
  } else if (node.kind === 'event') {
    g.ui.event = { def: EVENTS[Math.floor(rnd() * EVENTS.length)] };
    g.screen = 'event';
  } else if (node.kind === 'cache') {
    run.gold += 20;
    g.ui.reward = { cards: [], charms: sample(charmPool(), 3), gold: 20, kind: 'cache' };
    g.screen = 'reward';
  }
  saveRun(run);
}

/* Called when whatever the node was is finished with. */
function advance(g) {
  const run = g.run;
  run.step++;
  if (run.step >= run.trail.length) {
    run.zone++;
    if (run.zone >= ZONES.length) {
      G.meta.wins++;
      bumpStat('wins', 1);
      G.meta.winter[run.tribe] = Math.max(G.meta.winter[run.tribe] || 0, run.winterPts || 0);
      if (!run.fellThisZone) bumpStat('flawless', 1);
      checkUnlocks(g);
      G.meta.best = Math.max(G.meta.best, 3);
      saveMeta(); saveRun(null);
      g.screen = 'victory';
      return;
    }
    // a zone crossed without losing anybody is the hardest thing to earn here
    if (!run.fellThisZone) { bumpStat('flawless', 1); run.log.push('A zone crossed with everybody standing.'); }
    run.fellThisZone = 0;
    bumpStat('zones', run.zone, 'max');
    G.meta.best = Math.max(G.meta.best, run.zone);
    checkUnlocks(g);
    run.step = 0;
    run.trail = genTrail(run.zone);
    saveMeta();
  }
  g.battle = null;
  g.screen = 'trail';
  saveRun(run);
}

/* ------------------------------------------------------------- rewards --- */
function cardPool(run) {
  return Object.values(CARDS).filter((c) =>
    !c.leader && found(c.id) && (!c.tribe || c.tribe === run.tribe || rnd() < 0.5));
}
const charmPool = () => Object.keys(CHARMS).filter(found);
function weightedCards(run, n) {
  const pool = cardPool(run);
  const bag = [];
  for (const c of pool) {
    const w = c.rare === 1 ? 5 : c.rare === 2 ? 3 : 1;
    for (let i = 0; i < w; i++) bag.push(c.id);
  }
  const out = [];
  let guard = 0;
  while (out.length < n && guard++ < 200) {
    const id = pick(bag);
    if (out.indexOf(id) < 0) out.push(id);
  }
  return out;
}
function rollReward(g, kind) {
  const run = g.run;
  const r = { kind, cards: weightedCards(run, 3), charms: [], bells: [], gold: 0 };
  // A beast pays in bells — the upgrades that change the rest of the trek.
  if (kind === 'boss') r.bells = sample(Object.keys(BELLS), 3);
  else if (kind === 'elite') r.charms = sample(charmPool(), 2);
  return r;
}
function takeCard(g, id) {
  if (!id) return;
  g.run.deck.push(mkCard(id));
  g.run.taken = (g.run.taken || 0) + 1;
  sfx('get');
}
function takeCharm(g, charmId, cardUid) {
  const card = g.run.deck.concat([g.run.leader]).find((c) => c.uid === cardUid);
  const ch = CHARMS[charmId];
  if (!card || !ch) return false;
  attachCharm(card, ch);
  sfx('get');
  return true;
}

/* ---------------------------------------------------------------- shop --- */
const PRICE = { 1: 22, 2: 34, 3: 48 };
function rollShop(g) {
  const run = g.run;
  const mul = run.prices || 1;
  const p = (n) => Math.round(n * mul);
  const cards = weightedCards(run, 3).map((id) => ({ id, price: p(PRICE[CARDS[id].rare] || 25), sold: false }));
  const charms = sample(charmPool(), 2).map((id) => ({ id, price: p(PRICE[CHARMS[id].rare] + 8), sold: false }));
  return { cards, charms, heal: { price: p(20), sold: false }, scar: { price: p(30), sold: false },
    sigil: { price: p(58), sold: false } };
}
function buy(g, kind, idx, arg) {
  const s = g.ui.shop, run = g.run;
  if (!s) return false;
  const takeGold = (n) => { if (run.gold < n) return false; run.gold -= n; return true; };
  if (kind === 'card') {
    const it = s.cards[idx];
    if (!it || it.sold || !takeGold(it.price)) return false;
    it.sold = true; takeCard(g, it.id); return true;
  }
  if (kind === 'charm') {
    const it = s.charms[idx];
    if (!it || it.sold || run.gold < it.price) return false;
    if (!takeCharm(g, it.id, arg)) return false;
    run.gold -= it.price; it.sold = true; return true;
  }
  if (kind === 'heal') {
    if (s.heal.sold || !takeGold(s.heal.price)) return false;
    s.heal.sold = true;
    run.deck.concat([run.leader]).forEach((c) => { c.dmg = 0; });
    sfx('heal'); return true;
  }
  if (kind === 'scar') {
    const card = run.deck.concat([run.leader]).find((c) => c.uid === arg);
    if (!card || s.scar.sold) return false;
    const i = card.charms.findIndex((id) => SCARS[id]);
    if (i < 0 || !takeGold(s.scar.price)) return false;
    card.charms.splice(i, 1);
    rebuildCard(card);
    s.scar.sold = true;
    sfx('get'); return true;
  }
  return false;
}

/* ---------------------------------------------------------------- camp --- */
function campChoose(g, what, arg) {
  const run = g.run;
  if (g.ui.camp && g.ui.camp.done) return false;
  if (what === 'rest') {
    const mend = Math.max(1, Math.round(6 * (run.campMul || 1)));
    run.deck.concat([run.leader]).forEach((c) => { c.dmg = Math.max(0, c.dmg - mend); });
    sfx('heal');
  } else if (what === 'charm') {
    const ch = CHARMS[arg && arg.charm];
    const card = run.deck.concat([run.leader]).find((c) => c.uid === (arg && arg.uid));
    if (!ch || !card) return false;
    attachCharm(card, ch);
    sfx('get');
  } else if (what === 'toss') {
    const i = run.deck.findIndex((c) => c.uid === arg);
    if (i < 0) return false;
    run.deck.splice(i, 1);
    sfx('get');
  } else return false;
  g.ui.camp.done = true;
  advance(g);
  return true;
}

        go: (g) => advance(g) },
