   that genuinely does not fit reads as "there is more here" rather than as a
   sentence that stops mid-word. */
function cutLines(c, lines, n, size, maxW) {
  if (lines.length <= n) return lines;
  const out = lines.slice(0, Math.max(1, n));
  out[out.length - 1] = ellipsize(c, out[out.length - 1], size, maxW, true);
  return out;
}
/* Same idea for a paragraph: drop a point of size until the whole thing fits
   in the lines available. */
function fitLines(c, str, maxW, maxLines, start, min) {
  let size = start;
  let lines = wrapText(c, str, size, maxW);
  while (lines.length > maxLines && size > min) {
    size -= 0.6;
    lines = wrapText(c, str, size, maxW);
  }
  /* On a phone the text floor can be larger than anything this loop is allowed
     to shrink to, so the paragraph genuinely does not fit and the old code cut
     it mid-word. Report the size the text will actually be DRAWN at — callers
     space their lines off it — and end a cut line in an ellipsis so the card
     face says "there is more here" instead of trailing off. */
  size = textSize(size);
  return { size, lines, cut: (n) => cutLines(c, lines, n, size, maxW) };
}

const RARE_NAME = { 1: 'common', 2: 'uncommon', 3: 'rare' };

/* A card in hand: the full face. Three frames — warden, gear, charm — each
   with its own shape, so a glance at the silhouette tells you what kind of
   thing you are holding before you have read a word of it. */
/* A stat badge with a SHAPE of its own, because three coloured circles in a row
   is a traffic light: the eye has to read the colour before it knows which
   number it is looking at. Attack is a shard, the counter is a disc, health is
   a shield — the silhouettes are distinguishable at hand size and in the corner
   of your eye, which is where a card is actually read. */
function statBadge(c, kind, x, y, r, col, val) {
  c.beginPath();
  if (kind === 'atk') {                       // a shard, point down
    c.moveTo(x - r, y - r * 0.72);
    c.lineTo(x + r, y - r * 0.72);
    c.lineTo(x + r * 0.62, y + r * 0.5);
    c.lineTo(x, y + r * 1.05);
    c.lineTo(x - r * 0.62, y + r * 0.5);
    c.closePath();
  } else if (kind === 'hp') {                 // a shield, flat top, round foot
    c.moveTo(x - r, y - r * 0.8);
    c.lineTo(x + r, y - r * 0.8);
    c.lineTo(x + r, y + r * 0.15);
    c.quadraticCurveTo(x + r, y + r, x, y + r * 1.05);
    c.quadraticCurveTo(x - r, y + r, x - r, y + r * 0.15);
    c.closePath();
  } else {                                    // the clock
    c.arc(x, y, r, 0, TAU);
  }
  /* A BADGE IS A CAST PIECE, not a coloured silhouette. The shapes were right —
     a shard, a disc, a shield are distinguishable in the corner of your eye —
     and they were filled flat, so three of them in a row read as printed icons.
     A gradient down the face, a rim light along the top of the path, a specular
     pin where the light hits, and a shadow under the whole thing: the same four
     things every other surface on the card got, at badge scale. */
  c.save();
  c.shadowColor = 'rgba(4,9,20,.55)'; c.shadowBlur = r * 0.5; c.shadowOffsetY = r * 0.22;
  const g = c.createLinearGradient(0, y - r, 0, y + r);
  g.addColorStop(0, mix(col, '#ffffff', 0.45));
  g.addColorStop(0.5, col);
  g.addColorStop(1, mix(col, '#221a10', 0.30));
  c.fillStyle = g; c.fill();
  c.restore();
  c.lineWidth = Math.max(2, r * 0.24); c.strokeStyle = C.ink; c.lineJoin = 'round'; c.stroke();
  c.save();
  c.clip();
  const lip = c.createLinearGradient(0, y - r, 0, y - r * 0.25);
  lip.addColorStop(0, LIGHT + '0.62)');
  lip.addColorStop(1, LIGHT + '0)');
  c.fillStyle = lip; c.fillRect(x - r, y - r, r * 2, r * 0.8);
  spec(c, x - r * 0.34, y - r * 0.40, r * 0.42, 0.75);
  c.restore();
  const n = String(val);
  const sz = r * (n.length >= 3 ? 0.92 : n.length === 2 ? 1.12 : 1.42);
  txt(c, n, x, y + r * 0.06, sz, '#12203a', 'center', 'd', 0);
}

function drawCard(c, card, x, y, w, h, o) {
  o = o || {};
  const d = CARDS[card.def];
  const isUnit = card.type === 'unit';
  const rare = card.rare || 1;
  const edge = RARE_COL[rare] || '#8fa6c4';
  /* An untribed card used to take a near-white band that vanished into the
     body, so half a row of cards had no band at all. Slate instead: every card
     carries the same shape, and the colour says WHICH tribe rather than
     whether there is one. */
  const tribeCol = card.tribe ? TRIBES[card.tribe].col : '#8ea7c6';
  const tribeLit = card.tribe ? TRIBES[card.tribe].col2 : '#c3d5ea';
  const S = w / 126;                       // every measurement is card-relative
  c.save();
  if (o.alpha !== undefined) c.globalAlpha = o.alpha;
  c.translate(x + w / 2, y + h / 2);
  if (o.rot) c.rotate(o.rot);
  if (o.scale) c.scale(o.scale, o.scale);
  c.translate(-w / 2, -h / 2);

  // a rare card carries its own light
  if (rare >= 3) {
    c.save();
    c.shadowColor = edge; c.shadowBlur = 18;
    rr(c, 3, 3, w - 6, h - 6, 13 * S);
    c.fillStyle = edge; c.globalAlpha = 0.5; c.fill();
    c.restore();
  }

  /* ---------------- the card is a FRAME with a face set into it ----------
     It used to be one pale slab: body, band, window and rules all painted at
     the same value with hairlines between them, which is why a hand of them
     read as a wireframe. A card is a physical object and almost all of its
     legibility comes from being several PLATES at different depths — a dark
     frame you can see the thickness of, a light face sunk into it, a picture
     cut through the face, and a well below that holding the rules.

     So: a directional contact shadow, then the frame, then the face inset into
     the frame. Nothing here is a new colour — it is the same palette lit from
     one direction instead of drawn flat. */
  c.save();
  c.shadowColor = 'rgba(4,9,20,.55)'; c.shadowBlur = 20 * S; c.shadowOffsetY = 9 * S;
  rr(c, 0, 0, w, h, 12 * S);
  const frameG = c.createLinearGradient(0, 0, 0, h);
  frameG.addColorStop(0, '#3d5176');
  frameG.addColorStop(0.5, '#26405f');
  frameG.addColorStop(1, '#16263e');
  c.fillStyle = frameG; c.fill();
  c.restore();
  // the frame's own thickness catches the light on its top edge
  bevel(c, 0, 0, w, h, 12 * S, 3.2 * S, 1.1);
  /* AND A RARE CARD'S FRAME IS MADE OF SOMETHING ELSE. Rarity was two dots and
     a slightly different hairline — which is to say it was invisible, and the
     one thing a card game has to communicate before you have read a word is
     "this one is worth stopping for". A foil sweep across the frame does it
     without a single new shape: the same frame, in a material that catches the
     light along a diagonal. */
  if (rare >= 2) {
    c.save();
    rr(c, 0, 0, w, h, 12 * S);
    c.clip();
    const foil = c.createLinearGradient(0, h * 0.15, w, h * 0.85);
    foil.addColorStop(0, 'rgba(255,255,255,0)');
    foil.addColorStop(0.35, mixA(edge, rare >= 3 ? 0.55 : 0.32));
    foil.addColorStop(0.52, 'rgba(255,255,255,' + (rare >= 3 ? 0.42 : 0.24) + ')');
    foil.addColorStop(0.7, mixA(edge, rare >= 3 ? 0.40 : 0.22));
    foil.addColorStop(1, 'rgba(255,255,255,0)');
    c.fillStyle = foil; c.fillRect(0, 0, w, h);
    c.restore();
  }

  /* THE FACE, sunk into the frame. The inset is what sells it — without the
     shadow along the top edge the face is a sticker laid on a dark rectangle. */
  const fi = 4.5 * S;
  c.save();
  rr(c, fi, fi, w - fi * 2, h - fi * 2, 8.5 * S);
  const body = c.createLinearGradient(0, fi, 0, h - fi);
  body.addColorStop(0, '#f6fbff');
  body.addColorStop(0.5, '#e6effc');
  body.addColorStop(1, '#c4d8f2');
  c.fillStyle = body; c.fill();
  c.restore();
  inset(c, fi, fi, w - fi * 2, h - fi * 2, 8.5 * S, 2.6 * S, 0.85);
  /* A sheen across the corner. Flat vector cards read as diagrams; one soft
     diagonal is the cheapest thing that makes them read as objects held at an
     angle to a light. */
  c.save();
  rr(c, fi, fi, w - fi * 2, h - fi * 2, 8.5 * S);
  c.clip();
  const sheen = c.createLinearGradient(0, 0, w * 0.85, h * 0.75);
  sheen.addColorStop(0, 'rgba(255,255,255,.42)');
  sheen.addColorStop(0.35, 'rgba(255,255,255,.08)');
  sheen.addColorStop(0.6, 'rgba(120,150,190,.08)');
  sheen.addColorStop(1, 'rgba(78,108,155,.20)');
  c.fillStyle = sheen; c.fillRect(fi, fi, w - fi * 2, h - fi * 2);
  c.restore();

  /* ---------------- the name band, part of the frame ----------------
     It used to be a rounded pill floating inside the card, wider than the
     shapes around it and overhanging the body at reward size — a sticker rather
     than a card. Now it is a band that runs the full width under the frame, so
     the card is TWO shapes (the card, the window) instead of four stacked
     rectangles that all look alike. */
  /* AND IT IS A PLATE NOW, not a strip of flat colour. Two stops became three
     with the light one at the top where the light is, a bevel so it has a
     thickness, and a shadow cast onto the face below it — which is the thing
     that stops it reading as a printed label and starts it reading as a piece
     of the frame. */
  /* Measured BEFORE the band is drawn, because a two-line name needs a taller
     band and the band is painted first. */
  const gemRail = rare >= 2 ? (rare - 1) * 9.5 * S + 6 * S : 0;
  const nm = card.name.toUpperCase();
  const nameW = w - 18 * S - gemRail;
  const nameSize = fitText(c, nm, nameW, 15 * S, 8 * S, 't');
  const tiny = ellipsize(c, nm, nameSize, nameW) !== nm && nm.indexOf(' ') > 0;
  const bh = (tiny ? 36 : 27) * S;
  const by0 = fi;
  c.save();
  rr(c, fi, fi, w - fi * 2, h - fi * 2, 8.5 * S);
  c.clip();
  const bg = c.createLinearGradient(0, by0, 0, by0 + bh);
  bg.addColorStop(0, tribeLit);
  bg.addColorStop(0.45, tribeCol);
  bg.addColorStop(1, mix(tribeCol, '#14203a', 0.28));
  c.fillStyle = bg;
  c.fillRect(fi, by0, w - fi * 2, bh);
  // the band's own light and the shadow it throws down the face
  let bandG = c.createLinearGradient(0, by0, 0, by0 + 3 * S);
  bandG.addColorStop(0, LIGHT + '0.55)');
  bandG.addColorStop(1, LIGHT + '0)');
  c.fillStyle = bandG; c.fillRect(fi, by0, w - fi * 2, 3 * S);
  bandG = c.createLinearGradient(0, by0 + bh, 0, by0 + bh + 7 * S);
  bandG.addColorStop(0, DARK + '0.30)');
  bandG.addColorStop(1, DARK + '0)');
  c.fillStyle = bandG; c.fillRect(fi, by0 + bh, w - fi * 2, 7 * S);
  // gear wears a notch out of its band, so a type is legible without reading
  if (!isUnit && card.type !== 'charm') {
    c.beginPath();
    c.moveTo(fi, by0 + bh); c.lineTo(fi + 10 * S, by0 + bh - 6 * S); c.lineTo(fi + 20 * S, by0 + bh);
    c.closePath();
    c.fillStyle = 'rgba(16,26,46,.34)'; c.fill();
  }
  /* A LIGHT rule, not a dark one. The first cut put a dark hairline under the
     band and the contrast check caught it on hand cards: the name is floored to
     the readable minimum there, so at that size the glyph band reaches the
     line, and dark ink over a dark rule is 1.0:1. A division on a light body
     reads just as well as a highlight, and cannot be a hazard. */
  c.fillStyle = 'rgba(255,255,255,.55)';
  c.fillRect(fi, by0 + bh - 1.6 * S, w - fi * 2, 1.6 * S);
  c.restore();
  /* THE FLOOR BEATS THE FIT, AND SOMETHING HAS TO GIVE.

     `fitText` shrinks a name until it fits the band — but it cannot shrink past
     the legibility floor, and on a handset the floor is about 17 stage units
     where a preview card is 92 wide. So on the leader screen every name was
     returned at the floor and drawn straight over its neighbours: CINDERPUP
     CINDERPUP KETTLEBEAK ran together as one word across three cards.
     `fitText` returning a size is not a promise that the size fits.

     When the box cannot carry the string at a size a person can read, the
     string is the thing that gives. An ellipsis inside the band reads as "this
     name is longer than the card"; a name bleeding over the card next to it
     reads as a broken renderer. */
  /* AND THE NAME MAKES ROOM FOR THE GEMS. They live at the band's left end and
     the name is centred in the whole band, so on a rare card with a long name
     the two ran through each other — `◇ANKED EMBERS`. The gems take their strip
     and the name centres in what is left, which is why the rail is measured
     here rather than guessed at. */
  const nameX = fi + gemRail + (w - fi * 2 - gemRail) / 2;
  /* WHEN THE CARD IS TOO SMALL FOR TEXT, THE NAME WINS AND THE RULES GO.

     On a fold's cover a hand card is about 36 CSS pixels wide and the legibility
     floor is 9, so nothing on it can be read: 57 of 58 rules texts ellipsise —
     including two-word ones, which is the tell that this is not a long-text
     problem — and 58 of 58 names. The board that produced this had TWO cards
     both reading `EMBER…`, which is the actual failure: not that the rules are
     cut, but that you cannot tell two cards in your own hand apart.

     Shrinking further is not available; the floor is the floor. So below the
     width where a name fits on one line the card changes what it shows. The
     name WRAPS to two lines and gets the band's full height, and the rules line
     — unreadable at this size and one tap away in the inspect panel — is
     dropped to pay for it. `EMBER` over `FLASK` beats `EMBER…` next to another
     `EMBER…`, and it is the only thing on the face that has to survive. */
  if (tiny) {
    const two = wrapText(c, nm, nameSize * 0.82, nameW).slice(0, 2);
    const step2 = lineH(nameSize * 0.82, nameSize * 0.9);
    two.forEach((ln, i) => txt(c, ellipsize(c, ln, nameSize * 0.82, nameW),
      nameX, by0 + bh / 2 + (i - (two.length - 1) / 2) * step2,
      nameSize * 0.82, '#22160c', 'center', 't', 'rgba(255,255,255,.45)'));
  } else {
    txt(c, ellipsize(c, nm, nameSize, nameW), nameX,
      by0 + bh / 2, nameSize, '#22160c', 'center', 't', 'rgba(255,255,255,.45)');
  }

  /* ---------------- the art window ----------------
     It was a flat two-stop wash with a grey ellipse floating in it. A window
     wants somewhere to BE: a sky, a horizon, a light behind the subject and a
     shadow at the top of the frame. Four cheap gradients and the portrait reads
     as a place rather than a passport photo. */
  const ax = fi + 4 * S, ay = by0 + bh + 6 * S;
  const aw = w - (fi + 4 * S) * 2;
  /* A unit's window shrank the rules line to one truncated clause at hand
     size, which is the one place the text has to be readable. Gear can afford
     a bigger picture because its rules are shorter. */
  const ah = isUnit ? h * 0.41 : h * 0.44;
  c.save();
  rr(c, ax, ay, aw, ah, 8 * S);
  c.clip();
  /* A BRIGHT window, not a night one. The first pass painted the sky in the
     game's night blues and the cards inverted: a dark hole punched in a pale
     card, with the cast — every one of them drawn in dark outline — swimming in
     it. A card is a daylight object. Pale sky, snow, and the tribe's colour as
     the light. */
  /* A DEEPER SKY AT THE TOP. Three stops that ran pale-to-paler gave the window
     no vertical order, so the subject had nothing to sit against and the whole
     card read as one value. Starting the sky a good deal darker puts the light
     where the light is — low, behind the ridge — which is also where the game's
     backdrop puts it, so a card in hand belongs to the scene behind it. */
  const sky = c.createLinearGradient(0, ay, 0, ay + ah);
  sky.addColorStop(0, '#8fb4dc');
  sky.addColorStop(0.42, '#c3daf3');
  sky.addColorStop(0.75, '#e4eefb');
  sky.addColorStop(1, '#f6fbff');
  c.fillStyle = sky; c.fillRect(ax, ay, aw, ah);
  // a light behind the subject, in the tribe's colour
  const halo = c.createRadialGradient(w / 2, ay + ah * 0.58, 2, w / 2, ay + ah * 0.58, aw * 0.66);
  halo.addColorStop(0, tribeLit);
  halo.addColorStop(0.5, 'rgba(255,255,255,0)');
  halo.addColorStop(1, 'rgba(255,255,255,0)');
  c.save(); c.globalAlpha = 0.6; c.fillStyle = halo; c.fillRect(ax, ay, aw, ah); c.restore();
  // a far ridge, so the window has a distance in it
  c.save();
  c.beginPath();
  c.moveTo(ax, ay + ah);
  c.lineTo(ax, ay + ah * 0.70);
  c.quadraticCurveTo(ax + aw * 0.34, ay + ah * 0.54, ax + aw * 0.62, ay + ah * 0.69);
  c.quadraticCurveTo(ax + aw * 0.82, ay + ah * 0.78, ax + aw, ay + ah * 0.65);
  c.lineTo(ax + aw, ay + ah);
  c.closePath();
  c.fillStyle = 'rgba(150,182,216,.55)'; c.fill();
  c.restore();
  // the snow it stands on
  c.save();
  c.beginPath();
  c.moveTo(ax, ay + ah);
  c.lineTo(ax, ay + ah * 0.91);
  c.quadraticCurveTo(w / 2, ay + ah * 0.81, ax + aw, ay + ah * 0.93);
  c.lineTo(ax + aw, ay + ah);
  c.closePath();
  const bank = c.createLinearGradient(0, ay + ah * 0.81, 0, ay + ah);
  bank.addColorStop(0, '#ffffff');
  bank.addColorStop(1, '#cfe1f4');
  c.fillStyle = bank; c.fill();
  c.restore();
  c.save();
  c.globalAlpha = 0.20; c.fillStyle = '#0d1830';
  c.beginPath(); c.ellipse(w / 2, ay + ah * 0.945, aw * 0.30, ah * 0.05, 0, 0, TAU); c.fill();
  c.restore();
  if (isUnit) drawCreature(c, card.art, w / 2, ay + ah * 0.79, ah * 0.94, { t: o.t || 0, ph: card.uid, blink: card.uid });
  else if (card.type === 'charm') drawItemIcon(c, { kind: 'burst', col: edge }, w / 2, ay + ah * 0.52, ah * 0.78, o.t || 0);
  else drawItemIcon(c, d.art, w / 2, ay + ah * 0.52, ah * 0.84, o.t || 0);
  c.restore();
  /* THE WINDOW IS A HOLE, AND IT USED TO BE A BOX. One dark stroke around a
     pale wash puts the picture on the same plane as everything else. A hole has
     a shadow cast onto its top and left by the face it is cut through, and a
     lip of light along the bottom where the far edge catches it — and then a
     rim, so the cut has a thickness. */
  inset(c, ax, ay, aw, ah, 8 * S, 3.2 * S, 1.15);
  rr(c, ax, ay, aw, ah, 8 * S);
  c.lineWidth = 2.6 * S; c.strokeStyle = 'rgba(20,34,58,.92)'; c.stroke();
  rr(c, ax - 1.4 * S, ay - 1.4 * S, aw + 2.8 * S, ah + 2.8 * S, 9.4 * S);
  c.lineWidth = 1.2 * S; c.strokeStyle = LIGHT + '0.42)'; c.stroke();

  /* ---------------- rarity, as gems set into the frame ----------------
     It was two small flat circles floating on the window's right edge, at the
     one value that made them read as dust on the lens rather than as
     information. They are set into the FRAME now, on the left rail where
     nothing else lives, cut as facets with a light on top — a gem reads as a
     gem at four pixels, which a flat dot never does, and being on the frame
     rather than the face means they belong to the card's furniture. */
  /* IN THE BAND, not on the frame rail. The rail is four units wide and a gem
     set into it hung half off the card's edge, which read as a rendering fault
     rather than as rarity. The band has height to spare at its left end, where
     a centred name never reaches, and a gem cut against the tribe's colour is
     legible at hand size — which two flat dots on the window's edge never
     were. */
  if (rare >= 2) {
    for (let i = 0; i < rare - 1; i++) {
      const gy = by0 + bh / 2, gr = 4 * S;
      const gx = fi + 8 * S + i * 9.5 * S;
      c.save();
      c.beginPath();
      c.moveTo(gx, gy - gr);
      c.lineTo(gx + gr * 0.85, gy);
      c.lineTo(gx, gy + gr);
      c.lineTo(gx - gr * 0.85, gy);
      c.closePath();
      const gg = c.createLinearGradient(0, gy - gr, 0, gy + gr);
      gg.addColorStop(0, mix(edge, '#ffffff', 0.65));
      gg.addColorStop(0.5, edge);
      gg.addColorStop(1, mix(edge, '#0d1830', 0.45));
      c.fillStyle = gg; c.fill();
      c.lineWidth = 1.2 * S; c.strokeStyle = 'rgba(8,14,28,.8)'; c.stroke();
      c.restore();
    }
  }

  // what a hoarded card has put on since it was drawn
  if (card.kw && card.kw.hoard && card.held) {
    c.beginPath(); c.arc(16 * S, ay + 14 * S, 12 * S, 0, TAU);
    inked(c, '#c9a6ff', 2.5 * S, C.ink);
    txt(c, '+' + card.held, 16 * S, ay + 15 * S, 15 * S, '#241a3a', 'center', 'd', 0);
  }

  /* ---------------- rules text, on the card rather than in a box ------
     The text used to sit in its own cream well, which made four stacked
     rectangles of a card that only ever needed two. It sits on the body now,
     with a hairline over it standing in for the box. */
  const ty = ay + ah + 6 * S;
  /* The type tag along the bottom is a line of text like any other, so the
     rules block has to stop above it. It exists to even up a ROW of reward
     cards, and a card in hand is not in one — on a phone the rules text is
     floored to the readable minimum and every gear card was truncating to
     "Ember 4…" so that a decorative tag could keep its strip. Below reward
     size the tag goes and the text gets its room. */
  const tagRoom = 31 * S;
  let showTag = !isUnit;
  let th = h - ty - (isUnit ? 27 * S : tagRoom);
  /* THE RULES SIT IN A WELL, and they used to sit on nothing.

     A hairline over a paragraph is a diagram's way of saying "section". The
     bottom third of the card was bare face, so the text floated and the card
     had no weight below its picture — which is why a hand of them looked
     top-heavy. A shallow recess, cut the same way the window is, gives the
     rules somewhere to live and gives the card its third plane. Shallower than
     the window on purpose: the picture has to stay the deepest thing on the
     face or the eye goes to the text first. */

  let maxLines = Math.max(2, Math.floor((th - 4 * S) / (12.2 * S)));
  let fit = fitLines(c, card.text || '', aw - 10 * S, maxLines, 11.5 * S, 7.5 * S);
  /* THE TEXT OUTRANKS THE TAG. On a phone the rules are floored to the readable
     minimum, so a strip kept for "GEAR" was costing gear cards their last line
     — every one of them truncating to "Ember 4…". If the text does not fit with
     the tag reserved, the tag goes and the text is laid out again. A card that
     cannot say what it does is not helped by a label saying what kind of thing
     it is. */
  if (showTag && Math.floor((th - 2 * S) / (fit.size * 1.12)) < fit.lines.length) {
    showTag = false;
    th += tagRoom - 12 * S;
    maxLines = Math.max(2, Math.floor((th - 4 * S) / (12.2 * S)));
    fit = fitLines(c, card.text || '', aw - 10 * S, maxLines, 11.5 * S, 7.5 * S);
  }
  /* The shrink loop cannot go below the text floor, so on a phone the paragraph
     can still be taller than the box. Measure what the box actually holds at
     the size the text will be DRAWN at, and cut to that — the card face is a
     glance, and the full rules are one tap away in the inspect panel. */
  const lh = fit.size * 1.12;
  const lines = fit.cut(Math.max(1, Math.floor((th - 2 * S) / lh)));
  /* THE WELL IS A FIXED PANEL AND THE TEXT IS CENTRED IN IT.

     Sizing the recess to its paragraph was the second attempt and it was worse
     than it sounds: a one-line gear card got a small well floating in the
     middle of the lower third with a hand's width of dead face under it, so
     four cards in a row had their rules panels at four different heights and
     the row lost its baseline. Every card game with a rules box gives it the
     same box on every card, for exactly this reason — a row of cards is read as
     a row, and the eye wants the same thing in the same place.

     So the panel runs from under the picture to just above the footer, the same
     on every card of a kind, and the text is centred inside it. The footer is
     the badges on a warden and the type plate on gear, which is what makes the
     two kinds line up at the bottom instead of only at the top. */
  const wy = ty - 3 * S;
  const wh2 = (isUnit ? h - 27 * S : h - 19 * S) - wy;
  const top = wy + wh2 / 2 - (lines.length - 1) * lh / 2;
  c.save();
  rr(c, ax, wy, aw, wh2, 6 * S);
  const wellG = c.createLinearGradient(0, wy, 0, wy + wh2);
  wellG.addColorStop(0, '#d1e0f5');
  wellG.addColorStop(1, '#eaf3fd');
  c.fillStyle = wellG; c.fill();
  c.restore();
  inset(c, ax, wy, aw, wh2, 6 * S, 2.4 * S, 0.8);
  rr(c, ax, wy, aw, wh2, 6 * S);
  c.lineWidth = 1.1 * S; c.strokeStyle = 'rgba(28,48,80,.28)'; c.stroke();
  lines.forEach((ln, i) => txt(c, ln, w / 2, top + i * lh, fit.size, '#1d2f4d', 'center', 't', 0));

  /* ---------------- the frame, drawn last so nothing crosses it ---------- */
  rr(c, 0, 0, w, h, 12 * S);
  c.lineWidth = 3 * S; c.strokeStyle = C.ink; c.stroke();
  rr(c, 3.5 * S, 3.5 * S, w - 7 * S, h - 7 * S, 9 * S);
  c.lineWidth = rare >= 2 ? 1.6 * S : 1.1 * S;
  c.strokeStyle = rare >= 2 ? edge : 'rgba(24,40,68,.22)';
  c.stroke();

  /* ---------------- the stats, hung on the bottom edge ----------------
     They used to be three identical circles in a grey tray: a traffic light
     bolted to the card. Three silhouettes on the frame itself instead — and no
     tray, which was the fourth box. */
  if (isUnit) {
    const inj = card.injured;
    const br = 12 * S, by = h - 13.5 * S;
    statBadge(c, 'atk', 17 * S, by, br, '#ff8b7a', inj ? Math.max(0, Math.round(card.atk / 2)) : card.atk);
    statBadge(c, 'cnt', w / 2, by, br * 0.92, '#ffd166', card.cnt);
    const mh = inj ? Math.max(1, Math.round(card.hp / 2)) : card.hp;
    statBadge(c, 'hp', w - 17 * S, by, br, '#7de08f', Math.max(0, mh - (card.dmg || 0)));
  } else {
    /* Gear had nothing along the bottom, so a row of cards next to units read
       as a broken line. A small type tag gives every card the same baseline —
       AND IT IS THE FIRST THING TO GO when there is no room for it. On a phone
       the rules text is floored to the readable minimum, which can fill a card
       this size on its own; a decorative tag that lands on a rule is worse than
       no tag at all. So it is drawn only if the text block actually clears it. */
    /* AND THE TAG IS A PLATE SET INTO THE FRAME, not a grey pill on the face.
       It was the deadest thing on the card — a translucent wash with a
       translucent outline, floating in the pale area under the rules, saying a
       word the notch in the name band already says. On the bottom rail it costs
       the face nothing and gives the card a footer, which is the thing that
       made a row of gear next to a row of wardens read as a broken line. */
    /* Measured against the WELL, not the last line of text. The well is drawn
       round the paragraph with its own padding, so a tag cleared by the text
       could still land on the well's bottom edge — which is what made the plate
       appear on two cards of four and vanish on the others. */
    const tag = card.type === 'charm' ? 'CHARM' : 'GEAR';
    if (showTag) {
      const tw = 52 * S, tx0 = w / 2 - tw / 2, ty0 = h - fi - 11 * S;
      c.save();
      rr(c, tx0, ty0, tw, 12 * S, 5 * S);
      const tg = c.createLinearGradient(0, ty0, 0, ty0 + 12 * S);
      tg.addColorStop(0, '#38507a');
      tg.addColorStop(1, '#1c2c48');
      c.fillStyle = tg; c.fill();
      c.restore();
      bevel(c, tx0, ty0, tw, 12 * S, 5 * S, 1.6 * S, 0.9);
      txt(c, tag, w / 2, ty0 + 6.2 * S, 8.6 * S, '#cfe0f6', 'center', 't', 0);
    }
  }

  /* ---------------- what it is wearing ---------------- */
  if (card.blessed || card.charms.indexOf('blessed') >= 0) {
    c.save();
    c.translate(14 * S, ty + 6 * S);
    c.beginPath();
    for (let k = 0; k < 10; k++) {
      const a = (k / 10) * TAU - Math.PI / 2, r = (k % 2 ? 4 : 9) * S;
      const px = Math.cos(a) * r, py = Math.sin(a) * r;
      k ? c.lineTo(px, py) : c.moveTo(px, py);
    }
    c.closePath();
    inked(c, C.gold, 2 * S, C.ink);
    c.restore();
  }
  let worn = 0;
  for (const id of card.charms) {
    if (id === 'blessed') continue;
    const ch = chOf(id);
    if (!ch) continue;
    c.beginPath(); c.arc(w - 11 * S, ay + 8 * S + worn * 15 * S, 6 * S, 0, TAU);
    inked(c, ch.col, 1.8 * S, C.ink);
    worn++;
  }
  if (card.sigil) {
    c.beginPath();
    c.moveTo(w / 2 - 9 * S, ay - 8 * S); c.lineTo(w / 2 + 9 * S, ay - 8 * S); c.lineTo(w / 2, ay + 1 * S);
    c.closePath();
    inked(c, '#c9a6ff', 1.8 * S, C.ink);
  }
  if (card.injured) {
    c.save();
    c.globalAlpha = 0.9;
    c.beginPath(); rr(c, ax, ay, aw, ah, 8 * S);
    c.fillStyle = 'rgba(120,20,40,.30)'; c.fill();
    c.restore();
    txt(c, 'HURT', w / 2, ay + ah - 11 * S, 14 * S, '#ffb0bb', 'center', 'd');
  }
  c.restore();
}

function drawItemIcon(c, art, x, y, s, t) {
  const kind = (art && art.kind) || 'flask';
  const col = (art && art.col) || C.frost;
  c.save();
  c.translate(x, y + Math.sin(t * 2 + s) * 2);
  c.lineJoin = 'round';
  const lw = Math.max(2.5, s * 0.09);
  if (kind === 'flask') {
    c.beginPath();
    c.moveTo(-s * 0.16, -s * 0.42); c.lineTo(-s * 0.16, -s * 0.16);
    c.quadraticCurveTo(-s * 0.42, s * 0.16, -s * 0.24, s * 0.40);
    c.lineTo(s * 0.24, s * 0.40);
    c.quadraticCurveTo(s * 0.42, s * 0.16, s * 0.16, -s * 0.16);
    c.lineTo(s * 0.16, -s * 0.42);
    c.closePath();
    inked(c, col, lw, C.ink);
    c.beginPath(); rr(c, -s * 0.22, -s * 0.52, s * 0.44, s * 0.14, 4);
    inked(c, '#c9b28a', lw * 0.8, C.ink);
  } else if (kind === 'pick') {
    c.rotate(-0.5);
    c.beginPath(); rr(c, -s * 0.06, -s * 0.5, s * 0.12, s * 0.8, 4);
    inked(c, '#8a6a3f', lw * 0.8, C.ink);
    c.beginPath();
    c.moveTo(-s * 0.34, -s * 0.42); c.lineTo(s * 0.34, -s * 0.42); c.lineTo(0, -s * 0.10);
    c.closePath();
    inked(c, col, lw, C.ink);
  } else if (kind === 'bowl') {
    c.beginPath(); c.arc(0, 0, s * 0.42, 0, Math.PI);
    c.closePath();
    inked(c, '#c9b28a', lw, C.ink);
    c.beginPath(); c.ellipse(0, 0, s * 0.42, s * 0.12, 0, 0, TAU);
    inked(c, col, lw * 0.8, C.ink);
  } else if (kind === 'burst') {
    for (let i = 0; i < 8; i++) {
      const a = (i / 8) * TAU + t * 0.6;
      c.beginPath();
      c.moveTo(Math.cos(a) * s * 0.16, Math.sin(a) * s * 0.16);
      c.lineTo(Math.cos(a) * s * 0.5, Math.sin(a) * s * 0.5);
      c.strokeStyle = col; c.lineWidth = lw; c.lineCap = 'round'; c.stroke();
    }
    c.beginPath(); c.arc(0, 0, s * 0.2, 0, TAU);
    inked(c, col, lw, C.ink);
  } else if (kind === 'shield') {
    c.beginPath();
    c.moveTo(0, -s * 0.46); c.lineTo(s * 0.36, -s * 0.28);
    c.quadraticCurveTo(s * 0.34, s * 0.34, 0, s * 0.48);
    c.quadraticCurveTo(-s * 0.34, s * 0.34, -s * 0.36, -s * 0.28);
    c.closePath();
    inked(c, col, lw, C.ink);
  } else if (kind === 'stone') {
    c.beginPath(); rr(c, -s * 0.4, -s * 0.2, s * 0.8, s * 0.4, s * 0.16);
    inked(c, col, lw, C.ink);
  } else if (kind === 'rope') {
    c.strokeStyle = col; c.lineWidth = lw * 1.2; c.lineCap = 'round';
    c.beginPath();
    for (let i = 0; i <= 12; i++) {
      const yy = -s * 0.45 + (i / 12) * s * 0.9;
      const xx = Math.sin(i * 0.9 + t) * s * 0.16;
      i ? c.lineTo(xx, yy) : c.moveTo(xx, yy);
    }
    c.stroke();
  } else if (kind === 'bomb') {
    c.beginPath(); c.arc(0, s * 0.08, s * 0.36, 0, TAU);
    inked(c, '#3a4257', lw, C.ink);
    c.strokeStyle = col; c.lineWidth = lw;
    c.beginPath(); c.moveTo(s * 0.14, -s * 0.24);
    c.quadraticCurveTo(s * 0.4, -s * 0.46, s * 0.26, -s * 0.56); c.stroke();
    c.beginPath(); c.arc(s * 0.26, -s * 0.6, s * 0.09 + Math.sin(t * 12) * s * 0.02, 0, TAU);
    c.fillStyle = '#ffd166'; c.fill();
  } else if (kind === 'lantern') {
    c.save(); c.globalAlpha = 0.45; c.fillStyle = col;
    c.beginPath(); c.arc(0, 0, s * 0.5, 0, TAU); c.fill();
    c.restore();
    c.beginPath(); rr(c, -s * 0.2, -s * 0.28, s * 0.4, s * 0.56, s * 0.1);
    inked(c, col, lw, C.ink);
  } else if (kind === 'eye') {
    // an open eye, because the card is about seeing it coming
    c.beginPath();
    c.moveTo(-s * 0.46, 0);
    c.quadraticCurveTo(0, -s * 0.4, s * 0.46, 0);
    c.quadraticCurveTo(0, s * 0.4, -s * 0.46, 0);
    c.closePath();
    inked(c, '#f4fbff', lw, C.ink);
    c.beginPath(); c.arc(0, 0, s * 0.17, 0, TAU);
    inked(c, col, lw * 0.8, C.ink);
    c.beginPath(); c.arc(-s * 0.05, -s * 0.05, s * 0.05, 0, TAU);
    c.fillStyle = '#ffffff'; c.fill();
  }
  c.restore();
}

/* ==================================================== 11. audio ========== */

/* A tiny synth: no samples, no files, and it never blocks a gesture-less
   autoplay policy because nothing is built until the first tap. */
const AUD = { ctx: null, on: true, master: null };
function audioInit() {
  if (AUD.ctx || HEADLESS) return;
  try {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    AUD.ctx = new AC();
    AUD.master = AUD.ctx.createGain();
    AUD.master.gain.value = 0.5;
    AUD.master.connect(AUD.ctx.destination);
  } catch (e) { AUD.ctx = null; }
}
function tone(freq, dur, type, vol, slide, delay) {
  if (!AUD.ctx || !AUD.on) return;
  const t0 = AUD.ctx.currentTime + (delay || 0);
  const o = AUD.ctx.createOscillator();
  const g2 = AUD.ctx.createGain();
  o.type = type || 'square';
  o.frequency.setValueAtTime(freq, t0);
  if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(20, slide), t0 + dur);
  g2.gain.setValueAtTime(0.0001, t0);
  g2.gain.exponentialRampToValueAtTime(Math.max(0.0002, vol === undefined ? 0.15 : vol), t0 + 0.012);
  g2.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  o.connect(g2); g2.connect(AUD.master);
  o.start(t0); o.stop(t0 + dur + 0.03);
}
function noise(dur, vol, hp, delay) {
  if (!AUD.ctx || !AUD.on) return;
  const n = Math.floor(AUD.ctx.sampleRate * dur);
  const buf = AUD.ctx.createBuffer(1, n, AUD.ctx.sampleRate);
  const d = buf.getChannelData(0);
  for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / n, 2);
  const s = AUD.ctx.createBufferSource();
  s.buffer = buf;
  const f = AUD.ctx.createBiquadFilter();
  f.type = hp ? 'highpass' : 'lowpass';
  f.frequency.value = hp || 1400;
  const g2 = AUD.ctx.createGain();
  g2.gain.value = vol === undefined ? 0.16 : vol;
  s.connect(f); f.connect(g2); g2.connect(AUD.master);
  s.start(AUD.ctx.currentTime + (delay || 0));
}
/* What a thing is made of is what it sounds like — the same three surfaces the
   renderer draws are the three the mixer hears. `arg` is the material for a
   hit or a death, and how hard it landed. */
function sfx(name, arg) {
  if (HEADLESS || !AUD.ctx) return;
  const mat = typeof arg === 'string' ? arg : (arg && arg.mat) || 'smooth';
  const heavy = arg && arg.heavy;
  switch (name) {
    case 'hit': {
      // every hit gets a body: a low thump under whatever the surface does
      tone(heavy ? 62 : 78, heavy ? 0.2 : 0.13, 'sine', heavy ? 0.3 : 0.2, 40);
      if (mat === 'ice') {
        noise(0.13, 0.2, 3200);
        tone(1760, 0.12, 'triangle', 0.11, 620);
        tone(2340, 0.09, 'sine', 0.07, 900, 0.02);
      } else if (mat === 'metal') {
        noise(0.1, 0.14, 1800);
        tone(430, 0.34, 'square', 0.12, 300);
        tone(651, 0.3, 'square', 0.08, 470, 0.01);   // a beating second partial
      } else if (mat === 'fur') {
        noise(0.17, 0.2, 0);
        tone(150, 0.14, 'triangle', 0.13, 80);
      } else {
        noise(0.15, 0.2, 0);
        tone(180, 0.1, 'square', 0.1, 70);
      }
      if (heavy) noise(0.26, 0.13, 0);
      break;
    }
    case 'swing': noise(0.09, 0.1, 2600); break;
    case 'die': {
      if (mat === 'shatter') {
        [1568, 1245, 988, 740].forEach((f, i) => tone(f, 0.22, 'triangle', 0.1, f * 0.5, i * 0.045));
        noise(0.34, 0.16, 2600);
      } else if (mat === 'clank') {
        tone(320, 0.5, 'square', 0.14, 90);
        tone(214, 0.55, 'sawtooth', 0.1, 70, 0.03);
        noise(0.4, 0.16, 900);
      } else if (mat === 'puff') {
        noise(0.42, 0.2, 0);
        tone(220, 0.3, 'sine', 0.09, 90);
      } else {
        tone(300, 0.34, 'sawtooth', 0.12, 60);
        noise(0.3, 0.14, 0);
      }
      break;
    }
    case 'heal':  tone(520, 0.16, 'sine', 0.14, 880); tone(780, 0.2, 'sine', 0.09, 1180, 0.06); break;
    case 'place': tone(220, 0.1, 'triangle', 0.16, 330); noise(0.08, 0.1, 900); break;
    case 'item':  tone(680, 0.14, 'triangle', 0.13, 420); break;
    case 'bell':  tone(880, 0.5, 'sine', 0.2, 660); tone(1320, 0.42, 'sine', 0.09, 990, 0.02); break;
    case 'draw':  noise(0.07, 0.08, 3200); break;
    case 'move':  tone(420, 0.06, 'sine', 0.09, 520); break;
    case 'get':   tone(660, 0.1, 'square', 0.12, 990); tone(990, 0.14, 'square', 0.1, 1320, 0.08); break;
    case 'win':   [523, 659, 784, 1047].forEach((f, i) => tone(f, 0.24, 'triangle', 0.14, f, i * 0.09)); break;
    case 'lose':  [440, 370, 294, 220].forEach((f, i) => tone(f, 0.3, 'sawtooth', 0.12, f * 0.9, i * 0.12)); break;
    case 'tap':   tone(900, 0.05, 'square', 0.07, 1200); break;
    case 'combo': [784, 988, 1319].forEach((f, i) => tone(f, 0.18, 'square', 0.13, f * 1.5, i * 0.055)); break;
    case 'wave':  tone(160, 0.5, 'sawtooth', 0.16, 90); noise(0.4, 0.12, 0); break;
    case 'page':  tone(520, 0.07, 'triangle', 0.08, 700); break;

    /* Everything below arrived after the sound did, and went out silent for
       ten iterations. A rule the player cannot hear is a rule they learn twice
       as slowly, and the schemes in particular are all about noticing. */

    // a foe commits: two low notes, like something drawing breath
    case 'scheme': tone(196, 0.16, 'sawtooth', 0.09, 165); tone(147, 0.22, 'sine', 0.08, 124, 0.07); break;
    // and the same shape inverted when it comes to nothing
    case 'denied': tone(392, 0.1, 'triangle', 0.11, 523); tone(523, 0.16, 'triangle', 0.09, 784, 0.05);
                   noise(0.08, 0.07, 4200); break;
    // the boiler letting go: a long hiss under a falling tone
    case 'vent':   noise(0.55, 0.16, 1400); tone(880, 0.5, 'sine', 0.12, 180);
                   tone(1320, 0.34, 'triangle', 0.06, 300, 0.04); break;
    // the cold closing in, once, when the fire goes out
    case 'freeze': [330, 262, 208, 165].forEach((f, i) => tone(f, 0.5, 'sine', 0.1, f * 0.8, i * 0.1));
                   noise(0.7, 0.09, 700); break;
    // the anvil: two hammer blows and a ring
    case 'temper': tone(180, 0.12, 'square', 0.16, 120); noise(0.1, 0.13, 2200);
                   tone(180, 0.12, 'square', 0.14, 120, 0.13); noise(0.1, 0.11, 2200, 0.13);
                   tone(1046, 0.5, 'sine', 0.09, 1568, 0.26); break;
    // a bell bought is a bell rung, low and long
    case 'bellbuy': [523, 784, 1047].forEach((f, i) => tone(f, 0.7, 'sine', 0.13, f, i * 0.13));
                    tone(131, 0.9, 'sine', 0.1, 131); break;
    // a handful of snow: soft, dry, close
    case 'snow':   noise(0.16, 0.13, 5200); tone(1760, 0.1, 'sine', 0.05, 2400); break;
    // a card left behind
    case 'burn':   noise(0.3, 0.13, 900); tone(240, 0.26, 'sawtooth', 0.09, 90); break;
    default: break;
  }
}

/* --------------------------------------------------------------- score --- */

/* A step sequencer rather than a loop: three voices over sixteen steps, with
   the root, the scale and the tempo picked by where you are. It reads none of
   the game's randomness — a run has to play the same twice, and a melody that
   consumed the seed would quietly poison that. */
const SCALE = {
  whitewood: [0, 3, 5, 7, 10],        // minor pentatonic — open, cold, hopeful
  shelf:     [0, 2, 3, 7, 8],         // a flattened sixth: the ground gets thin
  hollow:    [0, 1, 5, 6, 10],        // phrygian shards for the last climb
};
const MOOD = {
  title: { root: 110.0, scale: 'whitewood', beat: 0.46, lead: 0.5, drums: 0, pad: 1 },
  trail: { root: 110.0, scale: 'whitewood', beat: 0.44, lead: 0.42, drums: 0, pad: 1 },
  fight: { root: 98.0,  scale: 'shelf',     beat: 0.34, lead: 0.6,  drums: 1, pad: 1 },
  boss:  { root: 87.31, scale: 'hollow',    beat: 0.27, lead: 0.8,  drums: 2, pad: 1 },
  camp:  { root: 130.8, scale: 'whitewood', beat: 0.56, lead: 0.3,  drums: 0, pad: 1 },
};
const MUSIC_GAIN = 0.42;
const MUSIC = { on: true, mood: 'title', step: 0, timer: 0, notes: 0, bars: 0, swell: 0, seed: 12345 };

// The score's own randomness, so the game's stays untouched.
function mrnd() {
  MUSIC.seed = (MUSIC.seed * 1664525 + 1013904223) >>> 0;
  return MUSIC.seed / 4294967296;
}
const semitone = (root, n) => root * Math.pow(2, n / 12);

function moodFor(g) {
  if (g.screen === 'battle' && g.battle) return g.battle.kind === 'boss' ? 'boss' : 'fight';
  if (g.screen === 'camp') return 'camp';
  if (g.screen === 'title' || g.screen === 'gameover' || g.screen === 'victory') return 'title';
  return 'trail';
}
function zoneKey(g) {
  const z = g.run ? clamp(g.run.zone, 0, ZONES.length - 1) : 0;
  return ZONES[z].id;
}

/* One voice, so the mixer is in one place and a mute is a mute. */
function mtNote(freq, dur, type, vol, slide) {
  MUSIC.notes++;
  tone(freq, dur, type, (vol === undefined ? 0.1 : vol) * MUSIC_GAIN, slide);
}

function musicTick(g, dt) {
  if (!MUSIC.on) return;
  const mood = moodFor(g);
  if (mood !== MUSIC.mood) {
    MUSIC.mood = mood;
    MUSIC.step = 0;
    MUSIC.timer = 0;
    MUSIC.bars = 0;
  }
  const M = MOOD[mood];
  // The zone recolours whatever the mood set: same tune, colder key.
  const zk = zoneKey(g);
  const scale = SCALE[zk] || SCALE[M.scale];
  const drop = zk === 'shelf' ? -2 : zk === 'hollow' ? -4 : 0;
  const root = semitone(M.root, drop);

  MUSIC.timer -= dt;
  if (MUSIC.timer > 0) return;
  MUSIC.timer += M.beat / 4;                 // sixteenths
  const s = MUSIC.step;
  MUSIC.step = (s + 1) % 16;
  if (MUSIC.step === 0) MUSIC.bars++;

  // bass: root and fifth, on the pulse
  if (s === 0 || s === 6 || s === 10) mtNote(root / 2, M.beat * 0.9, 'triangle', 0.22);
  if (s === 8) mtNote(semitone(root / 2, 7), M.beat * 0.7, 'triangle', 0.18);

  // a beast puts a drone under everything: two octaves down, a whole bar long,
  // with a fifth leaning against it every other bar so it never sits still
  if (mood === 'boss') {
    if (s === 0) mtNote(root / 4, M.beat * 4.4, 'sawtooth', 0.14);
    if (s === 0 && MUSIC.bars % 2 === 1) mtNote(semitone(root / 4, 7), M.beat * 4.2, 'sawtooth', 0.08);
    if (s === 12) mtNote(semitone(root / 4, 1), M.beat * 1.6, 'sine', 0.09);
  }

  // pad: one long chord tone per bar, an octave up, so the cold has a floor
  if (M.pad && s === 0) {
    mtNote(root * 2, M.beat * 3.4, 'sine', 0.07);
    mtNote(semitone(root * 2, scale[2]), M.beat * 3.2, 'sine', 0.05);
  }

  // lead: sparse, and it leans on the scale rather than wandering
  if (mrnd() < M.lead * 0.34) {
    const n = scale[Math.floor(mrnd() * scale.length)] + (mrnd() < 0.3 ? 12 : 0);
    mtNote(semitone(root * 2, n), M.beat * (mrnd() < 0.25 ? 1.4 : 0.55), 'square', 0.06);
  }

  // drums: only once there is something to be afraid of
  if (M.drums) {
    if (s % 4 === 0) noise(0.07, 0.05 * M.drums, 0);
    if (s === 4 || s === 12) noise(0.12, 0.05 * M.drums, 1800);
    if (M.drums > 1 && s === 14) noise(0.09, 0.05, 2600);
  }
}

function setMute(m) {
  G.meta.mute = !!m;
  AUD.on = !m;
  MUSIC.on = !m;
  saveMeta();
  if (!m) sfx('tap');
}

/* ------------------------------------------------------------- screens --- */

/* Hit regions are rebuilt every frame by the draw code, so what the player can
   touch is always exactly what they can see. */
let hits = [];
const hit = (id, x, y, w, h, data) => { hits.push({ id, x, y, w, h, data }); };
/* WHAT A THUMB NEEDS, IN THE UNITS A THUMB WORKS IN.

   The render suite has checked touch targets since iteration 6 and it checked
   them in STAGE units — but the stage is 1280 wide and an iPhone SE is 667 CSS
   pixels across, so everything on screen is half the size the check thought it
   was. Photographed on real phones for the first time this round, seven
   controls came in under the 44-pixel minimum both platform guidelines ask for,
   and PASS — the button pressed every single turn — was TWENTY-FOUR PIXELS TALL.

   Rather than making the art chunky, the small controls get a forgiving second
   pass: an exact hit always wins, and only when nothing at all was hit does the
   nearest small control within a thumb's slop take it. That cannot steal a
   touch from anything, because anything it could steal from would have matched
   exactly first. Draw small, touch big. */
const TOUCH_MIN = 85;    // stage units that come out near 44 CSS px on a phone
const TOUCH_SLOP = 30;   // and how far outside a small one a thumb may land
function hitAt(x, y) {
  for (let i = hits.length - 1; i >= 0; i--) {
    const h = hits[i];
    if (x >= h.x && x <= h.x + h.w && y >= h.y && y <= h.y + h.h) return h;
  }
  let best = null, bestD = 1e9;
  for (let i = hits.length - 1; i >= 0; i--) {
    const h = hits[i];
    if (Math.min(h.w, h.h) >= TOUCH_MIN) continue;
    const nx = clamp(x, h.x, h.x + h.w), ny = clamp(y, h.y, h.y + h.h);
    const d = Math.hypot(x - nx, y - ny);
    if (d <= TOUCH_SLOP && d < bestD) { bestD = d; best = h; }
  }
  return best;
}

const UI = {
  sealNote: null,    // the feat the player just tapped on the title screen
  collectPage: 0,    // the collection pages when a screen is too short for it
  drag: null,        // {card, idx, x, y, moved} or {unit,…}
  hover: null,
  inspect: null,     // a card blown up with its keywords spelled out
  order: false,      // attack-order preview
  choose: null,      // {title, items, onPick, cancel}
  deck: false,       // the caravan, laid out
  picked: null,      // a card chosen by tapping, waiting for a slot
  refuse: null,      // the note that says why a drop would not work
  help: null,        // page index of the rulebook, or null
  holdT: 0,          // how long the finger has been down in one place
};

/* A BUTTON IS A KEY YOU PRESS, and this one was a flat rectangle with a white
   band across the top half — the shape a web page used in 2005, and the reason
   a row of them read as a toolbar rather than as controls.

   What makes a key look pressable is entirely about edges: a dark seat it sits
   in, a body that is brighter at the top than the bottom because it faces the
   light, a bright rim along its top edge and a shadow along its bottom, and a
   contact shadow underneath that shortens when you press it. All five are here
   and all five are the same one-directional light the cards use, so the whole
   screen is lit from one place. Hover raises it and warms the rim; the pressed
   state inverts the bevel, which is the only cue that reads instantly. */
function button(c, id, x, y, w, h, label, col, dis, small) {
  const hv = UI.hover && UI.hover.id === id;
  const down = !dis && UI.down && UI.down.id === id;
  c.save();
  c.translate(0, down ? 2 : 0);
  const base = dis ? '#3b4560' : (col || '#2f5d8f');
  const r = 12;
  // the seat: a dark socket the key sits in, so the body has somewhere to be
  c.save();
  c.shadowColor = 'rgba(4,9,20,.5)';
  c.shadowBlur = (down ? 5 : 13);
  c.shadowOffsetY = (down ? 2 : 6);
  rr(c, x, y, w, h, r);
  c.fillStyle = '#0f1a2e'; c.fill();
  c.restore();
  // the body, brighter at the top because that is where the light is
  const bx = x + 1.5, bw2 = w - 3, byy = y + 1.5, bh2 = h - 4;
  c.save();
  rr(c, bx, byy, bw2, bh2, r - 1.5);
  const bodyG = c.createLinearGradient(0, byy, 0, byy + bh2);
  bodyG.addColorStop(0, mix(base, '#ffffff', dis ? 0.16 : (hv ? 0.42 : 0.30)));
  bodyG.addColorStop(0.5, dis ? base : mix(base, '#ffffff', hv ? 0.10 : 0.02));
  bodyG.addColorStop(1, mix(base, '#0b1428', 0.34));
  c.fillStyle = bodyG; c.fill();
  c.restore();
  if (down) inset(c, bx, byy, bw2, bh2, r - 1.5, 3, 1);
  else bevel(c, bx, byy, bw2, bh2, r - 1.5, 3, dis ? 0.5 : 1.15);
  if (!dis) {
    // and the rim, which is what separates a key from a painted rectangle
    rr(c, x + 0.75, y + 0.75, w - 1.5, h - 2.5, r - 0.75);
    c.lineWidth = 1.2;
    c.strokeStyle = hv ? LIGHT + '0.55)' : LIGHT + '0.26)';
    c.stroke();
  }
  /* A BUTTON THAT DOES NOT FIT ITS OWN LABEL, which every button in the game
     was until the gutter check went in.

     The label was drawn at a fixed 19 (or 15) units and the legibility floor
     lifts that to about 23 on a fold's cover display, so a row of three reward
     buttons reading COPY A CARD / TEMPER A CARD / BURN A CARD came out with
     four units of air between them at 23-unit type. Nothing overlapped — they
     simply ran together, which is the failure a collision check cannot see and
     a gutter check can.

     The label is fitted to the button and ellipsised if the floor will not let
     it shrink far enough, the same rule as a card's name band and the victory
     tally. On a desktop the floor is inert and every label renders exactly as
     it always did. */
  const cap = w - 18;
  const ls2 = fitText(c, label, cap, small ? 15 : 19, 9, 'd');
  txt(c, ellipsize(c, label, ls2, cap, false, 'd'), x + w / 2, y + h / 2 + 1, ls2,
    dis ? '#8b97b0' : '#ffffff', 'center', 'd');
  c.restore();
  if (!dis) hit(id, x, y, w, h);
}

function drawTitle(c, t) {
  drawBackdrop(c, 0, t);
  const bob = Math.sin(t * 1.4) * 6;
  txt(c, 'FROSTFELL', MID, 150 + bob, 96, '#eaf6ff', 'center', 'd', '#12233f');
  txt(c, 'a deckbuilding trek through the long winter', MID, 210 + bob, 18, '#a8c8ea', 'center', 't');

  const saved = store.get(SAVE_RUN);
  let y = 300;
  if (saved) { button(c, 'continue', MID - 150, y, 300, 56, 'CONTINUE TREK', '#3f8f5f'); y += 70; }
  txt(c, 'CHOOSE A LEADER', MID, y + 6, 16, '#9fc0e4', 'center', 't');
  y += 34;
  const tribes = Object.keys(TRIBES);
  const gap = 20;
  const bw2 = Math.min(252, Math.floor((VW - SAFE * 2 - gap * (tribes.length - 1)) / tribes.length));
  const total = tribes.length * bw2 + (tribes.length - 1) * gap;
  tribes.forEach((tb, i) => {
    const x = MID - total / 2 + i * (bw2 + gap);
    const locked = G.meta.unlocked.indexOf(tb) < 0;
    const T = TRIBES[tb];
    panel(c, x, y, bw2, 190, 14, locked ? '#2a3145' : '#1d2c49', locked ? '#4a5570' : T.col);
    const ld = CARDS[STARTERS[tb].leader];
    c.save();
    c.globalAlpha = locked ? 0.35 : 1;
    drawCreature(c, ld.art, x + bw2 / 2, y + 96, 104, { t, ph: i * 2 });
    c.restore();
    txt(c, T.name.toUpperCase(), x + bw2 / 2, y + 146, 20, locked ? '#7a86a0' : T.col, 'center', 'd');
    const need = LOCKED[tb];
    const sub = locked ? (need ? need.text : 'not yet found') : ld.name;
    wrapText(c, sub, 12.5, bw2 - 20).slice(0, 2).forEach((ln, k) =>
      txt(c, ln, x + bw2 / 2, y + 168 + k * lineH(12.5, 15), 12.5, '#b9cde8', 'center', 't'));
    const bw3 = G.meta.winter[tb] || 0;
    if (!locked && bw3) txt(c, 'winter ' + bw3, x + bw2 / 2, y + 200, 12, '#ffd166', 'center', 't');
    if (!locked) hit('tribe', x, y, bw2, 190, tb);
  });
  /* THE SEALS, on the title screen, because a thing to chase has to be visible
     from the place you decide whether to set out again. Earned ones are lit and
     named; the rest sit dark with what they want written under them. */
  /* A saved run adds a CONTINUE button above, which pushed this whole block
     down until the note under the seals sat on top of the run counter in the
     footer — two lines two units apart, on every return visit, at every size.
     Nothing saw it for twenty-five rounds because nothing checked. */
  const sy = Math.min(y + 216, VH - 170);
  const got = FEATS.filter((f) => featEarned(f.id)).length;
  txt(c, 'SEALS  ' + got + '/' + FEATS.length, MID, sy, 13, got ? '#ffd166' : '#7e97b8', 'center', 't');
  const sgap = 54, stot = (FEATS.length - 1) * sgap;
  FEATS.forEach((f, i) => {
    const x = MID - stot / 2 + i * sgap, cy2 = sy + 44;
    const on = featEarned(f.id);
    c.save();
    if (on) { c.shadowColor = f.col; c.shadowBlur = 10 + Math.sin(t * 2 + i) * 4; }
    c.globalAlpha = on ? 1 : 0.3;
    // a struck seal: six sides, and a mark inside it once it is earned
    c.beginPath();
    for (let k = 0; k < 6; k++) {
      const a2 = (k / 6) * TAU - Math.PI / 2;
      const px2 = x + Math.cos(a2) * 19, py2 = cy2 + Math.sin(a2) * 19;
      k ? c.lineTo(px2, py2) : c.moveTo(px2, py2);
    }
    c.closePath();
    inked(c, on ? f.col : '#25314a', 2.5, C.ink);
    if (on) {
      c.beginPath(); c.arc(x, cy2, 6.5, 0, TAU);
      c.fillStyle = '#12203a'; c.fill();
    }
    c.restore();
    hit('seal', x - 26, cy2 - 26, 52, 52, f.id);
  });
  txt(c, UI.sealNote || 'tap a seal to read what it asks', MID, sy + 74, 13,
    UI.sealNote ? '#ffe6a8' : '#6c82a2', 'center', 't');

  button(c, 'help', SAFE, VH - 74, 210, 48, 'HOW TO PLAY', '#40527a');
  button(c, 'collection', SAFE + 222, VH - 74, 190, 48, 'COLLECTION', '#40527a');
  button(c, 'mute', VW - SAFE - 116, VH - 74, 116, 48, G.meta.mute ? 'SOUND ✕' : 'SOUND ♪', '#40527a', false, true);
  txt(c, 'runs ' + G.meta.runs + '   ·   wins ' + G.meta.wins, MID, VH - 28, 14, '#7e97b8', 'center', 't');
}

/* ------------------------------------------------- choosing a leader ----- */

function drawLeaderPick(c, t) {
  const pick2 = G.ui.pick;
  drawBackdrop(c, 0, t);
  const tb = pick2.tribe, T = TRIBES[tb], S = STARTERS[tb], ld = CARDS[S.leader];
  txt(c, T.name.toUpperCase(), MID, 54, 38, T.col, 'center', 'd');
  txt(c, T.blurb, MID, 92, 15, '#a8c8ea', 'center', 't');

  // the leader, life size
  panel(c, SAFE + 6, 120, 350, 440, 16, '#1d2c49', T.col);
  const lx = SAFE + 181;
  drawCreature(c, ld.art, lx, 286, 164, { t, ph: 1.4 });
  txt(c, ld.name.toUpperCase(), lx, 396, 26, '#eaf6ff', 'center', 'd');
  txt(c, 'health ' + ld.hp + '    attack ' + ld.atk + '    counter ' + ld.cnt, lx, 428, 14, '#9fc0e4', 'center', 't');
  wrapText(c, ld.text, 14, 300).forEach((ln, i) => txt(c, ln, lx, 456 + i * lineH(14, 19), 14, '#c8dcf4', 'center', 't'));
  const best = G.meta.winter[tb] || 0;
  txt(c, best ? 'hardest winter crossed: ' + best : 'never crossed the fell', lx, 534, 13, '#7e97b8', 'center', 't');

  /* THE COURSE — declared here, before a single card is drawn, and it is the
     one thing about the run the player settles rather than discovers. It costs
     nothing: what it costs is the other four. */
  const cy2 = 508, cwid = 400, cx0 = SAFE + 372;
  txt(c, 'AND THE COURSE IT DECLARES', cx0 + cwid / 2, 488, 14, '#9fc0e4', 'center', 't');
  const bw5 = (cwid - 4 * 6) / 5;
  COURSES.forEach((co, i) => {
    const on = pick2.course === co.id;
    const x = cx0 + i * (bw5 + 6);
    panel(c, x, cy2, bw5, 44, 9, on ? '#2a3a52' : '#16223a', on ? co.col : '#3a4b6b');
    txt(c, co.short, x + bw5 / 2, cy2 + 22, 13, on ? co.col : '#8fa6c4', 'center', 'd');
    hit('courseToggle', x, cy2, bw5, 44, co.id);
  });
  /* AND THE SAME FLOOR AGAIN, one screen up, wearing a different face.

     `.slice(0, 2)` was a line budget picked by eye at desktop size. The floor
     lifts this text on a handset, which makes it wrap to three lines — so the
     third was dropped and the course you were about to declare explained itself
     as "...goes back into the deck instead of". Not truncated: cut mid-sentence,
     with no sign anything was missing.

     The budget follows the text now: as many lines as fit between the course
     row and the SET OUT button, and `cutLines` ends the last one in an ellipsis
     if even that is not enough. A fixed line count under a floating text size is
     the same defect as a fixed box under one. */
  const chosen = COURSES.find((co) => co.id === pick2.course) || COURSES[0];
  const cStep = lineH(12.5, 16);
  const cTop = cy2 + 60;
  const cRoom = Math.max(1, Math.floor(((VH - 92) - cTop) / cStep));
  cutLines(c, wrapText(c, chosen.text, 12.5, cwid), cRoom, 12.5, cwid).forEach((ln, i) =>
    txt(c, ln, cx0 + cwid / 2, cTop + i * cStep, 12.5, chosen.col, 'center', 't'));

  // what she sets out with
  const deckX = SAFE + 372;
  txt(c, 'THE CARAVAN SETS OUT WITH', deckX + 196, 138, 15, '#9fc0e4', 'center', 't');
  // Two rows of the starting deck, sized so the course row below them has a
  // clear band of its own rather than sitting on the cards' bottom edge.
  S.deck.forEach((id, i) => {
    const col = i % 4, row = Math.floor(i / 4);
    const x = deckX + col * 100, y = 158 + row * 160;
    drawCard(c, mkCard(id), x, y, 92, 150, { t, scale: 0.98 });
  });

  // the winter you choose to walk into
  const wx = Math.max(840, VW - 480), ww = VW - wx - SAFE;
  txt(c, 'HOW HARD A WINTER', wx + ww / 2, 138, 15, '#9fc0e4', 'center', 't');
  /* THE ROW HEIGHT FOLLOWS THE TEXT.

     A winter is a name over a line of what it does, and both were placed with
     fixed offsets inside a fixed 44-unit row. That is fine at 720 units tall
     and impossible at 280, where the text floor makes a line 23 units high and
     two of them plus padding do not fit in 44 — the type check had to be
     switched off for that shape, with a note, which is the correct move once
     and a habit twice. So the row is as tall as its own contents, the list
     starts under the header and the WINTER total sits under the last row
     rather than at a fixed 520. Nothing is excluded from the type check now. */
  const nameStep = lineH(15, 17);
  const rowH = Math.max(44, nameStep + textSize(12) + 14);
  const wtop = 158;
  WINTERS.forEach((w, i) => {
    const on = pick2.winters.indexOf(w.id) >= 0;
    const y = wtop + i * (rowH + 6);
    panel(c, wx, y, ww, rowH, 10, on ? '#4a3a2a' : '#1d2c49', on ? '#ffd166' : '#3a4b6b');
    txt(c, w.name.toUpperCase(), wx + 14, y + nameStep * 0.6 + 3, 15, on ? '#ffd166' : '#c8dcf4', 'left', 'd');
    txt(c, ellipsize(c, w.text, 12, ww - 60), wx + 14, y + nameStep * 0.6 + 3 + nameStep, 12,
      on ? '#e8d0a8' : '#a8bcd8', 'left', 't');
    c.beginPath(); c.arc(wx + ww - 24, y + rowH / 2, 13, 0, TAU);
    inked(c, on ? '#ffd166' : '#2a3856', 2.5, C.ink);
    txt(c, '+' + w.pts, wx + ww - 24, y + rowH / 2 + 1, 14, on ? '#2a1c08' : '#c8dcf4', 'center', 'd', 0);
    hit('winterToggle', wx, y, ww, rowH, w.id);
  });
  const pts = winterPts(pick2.winters);
  const ptsY = Math.min(VH - 104, wtop + WINTERS.length * (rowH + 6) + 22);
  txt(c, pts ? 'WINTER ' + pts : 'A KIND WINTER', wx + ww / 2, ptsY, 20, pts ? '#ffd166' : '#9fc0e4', 'center', 'd');

  button(c, 'backTitle', SAFE, VH - 78, 200, 52, 'BACK', '#40527a');
  button(c, 'startRun', MID - 130, VH - 82, 260, 60, 'SET OUT', '#3f8f5f');
}

/* -------------------------------------------------- the collection ------- */

function collectionItems() {
  // A Handful of Snow belongs to one room and can never be drafted, bought or
  // kept — it is not a thing to collect, and listing it made the tally lie.
  const out = [];
  for (const c of Object.values(CARDS)) {
    if (c.leader) out.push({ id: c.id, kind: 'leader', name: c.name });
  }
  for (const c of Object.values(CARDS)) {
    if (!c.leader && c.type === 'unit') out.push({ id: c.id, kind: 'unit', name: c.name });
  }
  for (const c of Object.values(CARDS)) {
    if (c.type === 'item' && !c.noPool) out.push({ id: c.id, kind: 'item', name: c.name });
  }
  for (const id of Object.keys(CHARMS)) out.push({ id, kind: 'charm', name: CHARMS[id].name });
  return out;
}

function drawCollection(c, t) {
  drawBackdrop(c, 1, t);
  let items = collectionItems();
  const shown = items.filter((i) => found(i.id)).length;
  txt(c, 'THE COLLECTION', MID, 50, 34, '#eaf6ff', 'center', 'd');
  txt(c, shown + ' of ' + items.length + ' found   ·   ' + statOf('kills') + ' foes felled   ·   best turn: ' +
    statOf('bestCombo') + '   ·   clean zones: ' + statOf('flawless'), MID, 84, 14, '#9fc0e4', 'center', 't');

  // fit the grid to the stage rather than assuming a 16:9 one
  const gap = 6, availW = VW - SAFE * 2, availH = VH - 200;
  /* 88 stage units came out at 34 CSS pixels across on the narrowest phone the
     game runs on, which is a browse screen you cannot reliably tap. The tiles
     start at whichever is bigger: a comfortable desktop size, or whatever this
     device needs to give a thumb its forty pixels. */
  const TW_MIN0 = () => Math.max(88, Math.ceil(40 / Math.max(0.2, CSS_PER_UNIT)));
  let tw = Math.max(112, TW_MIN0()), th = 96;
  let perRow = Math.max(6, Math.floor((availW + gap) / (tw + gap)));
  let rows = Math.ceil(items.length / perRow);
  /* Shrinking width and height in lockstep put the tiles at 34 CSS pixels
     across on the narrowest phone this runs on — a browse screen you cannot
     reliably tap. Height can keep giving; width stops at what a thumb needs,
     and the grid answers by fitting more of them across instead. */
  // 40 CSS pixels is the floor, whatever that is in stage units on this device
  const TW_MIN = Math.max(88, Math.ceil(40 / Math.max(0.2, CSS_PER_UNIT)));
  const TH_MIN = Math.max(58, Math.ceil(40 / Math.max(0.2, CSS_PER_UNIT)) - 26);
  while (rows * (th + 30) > availH && th - 6 >= TH_MIN) {
    th -= 6;
    if (tw - 6 >= TW_MIN) tw -= 6;
    perRow = Math.max(6, Math.floor((availW + gap) / (tw + gap)));
    rows = Math.ceil(items.length / perRow);
  }
  /* AND WHEN IT STILL WILL NOT FIT, IT TURNS A PAGE.

     A Galaxy Fold's cover screen is 280 CSS pixels tall. Fifty-odd tiles big
     enough for a thumb do not go on it at any tile size, and the answer to that
     is not smaller tiles — it is fewer of them at once. Every other stage shows
     the whole collection in one page and never sees this. */
  const fitRows = Math.max(1, Math.floor(availH / (th + 30)));
  const perPage = fitRows * perRow;
  const pages = Math.ceil(items.length / perPage);
  UI.collectPage = clamp(UI.collectPage || 0, 0, pages - 1);
  const all = items;
  if (pages > 1) {
    items = all.slice(UI.collectPage * perPage, (UI.collectPage + 1) * perPage);
    // its own line, above BACK — the two used to sit on top of each other
    button(c, 'collectPrev', MID - 168, VH - 118, 76, 50, '‹', '#40527a', UI.collectPage === 0);
    txt(c, (UI.collectPage + 1) + ' / ' + pages, MID, VH - 88, 16, '#a8c8ea', 'center', 'd');
    button(c, 'collectNext', MID + 92, VH - 118, 76, 50, '›', '#40527a', UI.collectPage >= pages - 1);
  }
  const totalW = perRow * tw + (perRow - 1) * gap;
  items.forEach((it, i) => {
    const col = i % perRow, row = Math.floor(i / perRow);
    const x = MID - totalW / 2 + col * (tw + gap), y = 112 + row * (th + 30);
    const have = found(it.id);
    const hovered = UI.hover && UI.hover.id === 'collect' && UI.hover.data === i;
    panel(c, x, y - (hovered ? 4 : 0), tw, th, 10, have ? '#22304d' : '#161d2e', have ? '#3f5a86' : '#2a3346');
    c.save();
    c.translate(0, hovered ? -4 : 0);
    if (!have) c.globalAlpha = 0.22;
    const def = CARDS[it.id];
    if (it.kind === 'charm') {
      // the same cut stone the charm card wears, so the two read as one thing
      const ch = CHARMS[it.id];
      c.save(); c.translate(x + tw / 2, y + th * 0.44);
      const r = th * 0.2;
      c.beginPath();
      for (let k = 0; k < 8; k++) {
        const a = (k / 8) * TAU - Math.PI / 8;
        const px = Math.cos(a) * r, py = Math.sin(a) * r * 1.12;
        k ? c.lineTo(px, py) : c.moveTo(px, py);
      }
      c.closePath();
      inked(c, ch.col, 2.5, C.ink);
      c.save();
      c.globalAlpha = 0.5; c.fillStyle = '#fff';
      c.beginPath();
      c.moveTo(-r * 0.45, -r * 0.5); c.lineTo(r * 0.1, -r * 0.72); c.lineTo(-r * 0.1, -r * 0.1);
      c.closePath(); c.fill();
      c.restore();
      c.restore();
    } else if (it.kind === 'item') {
      drawItemIcon(c, def.art, x + tw / 2, y + th * 0.44, th * 0.46, t);
    } else {
      drawCreature(c, def.art, x + tw / 2, y + th * 0.56, th * 0.52, { t, ph: i * 0.7, blink: i });
    }
    c.restore();
    /* The '?' over an undiscovered tile used to be a dim grey drawn straight
       onto the silhouette, and the silhouette is whatever colour that creature
       is — 2.1:1 against a Hearth orange, which the contrast check found on
       every screen shape at once. It gets its own dark disc to sit on now, so
       it reads the same over every beast in the game. */
    if (!have) {
      c.beginPath(); c.arc(x + tw / 2, y + th * 0.44, 15, 0, TAU);
      c.fillStyle = 'rgba(10,16,28,.86)'; c.fill();
      txt(c, '?', x + tw / 2, y + th * 0.46, 34, '#b9cde8', 'center', 'd');
    }
    /* And the name under it. `fitText` shrank these to fit the tile and the
       text floor pushed them straight back up, so on a phone every name in the
       collection ran into its neighbour. The floor wins — it has to — so the
       name is cut to the tile instead, and the whole thing is one tap away. */
    const nm = fitText(c, it.name.toUpperCase(), tw + 2, 10.5, 6.5, 't');
    const label = ellipsize(c, it.name.toUpperCase(), nm, tw + 2);
    txt(c, label, x + tw / 2, y + th + 10, nm, have ? '#c8dcf4' : '#8fa2bd', 'center', 't');
    hit('collect', x, y, tw, th + 26, all.indexOf(it));   // the name under it is part of the target
  });

  if (UI.lockNote) {
    panel(c, MID - 260, VH - 108, 520, 46, 12, 'rgba(12,22,40,.95)', '#ffd166');
    txt(c, UI.lockNote, MID, VH - 85, 15, '#ffe6a8', 'center', 't');
  }
  button(c, 'collectClose', MID - 100, VH - 56, 200, 46, 'BACK', '#40527a');
}

function drawHud(c, t) {
  const run = G.run;
  if (!run) return;
  const z = ZONES[clamp(run.zone, 0, ZONES.length - 1)];
  panel(c, SAFE - 20, -14, 366, 58, 14, 'rgba(16,26,46,.85)', '#2b3d5f');
  txt(c, z.name.toUpperCase(), SAFE, 22, 18, z.tint === '#2b8fd0' ? '#9fe0ff' : '#e0c8ff', 'left', 'd');
  txt(c, 'STEP ' + (run.step + 1) + '/' + run.trail.length, SAFE + 230, 23, 13, '#9fb6d6', 'center', 't');

  panel(c, VW - SAFE - 254, -14, 274, 58, 14, 'rgba(16,26,46,.85)', '#2b3d5f');
  c.beginPath(); c.arc(VW - SAFE - 224, 18, 13, 0, TAU);
  inked(c, C.gold, 3, C.ink);
  txt(c, String(run.gold), VW - SAFE - 202, 20, 20, '#ffe6a8', 'left', 'd');
  button(c, 'menu', VW - SAFE - 106, 2, 106, 44, 'DECK', '#40527a', false, true);
}

function drawBattle(c, t) {
  const g = G, b = g.battle;
  drawBackdrop(c, g.run ? g.run.zone : 0, t);

  /* The table. Two surfaces, told apart by more than colour: yours is planked
     and lit from above, theirs is cracked ice under a darker sky. */
  const step = SLOT_W + SLOT_GAP;
  const boardT = LANE_Y[0] - SLOT_H / 2 - 22, boardB = LANE_Y[1] + SLOT_H / 2 + 22;
  for (const side of ['p', 'e']) {
    const x0 = side === 'p' ? MID - 46 - COLS * step - 12 : MID + 46;
    const wid = COLS * step + 12;
    c.save();
    c.globalAlpha = 0.5;
    rr(c, x0, boardT, wid, boardB - boardT, 20);
    const gg2 = c.createLinearGradient(0, boardT, 0, boardB);
    if (side === 'p') { gg2.addColorStop(0, '#22406b'); gg2.addColorStop(1, '#152742'); }
    else { gg2.addColorStop(0, '#4a2a3c'); gg2.addColorStop(1, '#251522'); }
    c.fillStyle = gg2; c.fill();
    c.restore();
    c.save();
    c.globalAlpha = 0.45;
    rr(c, x0, boardT, wid, boardB - boardT, 20);
    c.lineWidth = 3; c.strokeStyle = side === 'p' ? '#5b87c4' : '#a05a72'; c.stroke();
    c.clip();
    if (side === 'p') {
      // planks
      c.globalAlpha = 0.18; c.strokeStyle = '#9fc0e4'; c.lineWidth = 2;
      for (let i = 1; i < COLS; i++) {
        const px = x0 + i * step;
        c.beginPath(); c.moveTo(px, boardT); c.lineTo(px, boardB); c.stroke();
      }
    } else {
      // cracks
      c.globalAlpha = 0.22; c.strokeStyle = '#e8b0c0'; c.lineWidth = 2;
      for (let i = 0; i < 5; i++) {
        const px = x0 + 24 + i * (wid / 5);
        c.beginPath();
        c.moveTo(px, boardT);
        c.lineTo(px + 22, boardT + (boardB - boardT) * 0.42);
        c.lineTo(px - 10, boardB);
        c.stroke();
      }
    }
    c.restore();
    /* Whether this side has room to rotate — the one rule that prices every
       deployment. YOUR SIDE / THEIR SIDE used to sit on the line above it and
       has been cut: after twelve rounds of accumulation it was labelling
       something the board already says four other ways — the slab colours, the
       crown, the divide down the middle, and the fact that the hand is at the
       bottom of the screen. The line it was using is better spent on a rule. */
    // A column label was tried here and cut: the ×2 on the counter of whatever
    // is standing there says it where it matters, and the band above the board
    // belongs to whatever banner is up.
    // Three states now, and the middle one has to read as a warning rather
    // than as either of the other two, because it is the new decision: the
    // board is still safe, but it has stopped paying.
    const room = hasRoom(g, side), packed = isPacked(g, side);
    if (sideUnits(g, side).length) {
      c.save();
      c.globalAlpha = room ? 0.6 : 0.95;
      txt(c, room ? 'ROOM TO FALL BACK' : packed ? 'NO ROOM — THE COLD GETS IN' : 'CRAMPED — NO WARMTH',
        x0 + wid / 2, boardB + 15, 11.5,
        room ? '#8fe0a0' : packed ? '#8fe3ff' : '#ffd166', 'center', 't');
      c.restore();
    }
  }

  // the lane divider, so two lanes read as two lanes at a glance
  c.save();
  c.globalAlpha = 0.28;
  c.strokeStyle = '#cfe4ff'; c.lineWidth = 2; c.setLineDash([16, 12]);
  const laneMid = (LANE_Y[0] + LANE_Y[1]) / 2;
  c.beginPath();
  c.moveTo(MID - 46 - COLS * step - 12, laneMid); c.lineTo(MID - 46, laneMid);
  c.moveTo(MID + 46, laneMid); c.lineTo(MID + 46 + COLS * step + 12, laneMid);
  c.stroke();
  c.restore();

  // slots
  for (const side of ['p', 'e']) {
    for (let l = 0; l < LANES; l++) for (let col = 0; col < COLS; col++) {
      const p = slotPos(side, l, col);
      const free = slotFree(g, side, l, col);
      const held = (UI.drag && UI.drag.card) || UI.picked;
      const dragUnitCard = held && held.type === 'unit';
      const dropOk = side === 'p' && free && (dragUnitCard || (UI.drag && UI.drag.unit));
      // the one slot it would land in right now, called out from the rest
      const pointer = UI.drag ? { x: UI.drag.x, y: UI.drag.y } : UI.pointer;
      const over = dropOk && pointer && hitAt(pointer.x, pointer.y);
      const snap = over && over.id === 'slot' && over.data.lane === l && over.data.col === col;
      c.save();
      c.globalAlpha = free ? (dropOk ? 0.85 : 0.30) : 0.12;
      rr(c, p.x - SLOT_W / 2, p.y - SLOT_H / 2, SLOT_W, SLOT_H, 14);
      c.setLineDash(dropOk ? [] : [8, 8]);
      c.lineWidth = snap ? 6 : dropOk ? 4 : 2.5;
      c.strokeStyle = dropOk ? '#ffe08a' : (side === 'p' ? '#a8c8ea' : '#e8a8a8');
      c.stroke();
      if (dropOk) { c.globalAlpha = snap ? 0.3 : 0.16; c.fillStyle = '#ffe08a'; c.fill(); }
      c.restore();
      if (snap) {
        // a ghost of the card, standing where it would stand
        c.save();
        c.globalAlpha = 0.5 + Math.sin(t * 8) * 0.12;
        c.translate(p.x, p.y);
        c.scale(1 + Math.sin(t * 8) * 0.02, 1 + Math.sin(t * 8) * 0.02);
        drawCreature(c, held.art, 0, 12, SLOT_H * 0.6, { t, ph: 2 });
        c.restore();
        txt(c, 'HERE', p.x, p.y - SLOT_H / 2 + 14, 13, '#ffe08a', 'center', 'd');
      }
      if (side === 'p' && free) hit('slot', p.x - SLOT_W / 2, p.y - SLOT_H / 2, SLOT_W, SLOT_H, { lane: l, col });
    }
  }

  // the divide
  c.save();
  c.globalAlpha = 0.35;
  c.strokeStyle = '#cfe4ff'; c.lineWidth = 3; c.setLineDash([12, 14]);
  c.beginPath(); c.moveTo(MID, 120); c.lineTo(MID, 460); c.stroke();
  c.restore();

  // units, back to front
  const list = b.units.slice().sort((a, x) => (a.py - x.py) || (a.col - x.col));
  for (const u of list) {
    drawUnit(c, u, t);
    if (u.alive) {
      const sp = slotPos(u.side, u.lane, u.col);
      hit('unit', sp.x - SLOT_W / 2, sp.y - SLOT_H / 2, SLOT_W, SLOT_H, u);
    }
  }

  /* Telegraphs: anything one tick from going off draws a line to what it will
     hit. Faint by default, bright while the order is being read. */
  for (const u of units(g)) {
    if (!u.alive || u.cnt > 1) continue;
    if (stat(u, 'frost') > 0 || stat(u, 'slow') > 0) continue;
    // A foe that has named somebody points at the somebody, not at whatever
    // its ordinary targeting would find.
    const named = u.plot && u.plot.uid ? units(g).find((x) => x.uid === u.plot.uid && x.alive) : null;
    const tgt = named || targetFor(g, u);
    if (!tgt) continue;
    const mine = u.side === 'p';
    c.save();
    c.globalAlpha = UI.order ? 0.75 : 0.3;
    c.strokeStyle = mine ? '#9fe0ff' : '#ff9aa5';
    c.lineWidth = UI.order ? 3 : 2;
    c.setLineDash([7, 9]);
    c.lineDashOffset = -(t * 34) % 16;
    const x1 = u.px + (mine ? SLOT_W * 0.4 : -SLOT_W * 0.4), y1 = u.py;
    const x2 = tgt.px + (mine ? -SLOT_W * 0.4 : SLOT_W * 0.4), y2 = tgt.py;
    c.beginPath();
    c.moveTo(x1, y1);
    c.quadraticCurveTo((x1 + x2) / 2, (y1 + y2) / 2 - 26, x2, y2);
    c.stroke();
    c.setLineDash([]);
    const a = Math.atan2(y2 - (y1 + y2) / 2 + 26, x2 - (x1 + x2) / 2);
    c.beginPath();
    c.moveTo(x2, y2);
    c.lineTo(x2 - Math.cos(a - 0.4) * 13, y2 - Math.sin(a - 0.4) * 13);
    c.lineTo(x2 - Math.cos(a + 0.4) * 13, y2 - Math.sin(a + 0.4) * 13);
    c.closePath();
    c.fillStyle = mine ? '#9fe0ff' : '#ff9aa5';
    c.fill();
    c.restore();
  }

  /* Heat, on the beast that is accumulating it. The whole answer to the Kettle
     Titan is "the number is going up, take it back off" — which is no answer
     at all unless the number is on the table. */
  for (const u of units(g)) {
    if (!u.alive || !u.heat) continue;
    const sp = slotPos(u.side, u.lane, u.col);
    const hx = sp.x + SLOT_W / 2 - 6, hy = sp.y - SLOT_H / 2 - 6;
    c.save();
    c.globalAlpha = 0.92;
    c.beginPath(); c.arc(hx, hy, 15, 0, TAU);
    inked(c, '#ff7a2c', 2.5, C.ink);
    txt(c, '+' + u.heat, hx, hy + 1, 15, '#2a1206', 'center', 'd', 0);
    txt(c, 'HEAT', hx, hy - 26, 10, '#ff9a5c', 'center', 'd');
    c.restore();
  }

  /* Intent, in words, on the outward side of the lane — above the top row and
     below the bottom one, which is the only band on the table that belongs to
     nothing else. A foe that means to do something specific says so here, and
     goes on saying it for as long as it still means to. */
  for (const u of units(g)) {
    if (!u.alive || !u.plot) continue;
    const sc = SCHEMES[u.plot.id];
    const col = (sc && sc.col) || '#ff9aa5';
    const label = u.plot.label;
    const sp = slotPos(u.side, u.lane, u.col);
    const ry = u.lane === 0 ? sp.y - SLOT_H / 2 - 19 : sp.y + SLOT_H / 2 + 2;
    const rw = Math.min(SLOT_W + 34, 30 + label.length * 6.2);
    const rx = sp.x - rw / 2;
    c.save();
    c.globalAlpha = 0.86 + Math.sin(t * 5 + u.bob) * 0.14;
    panel(c, rx, ry, rw, 17, 6, '#1a1020', col);
    txt(c, label, sp.x, ry + 8.5, 10, col, 'center', 'm');
    c.restore();
    // a nick in the ribbon pointing at the creature that means it
    c.save();
    c.fillStyle = col;
    c.beginPath();
    const ny = u.lane === 0 ? ry + 17 : ry;
    const dir = u.lane === 0 ? 1 : -1;
    c.moveTo(sp.x - 6, ny); c.lineTo(sp.x + 6, ny); c.lineTo(sp.x, ny + dir * 6);
    c.closePath(); c.fill();
    c.restore();
  }

  // whoever is actually first out of the gate next turn
  const nextUp = turnOrder(g).find((u) => u.alive && u.cnt <= 1 && !stat(u, 'frost') && !stat(u, 'slow'));
  if (nextUp) {
    // on the outer edge, where it cannot be mistaken for the slab above it
    const out = nextUp.side === 'p' ? -1 : 1;
    const bx3 = nextUp.px + out * (SLOT_W / 2 + 30);
    c.save();
    c.globalAlpha = 0.9 + Math.sin(t * 6) * 0.1;
    panel(c, bx3 - 30, nextUp.py - 13, 60, 26, 8, nextUp.side === 'p' ? '#2f5d8f' : '#8f3f4f', C.ink);
    txt(c, 'NEXT', bx3, nextUp.py, 12, '#ffffff', 'center', 't');
    c.beginPath();
    c.moveTo(bx3 - out * 30, nextUp.py - 7);
    c.lineTo(bx3 - out * 40, nextUp.py);
    c.lineTo(bx3 - out * 30, nextUp.py + 7);
    c.closePath();
    c.fillStyle = nextUp.side === 'p' ? '#2f5d8f' : '#8f3f4f'; c.fill();
    c.restore();
  }

  // attack order preview
  if (UI.order) {
    const ord = turnOrder(g);
    ord.forEach((u, i) => {
      const bx2 = u.px - SLOT_W / 2 - 2, by2 = u.py - SLOT_H / 2 + 34;
      c.beginPath(); c.arc(bx2, by2, 14, 0, TAU);
      inked(c, '#0f1a2e', 2.5, '#8fe3ff');
      txt(c, String(i + 1), bx2, by2 + 1, 16, '#8fe3ff', 'center', 'd', 0);
    });
  }

  /* What the held card would do, written on the things it would do it to. */
  if (UI.drag && UI.drag.card && UI.drag.card.type === 'item') {
    const overHit = hitAt(UI.drag.x, UI.drag.y);
    const overUnit = overHit && overHit.id === 'unit' ? overHit.data : null;
    const tg = CARDS[UI.drag.card.def].target;
    const spot = tg === 'none' ? null : overUnit;
    if (tg === 'none' || (overUnit && canPlay(g, UI.drag.card, overUnit))) {
      for (const p of previewOf(g, UI.drag.card, spot)) {
        if (!p.u || !p.u.alive) continue;
        const lethal = p.dmg > 0 && p.dmg >= p.u.hp + stat(p.u, 'shell');
        const px = p.u.px, py = p.u.py - SLOT_H / 2 - 6;
        c.save();
        c.globalAlpha = 0.95;
        const label = p.dmg > 0 ? '-' + p.dmg : p.dmg < 0 ? '+' + (-p.dmg) : (p.tag || '·');
        const w = Math.max(46, label.length * 11 + 18);
        panel(c, px - w / 2, py - 18, w, 26, 8, lethal ? '#8f2f3f' : p.dmg < 0 ? '#2f6f4f' : '#243a5e',
          lethal ? '#ff9aa5' : C.ink);
        txt(c, label, px, py - 4, 15, lethal ? '#ffd8dc' : '#eaf6ff', 'center', 'd');
        c.restore();
        c.save();
        c.globalAlpha = 0.5 + Math.sin(t * 8) * 0.2;
        c.strokeStyle = lethal ? '#ff5566' : '#8fe3ff';
        c.lineWidth = 3;
        rr(c, p.u.px - SLOT_W / 2, p.u.py - SLOT_H / 2, SLOT_W, SLOT_H, 14);
        c.stroke();
        c.restore();
        if (lethal) txt(c, '✕', p.u.px, p.u.py, 46, 'rgba(255,120,140,.75)', 'center', 'd');
      }
    }
  }

  drawHand(c, t);
  drawHud(c, t);

  // why that would not have worked
  if (UI.refuse) {
    UI.refuse.t += 1 / 60;
    if (UI.refuse.t > 1.7) UI.refuse = null;
    else {
      const k = clamp(1 - (UI.refuse.t - 1.2) / 0.5, 0, 1);
      const w2 = Math.max(200, UI.refuse.text.length * 8 + 30);
      const rx = clamp(UI.refuse.x - w2 / 2, SAFE, VW - SAFE - w2);
      const ry = clamp(UI.refuse.y - 64, 120, VH - 120);
      c.save();
      c.globalAlpha = k;
      panel(c, rx, ry, w2, 38, 10, 'rgba(70,26,34,.94)', '#ff9aa5');
      txt(c, UI.refuse.text, rx + w2 / 2, ry + 20, 14, '#ffd8dc', 'center', 't');
      c.restore();
    }
  }

  // what just happened, on the band between the table and your hand
  if (b.log && b.log.length) {
    const show = b.log.slice(-2);
    for (const L of b.log) L.t += 1 / 60;
    show.forEach((L, i) => {
      const age = clamp(1 - (L.t - 2.2) / 1.2, 0, 1);
      if (age <= 0) return;
      c.save();
      c.globalAlpha = age * (i === show.length - 1 ? 1 : 0.5);
      txt(c, L.text, MID, 472 + i * 19, 13.5, L.col, 'center', 't');
      c.restore();
    });
    while (b.log.length && b.log[0].t > 3.6) b.log.shift();
  }

  // piles
  // the two piles, as actual stacks of card backs you can tap and read
  for (const which of ['draw', 'discard']) {
    const list = which === 'draw' ? b.draw : b.discard;
    const p = pilePos(which);
    const deep = Math.min(4, Math.ceil(list.length / 4));
    for (let i = deep; i >= 0; i--) {
      const off = i * 2.5;
      c.save();
      c.globalAlpha = list.length ? 1 : 0.35;
      panel(c, p.x - 30 - off, p.y - 40 + off, 60, 80, 8,
        which === 'draw' ? '#24406b' : '#2c2438', which === 'draw' ? '#4f79b0' : '#6a5478');
      if (i === 0) {
        c.save();
        c.globalAlpha = 0.5;
        c.strokeStyle = '#8fb6e8'; c.lineWidth = 2;
        c.beginPath(); c.arc(p.x, p.y - 6, 13, 0, TAU); c.stroke();
        c.restore();
      }
      c.restore();
    }
    txt(c, String(list.length), p.x, p.y - 4, 22, '#eaf6ff', 'center', 'd');
    txt(c, which === 'draw' ? 'DECK' : 'USED', p.x, p.y + 26, 11, '#9fb6d6', 'center', 't');
    hit(which === 'draw' ? 'deckPile' : 'discardPile', p.x - 32, p.y - 44, 64, 88);
  }

  // cards on their way to the pile
  for (const f of flyers) {
    const k = f.t / f.life;
    const to = pilePos('discard');
    const x0 = f.x0 === undefined ? MID : f.x0, y0 = f.y0 === undefined ? HAND_Y : f.y0;
    // thrown: it leaves fast, arcs up over the table, and drops onto the pile
    const x = lerp(x0, to.x - CARD_W * 0.24, easeOut(k));
    const y = lerp(y0, to.y - CARD_H * 0.24, easeIn(k)) - Math.sin(k * Math.PI) * 90;
    c.save();
    c.globalAlpha = 1 - k * 0.7;
    drawCard(c, f.card, x, y, CARD_W, CARD_H, { t, scale: 1 - k * 0.5, rot: f.rot * 4 * k });
    c.restore();
  }

  // the bell
  const charged = b.bell >= BELL_CHARGE;
