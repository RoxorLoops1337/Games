  *{ box-sizing:border-box; margin:0; padding:0; }
  html,body{
    width:100%; height:100%; overflow:hidden; background:#05080f; color:#e9f2ff;
    font-family:'Frostwork','Trebuchet MS',system-ui,sans-serif;
    -webkit-user-select:none; user-select:none; -webkit-touch-callout:none;
    -webkit-tap-highlight-color:transparent; touch-action:none; overscroll-behavior:none;
  }
  #stage{ position:fixed; inset:0; display:grid; place-items:center; background:#05080f; }
  #game{ display:block; touch-action:none; image-rendering:auto; }

  /* Portrait gate — the whole game is authored landscape, so a phone held the
     wrong way gets a proper screen rather than a squeezed board. */
  #rotate{
    position:fixed; inset:0; display:none; place-items:center; text-align:center;
    background:radial-gradient(120% 90% at 50% 20%, #14294a 0%, #070c17 70%); z-index:20;
    padding:24px;
  }
  body.portrait #rotate{ display:grid; }
  body.portrait #stage{ visibility:hidden; }
  #rotate .inner{ max-width:340px; }
  #rotate .glyph{
    width:96px; height:150px; margin:0 auto 26px; border:5px solid #cfe4ff; border-radius:14px;
    position:relative; animation:tip 2.4s ease-in-out infinite;
    box-shadow:0 0 0 4px rgba(0,0,0,.45), 0 10px 40px rgba(80,160,255,.25);
  }
  #rotate .glyph::after{ content:''; position:absolute; left:50%; bottom:8px; width:28px; height:4px;
    transform:translateX(-50%); background:#cfe4ff; border-radius:2px; opacity:.75; }
  @keyframes tip{ 0%,35%{ transform:rotate(0deg);} 65%,100%{ transform:rotate(-90deg);} }
  #rotate h2{ font-family:'Frostcut','Trebuchet MS',sans-serif; font-size:26px; letter-spacing:3px;
    color:#eaf4ff; text-shadow:0 3px 0 #0a1830; }
  #rotate p{ margin-top:12px; color:#8fb2dd; font-size:15px; line-height:1.5; letter-spacing:.5px; }

  /* First-touch gate: audio + fullscreen + orientation lock all need a gesture. */
  #boot{ position:fixed; inset:0; display:grid; place-items:center; z-index:15;
    background:radial-gradient(120% 90% at 50% 30%, #16304f 0%, #05080f 72%); }
  #boot.gone{ display:none; }
  #boot .card{ text-align:center; padding:30px 40px; }
  #boot h1{ font-family:'Frostcut','Trebuchet MS',sans-serif; font-size:clamp(38px,9vw,74px);
    letter-spacing:8px; color:#dff0ff;
    text-shadow:0 4px 0 #17385f, 0 8px 0 #0d2039, 0 14px 34px rgba(90,180,255,.4); }
  #boot .sub{ margin-top:14px; color:#7fa6d6; letter-spacing:4px; font-size:13px; text-transform:uppercase; }
  #boot .go{ margin-top:34px; display:inline-block; padding:15px 42px; cursor:pointer;
    font-family:'Frostcut','Trebuchet MS',sans-serif; font-size:22px; letter-spacing:4px; color:#08131f;
    background:linear-gradient(#9fe6ff,#4fb8f0); border-radius:14px;
    box-shadow:0 6px 0 #1c6b9c, 0 12px 26px rgba(0,0,0,.5); animation:pulse 2.2s ease-in-out infinite; }
  #boot .go:active{ transform:translateY(4px); box-shadow:0 2px 0 #1c6b9c, 0 6px 14px rgba(0,0,0,.5); }
  @keyframes pulse{ 50%{ filter:brightness(1.12); } }
</style>

<script>
/* ===========================================================================
   FROSTFELL — one file, no dependencies. Markup, CSS and this script are the
   whole game.

     1  utilities, rng, tween helpers
     2  palette + art language
     3  statuses and keywords
     4  card data (wardens, gear, charms) and the bestiary
     5  run + battle state
     6  battle engine — the bell, counters, targeting, damage, death
     7  run layer — the trail map, rewards, shop, camp, saving
     8  juice — shake, particles, floaters, the beat queue
     9  rendering — creatures, cards, board, trail, screens
    10  input — pointer, drag and drop, hit testing
    11  audio — a small procedural kit
    12  boot + main loop

   Headless tests set window.__FF_HEADLESS__ before evaluating this script and
   drive the game through window.FF; nothing here may require a real canvas.
   =========================================================================== */
(function(){
'use strict';

const HEADLESS = typeof window !== 'undefined' && !!window.__FF_HEADLESS__;

/* ========================================================== 1. utilities === */

const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const lerp = (a, b, t) => a + (b - a) * t;
const TAU = Math.PI * 2;
const easeOut = (t) => 1 - Math.pow(1 - t, 3);
const easeIn = (t) => t * t * t;
const easeInOut = (t) => (t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2);
// A soft overshoot — the shape every card that lands on the board uses.
const easeBack = (t) => { const c = 1.70158 + 1; return 1 + c * Math.pow(t - 1, 3) + 1.70158 * Math.pow(t - 1, 2); };
const cap = (s) => s.charAt(0).toUpperCase() + s.slice(1);

/* A small deterministic PRNG. Runs are seeded so a trail can be replayed and
   so the suites get the same board twice. */
function mulberry(seed) {
  let a = seed >>> 0;
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
let RNG = mulberry(1);
const rnd = () => RNG();
const rint = (n) => Math.floor(RNG() * n);
const rrange = (a, b) => a + Math.floor(RNG() * (b - a + 1));
const pick = (arr) => arr[Math.floor(RNG() * arr.length)];
function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(RNG() * (i + 1));
    const t = arr[i]; arr[i] = arr[j]; arr[j] = t;
  }
  return arr;
}
/* Draw without repeats, tolerating a pool smaller than the ask. */
function sample(arr, n) {
  const c = arr.slice();
  shuffle(c);
  return c.slice(0, Math.min(n, c.length));
}

/* ================================================ 2. palette + art language */

const C = {

const STATUS_ORDER = ['frost', 'ember', 'shell', 'spice', 'weak', 'swift', 'slow', 'regen', 'thorns', 'bounty'];

/* Keywords live on the card, not on the unit — they never decay. */
const KEYWORD = {

/* Art recipes. The creature renderer reads these — see section 9. Every
   creature in the game is one of these plus a seed, which is what keeps forty
   characters looking like they came out of the same sketchbook. */
const A = (body, belly, o) => Object.assign({ body, belly, shape: 'blob', ears: 'round', eyes: 'dot', mouth: 'smile', acc: 'none' }, o || {});

/* -- wardens (units you play) --------------------------------------------- */
/* ========================= WHAT A GOOD CARD LOOKS LIKE =====================

   Written down BEFORE the next one is built, because two rounds of building
   first and measuring afterwards shipped one card and one event and cut five
   things. Every one of those five failed for a reason that was knowable in
   advance, and the reasons turned out to be the same reason four times. So:
   four tests, derived from every measurement this project has taken. A card
   that fails one of them does not get built.

   1. IT ASKS A QUESTION THAT IS ANSWERED DIFFERENTLY ON DIFFERENT TURNS.
      If the right play is the same every time, it is not a decision, it is a
      stat with extra words. Vanguard-that-grows-while-parked failed here: the
      answer was always "leave it".

   2. THE QUESTION IS ASKED ON THE BOARD.
      The board is the only surface both sides share and both pilots read. A
      threat aimed at the hand, the purse or the deck can be ignored for free by
      whoever does not use that resource — and the pilot who uses none of them
      is the pilot who is already losing. The hand-targeting scheme failed here
      and it read as four free points for the worst pilot in the game.

   3. IT COSTS SOMETHING THE PLAYER WANTED.
      A benefit that accrues without a decision accrues fastest to whoever does
      nothing, which is the definition of the weak player. The best things in
      this game all charge for themselves: the front row trades safety for
      tempo, the room rule charges a body for warmth, holding gear charges a
      turn of tempo for a better turn later.

   4. IT MUST NOT ANSWER A QUESTION THE BOARD ALREADY ASKS.
      Adding a card that makes positioning irrelevant does not add a decision,
      it deletes several. Every Soak-granting card failed here: a taunt does not
      prevent damage, it concentrates it, and it replaces the question "where
      does this body stand" with one answer for the whole fight.

   The shortest form, which is what to hold in your head: A GOOD CARD MAKES THE
   PLAYER CHOOSE BETWEEN TWO THINGS THEY WANT, ON THE BOARD, DIFFERENTLY EACH
   TURN. If you cannot say what it costs, it is not finished.
   ========================================================================= */
const CARDS = {};
/* A SECOND def() FOR THE SAME ID USED TO WIN SILENTLY, and it cost a card.

   Five new cards went in above the gear block; one of them was named
   cairnwarden, which already existed a hundred lines further down. The later
   def overwrote the earlier one, the new card vanished from the game entirely,
   and the whole suite went green — 602 checks, because every one of them
   happened to be testing the survivor. A collision that deletes content and
   passes every test is the worst shape a bug can have, so it is a throw now. */
const def = (o) => {
  if (CARDS[o.id]) throw new Error('two cards claim the id ' + o.id);
  CARDS[o.id] = o; return o;
};

/* AND THE THIRD TIME THE SAME LESSON, WHICH IS WHEN IT WENT IN THE FILE.

   Soak is scarce — six cards in fifty-three — and this round set out to fix
   that, because scarcity of the only answer to the game's most damaging foe
   looked like a gap. Three things were built for it and all three were cut,
   each after being measured:

     a gear item that hands out Soak     ceiling 34 → 29
     a charm that hands out Soak         (same run)
     a scrap unit that natively soaks    careless 7 → 11, the FIGHT RUNG +15 → +4

   The first two are last round's finding arriving again: a taunt does not
   prevent damage, it concentrates it. The third is worse and more interesting.
   A sturdy self-taunting wall makes the game markedly easier for a bad player
   and slightly harder for a good one, because it does not reward positioning —
   IT REPLACES IT. Every question the board asks about where a body stands has
   one answer while that card is on the table.

   So Soak stays scarce, on purpose, and it is written down here so the next
   round does not read the same table and build the same card. Content that
   substitutes for the geometry is not content. */
/* AND A THIRD VANGUARD CARD WAS BUILT AND CUT, WHICH MAKES THE RULE.

   Vanguard was the one thing built last round that measured positive, so this
   round built more of it: a cheap body that gains an attack every time it
   triggers in the front row, capped at +4 after the uncapped version proved
   the point twice as loudly.

   Out of the pool it went, because it is the same finding as the taunt cards
   and the hand-targeting scheme, and three times is a rule:

     A MECHANIC THAT REWARDS LEAVING THE BOARD ALONE BELONGS TO THE PLAYER WHO
     NEVER MOVES ANYTHING.

   Vanguard pays for standing in the front. A careful pilot moves bodies in and
   out of the front every turn and collects some of it; a careless pilot parks
   a warden there on turn one and never touches it again, and collects ALL of
   it. Measured: with this card in the pool the careless rung went 6% to 10%
   and the fight rung went +11 to +7; with it out, both returned exactly.

   The mechanics this game is good at all demand a RESPONSE — a scheme you have
   one turn to answer, a room rule that prices every deployment, a front row
   that trades safety for tempo. The ones that reward a settled board reward
   the player who was going to settle anyway. */

     with the three          ladder 27 points · the fight set 12

/* THE HOLE A GEAR CARAVAN COULD NOT DRAFT OUT OF, AND WHY IT STAYS OPEN.

   Soak is the only answer to Aimless, every card that has it is a UNIT, and A
   Heavy Pack matches items only — so a caravan travelling for gear cannot draft
   the answer at all. The obvious fix was a piece of gear that hands out Soak,
   and it was built: Braceboard, one fight's worth of taunt and some shell.

   It measured as a trap, and it should have been predicted. The round before
   had already found that A TAUNT DOES NOT PREVENT DAMAGE, IT CONCENTRATES IT —
   pointing the pilot at soakers cost four points of win rate then. Handing out
   Soak as a card is the same mistake in a form the player cannot decline: with
   Braceboard and a Soak charm in the pool the ceiling fell from 34 to 29, and
   taking them back out put it at 33.

   So the gap stays open on purpose, and the answer for a gear caravan is not a
   taunt. It is to kill the fast thing quickly, which twenty-one items are for.
   A keyword that is right for a sturdy body and wrong for everything else does
   not want to be portable. */

/* THE ONE CARD YOU CANNOT DRAFT.

   The Kettle Titan's whole answer is frost, and the probe found the answer was
   simply not in the player's hand: across fifty-six fights with the beast, some
   frost gear was in hand on 23% of turns — and for a caravan that never drafted

   fight and nowhere else, it goes back into the deck every time it is used, and

   turn cooling the boiler, or spend it swinging and let the heat climb. */

  effect: (g, t) => { sfx('snow'); addStatus(g, t, 'frost', 2); } });

/* What a piece of gear would do to what you are pointing it at. This is the
   one place that knows, so the card text, the tooltip and the drag preview can
   never disagree about it. */
const PREVIEW = {
  icepick:    (g, t) => [{ u: t, dmg: 4, tag: 'FROST 1' }],
  blastcap:   (g, t) => [{ u: t, dmg: 6 }].concat(neighbours(g, t).map((n) => ({ u: n, dmg: 3 }))),
  snowbomb:   (g, t) => laneOf(g, 'e', t.lane).map((f) => ({ u: f, dmg: 3, tag: 'FROST 1' })),
  snowhandful: (g, t) => [{ u: t, dmg: 0, tag: 'FROST 2' }],
  avalanche:  (g, t) => {
    const l = laneOf(g, 'e', t.lane);
    const d = 3 + Math.max(0, l.length - 1) * 2;
    return l.map((f) => ({ u: f, dmg: d }));
  },
  grudge:     (g, t, card) => [{ u: t, dmg: 3 + hoardOf(card) }],
  emberflask: (g, t) => [{ u: t, dmg: 0, tag: 'EMBER 4' }],
  tinderjar:  (g) => enemyUnits(g).map((u) => ({ u, dmg: 0, tag: u.plot ? 'EMBER 6' : 'EMBER 3' })),
  coldsnap:   (g) => enemyUnits(g).map((u) => ({ u, dmg: 0, tag: 'FROST 1' })),
  hush:       (g, t) => [{ u: t, dmg: 0, tag: 'FROST 3' }],
  coldread:   (g, t) => [{ u: t, dmg: t && t.plot ? 6 : 0, tag: t && t.plot ? 'BREAK THE SCHEME' : 'FROST 1' }],
  hookline:   (g, t) => laneOf(g, 'e', t.lane).map((f) => ({ u: f, dmg: 0, tag: 'HAUL' })),
  stew:       (g, t) => [{ u: t, dmg: -6, tag: 'MEND 6' }],
  patchkit:   (g, t) => [{ u: t, dmg: -3, tag: 'SHELL 3' }],
  lastlight:  (g, t) => [{ u: t, dmg: -10, tag: 'CLEANSE' }],
  whetstone:  (g, t) => [{ u: t, dmg: 0, tag: 'SPICE 3' }],
  gearshield: (g, t) => [{ u: t, dmg: 0, tag: 'SHELL 5' }],
  thornoil:   (g, t) => [{ u: t, dmg: 0, tag: 'THORNS 3' }],
  bellrope:   (g, t) => [{ u: t, dmg: 0, tag: 'SWIFT 2' }],
  pryrod:     (g, t) => [{ u: t, dmg: 0, tag: 'COUNTER -2' }],
  kindling:   (g) => playerUnits(g).map((u) => ({ u, dmg: 0, tag: 'SPICE 2' })),
  bankedembers: (g) => playerUnits(g).map((u) => ({ u, dmg: 0, tag: 'IF DENIED · MEND 4' })),
  oldmap:     () => [],
};
function previewOf(g, card, spot) {
  const f = PREVIEW[card && card.def];
  if (!f) return [];
  const tg = CARDS[card.def].target;
  if (tg !== 'none' && (!spot || !spot.uid || !spot.alive)) return [];
  try { return f(g, spot, card) || []; } catch (e) { return []; }
}

  mend:   { id: 'mend',   name: 'Bell of Mending', col: '#8fe0a0', text: 'Every warden mends 3 after every fight.',
            apply: (run) => { run.mend = (run.mend || 0) + 3; } },
};

/* Fittings a card can wear that the player never picks off a shelf. */
const EXTRAS = {
  heartbell: { id: 'heartbell', name: 'Heart Bell', col: '#ff8b7a', text: '+8 health, rung for at a boss.',
               apply: (c) => { c.hp += 8; } },
  blessed:   { id: 'blessed', name: 'Blessed', col: '#ffd166', text: 'Left better than it was found: +2 attack, +3 health.',
               apply: (c) => { c.atk += 2; c.hp += 3; } },
};
const chOf = (id) => CHARMS[id] || SCARS[id] || EXTRAS[id];
/* WHAT THE PURSE IS ACTUALLY BUYING, AND THE DEAD END BEFORE THIS.

   The first measurement to ask where money goes gave one answer: a bottomless
   purse won 61% against 38% as it ships, and taking CHARMS off the counter —
   and nothing else — dropped it to 44%. Seventeen of twenty-one points were one
   ware, because a rich pilot bought every charm in every shop.

   The obvious fix was a cap: two places on a warden, pick which one comes off.
   It was built, measured, and thrown away, and the measurement is the reason.
   At 120 runs an arm it did narrow the economy exactly as intended — the
   trader's rung fell from +20 to +10 — and it took TEN POINTS off the whole
   game and half the careless floor with it, because charms were never the rich
   pilot's lever alone. They were a large share of everybody's power, and
   capping them took a slice out of all of it. Making each remaining charm
   stronger to compensate did not bring it back.

   So the tax goes on the PURSE and not on the charm. Each one bought from the
   trader costs more than the last, the way a meal already does, and a charm won
   at a reward or found at a camp is untouched. A pilot who finds four charms is
   exactly as strong as before; a pilot who tries to buy eight pays for it. */
const CHARM_STEP = 0.55;    // each charm bought this run makes the next dearer
const charmMul = (run) => 1 + CHARM_STEP * (run.charmsBought || 0);
/* AND A PRICE ALONE COULD NOT DO IT, WHICH IS WORTH KNOWING.

   Escalating the price measured as exactly nothing against the bottomless
   purse, and it had to: that arm is defined as "prices do not matter", so it
   cannot see a price. The arm measures what money can BUY, not what it costs,
   and the only thing that narrows it is a limit on how much there is.

   So the trader carries three charms in a run and then has none. A pilot
   buying one or two — which is what a pilot with an ordinary purse does —
   never meets this. A pilot buying ten does. The rising price is still there
   for everyone in between, and charms won at rewards, caches and camps are not
   counted against the stock at all: the fell gives away as many as it likes. */
const CHARM_STOCK = 3;
/* What a hoarding card has actually banked. Hoard is a RATING now, not a flag:
   Keepsake banks two a turn where Old Grudge banks one. */
const hoardOf = (card) => (card && card.kw && card.kw.hoard
  ? card.kw.hoard * Math.min(HOARD_CAP, card.held || 0) : 0);

/* Scars are charms with a bite — a warden that faints picks one up. */
/* How many a single warden can carry. Two is a card worth mending or leaving
   behind; unbounded is a card that quietly becomes unplayable while the player
   is looking somewhere else. */
const SCAR_CAP = 2;
const SCARS = {
  cracked: { id: 'cracked', name: 'Cracked', col: '#7f8db0', text: '-2 max health.', apply: (c) => { c.hp = Math.max(1, c.hp - 2); } },
  stiff:   { id: 'stiff',   name: 'Stiff',   col: '#7f8db0', text: '+1 counter.',    apply: (c) => { c.cnt += 1; } },
  dulled:  { id: 'dulled',  name: 'Dulled',  col: '#7f8db0', text: '-1 attack.',     apply: (c) => { c.atk = Math.max(0, c.atk - 1); } },
};

/* -- what a foe means to do next ------------------------------------------ */
/* A counter says WHEN something happens. A scheme says WHAT, a turn before it
   lands, in words on the table — and every one of them can be taken off the
   foe by somebody who reads it and moves first. That is the difference
   between a fight you watch resolve and a fight you play.
     `lay` runs the moment the foe is one tick out, and freezes the details it
   is committing to. `fire` runs when the counter lands and returns false if
   the player has since made it impossible; a scheme marked `solo` IS the
   foe's swing, so denying one costs the foe its whole turn. */
const SCHEMES = {
  /* It picks a warden, by name, and the slot that warden is standing in.
     Deny it by moving them — moving is free, but it wants a slot to move
     into, so this rule and the room rule pull on the same rope. */
  mark: {
    id: 'mark', col: '#ff9aa5', solo: true,
    missed: 'sliding them to another slot would have cost you nothing',
    lay: (g, u) => {
      const t = targetFor(g, u);
      return t ? { uid: t.uid, lane: t.lane, col: t.col, label: 'LUNGE AT ' + t.name.toUpperCase() } : null;
    },
    fire: (g, u, p) => {
      // It committed to a warden AND to the slot that warden was standing in.
      // Still there: the full lunge. Somebody else standing there: an ordinary
      // blow, because a body is a body. Nobody there at all: empty snow.
      const t = units(g).find((x) => x.uid === p.uid && x.alive);
      const held = t && t.lane === p.lane && t.col === p.col;
      const standing = held ? t : unitAt(g, other(u.side), p.lane, p.col);
      if (!standing) return false;
      fx.lunge(u, standing);
      sfx('swing');
      const dealt = hurt(g, standing, (held ? u.atk * 2 : u.atk) + stat(u, 'spice'), u);
      logLine(g, u.name + (held ? ' lunges at ' : ' finds ') + standing.name + ' for ' + dealt, '#ffb0b0');
      return true;
    },
  },
  /* One more body on their side of the table. Deny it by leaving them no slot
     to put it in — which means not clearing their back line this turn, and is
     the one moment in the game where killing something is the wrong play. */
  /* SOLO, AS OF THIS ROUND, and that is what makes spreading schemes safe.

     A non-solo scheme is an extra effect ON TOP of the foe's swing, so putting
     more of them into the bestiary is simply a buff to the fell — measured, it
     took zone-two arrivals from 156 runs in 210 down to 127 and the careless
     floor from 6% to 4%. A solo one IS the foe's turn: it whistles instead of
     swinging, which makes the scheme a choice the fell made rather than a bonus
     it collected, and makes denying it worth the foe's whole turn.

     Which is also the answer to "denial that pays differently depending on how
     you did it": deny a gather by leaving them no slot and they have thrown the
     turn away entirely; deny a chill by emptying the lane and you have only
     stopped the extra. */
  gather: {
    id: 'gather', col: '#ffd166', solo: true,
    missed: 'leaving them no free slot would have thrown their whole turn away',
    lay: (g, u) => ({ label: 'CALL THE PACK' , call: u.call || 'mitewing' }),
    fire: (g, u, p) => {
      if (!freeSlots(g, u.side).length) return false;
      summon(g, p.call, 1);
      logLine(g, u.name + ' calls the pack', '#ffd166');
      return true;
    },
  },
  /* A whole lane iced at once. Deny it by emptying the lane it named — two
     free moves, or one if you were only holding it with one warden. */
  chill: {
    id: 'chill', col: '#8fe3ff',
    missed: 'emptying that lane would have stopped it',
    lay: (g, u) => ({ lane: u.lane, label: 'BREATHE ON THE ' + (u.lane === 0 ? 'TOP' : 'LOWER') + ' LANE' }),
    fire: (g, u, p) => {
      const line = laneOf(g, other(u.side), p.lane);
      if (!line.length) return false;
      for (const t of line) addStatus(g, t, 'frost', 1);
      logLine(g, u.name + ' breathes across the lane', '#8fe3ff');
      return true;
    },
  },
  /* A FOURTH WAS BUILT AND CUT, AND THIS IS WHY.

     Every scheme here is answered on the BOARD — move the named warden, leave
     them no slot, empty the lane — three ways of saying "reposition". A fourth
     was written to be answered from the HAND: it took the piece of gear you
     were saving, so the only denial was to spend that gear now, worse than you
     wanted to. On paper it couples the only two fight habits that price above
     zero, holding gear and denying schemes.

     Measured, it made the game EASIER, and the reason is structural rather than
     a matter of tuning. The careless pilot's hand is always empty — it dumps
     every card the turn it draws it — so a foe that spends a telegraph reaching
     for the hand is reaching into a pocket with nothing in it, and it read as
     four free points of win rate for the worst pilot in the game. Meanwhile the
     pilot that DOES hold gear is the one being taxed.

     ANY SCHEME THAT TARGETS THE HAND IS A GIFT TO A PLAYER WHO DOES NOT USE IT.
     The board is the only shared surface: everybody has one, so everybody can
     be threatened on it. Kept here as a note rather than as a card, so the next
     round does not write it again. */
};

/* ============================================ 5. run + battle state ======= */

/* The board is two LANES deep three columns. Column 0 is the front — the side
   of the slot nearest the middle of the table — and a swing hits the
   front-most foe standing in the attacker's own lane. Everything about
   positioning falls out of those two sentences. */
const LANES = 2;
const COLS = 3;
const HAND = 6;
const BELL_CHARGE = 4;   // turns without ringing before a free redraw
const bellNeed = (g) => BELL_CHARGE + ((g.run && g.run.bellSlow) || 0);

const G = {
  screen: 'title',
  t: 0,                 // seconds since boot, for every idle animation
  run: null,
  battle: null,
  ui: {},               // transient per-screen scratch (reward picks, shop stock…)
  hitStop: 0,
  meta: { runs: 0, wins: 0, best: 0, unlocked: ['hearth', 'frost'], found: {},
    stats: { kills: 0, bestCombo: 0, flawless: 0, wins: 0, zones: 0 },
    winter: {}, mute: false, taught: false },

let UID = 1;
const nextUid = () => UID++;

/* A card instance: a copy of the definition that a run owns and can charm. */
function mkCard(id) {
  const d = CARDS[id];

  const c = {
    uid: nextUid(), def: id, name: d.name, type: d.type, tribe: d.tribe || null,
    rare: d.rare || 1, text: d.text || '', art: d.art, leader: !!d.leader,
    kw: Object.assign({}, d.kw || {}), charms: [], bonusDeploy: [], dmg: 0,

  if (d.type === 'item') { c.target = d.target; }

/* Charms and scars both bolt onto an instance and are re-applied from scratch

function attachCharm(card, ch) {
  card.charms.push(ch.id);
  rebuildCard(card);
}
function rebuildCard(card) {

  card.kw = Object.assign({}, d.kw || {});

  for (const id of card.charms) {
    const ch = chOf(id);
    if (ch) ch.apply(card);

  // What the trader fed it. Kept off the charm list on purpose: meals stack,
  // and a card wearing six identical pendants would read as a bug.
  if (card.type === 'unit') {

    if (card.bonusHp) card.hp += card.bonusHp;

  if (card.hp !== undefined) card.dmg = Math.min(card.dmg, card.hp - 1);
}

/* A unit is a card standing on the board. */
function mkUnit(card, side, lane, col) {
  const d = CARDS[card.def] || FOES[card.def];
  const inj = card.injured ? 0.5 : 1;
  const maxHp = Math.max(1, Math.round(card.hp * inj));
  return {
    uid: nextUid(), card, def: card.def, name: card.name, side, lane, col,
    maxHp, hp: Math.max(1, maxHp - (card.dmg || 0)),
    atk: Math.max(0, Math.round(card.atk * inj)) +
      (card.kw && card.kw.hoard ? card.kw.hoard * Math.min(HOARD_CAP, card.held || 0) : 0),
    cntMax: card.cnt, cnt: card.cnt,
    st: {}, kw: Object.assign({}, card.kw), hooks: (d && d.hooks) || {},
    scheme: (d && d.scheme) || null, call: (d && d.call) || null, plot: null,
    art: card.art, leader: !!card.leader, boss: !!(d && d.boss),
    alive: true,

    px: 0, py: 0, sq: 0, flash: 0, hitT: 0, bob: rnd() * TAU, born: 0, dead: 0, blink: rnd() * 4,
  };
}

/* Enemies are built straight from the bestiary with a zone scale. */
function mkFoeCard(id, scale) {
  const d = FOES[id];
  const s = scale || 1;
  return {
    uid: nextUid(), def: id, name: d.name, type: 'unit', tribe: null, rare: 1,
    text: d.text || '', art: d.art, leader: false, foe: true, boss: !!d.boss,
    kw: Object.assign({}, d.kw || {}), charms: [], bonusDeploy: [], dmg: 0,
    hp: Math.max(1, Math.round(d.hp * s)), atk: Math.max(0, Math.round(d.atk * s)), cnt: d.cnt,

}

/* --------------------------------------------------------- board queries -- */
const B = () => G.battle;
const units = (g) => (g.battle ? g.battle.units.filter((u) => u.alive) : []);
const playerUnits = (g) => units(g).filter((u) => u.side === 'p');
const enemyUnits = (g) => units(g).filter((u) => u.side === 'e');
const sideUnits = (g, side) => units(g).filter((u) => u.side === side);
const allies = (g, u) => sideUnits(g, u.side);
const foes = (g, u) => sideUnits(g, u.side === 'p' ? 'e' : 'p');
const unitAt = (g, side, lane, col) => units(g).find((u) => u.side === side && u.lane === lane && u.col === col) || null;
const slotFree = (g, side, lane, col) => !unitAt(g, side, lane, col);
/* A named wave is held by anyone standing anywhere in the lane, not only at the
   front — see the note in deployWave for why the front-only version was wrong. */
const laneHeldBy = (g, lane) => units(g).find((u) => u.side === 'p' && u.lane === lane) || null;
const WAVE_TELL = { on: true };   // the probe's only way to compare like with like
const laneOf = (g, side, lane) => units(g).filter((u) => u.side === side && u.lane === lane).sort((a, b) => a.col - b.col);
const other = (side) => (side === 'p' ? 'e' : 'p');

/* ONE PASS OVER THE UNITS, NOT SIX. This asked `slotFree` for each of the six
   slots and each of those built a filtered copy of the unit list and searched
   it — six list copies and six scans to answer a question one scan answers. It
   was 2.6% of the balance probe on its own. Same order out, so a caller taking
   `[0]` gets the same slot it always did. */
function freeSlots(g, side) {
  const out = [];
  const taken = [0, 0, 0, 0, 0, 0];
  const all = g.battle ? g.battle.units : [];
  for (let i = 0; i < all.length; i++) {
    const u = all[i];
    if (u.alive && u.side === side && u.lane >= 0 && u.lane < LANES && u.col >= 0 && u.col < COLS) {
      taken[u.lane * COLS + u.col] = 1;
    }
  }
  for (let l = 0; l < LANES; l++) for (let c = 0; c < COLS; c++) if (!taken[l * COLS + c]) out.push({ lane: l, col: c });
  return out;
}

/* Everything a swing has to know about who is standing where.

   A unit looks down its OWN lane first. If that lane is empty it reaches
   across to the other one rather than idling — which is what stops two lines
   that can no longer see each other from standing there until the sun comes
   back. Lane position still decides who gets hit first, and that is where the
   tactics live. */
function enemyLine(g, u, laneOverride) {
  const s = other(u.side);
  const home = laneOverride !== undefined ? laneOverride : u.lane;
  const order = [home];
  for (let i = 0; i < LANES; i++) if (i !== home) order.push(i);
  for (const l of order) {
    const line = laneOf(g, s, l);

  }

}

  const line = enemyLine(g, u);
  return line[0] || null;
}
function targetFor(g, u, laneOverride) {
  const line = enemyLine(g, u, laneOverride);
  if (!line.length) return null;
  /* SOAK IS A TAUNT, AND A TAUNT BEATS EVERYTHING.

     It used to come second to Aimless, and that ordering was the reason
     Mitewing has sat in the top two of the late-zone death table for five
     rounds. Mitewing is a tier-1 trash mob — four health, two attack — and it
     accounts for NINE PER CENT of all the damage the fell swings, level with
     the Frostwyrm and the Glutton, because its counter is 1: it takes five
     turns for their one, and ten in the front row.

     None of that is the problem on its own. The problem is that Aimless picked
     a random body, so every answer the game spends its first hint teaching —
     the front of a lane takes the hits, put a wall up, move somebody out of the
     way — was inert against the foe doing the most damage in the game. The only
     answer was to kill it, and its mother whistles for more.

     So the fix is not to its numbers. Six wardens in the pool carry Soak and
     none of them could do anything about it; now they can. The tax becomes a
     fight, and a keyword that was "beats Longshot" becomes the answer to the
     fastest thing on the table. */
  const soaker = line.find((x) => x.kw.soak);
  if (soaker) return soaker;
  if (u.kw.aimless) return pick(line);
  if (u.kw.longshot) return line[line.length - 1];
  return line[0];
}
function laneTargets(g, u, lane) { return laneOf(g, other(u.side), lane); }
function neighbours(g, u) {
  const out = [];
  for (const v of units(g)) {
    if (v === u || v.side !== u.side) continue;
    if (Math.abs(v.lane - u.lane) + Math.abs(v.col - u.col) === 1) out.push(v);
  }
  return out;
}

/* The resolution order, which the player can see before committing: every foe
   ticks before every warden, and inside a side the front of the table goes
   first, top lane before bottom. */
function turnOrder(g) {
  return units(g).slice().sort((a, b) => {
    if (a.side !== b.side) return a.side === 'e' ? -1 : 1;
    if (a.col !== b.col) return a.col - b.col;
    return a.lane - b.lane;
  });
}

/* ==================================== 6. the battle engine =============== */

/* Beats are how the game breathes. Every state change that a player should be
   able to *see* is queued as a beat; the loop drains one at a time so a round
   plays out as a readable sequence instead of a single frame of arithmetic.
   Headless runs drain instantly, so the suites see the same state a player
   would see once the dust settles. */
const Q = { items: [], wait: 0, draining: false };
function beat(delay, fn) {
  Q.items.push({ d: delay, fn });
  if (HEADLESS) drainAll();
}
function drainAll() {
  if (Q.draining) return;
  Q.draining = true;
  let guard = 0;
  while (Q.items.length && guard++ < 20000) {
    const it = Q.items.shift();
    if (it.fn) it.fn();
  }
  Q.draining = false;
}
function clearBeats() { Q.items.length = 0; Q.wait = 0; }
const beatsBusy = () => Q.items.length > 0 || Q.wait > 0;

/* ------------------------------------------------------------- statuses -- */
function addStatus(g, u, key, n, quiet) {
  if (!u || !u.alive || !n) return;
  u.st[key] = (u.st[key] || 0) + n;
  if (u.st[key] <= 0) delete u.st[key];
  // `quiet` is for what happens to everybody every turn. A floater over each of
  // six units, every turn of the fight, buries the board under its own caption
  // — the pip on the slab and the label over the table already say it.
  if (!quiet) fx.pop(u, cap(STATUS[key] ? STATUS[key].name : key) + ' ' + n, STATUS[key] ? STATUS[key].col : C.snow);
  if (key === 'frost') {
    // Glacierling and friends listen for a foe going cold.
    for (const a of sideUnits(g, u.side === 'p' ? 'e' : 'p')) if (a.hooks.frosted) a.hooks.frosted(g, a, u);
    // and some things answer for their own chill
    if (u.hooks.chilled) u.hooks.chilled(g, u);
  }
}
/* Whether a side still has somewhere to fall back to.

   ONE GAP IS NOT ROOM, AND THIS IS THE ROUND THAT LEARNED IT.

   The room rule is the rule the whole board is built around — a side with a
   slot to spare warms its line, a packed side takes the cold — and "keeping a
   slot in reserve" priced at exactly +0 for the pilot at 750 runs an arm, band
   ±1.5. A measured zero, not a noisy one. The reason was not that the rule is
   weak. It was that the question is almost never asked: across fifty thousand
   deployments the line stood on a FULLY packed board for three per cent of
   turns. Warmth was on for the other ninety-seven. A rule with a penalty side
   that fires three times in a hundred is not a decision, it is a passive heal
   with a footnote.

   So the bar moves from one gap to two, and the middle becomes its own state:

     two or more free   the line can rotate, and warmth gets round all of it
     exactly one free   cramped — no warmth, but no cold either
     none free          nowhere to fall back to, and the cold finds somebody

   Free slots run 3% / 17% / 17% / 22% / 24% / 18% for none through five, so
   this takes the live question from three per cent of turns to twenty, and it
   does it without making the game harsher: the state that was silently free is
   now merely neutral. Putting a body down costs something on a board of four,
   which is where most fights actually happen. */
/* THE DOSE OF A LESSON, WHICH IS NOW A MEASURED NUMBER.

   Being told about a scheme was measured at eleven of the twelve points that
   knowing is worth — which made the lesson the most valuable thing in the game
   that had never been tuned. It fired twice, in the first zone, because those
   were the first numbers anybody wrote. Both are swept in the probe now, and
   the answer was that the dose does not matter at all: once, twice, four times
   and every-zone all measured the same +11. So it is once. A player who has
   been told is told; saying it again is noise. */
const LESSON = { times: 1, zone: 0 };
const ROOM_NEEDED = 2;
/* How many fights a rest lasts. Mutable rather than a `const` so the probe can
   sweep it the way a course's magnitude is swept — the dial is the point, and a
   number nobody can turn reads exactly like no dial. */
const REST = { fights: 1 };
function hasRoom(g, side) {
  if (freeSlots(g, side).length >= ROOM_NEEDED) return true;
  const co = side === 'p' ? courseOf(g.run) : null;
  return !!(co && co.crowdproof);
}
/* And the cold only gets in when there is nowhere at all to go. */
function isPacked(g, side) {
  if (freeSlots(g, side).length > 0) return false;

  return !(co && co.crowdproof);
}
const stat = (u, key) => u.st[key] || 0;
function spend(u, key, n) {

/* ---------------------------------------------------------------- damage -- */
function hurt(g, u, amount, src) {

    const soaked = Math.min(sh, dmg);
    spend(u, 'shell', soaked);
    dmg -= soaked;
    fx.pop(u, '-' + soaked, STATUS.shell.col);
    fx.burst(u, STATUS.shell.col, 8);
  }
  if (dmg > 0) {
    u.hp -= dmg;
    u.flash = 1; u.hitT = 1; u.sq = 1;
    // knocked back along the line the hit came from
    if (src) {
      u.lastHitBy = { name: src.name, art: src.art, def: src.def, boss: !!src.boss };
      const dx = (u.px || 0) - (src.px || 0), dy = (u.py || 0) - (src.py || 0);
      const L = Math.hypot(dx, dy) || 1;
      u.recX = dx / L; u.recY = dy / L;
    } else { u.recX = 0; u.recY = -1; }
    u.recoil = 1;
    fx.pop(u, '-' + dmg, C.blood);
    fx.burst(u, C.blood, 10);
    fx.shake(Math.min(9, 2 + dmg * 0.5));
    if (dmg >= 6) G.hitStop = Math.min(0.12, 0.03 + dmg * 0.008);
    sfx('hit', { mat: (u.art && u.art.skin) || 'smooth', heavy: dmg >= 6 });
  }
  const th = stat(u, 'thorns');
  if (th > 0 && src && src.alive && src !== u) hurt(g, src, th, null);

  if (u.alive && u.boss && !u.phased && u.hp > 0 && u.hp <= u.maxHp / 2) {
    const d2 = FOES[u.def];
    if (d2 && d2.phase) {
      u.phased = true;
      d2.phase.apply(g, u);
      fx.toast(d2.phase.name, '#ff9a3c');
      fx.flash('#ffb0b0', 0.34);
      fx.shake(14);
      fx.burst(u, '#ff9a3c', 26, 'shard');
      fx.ring(u.px, u.py, '#ffd166', 30);
      u.sq = 1.5;
      G.hitStop = 0.16;
      logLine(g, d2.phase.name.toLowerCase() + ' — ' + d2.phase.text, '#ff9a3c');
      sfx('wave');
      if (g.battle) g.battle.banner = { text: d2.phase.name, sub: d2.phase.text, t: 0, col: '#ff9a3c' };
