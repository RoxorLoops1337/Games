function hurtSomebody(g) {
  const pool = g.run.deck.filter((c) => c.type === 'unit' && !c.injured);
  const c = pick(pool.length ? pool : g.run.deck);
  if (c) { c.injured = true; g.run.log.push(c.name + ' was hurt prising it loose.'); }
}
function offerCharms(g, n) {
  const three = sample(charmPool(), n);
  openChooser('WHICH CHARM?', three.map((cid) => ({ charm: cid })), (i) => {
    pickTargetForCharm(g, three[i], () => advance(g));
  }, { cancel: 'NEVER MIND' });
}
function offerSigil(g) {
  const all = g.run.deck.filter((c) => c.type === 'unit' && !c.sigil);
  if (!all.length) { advance(g); return; }
  openChooser('MARK WHICH WARDEN WITH A SIGIL?', all.map((cd) => ({ card: cd })), (i) => {
    all[i].sigil = true;
    UI.choose = null;
    sfx('get');
    advance(g);
  }, { cancel: 'NEVER MIND' });
}

/* --------------------------------------------------------------- saving -- */
const SAVE_RUN = 'ff_run_v1';
const SAVE_META = 'ff_meta_v1';
const store = {
  get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} },
  del(k) { try { localStorage.removeItem(k); } catch (e) {} },
};
function serCard(c) { return { u: c.uid, d: c.def, c: c.charms.slice(), g: c.dmg || 0, i: !!c.injured, s: !!c.sigil }; }
function desCard(o) {
  const c = mkCard(o.d);
  c.uid = o.u; c.charms = (o.c || []).slice(); c.dmg = o.g || 0;
  c.injured = !!o.i; c.sigil = !!o.s;
  rebuildCard(c);
  UID = Math.max(UID, c.uid + 1);
  return c;
}
function saveRun(run) {
  if (!run) { store.del(SAVE_RUN); return; }
  store.set(SAVE_RUN, JSON.stringify({
    v: 1, seed: run.seed, tribe: run.tribe, zone: run.zone, step: run.step, gold: run.gold,
    br: run.bonusRedraw, leader: serCard(run.leader), deck: run.deck.map(serCard),
    trail: run.trail, path: run.path, log: run.log.slice(-8),
    bells: run.bells || [], bh: run.bonusHand || 0, bc: !!run.bellCharged, wb: run.waveBonus || 0,
    purse: run.purse || 1, mend: run.mend || 0, bosses: run.bosses || {},
    winters: run.winters || [], wpts: run.winterPts || 0, prices: run.prices || 1,
    campMul: run.campMul || 1, extraFoe: run.extraFoe || 0, bellSlow: run.bellSlow || 0,
    foeMul: run.foeMul || 1, fell: run.fellThisZone || 0,
  }));
}
function loadRun(g) {
  const raw = store.get(SAVE_RUN);
  if (!raw) return null;
  try {
    const o = JSON.parse(raw);
    if (!o || o.v !== 1) return null;
    const run = {
      seed: o.seed, tribe: o.tribe, zone: o.zone, step: o.step, gold: o.gold, bonusRedraw: o.br || 0,
      leader: desCard(o.leader), deck: (o.deck || []).map(desCard), trail: o.trail, path: o.path || [],
      log: o.log || [], kills: 0, node: null,
      bells: o.bells || [], bonusHand: o.bh || 0, bellCharged: !!o.bc, waveBonus: o.wb || 0,
      purse: o.purse || 1, mend: o.mend || 0, bosses: o.bosses || {},
      winters: o.winters || [], winterPts: o.wpts || 0, prices: o.prices || 1,
      campMul: o.campMul || 1, extraFoe: o.extraFoe || 0, bellSlow: o.bellSlow || 0,
      foeMul: o.foeMul || 1, fellThisZone: o.fell || 0,
    };
    RNG = mulberry((run.seed + run.step * 7919 + run.zone * 104729) >>> 0);
    g.run = run;
    g.battle = null;
    g.screen = 'trail';
    return run;
  } catch (e) { return null; }
}
/* ==================================================== 8. juice =========== */

/* Everything in here is presentation. The rules never read it, and headless
   runs let it accumulate harmlessly into arrays nobody draws. */
const parts = [];
const floats = [];
const rings = [];
const shakeState = { mag: 0, t: 0 };
const flashState = { a: 0, col: '#ffffff' };
let snowflakes = null;

const fx = {
  pop(u, text, col) {
    if (!u) return;
    floats.push({ x: u.px || 0, y: (u.py || 0) - 30, vy: -46, life: 1.0, t: 0, text: String(text), col: col || C.snow, sz: 22 });
    if (floats.length > 60) floats.shift();
  },
  toast(text, col) {
    floats.push({ x: 640, y: 250, vy: -18, life: 1.6, t: 0, text: String(text), col: col || C.gold, sz: 34 });
  },
  burst(u, col, n) {
    if (!u) return;
    for (let i = 0; i < (n || 10); i++) {
      const a = rnd() * TAU, s = 40 + rnd() * 190;
      parts.push({ x: u.px || 0, y: u.py || 0, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 40,
        life: 0.4 + rnd() * 0.5, t: 0, col, r: 2 + rnd() * 4, g: 420 });
    }
    if (parts.length > 400) parts.splice(0, parts.length - 400);
  },
  ring(x, y, col, r) { rings.push({ x, y, r0: r || 18, col, life: 0.42, t: 0 }); },
  shake(m) { shakeState.mag = Math.min(18, shakeState.mag + m); },
  flash(col, a) { flashState.col = col || '#ffffff'; flashState.a = Math.max(flashState.a, a === undefined ? 0.35 : a); },
  bell() { fx.flash('#bfe8ff', 0.16); fx.shake(3); },
  thump(u) { if (u) { u.sq = 1.2; fx.ring(u.px || 0, u.py || 0, '#ffffff', 26); } },
  lunge(u, t) {
    if (!u || !t) return;
    u.lungeT = 1;
    u.lungeX = (t.px || 0) - (u.px || 0);
    u.lungeY = (t.py || 0) - (u.py || 0);
    const L = Math.hypot(u.lungeX, u.lungeY) || 1;
    u.lungeX /= L; u.lungeY /= L;
    fx.ring((u.px + t.px) / 2, (u.py + t.py) / 2, '#ffffff', 14);
  },
};

function stepFx(dt) {
  for (let i = parts.length - 1; i >= 0; i--) {
    const p = parts[i];
    p.t += dt;
    if (p.t >= p.life) { parts.splice(i, 1); continue; }
    p.x += p.vx * dt; p.y += p.vy * dt; p.vy += p.g * dt; p.vx *= 0.985;
  }
  for (let i = floats.length - 1; i >= 0; i--) {
    const f = floats[i];
    f.t += dt;
    if (f.t >= f.life) { floats.splice(i, 1); continue; }
    f.y += f.vy * dt; f.vy *= 0.94;
  }
  for (let i = rings.length - 1; i >= 0; i--) {
    const r = rings[i];
    r.t += dt;
    if (r.t >= r.life) rings.splice(i, 1);
  }
  shakeState.mag *= Math.pow(0.0016, dt);
  if (shakeState.mag < 0.05) shakeState.mag = 0;
  shakeState.t += dt * 46;
  flashState.a *= Math.pow(0.008, dt);
}

/* ================================================ 9. rendering =========== */

/* The stage is 720 tall, always. Its WIDTH follows the device: a 16:9 phone
   gets 1280, a 20:9 phone gets the extra width instead of two black bars, and
   anything wider than 1760 is letterboxed rather than stretched. Everything
   that touches an edge is placed against SAFE so a notch never eats it. */
const VH = 720;
let VW = 1280;
let MID = 640;
const VW_MIN = 1180, VW_MAX = 1760;
const SAFE = 34;
const SLOT_W = 118, SLOT_H = 140, SLOT_GAP = 12;
const LANE_Y = [212, 364];
const HAND_Y = 620, CARD_W = 126, CARD_H = 168;

function slotPos(side, lane, col) {
  const step = SLOT_W + SLOT_GAP;
  const x = side === 'p' ? MID - 52 - (col + 0.5) * step : MID + 52 + (col + 0.5) * step;
  return { x, y: LANE_Y[lane] };
}

let ctx = null, canvas = null, DPR = 1;

/* ------------------------------------------------------------ primitives -- */
function rr(c, x, y, w, h, r) {
  const k = Math.min(r, w / 2, h / 2);
  c.beginPath();
  c.moveTo(x + k, y);
  c.arcTo(x + w, y, x + w, y + h, k);
  c.arcTo(x + w, y + h, x, y + h, k);
  c.arcTo(x, y + h, x, y, k);
  c.arcTo(x, y, x + w, y, k);
  c.closePath();
}
function inked(c, fill, lw, stroke) {
  if (fill) { c.fillStyle = fill; c.fill(); }
  if (lw) { c.lineWidth = lw; c.strokeStyle = stroke || C.ink; c.lineJoin = 'round'; c.stroke(); }
}
function panel(c, x, y, w, h, r, fill, edge) {
  c.save();
  c.shadowColor = 'rgba(0,0,0,.5)'; c.shadowBlur = 18; c.shadowOffsetY = 8;
  rr(c, x, y, w, h, r);
  c.fillStyle = fill || C.card; c.fill();
  c.restore();
  rr(c, x, y, w, h, r);
  c.lineWidth = 3; c.strokeStyle = edge || C.ink; c.stroke();
}
/* An ellipse with a soft, slightly irregular edge — the shape language the
   whole cast is built from. */
function blob(c, x, y, w, h, wob, ph) {
  const n = 22;
  c.beginPath();
  for (let i = 0; i <= n; i++) {
    const a = (i / n) * TAU;
    const k = 1 + (wob || 0) * Math.sin(a * 3 + (ph || 0)) * 0.5;
    const px = x + Math.cos(a) * w * 0.5 * k;
    const py = y + Math.sin(a) * h * 0.5 * (1 + (wob || 0) * Math.cos(a * 2 + (ph || 0)) * 0.3);
    if (i === 0) c.moveTo(px, py); else c.lineTo(px, py);
  }
  c.closePath();
}
function txt(c, s, x, y, size, col, align, face, outline) {
  c.font = (face === 'd' ? '' : '600 ') + size + 'px ' + (face === 'd' ? "'Frostcut','Trebuchet MS',sans-serif" : "'Frostwork','Trebuchet MS',sans-serif");
  c.textAlign = align || 'center';
  c.textBaseline = 'middle';
  if (outline !== 0) {
    c.lineWidth = Math.max(3, size * 0.22);
    c.strokeStyle = outline || 'rgba(12,20,36,.85)';
    c.lineJoin = 'round';
    c.strokeText(s, x, y);
  }
  c.fillStyle = col || C.snow;
  c.fillText(s, x, y);
}
function wrapText(c, s, size, maxW) {
  c.font = '600 ' + size + "px 'Frostwork','Trebuchet MS',sans-serif";
  const words = String(s).split(' ');
  const lines = [];
  let line = '';
  for (const w of words) {
    const test = line ? line + ' ' + w : w;
    if (c.measureText(test).width > maxW && line) { lines.push(line); line = w; }
    else line = test;
  }
  if (line) lines.push(line);
  return lines;
}

/* -------------------------------------------------------- the cast ------- */

/* One function draws every creature in the game. A recipe picks the
   silhouette and the trimmings; the seed and the clock do the rest, so two
   Rimefoxes on the board are never breathing in step. */
function drawCreature(c, art, x, y, s, o) {
  o = o || {};
  const t = o.t || 0;
  const breathe = Math.sin(t * 1.7 + (o.ph || 0)) * 0.02;
  const sq = o.sq || 0;
  const sx = (1 + breathe + sq * 0.22) * (o.flip ? -1 : 1);
  const sy = 1 - breathe - sq * 0.26;
  const shape = art.shape || 'blob';
  const dim = {
    blob:  [1.02, 0.86], round: [0.94, 0.94], tall: [0.80, 1.06], squat: [1.14, 0.74],
    small: [0.72, 0.68], wisp:  [0.78, 1.00], boss:  [1.24, 1.10],
  }[shape] || [1, 0.9];
  const bw = s * dim[0], bh = s * dim[1];
  const lw = Math.max(2.5, s * 0.055);

  c.save();
  c.translate(x, y);
  c.scale(sx, sy);
  c.lineJoin = 'round'; c.lineCap = 'round';

  // ground shadow
  c.save();
  c.globalAlpha = 0.28;
  c.fillStyle = '#000';
  c.beginPath(); c.ellipse(0, bh * 0.52, bw * 0.42, bh * 0.09, 0, 0, TAU); c.fill();
  c.restore();

  const cy = -bh * 0.06;

  /* ---- behind-body furniture: wings, ears, horns, props ---- */
  if (art.wings) {
    for (const d of [-1, 1]) {
      c.save();
      c.translate(d * bw * 0.36, cy - bh * 0.06);
      c.rotate(d * (0.5 + Math.sin(t * 6 + (o.ph || 0)) * 0.22));
      blob(c, 0, 0, bw * 0.62, bh * 0.44, 0.06, 1.2);
      inked(c, art.wings, lw, C.ink);
      c.restore();
    }
  }
  const ears = art.ears || 'round';
  const earTop = cy - bh * 0.34;
  if (ears === 'pointy' || ears === 'shard') {
    for (const d of [-1, 1]) {
      c.beginPath();
      c.moveTo(d * bw * 0.30, earTop + bh * 0.10);
      c.lineTo(d * bw * (ears === 'shard' ? 0.30 : 0.40), earTop - bh * (ears === 'shard' ? 0.42 : 0.30));
      c.lineTo(d * bw * 0.06, earTop - bh * 0.02);
      c.closePath();
      inked(c, art.patCol && art.pat === 'tips' ? art.patCol : art.body, lw, C.ink);
    }
  } else if (ears === 'round') {
    for (const d of [-1, 1]) {
      c.beginPath(); c.ellipse(d * bw * 0.31, earTop - bh * 0.02, bw * 0.16, bh * 0.17, 0, 0, TAU);
      inked(c, art.body, lw, C.ink);
    }
  } else if (ears === 'horns') {
    for (const d of [-1, 1]) {
      c.beginPath();
      c.moveTo(d * bw * 0.24, earTop + bh * 0.06);
      c.quadraticCurveTo(d * bw * 0.52, earTop - bh * 0.14, d * bw * 0.40, earTop - bh * 0.40);
      c.quadraticCurveTo(d * bw * 0.30, earTop - bh * 0.14, d * bw * 0.10, earTop + bh * 0.04);
      c.closePath();
      inked(c, '#e7dfd0', lw, C.ink);
    }
  } else if (ears === 'antler') {
    for (const d of [-1, 1]) {
      c.strokeStyle = '#cdbfa4'; c.lineWidth = lw * 1.3;
      c.beginPath();
      c.moveTo(d * bw * 0.18, earTop + bh * 0.04);
      c.lineTo(d * bw * 0.30, earTop - bh * 0.34);
      c.moveTo(d * bw * 0.26, earTop - bh * 0.14);
      c.lineTo(d * bw * 0.46, earTop - bh * 0.24);
      c.stroke();
    }
  } else if (ears === 'antenna') {
    for (const d of [-1, 1]) {
      c.strokeStyle = C.ink; c.lineWidth = lw * 0.8;
      c.beginPath();
      c.moveTo(d * bw * 0.10, earTop + bh * 0.06);
      c.quadraticCurveTo(d * bw * 0.30, earTop - bh * 0.30, d * bw * 0.36, earTop - bh * 0.40);
      c.stroke();
      c.beginPath(); c.arc(d * bw * 0.36, earTop - bh * 0.42, s * 0.05, 0, TAU);
      inked(c, art.belly, lw * 0.8, C.ink);
    }
  } else if (ears === 'fin') {
    c.beginPath();
    c.moveTo(-bw * 0.06, earTop - bh * 0.02);
    c.quadraticCurveTo(0, earTop - bh * 0.44, bw * 0.16, earTop - bh * 0.04);
    c.closePath();
    inked(c, art.belly, lw, C.ink);
  }

  /* ---- body ---- */
  if (shape === 'wisp') {
    c.beginPath();
    c.moveTo(-bw * 0.42, cy + bh * 0.10);
    c.quadraticCurveTo(-bw * 0.5, cy - bh * 0.55, 0, cy - bh * 0.52);
    c.quadraticCurveTo(bw * 0.5, cy - bh * 0.55, bw * 0.42, cy + bh * 0.10);
    for (let i = 0; i <= 4; i++) {
      const px = bw * 0.42 - (i / 4) * bw * 0.84;
      const py = cy + bh * 0.10 + Math.sin(t * 3 + i * 1.6) * bh * 0.06 + (i % 2 ? bh * 0.14 : 0);
      c.lineTo(px, py);
    }
    c.closePath();
  } else {
    blob(c, 0, cy, bw, bh, 0.03, t * 0.6 + (o.ph || 0));
  }
  inked(c, art.body, lw, C.ink);

  // belly / face plate
  c.save();
  c.beginPath(); c.ellipse(0, cy + bh * 0.10, bw * 0.34, bh * 0.32, 0, 0, TAU);
  c.fillStyle = art.belly; c.globalAlpha = 0.95; c.fill();
  c.restore();

  /* ---- markings ---- */
  if (art.pat === 'spots') {
    c.fillStyle = art.patCol || '#00000022';
    for (let i = 0; i < 3; i++) {
      c.beginPath();
      c.ellipse(-bw * 0.30 + i * bw * 0.13, cy - bh * 0.20 + (i % 2) * bh * 0.10, s * 0.045, s * 0.038, 0, 0, TAU);
      c.fill();
    }
  } else if (art.pat === 'stripes') {
    c.strokeStyle = art.patCol || '#00000033'; c.lineWidth = lw * 0.9; c.lineCap = 'round';
    for (let i = 0; i < 3; i++) {
      c.beginPath();
      c.arc(0, cy, bw * (0.30 + i * 0.06), -1.9, -1.2);
      c.stroke();
    }
  } else if (art.pat === 'shards') {
    c.fillStyle = art.patCol || '#ffffff55';
    for (let i = 0; i < 3; i++) {
      const px = -bw * 0.26 + i * bw * 0.26, py = cy - bh * 0.34;
      c.beginPath(); c.moveTo(px, py); c.lineTo(px + s * 0.05, py - s * 0.16); c.lineTo(px + s * 0.10, py);
      c.closePath(); c.fill();
    }
  }

  /* ---- face ---- */
  const eyeY = cy - bh * 0.08;
  const eyeDx = bw * 0.15;
  const blinkPhase = ((t * 0.6 + (o.blink || 0)) % 4.4);
  const blink = blinkPhase < 0.12 ? 1 - Math.abs(blinkPhase - 0.06) / 0.06 : 0;
  const eyeStyle = art.eyes || 'dot';
  const er = s * (eyeStyle === 'big' ? 0.13 : eyeStyle === 'slit' ? 0.10 : 0.085);
  for (const d of [-1, 1]) {
    const ex = d * eyeDx;
    if (eyeStyle === 'slit') {
      c.save();
      c.strokeStyle = art.evil ? '#ff8a8a' : C.ink;
      c.lineWidth = lw * 1.1;
      c.beginPath();
      c.moveTo(ex - er * 0.8, eyeY - er * 0.4); c.lineTo(ex + er * 0.8, eyeY + er * 0.2);
      c.stroke();
      c.restore();
      continue;
    }
    c.beginPath(); c.ellipse(ex, eyeY, er, er * (1 - blink * 0.92), 0, 0, TAU);
    inked(c, '#ffffff', lw * 0.8, C.ink);
    if (blink < 0.6) {
      c.beginPath();
      c.ellipse(ex + d * er * 0.16, eyeY + er * 0.1, er * 0.46, er * 0.5 * (1 - blink), 0, 0, TAU);
      c.fillStyle = art.evil ? '#7a1030' : C.ink; c.fill();
      c.beginPath();
      c.arc(ex + d * er * 0.32, eyeY - er * 0.28, er * 0.18, 0, TAU);
      c.fillStyle = '#ffffff'; c.fill();
    }
  }

  const my = cy + bh * 0.14;
  const mouth = art.mouth || 'smile';
  c.strokeStyle = C.ink; c.lineWidth = lw * 0.9; c.lineCap = 'round';
  if (mouth === 'smile') {
    c.beginPath(); c.arc(0, my - s * 0.03, s * 0.09, 0.3, Math.PI - 0.3); c.stroke();
  } else if (mouth === 'grin') {
    c.beginPath(); c.arc(0, my - s * 0.05, s * 0.11, 0.15, Math.PI - 0.15);
    c.fillStyle = '#4a1c2a'; c.fill(); c.stroke();
  } else if (mouth === 'flat') {
    c.beginPath(); c.moveTo(-s * 0.07, my); c.lineTo(s * 0.07, my); c.stroke();
  } else if (mouth === 'fang') {
    c.beginPath(); c.arc(0, my - s * 0.04, s * 0.10, 0.2, Math.PI - 0.2);
    c.fillStyle = '#4a1c2a'; c.fill(); c.stroke();
    c.fillStyle = '#ffffff';
    for (const d of [-1, 1]) {
      c.beginPath();
      c.moveTo(d * s * 0.06, my - s * 0.01); c.lineTo(d * s * 0.02, my + s * 0.06); c.lineTo(d * s * 0.005, my - s * 0.01);
      c.closePath(); c.fill();
    }
  } else if (mouth === 'wide' || mouth === 'trap') {
    c.beginPath(); c.ellipse(0, my + s * 0.01, s * 0.15, s * 0.10, 0, 0, TAU);
    inked(c, '#3a1020', lw * 0.9, C.ink);
    if (mouth === 'trap') {
      c.fillStyle = '#fff';
      for (let i = -2; i <= 2; i++) {
        c.beginPath();
        c.moveTo(i * s * 0.055 - s * 0.02, my - s * 0.09);
        c.lineTo(i * s * 0.055 + s * 0.02, my - s * 0.09);
        c.lineTo(i * s * 0.055, my - s * 0.02);
        c.closePath(); c.fill();
      }
    }
  } else if (mouth === 'beak') {
    c.beginPath();
    c.moveTo(-s * 0.09, my - s * 0.02); c.lineTo(s * 0.09, my - s * 0.02); c.lineTo(0, my + s * 0.11);
    c.closePath();
    inked(c, '#f0b45c', lw * 0.8, C.ink);
  } else if (mouth === 'bolt') {
    c.beginPath();
    c.moveTo(-s * 0.10, my); c.lineTo(-s * 0.02, my); c.lineTo(-s * 0.05, my + s * 0.07);
    c.lineTo(s * 0.10, my - s * 0.03);
    c.stroke();
  } else if (mouth === 'beard') {
    c.beginPath();
    c.moveTo(-bw * 0.20, my - s * 0.04);
    c.quadraticCurveTo(0, my + bh * 0.30, bw * 0.20, my - s * 0.04);
    c.closePath();
    inked(c, '#eef5ff', lw * 0.9, C.ink);
  }

  /* ---- props ---- */
  const acc = art.acc || 'none';
  if (acc === 'scarf') {
    c.beginPath();
    rr(c, -bw * 0.32, cy + bh * 0.02, bw * 0.64, bh * 0.13, bh * 0.06);
    inked(c, art.accCol || '#ff5566', lw * 0.9, C.ink);
    c.beginPath();
    rr(c, bw * 0.16, cy + bh * 0.08, bw * 0.14, bh * 0.30, bh * 0.05);
    inked(c, art.accCol || '#ff5566', lw * 0.9, C.ink);
  } else if (acc === 'helm') {
    c.beginPath(); c.arc(0, cy - bh * 0.22, bw * 0.36, Math.PI, TAU);
    c.closePath();
    inked(c, art.accCol || '#8fa2bd', lw, C.ink);
    c.beginPath(); rr(c, -bw * 0.38, cy - bh * 0.24, bw * 0.76, bh * 0.08, 4);
    inked(c, art.accCol || '#8fa2bd', lw * 0.8, C.ink);
  } else if (acc === 'crown') {
    c.beginPath();
    c.moveTo(-bw * 0.26, cy - bh * 0.30);
    c.lineTo(-bw * 0.26, cy - bh * 0.50); c.lineTo(-bw * 0.10, cy - bh * 0.38);
    c.lineTo(0, cy - bh * 0.56); c.lineTo(bw * 0.10, cy - bh * 0.38);
    c.lineTo(bw * 0.26, cy - bh * 0.50); c.lineTo(bw * 0.26, cy - bh * 0.30);
    c.closePath();
    inked(c, art.accCol || C.gold, lw, C.ink);
  } else if (acc === 'lantern') {
    const lx = bw * 0.44, ly = cy + bh * 0.10 + Math.sin(t * 2.2) * bh * 0.03;
    c.strokeStyle = C.ink; c.lineWidth = lw * 0.7;
    c.beginPath(); c.moveTo(bw * 0.24, cy - bh * 0.06); c.lineTo(lx, ly - s * 0.10); c.stroke();
    c.save();
    c.globalAlpha = 0.5; c.fillStyle = art.accCol || C.gold;
    c.beginPath(); c.arc(lx, ly, s * 0.20, 0, TAU); c.fill();
    c.restore();
    c.beginPath(); rr(c, lx - s * 0.07, ly - s * 0.09, s * 0.14, s * 0.18, s * 0.03);
    inked(c, art.accCol || C.gold, lw * 0.8, C.ink);
  } else if (acc === 'kettle') {
    c.beginPath(); rr(c, -bw * 0.20, cy - bh * 0.52, bw * 0.40, bh * 0.22, bh * 0.05);
    inked(c, art.accCol || '#9aa7bd', lw * 0.9, C.ink);
    c.beginPath(); c.moveTo(bw * 0.18, cy - bh * 0.46); c.lineTo(bw * 0.34, cy - bh * 0.52);
    c.strokeStyle = C.ink; c.lineWidth = lw * 0.9; c.stroke();
    // steam
    c.save(); c.globalAlpha = 0.5; c.strokeStyle = '#ffffff'; c.lineWidth = lw * 0.7;
    for (let i = 0; i < 2; i++) {
      c.beginPath();
      const ph = t * 1.6 + i;
      c.moveTo(-bw * 0.04 + i * bw * 0.10, cy - bh * 0.54);
      c.quadraticCurveTo(-bw * 0.04 + i * bw * 0.10 + Math.sin(ph) * s * 0.06, cy - bh * 0.66,
                         -bw * 0.04 + i * bw * 0.10, cy - bh * 0.78);
      c.stroke();
    }
    c.restore();
  } else if (acc === 'gear') {
    const gx = -bw * 0.40, gy = cy - bh * 0.10;
    c.save(); c.translate(gx, gy); c.rotate(t * 0.9);
    c.fillStyle = art.accCol || '#8fa2bd';
    for (let i = 0; i < 6; i++) {
      c.save(); c.rotate((i / 6) * TAU);
      c.beginPath(); rr(c, -s * 0.035, -s * 0.20, s * 0.07, s * 0.10, 2); c.fill();
      c.restore();
    }
    c.beginPath(); c.arc(0, 0, s * 0.14, 0, TAU);
    inked(c, art.accCol || '#8fa2bd', lw * 0.8, C.ink);
    c.beginPath(); c.arc(0, 0, s * 0.05, 0, TAU); c.fillStyle = C.ink; c.fill();
    c.restore();
  } else if (acc === 'hammer' || acc === 'pike' || acc === 'staff') {
    const hx = bw * 0.40;
    c.strokeStyle = '#8a6a3f'; c.lineWidth = lw * 1.4; c.lineCap = 'round';
    c.beginPath(); c.moveTo(hx, cy + bh * 0.34); c.lineTo(hx - bw * 0.04, cy - bh * 0.44); c.stroke();
    if (acc === 'hammer') {
      c.beginPath(); rr(c, hx - bw * 0.20, cy - bh * 0.60, bw * 0.34, bh * 0.20, 4);
      inked(c, art.accCol || '#9aa7bd', lw * 0.9, C.ink);
    } else if (acc === 'pike') {
      c.beginPath();
      c.moveTo(hx - bw * 0.10, cy - bh * 0.44); c.lineTo(hx - bw * 0.04, cy - bh * 0.70);
      c.lineTo(hx + bw * 0.02, cy - bh * 0.44); c.closePath();
      inked(c, art.accCol || '#cfd8e8', lw * 0.8, C.ink);
    } else {
      c.beginPath(); c.arc(hx - bw * 0.04, cy - bh * 0.52, s * 0.11, 0, TAU);
      inked(c, art.accCol || '#6f8fd0', lw * 0.8, C.ink);
    }
  } else if (acc === 'cloak') {
    c.beginPath();
    c.moveTo(-bw * 0.42, cy - bh * 0.10);
    c.quadraticCurveTo(-bw * 0.56, cy + bh * 0.46, -bw * 0.10, cy + bh * 0.48);
    c.lineTo(-bw * 0.16, cy - bh * 0.16);
    c.closePath();
    inked(c, art.accCol || '#2b5f96', lw * 0.9, C.ink);
  }

  c.restore();
}

/* ------------------------------------------------------------- backdrop -- */
function initSnow() {
  snowflakes = [];
  for (let i = 0; i < 90; i++) {
    snowflakes.push({ x: rnd() * VW, y: rnd() * VH, r: 1 + rnd() * 2.6, s: 12 + rnd() * 34, d: rnd() * TAU });
  }
}
/* Silhouettes that say which country this is before a single word does. Three
   depths, each drifting at its own rate, all drawn from the same two or three
   shapes so a zone reads as one place. */
function drawSkyline(c, z, t) {
  const depths = [
    { y: 452, s: 0.55, a: 0.16, sp: 5 },
    { y: 478, s: 0.78, a: 0.24, sp: 11 },
    { y: 500, s: 1.0,  a: 0.34, sp: 19 },
  ];
  for (let d = 0; d < depths.length; d++) {
    const L = depths[d];
    const off = -((t * L.sp) % 260);
    c.save();
    c.globalAlpha = L.a;
    c.fillStyle = d === 2 ? '#0d1830' : d === 1 ? '#16233c' : '#1e3150';
    if (z.id === 'whitewood') {
      for (let i = -1; i < 10; i++) {
        const x = off + i * 260 + (d * 70);
        const h = (90 + ((i * 37) % 46)) * L.s;
        const w = 34 * L.s;
        c.beginPath();
        for (let k = 0; k < 3; k++) {
          const kh = h * (1 - k * 0.26), kw = w * (1 + k * 0.42);
          c.moveTo(x, L.y - kh);
          c.lineTo(x + kw, L.y - kh * 0.42 + k * 6);
          c.lineTo(x - kw, L.y - kh * 0.42 + k * 6);
        }
        c.closePath(); c.fill();
        c.fillRect(x - 4 * L.s, L.y - 12, 8 * L.s, 14);
      }
    } else if (z.id === 'shelf') {
      for (let i = -1; i < 8; i++) {
        const x = off + i * 300 + d * 90;
        const w = (150 + ((i * 53) % 90)) * L.s, h = (70 + ((i * 29) % 50)) * L.s;
        c.beginPath();
        c.moveTo(x, L.y);
        c.lineTo(x + w * 0.12, L.y - h);
        c.lineTo(x + w * 0.86, L.y - h * 0.82);
        c.lineTo(x + w, L.y);
        c.closePath(); c.fill();
        // the crack down the middle of a shelf that is about to stop being one
        c.save(); c.globalAlpha = L.a * 0.5; c.fillStyle = '#050a14';
        c.fillRect(x + w * 0.48, L.y - h * 0.8, 3 * L.s, h * 0.8);
        c.restore();
      }
    } else {
      for (let i = -1; i < 6; i++) {
        const x = off + i * 380 + d * 120;
        const w = (200 + ((i * 61) % 120)) * L.s, h = (180 + ((i * 43) % 90)) * L.s;
        c.beginPath();
        c.moveTo(x - w / 2, L.y);
        c.lineTo(x - w * 0.14, L.y - h);
        c.lineTo(x + w * 0.06, L.y - h * 0.78);
        c.lineTo(x + w * 0.3, L.y - h * 1.05);
        c.lineTo(x + w / 2, L.y);
        c.closePath(); c.fill();
      }
    }
    c.restore();
  }
}

function drawBackdrop(c, zone, t) {
  const z = ZONES[clamp(zone || 0, 0, ZONES.length - 1)];
  const g2 = c.createLinearGradient(0, 0, 0, VH);
  g2.addColorStop(0, z.sky[0]); g2.addColorStop(1, z.sky[1]);
  c.fillStyle = g2; c.fillRect(0, 0, VW, VH);

  // aurora
  c.save();
  c.globalAlpha = 0.20; c.globalCompositeOperation = 'lighter';
  for (let i = 0; i < 3; i++) {
    const gg = c.createLinearGradient(0, 60 + i * 40, VW, 200 + i * 40);
    gg.addColorStop(0, 'rgba(0,0,0,0)');
    gg.addColorStop(0.5, i % 2 ? z.tint : '#6fd8ff');
    gg.addColorStop(1, 'rgba(0,0,0,0)');
    c.fillStyle = gg;
    c.beginPath();
    c.moveTo(0, 120 + i * 46 + Math.sin(t * 0.3 + i) * 22);
    for (let x = 0; x <= VW; x += 64) c.lineTo(x, 120 + i * 46 + Math.sin(t * 0.3 + i + x * 0.004) * 26);
    c.lineTo(VW, 0); c.lineTo(0, 0); c.closePath(); c.fill();
  }
  c.restore();

  // far ridges
  for (let layer = 0; layer < 3; layer++) {
    const base = 300 + layer * 54;
    const amp = 70 - layer * 16;
    c.beginPath(); c.moveTo(0, VH);
    c.lineTo(0, base);
    for (let x = 0; x <= VW; x += 40) {
      const y = base - Math.abs(Math.sin(x * 0.0037 + layer * 2.1)) * amp - Math.sin(x * 0.011 + layer) * 12;
      c.lineTo(x, y);
    }
    c.lineTo(VW, VH); c.closePath();
    c.fillStyle = ['rgba(255,255,255,.06)', 'rgba(255,255,255,.10)', 'rgba(255,255,255,.15)'][layer];
    c.fill();
  }

  // the shape of this particular country, in three depths
  drawSkyline(c, z, t);

  // ground
  const gg = c.createLinearGradient(0, 470, 0, VH);
  gg.addColorStop(0, z.ground); gg.addColorStop(1, '#9fb6d6');
  c.fillStyle = gg;
  c.beginPath();
  c.moveTo(0, 520);
  for (let x = 0; x <= VW; x += 48) c.lineTo(x, 500 + Math.sin(x * 0.006) * 14);
  c.lineTo(VW, VH); c.lineTo(0, VH); c.closePath(); c.fill();

  if (snowflakes) {
    c.save(); c.fillStyle = 'rgba(255,255,255,.75)';
    for (const f of snowflakes) {
      f.y += f.s * 0.016; f.x += Math.sin(t * 0.7 + f.d) * 0.5;
      if (f.y > VH + 4) { f.y = -4; f.x = rnd() * VW; }
      c.globalAlpha = 0.25 + (f.r / 3.6) * 0.6;
      c.beginPath(); c.arc(f.x, f.y, f.r, 0, TAU); c.fill();
    }
    c.restore();
  }
  // vignette
  const v = c.createRadialGradient(VW / 2, VH / 2, 260, VW / 2, VH / 2, 760);
  v.addColorStop(0, 'rgba(0,0,0,0)'); v.addColorStop(1, 'rgba(0,0,0,.42)');
  c.fillStyle = v; c.fillRect(0, 0, VW, VH);
}

/* ------------------------------------------------------------ card faces -- */
const RARE_COL = { 1: '#8fa6c4', 2: '#6fd8ff', 3: '#ffd166' };

function statPip(c, x, y, r, col, val, icon) {
  c.beginPath(); c.arc(x, y, r, 0, TAU);
  inked(c, col, 3, C.ink);
  txt(c, String(val), x, y + 1, r * 1.5, '#12203a', 'center', 'd', 0);
}
function drawStatus(c, u, x, y, sz) {
  let i = 0;
  for (const k of STATUS_ORDER) {
    const n = u.st[k] || 0;
    if (!n) continue;
    const px = x + (i % 3) * (sz + 3), py = y + Math.floor(i / 3) * (sz + 3);
    c.beginPath(); rr(c, px, py, sz, sz, 4);
    inked(c, STATUS[k].col, 2, C.ink);
    txt(c, String(n), px + sz / 2, py + sz / 2 + 1, sz * 0.78, '#12203a', 'center', 'd', 0);
    i++;
  }
}

/* A unit standing on the board: a small slab with the creature on it. */
function drawUnit(c, u, t) {
  const w = SLOT_W, h = SLOT_H;
  const x = u.px - w / 2, y = u.py - h / 2;
  const dying = !u.alive;
  c.save();
  if (dying) {
    const k = clamp(u.dead / 0.55, 0, 1);
    c.globalAlpha = 1 - k;
    c.translate(u.px, u.py + k * 26);
    c.rotate(k * 0.5);
    c.translate(-u.px, -u.py);
  }
  const tribeCol = u.side === 'p' ? (u.leader ? C.gold : '#7fb2e8') : '#d08a8a';
  panel(c, x, y, w, h, 14, u.side === 'p' ? '#1d2c49' : '#3a2436', tribeCol);
  // inner art window
  const iw = w - 14, ih = h - 40;
  c.save();
  rr(c, x + 7, y + 7, iw, ih, 10);
  c.clip();
  const gg = c.createLinearGradient(0, y, 0, y + ih);
  gg.addColorStop(0, u.side === 'p' ? '#31507f' : '#5c3450');
  gg.addColorStop(1, u.side === 'p' ? '#16233c' : '#2a1524');
  c.fillStyle = gg; c.fillRect(x + 7, y + 7, iw, ih);
  drawCreature(c, u.art, u.px, y + ih * 0.62, ih * 0.86, {
    t, ph: u.bob, sq: u.sq, blink: u.blink, flip: u.side === 'e',
  });
  c.restore();

  if (u.flash > 0) {
    c.save(); c.globalAlpha = u.flash * 0.7; c.globalCompositeOperation = 'lighter';
    rr(c, x + 7, y + 7, iw, ih, 10); c.fillStyle = '#ff9aa5'; c.fill();
    c.restore();
  }

  // name strip
  txt(c, u.name.toUpperCase(), u.px, y + h - 24, 13, u.side === 'p' ? '#dbeaff' : '#ffd8d8', 'center', 't');

  // stats
  if (u.atk > 0 || u.leader) statPip(c, x + 14, y + h - 12, 13, '#ff8b7a', u.atk + stat(u, 'spice'));
  statPip(c, x + w - 14, y + h - 12, 13, '#7de08f', u.hp);
  // counter
  const ready = u.cnt <= 1;
  c.save();
  if (ready) { c.shadowColor = '#ffd166'; c.shadowBlur = 14; }
  c.beginPath(); c.arc(x + w - 13, y + 13, 15, 0, TAU);
  inked(c, ready ? '#ffd166' : '#cfe0f5', 3, C.ink);
  c.restore();
  txt(c, String(u.cnt), x + w - 13, y + 14, 20, '#12203a', 'center', 'd', 0);

  drawStatus(c, u, x + 5, y + 5, 20);

  // charms hang off the bottom corner and swing a little as the unit breathes
  const worn = (u.card && u.card.charms) || [];
  for (let i = 0; i < worn.length; i++) {
    const chm = chOf(worn[i]);
    if (!chm) continue;
    const sway = Math.sin(t * 2.2 + u.bob + i) * 0.22;
    const ax = x + 16 + i * 15, ay = y + h - 2;
    c.save();
    c.translate(ax, ay);
    c.rotate(sway);
    c.strokeStyle = C.ink; c.lineWidth = 2;
    c.beginPath(); c.moveTo(0, -6); c.lineTo(0, 7); c.stroke();
    c.beginPath(); c.arc(0, 12, 5.5, 0, TAU);
    inked(c, chm.col, 2, C.ink);
    c.restore();
  }

  if (u.leader) {
    c.beginPath();
    c.moveTo(u.px - 16, y - 4); c.lineTo(u.px - 16, y - 16); c.lineTo(u.px - 6, y - 9);
    c.lineTo(u.px, y - 19); c.lineTo(u.px + 6, y - 9); c.lineTo(u.px + 16, y - 16); c.lineTo(u.px + 16, y - 4);
    c.closePath();
    inked(c, C.gold, 2.5, C.ink);
  }
  c.restore();
}

/* A card in hand: the full face, with rules text. */
function drawCard(c, card, x, y, w, h, o) {
  o = o || {};
  const d = CARDS[card.def];
  const isUnit = card.type === 'unit';
  c.save();
  if (o.alpha !== undefined) c.globalAlpha = o.alpha;
  c.translate(x + w / 2, y + h / 2);
  if (o.rot) c.rotate(o.rot);
  if (o.scale) c.scale(o.scale, o.scale);
  c.translate(-w / 2, -h / 2);

  panel(c, 0, 0, w, h, 13, '#f3e9d6', RARE_COL[card.rare] || '#8fa6c4');
  // header
  c.beginPath(); rr(c, 5, 5, w - 10, 26, 8);
  inked(c, card.tribe ? TRIBES[card.tribe].col : '#b9c8dc', 2, C.ink);
  txt(c, card.name.toUpperCase(), w / 2, 18, Math.min(15, 190 / Math.max(7, card.name.length) * 1.05 + 6), '#22160c', 'center', 't', 'rgba(255,255,255,.55)');

  // art
  const aw = w - 14, ah = h * 0.40;
  c.save();
  rr(c, 7, 34, aw, ah, 9); c.clip();
  const gg = c.createLinearGradient(0, 34, 0, 34 + ah);
  gg.addColorStop(0, '#cfe4f8'); gg.addColorStop(1, '#9fb8d8');
  c.fillStyle = gg; c.fillRect(7, 34, aw, ah);
  if (isUnit) drawCreature(c, card.art, w / 2, 34 + ah * 0.66, ah * 0.92, { t: o.t || 0, ph: card.uid, blink: card.uid });
  else drawItemIcon(c, d.art, w / 2, 34 + ah * 0.5, ah * 0.62, o.t || 0);
  c.restore();
  rr(c, 7, 34, aw, ah, 9); c.lineWidth = 2.5; c.strokeStyle = C.ink; c.stroke();

  // what a hoarded card has put on since it was drawn
  if (card.kw && card.kw.hoard && card.held) {
    c.beginPath(); c.arc(20, 48, 14, 0, TAU);
    inked(c, '#c9a6ff', 2.5, C.ink);
    txt(c, '+' + card.held, 20, 49, 16, '#241a3a', 'center', 'd', 0);
  }

  // text box
  const ty = 34 + ah + 6;
  c.beginPath(); rr(c, 7, ty, aw, h - ty - (isUnit ? 30 : 9), 8);
  inked(c, '#fffaf0', 2, 'rgba(30,40,60,.35)');
  const lines = wrapText(c, card.text || '', 11.5, aw - 12);
  lines.slice(0, 4).forEach((ln, i) => txt(c, ln, w / 2, ty + 12 + i * 13, 11.5, '#3a3020', 'center', 't', 0));

  if (isUnit) {
    statPip(c, 16, h - 15, 13, '#ff8b7a', card.injured ? Math.max(0, Math.round(card.atk / 2)) : card.atk);
    statPip(c, w / 2, h - 15, 13, '#ffd166', card.cnt);
    const mh = card.injured ? Math.max(1, Math.round(card.hp / 2)) : card.hp;
    statPip(c, w - 16, h - 15, 13, '#7de08f', Math.max(0, mh - (card.dmg || 0)));
  }
  if (card.charms.length) {
    for (let i = 0; i < card.charms.length; i++) {
      const ch = chOf(card.charms[i]);
      c.beginPath(); c.arc(w - 10, 42 + i * 17, 7, 0, TAU);
      inked(c, ch ? ch.col : '#fff', 2, C.ink);
    }
  }
  if (card.injured) {
    c.save();
    c.globalAlpha = 0.9;
    c.beginPath(); rr(c, 7, 34, aw, ah, 9);
    c.fillStyle = 'rgba(120,20,40,.22)'; c.fill();
    c.restore();
    txt(c, 'HURT', w / 2, 34 + ah - 12, 15, '#ff9aa5', 'center', 'd');
  }
  c.restore();
}

function drawItemIcon(c, art, x, y, s, t) {
  const kind = (art && art.kind) || 'flask';
  const col = (art && art.col) || C.frost;
  c.save();
  c.translate(x, y + Math.sin(t * 2 + s) * 2);
  c.lineJoin = 'round';
  const lw = Math.max(2.5, s * 0.09);
  if (kind === 'flask') {
    c.beginPath();
    c.moveTo(-s * 0.16, -s * 0.42); c.lineTo(-s * 0.16, -s * 0.16);
    c.quadraticCurveTo(-s * 0.42, s * 0.16, -s * 0.24, s * 0.40);
    c.lineTo(s * 0.24, s * 0.40);
    c.quadraticCurveTo(s * 0.42, s * 0.16, s * 0.16, -s * 0.16);
    c.lineTo(s * 0.16, -s * 0.42);
    c.closePath();
    inked(c, col, lw, C.ink);
    c.beginPath(); rr(c, -s * 0.22, -s * 0.52, s * 0.44, s * 0.14, 4);
    inked(c, '#c9b28a', lw * 0.8, C.ink);
  } else if (kind === 'pick') {
    c.rotate(-0.5);
    c.beginPath(); rr(c, -s * 0.06, -s * 0.5, s * 0.12, s * 0.8, 4);
    inked(c, '#8a6a3f', lw * 0.8, C.ink);
    c.beginPath();
    c.moveTo(-s * 0.34, -s * 0.42); c.lineTo(s * 0.34, -s * 0.42); c.lineTo(0, -s * 0.10);
    c.closePath();
    inked(c, col, lw, C.ink);
  } else if (kind === 'bowl') {
    c.beginPath(); c.arc(0, 0, s * 0.42, 0, Math.PI);
    c.closePath();
    inked(c, '#c9b28a', lw, C.ink);
    c.beginPath(); c.ellipse(0, 0, s * 0.42, s * 0.12, 0, 0, TAU);
    inked(c, col, lw * 0.8, C.ink);
  } else if (kind === 'burst') {
    for (let i = 0; i < 8; i++) {
      const a = (i / 8) * TAU + t * 0.6;
      c.beginPath();
      c.moveTo(Math.cos(a) * s * 0.16, Math.sin(a) * s * 0.16);
      c.lineTo(Math.cos(a) * s * 0.5, Math.sin(a) * s * 0.5);
      c.strokeStyle = col; c.lineWidth = lw; c.lineCap = 'round'; c.stroke();
    }
    c.beginPath(); c.arc(0, 0, s * 0.2, 0, TAU);
    inked(c, col, lw, C.ink);
  } else if (kind === 'shield') {
    c.beginPath();
    c.moveTo(0, -s * 0.46); c.lineTo(s * 0.36, -s * 0.28);
    c.quadraticCurveTo(s * 0.34, s * 0.34, 0, s * 0.48);
    c.quadraticCurveTo(-s * 0.34, s * 0.34, -s * 0.36, -s * 0.28);
    c.closePath();
    inked(c, col, lw, C.ink);
  } else if (kind === 'stone') {
    c.beginPath(); rr(c, -s * 0.4, -s * 0.2, s * 0.8, s * 0.4, s * 0.16);
    inked(c, col, lw, C.ink);
  } else if (kind === 'rope') {
    c.strokeStyle = col; c.lineWidth = lw * 1.2; c.lineCap = 'round';
    c.beginPath();
    for (let i = 0; i <= 12; i++) {
      const yy = -s * 0.45 + (i / 12) * s * 0.9;
      const xx = Math.sin(i * 0.9 + t) * s * 0.16;
      i ? c.lineTo(xx, yy) : c.moveTo(xx, yy);
    }
    c.stroke();
  } else if (kind === 'bomb') {
    c.beginPath(); c.arc(0, s * 0.08, s * 0.36, 0, TAU);
    inked(c, '#3a4257', lw, C.ink);
    c.strokeStyle = col; c.lineWidth = lw;
    c.beginPath(); c.moveTo(s * 0.14, -s * 0.24);
    c.quadraticCurveTo(s * 0.4, -s * 0.46, s * 0.26, -s * 0.56); c.stroke();
    c.beginPath(); c.arc(s * 0.26, -s * 0.6, s * 0.09 + Math.sin(t * 12) * s * 0.02, 0, TAU);
    c.fillStyle = '#ffd166'; c.fill();
  } else if (kind === 'lantern') {
    c.save(); c.globalAlpha = 0.45; c.fillStyle = col;
    c.beginPath(); c.arc(0, 0, s * 0.5, 0, TAU); c.fill();
    c.restore();
    c.beginPath(); rr(c, -s * 0.2, -s * 0.28, s * 0.4, s * 0.56, s * 0.1);
    inked(c, col, lw, C.ink);
  }
  c.restore();
}

/* ==================================================== 11. audio ========== */

/* A tiny synth: no samples, no files, and it never blocks a gesture-less
   autoplay policy because nothing is built until the first tap. */
const AUD = { ctx: null, on: true, master: null };
function audioInit() {
  if (AUD.ctx || HEADLESS) return;
  try {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    AUD.ctx = new AC();
    AUD.master = AUD.ctx.createGain();
    AUD.master.gain.value = 0.5;
    AUD.master.connect(AUD.ctx.destination);
  } catch (e) { AUD.ctx = null; }
}
function tone(freq, dur, type, vol, slide, delay) {
  if (!AUD.ctx || !AUD.on) return;
  const t0 = AUD.ctx.currentTime + (delay || 0);
  const o = AUD.ctx.createOscillator();
  const g2 = AUD.ctx.createGain();
  o.type = type || 'square';
  o.frequency.setValueAtTime(freq, t0);
  if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(20, slide), t0 + dur);
  g2.gain.setValueAtTime(0.0001, t0);
  g2.gain.exponentialRampToValueAtTime(Math.max(0.0002, vol === undefined ? 0.15 : vol), t0 + 0.012);
  g2.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  o.connect(g2); g2.connect(AUD.master);
  o.start(t0); o.stop(t0 + dur + 0.03);
}
function noise(dur, vol, hp) {
  if (!AUD.ctx || !AUD.on) return;
  const n = Math.floor(AUD.ctx.sampleRate * dur);
  const buf = AUD.ctx.createBuffer(1, n, AUD.ctx.sampleRate);
  const d = buf.getChannelData(0);
  for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / n, 2);
  const s = AUD.ctx.createBufferSource();
  s.buffer = buf;
  const f = AUD.ctx.createBiquadFilter();
  f.type = hp ? 'highpass' : 'lowpass';
  f.frequency.value = hp || 1400;
  const g2 = AUD.ctx.createGain();
  g2.gain.value = vol === undefined ? 0.16 : vol;
  s.connect(f); f.connect(g2); g2.connect(AUD.master);
  s.start();
}
function sfx(name) {
  if (HEADLESS || !AUD.ctx) return;
  switch (name) {

    case 'win':   [523, 659, 784, 1047].forEach((f, i) => tone(f, 0.24, 'triangle', 0.14, f, i * 0.09)); break;
    case 'lose':  [440, 370, 294, 220].forEach((f, i) => tone(f, 0.3, 'sawtooth', 0.12, f * 0.9, i * 0.12)); break;

    case 'page':  tone(520, 0.07, 'triangle', 0.08, 700); break;

}

/* --------------------------------------------------------------- score --- */

/* A step sequencer rather than a loop: three voices over sixteen steps, with
   the root, the scale and the tempo picked by where you are. It reads none of
   the game's randomness — a run has to play the same twice, and a melody that
   consumed the seed would quietly poison that. */
const SCALE = {
  whitewood: [0, 3, 5, 7, 10],        // minor pentatonic — open, cold, hopeful
  shelf:     [0, 2, 3, 7, 8],         // a flattened sixth: the ground gets thin
  hollow:    [0, 1, 5, 6, 10],        // phrygian shards for the last climb
};
const MOOD = {
  title: { root: 110.0, scale: 'whitewood', beat: 0.46, lead: 0.5, drums: 0, pad: 1 },
  trail: { root: 110.0, scale: 'whitewood', beat: 0.44, lead: 0.42, drums: 0, pad: 1 },
  fight: { root: 98.0,  scale: 'shelf',     beat: 0.34, lead: 0.6,  drums: 1, pad: 1 },
  boss:  { root: 87.31, scale: 'hollow',    beat: 0.27, lead: 0.8,  drums: 2, pad: 1 },
  camp:  { root: 130.8, scale: 'whitewood', beat: 0.56, lead: 0.3,  drums: 0, pad: 1 },
};
const MUSIC_GAIN = 0.42;
const MUSIC = { on: true, mood: 'title', step: 0, timer: 0, notes: 0, bars: 0, swell: 0, seed: 12345 };

// The score's own randomness, so the game's stays untouched.
function mrnd() {
  MUSIC.seed = (MUSIC.seed * 1664525 + 1013904223) >>> 0;
  return MUSIC.seed / 4294967296;
}
const semitone = (root, n) => root * Math.pow(2, n / 12);

function moodFor(g) {
  if (g.screen === 'battle' && g.battle) return g.battle.kind === 'boss' ? 'boss' : 'fight';
  if (g.screen === 'camp') return 'camp';
  if (g.screen === 'title' || g.screen === 'gameover' || g.screen === 'victory') return 'title';
  return 'trail';
}
function zoneKey(g) {
  const z = g.run ? clamp(g.run.zone, 0, ZONES.length - 1) : 0;
  return ZONES[z].id;
}

/* One voice, so the mixer is in one place and a mute is a mute. */
function mtNote(freq, dur, type, vol, slide) {
  MUSIC.notes++;
  tone(freq, dur, type, (vol === undefined ? 0.1 : vol) * MUSIC_GAIN, slide);
}

function musicTick(g, dt) {
  if (!MUSIC.on) return;
  const mood = moodFor(g);
  if (mood !== MUSIC.mood) {
    MUSIC.mood = mood;
    MUSIC.step = 0;
    MUSIC.timer = 0;
    MUSIC.bars = 0;
  }
  const M = MOOD[mood];
  // The zone recolours whatever the mood set: same tune, colder key.
  const zk = zoneKey(g);
  const scale = SCALE[zk] || SCALE[M.scale];
  const drop = zk === 'shelf' ? -2 : zk === 'hollow' ? -4 : 0;
  const root = semitone(M.root, drop);

  MUSIC.timer -= dt;
  if (MUSIC.timer > 0) return;
  MUSIC.timer += M.beat / 4;                 // sixteenths
  const s = MUSIC.step;
  MUSIC.step = (s + 1) % 16;
  if (MUSIC.step === 0) MUSIC.bars++;

  // bass: root and fifth, on the pulse
  if (s === 0 || s === 6 || s === 10) mtNote(root / 2, M.beat * 0.9, 'triangle', 0.22);
  if (s === 8) mtNote(semitone(root / 2, 7), M.beat * 0.7, 'triangle', 0.18);

  // pad: one long chord tone per bar, an octave up, so the cold has a floor
  if (M.pad && s === 0) {
    mtNote(root * 2, M.beat * 3.4, 'sine', 0.07);
    mtNote(semitone(root * 2, scale[2]), M.beat * 3.2, 'sine', 0.05);
  }

  // lead: sparse, and it leans on the scale rather than wandering
  if (mrnd() < M.lead * 0.34) {
    const n = scale[Math.floor(mrnd() * scale.length)] + (mrnd() < 0.3 ? 12 : 0);
    mtNote(semitone(root * 2, n), M.beat * (mrnd() < 0.25 ? 1.4 : 0.55), 'square', 0.06);
  }

  // drums: only once there is something to be afraid of
  if (M.drums) {
    if (s % 4 === 0) noise(0.07, 0.05 * M.drums, 0);
    if (s === 4 || s === 12) noise(0.12, 0.05 * M.drums, 1800);
    if (M.drums > 1 && s === 14) noise(0.09, 0.05, 2600);
  }
}

function setMute(m) {
  G.meta.mute = !!m;
  AUD.on = !m;

}

/* Hit regions are rebuilt every frame by the draw code, so what the player can
   touch is always exactly what they can see. */
let hits = [];
const hit = (id, x, y, w, h, data) => { hits.push({ id, x, y, w, h, data }); };
function hitAt(x, y) {
  for (let i = hits.length - 1; i >= 0; i--) {
    const h = hits[i];
    if (x >= h.x && x <= h.x + h.w && y >= h.y && y <= h.y + h.h) return h;
  }
  return null;
}

  inspect: null,     // a card blown up with its keywords spelled out
  order: false,      // attack-order preview
  choose: null,      // {title, items, onPick, cancel}
  deck: false,       // the caravan, laid out
  help: null,        // page index of the rulebook, or null

/* -------------------------------------------------- the collection ------- */

function collectionItems() {
  const out = [];
  for (const c of Object.values(CARDS)) {
    if (c.leader) out.push({ id: c.id, kind: 'leader', name: c.name });
  }
  for (const c of Object.values(CARDS)) {
    if (!c.leader && c.type === 'unit') out.push({ id: c.id, kind: 'unit', name: c.name });
  }
  for (const c of Object.values(CARDS)) {
    if (c.type === 'item') out.push({ id: c.id, kind: 'item', name: c.name });
  }
  for (const id of Object.keys(CHARMS)) out.push({ id, kind: 'charm', name: CHARMS[id].name });
  return out;
}

function drawCollection(c, t) {
  drawBackdrop(c, 1, t);
  const items = collectionItems();
  const shown = items.filter((i) => found(i.id)).length;
  txt(c, 'THE COLLECTION', MID, 50, 34, '#eaf6ff', 'center', 'd');
  txt(c, shown + ' of ' + items.length + ' found   ·   ' + statOf('kills') + ' foes felled   ·   best turn: ' +
    statOf('bestCombo') + '   ·   clean zones: ' + statOf('flawless'), MID, 84, 14, '#9fc0e4', 'center', 't');

  // fit the grid to the stage rather than assuming a 16:9 one
  const gap = 6, availW = VW - SAFE * 2, availH = VH - 190;
  let tw = 88, th = 96;
  let perRow = Math.max(6, Math.floor((availW + gap) / (tw + gap)));
  let rows = Math.ceil(items.length / perRow);
  while (rows * (th + 22) > availH && th > 58) {
    th -= 6; tw -= 6;
    perRow = Math.max(6, Math.floor((availW + gap) / (tw + gap)));
    rows = Math.ceil(items.length / perRow);
  }
  const totalW = perRow * tw + (perRow - 1) * gap;
  items.forEach((it, i) => {
    const col = i % perRow, row = Math.floor(i / perRow);
    const x = MID - totalW / 2 + col * (tw + gap), y = 112 + row * (th + 22);
    const have = found(it.id);
    const hovered = UI.hover && UI.hover.id === 'collect' && UI.hover.data === i;
    panel(c, x, y - (hovered ? 4 : 0), tw, th, 10, have ? '#22304d' : '#161d2e', have ? '#3f5a86' : '#2a3346');
    c.save();
    c.translate(0, hovered ? -4 : 0);
    if (!have) c.globalAlpha = 0.22;
    const def = CARDS[it.id];
    if (it.kind === 'charm') {
      const ch = CHARMS[it.id];
      c.save(); c.translate(x + tw / 2, y + th * 0.44);
      c.beginPath();
      for (let k = 0; k < 6; k++) {
        const a = (k / 6) * TAU - Math.PI / 2, r = k % 2 ? 12 : 22;
        const px = Math.cos(a) * r, py = Math.sin(a) * r;
        k ? c.lineTo(px, py) : c.moveTo(px, py);
      }
      c.closePath();
      inked(c, ch.col, 2.5, C.ink);
      c.restore();
    } else if (it.kind === 'item') {
      drawItemIcon(c, def.art, x + tw / 2, y + th * 0.44, th * 0.48, t);
    } else {
      drawCreature(c, def.art, x + tw / 2, y + th * 0.62, th * 0.65, { t, ph: i * 0.7, blink: i });
    }
    c.restore();
    if (!have) txt(c, '?', x + tw / 2, y + th * 0.46, 34, '#5a6a86', 'center', 'd');
    txt(c, it.name.toUpperCase(), x + tw / 2, y + th + 10, 10.5, have ? '#c8dcf4' : '#5a6a86', 'center', 't');
    hit('collect', x, y, tw, th + 18, i);
  });

  if (UI.lockNote) {
    panel(c, MID - 260, VH - 108, 520, 46, 12, 'rgba(12,22,40,.95)', '#ffd166');
    txt(c, UI.lockNote, MID, VH - 85, 15, '#ffe6a8', 'center', 't');
  }
  button(c, 'collectClose', MID - 100, VH - 56, 200, 46, 'BACK', '#40527a');
}

function drawHud(c, t) {

  const z = ZONES[clamp(run.zone, 0, ZONES.length - 1)];
  panel(c, SAFE - 20, -14, 366, 58, 14, 'rgba(16,26,46,.85)', '#2b3d5f');

function drawBattle(c, t) {
  const g = G, b = g.battle;
  drawBackdrop(c, g.run ? g.run.zone : 0, t);

  // slots
  for (const side of ['p', 'e']) {
    for (let l = 0; l < LANES; l++) for (let col = 0; col < COLS; col++) {
      const p = slotPos(side, l, col);
      const free = slotFree(g, side, l, col);
      const dragUnitCard = UI.drag && UI.drag.card && UI.drag.card.type === 'unit';
      const dropOk = side === 'p' && free && (dragUnitCard || (UI.drag && UI.drag.unit));
      c.save();
      c.globalAlpha = free ? (dropOk ? 0.85 : 0.30) : 0.12;
      rr(c, p.x - SLOT_W / 2, p.y - SLOT_H / 2, SLOT_W, SLOT_H, 14);
      c.setLineDash(dropOk ? [] : [8, 8]);
      c.lineWidth = dropOk ? 4 : 2.5;
      c.strokeStyle = dropOk ? '#ffe08a' : (side === 'p' ? '#a8c8ea' : '#e8a8a8');
      c.stroke();
      if (dropOk) { c.globalAlpha = 0.16; c.fillStyle = '#ffe08a'; c.fill(); }
      c.restore();
      if (side === 'p' && free) hit('slot', p.x - SLOT_W / 2, p.y - SLOT_H / 2, SLOT_W, SLOT_H, { lane: l, col });
    }
  }

  // the divide
  c.save();
  c.globalAlpha = 0.35;
  c.strokeStyle = '#cfe4ff'; c.lineWidth = 3; c.setLineDash([12, 14]);
  c.beginPath(); c.moveTo(MID, 120); c.lineTo(MID, 460); c.stroke();
  c.restore();

  // units, back to front
  const list = b.units.slice().sort((a, x) => (a.py - x.py) || (a.col - x.col));
  for (const u of list) {
    drawUnit(c, u, t);
    if (u.alive) {
      const sp = slotPos(u.side, u.lane, u.col);
      hit('unit', sp.x - SLOT_W / 2, sp.y - SLOT_H / 2, SLOT_W, SLOT_H, u);
    }
  }

  // attack order preview
  if (UI.order) {
    const ord = turnOrder(g);
    ord.forEach((u, i) => {
      c.beginPath(); c.arc(u.px - SLOT_W / 2 + 12, u.py + SLOT_H / 2 - 44, 13, 0, TAU);
      inked(c, '#0f1a2e', 2.5, '#8fe3ff');
      txt(c, String(i + 1), u.px - SLOT_W / 2 + 12, u.py + SLOT_H / 2 - 43, 16, '#8fe3ff', 'center', 'd', 0);
    });
  }

  drawHand(c, t);
  drawHud(c, t);

  // piles
  txt(c, 'DECK ' + b.draw.length, SAFE + 52, VH - 152, 14, '#9fb6d6', 'center', 't');
  txt(c, 'USED ' + b.discard.length, SAFE + 52, VH - 130, 14, '#7e97b8', 'center', 't');

  // the bell
  const charged = b.bell >= BELL_CHARGE;
  const bx = VW - SAFE - 84, by = VH - 176;
  c.save();
  if (charged) { c.shadowColor = '#ffd166'; c.shadowBlur = 22 + Math.sin(t * 5) * 8; }
  c.beginPath();
  c.moveTo(bx - 34, by + 30);
  c.quadraticCurveTo(bx - 30, by - 30, bx, by - 34);
  c.quadraticCurveTo(bx + 30, by - 30, bx + 34, by + 30);
  c.closePath();
  inked(c, charged ? '#ffd166' : '#b9c8dc', 3.5, C.ink);
  c.restore();
  c.beginPath(); c.arc(bx, by + 36, 8, 0, TAU);
  inked(c, charged ? '#ffe6a8' : '#8fa2bd', 3, C.ink);
  txt(c, charged ? 'FREE REDRAW' : 'REDRAW (' + b.bell + '/' + BELL_CHARGE + ')', bx, by + 66, 13, charged ? '#ffe6a8' : '#9fb6d6', 'center', 't');
  hit('bell', bx - 60, by - 40, 120, 120);

  button(c, 'pass', VW - SAFE - 144, VH - 68, 144, 46, 'PASS', '#40527a', b.busy, true);
  button(c, 'order', SAFE, 58, 104, 44, UI.order ? 'ORDER ✓' : 'ORDER', '#40527a', false, true);
  button(c, 'help', SAFE + 112, 58, 44, 44, '?', '#40527a', false, true);

function drawHand(c, t) {
  const b = G.battle;
  const n = b.hand.length;
  if (!n) return;
  // The hand is a fan, not a row: cards lean out from the middle and sit a
  // little lower at the ends, which is what makes six cards readable at once
  // on a phone without shrinking any of them.
  const spread = Math.min(CARD_W + 8, (VW - 420) / Math.max(1, n));
  const total = (n - 1) * spread;
  for (let i = 0; i < n; i++) {
    const card = b.hand[i];
    if (UI.drag && UI.drag.card === card) continue;
    const off = i - (n - 1) / 2;
    const x = MID - total / 2 + i * spread - CARD_W / 2;
    const hovered = UI.hover && UI.hover.id === 'hand' && UI.hover.data === i;
    const lift = hovered ? 34 : 0;
    const arc = n > 1 ? Math.min(14, Math.abs(off) * Math.abs(off) * 2.2) : 0;
    const y = HAND_Y - CARD_H / 2 - lift + arc + Math.sin(t * 1.6 + i) * 2;
    card.handT = Math.min(1, (card.handT || 0) + 0.06);
    drawCard(c, card, x, y, CARD_W, CARD_H, {
      t, scale: hovered ? 1.07 : 1, rot: hovered ? 0 : off * 0.035,
    });
    hit('hand', x, y, CARD_W, CARD_H, i);
  }
  if (UI.drag && UI.drag.card) {
    const d = UI.drag;
    // a shadow on the table under the held card, so it reads as lifted
    c.save();
    c.globalAlpha = 0.3; c.fillStyle = '#000';
    c.beginPath(); c.ellipse(d.x, d.y + CARD_H * 0.34, CARD_W * 0.42, 14, 0, 0, TAU); c.fill();
    c.restore();
    drawCard(c, d.card, d.x - CARD_W / 2, d.y - CARD_H / 2 - 26, CARD_W, CARD_H,
      { t, scale: 1.12, rot: Math.sin(t * 5) * 0.025 });
  }
}

/* --------------------------------------------------------------- trail --- */
/* Where a step sits on the map. The road wanders, so the same seven steps read
   as a journey rather than as a progress bar. */
function trailPoint(run, step, branch, branches) {
  const steps = run.trail.length;
  const x0 = 140, x1 = VW - 150;
  const x = x0 + (x1 - x0) * (steps === 1 ? 0.5 : step / (steps - 1));
  const wander = Math.sin(step * 1.27 + run.seed % 7) * 46;
  const spread = branches > 1 ? (branch - (branches - 1) / 2) * 116 : 0;
  return { x, y: 306 + wander + spread };
}

function drawTrail(c, t) {
  const g = G, run = g.run;
  drawBackdrop(c, run.zone, t);
  const z = ZONES[clamp(run.zone, 0, ZONES.length - 1)];
  txt(c, z.name.toUpperCase(), MID, 84, 40, '#eaf6ff', 'center', 'd');
  txt(c, 'pick your road', MID, 122, 16, '#a8c8ea', 'center', 't');

  // the road itself: a broad packed-snow band under a dashed track
  const pts = [];
  for (let s2 = 0; s2 < run.trail.length; s2++) {
    const nodes = run.trail[s2];
    pts.push(trailPoint(run, s2, (nodes.length - 1) / 2, 1));
  }
  c.save();
  c.lineCap = 'round'; c.lineJoin = 'round';
  c.strokeStyle = 'rgba(255,255,255,.13)'; c.lineWidth = 34;
  c.beginPath();
  pts.forEach((p, i) => (i ? c.lineTo(p.x, p.y) : c.moveTo(p.x, p.y)));
  c.stroke();
  c.strokeStyle = 'rgba(190,220,255,.5)'; c.lineWidth = 4; c.setLineDash([3, 17]);
  c.beginPath();
  pts.forEach((p, i) => (i ? c.lineTo(p.x, p.y) : c.moveTo(p.x, p.y)));
  c.stroke();
  c.restore();

  for (let s2 = 0; s2 < run.trail.length; s2++) {
    const nodes = run.trail[s2];
    const doneStep = s2 < run.step;
    const nowStep = s2 === run.step;
    nodes.forEach((nd, i) => {
      const p = trailPoint(run, s2, i, nodes.length);
      const boss = nd.kind === 'boss';
      const r = (nowStep ? 34 : 24) * (boss ? 1.3 : 1);
      const chosen = doneStep && run.path[s2] === nd.kind;
      // a short spur off the main road out to a branch
      if (nodes.length > 1) {
        const mid = trailPoint(run, s2, (nodes.length - 1) / 2, 1);
        c.save();
        c.globalAlpha = nowStep ? 0.5 : 0.22;
        c.strokeStyle = '#cfe4ff'; c.lineWidth = 3; c.setLineDash([4, 8]);
        c.beginPath(); c.moveTo(mid.x, mid.y); c.lineTo(p.x, p.y); c.stroke();
        c.restore();
      }
      c.save();
      c.globalAlpha = doneStep ? (chosen ? 0.7 : 0.16) : nowStep ? 1 : 0.5;
      if (nowStep) { c.shadowColor = '#ffd166'; c.shadowBlur = 16 + Math.sin(t * 4 + i) * 6; }
      c.beginPath(); c.arc(p.x, p.y, r, 0, TAU);
      inked(c, nodeCol(nd.kind), 3.5, C.ink);
      c.restore();
      drawNodeIcon(c, nd.kind, p.x, p.y, r * 0.9, t);
      if (nowStep) {
        txt(c, nodeName(nd.kind).toUpperCase(), p.x, p.y + r + 20, 14, '#eaf6ff', 'center', 't');
        hit('node', p.x - r - 12, p.y - r - 12, r * 2 + 24, r * 2 + 24, i);
      } else if (doneStep && chosen) {
        // footprints where the caravan has already been
        c.save(); c.globalAlpha = 0.4; c.fillStyle = '#0d1830';
        for (let k = 0; k < 2; k++) {
          c.beginPath();
          c.ellipse(p.x - 8 + k * 16, p.y + r + 12 + k * 7, 4, 6, 0.3, 0, TAU);
          c.fill();
        }
        c.restore();
      }
    });
  }

  // the caravan, standing at the step it has reached
  const here = trailPoint(run, Math.max(0, run.step - 0.5), 0, 1);
  const bob = Math.sin(t * 2) * 3;
  drawCreature(c, CARDS[run.leader.def].art, here.x - 54, here.y - 42 + bob, 62, { t, ph: 3 });

  drawHud(c, t);
  if (run.log.length) txt(c, run.log[run.log.length - 1], MID, VH - 40, 15, '#9fb6d6', 'center', 't');
  if (run.winterPts) txt(c, 'WINTER ' + run.winterPts, VW - 40, VH - 40, 14, '#ffd166', 'right', 't');
}
const nodeCol = (k) => ({ fight: '#7fb2e8', elite: '#e08a8a', boss: '#ff9a3c', shop: '#ffd166', camp: '#8fe0a0', cache: '#c9a6ff', event: '#f0a6d0' }[k] || '#fff');
const nodeName = (k) => ({ fight: 'skirmish', elite: 'pack', boss: 'the beast', shop: 'trader', camp: 'camp', cache: 'cache', event: 'a stop' }[k] || k);
function drawNodeIcon(c, kind, x, y, s, t) {
  c.save(); c.translate(x, y); c.lineJoin = 'round';
  c.strokeStyle = C.ink; c.lineWidth = Math.max(2.5, s * 0.14); c.lineCap = 'round';
  if (kind === 'fight' || kind === 'elite' || kind === 'boss') {
    c.beginPath(); c.moveTo(-s * 0.4, s * 0.4); c.lineTo(s * 0.35, -s * 0.35); c.stroke();
    c.beginPath(); c.moveTo(s * 0.4, s * 0.4); c.lineTo(-s * 0.35, -s * 0.35); c.stroke();
    if (kind !== 'fight') { c.beginPath(); c.arc(0, 0, s * 0.16, 0, TAU); c.fillStyle = C.ink; c.fill(); }
  } else if (kind === 'shop') {
    c.beginPath(); rr(c, -s * 0.42, -s * 0.2, s * 0.84, s * 0.55, 4); c.stroke();
    c.beginPath(); c.moveTo(-s * 0.5, -s * 0.2); c.lineTo(0, -s * 0.55); c.lineTo(s * 0.5, -s * 0.2); c.stroke();
  } else if (kind === 'camp') {
    c.beginPath(); c.moveTo(-s * 0.42, s * 0.34); c.lineTo(s * 0.42, -s * 0.2); c.stroke();
    c.beginPath(); c.moveTo(s * 0.42, s * 0.34); c.lineTo(-s * 0.42, -s * 0.2); c.stroke();
    c.beginPath();
    c.moveTo(0, -s * 0.5);
    c.quadraticCurveTo(s * 0.3, -s * 0.1, 0, s * 0.16);
    c.quadraticCurveTo(-s * 0.3, -s * 0.1, 0, -s * 0.5);
    c.fillStyle = '#ff9a3c'; c.fill(); c.stroke();
  } else if (kind === 'cache') {
    c.beginPath(); rr(c, -s * 0.42, -s * 0.24, s * 0.84, s * 0.6, 5); c.stroke();
    c.beginPath(); c.moveTo(0, -s * 0.24); c.lineTo(0, s * 0.36); c.stroke();
  } else if (kind === 'event') {
    c.beginPath(); c.arc(0, -s * 0.1, s * 0.3, -2.4, 0.9); c.stroke();
    c.beginPath(); c.moveTo(s * 0.06, s * 0.12); c.lineTo(s * 0.06, s * 0.24); c.stroke();
    c.beginPath(); c.arc(s * 0.06, s * 0.44, s * 0.05, 0, TAU); c.fillStyle = C.ink; c.fill();
  }
  c.restore();
}

/* ------------------------------------------------------------- teaching -- */

/* Hints that watch rather than block. Each one waits for the player to do the
   thing it names; nothing is gated, nothing is modal, and the whole sequence
   can be thrown away with one tap. `when` is availability — a hint about waves
   is not shown in a fight that has none. */
/* A hint stays up long enough to be read even when the action that clears it
   has already happened — deploying a warden also spends the turn, so without
   this the counter hint would flash past in half a second. */
const TUT_DWELL = 2.0;
const TUTORIAL = [
  { id: 'deploy', text: 'Drag a warden onto a slot. The front of a lane takes the hits.',
    done: (g) => playerUnits(g).length > 1 },
  { id: 'counter', text: 'Counters drop by one each turn. At zero a card triggers: its ability AND its swing, then it resets.',
    done: (g) => g.battle.turn >= 1 },
  { id: 'action', text: 'One action a turn — a card, the bell, or a pass. Sliding a warden already on the board is free.',
    done: (g) => g.battle.turn >= 2 },
  { id: 'order', text: 'Tap ORDER to number the board. Every foe resolves before every warden, front of the table first.',
    done: () => UI.order },
  { id: 'inspect', text: 'Tap anything — a card, a warden, a foe — and the game tells you exactly what it does.',
    done: () => !!UI.inspect },
  { id: 'bell', text: 'The bell throws your hand away for a fresh one. It costs the turn until it charges, then it is free.',
    done: (g) => !!g.battle.rang },
  { id: 'wave', text: 'More are coming. CALL pulls the next wave in while your board is set, instead of while you are rebuilding.',
    when: (g) => g.battle.waves && g.battle.waves.length, done: (g) => (g.battle.waveNo || 1) >= 2 },
];

function tutStep(g, dt) {
  const t = g.tut;
  if (!t || t.over) return;
  if (g.screen !== 'battle' || !g.battle) return;
  t.t += dt;
  // skip anything that does not apply to the fight in front of us
  let guard = 0;
  while (t.i < TUTORIAL.length && guard++ < 12) {
    const h = TUTORIAL[t.i];
    if (h.when && !h.when(g)) { t.i++; t.t = 0; continue; }
    break;
  }
  if (t.i >= TUTORIAL.length) { finishTutorial(g); return; }
  const h = TUTORIAL[t.i];
  if (t.t > TUT_DWELL && h.done(g)) {
    t.i++;
    t.t = 0;
    t.flash = 1;
    sfx('page');
    if (t.i >= TUTORIAL.length) finishTutorial(g);
  }
}
function finishTutorial(g) {
  if (!g.tut || g.tut.over) return;
  g.tut.over = true;
  G.meta.taught = true;
  saveMeta();
  fx.toast('YOU HAVE THE RUN OF IT', C.gold);
}

function drawTutorial(c, t) {
  const tut = G.tut;
  if (!tut || tut.over || G.screen !== 'battle') return;
  const h = TUTORIAL[tut.i];
  if (!h) return;
  const w = 620, x = MID - w / 2, y = VH - 232;
  const pop = clamp(tut.t * 4, 0, 1);
  c.save();
  c.globalAlpha = 0.35 + 0.65 * pop;
  panel(c, x, y, w, 62, 14, 'rgba(12,22,40,.92)', '#ffd166');
  const lines = wrapText(c, h.text, 15, w - 130);
  lines.slice(0, 2).forEach((ln, i) => txt(c, ln, x + 58, y + (lines.length > 1 ? 22 : 31) + i * 19, 15, '#eaf6ff', 'left', 't'));
  // a little lantern to mark it as guidance rather than a warning
  c.save();
  c.translate(x + 32, y + 31 + Math.sin(t * 2.4) * 2);
  c.globalAlpha = 0.55; c.fillStyle = C.gold;
  c.beginPath(); c.arc(0, 0, 15, 0, TAU); c.fill();
  c.globalAlpha = 1;
  c.beginPath(); rr(c, -6, -9, 12, 18, 3);
  inked(c, C.gold, 2.5, C.ink);
  c.restore();
  txt(c, (tut.i + 1) + '/' + TUTORIAL.length, x + w - 66, y + 31, 13, '#9fb6d6', 'center', 't');
  c.restore();
  hit('tutSkip', x + w - 50, y + 9, 44, 44);
  txt(c, '✕', x + w - 28, y + 31, 17, '#7e97b8', 'center', 't');
}

/* Tap anything and the game explains it — the card, every keyword on it, every

function drawInspect(c, t) {

  if (!card) { UI.inspect = null; return; }
  c.save(); c.fillStyle = 'rgba(6,10,20,.86)'; c.fillRect(0, 0, VW, VH); c.restore();
  const w = 232, h = 310;
  drawCard(c, card, MID - w - 40, VH / 2 - h / 2, w, h, { t });

  txt(c, (unit ? unit.name : card.name).toUpperCase(), x, y, 32, '#eaf6ff', 'left', 'd');
  y += 44;
  if (unit) {
    txt(c, 'health ' + unit.hp + '/' + unit.maxHp + '    attack ' + unit.atk +
      '    counter ' + unit.cnt + '/' + unit.cntMax, x, y, 17, '#9fc0e4', 'left', 't');
    y += 26;
    txt(c, unit.side === 'p' ? 'ticks after every foe on the board' : 'ticks before any warden', x, y, 14, '#7e97b8', 'left', 't');

    y += 34;
  }
  if (card.text) {

    y += 12;
  }
  const keys = Object.keys((unit ? unit.kw : card.kw) || {}).filter((k) => KEYWORD[k] && (unit ? unit.kw[k] : card.kw[k]));
  for (const k of keys) {
    txt(c, KEYWORD[k].name.toUpperCase(), x, y, 18, '#ffd166', 'left', 'd');

/* ================================================== 10. input ============ */

function press(id, data) {
  const g = G;
  sfx('tap');
  switch (id) {
    case 'tribe': g.ui.pick = { tribe: data, winters: [] }; g.screen = 'leader'; return;
    case 'winterToggle': {
      const w = g.ui.pick.winters;
      const i = w.indexOf(data);
      if (i >= 0) w.splice(i, 1); else w.push(data);
      return;
    }
    case 'startRun': newRun(g, g.ui.pick.tribe, undefined, g.ui.pick.winters); return;
    case 'backTitle': g.screen = 'title'; return;
    case 'collection': g.screen = 'collection'; UI.lockNote = null; return;
    case 'collectClose': g.screen = 'title'; UI.lockNote = null; return;
    case 'collect': {
      const it = collectionItems()[data];
      if (!it) return;
      if (!found(it.id)) {
        const u = LOCKED[it.id];
        UI.lockNote = u ? u.text + '   (' + statOf(u.stat) + ' / ' + u.n + ')' : 'Not found yet.';
        return;
      }
      UI.lockNote = null;
      if (CARDS[it.id]) UI.inspect = mkCard(it.id);
      return;
    }
    case 'continue': if (!loadRun(g)) newRun(g, 'hearth'); return;
    case 'node': enterNode(g, data); return;
    case 'bell': ringBell(g); return;
    case 'wave': ringWave(g); return;
    case 'pass': passTurn(g); return;
    case 'order': UI.order = !UI.order; return;
    case 'menu': UI.deck = true; return;
    case 'help': UI.help = 0; return;
    case 'helpPage': UI.help = data; return;
    case 'helpClose': UI.help = null; return;
    case 'mute': setMute(!G.meta.mute); return;
    case 'tutSkip': if (G.tut) finishTutorial(g); return;
    case 'deckClose': UI.deck = false; return;
    case 'deckcard': UI.inspect = data; return;
    case 'inspectClose': UI.inspect = null; return;
    case 'endHome': g.screen = 'title'; g.run = null; g.battle = null; return;
    case 'reward': {
      const r = g.ui.reward;
      if (r.taken) return;
      takeCard(g, r.cards[data]);
      r.taken = true;
      if (!r.charms.length) advance(g);
      return;
    }
    case 'rewardCharm': {
      const r = g.ui.reward;
      if (r.charmTaken) return;
      const cid = r.charms[data];
      pickTargetForCharm(g, cid, () => {
        r.charmTaken = true;
        if (r.taken || !r.cards.length) advance(g);
      });
      return;
    }
    case 'rewardSkip': advance(g); return;
    case 'rewardBell': {
      const r = g.ui.reward;
      if (r.bellTaken) return;
      const bl = BELLS[r.bells[data]];
      if (!bl) return;
      bl.apply(g.run);
      g.run.bells = (g.run.bells || []).concat([bl.id]);
      r.bellTaken = true;
      sfx('get');
      fx.toast(bl.name.toUpperCase(), bl.col);
      if (r.taken || !r.cards.length) advance(g);
      return;
    }
    case 'eventOpt': {
      const ev = g.ui.event && g.ui.event.def;
      if (!ev || !ev.opts[data]) return;
      const o = ev.opts[data];
      if (o.can && !o.can(g)) return;
      o.go(g);
      return;
    }
    case 'buySigil': {
      const s2 = g.ui.shop;
      if (!s2 || s2.sigil.sold || g.run.gold < s2.sigil.price) return;
      const all = g.run.deck.filter((cd) => cd.type === 'unit' && !cd.sigil);
      if (!all.length) return;
      openChooser('MARK WHICH WARDEN WITH A SIGIL?', all.map((cd) => ({ card: cd })), (i) => {
        all[i].sigil = true;
        g.run.gold -= s2.sigil.price;
        s2.sigil.sold = true;
        UI.choose = null;
        sfx('get');
      }, { cancel: 'NEVER MIND' });
      return;
    }
    case 'buyCard': buy(g, 'card', data); return;
    case 'buyCharm': {
      const it = g.ui.shop.charms[data];
      if (!it || it.sold || g.run.gold < it.price) return;
      pickTargetForCharm(g, it.id, () => { g.run.gold -= it.price; it.sold = true; }, true);
      return;
    }
    case 'buyHeal': buy(g, 'heal'); return;
    case 'buyScar': {
      const hurtOnes = g.run.deck.concat([g.run.leader]).filter((cd) => cd.injured || cd.dmg > 0);
      if (!hurtOnes.length || g.ui.shop.scar.sold || g.run.gold < g.ui.shop.scar.price) return;
      openChooser('TEND WHICH WARDEN?', hurtOnes.map((cd) => ({ card: cd })), (i) => {
        const cd = hurtOnes[i];
        cd.injured = false; cd.dmg = 0;
        g.run.gold -= g.ui.shop.scar.price;
        g.ui.shop.scar.sold = true;
        UI.choose = null;
        sfx('heal');
      }, { cancel: 'NEVER MIND' });
      return;
    }
    case 'leaveShop': advance(g); return;
    case 'campRest': campChoose(g, 'rest'); return;
    case 'campToss': {
      openChooser('BURN WHICH CARD?', g.run.deck.map((cd) => ({ card: cd })), (i) => {
        const uid = g.run.deck[i].uid;
        UI.choose = null;
        campChoose(g, 'toss', uid);
      }, { cancel: 'NEVER MIND' });
      return;
    }
    case 'campCharm': {
      const three = sample(charmPool(), 3);
      openChooser('WHICH CHARM?', three.map((cid) => ({ charm: cid })), (i) => {
        pickTargetForCharm(g, three[i], () => { g.ui.camp.done = false; campChoose(g, 'charm', { charm: three[i], uid: UI.lastCharmUid }); });
      }, { cancel: 'NEVER MIND' });
      return;
    }
    case 'chooseCancel': UI.choose = null; return;
    default: return;
  }
}

/* Two-step: pick the charm, then pick who wears it. */
function pickTargetForCharm(g, charmId, after, chargeLater) {
  const all = [g.run.leader].concat(g.run.deck.filter((cd) => cd.type === 'unit'));
  openChooser('GIVE ' + chOf(charmId).name.toUpperCase() + ' TO WHOM?',
    all.map((cd) => ({ card: cd })), (i) => {
      UI.lastCharmUid = all[i].uid;
      attachCharm(all[i], CHARMS[charmId]);
      UI.choose = null;
      if (after) after();
      saveRun(g.run);
    }, { cancel: 'NEVER MIND' });
}

function onDown(x, y) {
  const g = G;
  UI.pointer = { x, y };
  const h = hitAt(x, y);
  UI.hover = h;
  if (UI.help !== null && UI.help !== undefined) {
    if (h && (h.id === 'helpPage' || h.id === 'helpClose')) press(h.id, h.data);
    return;
  }
  if (UI.inspect) { if (h && h.id === 'inspectClose') press(h.id); else UI.inspect = null; return; }
  if (UI.choose) {
    if (!h) return;
    if (h.id === 'choose') { const cb = UI.choose.onPick; cb(h.data); }
    else if (h.id === 'chooseCancel') UI.choose = null;
    return;
  }
  if (UI.deck) {
    if (h && (h.id === 'deckClose' || h.id === 'deckcard')) press(h.id, h.data);
    else UI.deck = false;
    return;
  }
  if (!h) return;
  if (h.id === 'hand') {
    const card = g.battle.hand[h.data];
    UI.drag = { card, idx: h.data, x, y, sx: x, sy: y, moved: false };
    return;
  }
  if (h.id === 'unit' && h.data.side === 'p' && g.battle && !g.battle.busy) {
    UI.drag = { unit: h.data, x, y, sx: x, sy: y, moved: false };
    return;
  }
  if (h.id === 'unit') { UI.inspect = h.data; return; }   // a foe answers questions too
  press(h.id, h.data);
}

function onMove(x, y) {
  UI.pointer = { x, y };
  if (UI.drag) {
    UI.drag.x = x; UI.drag.y = y;
    if (Math.hypot(x - UI.drag.sx, y - UI.drag.sy) > 12) UI.drag.moved = true;
  }
  UI.hover = hitAt(x, y);
}

function onUp(x, y) {
  const g = G, d = UI.drag;
  UI.drag = null;
  if (!d) return;
  const h = hitAt(x, y);
  if (!d.moved) {
    // A tap is a question, not a move: it opens the thing you touched.
    UI.inspect = d.card || d.unit || null;
    return;
  }
  if (d.card) {
    const idx = g.battle.hand.indexOf(d.card);
    if (idx < 0) return;
    if (d.card.type === 'unit') {
      if (h && h.id === 'slot') playCard(g, idx, h.data);
      else sfx('tap');
    } else {
      const tg = CARDS[d.card.def].target;
      if (tg === 'none') playCard(g, idx, null);
      else if (h && h.id === 'unit') playCard(g, idx, h.data);
    }
  } else if (d.unit) {
    if (h && h.id === 'slot') moveUnit(g, d.unit, h.data.lane, h.data.col);
    else if (h && h.id === 'unit' && h.data.side === 'p') moveUnit(g, d.unit, h.data.lane, h.data.col);
  }
}

/* ================================================== 12. loop + boot ====== */

function layoutUnits(dt) {
  const b = G.battle;
  if (!b) return;
  for (let i = b.units.length - 1; i >= 0; i--) {
    const u = b.units[i];
    const p = slotPos(u.side, u.lane, u.col);
    if (!u.px) { u.px = p.x + (u.side === 'p' ? -260 : 260); u.py = p.y; }
    const k = Math.min(1, dt * 11);
    u.px += (p.x - u.px) * k;
    u.py += (p.y - u.py) * k;
    if (u.lungeT > 0) {
      u.lungeT = Math.max(0, u.lungeT - dt * 5.5);
      const a = Math.sin((1 - u.lungeT) * Math.PI) * 26;
      u.px += u.lungeX * a; u.py += u.lungeY * a;
    }
    u.sq *= Math.pow(0.02, dt);
    u.flash = Math.max(0, u.flash - dt * 3.4);
    if (u.hitT > 0) u.hitT = Math.max(0, u.hitT - dt * 3);
    if (u.born) u.born += dt;
    if (!u.alive) {
      u.dead += dt;
      if (u.dead > 0.75) b.units.splice(i, 1);
    }
  }
}

function update(dt) {
  musicTick(G, dt);
  // Hit-stop: a big hit freezes the whole board for a breath. Everything
  // still draws, the clock just refuses to move, which is what makes the hit
  // land in the hand rather than only on the health bar.
  if (G.hitStop > 0) {
    G.hitStop -= dt;
    G.t += dt * 0.15;
    stepFx(dt * 0.2);
    return;
  }
  G.t += dt;
  stepFx(dt);
  if (Q.wait > 0) Q.wait -= dt;
  let guard = 0;
  while (Q.wait <= 0 && Q.items.length && guard++ < 64) {
    const it = Q.items.shift();
    if (it.fn) it.fn();
    Q.wait += it.d || 0;
  }
  layoutUnits(dt);
  tutStep(G, dt);
  // Hold a card still for a moment and it opens, so reading one never costs
  // you the drag you were halfway through.
  if (UI.drag && !UI.drag.moved) {
    UI.holdT += dt;
    if (UI.holdT > 0.42) {
      UI.inspect = UI.drag.card || UI.drag.unit || null;
      UI.drag = null;
      UI.holdT = 0;
      sfx('page');
    }
  } else UI.holdT = 0;
}

function drawFx(c) {
  for (const r of rings) {
    const k = r.t / r.life;
    c.save(); c.globalAlpha = (1 - k) * 0.8;
    c.strokeStyle = r.col; c.lineWidth = 4 * (1 - k) + 1;
    c.beginPath(); c.arc(r.x, r.y, r.r0 + k * 60, 0, TAU); c.stroke();
    c.restore();
  }
  for (const p of parts) {
    const k = p.t / p.life;
    c.globalAlpha = 1 - k;
    c.fillStyle = p.col;
    c.beginPath(); c.arc(p.x, p.y, p.r * (1 - k * 0.5), 0, TAU); c.fill();
  }
  c.globalAlpha = 1;
  for (const f of floats) {
    const k = f.t / f.life;
    c.globalAlpha = k > 0.7 ? (1 - k) / 0.3 : 1;
    txt(c, f.text, f.x, f.y, f.sz * (1 + (1 - Math.min(1, f.t * 6)) * 0.4), f.col, 'center', 'd');
  }
  c.globalAlpha = 1;
}

function render() {
  const c = ctx;
  if (!c) return;
  hits = [];
  const t = G.t;
  c.setTransform(DPR, 0, 0, DPR, 0, 0);
  c.clearRect(0, 0, VW, VH);
  c.save();
  if (shakeState.mag > 0.1) {
    c.translate(Math.sin(shakeState.t * 1.7) * shakeState.mag, Math.cos(shakeState.t * 2.3) * shakeState.mag);
  }
  switch (G.screen) {
    case 'title': drawTitle(c, t); break;
    case 'leader': drawLeaderPick(c, t); break;
    case 'collection': drawCollection(c, t); break;
    case 'trail': drawTrail(c, t); break;
    case 'battle': drawBattle(c, t); break;
    case 'reward': drawReward(c, t); break;
    case 'shop': drawShop(c, t); break;
    case 'camp': drawCamp(c, t); break;
    case 'event': drawEvent(c, t); break;
    case 'gameover': drawEnd(c, t, false); break;
    case 'victory': drawEnd(c, t, true); break;
    default: drawTitle(c, t); break;
  }
  drawFx(c);
  if (G.screen === 'battle' && G.tut) drawTutorial(c, t);
  if (UI.choose) drawChooser(c, t);
  if (UI.help !== null && UI.help !== undefined) drawHelp(c, t);
  if (UI.deck && G.run) drawDeckView(c, t);
  if (UI.inspect) drawInspect(c, t);
  c.restore();
  if (flashState.a > 0.01) {
    c.save();
    c.globalAlpha = Math.min(0.7, flashState.a);
    c.fillStyle = flashState.col;
    c.fillRect(0, 0, VW, VH);
    c.restore();
  }
}

function setStageWidth(w, h) {
  VW = clamp(Math.round(VH * (w / Math.max(1, h))), VW_MIN, VW_MAX);
  MID = VW / 2;
}
function resize() {
  if (!canvas) return;
  const w = window.innerWidth, h = window.innerHeight;
  document.body.classList.toggle('portrait', h > w * 1.02);
  setStageWidth(w, h);
  const scale = Math.min(w / VW, h / VH);
  DPR = Math.min(window.devicePixelRatio || 1, 2.5);
  canvas.width = Math.round(VW * DPR);
  canvas.height = Math.round(VH * DPR);
  canvas.style.width = Math.round(VW * scale) + 'px';
  canvas.style.height = Math.round(VH * scale) + 'px';
  if (ctx) ctx.imageSmoothingEnabled = true;
}

function evPos(e) {
  const r = canvas.getBoundingClientRect();
  const p = e.touches && e.touches.length ? e.touches[0] : (e.changedTouches && e.changedTouches.length ? e.changedTouches[0] : e);
  return { x: (p.clientX - r.left) / r.width * VW, y: (p.clientY - r.top) / r.height * VH };
}

function boot() {
  canvas = document.getElementById('game');
  ctx = canvas.getContext('2d');
  initSnow();
  loadMeta();
  resize();
  window.addEventListener('resize', resize);
  window.addEventListener('orientationchange', () => setTimeout(resize, 120));

  const down = (e) => { e.preventDefault(); const p = evPos(e); onDown(p.x, p.y); };
  const move = (e) => { e.preventDefault(); const p = evPos(e); onMove(p.x, p.y); };
  const up = (e) => { e.preventDefault(); const p = evPos(e); onUp(p.x, p.y); };
  canvas.addEventListener('pointerdown', down);
  canvas.addEventListener('pointermove', move);
  canvas.addEventListener('pointerup', up);
  canvas.addEventListener('pointercancel', up);

  const go = document.getElementById('bootgo');
  const start = () => {
    document.getElementById('boot').classList.add('gone');
    audioInit();
    // Landscape is the only orientation the game is authored for; ask nicely.
    const el = document.documentElement;
    const rq = el.requestFullscreen || el.webkitRequestFullscreen;
    if (rq) {
      try {
        const r = rq.call(el);
        if (r && r.then) r.then(lockLandscape).catch(lockLandscape);
        else lockLandscape();
      } catch (err) { lockLandscape(); }
    } else lockLandscape();
    setTimeout(resize, 200);
  };
  if (go) go.addEventListener('click', start);

  let last = (typeof performance !== 'undefined' ? performance.now() : Date.now());
  const frame = (now) => {
    const dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    update(dt);
    render();
    requestAnimationFrame(frame);
  };
  requestAnimationFrame(frame);
}
function lockLandscape() {
  try {
    if (screen.orientation && screen.orientation.lock) screen.orientation.lock('landscape').catch(() => {});
  } catch (e) {}
}

function loadMeta() {
  const raw = store.get(SAVE_META);
  if (!raw) return;
  try {
    const o = JSON.parse(raw);
    if (o && typeof o === 'object') G.meta = Object.assign(G.meta, o);
    if (!Array.isArray(G.meta.unlocked) || !G.meta.unlocked.length) G.meta.unlocked = ['hearth', 'frost'];
    G.meta.found = G.meta.found || {};
    G.meta.winter = G.meta.winter || {};
    G.meta.stats = Object.assign({ kills: 0, bestCombo: 0, flawless: 0, wins: 0, zones: 0 }, G.meta.stats || {});
    AUD.on = MUSIC.on = !G.meta.mute;
  } catch (e) {}
}
function saveMeta() { store.set(SAVE_META, JSON.stringify(G.meta)); }

/* ------------------------------------------------------------- exports --- */
/* The suites drive the real functions through this, never a re-implementation. */
window.FF = {
  G, C, CARDS, CHARMS, SCARS, FOES, ZONES, TRIBES, STATUS, STATUS_ORDER, KEYWORD, STARTERS,
  LANES, COLS, HAND, BELL_CHARGE, VW, VH, UI, SAFE,
  dims: () => ({ VW, VH, MID, SAFE }), setStageWidth,
  mkCard, mkUnit, mkFoeCard, rebuildCard, attachCharm,
  units, playerUnits, enemyUnits, unitAt, slotFree, freeSlots, laneOf, turnOrder,
  targetFor, frontTarget, laneTargets, neighbours,
  addStatus, stat, spend, hurt, heal, die, triggerUnit, attackOnce, tickCounter, shoveUnit, HOARD_CAP,
  resolveTurn, ringBell, passTurn, moveUnit, canPlay, playCard, drawToHand,
  startBattle, endBattle, checkOver, summon, buildEncounter, foeScale, deployWave, ringWave, WAVE_GAP,
  newRun, genTrail, enterNode, advance, rollReward, takeCard, takeCharm, rollShop, buy, campChoose,
  UNLOCKS, checkUnlocks, bumpStat, found, cardPool, charmPool, WINTERS, winterPts, bellNeed,
  BELLS, EXTRAS, EVENTS, chOf, payCombo, zoneBoss, waveGap, offerCharms, offerSigil,
  saveRun, loadRun, saveMeta, loadMeta, store,
  handSize, seed: (n) => { RNG = mulberry(n >>> 0); }, rnd: () => rnd(),
  render: () => render(), update: (dt) => update(dt), drainAll,
  press, onDown, onMove, onUp, hitAt, hits: () => hits,
  drawCreature, drawBackdrop, drawItemIcon, collectionItems, drawLeaderPick, drawCollection,
  MUSIC, musicTick, setMute, moodFor, AUD,
  TUTORIAL, TUT_DWELL, tutStep, finishTutorial, HELP_PAGES, HELP_RULES,
  setCtx: (c) => { ctx = c; initSnow(); },
};

if (!HEADLESS) {
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
}
})();
</script>
