  const bx = VW - SAFE - 84, by = VH - 176;
  c.save();
  if (charged) { c.shadowColor = '#ffd166'; c.shadowBlur = 22 + Math.sin(t * 5) * 8; }
  c.beginPath();
  c.moveTo(bx - 34, by + 30);
  c.quadraticCurveTo(bx - 30, by - 30, bx, by - 34);
  c.quadraticCurveTo(bx + 30, by - 30, bx + 34, by + 30);
  c.closePath();
  inked(c, charged ? '#ffd166' : '#b9c8dc', 3.5, C.ink);
  c.restore();
  c.beginPath(); c.arc(bx, by + 36, 8, 0, TAU);
  inked(c, charged ? '#ffe6a8' : '#8fa2bd', 3, C.ink);
  txt(c, charged ? 'FREE REDRAW' : 'REDRAW (' + b.bell + '/' + BELL_CHARGE + ')', bx, by + 66, 13, charged ? '#ffe6a8' : '#9fb6d6', 'center', 't');
  hit('bell', bx - 60, by - 40, 120, 120);

  button(c, 'pass', VW - SAFE - 144, VH - 68, 144, 46, 'PASS', '#40527a', b.busy, true);
  button(c, 'order', SAFE, 78, 104, 44, UI.order ? 'ORDER ✓' : 'ORDER', '#40527a', false, true);
  button(c, 'help', SAFE + 112, 78, 44, 44, '?', '#40527a', false, true);
  button(c, 'mute', SAFE + 164, 78, 44, 44, G.meta.mute ? '✕' : '♪', '#40527a', false, true);

  if (b.banner && b.banner.t < 2.1) {
    const k = b.banner.t += 1 / 60;
    const slide = k < 0.35 ? easeOut(k / 0.35) : k > 1.7 ? 1 - easeIn((k - 1.7) / 0.4) : 1;
    c.save();
    c.globalAlpha = clamp(slide, 0, 1);
    c.translate(MID + (1 - slide) * 220, 250);
    c.fillStyle = 'rgba(10,18,34,.86)';
    c.beginPath();
    c.moveTo(-VW / 2, -46); c.lineTo(VW / 2, -46); c.lineTo(VW / 2, 46); c.lineTo(-VW / 2, 46);
    c.closePath(); c.fill();
    c.strokeStyle = b.banner.col; c.lineWidth = 3;
    c.beginPath(); c.moveTo(-VW / 2, -46); c.lineTo(VW / 2, -46);
    c.moveTo(-VW / 2, 46); c.lineTo(VW / 2, 46); c.stroke();
    txt(c, b.banner.text, 0, -8, 52, b.banner.col, 'center', 'd');
    txt(c, b.banner.sub.toUpperCase(), 0, 28, 15, '#9fc0e4', 'center', 't');
    c.restore();
  }

  txt(c, b.busy ? 'RESOLVING…' : 'TURN ' + (b.turn + 1) + '  ·  one action',
    SAFE + 232, 60, 13, b.busy ? '#ffd166' : '#9fc0e4', 'center', 't');

  // the wave clock, over the far side of the table
  if (b.waves && b.waves.length) {
    const wx = Math.min(MID + 176, VW - SAFE - 300), wy = 54, ww = 300, wh = 46;
    const soon = b.waveCnt <= 1;
    panel(c, wx, wy, ww, wh, 12, 'rgba(58,26,40,.88)', soon ? '#ff9a3c' : '#7a4a5e');
    c.save();
    if (soon) { c.shadowColor = '#ff9a3c'; c.shadowBlur = 14 + Math.sin(t * 7) * 6; }
    c.beginPath(); c.arc(wx + 28, wy + wh / 2, 15, 0, TAU);
    inked(c, soon ? '#ff9a3c' : '#c98a9e', 3, C.ink);
    c.restore();
    txt(c, String(b.waveCnt), wx + 28, wy + wh / 2 + 1, 19, '#2a1524', 'center', 'd', 0);
    // once it has named a lane, the clock says which one — see the telegraph note
    txt(c, b.waveLane === undefined ? 'UNTIL THE NEXT WAVE'
      : 'TO THE ' + (b.waveLane === 0 ? 'TOP' : 'LOWER') + ' LANE',
      wx + 58, wy + wh / 2 - (b.waveLane === undefined ? 0 : 8), 13,
      b.waveLane === undefined ? '#f0cbd8' : '#ff9a3c', 'left', 't');
    if (b.waveLane !== undefined) {
      const holder = laneHeldBy(G, b.waveLane);
      txt(c, holder ? 'the lane is held — it waits' : 'stand in the lane and it waits',
        wx + 58, wy + wh / 2 + 10, 11.5,
        holder ? '#8fffc4' : '#f0cbd8', 'left', 't');
    }
    button(c, 'wave', wx + ww - 92, wy + 7, 84, 32, 'CALL', '#8f4a5f', b.busy, true);
  }
}

function drawHand(c, t) {
  const b = G.battle;
  const n = b.hand.length;
  if (!n) return;
  // The hand is a fan, not a row: cards lean out from the middle and sit a
  // little lower at the ends. On a narrow stage the whole fan shrinks rather
  // than overlapping into an unreadable pile — the piles on the left and the
  // bell on the right are what set the room it has.
  const room = VW - (SAFE + 120) * 2;
  let cw2 = CARD_W, chh2 = CARD_H;
  let spread = Math.min(cw2 + 8, room / Math.max(1, n));
  if (spread < cw2 * 0.82) {
    const k2 = clamp((room / Math.max(1, n)) / (cw2 * 0.82), 0.72, 1);
    cw2 = Math.round(CARD_W * k2);
    chh2 = Math.round(CARD_H * k2);
    spread = Math.min(cw2 + 6, room / Math.max(1, n));
  }
  const total = (n - 1) * spread;
  for (let i = 0; i < n; i++) {
    const card = b.hand[i];
    if (UI.drag && UI.drag.card === card) continue;
    const off = i - (n - 1) / 2;
    const x = MID - total / 2 + i * spread - cw2 / 2;
    const picked = UI.picked === card;
    const hovered = picked || (UI.hover && UI.hover.id === 'hand' && UI.hover.data === i);
    const lift = picked ? 52 : hovered ? 34 : 0;
    const arc = n > 1 ? Math.min(14, Math.abs(off) * Math.abs(off) * 2.2) : 0;
    const y = HAND_Y + (CARD_H - chh2) / 2 - chh2 / 2 - lift + arc + Math.sin(t * 1.6 + i) * 2;
    card.handT = Math.min(1, (card.handT || 0) + 0.06);
    // deal: the card travels out of the deck pile and settles into the fan
    card.dealT = Math.min(1, (card.dealT === undefined ? 1 : card.dealT) + 0.075);
    const dk = easeOut(card.dealT);
    const from = pilePos('draw');
    const dx = lerp(from.x - cw2 / 2, x, dk);
    const dy = lerp(from.y - chh2 / 2, y, dk);
    card.hx = dx; card.hy = dy;
    if (picked) {
      c.save();
      c.shadowColor = '#ffe08a'; c.shadowBlur = 22;
      rr(c, dx + 2, dy + 2, cw2 - 4, chh2 - 4, 13);
      c.fillStyle = '#ffe08a'; c.globalAlpha = 0.5; c.fill();
      c.restore();
    }
    drawCard(c, card, dx, dy, cw2, chh2, {
      t, scale: (hovered ? 1.07 : 1) * (0.6 + 0.4 * dk),
      rot: lerp(-0.7, hovered ? 0 : off * 0.035, dk),
      alpha: 0.4 + 0.6 * dk,
    });
    if (picked) txt(c, 'TAP A SLOT', dx + cw2 / 2, dy - 14, 13, '#ffe08a', 'center', 'd');
    // not grabbable until it has actually landed in the fan
    if (card.dealT > 0.6) hit('hand', x, y, cw2, chh2, i);
  }
  if (UI.drag && UI.drag.card) {
    const d = UI.drag;
    // a shadow on the table under the held card, so it reads as lifted
    c.save();
    c.globalAlpha = 0.3; c.fillStyle = '#000';
    c.beginPath(); c.ellipse(d.x, d.y + CARD_H * 0.34, CARD_W * 0.42, 14, 0, 0, TAU); c.fill();
    c.restore();
    /* The held card rides ABOVE the pointer, clear of it, not centred on it:
       on a phone the pointer is a thumb, and a card centred under the thumb
       covers both the thumb and the thing being aimed at. Clamped so it never
       climbs off the top of the stage. */
    const cy = Math.max(CARD_H * 0.58 + 8, d.y - CARD_H * 0.62);
    drawCard(c, d.card, d.x - CARD_W / 2, cy - CARD_H / 2, CARD_W, CARD_H,
      { t, scale: 1.12, rot: Math.sin(t * 5) * 0.025 });
  }
}

/* --------------------------------------------------------------- trail --- */
/* Where a step sits on the map. The road wanders, so the same seven steps read
   as a journey rather than as a progress bar. */
function trailPoint(run, step, branch, branches) {
  const steps = run.trail.length;
  const x0 = SAFE + 110, x1 = VW - SAFE - 110;
  const x = x0 + (x1 - x0) * (steps === 1 ? 0.5 : step / (steps - 1));
  const wander = Math.sin(step * 1.27 + run.seed % 7) * 52;
  const spread = branches > 1 ? (branch - (branches - 1) / 2) * 150 : 0;
  return { x, y: 330 + wander + spread };
}

function drawTrail(c, t) {
  const g = G, run = g.run;
  drawBackdrop(c, run.zone, t);
  const z = ZONES[clamp(run.zone, 0, ZONES.length - 1)];
  txt(c, z.name.toUpperCase(), MID, 78, 38, '#eaf6ff', 'center', 'd');
  txt(c, 'pick your road', MID, 114, 15, '#a8c8ea', 'center', 't');

  /* The road: a packed band with a dashed track down the middle, passing
     through the step the caravan actually took wherever it has already been. */
  const pts = [];
  for (let s2 = 0; s2 < run.trail.length; s2++) {
    const nodes = run.trail[s2];
    let branch = (nodes.length - 1) / 2, count = 1;
    if (s2 < run.step && nodes.length > 1) {
      const took = nodes.findIndex((n) => n.kind === run.path[s2]);
      if (took >= 0) { branch = took; count = nodes.length; }
    }
    pts.push(trailPoint(run, s2, branch, count));
  }
  const road = (width, style, dash) => {
    c.save();
    c.lineCap = 'round'; c.lineJoin = 'round';
    c.strokeStyle = style; c.lineWidth = width;
    if (dash) c.setLineDash(dash);
    c.beginPath();
    pts.forEach((p, i) => {
      if (!i) { c.moveTo(p.x, p.y); return; }
      const q = pts[i - 1];
      c.bezierCurveTo(q.x + 50, q.y, p.x - 50, p.y, p.x, p.y);
    });
    c.stroke();
    c.restore();
  };
  road(40, 'rgba(12,24,44,.35)');
  road(32, 'rgba(232,242,255,.22)');
  road(4, 'rgba(190,220,255,.55)', [3, 16]);

  for (let s2 = 0; s2 < run.trail.length; s2++) {
    const nodes = run.trail[s2];
    const doneStep = s2 < run.step;
    const nowStep = s2 === run.step;
    nodes.forEach((nd, i) => {
      const p = trailPoint(run, s2, i, nodes.length);
      const boss = nd.kind === 'boss';
      const r = (nowStep ? 36 : 26) * (boss ? 1.35 : 1);
      const chosen = doneStep && run.path[s2] === nd.kind;
      if (nodes.length > 1 && !doneStep) {
        const mid = trailPoint(run, s2, (nodes.length - 1) / 2, 1);
        c.save();
        c.globalAlpha = nowStep ? 0.45 : 0.18;
        c.strokeStyle = '#cfe4ff'; c.lineWidth = 3; c.setLineDash([4, 8]);
        c.beginPath(); c.moveTo(mid.x, mid.y); c.lineTo(p.x, p.y); c.stroke();
        c.restore();
      }
      c.save();
      c.globalAlpha = doneStep ? (chosen ? 0.65 : 0.14) : nowStep ? 1 : 0.62;
      if (nowStep) { c.shadowColor = '#ffd166'; c.shadowBlur = 18 + Math.sin(t * 4 + i) * 7; }
      // a stone marker rather than a bare circle
      c.beginPath(); c.arc(p.x, p.y + 4, r, 0, TAU);
      c.fillStyle = 'rgba(10,18,34,.55)'; c.fill();
      c.beginPath(); c.arc(p.x, p.y, r, 0, TAU);
      inked(c, nodeCol(nd.kind), 3.5, C.ink);
      c.restore();
      c.save();
      c.globalAlpha = doneStep ? (chosen ? 0.7 : 0.16) : 1;
      drawNodeIcon(c, nd.kind, p.x, p.y, r * 0.86, t);
      c.restore();
      // every node says what it is, not only the one you are standing at
      const lbl = nodeName(nd.kind).toUpperCase();
      c.save();
      c.globalAlpha = nowStep ? 1 : doneStep ? 0.3 : 0.6;
      txt(c, lbl, p.x, p.y + r + 17, nowStep ? 14 : 12, nowStep ? '#eaf6ff' : '#a8c0dc', 'center', 't');
      c.restore();
      /* The pad round a road node was 14 either side, which came out at 39 CSS
         pixels on the narrowest phone the game runs on — one short of the forty
         a thumb wants, on the only control that picks where the run goes next.
         The nodes are far enough apart to afford twice that. */
      if (nowStep) hit('node', p.x - r - 26, p.y - r - 26, r * 2 + 52, r * 2 + 52, i);
    });
  }

  // the caravan itself, standing on the road at the step it has reached
  const from = pts[Math.max(0, run.step - 1)], to = pts[run.step] || pts[pts.length - 1];
  const hereX = run.step === 0 ? to.x - 96 : lerp(from.x, to.x, 0.55);
  const hereY = run.step === 0 ? to.y : lerp(from.y, to.y, 0.55);
  const bob = Math.sin(t * 2) * 3;
  c.save();
  c.globalAlpha = 0.3; c.fillStyle = '#0d1830';
  c.beginPath(); c.ellipse(hereX, hereY + 22, 26, 7, 0, 0, TAU); c.fill();
  c.restore();
  drawCreature(c, CARDS[run.leader.def].art, hereX, hereY + 6 + bob, 66, { t, ph: 3 });

  /* THE CARAVAN, read out loud. The last zone is a check on the deck, and the
     honest answer to that is not to hide the checklist: five things it wants
     by the time it gets there, each with what it has against what it needs. */
  const rd = caravanRead(run);
  // Low and to the left, under the road rather than across it: the trail's
  // first stone and the caravan itself both live in the top-left corner.
  const pw = 232, ph = 88 + rd.length * 22, px = SAFE + 6, py = VH - 274;
  panel(c, px, py, pw, ph, 14, 'rgba(12,20,38,.78)', '#3a4b6b');
  /* Two labels sharing a line is fine at 15 stage units and broken at the size
     a phone needs, so the second one drops below the first. Every pair like
     this in the game got the same treatment once the text floor went in. */
  txt(c, 'THE CARAVAN', px + 14, py + 18, 15, '#a8c8ea', 'left', 'd');
  const crs = courseOf(run);
  if (crs) txt(c, crs.name, px + pw - 14, py + 34, 11, crs.col, 'right', 'd');
  txt(c, 'TEMPERED ' + tempered(run) + '/' + TEMPER_CAP, px + pw - 14, py + ph - 15, 10.5,
    tempered(run) >= TEMPER_CAP ? '#7e97b8' : C.gold, 'right', 't');
  /* AND WHAT THE FELL MADE OF IT.

     "The fell answers the caravan" has been the spine of the difficulty curve
     for five iterations and the player has never been able to see it — the
     checklist above is a proxy for what the caravan WANTS, not for what the
     trail made of what it has. Playing a run start to finish, the reading goes
     from a third under the bar to a little over it, and watching that number
     close is the clearest picture of progress in the game. It was in a debug
     tool. It belongs on the screen. */
  {
    const ans = Math.round(fellAnswer(run) * 100);
    const cold = ans <= -5, hot = ans >= 5;
    const col = cold ? '#8fe0a0' : hot ? '#ff9aa5' : '#ffd166';
    txt(c, (cold ? 'THE FELL HOLDS BACK ' : hot ? 'THE FELL HAS RISEN ' : 'LEVEL WITH THE FELL ') +
      (ans > 0 ? '+' : '') + ans + '%', px + 14, py + ph - 31, 10.5, col, 'left', 't');
  }
  /* THE NAME YIELDS TO THE TALLY, not the other way round.

     A checklist row is a name on the left and a count on the right, both at
     12.5 units — which the legibility floor lifts to about 23 on a fold's cover
     display, where `A LEAN DECK` ended three units from `7 / 2`. The count is
     the part you read at a glance and it is short, so it keeps its size and the
     name is fitted to whatever is left, with a gutter the row can be read
     across. Measured against the tally actually drawn rather than a guess at
     how wide a tally gets. */
  rd.forEach((r, i) => {
    const yy = py + 58 + i * 22;
    txt(c, r.ok ? '✓' : '!', px + 16, yy, 14, r.ok ? '#7de08f' : '#ffd166', 'center', 'd');
    const tally = r.got + ' / ' + r.want;
    const ts = textSize(12.5);
    c.font = '600 ' + ts + "px 'Frostwork','Trebuchet MS',sans-serif";
    const room = (pw - 14 - c.measureText(tally).width) - 30 - ts * 0.4;
    const ns = fitText(c, r.name, room, 12.5, 8, 't');
    txt(c, ellipsize(c, r.name, ns, room), px + 30, yy - 6, ns, r.ok ? '#c8dcf4' : '#eaf6ff', 'left', 't');
    txt(c, tally, px + pw - 14, yy - 6, 12.5, r.ok ? '#7de08f' : '#ffd166', 'right', 't');
  });
  const need = caravanNeeds(run);
  txt(c, need ? need.why : 'ready for what is ahead', px + pw / 2, py + ph + 10, 12,
    need ? '#ffd166' : '#7de08f', 'center', 't');

  /* STILL IN REACH — the seals this run can still take, and how far it has to
     carry them. A thing to chase is only a thing to play for while you can see
     it slipping. */
  const live = liveFeats(run);
  const left = run.trail.length - run.step + (ZONES.length - 1 - run.zone) * run.trail.length;
  if (live.length) {
    const lw = 232, lx2 = VW - SAFE - lw - 6, ly = py;
    const lh = 54 + live.length * 20;
    panel(c, lx2, ly, lw, lh, 14, 'rgba(12,20,38,.78)', '#3a4b6b');
    txt(c, 'STILL IN REACH', lx2 + 14, ly + 18, 15, '#a8c8ea', 'left', 'd');
    txt(c, left + ' steps', lx2 + lw - 14, ly + 34, 11, '#7e97b8', 'right', 'd');
    live.slice(0, 8).forEach((f, i) => {
      const yy = ly + 54 + i * 20;
      c.save();
      c.beginPath(); c.arc(lx2 + 20, yy, 5, 0, TAU);
      inked(c, f.col, 1.8, C.ink);
      c.restore();
      txt(c, f.name, lx2 + 32, yy - 6, 11.5, f.col, 'left', 't');
    });
  }

  /* WHAT IS FOLLOWING — shown at the fork, not at the fight, because it is a
     warning about the choice you are about to make and useless afterwards. It
     sits under the zone's name, above the road, because it is a fact about the
     road rather than about the caravan — and because everywhere lower on this
     screen already belongs to something. */
  const foll = following(run);
  if (foll > 0) {
    const fw = 268, fx0 = MID - fw / 2, fy0 = 128;
    const pulse = 0.55 + Math.sin(t * 2.4) * 0.2;
    panel(c, fx0, fy0, fw, 46, 12, 'rgba(48,16,22,.82)', '#8f4a4a');
    c.save();
    c.globalAlpha = pulse;
    for (let i = 0; i < 3; i++) {
      c.beginPath();
      c.arc(fx0 + 26, fy0 + 23, 4 + i * 4.5, -0.9, 0.9);
      c.strokeStyle = '#ff9aa5'; c.lineWidth = 2; c.stroke();
    }
    c.restore();
    txt(c, foll >= FOLLOW_FREE ? 'THEY ARE CLOSE NOW' : 'SOMETHING IS FOLLOWING',
      fx0 + 48, fy0 + 17, 14, '#ff9aa5', 'left', 'd');
    txt(c, 'every fight from here is ' + Math.round(foll * FOLLOW_STEP * 100) + '% bigger',
      fx0 + 48, fy0 + 33, 11.5, '#e8b8bf', 'left', 't');
  }

  drawHud(c, t);
  if (run.log.length) txt(c, run.log[run.log.length - 1], MID, VH - 44, 15, '#9fb6d6', 'center', 't');
  if (run.winterPts) txt(c, 'WINTER ' + run.winterPts, VW - SAFE, VH - 44, 14, '#ffd166', 'right', 't');
}
const nodeCol = (k) => ({ fight: '#7fb2e8', elite: '#e08a8a', boss: '#ff9a3c', shop: '#ffd166', camp: '#8fe0a0', cache: '#c9a6ff', event: '#f0a6d0', rest: '#8fe0d0', shrine: '#ffe6a8' }[k] || '#fff');
const nodeName = (k) => ({ fight: 'skirmish', elite: 'pack', boss: 'the beast', shop: 'trader', camp: 'camp', cache: 'cache', event: 'a stop', rest: 'rest stop', shrine: 'shrine' }[k] || k);
function drawNodeIcon(c, kind, x, y, s, t) {
  c.save(); c.translate(x, y); c.lineJoin = 'round'; c.lineCap = 'round';
  c.strokeStyle = C.ink; c.lineWidth = Math.max(2.5, s * 0.13);
  const ink = (fill) => inked(c, fill, Math.max(2, s * 0.12), C.ink);
  if (kind === 'fight' || kind === 'elite') {
    // crossed blades, with hilts, so it reads as swords and not as an X
    for (const d of [-1, 1]) {
      c.save();
      c.rotate(d * 0.72);
      c.beginPath();
      c.moveTo(-s * 0.09, -s * 0.62); c.lineTo(s * 0.09, -s * 0.62);
      c.lineTo(s * 0.07, s * 0.18); c.lineTo(-s * 0.07, s * 0.18);
      c.closePath();
      ink('#dfe9f8');
      c.beginPath(); rr(c, -s * 0.2, s * 0.18, s * 0.4, s * 0.11, 3);
      ink('#9a7a4a');
      c.beginPath(); rr(c, -s * 0.07, s * 0.29, s * 0.14, s * 0.28, 3);
      ink('#6a4a2a');
      c.restore();
    }
    if (kind === 'elite') {
      c.beginPath(); c.arc(0, -s * 0.06, s * 0.17, 0, TAU);
      ink('#ff9aa5');
    }
  } else if (kind === 'boss') {
    // a horned skull: the one node you should be able to spot from anywhere
    c.beginPath(); c.ellipse(0, s * 0.06, s * 0.42, s * 0.4, 0, 0, TAU);
    ink('#f0e6d8');
    for (const d of [-1, 1]) {
      c.beginPath();
      c.moveTo(d * s * 0.32, -s * 0.18);
      c.quadraticCurveTo(d * s * 0.78, -s * 0.42, d * s * 0.6, -s * 0.78);
      c.quadraticCurveTo(d * s * 0.5, -s * 0.4, d * s * 0.2, -s * 0.3);
      c.closePath();
      ink('#e2d6c0');
    }
    c.fillStyle = C.ink;
    for (const d of [-1, 1]) {
      c.beginPath(); c.ellipse(d * s * 0.15, s * 0.02, s * 0.1, s * 0.13, 0, 0, TAU); c.fill();
    }
    c.beginPath(); c.moveTo(0, s * 0.16); c.lineTo(s * 0.07, s * 0.3); c.lineTo(-s * 0.07, s * 0.3);
    c.closePath(); c.fill();
  } else if (kind === 'shop') {
    // a stall with a striped awning
    c.beginPath(); rr(c, -s * 0.44, -s * 0.06, s * 0.88, s * 0.56, 4);
    ink('#c9a06a');
    c.save();
    rr(c, -s * 0.54, -s * 0.34, s * 1.08, s * 0.3, 4);
    c.clip();
    c.fillStyle = '#f0f4fa'; c.fillRect(-s * 0.54, -s * 0.34, s * 1.08, s * 0.3);
    c.fillStyle = '#e0605a';
    for (let i = 0; i < 4; i++) c.fillRect(-s * 0.54 + i * s * 0.28, -s * 0.34, s * 0.14, s * 0.3);
    c.restore();
    c.beginPath(); rr(c, -s * 0.54, -s * 0.34, s * 1.08, s * 0.3, 4);
    c.lineWidth = Math.max(2, s * 0.12); c.strokeStyle = C.ink; c.stroke();
  } else if (kind === 'camp') {
    // a tent, with a fire beside it
    c.beginPath();
    c.moveTo(0, -s * 0.5); c.lineTo(s * 0.42, s * 0.34); c.lineTo(-s * 0.42, s * 0.34);
    c.closePath();
    ink('#7f9a6a');
    c.beginPath();
    c.moveTo(0, -s * 0.5); c.lineTo(s * 0.12, s * 0.34); c.lineTo(-s * 0.12, s * 0.34);
    c.closePath();
    ink('#3c4a38');
  } else if (kind === 'cache') {
    // a chest with a clasp
    c.beginPath(); rr(c, -s * 0.44, -s * 0.06, s * 0.88, s * 0.44, 4);
    ink('#a9834f');
    c.beginPath(); c.arc(0, -s * 0.06, s * 0.44, Math.PI, 0);
    c.closePath();
    ink('#c9a06a');
    c.beginPath(); rr(c, -s * 0.09, -s * 0.16, s * 0.18, s * 0.24, 3);
    ink(C.gold);
  } else if (kind === 'rest') {
    // a bedroll under a lantern
    c.beginPath(); rr(c, -s * 0.46, s * 0.08, s * 0.92, s * 0.26, s * 0.13);
    ink('#8fe0d0');
    c.beginPath(); c.arc(-s * 0.26, s * 0.21, s * 0.13, 0, TAU);
    ink('#e8f6ff');
    c.beginPath(); c.moveTo(s * 0.3, s * 0.06); c.lineTo(s * 0.3, -s * 0.42); c.stroke();
    c.beginPath(); c.arc(s * 0.3, -s * 0.5, s * 0.13, 0, TAU);
    ink(C.gold);
  } else if (kind === 'shrine') {
    // a standing stone with a lit hollow
    c.beginPath();
    c.moveTo(0, -s * 0.56); c.lineTo(s * 0.38, -s * 0.1); c.lineTo(s * 0.24, s * 0.44);
    c.lineTo(-s * 0.24, s * 0.44); c.lineTo(-s * 0.38, -s * 0.1);
    c.closePath();
    ink('#cfc4a8');
    c.save();
    c.globalAlpha = 0.6 + Math.sin(t * 2.6) * 0.2;
    c.beginPath(); c.arc(0, s * 0.02, s * 0.16, 0, TAU);
    c.fillStyle = C.gold; c.fill();
    c.restore();
    c.beginPath(); c.arc(0, s * 0.02, s * 0.16, 0, TAU);
    c.lineWidth = Math.max(2, s * 0.1); c.strokeStyle = C.ink; c.stroke();
  } else if (kind === 'event') {
    // a signpost pointing two ways
    c.beginPath(); rr(c, -s * 0.07, -s * 0.5, s * 0.14, s * 0.98, 3);
    ink('#a9834f');
    c.beginPath();
    c.moveTo(-s * 0.05, -s * 0.44); c.lineTo(s * 0.44, -s * 0.44);
    c.lineTo(s * 0.56, -s * 0.3); c.lineTo(s * 0.44, -s * 0.16); c.lineTo(-s * 0.05, -s * 0.16);
    c.closePath();
    ink('#f0a6d0');
    c.beginPath();
    c.moveTo(s * 0.05, -s * 0.08); c.lineTo(-s * 0.44, -s * 0.08);
    c.lineTo(-s * 0.56, s * 0.06); c.lineTo(-s * 0.44, s * 0.2); c.lineTo(s * 0.05, s * 0.2);
    c.closePath();
    ink('#d086b0');
  }
  c.restore();
}

/* -------------------------------------------------------- overlays ------- */
function openChooser(title, items, onPick, opts) {
  UI.choose = Object.assign({ title, items, onPick, sub: '' }, opts || {});
}
function drawChooser(c, t) {
  const ch = UI.choose;
  if (!ch) return;
  c.save(); c.fillStyle = 'rgba(6,10,20,.82)'; c.fillRect(0, 0, VW, VH); c.restore();
  txt(c, ch.title, MID, 74, 34, '#eaf6ff', 'center', 'd');
  if (ch.sub) txt(c, ch.sub, MID, 112, 15, '#9fc0e4', 'center', 't');
  const items = ch.items;
  const perRow = Math.min(items.length, 6);
  const cw = 132, chh = 176, gap = 16;
  const rows = Math.ceil(items.length / perRow);
  items.forEach((it, i) => {
    const r = Math.floor(i / perRow), col = i % perRow;
    const inRow = Math.min(perRow, items.length - r * perRow);
    const totalW = inRow * cw + (inRow - 1) * gap;
    const x = MID - totalW / 2 + col * (cw + gap);
    const y = 150 + r * (chh + 24) - (rows - 1) * 20;
    const hovered = UI.hover && UI.hover.id === 'choose' && UI.hover.data === i;
    if (it.card) drawCard(c, it.card, x, y - (hovered ? 8 : 0), cw, chh, { t, scale: hovered ? 1.04 : 1 });
    else if (it.charm) drawCharmCard(c, it.charm, x, y - (hovered ? 8 : 0), cw, chh, t);
    else if (it.label && it.label.indexOf('\n') >= 0) {
      // a heading and its small print — a choice that needs explaining
      const [head, body] = it.label.split('\n');
      const col = it.col || '#7fb2e8';
      c.save();
      if (it.dim) c.globalAlpha = 0.4;
      panel(c, x, y - (hovered && !it.dim ? 8 : 0), cw, chh, 13, '#1d2c49', col);
      const hl = wrapText(c, head, 16, cw - 18);
      hl.forEach((ln, k) => txt(c, ln, x + cw / 2, y + 22 + k * lineH(16, 19) - (hovered && !it.dim ? 8 : 0), 16, col, 'center', 'd'));
      wrapText(c, body, 12.5, cw - 20).forEach((ln, k) =>
        txt(c, ln, x + cw / 2, y + 30 + hl.length * lineH(16, 19) + k * lineH(12.5, 15) - (hovered && !it.dim ? 8 : 0), 12.5, '#c8dcf4', 'center', 't'));
      if (it.dim) txt(c, 'HELD', x + cw / 2, y + chh - 26, 15, '#8fa2bd', 'center', 'd');
      c.restore();
    } else {
      panel(c, x, y, cw, chh, 13, '#1d2c49', '#7fb2e8');
      const lines = wrapText(c, it.label || '', 15, cw - 20);
      lines.forEach((ln, k) => txt(c, ln, x + cw / 2, y + chh / 2 - (lines.length - 1) * lineH(15, 20) / 2 + k * lineH(15, 20), 15, '#eaf6ff', 'center', 't'));
    }
    if (it.price !== undefined) {
      const afford = G.run && G.run.gold >= it.price;
      panel(c, x + cw / 2 - 34, y + chh + 4, 68, 30, 9, afford ? '#3f8f5f' : '#5a3a3a', C.ink);
      txt(c, String(it.price), x + cw / 2, y + chh + 19, 17, '#ffe6a8', 'center', 'd');
    }
    if (it.sold) {
      c.save(); c.globalAlpha = 0.6; c.fillStyle = '#0a1120';
      rr(c, x, y, cw, chh, 13); c.fill(); c.restore();
      txt(c, 'SOLD', x + cw / 2, y + chh / 2, 22, '#8fa2bd', 'center', 'd');
    } else hit('choose', x, y, cw, chh + 34, i);
  });
  if (ch.cancel) button(c, 'chooseCancel', MID - 90, VH - 74, 180, 48, ch.cancel, '#40527a');
}

/* A charm is a pendant, not a card: a hanging loop, a cut stone, and the one
   line of text that says what wearing it does. */
/* A charm wears the same face as every other card — body, band, window, frame.
   It used to be its own design in parchment cream with a floating pill for a
   name, so a reward screen showed two different games' cards side by side. */
function drawCharmCard(c, charmId, x, y, w, h, t) {
  const ch = chOf(charmId) || BELLS[charmId];

  c.fillStyle = body; c.fill();
  c.restore();

  const bh = 26 * S;

  c.clip();

  bg.addColorStop(0, '#ffffff');
  bg.addColorStop(1, ch.col);
  c.fillStyle = bg; c.fillRect(0, 0, w, bh);
  c.fillStyle = 'rgba(255,255,255,.5)'; c.fillRect(0, bh - 1.6 * S, w, 1.6 * S);
  c.restore();
  const nameSize = fitText(c, ch.name.toUpperCase(), w - 18 * S, 14 * S, 8 * S, 't');
  txt(c, ch.name.toUpperCase(), w / 2, bh / 2, nameSize, '#22160c', 'center', 't', 'rgba(255,255,255,.45)');

  const ax = 7 * S, ay = bh + 6 * S, aw = w - 14 * S, ah = h * 0.40;
  c.save();

  sky.addColorStop(0, '#16294c');
  sky.addColorStop(1, '#3d5f8d');
  c.fillStyle = sky; c.fillRect(ax, ay, aw, ah);
  const halo = c.createRadialGradient(w / 2, ay + ah * 0.5, 2, w / 2, ay + ah * 0.5, aw * 0.6);
  halo.addColorStop(0, ch.col);
  halo.addColorStop(0.5, 'rgba(255,255,255,0)');
  halo.addColorStop(1, 'rgba(255,255,255,0)');
  c.save(); c.globalAlpha = 0.55; c.fillStyle = halo; c.fillRect(ax, ay, aw, ah); c.restore();

  c.scale(pulse, pulse);

    const a2 = (i / 8) * TAU - Math.PI / 8;
    const px = Math.cos(a2) * r, py = Math.sin(a2) * r * 1.12;

  }
  c.closePath();
  inked(c, ch.col, 3 * S, C.ink);
  c.save();
  c.globalAlpha = 0.55; c.fillStyle = '#ffffff';
  c.beginPath();
  c.moveTo(-r * 0.45, -r * 0.5); c.lineTo(r * 0.1, -r * 0.72); c.lineTo(-r * 0.1, -r * 0.1);
  c.closePath(); c.fill();
  c.restore();
  c.restore();
  const inner = c.createLinearGradient(0, ay, 0, ay + ah * 0.3);
  inner.addColorStop(0, 'rgba(8,14,28,.28)');
  inner.addColorStop(1, 'rgba(8,14,28,0)');
  c.fillStyle = inner; c.fillRect(ax, ay, aw, ah * 0.3);
  c.restore();
  rr(c, ax, ay, aw, ah, 8 * S);
  c.lineWidth = 2.5 * S; c.strokeStyle = C.ink; c.stroke();

  const ty = ay + ah + 6 * S;
  const th = h - ty - 20 * S;
  c.beginPath();
  c.moveTo(14 * S, ty - 2 * S); c.lineTo(w - 14 * S, ty - 2 * S);
  c.lineWidth = 1.2 * S; c.strokeStyle = 'rgba(24,40,68,.22)'; c.stroke();
  const fit = fitLines(c, ch.text, aw - 10 * S, 3, 11.5 * S, 7.5 * S);
  const lh = fit.size * 1.12;
  const lines = fit.cut(Math.max(1, Math.floor(th / lh)));
  const top = ty + th / 2 - (lines.length - 1) * lh / 2;
  lines.forEach((ln, i) => txt(c, ln, w / 2, top + i * lh, fit.size, '#1d2f4d', 'center', 't', 0));

  rr(c, 0, 0, w, h, 12 * S);
  c.lineWidth = 3 * S; c.strokeStyle = C.ink; c.stroke();
  rr(c, 3.5 * S, 3.5 * S, w - 7 * S, h - 7 * S, 9 * S);
  c.lineWidth = 1.4 * S; c.strokeStyle = ch.col; c.stroke();

  c.beginPath(); rr(c, w / 2 - 26 * S, h - 17 * S, 52 * S, 13 * S, 6.5 * S);
  inked(c, 'rgba(24,40,68,.16)', 1.2 * S, 'rgba(24,40,68,.28)');
  txt(c, 'CHARM', w / 2, h - 10.5 * S, 9 * S, '#3a5378', 'center', 't', 0);
  c.restore();
}

/* ------------------------------------------------------------- teaching -- */

/* Hints that watch rather than block. Each one waits for the player to do the
   thing it names; nothing is gated, nothing is modal, and the whole sequence
   can be thrown away with one tap. `when` is availability — a hint about waves
   is not shown in a fight that has none. */
/* A hint stays up long enough to be read even when the action that clears it
   has already happened — deploying a warden also spends the turn, so without
   this the counter hint would flash past in half a second. */
const TUT_DWELL = 2.0;
const TUTORIAL = [
  { id: 'deploy', text: 'Drag a warden onto a slot. The front of a lane takes the hits.',
    done: (g) => playerUnits(g).length > 1 },
  { id: 'counter', text: 'Counters drop by one each turn. At zero a card triggers: its ability AND its swing, then it resets.',
    done: (g) => g.battle.turn >= 1 },
  { id: 'action', text: 'One action a turn — a card, the bell, or a pass. Sliding a warden already on the board is free.',
    done: (g) => g.battle.turn >= 2 },
  /* The two rules a first run used to have to lose to learn.

     Both shipped as statements — here is a rule — with nothing to clear them
     but a turn count, and walking the guide in order showed exactly what that
     looks like: the same hint sitting there for three turns while the player
     waits it out. Every other hint in this list names an ACTION and clears on
     it, so these do too. */
  { id: 'front', text: 'Slide a warden into the front column. Counters run twice as fast there, on both sides — anything standing there wears a ×2.',
    // …with a way out, because the warden it asks for can die in the front row
    // it just asked you to put them in
    done: (g) => playerUnits(g).some((u) => u.col === 0 && !u.leader) || g.battle.turn >= 6 },
  /* THE HABIT THE GUIDE NEVER MENTIONED.

     Denying schemes has been at or near the top of the fight ablation for four
     rounds — the single most valuable thing a player can learn to do in a
     fight — and reading the guide in order, as a new player, it is not in here
     at all. Nine hints about deploying, counters, the front row, the room rule,
     the bell and the waves, and nothing whatsoever about the one line of red
     text a foe puts on the table a turn before it does something to you.

     So it is a hint, and like every other hint that works it names an ACTION
     and clears when the action lands: kill it, freeze it, or take away whatever
     the scheme needed. The way out is a turn count, because the fight may not
     hand you the tools and a hint you cannot clear is a hint you resent. */
  { id: 'scheme', text: 'Red text under a foe is what it does NEXT turn. Kill it, freeze it, or take away what it needs, and it wastes the turn.',
    hold: true,
    /* Shown while there is red text on the table and cleared when that red text
       RESOLVES — denied or landed, either way the player has now watched the
       whole cycle, which is the thing being taught. Waiting for a denial
       specifically was the first version and it left the hint up for seven
       screenshots in a row: a player who has not learned the rule yet is not
       going to deny anything, so the hint that teaches denial cannot require
       denial to go away. */
    when: (g) => g.battle.units.some((u) => u.side === 'e' && u.alive && u.plot),
    done: (g) => !g.battle.units.some((u) => u.side === 'e' && u.alive && u.plot) },
  { id: 'room', text: 'Keep TWO slots empty and the whole line mends every turn. One is cramped — no warmth. None at all and the cold gets in.',
    when: (g) => playerUnits(g).length >= 2,
    done: (g) => freeSlots(g, 'p').length >= ROOM_NEEDED && g.battle.turn >= 3 },
  { id: 'order', text: 'Tap ORDER to number the board. Every foe resolves before every warden, front of the table first.',
    done: () => UI.order },
  { id: 'inspect', text: 'Tap anything — a card, a warden, a foe — and the game tells you exactly what it does.',
    done: () => !!UI.inspect },
  { id: 'bell', text: 'The bell throws your hand away for a fresh one. It costs the turn until it charges, then it is free.',
    done: (g) => !!g.battle.rang },
  { id: 'wave', text: 'More are coming. CALL pulls the next wave in while your board is set, instead of while you are rebuilding.',
    when: (g) => g.battle.waves && g.battle.waves.length, done: (g) => (g.battle.waveNo || 1) >= 2 },
];

/* How many turns a held hint waits for its moment before giving up on it.
   Generous: a schemer commits to something every two or three turns, so this is
   only reached by a fight where the schemer died in the first exchange. */
const HOLD_GIVEUP = 12;
function tutStep(g, dt) {
  const t = g.tut;
  if (!t || t.over) return;
  if (g.screen !== 'battle' || !g.battle) return;
  t.t += dt;
  // skip anything that does not apply to the fight in front of us
  let guard = 0;
  t.hold = false;
  while (t.i < TUTORIAL.length && guard++ < 12) {
    const h = TUTORIAL[t.i];
    /* A HELD hint waits for its moment instead of being skipped past it.
       Everything else in this list describes something permanently true of the
       fight — there are waves or there are not — so "does not apply, move on"
       is right for them. A scheme is not like that: it exists for one turn,
       between the foe committing to it and the foe doing it, and a hint about
       red text that arrives when there is no red text on the table teaches
       nobody anything. Walking the opening in the shots, it landed on turn 5
       with the log already reading "Chillfang lunges at Bramblewick for 6" —
       the rule explained immediately after the player lost to it. */
    if (h.when && !h.when(g)) {
      /* Once it HAS had its moment, stop asking. This hint's `when` wants red
         text on the table and its `done` wants that red text resolved, so after
         the scheme fires both are false at once — and a hint that holds on a
         condition its own completion destroys is a hint that holds forever.
         That deadlock cost seven identical screenshots before it was spotted. */
      if (h.hold && t.shown) break;
      /* …and not forever the first time either. A fight that never lays one —
         because the schemer died in the opening exchange — has to let the guide
         move on, or a held hint becomes a stuck one.

         The budget is TURNS TAKEN, not seconds waited. Seconds were the first
         attempt and they are the wrong unit for the same reason frames would
         be: they are not shared between the people who experience this. A
         player thinking for thirty seconds and a screenshot tool stepping the
         same fight in four hundred milliseconds have to get the same number of
         chances at seeing it, or the thing that gets photographed is not the
         thing that gets played. Counted across fights, because waiting can
         outlast one and a battle's own turn count starts over at the bell. */
      if (h.hold && (t.holdN || 0) < HOLD_GIVEUP) {
        if (t.holdTurn !== g.battle.turn || t.holdBattle !== g.battle) {
          t.holdN = (t.holdN || 0) + 1;
          t.holdTurn = g.battle.turn;
          t.holdBattle = g.battle;
        }
        t.hold = true;
        return;
      }
      t.i++; t.t = 0; t.holdN = 0; t.shown = false; continue;
    }
    t.holdN = 0;
    t.shown = true;
    break;
  }
  if (t.i >= TUTORIAL.length) { finishTutorial(g); return; }
  const h = TUTORIAL[t.i];
  if (t.t > TUT_DWELL && h.done(g)) {
    t.i++;
    t.t = 0;
    t.shown = false;
    t.flash = 1;
    sfx('page');
    if (t.i >= TUTORIAL.length) finishTutorial(g);
  }
}
function finishTutorial(g) {
  if (!g.tut || g.tut.over) return;
  g.tut.over = true;
  G.meta.taught = true;
  saveMeta();
  fx.toast('YOU HAVE THE RUN OF IT', C.gold);
}

function drawTutorial(c, t) {
  const tut = G.tut;
  if (!tut || tut.over || tut.hold || G.screen !== 'battle') return;
  const h = TUTORIAL[tut.i];
  if (!h) return;
  // pinned to the top, in whatever gap the HUD and the wave clock leave it
  const b = G.battle;
  const right = (b.waves && b.waves.length) ? Math.min(MID + 176, VW - SAFE - 300) - 14 : VW - SAFE - 300;
  const left = SAFE + 360;
  const w = clamp(right - left, 320, 660);
  const x = left + Math.max(0, (right - left - w) / 2), y = 50;
  const pop = clamp(tut.t * 4, 0, 1);
  c.save();
  c.globalAlpha = 0.35 + 0.65 * pop;
  panel(c, x, y, w, 62, 14, 'rgba(12,22,40,.92)', '#ffd166');
  const fit = fitLines(c, h.text, w - 150, 2, 14.5, 9.5);
  const hl = fit.cut(2);
  hl.forEach((ln, i) =>
    txt(c, ln, x + 58, y + (hl.length > 1 ? 22 : 31) + i * (fit.size + 4), fit.size, '#eaf6ff', 'left', 't'));
  // a little lantern to mark it as guidance rather than a warning
  c.save();
  c.translate(x + 32, y + 31 + Math.sin(t * 2.4) * 2);
  c.globalAlpha = 0.55; c.fillStyle = C.gold;
  c.beginPath(); c.arc(0, 0, 15, 0, TAU); c.fill();
  c.globalAlpha = 1;
  c.beginPath(); rr(c, -6, -9, 12, 18, 3);
  inked(c, C.gold, 2.5, C.ink);
  c.restore();
  txt(c, (tut.i + 1) + '/' + TUTORIAL.length, x + w - 66, y + 31, 13, '#9fb6d6', 'center', 't');
  c.restore();
  hit('tutSkip', x + w - 50, y + 9, 44, 44);
  txt(c, '✕', x + w - 28, y + 31, 17, '#7e97b8', 'center', 't');
}

/* The help pages used to be a fixed grid: a hardcoded row pitch, a hardcoded
   line step, and a hard slice at five or six lines. That was fine at 720 units
   tall on a desktop and a lie on a phone, where the text floor makes every line
   taller, every paragraph longer, and the slice cut the rules off mid-sentence.
   Nothing about the fell is worth reading if the sentence explaining it stops
   at "and that one loses its next trigger. The".

   So the entries are measured and flowed instead. Two columns when they fit,
   one wide column when they do not — a wide stage with few tall lines is
   exactly the shape a phone gives you — and a second sheet with arrows when
   even that runs out. Nothing is ever cut. */
function helpFlow(c, entries, o) {
  const lh = lineH(o.size, o.step), hh = lineH(19, 26), gut = 44;
  const top = 150, bot = VH - 92;
  let best = null;
  for (const cols of [2, 1]) {
    const cw = (VW - 180 - (cols - 1) * gut) / cols;
    const pages = [];
    let pg = [], col = 0, yy = top;
    for (const e of entries) {
      const lines = wrapText(c, e.body, o.size, cw - (o.ind || 0));
      const h = hh + lines.length * lh + 18;
      if (yy + h > bot && yy > top) {
        if (col + 1 < cols) { col++; yy = top; }
        else { pages.push(pg); pg = []; col = 0; yy = top; }
      }
      pg.push({ e, lines, x: 90 + col * (cw + gut), y: yy });
      yy += h;
    }
    if (pg.length) pages.push(pg);
    if (!best || pages.length < best.pages.length) best = { cols, cw, pages, lh, hh };
    if (best.pages.length === 1) break;
  }
  return best;
}

const HELP_ENTRY = {
  0: () => HELP_RULES.map((r) => ({ head: r[0], col: '#ffd166', body: r[1] })),
  1: () => HELP_BOARD.map((r) => ({ head: r[0], col: r[1], body: r[2] })),
  2: () => STATUS_ORDER.map((k) => ({ head: STATUS[k].name, col: STATUS[k].col, body: STATUS[k].text, pip: 1, icon: STATUS[k].icon })),
  3: () => Object.keys(KEYWORD).map((k) => ({ head: KEYWORD[k].name, col: '#ffd166', body: KEYWORD[k].text })),
};

function drawHelp(c, t) {
  const page = UI.help | 0;

    hits[hits.length - 1].data = i;

  const entries = (HELP_ENTRY[page] || HELP_ENTRY[0])();
  const flow = helpFlow(c, entries, { size: 13.5, step: 17, ind: page === 2 ? 42 : 0 });

  if (flow.pages.length > 1) {
    button(c, 'helpSheet', MID - 190, VH - 72, 60, 50, '\u2039', '#40527a');

    txt(c, (sheet + 1) + ' / ' + flow.pages.length, MID + 190, VH - 47, 15, '#9fc0e4', 'center', 't');

/* Tap anything and the game explains it — the card, every keyword on it, every
   status riding it, and what its charms did. Nothing in here is a mystery you

function drawInspect(c, t) {

  if (!card) { UI.inspect = null; return; }

  const w = 232, h = 310;
  drawCard(c, card, MID - w - 40, VH / 2 - h / 2, w, h, { t });

  txt(c, (unit ? unit.name : card.name).toUpperCase(), x, y, 32, '#eaf6ff', 'left', 'd');
  y += 44;
  if (unit) {
    txt(c, 'health ' + unit.hp + '/' + unit.maxHp + '    attack ' + unit.atk +
      '    counter ' + unit.cnt + '/' + unit.cntMax, x, y, 17, '#9fc0e4', 'left', 't');
    y += 26;
    txt(c, unit.side === 'p' ? 'ticks after every foe on the board' : 'ticks before any warden', x, y, 14, '#7e97b8', 'left', 't');

  }

  for (const k of keys) {
    txt(c, KEYWORD[k].name.toUpperCase(), x, y, 18, '#ffd166', 'left', 'd');

      txt(c, STATUS[k].name.toUpperCase(), x + 28, y, 15, STATUS[k].col, 'left', 'd');

      y += 6;

}

  const cw = items.length > 3 ? 152 : 176, chh = items.length > 3 ? 214 : 246, gap = items.length > 3 ? 22 : 30;
  const totalW = items.length * cw + (items.length - 1) * gap;
  const y = 178;
  if (items.length) {
    c.save();
    c.globalAlpha = 0.3;
    panel(c, MID - totalW / 2 - 26, y - 24, totalW + 52, chh + 48, 18, '#101a2e', '#3a4b6b');
    c.restore();
  }
  items.forEach((it, i) => {
    const x = MID - totalW / 2 + i * (cw + gap);
    const hovered = UI.hover && UI.hover.id === 'reward' && UI.hover.data === i;
    c.save();
    if (r.taken) c.globalAlpha = 0.32;
    drawCard(c, it.card, x, y - (hovered && !r.taken ? 12 : 0), cw, chh, { t, scale: hovered && !r.taken ? 1.05 : 1 });
    c.restore();
    if (!r.taken) hit('reward', x, y, cw, chh, i);
  });
  if (r.charms.length) {
    txt(c, r.charmTaken ? 'charm taken' : 'and a charm', MID, 434, 16, '#a8c8ea', 'center', 't');
    const w2 = 120, g3 = 18;
    const tw = r.charms.length * w2 + (r.charms.length - 1) * g3;
    r.charms.forEach((cid, i) => {
      const x = MID - tw / 2 + i * (w2 + g3);
      c.save();
      if (r.charmTaken) c.globalAlpha = 0.3;
      drawCharmCard(c, cid, x, 452, w2, 160, t);
      c.restore();
      if (!r.charmTaken) hit('rewardCharm', x, 452, w2, 160, i);
    });
  }
  if (r.bells && r.bells.length) {
    /* Anchored to the card row rather than to a constant. With three cards the
       row is 246 tall and reached y=424, so a caption pinned at 404 sat ON the
       cards — invisible while gear had nothing along its bottom edge, and a
       collision the moment it did. */
    const bcy = (items.length ? y + chh + 16 : 404);
    txt(c, r.bellTaken ? 'bell rung' : 'and a bell for the road', MID, bcy, 16, '#a8c8ea', 'center', 't');
    const w2 = 210, g3 = 22;
    const tw = r.bells.length * w2 + (r.bells.length - 1) * g3;
    r.bells.forEach((bid, i) => {
      const bl = BELLS[bid];
      const x = MID - tw / 2 + i * (w2 + g3);
      const hovered = UI.hover && UI.hover.id === 'rewardBell' && UI.hover.data === i;
      c.save();
      if (r.bellTaken) c.globalAlpha = 0.3;
      panel(c, x, bcy + 24 - (hovered ? 6 : 0), w2, 132, 14, '#1d2c49', bl.col);
      // a little bell, since every one of these is literally one
      c.save();
      c.translate(x + w2 / 2, bcy + 66 - (hovered ? 6 : 0));
      c.beginPath();
      c.moveTo(-17, 15); c.quadraticCurveTo(-15, -14, 0, -17);
      c.quadraticCurveTo(15, -14, 17, 15); c.closePath();
      inked(c, bl.col, 2.5, C.ink);
      c.restore();
      txt(c, bl.name.toUpperCase().replace('BELL OF ', ''), x + w2 / 2, bcy + 104 - (hovered ? 6 : 0), 18, bl.col, 'center', 'd');
      wrapText(c, bl.text, 12.5, w2 - 22).forEach((ln, k) =>
        txt(c, ln, x + w2 / 2, bcy + 124 + k * lineH(12.5, 15) - (hovered ? 6 : 0), 12.5, '#c8dcf4', 'center', 't'));
      c.restore();
      if (!r.bellTaken) hit('rewardBell', x, bcy + 24, w2, 132, i);
    });
  }
  /* A reward is not only "take one of three". The same pick can thin the deck
     or copy something already in it, which is where a build actually comes
     from. */
  if (!r.taken && r.cards.length) {
    const run = G.run;
    const bw4 = 134, gap4 = 9;
    const total4 = bw4 * 6 + gap4 * 5;
    const bx = MID - total4 / 2;
    const rd = redealPrice(run);
    button(c, 'rewardCopy', bx, VH - 128, bw4, 44, 'COPY A CARD', '#5f4a8f', run.deck.length < 1, true);
    button(c, 'rewardTemper', bx + bw4 + gap4, VH - 128, bw4, 44, 'TEMPER A CARD', '#8f7a3f', !temperable(run).length, true);
    button(c, 'rewardBurn', bx + (bw4 + gap4) * 2, VH - 128, bw4, 44, 'BURN A CARD', '#8f4a4a', run.deck.length < 3, true);
    /* AND THE THING THE PURSE IS FOR, WHERE THE PURSE IS ACTUALLY FILLED.

       Two pilots, same skill, and the one who took every fight arrived at the
       beast holding twenty-one cards, no temper at all and FIVE HUNDRED AND
       TWENTY-SEVEN unspent scrip. The one who ducked fights arrived with
       thirteen cards, three tempers and fifty scrip left. That is the whole
       story of both problems in one line: the trader shares her fork with a
       fight, so a caravan that fights cannot spend, and a fight only ever paid
       in cards — which make a deck bigger, not a caravan stronger. Fighting was
       not paying too little. It was paying in the wrong currency and then
       hiding the exchange behind the node you gave up to fight.

       So a meal is sold here too, at the same rising price, out of the scrip
       the fight just paid. */
    const mp = mealPrice(run);
    button(c, 'rewardMeal', bx + (bw4 + gap4) * 3, VH - 128, bw4, 44, 'A MEAL  ' + mp, '#8f6a3f',
      run.gold < mp || !feedable(run).length, true);
    button(c, 'rewardRedeal', bx + (bw4 + gap4) * 4, VH - 128, bw4, 44, 'REDEAL  ' + rd, '#3f6f8f', run.gold < rd, true);
    button(c, 'rewardCourse', bx + (bw4 + gap4) * 5, VH - 128, bw4, 44,
      'COURSE  ' + COURSE_PRICE, '#6f5f3f', run.gold < COURSE_PRICE, true);
    // The one line that says what this caravan is actually short of, right
    // where the decision is being made.
    const need = caravanNeeds(run);
    txt(c, need ? need.name.toLowerCase() + ': it has ' + need.got + ', it wants ' + need.want + ' — ' + need.why
      : 'the caravan wants for nothing — pass and keep the scrip',
      MID, VH - 76, 13, need ? '#ffd166' : '#7de08f', 'center', 't');
  }
  button(c, 'rewardSkip', MID - 110, VH - 58, 220, 44,
    r.taken ? 'ONWARD' : 'PASS  +' + PASS_PAY, r.taken ? '#3f8f5f' : '#40527a');
}

function drawShop(c, t) {
  const g = G, s = g.ui.shop;
  drawBackdrop(c, g.run.zone, t);
  drawHud(c, t);
  txt(c, 'THE TRADER', MID, 80, 38, '#eaf6ff', 'center', 'd');
  txt(c, 'she takes scrip, and she does not haggle', MID, 112, 15, '#a8c8ea', 'center', 't');

  // the stall: cards on the left of the counter, charms on the right
  const cw = 152, chh = 212, gap = 18, cy = 200;
  const priceY = cy + chh + 10;
  const leftW = s.cards.length * cw + (s.cards.length - 1) * gap;
  const rightW = s.charms.length * cw + (s.charms.length - 1) * gap;
  const lx = MID - 40 - leftW, rx = MID + 40;
  const stall = (x0, wid) => {
    c.save();
    c.globalAlpha = 0.32;
    panel(c, x0 - 16, cy - 22, wid + 32, chh + 76, 16, '#101a2e', '#3a4b6b');
    c.restore();
  };
  stall(lx, leftW); stall(rx, rightW);
  // WARES / CHARMS were labels for two shelves that could not be mistaken for
  // one another — cards on one, pendants on the other — and the bell now needs
  // the line they were sitting on. Cut.

  const tag = (x, price, sold) => {
    const afford = g.run.gold >= price;
    panel(c, x - 34, priceY, 68, 32, 9, sold ? '#3b4560' : afford ? '#3f8f5f' : '#5a3a3a', C.ink);
    txt(c, sold ? '—' : String(price), x, priceY + 16, 18, sold ? '#8fa2bd' : '#ffe6a8', 'center', 'd');
  };
  s.cards.forEach((it, i) => {
    const x = lx + i * (cw + gap);
    drawCard(c, mkCard(it.id), x, cy, cw, chh, { t, alpha: it.sold ? 0.35 : 1 });
    tag(x + cw / 2, it.price, it.sold);
    if (!it.sold) hit('buyCard', x, cy, cw, chh + 44, i);
  });
  s.charms.forEach((it, i) => {
    const x = rx + i * (cw + gap);
    c.save();
    if (it.sold) c.globalAlpha = 0.35;
    drawCharmCard(c, it.id, x, cy, cw, chh, t);
    c.restore();
    tag(x + cw / 2, it.price, it.sold);
    if (!it.sold) hit('buyCharm', x, cy, cw, chh + 44, i);
  });

  // the bell she has, on a shelf of its own above the stalls
  if (s.bell && BELLS[s.bell.id]) {
    const bl = BELLS[s.bell.id];
    const bwid = 420, bx0 = MID - bwid / 2, by0 = 128;
    const afford = g.run.gold >= s.bell.price && !s.bell.sold;
    c.save();
    if (s.bell.sold) c.globalAlpha = 0.35;
    panel(c, bx0, by0, bwid, 50, 12, '#1d2c49', bl.col);
    txt(c, bl.name.toUpperCase().replace('BELL OF ', 'A BELL OF '), bx0 + 14, by0 + 17, 15, bl.col, 'left', 'd');
    txt(c, bl.text, bx0 + 14, by0 + 17 + lineH(15, 13), 12, '#c8dcf4', 'left', 't');
    panel(c, bx0 + bwid - 72, by0 + 10, 58, 30, 9, afford ? '#3f8f5f' : '#5a3a3a', C.ink);
    txt(c, s.bell.sold ? '—' : String(s.bell.price), bx0 + bwid - 43, by0 + 26, 16, '#ffe6a8', 'center', 'd');
    c.restore();
    if (!s.bell.sold) hit('buyBell', bx0, by0, bwid, 50);
  }

  const by = 484, sw = 170, sg = 10, srow = sw * 6 + sg * 5, sx = MID - srow / 2;
  const btn = (i, id, label, col, dis) => button(c, id, sx + i * (sw + sg), by, sw, 54, label, col, dis);
  btn(0, 'buyHeal', s.heal.sold ? 'MENDED' : 'MEND ALL — ' + s.heal.price, '#3f8f5f', s.heal.sold);
  btn(1, 'buyTemper', s.temper && s.temper.sold ? 'TEMPERED' : 'TEMPER — ' + (s.temper ? s.temper.price : 32),
    '#8f7a3f', !s.temper || s.temper.sold || !temperable(g.run).length);
  btn(2, 'buyScar', s.scar.sold ? 'TENDED' : 'TEND A HURT — ' + s.scar.price, '#8f5f3f', s.scar.sold);
  btn(3, 'buySigil', s.sigil.sold ? 'MARKED' : 'A SIGIL — ' + s.sigil.price, '#5f4a8f', s.sigil.sold);
  btn(4, 'buyBurn', (s.burn && s.burn.sold) ? 'BURNED' : 'BURN A CARD — ' + (s.burn ? s.burn.price : 26), '#8f4a4a',
    !s.burn || s.burn.sold || g.run.deck.length < 3);
  btn(5, 'buyMeal', 'A HOT MEAL — ' + mealPrice(g.run), '#8f6a3f',
    g.run.gold < mealPrice(g.run) || !feedable(g.run).length);
  txt(c, 'temper: +2 attack, +3 health, and the deck stays the size it was · ' +
    'a meal: +1 and +2, as many as you can pay for, dearer every time',
    MID, by + 66, 13, '#7e97b8', 'center', 't');
  const need = caravanNeeds(g.run);
  txt(c, need ? 'the caravan is short of ' + need.name.toLowerCase() + ' — ' + need.why
    : 'the caravan wants for nothing', MID, by + 88, 13, need ? '#ffd166' : '#7de08f', 'center', 't');
  button(c, 'leaveShop', MID - 100, VH - 76, 200, 52, 'BACK TO THE ROAD', '#40527a');
}

function drawCamp(c, t) {
  const g = G;
  drawBackdrop(c, g.run.zone, t);
  drawHud(c, t);
  txt(c, 'CAMP', MID, 84, 40, '#eaf6ff', 'center', 'd');
  txt(c, g.run.quiet ? 'you took the quiet road, and the caravan actually slept'
    : 'one quiet hour before the road', MID, 122, 15, g.run.quiet ? '#8fe0a0' : '#a8c8ea', 'center', 't');
  // fire
  c.save();
  /* THE FIRE HAD NOTHING UNDER IT AND CAST NO LIGHT.

     Photographed at 2400x1080 for the first time this round: a single flame
     about ninety units tall, hanging in the middle of an empty screen with no
     pit, no logs and no glow, on a screen whose subtitle is "one quiet hour
     before the road". At 16:9 it reads as a campfire; on an ultrawide it reads
     as a floating orange leaf. Every other light in this game is additive and
     this one was not lit at all. */
  c.translate(MID, 318);
  c.save();
  c.globalCompositeOperation = 'lighter';
  const glow = c.createRadialGradient(0, -10, 0, 0, -10, 190 + Math.sin(t * 3) * 12);
  glow.addColorStop(0, 'rgba(255,150,60,.30)');
  glow.addColorStop(0.5, 'rgba(255,110,40,.10)');
  glow.addColorStop(1, 'rgba(255,110,40,0)');
  c.fillStyle = glow;
  c.beginPath(); c.arc(0, -10, 190 + Math.sin(t * 3) * 12, 0, TAU); c.fill();
  c.restore();
  // the logs it is burning, so the flame is standing on something
  c.save();
  c.translate(0, 40);
  for (const [dx, ang] of [[-34, 0.34], [34, -0.34], [0, 0.05]]) {
    c.save(); c.translate(dx, ang === 0.05 ? -7 : 0); c.rotate(ang);
    c.beginPath(); rr(c, -40, -8, 80, 16, 8);
    inked(c, '#6b4a33', 3, C.ink);
    c.restore();
  }
  c.restore();
  for (let i = 0; i < 3; i++) {
    const s2 = 1 - i * 0.22, ph = t * 5 + i * 1.7;
    c.beginPath();
    c.moveTo(0, 40 * s2);
    c.quadraticCurveTo(46 * s2 + Math.sin(ph) * 6, -6 * s2, 0, -66 * s2 + Math.sin(ph) * 8);
    c.quadraticCurveTo(-46 * s2 - Math.sin(ph) * 6, -6 * s2, 0, 40 * s2);
    c.fillStyle = ['#ff6a2c', '#ff9a3c', '#ffd166'][i];
    c.globalAlpha = 0.9; c.fill();
  }
  c.restore();
  const opts = [
    { id: 'campRest', label: 'REST', sub: g.run.quiet ? 'the quiet road — mend every warden FULLY' : 'mend every warden 6' },
    { id: 'campTemper', label: 'WORK THE FIRE', sub: 'temper a card, nobody mends' },
    { id: 'campToss', label: 'LIGHTEN THE PACK', sub: 'burn a card from the deck' },
    { id: 'campCharm', label: 'WHITTLE A CHARM', sub: 'attach one of three charms' },
  ];
  const ow = 258, og = 18, otot = opts.length * ow + (opts.length - 1) * og;
  opts.forEach((o, i) => {
    const x = MID - otot / 2 + i * (ow + og);
    panel(c, x, 420, ow, 110, 14, '#1d2c49', '#7fb2e8');
    txt(c, o.label, x + ow / 2, 456, 20, '#eaf6ff', 'center', 'd');
    wrapText(c, o.sub, 13.5, ow - 24).forEach((ln, k) =>
      txt(c, ln, x + ow / 2, 486 + k * lineH(13.5, 17), 13.5, '#9fc0e4', 'center', 't'));
    hit(o.id, x, 420, ow, 110);
  });
}

/* WHAT THE PLACE LOOKS LIKE.

   Every event was three boxes of text on an empty hillside — the flattest
   screen in the game, on the beat that is meant to be its most story-like. Each
   one is drawn now, out of the same primitives everything else uses, so a stop
   on the road looks like a stop on the road. */
function drawEventArt(c, id, x, y, t) {
  c.save();
  c.translate(x, y);
  c.lineJoin = 'round'; c.lineCap = 'round';
  const glow = (col, r, a) => {
    c.save(); c.globalCompositeOperation = 'lighter'; c.globalAlpha = a;
    const gg = c.createRadialGradient(0, 0, 0, 0, 0, r);
    gg.addColorStop(0, col); gg.addColorStop(1, 'rgba(0,0,0,0)');
    c.fillStyle = gg; c.beginPath(); c.arc(0, 0, r, 0, TAU); c.fill(); c.restore();
  };
  if (id === 'shrine') {
    glow('#ffd166', 120, 0.28 + Math.sin(t * 1.4) * 0.06);
    // a standing stone, leaning, with snow on its shoulder and a bowl at its foot
    c.beginPath();
    c.moveTo(-26, 46); c.lineTo(-19, -52); c.lineTo(10, -62); c.lineTo(28, 46);
    c.closePath(); inked(c, '#6c7590', 3, C.ink);
    c.beginPath(); c.moveTo(-19, -52); c.quadraticCurveTo(-4, -68, 10, -62);
    c.lineTo(6, -50); c.quadraticCurveTo(-6, -56, -17, -44); c.closePath();
    inked(c, '#eaf2ff', 2, C.ink);
    c.beginPath(); c.arc(2, 6, 9, 0, TAU); inked(c, '#ffd166', 2.4, C.ink);
    c.beginPath(); c.ellipse(0, 50, 46, 9, 0, 0, TAU);
    c.fillStyle = 'rgba(232,242,255,.5)'; c.fill();
  } else if (id === 'caravan') {
    // a stopped cart, one wheel down, snow gathering on the canvas
    c.beginPath(); rr(c, -54, -34, 108, 50, 10); inked(c, '#d8e4f6', 3, C.ink);
    c.beginPath(); c.moveTo(-54, -34); c.quadraticCurveTo(0, -62, 54, -34);
    c.lineTo(54, -26); c.quadraticCurveTo(0, -52, -54, -26); c.closePath();
    inked(c, '#eaf2ff', 2, C.ink);
    c.beginPath(); rr(c, -58, 14, 116, 12, 5); inked(c, '#8a6a3f', 3, C.ink);
    c.beginPath(); c.arc(-32, 36, 16, 0, TAU); inked(c, '#6f5a3a', 3, C.ink);
    c.save(); c.rotate(0.5);
    c.beginPath(); c.arc(40, 22, 16, 0, TAU); inked(c, '#5a4830', 3, C.ink);
    c.restore();
  } else if (id === 'spring') {
    // steam off warm rock
    for (let i = 0; i < 4; i++) {
      const ph = t * 0.8 + i * 1.5, up = ((ph % 3) / 3);
      c.save(); c.globalAlpha = 0.5 * (1 - up);
      c.beginPath(); c.arc(-30 + i * 20 + Math.sin(ph * 2) * 8, 20 - up * 92, 13 + up * 16, 0, TAU);
      c.fillStyle = '#eaf6ff'; c.fill(); c.restore();
    }
    glow('#8fe3ff', 96, 0.2);
    c.beginPath();
    c.moveTo(-62, 46); c.quadraticCurveTo(-40, 16, -8, 22);
    c.quadraticCurveTo(30, 10, 62, 46); c.closePath();
    inked(c, '#5d6a86', 3, C.ink);
    c.beginPath(); c.ellipse(0, 34, 30, 9, 0, 0, TAU); inked(c, '#7fd8e8', 2.4, C.ink);
  } else if (id === 'bell') {
    // a bell hung in a dead tree, swinging a little
    c.strokeStyle = '#4a4030'; c.lineWidth = 8;
    c.beginPath(); c.moveTo(-46, 58); c.lineTo(-30, -30); c.lineTo(-6, -54); c.stroke();
    c.lineWidth = 5;
    c.beginPath(); c.moveTo(-30, -30); c.lineTo(-58, -50); c.stroke();
    c.beginPath(); c.moveTo(-14, -44); c.lineTo(34, -50); c.stroke();
    c.save();
    c.translate(24, -50); c.rotate(Math.sin(t * 1.6) * 0.14);
    c.beginPath();
    c.moveTo(-20, 34); c.quadraticCurveTo(-18, -6, 0, -12);
    c.quadraticCurveTo(18, -6, 20, 34); c.closePath();
    inked(c, '#ffd166', 3, C.ink);
    c.beginPath(); c.arc(0, 38, 5, 0, TAU); inked(c, '#c9a24a', 2, C.ink);
    c.restore();
  } else if (id === 'shields') {
    /* A line of boards driven into the ice, edge to edge, none of them facing
       the road — the whole point of the stop is that somebody stood the wrong
       way round on purpose, so the line reads as a wall seen from behind. */
    glow('#8fa8c8', 110, 0.16 + Math.sin(t * 1.1) * 0.04);
    const board = (bx, h, lean, col) => {
      c.save();
      c.translate(bx, 46);
      c.rotate(lean);
      c.beginPath();
      c.moveTo(-13, 0); c.lineTo(-11, -h); c.quadraticCurveTo(0, -h - 12, 11, -h);
      c.lineTo(13, 0); c.closePath();
      inked(c, col, 2.6, C.ink);
      // a boss and two rivets, so it reads as a shield rather than a plank
      c.beginPath(); c.arc(0, -h * 0.55, 5, 0, TAU); inked(c, '#cfd8e8', 2, C.ink);
      c.beginPath(); c.arc(-6, -h * 0.2, 1.8, 0, TAU); c.fillStyle = C.ink; c.fill();
      c.beginPath(); c.arc(6, -h * 0.2, 1.8, 0, TAU); c.fill();
      c.restore();
    };
    const cols = ['#6f7f96', '#8a7a62', '#7d8fa8', '#95866c', '#67788f'];
    for (let i = 0; i < 5; i++) {
      const bx = -56 + i * 28;
      board(bx, 62 + ((i * 7) % 13), ((i % 3) - 1) * 0.07, cols[i]);
    }
    // snow banked along the foot of the line
    c.beginPath();
    c.moveTo(-84, 48); c.quadraticCurveTo(-20, 36, 20, 44);
    c.quadraticCurveTo(58, 50, 86, 42); c.lineTo(86, 56); c.lineTo(-84, 56); c.closePath();
    inked(c, '#eaf2ff', 2, C.ink);
  } else {
    // somebody else's fire
    glow('#ff9a3c', 130, 0.3 + Math.sin(t * 3) * 0.07);
    for (let i = 0; i < 3; i++) {
      const s2 = 1 - i * 0.24, ph = t * 5 + i * 1.7;
      c.beginPath();
      c.moveTo(0, 34 * s2);
      c.quadraticCurveTo(38 * s2 + Math.sin(ph) * 6, -6 * s2, 0, -58 * s2 + Math.sin(ph) * 8);
      c.quadraticCurveTo(-38 * s2 - Math.sin(ph) * 6, -6 * s2, 0, 34 * s2);
      c.fillStyle = ['#ff6a2c', '#ff9a3c', '#ffd166'][i];
      c.globalAlpha = 0.92; c.fill();
    }
    c.globalAlpha = 1;
    c.strokeStyle = '#5a4830'; c.lineWidth = 7; c.lineCap = 'round';
    c.beginPath(); c.moveTo(-38, 44); c.lineTo(30, 30); c.stroke();
    c.beginPath(); c.moveTo(-30, 30); c.lineTo(38, 44); c.stroke();
  }
  c.restore();
}

function drawEvent(c, t) {
  const g = G, ev = g.ui.event && g.ui.event.def;
  drawBackdrop(c, g.run.zone, t);
  drawHud(c, t);
  if (!ev) return;
  txt(c, ev.title, MID, 92, 36, '#eaf6ff', 'center', 'd');
  const lines = wrapText(c, ev.text, 17, 860);
  /* THE ART GOES DOWN BEFORE THE WORDS GO ON, and it starts below them.

     The shrine's snow cap was painted over the middle of "something in the dark
     below it is still listening" — the art was pinned at a constant y and drawn
     AFTER the blurb, so a two-line blurb ran into a stone that reaches 62 units
     above its own centre. Both halves are fixed: the art is placed off the
     bottom of the text rather than off a number, and it is drawn first so the
     words win whatever happens. */
  const blurbBottom = 142 + (lines.length - 1) * lineH(17, 24) + 12;
  const artY = Math.max(252, blurbBottom + 86);
  c.save();
  c.globalAlpha = 0.35; c.fillStyle = '#0d1830';
  c.beginPath(); c.ellipse(MID, artY + 62, 96, 17, 0, 0, TAU); c.fill();
  c.restore();
  c.save();
  c.translate(MID, artY); c.scale(1.35, 1.35);
  drawEventArt(c, ev.id, 0, 0, t);
  c.restore();
  lines.forEach((ln, i) => txt(c, ln, MID, 142 + i * lineH(17, 24), 17, '#bcd4f0', 'center', 't'));

  const n = ev.opts.length;
  const w = 320, gap = 24;
  const total = n * w + (n - 1) * gap;
  ev.opts.forEach((o, i) => {
    const x = MID - total / 2 + i * (w + gap), y = Math.max(356, artY + 118);
    const able = !o.can || o.can(g);
    const hovered = UI.hover && UI.hover.id === 'eventOpt' && UI.hover.data === i;
    panel(c, x, y - (hovered && able ? 6 : 0), w, 150, 14, able ? '#1d2c49' : '#2a3145', able ? '#7fb2e8' : '#4a5570');
    wrapText(c, o.label, 21, w - 34).forEach((ln, k) =>
      txt(c, ln, x + w / 2, y + 46 + k * lineH(21, 24) - (hovered && able ? 6 : 0), 21, able ? '#eaf6ff' : '#7a86a0', 'center', 'd'));
    if (o.sub) wrapText(c, o.sub, 14, w - 34).forEach((ln, k) =>
      txt(c, ln, x + w / 2, y + 104 + k * lineH(14, 18) - (hovered && able ? 6 : 0), 14, able ? '#9fc0e4' : '#67718a', 'center', 't'));
    if (able) hit('eventOpt', x, y, w, 150, i);
  });
}

/* One small drawing per kindness, out of the same primitives as everything
   else: a kettle, a purse, a whetstone, a coat, a rope, a pack. */
function drawBlessIcon(c, art, t) {
  const col = art.col;
  c.lineJoin = 'round'; c.lineCap = 'round';
  if (art.kind === 'kettle') {
    c.beginPath(); rr(c, -22, -6, 44, 30, 10); inked(c, col, 3, C.ink);
    c.beginPath(); c.moveTo(-22, 2); c.quadraticCurveTo(-36, 6, -30, 18); c.stroke();
    c.beginPath(); c.moveTo(22, 0); c.quadraticCurveTo(34, -2, 32, 10); c.stroke();
    c.beginPath(); c.moveTo(-10, -6); c.quadraticCurveTo(0, -18, 10, -6); c.stroke();
    for (let i = 0; i < 2; i++) {
      c.save(); c.globalAlpha = 0.55;
      c.beginPath(); c.arc(-4 + i * 10, -22 - Math.sin(t * 2 + i) * 6, 5, 0, TAU);
      c.fillStyle = '#eaf6ff'; c.fill(); c.restore();
    }
  } else if (art.kind === 'purse') {
    c.beginPath();
    c.moveTo(-20, -8); c.quadraticCurveTo(-26, 26, 0, 28);
    c.quadraticCurveTo(26, 26, 20, -8); c.closePath();
    inked(c, col, 3, C.ink);
    c.beginPath(); c.moveTo(-20, -8); c.quadraticCurveTo(0, -22, 20, -8); c.stroke();
    c.beginPath(); c.arc(0, 8, 6, 0, TAU); inked(c, '#c9a24a', 2, C.ink);
  } else if (art.kind === 'stone') {
    c.beginPath(); rr(c, -26, -10, 52, 22, 9); inked(c, col, 3, C.ink);
    c.strokeStyle = '#9fb0c8'; c.lineWidth = 2;
    c.beginPath(); c.moveTo(-16, -2); c.lineTo(16, -2); c.stroke();
    c.save(); c.rotate(-0.5);
    c.beginPath(); c.moveTo(-4, -26); c.lineTo(4, -26); c.lineTo(2, 4); c.lineTo(-2, 4);
    c.closePath(); inked(c, '#e8eef8', 2, C.ink); c.restore();
  } else if (art.kind === 'shield') {
    c.beginPath();
    c.moveTo(0, -28); c.lineTo(24, -16);
    c.quadraticCurveTo(22, 20, 0, 30);
    c.quadraticCurveTo(-22, 20, -24, -16); c.closePath();
    inked(c, col, 3, C.ink);
    c.strokeStyle = '#dfeaff'; c.lineWidth = 2;
    c.beginPath(); c.moveTo(0, -18); c.lineTo(0, 18); c.stroke();
  } else if (art.kind === 'rope') {
    c.strokeStyle = col; c.lineWidth = 5;
    c.beginPath();
    for (let i = 0; i <= 14; i++) {
      const yy = -26 + (i / 14) * 52, xx = Math.sin(i * 0.85) * 13;
      i ? c.lineTo(xx, yy) : c.moveTo(xx, yy);
    }
    c.stroke();
    c.beginPath(); c.arc(Math.sin(0) * 13, -26, 4, 0, TAU); c.fillStyle = col; c.fill();
  } else {
    // a pack: a bundle with a strap
    c.beginPath(); rr(c, -22, -18, 44, 44, 12); inked(c, col, 3, C.ink);
    c.strokeStyle = C.ink; c.lineWidth = 3;
    c.beginPath(); c.moveTo(-22, -2); c.lineTo(22, -2); c.stroke();
    c.beginPath(); c.moveTo(-8, -18); c.quadraticCurveTo(0, -32, 8, -18); c.stroke();
  }
}

function drawRest(c, t) {

    wrapText(c, bl.sub, 14, w - 40).forEach((ln, k) =>
