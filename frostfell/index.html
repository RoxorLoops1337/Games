/* ================================================== 10. input ============ */

function press(id, data) {
  const g = G;
  sfx('tap');
  switch (id) {
    case 'tribe': newRun(g, data); return;
    case 'continue': if (!loadRun(g)) newRun(g, 'hearth'); return;
    case 'node': enterNode(g, data); return;
    case 'bell': ringBell(g); return;
    case 'pass': passTurn(g); return;
    case 'order': UI.order = !UI.order; return;
    case 'menu': UI.deck = true; return;
    case 'deckClose': UI.deck = false; return;
    case 'deckcard': UI.inspect = data; return;
    case 'inspectClose': UI.inspect = null; return;
    case 'endHome': g.screen = 'title'; g.run = null; g.battle = null; return;
    case 'reward': {
      const r = g.ui.reward;
      if (r.taken) return;
      takeCard(g, r.cards[data]);
      r.taken = true;
      if (!r.charms.length) advance(g);
      return;
    }
    case 'rewardCharm': {
      const r = g.ui.reward;
      if (r.charmTaken) return;
      const cid = r.charms[data];
      pickTargetForCharm(g, cid, () => {
        r.charmTaken = true;
        if (r.taken || !r.cards.length) advance(g);
      });
      return;
    }
    case 'rewardSkip': advance(g); return;
    case 'buyCard': buy(g, 'card', data); return;
    case 'buyCharm': {
      const it = g.ui.shop.charms[data];
      if (!it || it.sold || g.run.gold < it.price) return;
      pickTargetForCharm(g, it.id, () => { g.run.gold -= it.price; it.sold = true; }, true);
      return;
    }
    case 'buyHeal': buy(g, 'heal'); return;
    case 'buyScar': {
      const hurtOnes = g.run.deck.concat([g.run.leader]).filter((cd) => cd.injured || cd.dmg > 0);
      if (!hurtOnes.length || g.ui.shop.scar.sold || g.run.gold < g.ui.shop.scar.price) return;
      openChooser('TEND WHICH WARDEN?', hurtOnes.map((cd) => ({ card: cd })), (i) => {
        const cd = hurtOnes[i];
        cd.injured = false; cd.dmg = 0;
        g.run.gold -= g.ui.shop.scar.price;
        g.ui.shop.scar.sold = true;
        UI.choose = null;
        sfx('heal');
      }, { cancel: 'NEVER MIND' });
      return;
    }
    case 'leaveShop': advance(g); return;
    case 'campRest': campChoose(g, 'rest'); return;
    case 'campToss': {
      openChooser('BURN WHICH CARD?', g.run.deck.map((cd) => ({ card: cd })), (i) => {
        const uid = g.run.deck[i].uid;
        UI.choose = null;
        campChoose(g, 'toss', uid);
      }, { cancel: 'NEVER MIND' });
      return;
    }
    case 'campCharm': {
      const three = sample(Object.keys(CHARMS), 3);
      openChooser('WHICH CHARM?', three.map((cid) => ({ charm: cid })), (i) => {
        pickTargetForCharm(g, three[i], () => { g.ui.camp.done = false; campChoose(g, 'charm', { charm: three[i], uid: UI.lastCharmUid }); });
      }, { cancel: 'NEVER MIND' });
      return;
    }
    case 'chooseCancel': UI.choose = null; return;
    default: return;
  }
}

/* Two-step: pick the charm, then pick who wears it. */
function pickTargetForCharm(g, charmId, after, chargeLater) {
  const all = [g.run.leader].concat(g.run.deck.filter((cd) => cd.type === 'unit'));
  openChooser('GIVE ' + (CHARMS[charmId] || SCARS[charmId]).name.toUpperCase() + ' TO WHOM?',
    all.map((cd) => ({ card: cd })), (i) => {
      UI.lastCharmUid = all[i].uid;
      attachCharm(all[i], CHARMS[charmId]);
      UI.choose = null;
      if (after) after();
      saveRun(g.run);
    }, { cancel: 'NEVER MIND' });
}

function onDown(x, y) {
  const g = G;
  UI.pointer = { x, y };
  const h = hitAt(x, y);
  UI.hover = h;
  if (UI.inspect) { if (h && h.id === 'inspectClose') press(h.id); else UI.inspect = null; return; }
  if (UI.choose) {
    if (!h) return;
    if (h.id === 'choose') { const cb = UI.choose.onPick; cb(h.data); }
    else if (h.id === 'chooseCancel') UI.choose = null;
    return;
  }
  if (UI.deck) {
    if (h && (h.id === 'deckClose' || h.id === 'deckcard')) press(h.id, h.data);
    else UI.deck = false;
    return;
  }
  if (!h) return;
  if (h.id === 'hand') {
    const card = g.battle.hand[h.data];
    UI.drag = { card, idx: h.data, x, y, sx: x, sy: y, moved: false };
    return;
  }
  if (h.id === 'unit' && h.data.side === 'p' && g.battle && !g.battle.busy) {
    UI.drag = { unit: h.data, x, y, sx: x, sy: y, moved: false };
    return;
  }
  press(h.id, h.data);
}

function onMove(x, y) {
  UI.pointer = { x, y };
  if (UI.drag) {
    UI.drag.x = x; UI.drag.y = y;
    if (Math.hypot(x - UI.drag.sx, y - UI.drag.sy) > 12) UI.drag.moved = true;
  }
  UI.hover = hitAt(x, y);
}

function onUp(x, y) {
  const g = G, d = UI.drag;
  UI.drag = null;
  if (!d) return;
  const h = hitAt(x, y);
  if (!d.moved) {
    if (d.card) UI.inspect = d.card;
    return;
  }
  if (d.card) {
    const idx = g.battle.hand.indexOf(d.card);
    if (idx < 0) return;
    if (d.card.type === 'unit') {
      if (h && h.id === 'slot') playCard(g, idx, h.data);
      else sfx('tap');
    } else {
      const tg = CARDS[d.card.def].target;
      if (tg === 'none') playCard(g, idx, null);
      else if (h && h.id === 'unit') playCard(g, idx, h.data);
    }
  } else if (d.unit) {
    if (h && h.id === 'slot') moveUnit(g, d.unit, h.data.lane, h.data.col);
    else if (h && h.id === 'unit' && h.data.side === 'p') moveUnit(g, d.unit, h.data.lane, h.data.col);
  }
}

/* ================================================== 12. loop + boot ====== */

function layoutUnits(dt) {
  const b = G.battle;
  if (!b) return;
  for (let i = b.units.length - 1; i >= 0; i--) {
    const u = b.units[i];
    const p = slotPos(u.side, u.lane, u.col);
    if (!u.px) { u.px = p.x + (u.side === 'p' ? -260 : 260); u.py = p.y; }
    const k = Math.min(1, dt * 11);
    u.px += (p.x - u.px) * k;
    u.py += (p.y - u.py) * k;
    if (u.lungeT > 0) {
      u.lungeT = Math.max(0, u.lungeT - dt * 5.5);
      const a = Math.sin((1 - u.lungeT) * Math.PI) * 26;
      u.px += u.lungeX * a; u.py += u.lungeY * a;
    }
    u.sq *= Math.pow(0.02, dt);
    u.flash = Math.max(0, u.flash - dt * 3.4);
    if (u.hitT > 0) u.hitT = Math.max(0, u.hitT - dt * 3);
    if (u.born) u.born += dt;
    if (!u.alive) {
      u.dead += dt;
      if (u.dead > 0.75) b.units.splice(i, 1);
    }
  }
}

function update(dt) {
  G.t += dt;
  stepFx(dt);
  if (Q.wait > 0) Q.wait -= dt;
  let guard = 0;
  while (Q.wait <= 0 && Q.items.length && guard++ < 64) {
    const it = Q.items.shift();
    if (it.fn) it.fn();
    Q.wait += it.d || 0;
  }
  layoutUnits(dt);
}

function drawFx(c) {
  for (const r of rings) {
    const k = r.t / r.life;
    c.save(); c.globalAlpha = (1 - k) * 0.8;
    c.strokeStyle = r.col; c.lineWidth = 4 * (1 - k) + 1;
    c.beginPath(); c.arc(r.x, r.y, r.r0 + k * 60, 0, TAU); c.stroke();
    c.restore();
  }
  for (const p of parts) {
    const k = p.t / p.life;
    c.globalAlpha = 1 - k;
    c.fillStyle = p.col;
    c.beginPath(); c.arc(p.x, p.y, p.r * (1 - k * 0.5), 0, TAU); c.fill();
  }
  c.globalAlpha = 1;
  for (const f of floats) {
    const k = f.t / f.life;
    c.globalAlpha = k > 0.7 ? (1 - k) / 0.3 : 1;
    txt(c, f.text, f.x, f.y, f.sz * (1 + (1 - Math.min(1, f.t * 6)) * 0.4), f.col, 'center', 'd');
  }
  c.globalAlpha = 1;
}

function render() {
  const c = ctx;
  if (!c) return;
  hits = [];
  const t = G.t;
  c.setTransform(DPR, 0, 0, DPR, 0, 0);
  c.clearRect(0, 0, VW, VH);
  c.save();
  if (shakeState.mag > 0.1) {
    c.translate(Math.sin(shakeState.t * 1.7) * shakeState.mag, Math.cos(shakeState.t * 2.3) * shakeState.mag);
  }
  switch (G.screen) {
    case 'title': drawTitle(c, t); break;
    case 'trail': drawTrail(c, t); break;
    case 'battle': drawBattle(c, t); break;
    case 'reward': drawReward(c, t); break;
    case 'shop': drawShop(c, t); break;
    case 'camp': drawCamp(c, t); break;
    case 'gameover': drawEnd(c, t, false); break;
    case 'victory': drawEnd(c, t, true); break;
    default: drawTitle(c, t); break;
  }
  drawFx(c);
  if (UI.choose) drawChooser(c, t);
  if (UI.deck && G.run) drawDeckView(c, t);
  if (UI.inspect) drawInspect(c, t);
  c.restore();
  if (flashState.a > 0.01) {
    c.save();
    c.globalAlpha = Math.min(0.7, flashState.a);
    c.fillStyle = flashState.col;
    c.fillRect(0, 0, VW, VH);
    c.restore();
  }
}

function resize() {
  if (!canvas) return;
  const w = window.innerWidth, h = window.innerHeight;
  document.body.classList.toggle('portrait', h > w * 1.02);
  const scale = Math.min(w / VW, h / VH);
  DPR = Math.min(window.devicePixelRatio || 1, 2.5);
  canvas.width = Math.round(VW * DPR);
  canvas.height = Math.round(VH * DPR);
  canvas.style.width = Math.round(VW * scale) + 'px';
  canvas.style.height = Math.round(VH * scale) + 'px';
  if (ctx) ctx.imageSmoothingEnabled = true;
}

function evPos(e) {
  const r = canvas.getBoundingClientRect();
  const p = e.touches && e.touches.length ? e.touches[0] : (e.changedTouches && e.changedTouches.length ? e.changedTouches[0] : e);
  return { x: (p.clientX - r.left) / r.width * VW, y: (p.clientY - r.top) / r.height * VH };
}

function boot() {
  canvas = document.getElementById('game');
  ctx = canvas.getContext('2d');
  initSnow();
  loadMeta();
  resize();
  window.addEventListener('resize', resize);
  window.addEventListener('orientationchange', () => setTimeout(resize, 120));

  const down = (e) => { e.preventDefault(); const p = evPos(e); onDown(p.x, p.y); };
  const move = (e) => { e.preventDefault(); const p = evPos(e); onMove(p.x, p.y); };
  const up = (e) => { e.preventDefault(); const p = evPos(e); onUp(p.x, p.y); };
  canvas.addEventListener('pointerdown', down);
  canvas.addEventListener('pointermove', move);
  canvas.addEventListener('pointerup', up);
  canvas.addEventListener('pointercancel', up);

  const go = document.getElementById('bootgo');
  const start = () => {
    document.getElementById('boot').classList.add('gone');
    audioInit();
    // Landscape is the only orientation the game is authored for; ask nicely.
    const el = document.documentElement;
    const rq = el.requestFullscreen || el.webkitRequestFullscreen;
    if (rq) {
      try {
        const r = rq.call(el);
        if (r && r.then) r.then(lockLandscape).catch(lockLandscape);
        else lockLandscape();
      } catch (err) { lockLandscape(); }
    } else lockLandscape();
    setTimeout(resize, 200);
  };
  if (go) go.addEventListener('click', start);

  let last = (typeof performance !== 'undefined' ? performance.now() : Date.now());
  const frame = (now) => {
    const dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    update(dt);
    render();
    requestAnimationFrame(frame);
  };
  requestAnimationFrame(frame);
}
function lockLandscape() {
  try {
    if (screen.orientation && screen.orientation.lock) screen.orientation.lock('landscape').catch(() => {});
  } catch (e) {}
}

function loadMeta() {
  const raw = store.get(SAVE_META);
  if (!raw) return;
  try {
    const o = JSON.parse(raw);
    if (o && typeof o === 'object') G.meta = Object.assign(G.meta, o);
    if (!Array.isArray(G.meta.unlocked) || !G.meta.unlocked.length) G.meta.unlocked = ['hearth', 'frost'];
  } catch (e) {}
}
function saveMeta() { store.set(SAVE_META, JSON.stringify(G.meta)); }

/* ------------------------------------------------------------- exports --- */
/* The suites drive the real functions through this, never a re-implementation. */
window.FF = {
  G, C, CARDS, CHARMS, SCARS, FOES, ZONES, TRIBES, STATUS, STATUS_ORDER, KEYWORD, STARTERS,
  LANES, COLS, HAND, BELL_CHARGE, VW, VH, UI,
  mkCard, mkUnit, mkFoeCard, rebuildCard, attachCharm,
  units, playerUnits, enemyUnits, unitAt, slotFree, freeSlots, laneOf, turnOrder,
  targetFor, frontTarget, laneTargets, neighbours,
  addStatus, stat, spend, hurt, heal, die, triggerUnit, attackOnce, tickCounter,
  resolveTurn, ringBell, passTurn, moveUnit, canPlay, playCard, drawToHand,
  startBattle, endBattle, checkOver, summon, buildEncounter, foeScale,
  newRun, genTrail, enterNode, advance, rollReward, takeCard, takeCharm, rollShop, buy, campChoose,
  saveRun, loadRun, saveMeta, loadMeta, store,
  handSize, seed: (n) => { RNG = mulberry(n >>> 0); }, rnd: () => rnd(),
  render: () => render(), update: (dt) => update(dt), drainAll,
  press, onDown, onMove, onUp, hitAt, hits: () => hits,
  drawCreature, drawBackdrop, drawItemIcon,
  setCtx: (c) => { ctx = c; initSnow(); },
};

if (!HEADLESS) {
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
}
})();
