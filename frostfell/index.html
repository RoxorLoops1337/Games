  const s = g.ui.shop, run = g.run;
  // A meal is the one ware sold away from the counter, so it may not require one.
  if (!s && kind !== 'meal') return false;
  const takeGold = (n) => { if (run.gold < n) return false; run.gold -= n; run.everBought = 1; return true; };
  if (kind === 'card') {
    const it = s.cards[idx];
    if (!it || it.sold || !takeGold(it.price)) return false;
    it.sold = true;
    takeCard(g, it.id);
    /* AND SHE TAKES ONE OFF YOUR HANDS.

       Buying a card measured as a trap for three iterations running — a
       penniless caravan beat a well-funded one by nine points, because every
       purchase was one more card between the deck and the card it wanted. A
       sale that lets you leave one behind is deck-neutral: you are trading up
       rather than bulking out, which is what buying a card was always supposed
       to feel like. Declining is allowed; it is just rarely right. */
    if (run.deck.length > 3) {
      const bought = run.deck[run.deck.length - 1];
      const others = run.deck.filter((c) => c.uid !== bought.uid);
      openChooser('AND SHE WILL TAKE ONE OFF YOUR HANDS', others.map((cd) => ({ card: cd })), (i) => {
        const j = run.deck.findIndex((c) => c.uid === others[i].uid);
        if (j >= 0) {
          const gone = run.deck.splice(j, 1)[0];
          sfx('burn');
          fx.toast(gone.name.toUpperCase() + ' LEFT ON THE COUNTER', '#ff9aa5');
          run.log.push(gone.name + ' was left on the trader\'s counter.');
        }
        UI.choose = null;
      }, { cancel: 'KEEP THEM ALL', sub: 'part of the sale — a deck that stays the same size draws what it needs' });
    }
    return true;
  }
  if (kind === 'charm') {
    const it = s.charms[idx];
    if (!it || it.sold || run.gold < it.price) return false;
    if (!takeCharm(g, it.id, arg)) return false;
    run.gold -= it.price; it.sold = true;
    run.charmsBought = (run.charmsBought || 0) + 1;
    // and the one still on the counter goes up with it
    for (const other2 of s.charms) if (!other2.sold) other2.price = Math.round(other2.price * (1 + CHARM_STEP / 2));
    return true;
  }
  if (kind === 'heal') {
    if (s.heal.sold || !takeGold(s.heal.price)) return false;
    s.heal.sold = true;
    run.deck.concat([run.leader]).forEach((c) => { c.dmg = 0; });
    sfx('heal'); return true;
  }
  if (kind === 'bell') {
    const bl = s.bell && BELLS[s.bell.id];
    if (!bl || s.bell.sold || !takeGold(s.bell.price)) return false;
    bl.apply(run);
    run.bells = (run.bells || []).concat([bl.id]);
    s.bell.sold = true;
    sfx('bellbuy');
    fx.toast(bl.name.toUpperCase(), bl.col);
    run.log.push('The trader had a bell, and it was bought.');
    return true;
  }
  if (kind === 'temper') {
    const card = run.deck.concat([run.leader]).find((c) => c.uid === arg);
    if (!card || s.temper.sold || card.charms.indexOf('blessed') >= 0) return false;
    if (tempered(run) >= TEMPER_CAP) return false;
    if (!takeGold(s.temper.price)) return false;
    if (!temperCard(g, card)) { run.gold += s.temper.price; return false; }
    s.temper.sold = true;
    return true;
  }
  if (kind === 'meal') {
    const card = feedable(run).find((c) => c.uid === arg);
    if (!card) return false;
    const cost = mealPrice(run);
    if (!takeGold(cost)) return false;
    card.bonusAtk = (card.bonusAtk || 0) + 1;
    card.bonusHp = (card.bonusHp || 0) + 2;
    rebuildCard(card);
    run.meals = (run.meals || 0) + 1;
    sfx('heal');
    fx.toast(card.name.toUpperCase() + ' EATS WELL', '#ffb45c');
    run.log.push(card.name + ' was fed at the trader.');
    return true;
  }
  if (kind === 'scar') {
    const card = run.deck.concat([run.leader]).find((c) => c.uid === arg);
    if (!card || s.scar.sold) return false;
    const i = card.charms.findIndex((id) => SCARS[id]);
    if (i < 0 || !takeGold(s.scar.price)) return false;
    card.charms.splice(i, 1);
    rebuildCard(card);
    s.scar.sold = true;
    sfx('get'); return true;
  }
  return false;
}

/* ---------------------------------------------------------------- camp --- */
function campChoose(g, what, arg) {
  const run = g.run;
  if (g.ui.camp && g.ui.camp.done) return false;
  if (what === 'rest') {
    // the quiet road: a camp reached by walking past a fight mends everything
    const mend = run.quiet ? 999 : Math.max(1, Math.round(6 * (run.campMul || 1)));
    run.deck.concat([run.leader]).forEach((c) => { c.dmg = Math.max(0, c.dmg - mend); });
    if (run.quiet) run.log.push('The quiet road: the whole line slept, and woke whole.');
    run.quiet = 0;
    sfx('heal');
  } else if (what === 'charm') {
    const ch = CHARMS[arg && arg.charm];
    const card = run.deck.concat([run.leader]).find((c) => c.uid === (arg && arg.uid));
    if (!ch || !card) return false;
    attachCharm(card, ch);
    sfx('get');
  } else if (what === 'toss') {
    const i = run.deck.findIndex((c) => c.uid === arg);
    if (i < 0) return false;
    run.deck.splice(i, 1);
    sfx('get');
  } else return false;
  g.ui.camp.done = true;
  advance(g);
  return true;
}

/* --------------------------------------------------------------- saving -- */
const SAVE_RUN = 'ff_run_v1';
const SAVE_META = 'ff_meta_v1';
/* `mute` exists for the probe alone and nothing in the game ever sets it.
   Profiling the balance probe put `saveRun` at the TOP of the flame graph —
   7.6% of the whole run, spent serialising a deck, a trail and a log to a
   stubbed localStorage that no bot ever reads back. The save/load suites do not
   set this, so they still exercise the real thing. */
const store = {
  mute: false,
  get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set(k, v) { if (store.mute) return; try { localStorage.setItem(k, v); } catch (e) {} },
  del(k) { if (store.mute) return; try { localStorage.removeItem(k); } catch (e) {} },
};
function serCard(c) { return { u: c.uid, d: c.def, c: c.charms.slice(), g: c.dmg || 0, i: !!c.injured, s: !!c.sigil, b: !!c.blessed,
  ba: c.bonusAtk || 0, bp: c.bonusHp || 0 }; }
function desCard(o) {
  const c = mkCard(o.d);
  c.uid = o.u; c.charms = (o.c || []).slice(); c.dmg = o.g || 0;
  c.injured = !!o.i; c.sigil = !!o.s; c.blessed = !!o.b;
  c.bonusAtk = o.ba || 0; c.bonusHp = o.bp || 0;
  rebuildCard(c);
  UID = Math.max(UID, c.uid + 1);
  return c;
}
function saveRun(run) {
  /* The mute has to be read HERE and not in `store.set`: the first cut muted
     the store and the probe got 2% faster, because the expensive half is
     building this object and stringifying it, which happens before the store is
     ever asked. */
  if (store.mute) return;
  if (!run) { store.del(SAVE_RUN); return; }
  store.set(SAVE_RUN, JSON.stringify({
    v: 1, seed: run.seed, tribe: run.tribe, zone: run.zone, step: run.step, gold: run.gold,
    br: run.bonusRedraw, leader: serCard(run.leader), deck: run.deck.map(serCard),
    trail: run.trail, path: run.path, log: run.log.slice(-8),
    bells: run.bells || [], bh: run.bonusHand || 0, bc: !!run.bellCharged, wb: run.waveBonus || 0,
    purse: run.purse || 1, mend: run.mend || 0, bosses: run.bosses || {},
    course: run.course || null, redeals: run.redeals || 0, passed: run.passed || 0,
    winters: run.winters || [], wpts: run.winterPts || 0, prices: run.prices || 1, killedBy: run.killedBy || null,
    campMul: run.campMul || 1, extraFoe: run.extraFoe || 0, bellSlow: run.bellSlow || 0,
    foeMul: run.foeMul || 1, fell: run.fellThisZone || 0,
    // The trail reads both of these now: meals price the counter, fights price
    // the trail's mercy. A reloaded run that forgot them would be a different run.
    meals: run.meals || 0, fought: run.fights || 0, foll: run.followed || 0,
  }));
}
function loadRun(g) {
  const raw = store.get(SAVE_RUN);
  if (!raw) return null;
  try {
    const o = JSON.parse(raw);
    if (!o || o.v !== 1) return null;
    const run = {
      seed: o.seed, tribe: o.tribe, zone: o.zone, step: o.step, gold: o.gold, bonusRedraw: o.br || 0,
      leader: desCard(o.leader), deck: (o.deck || []).map(desCard), trail: o.trail, path: o.path || [],
      log: o.log || [], kills: 0, node: null,
      bells: o.bells || [], bonusHand: o.bh || 0, bellCharged: !!o.bc, waveBonus: o.wb || 0,
      purse: o.purse || 1, mend: o.mend || 0, bosses: o.bosses || {},
      course: o.course || null, redeals: o.redeals || 0, passed: o.passed || 0,
      winters: o.winters || [], winterPts: o.wpts || 0, prices: o.prices || 1, killedBy: o.killedBy || null,
      campMul: o.campMul || 1, extraFoe: o.extraFoe || 0, bellSlow: o.bellSlow || 0,
      foeMul: o.foeMul || 1, fellThisZone: o.fell || 0,
      meals: o.meals || 0, fights: o.fought || 0, followed: o.foll || 0,
    };
    RNG = mulberry((run.seed + run.step * 7919 + run.zone * 104729) >>> 0);
    g.run = run;
    g.battle = null;
    g.screen = 'trail';
    return run;
  } catch (e) { return null; }
}
/* ==================================================== 8. juice =========== */

/* Everything in here is presentation. The rules never read it, and headless
   runs let it accumulate harmlessly into arrays nobody draws. */
const parts = [];
const floats = [];
const rings = [];
const flyers = [];   // cards on their way to the discard pile
const shakeState = { mag: 0, t: 0 };
const flashState = { a: 0, col: '#ffffff' };
let snowflakes = null;

/* What a body does when it stops. Ice comes apart, metal falls over, fur goes
   up in a puff — one fade for everybody was the last thing in here that looked
   like placeholder. */
function deathKind(art) {
  if (!art) return 'fall';
  if (art.skin === 'ice' || art.ears === 'shard') return 'shatter';
  if (art.skin === 'metal') return 'clank';
  if (art.skin === 'fur') return 'puff';
  if (art.shape === 'wisp' || art.wings) return 'scatter';
  return 'fall';
}

/* NOTHING TO DRAW ON, NOTHING TO DRAW.

   Profiling the balance probe — the tool this project runs every round, twelve
   suites and several minutes of it — found that FORTY PER CENT of its samples
   were fx.pop and fx.burst, plus the garbage collection they cause. Building
   floating text and particle objects, sixty and four hundred at a time, for a
   run with no screen attached to it.

   The gate is `ctx`, not a test flag: a browser always has one, so this cannot
   change what a player sees, and the render suite sets one before it drives
   draw() so the effects are still exercised where it matters. What it removes
   is work done for nobody. Rules must never read these arrays — they are
   presentation, and section 8 says so — which is what makes this safe. */
const fx = {
  pop(u, text, col) {
    if (!u || !ctx) return;
    floats.push({ x: u.px || 0, y: (u.py || 0) - 30, vy: -46, life: 1.0, t: 0, text: String(text), col: col || C.snow, sz: 22 });
    if (floats.length > 60) floats.shift();
  },
  toast(text, col) {
    if (!ctx) return;
    floats.push({ x: 640, y: 250, vy: -18, life: 1.6, t: 0, text: String(text), col: col || C.gold, sz: 34 });
  },
  burst(u, col, n, kind) {
    if (!u || !ctx) return;
    for (let i = 0; i < (n || 10); i++) {
      const a = rnd() * TAU, s = 40 + rnd() * 190;
      parts.push({ x: u.px || 0, y: u.py || 0, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 40,
        life: 0.4 + rnd() * 0.5, t: 0, col, r: 2 + rnd() * 4, g: 420,
        sh: kind || 'dot', spin: rnd() * TAU, vs: (rnd() - 0.5) * 12 });
    }
    if (parts.length > 400) parts.splice(0, parts.length - 400);
  },
  /* A death worth watching: the debris matches what the thing was made of. */
  demise(u) {
    const k = deathKind(u.art);
    u.deathKind = k;
    if (k === 'shatter') {
      fx.burst(u, '#dff0ff', 26, 'shard');
      fx.ring(u.px, u.py, '#bfe4ff', 20);
      fx.shake(8);
    } else if (k === 'clank') {
      fx.burst(u, '#9aa7bd', 16, 'bolt');
      fx.burst(u, '#4a5570', 8, 'dot');
      fx.shake(9);
    } else if (k === 'puff') {
      fx.burst(u, u.art && u.art.body ? u.art.body : '#e8f2ff', 22, 'puff');
      fx.shake(5);
    } else if (k === 'scatter') {
      fx.burst(u, '#cdf1ff', 24, 'dot');
    } else {
      fx.burst(u, u.side === 'p' ? C.snowDim : '#c9d6ea', 20, 'dot');
      fx.shake(6);
    }
  },
  ring(x, y, col, r) { if (!ctx) return; rings.push({ x, y, r0: r || 18, col, life: 0.42, t: 0 }); },
  /* A played card does not vanish — it flies to the pile it went to. */
  fly(card, x0, y0) {
    if (!card) return;
    flyers.push({ card, x0, y0, t: 0, life: 0.5, rot: (rnd() - 0.5) * 0.9 });
    if (flyers.length > 12) flyers.shift();
  },
  shake(m) { shakeState.mag = Math.min(18, shakeState.mag + m); },
  flash(col, a) { flashState.col = col || '#ffffff'; flashState.a = Math.max(flashState.a, a === undefined ? 0.35 : a); },
  bell() { fx.flash('#bfe8ff', 0.16); fx.shake(3); },
  thump(u) { if (u) { u.sq = 1.2; fx.ring(u.px || 0, u.py || 0, '#ffffff', 26); } },
  lunge(u, t) {
    if (!u || !t) return;
    u.lungeT = 1;
    u.lungeX = (t.px || 0) - (u.px || 0);
    u.lungeY = (t.py || 0) - (u.py || 0);
    const L = Math.hypot(u.lungeX, u.lungeY) || 1;
    u.lungeX /= L; u.lungeY /= L;
    fx.ring((u.px + t.px) / 2, (u.py + t.py) / 2, '#ffffff', 14);
  },
};

function stepFx(dt) {
  for (let i = parts.length - 1; i >= 0; i--) {
    const p = parts[i];
    p.t += dt;
    if (p.t >= p.life) { parts.splice(i, 1); continue; }
    p.x += p.vx * dt; p.y += p.vy * dt; p.vy += p.g * dt; p.vx *= 0.985;
  }
  for (let i = floats.length - 1; i >= 0; i--) {
    const f = floats[i];
    f.t += dt;
    if (f.t >= f.life) { floats.splice(i, 1); continue; }
    f.y += f.vy * dt; f.vy *= 0.94;
  }
  for (let i = rings.length - 1; i >= 0; i--) {
    const r = rings[i];
    r.t += dt;
    if (r.t >= r.life) rings.splice(i, 1);
  }
  for (let i = flyers.length - 1; i >= 0; i--) {
    flyers[i].t += dt;
    if (flyers[i].t >= flyers[i].life) flyers.splice(i, 1);
  }
  shakeState.mag *= Math.pow(0.0016, dt);
  if (shakeState.mag < 0.05) shakeState.mag = 0;
  shakeState.t += dt * 46;
  flashState.a *= Math.pow(0.008, dt);
}

/* ================================================ 9. rendering =========== */

/* The stage is 720 tall, always. Its WIDTH follows the device: a 16:9 phone
   gets 1280, a 20:9 phone gets the extra width instead of two black bars, and
   anything wider than 1760 is letterboxed rather than stretched. Everything
   that touches an edge is placed against SAFE so a notch never eats it. */
const VH = 720;
let VW = 1280;
let MID = 640;
const VW_MIN = 1180, VW_MAX = 1760;
const SAFE = 34;
const SLOT_W = 118, SLOT_H = 140, SLOT_GAP = 12;
const LANE_Y = [214, 366];
const HAND_Y = 612, CARD_W = 126, CARD_H = 168;

const pilePos = (which) => ({ x: SAFE + 54, y: which === 'draw' ? VH - 188 : VH - 74 });

function slotPos(side, lane, col) {
  const step = SLOT_W + SLOT_GAP;
  const x = side === 'p' ? MID - 52 - (col + 0.5) * step : MID + 52 + (col + 0.5) * step;
  return { x, y: LANE_Y[lane] };
}

let ctx = null, canvas = null, DPR = 1;

/* ------------------------------------------------------------ primitives -- */
/* EVERY HORIZONTAL SWEEP GOES THROUGH HERE, because writing one by hand has now
   produced the same seam four times.

   The shape that fails is `for (x = 0; x <= VW; x += step)` followed by a
   `lineTo(VW, …)`. The loop stops at the last multiple of `step` below VW and
   the closing line then runs straight from there to the corner, which draws a
   hard straight edge `VW % step` units in from the right. It is invisible when
   the step happens to divide VW and glaring when it does not — so whether a
   sweep is broken depends on a number nobody looks at:

     aurora bands  step 64   clean at 1280 and 1600, 28-unit seam at 1180
     far ridges    step 40   clean at 1280 and 1600, 20-unit seam at 1180
     the ground    step 48   BROKEN AT ALL THREE — 32 at 1280, 16 at 1600
     dusk ridges   step 60   found by eye at 1600, fixed one round earlier

   The ground one had been there since the first sky and nobody saw it, because
   a 16-unit sliver at the very edge under the near scenery reads as framing.
   Sweeping from −step to VW+step costs two extra points and makes the whole
   class unrepresentable: there is no arithmetic left for a caller to get wrong. */
function sweepX(c, step, fn) {
  for (let x = -step; x <= VW + step; x += step) c.lineTo(x, fn(x));
}

function rr(c, x, y, w, h, r) {
  const k = Math.min(r, w / 2, h / 2);
  c.beginPath();
  c.moveTo(x + k, y);
  c.arcTo(x + w, y, x + w, y + h, k);
  c.arcTo(x + w, y + h, x, y + h, k);
  c.arcTo(x, y + h, x, y, k);
  c.arcTo(x, y, x + w, y, k);
  c.closePath();
}
/* ====================== DEPTH, WHICH THE UI DID NOT HAVE ==================
   Everything in this game was drawn as a flat fill with a stroke round it, and
   at card size that reads as a diagram: the frame, the name band, the picture
   and the rules all sit on the same plane, so the eye has nothing to order them
   by. Real card art gets its hierarchy almost entirely from how light falls on
   a stack of physical plates — a raised frame catches light on its top edge and
   loses it on the bottom, a window cut into that frame does the exact opposite.

   Canvas has no inner shadow, so both of these clip the shape and lay gradients
   along its edges. Two helpers, used everywhere a plate is raised or a hole is
   cut, so the whole interface is lit from one direction instead of each surface
   inventing its own. */
/** Blend two hex colours. A plate's bottom stop is its own colour walked
 *  toward the night, so every tribe gets the same fall of light without nine
 *  hand-picked shadow colours drifting apart. */
function mix(a, b, t) {
  const p = (h) => { const n = parseInt(String(h).slice(1), 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; };
  const [r1, g1, b1] = p(a), [r2, g2, b2] = p(b);
  const q = (u, v) => Math.round(u + (v - u) * t);
  return 'rgb(' + q(r1, r2) + ',' + q(g1, g2) + ',' + q(b1, b2) + ')';
}
/** A hex colour at an alpha, for a gradient stop that has to stay in a card's
 *  own hue rather than washing it toward white. */
function mixA(hex, a) {
  const n = parseInt(String(hex).slice(1), 16);
  return 'rgba(' + ((n >> 16) & 255) + ',' + ((n >> 8) & 255) + ',' + (n & 255) + ',' + a + ')';
}
const LIGHT = 'rgba(255,255,255,';
const DARK = 'rgba(9,16,32,';

/** A hole: shadow along the top and left, a lip of light along the bottom. */
function inset(c, x, y, w, h, r, d, strength) {
  const k = strength === undefined ? 1 : strength;
  c.save();
  rr(c, x, y, w, h, r);
  c.clip();
  let g = c.createLinearGradient(0, y, 0, y + d * 2.2);
  g.addColorStop(0, DARK + (0.42 * k) + ')');
  g.addColorStop(1, DARK + '0)');
  c.fillStyle = g; c.fillRect(x, y, w, d * 2.2);
  g = c.createLinearGradient(x, 0, x + d * 1.6, 0);
  g.addColorStop(0, DARK + (0.26 * k) + ')');
  g.addColorStop(1, DARK + '0)');
  c.fillStyle = g; c.fillRect(x, y, d * 1.6, h);
  g = c.createLinearGradient(0, y + h - d * 1.4, 0, y + h);
  g.addColorStop(0, LIGHT + '0)');
  g.addColorStop(1, LIGHT + (0.5 * k) + ')');
  c.fillStyle = g; c.fillRect(x, y + h - d * 1.4, w, d * 1.4);
  c.restore();
}

/** A raised plate: light along the top, shadow along the bottom. */
function bevel(c, x, y, w, h, r, d, strength) {
  const k = strength === undefined ? 1 : strength;
  c.save();
  rr(c, x, y, w, h, r);
  c.clip();
  let g = c.createLinearGradient(0, y, 0, y + d * 1.5);
  g.addColorStop(0, LIGHT + (0.42 * k) + ')');
  g.addColorStop(1, LIGHT + '0)');
  c.fillStyle = g; c.fillRect(x, y, w, d * 1.5);
  g = c.createLinearGradient(0, y + h - d * 2, 0, y + h);
  g.addColorStop(0, DARK + '0)');
  g.addColorStop(1, DARK + (0.34 * k) + ')');
  c.fillStyle = g; c.fillRect(x, y + h - d * 2, w, d * 2);
  c.restore();
}

/** A specular pin — the small bright spot that makes a bead read as glass. */
function spec(c, x, y, r, a) {
  const g = c.createRadialGradient(x, y, 0, x, y, r);
  g.addColorStop(0, LIGHT + (a === undefined ? 0.85 : a) + ')');
  g.addColorStop(1, LIGHT + '0)');
  c.fillStyle = g;
  c.beginPath(); c.arc(x, y, r, 0, TAU); c.fill();
}

function inked(c, fill, lw, stroke) {
  if (fill) { c.fillStyle = fill; c.fill(); }
  if (lw) { c.lineWidth = lw; c.strokeStyle = stroke || C.ink; c.lineJoin = 'round'; c.stroke(); }
}
/* EVERY TRAY, BAR AND BOX IN THE GAME GOES THROUGH HERE — 33 call sites — and
   for fifty rounds it drew a flat fill with a stroke round it. Once the cards
   had a bevel and the buttons had a bevel, the panels were the only surfaces
   left that did not catch the light, and a lit object on an unlit tray reads as
   a sticker on a sheet of paper.

   The same treatment, in one place: a slight fall down the fill so a panel has
   a top and a bottom, a light rim along its top edge and a shadow along its
   bottom. It costs nothing at any call site — every one of them already passes
   a colour, and the fall is computed off that colour rather than added to each
   caller by hand, so no palette drifts. */
function panel(c, x, y, w, h, r, fill, edge) {
  const base = fill || C.card;
  c.save();
  c.shadowColor = 'rgba(4,9,20,.5)'; c.shadowBlur = 18; c.shadowOffsetY = 8;
  rr(c, x, y, w, h, r);
  if (typeof base === 'string' && base.charAt(0) === '#') {
    const g = c.createLinearGradient(0, y, 0, y + h);
    g.addColorStop(0, mix(base, '#ffffff', 0.13));
    g.addColorStop(0.55, base);
    g.addColorStop(1, mix(base, '#070d1c', 0.22));
    c.fillStyle = g;
  } else c.fillStyle = base;
  c.fill();
  c.restore();
  bevel(c, x, y, w, h, r, Math.min(3, h * 0.12), 0.8);
  rr(c, x, y, w, h, r);
  c.lineWidth = 3; c.strokeStyle = edge || C.ink; c.stroke();
}
/* An ellipse with a soft, slightly irregular edge — the shape language the
   whole cast is built from. */
function blob(c, x, y, w, h, wob, ph) {
  const n = 22;
  c.beginPath();
  for (let i = 0; i <= n; i++) {
    const a = (i / n) * TAU;
    const k = 1 + (wob || 0) * Math.sin(a * 3 + (ph || 0)) * 0.5;
    const px = x + Math.cos(a) * w * 0.5 * k;
    const py = y + Math.sin(a) * h * 0.5 * (1 + (wob || 0) * Math.cos(a * 2 + (ph || 0)) * 0.3);
    if (i === 0) c.moveTo(px, py); else c.lineTo(px, py);
  }
  c.closePath();
}
/* NOTHING SMALLER THAN A PERSON CAN READ.

   Walking the phone shots screen by screen: the caravan checklist on the trail
   is drawn at 12.5 stage units, the tempered counter and the fell's answer at
   10.5, the seals at 11.5 — which on an iPhone SE, where a stage unit is about
   half a CSS pixel, comes out at SIX AND A HALF PIXELS. Most of the
   informational text in a game built for a phone was unreadable on one.

   Every size passed through here is floored at what the device can actually
   show. On a desktop the scale is about 1 and nothing changes at all; on a
   handset the small print grows to meet the screen and the layouts around it
   were already built to give text room to breathe. It is one line, in the one
   place every string in the game goes through. */
const TEXT_MIN_CSS = 9;
function txt(c, s, x, y, size, col, align, face, outline) {
  size = Math.max(size, TEXT_MIN_CSS / Math.max(0.2, CSS_PER_UNIT));
  c.font = (face === 'd' ? '' : '600 ') + size + 'px ' + (face === 'd' ? "'Frostcut','Trebuchet MS',sans-serif" : "'Frostwork','Trebuchet MS',sans-serif");
  c.textAlign = align || 'center';
  c.textBaseline = 'middle';
  if (outline !== 0) {
    c.lineWidth = Math.max(3, size * 0.22);
    c.strokeStyle = outline || 'rgba(12,20,36,.85)';
    c.lineJoin = 'round';
    c.strokeText(s, x, y);
  }
  c.fillStyle = col || C.snow;
  c.fillText(s, x, y);
}
/* Wrapped at the size it will actually be DRAWN at. The text floor lifts small
   type on a phone, and a wrap computed for the requested size and rendered at
   the floored one overflows its box — which is exactly what card text did the
   first time the floor went in. */
const textSize = (n) => Math.max(n, TEXT_MIN_CSS / Math.max(0.2, CSS_PER_UNIT));
/* A line step has to grow with the text or the floor stacks glyphs on top of
   each other. Every hardcoded step in this file goes through here: on a big
   screen the floor is inert and the step is exactly what it always was; on a
   phone the step opens up to whatever the floored glyph actually needs. */
const lineH = (size, step) => Math.max(step, textSize(size) * 1.12);
/* Cut a line down until it and an ellipsis fit, so a truncation reads as one
   rather than as a sentence that stops mid-word. */
/* AND IT HAS TO MEASURE IN THE FACE IT WILL BE DRAWN IN.

   This hardcoded Frostwork, and the moment button labels started going through
   it the shop truncated `BACK TO THE ROAD` to `BACK TO THE RO…` on a button it
   fitted comfortably. Buttons are set in Frostcut, which is a condensed cut —
   0.578 to Frostwork's 0.655 per uppercase glyph, about 12% narrower — so every
   button label was measured against a font 12% too wide and cut to fit a box it
   was already inside. A truncation is a lie about the string; measuring in the
   wrong font is a lie about the box. */
function ellipsize(c, s, size, maxW, force, face) {
  size = textSize(size);
  c.font = (face === 'd' ? '' : '600 ') + size + 'px ' +
    (face === 'd' ? "'Frostcut','Trebuchet MS',sans-serif" : "'Frostwork','Trebuchet MS',sans-serif");
  if (!force && c.measureText(s).width <= maxW) return s;
  if (force && c.measureText(s + '\u2026').width <= maxW) return s.replace(/[ ,.;:]+$/, '') + '\u2026';
  let out = s;
  while (out.length > 1 && c.measureText(out + '\u2026').width > maxW) out = out.slice(0, -1);
  return out.replace(/[ ,.;:]+$/, '') + '\u2026';
}
function wrapText(c, s, size, maxW) {
  size = textSize(size);
  c.font = '600 ' + size + "px 'Frostwork','Trebuchet MS',sans-serif";
  const words = String(s).split(' ');
  const lines = [];
  let line = '';
  for (const w of words) {
    const test = line ? line + ' ' + w : w;
    if (c.measureText(test).width > maxW && line) { lines.push(line); line = w; }
    else line = test;
  }
  if (line) lines.push(line);
  return lines;
}

/* -------------------------------------------------------- the cast ------- */

/* One function draws every creature in the game. A recipe picks the
   silhouette and the trimmings; the seed and the clock do the rest, so two
   Rimefoxes on the board are never breathing in step. */
/* ---------------------------------------------------------------- anatomy --

   Every creature in the game comes out of this one function. A recipe picks a
   silhouette, a surface, a stance, a tail and one distinguishing mark; the
   seed and the clock do the rest. The rule that keeps sixty-six of them apart
   is that no two share a full row of that table — Cinderpup and Emberwick are
   the same colour family and the same size, and they are still not the same
   drawing, because one stands on four legs with a brush tail and the other
   floats with a lit ember on its chest.

   The taller silhouettes get a head that is genuinely separate from the body,
   with a neck between them; the small round ones keep the fused bean, which is
   what the cast is built on.
   ------------------------------------------------------------------------- */

const SHAPE_DIM = {
  blob:  [1.02, 0.80], round: [0.94, 0.88], tall: [0.74, 0.96], squat: [1.14, 0.70],
  small: [0.72, 0.62], wisp:  [0.78, 0.94], boss:  [1.20, 1.02],
};
const HEADED = { tall: 1, boss: 1 };

function drawCreature(c, art, x, y, s, o) {
  o = o || {};
  const t = o.t || 0;
  const ph = o.ph || 0;
  const shape = art.shape || 'blob';
  const idle = art.idle || 'bob';

  let breathe = Math.sin(t * 1.7 + ph) * 0.02;
  let lean = 0, hop = 0, jitter = 0, paw = 0;
  if (idle === 'breathe') breathe = Math.sin(t * 0.9 + ph) * 0.055;
  else if (idle === 'shiver') { jitter = Math.sin(t * 26 + ph) * s * 0.008; breathe *= 0.4; }
  else if (idle === 'sway') lean = Math.sin(t * 1.1 + ph) * 0.05;
  else if (idle === 'hover') { hop = Math.sin(t * 2.3 + ph) * s * 0.045; breathe *= 0.5; }
  else if (idle === 'paw') {
    const cyc = (t * 0.6 + ph * 0.13) % 1;
    paw = cyc > 0.82 ? Math.sin((cyc - 0.82) / 0.18 * Math.PI * 2) : 0;
  } else if (idle === 'twitch') breathe += (((t * 0.7 + ph) % 3) < 0.09 ? 0.03 : 0);

  const sq = o.sq || 0;
  const sx = (1 + breathe + sq * 0.22) * (o.flip ? -1 : 1);
  const sy = 1 - breathe - sq * 0.26;
  const dim = SHAPE_DIM[shape] || [1, 0.86];
  const bw = s * dim[0], bh = s * dim[1];
  const lw = Math.max(2.5, s * 0.055);
  const headed = !!HEADED[shape];
  const stance = art.stance || (headed ? 'stand' : 'quad');
  const floaty = stance === 'float' || shape === 'wisp' || idle === 'hover';

  // where the body sits, and where the face goes
  const cy = headed ? -bh * 0.02 : -bh * 0.06;
  const bodyY = headed ? cy + bh * 0.24 : cy;
  const bodyW = headed ? bw * 0.86 : bw;
  const bodyH = headed ? bh * 0.62 : bh;
  const headR = bw * 0.44;
  const faceY = headed ? cy - bh * 0.34 : cy - bh * 0.02;
  const faceW = headed ? headR * 2 : bw;
  const faceH = headed ? headR * 2 : bh;
  const footY = bodyY + bodyH * 0.46;

  c.save();
  c.translate(x + jitter, y - hop);
  c.rotate(lean);
  c.scale(sx, sy);
  c.lineJoin = 'round'; c.lineCap = 'round';

  // ground shadow — smaller and softer for anything that does not touch down
  c.save();
  c.globalAlpha = floaty ? 0.16 : 0.28;
  c.fillStyle = '#000';
  c.beginPath();
  c.ellipse(0, footY + s * 0.1, bw * (floaty ? 0.3 : 0.42), bh * 0.08, 0, 0, TAU);
  c.fill();
  c.restore();

  const dark = art.patCol || 'rgba(20,30,50,.35)';

  /* ---------------------------------------------------------------- tail -- */
  const tail = art.tail || 'none';
  if (tail !== 'none') {
    const wag = Math.sin(t * 2.4 + ph) * 0.24 + (paw ? paw * 0.3 : 0);
    c.save();
    c.translate(-bw * 0.36, bodyY + bodyH * 0.24);
    c.rotate(-0.35 + wag);
    if (tail === 'brush') {
      c.beginPath();
      c.moveTo(0, 0);
      c.quadraticCurveTo(-bw * 0.24, -bh * 0.04, -bw * 0.3, -bh * 0.2);
      c.quadraticCurveTo(-bw * 0.1, -bh * 0.12, 0, bh * 0.09);
      c.closePath();
      inked(c, art.body, lw * 0.9, C.ink);
      // a paler flash at the tip, the way a brush tail actually reads
      c.save();
      c.globalAlpha = 0.8;
      c.beginPath();
      c.moveTo(-bw * 0.19, -bh * 0.11);
      c.quadraticCurveTo(-bw * 0.3, -bh * 0.14, -bw * 0.3, -bh * 0.2);
      c.quadraticCurveTo(-bw * 0.22, -bh * 0.16, -bw * 0.15, -bh * 0.06);
      c.closePath();
      c.fillStyle = art.belly; c.fill();
      c.restore();
    } else if (tail === 'whip') {
      c.strokeStyle = C.ink; c.lineWidth = lw * 1.5;
      c.beginPath();
      c.moveTo(0, 0);
      c.quadraticCurveTo(-bw * 0.34, bh * 0.06, -bw * 0.44, -bh * 0.22);
      c.stroke();
      c.strokeStyle = art.body; c.lineWidth = lw * 0.7;
      c.beginPath();
      c.moveTo(0, 0);
      c.quadraticCurveTo(-bw * 0.34, bh * 0.06, -bw * 0.44, -bh * 0.22);
      c.stroke();
    } else if (tail === 'stub') {
      c.beginPath(); c.ellipse(-bw * 0.05, 0, bw * 0.09, bh * 0.1, 0, 0, TAU);
      inked(c, art.belly, lw * 0.8, C.ink);
    } else if (tail === 'plume') {
      for (let i = 0; i < 3; i++) {
        c.beginPath();
        c.moveTo(0, 0);
        c.quadraticCurveTo(-bw * 0.18, -bh * (0.05 + i * 0.07), -bw * 0.28, -bh * (0.1 + i * 0.1));
        c.strokeStyle = C.ink; c.lineWidth = lw * 1.5; c.stroke();
        c.strokeStyle = i % 2 ? art.belly : art.body;
        c.lineWidth = lw * 0.8; c.stroke();
      }
    } else if (tail === 'fin') {
      c.beginPath();
      c.moveTo(0, 0);
      c.lineTo(-bw * 0.26, -bh * 0.2);
      c.lineTo(-bw * 0.22, bh * 0.12);
      c.closePath();
      inked(c, art.belly, lw * 0.9, C.ink);
    }
    c.restore();
  }

  /* ---------------------------------------------------------------- wings -- */
  if (art.wings) {
    for (const d of [-1, 1]) {
      c.save();
      c.translate(d * bw * 0.34, bodyY - bodyH * 0.1);
      c.rotate(d * (0.5 + Math.sin(t * 6 + ph) * 0.24));
      blob(c, 0, 0, bw * 0.6, bh * 0.42, 0.06, 1.2);
      inked(c, art.wings, lw, C.ink);
      c.restore();
    }
  }

  /* ---------------------------------------------------------------- legs --- */
  if (!floaty && stance !== 'root') {
    const gait = Math.sin(t * 1.9 + ph) * 0.1;
    const legL = bh * (stance === 'squat' ? 0.1 : 0.2);
    const legW = bw * (stance === 'squat' ? 0.15 : 0.11);
    const pairs = stance === 'quad' ? [[-0.3, -1], [0.3, -1], [-0.22, 1], [0.34, 1]] : [[-0.22, 1], [0.22, 1]];
    for (let i = 0; i < pairs.length; i++) {
      const [ox, front] = pairs[i];
      const swing = gait * (i % 2 ? -1 : 1) + (paw && i === pairs.length - 1 ? paw * 0.5 : 0);
      c.save();
      c.globalAlpha = front < 0 ? 0.75 : 1;             // the far pair sits back
      c.translate(ox * bw, footY - legL * 0.3);
      c.rotate(swing);
      c.beginPath(); rr(c, -legW / 2, 0, legW, legL, legW * 0.45);
      inked(c, front < 0 ? dark : art.body, lw * 0.9, C.ink);
      // a foot, so it stands on something rather than tapering away
      c.beginPath(); c.ellipse(0, legL, legW * 0.72, legL * 0.3 + lw, 0, 0, TAU);
      inked(c, front < 0 ? dark : art.belly, lw * 0.8, C.ink);
      c.restore();
    }
  }

  /* ---------------------------------------------------------------- body --- */
  if (shape === 'wisp') {
    c.beginPath();
    c.moveTo(-bw * 0.42, bodyY + bh * 0.10);
    c.quadraticCurveTo(-bw * 0.5, bodyY - bh * 0.55, 0, bodyY - bh * 0.52);
    c.quadraticCurveTo(bw * 0.5, bodyY - bh * 0.55, bw * 0.42, bodyY + bh * 0.10);
    for (let i = 0; i <= 4; i++) {
      const px = bw * 0.42 - (i / 4) * bw * 0.84;
      const py = bodyY + bh * 0.10 + Math.sin(t * 3 + i * 1.6) * bh * 0.06 + (i % 2 ? bh * 0.14 : 0);
      c.lineTo(px, py);
    }
    c.closePath();
  } else {
    blob(c, 0, bodyY, bodyW, bodyH, 0.03, t * 0.6 + ph);
  }
  inked(c, art.body, lw, C.ink);

  /* ---------------------------------------------------------------- arms --- */
  const arms = art.arms || (headed ? 'stub' : 'none');
  if (arms !== 'none') {
    const swing2 = Math.sin(t * 1.6 + ph + 1) * 0.14;
    for (const d of [-1, 1]) {
      c.save();
      c.translate(d * bodyW * 0.44, bodyY - bodyH * 0.06);
      c.rotate(d * (0.35 + swing2));
      const aL = bh * (arms === 'long' ? 0.3 : 0.17);
      c.beginPath(); rr(c, -bw * 0.055, 0, bw * 0.11, aL, bw * 0.05);
      inked(c, art.body, lw * 0.85, C.ink);
      c.beginPath(); c.arc(0, aL, bw * 0.075, 0, TAU);
      inked(c, art.belly, lw * 0.8, C.ink);
      c.restore();
    }
  }

  /* ------------------------------------------------------------- surface --- */
  const skin = art.skin || 'smooth';
  if (skin === 'fur') {
    c.save();
    c.fillStyle = art.body;
    c.strokeStyle = C.ink; c.lineWidth = lw * 0.55;
    for (let i = 0; i < 11; i++) {
      const a = Math.PI * (0.08 + (i / 10) * 0.84);
      const px = Math.cos(a) * bodyW * 0.5, py = bodyY + Math.sin(a) * bodyH * 0.5;
      const l = s * (0.05 + ((i * 7) % 4) * 0.012);
      c.beginPath();
      c.moveTo(px, py);
      c.lineTo(px + Math.cos(a - 0.22) * l, py + Math.sin(a - 0.22) * l);
      c.lineTo(px + Math.cos(a + 0.2) * l * 0.7, py + Math.sin(a + 0.2) * l * 0.7);
      c.closePath(); c.fill(); c.stroke();
    }
    c.restore();
  } else if (skin === 'ice') {
    c.save();
    rr(c, -bodyW * 0.5, bodyY - bodyH * 0.5, bodyW, bodyH, bodyW * 0.4);
    c.clip();
    c.globalAlpha = 0.5; c.fillStyle = '#ffffff';
    for (let i = 0; i < 4; i++) {
      const px = -bodyW * 0.36 + i * bodyW * 0.24, py = bodyY - bodyH * 0.3 + (i % 2) * bodyH * 0.3;
      c.beginPath();
      c.moveTo(px, py); c.lineTo(px + s * 0.11, py - s * 0.05); c.lineTo(px + s * 0.07, py + s * 0.13);
      c.closePath(); c.fill();
    }
    c.restore();
  } else if (skin === 'metal') {
    c.save();
    rr(c, -bodyW * 0.5, bodyY - bodyH * 0.5, bodyW, bodyH, bodyW * 0.4);
    c.clip();
    const gm = c.createLinearGradient(-bodyW * 0.4, bodyY - bodyH * 0.4, bodyW * 0.3, bodyY + bodyH * 0.4);
    gm.addColorStop(0, 'rgba(255,255,255,.42)');
    gm.addColorStop(0.4, 'rgba(255,255,255,.06)');
    gm.addColorStop(1, 'rgba(0,0,0,.22)');
    c.fillStyle = gm;
    c.fillRect(-bodyW * 0.5, bodyY - bodyH * 0.5, bodyW, bodyH);
    c.fillStyle = 'rgba(20,30,50,.55)';
    for (let i = 0; i < 4; i++) {
      c.beginPath(); c.arc(-bodyW * 0.3 + i * bodyW * 0.2, bodyY + bodyH * 0.3, s * 0.022, 0, TAU); c.fill();
    }
    c.restore();
  }

  // belly plate, on the body rather than over the face
  c.save();
  c.beginPath();
  c.ellipse(0, bodyY + bodyH * (headed ? 0.06 : 0.12), bodyW * 0.32, bodyH * 0.3, 0, 0, TAU);
  c.fillStyle = art.belly; c.globalAlpha = 0.95; c.fill();
  c.restore();

  /* -------------------------------------------------------------- markings -- */
  if (art.pat === 'spots') {
    c.fillStyle = art.patCol || '#00000022';
    for (let i = 0; i < 3; i++) {
      c.beginPath();
      c.ellipse(-bodyW * 0.28 + i * bodyW * 0.12, bodyY - bodyH * 0.16 + (i % 2) * bodyH * 0.1,
        s * 0.04, s * 0.034, 0, 0, TAU);
      c.fill();
    }
  } else if (art.pat === 'stripes') {
    c.strokeStyle = art.patCol || '#00000033'; c.lineWidth = lw * 0.9;
    for (let i = 0; i < 3; i++) {
      c.beginPath();
      c.arc(0, bodyY, bodyW * (0.28 + i * 0.06), -1.9, -1.2);
      c.stroke();
    }
  } else if (art.pat === 'shards') {
    c.fillStyle = art.patCol || '#ffffff55';
    for (let i = 0; i < 3; i++) {
      const px = -bodyW * 0.24 + i * bodyW * 0.24, py = bodyY - bodyH * 0.3;
      c.beginPath(); c.moveTo(px, py); c.lineTo(px + s * 0.05, py - s * 0.14); c.lineTo(px + s * 0.1, py);
      c.closePath(); c.fill();
    }
  }

  /* ---------------------------------------------------------------- head --- */
  if (headed) {
    // a neck, so the head is joined rather than balanced
    c.beginPath(); rr(c, -bw * 0.12, cy - bh * 0.22, bw * 0.24, bh * 0.2, bw * 0.08);
    inked(c, art.body, lw * 0.9, C.ink);
    c.beginPath(); c.arc(0, faceY, headR, 0, TAU);
    inked(c, art.body, lw, C.ink);
    c.save();
    c.beginPath(); c.ellipse(0, faceY + headR * 0.22, headR * 0.66, headR * 0.6, 0, 0, TAU);
    c.fillStyle = art.belly; c.globalAlpha = 0.9; c.fill();
    c.restore();
  }

  /* ---------------------------------------------------------------- ears --- */
  const ears = art.ears || 'round';
  const earTop = faceY - faceH * (headed ? 0.42 : 0.28);
  if (ears === 'pointy' || ears === 'shard') {
    for (const d of [-1, 1]) {
      c.beginPath();
      c.moveTo(d * faceW * 0.30, earTop + faceH * 0.10);
      c.lineTo(d * faceW * (ears === 'shard' ? 0.30 : 0.40), earTop - faceH * (ears === 'shard' ? 0.42 : 0.3));
      c.lineTo(d * faceW * 0.06, earTop - faceH * 0.02);
      c.closePath();
      inked(c, art.patCol && art.pat === 'tips' ? art.patCol : art.body, lw, C.ink);
    }
  } else if (ears === 'round') {
    for (const d of [-1, 1]) {
      c.beginPath(); c.ellipse(d * faceW * 0.31, earTop - faceH * 0.02, faceW * 0.16, faceH * 0.17, 0, 0, TAU);
      inked(c, art.body, lw, C.ink);
    }
  } else if (ears === 'horns') {
    for (const d of [-1, 1]) {
      c.beginPath();
      c.moveTo(d * faceW * 0.24, earTop + faceH * 0.06);
      c.quadraticCurveTo(d * faceW * 0.52, earTop - faceH * 0.14, d * faceW * 0.40, earTop - faceH * 0.40);
      c.quadraticCurveTo(d * faceW * 0.30, earTop - faceH * 0.14, d * faceW * 0.10, earTop + faceH * 0.04);
      c.closePath();
      inked(c, '#e7dfd0', lw, C.ink);
    }
  } else if (ears === 'antler') {
    for (const d of [-1, 1]) {
      c.strokeStyle = '#cdbfa4'; c.lineWidth = lw * 1.3;
      c.beginPath();
      c.moveTo(d * faceW * 0.18, earTop + faceH * 0.04);
      c.lineTo(d * faceW * 0.30, earTop - faceH * 0.34);
      c.moveTo(d * faceW * 0.26, earTop - faceH * 0.14);
      c.lineTo(d * faceW * 0.46, earTop - faceH * 0.24);
      c.stroke();
    }
  } else if (ears === 'antenna') {
    for (const d of [-1, 1]) {
      c.strokeStyle = C.ink; c.lineWidth = lw * 0.8;
      c.beginPath();
      c.moveTo(d * faceW * 0.10, earTop + faceH * 0.06);
      c.quadraticCurveTo(d * faceW * 0.30, earTop - faceH * 0.30, d * faceW * 0.36, earTop - faceH * 0.40);
      c.stroke();
      c.beginPath(); c.arc(d * faceW * 0.36, earTop - faceH * 0.42, s * 0.05, 0, TAU);
      inked(c, art.belly, lw * 0.8, C.ink);
    }
  } else if (ears === 'fin') {
    c.beginPath();
    c.moveTo(-faceW * 0.06, earTop - faceH * 0.02);
    c.quadraticCurveTo(0, earTop - faceH * 0.44, faceW * 0.16, earTop - faceH * 0.04);
    c.closePath();
    inked(c, art.belly, lw, C.ink);
  }

  /* ---------------------------------------------------------------- face ---

     Two eyes the same size in the same place on sixty-six animals is what made
     the cast read as one drawing. Size, spacing and lids all move — some of it
     chosen per creature, the rest derived from a stable hash of the recipe so
     that no two faces land on the same numbers by accident. */
  const fh = ((art.body || '').charCodeAt(1) || 3) * 7 + ((art.mouth || 'x').charCodeAt(0) || 5) * 13
    + ((art.mark || 'n').charCodeAt(0) || 2) * 3;
  const gapMul = art.eyeGap || (0.86 + ((fh % 5) * 0.09));
  const sizeMul = art.eyeSize || (0.88 + ((fh >> 2) % 5) * 0.07);
  const eyeY = faceY - faceH * (headed ? 0.04 : 0.06);
  const eyeDx = faceW * 0.15 * gapMul;
  const blinkPhase = ((t * 0.6 + (o.blink || 0)) % 4.4);
  const blink = blinkPhase < 0.12 ? 1 - Math.abs(blinkPhase - 0.06) / 0.06 : 0;
  const eyeStyle = art.eyes || 'dot';
  const er = s * (eyeStyle === 'big' ? 0.12 : eyeStyle === 'slit' ? 0.095 : 0.08) * sizeMul;
  for (const d of [-1, 1]) {
    const ex = d * eyeDx;
    if (art.mark === 'patch' && d < 0) continue;                 // one eye is covered
    if (eyeStyle === 'slit') {
      c.save();
      c.strokeStyle = art.evil ? '#ff8a8a' : C.ink;
      c.lineWidth = lw * 1.1;
      c.beginPath();
      c.moveTo(ex - er * 0.8, eyeY - er * 0.4); c.lineTo(ex + er * 0.8, eyeY + er * 0.2);
      c.stroke();
      c.restore();
      continue;
    }
    c.beginPath(); c.ellipse(ex, eyeY, er, er * (1 - blink * 0.92), 0, 0, TAU);
    inked(c, '#ffffff', lw * 0.8, C.ink);
    if (blink < 0.6) {
      c.beginPath();
      c.ellipse(ex + d * er * 0.16, eyeY + er * 0.1, er * 0.46, er * 0.5 * (1 - blink), 0, 0, TAU);
      c.fillStyle = art.evil ? '#7a1030' : C.ink; c.fill();
      c.beginPath();
      c.arc(ex + d * er * 0.32, eyeY - er * 0.28, er * 0.18, 0, TAU);
      c.fillStyle = '#ffffff'; c.fill();
    }
  }

  /* brows and lids: the whole difference between cute and cute-and-hungry */
  const brow = art.brow || (art.evil ? 'angry' : (art.mouth === 'flat' ? 'flat' : (shape === 'wisp' ? 'worried' : 'none')));
  if (brow !== 'none' && eyeStyle !== 'slit') {
    c.save();
    c.strokeStyle = art.evil ? '#5a1020' : C.ink;
    c.lineWidth = lw * (art.evil ? 1.2 : 0.95);
    c.lineCap = 'round';
    for (const d of [-1, 1]) {
      if (art.mark === 'patch' && d < 0) continue;
      const bx4 = d * eyeDx, by4 = eyeY - er * 1.5;
      c.beginPath();
      if (brow === 'angry') { c.moveTo(bx4 - d * er * 0.9, by4 - er * 0.35); c.lineTo(bx4 + d * er * 0.9, by4 + er * 0.42); }
      else if (brow === 'worried') { c.moveTo(bx4 - d * er * 0.9, by4 + er * 0.4); c.lineTo(bx4 + d * er * 0.9, by4 - er * 0.3); }
      else { c.moveTo(bx4 - d * er * 0.85, by4); c.lineTo(bx4 + d * er * 0.85, by4); }
      c.stroke();
    }
    c.restore();
  }
  // a heavy lid sits over the top of the eye and takes the innocence out of it
  const lid = art.lid || (art.evil && eyeStyle !== 'slit' ? (fh % 2 ? 'heavy' : 'none') : 'none');
  if (lid !== 'none') {
    c.save();
    c.fillStyle = art.body;
    c.strokeStyle = C.ink; c.lineWidth = lw * 0.7;
    for (const d of [-1, 1]) {
      if (art.mark === 'patch' && d < 0) continue;
      c.beginPath();
      c.arc(d * eyeDx, eyeY, er * 1.02, Math.PI, TAU);
      c.lineTo(d * eyeDx + er, eyeY - er * (lid === 'sleepy' ? 0.1 : 0.35));
      c.lineTo(d * eyeDx - er, eyeY - er * (lid === 'sleepy' ? 0.1 : 0.35));
      c.closePath(); c.fill(); c.stroke();
    }
    c.restore();
  }

  const my = faceY + faceH * (headed ? 0.2 : 0.16);
  const mouth = art.mouth || 'smile';
  c.strokeStyle = C.ink; c.lineWidth = lw * 0.9;
  if (mouth === 'smile') {
    c.beginPath(); c.arc(0, my - s * 0.03, s * 0.09, 0.3, Math.PI - 0.3); c.stroke();
  } else if (mouth === 'grin') {
    c.beginPath(); c.arc(0, my - s * 0.05, s * 0.11, 0.15, Math.PI - 0.15);
    c.fillStyle = '#4a1c2a'; c.fill(); c.stroke();
  } else if (mouth === 'flat') {
    c.beginPath(); c.moveTo(-s * 0.07, my); c.lineTo(s * 0.07, my); c.stroke();
    if (art.evil) {
      // a tooth showing over a closed mouth: menacing without being a snarl
      c.fillStyle = '#ffffff';
      c.beginPath();
      c.moveTo(s * 0.03, my); c.lineTo(s * 0.055, my); c.lineTo(s * 0.042, my + s * 0.045);
      c.closePath(); c.fill();
    }
  } else if (mouth === 'fang') {
    c.beginPath(); c.arc(0, my - s * 0.04, s * 0.10, 0.2, Math.PI - 0.2);
    c.fillStyle = '#4a1c2a'; c.fill(); c.stroke();
    c.fillStyle = '#ffffff';
    for (const d of [-1, 1]) {
      c.beginPath();
      c.moveTo(d * s * 0.06, my - s * 0.01); c.lineTo(d * s * 0.02, my + s * 0.06); c.lineTo(d * s * 0.005, my - s * 0.01);
      c.closePath(); c.fill();
    }
  } else if (mouth === 'wide' || mouth === 'trap') {
    c.beginPath(); c.ellipse(0, my + s * 0.01, s * 0.15, s * 0.1, 0, 0, TAU);
    inked(c, '#3a1020', lw * 0.9, C.ink);
    if (mouth === 'trap') {
      c.fillStyle = '#fff';
      for (let i = -2; i <= 2; i++) {
        c.beginPath();
        c.moveTo(i * s * 0.055 - s * 0.02, my - s * 0.09);
        c.lineTo(i * s * 0.055 + s * 0.02, my - s * 0.09);
        c.lineTo(i * s * 0.055, my - s * 0.02);
        c.closePath(); c.fill();
      }
    }
  } else if (mouth === 'beak') {
    c.beginPath();
    c.moveTo(-s * 0.09, my - s * 0.02); c.lineTo(s * 0.09, my - s * 0.02); c.lineTo(0, my + s * 0.11);
    c.closePath();
    inked(c, '#f0b45c', lw * 0.8, C.ink);
  } else if (mouth === 'bolt') {
    c.beginPath();
    c.moveTo(-s * 0.10, my); c.lineTo(-s * 0.02, my); c.lineTo(-s * 0.05, my + s * 0.07);
    c.lineTo(s * 0.10, my - s * 0.03);
    c.stroke();
  } else if (mouth === 'beard') {
    c.beginPath();
    c.moveTo(-faceW * 0.2, my - s * 0.04);
    c.quadraticCurveTo(0, my + faceH * 0.34, faceW * 0.2, my - s * 0.04);
    c.closePath();
    inked(c, '#eef5ff', lw * 0.9, C.ink);
  }

  /* ---------------------------------------------------------------- props -- */
  drawProp(c, art, t, ph, bw, bh, cy, lw, s, paw, bodyY, bodyH, faceY, faceW, faceH, headed);

  /* --------------------------------------------------------------- the mark */
  const mark = art.mark || 'none';
  if (mark !== 'none') {
    c.save();
    if (mark === 'scar') {
      c.strokeStyle = '#c96a72'; c.lineWidth = lw * 0.7;
      c.beginPath();
      c.moveTo(faceW * 0.2, eyeY - faceH * 0.16); c.lineTo(faceW * 0.3, eyeY + faceH * 0.1);
      c.stroke();
      for (let i = -1; i <= 1; i += 2) {
        c.beginPath();
        c.moveTo(faceW * 0.2 + i * s * 0.03, eyeY - faceH * 0.06 + i * s * 0.02);
        c.lineTo(faceW * 0.28 + i * s * 0.03, eyeY - faceH * 0.02 + i * s * 0.02);
        c.stroke();
      }
    } else if (mark === 'patch') {
      c.strokeStyle = C.ink; c.lineWidth = lw * 0.8;
      c.beginPath();
      c.moveTo(-faceW * 0.34, eyeY - faceH * 0.14); c.lineTo(faceW * 0.28, eyeY - faceH * 0.2);
      c.stroke();
      c.beginPath(); c.ellipse(-eyeDx, eyeY, er * 1.25, er * 1.1, 0, 0, TAU);
      inked(c, '#2a3346', lw * 0.8, C.ink);
    } else if (mark === 'freckles') {
      c.fillStyle = dark;
      for (let i = 0; i < 6; i++) {
        const d = i < 3 ? -1 : 1;
        c.beginPath();
        c.arc(d * (faceW * 0.22 + (i % 3) * s * 0.035), my - faceH * 0.02 + ((i % 3) - 1) * s * 0.025, s * 0.014, 0, TAU);
        c.fill();
      }
    } else if (mark === 'tuft') {
      c.beginPath();
      c.moveTo(-s * 0.05, faceY - faceH * (headed ? 0.44 : 0.3));
      c.quadraticCurveTo(s * 0.02, faceY - faceH * (headed ? 0.72 : 0.52), s * 0.09, faceY - faceH * (headed ? 0.42 : 0.28));
      c.closePath();
      inked(c, art.belly, lw * 0.8, C.ink);
    } else if (mark === 'ember') {
      // a small lit coal carried on the chest, licking upward
      const ey2 = bodyY + bodyH * 0.06;
      const pulse = 0.5 + Math.sin(t * 3 + ph) * 0.3;
      c.save();
      c.globalAlpha = pulse * 0.45; c.fillStyle = '#ff9a3c';
      c.beginPath(); c.arc(0, ey2, s * 0.1, 0, TAU); c.fill();
      c.restore();
      for (let i = 0; i < 2; i++) {
        const k = 1 - i * 0.4, wob = Math.sin(t * 6 + ph + i) * s * 0.008;
        c.beginPath();
        c.moveTo(0, ey2 + s * 0.05 * k);
        c.quadraticCurveTo(s * 0.045 * k, ey2, wob, ey2 - s * 0.07 * k);
        c.quadraticCurveTo(-s * 0.045 * k, ey2, 0, ey2 + s * 0.05 * k);
        c.closePath();
        c.fillStyle = i ? '#ffe6a8' : '#ff9a3c';
        c.fill();
        if (!i) { c.lineWidth = lw * 0.5; c.strokeStyle = C.ink; c.stroke(); }
      }
    } else if (mark === 'icicles') {
      c.fillStyle = '#dff0ff';
      for (let i = -2; i <= 2; i++) {
        const px = i * bodyW * 0.16;
        c.beginPath();
        c.moveTo(px - s * 0.022, bodyY + bodyH * 0.36);
        c.lineTo(px + s * 0.022, bodyY + bodyH * 0.36);
        c.lineTo(px, bodyY + bodyH * 0.36 + s * (0.05 + (i % 2 ? 0.03 : 0)));
        c.closePath(); c.fill();
      }
    } else if (mark === 'bandage') {
      c.save();
      c.translate(0, faceY + faceH * 0.02);
      c.rotate(-0.2);
      c.beginPath(); rr(c, -faceW * 0.4, -s * 0.03, faceW * 0.8, s * 0.06, s * 0.02);
      inked(c, '#f0ead8', lw * 0.6, C.ink);
      c.restore();
    } else if (mark === 'monocle') {
      c.beginPath(); c.arc(eyeDx, eyeY, er * 1.5, 0, TAU);
      c.strokeStyle = C.gold; c.lineWidth = lw * 0.7; c.stroke();
      c.beginPath();
      c.moveTo(eyeDx + er * 1.4, eyeY + er); c.lineTo(eyeDx + er * 2, eyeY + er * 2.4);
      c.stroke();
    } else if (mark === 'leaf') {
      c.save();
      c.translate(s * 0.06, faceY - faceH * (headed ? 0.46 : 0.32));
      c.rotate(0.4 + Math.sin(t * 1.5 + ph) * 0.1);
      c.beginPath();
      c.moveTo(0, 0);
      c.quadraticCurveTo(s * 0.09, -s * 0.05, s * 0.14, s * 0.01);
      c.quadraticCurveTo(s * 0.08, s * 0.06, 0, 0);
      inked(c, '#6fd08c', lw * 0.6, C.ink);
      c.restore();
    } else if (mark === 'brand') {
      c.strokeStyle = dark; c.lineWidth = lw * 0.8;
      c.beginPath();
      c.arc(bodyW * 0.2, bodyY + bodyH * 0.08, s * 0.06, 0, TAU);
      c.moveTo(bodyW * 0.2 - s * 0.06, bodyY + bodyH * 0.08);
      c.lineTo(bodyW * 0.2 + s * 0.06, bodyY + bodyH * 0.08);
      c.stroke();
    }
    c.restore();
  }

  c.restore();
}

/* Props are drawn last of all and hang off the finished body. */
function drawProp(c, art, t, ph, bw, bh, cy, lw, s, paw, bodyY, bodyH, faceY, faceW, faceH, headed) {
  const acc = art.acc || 'none';
  if (acc === 'none') return;
  if (acc === 'scarf') {
    c.beginPath();
    rr(c, -faceW * 0.32, faceY + faceH * 0.34, faceW * 0.64, faceH * 0.14, faceH * 0.07);
    inked(c, art.accCol || '#ff5566', lw * 0.9, C.ink);
    c.beginPath();
    rr(c, faceW * 0.16, faceY + faceH * 0.4, faceW * 0.14, faceH * 0.34, faceH * 0.05);
    inked(c, art.accCol || '#ff5566', lw * 0.9, C.ink);
  } else if (acc === 'helm') {
    c.beginPath(); c.arc(0, faceY - faceH * 0.1, faceW * 0.38, Math.PI, TAU);
    c.closePath();
    inked(c, art.accCol || '#8fa2bd', lw, C.ink);
    c.beginPath(); rr(c, -faceW * 0.4, faceY - faceH * 0.13, faceW * 0.8, faceH * 0.09, 4);
    inked(c, art.accCol || '#8fa2bd', lw * 0.8, C.ink);
  } else if (acc === 'crown') {
    const ty = faceY - faceH * 0.4;
    c.beginPath();
    c.moveTo(-faceW * 0.28, ty);
    c.lineTo(-faceW * 0.28, ty - faceH * 0.2); c.lineTo(-faceW * 0.11, ty - faceH * 0.08);
    c.lineTo(0, ty - faceH * 0.26); c.lineTo(faceW * 0.11, ty - faceH * 0.08);
    c.lineTo(faceW * 0.28, ty - faceH * 0.2); c.lineTo(faceW * 0.28, ty);
    c.closePath();
    inked(c, art.accCol || C.gold, lw, C.ink);
  } else if (acc === 'lantern') {
    const lx = bw * 0.46, ly = bodyY + Math.sin(t * 2.2) * bh * 0.03;
    c.strokeStyle = C.ink; c.lineWidth = lw * 0.7;
    c.beginPath(); c.moveTo(bw * 0.26, bodyY - bodyH * 0.16); c.lineTo(lx, ly - s * 0.1); c.stroke();
    c.save();
    c.globalAlpha = 0.45; c.fillStyle = art.accCol || C.gold;
    c.beginPath(); c.arc(lx, ly, s * 0.2, 0, TAU); c.fill();
    c.restore();
    c.beginPath();
    c.moveTo(lx - s * 0.07, ly - s * 0.09); c.lineTo(lx + s * 0.07, ly - s * 0.09);
    c.lineTo(lx + s * 0.05, ly + s * 0.09); c.lineTo(lx - s * 0.05, ly + s * 0.09);
    c.closePath();
    inked(c, art.accCol || C.gold, lw * 0.8, C.ink);
    c.beginPath(); c.moveTo(lx - s * 0.07, ly - s * 0.09); c.lineTo(lx + s * 0.07, ly - s * 0.09);
    c.strokeStyle = C.ink; c.lineWidth = lw * 0.8; c.stroke();
  } else if (acc === 'kettle') {
    c.beginPath(); rr(c, -faceW * 0.2, faceY - faceH * 0.68, faceW * 0.4, faceH * 0.24, faceH * 0.05);
    inked(c, art.accCol || '#9aa7bd', lw * 0.9, C.ink);
    c.beginPath(); c.moveTo(faceW * 0.18, faceY - faceH * 0.6); c.lineTo(faceW * 0.34, faceY - faceH * 0.68);
    c.strokeStyle = C.ink; c.lineWidth = lw * 0.9; c.stroke();
    c.save(); c.globalAlpha = 0.5; c.strokeStyle = '#ffffff'; c.lineWidth = lw * 0.7;
    for (let i = 0; i < 2; i++) {
      const ph2 = t * 1.6 + i;
      const sx2 = -faceW * 0.04 + i * faceW * 0.1;
      c.beginPath();
      c.moveTo(sx2, faceY - faceH * 0.7);
      c.quadraticCurveTo(sx2 + Math.sin(ph2) * s * 0.06, faceY - faceH * 0.86, sx2, faceY - faceH * 1.0);
      c.stroke();
    }
    c.restore();
  } else if (acc === 'gear') {
    const gx = -bw * 0.42, gy = bodyY - bodyH * 0.1;
    c.save(); c.translate(gx, gy); c.rotate(t * 0.9);
    c.fillStyle = art.accCol || '#8fa2bd';
    for (let i = 0; i < 6; i++) {
      c.save(); c.rotate((i / 6) * TAU);
      c.beginPath(); rr(c, -s * 0.035, -s * 0.2, s * 0.07, s * 0.1, 2); c.fill();
      c.restore();
    }
    c.beginPath(); c.arc(0, 0, s * 0.14, 0, TAU);
    inked(c, art.accCol || '#8fa2bd', lw * 0.8, C.ink);
    c.beginPath(); c.arc(0, 0, s * 0.05, 0, TAU); c.fillStyle = C.ink; c.fill();
    c.restore();
  } else if (acc === 'hammer' || acc === 'pike' || acc === 'staff') {
    const hx = bw * 0.42;
    c.strokeStyle = '#8a6a3f'; c.lineWidth = lw * 1.4;
    c.beginPath(); c.moveTo(hx, bodyY + bodyH * 0.5); c.lineTo(hx - bw * 0.04, faceY - faceH * 0.4); c.stroke();
    if (acc === 'hammer') {
      c.beginPath(); rr(c, hx - bw * 0.2, faceY - faceH * 0.6, bw * 0.34, bh * 0.16, 4);
      inked(c, art.accCol || '#9aa7bd', lw * 0.9, C.ink);
    } else if (acc === 'pike') {
      c.beginPath();
      c.moveTo(hx - bw * 0.1, faceY - faceH * 0.4); c.lineTo(hx - bw * 0.04, faceY - faceH * 0.76);
      c.lineTo(hx + bw * 0.02, faceY - faceH * 0.4); c.closePath();
      inked(c, art.accCol || '#cfd8e8', lw * 0.8, C.ink);
    } else {
      c.beginPath(); c.arc(hx - bw * 0.04, faceY - faceH * 0.5, s * 0.11, 0, TAU);
      inked(c, art.accCol || '#6f8fd0', lw * 0.8, C.ink);
    }
  } else if (acc === 'cloak') {
    c.beginPath();
    c.moveTo(-bw * 0.44, bodyY - bodyH * 0.34);
    c.quadraticCurveTo(-bw * 0.58, bodyY + bodyH * 0.6, -bw * 0.08, bodyY + bodyH * 0.56);
    c.lineTo(-bw * 0.16, bodyY - bodyH * 0.4);
    c.closePath();
    inked(c, art.accCol || '#2b5f96', lw * 0.9, C.ink);
  } else if (acc === 'satchel') {
    c.save();
    c.strokeStyle = art.accCol || '#8a6a3f'; c.lineWidth = lw * 1.1;
    c.beginPath();
    c.moveTo(-bw * 0.24, bodyY - bodyH * 0.36); c.lineTo(bw * 0.2, bodyY + bodyH * 0.12); c.stroke();
    c.beginPath(); rr(c, bw * 0.12, bodyY + bodyH * 0.06, bw * 0.28, bh * 0.2, 4);
    inked(c, art.accCol || '#8a6a3f', lw * 0.9, C.ink);
    c.restore();
  } else if (acc === 'bellcollar') {
    c.beginPath();
    rr(c, -faceW * 0.3, faceY + faceH * 0.36, faceW * 0.6, faceH * 0.1, faceH * 0.05);
    inked(c, art.accCol || '#8a4a3f', lw * 0.9, C.ink);
    const swing = Math.sin(t * 3.1 + ph) * 0.5;
    c.save();
    c.translate(0, faceY + faceH * 0.46);
    c.rotate(swing * 0.3);
    c.beginPath();
    c.moveTo(-s * 0.05, 0);
    c.quadraticCurveTo(-s * 0.045, s * 0.07, 0, s * 0.085);
    c.quadraticCurveTo(s * 0.045, s * 0.07, s * 0.05, 0);
    c.closePath();
    inked(c, C.gold, lw * 0.8, C.ink);
    c.restore();
  } else if (acc === 'plating') {
    for (const d of [-1, 1]) {
      c.beginPath();
      c.moveTo(d * bw * 0.14, bodyY - bodyH * 0.42);
      c.lineTo(d * bw * 0.46, bodyY - bodyH * 0.22);
      c.lineTo(d * bw * 0.4, bodyY + bodyH * 0.18);
      c.lineTo(d * bw * 0.12, bodyY + bodyH * 0.02);
      c.closePath();
      inked(c, art.accCol || '#bcdcf4', lw * 0.9, C.ink);
      c.strokeStyle = 'rgba(20,30,50,.5)'; c.lineWidth = lw * 0.5;
      c.beginPath();
      c.moveTo(d * bw * 0.2, bodyY - bodyH * 0.3); c.lineTo(d * bw * 0.34, bodyY - bodyH * 0.02);
      c.lineTo(d * bw * 0.26, bodyY + bodyH * 0.08); c.stroke();
    }
  } else if (acc === 'goggles') {
    c.save();
    c.beginPath(); rr(c, -faceW * 0.36, faceY - faceH * 0.34, faceW * 0.72, faceH * 0.12, 4);
    inked(c, art.accCol || '#8a6a3f', lw * 0.8, C.ink);
    for (const d of [-1, 1]) {
      c.beginPath(); c.arc(d * faceW * 0.17, faceY - faceH * 0.28, s * 0.07, 0, TAU);
      inked(c, '#8fe3ff', lw * 0.8, C.ink);
    }
    c.restore();
  }
}

/* ------------------------------------------------------------- backdrop -- */
function initSnow() {
  snowflakes = [];
  for (let i = 0; i < 90; i++) {
    snowflakes.push({ x: rnd() * VW, y: rnd() * VH, r: 1 + rnd() * 2.6, s: 12 + rnd() * 34, d: rnd() * TAU });
  }
}
/* Silhouettes that say which country this is before a single word does. Three
   depths, each drifting at its own rate, all drawn from the same two or three
   shapes so a zone reads as one place. */
function drawSkyline(c, z, t) {
  const depths = [
    { y: 452, s: 0.55, a: 0.16, sp: 5 },
    { y: 478, s: 0.78, a: 0.24, sp: 11 },
    { y: 500, s: 1.0,  a: 0.34, sp: 19 },
  ];
  for (let d = 0; d < depths.length; d++) {
    const L = depths[d];
    const off = -((t * L.sp) % 260);
    c.save();
    c.globalAlpha = L.a;
    c.fillStyle = d === 2 ? '#0d1830' : d === 1 ? '#16233c' : '#1e3150';
    if (z.id === 'whitewood') {
      for (let i = -1; i < 10; i++) {
        const x = off + i * 260 + (d * 70);
        const h = (90 + ((i * 37) % 46)) * L.s;
        const w = 34 * L.s;
        c.beginPath();
        for (let k = 0; k < 3; k++) {
          const kh = h * (1 - k * 0.26), kw = w * (1 + k * 0.42);
          c.moveTo(x, L.y - kh);
          c.lineTo(x + kw, L.y - kh * 0.42 + k * 6);
          c.lineTo(x - kw, L.y - kh * 0.42 + k * 6);
        }
        c.closePath(); c.fill();
        c.fillRect(x - 4 * L.s, L.y - 12, 8 * L.s, 14);
      }
    } else if (z.id === 'shelf') {
      for (let i = -1; i < 8; i++) {
        const x = off + i * 300 + d * 90;
        const w = (150 + ((i * 53) % 90)) * L.s, h = (70 + ((i * 29) % 50)) * L.s;
        c.beginPath();
        c.moveTo(x, L.y);
        c.lineTo(x + w * 0.12, L.y - h);
        c.lineTo(x + w * 0.86, L.y - h * 0.82);
        c.lineTo(x + w, L.y);
        c.closePath(); c.fill();
        // the crack down the middle of a shelf that is about to stop being one
        c.save(); c.globalAlpha = L.a * 0.5; c.fillStyle = '#050a14';
        c.fillRect(x + w * 0.48, L.y - h * 0.8, 3 * L.s, h * 0.8);
        c.restore();
      }
    } else {
      for (let i = -1; i < 6; i++) {
        const x = off + i * 380 + d * 120;
        const w = (200 + ((i * 61) % 120)) * L.s, h = (180 + ((i * 43) % 90)) * L.s;
        c.beginPath();
        c.moveTo(x - w / 2, L.y);
        c.lineTo(x - w * 0.14, L.y - h);
        c.lineTo(x + w * 0.06, L.y - h * 0.78);
        c.lineTo(x + w * 0.3, L.y - h * 1.05);
        c.lineTo(x + w / 2, L.y);
        c.closePath(); c.fill();
      }
    }
    c.restore();
  }
}

/* The near layer: whatever is close enough to the camera to have edges. Each
   zone gets its own, drawn over the ground rather than into the ridge line, so
   the three places do not read as one place in three tints. */
function drawNearScenery(c, z, t) {
  c.save();
  if (z.id === 'whitewood') {
    // conifers at the edges of frame, snow on the branches, out of the way of
    // everything the player has to read in the middle
    const trees = [[SAFE + 20, 1.0], [SAFE + 128, 0.72], [VW - SAFE - 40, 1.06], [VW - SAFE - 150, 0.66]];
    for (const [tx, sc] of trees) {
      const h = 250 * sc, base = 600 + 20 * sc;
      c.save();
      c.translate(tx, base);
      c.rotate(Math.sin(t * 0.4 + tx) * 0.006);
      c.fillStyle = '#0f2036';
      c.fillRect(-7 * sc, -30 * sc, 14 * sc, 34 * sc);
      for (let k = 0; k < 4; k++) {
        const kh = h * (1 - k * 0.19), kw = 62 * sc * (1 + k * 0.3);
        c.beginPath();
        c.moveTo(0, -kh);
        c.lineTo(kw, -kh * 0.4 + k * 16 * sc);
        c.lineTo(-kw, -kh * 0.4 + k * 16 * sc);
        c.closePath();
        c.fillStyle = k % 2 ? '#12253d' : '#152b46';
        c.fill();
        // the snow that settles on top of each tier
        c.beginPath();
        c.moveTo(0, -kh);
        c.lineTo(kw * 0.5, -kh * 0.7 + k * 8 * sc);
        c.lineTo(-kw * 0.5, -kh * 0.7 + k * 8 * sc);
        c.closePath();
        c.fillStyle = 'rgba(226,240,255,.5)';
        c.fill();
      }
      c.restore();
    }
  } else if (z.id === 'shelf') {
    // broken plates with black water between them
    c.fillStyle = '#08121f';
    c.fillRect(0, 560, VW, VH - 560);
    const plates = [[-40, 560, 380, 1], [330, 592, 300, 0.9], [610, 566, 420, 1.05], [980, 600, 360, 0.86]];
    for (const [px, py, pw, sc] of plates) {
      const bobY = Math.sin(t * 0.5 + px * 0.01) * 3;
      c.save();
      c.translate(px, py + bobY);
      c.beginPath();
      c.moveTo(0, 0);
      c.lineTo(pw * 0.06, -18 * sc);
      c.lineTo(pw * 0.9, -14 * sc);
      c.lineTo(pw, 6);
      c.lineTo(pw * 0.84, 150);
      c.lineTo(pw * 0.1, 150);
      c.closePath();
      c.fillStyle = '#dfe4f8'; c.fill();
      c.beginPath();
      c.moveTo(pw * 0.06, -18 * sc); c.lineTo(pw * 0.9, -14 * sc); c.lineTo(pw, 6); c.lineTo(0, 0);
      c.closePath();
      c.fillStyle = '#b9c8e8'; c.fill();
      c.restore();
      // the water's edge catching what light there is
      c.save();
      c.globalAlpha = 0.35; c.strokeStyle = '#6fd8ff'; c.lineWidth = 2;
      c.beginPath(); c.moveTo(px, py + bobY); c.lineTo(px + pw, py + 6 + bobY); c.stroke();
      c.restore();
    }
  } else {
    // a jagged skyline with one lit thing on it, a long way off
    c.save();
    c.globalAlpha = 0.55;
    c.fillStyle = '#1a1226';
    c.beginPath();
    c.moveTo(0, VH);
    c.lineTo(0, 500);
    const peaks = [[60, 430], [140, 505], [230, 380], [330, 470], [430, 440], [560, 505], [700, 415],
      [820, 486], [940, 360], [1050, 470], [1160, 430], [1280, 500]];
    for (const [px, py] of peaks) c.lineTo(px * (VW / 1280), py);
    c.lineTo(VW, VH);
    c.closePath();
    c.fill();
    c.restore();
    // the light: a watchfire on the far peak, still burning
    const lx = 940 * (VW / 1280), ly = 352;
    const flick = 0.6 + Math.sin(t * 5.3) * 0.2 + Math.sin(t * 11) * 0.1;
    c.save();
    c.globalCompositeOperation = 'lighter';
    c.globalAlpha = 0.5 * flick;
    const gl = c.createRadialGradient(lx, ly, 0, lx, ly, 90);
    gl.addColorStop(0, '#ffb85c'); gl.addColorStop(1, 'rgba(255,184,92,0)');
    c.fillStyle = gl;
    c.beginPath(); c.arc(lx, ly, 90, 0, TAU); c.fill();
    c.restore();
    c.beginPath(); c.arc(lx, ly, 4 + flick * 2, 0, TAU);
    c.fillStyle = '#ffe6a8'; c.fill();
  }
  c.restore();
}

function drawBackdrop(c, zone, t) {
  const z = ZONES[clamp(zone || 0, 0, ZONES.length - 1)];
  const g2 = c.createLinearGradient(0, 0, 0, VH);
  g2.addColorStop(0, z.sky[0]); g2.addColorStop(1, z.sky[1]);
  c.fillStyle = g2; c.fillRect(0, 0, VW, VH);

  // aurora
  c.save();
  c.globalAlpha = 0.20; c.globalCompositeOperation = 'lighter';
  for (let i = 0; i < 3; i++) {
    const gg = c.createLinearGradient(0, 60 + i * 40, VW, 200 + i * 40);
    gg.addColorStop(0, 'rgba(0,0,0,0)');
    gg.addColorStop(0.5, i % 2 ? z.tint : '#6fd8ff');
    gg.addColorStop(1, 'rgba(0,0,0,0)');
    c.fillStyle = gg;
    c.beginPath();
    c.moveTo(-64, 120 + i * 46 + Math.sin(t * 0.3 + i) * 22);
    sweepX(c, 64, (x) => 120 + i * 46 + Math.sin(t * 0.3 + i + x * 0.004) * 26);
    c.lineTo(VW + 64, 0); c.lineTo(-64, 0); c.closePath(); c.fill();
  }
  c.restore();

  // far ridges
  for (let layer = 0; layer < 3; layer++) {
    const base = 300 + layer * 54;
    const amp = 70 - layer * 16;
    c.beginPath(); c.moveTo(-40, VH);
    c.lineTo(-40, base);
    sweepX(c, 40, (x) =>
      base - Math.abs(Math.sin(x * 0.0037 + layer * 2.1)) * amp - Math.sin(x * 0.011 + layer) * 12);
    c.lineTo(VW + 40, VH); c.closePath();
    c.fillStyle = ['rgba(255,255,255,.06)', 'rgba(255,255,255,.10)', 'rgba(255,255,255,.15)'][layer];
    c.fill();
  }

  // the shape of this particular country, in three depths
  drawSkyline(c, z, t);

  // ground
  const gg = c.createLinearGradient(0, 470, 0, VH);
  gg.addColorStop(0, z.ground); gg.addColorStop(1, '#9fb6d6');
  c.fillStyle = gg;
  c.beginPath();
  c.moveTo(-48, 520);
  sweepX(c, 48, (x) => 500 + Math.sin(x * 0.006) * 14);
  c.lineTo(VW + 48, VH); c.lineTo(-48, VH); c.closePath(); c.fill();

  drawNearScenery(c, z, t);

  /* Weather, which is the fastest way to say where you are without a label:
     the Whitewood drifts, the Shelf is scoured by wind, the Peak rains ash. */
  if (snowflakes) {
    const kind = z.id === 'whitewood' ? 'snow' : z.id === 'shelf' ? 'wind' : 'ash';
    c.save();
    for (const f of snowflakes) {
      if (kind === 'wind') {
        f.x += 3.2 + f.s * 0.03;
        f.y += Math.sin(t * 0.9 + f.d) * 0.4;
        if (f.x > VW + 40) { f.x = -40; f.y = rnd() * VH; }
        c.globalAlpha = 0.1 + (f.r / 3.6) * 0.3;
        c.strokeStyle = '#dff0ff'; c.lineWidth = f.r * 0.7;
        c.beginPath(); c.moveTo(f.x, f.y); c.lineTo(f.x - 26 - f.s * 0.4, f.y + 1.5); c.stroke();
      } else if (kind === 'ash') {
        f.y += f.s * 0.009;
        f.x += Math.sin(t * 1.3 + f.d) * 0.9;
        if (f.y > VH + 4) { f.y = -4; f.x = rnd() * VW; }
        c.globalAlpha = 0.18 + (f.r / 3.6) * 0.4;
        c.fillStyle = f.r > 2.2 ? '#ffb066' : '#8b8496';
        c.beginPath(); c.arc(f.x, f.y, f.r * 0.8, 0, TAU); c.fill();
      } else {
        f.y += f.s * 0.016; f.x += Math.sin(t * 0.7 + f.d) * 0.5;
        if (f.y > VH + 4) { f.y = -4; f.x = rnd() * VW; }
        c.globalAlpha = 0.25 + (f.r / 3.6) * 0.6;
        c.fillStyle = 'rgba(255,255,255,.85)';
        c.beginPath(); c.arc(f.x, f.y, f.r, 0, TAU); c.fill();
      }
    }
    c.restore();
  }
  // vignette
  const v = c.createRadialGradient(VW / 2, VH / 2, 260, VW / 2, VH / 2, 760);
  v.addColorStop(0, 'rgba(0,0,0,0)'); v.addColorStop(1, 'rgba(0,0,0,.42)');
  c.fillStyle = v; c.fillRect(0, 0, VW, VH);
}

/* ------------------------------------------------------------ card faces -- */
const RARE_COL = { 1: '#8fa6c4', 2: '#6fd8ff', 3: '#ffd166' };

function statPip(c, x, y, r, col, val, icon) {
  c.beginPath(); c.arc(x, y, r, 0, TAU);
  inked(c, col, 3, C.ink);
  // A two-digit health at the one-digit size hangs off the rim and reads as a
  // letter. Shrink the number to fit the circle instead of the other way round.
  const n = String(val);
  const sz = r * (n.length >= 3 ? 0.95 : n.length === 2 ? 1.16 : 1.5);
  txt(c, n, x, y + 1, sz, '#12203a', 'center', 'd', 0);
}
/* Statuses run left to right along the slab's own strip. Four fit; a fifth is
   counted rather than drawn, because a unit you cannot see is worse than a
   status you cannot read. */
/* THE TEN STATUS MARKS, WHICH WERE SPECIFIED AND NEVER DRAWN.

   Every status has carried an `icon` since the first week and nothing ever read
   it: the board draws a coloured square with the VALUE in it, which is right
   mid-fight, and the help page drew a hardcoded letter "N" in every one of the
   ten pips. So the statuses page — the screen whose whole job is teaching you
   what these are — showed ten identical N's and had done for thirty rounds. */
function statusGlyph(c, icon, x, y, s, col) {
  c.save();
  c.translate(x, y);
  c.lineWidth = Math.max(1.6, s * 0.16);
  c.lineCap = 'round'; c.lineJoin = 'round';
  c.strokeStyle = col; c.fillStyle = col;
  const P = (pts, close) => {
    c.beginPath();
    pts.forEach(([px, py], i) => (i ? c.lineTo(px * s, py * s) : c.moveTo(px * s, py * s)));
    if (close) c.closePath();
  };
  if (icon === 'frost') {
    for (let i = 0; i < 3; i++) {
      const a = (i / 3) * Math.PI;
      c.beginPath();
      c.moveTo(Math.cos(a) * s, Math.sin(a) * s);
      c.lineTo(-Math.cos(a) * s, -Math.sin(a) * s);
      c.stroke();
    }
  } else if (icon === 'ember') {
    P([[0, -1], [0.62, -0.05], [0.36, 0.82], [-0.36, 0.82], [-0.62, -0.05]], true);
    c.fill();
  } else if (icon === 'shell') {
    P([[-0.78, -0.72], [0.78, -0.72], [0.78, 0.1], [0, 0.92], [-0.78, 0.1]], true);
    c.fill();
  } else if (icon === 'spice') {
    for (let i = 0; i < 4; i++) {
      const a = (i / 4) * Math.PI;
      c.beginPath();
      c.moveTo(Math.cos(a) * s * 0.95, Math.sin(a) * s * 0.95);
      c.lineTo(-Math.cos(a) * s * 0.95, -Math.sin(a) * s * 0.95);
      c.stroke();
    }
  } else if (icon === 'weak') {
    P([[-0.8, -0.5], [0, 0.35], [0.8, -0.5]]); c.stroke();
    P([[-0.8, 0.15], [0, 1.0], [0.8, 0.15]]); c.stroke();
  } else if (icon === 'swift') {
    P([[-0.8, 0.5], [0, -0.35], [0.8, 0.5]]); c.stroke();
    P([[-0.8, -0.15], [0, -1.0], [0.8, -0.15]]); c.stroke();
  } else if (icon === 'slow') {
    P([[-0.7, -0.85], [0.7, -0.85], [-0.7, 0.85], [0.7, 0.85]], true);
    c.fill();
  } else if (icon === 'regen') {
    P([[-0.28, -0.9], [0.28, -0.9], [0.28, -0.28], [0.9, -0.28],
       [0.9, 0.28], [0.28, 0.28], [0.28, 0.9], [-0.28, 0.9],
       [-0.28, 0.28], [-0.9, 0.28], [-0.9, -0.28], [-0.28, -0.28]], true);
    c.fill();
  } else if (icon === 'thorns') {
    c.beginPath();
    for (let i = 0; i < 12; i++) {
      const a = (i / 12) * TAU - Math.PI / 2, r = (i % 2 ? 0.42 : 1) * s;
      const px = Math.cos(a) * r, py = Math.sin(a) * r;
      i ? c.lineTo(px, py) : c.moveTo(px, py);
    }
    c.closePath(); c.fill();
  } else if (icon === 'bounty') {
    c.beginPath(); c.arc(0, 0, s * 0.9, 0, TAU); c.fill();
    c.beginPath(); c.arc(0, 0, s * 0.48, 0, TAU);
    c.globalCompositeOperation = 'destination-out'; c.fill();
  } else {
    c.beginPath(); c.arc(0, 0, s * 0.7, 0, TAU); c.fill();
  }
  c.restore();
}

function drawStatus(c, u, x, y, sz) {
  const on = STATUS_ORDER.filter((k) => u.st[k]);
  const room = 4;
  on.slice(0, room).forEach((k, i) => {
    const px = x + i * (sz + 3);
    c.beginPath(); rr(c, px, y, sz, sz, 4);
    inked(c, STATUS[k].col, 2, C.ink);
    txt(c, String(u.st[k]), px + sz / 2, y + sz / 2 + 1, sz * 0.78, '#12203a', 'center', 'd', 0);
  });
  if (on.length > room) txt(c, '+' + (on.length - room), x + room * (sz + 3) + 6, y + sz / 2, 12, '#cfe4ff', 'left', 't');
}

/* A unit standing on the board: a small slab with the creature on it. */
/* A BEAST HAS TO LOOK LIKE ONE. The Hollow King carries 82 health next to a
   Chillfang's 12 and for thirty rounds it was drawn on the identical slab, at
   the identical size, in the identical frame — nothing on the board said which
   of the two was the thing the zone is named after. It gets a slab a quarter
   again as large, a gold double frame, and a pair of horns over the top edge.
   The scale is about the unit's own centre, so it grows into the 22 units of
   margin the board already keeps above and below the lanes rather than pushing
   anything; the render suite checks that at every device shape including the
   653x280 cover display. */
const BOSS_SCALE = 1.24;
function drawUnit(c, u, t) {
  const w = SLOT_W, h = SLOT_H;
  const x = u.px - w / 2, y = u.py - h / 2;
  const dying = !u.alive;
  c.save();
  if (u.boss) {
    c.translate(u.px, u.py);
    c.scale(BOSS_SCALE, BOSS_SCALE);
    c.translate(-u.px, -u.py);
  }
  if (dying) {
    const k = clamp(u.dead / 0.55, 0, 1);
    const kind = u.deathKind || deathKind(u.art);
    c.globalAlpha = 1 - k;
    c.translate(u.px, u.py);
    if (kind === 'shatter') { c.scale(1 + k * 0.22, 1 - k * 0.1); c.rotate((k - 0.5) * 0.12); }
    else if (kind === 'clank') { c.rotate(k * 1.35); c.translate(0, k * 34); }
    else if (kind === 'puff') { c.scale(1 + k * 0.3, 1 + k * 0.3); c.translate(0, -k * 26); }
    else if (kind === 'scatter') { c.scale(1 - k * 0.4, 1 + k * 0.5); c.translate(0, -k * 40); }
    else { c.rotate(k * 0.5); c.translate(0, k * 26); }
    c.translate(-u.px, -u.py);
  }
  if (u.tilt) {
    c.translate(u.px, u.py);
    c.rotate(u.tilt);
    c.translate(-u.px, -u.py);
  }
  const tribeCol = u.boss ? '#ffb347' : u.side === 'p' ? (u.leader ? C.gold : '#7fb2e8') : '#d08a8a';
  if (u.boss) {
    // horns, drawn under the slab so they read as coming out from behind it
    c.save();
    c.beginPath();
    c.moveTo(x + 14, y + 10);
    c.quadraticCurveTo(x - 6, y - 14, x + 4, y - 30);
    c.quadraticCurveTo(x + 22, y - 16, x + 30, y + 6);
    c.closePath();
    c.moveTo(x + w - 14, y + 10);
    c.quadraticCurveTo(x + w + 6, y - 14, x + w - 4, y - 30);
    c.quadraticCurveTo(x + w - 22, y - 16, x + w - 30, y + 6);
    c.closePath();
    inked(c, '#c9922c', 2.5, C.ink);
    c.restore();
  }
  panel(c, x, y, w, h, 14, u.side === 'p' ? '#1d2c49' : u.boss ? '#4a2338' : '#3a2436', tribeCol);
  if (u.boss) {
    rr(c, x + 4, y + 4, w - 8, h - 8, 11);
    c.lineWidth = 1.6; c.strokeStyle = 'rgba(255,209,102,.55)'; c.stroke();
  }

  // a strip along the top that belongs to the statuses alone, so nothing ever
  // gets written across a creature's face
  const stripH = 22;
  c.beginPath(); rr(c, x + 6, y + 5, w - 12, stripH, 7);
  c.fillStyle = u.side === 'p' ? 'rgba(10,18,34,.55)' : 'rgba(32,10,20,.55)';
  c.fill();

  // inner art window
  const iw = w - 14, ih = h - 48 - stripH;
  const iy = y + 5 + stripH + 3;
  c.save();
  rr(c, x + 7, iy, iw, ih, 10);
  c.clip();
  const gg = c.createLinearGradient(0, iy, 0, iy + ih);
  gg.addColorStop(0, u.side === 'p' ? '#31507f' : '#5c3450');
  gg.addColorStop(1, u.side === 'p' ? '#16233c' : '#2a1524');
  c.fillStyle = gg; c.fillRect(x + 7, iy, iw, ih);
  c.save();
  c.globalAlpha = 0.2; c.fillStyle = '#000';
  c.beginPath(); c.ellipse(u.px, iy + ih * 0.9, iw * 0.34, ih * 0.09, 0, 0, TAU); c.fill();
  c.restore();
  drawCreature(c, u.art, u.px, iy + ih * 0.70, ih * 0.92, {
    t, ph: u.bob, sq: u.sq, blink: u.blink, flip: u.side === 'e',
  });
  c.restore();

  /* A beast that has turned over wears it: the light behind it goes hot, a
     crack runs down the art, and the slab edge stops being the colour it was.
     A banner you might have blinked past is not enough for the moment the
     fight changes. */
  if (u.phased) {
    c.save();
    rr(c, x + 7, iy, iw, ih, 10);
    c.clip();
    c.globalCompositeOperation = 'lighter';
    c.globalAlpha = 0.16 + Math.sin(t * 2.4 + u.bob) * 0.06;
    c.fillStyle = '#ff7a2c';
    c.fillRect(x + 7, iy, iw, ih);
    c.restore();
    // the crack itself, jagged and fixed to this unit rather than jittering
    c.save();
    rr(c, x + 7, iy, iw, ih, 10);
    c.clip();
    const seed2 = (u.uid % 7) - 3;
    c.strokeStyle = 'rgba(255,140,60,.85)'; c.lineWidth = 2.4;
    c.beginPath();
    c.moveTo(x + 7 + iw * 0.32 + seed2 * 3, iy);
    c.lineTo(x + 7 + iw * 0.52 + seed2, iy + ih * 0.3);
    c.lineTo(x + 7 + iw * 0.36, iy + ih * 0.52);
    c.lineTo(x + 7 + iw * 0.62 - seed2, iy + ih * 0.78);
    c.lineTo(x + 7 + iw * 0.48, iy + ih);
    c.stroke();
    c.strokeStyle = 'rgba(255,230,168,.55)'; c.lineWidth = 1;
    c.stroke();
    c.restore();
    // and a glow around the whole slab
    c.save();
    c.globalAlpha = 0.5 + Math.sin(t * 3) * 0.18;
    c.strokeStyle = '#ff9a3c'; c.lineWidth = 3;
    rr(c, x - 2, y - 2, w + 4, h + 4, 16);
    c.stroke();
    c.restore();
  }

  /* The front row burns two counters a turn, which is the most important thing
     on the board and would otherwise be invisible. It is said twice: here, next
     to the counter of whoever is standing in it, and once under the column. */
  if (u.col === 0 && u.alive) {
    const cx2 = x + w - 40, cy2 = y + 16;
    c.save();
    c.globalAlpha = 0.95;
    panel(c, cx2 - 15, cy2 - 9, 30, 19, 6, '#3d2a12', '#ffb347');
    txt(c, '×2', cx2, cy2 + 1, 12.5, '#ffd166', 'center', 'd', 0);
    c.restore();
  }

  if (u.flash > 0) {
    c.save(); c.globalAlpha = u.flash * 0.7; c.globalCompositeOperation = 'lighter';
    rr(c, x + 7, iy, iw, ih, 10); c.fillStyle = '#ff9aa5'; c.fill();
    c.restore();
  }

  // name strip — shrunk to fit rather than run off the slab
  const nSize = fitText(c, u.name.toUpperCase(), w - 26, 12.5, 7.5, 't');
  txt(c, u.name.toUpperCase(), u.px, y + h - 30, nSize, u.side === 'p' ? '#dbeaff' : '#ffd8d8', 'center', 't');

  // stats
  /* The same three silhouettes the card face uses. A slab and a card showing
     the same warden were reading its attack off two different shapes. */
  if (u.atk > 0 || u.leader) statBadge(c, 'atk', x + 14, y + h - 13, 12, '#ff8b7a', u.atk + stat(u, 'spice'));
  statBadge(c, 'hp', x + w - 14, y + h - 13, 12, '#7de08f', u.hp);
  // the counter: it drops with a physical knock rather than swapping numbers
  const ready = u.cnt <= 1;
  const kick = u.tick || 0;
  c.save();
  c.translate(x + w - 13, y + 13 + kick * 5);
  const cs = 1 + kick * 0.35;
  c.scale(cs, cs * (1 - kick * 0.15));
  if (ready) { c.shadowColor = '#ffd166'; c.shadowBlur = 14 + (ready ? Math.sin(t * 6) * 4 : 0); }
  c.beginPath(); c.arc(0, 0, 15, 0, TAU);
  inked(c, kick > 0.4 ? '#ffffff' : ready ? '#ffd166' : '#cfe0f5', 3, C.ink);
  txt(c, String(u.cnt), 0, 1, 20, '#12203a', 'center', 'd', 0);
  c.restore();
  if (kick > 0.05) {
    c.save();
    c.globalAlpha = kick * 0.8;
    c.strokeStyle = '#ffd166'; c.lineWidth = 2.5;
    c.beginPath(); c.arc(x + w - 13, y + 13, 15 + (1 - kick) * 16, 0, TAU); c.stroke();
    c.restore();
  }

  drawStatus(c, u, x + 9, y + 6, 20);

  // charms hang off the bottom corner and swing a little as the unit breathes
  const worn = (u.card && u.card.charms) || [];
  for (let i = 0; i < worn.length; i++) {
    const chm = chOf(worn[i]);
    if (!chm) continue;
    const sway = Math.sin(t * 2.2 + u.bob + i) * 0.22;
    const ax = x + 16 + i * 15, ay = y + h - 2;
    c.save();
    c.translate(ax, ay);
    c.rotate(sway);
    c.strokeStyle = C.ink; c.lineWidth = 2;
    c.beginPath(); c.moveTo(0, -6); c.lineTo(0, 7); c.stroke();
    c.beginPath(); c.arc(0, 12, 5.5, 0, TAU);
    inked(c, chm.col, 2, C.ink);
    c.restore();
  }

  if (u.leader) {
    c.beginPath();
    c.moveTo(u.px - 16, y - 4); c.lineTo(u.px - 16, y - 16); c.lineTo(u.px - 6, y - 9);
    c.lineTo(u.px, y - 19); c.lineTo(u.px + 6, y - 9); c.lineTo(u.px + 16, y - 16); c.lineTo(u.px + 16, y - 4);
    c.closePath();
    inked(c, C.gold, 2.5, C.ink);
  }
  c.restore();
}

/* Shrink a label until it fits the width it has been given. A name that runs
   off its own banner is the fastest way to make a card look unfinished. */
function fitText(c, str, maxW, start, min, face) {
  // it cannot usefully shrink below what the device can render legibly
  min = Math.max(min, textSize(0));
  let size = Math.max(start, min);
  const f = face === 'd' ? "'Frostcut','Trebuchet MS',sans-serif" : "'Frostwork','Trebuchet MS',sans-serif";
  while (size > min) {
    c.font = (face === 'd' ? '' : '600 ') + size + 'px ' + f;
    if (c.measureText(str).width <= maxW) break;
    size -= 0.5;
  }
  return size;
}
/* Keep the first n lines and end the last one in an ellipsis, so a paragraph
