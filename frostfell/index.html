function drawShrine(c, t) {
  const g = G;
  drawBackdrop(c, g.run.zone, t);
  drawHud(c, t);
  txt(c, 'A SHRINE THAT ANSWERS', MID, 92, 36, '#ffe6a8', 'center', 'd');
  wrapText(c, 'Old stone, warm to the hand in weather that should not allow it. Leave one card of your caravan on the step overnight and it will be given back better than it was.', 17, 820)
    .forEach((ln, i) => txt(c, ln, MID, 140 + i * lineH(17, 24), 17, '#bcd4f0', 'center', 't'));

  /* The stone itself — the same one the roadside shrine event draws, at twice
     the size. It was a flat pentagon on a flat disc, which is a shame for the
     one place in the game described as warm to the hand. */
  c.save();
  c.globalAlpha = 0.35; c.fillStyle = '#0d1830';
  c.beginPath(); c.ellipse(MID, 388, 92, 16, 0, 0, TAU); c.fill();
  c.restore();
  c.save();
  c.translate(MID, 330); c.scale(1.7, 1.7);
  drawEventArt(c, 'shrine', 0, 0, t);
  c.restore();

  /* LOOKED AT ON AN ULTRAWIDE FOR THE FIRST TIME IN TWENTY-NINE ROUNDS.

     The stone is drawn at 1.7x from y=330, so its base and its shadow reach
     past y=520 — and both buttons sat at 452, on top of the stone's foot, with
     the explainer at 536 half-swallowed by the snow bank behind it. Nothing
     checks for a button drawn over the art, and nothing will; this came from
     looking at the screen, which is still the only thing that catches it.

     The row moves below the shadow and the explainer moves ABOVE the buttons,
     where the dark band behind the stone backs it instead of the snow. */
  const sy2 = 566;
  /* And it needs a ground. Moved above the buttons it landed on the snow bank,
     which is nearly white — the contrast check passes it because the glyphs are
     outlined and an outline gives a light glyph its edge, but edge definition
     is not figure-ground and pale blue on snow still reads badly. A dark pill
     behind it is the fix; the limitation is written down in the README. */
  const note = 'the blessed card keeps +2 attack and +3 health for the rest of the run';
  c.save();
  c.font = '600 13px "Frostwork","Trebuchet MS",sans-serif';
  const nw = c.measureText(note).width + 26;
  c.beginPath(); rr(c, MID - nw / 2, sy2 - 33, nw, 26, 9);
  c.fillStyle = 'rgba(12,22,40,.72)'; c.fill();
  c.restore();
  txt(c, note, MID, sy2 - 20, 13, '#c8dcf4', 'center', 't');
  button(c, 'shrineGive', MID - 300, sy2, 280, 62, 'LEAVE A CARD', '#8f7f3f');
  button(c, 'shrineWalk', MID + 20, sy2, 280, 62, 'WALK ON', '#40527a');
}

/* THE ONE SCREEN ALLOWED TO BE WARM.

   A crossing used to be drawn on Hollow Peak's ash-grey backdrop with a wheel
   of dusty gold wedges turning behind the title — beige starburst over grey
   polygons, in a game that is blue in every other frame, and the only screen
   whose whole job is to feel like a reward. This is its own sky: a cold night
   at the top falling to a lit horizon, three aurora ribbons in the game's own
   frost and gold, a sun coming up off the far shore, and the snow taking the
   light. The winter lets go, and the palette says so. */
function drawDawn(c, t) {
  const sky = c.createLinearGradient(0, 0, 0, VH);
  sky.addColorStop(0, '#0a1730');
  sky.addColorStop(0.42, '#28406e');
  sky.addColorStop(0.68, '#8a6f8e');
  sky.addColorStop(0.82, '#e8a765');
  sky.addColorStop(1, '#ffd9a0');
  c.fillStyle = sky; c.fillRect(0, 0, VW, VH);

  // the sun, low and huge, sitting on the horizon it is about to clear
  const hy = VH * 0.79;
  c.save();
  c.globalCompositeOperation = 'lighter';
  const glow = c.createRadialGradient(MID, hy, 8, MID, hy, VW * 0.42);
  glow.addColorStop(0, 'rgba(255,226,168,.85)');
  glow.addColorStop(0.22, 'rgba(255,170,90,.30)');
  glow.addColorStop(1, 'rgba(255,150,80,0)');
  c.fillStyle = glow; c.fillRect(0, 0, VW, VH);
  c.restore();
  c.save();
  c.beginPath(); c.arc(MID, hy + 12, 74, 0, TAU);
  c.fillStyle = '#fff0cc'; c.fill();
  c.restore();

  // aurora, three ribbons, in frost and gold rather than dusty pink
  c.save();
  c.globalCompositeOperation = 'lighter';
  const ribbons = [['#6fd8ff', 0.20, 118, 1.0], ['#a9f0d0', 0.14, 176, 1.7], ['#ffd166', 0.10, 232, 2.4]];
  ribbons.forEach(([col, a, baseY, sp], k) => {
    c.beginPath();
    c.moveTo(-40, baseY);
    sweepX(c, 40, (x) => baseY + Math.sin(x * 0.006 + t * 0.22 * sp + k) * 34
      + Math.sin(x * 0.013 + t * 0.15) * 14);
    c.lineTo(VW + 40, baseY - 150); c.lineTo(-40, baseY - 150); c.closePath();
    const gg = c.createLinearGradient(0, baseY - 150, 0, baseY + 30);
    gg.addColorStop(0, 'rgba(255,255,255,0)');
    gg.addColorStop(1, col);
    c.globalAlpha = a + Math.sin(t * 0.6 + k) * 0.03;
    c.fillStyle = gg; c.fill();
  });
  c.restore();

  // the far shore, and the snow in front of it taking the light
  c.save();
  c.beginPath();
  c.moveTo(0, VH);
  c.lineTo(0, hy + 26);
  c.quadraticCurveTo(VW * 0.26, hy + 4, VW * 0.5, hy + 20);
  c.quadraticCurveTo(VW * 0.76, hy + 36, VW, hy + 10);
  c.lineTo(VW, VH); c.closePath();
  const bank = c.createLinearGradient(0, hy, 0, VH);
  bank.addColorStop(0, '#ffe9c8');
  bank.addColorStop(0.5, '#e6d6e8');
  bank.addColorStop(1, '#bcc6e4');
  c.fillStyle = bank; c.fill();
  c.restore();

  // a few motes coming up rather than snow coming down
  c.save();
  c.globalCompositeOperation = 'lighter';
  for (let i = 0; i < 40; i++) {
    const sx = ((i * 173) % 1000) / 1000 * VW;
    const sy = VH - ((t * 14 + i * 47) % (VH * 0.8));
    c.globalAlpha = 0.10 + 0.10 * Math.sin(t + i);
    c.fillStyle = '#ffe6b8';
    c.beginPath(); c.arc(sx, sy, 1.6 + (i % 3), 0, TAU); c.fill();
  }
  c.restore();
}

/* AND ITS OTHER HALF. A defeat was the Whitewood at 45% opacity — a zone you
   have already walked, dimmed, and possibly not even the one that killed you.
   The crossing got a dawn; this gets the hour before one. Everything is the
   same shape as `drawDawn` and every colour is its opposite: the light is under
   the horizon rather than over it, the aurora has gone out, the snow is coming
   down instead of the motes going up, and the far shore is a wall rather than a
   shore. Two halves of the same moment, drawn with the same care. */
function drawDusk(c, t) {
  const sky = c.createLinearGradient(0, 0, 0, VH);
  sky.addColorStop(0, '#03060e');
  sky.addColorStop(0.38, '#0a1224');
  sky.addColorStop(0.7, '#16233c');
  sky.addColorStop(0.88, '#233047');
  sky.addColorStop(1, '#2c3850');
  c.fillStyle = sky; c.fillRect(0, 0, VW, VH);

  // the light that did not come up: a cold smear below the horizon line
  const hy = VH * 0.74;
  c.save();
  c.globalCompositeOperation = 'lighter';
  const glow = c.createRadialGradient(MID, hy + 90, 8, MID, hy + 90, VW * 0.34);
  glow.addColorStop(0, 'rgba(90,130,190,.30)');
  glow.addColorStop(1, 'rgba(60,90,140,0)');
  c.fillStyle = glow; c.fillRect(0, 0, VW, VH);
  c.restore();

  /* A wall of weather across the middle distance, three ridges deep.

     THE STEP HAS TO LAND ON VW AND IT DID NOT. `x += 60` from 0 stops at the
     last multiple of 60 below VW, and the `lineTo(VW, VH)` that followed then
     dropped straight down from there — a hard vertical seam through all three
     ridges, 40 units in from the right edge at VW=1600. Invisible at 1280
     (a multiple of 60 lands at 1260, close enough to the edge to read as the
     frame) and glaring at 2400x1080, which is exactly why the walk is run at
     three sizes. It sweeps past both edges now and never lands on them. */
  const ridges = [[0.62, '#0e1730', 1.0], [0.70, '#131e3c', 0.7], [0.78, '#1a2748', 0.45]];
  ridges.forEach(([f, col, sp], k) => {
    c.beginPath();
    c.moveTo(-60, VH);
    c.lineTo(-60, VH * f);
    sweepX(c, 60, (x) => VH * f + Math.sin(x * 0.004 + k * 2.1 + t * 0.02 * sp) * 26
      + Math.sin(x * 0.011 + k) * 11);
    c.lineTo(VW + 60, VH); c.closePath();
    c.fillStyle = col; c.fill();
  });

  // the ground: no light on it, just a long grey drift
  c.save();
  c.beginPath();
  c.moveTo(0, VH);
  c.lineTo(0, hy + 58);
  c.quadraticCurveTo(VW * 0.42, hy + 30, VW, hy + 66);
  c.lineTo(VW, VH); c.closePath();
  const bank = c.createLinearGradient(0, hy + 30, 0, VH);
  bank.addColorStop(0, '#4a5878');
  bank.addColorStop(1, '#2b3450');
  c.fillStyle = bank; c.fill();
  c.restore();

  // snow, driving rather than drifting
  c.save();
  /* NINETY IDENTICAL DASHES IS NOT SNOW, IT IS A SCRATCHED LENS, and that is
     what the first cut of this looked like at all three sizes: one length, one
     weight, one of four alphas, evenly scattered.

     Depth is the whole fix, and the important half is that ONE number drives
     all five properties. A streak that is long and dim, or thin and fast, reads
     as noise however carefully each property was randomised on its own — near
     flakes have to be long AND bright AND thick AND fast together, because that
     is the only thing the eye is actually reading. */
  for (let i = 0; i < 120; i++) {
    const near = ((i * 37) % 100) / 100;              // 0 far … 1 near
    const drift = 22 + near * 46;
    const fall = 34 + near * 96;
    const sx = (((i * 191) % 1000) / 1000 * (VW + 200) + t * drift) % (VW + 200) - 100;
    const sy = (((i * 271) % 1000) / 1000 * VH + t * fall) % VH;
    const len = 6 + near * 17;
    c.globalAlpha = 0.05 + 0.22 * near;
    c.strokeStyle = '#c8d8f0'; c.lineWidth = 0.7 + near * 1.5;
    c.beginPath(); c.moveTo(sx, sy);
    c.lineTo(sx - len * 0.5, sy + len); c.stroke();
  }
  c.restore();
}

function drawEnd(c, t, won) {
  if (won) drawDawn(c, t);
  else drawDusk(c, t);
  const run0 = G.run;
  const bob = Math.sin(t * 1.2) * 4;
  let endFloor = 0;      // the lowest thing the portrait drew, for the plate below it
  txt(c, won ? 'THE FELL IS CROSSED' : 'THE COLD TAKES YOU', MID, 150 + bob, 52, won ? '#ffe6a8' : '#c8dcf4', 'center', 'd');
  txt(c, won ? 'the caravan makes the far shore, and the winter lets go' : 'the caravan halts where it stands',
    MID, 196 + bob, 17, '#9fc0e4', 'center', 't');

  if (!won && run0) {
    /* WHO ACTUALLY DID IT, DRAWN, because "you died" is not an account — and
       drawn BEFORE the words, off a layout rather than a constant. A beast is
       118 units tall and was pinned at y=300 with a label at 234 and a name at
       344, so it covered its own caption at the top and its own name at the
       bottom. Same class of bug as the shrine's snow cap, on the screen nobody
       had ever photographed. */
    const k = run0.killedBy;
    /* `drawCreature`'s y is the FEET, and a creature reaches about a quarter of
       its own height above its nominal top once ears, horns and antennae are
       counted — which is why the first fix still put a Frostwyrm's ears through
       the subtitle. The block is laid out off a stated top edge instead. */
    const kh = k ? (k.boss ? 104 : 88) : 0;
    const ky = 254 + kh * 1.25;
    /* THE THIRD MEASUREMENT OF THE SAME ANCHOR, and this one came off a
       screenshot with a ruler on it rather than off a guess.

       `drawCreature(x, y, h)` draws a body about 2.2h tall anchored near its
       MIDDLE — an 88-unit Frostwyrm spans roughly ky−110 to ky+88. So the two
       previous numbers were both wrong in the same direction: +30 put the name
       on the belly, +78 put it across the feet (visible in every shot of this
       screen at every size), and the shadow at ky+0.20h was drawn inside the
       creature where nothing could see it. Both are hung off `feet` now, which
       is a thing the drawing actually has, and the stat plate is pushed off the
       same number instead of a constant that happened to clear a Frostwyrm. */
    const feet = ky + kh;
    if (k) {
      c.save();
      c.globalAlpha = 0.5; c.fillStyle = '#0d1830';
      c.beginPath(); c.ellipse(MID, feet + 4, 54, 12, 0, 0, TAU); c.fill();
      c.restore();
      drawCreature(c, k.art, MID, ky, kh, { t, ph: 2, flip: true });
    }
    txt(c, k ? 'WHAT STOPPED YOU' : 'THE COLD ITSELF', MID, 232, 13, '#7e97b8', 'center', 't');
    if (k) txt(c, k.name.toUpperCase(), MID, feet + 34, 24, '#ffb0b8', 'center', 'd');
    /* The name's own block, not the name's anchor: 24-unit display text hung at
       feet+34 reaches to about feet+64, and the log line the plate draws 30
       above itself has to start below THAT. Two rounds running, this screen has
       put one string on top of another because a lower element was pinned to a
       constant while an upper one moved. */
    endFloor = k ? feet + 64 : 300;
  } else if (won && run0) {
    /* Anything the crossing earned, named, before the caravan is shown. A
       crossing that earns nothing new says so — that is the hook. */
    const fresh = (run0.freshFeats || []).map((id) => FEATS.find((f) => f.id === id)).filter(Boolean);
    const shown = fresh.slice(0, 3);
    if (shown.length) {
      txt(c, shown.length > 1 ? 'SEALS EARNED' : 'A SEAL EARNED', MID, 222, 13, '#7e97b8', 'center', 't');
      shown.forEach((f, i) => txt(c, f.name, MID, 242 + i * 21, 18, f.col, 'center', 'd'));
    }
    // the caravan that made it, every card of it — pushed down by whatever the
    // crossing earned, so the seals never land on the cards
    const drop = shown.length ? 20 + shown.length * 21 : 0;
    txt(c, 'THE CARAVAN THAT MADE IT', MID, 232 + drop, 13, '#7e97b8', 'center', 't');
    const all = [run0.leader].concat(run0.deck);
    /* Ten cards squeezed to 74 units each is ten cards nobody can read, on the
       one screen that is supposed to be a lap of honour. Eight to a row at 96
       and let it wrap: two legible rows beat one illegible one. */
    const cw3 = 96, chh3 = 134, gap3 = 10;
    const per = Math.min(all.length, Math.max(5, Math.floor((VW - SAFE * 2) / (cw3 + gap3))));
    const rows = Math.ceil(all.length / per);
    all.forEach((card, i) => {
      const row = Math.floor(i / per), col = i % per;
      const inRow = Math.min(per, all.length - row * per);
      const tw3 = inRow * cw3 + (inRow - 1) * gap3;
      const x = MID - tw3 / 2 + col * (cw3 + gap3);
      const y = 252 + drop + row * (chh3 + 8) - (rows - 1) * 6;
      c.save();
      c.translate(x + cw3 / 2, y + chh3 / 2);
      c.rotate(Math.sin(i * 2.1) * 0.03);
      c.translate(-cw3 / 2, -chh3 / 2);
      drawCard(c, card, 0, 0, cw3, chh3, { t });
      c.restore();
    });
  }

  // what this caravan actually did, before it is forgotten
  const run = G.run;
  /* A CROSSING DOES NOT REPORT ZEROES. The stat row printed every cell whatever
     it held, so a win could end on "0 in one · 0 clean kills · 0 bells rung" —
     three quarters of a lap of honour spent listing things that did not happen.
     Zones and the caravan always show, because those describe the crossing
     rather than a tally; everything else earns its place by being non-zero. */
  const all9 = run ? [
    ['ZONES', (won ? ZONES.length : run.zone + 1) + ' / ' + ZONES.length, true],
    ['FIGHTS WON', run.fights || 0, (run.fights || 0) > 0],
    ['FOES FELLED', run.kills || 0, (run.kills || 0) > 0],
    ['BEST TURN', (run.bestTurn || 0) + ' in one', (run.bestTurn || 0) > 0],
    ['CLEAN KILLS', run.clean || 0, (run.clean || 0) > 0],
    ['CARAVAN', run.deck.length + ' cards', true],
    ['BELLS RUNG', (run.bells || []).length, (run.bells || []).length > 0],
    ['SCRIP LEFT', run.gold, run.gold > 0],
    ['WINTER', run.winterPts || 0, (run.winterPts || 0) > 0],
  ] : null;
  const cells = all9 ? all9.filter((r) => r[2] || !won).map((r) => [r[0], r[1]])
    : [['RUNS', G.meta.runs], ['CROSSINGS', G.meta.wins], ['FURTHEST', (G.meta.best || 0) + 1]];

  /* EIGHT WAS A CONSTANT AND THERE ARE NINE STATS ON A LOSS, so the ninth wrapped
     onto a row of its own and sat centred under the other eight looking like a
     layout accident — which is what it was. A defeat shows every cell including
     the zeroes (that is the point: it is an account of what stopped you), so the
     row has to be able to hold nine. It can: even at the narrowest stage the
     game ever builds, VW=1180, nine cells of 122 fit inside the safe area with
     room over. The width comes off the count now instead of off an 8. */
  const perRow = Math.min(cells.length, Math.max(3, Math.floor((VW - SAFE * 2) / 122)));
  const cw = Math.min(150, (VW - SAFE * 2) / perRow), chh = 56;
  const statTop = won ? VH - 176 : Math.max(540, endFloor + 52);   // clear of the portrait, its name AND the log line above the plate
  /* THE SKY IS BRIGHT NOW, so the stat row needs a ground. The contrast check
     caught it the moment the dawn went in: pale numbers over the sun disc read
     1.0:1, white on cream. A soft dark plate under the row is the fix and it is
     the better composition anyway — a lap of honour wants its tally on
     something rather than floating on the light. */
  if (won) {
    const rows9 = Math.ceil(cells.length / perRow);
    const plateW = Math.min(VW - SAFE * 2, perRow * cw + 40);
    c.save();
    c.fillStyle = 'rgba(10,18,36,.94)';   // opaque enough to BE a ground, not a tint
    c.beginPath(); rr(c, MID - plateW / 2, statTop - 34, plateW, rows9 * chh + 26, 18);
    c.fill();
    /* And the same paint again as a plain rect, inset by the corner radius.
       Identical pixels — it is inside the shape already — but the headless
       raster only represents rectangles and circles exactly, so without this
       the check measures the tally against the SKY and reports white on cream
       at 1.0:1. Drawing the middle of a rounded plate as a rectangle is the
       honest way to be visible to it; stamping rounded rects wholesale was
       tried and made attribution worse (see DEAD ENDS). */
    c.fillRect(MID - plateW / 2 + 18, statTop - 34, plateW - 36, rows9 * chh + 26);
    c.restore();
  }
  cells.forEach((cell, i) => {
    const col = i % perRow, row = Math.floor(i / perRow);
    const inRow = Math.min(perRow, cells.length - row * perRow);
    const x = MID - (inRow * cw) / 2 + col * cw + cw / 2;
    const y = statTop + row * chh;
    /* FIT THE LABEL TO ITS CELL, which it never did.
    
       These are drawn at 11 units and the legibility floor lifts them to 23 on
       a fold's cover display — where "FIGHTS WON" and "FOES FELLED" sit in
       adjacent 150-unit cells and end up touching, reading as one word. The
       overlap assertion does not catch it because the headless stub models a
       glyph's advance as `length * size * 0.5`, which is narrower than the real
       typeface: by the stub's arithmetic there is a comfortable gap and by
       Chromium's there is none. An approximate width model is fine for finding
       gross collisions and cannot adjudicate a gutter.
    
       So the layout stops assuming and measures: each label is fitted to its
       cell less a gutter, and ellipsised if the floor will not let it shrink
       that far. Same rule as a card's name band — when the box cannot carry a
       readable string, the string gives. */
    const gut = cw - 14;
    const vs = fitText(c, String(cell[1]), gut, 24, 12, 'd');
    txt(c, String(cell[1]), x, y, vs, '#eaf6ff', 'center', 'd');
    const ls = fitText(c, cell[0], gut, 11, 8, 't');
    txt(c, ellipsize(c, cell[0], ls, gut), x, y + 22, ls, '#7e97b8', 'center', 't');
  });
  if (run && run.log.length) {
    /* ABOVE the plate, not four units inside its top edge. At statTop-30 the
       line sat on the rounded border with the plate's corner radius cutting
       through its descenders on both end screens — legible, and obviously
       nobody's intent. It gets its own air now, and statTop is derived off the
       same 52 so the loss screen cannot close the gap again. */
    txt(c, run.log[run.log.length - 1], MID, statTop - 52, 14, '#9fb6d6', 'center', 't');
  }
  button(c, 'endHome', MID - 140, VH - 74, 280, 56, 'ANOTHER TREK', won ? '#3f8f5f' : '#40527a');
}

/* ================================================== 10. input ============ */

function press(id, data) {
  const g = G;
  sfx('tap');
  switch (id) {
    case 'tribe': g.ui.pick = { tribe: data, winters: [], course: data }; g.screen = 'leader'; return;
    case 'courseToggle': { if (g.ui.pick) g.ui.pick.course = data; sfx('tap'); return; }
    case 'winterToggle': {
      const w = g.ui.pick.winters;
      const i = w.indexOf(data);
      if (i >= 0) w.splice(i, 1); else w.push(data);
      return;
    }
    case 'startRun': newRun(g, g.ui.pick.tribe, undefined, g.ui.pick.winters, g.ui.pick.course); return;
    case 'backTitle': g.screen = 'title'; return;
    case 'seal': {
      const f = FEATS.find((x) => x.id === data);
      if (f) { UI.sealNote = f.name + ' — ' + f.text; sfx('tap'); }
      return;
    }
    case 'collection': g.screen = 'collection'; UI.lockNote = null; UI.sealNote = null; return;
    case 'collectClose': g.screen = 'title'; UI.lockNote = null; return;
    case 'collect': {
      const it = collectionItems()[data];
      if (!it) return;
      if (!found(it.id)) {
        const u = LOCKED[it.id];
        UI.lockNote = u ? u.text + '   (' + statOf(u.stat) + ' / ' + u.n + ')' : 'Not found yet.';
        return;
      }
      UI.lockNote = null;
      if (CARDS[it.id]) UI.inspect = mkCard(it.id);
      return;
    }
    case 'continue': if (!loadRun(g)) newRun(g, 'hearth'); return;
    case 'node': enterNode(g, data); return;
    case 'bell': ringBell(g); return;
    case 'wave': ringWave(g); return;
    case 'pass': passTurn(g); return;
    case 'order': UI.order = !UI.order; return;
    case 'menu': UI.deck = true; return;
    case 'help': UI.help = 0; UI.helpSheet = 0; return;
    case 'helpPage': UI.help = data; UI.helpSheet = 0; return;
    case 'helpSheet': UI.helpSheet = Math.max(0, (UI.helpSheet | 0) + data); return;
    case 'helpClose': UI.help = null; return;
    case 'mute': setMute(!G.meta.mute); return;
    case 'tutSkip': if (G.tut) finishTutorial(g); return;
    case 'deckClose': UI.deck = false; return;
    case 'deckcard': UI.inspect = data; return;
    case 'inspectClose': UI.inspect = null; return;
    case 'endHome': g.screen = 'title'; g.run = null; g.battle = null; return;
    case 'reward': {
      const r = g.ui.reward;
      if (r.taken) return;
      takeCard(g, r.cards[data]);
      r.taken = true;
      if (!r.charms.length) advance(g);
      return;
    }
    case 'rewardCharm': {
      const r = g.ui.reward;
      if (r.charmTaken) return;
      const cid = r.charms[data];
      pickTargetForCharm(g, cid, () => {
        r.charmTaken = true;
        if (r.taken || !r.cards.length) advance(g);
      });
      return;
    }
    case 'rewardCopy': {
      const r = g.ui.reward;
      if (r.taken || !g.run.deck.length) return;
      openChooser('COPY WHICH CARD?', g.run.deck.map((cd) => ({ card: cd })), (i) => {
        const src = g.run.deck[i];
        const copy = mkCard(src.def);
        copy.charms = src.charms.slice();
        copy.blessed = src.blessed;
        rebuildCard(copy);
        g.run.deck.push(copy);
        g.run.taken = (g.run.taken || 0) + 1;
        UI.choose = null;
        sfx('get');
        fx.toast('A SECOND ' + src.name.toUpperCase(), '#c9a6ff');
        r.taken = true;
        if (!r.charms.length && !(r.bells && r.bells.length)) advance(g);
      }, { cancel: 'NEVER MIND' });
      return;
    }
    case 'rewardBurn': {
      const r = g.ui.reward;
      if (r.taken || g.run.deck.length < 3) return;
      openChooser('BURN WHICH CARD?', g.run.deck.map((cd) => ({ card: cd })), (i) => {
        const gone = g.run.deck.splice(i, 1)[0];
        UI.choose = null;
        sfx('get');
        fx.toast(gone.name.toUpperCase() + ' LEFT BEHIND', '#ff9aa5');
        g.run.log.push(gone.name + ' was left behind to lighten the deck.');
        r.taken = true;
        if (!r.charms.length && !(r.bells && r.bells.length)) advance(g);
      }, { cancel: 'NEVER MIND' });
      return;
    }
    /* Three cards you do not want used to be three cards you did not want.
       Now the offer can be bought again, or bent for the rest of the trek —
       and saying no to all three pays, so a caravan that is already built has
       a reason to walk on and save for the course. */
    case 'rewardRedeal': {
      const r = g.ui.reward, run = g.run;
      const price = redealPrice(run);
      if (r.taken || !r.cards.length || run.gold < price) return;
      run.gold -= price;
      run.redeals = (run.redeals || 0) + 1;
      r.cards = weightedCards(run, run.course ? 4 : 3, true);
      sfx('get');
      fx.toast('DEALT AGAIN  -' + price, '#6fd8ff');
      return;
    }
    case 'rewardCourse': {
      const r = g.ui.reward, run = g.run;
      if (r.taken || !r.cards.length || run.gold < COURSE_PRICE) return;
      openChooser('WHICH WAY DOES THE CARAVAN GO?', COURSES.map((co) => ({
        label: co.name + '\n' + co.text, col: co.col, dim: co.id === run.course,
      })), (i) => {
        const co = COURSES[i];
        if (!co || co.id === run.course || run.gold < COURSE_PRICE) { UI.choose = null; return; }
        run.gold -= COURSE_PRICE;
        run.courseChanged = 1;
        run.course = co.id;
        r.cards = weightedCards(run, 4, true);
        UI.choose = null;
        sfx('get');
        fx.toast(co.name, co.col);
        run.log.push('The caravan set its course: ' + co.name.toLowerCase() + '.');
      }, { cancel: 'NEVER MIND', sub: 'a fourth card on every table from here, and a rule to travel by — ' + COURSE_PRICE + ' scrip' });
      return;
    }
    case 'rewardSkip': {
      const r = g.ui.reward;
      if (!r.taken && r.cards.length) {
        g.run.gold += PASS_PAY;
        g.run.passed = (g.run.passed || 0) + 1;
        fx.toast('WALKED ON  +' + PASS_PAY, C.gold);
      }
      advance(g);
      return;
    }
    case 'rewardBell': {
      const r = g.ui.reward;
      if (r.bellTaken) return;
      const bl = BELLS[r.bells[data]];
      if (!bl) return;
      bl.apply(g.run);
      g.run.bells = (g.run.bells || []).concat([bl.id]);
      r.bellTaken = true;
      sfx('get');
      fx.toast(bl.name.toUpperCase(), bl.col);
      if (r.taken || !r.cards.length) advance(g);
      return;
    }
    case 'restPick': {
      const bid = (g.ui.rest.offer || [])[data];
      const bl = BLESSINGS.find((x) => x.id === bid);
      if (bl) { sfx('get'); bl.go(g); }
      return;
    }
    case 'shrineGive': {
      /* The cap is three tempered cards a run and the shrine had never checked
         it — a door that quietly ignored the rule the other two doors enforce.
         Found by widening the quiet road, which sends a second card back
         blessed and would have made the bypass twice as wide. */
      if (tempered(g.run) >= TEMPER_CAP) {
        fx.toast('THE FIRE ONLY DOES SO MUCH', '#8fa2bd');
        advance(g); return;
      }
      const all = g.run.deck.filter((cd) => cd.charms.indexOf('blessed') < 0);
      if (!all.length) { advance(g); return; }
      const free = g.ui.shrine && g.ui.shrine.free;
      openChooser('LEAVE WHICH CARD ON THE STEP?', all.map((cd) => ({ card: cd })), (i) => {
        all[i].charms.push('blessed');
        all[i].blessed = true;
        rebuildCard(all[i]);
        // the quiet road: a second card comes back blessed as well
        if (free && tempered(g.run) < TEMPER_CAP) {
          const other2 = all.filter((cd) => cd !== all[i] && cd.charms.indexOf('blessed') < 0)
            .sort((x, z) => (z.hp + z.atk * 2) - (x.hp + x.atk * 2))[0];
          if (other2) { other2.charms.push('blessed'); other2.blessed = true; rebuildCard(other2); }
        }
        UI.choose = null;
        sfx('get');
        fx.toast(all[i].name.toUpperCase() + (free ? ' AND ANOTHER COME BACK BLESSED' : ' COMES BACK BLESSED'), C.gold);
        g.run.log.push(all[i].name + ' was left at the shrine, and came back better.');
        advance(g);
      }, { cancel: 'NEVER MIND' });
      return;
    }
    case 'collectPrev': UI.collectPage = Math.max(0, (UI.collectPage || 0) - 1); return;
    case 'collectNext': UI.collectPage = (UI.collectPage || 0) + 1; return;
    case 'shrineWalk': advance(g); return;
    case 'eventOpt': {
      const ev = g.ui.event && g.ui.event.def;
      if (!ev || !ev.opts[data]) return;
      const o = ev.opts[data];
      if (o.can && !o.can(g)) return;
      o.go(g);
      return;
    }
    case 'buyBurn': {
      const s2 = g.ui.shop;
      if (!s2 || !s2.burn || s2.burn.sold || g.run.gold < s2.burn.price || g.run.deck.length < 3) return;
      openChooser('BURN WHICH CARD?', g.run.deck.map((cd) => ({ card: cd })), (i) => {
        const gone = g.run.deck.splice(i, 1)[0];
        g.run.gold -= s2.burn.price;
        s2.burn.sold = true;
        UI.choose = null;
        sfx('get');
        fx.toast(gone.name.toUpperCase() + ' LEFT BEHIND', '#ff9aa5');
      }, { cancel: 'NEVER MIND' });
      return;
    }
    case 'buySigil': {
      const s2 = g.ui.shop;
      if (!s2 || s2.sigil.sold || g.run.gold < s2.sigil.price) return;
      const all = g.run.deck.filter((cd) => cd.type === 'unit' && !cd.sigil);
      if (!all.length) return;
      openChooser('MARK WHICH WARDEN WITH A SIGIL?', all.map((cd) => ({ card: cd })), (i) => {
        all[i].sigil = true;
        g.run.gold -= s2.sigil.price;
        s2.sigil.sold = true;
        UI.choose = null;
        sfx('get');
      }, { cancel: 'NEVER MIND' });
      return;
    }
    case 'buyCard': buy(g, 'card', data); return;
    case 'buyCharm': {
      const it = g.ui.shop.charms[data];
      if (!it || it.sold || g.run.gold < it.price) return;
      pickTargetForCharm(g, it.id, () => { g.run.gold -= it.price; it.sold = true; }, true);
      return;
    }
    case 'buyHeal': buy(g, 'heal'); return;
    case 'buyBell': { buy(g, 'bell'); return; }
    case 'buyTemper': {
      const s2 = g.ui.shop;
      if (!s2 || !s2.temper || s2.temper.sold || g.run.gold < s2.temper.price) return;
      const cands = temperable(g.run);
      if (!cands.length) return;
      openChooser('TEMPER WHICH CARD?', cands.map((cd) => ({ card: cd })), (i) => {
        if (buy(g, 'temper', 0, cands[i].uid)) g.run.log.push(cands[i].name + ' was tempered at the trader.');
        UI.choose = null;
      }, { cancel: 'NEVER MIND', sub: '+2 attack and +3 health, and the deck stays the size it was' });
      return;
    }
    /* The same meal, bought out of what the fight just paid. It does not spend
       the reward — you still take a card afterwards — because the point is that
       scrip earned in a fight has somewhere to go without giving up a fight to
       reach a shop. */
    case 'rewardMeal': {
      const r2 = g.ui.reward;
      if (!r2 || r2.taken || g.run.gold < mealPrice(g.run)) return;
      const cands2 = feedable(g.run);
      if (!cands2.length) return;
      openChooser('WHO EATS?', cands2.map((cd) => ({ card: cd })),
        (i) => { buy(g, 'meal', 0, cands2[i].uid); UI.choose = null; },
        { cancel: 'NEVER MIND', sub: '+1 attack and +2 health — and you still take a card' });
      return;
    }
    case 'buyMeal': {
      if (!g.ui.shop || g.run.gold < mealPrice(g.run)) return;
      const cands = feedable(g.run);
      if (!cands.length) return;
      openChooser('WHO EATS?', cands.map((cd) => ({ card: cd })),
        (i) => { buy(g, 'meal', 0, cands[i].uid); UI.choose = null; },
        { cancel: 'NEVER MIND',
          sub: '+1 attack and +2 health · the next meal costs ' +
            Math.round((MEAL_BASE + MEAL_STEP * ((g.run.meals || 0) + 1)) * (g.run.prices || 1)) });
      return;
    }
    /* Depth instead of breadth: give up the card you were going to take, and
       one you already carry comes back harder. Costs no scrip and no node —
       only the card, which is exactly the trade the reward screen was short
       of. */
    case 'rewardTemper': {
      const r = g.ui.reward;
      if (r.taken || !r.cards.length) return;
      openTemper(g, 'TEMPER WHICH CARD INSTEAD?',
        '+2 attack and +3 health — and you walk away from all ' + r.cards.length, () => {
          r.taken = true;
          if (!r.charms.length && !(r.bells && r.bells.length)) advance(g);
        });
      return;
    }
    case 'campTemper': {
      if (g.ui.camp && g.ui.camp.done) return;
      openTemper(g, 'TEMPER WHICH CARD BY THE FIRE?',
        '+2 attack and +3 health — and nobody mends tonight', () => {
          g.ui.camp.done = true;
          advance(g);
        });
      return;
    }
    case 'buyScar': {
      const hurtOnes = g.run.deck.concat([g.run.leader]).filter((cd) => cd.injured || cd.dmg > 0);
      if (!hurtOnes.length || g.ui.shop.scar.sold || g.run.gold < g.ui.shop.scar.price) return;
      openChooser('TEND WHICH WARDEN?', hurtOnes.map((cd) => ({ card: cd })), (i) => {
        const cd = hurtOnes[i];
        cd.injured = false; cd.dmg = 0;
        g.run.gold -= g.ui.shop.scar.price;
        g.ui.shop.scar.sold = true;
        UI.choose = null;
        sfx('heal');
      }, { cancel: 'NEVER MIND' });
      return;
    }
    case 'leaveShop': advance(g); return;
    case 'campRest': campChoose(g, 'rest'); return;
    case 'campToss': {
      openChooser('BURN WHICH CARD?', g.run.deck.map((cd) => ({ card: cd })), (i) => {
        const uid = g.run.deck[i].uid;
        UI.choose = null;
        campChoose(g, 'toss', uid);
      }, { cancel: 'NEVER MIND' });
      return;
    }
    case 'campCharm': {
      const three = sample(charmPool(), 3);
      openChooser('WHICH CHARM?', three.map((cid) => ({ charm: cid })), (i) => {
        pickTargetForCharm(g, three[i], () => { g.ui.camp.done = false; campChoose(g, 'charm', { charm: three[i], uid: UI.lastCharmUid }); });
      }, { cancel: 'NEVER MIND' });
      return;
    }
    case 'deckPile':
    case 'discardPile': {
      const b = g.battle;
      if (!b) return;
      const list = (id === 'deckPile' ? b.draw : b.discard).slice()
        .sort((a, z) => a.name.localeCompare(z.name));     // never reveal the order
      if (!list.length) { fx.toast(id === 'deckPile' ? 'THE DECK IS EMPTY' : 'NOTHING USED YET', '#9fb6d6'); return; }
      openChooser(id === 'deckPile' ? 'STILL TO COME' : 'ALREADY SPENT',
        list.map((cd) => ({ card: cd })), (i) => { UI.inspect = list[i]; UI.choose = null; },
        { cancel: 'BACK', sub: id === 'deckPile' ? 'in no particular order — the deck keeps its secrets' : '' });
      return;
    }
    /* Backing out of a chooser closes it — but some choosers are the SECOND
       half of a trade whose first half has already happened. Walking away from
       "mark which warden with a sigil" after handing the stranger a card leaves
       you a card down and nothing to show for it, on an event screen you can
       press again. A chooser that carries `then` runs it on the way out. */
    case 'chooseCancel': {
      const th = UI.choose && UI.choose.then;
      UI.choose = null;
      if (th) th();
      return;
    }
    default: return;
  }
}

/* Two-step: pick the charm, then pick who wears it. */
function pickTargetForCharm(g, charmId, after, chargeLater) {
  const all = [g.run.leader].concat(g.run.deck.filter((cd) => cd.type === 'unit'));
  openChooser('GIVE ' + chOf(charmId).name.toUpperCase() + ' TO WHOM?',
    all.map((cd) => ({ card: cd })), (i) => {
      UI.lastCharmUid = all[i].uid;
      attachCharm(all[i], CHARMS[charmId]);
      UI.choose = null;
      if (after) after();
      saveRun(g.run);
    }, { cancel: 'NEVER MIND' });
}

function onDown(x, y) {
  const g = G;
  UI.pointer = { x, y };
  const h = hitAt(x, y);
  UI.hover = h;
  /* WHICH CONTROL IS UNDER THE FINGER RIGHT NOW. A button with a bevel can show
     that it is being pressed by inverting it, which is the one depth cue that
     reads instantly and the interface had no state to draw it from. Cleared on
     up and on leave, so a control cannot be left looking held. */
  UI.down = h;
  if (UI.help !== null && UI.help !== undefined) {
    if (h && (h.id === 'helpPage' || h.id === 'helpClose' || h.id === 'helpSheet')) press(h.id, h.data);
    return;
  }
  if (UI.inspect) { if (h && h.id === 'inspectClose') press(h.id); else UI.inspect = null; return; }
  if (UI.choose) {
    if (!h) return;
    if (h.id === 'choose') { const cb = UI.choose.onPick; cb(h.data); }
    else if (h.id === 'chooseCancel') UI.choose = null;
    return;
  }
  if (UI.deck) {
    if (h && (h.id === 'deckClose' || h.id === 'deckcard')) press(h.id, h.data);
    else UI.deck = false;
    return;
  }
  if (!h) return;
  if (h.id === 'hand') {
    const card = g.battle.hand[h.data];
    // a card already picked up by tapping is put back down by tapping it again
    if (UI.picked === card) { UI.picked = null; sfx('tap'); return; }
    UI.drag = { card, idx: h.data, x, y, sx: x, sy: y, moved: false };
    return;
  }
  // tap-tap: with a card chosen, the next tap on a slot or a unit plays it
  if (UI.picked) {
    const card = UI.picked;
    const idx = g.battle.hand.indexOf(card);
    if (idx < 0) { UI.picked = null; return; }
    const spot = h.id === 'slot' ? h.data : h.id === 'unit' ? h.data : null;
    const why = refusal(g, card, spot);
    if (why) { UI.refuse = { text: why, t: 0, x, y }; sfx('tap'); return; }
    UI.picked = null;
    playCard(g, idx, CARDS[card.def].target === 'none' && card.type !== 'unit' ? null : spot);
    return;
  }
  if (h.id === 'unit' && h.data.side === 'p' && g.battle && !g.battle.busy) {
    UI.drag = { unit: h.data, x, y, sx: x, sy: y, moved: false };
    return;
  }
  if (h.id === 'unit') { UI.inspect = h.data; return; }   // a foe answers questions too
  press(h.id, h.data);
}

function onMove(x, y) {
  UI.pointer = { x, y };
  if (UI.drag) {
    UI.drag.x = x; UI.drag.y = y;
    if (Math.hypot(x - UI.drag.sx, y - UI.drag.sy) > 12) UI.drag.moved = true;
  }
  UI.hover = hitAt(x, y);
}

function onUp(x, y) {
  const g = G, d = UI.drag;
  UI.drag = null;
  UI.down = null;                       // nothing is held once the finger lifts
  if (!d) return;
  const h = hitAt(x, y);
  if (!d.moved) {
    // A tap on a card takes it into your hand ready to place; a tap on a unit
    // asks what it is.
    if (d.card) { UI.picked = d.card; sfx('tap'); }
    else UI.inspect = d.unit || null;
    return;
  }
  if (d.card) {
    const idx = g.battle.hand.indexOf(d.card);
    if (idx < 0) return;
    const tg = CARDS[d.card.def].target;
    const spot = h && h.id === 'slot' ? h.data : h && h.id === 'unit' ? h.data : null;
    if (d.card.type !== 'unit' && tg === 'none') { playCard(g, idx, null); return; }
    const why = refusal(g, d.card, spot);
    if (why) { UI.refuse = { text: why, t: 0, x, y }; sfx('tap'); return; }
    playCard(g, idx, spot);
  } else if (d.unit) {
    if (h && h.id === 'slot') moveUnit(g, d.unit, h.data.lane, h.data.col);
    else if (h && h.id === 'unit' && h.data.side === 'p') moveUnit(g, d.unit, h.data.lane, h.data.col);
  }
}

/* ================================================== 12. loop + boot ====== */

function layoutUnits(dt) {
  const b = G.battle;
  if (!b) return;
  for (let i = b.units.length - 1; i >= 0; i--) {
    const u = b.units[i];
    const p = slotPos(u.side, u.lane, u.col);
    if (!u.px) { u.px = p.x + (u.side === 'p' ? -260 : 260); u.py = p.y; }
    const k = Math.min(1, dt * 11);
    u.px += (p.x - u.px) * k;
    u.py += (p.y - u.py) * k;
    if (u.lungeT > 0) {
      u.lungeT = Math.max(0, u.lungeT - dt * 4.2);
      // wind up, then throw: the first fifth of the move goes backwards, which
      // is the whole difference between a lunge and a teleport
      const k = 1 - u.lungeT;
      const a = k < 0.28 ? -easeOut(k / 0.28) * 13 : Math.sin(((k - 0.28) / 0.72) * Math.PI) * 34;
      u.px += u.lungeX * a; u.py += u.lungeY * a;
      u.tilt = -a * 0.004;
    } else u.tilt = (u.tilt || 0) * 0.86;
    if (u.recoil > 0) {
      u.recoil = Math.max(0, u.recoil - dt * 4.5);
      const r = easeOut(u.recoil) * 16;
      u.px += (u.recX || 0) * r; u.py += (u.recY || 0) * r;
    }
    u.sq *= Math.pow(0.02, dt);
    u.tick = Math.max(0, (u.tick || 0) - dt * 3.2);
    u.flash = Math.max(0, u.flash - dt * 3.4);
    if (u.hitT > 0) u.hitT = Math.max(0, u.hitT - dt * 3);
    if (u.born) u.born += dt;
    if (!u.alive) {
      u.dead += dt;
      if (u.dead > 0.75) b.units.splice(i, 1);
    }
  }
}

let lastScreen = null;
function update(dt) {
  musicTick(G, dt);
  // Leaving a screen takes its debris with it: damage numbers from the last
  // fight were still drifting over the reward cards.
  if (G.screen !== lastScreen) {
    if (lastScreen !== null) { parts.length = 0; floats.length = 0; flyers.length = 0; rings.length = 0; }
    lastScreen = G.screen;
  }
  // Hit-stop: a big hit freezes the whole board for a breath. Everything
  // still draws, the clock just refuses to move, which is what makes the hit
  // land in the hand rather than only on the health bar.
  if (G.hitStop > 0) {
    G.hitStop -= dt;
    G.t += dt * 0.15;
    stepFx(dt * 0.2);
    return;
  }
  G.t += dt;
  stepFx(dt);
  if (Q.wait > 0) Q.wait -= dt;
  let guard = 0;
  while (Q.wait <= 0 && Q.items.length && guard++ < 64) {
    const it = Q.items.shift();
    if (it.fn) it.fn();
    Q.wait += it.d || 0;
  }
  layoutUnits(dt);
  tutStep(G, dt);
  // Hold a card still for a moment and it opens, so reading one never costs
  // you the drag you were halfway through.
  if (UI.drag && !UI.drag.moved) {
    UI.holdT += dt;
    if (UI.holdT > 0.42) {
      UI.inspect = UI.drag.card || UI.drag.unit || null;
      UI.drag = null;
      UI.holdT = 0;
      sfx('page');
    }
  } else UI.holdT = 0;
}

function drawFx(c) {
  for (const r of rings) {
    const k = r.t / r.life;
    c.save(); c.globalAlpha = (1 - k) * 0.8;
    c.strokeStyle = r.col; c.lineWidth = 4 * (1 - k) + 1;
    c.beginPath(); c.arc(r.x, r.y, r.r0 + k * 60, 0, TAU); c.stroke();
    c.restore();
  }
  for (const p of parts) {
    const k = p.t / p.life;
    c.globalAlpha = 1 - k;
    c.fillStyle = p.col;
    const r = p.r * (1 - k * 0.5);
    if (p.sh === 'shard') {
      c.save();
      c.translate(p.x, p.y);
      c.rotate((p.spin || 0) + k * (p.vs || 0));
      c.beginPath();
      c.moveTo(0, -r * 2.2); c.lineTo(r, r); c.lineTo(-r * 0.8, r * 1.4);
      c.closePath(); c.fill();
      c.restore();
    } else if (p.sh === 'bolt') {
      c.save();
      c.translate(p.x, p.y);
      c.rotate((p.spin || 0) + k * (p.vs || 0));
      c.fillRect(-r * 1.6, -r * 0.5, r * 3.2, r);
      c.restore();
    } else if (p.sh === 'puff') {
      c.globalAlpha = (1 - k) * 0.55;
      c.beginPath(); c.arc(p.x, p.y, r * (1 + k * 1.6), 0, TAU); c.fill();
    } else {
      c.beginPath(); c.arc(p.x, p.y, r, 0, TAU); c.fill();
    }
  }
  c.globalAlpha = 1;
  for (const f of floats) {
    const k = f.t / f.life;
    c.globalAlpha = k > 0.7 ? (1 - k) / 0.3 : 1;
    txt(c, f.text, f.x, f.y, f.sz * (1 + (1 - Math.min(1, f.t * 6)) * 0.4), f.col, 'center', 'd');
  }
  c.globalAlpha = 1;
}

function render() {
  const c = ctx;
  if (!c) return;
  hits = [];
  const t = G.t;
  c.setTransform(DPR, 0, 0, DPR, 0, 0);
  c.clearRect(0, 0, VW, VH);
  c.save();
  if (shakeState.mag > 0.1) {
    c.translate(Math.sin(shakeState.t * 1.7) * shakeState.mag, Math.cos(shakeState.t * 2.3) * shakeState.mag);
  }
  switch (G.screen) {
    case 'title': drawTitle(c, t); break;
    case 'leader': drawLeaderPick(c, t); break;
    case 'collection': drawCollection(c, t); break;
    case 'trail': drawTrail(c, t); break;
    case 'battle': drawBattle(c, t); break;
    case 'reward': drawReward(c, t); break;
    case 'shop': drawShop(c, t); break;
    case 'camp': drawCamp(c, t); break;
    case 'event': drawEvent(c, t); break;
    case 'rest': drawRest(c, t); break;
    case 'shrine': drawShrine(c, t); break;
    case 'gameover': drawEnd(c, t, false); break;
    case 'victory': drawEnd(c, t, true); break;
    default: drawTitle(c, t); break;
  }
  drawFx(c);
  if (G.screen === 'battle' && G.tut) drawTutorial(c, t);
  if (UI.choose) drawChooser(c, t);
  if (UI.help !== null && UI.help !== undefined) drawHelp(c, t);
  if (UI.deck && G.run) drawDeckView(c, t);
  if (UI.inspect) drawInspect(c, t);
  c.restore();
  if (flashState.a > 0.01) {
    c.save();
    c.globalAlpha = Math.min(0.7, flashState.a);
    c.fillStyle = flashState.col;
    c.fillRect(0, 0, VW, VH);
    c.restore();
  }
}

/* HOW BIG A STAGE UNIT ACTUALLY IS, IN THE HAND.

   The stage is 720 tall whatever it is drawn on, which is what lets every
   screen be laid out in one coordinate system — and it is also why seventeen
   rounds of touch-target checks measured the wrong thing. A control 88 units
   across is 88 CSS pixels on a laptop and 34 on a phone. Anything that needs to
   know what a THUMB will meet has to read this, not the units. */
let CSS_PER_UNIT = 1;
function setStageWidth(w, h) {
  VW = clamp(Math.round(VH * (w / Math.max(1, h))), VW_MIN, VW_MAX);
  MID = VW / 2;
  CSS_PER_UNIT = Math.min(w / VW, h / VH);
}
function resize() {
  if (!canvas) return;
  const w = window.innerWidth, h = window.innerHeight;
  document.body.classList.toggle('portrait', h > w * 1.02);
  setStageWidth(w, h);
  const scale = Math.min(w / VW, h / VH);
  DPR = Math.min(window.devicePixelRatio || 1, 2.5);
  canvas.width = Math.round(VW * DPR);
  canvas.height = Math.round(VH * DPR);
  canvas.style.width = Math.round(VW * scale) + 'px';
  canvas.style.height = Math.round(VH * scale) + 'px';
  if (ctx) ctx.imageSmoothingEnabled = true;
}

function evPos(e) {
  const r = canvas.getBoundingClientRect();
  const p = e.touches && e.touches.length ? e.touches[0] : (e.changedTouches && e.changedTouches.length ? e.changedTouches[0] : e);
  return { x: (p.clientX - r.left) / r.width * VW, y: (p.clientY - r.top) / r.height * VH };
}

function boot() {
  canvas = document.getElementById('game');
  ctx = canvas.getContext('2d');
  initSnow();
  loadMeta();
  resize();
  window.addEventListener('resize', resize);
  window.addEventListener('orientationchange', () => setTimeout(resize, 120));

  const down = (e) => { e.preventDefault(); const p = evPos(e); onDown(p.x, p.y); };
  const move = (e) => { e.preventDefault(); const p = evPos(e); onMove(p.x, p.y); };
  const up = (e) => { e.preventDefault(); const p = evPos(e); onUp(p.x, p.y); };
  canvas.addEventListener('pointerdown', down);
  canvas.addEventListener('pointermove', move);
  canvas.addEventListener('pointerup', up);
  canvas.addEventListener('pointercancel', up);

  const go = document.getElementById('bootgo');
  const start = () => {
    document.getElementById('boot').classList.add('gone');
    audioInit();
    // Landscape is the only orientation the game is authored for; ask nicely.
    const el = document.documentElement;
    const rq = el.requestFullscreen || el.webkitRequestFullscreen;
    if (rq) {
      try {
        const r = rq.call(el);
        if (r && r.then) r.then(lockLandscape).catch(lockLandscape);
        else lockLandscape();
      } catch (err) { lockLandscape(); }
    } else lockLandscape();
    setTimeout(resize, 200);
  };
  if (go) go.addEventListener('click', start);

  let last = (typeof performance !== 'undefined' ? performance.now() : Date.now());
  const frame = (now) => {
    const dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    update(dt);
    render();
    requestAnimationFrame(frame);
  };
  requestAnimationFrame(frame);
}
function lockLandscape() {
  try {
    if (screen.orientation && screen.orientation.lock) screen.orientation.lock('landscape').catch(() => {});
  } catch (e) {}
}

/* -- feats ---------------------------------------------------------------- */
/* The game had rules, instruments and a difficulty ladder and nothing at all to
   CHASE. Winters are a dial the player sets; these are the opposite — named
   things the fell asks of you, each one a way to cross that is harder or
   stranger than the last, and each one a seal the caravan carries afterwards.
   They cost nothing and change no rule: they are a reason to set out again. */
const FEATS = [
  { id: 'first',   name: 'THE FIRST CROSSING', col: '#7de08f',
    text: 'Cross the fell.',
    got: (run) => true },
  { id: 'whole',   name: 'NOBODY LEFT BEHIND', col: '#8fe0a0',
    text: 'Cross without a single warden falling.',
    got: (run) => !run.everFell },
  { id: 'lean',    name: 'TRAVELLING LIGHT', col: '#6fd8ff',
    text: 'Cross carrying eight cards or fewer.',
    got: (run) => run.deck.length <= 8 },
  { id: 'course',  name: 'HELD THE COURSE', col: '#c9a6ff',
    text: 'Cross without ever changing the course you declared.',
    got: (run) => !run.courseChanged },
  { id: 'pauper',  name: 'THE EMPTY PURSE', col: '#ffd166',
    text: 'Cross having never bought a thing from the trader.',
    got: (run) => !run.everBought },
  { id: 'winter',  name: 'THE LONG WINTER', col: '#8fe3ff',
    text: 'Cross carrying a winter of five or more.',
    got: (run) => (run.winterPts || 0) >= 5 },
  { id: 'beasts',  name: 'THE WHOLE BESTIARY', col: '#ff9a3c',
    text: 'Fell every beast in the game, across any number of runs.',
    got: () => Object.keys(FOES).filter((k) => FOES[k].boss)
      .every((k) => (G.meta.felled || {})[k]) },
  { id: 'thrice',  name: 'THREE ROADS HOME', col: '#ffe6a8',
    text: 'Cross once with each of the three tribes.',
    got: () => ['hearth', 'frost', 'scrap'].every((t) => (G.meta.crossed || {})[t]) },
];
const featEarned = (id) => !!(G.meta.feats && G.meta.feats[id]);

/* WHICH SEALS ARE STILL ALIVE IN THIS RUN.

   A seal on the title screen is a thing to chase; a seal you are three steps
   from losing is a thing to PLAY FOR, and the game was not saying so. These are
   the ones that a run can still earn — not yet held, and not yet broken — so
   the trail can show them while they are still winnable, and show them going
   out the moment they do. `alive` is deliberately the negative of what breaks
   them rather than a re-check of `got`: a crossing feat is not "true yet" at
   step three, it is simply still possible. */
const FEAT_ALIVE = {
  first: () => true,
  whole: (run) => !run.everFell,
  lean: (run) => run.deck.length <= 8,
  course: (run) => !run.courseChanged,
  pauper: (run) => !run.everBought,
  winter: (run) => (run.winterPts || 0) >= 5,
  beasts: () => true,
  thrice: () => true,
};
function liveFeats(run) {
  if (!run) return [];
  return FEATS.filter((f) => {
    if (featEarned(f.id)) return false;
    const fn = FEAT_ALIVE[f.id];
    try { return fn ? !!fn(run) : true; } catch (e) { return false; }
  });
}
/* And the ones this run has already thrown away, so losing one is a moment
   rather than a silence. Checked each step; `run.lostSeals` remembers which
   have already been announced. */
function breakSeals(run) {
  if (!run) return [];
  run.lostSeals = run.lostSeals || {};
  const gone = [];
  for (const f of FEATS) {
    if (featEarned(f.id) || run.lostSeals[f.id]) continue;
    const fn = FEAT_ALIVE[f.id];
    if (!fn) continue;
    let alive = true;
    try { alive = !!fn(run); } catch (e) { alive = true; }
    if (!alive) { run.lostSeals[f.id] = 1; gone.push(f); }
  }
  return gone;
}
/* Called on a crossing. Returns the ids earned THIS time, so the end screen can
   say which ones were new rather than listing everything again. */
function checkFeats(run) {
  G.meta.feats = G.meta.feats || {};
  G.meta.crossed = G.meta.crossed || {};
  G.meta.crossed[run.tribe] = true;
  const fresh = [];
  for (const f of FEATS) {
    if (G.meta.feats[f.id]) continue;
    let ok2 = false;
    try { ok2 = !!f.got(run); } catch (e) { ok2 = false; }
    if (ok2) { G.meta.feats[f.id] = true; fresh.push(f.id); }
  }
  return fresh;
}

function loadMeta() {
  const raw = store.get(SAVE_META);
  if (!raw) return;
  try {
    const o = JSON.parse(raw);
    if (o && typeof o === 'object') G.meta = Object.assign(G.meta, o);
    if (!Array.isArray(G.meta.unlocked) || !G.meta.unlocked.length) G.meta.unlocked = ['hearth', 'frost'];
    G.meta.found = G.meta.found || {};
    G.meta.winter = G.meta.winter || {};
    G.meta.stats = Object.assign({ kills: 0, bestCombo: 0, flawless: 0, wins: 0, zones: 0 }, G.meta.stats || {});
    G.meta.feats = G.meta.feats || {};
    G.meta.crossed = G.meta.crossed || {};
    G.meta.felled = G.meta.felled || {};
    AUD.on = MUSIC.on = !G.meta.mute;
  } catch (e) {}
}
function saveMeta() { store.set(SAVE_META, JSON.stringify(G.meta)); }

/* ------------------------------------------------------------- exports --- */
/* The suites drive the real functions through this, never a re-implementation. */
window.FF = {
  G, C, CARDS, CHARMS, SCARS, FOES, ZONES, TRIBES, STATUS, STATUS_ORDER, KEYWORD, STARTERS,
  LANES, COLS, HAND, BELL_CHARGE, VW, VH, UI, SAFE,
  dims: () => ({ VW, VH, MID, SAFE }), setStageWidth,
  mkCard, mkUnit, mkFoeCard, rebuildCard, attachCharm,
  units, playerUnits, enemyUnits, unitAt, slotFree, freeSlots, laneOf, turnOrder,
  targetFor, frontTarget, laneTargets, neighbours,
  addStatus, stat, spend, hurt, heal, die, triggerUnit, attackOnce, tickCounter, shoveUnit, HOARD_CAP,
  layPlot,
  PREVIEW, previewOf, logLine,
  SCHEMES, layPlot, maybeLay, tickRate,
  resolveTurn, ringBell, passTurn, moveUnit, canPlay, playCard, drawToHand,
  startBattle, endBattle, checkOver, summon, buildEncounter, foeScale, deployWave, ringWave, WAVE_GAP,
  newRun, genTrail, enterNode, advance, rollReward, takeCard, takeCharm, rollShop, buy, campChoose,
  charmMul, CHARM_STEP, CHARM_STOCK,
  UNLOCKS, checkUnlocks, bumpStat, found, cardPool, charmPool, WINTERS, winterPts, bellNeed, deckLeanings, weightedCards,
  caravanPower, fellAnswer, POWER_BASE,
  COURSES, courseOf, COURSE_PRICE, PASS_PAY, redealPrice, READS, caravanRead, caravanNeeds, hitOf,
  temperable, temperCard, openTemper, tempered, TEMPER_CAP, SCAR_CAP,
  hasRoom, isPacked, ROOM_NEEDED, REST, LESSON,
  deployWave, laneHeldBy, WAVE_TELL, POOL_BAN,
  mealPrice, feedable, MEAL_BASE, MEAL_STEP, TRAIL_STEPS, DEEP_BASE,
  following, FOLLOW_FREE, FOLLOW_STEP, FOLLOW_NEAR, MEAL_CAP, DEEP_MARGIN, DEEP_BITE,
  BELLS, EXTRAS, EVENTS, chOf, payCombo, zoneBoss, waveGap, offerCharms, offerSigil,
  ELITE_MODS, eliteMod, BLESSINGS, pickWarden,
  FEATS, featEarned, checkFeats, liveFeats, breakSeals, FEAT_ALIVE,
  saveRun, loadRun, saveMeta, loadMeta, store,
  handSize, pilePos, flyers, DEEP_FREEZE, hoardOf, seed: (n) => { RNG = mulberry(n >>> 0); }, rnd: () => rnd(),
  render: () => render(), update: (dt) => update(dt), drainAll,
  press, onDown, onMove, onUp, hitAt, hits: () => hits, refusal, TOUCH_MIN, TOUCH_SLOP,
  drawCreature, drawCard, drawBackdrop, drawItemIcon, statusGlyph, collectionItems, drawLeaderPick, drawCollection, deathKind, fx,
  MUSIC, musicTick, setMute, moodFor, AUD, sfx,
  TUTORIAL, TUT_DWELL, tutStep, finishTutorial, HELP_PAGES, HELP_RULES, HELP_BOARD,
  setCtx: (c) => { ctx = c; initSnow(); },
};

if (!HEADLESS) {
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
}
})();
