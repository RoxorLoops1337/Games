  *{ box-sizing:border-box; margin:0; padding:0; }
  html,body{
    width:100%; height:100%; overflow:hidden; background:#05080f; color:#e9f2ff;
    font-family:'Frostwork','Trebuchet MS',system-ui,sans-serif;
    -webkit-user-select:none; user-select:none; -webkit-touch-callout:none;
    -webkit-tap-highlight-color:transparent; touch-action:none; overscroll-behavior:none;
  }
  #stage{ position:fixed; inset:0; display:grid; place-items:center; background:#05080f; }
  #game{ display:block; touch-action:none; image-rendering:auto; }

  /* Portrait gate — the whole game is authored landscape, so a phone held the
     wrong way gets a proper screen rather than a squeezed board. */
  #rotate{
    position:fixed; inset:0; display:none; place-items:center; text-align:center;
    background:radial-gradient(120% 90% at 50% 20%, #14294a 0%, #070c17 70%); z-index:20;
    padding:24px;
  }
  body.portrait #rotate{ display:grid; }
  body.portrait #stage{ visibility:hidden; }
  #rotate .inner{ max-width:340px; }
  #rotate .glyph{
    width:96px; height:150px; margin:0 auto 26px; border:5px solid #cfe4ff; border-radius:14px;
    position:relative; animation:tip 2.4s ease-in-out infinite;
    box-shadow:0 0 0 4px rgba(0,0,0,.45), 0 10px 40px rgba(80,160,255,.25);
  }
  #rotate .glyph::after{ content:''; position:absolute; left:50%; bottom:8px; width:28px; height:4px;
    transform:translateX(-50%); background:#cfe4ff; border-radius:2px; opacity:.75; }
  @keyframes tip{ 0%,35%{ transform:rotate(0deg);} 65%,100%{ transform:rotate(-90deg);} }
  #rotate h2{ font-family:'Frostcut','Trebuchet MS',sans-serif; font-size:26px; letter-spacing:3px;
    color:#eaf4ff; text-shadow:0 3px 0 #0a1830; }
  #rotate p{ margin-top:12px; color:#8fb2dd; font-size:15px; line-height:1.5; letter-spacing:.5px; }

  /* First-touch gate: audio + fullscreen + orientation lock all need a gesture. */
  #boot{ position:fixed; inset:0; display:grid; place-items:center; z-index:15;
    background:radial-gradient(120% 90% at 50% 30%, #16304f 0%, #05080f 72%); }
  #boot.gone{ display:none; }
  #boot .card{ text-align:center; padding:30px 40px; }
  #boot h1{ font-family:'Frostcut','Trebuchet MS',sans-serif; font-size:clamp(38px,9vw,74px);
    letter-spacing:8px; color:#dff0ff;
    text-shadow:0 4px 0 #17385f, 0 8px 0 #0d2039, 0 14px 34px rgba(90,180,255,.4); }
  #boot .sub{ margin-top:14px; color:#7fa6d6; letter-spacing:4px; font-size:13px; text-transform:uppercase; }
  #boot .go{ margin-top:34px; display:inline-block; padding:15px 42px; cursor:pointer;
    font-family:'Frostcut','Trebuchet MS',sans-serif; font-size:22px; letter-spacing:4px; color:#08131f;
    background:linear-gradient(#9fe6ff,#4fb8f0); border-radius:14px;
    box-shadow:0 6px 0 #1c6b9c, 0 12px 26px rgba(0,0,0,.5); animation:pulse 2.2s ease-in-out infinite; }
  #boot .go:active{ transform:translateY(4px); box-shadow:0 2px 0 #1c6b9c, 0 6px 14px rgba(0,0,0,.5); }
  @keyframes pulse{ 50%{ filter:brightness(1.12); } }

<script>
/* ===========================================================================
   FROSTFELL — one file, no dependencies. Markup, CSS and this script are the
   whole game.

     1  utilities, rng, tween helpers
     2  palette + art language
     3  statuses and keywords
     4  card data (wardens, gear, charms) and the bestiary
     5  run + battle state
     6  battle engine — the bell, counters, targeting, damage, death
     7  run layer — the trail map, rewards, shop, camp, saving
     8  juice — shake, particles, floaters, the beat queue
     9  rendering — creatures, cards, board, trail, screens
    10  input — pointer, drag and drop, hit testing
    11  audio — a small procedural kit
    12  boot + main loop

   Headless tests set window.__FF_HEADLESS__ before evaluating this script and
   drive the game through window.FF; nothing here may require a real canvas.
   =========================================================================== */
(function(){
'use strict';

const HEADLESS = typeof window !== 'undefined' && !!window.__FF_HEADLESS__;

/* ========================================================== 1. utilities === */

const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const lerp = (a, b, t) => a + (b - a) * t;
const TAU = Math.PI * 2;
const easeOut = (t) => 1 - Math.pow(1 - t, 3);
const easeIn = (t) => t * t * t;
const easeInOut = (t) => (t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2);
// A soft overshoot — the shape every card that lands on the board uses.
const easeBack = (t) => { const c = 1.70158 + 1; return 1 + c * Math.pow(t - 1, 3) + 1.70158 * Math.pow(t - 1, 2); };
const cap = (s) => s.charAt(0).toUpperCase() + s.slice(1);

/* A small deterministic PRNG. Runs are seeded so a trail can be replayed and
   so the suites get the same board twice. */
function mulberry(seed) {
  let a = seed >>> 0;
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
let RNG = mulberry(1);
const rnd = () => RNG();
const rint = (n) => Math.floor(RNG() * n);
const rrange = (a, b) => a + Math.floor(RNG() * (b - a + 1));
const pick = (arr) => arr[Math.floor(RNG() * arr.length)];
function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(RNG() * (i + 1));
    const t = arr[i]; arr[i] = arr[j]; arr[j] = t;
  }
  return arr;
}
/* Draw without repeats, tolerating a pool smaller than the ask. */
function sample(arr, n) {
  const c = arr.slice();
  shuffle(c);
  return c.slice(0, Math.min(n, c.length));
}

/* ================================================ 2. palette + art language */

const C = {

/* ============================================= 3. statuses and keywords === */

/* A status is a counter on a unit. Some fade at the end of the turn, some

const STATUS = {

  ember:  { name: 'Ember',   col: '#ff9a3c', icon: 'ember',

  swift:  { name: 'Swift',   col: '#8fffc4', icon: 'swift',

const STATUS_ORDER = ['frost', 'ember', 'shell', 'spice', 'weak', 'swift', 'slow', 'regen', 'thorns', 'bounty'];

/* Keywords live on the card, not on the unit — they never decay. */
const KEYWORD = {
  aimless:  { name: 'Aimless',   text: 'Hits a random lane instead of its own.' },
  longshot: { name: 'Longshot',  text: 'Reaches past the front and hits the back slot.' },

/* ============================================ 5. run + battle state ======= */

/* The board is two LANES deep three columns. Column 0 is the front — the side
   of the slot nearest the middle of the table — and a swing hits the
   front-most foe standing in the attacker's own lane. Everything about
   positioning falls out of those two sentences. */
const LANES = 2;
const COLS = 3;
const HAND = 6;
const BELL_CHARGE = 4;   // turns without ringing before a free redraw

const G = {
  screen: 'title',
  t: 0,                 // seconds since boot, for every idle animation
  run: null,
  battle: null,
  ui: {},               // transient per-screen scratch (reward picks, shop stock…)
  meta: { runs: 0, wins: 0, best: 0, unlocked: ['hearth', 'frost'], seen: {} },
};

let UID = 1;
const nextUid = () => UID++;

/* A card instance: a copy of the definition that a run owns and can charm. */
function mkCard(id) {
  const d = CARDS[id];
  if (!d) throw new Error('no card ' + id);
  const c = {
    uid: nextUid(), def: id, name: d.name, type: d.type, tribe: d.tribe || null,
    rare: d.rare || 1, text: d.text || '', art: d.art, leader: !!d.leader,
    kw: Object.assign({}, d.kw || {}), charms: [], bonusDeploy: [], dmg: 0,
  };
  if (d.type === 'unit') { c.hp = d.hp; c.atk = d.atk; c.cnt = d.cnt; }
  if (d.type === 'item') { c.target = d.target; }
  return c;
}

/* Charms and scars both bolt onto an instance and are re-applied from scratch
   so a stat can never drift by being applied twice. */
function attachCharm(card, ch) {
  card.charms.push(ch.id);
  rebuildCard(card);
}
function rebuildCard(card) {
  const d = CARDS[card.def];
  card.kw = Object.assign({}, d.kw || {});
  card.bonusDeploy = [];
  if (d.type === 'unit') { card.hp = d.hp; card.atk = d.atk; card.cnt = d.cnt; }
  for (const id of card.charms) {
    const ch = CHARMS[id] || SCARS[id];
    if (ch) ch.apply(card);
  }
  if (card.hp !== undefined) card.dmg = Math.min(card.dmg, card.hp - 1);
}

/* A unit is a card standing on the board. */
function mkUnit(card, side, lane, col) {
  const d = CARDS[card.def] || FOES[card.def];
  const inj = card.injured ? 0.5 : 1;
  const maxHp = Math.max(1, Math.round(card.hp * inj));
  return {
    uid: nextUid(), card, def: card.def, name: card.name, side, lane, col,
    maxHp, hp: Math.max(1, maxHp - (card.dmg || 0)),
    atk: Math.max(0, Math.round(card.atk * inj)), cntMax: card.cnt, cnt: card.cnt,
    st: {}, kw: Object.assign({}, card.kw), hooks: (d && d.hooks) || {},
    art: card.art, leader: !!card.leader, boss: !!(d && d.boss),
    alive: true,
    // presentation only
    px: 0, py: 0, sq: 0, flash: 0, hitT: 0, bob: rnd() * TAU, born: 0, dead: 0, blink: rnd() * 4,
  };
}

/* Enemies are built straight from the bestiary with a zone scale. */
function mkFoeCard(id, scale) {
  const d = FOES[id];
  const s = scale || 1;
  return {
    uid: nextUid(), def: id, name: d.name, type: 'unit', tribe: null, rare: 1,
    text: d.text || '', art: d.art, leader: false, foe: true, boss: !!d.boss,
    kw: Object.assign({}, d.kw || {}), charms: [], bonusDeploy: [], dmg: 0,
    hp: Math.max(1, Math.round(d.hp * s)), atk: Math.max(0, Math.round(d.atk * s)), cnt: d.cnt,
  };
}

/* --------------------------------------------------------- board queries -- */
const B = () => G.battle;
const units = (g) => (g.battle ? g.battle.units.filter((u) => u.alive) : []);
const playerUnits = (g) => units(g).filter((u) => u.side === 'p');
const enemyUnits = (g) => units(g).filter((u) => u.side === 'e');
const sideUnits = (g, side) => units(g).filter((u) => u.side === side);
const allies = (g, u) => sideUnits(g, u.side);
const foes = (g, u) => sideUnits(g, u.side === 'p' ? 'e' : 'p');
const unitAt = (g, side, lane, col) => units(g).find((u) => u.side === side && u.lane === lane && u.col === col) || null;
const slotFree = (g, side, lane, col) => !unitAt(g, side, lane, col);
const laneOf = (g, side, lane) => units(g).filter((u) => u.side === side && u.lane === lane).sort((a, b) => a.col - b.col);
const other = (side) => (side === 'p' ? 'e' : 'p');
function freeSlots(g, side) {
  const out = [];
  for (let l = 0; l < LANES; l++) for (let c = 0; c < COLS; c++) if (slotFree(g, side, l, c)) out.push({ lane: l, col: c });
  return out;
}

/* Everything a swing has to know about who is standing where. */
function frontTarget(g, u) {
  const line = laneOf(g, other(u.side), u.lane);
  return line[0] || null;
}
function targetFor(g, u, laneOverride) {
  const s = other(u.side);
  let lane = laneOverride !== undefined ? laneOverride : u.lane;
  const line = () => laneOf(g, s, lane);
  if (u.kw.aimless && laneOverride === undefined) {
    // Aimless picks a random body in its own lane; if that lane is clear it
    // wanders to one that is not, which keeps it from idling all fight.
    let l = line();
    if (!l.length) {
      const busy = [];
      for (let i = 0; i < LANES; i++) if (laneOf(g, s, i).length) busy.push(i);
      if (busy.length) lane = pick(busy);
      l = line();
    }
    return l.length ? pick(l) : null;
  }
  const l = line();
  if (!l.length) return null;
  // Soak is a taunt: whatever the attacker would rather hit, the soaker is in
  // the way. It is the only thing that overrides Longshot.
  const soaker = l.find((x) => x.kw.soak);
  if (soaker) return soaker;
  if (u.kw.longshot) return l[l.length - 1];
  return l[0];
}
function laneTargets(g, u, lane) { return laneOf(g, other(u.side), lane); }
function neighbours(g, u) {
  const out = [];
  for (const v of units(g)) {
    if (v === u || v.side !== u.side) continue;
    if (Math.abs(v.lane - u.lane) + Math.abs(v.col - u.col) === 1) out.push(v);
  }
  return out;
}

/* The resolution order, which the player can see before committing: every foe
   ticks before every warden, and inside a side the front of the table goes
   first, top lane before bottom. */
function turnOrder(g) {
  return units(g).slice().sort((a, b) => {
    if (a.side !== b.side) return a.side === 'e' ? -1 : 1;
    if (a.col !== b.col) return a.col - b.col;
    return a.lane - b.lane;
  });
}

/* ==================================== 6. the battle engine =============== */

/* Beats are how the game breathes. Every state change that a player should be
   able to *see* is queued as a beat; the loop drains one at a time so a round
   plays out as a readable sequence instead of a single frame of arithmetic.
   Headless runs drain instantly, so the suites see the same state a player
   would see once the dust settles. */
const Q = { items: [], wait: 0, draining: false };
function beat(delay, fn) {
  Q.items.push({ d: delay, fn });
  if (HEADLESS) drainAll();
}
function drainAll() {
  if (Q.draining) return;
  Q.draining = true;
  let guard = 0;
  while (Q.items.length && guard++ < 20000) {
    const it = Q.items.shift();
    if (it.fn) it.fn();
  }
  Q.draining = false;
}
function clearBeats() { Q.items.length = 0; Q.wait = 0; }
const beatsBusy = () => Q.items.length > 0 || Q.wait > 0;

/* ------------------------------------------------------------- statuses -- */
function addStatus(g, u, key, n) {
  if (!u || !u.alive || !n) return;
  u.st[key] = (u.st[key] || 0) + n;
  if (u.st[key] <= 0) delete u.st[key];
  fx.pop(u, cap(STATUS[key] ? STATUS[key].name : key) + ' ' + n, STATUS[key] ? STATUS[key].col : C.snow);
  if (key === 'frost') {
    // Glacierling and friends listen for a foe going cold.
    for (const a of sideUnits(g, u.side === 'p' ? 'e' : 'p')) if (a.hooks.frosted) a.hooks.frosted(g, a, u);
  }
}
const stat = (u, key) => u.st[key] || 0;
function spend(u, key, n) {
  if (!u.st[key]) return 0;
  const took = Math.min(u.st[key], n === undefined ? u.st[key] : n);
  u.st[key] -= took;
  if (u.st[key] <= 0) delete u.st[key];
  return took;
}

/* ---------------------------------------------------------------- damage -- */
function hurt(g, u, amount, src) {
  if (!u || !u.alive || amount <= 0) return 0;
  let dmg = Math.round(amount);
  const sh = stat(u, 'shell');
  if (sh > 0) {
    const soaked = Math.min(sh, dmg);
    spend(u, 'shell', soaked);
    dmg -= soaked;
    fx.pop(u, '-' + soaked, STATUS.shell.col);
    fx.burst(u, STATUS.shell.col, 8);
  }
  if (dmg > 0) {
    u.hp -= dmg;
    u.flash = 1; u.hitT = 1; u.sq = 1;
    fx.pop(u, '-' + dmg, C.blood);
    fx.burst(u, C.blood, 10);
    fx.shake(Math.min(9, 2 + dmg * 0.5));
    sfx('hit');
  }
  const th = stat(u, 'thorns');
  if (th > 0 && src && src.alive && src !== u) hurt(g, src, th, null);
  if (u.hp <= 0) die(g, u, src);
  return dmg;
}
function heal(g, u, n) {
  if (!u || !u.alive || n <= 0) return;
  const before = u.hp;
  u.hp = Math.min(u.maxHp, u.hp + n);
  if (u.hp > before) { fx.pop(u, '+' + (u.hp - before), C.leaf); fx.burst(u, C.leaf, 8); sfx('heal'); }
}
function die(g, u, killer) {
  if (!u.alive) return;
  u.alive = false;
  u.dead = 0.0001;
  sfx('die');
  fx.burst(u, u.side === 'p' ? C.snowDim : '#c9d6ea', 22);
  fx.shake(7);
  const b = stat(u, 'bounty');
  if (b > 0 && u.side === 'e' && g.run) { g.run.gold += b; fx.pop(u, '+' + b + ' scrip', C.gold); }
  if (u.kw.explode) neighbours(g, u).concat(foes(g, u).filter((f) => f.lane === u.lane)).forEach((n2) => hurt(g, n2, u.kw.explode, null));
  if (u.hooks.death) u.hooks.death(g, u, killer);
  for (const a of allies(g, u)) if (a.hooks.allyDeath) a.hooks.allyDeath(g, a, u);
  if (killer && killer.alive && killer.hooks.kill) killer.hooks.kill(g, killer, u);
  if (u.side === 'p' && u.card && !u.card.foe) u.card.fainted = true;
  checkOver(g);
}

/* ------------------------------------------------------------- triggering -- */

/* A trigger is the whole event: the card's ability fires AND it swings, and
   Frenzy repeats the pair. Nothing on a card ever happens because it was
   played — it happens because it triggered. */
function triggerUnit(g, u) {
  if (!u || !u.alive) return;
  const times = 1 + (u.kw.frenzy || 0);
  for (let i = 0; i < times; i++) {
    if (!u.alive || g.battle.over) break;
    if (u.hooks.trigger) u.hooks.trigger(g, u);
    if (u.atk > 0) attackOnce(g, u);
  }
  // Spice and its sour twin are burned off by the whole chain, not per hit.
  spend(u, 'spice');
  spend(u, 'weak');
}

function attackOnce(g, u) {
  const primary = targetFor(g, u);
  if (!primary) { fx.pop(u, 'no target', C.snowDim); return; }
  const targets = u.kw.barrage ? laneTargets(g, u, primary.lane) : [primary];
  let dmg = u.atk + stat(u, 'spice');
  if (stat(u, 'weak') > 0) dmg = Math.floor(dmg / 2);
  fx.lunge(u, primary);
  sfx('swing');
  for (const t of targets.slice()) {
    if (!t.alive) continue;
    const dealt = hurt(g, t, dmg, u);
    if (u.kw.leech && dealt > 0) heal(g, u, dealt);
    if (u.alive && u.hooks.hit) u.hooks.hit(g, u, t);
    // Smackback answers a landed hit with half the defender's own attack.
    if (t.alive && t.kw.smack && dmg > 0) hurt(g, u, Math.max(1, Math.floor(t.atk / 2)), t);
  }
}

/* Every counter movement in the game goes through here. A counter driven to
   zero by a card fires straight away — that is the combo engine, and it is
   also why Frost has to sit in front of it. */
function tickCounter(g, u, n, natural) {
  if (!u || !u.alive || n <= 0) return false;
  if (stat(u, 'frost') > 0) {
    if (natural) { spend(u, 'frost', 1); fx.pop(u, 'FROZEN', STATUS.frost.col); fx.burst(u, STATUS.frost.col, 8); }
    else fx.pop(u, 'FROZEN', STATUS.frost.col);
    return false;
  }
  let ticks = n;
  if (natural) ticks += spend(u, 'swift');
  if (natural && stat(u, 'slow') > 0) { spend(u, 'slow', 1); fx.pop(u, 'SLOW', STATUS.slow.col); return false; }
  u.cnt = Math.max(0, u.cnt - ticks);
  if (u.cnt > 0) return false;
  u.cnt = u.cntMax;
  u.tick = 1;
  triggerUnit(g, u);
  return true;
}

/* ------------------------------------------------------- the turn ------- */

/* One action per turn: play a card, ring the bell, or pass. Moving a warden
   already on the board is free and does not spend the turn. That single rule
   is what prices everything else in the game. */
function resolveTurn(g) {
  const b = g.battle;
  if (!b || b.over || b.busy) return;
  b.busy = true;
  b.turn++;
  fx.bell();

  for (const u of turnOrder(g)) {
    beat(0.13, () => {
      if (!u.alive || b.over) return;
      tickCounter(g, u, 1, true);
    });
  }

  /* End of turn: burns bite, mending mends, both fade. */
  beat(0.18, () => {
    if (b.over) return;
    for (const u of units(g).slice()) {
      const em = stat(u, 'ember');
      if (em > 0) { hurt(g, u, em, null); u.st.ember = Math.floor(em / 2); if (!u.st.ember) delete u.st.ember; }
      const rg = stat(u, 'regen');
      if (rg > 0) { heal(g, u, rg); u.st.regen = Math.floor(rg / 2); if (!u.st.regen) delete u.st.regen; }
    }
    checkOver(g);
  });

  beat(0.1, () => {
    b.busy = false;
    if (b.over) return;
    if (b.bell < BELL_CHARGE) b.bell++;
    if (!b.hand.length && b.bell < BELL_CHARGE) b.bell = BELL_CHARGE;  // never softlock an empty hand
  });
}

/* The redraw bell: throws the hand away and deals a fresh one. Free once it
   has charged, otherwise it costs you the turn. */
function ringBell(g) {
  const b = g.battle;
  if (!b || b.over || b.busy) return false;
  const free = b.bell >= BELL_CHARGE;
  sfx('bell');
  while (b.hand.length) b.discard.push(b.hand.pop());
  for (let i = 0; i < handSize(g); i++) if (!drawToHand(g)) break;
  b.bell = 0;
  b.rang = 1;
  if (!free) resolveTurn(g);
  return true;
}

function passTurn(g) {
  const b = g.battle;
  if (!b || b.over || b.busy) return false;
  resolveTurn(g);
  return true;
}

/* Repositioning is free — the whole tactical layer lives here. */
function moveUnit(g, u, lane, col) {
  const b = g.battle;
  if (!b || b.over || b.busy || !u || !u.alive || u.side !== 'p') return false;
  if (u.lane === lane && u.col === col) return false;
  const at = unitAt(g, 'p', lane, col);
  if (at) { at.lane = u.lane; at.col = u.col; at.moveT = 1; }   // swap places
  u.lane = lane; u.col = col; u.moveT = 1;
  sfx('move');
  return true;
}

function checkOver(g) {
  const b = g.battle;
  if (!b || b.over) return;
  const leader = b.units.find((u) => u.side === 'p' && u.leader);
  if (leader && !leader.alive) { b.over = true; b.won = false; beat(0.6, () => endBattle(g, false)); return; }
  if (!enemyUnits(g).length) { b.over = true; b.won = true; beat(0.7, () => endBattle(g, true)); }
}

/* -------------------------------------------------------------- the hand -- */
const handSize = (g) => HAND + ((g.run && g.run.bonusHand) || 0);

function drawToHand(g) {
  const b = g.battle;
  if (b.hand.length >= handSize(g)) return null;
  if (!b.draw.length) {
    if (!b.discard.length) return null;
    b.draw = shuffle(b.discard.slice());
    b.discard.length = 0;
  }
  const c = b.draw.shift();
  c.handT = 0;
  b.hand.push(c);
  return c;
}

/* Can this card be played onto this spot? `spot` is {lane,col} for wardens,
   a unit for aimed gear. */
function canPlay(g, card, spot) {
  const b = g.battle;
  if (!b || b.over || b.busy) return false;
  if (card.type === 'unit') {
    if (!spot || spot.lane === undefined) return false;
    return slotFree(g, 'p', spot.lane, spot.col);
  }
  const tg = CARDS[card.def].target;
  if (tg === 'none') return true;
  if (!spot || !spot.uid || !spot.alive) return false;
  if (tg === 'ally') return spot.side === 'p';
  if (tg === 'enemy') return spot.side === 'e';
  return true;
}

function playCard(g, idx, spot) {
  const b = g.battle;
  const card = b.hand[idx];
  if (!card || !canPlay(g, card, spot)) return false;
  b.hand.splice(idx, 1);
  const d = CARDS[card.def];
  if (card.type === 'unit') {
    const u = mkUnit(card, 'p', spot.lane, spot.col);
    u.born = 0.0001;
    b.units.push(u);
    sfx('place');
    fx.thump(u);
    for (const [k, n] of card.bonusDeploy) addStatus(g, u, k, n);
    if (d.hooks && d.hooks.deploy) d.hooks.deploy(g, u);
  } else {
    sfx('item');
    if (spot && spot.uid) fx.burst(spot, (d.art && d.art.col) || C.snow, 14);
    d.effect(g, spot, g, null);
  }
  b.discard.push(card);
  checkOver(g);
  if (!b.over) resolveTurn(g);
  return true;
}

/* --------------------------------------------------------------- summons -- */
function summon(g, foeId, count) {
  for (let i = 0; i < (count || 1); i++) {
    const free = freeSlots(g, 'e');
    if (!free.length) return;
    const s = pick(free);
    const u = mkUnit(mkFoeCard(foeId, g.run ? foeScale(g.run) : 1), 'e', s.lane, s.col);
    u.born = 0.0001;
    g.battle.units.push(u);
    fx.thump(u);
  }
}

/* ------------------------------------------------------- starting a fight -- */
function foeScale(run) {
  // Enemies grow with the trail, gently: the deck should outpace them if the
  // player picks well, and fall behind if they do not.
  return 1 + run.step * 0.045 + run.zone * 0.12;
}

function buildEncounter(g, kind) {
  const run = g.run;
  const zone = ZONES[run.zone];
  const out = [];
  const scale = foeScale(run) * (kind === 'elite' ? 1.25 : 1);
  if (kind === 'boss') {
    out.push({ id: zone.boss, lane: 0, col: 2, scale: 1 });
    const guard = Object.values(FOES).filter((f) => !f.boss && f.tier <= zone.tiers[2]);
    out.push({ id: pick(guard).id, lane: 0, col: 0, scale });
    out.push({ id: pick(guard).id, lane: 1, col: 0, scale });
    if (run.zone >= 1) out.push({ id: pick(guard).id, lane: 1, col: 1, scale });
  } else {
    const tiers = zone.tiers;
    const pool = Object.values(FOES).filter((f) => !f.boss && tiers.indexOf(f.tier) >= 0);
    const alt = Object.values(FOES).filter((f) => !f.boss && f.tier <= Math.max.apply(null, tiers));
    const src = pool.length ? pool : alt;
    const n = kind === 'elite' ? rrange(3, 4) : rrange(2, 3) + (run.step > 3 ? 1 : 0);
    // Fill from the front so a fight always presents a wall before a backline.
    const spots = [];
    for (let c = 0; c < COLS; c++) for (let l = 0; l < LANES; l++) spots.push({ lane: l, col: c });
    for (let i = 0; i < Math.min(n, spots.length); i++) {
      out.push({ id: pick(src).id, lane: spots[i].lane, col: spots[i].col, scale });
    }
  }
  return out;
}

function startBattle(g, kind) {
  const run = g.run;
  clearBeats();
  const b = {
    kind: kind || 'fight', turn: 0, units: [], hand: [], draw: [], discard: [],
    bell: run.bellCharged ? BELL_CHARGE : 0, over: false, won: false, busy: false, t: 0,
    order: [],
  };
  g.battle = b;

  // The leader walks on first, into the back of the top lane. Nothing stops
  // the player moving it — repositioning is free.
  const lead = mkUnit(run.leader, 'p', 0, 2);
  lead.born = 0.0001;
  b.units.push(lead);
  const ld = CARDS[run.leader.def];
  if (ld.hooks && ld.hooks.deploy) ld.hooks.deploy(g, lead);
  for (const [k, n] of run.leader.bonusDeploy) addStatus(g, lead, k, n);

  for (const e of buildEncounter(g, kind)) {
    const u = mkUnit(mkFoeCard(e.id, e.scale), 'e', e.lane, e.col);
    u.born = 0.0001;
    b.units.push(u);
    const fd = FOES[e.id];
    if (fd.hooks && fd.hooks.deploy) fd.hooks.deploy(g, u);
  }

  b.draw = shuffle(run.deck.filter((c) => !c.leader).slice());
  for (let i = 0; i < handSize(g); i++) if (!drawToHand(g)) break;
  g.screen = 'battle';
  drainAll();
  return b;
}

function endBattle(g, won) {
  const run = g.run;
  // Carry damage home: a warden that survived stays hurt, one that fainted
  // comes back whole but scarred.
  for (const u of g.battle.units) {
    if (u.side !== 'p' || !u.card) continue;
    if (u.alive) u.card.dmg = Math.max(0, u.maxHp - u.hp);
  }
  // A warden that fell is Hurt — half its attack and half its health until it
  // sees a fight through. One that came home standing shakes it off.
  for (const c of run.deck.concat([run.leader])) {
    if (c.fainted) {
      c.fainted = false;
      c.dmg = 0;
      c.injured = true;
      run.log.push(c.name + ' was hurt.');
    } else if (won && c.injured) {
      c.injured = false;
      run.log.push(c.name + ' recovered.');
    }
  }
  if (!won) { g.screen = 'gameover'; G.meta.runs++; saveMeta(); saveRun(null); return; }

  run.gold += g.battle.kind === 'boss' ? 45 : g.battle.kind === 'elite' ? 30 : 18;
  g.ui.reward = rollReward(g, g.battle.kind);
  g.screen = 'reward';
  sfx('win');
  saveRun(run);
}

/* ================================================ 7. the run layer ======= */

const STARTERS = {
  hearth: { leader: 'bramblewick', deck: ['cinderpup', 'cinderpup', 'kettlebeak', 'snowpup', 'emberflask', 'emberflask', 'stew', 'whetstone'] },
  frost:  { leader: 'vesper',      deck: ['rimefox', 'rimefox', 'chillfin', 'snowpup', 'icepick', 'icepick', 'gearshield', 'whetstone'] },
  scrap:  { leader: 'gundy',       deck: ['clunkbot', 'springjaw', 'scrapcrow', 'snowpup', 'blastcap', 'gearshield', 'bellrope', 'whetstone'] },
};

function genTrail(zoneIdx) {
  const steps = [];
  steps.push([{ kind: 'fight' }]);
  const pools = [
    ['fight', 'camp'], ['fight', 'shop'], ['elite', 'fight'],
    ['camp', 'cache'], ['fight', 'elite'],
  ];
  for (const p of pools) {
    const a = p[0], b2 = p[1];
    steps.push(rnd() < 0.5 ? [{ kind: a }, { kind: b2 }] : [{ kind: b2 }, { kind: a }]);
  }
  steps.push([{ kind: 'boss' }]);
  return steps;
}

function newRun(g, tribeId, seed) {
  const sd = (seed === undefined ? Math.floor(Math.random() * 1e9) : seed) >>> 0;
  RNG = mulberry(sd || 1);
  UID = 1;
  const s = STARTERS[tribeId] || STARTERS.hearth;
  const run = {
    seed: sd, tribe: tribeId, zone: 0, step: 0, gold: 25, bonusRedraw: 0,
    deck: [], leader: mkCard(s.leader), trail: genTrail(0), log: [], path: [],
    kills: 0, node: null,
  };
  for (const id of s.deck) run.deck.push(mkCard(id));
  g.run = run;
  g.battle = null;
  g.screen = 'trail';
  G.meta.runs++;
  saveMeta();
  saveRun(run);
  return run;
}

function nodeAt(run) { return run.trail[run.step] || null; }

function enterNode(g, choiceIdx) {
  const run = g.run;
  const step = nodeAt(run);
  if (!step) return;
  const node = step[clamp(choiceIdx, 0, step.length - 1)];
  run.node = node.kind;
  run.path.push(node.kind);
  if (node.kind === 'fight' || node.kind === 'elite' || node.kind === 'boss') {
    startBattle(g, node.kind);
  } else if (node.kind === 'shop') {
    g.ui.shop = rollShop(g);
    g.screen = 'shop';
  } else if (node.kind === 'camp') {
    g.ui.camp = { done: false };
    g.screen = 'camp';
  } else if (node.kind === 'cache') {
    run.gold += 20;
    g.ui.reward = { cards: [], charms: sample(Object.keys(CHARMS), 3), gold: 20, kind: 'cache' };
    g.screen = 'reward';
  }
  saveRun(run);
}

/* Called when whatever the node was is finished with. */
function advance(g) {
  const run = g.run;
  run.step++;
  if (run.step >= run.trail.length) {
    run.zone++;
    if (run.zone >= ZONES.length) {
      G.meta.wins++;
      G.meta.best = Math.max(G.meta.best, 3);
      saveMeta(); saveRun(null);
      g.screen = 'victory';
      return;
    }
    if (run.zone === 1 && G.meta.unlocked.indexOf('scrap') < 0) {
      G.meta.unlocked.push('scrap');
      g.ui.unlockToast = { t: 0, text: 'SCRAPJAW TRIBE UNLOCKED' };
    }
    G.meta.best = Math.max(G.meta.best, run.zone);
    run.step = 0;
    run.trail = genTrail(run.zone);
    saveMeta();
  }
  g.battle = null;
  g.screen = 'trail';
  saveRun(run);
}

/* ------------------------------------------------------------- rewards --- */
function cardPool(run) {
  return Object.values(CARDS).filter((c) => !c.leader && (!c.tribe || c.tribe === run.tribe || rnd() < 0.5));
}
function weightedCards(run, n) {
  const pool = cardPool(run);
  const bag = [];
  for (const c of pool) {
    const w = c.rare === 1 ? 5 : c.rare === 2 ? 3 : 1;
    for (let i = 0; i < w; i++) bag.push(c.id);
  }
  const out = [];
  let guard = 0;
  while (out.length < n && guard++ < 200) {
    const id = pick(bag);
    if (out.indexOf(id) < 0) out.push(id);
  }
  return out;
}
function rollReward(g, kind) {
  const run = g.run;
  const r = { kind, cards: weightedCards(run, 3), charms: [], gold: 0 };
  if (kind === 'elite' || kind === 'boss') r.charms = sample(Object.keys(CHARMS), kind === 'boss' ? 3 : 2);
  return r;
}
function takeCard(g, id) {
  if (!id) return;
  g.run.deck.push(mkCard(id));
  sfx('get');
}
function takeCharm(g, charmId, cardUid) {
  const card = g.run.deck.concat([g.run.leader]).find((c) => c.uid === cardUid);
  const ch = CHARMS[charmId];
  if (!card || !ch) return false;
  attachCharm(card, ch);
  sfx('get');
  return true;
}

/* ---------------------------------------------------------------- shop --- */
const PRICE = { 1: 22, 2: 34, 3: 48 };
function rollShop(g) {
  const run = g.run;
  const cards = weightedCards(run, 3).map((id) => ({ id, price: PRICE[CARDS[id].rare] || 25, sold: false }));
  const charms = sample(Object.keys(CHARMS), 2).map((id) => ({ id, price: PRICE[CHARMS[id].rare] + 8, sold: false }));
  return { cards, charms, heal: { price: 20, sold: false }, scar: { price: 30, sold: false } };
}
function buy(g, kind, idx, arg) {
  const s = g.ui.shop, run = g.run;
  if (!s) return false;
  const takeGold = (n) => { if (run.gold < n) return false; run.gold -= n; return true; };
  if (kind === 'card') {
    const it = s.cards[idx];
    if (!it || it.sold || !takeGold(it.price)) return false;
    it.sold = true; takeCard(g, it.id); return true;
  }
  if (kind === 'charm') {
    const it = s.charms[idx];
    if (!it || it.sold || run.gold < it.price) return false;
    if (!takeCharm(g, it.id, arg)) return false;
    run.gold -= it.price; it.sold = true; return true;
  }
  if (kind === 'heal') {
    if (s.heal.sold || !takeGold(s.heal.price)) return false;
    s.heal.sold = true;
    run.deck.concat([run.leader]).forEach((c) => { c.dmg = 0; });
    sfx('heal'); return true;
  }
  if (kind === 'scar') {
    const card = run.deck.concat([run.leader]).find((c) => c.uid === arg);
    if (!card || s.scar.sold) return false;
    const i = card.charms.findIndex((id) => SCARS[id]);
    if (i < 0 || !takeGold(s.scar.price)) return false;
    card.charms.splice(i, 1);
    rebuildCard(card);
    s.scar.sold = true;
    sfx('get'); return true;
  }
  return false;
}

/* ---------------------------------------------------------------- camp --- */
function campChoose(g, what, arg) {
  const run = g.run;
  if (g.ui.camp && g.ui.camp.done) return false;
  if (what === 'rest') {
    run.deck.concat([run.leader]).forEach((c) => { c.dmg = Math.max(0, c.dmg - 6); });
    sfx('heal');
  } else if (what === 'charm') {
    const ch = CHARMS[arg && arg.charm];
    const card = run.deck.concat([run.leader]).find((c) => c.uid === (arg && arg.uid));
    if (!ch || !card) return false;
    attachCharm(card, ch);
    sfx('get');
  } else if (what === 'toss') {
    const i = run.deck.findIndex((c) => c.uid === arg);
    if (i < 0) return false;
    run.deck.splice(i, 1);
    sfx('get');
  } else return false;
  g.ui.camp.done = true;
  advance(g);
  return true;
}

/* --------------------------------------------------------------- saving -- */
const SAVE_RUN = 'ff_run_v1';
const SAVE_META = 'ff_meta_v1';
const store = {
  get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} },
  del(k) { try { localStorage.removeItem(k); } catch (e) {} },
};
function serCard(c) { return { u: c.uid, d: c.def, c: c.charms.slice(), g: c.dmg || 0 }; }
function desCard(o) {
  const c = mkCard(o.d);
  c.uid = o.u; c.charms = (o.c || []).slice(); c.dmg = o.g || 0;
  rebuildCard(c);
  UID = Math.max(UID, c.uid + 1);
  return c;
}
function saveRun(run) {
  if (!run) { store.del(SAVE_RUN); return; }
  store.set(SAVE_RUN, JSON.stringify({
    v: 1, seed: run.seed, tribe: run.tribe, zone: run.zone, step: run.step, gold: run.gold,
    br: run.bonusRedraw, leader: serCard(run.leader), deck: run.deck.map(serCard),
    trail: run.trail, path: run.path, log: run.log.slice(-8),
  }));
}
function loadRun(g) {
  const raw = store.get(SAVE_RUN);
  if (!raw) return null;
  try {
    const o = JSON.parse(raw);
    if (!o || o.v !== 1) return null;
    const run = {
      seed: o.seed, tribe: o.tribe, zone: o.zone, step: o.step, gold: o.gold, bonusRedraw: o.br || 0,
      leader: desCard(o.leader), deck: (o.deck || []).map(desCard), trail: o.trail, path: o.path || [],
      log: o.log || [], kills: 0, node: null,
    };
    RNG = mulberry((run.seed + run.step * 7919 + run.zone * 104729) >>> 0);
    g.run = run;
    g.battle = null;
    g.screen = 'trail';
    return run;
  } catch (e) { return null; }
}
/* ==================================================== 8. juice =========== */

/* Everything in here is presentation. The rules never read it, and headless
   runs let it accumulate harmlessly into arrays nobody draws. */
const parts = [];
const floats = [];
const rings = [];
const shakeState = { mag: 0, t: 0 };
const flashState = { a: 0, col: '#ffffff' };
let snowflakes = null;

const fx = {
  pop(u, text, col) {
    if (!u) return;
    floats.push({ x: u.px || 0, y: (u.py || 0) - 30, vy: -46, life: 1.0, t: 0, text: String(text), col: col || C.snow, sz: 22 });
    if (floats.length > 60) floats.shift();
  },
  toast(text, col) {
    floats.push({ x: 640, y: 250, vy: -18, life: 1.6, t: 0, text: String(text), col: col || C.gold, sz: 34 });
  },
  burst(u, col, n) {
    if (!u) return;
    for (let i = 0; i < (n || 10); i++) {
      const a = rnd() * TAU, s = 40 + rnd() * 190;
      parts.push({ x: u.px || 0, y: u.py || 0, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 40,
        life: 0.4 + rnd() * 0.5, t: 0, col, r: 2 + rnd() * 4, g: 420 });
    }
    if (parts.length > 400) parts.splice(0, parts.length - 400);
  },
  ring(x, y, col, r) { rings.push({ x, y, r0: r || 18, col, life: 0.42, t: 0 }); },
  shake(m) { shakeState.mag = Math.min(18, shakeState.mag + m); },
  flash(col, a) { flashState.col = col || '#ffffff'; flashState.a = Math.max(flashState.a, a === undefined ? 0.35 : a); },
  bell() { fx.flash('#bfe8ff', 0.16); fx.shake(3); },
  thump(u) { if (u) { u.sq = 1.2; fx.ring(u.px || 0, u.py || 0, '#ffffff', 26); } },
  lunge(u, t) {
    if (!u || !t) return;
    u.lungeT = 1;
    u.lungeX = (t.px || 0) - (u.px || 0);
    u.lungeY = (t.py || 0) - (u.py || 0);
    const L = Math.hypot(u.lungeX, u.lungeY) || 1;
    u.lungeX /= L; u.lungeY /= L;
    fx.ring((u.px + t.px) / 2, (u.py + t.py) / 2, '#ffffff', 14);
  },
};

function stepFx(dt) {
  for (let i = parts.length - 1; i >= 0; i--) {
    const p = parts[i];
    p.t += dt;
    if (p.t >= p.life) { parts.splice(i, 1); continue; }
    p.x += p.vx * dt; p.y += p.vy * dt; p.vy += p.g * dt; p.vx *= 0.985;
  }
  for (let i = floats.length - 1; i >= 0; i--) {
    const f = floats[i];
    f.t += dt;
    if (f.t >= f.life) { floats.splice(i, 1); continue; }
    f.y += f.vy * dt; f.vy *= 0.94;
  }
  for (let i = rings.length - 1; i >= 0; i--) {
    const r = rings[i];
    r.t += dt;
    if (r.t >= r.life) rings.splice(i, 1);
  }
  shakeState.mag *= Math.pow(0.0016, dt);
  if (shakeState.mag < 0.05) shakeState.mag = 0;
  shakeState.t += dt * 46;
  flashState.a *= Math.pow(0.008, dt);
}

/* ================================================ 9. rendering =========== */

const VW = 1280, VH = 720;
const MID = 640;
const SLOT_W = 118, SLOT_H = 140, SLOT_GAP = 12;
const LANE_Y = [212, 364];
const HAND_Y = 632, CARD_W = 126, CARD_H = 168;

function slotPos(side, lane, col) {
  const step = SLOT_W + SLOT_GAP;
  const x = side === 'p' ? MID - 52 - (col + 0.5) * step : MID + 52 + (col + 0.5) * step;
  return { x, y: LANE_Y[lane] };
}

let ctx = null, canvas = null, DPR = 1;

/* ------------------------------------------------------------ primitives -- */
function rr(c, x, y, w, h, r) {
  const k = Math.min(r, w / 2, h / 2);
  c.beginPath();
  c.moveTo(x + k, y);
  c.arcTo(x + w, y, x + w, y + h, k);
  c.arcTo(x + w, y + h, x, y + h, k);
  c.arcTo(x, y + h, x, y, k);
  c.arcTo(x, y, x + w, y, k);
  c.closePath();
}
function inked(c, fill, lw, stroke) {
  if (fill) { c.fillStyle = fill; c.fill(); }
  if (lw) { c.lineWidth = lw; c.strokeStyle = stroke || C.ink; c.lineJoin = 'round'; c.stroke(); }
}
function panel(c, x, y, w, h, r, fill, edge) {
  c.save();
  c.shadowColor = 'rgba(0,0,0,.5)'; c.shadowBlur = 18; c.shadowOffsetY = 8;
  rr(c, x, y, w, h, r);
  c.fillStyle = fill || C.card; c.fill();
  c.restore();
  rr(c, x, y, w, h, r);
  c.lineWidth = 3; c.strokeStyle = edge || C.ink; c.stroke();
}
/* An ellipse with a soft, slightly irregular edge — the shape language the
   whole cast is built from. */
function blob(c, x, y, w, h, wob, ph) {
  const n = 22;
  c.beginPath();
  for (let i = 0; i <= n; i++) {
    const a = (i / n) * TAU;
    const k = 1 + (wob || 0) * Math.sin(a * 3 + (ph || 0)) * 0.5;
    const px = x + Math.cos(a) * w * 0.5 * k;
    const py = y + Math.sin(a) * h * 0.5 * (1 + (wob || 0) * Math.cos(a * 2 + (ph || 0)) * 0.3);
    if (i === 0) c.moveTo(px, py); else c.lineTo(px, py);
  }
  c.closePath();
}
function txt(c, s, x, y, size, col, align, face, outline) {
  c.font = (face === 'd' ? '' : '600 ') + size + 'px ' + (face === 'd' ? "'Frostcut','Trebuchet MS',sans-serif" : "'Frostwork','Trebuchet MS',sans-serif");
  c.textAlign = align || 'center';
  c.textBaseline = 'middle';
  if (outline !== 0) {
    c.lineWidth = Math.max(3, size * 0.22);
    c.strokeStyle = outline || 'rgba(12,20,36,.85)';
    c.lineJoin = 'round';
    c.strokeText(s, x, y);
  }
  c.fillStyle = col || C.snow;
  c.fillText(s, x, y);
}
function wrapText(c, s, size, maxW) {
  c.font = '600 ' + size + "px 'Frostwork','Trebuchet MS',sans-serif";
  const words = String(s).split(' ');
  const lines = [];
  let line = '';
  for (const w of words) {
    const test = line ? line + ' ' + w : w;
    if (c.measureText(test).width > maxW && line) { lines.push(line); line = w; }
    else line = test;
  }
  if (line) lines.push(line);
  return lines;
}

/* -------------------------------------------------------- the cast ------- */

/* One function draws every creature in the game. A recipe picks the
   silhouette and the trimmings; the seed and the clock do the rest, so two
   Rimefoxes on the board are never breathing in step. */
function drawCreature(c, art, x, y, s, o) {
  o = o || {};
  const t = o.t || 0;
  const breathe = Math.sin(t * 1.7 + (o.ph || 0)) * 0.02;
  const sq = o.sq || 0;
  const sx = (1 + breathe + sq * 0.22) * (o.flip ? -1 : 1);
  const sy = 1 - breathe - sq * 0.26;
  const shape = art.shape || 'blob';
  const dim = {
    blob:  [1.02, 0.86], round: [0.94, 0.94], tall: [0.80, 1.06], squat: [1.14, 0.74],
    small: [0.72, 0.68], wisp:  [0.78, 1.00], boss:  [1.24, 1.10],
  }[shape] || [1, 0.9];
  const bw = s * dim[0], bh = s * dim[1];
  const lw = Math.max(2.5, s * 0.055);

  c.save();
  c.translate(x, y);
  c.scale(sx, sy);
  c.lineJoin = 'round'; c.lineCap = 'round';

  // ground shadow
  c.save();
  c.globalAlpha = 0.28;
  c.fillStyle = '#000';
  c.beginPath(); c.ellipse(0, bh * 0.52, bw * 0.42, bh * 0.09, 0, 0, TAU); c.fill();
  c.restore();

  const cy = -bh * 0.06;

  /* ---- behind-body furniture: wings, ears, horns, props ---- */
  if (art.wings) {
    for (const d of [-1, 1]) {
      c.save();
      c.translate(d * bw * 0.36, cy - bh * 0.06);
      c.rotate(d * (0.5 + Math.sin(t * 6 + (o.ph || 0)) * 0.22));
      blob(c, 0, 0, bw * 0.62, bh * 0.44, 0.06, 1.2);
      inked(c, art.wings, lw, C.ink);
      c.restore();
    }
  }
  const ears = art.ears || 'round';
  const earTop = cy - bh * 0.34;
  if (ears === 'pointy' || ears === 'shard') {
    for (const d of [-1, 1]) {
      c.beginPath();
      c.moveTo(d * bw * 0.30, earTop + bh * 0.10);
      c.lineTo(d * bw * (ears === 'shard' ? 0.30 : 0.40), earTop - bh * (ears === 'shard' ? 0.42 : 0.30));
      c.lineTo(d * bw * 0.06, earTop - bh * 0.02);
      c.closePath();
      inked(c, art.patCol && art.pat === 'tips' ? art.patCol : art.body, lw, C.ink);
    }
  } else if (ears === 'round') {
    for (const d of [-1, 1]) {
      c.beginPath(); c.ellipse(d * bw * 0.31, earTop - bh * 0.02, bw * 0.16, bh * 0.17, 0, 0, TAU);
      inked(c, art.body, lw, C.ink);
    }
  } else if (ears === 'horns') {
    for (const d of [-1, 1]) {
      c.beginPath();
      c.moveTo(d * bw * 0.24, earTop + bh * 0.06);
      c.quadraticCurveTo(d * bw * 0.52, earTop - bh * 0.14, d * bw * 0.40, earTop - bh * 0.40);
      c.quadraticCurveTo(d * bw * 0.30, earTop - bh * 0.14, d * bw * 0.10, earTop + bh * 0.04);
      c.closePath();
      inked(c, '#e7dfd0', lw, C.ink);
    }
  } else if (ears === 'antler') {
    for (const d of [-1, 1]) {
      c.strokeStyle = '#cdbfa4'; c.lineWidth = lw * 1.3;
      c.beginPath();
      c.moveTo(d * bw * 0.18, earTop + bh * 0.04);
      c.lineTo(d * bw * 0.30, earTop - bh * 0.34);
      c.moveTo(d * bw * 0.26, earTop - bh * 0.14);
      c.lineTo(d * bw * 0.46, earTop - bh * 0.24);
      c.stroke();
    }
  } else if (ears === 'antenna') {
    for (const d of [-1, 1]) {
      c.strokeStyle = C.ink; c.lineWidth = lw * 0.8;
      c.beginPath();
      c.moveTo(d * bw * 0.10, earTop + bh * 0.06);
      c.quadraticCurveTo(d * bw * 0.30, earTop - bh * 0.30, d * bw * 0.36, earTop - bh * 0.40);
      c.stroke();
      c.beginPath(); c.arc(d * bw * 0.36, earTop - bh * 0.42, s * 0.05, 0, TAU);
      inked(c, art.belly, lw * 0.8, C.ink);
    }
  } else if (ears === 'fin') {
    c.beginPath();
    c.moveTo(-bw * 0.06, earTop - bh * 0.02);
    c.quadraticCurveTo(0, earTop - bh * 0.44, bw * 0.16, earTop - bh * 0.04);
    c.closePath();
    inked(c, art.belly, lw, C.ink);
  }

  /* ---- body ---- */
  if (shape === 'wisp') {
    c.beginPath();
    c.moveTo(-bw * 0.42, cy + bh * 0.10);
    c.quadraticCurveTo(-bw * 0.5, cy - bh * 0.55, 0, cy - bh * 0.52);
    c.quadraticCurveTo(bw * 0.5, cy - bh * 0.55, bw * 0.42, cy + bh * 0.10);
    for (let i = 0; i <= 4; i++) {
      const px = bw * 0.42 - (i / 4) * bw * 0.84;
      const py = cy + bh * 0.10 + Math.sin(t * 3 + i * 1.6) * bh * 0.06 + (i % 2 ? bh * 0.14 : 0);
      c.lineTo(px, py);
    }
    c.closePath();
  } else {
    blob(c, 0, cy, bw, bh, 0.03, t * 0.6 + (o.ph || 0));
  }
  inked(c, art.body, lw, C.ink);

  // belly / face plate
  c.save();
  c.beginPath(); c.ellipse(0, cy + bh * 0.10, bw * 0.34, bh * 0.32, 0, 0, TAU);
  c.fillStyle = art.belly; c.globalAlpha = 0.95; c.fill();
  c.restore();

  /* ---- markings ---- */
  if (art.pat === 'spots') {
    c.fillStyle = art.patCol || '#00000022';
    for (let i = 0; i < 3; i++) {
      c.beginPath();
      c.ellipse(-bw * 0.30 + i * bw * 0.13, cy - bh * 0.20 + (i % 2) * bh * 0.10, s * 0.045, s * 0.038, 0, 0, TAU);
      c.fill();
    }
  } else if (art.pat === 'stripes') {
    c.strokeStyle = art.patCol || '#00000033'; c.lineWidth = lw * 0.9; c.lineCap = 'round';
    for (let i = 0; i < 3; i++) {
      c.beginPath();
      c.arc(0, cy, bw * (0.30 + i * 0.06), -1.9, -1.2);
      c.stroke();
    }
  } else if (art.pat === 'shards') {
    c.fillStyle = art.patCol || '#ffffff55';
    for (let i = 0; i < 3; i++) {
      const px = -bw * 0.26 + i * bw * 0.26, py = cy - bh * 0.34;
      c.beginPath(); c.moveTo(px, py); c.lineTo(px + s * 0.05, py - s * 0.16); c.lineTo(px + s * 0.10, py);
      c.closePath(); c.fill();
    }
  }

  /* ---- face ---- */
  const eyeY = cy - bh * 0.08;
  const eyeDx = bw * 0.15;
  const blinkPhase = ((t * 0.6 + (o.blink || 0)) % 4.4);
  const blink = blinkPhase < 0.12 ? 1 - Math.abs(blinkPhase - 0.06) / 0.06 : 0;
  const eyeStyle = art.eyes || 'dot';
  const er = s * (eyeStyle === 'big' ? 0.13 : eyeStyle === 'slit' ? 0.10 : 0.085);
  for (const d of [-1, 1]) {
    const ex = d * eyeDx;
    if (eyeStyle === 'slit') {
      c.save();
      c.strokeStyle = art.evil ? '#ff8a8a' : C.ink;
      c.lineWidth = lw * 1.1;
      c.beginPath();
      c.moveTo(ex - er * 0.8, eyeY - er * 0.4); c.lineTo(ex + er * 0.8, eyeY + er * 0.2);
      c.stroke();
      c.restore();
      continue;
    }
    c.beginPath(); c.ellipse(ex, eyeY, er, er * (1 - blink * 0.92), 0, 0, TAU);
    inked(c, '#ffffff', lw * 0.8, C.ink);
    if (blink < 0.6) {
      c.beginPath();
      c.ellipse(ex + d * er * 0.16, eyeY + er * 0.1, er * 0.46, er * 0.5 * (1 - blink), 0, 0, TAU);
      c.fillStyle = art.evil ? '#7a1030' : C.ink; c.fill();
      c.beginPath();
      c.arc(ex + d * er * 0.32, eyeY - er * 0.28, er * 0.18, 0, TAU);
      c.fillStyle = '#ffffff'; c.fill();
    }
  }

  const my = cy + bh * 0.14;
  const mouth = art.mouth || 'smile';
  c.strokeStyle = C.ink; c.lineWidth = lw * 0.9; c.lineCap = 'round';
  if (mouth === 'smile') {
    c.beginPath(); c.arc(0, my - s * 0.03, s * 0.09, 0.3, Math.PI - 0.3); c.stroke();
  } else if (mouth === 'grin') {
    c.beginPath(); c.arc(0, my - s * 0.05, s * 0.11, 0.15, Math.PI - 0.15);
    c.fillStyle = '#4a1c2a'; c.fill(); c.stroke();
  } else if (mouth === 'flat') {
    c.beginPath(); c.moveTo(-s * 0.07, my); c.lineTo(s * 0.07, my); c.stroke();
  } else if (mouth === 'fang') {
    c.beginPath(); c.arc(0, my - s * 0.04, s * 0.10, 0.2, Math.PI - 0.2);
    c.fillStyle = '#4a1c2a'; c.fill(); c.stroke();
    c.fillStyle = '#ffffff';
    for (const d of [-1, 1]) {
      c.beginPath();
      c.moveTo(d * s * 0.06, my - s * 0.01); c.lineTo(d * s * 0.02, my + s * 0.06); c.lineTo(d * s * 0.005, my - s * 0.01);
      c.closePath(); c.fill();
    }
  } else if (mouth === 'wide' || mouth === 'trap') {
    c.beginPath(); c.ellipse(0, my + s * 0.01, s * 0.15, s * 0.10, 0, 0, TAU);
    inked(c, '#3a1020', lw * 0.9, C.ink);
    if (mouth === 'trap') {
      c.fillStyle = '#fff';
      for (let i = -2; i <= 2; i++) {
        c.beginPath();
        c.moveTo(i * s * 0.055 - s * 0.02, my - s * 0.09);
        c.lineTo(i * s * 0.055 + s * 0.02, my - s * 0.09);
        c.lineTo(i * s * 0.055, my - s * 0.02);
        c.closePath(); c.fill();
      }
    }
  } else if (mouth === 'beak') {
    c.beginPath();
    c.moveTo(-s * 0.09, my - s * 0.02); c.lineTo(s * 0.09, my - s * 0.02); c.lineTo(0, my + s * 0.11);
    c.closePath();
    inked(c, '#f0b45c', lw * 0.8, C.ink);
  } else if (mouth === 'bolt') {
    c.beginPath();
    c.moveTo(-s * 0.10, my); c.lineTo(-s * 0.02, my); c.lineTo(-s * 0.05, my + s * 0.07);
    c.lineTo(s * 0.10, my - s * 0.03);
    c.stroke();
  } else if (mouth === 'beard') {
    c.beginPath();
    c.moveTo(-bw * 0.20, my - s * 0.04);
    c.quadraticCurveTo(0, my + bh * 0.30, bw * 0.20, my - s * 0.04);
    c.closePath();
    inked(c, '#eef5ff', lw * 0.9, C.ink);
  }

  /* ---- props ---- */
  const acc = art.acc || 'none';
  if (acc === 'scarf') {
    c.beginPath();
    rr(c, -bw * 0.32, cy + bh * 0.02, bw * 0.64, bh * 0.13, bh * 0.06);
    inked(c, art.accCol || '#ff5566', lw * 0.9, C.ink);
    c.beginPath();
    rr(c, bw * 0.16, cy + bh * 0.08, bw * 0.14, bh * 0.30, bh * 0.05);
    inked(c, art.accCol || '#ff5566', lw * 0.9, C.ink);
  } else if (acc === 'helm') {
    c.beginPath(); c.arc(0, cy - bh * 0.22, bw * 0.36, Math.PI, TAU);
    c.closePath();
    inked(c, art.accCol || '#8fa2bd', lw, C.ink);
    c.beginPath(); rr(c, -bw * 0.38, cy - bh * 0.24, bw * 0.76, bh * 0.08, 4);
    inked(c, art.accCol || '#8fa2bd', lw * 0.8, C.ink);
  } else if (acc === 'crown') {
    c.beginPath();
    c.moveTo(-bw * 0.26, cy - bh * 0.30);
    c.lineTo(-bw * 0.26, cy - bh * 0.50); c.lineTo(-bw * 0.10, cy - bh * 0.38);
    c.lineTo(0, cy - bh * 0.56); c.lineTo(bw * 0.10, cy - bh * 0.38);
    c.lineTo(bw * 0.26, cy - bh * 0.50); c.lineTo(bw * 0.26, cy - bh * 0.30);
    c.closePath();
    inked(c, art.accCol || C.gold, lw, C.ink);
  } else if (acc === 'lantern') {
    const lx = bw * 0.44, ly = cy + bh * 0.10 + Math.sin(t * 2.2) * bh * 0.03;
    c.strokeStyle = C.ink; c.lineWidth = lw * 0.7;
    c.beginPath(); c.moveTo(bw * 0.24, cy - bh * 0.06); c.lineTo(lx, ly - s * 0.10); c.stroke();
    c.save();
    c.globalAlpha = 0.5; c.fillStyle = art.accCol || C.gold;
    c.beginPath(); c.arc(lx, ly, s * 0.20, 0, TAU); c.fill();
    c.restore();
    c.beginPath(); rr(c, lx - s * 0.07, ly - s * 0.09, s * 0.14, s * 0.18, s * 0.03);
    inked(c, art.accCol || C.gold, lw * 0.8, C.ink);
  } else if (acc === 'kettle') {
    c.beginPath(); rr(c, -bw * 0.20, cy - bh * 0.52, bw * 0.40, bh * 0.22, bh * 0.05);
    inked(c, art.accCol || '#9aa7bd', lw * 0.9, C.ink);
    c.beginPath(); c.moveTo(bw * 0.18, cy - bh * 0.46); c.lineTo(bw * 0.34, cy - bh * 0.52);
    c.strokeStyle = C.ink; c.lineWidth = lw * 0.9; c.stroke();
    // steam
    c.save(); c.globalAlpha = 0.5; c.strokeStyle = '#ffffff'; c.lineWidth = lw * 0.7;
    for (let i = 0; i < 2; i++) {
      c.beginPath();
      const ph = t * 1.6 + i;
      c.moveTo(-bw * 0.04 + i * bw * 0.10, cy - bh * 0.54);
      c.quadraticCurveTo(-bw * 0.04 + i * bw * 0.10 + Math.sin(ph) * s * 0.06, cy - bh * 0.66,
                         -bw * 0.04 + i * bw * 0.10, cy - bh * 0.78);
      c.stroke();
    }
    c.restore();
  } else if (acc === 'gear') {
    const gx = -bw * 0.40, gy = cy - bh * 0.10;
    c.save(); c.translate(gx, gy); c.rotate(t * 0.9);
    c.fillStyle = art.accCol || '#8fa2bd';
    for (let i = 0; i < 6; i++) {
      c.save(); c.rotate((i / 6) * TAU);
      c.beginPath(); rr(c, -s * 0.035, -s * 0.20, s * 0.07, s * 0.10, 2); c.fill();
      c.restore();
    }
    c.beginPath(); c.arc(0, 0, s * 0.14, 0, TAU);
    inked(c, art.accCol || '#8fa2bd', lw * 0.8, C.ink);
    c.beginPath(); c.arc(0, 0, s * 0.05, 0, TAU); c.fillStyle = C.ink; c.fill();
    c.restore();
  } else if (acc === 'hammer' || acc === 'pike' || acc === 'staff') {
    const hx = bw * 0.40;
    c.strokeStyle = '#8a6a3f'; c.lineWidth = lw * 1.4; c.lineCap = 'round';
    c.beginPath(); c.moveTo(hx, cy + bh * 0.34); c.lineTo(hx - bw * 0.04, cy - bh * 0.44); c.stroke();
    if (acc === 'hammer') {
      c.beginPath(); rr(c, hx - bw * 0.20, cy - bh * 0.60, bw * 0.34, bh * 0.20, 4);
      inked(c, art.accCol || '#9aa7bd', lw * 0.9, C.ink);
    } else if (acc === 'pike') {
      c.beginPath();
      c.moveTo(hx - bw * 0.10, cy - bh * 0.44); c.lineTo(hx - bw * 0.04, cy - bh * 0.70);
      c.lineTo(hx + bw * 0.02, cy - bh * 0.44); c.closePath();
      inked(c, art.accCol || '#cfd8e8', lw * 0.8, C.ink);
    } else {
      c.beginPath(); c.arc(hx - bw * 0.04, cy - bh * 0.52, s * 0.11, 0, TAU);
      inked(c, art.accCol || '#6f8fd0', lw * 0.8, C.ink);
    }
  } else if (acc === 'cloak') {
    c.beginPath();
    c.moveTo(-bw * 0.42, cy - bh * 0.10);
    c.quadraticCurveTo(-bw * 0.56, cy + bh * 0.46, -bw * 0.10, cy + bh * 0.48);
    c.lineTo(-bw * 0.16, cy - bh * 0.16);
    c.closePath();
    inked(c, art.accCol || '#2b5f96', lw * 0.9, C.ink);
  }

  c.restore();
}

/* ------------------------------------------------------------- backdrop -- */
function initSnow() {
  snowflakes = [];
  for (let i = 0; i < 90; i++) {
    snowflakes.push({ x: rnd() * VW, y: rnd() * VH, r: 1 + rnd() * 2.6, s: 12 + rnd() * 34, d: rnd() * TAU });
  }
}
function drawBackdrop(c, zone, t) {
  const z = ZONES[clamp(zone || 0, 0, ZONES.length - 1)];
  const g2 = c.createLinearGradient(0, 0, 0, VH);
  g2.addColorStop(0, z.sky[0]); g2.addColorStop(1, z.sky[1]);
  c.fillStyle = g2; c.fillRect(0, 0, VW, VH);

  // aurora
  c.save();
  c.globalAlpha = 0.20; c.globalCompositeOperation = 'lighter';
  for (let i = 0; i < 3; i++) {
    const gg = c.createLinearGradient(0, 60 + i * 40, VW, 200 + i * 40);
    gg.addColorStop(0, 'rgba(0,0,0,0)');
    gg.addColorStop(0.5, i % 2 ? z.tint : '#6fd8ff');
    gg.addColorStop(1, 'rgba(0,0,0,0)');
    c.fillStyle = gg;
    c.beginPath();
    c.moveTo(0, 120 + i * 46 + Math.sin(t * 0.3 + i) * 22);
    for (let x = 0; x <= VW; x += 64) c.lineTo(x, 120 + i * 46 + Math.sin(t * 0.3 + i + x * 0.004) * 26);
    c.lineTo(VW, 0); c.lineTo(0, 0); c.closePath(); c.fill();
  }
  c.restore();

  // far ridges
  for (let layer = 0; layer < 3; layer++) {
    const base = 300 + layer * 54;
    const amp = 70 - layer * 16;
    c.beginPath(); c.moveTo(0, VH);
    c.lineTo(0, base);
    for (let x = 0; x <= VW; x += 40) {
      const y = base - Math.abs(Math.sin(x * 0.0037 + layer * 2.1)) * amp - Math.sin(x * 0.011 + layer) * 12;
      c.lineTo(x, y);
    }
    c.lineTo(VW, VH); c.closePath();
    c.fillStyle = ['rgba(255,255,255,.06)', 'rgba(255,255,255,.10)', 'rgba(255,255,255,.15)'][layer];
    c.fill();
  }

  // ground
  const gg = c.createLinearGradient(0, 470, 0, VH);
  gg.addColorStop(0, z.ground); gg.addColorStop(1, '#9fb6d6');
  c.fillStyle = gg;
  c.beginPath();
  c.moveTo(0, 520);
  for (let x = 0; x <= VW; x += 48) c.lineTo(x, 500 + Math.sin(x * 0.006) * 14);
  c.lineTo(VW, VH); c.lineTo(0, VH); c.closePath(); c.fill();

  if (snowflakes) {
    c.save(); c.fillStyle = 'rgba(255,255,255,.75)';
    for (const f of snowflakes) {
      f.y += f.s * 0.016; f.x += Math.sin(t * 0.7 + f.d) * 0.5;
      if (f.y > VH + 4) { f.y = -4; f.x = rnd() * VW; }
      c.globalAlpha = 0.25 + (f.r / 3.6) * 0.6;
      c.beginPath(); c.arc(f.x, f.y, f.r, 0, TAU); c.fill();
    }
    c.restore();
  }
  // vignette
  const v = c.createRadialGradient(VW / 2, VH / 2, 260, VW / 2, VH / 2, 760);
  v.addColorStop(0, 'rgba(0,0,0,0)'); v.addColorStop(1, 'rgba(0,0,0,.42)');
  c.fillStyle = v; c.fillRect(0, 0, VW, VH);
}

/* ------------------------------------------------------------ card faces -- */
const RARE_COL = { 1: '#8fa6c4', 2: '#6fd8ff', 3: '#ffd166' };

function statPip(c, x, y, r, col, val, icon) {
  c.beginPath(); c.arc(x, y, r, 0, TAU);
  inked(c, col, 3, C.ink);
  txt(c, String(val), x, y + 1, r * 1.5, '#12203a', 'center', 'd', 0);
}
function drawStatus(c, u, x, y, sz) {
  let i = 0;
  for (const k of STATUS_ORDER) {
    const n = u.st[k] || 0;
    if (!n) continue;
    const px = x + (i % 3) * (sz + 3), py = y + Math.floor(i / 3) * (sz + 3);
    c.beginPath(); rr(c, px, py, sz, sz, 4);
    inked(c, STATUS[k].col, 2, C.ink);
    txt(c, String(n), px + sz / 2, py + sz / 2 + 1, sz * 0.78, '#12203a', 'center', 'd', 0);
    i++;
  }
}

/* A unit standing on the board: a small slab with the creature on it. */
function drawUnit(c, u, t) {
  const w = SLOT_W, h = SLOT_H;
  const x = u.px - w / 2, y = u.py - h / 2;
  const dying = !u.alive;
  c.save();
  if (dying) {
    const k = clamp(u.dead / 0.55, 0, 1);
    c.globalAlpha = 1 - k;
    c.translate(u.px, u.py + k * 26);
    c.rotate(k * 0.5);
    c.translate(-u.px, -u.py);
  }
  const tribeCol = u.side === 'p' ? (u.leader ? C.gold : '#7fb2e8') : '#d08a8a';
  panel(c, x, y, w, h, 14, u.side === 'p' ? '#1d2c49' : '#3a2436', tribeCol);
  // inner art window
  const iw = w - 14, ih = h - 40;
  c.save();
  rr(c, x + 7, y + 7, iw, ih, 10);
  c.clip();
  const gg = c.createLinearGradient(0, y, 0, y + ih);
  gg.addColorStop(0, u.side === 'p' ? '#31507f' : '#5c3450');
  gg.addColorStop(1, u.side === 'p' ? '#16233c' : '#2a1524');
  c.fillStyle = gg; c.fillRect(x + 7, y + 7, iw, ih);
  drawCreature(c, u.art, u.px, y + ih * 0.62, ih * 0.86, {
    t, ph: u.bob, sq: u.sq, blink: u.blink, flip: u.side === 'e',
  });
  c.restore();

  if (u.flash > 0) {
    c.save(); c.globalAlpha = u.flash * 0.7; c.globalCompositeOperation = 'lighter';
    rr(c, x + 7, y + 7, iw, ih, 10); c.fillStyle = '#ff9aa5'; c.fill();
    c.restore();
  }

  // name strip
  txt(c, u.name.toUpperCase(), u.px, y + h - 24, 13, u.side === 'p' ? '#dbeaff' : '#ffd8d8', 'center', 't');

  // stats
  if (u.atk > 0 || u.leader) statPip(c, x + 14, y + h - 12, 13, '#ff8b7a', u.atk + stat(u, 'spice'));
  statPip(c, x + w - 14, y + h - 12, 13, '#7de08f', u.hp);
  // counter
  const ready = u.cnt <= 1;
  c.save();
  if (ready) { c.shadowColor = '#ffd166'; c.shadowBlur = 14; }
  c.beginPath(); c.arc(x + w - 13, y + 13, 15, 0, TAU);
  inked(c, ready ? '#ffd166' : '#cfe0f5', 3, C.ink);
  c.restore();
  txt(c, String(u.cnt), x + w - 13, y + 14, 20, '#12203a', 'center', 'd', 0);

  drawStatus(c, u, x + 5, y + 5, 20);

  if (u.leader) {
    c.beginPath();
    c.moveTo(u.px - 16, y - 4); c.lineTo(u.px - 16, y - 16); c.lineTo(u.px - 6, y - 9);
    c.lineTo(u.px, y - 19); c.lineTo(u.px + 6, y - 9); c.lineTo(u.px + 16, y - 16); c.lineTo(u.px + 16, y - 4);
    c.closePath();
    inked(c, C.gold, 2.5, C.ink);
  }
  c.restore();
}

/* A card in hand: the full face, with rules text. */
function drawCard(c, card, x, y, w, h, o) {
  o = o || {};
  const d = CARDS[card.def];
  const isUnit = card.type === 'unit';
  c.save();
  if (o.alpha !== undefined) c.globalAlpha = o.alpha;
  c.translate(x + w / 2, y + h / 2);
  if (o.rot) c.rotate(o.rot);
  if (o.scale) c.scale(o.scale, o.scale);
  c.translate(-w / 2, -h / 2);

  panel(c, 0, 0, w, h, 13, '#f3e9d6', RARE_COL[card.rare] || '#8fa6c4');
  // header
  c.beginPath(); rr(c, 5, 5, w - 10, 26, 8);
  inked(c, card.tribe ? TRIBES[card.tribe].col : '#b9c8dc', 2, C.ink);
  txt(c, card.name.toUpperCase(), w / 2, 18, Math.min(15, 190 / Math.max(7, card.name.length) * 1.05 + 6), '#22160c', 'center', 't', 'rgba(255,255,255,.55)');

  // art
  const aw = w - 14, ah = h * 0.40;
  c.save();
  rr(c, 7, 34, aw, ah, 9); c.clip();
  const gg = c.createLinearGradient(0, 34, 0, 34 + ah);
  gg.addColorStop(0, '#cfe4f8'); gg.addColorStop(1, '#9fb8d8');
  c.fillStyle = gg; c.fillRect(7, 34, aw, ah);
  if (isUnit) drawCreature(c, card.art, w / 2, 34 + ah * 0.66, ah * 0.92, { t: o.t || 0, ph: card.uid, blink: card.uid });
  else drawItemIcon(c, d.art, w / 2, 34 + ah * 0.5, ah * 0.62, o.t || 0);
  c.restore();
  rr(c, 7, 34, aw, ah, 9); c.lineWidth = 2.5; c.strokeStyle = C.ink; c.stroke();

  // text box
  const ty = 34 + ah + 6;
  c.beginPath(); rr(c, 7, ty, aw, h - ty - (isUnit ? 30 : 9), 8);
  inked(c, '#fffaf0', 2, 'rgba(30,40,60,.35)');
  const lines = wrapText(c, card.text || '', 11.5, aw - 12);
  lines.slice(0, 4).forEach((ln, i) => txt(c, ln, w / 2, ty + 12 + i * 13, 11.5, '#3a3020', 'center', 't', 0));

  if (isUnit) {
    statPip(c, 16, h - 15, 13, '#ff8b7a', card.injured ? Math.max(0, Math.round(card.atk / 2)) : card.atk);
    statPip(c, w / 2, h - 15, 13, '#ffd166', card.cnt);
    const mh = card.injured ? Math.max(1, Math.round(card.hp / 2)) : card.hp;
    statPip(c, w - 16, h - 15, 13, '#7de08f', Math.max(0, mh - (card.dmg || 0)));
  }
  if (card.charms.length) {
    for (let i = 0; i < card.charms.length; i++) {
      const ch = CHARMS[card.charms[i]] || SCARS[card.charms[i]];
      c.beginPath(); c.arc(w - 10, 42 + i * 17, 7, 0, TAU);
      inked(c, ch ? ch.col : '#fff', 2, C.ink);
    }
  }
  if (card.injured) {
    c.save();
    c.globalAlpha = 0.9;
    c.beginPath(); rr(c, 7, 34, aw, ah, 9);
    c.fillStyle = 'rgba(120,20,40,.22)'; c.fill();
    c.restore();
    txt(c, 'HURT', w / 2, 34 + ah - 12, 15, '#ff9aa5', 'center', 'd');
  }
  c.restore();
}

function drawItemIcon(c, art, x, y, s, t) {
  const kind = (art && art.kind) || 'flask';
  const col = (art && art.col) || C.frost;
  c.save();
  c.translate(x, y + Math.sin(t * 2 + s) * 2);
  c.lineJoin = 'round';
  const lw = Math.max(2.5, s * 0.09);
  if (kind === 'flask') {
    c.beginPath();
    c.moveTo(-s * 0.16, -s * 0.42); c.lineTo(-s * 0.16, -s * 0.16);
    c.quadraticCurveTo(-s * 0.42, s * 0.16, -s * 0.24, s * 0.40);
    c.lineTo(s * 0.24, s * 0.40);
    c.quadraticCurveTo(s * 0.42, s * 0.16, s * 0.16, -s * 0.16);
    c.lineTo(s * 0.16, -s * 0.42);
    c.closePath();
    inked(c, col, lw, C.ink);
    c.beginPath(); rr(c, -s * 0.22, -s * 0.52, s * 0.44, s * 0.14, 4);
    inked(c, '#c9b28a', lw * 0.8, C.ink);
  } else if (kind === 'pick') {
    c.rotate(-0.5);
    c.beginPath(); rr(c, -s * 0.06, -s * 0.5, s * 0.12, s * 0.8, 4);
    inked(c, '#8a6a3f', lw * 0.8, C.ink);
    c.beginPath();
    c.moveTo(-s * 0.34, -s * 0.42); c.lineTo(s * 0.34, -s * 0.42); c.lineTo(0, -s * 0.10);
    c.closePath();
    inked(c, col, lw, C.ink);
  } else if (kind === 'bowl') {
    c.beginPath(); c.arc(0, 0, s * 0.42, 0, Math.PI);
    c.closePath();
    inked(c, '#c9b28a', lw, C.ink);
    c.beginPath(); c.ellipse(0, 0, s * 0.42, s * 0.12, 0, 0, TAU);
    inked(c, col, lw * 0.8, C.ink);
  } else if (kind === 'burst') {
    for (let i = 0; i < 8; i++) {
      const a = (i / 8) * TAU + t * 0.6;
      c.beginPath();
      c.moveTo(Math.cos(a) * s * 0.16, Math.sin(a) * s * 0.16);
      c.lineTo(Math.cos(a) * s * 0.5, Math.sin(a) * s * 0.5);
      c.strokeStyle = col; c.lineWidth = lw; c.lineCap = 'round'; c.stroke();
    }
    c.beginPath(); c.arc(0, 0, s * 0.2, 0, TAU);
    inked(c, col, lw, C.ink);
  } else if (kind === 'shield') {
    c.beginPath();
    c.moveTo(0, -s * 0.46); c.lineTo(s * 0.36, -s * 0.28);
    c.quadraticCurveTo(s * 0.34, s * 0.34, 0, s * 0.48);
    c.quadraticCurveTo(-s * 0.34, s * 0.34, -s * 0.36, -s * 0.28);
    c.closePath();
    inked(c, col, lw, C.ink);
  } else if (kind === 'stone') {
    c.beginPath(); rr(c, -s * 0.4, -s * 0.2, s * 0.8, s * 0.4, s * 0.16);
    inked(c, col, lw, C.ink);
  } else if (kind === 'rope') {
    c.strokeStyle = col; c.lineWidth = lw * 1.2; c.lineCap = 'round';
    c.beginPath();
    for (let i = 0; i <= 12; i++) {
      const yy = -s * 0.45 + (i / 12) * s * 0.9;
      const xx = Math.sin(i * 0.9 + t) * s * 0.16;
      i ? c.lineTo(xx, yy) : c.moveTo(xx, yy);
    }
    c.stroke();
  } else if (kind === 'bomb') {
    c.beginPath(); c.arc(0, s * 0.08, s * 0.36, 0, TAU);
    inked(c, '#3a4257', lw, C.ink);
    c.strokeStyle = col; c.lineWidth = lw;
    c.beginPath(); c.moveTo(s * 0.14, -s * 0.24);
    c.quadraticCurveTo(s * 0.4, -s * 0.46, s * 0.26, -s * 0.56); c.stroke();
    c.beginPath(); c.arc(s * 0.26, -s * 0.6, s * 0.09 + Math.sin(t * 12) * s * 0.02, 0, TAU);
    c.fillStyle = '#ffd166'; c.fill();
  } else if (kind === 'lantern') {
    c.save(); c.globalAlpha = 0.45; c.fillStyle = col;
    c.beginPath(); c.arc(0, 0, s * 0.5, 0, TAU); c.fill();
    c.restore();
    c.beginPath(); rr(c, -s * 0.2, -s * 0.28, s * 0.4, s * 0.56, s * 0.1);
    inked(c, col, lw, C.ink);
  }
  c.restore();
}

/* A tiny synth: no samples, no files, and it never blocks a gesture-less
   autoplay policy because nothing is built until the first tap. */
const AUD = { ctx: null, on: true, master: null };
function audioInit() {
  if (AUD.ctx || HEADLESS) return;
  try {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    AUD.ctx = new AC();
    AUD.master = AUD.ctx.createGain();
    AUD.master.gain.value = 0.5;
    AUD.master.connect(AUD.ctx.destination);
  } catch (e) { AUD.ctx = null; }
}
function tone(freq, dur, type, vol, slide, delay) {
  if (!AUD.ctx || !AUD.on) return;
  const t0 = AUD.ctx.currentTime + (delay || 0);
  const o = AUD.ctx.createOscillator();
  const g2 = AUD.ctx.createGain();
  o.type = type || 'square';
  o.frequency.setValueAtTime(freq, t0);
  if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(20, slide), t0 + dur);
  g2.gain.setValueAtTime(0.0001, t0);
  g2.gain.exponentialRampToValueAtTime(Math.max(0.0002, vol === undefined ? 0.15 : vol), t0 + 0.012);
  g2.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  o.connect(g2); g2.connect(AUD.master);
  o.start(t0); o.stop(t0 + dur + 0.03);
}
function noise(dur, vol, hp) {
  if (!AUD.ctx || !AUD.on) return;
  const n = Math.floor(AUD.ctx.sampleRate * dur);
  const buf = AUD.ctx.createBuffer(1, n, AUD.ctx.sampleRate);
  const d = buf.getChannelData(0);
  for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / n, 2);
  const s = AUD.ctx.createBufferSource();
  s.buffer = buf;
  const f = AUD.ctx.createBiquadFilter();
  f.type = hp ? 'highpass' : 'lowpass';
  f.frequency.value = hp || 1400;
  const g2 = AUD.ctx.createGain();
  g2.gain.value = vol === undefined ? 0.16 : vol;
  s.connect(f); f.connect(g2); g2.connect(AUD.master);
  s.start();
}
function sfx(name) {
  if (HEADLESS || !AUD.ctx) return;
  switch (name) {
    case 'hit':   noise(0.16, 0.22, 0); tone(180, 0.1, 'square', 0.1, 70); break;
    case 'swing': noise(0.09, 0.1, 2600); break;
    case 'die':   tone(300, 0.34, 'sawtooth', 0.12, 60); noise(0.3, 0.14, 0); break;
    case 'heal':  tone(520, 0.16, 'sine', 0.14, 880); tone(780, 0.2, 'sine', 0.09, 1180, 0.06); break;
    case 'place': tone(220, 0.1, 'triangle', 0.16, 330); noise(0.08, 0.1, 900); break;
    case 'item':  tone(680, 0.14, 'triangle', 0.13, 420); break;
    case 'bell':  tone(880, 0.5, 'sine', 0.2, 660); tone(1320, 0.42, 'sine', 0.09, 990, 0.02); break;
    case 'draw':  noise(0.07, 0.08, 3200); break;
    case 'move':  tone(420, 0.06, 'sine', 0.09, 520); break;
    case 'get':   tone(660, 0.1, 'square', 0.12, 990); tone(990, 0.14, 'square', 0.1, 1320, 0.08); break;
    case 'win':   [523, 659, 784, 1047].forEach((f, i) => tone(f, 0.24, 'triangle', 0.14, f, i * 0.09)); break;
    case 'lose':  [440, 370, 294, 220].forEach((f, i) => tone(f, 0.3, 'sawtooth', 0.12, f * 0.9, i * 0.12)); break;
    case 'tap':   tone(900, 0.05, 'square', 0.07, 1200); break;
    default: break;
  }
}

/* Hit regions are rebuilt every frame by the draw code, so what the player can
   touch is always exactly what they can see. */
let hits = [];
const hit = (id, x, y, w, h, data) => { hits.push({ id, x, y, w, h, data }); };
function hitAt(x, y) {
  for (let i = hits.length - 1; i >= 0; i--) {
    const h = hits[i];
    if (x >= h.x && x <= h.x + h.w && y >= h.y && y <= h.y + h.h) return h;
  }
  return null;
}

const UI = {

function drawBattle(c, t) {
  const g = G, b = g.battle;
  drawBackdrop(c, g.run ? g.run.zone : 0, t);

  // slots
  for (const side of ['p', 'e']) {
    for (let l = 0; l < LANES; l++) for (let col = 0; col < COLS; col++) {
      const p = slotPos(side, l, col);
      const free = slotFree(g, side, l, col);
      const dragUnitCard = UI.drag && UI.drag.card && UI.drag.card.type === 'unit';
      const dropOk = side === 'p' && free && (dragUnitCard || (UI.drag && UI.drag.unit));
      c.save();
      c.globalAlpha = free ? (dropOk ? 0.85 : 0.30) : 0.12;
      rr(c, p.x - SLOT_W / 2, p.y - SLOT_H / 2, SLOT_W, SLOT_H, 14);
      c.setLineDash(dropOk ? [] : [8, 8]);
      c.lineWidth = dropOk ? 4 : 2.5;
      c.strokeStyle = dropOk ? '#ffe08a' : (side === 'p' ? '#a8c8ea' : '#e8a8a8');
      c.stroke();
      if (dropOk) { c.globalAlpha = 0.16; c.fillStyle = '#ffe08a'; c.fill(); }
      c.restore();
      if (side === 'p' && free) hit('slot', p.x - SLOT_W / 2, p.y - SLOT_H / 2, SLOT_W, SLOT_H, { lane: l, col });
    }
  }

  // the divide
  c.save();
  c.globalAlpha = 0.35;
  c.strokeStyle = '#cfe4ff'; c.lineWidth = 3; c.setLineDash([12, 14]);
  c.beginPath(); c.moveTo(MID, 120); c.lineTo(MID, 460); c.stroke();
  c.restore();

  // units, back to front
  const list = b.units.slice().sort((a, x) => (a.py - x.py) || (a.col - x.col));
  for (const u of list) {
    drawUnit(c, u, t);
    if (u.alive) hit('unit', u.px - SLOT_W / 2, u.py - SLOT_H / 2, SLOT_W, SLOT_H, u);
  }

  // attack order preview
  if (UI.order) {
    const ord = turnOrder(g);
    ord.forEach((u, i) => {
      c.beginPath(); c.arc(u.px - SLOT_W / 2 + 12, u.py + SLOT_H / 2 - 44, 13, 0, TAU);
      inked(c, '#0f1a2e', 2.5, '#8fe3ff');
      txt(c, String(i + 1), u.px - SLOT_W / 2 + 12, u.py + SLOT_H / 2 - 43, 16, '#8fe3ff', 'center', 'd', 0);
    });
  }

  drawHand(c, t);
  drawHud(c, t);

  // piles
  txt(c, 'DECK ' + b.draw.length, 84, VH - 152, 14, '#9fb6d6', 'center', 't');
  txt(c, 'USED ' + b.discard.length, 84, VH - 130, 14, '#7e97b8', 'center', 't');

  // the bell
  const charged = b.bell >= BELL_CHARGE;
  const bx = VW - 118, by = VH - 176;
  c.save();
  if (charged) { c.shadowColor = '#ffd166'; c.shadowBlur = 22 + Math.sin(t * 5) * 8; }
  c.beginPath();
  c.moveTo(bx - 34, by + 30);
  c.quadraticCurveTo(bx - 30, by - 30, bx, by - 34);
  c.quadraticCurveTo(bx + 30, by - 30, bx + 34, by + 30);
  c.closePath();
  inked(c, charged ? '#ffd166' : '#b9c8dc', 3.5, C.ink);
  c.restore();
  c.beginPath(); c.arc(bx, by + 36, 8, 0, TAU);
  inked(c, charged ? '#ffe6a8' : '#8fa2bd', 3, C.ink);
  txt(c, charged ? 'FREE REDRAW' : 'REDRAW (' + b.bell + '/' + BELL_CHARGE + ')', bx, by + 66, 13, charged ? '#ffe6a8' : '#9fb6d6', 'center', 't');
  hit('bell', bx - 60, by - 40, 120, 120);

  button(c, 'pass', VW - 178, VH - 66, 120, 44, 'PASS', '#40527a', b.busy, true);
  button(c, 'order', 22, 22 + 40, 96, 34, UI.order ? 'ORDER ✓' : 'ORDER', '#40527a', false, true);

  if (b.busy) txt(c, 'RESOLVING…', MID, 96, 16, '#9fc0e4', 'center', 't');
  else txt(c, 'TURN ' + (b.turn + 1) + '  ·  one action', MID, 96, 16, '#9fc0e4', 'center', 't');
}

function drawHand(c, t) {
  const b = G.battle;
  const n = b.hand.length;
  if (!n) return;
  const spread = Math.min(CARD_W + 8, (VW - 420) / Math.max(1, n));
  const total = (n - 1) * spread;
  for (let i = 0; i < n; i++) {
    const card = b.hand[i];
    const dragging = UI.drag && UI.drag.idx === i;
    if (dragging) continue;
    const x = MID - total / 2 + i * spread - CARD_W / 2;
    const hovered = UI.hover && UI.hover.id === 'hand' && UI.hover.data === i;
    const lift = hovered ? 30 : 0;
    const y = HAND_Y - CARD_H / 2 - lift + Math.sin(t * 1.6 + i) * 2;
    card.handT = Math.min(1, (card.handT || 0) + 0.06);
    drawCard(c, card, x, y, CARD_W, CARD_H, { t, scale: hovered ? 1.06 : 1 });
    hit('hand', x, y, CARD_W, CARD_H, i);
  }
  if (UI.drag && UI.drag.card) {
    const d = UI.drag;
    drawCard(c, d.card, d.x - CARD_W / 2, d.y - CARD_H / 2 - 20, CARD_W, CARD_H, { t, scale: 1.1, rot: Math.sin(t * 6) * 0.02 });
  }
}

/* --------------------------------------------------------------- trail --- */
function drawTrail(c, t) {
  const g = G, run = g.run;
  drawBackdrop(c, run.zone, t);
  const z = ZONES[clamp(run.zone, 0, ZONES.length - 1)];
  txt(c, z.name.toUpperCase(), MID, 92, 40, '#eaf6ff', 'center', 'd');
  txt(c, 'pick your road', MID, 130, 16, '#a8c8ea', 'center', 't');

  const steps = run.trail.length;
  const x0 = 150, x1 = VW - 150;
  c.save();
  c.strokeStyle = 'rgba(255,255,255,.28)'; c.lineWidth = 6; c.setLineDash([2, 14]); c.lineCap = 'round';
  c.beginPath(); c.moveTo(x0, 300); c.lineTo(x1, 300); c.stroke();
  c.restore();

  for (let s = 0; s < steps; s++) {
    const x = x0 + (x1 - x0) * (steps === 1 ? 0.5 : s / (steps - 1));
    const nodes = run.trail[s];
    const doneStep = s < run.step;
    const nowStep = s === run.step;
    nodes.forEach((nd, i) => {
      const y = nodes.length === 1 ? 300 : 250 + i * 100;
      const r = nowStep ? 34 : 24;
      const chosen = doneStep && run.path[s] === nd.kind;
      c.save();
      c.globalAlpha = doneStep ? (chosen ? 0.75 : 0.2) : nowStep ? 1 : 0.55;
      if (nowStep) { c.shadowColor = '#ffd166'; c.shadowBlur = 16 + Math.sin(t * 4 + i) * 6; }
      c.beginPath(); c.arc(x, y, r, 0, TAU);
      inked(c, nodeCol(nd.kind), 3.5, C.ink);
      c.restore();
      drawNodeIcon(c, nd.kind, x, y, r * 0.9, t);
      if (nowStep) {
        txt(c, nodeName(nd.kind).toUpperCase(), x, y + r + 18, 14, '#eaf6ff', 'center', 't');
        hit('node', x - r - 8, y - r - 8, r * 2 + 16, r * 2 + 16, i);
      }
    });
  }
  drawHud(c, t);
  if (run.log.length) txt(c, run.log[run.log.length - 1], MID, VH - 40, 15, '#9fb6d6', 'center', 't');
}
const nodeCol = (k) => ({ fight: '#7fb2e8', elite: '#e08a8a', boss: '#ff9a3c', shop: '#ffd166', camp: '#8fe0a0', cache: '#c9a6ff' }[k] || '#fff');
const nodeName = (k) => ({ fight: 'skirmish', elite: 'pack', boss: 'the beast', shop: 'trader', camp: 'camp', cache: 'cache' }[k] || k);
function drawNodeIcon(c, kind, x, y, s, t) {
  c.save(); c.translate(x, y); c.lineJoin = 'round';
  c.strokeStyle = C.ink; c.lineWidth = Math.max(2.5, s * 0.14); c.lineCap = 'round';
  if (kind === 'fight' || kind === 'elite' || kind === 'boss') {
    c.beginPath(); c.moveTo(-s * 0.4, s * 0.4); c.lineTo(s * 0.35, -s * 0.35); c.stroke();
    c.beginPath(); c.moveTo(s * 0.4, s * 0.4); c.lineTo(-s * 0.35, -s * 0.35); c.stroke();
    if (kind !== 'fight') { c.beginPath(); c.arc(0, 0, s * 0.16, 0, TAU); c.fillStyle = C.ink; c.fill(); }
  } else if (kind === 'shop') {
    c.beginPath(); rr(c, -s * 0.42, -s * 0.2, s * 0.84, s * 0.55, 4); c.stroke();
    c.beginPath(); c.moveTo(-s * 0.5, -s * 0.2); c.lineTo(0, -s * 0.55); c.lineTo(s * 0.5, -s * 0.2); c.stroke();
  } else if (kind === 'camp') {
    c.beginPath(); c.moveTo(-s * 0.42, s * 0.34); c.lineTo(s * 0.42, -s * 0.2); c.stroke();
    c.beginPath(); c.moveTo(s * 0.42, s * 0.34); c.lineTo(-s * 0.42, -s * 0.2); c.stroke();
    c.beginPath();
    c.moveTo(0, -s * 0.5);
    c.quadraticCurveTo(s * 0.3, -s * 0.1, 0, s * 0.16);
    c.quadraticCurveTo(-s * 0.3, -s * 0.1, 0, -s * 0.5);
    c.fillStyle = '#ff9a3c'; c.fill(); c.stroke();
  } else if (kind === 'cache') {
    c.beginPath(); rr(c, -s * 0.42, -s * 0.24, s * 0.84, s * 0.6, 5); c.stroke();
    c.beginPath(); c.moveTo(0, -s * 0.24); c.lineTo(0, s * 0.36); c.stroke();
  }
  c.restore();
}

function openChooser(title, items, onPick, opts) {
  UI.choose = Object.assign({ title, items, onPick, sub: '' }, opts || {});
}
function drawChooser(c, t) {
  const ch = UI.choose;
  if (!ch) return;
  c.save(); c.fillStyle = 'rgba(6,10,20,.82)'; c.fillRect(0, 0, VW, VH); c.restore();
  txt(c, ch.title, MID, 74, 34, '#eaf6ff', 'center', 'd');
  if (ch.sub) txt(c, ch.sub, MID, 112, 15, '#9fc0e4', 'center', 't');
  const items = ch.items;
  const perRow = Math.min(items.length, 6);
  const cw = 132, chh = 176, gap = 16;
  const rows = Math.ceil(items.length / perRow);
  items.forEach((it, i) => {
    const r = Math.floor(i / perRow), col = i % perRow;
    const inRow = Math.min(perRow, items.length - r * perRow);
    const totalW = inRow * cw + (inRow - 1) * gap;
    const x = MID - totalW / 2 + col * (cw + gap);
    const y = 150 + r * (chh + 24) - (rows - 1) * 20;

function drawCharmCard(c, charmId, x, y, w, h, t) {
  const ch = CHARMS[charmId] || SCARS[charmId];
  panel(c, x, y, w, h, 13, '#f3e9d6', ch.col);
  c.beginPath(); rr(c, 5, 5, 0, 0, 0);
  txt(c, ch.name.toUpperCase(), x + w / 2, y + 22, 15, '#22160c', 'center', 't', 'rgba(255,255,255,.5)');
  c.save();
  c.translate(x + w / 2, y + h * 0.45);
  const pulse = 1 + Math.sin(t * 2.4) * 0.05;
  c.scale(pulse, pulse);
  c.beginPath();
  for (let i = 0; i < 6; i++) {
    const a = (i / 6) * TAU - Math.PI / 2;
    const r = i % 2 ? w * 0.14 : w * 0.26;
    const px = Math.cos(a) * r, py = Math.sin(a) * r;
    i ? c.lineTo(px, py) : c.moveTo(px, py);
  }
  c.closePath();
  inked(c, ch.col, 3, C.ink);
  c.restore();
  const lines = wrapText(c, ch.text, 12, w - 18);
  lines.forEach((ln, i) => txt(c, ln, x + w / 2, y + h - 40 + i * 14, 12, '#3a3020', 'center', 't', 0));
