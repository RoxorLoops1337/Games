    g.battle.rekindled = true;
    u.hp = 1;
    /* HEARTH'S FOURTH REWRITE, AND ITS FOURTH ZERO. The first three were
       resources — Spice on deploy, Spice kept up, a body saved — and the theory
       was that this is why they failed: Cold is 8 points clear and the only
       thing it does that nobody else does is take a foe's TURN.

       So the fourth was a turn: the warden that should have fallen stays up AND
       whatever felled it is Frozen 1. Measured at 840 runs an arm, Hearth read
       **38%** — the same 38% it read without it, against Cold's 46%.

       Which sharpens the hypothesis instead of confirming it. "Tempo beats
       resources" is not enough: Cold's Frost lands on the FRONT OF THE FIRST
       WAVE, turn one of every fight, before anything has happened. Everything
       Hearth has tried lands late — a body saved after it was nearly lost, a
       foe frozen after it already killed. **A turn taken at the end of a fight
       is worth about what a resource is worth: nothing.** The next attempt at
       this course has to move the timing, not the currency.

       Reverted rather than shipped, on the rule this file keeps: a mechanic that
       measures zero is not free. */
    fx.pop(u, 'THE FIRE HOLDS', '#ff9a5c');
    fx.burst(u, '#ff9a5c', 14);
    sfx('heal');
    logLine(g, u.name + ' should have fallen, and the fire held', '#ff9a5c');
    return;
  }
  u.alive = false;
  u.dead = 0.0001;
  fx.demise(u);
  sfx('die', u.deathKind);
  logLine(g, u.name + ' falls', u.side === 'p' ? '#ff9aa5' : '#ffe6a8');
  const b = stat(u, 'bounty');
  if (b > 0 && u.side === 'e' && g.run) { g.run.gold += b; fx.pop(u, '+' + b + ' scrip', C.gold); }
  /* A CLEAN KILL: taken down on the turn it was about to swing. It is counted
     and shown at the end of a run, and it is deliberately worth nothing else.

     Two payoffs were tried and both were removed. Scrip lifted the careless
     pilot's win rate by eight points and the careful pilot's by one, because
     gold compounds and a bounty on something that happens by accident is just
     an income raise. Paying in tempo instead — Swift on whoever landed it —
     did the same thing more quietly: both pilots ended level at 13%. A reward
     that a careless player collects at the same rate as a careful one is not a
     reward for skill, it is a difficulty setting, and this game already has
     those on the leader screen. */
  if (u.side === 'e' && g.run && u.cnt <= 1 && !u.boss) {
    g.run.clean = (g.run.clean || 0) + 1;
    fx.ring(u.px, u.py, '#8fffc4', 18);
  }
  // Kills inside one turn are counted together: clearing a board in a single
  // action is the play the whole game is pointed at, and it should pay.
  if (u.side === 'e' && g.battle) {
    // a starving pack eats its own losses
    if (g.battle.mod === 'starved') {
      const fed = pick(sideUnits(g, 'e').filter((f) => f !== u));
      if (fed) { fed.atk += 1; fx.pop(fed, '+1 ATTACK', '#ff8b7a'); }
    }
    g.battle.combo = (g.battle.combo || 0) + 1;
    bumpStat('kills', 1);
    if (g.run) g.run.kills = (g.run.kills || 0) + 1;
  }
  if (u.side === 'p' && !u.leader && g.run) {
    g.run.fellThisZone = (g.run.fellThisZone || 0) + 1;
    g.run.everFell = 1;                 // and the whole trek remembers it
  }
  if (u.kw.explode) neighbours(g, u).concat(foes(g, u).filter((f) => f.lane === u.lane)).forEach((n2) => hurt(g, n2, u.kw.explode, null));
  if (u.hooks.death) u.hooks.death(g, u, killer);
  for (const a of allies(g, u)) if (a.hooks.allyDeath) a.hooks.allyDeath(g, a, u);
  if (killer && killer.alive && killer.hooks.kill) killer.hooks.kill(g, killer, u);
  if (u.side === 'p' && u.card && !u.card.foe) u.card.fainted = true;
  checkOver(g);
}

/* A short account of what just happened, because a turn resolves faster than
   a player can watch six counters at once. */
function logLine(g, text, col) {
  const b = g.battle;
  if (!b) return;
  b.log = b.log || [];
  b.log.push({ text, col: col || '#c8dcf4', t: 0 });
  if (b.log.length > 6) b.log.shift();
}

/* ------------------------------------------------------------- triggering -- */

/* A trigger is the whole event: the card's ability fires AND it swings, and
   Frenzy repeats the pair. Nothing on a card ever happens because it was
   played — it happens because it triggered. */
/* Commit a foe to something specific, now, so the board can say it out loud
   before it happens. Only foes scheme — the player's intent is whatever they
   are about to do with their hand. */
function layPlot(g, u) {
  if (!u || !u.alive || u.side !== 'e' || u.plot || !u.scheme) return;
  const sc = SCHEMES[u.scheme];
  if (!sc) return;
  const p = sc.lay(g, u);
  if (!p) return;
  p.id = sc.id;
  u.plot = p;
  u.plotT = 1;
  sfx('scheme');
}

function triggerUnit(g, u) {
  if (!u || !u.alive) return;
  /* A scheme comes due before anything else the unit does, and it is checked
     against the board as it stands now, not as it stood when the scheme was
     laid. Everything the player did in between is the point. */
  const plot = u.plot;
  u.plot = null;
  if (plot) {
    const sc = SCHEMES[plot.id];
    const fired = sc && sc.fire(g, u, plot);
    /* THE LESSON A BEGINNER NEVER GETS.

       Denying schemes is the one habit the ablation has ever priced above
       noise, and the guide's hint for it clears the moment the red text
       resolves — denied OR landed. So a player who does not yet know the text
       is answerable watches it land, watches the hint disappear, and learns
       that red text is weather.

       This is the other half. A scheme that lands while the caravan is still
       in the first zone, and has never once been denied, says what would have
       taken it away — naming the action, for that scheme, on that turn. It
       fires at most twice in a run and never at all for somebody who denies
       one, which is the whole point: it cannot help a player who already
       knows. It is not a card and it is not priced against the card rule; the
       one test of that rule it has to pass is the fourth, and it does — it
       fires only AFTER the question has been failed, so it never answers a
       question the board is still asking. */
    if (fired && sc.missed && g.run && g.run.zone <= LESSON.zone && !(g.run.everDenied) &&
        (g.run.taught = (g.run.taught || 0) + 1) <= LESSON.times) {
      fx.toast('YOU COULD HAVE STOPPED THAT', sc.col);
      logLine(g, plot.label.toLowerCase() + ' landed — ' + sc.missed, sc.col);
    }
    if (!fired) {
      fx.pop(u, 'DENIED', '#8fffc4');
      fx.burst(u, '#8fffc4', 10);
      sfx('denied');
      logLine(g, plot.label.toLowerCase() + ' — denied', '#8fffc4');
      g.battle.denied = (g.battle.denied || 0) + 1;
      if (g.run) g.run.everDenied = 1;   // one denial and the lesson stops
      /* Banked Embers: a bet placed before the denial, paid after it. */
      if (g.battle.banked > 0) {
        g.battle.banked--;
        for (const a of sideUnits(g, 'p')) heal(g, a, 4);
        fx.toast('THE EMBERS CATCH', '#ff9a5c');
        logLine(g, 'the banked embers catch and the line warms', '#ff9a5c');
      }
    }
    // A scheme that IS the swing spends the whole trigger either way: read it
    // and take it away, and the foe has thrown its turn at empty snow.
    if (sc && sc.solo) { spend(u, 'spice'); spend(u, 'weak'); return; }
  }
  // Nothing in front of it? It goes looking. Clearing a lane buys you a turn
  // of quiet, not a foe that stands there for the rest of the fight.
  if (!laneOf(g, other(u.side), u.lane).length && shuffleToward(g, u)) return;
  // Vanguard is Frenzy that only happens where it is dangerous to stand.
  const times = 1 + (u.kw.frenzy || 0) + (u.kw.vanguard && u.col === 0 ? u.kw.vanguard : 0);
  for (let i = 0; i < times; i++) {
    if (!u.alive || g.battle.over) break;
    if (u.hooks.trigger) u.hooks.trigger(g, u);
    if (u.atk > 0) attackOnce(g, u);
  }
  // Spice and its sour twin are burned off by the whole chain, not per hit.
  spend(u, 'spice');
  spend(u, 'weak');
}

function attackOnce(g, u) {
  const primary = targetFor(g, u);
  if (!primary) { fx.pop(u, 'no target', C.snowDim); return; }
  const targets = u.kw.barrage ? laneTargets(g, u, primary.lane) : [primary];
  /* A swing hook reads the board AT THE MOMENT OF THE SWING rather than at
     deployment, which is what lets a card's worth change from turn to turn —
     the first of the four tests a card has to pass. */
  let dmg = u.atk + stat(u, 'spice') + (u.hooks.swing ? u.hooks.swing(g, u) : 0);
  // Crush reads the line it is swinging into: the more of them are stacked up
  // in that lane, the harder every one of them is hit.
  if (u.kw.crush) dmg += u.kw.crush * Math.max(0, laneTargets(g, u, primary.lane).length - 1);
  if (stat(u, 'weak') > 0) dmg = Math.floor(dmg / 2);
  fx.lunge(u, primary);
  sfx('swing');
  for (const t of targets.slice()) {
    if (!t.alive) continue;
    const dealt = hurt(g, t, dmg, u);
    logLine(g, u.name + ' hits ' + t.name + ' for ' + dealt, u.side === 'p' ? '#9fe0ff' : '#ffb0b0');
    if (u.kw.leech && dealt > 0) heal(g, u, dealt);
    if (u.alive && u.hooks.hit) u.hooks.hit(g, u, t);
    if (u.kw.shove && t.alive && dealt > 0) shoveUnit(g, t, 1);
    // Smackback answers a landed hit with half the defender's own attack.
    if (t.alive && t.kw.smack && dmg > 0) hurt(g, u, Math.max(1, Math.floor(t.atk / 2)), t);
  }
}

/* Push somebody along their own lane. If the slot behind is taken the two of
   them trade places instead, so a shove is never simply refused. */
function shoveUnit(g, u, dir) {
  if (!u || !u.alive) return false;
  const nc = clamp(u.col + dir, 0, COLS - 1);
  if (nc === u.col) return false;
  const there = unitAt(g, u.side, u.lane, nc);
  if (there) { there.col = u.col; there.moveT = 1; }
  u.col = nc;
  u.moveT = 1;
  fx.pop(u, dir > 0 ? 'SHOVED' : 'HAULED', C.snowDim);
  sfx('move');
  return true;
}

/* Walk into the lane where the fighting is, if there is a slot going. Costs
   the trigger — a unit that repositions does not also swing. */
function shuffleToward(g, u) {
  const s = other(u.side);
  let want = -1;
  for (let l = 0; l < LANES; l++) if (l !== u.lane && laneOf(g, s, l).length) { want = l; break; }
  if (want < 0) return false;
  for (let c = 0; c < COLS; c++) {
    if (slotFree(g, u.side, want, c)) {
      u.lane = want; u.col = c; u.moveT = 1;
      fx.pop(u, 'MOVES', C.snowDim);
      sfx('move');
      return true;
    }
  }
  return false;
}

/* Every counter movement in the game goes through here. A counter driven to
   zero by a card fires straight away — that is the combo engine, and it is
   also why Frost has to sit in front of it. */
function tickCounter(g, u, n, natural) {
  if (!u || !u.alive || n <= 0) return false;
  if (stat(u, 'frost') > 0) {
    if (natural) { spend(u, 'frost', 1); fx.pop(u, 'FROZEN', STATUS.frost.col); fx.burst(u, STATUS.frost.col, 8); }
    else fx.pop(u, 'FROZEN', STATUS.frost.col);
    return false;
  }
  let ticks = n;
  /* THE FRONT IS WHERE IT IS HAPPENING.

     Counters run down twice as fast in column one, on both sides of the table.

     Before this, an ablation of the careful pilot's fight habits priced every
     one of them: denying schemes was worth five points, keeping a slot one, and
     placement, gear timing and wave timing were worth nothing at all — the
     "careful" placement was actually NINE POINTS WORSE than filling the nearest
     free slot. That is what a board with no geometry looks like. Swings go to
     the front of a lane, stragglers walk toward the fighting, and so six slots
     behave like two.

     Depth now costs and pays: put your slow heavy hitter forward and it swings
     sooner and gets hit for it; keep the fragile one back and it is safe and
     late. Every deployment is that question, and so is every free move — which
     is the one action in the game that does not cost the turn. */
  if (natural) ticks += tickRate(u) - 1;
  if (natural) ticks += spend(u, 'swift');
  if (natural && stat(u, 'slow') > 0) { spend(u, 'slow', 1); fx.pop(u, 'SLOW', STATUS.slow.col); return false; }
  u.cnt = Math.max(0, u.cnt - ticks);
  u.tick = 0.75;
  maybeLay(g, u);
  if (u.cnt > 0) return false;
  u.cnt = u.cntMax;
  u.tick = 1;
  triggerUnit(g, u);
  maybeLay(g, u);              // and it starts telling you about the next one
  return true;
}
/* One tick out is where intent belongs: far enough ahead to answer, close
   enough that the answer is this turn's action rather than a vague worry.
   "One tick" means one TURN, not one point — a foe in the front row burns two a
   turn, so a two-counter foe standing there never sits on exactly 1 and would
   otherwise never telegraph anything at all. */
const tickRate = (u) => (u.col === 0 ? 2 : 1);
function maybeLay(g, u) {
  if (u.alive && u.cnt > 0 && u.cnt <= tickRate(u)) layPlot(g, u);
}

/* ------------------------------------------------------- the turn ------- */

/* One action per turn: play a card, ring the bell, or pass. Moving a warden
   already on the board is free and does not spend the turn. That single rule
   is what prices everything else in the game. */
function resolveTurn(g) {
  const b = g.battle;
  if (!b || b.over || b.busy) return;
  b.busy = true;
  b.turn++;
  fx.bell();
  payCombo(g);

  for (const u of turnOrder(g)) {
    beat(0.13, () => {
      if (!u.alive || b.over) return;
      tickCounter(g, u, 1, true);
    });
  }

  // Anything still in hand at the end of the turn has waited another turn.
  beat(0.01, () => {
    for (const c of b.hand) if (c.kw && c.kw.hoard) c.held = Math.min(HOARD_CAP, (c.held || 0) + 1);
  });

  /* THE LINE NEEDS ROOM.

     One rule with two faces, and the reason a board is not simply "deploy
     everything you draw". A side with a slot to spare can rotate, and warmth
     gets round the whole line; a side packed into every slot has nowhere to
     fall back to, and the cold finds somebody. It makes the question "should I
     put this down?" a question, which is what the fight was missing. */
  beat(0.16, () => {
    if (b.over) return;
    for (const side of ['p', 'e']) {
      const line = sideUnits(g, side);
      if (!line.length) continue;
      const room = hasRoom(g, side) && b.turn <= DEEP_FREEZE;
      if (room) {
        /* Warmth is one, for everybody, always.

           A Full Line was tried paying double on top of its crowdproofing and
           measured a 73% win rate against a 36% baseline; gated behind a board
           of five or more it still measured 61%. A course at those numbers is
           not a choice a player makes, it is the answer and the other four are
           decoration — so the doubling is gone and the course keeps the rule
           that made it interesting rather than the one that made it win. */
        const co2 = side === 'p' ? courseOf(g.run) : null;
        /* A course can raise the warmth, and can be made to raise it only on
           some turns. Hearth needs the second half: at warmth 2 every turn it
           measured 52% against a 36% baseline, and at nothing it measured 34.
           The dial between them is how often the fire burns high. */
        const warm = (co2 && co2.warmth) || 1;
        for (const u of line) addStatus(g, u, 'regen', warm, true);
        /* THE HEARTH ROAD, SIXTH ATTEMPT AND THE FIRST THAT LANDS — and it lands
           because the file's own oldest unfinished claim turned out to be wrong.

           Hearth had been rewritten five times, every one measuring zero: Spice
           on deploy, Spice kept up, a body saved at the moment of death, a foe's
           turn taken at that moment, the same body saved on turn one instead.
           Currency did not explain it and timing did not explain it. What was
           left was MAGNITUDE — every one of those is bounded to once a fight,
           while Cold's Frost hits the whole front of the first wave, every fight.

           And the note that had been blocking this said warmth has no dial:
           "regen is a threshold good — there is no setting between +0 and +17",
           measured from warmth 2 on the whole line. That is false. Three points
           on the dial, 420 runs an arm, against Hearth's 38%:

             +1 regen to the ONE most-hurt warden a turn    52%
             +1 to the two most hurt                        51%
             +1 to the whole line                           58%

           There IS a dial and it is steeply diminishing: the first warden buys
           +14 of the +20, and the other five buy +6 between them. Which is what
           a threshold good looks like when you finally sample below the
           threshold — the old claim was right about the shape and wrong that
           nothing lives underneath it.

           So Hearth gets the smallest setting that works. One warden, the one
           that needs it, every turn: unbounded like Cold's rule and small enough
           that it lands at 52% against Cold's 48 rather than running away. */
        /* A RESTED LINE MENDS, for the few fights the rest lasts. Same shape as
           Hearth's rule and deliberately so: it is the one payout on this board
           that has been measured to be worth anything, and the quiet road needed
           a lasting one rather than a bigger one-shot. */
        if (side === 'p' && g.run && g.run.rested > 0) {
          const tired = line.filter((u) => u.hp < u.maxHp)
            .sort((a, b) => (a.hp / a.maxHp) - (b.hp / b.maxHp))[0];
          if (tired) addStatus(g, tired, 'regen', 1, true);
        }
        /* THE SETTING BELOW ONE WAS BUILT, MEASURED AND REVERTED.

           "The first regen point buys +14 of the +20" was measured from +1, +2
           and the whole line — three points all at or above one point a turn.
           Underneath +1 there is no smaller amount (regen is an integer) but
           there is a smaller RATE: the same point, fired every other upkeep.
           Worth reaching for, because Hearth was nine points clear of four
           courses nobody could tell apart, and a favourite plus a shrug is not
           a field.

           At 600 runs an arm: every turn 53%, every 2nd 47%, every 3rd 47%.
           Six points at ±3.1 is 1.9σ against a two-question bar of 2.24 — it
           does NOT clear, and shipping a course change on a reading that does
           not clear is the mistake this file has corrected four times. So the
           rate dial is gone rather than left in at a default that changes
           nothing: a mechanic measuring zero is not free.

           What actually fixed the field was the other half — the PACK CAME UP.
           Scrap's thorns took it from 40% to 47% and Bodies' Shell 6 sits at
           46%, so the gap from Hearth to the next course is about three points
           rather than nine, without touching Hearth at all. */
        if (co2 && co2.emberline) {
          const hurt = line.filter((u) => u.hp < u.maxHp)
            .sort((a, b2) => (a.hp / a.maxHp) - (b2.hp / b2.maxHp))[0];
          if (hurt) addStatus(g, hurt, 'regen', 1, true);
        }
        if (side === 'p' && g.run) g.run.everRoom = 1;   // it has felt the warmth; the lesson is done
        /* Every turn was too much: the first cut of this measured 53% against a
           35% baseline while the other four sat at 38-44, which is the same
           mistake Cold made in the other direction. Every other turn. */
      } else if (isPacked(g, side) && b.turn <= DEEP_FREEZE) {
        const victim = pick(line.filter((u) => !u.leader).concat(line));
        if (victim) {
          addStatus(g, victim, 'frost', 1);
          /* A SECOND LESSON WAS BUILT HERE TWICE AND MEASURED AT ZERO TWICE,
             and the second time is the interesting one.

             The first cut measured zero and was blamed on the pilot expressing
             the habit badly — "do not fill the last slot" rather than the real
             rule, which is do not fill it unless the line is thin or something
             big is about to land. That blame was well founded: given the real
             rule, a careful pilot playing ONLY this habit gains five points, and
             the subtractive table had been calling it zero for four rounds.

             So the lesson was rebuilt with the right expression and measured
             again. Still exactly zero.

             The two numbers together are the finding. Keeping a slot back is a
             real habit and it is worth nothing to a beginner, because it only
             pays if the REST of your play is good enough to use the warmth.
             Denial is not like that: a denied scheme is a foe's wasted turn
             whoever you are, which is why it is worth eleven points to somebody
             who knows nothing else. A habit worth teaching has to pay on its
             own, and most do not. */
          if (side === 'p') logLine(g, 'no room to fall back — the cold gets into ' + victim.name, '#8fe3ff');
        }
      }
    }
  });

  /* THE COLD CLOSES IN.

     A fight that cannot end is worse than a fight that is lost. Two of them
     showed up when both lines could mend as fast as they were hit, and seven
     more the moment a warden could mend the whole line every trigger — and no
     amount of per-card tuning fixes a class of bug that any future healing card
     will reopen. So the world ends it: past thirty turns the warmth stops, and
     from there the frost takes a little more out of everything on the table
     every five turns, both sides alike, until somebody falls. */
  beat(0.14, () => {
    if (b.over || b.turn <= DEEP_FREEZE) return;
    const bite = 1 + Math.floor((b.turn - DEEP_FREEZE) / 5);
    if (b.turn === DEEP_FREEZE + 1) {
      fx.toast('THE COLD CLOSES IN', '#8fe3ff');
      logLine(g, 'the fire is out — the cold is taking the room', '#8fe3ff');
      sfx('freeze');
      fx.flash('#cfe4ff', 0.3);
      fx.shake(7);
    }
    for (const u of units(g).slice()) hurt(g, u, bite, null);
    checkOver(g);
  });

  /* End of turn: burns bite, mending mends, both fade. */
  beat(0.18, () => {
    if (b.over) return;
    for (const u of units(g).slice()) {
      const em = stat(u, 'ember');
      if (em > 0) { hurt(g, u, em, null); u.st.ember = Math.floor(em / 2); if (!u.st.ember) delete u.st.ember; }
      const rg = stat(u, 'regen');
      if (rg > 0) { heal(g, u, rg); u.st.regen = Math.floor(rg / 2); if (!u.st.regen) delete u.st.regen; }
    }
    checkOver(g);
  });

  beat(0.12, () => {
    if (b.over) return;
    if (b.waves && b.waves.length) {
      b.waveCnt--;
      /* THE SECOND TELEGRAPH.

         Six rounds of measurement said the fight is one decision, and the
         reason turned out to be structural: a scheme is the only thing on the
         table whose outcome depends on what you do in the window between it
         being announced and it happening. Everything else is arithmetic.

         So the wave gets a window too. One turn out it commits to a LANE and
         says so, and the lane is not decoration — a wave that finds a warden
         holding the front of the lane it named has to come in BEHIND, at the
         back column, where it is slow and reachable. Find it empty and it walks
         straight into the front, swinging on the fast clock.

         That is the same shape as a scheme: announced, answerable, and free to
         answer if you were already looking. Whether it makes placement a
         decision is what the additive table is for.

         WAVE_TELL exists for the probe alone. Comparing the ladder with the
         telegraph against a reading taken a round earlier compares two
         different builds; comparing it against the same build with one flag
         down compares the telegraph. Nothing in the game ever sets it. */
      if (WAVE_TELL.on && b.waveCnt === 1 && b.waves.length) {
        b.waveLane = Math.floor(rnd() * LANES);
        fx.toast('A WAVE COMES TO THE ' + (b.waveLane === 0 ? 'TOP' : 'LOWER') + ' LANE', '#ff9a3c');
        logLine(g, 'something is coming to the ' + (b.waveLane === 0 ? 'top' : 'lower') + ' lane', '#ff9a3c');
      }
      if (b.waveCnt <= 0) deployWave(g);
    }
  });

  beat(0.1, () => {
    b.busy = false;
    b.freeThisTurn = false;
    if (b.over) return;
    if (b.bell < bellNeed(g)) b.bell++;
    if (!b.hand.length && b.bell < bellNeed(g)) b.bell = bellNeed(g);  // never softlock an empty hand
  });
}

/* Settle up whatever the last action killed. Two in one turn is a combo, and
   it climbs from there. */
function payCombo(g) {
  const b = g.battle;
  const n = b.combo || 0;
  b.combo = 0;
  if (n < 2 || !g.run) return 0;
  const paid = n * 4 + (n >= 4 ? 12 : 0);
  g.run.gold += paid;
  b.bestCombo = Math.max(b.bestCombo || 0, n);
  bumpStat('bestCombo', n, 'max');
  g.run.bestTurn = Math.max(g.run.bestTurn || 0, n);
  checkUnlocks(g);
  fx.toast(n + ' IN ONE TURN   +' + paid, n >= 4 ? '#ff9a3c' : C.gold);
  logLine(g, n + ' in one turn, +' + paid + ' scrip', C.gold);
  fx.flash('#ffd9a0', 0.2 + n * 0.03);
  fx.shake(4 + n);
  sfx('combo');
  return paid;
}

/* The redraw bell: throws the hand away and deals a fresh one. Free once it
   has charged, otherwise it costs you the turn. */
function ringBell(g) {
  const b = g.battle;
  if (!b || b.over || b.busy) return false;
  const free = b.bell >= bellNeed(g);
  sfx('bell');
  while (b.hand.length) {
    const c = b.hand.pop();
    fx.fly(c, c.hx, c.hy);
    b.discard.push(c);
  }
  for (let i = 0; i < handSize(g); i++) if (!drawToHand(g)) break;
  b.bell = 0;
  b.rang = 1;
  if (!free) resolveTurn(g);
  return true;
}

function passTurn(g) {
  const b = g.battle;
  if (!b || b.over || b.busy) return false;
  resolveTurn(g);
  return true;
}

/* Repositioning is free — the whole tactical layer lives here. */
function moveUnit(g, u, lane, col) {
  const b = g.battle;
  if (!b || b.over || b.busy || !u || !u.alive || u.side !== 'p') return false;
  if (u.lane === lane && u.col === col) return false;
  const at = unitAt(g, 'p', lane, col);
  // remembered so a card can ask "have you moved this turn?", which is the only
  // way to charge for the free move that scheme denial also wants
  if (at) { at.lane = u.lane; at.col = u.col; at.moveT = 1; at.movedTurn = b.turn; }   // swap places
  u.lane = lane; u.col = col; u.moveT = 1; u.movedTurn = b.turn;
  sfx('move');
  return true;
}

function checkOver(g) {
  const b = g.battle;
  if (!b || b.over) return;
  // a beast that has fallen is remembered by name, for the bestiary feat
  for (const u of b.units) {
    if (u.boss && !u.alive && u.side === 'e') {
      G.meta.felled = G.meta.felled || {};
      G.meta.felled[u.def] = true;
    }
  }
  const leader = b.units.find((u) => u.side === 'p' && u.leader);
  if (leader && !leader.alive) {
    b.over = true; b.won = false;
    if (g.run) g.run.killedBy = leader.lastHitBy || g.run.killedBy || null;
    beat(0.6, () => endBattle(g, false));
    return;
  }
  if (enemyUnits(g).length) return;
  payCombo(g);
  // A cleared board with a wave still coming is not a win — it walks straight
  // on, which is what stops the fight going quiet.
  if (b.waves && b.waves.length) { beat(0.35, () => deployWave(g)); return; }
  b.over = true; b.won = true;
  beat(0.7, () => endBattle(g, true));
}

/* -------------------------------------------------------------- the hand -- */
const handSize = (g) => HAND + ((g.run && g.run.bonusHand) || 0);

function drawToHand(g) {
  const b = g.battle;
  if (b.hand.length >= handSize(g)) return null;
  if (!b.draw.length) {
    if (!b.discard.length) return null;
    b.draw = shuffle(b.discard.slice());
    b.discard.length = 0;
  }
  const c = b.draw.shift();
  c.handT = 0;
  c.held = 0;
  c.dealT = 0;              // it flies out of the deck rather than appearing
  b.hand.push(c);
  return c;
}

/* Can this card be played onto this spot? `spot` is {lane,col} for wardens,
   a unit for aimed gear. */
function canPlay(g, card, spot) {
  const b = g.battle;
  if (!b || b.over || b.busy) return false;
  if (card.type === 'unit') {
    if (!spot || spot.lane === undefined) return false;
    return slotFree(g, 'p', spot.lane, spot.col);
  }
  const tg = CARDS[card.def].target;
  if (tg === 'none') return true;
  if (!spot || !spot.uid || !spot.alive) return false;
  if (tg === 'ally') return spot.side === 'p';
  if (tg === 'enemy') return spot.side === 'e';
  return true;
}

/* Why a card cannot go where the finger is pointing. A refusal that says
   nothing reads as a bug; this is the sentence the board says back. */
function refusal(g, card, spot) {
  const b = g.battle;
  if (!b || b.over) return 'the fight is over';
  if (b.busy) return 'wait for the turn to finish';
  if (card.type === 'unit') {
    if (!spot || spot.lane === undefined) return 'drop a warden on an empty slot';
    if (!slotFree(g, 'p', spot.lane, spot.col)) return 'that slot is taken';
    return '';
  }
  const tg = CARDS[card.def].target;
  if (tg === 'none') return '';
  if (!spot || !spot.uid || !spot.alive) return 'this one needs a target';
  if (tg === 'ally' && spot.side !== 'p') return 'that is for your own side';
  if (tg === 'enemy' && spot.side !== 'e') return 'that is meant for a foe';
  return '';
}

function playCard(g, idx, spot) {
  const b = g.battle;
  const card = b.hand[idx];
  if (!card || !canPlay(g, card, spot)) return false;
  b.hand.splice(idx, 1);
  const d = CARDS[card.def];
  const co = courseOf(g.run);
  let free = false;
  if (card.type === 'unit') {
    const u = mkUnit(card, 'p', spot.lane, spot.col);
    u.born = 0.0001;
    b.units.push(u);
    sfx('place');
    fx.thump(u);
    for (const [k, n] of card.bonusDeploy) addStatus(g, u, k, n);
    if (d.hooks && d.hooks.deploy) d.hooks.deploy(g, u);
    if (co && co.deploy) co.deploy(g, u, co);
  } else {
    sfx('item');
    if (spot && spot.uid) fx.burst(spot, (d.art && d.art.col) || C.snow, 14);
    d.effect(g, spot, card);
    // The Scrap Trail: the first thing you reach into the pack for each fight
    // is on the house, which is a whole extra action in the turn that matters.
    /* ONE FREE PLAY A TURN, whatever grants it.

       Without the bound this is an infinite loop rather than a nice card: Old
       Map does not cost the turn and draws two, and under A Heavy Pack it goes
       back into the deck afterwards, so it comes round and round for ever. The
       probe found it as eleven runs in twenty-four that ended with no victory
       and no death — which is why a run that reaches neither is now an
       assertion and not a note. */
    if (!b.freeThisTurn) {
      if (d.freeAction) { free = true; }
      else if (co && co.freeItem && (b.usedFree || 0) < (co.freeN || 1)) { free = true; b.usedFree = (b.usedFree || 0) + 1; fx.toast('OFF THE PACK — FREE', co.col); }
      if (free) b.freeThisTurn = true;
    }
  }
  card.held = 0;
  fx.fly(card, card.hx, card.hy);
  // A Heavy Pack: gear comes back round rather than being used up, which is
  // what makes a small gear deck worth building instead of merely surviving.
  // and it comes straight back to the hand, so the choice is on the table every
  // turn: cool the boiler, or swing and let the heat climb
  if (d.recycles) b.hand.push(card);
  else if (co && co.recycle && card.type === 'item') b.draw.push(card);
  else b.discard.push(card);
  checkOver(g);
  if (!b.over && !free) resolveTurn(g);
  return true;
}

/* --------------------------------------------------------------- summons -- */
function summon(g, foeId, count) {
  for (let i = 0; i < (count || 1); i++) {
    const free = freeSlots(g, 'e');
    if (!free.length) return;
    const s = pick(free);
    const u = mkUnit(mkFoeCard(foeId, g.run ? foeScale(g.run) : 1), 'e', s.lane, s.col);
    u.born = 0.0001;
    g.battle.units.push(u);
    fx.thump(u);
  }
}

/* ------------------------------------------------------- starting a fight -- */
/* Steps in a zone: an opening fight, five forks, and the beast. */
const TRAIL_STEPS = 7;
function foeScale(run) {
  // Enemies grow with the trail, gently: the deck should outpace them if the
  // player picks well, and fall behind if they do not.
  /* THE FELL ANSWERS THE CARAVAN.

     A locked-deck arm on the probe — the same deck, played by both pilots, no
     drafting, no shopping — measured a win rate of about ZERO for every
     combination, weak or strong, careless or careful. That is a stronger
     statement than "the deck matters more than the fight": a caravan that does
     not GROW cannot cross the trail at all, whoever is holding it, so there was
     never a gap for skill to close.

     So the trail rises to meet the caravan. Part of the curve is the road —
     step and zone, as before — and part of it is how much the caravan is
     carrying. A lean line meets a lean winter and a fat one meets a hard
     winter, which means building a deck still pays (the fights it wins are
     bigger) but stops being the whole of whether the run is winnable. The
     coefficient is deliberately partial: it absorbs about half of a deck
     advantage, not all of it. */
  /* AND THE LAST ZONE ASKS MORE OF A CARAVAN THAT HAS SOMETHING TO ASK OF.

     The first attempt at this was a flat term on the road in the deep fell, and
     it did bring the ceiling down — from 41 to 37 — but it took the careless
     pilot from 8 points to 6 on the way, because every win a careless run has
     is a last-zone win, so a flat last-zone tax lands on exactly the runs that
     floor was protecting.

     So the deep fell asks more of the caravan rather than more of everybody. It
     reads what the line is carrying harder than the zones before it — but only
     upward, and only past a MARGIN. Reading the whole answer harder was the
     second attempt and it made the same mistake in a subtler place: a caravan
     that had merely scraped over the bar got treated like one built into a
     wall, and the careless pilot went from ten points to six again. Only the
     part of the reading past the margin is bitten, and it is bitten hard, so
     the curve is a hockey stick rather than a slope: a middling caravan meets
     the last zone it always did, and a finished one meets a winter that has
     been finishing too. */
  const road = 1 + run.step * 0.034 + run.zone * 0.125 + (run.zone >= 2 ? 0.05 : 0)
    + following(run) * FOLLOW_STEP;
  const answer = fellAnswer(run);
  const extra = run.zone >= 2 ? Math.max(0, answer - DEEP_MARGIN) * DEEP_BITE : 0;
  return road * (1 + answer * 0.5 + extra) * (run.foeMul || 1);
}

/* What the caravan is carrying, as a number the trail can read.

   This used to be the average over the whole deck, and four transcripts said
   plainly that it was the wrong number: across twenty-one steps, three of them
   ending at the beast, the reading never left 5.4–6.7 while the deck went from
   eight cards to twenty-one. An average cannot grow — every good card drafted
   is divided by one more card drafted — so the trail was answering a caravan
   that, as far as the arithmetic was concerned, never got any stronger. Worse
   than flat: it read BELOW the base for most of every run, so the trail spent
   the whole trip quietly discounting itself.

   The board fields six. So read the six the caravan would actually put down —
   its best line, leader included — and let the rest of the deck be what it is.
   That number climbs when a good card is drafted, climbs when one is tempered,
   and does not fall when a bad card is picked up. It is a caravan that grows. */
const LINE_SLOTS = 6;
function caravanPower(run) {
  const cards = run.deck.concat([run.leader]).filter((c) => c.type === 'unit' || c.atk > 0);
  if (!cards.length) return 0;
  const worth = cards.map((c) => c.atk + c.hp * 0.25).sort((a, b) => b - a);
  /* Divided by the SLOTS, not by how many are there to fill them. Every leader
     sets out with five bodies for six places, and dividing by what you have
     meant the sixth body a caravan ever drafted made it read WEAKER — a good
     average of five spoiled by a sixth that was merely fine. An empty slot on
     the board is a weakness, so it is one here too. */
  return worth.slice(0, LINE_SLOTS).reduce((n, w) => n + w, 0) / LINE_SLOTS;
}
/* Where the trail expects a caravan to be by the time it matters. A starting
   line reads 5.4–5.9, so a run sets out under the base and inside the mercy —
   the reading only goes positive once the caravan has genuinely been built,
   which is the point of measuring the line rather than averaging the deck. */
const POWER_BASE = 8.0;
/* And the bar the DEEP fell holds the same line to. It is lower on purpose: a
   caravan that reads level with the trail through two zones reads over it in
   the third, so the last zone is where being built starts to cost. */
const DEEP_BASE = 7.4;
/* How far over that bar a caravan must read before the deep fell starts asking
   more of it than the zones before did, and how steeply it then asks. */
const DEEP_MARGIN = 0.10, DEEP_BITE = 2.0;
/* How much harder the winter is for this caravan, as a fraction. Clamped both
   ways: a caravan that has fallen apart is never given a free run, and one that
   has been built into a wall never faces something unplayable. */
function fellAnswer(run) {
  /* The ceiling, once more, and this is the honest shape of it: a caravan that
     has been built up meets a winter that has been building too. The top of the
     clamp is what a finished caravan runs into, so that is the end that moves —
     the floor stays where it is, because a run that has fallen apart should
     still be playable rather than merely long. */
  const base = (run.zone || 0) >= 2 ? DEEP_BASE : POWER_BASE;
  /* The floor is deeper than it was, and it is the one lever in the game that
     touches ONLY caravans that never got built — a caravan reading over the bar
     never reaches it. Everything else this round asked more of the trail, and
     the pilot with no answer to any of it was the one paying for all of it. */
  return clamp((caravanPower(run) - base) / base, -0.33, 0.95);
}

/* ------------------------------------------------------ what follows you -- */
/* WALKING PAST A FIGHT USED TO BE FREE, AND IT WAS THE BEST LINE IN THE GAME.

   Two pilots, identical in every way except what they do at a fork with a
   fight on one side of it: the one that took every fight won 25% of the time,
   the one that walked past whatever it could won 38%. Thirteen points for
   declining to play. And the reason is not subtle — a fight costs health and
   risks the run and pays one card, while a camp, a rest, a cache and a shop
   cost nothing at all. The trail was a corridor of free rooms with optional
   danger in it.

   The first attempt at this taxed the difficulty curve instead: a caravan that
   had not been fighting lost its discount for being thin. It measured as
   nothing, for a reason worth writing down — the dodger's caravan was not thin.
   It arrived at 8.2 against the fighter's 7.4, because everything it walked
   towards INSTEAD of a fight also makes a caravan stronger. A rule aimed at
   weak caravans cannot catch a strong one.

   So: what you walk away from walks after you. It is counted, it is shown on
   the trail before the fork rather than after it, and a few are forgiven —
   ducking one bad pack when the line is hurt is a decision, and should stay
   one. Ducking everything is a choice to arrive at the beast with a pack at
   your back. */
/* It is a distance rather than a headcount, and it does not decay. Letting a
   won fight put a step back sounded right and measured as a gift to exactly the
   wrong pilot: the one that ducks everything still fights the forced openings
   and the beasts, which was enough to shake the whole thing off — the dodge
   went straight back to level. What it was supposed to protect, the pilot who
   skips a fork by accident rather than by plan, turned out not to need it: that
   pilot reads the same seven points with the rule biting and without it. */
const FOLLOW_NEAR = 2;     // how much closer a fight walked past lets them get
const FOLLOW_FREE = 6;     // and how close they may get before it costs anything
const FOLLOW_STEP = 0.05;  // then what each step past that adds to the road
/* And nothing has picked up your trail in the first zone. That is a grace for
   the opening rather than a rule with a reason — the careless pilot skips forks
   by accident, dies in zone one more than anywhere else, and was paying for a
   rule written about a pilot who ducks fights on purpose. The counter still
   accrues; it simply is not read until the caravan is past the first beast. */
const following = (run) =>
  ((run.zone || 0) < 1 ? 0 : Math.max(0, (run.followed || 0) - FOLLOW_FREE));

/* A pack is never just a bigger skirmish: it hunts a particular way, and the
   banner says which before the first bell. */
const ELITE_MODS = [
  { id: 'dark',    name: 'HUNTS IN THE DARK', text: 'every foe arrives behind Shell 2',
    each: (g, u) => addStatus(g, u, 'shell', 2) },
  { id: 'quick',   name: 'HUNTS AT A RUN',    text: 'every foe arrives with Swift 1',
    each: (g, u) => addStatus(g, u, 'swift', 1) },
  { id: 'thorned', name: 'HUNTS IN THE BRIAR', text: 'every foe arrives with Thorns 2',
    each: (g, u) => addStatus(g, u, 'thorns', 2) },
  { id: 'starved', name: 'HUNTS STARVING',    text: 'each one that falls feeds another' },
  { id: 'endless', name: 'HUNTS IN RELAYS',   text: 'one more wave than you were expecting' },
];
const eliteMod = (b) => (b && b.mod ? ELITE_MODS.find((m) => m.id === b.mod) : null);

/* An encounter is a list of WAVES. The first walks on at the bell; the rest
   arrive on their own counter, or early if the player rings for them —
   which is a real choice, because a wave pulled onto a board you have already
   set up dies faster than one that arrives while you are rebuilding. */
/* The turn past which the fire is out and the frost starts taking the room. */
const DEEP_FREEZE = 26;
const WAVE_GAP = 5;
/* THE LAST ZONE DOES NOT WAIT.

   Waves arrive a turn sooner on Hollow Peak. The ceiling wanted bringing down
   and foeScale was off the table, so this is the rule-shaped version: it costs
   a strong caravan the thing a strong caravan relies on — the turn or two of
   quiet between waves in which it rebuilds — without making any single foe
   harder to kill, and it leaves the first two zones exactly as they were. */
const waveGap = (g) => Math.max(2, WAVE_GAP + ((g.run && g.run.waveBonus) || 0)
  - ((g.run && g.run.zone >= ZONES.length - 1) ? 1 : 0));

/* Locked in per run so a reload does not reroll the beast you were beaten by. */
/* DEAD END — BOSS NORMALISATION, BUILT AND REVERTED IN ONE ROUND.

   A locked-deck arm said the trail decides 32.5% of how far a run gets, and that
   fixing the boss per zone took it to 13.9% — so "over half the trail is which
   beast you drew" and the fix was to draw the beast but scale its difficulty
   toward the zone's average. It was built. Three measurements killed it:

   1. THE STRENGTHS ARE ALREADY EQUAL. The normalisation factors come out at
      0.98 / 1.03, 0.93 / 1.08, 1.02 / 0.98 — the two beasts in a zone differ by
      under 8% on total stats. There was no numeric gap to close.
   2. AND SO ARE THE KILL RATES. Across 2,592 locked runs the two Long Shelf
      beasts kill 19.4% and 17.3% of all runs — a coin flip between two equally
      lethal things is not a difficulty roll.
   3. AND THE WHOLE FINDING WAS AN ARTEFACT OF THE CAGE. Re-run on REAL runs —
      drafting, shopping, tempering — the Weeper falls from 19.4% of deaths to
      4.7%, deaths move from 73% in zone 2 to 67% in zone 3, and the top killer
      is not a beast at all but the Frostwyrm at 24%.

   With normalisation on, the trail read 31.6% against 32.5% off: nothing, as the
   factors predicted. Reverted. The lesson is not about bosses — it is that a
   finding measured on a locked deck is a finding about locked decks, and this one
   was carried three rounds before anyone ran it on the real game. */
function zoneBoss(g, zi) {
  const zone = ZONES[clamp(zi, 0, ZONES.length - 1)];
  const list = zone.bosses || [zone.boss];
  const run = g.run;
  if (!run) return list[0];
  run.bosses = run.bosses || {};
  if (!run.bosses[zi]) run.bosses[zi] = list[Math.floor(mulberry((run.seed + zi * 7717) >>> 0)() * list.length)] || list[0];
  return run.bosses[zi];
}

function foePool(zone) {
  const tiers = zone.tiers;
  const pool = Object.values(FOES).filter((f) => !f.boss && tiers.indexOf(f.tier) >= 0);
  if (pool.length) return pool;
  return Object.values(FOES).filter((f) => !f.boss && f.tier <= Math.max.apply(null, tiers));
}
function frontFirstSpots() {
  const spots = [];
  for (let c = 0; c < COLS; c++) for (let l = 0; l < LANES; l++) spots.push({ lane: l, col: c });
  return spots;
}
/* DEAD END, KEPT AS A COMMENT BECAUSE THE NUMBER IS WORTH MORE THAN THE CODE.

   The trail decides 32.5% of how far a locked run gets and the deck 4.4%, so the
   trail is the biggest lever in the game. The obvious suspect was here: every
   foe in an encounter is `pick(src)`, an independent uniform draw from the
   zone's tiers, so a three-foe fight can roll three of the heaviest bodies in
   the pool or three of the lightest and nothing notices.

   So it was built — encounters drawn to a strength BUDGET, same mean, variance
   held inside 18% — and measured:

     budget off   trail 32.6% of the zone-reached variance
     budget on    trail 32.5%

   Nothing. Not a small effect, nothing. Which is the useful part, because it
   ruled out the whole class and pointed at the one that is NOT here: fixing the
   BOSS per zone instead of drawing it takes the trail from 32.5% to 13.9%.
   **Over half the trail's influence is which beast waits at the end of a zone**,
   one draw per zone rather than the hundreds of foe draws inside it.

   The code is reverted rather than shipped, on this file's own rule: a mechanic
   that measures zero on the thing it was built for is not free, it is a rule
   every future change has to reason around. Same verdict as SKILL.shelter, for
   the same reason. See DESIGN.md for what to do about the boss. */
function buildEncounter(g, kind) {
  const run = g.run;
  const zone = ZONES[clamp(run.zone, 0, ZONES.length - 1)];
  /* The first two skirmishes were already thinned to two foes and no
     reinforcements, and walking the guide in order showed that was not enough:
     by the sixth hint the player's only warden was dead and the leader was
     alone, in the fight the game teaches with. Count was never the problem —
     strength was. */
  const opening0 = run.zone === 0 && run.step < 2 ? (run.step === 0 ? 0.68 : 0.84) : 1;
  const scale = foeScale(run) * (kind === 'elite' ? 1.15 : 1) * opening0;
  const src = foePool(zone);
  const waves = [];

  if (kind === 'boss') {
    const guard = Object.values(FOES).filter((f) => !f.boss && f.tier <= zone.tiers[2]);
    // Which beast waits at the end of a zone is drawn per run, so the trail is
    // not the same trail twice.
    const bossId = zoneBoss(g, run.zone);
    // The first beast comes with one bodyguard; the later ones bring the pack.
    const first2 = [
      { id: bossId, lane: 0, col: 2, scale: 1 + run.zone * 0.05 },
      { id: pick(guard).id, lane: 0, col: 0, scale },
    ];
    if (run.zone > 0) first2.push({ id: pick(guard).id, lane: 1, col: 0, scale });
    waves.push(first2);
    waves.push([{ id: pick(guard).id, lane: 0, col: 1, scale }]);
    if (run.zone > 0) waves.push([{ id: pick(guard).id, lane: 1, col: 1, scale }]);
    return waves;
  }

  // One wave of reinforcements, two for a pack. A fight is meant to be won
  // and then survived, not outlasted.
  // The first two skirmishes of a run are deliberately gentle: a caravan that
  // has not drawn its second warden yet cannot answer a wave.
  const opening = run.zone === 0 && run.step < 2;
  const first = (opening ? 2 : kind === 'elite' ? 2 + (run.zone > 0 ? 1 : 0) : 2 + (run.step > 3 ? 1 : 0)) + (run.extraFoe || 0);
  const spots = frontFirstSpots();
  const openers = spots.slice(0, first).map((s) => ({ id: pick(src).id, lane: s.lane, col: s.col, scale }));
  /* AND THE VERY FIRST FIGHT ALWAYS HAS SOMETHING WITH A PLAN IN IT.

     Denying schemes is the most valuable habit in the fight — it has been at or
     near the top of the ablation for four rounds — and the guide now has a hint
     that teaches it. Which is worth nothing if the hint has nothing to point
     at: sampled across forty openings, only seventeen contained a foe with a
     scheme anywhere in them, so more than half of all new players met the rule
     for the first time in the second zone, having already lost to it once. */
  if (run.zone === 0 && run.step === 0 && !openers.some((e) => FOES[e.id] && FOES[e.id].scheme)) {
    const plotters = src.filter((f) => f.scheme);
    if (plotters.length) openers[openers.length - 1].id = pick(plotters).id;
  }
  waves.push(openers);
  const later = opening ? (run.step === 0 ? 0 : 1) : 1;   // one wave of reinforcements, always
  for (let w = 0; w < later; w++) {
    const n = kind === 'elite' ? 2 : 1 + (run.step > 4 ? 1 : 0);
    waves.push(new Array(n).fill(0).map(() => ({ id: pick(src).id, scale })));
  }
  return waves;
}

/* Bring the next wave on. Anything without a named slot takes whatever is
   free, front first; if the board is packed the wave waits a turn. */
function deployWave(g) {
  const b = g.battle;
  if (!b || !b.waves || !b.waves.length) return false;
  const wave = b.waves[0];
  const placed = [];
  /* Where the announced lane lands, and what meeting it is worth.

     ANYONE STANDING IN THE NAMED LANE HOLDS IT — front, middle or back. The
     first cut asked for the front slot specifically, and that read as a tax on
     a narrow pool rather than a decision: it was worth +8 to a run carrying no
     course at all and nothing to any of the five courses, because a course
     narrows what you draw and the front slot is the one every other card also
     wants. Widening it to the whole lane put the courses back above the open
     pool and cost the fight rung three points of the twenty-four.

     The other rejected cut let the wave in BEHIND the holder instead of turning
     it away, and it measured a disaster: the ladder fell from 34 points to 23
     and placement went from +1 to −1, because a wave committed to one lane
     concentrates the fell where a wave spread across free slots did not. Adding
     a mechanic to the foes' side buffs the foes — the same lesson a non-solo
     scheme taught two rounds ago.

     What makes a scheme worth denying is that the scheme IS the foe's turn. So
     a held lane does the same: the wave does not arrive at all, it waits. */
  const named = b.waveLane;
  const met = named !== undefined && laneHeldBy(g, named);
  if (met) {
    b.waveCnt = 1;
    b.waveLane = undefined;
    fx.toast('THE LANE WAS HELD', '#8fffc4');
    logLine(g, 'the wave found the lane held, and waited', '#8fffc4');
    b.laneHeld = (b.laneHeld || 0) + 1;
    return false;
  }
  for (const e of wave) {
    let lane = e.lane, col = e.col;
    if (named !== undefined && e.lane === undefined) { lane = named; col = 0; }
    if (lane === undefined || !slotFree(g, 'e', lane, col)) {
      const free = freeSlots(g, 'e').sort((a, x) => a.col - x.col || a.lane - x.lane);
      if (!free.length) break;
      lane = free[0].lane; col = free[0].col;
    }
    const u = mkUnit(mkFoeCard(e.id, e.scale), 'e', lane, col);
    u.born = 0.0001;
    b.units.push(u);
    const fd = FOES[e.id];
    if (fd.hooks && fd.hooks.deploy) fd.hooks.deploy(g, u);
    const co2 = courseOf(g.run);
    if (co2 && co2.arrive) co2.arrive(g, u);
    maybeLay(g, u);            // it walks on already telling you what it means
    const em = eliteMod(b);
    if (em && em.each) em.each(g, u);
    fx.thump(u);
    placed.push(u);
  }
  if (!placed.length) return false;
  b.waveLane = undefined;
  b.waves.shift();
  b.waveCnt = waveGap(g);
  b.waveNo = (b.waveNo || 1) + 1;
  if (b.units.length && b.turn > 0) {
    fx.shake(6); fx.flash('#ffb0b0', 0.18); sfx('wave');
    fx.toast('WAVE ' + b.waveNo, '#ff9a3c');
    logLine(g, 'wave ' + b.waveNo + ' arrives', '#ff9a3c');
  }
  return true;
}

/* Pull the next wave in early. Free, and often the strongest play on the
   board — a wave that lands on your terms is half a wave. */
function ringWave(g) {
  const b = g.battle;
  if (!b || b.over || b.busy || !b.waves || !b.waves.length) return false;
  sfx('bell');
  return deployWave(g);
}

function startBattle(g, kind) {
  const run = g.run;
  clearBeats();
  const b = {
    kind: kind || 'fight', turn: 0, units: [], hand: [], draw: [], discard: [],
    bell: run.bellCharged ? bellNeed(g) : 0, over: false, won: false, busy: false, t: 0,
    order: [],
  };
  g.battle = b;

  // The leader walks on first, into the back of the top lane. Nothing stops
  // the player moving it — repositioning is free.
  const lead = mkUnit(run.leader, 'p', 0, 2);
  lead.born = 0.0001;
  b.units.push(lead);
  const ld = CARDS[run.leader.def];
  if (ld.hooks && ld.hooks.deploy) ld.hooks.deploy(g, lead);
  for (const [k, n] of run.leader.bonusDeploy) addStatus(g, lead, k, n);

  if (kind === 'elite') b.mod = pick(ELITE_MODS).id;
  b.waves = buildEncounter(g, kind);
  if (b.mod === 'endless') b.waves.push([{ id: pick(foePool(ZONES[clamp(run.zone, 0, ZONES.length - 1)])).id, scale: foeScale(run) }]);
  b.waveNo = 0;
  b.waveCnt = waveGap(g);
  deployWave(g);

  // Sigil-marked wardens are already standing when the bell rings; they never
  // sit in the deck waiting to be drawn.
  for (const card of run.deck) {
    if (!card.sigil || card.type !== 'unit') continue;
    const free = freeSlots(g, 'p').sort((a, x) => a.col - x.col || a.lane - x.lane);
    if (!free.length) break;
    const u = mkUnit(card, 'p', free[0].lane, free[0].col);
    u.born = 0.0001;
    b.units.push(u);
    for (const [k, n] of card.bonusDeploy) addStatus(g, u, k, n);
    const cd = CARDS[card.def];
    if (cd.hooks && cd.hooks.deploy) cd.hooks.deploy(g, u);
  }
  b.draw = shuffle(run.deck.filter((c) => !c.leader && !c.sigil).slice());
  for (let i = 0; i < handSize(g); i++) if (!drawToHand(g)) break;
  /* Some rooms come with something in them. Only one so far, and it is in the
     HAND rather than the deck: shuffled in it turned up on four turns in ten,
     which is not an answer a player can count on, it is one they can hope for. */
  if (b.units.some((u) => u.side === 'e' && u.def === 'kettletitan') ||
      (b.waves || []).some((w) => w.some((e) => e.id === 'kettletitan'))) {
    b.hand.push(mkCard('snowhandful'));
  }
  const em0 = eliteMod(b);
  b.banner = { text: kind === 'boss' ? 'THE BEAST' : kind === 'elite' ? 'A PACK' : 'SKIRMISH',
    sub: em0 ? em0.name + ' — ' + em0.text : ZONES[clamp(run.zone, 0, ZONES.length - 1)].name, t: 0,
    col: kind === 'boss' ? '#ff9a3c' : kind === 'elite' ? '#ff8b7a' : '#9fe0ff' };
  g.screen = 'battle';
  drainAll();
  return b;
}

function endBattle(g, won) {
  const run = g.run;
  // Carry damage home: a warden that survived stays hurt, one that fainted
  // comes back whole but scarred.
  for (const u of g.battle.units) {
    if (u.side !== 'p' || !u.card) continue;
    if (u.alive) u.card.dmg = Math.max(0, u.maxHp - u.hp);
  }
  /* A warden that fell is Hurt — half its attack and half its health until it
     sees a fight through. One that came home standing shakes it off.

     AND ONE THAT FELL WHILE IT WAS ALREADY HURT KEEPS SOMETHING.

     The scar table has been in this file since the first week: three of them,
     applied by rebuildCard, removable at the trader for thirty scrip. Nothing
     in the game has ever handed one out. "TEND A HURT" was a button that could
     not do anything, on the counter for nineteen iterations, and the ware table
     found it by asking a pilot that was actually looking to buy it.

     This is the missing half rather than a new system: Hurt is the warning and
     a scar is what happens if you keep sending it back out anyway. It makes
     resting a decision, it gives the trader's thirtieth-scrip service a job,
     and it is escapable in three different ways — rest it, mend it, or pay her
     to take the scar off. */
  const patched = (courseOf(run) || {}).patched;
  for (const c of run.deck.concat([run.leader])) {
    if (c.fainted) {
      const again = c.injured && !patched;
      c.fainted = false;
      /* A WARDEN THAT FELL USED TO COME BACK WHOLE, and that one line was two
         thirds of all the mending in the game.

         Counted properly for the first time: 87% of every point of damage the
         caravan takes gets mended, and 67% of THAT is a fight ending — the
         fallen come back at nought damage, plus a beast's night's rest. Camps
         are 16%, the trader 15%, and warmth does not register at all. Which is
         why the line is 7% wounded at the forks where it is supposed to be
         deciding, why every rule ever written that pays in mending was dead on
         arrival, and why keeping a slot back for warmth has priced at nothing
         for five rounds: there was nothing for it to save you from.

         MAKING IT COST SOMETHING WAS TRIED AND MEASURED AND IS NOT HERE.
         A fallen warden coming back missing 35% of its health took the FIGHT's
         rung from +16 to +9 — it punishes a careful pilot, who fields more
         bodies for longer, harder than a careless one who was dying anyway —
         and moved the wound fraction at the forks from 8% to 10%, which is
         nothing. Raising warmth to 2 instead was worth seven points to the
         whole ladder and most of them to the TRADER's rung: a global buff, not
         a reason to keep a slot back.

         So the line still reads `c.dmg = 0` and the finding is that neither
         obvious lever moves the thing it was aimed at. What the ledger really
         says is that the biggest single entry is not healing at all — it is
         wardens being knocked out and returned, which is a different mechanic
         wearing mending's clothes. */
      c.dmg = 0;
      c.injured = !patched;
      if (patched) { run.log.push(c.name + ' went down, and was put back together.'); continue; }
      if (again && c.charms.filter((id) => SCARS[id]).length < SCAR_CAP) {
        const scar = SCARS[pick(Object.keys(SCARS))];
        c.charms.push(scar.id);
        rebuildCard(c);
        run.log.push(c.name + ' went down hurt, and came back ' + scar.name.toLowerCase() + '.');
        fx.toast(c.name.toUpperCase() + ' IS ' + scar.name.toUpperCase(), '#9aa8c4');
      } else {
        run.log.push(c.name + ' was hurt.');
      }
    } else if (won && c.injured) {
      c.injured = false;
      run.log.push(c.name + ' recovered.');
    }
  }
  if (!won) { g.screen = 'gameover'; G.meta.runs++; saveMeta(); saveRun(null); return; }
  if (g.battle.bestCombo >= 3) run.log.push('A ' + g.battle.bestCombo + '-kill turn.');
  /* THE BEAST'S NIGHT'S REST IS GONE, and it is the one thing out of four
     tried that made the fight matter more.

     Last round found that 65% of all the mending in this game is a fight
     ending, and one fix was tried and reverted. Four shapes were measured this
     round at 180 runs an arm (band ±3.0), all against a baseline where the
     fight's rung is +16 and the whole ladder is 30 points:

       warmth pays in Spice, not Regen     fight +10, ladder 22   worse
       the fallen keep half, lose Hurt     fight +10, ladder 39   different game
       only the FIRST loss is wiped        fight +11, ladder 30   no change
       no beast's night's rest             fight +19, ladder 34   THIS

     And the +19 did not survive: re-measured at 210 runs an arm it is +15 and
     the ladder is 32, identical to the baseline. Three points at ±3.0 is a
     direction and directions evaporate. It is kept anyway, and not for the
     number — it removes a five-point refund of attrition at every zone
     boundary and a constant with it, and it measures neutral. Simpler and level
     is reason enough; moving the fight's rung is not a claim this can make. */
  const mend = (run.mend || 0);
  if (mend) run.deck.concat([run.leader]).forEach((c) => { c.dmg = Math.max(0, c.dmg - mend); });

  run.fights = (run.fights || 0) + 1;
  run.gold += Math.round((g.battle.kind === 'boss' ? 55 : g.battle.kind === 'elite' ? 34 : 22) *
    (run.purse || 1) * (g.battle.mod ? 1.4 : 1));
  g.ui.reward = rollReward(g, g.battle.kind);
  g.screen = 'reward';
  sfx('win');
  saveRun(run);
}

/* ================================================ 7. the run layer ======= */

const STARTERS = {
  hearth: { leader: 'bramblewick', deck: ['cinderpup', 'cinderpup', 'kettlebeak', 'snowpup', 'emberflask', 'emberflask', 'stew', 'whetstone'] },
  frost:  { leader: 'vesper',      deck: ['rimefox', 'rimefox', 'chillfin', 'snowpup', 'icepick', 'icepick', 'gearshield', 'whetstone'] },
  scrap:  { leader: 'gundy',       deck: ['clunkbot', 'springjaw', 'scrapcrow', 'snowpup', 'blastcap', 'gearshield', 'bellrope', 'whetstone'] },
  wyrd:   { leader: 'stranger',    deck: ['rimefox', 'cinderpup', 'ratchet', 'snowpup', 'pryrod', 'whetstone', 'stew', 'icepick'] },
};

function genTrail(zoneIdx) {
  const steps = [];
  steps.push([{ kind: 'fight' }]);
  const pools = [
    ['fight', 'event'], ['fight', 'shop'], ['elite', 'rest'],
    ['camp', 'cache'], ['fight', zoneIdx > 0 ? 'shrine' : 'elite'],
  ];
  for (const p of pools) {
    const a = p[0], b2 = p[1];
    steps.push(rnd() < 0.5 ? [{ kind: a }, { kind: b2 }] : [{ kind: b2 }, { kind: a }]);
  }
  steps.push([{ kind: 'boss' }]);
  return steps;
}

function newRun(g, tribeId, seed, winters, course) {
  const sd = (seed === undefined ? Math.floor(Math.random() * 1e9) : seed) >>> 0;
  RNG = mulberry(sd || 1);
  UID = 1;
  const s = STARTERS[tribeId] || STARTERS.hearth;
  const run = {
    seed: sd, tribe: tribeId, zone: 0, step: 0, gold: 25, bonusRedraw: 0,
    course: course || null, redeals: 0, passed: 0,
    deck: [], leader: mkCard(s.leader), trail: genTrail(0), log: [], path: [],
    kills: 0, fights: 0, taken: 0, bestTurn: 0, clean: 0, node: null,
    bells: [], bonusHand: 0, bellCharged: false, waveBonus: 0,
    purse: 1, mend: 0, bosses: {},
  };
  for (const id of s.deck) run.deck.push(mkCard(id));
  run.winters = (winters || []).slice();
  run.winterPts = winterPts(run.winters);
  for (const id of run.winters) {
    const w = WINTERS.find((x) => x.id === id);
    if (w) w.apply(run);
  }
  g.run = run;
  g.battle = null;
  g.screen = 'trail';
  g.tut = G.meta.taught ? null : { i: 0, t: 0, over: false };
  G.meta.runs++;
  saveMeta();
  saveRun(run);
  return run;
}

function nodeAt(run) { return run.trail[run.step] || null; }

function enterNode(g, choiceIdx) {
  const run = g.run;
  const step = nodeAt(run);
  if (!step) return;
  const node = step[clamp(choiceIdx, 0, step.length - 1)];
  run.node = node.kind;
  run.path.push(node.kind);
  // A fork that had a fight on it, taken the other way, is a pack left behind.
  const isFight = (n) => n.kind === 'fight' || n.kind === 'elite' || n.kind === 'boss';
  if (step.length > 1 && step.some(isFight) && !isFight(node)) {
    run.followed = (run.followed || 0) + FOLLOW_NEAR;
    /* THE QUIET ROAD.

       Walking past a fight measured at SIXTEEN POINTS of win rate, which makes
       the fork a trap with a signpost rather than a decision — one side of it
       was always wrong. The follow rule punishes ducking and nothing had ever
       paid for it, so every reason to take the quiet road was a reason not to.

       So the quiet road gives the one thing a fight can never give: rest. A
       camp taken INSTEAD of a fight mends the whole line rather than six. That
       is worth everything when the caravan is hurt and nothing at all when it
       is not, which is the shape a decision has — and it is still paid for,
       in the card, the scrip, and the pack getting two steps closer. */
    run.quiet = 1;
    /* AND SOMETHING THAT LASTS, WHICH IS THE LESSON THE COURSES JUST COST EIGHT
       NULLS TO LEARN.

       Every quiet-road payout so far fires ONCE, at the moment you step on the
       node: the camp mends the line, the rest stop offers a fourth blessing,
       the shrine asks for nothing. That is the "lands late and rare" shape, and
       it is exactly what failed five times on Hearth and twice on Scrap before
       all three courses came off the floor the same way — a thing that fires ON
       THE BOARD, EVERY FIGHT, FROM TURN ONE.

       And the measurement says the one-shot version is not enough: five routing
       strategies were run against taking every fight and the best of them came
       in at MINUS ONE, so the fork has one right answer and the quiet nodes are
       underpaying however generous each single visit is.

       So the quiet road leaves the caravan RESTED for the next few fights, and
       a rested line mends its most-hurt warden every upkeep — the same shape as
       Hearth's `emberline`, which is the one payout on this board measured to be
       worth +14. Earned by walking rather than declared at the leader screen,
       and it decays, so it is a reason to duck NOW rather than a permanent
       upgrade.

       AND IT TURNS THE FORK INTO A DECISION, which one-shot payouts never did.
       Six pilots, 450 runs an arm, ducking-when-hurt against taking everything:

           rest lasts 0 fights (as it was)   ducking −3
           rest lasts 1 fight                ducking +3     ← ships
           rest lasts 2 fights               ducking +2
           rest lasts 4 fights               ducking +1

       The sign flips. Level is the target rather than better: a fork where one
       side always wins is furniture with a signpost, and a fork where the two
       sides are within a band is a question worth being asked. One fight is
       both the smallest setting and the best, so there is no runaway to guard
       against — longer rests are WORSE, because a rest that outlasts the
       trouble it was taken for stops being a reason to walk. */
    /* AND ONLY WHERE REST IS ACTUALLY TO BE HAD, which the first cut got wrong
       in a way the ladder made obvious.

       Granting the rest for any non-fight node opposite a fight paid the
       CARELESS pilot, which picks an arbitrary fork and therefore lands on
       quiet nodes about half the time without ever choosing one. Measured: with
       the rest off the ladder reads 8/26/39/42/54, with it on 12/29/45/51/54 —
       every rung lifted except the one that always fights and never banks it.
       That is a rule paying people who did not make the choice, which is the
       defect the quiet road had in reverse.

       A shop is not rest and neither is a cache. The rest comes from the places
       rest comes from, which is also the set the probe's ducking pilot steers
       for, so the thing being paid for and the thing being measured are finally
       the same thing. */
    if (node.kind === 'camp' || node.kind === 'rest' || node.kind === 'shrine') {
      run.rested = REST.fights;
    }
    if (following(run) > 0) {
      fx.toast('SOMETHING IS FOLLOWING', '#ff9aa5');
      run.log.push('A pack was left behind, and did not stay behind.');
    }
  }
  if (node.kind === 'fight' || node.kind === 'elite' || node.kind === 'boss') {
    run.quiet = 0;
    startBattle(g, node.kind);
  } else if (node.kind === 'shop') {
    g.ui.shop = rollShop(g);
    g.screen = 'shop';
  } else if (node.kind === 'camp') {
    g.ui.camp = { done: false };
    g.screen = 'camp';
  } else if (node.kind === 'rest') {
    /* THE QUIET ROAD, WIDENED — see the note at run.quiet.

       It paid at a camp only, and a camp opposite a fight on a step where the
       caravan happens to be hurt comes up once or twice in a whole crossing.
       Measured, the pilot that ducks only when hurt arrived with the SAME cards,
       the same meals and the same power as the one that ducks nothing: it was
       not exercising the choice at all. A rule that fires once a run is a rule
       nobody plays around.

       So every quiet place pays in what that place is FOR: the camp in rest,
       the rest stop in choice, the shrine in the blessing costing nothing. All
       three are things a fight cannot give, and none of them is scrip or a
       card, which is what a fight gives. */
    g.ui.rest = { offer: sample(BLESSINGS.map((x) => x.id), run.quiet ? 4 : 3) };
    if (run.quiet) run.log.push('The quiet road: more of the road ahead was visible from here.');
    run.quiet = 0;
    g.screen = 'rest';
  } else if (node.kind === 'shrine') {
    // on the quiet road the stone asks for nothing: the card is not left behind
    g.ui.shrine = { free: run.quiet ? 1 : 0 };
    if (run.quiet) run.log.push('The quiet road: the stone was warm, and asked for nothing.');
    run.quiet = 0;
    g.screen = 'shrine';
  } else if (node.kind === 'event') {
    g.ui.event = { def: EVENTS[Math.floor(rnd() * EVENTS.length)] };
    g.screen = 'event';
  } else if (node.kind === 'cache') {
    run.gold += 20;
    g.ui.reward = { cards: [], charms: sample(charmPool(), 3), gold: 20, kind: 'cache' };
    g.screen = 'reward';
  }
  saveRun(run);
}

/* Called when whatever the node was is finished with. */
function advance(g) {
  const run = g.run;
  /* The rest wears off one fight at a time — a reason to duck NOW rather than a
     permanent upgrade. Decremented when the fight FINISHES rather than when it
     starts, or a rest of one would be spent before the fight it paid for. */
  if (run.rested > 0 && (run.node === 'fight' || run.node === 'elite' || run.node === 'boss')) run.rested--;
  for (const f of breakSeals(run)) {
    fx.toast(f.name + ' — LOST', '#8fa2bd');
    run.log.push(f.name.toLowerCase() + ' is out of reach now.');
  }
  run.step++;
  if (run.step >= run.trail.length) {
    run.zone++;
    if (run.zone >= ZONES.length) {
      G.meta.wins++;
      bumpStat('wins', 1);
      run.freshFeats = checkFeats(run);
      G.meta.winter[run.tribe] = Math.max(G.meta.winter[run.tribe] || 0, run.winterPts || 0);
      if (!run.fellThisZone) bumpStat('flawless', 1);
      checkUnlocks(g);
      G.meta.best = Math.max(G.meta.best, 3);
      saveMeta(); saveRun(null);
      g.screen = 'victory';
      return;
    }
    // a zone crossed without losing anybody is the hardest thing to earn here
    if (!run.fellThisZone) { bumpStat('flawless', 1); run.log.push('A zone crossed with everybody standing.'); }
    run.fellThisZone = 0;
    bumpStat('zones', run.zone, 'max');
    G.meta.best = Math.max(G.meta.best, run.zone);
    checkUnlocks(g);
    run.step = 0;
    run.trail = genTrail(run.zone);
    saveMeta();
  }
  g.battle = null;
  g.screen = 'trail';
  saveRun(run);
}

/* ------------------------------------------------------------- rewards --- */
/* -- the course ----------------------------------------------------------- */
/* Three cards and take the best of them is a lottery, and it was the single
   biggest thing deciding a run — which meant a bad three was a bad run and the
   player never got a say. A course is the say: pay for it once and every offer
   for the rest of the trek leans your way, hard. It is bought with scrip,
   which is what finally gives scrip a job worth having. */
const COURSES = [
  /* Hearth has been rewritten twice. The first version was "Spice 2 on deploy",
     one extra point of damage per body for a whole run, and it measured 29%
     against a 29% baseline — worth nothing at all. The second kept them keen
     turn after turn, which was more damage and still damage.

     AND THE LAST COURSE STILL FAILING, FIXED THE ROUND AFTER SCRAP.

     Hearth read 34 against 40 for declaring no course at all — worse than not
     declaring, by two and a half standard deviations. The first thing to check
     was the pool lean rather than the rule, because Scrap's problem last round
     turned out to be neither of the things it looked like. The pool is 13
     hearth cards against 14 frost and 13 scrap: the lean is level, so it was
     the rule.

     And the rule was damage. Spice on deploy plus Spice every other turn is
     about one extra point per trigger, and damage is the cheapest currency in
     this game — the fight ablation prices denying a scheme and keeping room
     above hitting harder, every round, by a wide margin. Every other course
     changes what the fight IS; Hearth changed a number in it.

     So the hearth does what a hearth does, and the first attempt at that was
     double warmth: sustain rather than damage, the one thing no other course
     touches. It measured 52% against a 36% baseline, sixteen clear of declaring
     nothing and nine clear of the next course. Warmth scales with how many
     wardens are standing, so doubling it pays six points of mending a turn on a
     full line, and a rule with no ceiling cannot be tuned, only removed.

     The second attempt went the other way: once a fight, the first warden that
     should have fallen does not. Bounded by construction, unmistakably a

/* POOL_BAN exists for the probe alone and nothing in the game ever fills it.
   Fifty-eight cards had been priced only by "every card is played", which is a
   table about the POOL rather than about any card; taking one out of the offer
   and running whole trails without it is the only way to ask what a card is
   worth. Kept here rather than behind a flag in the probe because the pool is
   built here, and a copy of this filter in the test would drift. */
const POOL_BAN = new Set();
function cardPool(run) {
  return Object.values(CARDS).filter((c) =>
    !c.leader && !c.noPool && !POOL_BAN.has(c.id)
    && found(c.id) && (!c.tribe || c.tribe === run.tribe || rnd() < 0.5));
}
const charmPool = () => Object.keys(CHARMS).filter(found);
/* What the caravan is already doing, in numbers a weighting can read. */
function deckLeanings(run) {
  const tribes = {}, kws = {};
  for (const c of run.deck.concat([run.leader])) {
    const d = CARDS[c.def];
    if (!d) continue;
    if (d.tribe) tribes[d.tribe] = (tribes[d.tribe] || 0) + 1;
    for (const k of Object.keys(c.kw || {})) if (c.kw[k]) kws[k] = (kws[k] || 0) + 1;
    // what a card's text leaves behind counts as a leaning too
    for (const st of STATUS_ORDER) if ((d.text || '').toLowerCase().indexOf(st) >= 0) kws[st] = (kws[st] || 0) + 1;
  }
  return { tribes, kws, size: run.deck.length };
}

/* An offer that ignores the deck is three random cards; one that reads it is a
   direction you can steer. Rarity still sets the floor — a lean never turns a
   rare into a common — but a caravan already built around Frost will be shown
   Frost, and the thing it is short of. */
function weightedCards(run, n, courseSlot) {
  const pool = cardPool(run);
  const lean = deckLeanings(run);
  const course = courseOf(run);
  const units = run.deck.filter((c) => c.type === 'unit').length;
  const wantUnits = units < Math.max(3, Math.round(run.deck.length * 0.45));
  const bag = [];
  for (const c of pool) {
    let w = c.rare === 1 ? 5 : c.rare === 2 ? 3 : 1;
    if (c.tribe && lean.tribes[c.tribe]) w += Math.min(4, lean.tribes[c.tribe]);
    for (const k of Object.keys(c.kw || {})) if (lean.kws[k]) w += 1;
    for (const st of STATUS_ORDER) {
      if (lean.kws[st] && (c.text || '').toLowerCase().indexOf(st) >= 0) w += 2;
    }
    // and it will not let a caravan starve for bodies or drown in them
    if (c.type === 'unit') w += wantUnits ? 3 : -2;
    else w += wantUnits ? -1 : 2;
    w = Math.max(1, w);
    for (let i = 0; i < w; i++) bag.push(c.id);
  }
  const out = [];
  /* A course ADDS a card to the offer; it never replaces one.

     Two other shapes were tried and measured, and both were worse than having
     no course at all. Weighting the whole pool six-to-one drowned out its own
     safety net — the one that makes sure a caravan short of bodies is shown
     bodies — so a player who had paid for a direction got starved of what
     they needed. Guaranteeing one of the three was the same fault, smaller:
     the pool already leans toward what the deck is doing, and spending one of
     three slots on a blunter lean is a downgrade. So the course buys a fourth
     card instead. It cannot make an offer worse, which is the least a thing
     you paid scrip for should manage. */
  if (courseSlot && course) {
    const mine = bag.filter((id) => course.match(CARDS[id]));
    if (mine.length) out.push(pick(mine));
  }
  let guard = 0;
  while (out.length < n && guard++ < 400) {
    const id = pick(bag);
    if (out.indexOf(id) < 0) out.push(id);
  }
  return out;
}
/* -- what the caravan is short of ----------------------------------------- */
/* The last zone is a check on the deck, not on the play — the probe says so

const READS = [
  { k: 'bodies', name: 'BODIES', why: 'take a warden',

    want: (z) => 4 + z * 2 },

    want: (z) => (z >= 1 ? 1 : 0) },
  { k: 'lean', name: 'A LEAN DECK', why: 'burn something — a small deck draws what it needs',

/* The biggest number a piece of gear puts on one target, read out of the same
   preview table the card text comes from — so this cannot drift from what the
   card actually does. */
/* AND DAMAGE THAT ARRIVES LATE IS STILL DAMAGE.

   Running the careless transcript across all four leaders turned up one that is
   not like the others: Hearth is told it is SHORT OF A HARD HIT on the first
   step of a first run, and the other three are told they want for nothing. It
   is not short of one. Its hard hit is Ember Flask — four points of burn, the
   most damage any starting card in the game does to one target — and this
   function only counted the number in the `dmg` column, so a card whose whole
   output is a status read as zero.

function hitOf(card) {

  if (!f) return 0;
  try {
    const fake = { uid: -1, side: 'e', lane: 0, col: 0, alive: true, hp: 99, maxHp: 99, atk: 3, cnt: 2, st: {}, kw: {} };
    return (f({ battle: { units: [fake] } }, fake, card) || []).reduce((n, x) => {
      let v = x.dmg || 0;
      const m = x.tag && x.tag.match(/(EMBER|SPICE)\s*(\d+)/);
      if (m && x.u && x.u.side === 'e') v += Number(m[2]);
      return Math.max(n, v);
    }, 0);
  } catch (e) { return 0; }
}
function caravanRead(run) {
  const z = run.zone;
  return READS.map((r) => {
    const got = r.got(run), want = r.want(z);
    return { k: r.k, name: r.name, why: r.why, got, want, ok: got >= want };

}
/* The single most useful sentence: what the caravan is furthest short of. */
function caravanNeeds(run) {
  const short = caravanRead(run).filter((r) => !r.ok)
    .sort((a, b) => (a.got / a.want) - (b.got / b.want));
  return short.length ? short[0] : null;
}

/* THE COUNTER USED TO RUN DRY.

   worth buying. The bell is one per shop. Tempering is capped at three for the

   caravan cleared her out by the second zone and then carried a fat purse to
   the beast, where scrip does nothing at all.

   So there is one thing she will sell you as many times as you can pay for it,

const MEAL_BASE = 34, MEAL_STEP = 26;

   play ever reaches, purely so the degenerate case has a floor to hit. */
