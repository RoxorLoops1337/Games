<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Midnight Mog</title>
<meta name="description" content="Cats defend a neon rooftop city. Tower defense, deck builder, town builder and an endless loot loop, all drawn by code.">
<meta name="theme-color" content="#0b0716">
<meta name="color-scheme" content="dark">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%230b0716'/%3E%3Cpath d='M5 26V12l5 5 6-9 6 9 5-5v14z' fill='%23ff2e88'/%3E%3Ccircle cx='12' cy='19' r='2' fill='%23b6ff2e'/%3E%3Ccircle cx='20' cy='19' r='2' fill='%23b6ff2e'/%3E%3C/svg%3E">
<style>
  html,body{margin:0;height:100%;background:#0b0716;overflow:hidden;overscroll-behavior:none;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
  #game{display:block;width:100%;height:100%;touch-action:none;outline:none}
  #boot{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;color:#f4ecff;font:800 22px/1 "Impact","Arial Narrow Bold",sans-serif;letter-spacing:.12em;text-transform:uppercase;background:#0b0716;z-index:2}
  #boot i{display:block;width:120px;height:4px;background:#21123d;overflow:hidden;position:relative}
  #boot i::after{content:"";position:absolute;inset:0;width:40%;background:#19e6ff;animation:bar 1s ease-in-out infinite}
  #boot small{font:600 13px/1.4 "Trebuchet MS",sans-serif;letter-spacing:0;text-transform:none;color:#b9a9d6;max-width:300px;text-align:center}
  @keyframes bar{0%{transform:translateX(-100%)}100%{transform:translateX(300%)}}
  @media (prefers-reduced-motion:reduce){#boot i::after{animation:none;width:100%}}
</style>
</head>
<body>
<canvas id="game" tabindex="0" aria-label="Midnight Mog game canvas"></canvas>
<div id="boot" role="status"><span>Midnight Mog</span><i></i><small id="bootmsg">Warming up the neon...</small></div>
<noscript><div style="position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#0b0716;color:#f4ecff;font:16px sans-serif;z-index:3;text-align:center;padding:24px">Midnight Mog needs JavaScript. The cats are very sorry.</div></noscript>
<script>
  // If the game module has not started after a few seconds (old browser, blocked script), say so instead of a blank page.
  setTimeout(function () {
    if (window.__mogReady) return;
    var m = document.getElementById('bootmsg');
    if (m) m.textContent = window.__mogBootError ? 'Something went wrong starting the game. Reload the page; your save is safe.' : 'Still loading. If nothing happens, your browser may be too old for modules. Try a recent Chrome, Safari or Firefox.';
  }, 6000);
</script>
<script type="module" src="js/main.js"></script>
</body>
</html>
