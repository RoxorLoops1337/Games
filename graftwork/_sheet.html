<!doctype html><body style="margin:0;background:#1a1614"><canvas id="c" width="1280" height="720"></canvas>
<script type="module">
import { ENEMY_LIST } from './data/index.js';
import { drawEnemy } from './art/enemies.js';
import { drawHero } from './art/heroes.js';
const q = new URLSearchParams(location.search);
const ids = (q.get('ids')||'').split(',').filter(Boolean);
const hp = parseFloat(q.get('hp')||'1');
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const list = ids.map(i=>ENEMY_LIST.find(e=>e.id===i)).filter(Boolean);
window.go = (t) => {
  ctx.fillStyle='#2a221d'; ctx.fillRect(0,0,1280,720);
  const cols = Math.min(5, ids.length), rows = Math.ceil(ids.length/cols), cw = 1280/cols, ch = 720/rows;
  list.forEach((e,i)=>{ const x=(i%cols)*cw+cw/2, y=Math.floor(i/cols)*ch+ch-24;
    const sc = Math.min(1, (ch-50)/ 250);
    drawEnemy(ctx, e, x, y, {scale: sc*1.0, t, hpFrac: hp, flip:false});
    ctx.fillStyle='#ddd'; ctx.font='12px sans-serif'; ctx.fillText(e.id, x-cw/2+8, y-ch+40);
  });
  if (q.get('heroes')) ['marrow','wick','odile'].forEach((h,i)=>drawHero(ctx,h,240+i*400,640,{t, lowHp: hp<0.4}));
};
window.ready = true;
</script>
