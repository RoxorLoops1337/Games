<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Graftwork Ward Kit Lab</title>
<style>
  :root { --bg:#120d0a; --panel:#1d1510; --panel2:#2a1e16; --line:#4a3624; --brass:#c9a227; --ink:#eadfc6; --dim:#a8977a; --red:#b9473c; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--ink); font:13px/1.35 Georgia, 'Times New Roman', serif; overflow:hidden; }
  body { display:flex; flex-direction:column; height:100dvh; }
  header { display:flex; align-items:center; gap:8px; padding:6px 10px; background:var(--panel); border-bottom:1px solid var(--line); flex:none; }
  header h1 { margin:0; font-size:15px; letter-spacing:.04em; color:var(--brass); white-space:nowrap; font-weight:normal; }
  nav { display:flex; gap:6px; overflow-x:auto; flex:1; scrollbar-width:none; }
  nav::-webkit-scrollbar { display:none; }
  button, select { font:inherit; color:var(--ink); background:var(--panel2); border:1px solid var(--line); border-radius:6px; padding:5px 10px; min-height:32px; cursor:pointer; white-space:nowrap; }
  button:hover { border-color:var(--brass); }
  button.on { background:#5a4118; border-color:var(--brass); color:#fff3d0; }
  main { position:relative; flex:1; min-height:0; }
  canvas { position:absolute; inset:0; width:100%; height:100%; touch-action:none; display:block; cursor:grab; }
  canvas.drag { cursor:grabbing; }
  #note { position:absolute; top:8px; right:8px; width:min(330px, 44vw); max-height:calc(100% - 16px); overflow:auto; background:rgba(29,21,16,.92); border:1px solid var(--line); border-radius:8px; padding:10px 12px; font-size:12.5px; }
  #note.hidden { display:none; }
  #note h2 { margin:0 0 4px; font-size:14px; color:var(--brass); font-weight:normal; }
  #note p { margin:0 0 8px; color:var(--ink); }
  #note .judge { color:var(--dim); }
  #note .judge b { color:var(--ink); font-weight:normal; }
  .legend { display:grid; grid-template-columns:auto 1fr; gap:3px 8px; margin:6px 0; font-size:12px; color:var(--dim); }
  .sw { width:12px; height:12px; border-radius:2px; margin-top:3px; border:1px solid #0008; }
  #banner { position:absolute; left:8px; top:8px; max-width:min(520px, 70vw); background:#4a1712ee; border:1px solid var(--red); border-radius:8px; padding:8px 12px; font-size:12.5px; display:none; z-index:5; }
  #hint { position:absolute; left:8px; bottom:8px; color:var(--dim); font-size:11.5px; background:rgba(18,13,10,.7); padding:3px 8px; border-radius:6px; pointer-events:none; }
  #zoom { position:absolute; left:8px; top:8px; display:flex; flex-direction:column; gap:4px; }
  #zoom.pushed { top:auto; bottom:34px; }
  #zoom button { width:34px; padding:0; font-size:17px; }
  footer { flex:none; background:var(--panel); border-top:1px solid var(--line); padding:6px 10px; display:flex; flex-wrap:nowrap; gap:6px; align-items:center; overflow-x:auto; min-height:46px; scrollbar-width:thin; }
  footer .grp { display:flex; gap:6px; align-items:center; flex:none; padding-right:8px; margin-right:2px; border-right:1px solid var(--line); }
  footer .grp:last-child { border-right:0; }
  footer .lbl { color:var(--dim); font-size:12px; }
  footer img { width:38px; height:38px; object-fit:contain; display:block; }
  footer button.thumb { padding:2px; min-height:42px; min-width:42px; }
  input[type=range] { width:160px; accent-color:var(--brass); }
  @media (max-height:560px) {
    header { padding:3px 8px; } header h1 { font-size:13px; } button, select { min-height:30px; padding:3px 8px; font-size:12px; }
    footer { padding:3px 8px; min-height:42px; } footer img { width:32px; height:32px; } footer button.thumb { min-height:36px; min-width:36px; }
    #note { font-size:11.5px; width:min(290px, 42vw); padding:7px 9px; }
  }
</style>
</head>
<body>
<header>
  <h1>Ward Kit Lab</h1>
  <nav id="scenes"></nav>
  <button id="infoBtn" title="Notes and legend">Notes</button>
</header>
<main>
  <canvas id="cv"></canvas>
  <div id="banner"></div>
  <div id="zoom"><button id="zin" aria-label="Zoom in">+</button><button id="zout" aria-label="Zoom out">-</button><button id="zfit" aria-label="Recenter">C</button></div>
  <aside id="note"></aside>
  <div id="hint">wheel or pinch: zoom, drag: pan</div>
</main>
<footer id="bar"></footer>
<script type="module" src="rooms.js"></script>
</body>
</html>
