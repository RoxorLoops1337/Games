<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Graftwork Animation Lab</title>
<style>
  :root { --bg:#120d0a; --panel:#1d1510; --panel2:#2a1e16; --line:#4a3624; --brass:#c9a227; --ink:#eadfc6; --dim:#a8977a; --red:#b9473c; --green:#6fae6a; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--ink); font:13px/1.35 Georgia, 'Times New Roman', serif; overflow:hidden; }
  body { display:flex; flex-direction:column; height:100dvh; }
  header { display:flex; align-items:center; gap:8px; padding:6px 10px; background:var(--panel); border-bottom:1px solid var(--line); flex:none; }
  header h1 { margin:0; font-size:15px; letter-spacing:.04em; color:var(--brass); white-space:nowrap; font-weight:normal; }
  nav { display:flex; gap:6px; overflow-x:auto; flex:1; scrollbar-width:none; }
  nav::-webkit-scrollbar { display:none; }
  button, select { font:inherit; color:var(--ink); background:var(--panel2); border:1px solid var(--line); border-radius:6px; padding:5px 10px; min-height:32px; cursor:pointer; white-space:nowrap; }
  button:hover { border-color:var(--brass); }
  button.on { background:#5a4118; border-color:var(--brass); color:#fff3d0; }
  button:disabled { opacity:.45; cursor:default; }
  select { max-width:100%; }
  .body { flex:1; min-height:0; display:flex; }
  aside#ctl { flex:none; width:236px; overflow-y:auto; background:var(--panel); border-right:1px solid var(--line); padding:8px 9px 14px; scrollbar-width:thin; }
  aside#ctl.hidden { display:none; }
  #ctl details { margin:0 0 8px; background:rgba(0,0,0,.18); border:1px solid var(--line); border-radius:7px; padding:6px 8px; }
  #ctl summary { cursor:pointer; color:var(--brass); font-size:13px; }
  #ctl details p { margin:6px 0 2px; color:var(--ink); font-size:12.2px; }
  #ctl details p.judge { color:var(--dim); }
  .grp { margin:0 0 9px; }
  .grp > .lbl { display:block; color:var(--dim); font-size:11.5px; letter-spacing:.05em; text-transform:uppercase; margin:0 0 3px; }
  .row { display:flex; flex-wrap:wrap; gap:4px; align-items:center; }
  .row > button { flex:1 1 auto; padding:4px 7px; font-size:12.5px; }
  .row > select { flex:1 1 100%; }
  .rng { display:grid; grid-template-columns:70px 1fr 40px; gap:6px; align-items:center; margin:2px 0; font-size:12px; color:var(--dim); }
  .rng output { color:var(--ink); text-align:right; font-variant-numeric:tabular-nums; }
  input[type=range] { width:100%; accent-color:var(--brass); min-width:0; }
  main { position:relative; flex:1; min-width:0; display:flex; flex-direction:column; }
  #stage { position:relative; flex:1; min-height:0; }
  canvas#cv { position:absolute; inset:0; width:100%; height:100%; touch-action:none; display:block; }
  #banner { position:absolute; left:8px; top:8px; right:8px; max-width:560px; background:#4a1712ee; border:1px solid var(--red); border-radius:8px; padding:8px 12px; font-size:12.5px; display:none; z-index:6; }
  #read { position:absolute; left:8px; top:8px; background:rgba(18,13,10,.78); border:1px solid var(--line); border-radius:7px; padding:5px 9px; font:11.5px/1.45 ui-monospace, Menlo, Consolas, monospace; color:var(--ink); pointer-events:none; max-width:min(380px, 62%); z-index:3; }
  #read:empty { display:none; }
  #read .k { color:var(--dim); }
  #read .warn { color:#e0a050; }
  #read .bad { color:#e06a5a; }
  #read .good { color:var(--green); }
  #plant { position:absolute; right:10px; top:8px; display:none; gap:8px; align-items:center; background:rgba(18,13,10,.78); border:1px solid var(--line); border-radius:8px; padding:6px 10px; z-index:3; pointer-events:none; }
  #plant .pad { width:34px; height:34px; border-radius:50%; border:2px solid var(--line); display:flex; align-items:center; justify-content:center; color:var(--dim); font-size:15px; transition:background .05s, border-color .05s; }
  #plant .pad.lit { background:#7a5a1c; border-color:var(--brass); color:#fff3d0; }
  #plant .txt { font:11.5px/1.4 ui-monospace, Menlo, Consolas, monospace; color:var(--ink); }
  #hint { position:absolute; right:8px; bottom:6px; color:var(--dim); font-size:11px; background:rgba(18,13,10,.7); padding:2px 8px; border-radius:6px; pointer-events:none; z-index:3; }
  #strip { flex:none; height:106px; background:var(--panel); border-top:1px solid var(--line); display:flex; gap:6px; align-items:flex-start; padding:6px 8px; overflow-x:auto; overflow-y:hidden; scrollbar-width:thin; }
  #strip.none { display:none; }
  .th { flex:none; width:74px; text-align:center; border:2px solid var(--line); border-radius:7px; background:var(--panel2); padding:2px 2px 3px; cursor:pointer; }
  .th canvas { width:64px; height:64px; display:block; margin:0 auto; background:#0d0907; border-radius:4px; }
  .th .n { font-size:10.5px; color:var(--ink); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .th .d { font-size:10px; color:var(--dim); font-variant-numeric:tabular-nums; }
  .th.cur { border-color:var(--brass); background:#4a3516; }
  .th.cur .n { color:#fff3d0; }
  .th.gone canvas { opacity:.3; }
  .th.wide { width:96px; } .th.wide canvas { width:86px; }
  @media (max-height:560px) {
    header { padding:3px 8px; } header h1 { font-size:13px; } button, select { min-height:30px; padding:3px 8px; font-size:12px; }
    aside#ctl { width:206px; padding:6px 7px 10px; font-size:12px; }
    .rng { grid-template-columns:58px 1fr 36px; }
    #strip { height:92px; padding:4px 6px; } .th canvas { width:54px; height:54px; } .th { width:64px; } .th.wide { width:84px; } .th.wide canvas { width:74px; }
    #read { font-size:10.5px; padding:3px 7px; max-width:min(340px, 58%); }
  }
</style>
</head>
<body>
<header>
  <h1>Animation Lab</h1>
  <nav id="scenes"></nav>
  <button id="ctlBtn" title="Show or hide the controls">Controls</button>
</header>
<div class="body">
  <aside id="ctl"></aside>
  <main>
    <div id="stage">
      <canvas id="cv"></canvas>
      <div id="banner"></div>
      <div id="read"></div>
      <div id="plant"></div>
      <div id="hint"></div>
    </div>
    <div id="strip" class="none"></div>
  </main>
</div>
<script type="module" src="anim.js"></script>
</body>
</html>
