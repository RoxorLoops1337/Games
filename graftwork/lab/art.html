<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Graftwork Art Lab: painted UI parts</title>
<style>
  :root { --bg:#120d0a; --panel:#1d1510; --panel2:#2a1e16; --line:#4a3624; --brass:#c9a227; --ink:#eadfc6; --dim:#a8977a; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { margin:0; background:var(--bg); color:var(--ink); font:13px/1.4 Georgia, 'Times New Roman', serif; }
  header { position:sticky; top:0; z-index:5; display:flex; align-items:center; gap:8px; padding:6px 10px; padding-left:max(10px, env(safe-area-inset-left)); padding-right:max(10px, env(safe-area-inset-right)); background:var(--panel); border-bottom:1px solid var(--line); }
  header h1 { margin:0; font-size:15px; letter-spacing:.04em; color:var(--brass); white-space:nowrap; font-weight:normal; }
  nav { display:flex; gap:6px; overflow-x:auto; flex:1; scrollbar-width:none; }
  nav::-webkit-scrollbar { display:none; }
  button { font:inherit; color:var(--ink); background:var(--panel2); border:1px solid var(--line); border-radius:6px; padding:5px 10px; min-height:32px; cursor:pointer; white-space:nowrap; }
  button:hover { border-color:var(--brass); }
  button.on { background:#5a4118; border-color:var(--brass); color:#fff3d0; }
  #state { color:var(--dim); font-size:12px; white-space:nowrap; }
  main { max-width:1220px; margin:0 auto; padding:8px 10px 40px; padding-left:max(10px, env(safe-area-inset-left)); padding-right:max(10px, env(safe-area-inset-right)); }
  section { margin:0 0 14px; background:rgba(0,0,0,.2); border:1px solid var(--line); border-radius:8px; padding:6px 8px 8px; }
  section h2 { margin:0 0 2px; font-size:14px; font-weight:normal; color:var(--brass); letter-spacing:.03em; }
  section p { margin:0 0 6px; color:var(--dim); font-size:12px; }
  canvas { display:block; width:100%; height:auto; border-radius:6px; }
  @media (max-height:560px) { header { padding-top:3px; padding-bottom:3px; } header h1 { font-size:13px; } button { min-height:30px; padding:3px 8px; font-size:12px; } }
</style>
</head>
<body>
<header>
  <h1>Art Lab</h1>
  <nav id="jump"></nav>
  <button id="bg" title="The page behind the parts: dark slab or mid grey">Backdrop</button>
  <span id="state"></span>
</header>
<main id="main"></main>
<script type="module" src="art.js"></script>
</body>
</html>
