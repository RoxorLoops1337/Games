<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#1A1614">
<title>Graftwork</title>
<style>
  html,body{margin:0;height:100%;background:#0e0c0b;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
  canvas{position:absolute;display:block;image-rendering:auto;outline:none}
  #boot{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;color:#E8DCC4;font:20px Georgia,serif;letter-spacing:.1em}
  #rotate{display:none;position:fixed;inset:0;z-index:10;background:#0e0c0b;color:#E8DCC4;font:22px Georgia,serif;text-align:center;align-items:center;justify-content:center;flex-direction:column;padding:24px;line-height:1.4}
  #rotate b{display:block;font-size:56px;margin-bottom:12px;transform:rotate(90deg)}
  @media (orientation:portrait) and (max-width:700px){#rotate{display:flex}}
</style>
</head>
<body>
<div id="boot">Sterilizing instruments...</div>
<div id="rotate"><div><b>&#9647;</b>Turn your device sideways.<br><small style="opacity:.7;font-size:16px">Graftwork needs a landscape screen to be readable.</small></div></div>
<canvas id="cv" tabindex="0"></canvas>
<script type="module" src="main.js"></script>
</body>
</html>
