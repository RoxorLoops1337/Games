<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Drop the Bass Comic Pop-Art</title>
<style>
html,body{margin:0;height:100%;background:#14101a}
body{display:flex;align-items:center;justify-content:center;overflow:hidden}
canvas{display:block;width:min(100vw,calc(100vh*1080/1920));height:auto;aspect-ratio:1080/1920}
</style>
</head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<script>
'use strict';
/* Comic Pop-Art: black ink with variable line weight, Ben-Day halftone dots, flat CMYK colour,
   speech-bubble damage numbers, BAM POW onomatopoeia, newsprint grain, panel borders.
   Everything is procedural canvas code. No randomness except a seeded generator. */
const W = 1080, H = 1920, TAU = Math.PI * 2;
const cv = document.getElementById('c');
cv.width = W; cv.height = H;
let ctx = cv.getContext('2d');
const P = { ink: '#14101a', cream: '#f7edd0', yellow: '#ffd400', red: '#ee2a35', cyan: '#12a9e0', pink: '#ff5fb0',
  lime: '#9dff3a', orange: '#ff8a1f', purple: '#6a2fb0', magenta: '#ec1c82', skin: '#f9c9a0', skinJ: '#eaa77c' };
const FONT = '"Impact","Arial Black","DejaVu Sans",sans-serif';
const LV = ['', '#aab0bb', '#59d36b', '#3aa0ff', '#b45cff', '#ffc800'];

function rng(seed) { return function () { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const frac = v => v - Math.floor(v);

/* ---------- ink helpers ---------- */
function ink(p, fill, lw = 5, heavy = true) {
  if (fill) { ctx.fillStyle = fill; ctx.fill(p); }
  ctx.lineJoin = 'round'; ctx.lineCap = 'round'; ctx.strokeStyle = P.ink; ctx.lineWidth = lw;
  if (heavy) { ctx.save(); ctx.translate(lw * 0.3, lw * 0.4); ctx.stroke(p); ctx.restore(); }
  ctx.stroke(p);
}
function blob(p, fill, lw = 5) { // outline of a union of subpaths
  ctx.lineJoin = 'round'; ctx.strokeStyle = P.ink; ctx.lineWidth = lw * 2; ctx.stroke(p);
  ctx.fillStyle = fill; ctx.fill(p);
}
function rrect(x, y, w, h, r) { const p = new Path2D(); p.roundRect(x, y, w, h, r); return p; }
function circ(x, y, r) { const p = new Path2D(); p.arc(x, y, r, 0, TAU); return p; }
function ell(x, y, rx, ry, rot = 0) { const p = new Path2D(); p.ellipse(x, y, rx, ry, rot, 0, TAU); return p; }
function poly(pts) { const p = new Path2D(); pts.forEach((q, i) => i ? p.lineTo(q[0], q[1]) : p.moveTo(q[0], q[1])); p.closePath(); return p; }

function dots(cx, cy, w, h, sp, rmax, ang, color, fn) {
  const p = new Path2D(), ca = Math.cos(ang), sa = Math.sin(ang), R = Math.hypot(w, h) / 2, vs = sp * 0.866;
  for (let v = -R; v <= R; v += vs) {
    const row = Math.round(v / vs);
    for (let u = -R; u <= R; u += sp) {
      const uu = u + (row & 1 ? sp / 2 : 0), x = cx + uu * ca - v * sa, y = cy + uu * sa + v * ca;
      if (x < cx - w / 2 - rmax || x > cx + w / 2 + rmax || y < cy - h / 2 - rmax || y > cy + h / 2 + rmax) continue;
      const f = fn(x, y); if (f <= 0.05) continue;
      const r = rmax * Math.min(1, f); p.moveTo(x + r, y); p.arc(x, y, r, 0, TAU);
    }
  }
  ctx.fillStyle = color; ctx.fill(p);
}
function shade(p, cx, cy, rad, color, dir = 1, sp = 6, rmax = 2.6, start = 0.05) {
  ctx.save(); ctx.clip(p);
  dots(cx, cy, rad * 2, rad * 2, sp, rmax, 0.7, color, (x, y) => (dir * ((x - cx) * 0.7 + (y - cy) * 0.7) / rad - start) / 0.9);
  ctx.restore();
}
function flatdots(x, y, w, h, sp, r, color, ang = 0.6) { dots(x + w / 2, y + h / 2, w, h, sp, r, ang, color, () => 1); }

function txt(s, x, y, size, fill, o = {}) {
  ctx.save(); ctx.translate(x, y); if (o.rot) ctx.rotate(o.rot); if (o.skew) ctx.transform(1, 0, o.skew, 1, 0, 0);
  ctx.font = `bold ${size}px ${FONT}`; ctx.textAlign = o.align || 'center'; ctx.textBaseline = 'middle'; ctx.lineJoin = 'round';
  const lw = o.lw === undefined ? size * 0.2 : o.lw, mw = o.mw;
  const draw = (m, dx, dy) => { if (mw) m === 's' ? ctx.strokeText(s, dx, dy, mw) : ctx.fillText(s, dx, dy, mw); else m === 's' ? ctx.strokeText(s, dx, dy) : ctx.fillText(s, dx, dy); };
  if (o.drop) { ctx.strokeStyle = o.dropc || P.ink; ctx.fillStyle = o.dropc || P.ink; ctx.lineWidth = lw; draw('s', o.drop, o.drop); draw('f', o.drop, o.drop); }
  if (lw > 0) { ctx.strokeStyle = o.stroke || P.ink; ctx.lineWidth = lw; draw('s', 0, 0); }
  ctx.fillStyle = fill; draw('f', 0, 0); ctx.restore();
}
function burstPath(x, y, r, n, rot = 0, inner = 0.62, seed = 1) {
  const R = rng(seed), p = new Path2D();
  for (let i = 0; i < n * 2; i++) {
    const a = rot + i * Math.PI / n, rr = i % 2 ? r * inner * (0.9 + R() * 0.2) : r * (0.88 + R() * 0.24);
    const px = x + Math.cos(a) * rr, py = y + Math.sin(a) * rr; i ? p.lineTo(px, py) : p.moveTo(px, py);
  }
  p.closePath(); return p;
}
function burst(x, y, r, n, fill, rot = 0, inner = 0.62, lw = 6, seed = 1) { const p = burstPath(x, y, r, n, rot, inner, seed); ink(p, fill, lw); return p; }
function actionLines(x, y, r0, r1, n, w, rot = 0, color = P.ink) {
  ctx.fillStyle = color;
  for (let i = 0; i < n; i++) {
    const a = rot + i * TAU / n + (i % 3) * 0.05, l1 = r1 * (0.75 + 0.25 * ((i * 7) % 5) / 4);
    ctx.beginPath(); ctx.moveTo(x + Math.cos(a - w) * r0, y + Math.sin(a - w) * r0); ctx.lineTo(x + Math.cos(a) * l1, y + Math.sin(a) * l1);
    ctx.lineTo(x + Math.cos(a + w) * r0, y + Math.sin(a + w) * r0); ctx.closePath(); ctx.fill();
  }
}
function bubble(x, y, rx, ry, tx, ty, fill = '#fff', lw = 4) {
  const p = new Path2D(); p.ellipse(x, y, rx, ry, 0, 0, TAU);
  const a = Math.atan2(ty - y, tx - x), q = new Path2D();
  q.moveTo(x + Math.cos(a - 0.35) * rx * 0.85, y + Math.sin(a - 0.35) * ry * 0.85); q.lineTo(tx, ty);
  q.lineTo(x + Math.cos(a + 0.35) * rx * 0.85, y + Math.sin(a + 0.35) * ry * 0.85); q.closePath();
  p.addPath(q); blob(p, fill, lw);
}
function limb(pts, w, fill) {
  const p = new Path2D(); pts.forEach((q, i) => i ? p.lineTo(q[0], q[1]) : p.moveTo(q[0], q[1]));
  ctx.lineCap = ctx.lineJoin = 'round'; ctx.strokeStyle = P.ink; ctx.lineWidth = w + 9; ctx.stroke(p);
  ctx.strokeStyle = fill; ctx.lineWidth = w; ctx.stroke(p);
}
function panel(x, y, w, h, r, fill, lw = 10, shadow = 12) {
  ctx.fillStyle = P.ink; ctx.beginPath(); ctx.roundRect(x + shadow, y + shadow, w, h, r); ctx.fill();
  const p = rrect(x, y, w, h, r); ctx.fillStyle = fill; ctx.fill(p); return p;
}
function panelBorder(x, y, w, h, r, lw = 10) { ctx.strokeStyle = P.ink; ctx.lineWidth = lw; ctx.lineJoin = 'round'; ctx.beginPath(); ctx.roundRect(x, y, w, h, r); ctx.stroke(); }

/* ---------- icons ---------- */
function coinIcon(x, y, r) {
  ink(circ(x, y, r), P.yellow, 5); ink(circ(x, y, r * 0.68), '#ffb800', 3, false);
  ctx.fillStyle = P.cream; ctx.fillRect(x - r * 0.4, y - r * 0.08, r * 0.8, r * 0.16);
  ink(poly([[x - r * 0.12, y - r * 0.5], [x + r * 0.12, y - r * 0.5], [x + r * 0.12, y + r * 0.5], [x - r * 0.12, y + r * 0.5]]), P.cream, 2.5, false);
  ctx.fillStyle = 'rgba(255,255,255,.8)'; ctx.beginPath(); ctx.arc(x - r * 0.5, y - r * 0.5, r * 0.12, 0, TAU); ctx.fill();
}
function gemIcon(x, y, r) {
  const p = poly([[x - r, y - r * 0.35], [x - r * 0.55, y - r * 0.9], [x + r * 0.55, y - r * 0.9], [x + r, y - r * 0.35], [x, y + r]]);
  ink(p, P.cyan, 5);
  ctx.strokeStyle = P.ink; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(x - r, y - r * 0.35); ctx.lineTo(x + r, y - r * 0.35);
  ctx.moveTo(x - r * 0.3, y - r * 0.9); ctx.lineTo(x - r * 0.5, y - r * 0.35); ctx.lineTo(x, y + r); ctx.moveTo(x + r * 0.3, y - r * 0.9); ctx.lineTo(x + r * 0.5, y - r * 0.35); ctx.lineTo(x, y + r); ctx.stroke();
  ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.moveTo(x - r * 0.75, y - r * 0.4); ctx.lineTo(x - r * 0.45, y - r * 0.78); ctx.lineTo(x - r * 0.3, y - r * 0.4); ctx.fill();
}
function recordIcon(x, y, r, spin = 0) {
  ink(circ(x, y, r), '#25202e', 5);
  ctx.strokeStyle = 'rgba(255,255,255,.28)'; ctx.lineWidth = 1.6;
  for (let k = 0.45; k < 0.95; k += 0.14) { ctx.beginPath(); ctx.arc(x, y, r * k, 0, TAU); ctx.stroke(); }
  ctx.fillStyle = 'rgba(255,255,255,.85)'; ctx.beginPath(); ctx.moveTo(x, y); ctx.arc(x, y, r * 0.92, spin - 0.9, spin - 0.55); ctx.fill();
  ink(circ(x, y, r * 0.32), P.red, 3, false); ctx.fillStyle = P.ink; ctx.beginPath(); ctx.arc(x, y, r * 0.06, 0, TAU); ctx.fill();
}
function heartShape(x, y, s) {
  const p = new Path2D(); p.moveTo(x, y + s * 0.9);
  p.bezierCurveTo(x - s * 1.5, y - s * 0.1, x - s * 0.7, y - s * 1.2, x, y - s * 0.4);
  p.bezierCurveTo(x + s * 0.7, y - s * 1.2, x + s * 1.5, y - s * 0.1, x, y + s * 0.9); p.closePath(); return p;
}
function bolt(x, y, s, fill) {
  ink(poly([[x + s * 0.2, y - s], [x - s * 0.6, y + s * 0.1], [x - s * 0.05, y + s * 0.1], [x - s * 0.3, y + s], [x + s * 0.65, y - s * 0.2], [x + s * 0.05, y - s * 0.2]]), fill, 4);
}

/* ---------- turrets (origin = tile centre, ~ +-46 units) ---------- */
function barrel(len, w, a, fill, off = 0) {
  ctx.save(); ctx.rotate(a); ink(rrect(off, -w / 2, len, w, w * 0.3), fill, 4);
  ink(rrect(off + len - 8, -w * 0.72, 11, w * 1.44, 4), '#3a3446', 4); ctx.restore();
}
const TUR = {
  kick(t, a) {
    barrel(50, 24, a, '#b81d29');
    const b = circ(0, 4, 34); ink(b, P.red, 6); shade(b, 0, 4, 34, '#7e0f1c', 1, 5, 2.2);
    ink(circ(0, 4, 23), P.cream, 4); shade(circ(0, 4, 23), 0, 4, 23, '#ee2a35', 1, 5, 2);
    ink(circ(0, 4, 8), P.ink, 3, false);
    ctx.fillStyle = P.yellow; for (let i = 0; i < 8; i++) { const q = i * TAU / 8 + 0.2; ctx.beginPath(); ctx.arc(Math.cos(q) * 29, 4 + Math.sin(q) * 29, 2.8, 0, TAU); ctx.fill(); }
  },
  snare(t, a) {
    ctx.save(); ctx.rotate(a); ctx.lineCap = 'round';
    ctx.strokeStyle = P.ink; ctx.lineWidth = 15; ctx.beginPath(); ctx.moveTo(0, -10); ctx.lineTo(54, -14); ctx.moveTo(0, 6); ctx.lineTo(54, 10); ctx.stroke();
    ctx.strokeStyle = '#e8b96a'; ctx.lineWidth = 8; ctx.stroke(); ctx.restore();
    const b = rrect(-38, -8, 76, 44, 8); ink(b, P.yellow, 6); shade(b, 0, 14, 44, '#d98a00', 1, 5, 2);
    ctx.strokeStyle = P.red; ctx.lineWidth = 4; ctx.beginPath(); for (let i = 0; i <= 8; i++) { const x = -34 + i * 8.5; ctx.lineTo(x, 8 + (i % 2) * 18); } ctx.stroke();
    ink(ell(0, -8, 38, 14), P.cream, 5); ctx.strokeStyle = 'rgba(20,16,26,.45)'; ctx.lineWidth = 2;
    for (let i = -2; i <= 2; i++) { ctx.beginPath(); ctx.moveTo(i * 11, -8); ctx.lineTo(i * 11, -3); ctx.stroke(); }
  },
  hat(t, a) {
    ctx.strokeStyle = P.ink; ctx.lineWidth = 9; ctx.beginPath(); ctx.moveTo(0, 6); ctx.lineTo(0, 40); ctx.moveTo(-18, 42); ctx.lineTo(0, 30); ctx.lineTo(18, 42); ctx.stroke();
    ctx.strokeStyle = '#8c93a3'; ctx.lineWidth = 4; ctx.stroke();
    ctx.save(); ctx.rotate(a);
    for (let i = -1; i <= 1; i++) { const oy = i * 9 + Math.sin(t * 22 + i * 2) * 1.2; ink(rrect(6, oy - 3.5, 50, 7, 3), '#9ae0ff', 3); }
    ink(circ(8, 0, 13), '#4f5a6e', 4); ctx.restore();
    const b = ell(0, 8, 42, 13); ink(b, '#ffd24d', 5); shade(b, 0, 8, 42, '#c47f00', 1, 5, 2);
    const c = ell(0, -6, 42, 13); ink(c, '#fff0a0', 5); shade(c, 0, -6, 42, '#e0a400', 1, 5, 2);
    ink(circ(0, -6, 5), P.ink, 2, false);
  },
  sub(t, a) {
    const pul = Math.sin(t * 8) * 0.04 + 1;
    ctx.strokeStyle = P.ink; ctx.lineWidth = 7; ctx.fillStyle = P.cream;
    const b = rrect(-40, -40, 80, 80, 10); ink(b, P.purple, 6); shade(b, 0, 0, 56, '#3e1a78', 1, 5, 2.3);
    ink(circ(0, 0, 30), '#2a2536', 5); ink(circ(0, 0, 23 * pul), '#d9d4e6', 4);
    ctx.strokeStyle = 'rgba(20,16,26,.5)'; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(0, 0, 16 * pul, 0, TAU); ctx.stroke(); ctx.beginPath(); ctx.arc(0, 0, 9 * pul, 0, TAU); ctx.stroke();
    ink(circ(0, 0, 6 * pul), P.ink, 2, false);
    ctx.fillStyle = P.yellow; [[-33, -33], [33, -33], [-33, 33], [33, 33]].forEach(q => { ctx.beginPath(); ctx.arc(q[0], q[1], 3, 0, TAU); ctx.fill(); });
    ctx.save(); ctx.rotate(a); ctx.strokeStyle = P.ink; ctx.lineWidth = 6; ctx.lineCap = 'round';
    const k = frac(t * 1.3); ctx.globalAlpha = 1 - k; ctx.beginPath(); ctx.arc(0, 0, 44 + k * 14, -0.55, 0.55); ctx.stroke(); ctx.globalAlpha = 1; ctx.restore();
  },
  mic(t, a) {
    ctx.save(); ctx.rotate(a); ctx.strokeStyle = P.ink; ctx.lineWidth = 6; ctx.lineCap = 'round';
    for (let i = 0; i < 3; i++) { const k = frac(t * 1.1 + i / 3); ctx.globalAlpha = 1 - k * 0.6; ctx.lineWidth = 7 - k * 3; ctx.beginPath(); ctx.arc(8, -6, 20 + k * 28, -0.6, 0.6); ctx.stroke(); }
    ctx.globalAlpha = 1; ctx.restore();
    ink(poly([[-8, 6], [8, 6], [14, 38], [-14, 38]]), '#2a2536', 5);
    ink(ell(0, 40, 26, 8), '#2a2536', 5);
    const h = circ(0, -8, 22); ink(h, P.pink, 6); shade(h, 0, -8, 22, '#c4287f', 1, 5, 2);
    ctx.strokeStyle = 'rgba(20,16,26,.55)'; ctx.lineWidth = 2; ctx.save(); ctx.clip(h);
    for (let i = -24; i <= 24; i += 8) { ctx.beginPath(); ctx.moveTo(i, -40); ctx.lineTo(i + 20, 20); ctx.moveTo(i, 20); ctx.lineTo(i + 20, -40); ctx.stroke(); } ctx.restore();
    ink(rrect(-14, 6, 28, 8, 3), P.cream, 3);
  },
  synth(t, a) {
    const b = rrect(-42, -16, 84, 46, 8); ink(b, '#00b894', 6); shade(b, 0, 8, 56, '#00755f', 1, 5, 2.2);
    ink(rrect(-36, 2, 72, 24, 3), P.cream, 4);
    ctx.fillStyle = P.ink; for (let i = 1; i < 8; i++) { ctx.fillRect(-36 + i * 9 - 0.8, 2, 1.8, 24); }
    [-2, -1, 1, 2, 3, 5, 6].forEach(i => ctx.fillRect(-36 + i * 9 - 3, 2, 6, 14));
    for (let i = 0; i < 4; i++) { ink(circ(-30 + i * 11, -7, 4), i % 2 ? P.yellow : P.pink, 2.5, false); }
    ink(rrect(14, -11, 22, 8, 3), '#0b4d40', 2.5, false);
    ctx.save(); ctx.rotate(a * 0.3 - 0.8); ink(rrect(0, -30, 34, 8, 4), '#0b4d40', 4); ctx.restore();
    const k = frac(t * 0.9); ctx.save(); ctx.globalAlpha = 1 - k; txt('♪', 6 + k * 10, -36 - k * 22, 28, P.yellow, { lw: 6 }); ctx.restore();
  },
  horn(t, a) {
    ctx.save(); ctx.rotate(a);
    const cone = poly([[6, -9], [58, -26], [58, 26], [6, 9]]); ink(cone, '#ff8a1f', 6); shade(cone, 32, 0, 32, '#c4560a', 1, 5, 2.2);
    ink(ell(58, 0, 7, 26), '#ffd7a0', 5); ink(ell(58, 0, 3.5, 17), '#3a3446', 3, false); ctx.restore();
    const b = rrect(-30, -22, 44, 44, 9); ink(b, P.red, 6); shade(b, -8, 0, 36, '#8a1020', 1, 5, 2.2);
    ink(rrect(-24, -12, 32, 24, 4), P.cream, 3.5); txt('!', -8, 1, 24, P.red, { lw: 5 });
    ink(rrect(-12, -30, 14, 10, 3), '#3a3446', 4);
  },
  scratch(t, a) {
    const b = rrect(-42, -40, 84, 80, 8); ink(b, '#4b4560', 6); shade(b, 0, 0, 56, '#241f33', 1, 5, 2.3);
    ink(circ(-3, 2, 33), '#17131f', 5);
    ctx.strokeStyle = 'rgba(255,255,255,.22)'; ctx.lineWidth = 1.5; for (let k = 14; k < 31; k += 4) { ctx.beginPath(); ctx.arc(-3, 2, k, 0, TAU); ctx.stroke(); }
    const sp = t * 6; ctx.fillStyle = 'rgba(255,255,255,.55)'; ctx.beginPath(); ctx.moveTo(-3, 2); ctx.arc(-3, 2, 32, sp, sp + 0.5); ctx.fill(); ctx.beginPath(); ctx.moveTo(-3, 2); ctx.arc(-3, 2, 32, sp + Math.PI, sp + Math.PI + 0.5); ctx.fill();
    ink(circ(-3, 2, 11), P.magenta, 3, false); ink(circ(-3, 2, 2.5), P.ink, 1, false);
    ctx.save(); ctx.translate(34, -30); ctx.rotate(a * 0.2 + 2.3 + Math.sin(t * 5) * 0.05); ink(rrect(0, -3, 52, 6, 3), '#d9d4e6', 4); ink(rrect(46, -6, 12, 12, 3), P.yellow, 3); ctx.restore();
    ink(circ(34, -30, 7), '#d9d4e6', 3, false);
  },
  cowbell(t, a) {
    ctx.save(); ctx.rotate(a);
    ink(rrect(10, -5, 62, 10, 3), '#3a3446', 4); ink(rrect(26, -12, 18, 7, 3), '#7e8ea8', 3); ink(rrect(60, -8, 14, 16, 3), '#17131f', 3); ctx.restore();
    const b = poly([[-18, -22], [18, -22], [32, 30], [-32, 30]]); ink(b, '#e8a31a', 6); shade(b, 0, 4, 40, '#9a5c00', 1, 5, 2.2);
    ink(ell(0, 30, 32, 7), '#3a2a00', 4); ink(rrect(-14, -34, 28, 14, 6), '#ffd24d', 5);
    ctx.fillStyle = 'rgba(255,255,255,.65)'; ctx.beginPath(); ctx.moveTo(-14, -16); ctx.lineTo(-8, -16); ctx.lineTo(-18, 24); ctx.lineTo(-24, 24); ctx.fill();
    ink(circ(0, 38, 5), P.ink, 2, false);
  }
};
function drawTurret(id, lvl, x, y, aim, t) {
  const s = 0.8 + 0.06 * lvl;
  ctx.save(); ctx.translate(x, y);
  ctx.fillStyle = 'rgba(20,16,26,.28)'; ctx.beginPath(); ctx.ellipse(4, 40 * s, 40 * s, 10, 0, 0, TAU); ctx.fill();
  if (lvl >= 5) { const R = burstPath(0, 0, 62, 12, t * 0.6, 0.72, 5); ctx.fillStyle = P.yellow; ctx.fill(R); ctx.strokeStyle = P.ink; ctx.lineWidth = 3; ctx.stroke(R); }
  ctx.save(); ctx.scale(s, s); TUR[id](t + x * 0.01, aim); ctx.restore();
  // level badge
  const bx = 36, by = 34; ink(circ(bx, by, 15), LV[lvl], 4);
  txt('' + lvl, bx, by + 1, 20, P.cream, { lw: 5 });
  ctx.restore();
}

/* ---------- enemies (the Static) ---------- */
function furPath(r, n, t, seed, sq) {
  const R = rng(seed), p = new Path2D();
  for (let i = 0; i < n * 2; i++) {
    const a = i * Math.PI / n, jit = 0.9 + R() * 0.25, wob = Math.sin(t * 7 + i * 1.7) * 0.025;
    let rr = r * (i % 2 ? 0.92 : 1.12 * jit + wob);
    let px = Math.cos(a) * rr, py = Math.sin(a) * rr * 0.92;
    if (sq) { px *= 1.12; py *= 0.95; }
    i ? p.lineTo(px, py) : p.moveTo(px, py);
  }
  p.closePath(); return p;
}
function googly(x, y, r, gx, gy, angry) {
  ink(circ(x, y, r), '#fff', 3.5);
  const pr = r * 0.5, d = r - pr - 1.5, m = Math.hypot(gx, gy) || 1, k = Math.min(1, m) * d;

  ink(banner, P.yellow, 7); shade(banner, 100, 20, 380, '#ff8a1f', 1, 8, 3, 0.1); ctx.restore();
  const word = 'DROP THE BASS', cols = [P.red, P.red, P.red, P.red, P.ink, P.ink, P.ink, P.ink, P.cyan, P.cyan, P.cyan, P.cyan];
  ctx.font = `bold 78px ${FONT}`; let wsum = 0; const ws = [...word].map(ch => { const w = ctx.measureText(ch).width * 0.96; wsum += w; return w; });
  let cx = -wsum / 2; [...word].forEach((ch, i) => {
    const w = ws[i]; if (ch !== ' ') txt(ch, cx + w / 2, 2 + Math.sin(i * 1.3) * 3, 78, i < 4 ? P.red : i < 7 ? P.cream : P.cyan, { lw: 15, rot: Math.sin(i * 1.7) * 0.07, skew: -0.12, drop: 5 });
    cx += w;
  });
  ctx.restore();
  ctx.save(); ctx.translate(540, CY + 112); ctx.rotate(-0.012);
  const rib = poly([[-208, -17], [208, -17], [194, 2], [208, 21], [-208, 21], [-194, 2]]); ink(rib, P.magenta, 5);
  txt('STYLE 06  •  COMIC POP-ART', 0, 3, 24, P.cream, { lw: 0, mw: 360 }); ctx.restore();

  // heroes
  ctx.save(); ctx.translate(168, 1766); ctx.scale(0.88, 0.88); roxor(t + 0.3); ctx.restore();
  ctx.save(); ctx.translate(912, 1766); ctx.scale(0.88, 0.88); jasmin(t + 0.3); ctx.restore();
  txt('ROXORLOOPS', 168, 1778, 26, P.lime, { lw: 8, rot: -0.03, mw: 220 });
  txt('JASMIN', 912, 1778, 28, P.pink, { lw: 8, rot: 0.03, mw: 200 });

  // cards
  const X = [320, 480, 640], Y1 = 1438, Y2 = 1606, CW = 150, CH = 156;
  [['kick', 5, 'KICK CANNON L5'], ['sub', 3, 'SUBWOOFER L3'], ['cowbell', 4, 'COWBELL SNIPER L4']].forEach((c, i) => {
    card(X[i], Y1, CW, CH, P.cream, '#12a9e0', c[2]);
    ctx.save(); ctx.translate(X[i] + CW / 2, Y1 + 62); ctx.scale(1.12, 1.12); const s = 0.8 + 0.06 * c[1];
    if (c[1] >= 5) { const Rr = burstPath(0, 0, 62, 12, t * 0.6, 0.72, 5); ctx.fillStyle = P.yellow; ctx.fill(Rr); ctx.strokeStyle = P.ink; ctx.lineWidth = 3; ctx.stroke(Rr); }
    ctx.scale(s, s); TUR[c[0]](t + i, -0.5 + Math.sin(t * 1.5 + i) * 0.1); ctx.restore();
    ctx.save(); ctx.translate(X[i] + 124, Y1 + 28); ink(circ(0, 0, 15), LV[c[1]], 4); txt('' + c[1], 0, 1, 20, P.cream, { lw: 5 }); ctx.restore();
  });
  [['zip', 'ZIPPER', 46, '#ffd400'], ['rager', 'RAGER', 46, '#ff5fb0'], ['boss', 'COMPRESSOR', 46, '#9dff3a']].forEach((c, i) => {
    card(X[i], Y2, CW, CH, P.cream, c[3], c[1]);
    enemy(c[0], X[i] + CW / 2 + (c[0] === 'zip' ? 14 : 0), Y2 + 76 + (c[0] === 'boss' ? 10 : 0), c[0] === 'boss' ? 46 : 44, t, i * 7 + 4);
  });
  // onomatopoeia on the cards
  onomatopoeia('POW!', 770, 1440, 40, 0.2, [P.yellow, P.red], t, 3);

  // currency row
  [['COINS', '12,480', coinIcon, 60], ['DIAMONDS', '86', gemIcon, 390], ['RECORDS', '12', recordIcon, 720]].forEach((c, i) => {
    const x = c[3], y = 1808, w = 300, h = 74;
    ctx.fillStyle = P.ink; ctx.beginPath(); ctx.roundRect(x + 7, y + 7, w, h, 38); ctx.fill();
    const p = rrect(x, y, w, h, 38); ctx.fillStyle = P.cream; ctx.fill(p); shade(p, x + w / 2, y + 38, 160, i === 0 ? '#ffd400' : i === 1 ? '#12a9e0' : '#ec1c82', 1, 8, 3, 0.2);
    ctx.strokeStyle = P.ink; ctx.lineWidth = 6; ctx.stroke(p);
    c[2](x + 44, y + 38, 27, t * 2);
    txt(c[0], x + 176, y + 24, 20, P.ink, { lw: 0, mw: 160 });
    txt(c[1], x + 176, y + 54, 34, P.cream, { lw: 8, mw: 160 });
  });
}

/* ---------- frame ---------- */
function frame(t) {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.drawImage(bg, 0, 0);
  ctx.save(); ctx.beginPath(); ctx.roundRect(24, 24, 1032, 1244, 26); ctx.clip();
  drawStage(t);
  drawBoard(t);
  ctx.restore();
  drawHUD(t);
  drawSheet(t);
  ctx.drawImage(grain, 0, 0);
}
buildStatic();
const T0 = performance.now(), OFF = parseFloat(new URLSearchParams(location.search).get('t') || '1.3');
function loop() { frame((performance.now() - T0) / 1000 + OFF); requestAnimationFrame(loop); }
loop();
</script>
