<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Drop the Bass - Constructivist</title>
<style>
html,body{margin:0;height:100%;background:#0d0b0a;overflow:hidden}
canvas{position:absolute;display:block}
</style></head>
<body><canvas id="c" width="1080" height="1920"></canvas>
<script>
'use strict';
const C = document.getElementById('c');
const MAIN = C.getContext('2d');
let g = MAIN;
const RED = '#d6291b', BLK = '#151311', CRM = '#efe2c3', CRM2 = '#dcc99c', LIME = '#a6e22a', PNK = '#ff6fae', GRY = '#a29d90', DK = '#67625a';
const FONT = '"Inter Display","Inter","DejaVu Sans",Arial,sans-serif';
const PI = Math.PI, TAU = PI * 2;

function fit() {
  const k = Math.min(innerWidth / 1080, innerHeight / 1920);
  C.style.width = 1080 * k + 'px'; C.style.height = 1920 * k + 'px';
  C.style.left = (innerWidth - 1080 * k) / 2 + 'px'; C.style.top = (innerHeight - 1920 * k) / 2 + 'px';
}
addEventListener('resize', fit); fit();

function rng(seed) { let a = seed >>> 0; return () => { a = (a + 0x6D2B79F5) >>> 0; let t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }

// ---------- drawing helpers ----------
function path(pts) { g.beginPath(); pts.forEach((p, i) => i ? g.lineTo(p[0], p[1]) : g.moveTo(p[0], p[1])); g.closePath(); }
function fillStroke(fill, stroke, lw) {
  if (fill) { g.fillStyle = fill; g.fill(); }
  if (stroke) { g.strokeStyle = stroke; g.lineWidth = lw || 4; g.lineJoin = 'miter'; g.miterLimit = 3; g.stroke(); }
}
function P(pts, fill, stroke, lw) { path(pts); fillStroke(fill, stroke, lw); }
function Cc(x, y, r, fill, stroke, lw) { g.beginPath(); g.arc(x, y, r, 0, TAU); fillStroke(fill, stroke, lw); }
function El(x, y, rx, ry, fill, stroke, lw, rot) { g.beginPath(); g.ellipse(x, y, rx, ry, rot || 0, 0, TAU); fillStroke(fill, stroke, lw); }
function Ln(x1, y1, x2, y2, col, lw, cap) { g.beginPath(); g.moveTo(x1, y1); g.lineTo(x2, y2); g.strokeStyle = col; g.lineWidth = lw; g.lineCap = cap || 'round'; g.stroke(); }
function Limb(x1, y1, x2, y2, col, lw) { Ln(x1, y1, x2, y2, BLK, lw + 8); Ln(x1, y1, x2, y2, col, lw); }
function starPts(x, y, ro, ri, n, rot) { const a = []; for (let i = 0; i < n * 2; i++) { const r = i % 2 ? ri : ro, an = rot + i * PI / n; a.push([x + Math.cos(an) * r, y + Math.sin(an) * r]); } return a; }
function Star(x, y, ro, ri, n, rot, fill, stroke, lw) { P(starPts(x, y, ro, ri, n, rot || -PI / 2), fill, stroke, lw); }
function heart(x, y, s, fill, stroke, lw) {
  g.beginPath(); g.moveTo(x, y + 9 * s); g.bezierCurveTo(x - 16 * s, y - 2 * s, x - 9 * s, y - 14 * s, x, y - 6 * s);
  g.bezierCurveTo(x + 9 * s, y - 14 * s, x + 16 * s, y - 2 * s, x, y + 9 * s); g.closePath(); fillStroke(fill, stroke, lw);
}
function hatchIn(fn, x0, y0, x1, y1, sp, ang, col, lw) {
  g.save(); fn(); g.clip(); g.strokeStyle = col; g.lineWidth = lw; g.lineCap = 'butt';
  const cx = (x0 + x1) / 2, cy = (y0 + y1) / 2, R = Math.hypot(x1 - x0, y1 - y0) / 2 + 4;
  g.translate(cx, cy); g.rotate(ang); g.beginPath();
  for (let d = -R; d <= R; d += sp) { g.moveTo(-R, d); g.lineTo(R, d); }
  g.stroke(); g.restore();
}
function hatchPoly(pts, sp, ang, col, lw) {
  let x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9; pts.forEach(p => { x0 = Math.min(x0, p[0]); x1 = Math.max(x1, p[0]); y0 = Math.min(y0, p[1]); y1 = Math.max(y1, p[1]); });
  hatchIn(() => path(pts), x0, y0, x1, y1, sp, ang, col, lw);
}
function dotsIn(fn, x0, y0, x1, y1, sp, rmax, col, grad) {
  g.save(); fn(); g.clip(); g.fillStyle = col;
  for (let y = y0, j = 0; y < y1; y += sp, j++) for (let x = x0 + (j % 2 ? sp / 2 : 0); x < x1; x += sp) {
    const k = grad ? Math.max(0, Math.min(1, grad(x, y))) : 1; if (k < 0.08) continue;
    g.beginPath(); g.arc(x, y, rmax * k, 0, TAU); g.fill();
  }
  g.restore();
}
function TX(s, x, y, size, fill, o) {
  o = o || {};
  g.save(); g.translate(x, y); if (o.rot) g.rotate(o.rot);
  g.transform(o.sx || 0.88, 0, o.skew || 0, 1, 0, 0);
  g.font = `900 ${size}px ${FONT}`; g.textAlign = o.al || 'center'; g.textBaseline = 'middle';
  if (o.ls !== undefined) g.letterSpacing = o.ls + 'px'; else g.letterSpacing = '0px';
  if (o.sh) { g.fillStyle = o.sh; g.fillText(s, o.shx === undefined ? 4 : o.shx, o.shy === undefined ? 4 : o.shy); }
  if (o.st) { g.lineWidth = o.sw || 6; g.strokeStyle = o.st; g.lineJoin = 'round'; g.strokeText(s, 0, 0); }
  g.fillStyle = fill; g.fillText(s, 0, 0); g.restore();
}
function megaphone(x, y, s, rot, fill, t) {
  g.save(); g.translate(x, y); g.rotate(rot); g.scale(s, s);
  P([[-60, -10], [-30, -22], [-30, 22], [-60, 10]], BLK, BLK, 3);
  P([[-30, -24], [60, -62], [60, 62], [-30, 24]], fill, BLK, 5);
  El(60, 0, 11, 62, BLK, BLK, 3); El(60, 0, 6, 46, RED, null);
  P([[-22, 22], [4, 22], [-6, 60], [-30, 60]], BLK, BLK, 3);
  g.restore();
}
function soundArcs(x, y, rot, t, col, n, lw, gap) {
  g.save(); g.translate(x, y); g.rotate(rot); g.lineCap = 'round';
  for (let i = 0; i < n; i++) {
    const ph = ((t * 1.2 + i / n) % 1), r = 20 + ph * (gap || 70);
    g.globalAlpha = 1 - ph; g.strokeStyle = col; g.lineWidth = lw;
    g.beginPath(); g.arc(0, 0, r, -0.6, 0.6); g.stroke();
  }
  g.restore();
}
function burst(x, y, r, n, rot, fill, stroke, lw, seed) {
  const R = rng(seed || 3), a = [];
  for (let i = 0; i < n * 2; i++) { const rr = i % 2 ? r * (0.45 + R() * 0.12) : r * (0.9 + R() * 0.2); const an = rot + i * PI / n; a.push([x + Math.cos(an) * rr, y + Math.sin(an) * rr]); }
  P(a, fill, stroke, lw);
}

// ---------- turrets (local origin = centre of pad) ----------
function turret(type, cx, cy, sc, lv, t, a) {
  g.save(); g.translate(cx, cy); g.scale(sc, sc);
  const ls = 0.86 + lv * 0.05; g.scale(ls, ls);
  g.fillStyle = 'rgba(21,19,17,0.28)'; g.beginPath(); g.ellipse(4, 44, 50, 11, 0, 0, TAU); g.fill();
  const pulse = 0.5 + 0.5 * Math.sin(t * 7);
  switch (type) {
    case 'kick': {
      Cc(0, 4, 47, BLK); Cc(0, 4, 40, CRM, BLK, 3); Cc(0, 4, 32, RED, BLK, 3);
      for (let i = 0; i < 10; i++) { const an = i * TAU / 10; Ln(Math.cos(an) * 36, 4 + Math.sin(an) * 36, Math.cos(an) * 46, 4 + Math.sin(an) * 46, CRM, 3, 'butt'); }
      g.save(); g.translate(0, 4); g.rotate(a); const rc = -5 * Math.max(0, Math.sin(t * 8));
      P([[8 + rc, -14], [58 + rc, -17], [58 + rc, 17], [8 + rc, 14]], BLK, BLK, 4);
      P([[18 + rc, -14], [28 + rc, -14], [28 + rc, 14], [18 + rc, 14]], CRM);
      P([[54 + rc, -21], [72 + rc, -21], [72 + rc, 21], [54 + rc, 21]], RED, BLK, 4);
      g.restore(); Cc(0, 4, 13, LIME, BLK, 3); Cc(0, 4, 5, BLK);
      break;
    }
    case 'snare': {
      P([[-44, -4], [44, -4], [44, 26], [-44, 26]], CRM, BLK, 4);
      g.beginPath(); g.ellipse(0, 26, 44, 13, 0, 0, PI); fillStroke(CRM, BLK, 4);
      g.beginPath(); for (let i = 0; i <= 8; i++) { const x = -40 + i * 10; g.lineTo(x, i % 2 ? 22 : 0); } g.strokeStyle = RED; g.lineWidth = 5; g.lineJoin = 'miter'; g.stroke();
      El(0, -4, 44, 15, RED, BLK, 4); El(0, -4, 34, 10, CRM, BLK, 3);
      for (let i = -2; i <= 2; i++) P([[i * 18 - 3, 26], [i * 18 + 3, 26], [i * 18 + 3, 36], [i * 18 - 3, 36]], BLK);
      g.save(); g.translate(0, -4);
      [-0.16, 0.16].forEach((d, k) => { g.save(); g.rotate(a + d + 0.05 * Math.sin(t * 9 + k * 3)); Ln(-6, 0, 62, 0, BLK, 9, 'butt'); Cc(64, 0, 8, LIME, BLK, 3); g.restore(); });
      g.restore();
      break;
    }
    case 'hat': {
      Ln(0, 6, 0, 44, BLK, 6); Ln(0, 40, -26, 50, BLK, 5); Ln(0, 40, 26, 50, BLK, 5);
      El(0, 14, 48, 12, CRM, BLK, 4); El(0, 14, 10, 4, BLK);
      const lift = 6 * Math.abs(Math.sin(t * 9));
      El(0, 0 - lift, 48, 12, RED, BLK, 4); El(0, -lift - 1, 10, 4, BLK);
      g.save(); g.translate(0, -4); g.rotate(a); Cc(8, 0, 13, BLK);
      for (let k = 0; k < 3; k++) { const oy = 12 * Math.sin(t * 12 + k * 2.09); Ln(10, oy, 60, oy, BLK, 8, 'butt'); Ln(56, oy, 66, oy, LIME, 8, 'butt'); }
      Cc(8, 0, 6, LIME, BLK, 2); g.restore();
      break;
    }
    case 'sub': {
      P([[-48, -42], [48, -42], [48, 46], [-48, 46]], BLK, BLK, 4);
      P([[-48, -42], [-34, -42], [-48, -28]], RED); P([[48, 46], [34, 46], [48, 32]], RED);
      Cc(0, 2, 35, RED, CRM, 4); Cc(0, 2, 25, null, BLK, 4); Cc(0, 2, 15, CRM, BLK, 3); Cc(0, 2, 6, LIME, BLK, 2);
      const ph = (t * 1.4) % 1; g.globalAlpha = 1 - ph; g.beginPath(); g.arc(0, 2, 46 + ph * 22, 0, TAU); g.strokeStyle = CRM; g.lineWidth = 5; g.stroke(); g.globalAlpha = 1;
      [[-40, -34], [40, -34], [-40, 38], [40, 38]].forEach(p => Cc(p[0], p[1], 3, CRM));
      break;
    }
    case 'mic': {
      P([[-24, 44], [24, 44], [10, 28], [-10, 28]], BLK); Ln(0, 28, 0, 6, BLK, 8);
      Cc(0, -10, 26, BLK); Cc(0, -10, 20, CRM, null);
      hatchIn(() => { g.beginPath(); g.arc(0, -10, 20, 0, TAU); }, -20, -30, 20, 10, 6, 0.8, BLK, 2);
      hatchIn(() => { g.beginPath(); g.arc(0, -10, 20, 0, TAU); }, -20, -30, 20, 10, 6, -0.8, BLK, 2);
      Cc(0, -10, 24, null, RED, 5);
      g.save(); g.translate(0, -10); g.rotate(a); g.lineCap = 'round';
      for (let i = 0; i < 3; i++) { const ph = ((t * 1.3 + i / 3) % 1); g.globalAlpha = 1 - ph * 0.7; g.strokeStyle = i % 2 ? BLK : RED; g.lineWidth = 7; g.beginPath(); g.arc(0, 0, 36 + ph * 40, -0.55, 0.55); g.stroke(); }
      g.restore(); g.globalAlpha = 1;
      break;
    }
    case 'synth': {
      P([[-54, -14], [54, -14], [54, 36], [-54, 36]], BLK, BLK, 4); P([[-54, -14], [54, -14], [54, 2], [-54, 2]], RED, BLK, 3);
      for (let i = 0; i < 5; i++) Cc(-38 + i * 14, -6, 4, CRM);
      P([[28, -10], [48, -10], [48, -2], [28, -2]], LIME);
      for (let i = 0; i < 8; i++) P([[-48 + i * 12.2, 8], [-37 + i * 12.2, 8], [-37 + i * 12.2, 33], [-48 + i * 12.2, 33]], CRM, BLK, 2);
      [0, 1, 3, 4, 5, 7].forEach(i => P([[-42 + i * 12.2, 8], [-34 + i * 12.2, 8], [-34 + i * 12.2, 22], [-42 + i * 12.2, 22]], BLK));
      g.save(); g.translate(0, -14); g.rotate(a); const R = rng(Math.floor(t * 12));
      g.beginPath(); g.moveTo(0, 0); for (let i = 1; i <= 6; i++) g.lineTo(i * 11, (i % 2 ? -1 : 1) * (7 + R() * 6)); g.strokeStyle = BLK; g.lineWidth = 9; g.lineJoin = 'miter'; g.stroke(); g.strokeStyle = LIME; g.lineWidth = 4.5; g.stroke();
      g.restore();
      break;
    }
    case 'horn': {
      Cc(0, 8, 24, BLK); Cc(0, 8, 10, RED, CRM, 3);
      g.save(); g.translate(0, 8); g.rotate(a);
      P([[-40, -13], [-12, -13], [-12, 13], [-40, 13]], RED, BLK, 4); P([[-32, -13], [-24, -13], [-24, 13], [-32, 13]], CRM);
      P([[-12, -9], [58, -32], [58, 32], [-12, 9]], CRM, BLK, 4);
      hatchPoly([[-12, -9], [58, -32], [58, 32], [-12, 9]], 7, 0.0, RED, 3);
      El(58, 0, 10, 32, BLK, BLK, 3); El(58, 0, 6, 22, RED);
      g.restore();
      soundArcs(cx * 0, 8, a, t, RED, 3, 6, 50);
      break;
    }
    case 'scratch': {
      P([[-50, -34], [50, -34], [50, 40], [-50, 40]], BLK, BLK, 4);
      Cc(-4, 4, 38, '#2b2724'); for (const r of [34, 28, 22]) Cc(-4, 4, r, null, '#524b44', 2);
      g.save(); g.translate(-4, 4); g.rotate(t * 3.2);
      P([[0, -36], [8, -4], [-8, -4]], CRM); Cc(0, 0, 15, RED, CRM, 3); Cc(0, 0, 3, CRM); g.restore();
      Ln(42, -28, 20, 6, CRM, 5); Cc(42, -28, 6, LIME, BLK, 2); P([[14, 2], [24, 0], [22, 12], [12, 10]], CRM, BLK, 2);
      g.save(); g.translate(-4, 4); g.rotate(a); g.beginPath(); g.moveTo(42, 0);
      for (let i = 1; i <= 5; i++) g.lineTo(42 + i * 7, (i % 2 ? -1 : 1) * 10); g.strokeStyle = LIME; g.lineWidth = 4; g.stroke(); g.restore();
      break;
    }
    case 'cowbell': {
      g.save(); g.translate(0, 0); g.rotate(a);
      g.setLineDash([6, 7]); Ln(60, 0, 150, 0, RED, 2.5, 'butt'); g.setLineDash([]);
      P([[10, -5], [92, -5], [92, 5], [10, 5]], BLK, BLK, 3); P([[96, -4], [106, -4], [106, 4], [96, 4]], LIME, BLK, 2);
      P([[34, -14], [66, -14], [66, -5], [34, -5]], BLK); g.restore();
      Ln(0, -26, 0, -16, BLK, 6);
      P([[-26, -18], [26, -18], [42, 32], [-42, 32]], CRM, BLK, 4); P([[-31, -2], [31, -2], [34, 10], [-34, 10]], RED);
      hatchPoly([[-26, -18], [26, -18], [42, 32], [-42, 32]], 6, 0.5, 'rgba(21,19,17,0.28)', 2);
      P([[-26, -18], [26, -18], [42, 32], [-42, 32]], null, BLK, 4);
      Cc(0, 38, 7, BLK); Ln(-46, -8, -56, -14, BLK, 3); Ln(-48, 4, -60, 4, BLK, 3);
      break;
    }
  }
  g.restore();
}
function pips(cx, cy, lv) {
  for (let i = 0; i < lv; i++) {
    const x = cx - (lv - 1) * 8 + i * 16;
    P([[x, cy - 8], [x + 7, cy + 5], [x - 7, cy + 5]], i === 4 ? LIME : RED, BLK, 2.5);
  }
}

// ---------- The Static ----------
const bodyCache = {};
function staticPts(key, n, spiky, ax, ay) {
  if (bodyCache[key]) return bodyCache[key];
  const R = rng(key.length * 97 + n * 7), a = [];
  for (let i = 0; i < n; i++) { const an = i / n * TAU, r = (i % 2 ? 1 : 1 - spiky) * (0.93 + R() * 0.1); a.push([Math.cos(an) * r * ax, Math.sin(an) * r * ay]); }
  return bodyCache[key] = a;
}
function eyes(x, y, er, t, seed, look) {
  [-1, 1].forEach((sgn, k) => {
    const ex = x + sgn * er * 1.2;
    Cc(ex, y, er, CRM, BLK, 3.5);
    const lx = Math.cos(t * 2.1 + seed + k) * er * 0.38, ly = Math.sin(t * 2.7 + seed * 2 + k) * er * 0.38;
    Cc(ex + lx + (look || 0), y + ly, er * 0.46, BLK);
    Cc(ex + lx + (look || 0) - er * 0.12, y + ly - er * 0.14, er * 0.14, CRM);
  });
}
function drawStatic(type, cx, cy, r, t, seed, head) {
  g.save(); g.translate(cx, cy);
  const bob = Math.sin(t * 6 + seed) * 0.05; g.scale(1 - bob, 1 + bob);
  let ax = 1, ay = 1, n = 22, spiky = 0.12;
  if (type === 'zip') { ax = 1.25; ay = 0.8; n = 20; }
  if (type === 'brick') { ax = 1.05; ay = 0.95; n = 18; spiky = 0.06; }
  if (type === 'mini') { n = 16; spiky = 0.1; }
  if (type === 'boss') { n = 34; spiky = 0.1; }
  if (type === 'drone') { ay = 0.9; n = 18; }
  const pts = staticPts(type, n, spiky, r * ax, r * ay);
  const gl = 1 + 0.5 * Math.sin(t * 11 + seed * 3), gx = 7 * gl * (r / 44);
  // speed lines
  if (type === 'zip') { for (let i = -1; i <= 1; i++) Ln(-r * 1.4, i * r * 0.35, -r * 2.1, i * r * 0.35, BLK, 4, 'butt'); }
  if (type === 'echo') {
    g.save(); g.setLineDash([6, 5]);
    [-1, 1].forEach(sg => { g.save(); g.translate(sg * r * 0.42, -sg * 5); path(pts); g.strokeStyle = BLK; g.lineWidth = 3; g.stroke(); g.restore(); });
    g.setLineDash([]); g.restore();
  }
  g.save(); g.translate(gx, -gx * 0.55); path(pts); g.fillStyle = RED; g.fill(); g.restore();
  g.save(); g.translate(-gx * 0.6, gx * 0.7); path(pts); g.fillStyle = BLK; g.fill(); g.restore();
  path(pts); fillStroke(GRY, BLK, 4);
  const clip = () => path(pts);
  hatchIn(clip, -r * 1.4, -r * 1.4, r * 1.4, r * 1.4, 6, -0.7, 'rgba(21,19,17,0.30)', 1.8);
  dotsIn(clip, -r * 1.3, -r * 1.3, r * 1.3, r * 1.3, 7, 2.2, DK, (x, y) => (x * 0.6 + y) / r * 0.9 - 0.15);
  path(pts); fillStroke(null, BLK, 4);
  const er = r * (type === 'mini' ? 0.34 : 0.27);
  switch (type) {
    case 'fuzz': case 'zip': case 'echo': {
      eyes(0, -r * 0.12, er, t, seed);
      g.beginPath(); for (let i = 0; i <= 6; i++) g.lineTo(-r * 0.36 + i * r * 0.12, r * 0.42 + (i % 2 ? r * 0.1 : 0)); g.strokeStyle = BLK; g.lineWidth = 4; g.lineJoin = 'miter'; g.stroke();
      break;
    }
    case 'mini': { eyes(0, -r * 0.05, er, t, seed); Ln(-r * .15, r * .5, r * .15, r * .5, BLK, 3.5); break; }
    case 'brick': {
      const cap = [[-r * 0.98, -r * 0.05], [-r * 0.85, -r * 0.62], [-r * 0.35, -r * 0.98], [r * 0.35, -r * 0.98], [r * 0.85, -r * 0.62], [r * 0.98, -r * 0.05]];
      P(cap, RED, BLK, 4);
      Ln(-r * 0.95, -r * 0.4, r * 0.95, -r * 0.4, BLK, 3, 'butt');
      for (let i = -2; i <= 2; i++) Ln(i * r * 0.36, -r * 0.4, i * r * 0.36, -r * 0.05, BLK, 3, 'butt');
      for (let i = -1; i <= 2; i++) Ln(i * r * 0.36 - r * 0.18, -r * 0.4, i * r * 0.36 - r * 0.18, -r * 0.85, BLK, 3, 'butt');
      eyes(0, r * 0.2, er * 0.95, t, seed);
      Ln(-r * 0.3, r * 0.6, r * 0.3, r * 0.6, BLK, 4);
      break;
    }
    case 'drone': {
      Ln(0, -r * 0.9, 0, -r * 1.3, BLK, 5);
      const w = Math.cos(t * 22); El(0, -r * 1.3, r * 1.3 * Math.abs(w) + 3, 5, CRM, BLK, 3);
      Cc(0, 0, er * 1.7, CRM, BLK, 4); Cc(Math.cos(t * 2) * er * .5, Math.sin(t * 2.4) * er * .5, er * .8, BLK); Cc(-er * .2, -er * .3, er * .25, CRM);
      Ln(-r * 0.3, r * 0.65, r * 0.3, r * 0.65, BLK, 4);
      break;
    }
    case 'rager': {
      P([[-r * 0.82, -r * 0.7], [-r * 0.55, -r * 1.3], [-r * 0.3, -r * 0.85]], BLK, BLK, 3);
      P([[r * 0.82, -r * 0.7], [r * 0.55, -r * 1.3], [r * 0.3, -r * 0.85]], BLK, BLK, 3);
      hatchPoly(pts, 7, 0.7, 'rgba(214,41,27,0.55)', 4);
