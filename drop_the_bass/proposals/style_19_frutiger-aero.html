<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Drop the Bass - Frutiger Aero</title>
<style>
html,body{margin:0;height:100%;background:#0b3a66;overflow:hidden}
body{display:flex;align-items:center;justify-content:center}
canvas{display:block;height:100vh;width:auto;max-width:100vw;aspect-ratio:1080/1920;object-fit:contain}
</style></head><body>
<canvas id="c" width="1080" height="1920"></canvas>
<script>
(()=>{
const C=document.getElementById('c'),g=C.getContext('2d');
const W=1080,H=1920,TAU=Math.PI*2;
const qs=new URLSearchParams(location.search);
const FIX=qs.has('t')?parseFloat(qs.get('t')):null;
const FONT='"Trebuchet MS","Segoe UI",Verdana,"DejaVu Sans",sans-serif';

/* ---------- helpers ---------- */
function rng(s){return()=>{s=(s*1664525+1013904223)>>>0;return s/4294967296}}
function hx(c){c=c.replace('#','');if(c.length===3)c=c.split('').map(v=>v+v).join('');return[parseInt(c.slice(0,2),16),parseInt(c.slice(2,4),16),parseInt(c.slice(4,6),16)]}
function mix(a,b,k){const A=hx(a),B=hx(b);return'rgb('+A.map((v,i)=>Math.round(v+(B[i]-v)*k)).join(',')+')'}
function al(c,a){const A=hx(c);return'rgba('+A[0]+','+A[1]+','+A[2]+','+a+')'}
function lin(x0,y0,x1,y1,st){const q=g.createLinearGradient(x0,y0,x1,y1);st.forEach(s=>q.addColorStop(s[0],s[1]));return q}
function rad(x,y,r0,r1,st){const q=g.createRadialGradient(x,y,r0,x,y,r1);st.forEach(s=>q.addColorStop(s[0],s[1]));return q}
function rrp(x,y,w,h,r){r=Math.min(r,w/2,h/2);g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath()}
function ell(x,y,rx,ry,rot){g.beginPath();g.ellipse(x,y,rx,ry,rot||0,0,TAU)}
function circ(x,y,r){g.beginPath();g.arc(x,y,r,0,TAU)}

/* glossy gel ball */
function gelBall(x,y,r,c,o){o=o||{};
  g.save();
  circ(x,y,r);g.fillStyle=rad(x-r*.3,y-r*.4,r*.05,r*1.15,[[0,mix(c,'#ffffff',.65)],[.38,c],[1,mix(c,'#001a40',.45)]]);g.fill();
  g.clip();
  // bottom rim glow (aqua light bouncing)
  g.fillStyle=rad(x,y+r*1.0,0,r*.95,[[0,'rgba(255,255,255,.65)'],[.5,al('#bff6ff',.25)],[1,'rgba(255,255,255,0)']]);
  g.fillRect(x-r,y-r,r*2,r*2);
  // top gloss
  ell(x,y-r*.5,r*.72,r*.42);g.fillStyle=lin(0,y-r*.95,0,y-r*.1,[[0,'rgba(255,255,255,.95)'],[1,'rgba(255,255,255,.12)']]);g.fill();
  g.restore();
  circ(x,y,r);g.lineWidth=Math.max(1.2,r*.05);g.strokeStyle=o.edge||al(mix(c,'#002a5a',.55).replace(/rgb\((\d+),(\d+),(\d+)\)/,(m,a,b,d)=>'#'+[a,b,d].map(v=>(+v).toString(16).padStart(2,'0')).join('')),.75);g.stroke();
  circ(x,y,r-g.lineWidth);g.lineWidth=1;g.strokeStyle='rgba(255,255,255,.45)';g.stroke();
  // specular dot
  ell(x-r*.42,y-r*.5,r*.11,r*.07,-.6);g.fillStyle='#fff';g.fill();
}
/* glossy gel rounded rect */
function gelRR(x,y,w,h,r,c,o){o=o||{};
  g.save();
  rrp(x,y,w,h,r);g.fillStyle=lin(0,y,0,y+h,[[0,mix(c,'#ffffff',.45)],[.45,c],[1,mix(c,'#001a40',.4)]]);g.fill();
  g.clip();
  g.fillStyle=rad(x+w/2,y+h*1.05,0,Math.max(w,h)*.7,[[0,'rgba(255,255,255,.6)'],[.6,al('#bff6ff',.18)],[1,'rgba(255,255,255,0)']]);
  g.fillRect(x,y,w,h);
  rrp(x+w*.05,y+h*.05,w*.9,h*.46,r*.8);g.fillStyle=lin(0,y,0,y+h*.5,[[0,'rgba(255,255,255,.9)'],[1,'rgba(255,255,255,.1)']]);g.fill();
  g.restore();
  rrp(x,y,w,h,r);g.lineWidth=o.lw||2;g.strokeStyle=o.edge||al('#00305f',.55);g.stroke();
  rrp(x+1.5,y+1.5,w-3,h-3,r-1);g.lineWidth=1;g.strokeStyle='rgba(255,255,255,.5)';g.stroke();
}
/* translucent glass panel */
function glass(x,y,w,h,r,tint,a){tint=tint||'#ffffff';a=a==null?1:a;
  g.save();g.globalAlpha=a;
  rrp(x,y,w,h,r);g.fillStyle=lin(0,y,0,y+h,[[0,al('#ffffff',.62)],[.5,al(tint,.26)],[1,al(tint,.38)]]);g.fill();
  g.save();g.clip();
  g.fillStyle=lin(0,y,0,y+h*.5,[[0,'rgba(255,255,255,.55)'],[1,'rgba(255,255,255,0)']]);
  ell(x+w/2,y-h*.15,w*.62,h*.58);g.fill();
  g.restore();
  rrp(x,y,w,h,r);g.lineWidth=2.5;g.strokeStyle='rgba(255,255,255,.9)';g.stroke();
  rrp(x-1.5,y-1.5,w+3,h+3,r+1);g.lineWidth=1.5;g.strokeStyle=al('#0a5aa8',.35);g.stroke();
  g.restore();
}
function bubble(x,y,r,a){a=a==null?1:a;g.save();g.globalAlpha=a;
  circ(x,y,r);g.fillStyle=rad(x+r*.1,y+r*.2,r*.1,r,[[0,'rgba(255,255,255,.02)'],[.7,'rgba(180,240,255,.12)'],[1,'rgba(255,255,255,.55)']]);g.fill();
  g.lineWidth=Math.max(1,r*.05);g.strokeStyle='rgba(255,255,255,.8)';g.stroke();
  circ(x,y,r*.92);g.lineWidth=Math.max(1,r*.06);g.strokeStyle='rgba(255,90,200,.22)';g.stroke();
  g.beginPath();g.arc(x,y,r*.8,Math.PI*1.1,Math.PI*1.6);g.lineWidth=Math.max(1.5,r*.1);g.strokeStyle='rgba(255,255,255,.95)';g.lineCap='round';g.stroke();
  g.beginPath();g.arc(x,y,r*.8,Math.PI*.1,Math.PI*.35);g.lineWidth=Math.max(1,r*.06);g.strokeStyle='rgba(120,255,240,.6)';g.stroke();
  g.restore();}
function sparkle(x,y,s,a,col){g.save();g.globalAlpha=a==null?1:a;g.translate(x,y);
  g.globalCompositeOperation='lighter';
  circ(0,0,s*.9);g.fillStyle=rad(0,0,0,s*.9,[[0,'rgba(255,255,255,.9)'],[1,'rgba(255,255,255,0)']]);g.fill();
  g.globalCompositeOperation='source-over';
  g.fillStyle=col||'#fff';g.beginPath();
  g.moveTo(0,-s*1.5);g.quadraticCurveTo(s*.1,-s*.1,s*1.5,0);g.quadraticCurveTo(s*.1,s*.1,0,s*1.5);g.quadraticCurveTo(-s*.1,s*.1,-s*1.5,0);g.quadraticCurveTo(-s*.1,-s*.1,0,-s*1.5);g.fill();
  g.restore();}
function droplet(x,y,r,rot){g.save();g.translate(x,y);g.rotate(rot||0);
  ell(0,0,r,r*1.25);g.fillStyle=rad(-r*.2,-r*.3,r*.1,r*1.3,[[0,'rgba(255,255,255,.05)'],[.7,'rgba(120,200,255,.12)'],[1,'rgba(0,60,120,.35)']]);g.fill();
  ell(0,0,r,r*1.25);g.lineWidth=1.2;g.strokeStyle='rgba(255,255,255,.65)';g.stroke();
  ell(-r*.3,-r*.5,r*.25,r*.42,-.3);g.fillStyle='rgba(255,255,255,.9)';g.fill();
  ell(r*.3,r*.55,r*.35,r*.2,.3);g.fillStyle='rgba(180,255,255,.45)';g.fill();
  g.restore();}
function cloud(x,y,s,a){g.save();g.translate(x,y);g.scale(s,s);g.globalAlpha=a==null?1:a;
  const bl=[[0,0,46],[50,-18,56],[108,-4,48],[158,6,38],[-44,10,34],[20,16,52],[80,18,50],[130,24,40]];
  bl.forEach(b=>{circ(b[0],b[1],b[2]);g.fillStyle=rad(b[0]-8,b[1]-b[2]*.5,2,b[2]*1.1,[[0,'#ffffff'],[.7,'#f4fbff'],[1,'#c7e6fb']]);g.fill();});
  g.restore();}
function txt(s,x,y,size,fill,o){o=o||{};g.save();g.font=(o.style||'')+' '+(o.weight||'800')+' '+size+'px '+FONT;g.textAlign=o.align||'center';g.textBaseline=o.base||'middle';
  g.lineJoin='round';
  if(o.shadow){g.fillStyle=o.shadow;g.fillText(s,x+(o.sx||0),y+(o.sy||2));}
  if(o.stroke){g.lineWidth=o.sw||4;g.strokeStyle=o.stroke;g.strokeText(s,x,y);}
  g.fillStyle=fill;g.fillText(s,x,y);g.restore();}
function gelText(s,x,y,size,o){o=o||{};g.save();g.font='italic 900 '+size+'px '+FONT;g.textAlign='center';g.textBaseline='middle';g.lineJoin='round';
  const w=g.measureText(s).width;
  g.fillStyle='rgba(0,50,100,.35)';g.fillText(s,x+3,y+size*.1);
  g.lineWidth=size*.26;g.strokeStyle=o.out||'#06508f';g.strokeText(s,x,y);
  g.lineWidth=size*.13;g.strokeStyle='#ffffff';g.strokeText(s,x,y);
  g.fillStyle=lin(0,y-size*.5,0,y+size*.5,o.fill||[[0,'#ffffff'],[.46,'#c5f6ff'],[.5,'#27c0f4'],[1,'#0a8be0']]);g.fillText(s,x,y);
  g.restore();return w;}
function fitSize(s,maxW,size,style){g.save();g.font=style+' '+size+'px '+FONT;const w=g.measureText(s).width;g.restore();return w>maxW?size*maxW/w:size;}

/* ---------- path ---------- */
const P=[[-40,480],[960,480],[960,650],[120,650],[120,820],[960,820],[960,990],[540,990]];
const SEG=[];let PL=0;for(let i=0;i<P.length-1;i++){const dx=P[i+1][0]-P[i][0],dy=P[i+1][1]-P[i][1],l=Math.hypot(dx,dy);SEG.push({a:P[i],dx:dx/l,dy:dy/l,l,s:PL});PL+=l;}
function pathPos(d){d=((d%PL)+PL)%PL;for(const s of SEG){if(d<=s.s+s.l)return{x:s.a[0]+s.dx*(d-s.s),y:s.a[1]+s.dy*(d-s.s),dx:s.dx,dy:s.dy};}return{x:P[P.length-1][0],y:P[P.length-1][1],dx:-1,dy:0};}

/* ---------- Static (enemies) ---------- */
function fuzzShape(r,seed,t,fill,off){const R=rng(seed);
  g.save();g.lineCap='round';g.strokeStyle=fill;g.fillStyle=fill;
  circ(0,0,r*.92);g.fill();
  const N=64;g.lineWidth=Math.max(2,r*.1);
  for(let i=0;i<N;i++){const a=i/N*TAU,l=r*(.14+.2*R()),w=Math.sin(t*3+i*1.7)*r*.025;
    g.beginPath();g.moveTo(Math.cos(a)*r*.82,Math.sin(a)*r*.82);g.lineTo(Math.cos(a+w)*(r+l),Math.sin(a+w)*(r+l));g.stroke();}
  g.restore();}
function eyeBall(x,y,r,lx,ly,t,ph){
  circ(x,y,r);g.fillStyle=rad(x-r*.3,y-r*.3,r*.1,r*1.1,[[0,'#ffffff'],[.8,'#f1f6fa'],[1,'#b5c3d0']]);g.fill();
  g.lineWidth=Math.max(1,r*.09);g.strokeStyle='rgba(30,40,60,.7)';g.stroke();
  const px=x+lx*r*.32+Math.sin(t*5+ph)*r*.14,py=y+ly*r*.32+Math.cos(t*4.3+ph)*r*.14;
  circ(px,py,r*.45);g.fillStyle='#10131c';g.fill();
  circ(px-r*.14,py-r*.16,r*.14);g.fillStyle='#fff';g.fill();}
function staticMob(x,y,r,o){o=o||{};const t=T,type=o.type||'fuzz',seed=o.seed||7,lx=o.dx==null?1:o.dx,ly=o.dy||0;
  g.save();g.translate(x,y);
  let hover=0;if(type==='drone'){hover=-r*.55+Math.sin(t*4+seed)*r*.1;}
  // shadow
  ell(0,r*1.05,r*.95,r*.25);g.fillStyle='rgba(0,70,30,.32)';g.fill();
  g.translate(0,hover);
  const bob=Math.sin(t*5+seed)*r*.04;g.translate(0,bob);
  const sq=1+Math.sin(t*5+seed)*.03;g.scale(1/sq,sq);
  // glitch halos in aqua / pink
  const gl=(type==='echo'?.55:.34),go=(type==='echo'?r*.2:r*.09);
  g.save();g.translate(-go,0);fuzzShape(r,seed,t,al('#2ae6ff',gl));g.restore();
  g.save();g.translate(go,go*.2);fuzzShape(r,seed,t,al('#ff55c8',gl));g.restore();
  // body hairs dark layer then light
  fuzzShape(r*1.0,seed,t,'#8b94a4');
  g.save();g.translate(0,-r*.03);fuzzShape(r*.96,seed+3,t+1,'#c3cad6');g.restore();
  circ(0,0,r*.9);g.fillStyle=rad(-r*.3,-r*.45,r*.1,r*1.15,[[0,'#f6f8fb'],[.55,'#cfd5de'],[1,'#98a1b0']]);g.fill();
  // fur flecks
  const R=rng(seed*5+1);g.lineCap='round';
  for(let i=0;i<34;i++){const a=R()*TAU,d=Math.sqrt(R())*r*.82;g.beginPath();g.moveTo(Math.cos(a)*d,Math.sin(a)*d);g.lineTo(Math.cos(a)*d+Math.cos(a+1.2)*r*.12,Math.sin(a)*d+Math.sin(a+1.2)*r*.12);g.lineWidth=1.6;g.strokeStyle=R()>.5?'rgba(255,255,255,.7)':'rgba(110,120,140,.45)';g.stroke();}
  // soft top gloss
  ell(-r*.1,-r*.5,r*.55,r*.27,-.2);g.fillStyle='rgba(255,255,255,.4)';g.fill();
  // eyes
  const er=r*(type==='zip'?.27:.3);
  eyeBall(-r*.33,-r*.12,er,lx,ly,t,seed);eyeBall(r*.34,-r*.16,er*1.08,lx,ly,t,seed+2);
  // brows (angry for boss/brick)
  if(o.boss||type==='brick'){g.lineCap='round';g.lineWidth=r*.1;g.strokeStyle='#4a5160';g.beginPath();g.moveTo(-r*.62,-r*.5);g.lineTo(-r*.1,-r*.36);g.moveTo(r*.66,-r*.54);g.lineTo(r*.12,-r*.38);g.stroke();}
  // mouth
  if(o.boss||type==='leech'){ell(0,r*.36,r*.22,r*.16);g.fillStyle='#3b2038';g.fill();ell(0,r*.42,r*.12,r*.07);g.fillStyle='#ff7aa8';g.fill();
    g.fillStyle='#fff';rrp(-r*.14,r*.22,r*.1,r*.09,2);g.fill();rrp(r*.04,r*.22,r*.1,r*.09,2);g.fill();}
  else{g.beginPath();g.moveTo(-r*.18,r*.34);g.quadraticCurveTo(0,r*(.34+.16*Math.sin(t*3+seed)),r*.18,r*.32);g.lineWidth=Math.max(2,r*.07);g.strokeStyle='#3b3f4d';g.lineCap='round';g.stroke();}
  // accessories
  if(type==='brick'){gelRR(-r*.8,r*.1,r*1.6,r*.78,r*.2,'#4ab4ff');g.globalAlpha=.55;g.fillStyle='#fff';g.globalAlpha=1;for(let i=-1;i<=1;i++){g.fillStyle='rgba(255,255,255,.55)';g.fillRect(i*r*.45-1.5,r*.24,3,r*.48);}}
  if(type==='zip'){g.lineCap='round';for(let i=0;i<3;i++){g.beginPath();g.moveTo(-r*(1.25+i*.3),-r*.4+i*r*.4);g.lineTo(-r*(2.1+i*.3),-r*.4+i*r*.4);g.lineWidth=r*.07;g.strokeStyle=['#2ae6ff','#fff','#ff55c8'][i];g.globalAlpha=.8;g.stroke();g.globalAlpha=1;}}
  if(type==='leech'){g.lineWidth=r*.1;g.strokeStyle='#5a6070';g.lineCap='round';g.beginPath();g.moveTo(0,-r*.9);g.quadraticCurveTo(r*.5,-r*1.5,r*.9,-r*1.15);g.stroke();gelBall(r*.92,-r*1.13,r*.14,'#3fe08a');}
  if(type==='drone'){for(let k=0;k<2;k++){g.save();g.translate(0,-r*1.05);ell(0,0,r*(.9)*Math.abs(Math.cos(t*30+k)),r*.09);g.fillStyle='rgba(255,255,255,.65)';g.fill();g.restore();}
    g.lineWidth=r*.07;g.strokeStyle='#6b7384';g.beginPath();g.moveTo(0,-r*.9);g.lineTo(0,-r*1.05);g.stroke();}
  if(o.boss){ // gel headphones crown
    g.beginPath();g.arc(0,-r*.05,r*1.02,Math.PI*1.06,Math.PI*1.94);g.lineWidth=r*.17;g.lineCap='round';g.strokeStyle='#ffc82e';g.stroke();
    g.beginPath();g.arc(0,-r*.05,r*1.02,Math.PI*1.1,Math.PI*1.9);g.lineWidth=r*.05;g.strokeStyle='rgba(255,255,255,.7)';g.stroke();
    gelRR(-r*1.18,-r*.35,r*.36,r*.7,r*.15,'#ffb81c');gelRR(r*.82,-r*.35,r*.36,r*.7,r*.15,'#ffb81c');
    for(let i=0;i<3;i++){const a=Math.PI*(1.3+i*.2);gelBall(Math.cos(a)*r*1.05,Math.sin(a)*r*1.05-r*.05-r*.1,r*.1,i===1?'#ff55c8':'#2ae6ff');}
  }
  g.restore();}

/* ---------- Turrets ---------- */
const RAR=['#ffffff','#3da5ff','#b266ff','#ffc21f','#ff59b4'];
function turretBase(x,y,lvl){ // glass tile
  const w=112,h=98;
  g.save();
  rrp(x-w/2,y-h/2,w,h,22);g.fillStyle=lin(0,y-h/2,0,y+h/2,[[0,al('#ffffff',.75)],[.5,al('#bff7d4',.38)],[1,al('#52d6a0',.52)]]);g.fill();
  g.save();g.clip();ell(x,y-h*.55,w*.7,h*.5);g.fillStyle='rgba(255,255,255,.55)';g.fill();
  g.fillStyle=rad(x,y+h*.5,0,w*.6,[[0,'rgba(255,255,255,.55)'],[1,'rgba(255,255,255,0)']]);g.fillRect(x-w/2,y,w,h/2);g.restore();
  rrp(x-w/2,y-h/2,w,h,22);g.lineWidth=2.5;g.strokeStyle='rgba(255,255,255,.95)';g.stroke();
  rrp(x-w/2-1.5,y-h/2-1.5,w+3,h+3,23);g.lineWidth=1.5;g.strokeStyle=al('#0a7a70',.4);g.stroke();
  g.restore();}
function lvlBadge(x,y,lvl){const c=RAR[Math.min(4,Math.floor((lvl-1)*4/4.001))]||'#fff';
  gelRR(x-22,y-12,44,24,12,lvl>=4?(lvl===5?'#ff59b4':'#ffb81c'):lvl>=3?'#a45cff':lvl>=2?'#3da5ff':'#49c9d6');
  txt('Lv'+lvl,x,y+1,15,'#fff',{stroke:'rgba(0,40,90,.85)',sw:4});}
function drawTurret(type,x,y,lvl,aim,t,big){ // origin centre; size ~ 90
  g.save();g.translate(x,y);
  const sc=(1+lvl*.05);g.scale(sc,sc);
  // rarity aura
  if(lvl>=3){g.save();g.globalCompositeOperation='lighter';const ac=[null,null,'#3da5ff','#b266ff','#ffc21f','#ff59b4'][lvl];
    circ(0,0,52+Math.sin(t*3)*3);g.fillStyle=rad(0,0,10,56,[[0,al(ac,.0)],[.7,al(ac,.35)],[1,al(ac,0)]]);g.fill();g.restore();}
  // ground disc
  ell(0,22,38,12);g.fillStyle='rgba(0,70,60,.28)';g.fill();
  const recoil=Math.max(0,Math.sin(t*6+x*.1))*3;
  switch(type){
  case'kick':{ // kick drum cannon
    g.save();g.translate(0,0);g.rotate(aim);
    gelRR(10-recoil,-11,44,22,9,'#d4651a');gelRR(48-recoil,-14,10,28,5,'#ffe08a');g.restore();
    gelBall(0,2,32,'#ff8a2a');
    circ(0,2,22);g.fillStyle=rad(-6,-8,2,26,[[0,'#ffffff'],[.7,'#ffeed2'],[1,'#f2b97a']]);g.fill();g.lineWidth=2;g.strokeStyle='rgba(180,80,10,.6)';g.stroke();
    circ(0,2,10);g.fillStyle=lin(0,-8,0,12,[[0,'#ffb35a'],[1,'#e86a10']]);g.fill();
    ell(-6,-6,7,3.5,-.5);g.fillStyle='rgba(255,255,255,.9)';g.fill();
    break;}
  case'snare':{
    gelRR(-36,-6,72,32,12,'#ffd23a');
    for(let i=-3;i<=3;i++){g.fillStyle='rgba(120,70,0,.4)';g.fillRect(i*10-1,4,2,16);}
    ell(0,-8,38,14);g.fillStyle=lin(0,-22,0,6,[[0,'#ffffff'],[1,'#ffe9a0']]);g.fill();g.lineWidth=3;g.strokeStyle='#c9d4de';g.stroke();
    ell(-8,-12,14,4,-.1);g.fillStyle='rgba(255,255,255,.95)';g.fill();
    g.lineCap='round';g.lineWidth=5;g.strokeStyle='#ff9a2e';g.beginPath();g.moveTo(-26,-40+Math.sin(t*9)*5);g.lineTo(4,-12);g.stroke();
    g.beginPath();g.moveTo(26,-40-Math.sin(t*9)*5);g.lineTo(-4,-12);g.stroke();
    gelBall(-26,-41+Math.sin(t*9)*5,5,'#fff');gelBall(26,-41-Math.sin(t*9)*5,5,'#fff');break;}
  case'hat':{
    g.lineWidth=5;g.strokeStyle='#8fa3b4';g.lineCap='round';g.beginPath();g.moveTo(0,-10);g.lineTo(0,26);g.stroke();
