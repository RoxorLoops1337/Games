<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Drop the Bass - Stained Glass</title>
<style>
html,body{margin:0;height:100%;background:#05030a;overflow:hidden}
canvas{position:absolute;left:50%;top:50%;width:1080px;height:1920px;transform-origin:center center}
</style></head><body><canvas id="c" width="1080" height="1920"></canvas>
<script>
(()=>{
const W=1080,H=1920,PI=Math.PI,TAU=PI*2;
const cv=document.getElementById('c');
let ctx=cv.getContext('2d');const MAIN=ctx;
function fit(){const s=Math.min(innerWidth/W,innerHeight/H);cv.style.transform='translate(-50%,-50%) scale('+s+')';}
addEventListener('resize',fit);fit();
const FONT='Georgia,"DejaVu Serif","Liberation Serif",serif';
const LEAD='#0a0712';let LW=3.4;
function rng(seed){let s=seed>>>0;return()=>{s=(s+0x6D2B79F5)>>>0;let t=s;t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);return((t^t>>>14)>>>0)/4294967296;};}
const hash=x=>{const v=Math.sin(x*12.9898)*43758.5453;return v-Math.floor(v);};
const _rgb={};function rgb(h){return _rgb[h]||(_rgb[h]=[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)]);}
const _mc=new Map();
function mix(a,b,t){const k=a+b+t;let v=_mc.get(k);if(v)return v;const A=rgb(a),B=rgb(b);v='#'+[0,1,2].map(i=>Math.round(A[i]+(B[i]-A[i])*t).toString(16).padStart(2,'0')).join('');_mc.set(k,v);return v;}
function rgba(h,a){const c=rgb(h);return 'rgba('+c[0]+','+c[1]+','+c[2]+','+a+')';}

/* ---------- glass pane core ---------- */
function pane(build,x0,y0,x1,y1,col,o){
  o=o||{};const w=x1-x0,h=y1-y0,cx=(x0+x1)/2,cy=(y0+y1)/2;
  if(col[0]!=='#'){ctx.beginPath();build();ctx.fillStyle=col;ctx.fill();return;}
  const path=()=>{ctx.beginPath();build();};
  path();
  const g=ctx.createRadialGradient(cx-w*.2,cy-h*.25,0,cx,cy,Math.max(w,h)*.72+1);
  g.addColorStop(0,mix(col,'#ffffff',o.hot===undefined?.5:o.hot));g.addColorStop(.5,col);g.addColorStop(1,mix(col,'#06030d',.46));
  ctx.fillStyle=g;
  if(o.glow){ctx.shadowColor=col;ctx.shadowBlur=o.glow;}
  ctx.fill();ctx.shadowBlur=0;ctx.shadowColor='transparent';
  if(!o.flat){
    ctx.save();ctx.clip();
    const k=hash(x0*7.1+y0*3.3+w);
    ctx.lineCap='round';
    ctx.strokeStyle='rgba(255,255,255,.15)';ctx.lineWidth=Math.max(1,Math.min(w,h)*.07);
    ctx.beginPath();const sx=x0+w*(.25+.5*k);ctx.moveTo(sx,y0);ctx.lineTo(sx-h*.45,y1);ctx.stroke();
    ctx.strokeStyle='rgba(0,0,20,.14)';ctx.lineWidth=Math.max(1,Math.min(w,h)*.05);
    ctx.beginPath();const sx2=x0+w*(.6+.3*k);ctx.moveTo(sx2,y0);ctx.lineTo(sx2-h*.4,y1);ctx.stroke();
    if(k>.55){ctx.fillStyle='rgba(255,255,255,.35)';ctx.beginPath();ctx.arc(cx+w*(k-.7),cy+h*.2,Math.max(.8,Math.min(w,h)*.03),0,TAU);ctx.fill();}
    ctx.globalAlpha=.3;ctx.lineWidth=LW*2.8;ctx.strokeStyle=mix(col,'#ffffff',.6);path();ctx.stroke();
    ctx.restore();
  }
  path();ctx.lineJoin='round';ctx.lineWidth=LW*(o.lw||1);ctx.strokeStyle=LEAD;ctx.stroke();
  if(!o.thin){ctx.save();ctx.translate(-.5,-.5);ctx.lineWidth=Math.max(.7,LW*.16);ctx.strokeStyle='rgba(175,175,215,.33)';ctx.stroke();ctx.restore();}
}
function bbox(pts){let a=1e9,b=1e9,c=-1e9,d=-1e9;for(const p of pts){if(p[0]<a)a=p[0];if(p[0]>c)c=p[0];if(p[1]<b)b=p[1];if(p[1]>d)d=p[1];}return[a,b,c,d];}
function P(pts,col,o){const b=bbox(pts);pane(()=>{ctx.moveTo(pts[0][0],pts[0][1]);for(let i=1;i<pts.length;i++)ctx.lineTo(pts[i][0],pts[i][1]);ctx.closePath();},b[0],b[1],b[2],b[3],col,o);
  if(!o||!o.nosolder){ctx.fillStyle=LEAD;for(const p of pts){ctx.beginPath();ctx.arc(p[0],p[1],LW*.6,0,TAU);ctx.fill();}}}
function curve(pts){const n=pts.length;ctx.moveTo(pts[0][0],pts[0][1]);for(let i=0;i<n;i++){const p0=pts[(i-1+n)%n],p1=pts[i],p2=pts[(i+1)%n],p3=pts[(i+2)%n];
  ctx.bezierCurveTo(p1[0]+(p2[0]-p0[0])/6,p1[1]+(p2[1]-p0[1])/6,p2[0]-(p3[0]-p1[0])/6,p2[1]-(p3[1]-p1[1])/6,p2[0],p2[1]);}ctx.closePath();}
function S(pts,col,o){const b=bbox(pts);pane(()=>curve(pts),b[0],b[1],b[2],b[3],col,o);}
function E(cx,cy,rx,ry,col,o){const rot=(o&&o.rot)||0;const m=Math.max(rx,ry);pane(()=>ctx.ellipse(cx,cy,rx,ry,rot,0,TAU),cx-m,cy-m,cx+m,cy+m,col,o);}
function Wd(cx,cy,r0,r1,a0,a1,col,o){
  const am=(a0+a1)/2,pts=[[cx+Math.cos(a0)*r1,cy+Math.sin(a0)*r1],[cx+Math.cos(a1)*r1,cy+Math.sin(a1)*r1],[cx+Math.cos(a0)*r0,cy+Math.sin(a0)*r0],[cx+Math.cos(a1)*r0,cy+Math.sin(a1)*r0],[cx+Math.cos(am)*r1,cy+Math.sin(am)*r1]];const b=bbox(pts);
  pane(()=>{ctx.arc(cx,cy,r1,a0,a1);ctx.arc(cx,cy,r0,a1,a0,true);ctx.closePath();},b[0],b[1],b[2],b[3],col,o);}
function L(pts,w,col){ctx.beginPath();ctx.moveTo(pts[0][0],pts[0][1]);for(let i=1;i<pts.length;i++)ctx.lineTo(pts[i][0],pts[i][1]);ctx.lineJoin='round';ctx.lineCap='round';ctx.lineWidth=(w||1)*LW*.7;ctx.strokeStyle=col||LEAD;ctx.stroke();}
function at(x,y,s,fn,rot,fx){ctx.save();ctx.translate(x,y);if(rot)ctx.rotate(rot);ctx.scale(s*(fx||1),s);const old=LW;LW=3.3/Math.sqrt(s);fn();LW=old;ctx.restore();}
function glint(x,y,r,a){ctx.save();ctx.globalCompositeOperation='lighter';const g=ctx.createRadialGradient(x,y,0,x,y,r);g.addColorStop(0,'rgba(255,250,230,'+a+')');g.addColorStop(1,'rgba(255,200,120,0)');ctx.fillStyle=g;ctx.fillRect(x-r,y-r,r*2,r*2);
  ctx.fillStyle='rgba(255,255,240,'+a+')';ctx.beginPath();ctx.moveTo(x-r*1.3,y);ctx.lineTo(x,y-r*.1);ctx.lineTo(x+r*1.3,y);ctx.lineTo(x,y+r*.1);ctx.fill();
  ctx.beginPath();ctx.moveTo(x,y-r*1.3);ctx.lineTo(x+r*.1,y);ctx.lineTo(x,y+r*1.3);ctx.lineTo(x-r*.1,y);ctx.fill();ctx.restore();}
function glow(x,y,r,col,a){ctx.save();ctx.globalCompositeOperation='lighter';const g=ctx.createRadialGradient(x,y,0,x,y,r);g.addColorStop(0,rgba(col,a));g.addColorStop(1,rgba(col,0));ctx.fillStyle=g;ctx.fillRect(x-r,y-r,r*2,r*2);ctx.restore();}
function txt(s,x,y,size,col,al,lw){ctx.font='900 '+size+'px '+FONT;ctx.textAlign=al||'center';ctx.textBaseline='middle';ctx.lineJoin='round';ctx.lineWidth=lw||size*.24;ctx.strokeStyle=LEAD;ctx.strokeText(s,x,y);ctx.fillStyle=col||'#fff4d6';ctx.fillText(s,x,y);}

/* ---------- voronoi glass mosaic ---------- */
function clipHP(poly,a,b,c){const out=[],n=poly.length;for(let i=0;i<n;i++){const p=poly[i],q=poly[(i+1)%n];const dp=a*p[0]+b*p[1]-c,dq=a*q[0]+b*q[1]-c;if(dp<=0)out.push(p);if((dp<0&&dq>0)||(dp>0&&dq<0)){const t=dp/(dp-dq);out.push([p[0]+(q[0]-p[0])*t,p[1]+(q[1]-p[1])*t]);}}return out;}
function voronoi(x0,y0,x1,y1,n,seed){const R=rng(seed);const cols=Math.max(1,Math.round(Math.sqrt(n*(x1-x0)/(y1-y0)))),rows=Math.max(1,Math.ceil(n/cols));const cw=(x1-x0)/cols,ch=(y1-y0)/rows;const sites=[];
  for(let r=0;r<rows;r++)for(let c=0;c<cols;c++)sites.push([x0+(c+.12+.76*R())*cw,y0+(r+.12+.76*R())*ch]);
  const lim=Math.pow((cw+ch)*1.5,2),out=[];
  for(const s of sites){let poly=[[x0,y0],[x1,y0],[x1,y1],[x0,y1]];for(const o of sites){if(o===s)continue;const dx=o[0]-s[0],dy=o[1]-s[1];if(dx*dx+dy*dy>lim)continue;poly=clipHP(poly,dx,dy,((s[0]+o[0])*dx+(s[1]+o[1])*dy)/2);if(poly.length<3)break;}
    if(poly.length>=3)out.push({site:s,poly});}
  return out;}
function mosaicIn(build,x0,y0,x1,y1,n,seed,pal,o){o=o||{};const cells=voronoi(x0-6,y0-6,x1+6,y1+6,n,seed),R=rng(seed+99);
  ctx.save();ctx.beginPath();build();ctx.clip();
  for(const c of cells){const t=(c.site[1]-y0)/(y1-y0);let col=pal[Math.floor(((R()*.65+t*.35)%1)*pal.length)];if(R()<.22)col=mix(col,'#ffffff',.28);if(R()<.12)col=mix(col,'#000000',.25);
    P(c.poly,col,{nosolder:true,lw:o.lw||.8,hot:.62});}
  ctx.restore();}
function lancetPath(x,y,w,h){const ys=y+w*.866;return()=>{ctx.moveTo(x,y+h);ctx.lineTo(x,ys);ctx.arc(x+w,ys,w,PI,PI*4/3);ctx.arc(x,ys,w,PI*5/3,TAU);ctx.lineTo(x+w,y+h);ctx.closePath();};}
function stoneStroke(build,w){ctx.beginPath();build();ctx.lineJoin='round';ctx.lineWidth=w+6;ctx.strokeStyle=LEAD;ctx.stroke();ctx.lineWidth=w;ctx.strokeStyle='#40365e';ctx.stroke();ctx.lineWidth=w*.35;ctx.strokeStyle='#6a5d92';ctx.translate(-w*.2,-w*.2);ctx.stroke();ctx.translate(w*.2,w*.2);}
function lancetWindow(x,y,w,h,pal,seed,n,bright){
  const b=lancetPath(x,y,w,h);mosaicIn(b,x,y,x+w,y+h,n,seed,pal);
  // blaze
  ctx.save();ctx.beginPath();b();ctx.clip();ctx.globalCompositeOperation='lighter';const cx=x+w/2,cy=y+h*.42;const g=ctx.createRadialGradient(cx,cy,0,cx,cy,w*.95);g.addColorStop(0,'rgba(255,245,215,'+(bright||.55)+')');g.addColorStop(.5,'rgba(255,210,150,'+(bright||.55)*.25+')');g.addColorStop(1,'rgba(255,180,120,0)');ctx.fillStyle=g;ctx.fillRect(x,y,w,h);ctx.restore();
  // tracery
  const cx2=x+w/2,ys=y+w*.866;
  ctx.save();ctx.lineCap='butt';
  stoneStroke(()=>{ctx.moveTo(cx2,y+h);ctx.lineTo(cx2,ys-w*.3);},Math.max(5,w*.035));
  stoneStroke(()=>{ctx.arc(cx2,ys-w*.46,w*.2,0,TAU);},Math.max(4,w*.03));
  for(let i=0;i<4;i++){const a=i*PI/2+PI/4;stoneStroke(()=>{ctx.moveTo(cx2+Math.cos(a)*w*.2,ys-w*.46+Math.sin(a)*w*.2);ctx.lineTo(cx2+Math.cos(a)*w*.34,ys-w*.46+Math.sin(a)*w*.34);},3);}
  stoneStroke(()=>{ctx.moveTo(x+w*.08,ys+h*.0+ (h-w*.866)*.45);ctx.lineTo(x+w*.92,ys+(h-w*.866)*.45);},Math.max(4,w*.025));
  ctx.restore();
  stoneStroke(b,Math.max(9,w*.06));
}
function ashlar(x0,y0,x1,y1,seed,base,bh){const R=rng(seed);ctx.fillStyle=mix(base,'#000000',.4);ctx.fillRect(x0,y0,x1-x0,y1-y0);let y=y0,row=0;
  while(y<y1){const h=bh*(.9+R()*.2);let x=x0-(row%2?bh*.9:0);while(x<x1){const w=bh*(1.4+R()*1.0);const c=mix(base,'#8070b8',.04+R()*.2);const g=ctx.createLinearGradient(0,y,0,y+h);g.addColorStop(0,mix(c,'#ffffff',.09));g.addColorStop(1,mix(c,'#000000',.2));ctx.fillStyle=g;ctx.fillRect(x+1.5,y+1.5,w-3,h-3);x+=w;}y+=h;row++;}}
function rrect(x,y,w,h,r){ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
function heartPts(s,cx,cy){return[[0,10],[-8,2],[-12,-6],[-8,-12],[-2,-11],[0,-7],[2,-11],[8,-12],[12,-6],[8,2]].map(p=>[cx+p[0]*s,cy+p[1]*s]);}
function quatrefoil(cx,cy,r,col,o){const d=r*.5;for(const a of[0,1,2,3]){const x=cx+Math.cos(a*PI/2)*d,y=cy+Math.sin(a*PI/2)*d;E(x,y,r*.5,r*.5,col,o);}P([[cx-d,cy],[cx,cy-d],[cx+d,cy],[cx,cy+d]],col,Object.assign({nosolder:true},o));}

/* ---------- palettes ---------- */
const PAL={cool:['#2457e6','#6a3cff','#14b8d8','#d4247a','#1e90ff','#4a2fbf'],warm:['#ffb21e','#ff6a1a','#e0245e','#ffd54a','#ff8a3a','#c4122f'],green:['#18c47a','#14b8d8','#2457e6','#9dff3a','#7a3cff','#0f9d6a'],
  roxor:['#ff7a1a','#e0245e','#ffb21e','#c4122f','#ffd54a','#ff5a3a'],jas:['#2457e6','#7a3cff','#1e90ff','#16c7c7','#5a2fbf','#c43cff'],jewel:['#e0245e','#ffb21e','#18c47a','#2457e6','#8a3ffc','#14b8d8','#ff7a1a','#e83cc8']};
const SKIN='#f4b88e',SKIN2='#f0aa86',LIME='#9dff3a',PINK='#ff5fb0',GOLD='#ffc83a';
const TIER=['#8fb3ff','#4de3a0','#ffc83a','#ff5fb0','#c06bff'];

/* ---------- path ---------- */
const PATHPTS=[[100,470],[890,470],[890,750],[190,750],[190,1030],[960,1030]];
const SEGL=[];let TOTAL=0;for(let i=0;i<PATHPTS.length-1;i++){const a=PATHPTS[i],b=PATHPTS[i+1];const l=Math.hypot(b[0]-a[0],b[1]-a[1]);SEGL.push(l);TOTAL+=l;}
function posAt(s){s=((s%TOTAL)+TOTAL)%TOTAL;for(let i=0;i<SEGL.length;i++){if(s<=SEGL[i]){const a=PATHPTS[i],b=PATHPTS[i+1],t=s/SEGL[i];return{x:a[0]+(b[0]-a[0])*t,y:a[1]+(b[1]-a[1])*t};}s-=SEGL[i];}return{x:960,y:1030};}
const pathCells=[];for(let c=0;c<6;c++){pathCells.push([c,0]);pathCells.push([c,2]);pathCells.push([c,4]);}pathCells.push([5,1]);pathCells.push([0,3]);
const cellX=c=>190+140*c,cellY=r=>470+140*r;
const SLOTS=[[0,1,'kick',3],[1,1,'snare',2],[2,1,'hat',4],[3,1,'sub',2],[4,1,'mic',3],[1,3,'synth',2],[2,3,'horn',1],[3,3,'scratch',3],[4,3,'cowbell',5],[5,3,null,0]];

/* ---------- static layers ---------- */
let bg,caus;
function glassTitle(txt1,w,h,size,pal,seed){const c=document.createElement('canvas');c.width=w;c.height=h;const g=c.getContext('2d');
  let sz=size;g.font='900 '+sz+'px '+FONT;const m=g.measureText(txt1).width;if(m>w-34)sz*=(w-34)/m;g.font='900 '+sz+'px '+FONT;g.textAlign='center';g.textBaseline='middle';g.lineJoin='round';
  const mk=document.createElement('canvas');mk.width=w;mk.height=h;const mg=mk.getContext('2d');
  const sv=ctx;ctx=mg;const svLW=LW;LW=2.4;const cells=voronoi(0,0,w,h,Math.round(w/11),seed),R=rng(seed);
  for(const cl of cells){let col=pal[Math.floor(R()*pal.length)];if(R()<.3)col=mix(col,'#ffffff',.3);P(cl.poly,col,{nosolder:true,lw:.9,hot:.65});}
  mg.globalCompositeOperation='destination-in';mg.font=g.font;mg.textAlign='center';mg.textBaseline='middle';mg.fillStyle='#ffffff';mg.fillText(txt1,w/2,h/2);
  ctx=sv;LW=svLW;
  g.shadowColor='rgba(255,190,90,.95)';g.shadowBlur=22;g.lineWidth=sz*.2;g.strokeStyle='#e8b04a';g.strokeText(txt1,w/2,h/2);g.shadowBlur=0;
  g.lineWidth=sz*.15;g.strokeStyle=LEAD;g.strokeText(txt1,w/2,h/2);
  g.drawImage(mk,0,0);
  g.globalCompositeOperation='source-atop';g.strokeStyle='rgba(255,255,255,.28)';g.lineWidth=2;g.save();g.translate(-1,-2);g.strokeText(txt1,w/2,h/2);g.restore();
  return c;}
let titleBass,titleDrop,titleStyle;
const HEROX=[30,788],HEROW=262,HEROY=1298,HEROH=414;
function buildStatic(){
  bg=document.createElement('canvas');bg.width=W;bg.height=H;ctx=bg.getContext('2d');
  let g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#0e0a1e');g.addColorStop(1,'#07040f');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  /* ===== battle panel ===== */
  ctx.save();ctx.beginPath();rrect(16,16,1048,1250,34);ctx.clip();
  ashlar(16,16,1064,410,11,'#241c3c',34);
  // hud band
  g=ctx.createLinearGradient(0,16,0,118);g.addColorStop(0,'#2c2250');g.addColorStop(1,'#171030');ctx.fillStyle=g;ctx.fillRect(16,16,1048,102);
  for(let x=16;x<1064;x+=58){const b=lancetPath(x+3,78,52,40);ctx.beginPath();b();ctx.fillStyle='#0d0919';ctx.fill();ctx.lineWidth=3;ctx.strokeStyle='#5a4a86';ctx.stroke();ctx.lineWidth=1.2;ctx.strokeStyle=LEAD;ctx.stroke();}
  ctx.fillStyle='#d9a12e';ctx.fillRect(16,116,1048,4);ctx.fillStyle=LEAD;ctx.fillRect(16,120,1048,3);
  // windows
  const wins=[[108,132,196,PAL.cool,5,38],[420,128,240,PAL.warm,9,60],[776,132,196,PAL.green,13,38]];
  for(const wd of wins){lancetWindow(wd[0],wd[1],wd[2],270,wd[3],wd[4],wd[5],.5);}
  // glow halos
  ctx.globalCompositeOperation='lighter';for(const wd of wins){const cx=wd[0]+wd[2]/2,cy=wd[1]+150;const rg=ctx.createRadialGradient(cx,cy,10,cx,cy,wd[2]*1.2);rg.addColorStop(0,rgba(wd[3][0],.38));rg.addColorStop(1,rgba(wd[3][0],0));ctx.fillStyle=rg;ctx.fillRect(cx-wd[2]*1.3,cy-wd[2]*1.3,wd[2]*2.6,wd[2]*2.6);}ctx.globalCompositeOperation='source-over';
  // stage floor
  for(let x=16;x<1064;x+=60){const a=(x/60)%2;P([[x,396],[x+60,396],[x+60,414],[x,414]],a?'#b87a2a':'#d99a3a',{nosolder:true,lw:.7,hot:.35});}
  ctx.fillStyle=LEAD;ctx.fillRect(16,412,1048,4);
  for(let x=70;x<1064;x+=120){E(x,402,5,4,'#ffe9a0',{lw:.5});}
  // floor
  ashlar(16,416,1064,1266,23,'#15102a',70);
  // shadowed floor tint
  g=ctx.createLinearGradient(0,416,0,1266);g.addColorStop(0,'rgba(20,10,50,.2)');g.addColorStop(1,'rgba(5,2,15,.55)');ctx.fillStyle=g;ctx.fillRect(16,416,1048,850);
  // side walls with tiny windows
  for(const sx of[24,1006]){for(let k=0;k<4;k++){lancetWindow(sx,556+k*134,50,106,PAL.jewel,30+k+sx,10,.3);}}
  // base area decoration (under hype row)
  ctx.fillStyle='#0c0818';ctx.fillRect(16,1098,1048,168);ctx.fillStyle='#d9a12e';ctx.fillRect(16,1096,1048,3);ctx.fillStyle=LEAD;ctx.fillRect(16,1099,1048,3);
  for(let x=16;x<1064;x+=72){quatrefoil(x+36,1236,16,'#201a44',{lw:.6,thin:1,hot:.2});}
  // path tiles
  for(const pc of pathCells){const cx=cellX(pc[0]),cy=cellY(pc[1]);
    ctx.save();ctx.beginPath();ctx.rect(cx-68,cy-68,136,136);ctx.clip();
    const R=rng(cx*7+cy);for(let j=-1;j<5;j++)for(let i=-1;i<5;i++){const ox=cx-68+i*34+(j%2?17:0),oy=cy-68+j*34;
      const cols=['#e8b050','#d8903a','#e0a048','#c97e34'];P([[ox,oy-17],[ox+17,oy],[ox,oy+17],[ox-17,oy]],cols[Math.floor(R()*4)],{nosolder:true,lw:.55,hot:.35,thin:1});}
    ctx.restore();
    ctx.beginPath();ctx.rect(cx-68,cy-68,136,136);ctx.lineWidth=7;ctx.strokeStyle=LEAD;ctx.stroke();ctx.lineWidth=2;ctx.strokeStyle='#7a5a9a';ctx.stroke();}
  // slots
