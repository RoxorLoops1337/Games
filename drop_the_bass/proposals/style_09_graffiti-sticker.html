<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Drop the Bass Graffiti Sticker</title>
<style>
html,body{margin:0;height:100%;background:#120a1c}
body{display:flex;align-items:center;justify-content:center;overflow:hidden}
canvas{display:block;width:min(100vw,calc(100vh*1080/1920));height:auto;aspect-ratio:1080/1920}
</style>
</head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<script>
'use strict';
/* Style 09 Graffiti Sticker: brick wall, spray outlines with drips, die-cut glossy stickers with white borders,
   stencil arrows, wheatpaste posters, fat bubble lettering. All procedural canvas. Palette:
   ink #1b1228, pink #ff5fb0, lime #9dff3a, cyan #29d9ff, yellow #ffd23a, orange #ff7a1a */
const W = 1080, H = 1920;
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const INK = '#1b1228', PINK = '#ff5fb0', LIME = '#9dff3a', CYAN = '#29d9ff', YEL = '#ffd23a', ORG = '#ff7a1a', PAPER = '#fff4dc', RED = '#ff4a4a', PURP = '#7b4dff';
const FONT = '"Arial Black","Inter","Impact","DejaVu Sans",sans-serif';
const HAND = 'italic 900 28px "Arial Black","Inter","DejaVu Sans",sans-serif';
function rng(seed) { let s = seed >>> 0; return () => { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; }; }
function mk(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; }
const TAU = Math.PI * 2;

/* ---------- shape helpers ---------- */
function shp(g, fill, lw = 6, shade = true) {
  g.save(); g.fillStyle = fill; g.fill();
  if (shade) {
    g.clip();
    const gr = g.createLinearGradient(-70, -70, 70, 70);
    gr.addColorStop(0, 'rgba(255,255,255,.42)'); gr.addColorStop(.45, 'rgba(255,255,255,0)'); gr.addColorStop(1, 'rgba(10,0,30,.34)');
    g.fillStyle = gr; g.fillRect(-300, -300, 600, 600);
  }
  g.restore();
  if (lw) { g.lineWidth = lw; g.strokeStyle = INK; g.lineJoin = 'round'; g.lineCap = 'round'; g.stroke(); }
}
function rr(g, x, y, w, h, r) { g.beginPath(); g.roundRect(x, y, w, h, r); }
function ell(g, x, y, rx, ry, rot = 0) { g.beginPath(); g.ellipse(x, y, rx, ry, rot, 0, TAU); }
function poly(g, pts) { g.beginPath(); pts.forEach((p, i) => i ? g.lineTo(p[0], p[1]) : g.moveTo(p[0], p[1])); g.closePath(); }
function line(g, pts, col, lw) { g.beginPath(); pts.forEach((p, i) => i ? g.lineTo(p[0], p[1]) : g.moveTo(p[0], p[1])); g.strokeStyle = col; g.lineWidth = lw; g.lineCap = 'round'; g.lineJoin = 'round'; g.stroke(); }
function star(g, x, y, r1, r2, n, rot = 0) {
  g.beginPath();
  for (let i = 0; i < n * 2; i++) { const a = rot + i * Math.PI / n, r = i % 2 ? r2 : r1; i ? g.lineTo(x + Math.cos(a) * r, y + Math.sin(a) * r) : g.moveTo(x + Math.cos(a) * r, y + Math.sin(a) * r); }
  g.closePath();
}
function heart(g, x, y, s) {
  g.beginPath(); g.moveTo(x, y + s * .9);
  g.bezierCurveTo(x - s * 1.4, y + s * .1, x - s * .9, y - s * 1, x, y - s * .35);
  g.bezierCurveTo(x + s * .9, y - s * 1, x + s * 1.4, y + s * .1, x, y + s * .9); g.closePath();
}
function sparkle(g, x, y, r, col = '#fff') {
  g.save(); g.translate(x, y); g.fillStyle = col; g.beginPath();
  g.moveTo(0, -r); g.quadraticCurveTo(r * .12, -r * .12, r, 0); g.quadraticCurveTo(r * .12, r * .12, 0, r);
  g.quadraticCurveTo(-r * .12, r * .12, -r, 0); g.quadraticCurveTo(-r * .12, -r * .12, 0, -r); g.fill(); g.restore();
}

/* ---------- sticker cache: die-cut white border, soft shadow, gloss ---------- */
function sticker(w, h, draw, b = 9) {
  const pad = b + 10, cw = w + pad * 2, ch = h + pad * 2;
  const art = mk(cw, ch), ag = art.getContext('2d'); ag.translate(cw / 2, ch / 2); draw(ag);
  const sil = mk(cw, ch), sg = sil.getContext('2d'); sg.drawImage(art, 0, 0); sg.globalCompositeOperation = 'source-in'; sg.fillStyle = '#fff'; sg.fillRect(0, 0, cw, ch);
  const bord = mk(cw, ch), bg = bord.getContext('2d');
  for (let r of [b, b * .66, b * .33]) for (let i = 0; i < 36; i++) { const a = i / 36 * TAU; bg.drawImage(sil, Math.cos(a) * r, Math.sin(a) * r); }
  bg.drawImage(sil, 0, 0);
  const shd = mk(cw, ch), hg = shd.getContext('2d'); hg.drawImage(bord, 0, 0); hg.globalCompositeOperation = 'source-in'; hg.fillStyle = 'rgba(8,0,20,.7)'; hg.fillRect(0, 0, cw, ch);
  const gl = mk(cw, ch), gg = gl.getContext('2d'); gg.drawImage(art, 0, 0); gg.globalCompositeOperation = 'source-atop';
  const gr = gg.createLinearGradient(0, 0, cw, ch * .9);
  gr.addColorStop(0, 'rgba(255,255,255,.5)'); gr.addColorStop(.32, 'rgba(255,255,255,.12)'); gr.addColorStop(.36, 'rgba(255,255,255,.4)'); gr.addColorStop(.43, 'rgba(255,255,255,0)'); gr.addColorStop(1, 'rgba(255,255,255,0)');
  gg.fillStyle = gr; gg.fillRect(0, 0, cw, ch);
  const out = mk(cw, ch), og = out.getContext('2d');
  og.filter = 'blur(5px)'; og.globalAlpha = .55; og.drawImage(shd, 3, 7); og.filter = 'none'; og.globalAlpha = 1;
  og.drawImage(bord, 0, 0);
  // faint grey inner edge on the white border
  og.globalAlpha = .12; og.drawImage(shd, 0, 0); og.globalAlpha = 1;
  og.drawImage(sil, 0, 0); og.drawImage(bord, 0, 0);
  og.drawImage(art, 0, 0); og.drawImage(gl, 0, 0);
  return { c: out, ox: cw / 2, oy: ch / 2 };
}
function put(st, x, y, rot = 0, sc = 1, a = 1) {
  ctx.save(); ctx.translate(x, y); ctx.rotate(rot); ctx.scale(sc, sc); ctx.globalAlpha = a; ctx.drawImage(st.c, -st.ox, -st.oy); ctx.restore();
}

/* ---------- spray, drips, grain ---------- */
function speckle(g, x, y, r, n, col, seed, a = .6) {
  const R = rng(seed); g.save(); g.fillStyle = col; g.globalAlpha = a;
  for (let i = 0; i < n; i++) { const an = R() * TAU, d = r * Math.pow(R(), .6); g.fillRect(x + Math.cos(an) * d, y + Math.sin(an) * d, 1.6 + R() * 1.6, 1.6 + R() * 1.6); }
  g.restore();
}
function drips(g, x0, x1, y, col, seed, n = 5, maxL = 60) {
  const R = rng(seed); g.save(); g.strokeStyle = col; g.fillStyle = col; g.lineCap = 'round';
  for (let i = 0; i < n; i++) {
    const x = x0 + (x1 - x0) * (i + .2 + R() * .6) / n, L = 14 + R() * maxL, w = 5 + R() * 4;
    g.lineWidth = w; g.beginPath(); g.moveTo(x, y); g.lineTo(x, y + L); g.stroke();
    g.beginPath(); g.arc(x, y + L, w * .85, 0, TAU); g.fill();
  }
  g.restore();
}
let grain;
function makeGrain() {
  grain = mk(256, 256); const g = grain.getContext('2d'), R = rng(77);
  for (let i = 0; i < 2600; i++) { g.fillStyle = R() < .5 ? 'rgba(0,0,0,.35)' : 'rgba(255,255,255,.25)'; g.fillRect(R() * 256, R() * 256, 1 + R() * 2, 1 + R() * 2); }
}
function grainOver(x, y, w, h, a) { ctx.save(); ctx.globalAlpha = a; ctx.fillStyle = ctx.createPattern(grain, 'repeat'); ctx.beginPath(); ctx.rect(x, y, w, h); ctx.fill(); ctx.restore(); }

/* ---------- lettering ---------- */
function bubble(g, text, x, y, size, fill, o = {}) {
  g.save(); g.font = `900 ${size}px ${FONT}`; g.textAlign = o.align || 'center'; g.textBaseline = 'middle'; g.lineJoin = 'round'; g.lineCap = 'round';
  g.translate(x, y); if (o.rot) g.rotate(o.rot);
  const ex = o.extrude === undefined ? size * .14 : o.extrude;
  if (o.glow) { g.shadowColor = o.glow; g.shadowBlur = size * .5; g.strokeStyle = o.glow; g.lineWidth = size * .3; g.strokeText(text, 0, 0); g.shadowBlur = 0; }
  for (let i = ex; i >= 1; i -= 1) { g.strokeStyle = INK; g.lineWidth = size * .26; g.strokeText(text, i * .55, i * .9); }
  for (let i = ex; i >= 1; i -= 2) { g.fillStyle = o.shadow || 'rgba(20,0,40,.9)'; g.fillText(text, i * .55, i * .9); }
  g.strokeStyle = INK; g.lineWidth = size * .26; g.strokeText(text, 0, 0);
  g.strokeStyle = o.rim || '#fff'; g.lineWidth = size * .15; g.strokeText(text, 0, 0);
  g.fillStyle = fill; g.fillText(text, 0, 0);
  g.save(); g.globalCompositeOperation = 'source-atop';
  g.restore();
  // top shine stripe
  g.save(); g.beginPath(); g.rect(-size * 20, -size * .5, size * 40, size * .32); g.clip(); g.globalAlpha = .38; g.fillStyle = '#fff'; g.fillText(text, 0, 0); g.restore();
  g.restore();
}
function marker(g, text, x, y, size, col, rot = 0, o = {}) {
  g.save(); g.translate(x, y); g.rotate(rot); g.font = `italic 900 ${size}px ${FONT}`; g.textAlign = o.align || 'center'; g.textBaseline = 'middle'; g.lineJoin = 'round';
  g.strokeStyle = o.out || INK; g.lineWidth = size * .22; g.strokeText(text, 0, 0); g.fillStyle = col; g.fillText(text, 0, 0); g.restore();
}
const stencilCache = {};
function stencilText(text, size, col) {
  const k = text + size + col; if (stencilCache[k]) return stencilCache[k];
  const g0 = mk(10, 10).getContext('2d'); g0.font = `900 ${size}px ${FONT}`; const w = Math.ceil(g0.measureText(text).width) + 20, h = size + 20;
  const c = mk(w, h), g = c.getContext('2d'); g.font = `900 ${size}px ${FONT}`; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillStyle = col; g.fillText(text, w / 2, h / 2 + 2);
  g.globalCompositeOperation = 'destination-out'; const bw = Math.max(2, size * .07);
  for (let x = 6; x < w; x += size * .62) g.fillRect(x, 0, bw, h);
  g.fillRect(0, h / 2 - size * .02, w, bw);
  return stencilCache[k] = c;
}

/* ---------- backgrounds ---------- */
function brickWall(x0, y0, w, h, seed, pal) {
  const R = rng(seed); ctx.save(); ctx.beginPath(); ctx.rect(x0, y0, w, h); ctx.clip();
  ctx.fillStyle = pal.mortar; ctx.fillRect(x0, y0, w, h);
  const bh = 36, bw = 92;
  for (let r = 0, y = y0 - 8; y < y0 + h; r++, y += bh) {
    for (let x = x0 - (r % 2 ? bw / 2 : 0) - 10; x < x0 + w; x += bw) {
      const c = pal.cols[Math.floor(R() * pal.cols.length)];
      ctx.fillStyle = c; ctx.beginPath(); ctx.roundRect(x + 2, y + 2, bw - 4, bh - 4, 3); ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,.12)'; ctx.fillRect(x + 4, y + 3, bw - 8, 4);
      ctx.fillStyle = 'rgba(0,0,0,.2)'; ctx.fillRect(x + 4, y + bh - 8, bw - 8, 4);
      if (R() < .25) { ctx.fillStyle = 'rgba(0,0,0,.16)'; ctx.fillRect(x + 6 + R() * 50, y + 8 + R() * 14, 10 + R() * 22, 4 + R() * 6); }
    }
  }
  const gr = ctx.createRadialGradient(x0 + w / 2, y0 + h * .45, h * .15, x0 + w / 2, y0 + h * .5, h * .85);
  gr.addColorStop(0, 'rgba(255,200,140,.18)'); gr.addColorStop(1, 'rgba(8,0,20,.62)');
  ctx.fillStyle = gr; ctx.fillRect(x0, y0, w, h);
  grainOver(x0, y0, w, h, .5);
  ctx.restore();
}
function paper(x, y, w, h, rot, seed, col, drawInner, tape = true) {
  const R = rng(seed); ctx.save(); ctx.translate(x + w / 2, y + h / 2); ctx.rotate(rot); ctx.translate(-w / 2, -h / 2);
  // torn polygon
  const pts = []; const n = 22;
  for (let i = 0; i <= n; i++) pts.push([w * i / n, -R() * 5]);
  for (let i = 1; i <= 12; i++) pts.push([w + R() * 5, h * i / 12]);
  for (let i = n; i >= 0; i--) pts.push([w * i / n, h + R() * 5]);
  for (let i = 11; i >= 1; i--) pts.push([-R() * 5, h * i / 12]);
  ctx.shadowColor = 'rgba(0,0,0,.5)'; ctx.shadowBlur = 14; ctx.shadowOffsetY = 6;
  poly(ctx, pts); ctx.fillStyle = col; ctx.fill(); ctx.shadowColor = 'transparent';
  ctx.save(); poly(ctx, pts); ctx.clip();
  const gr = ctx.createLinearGradient(0, 0, w, h);
  gr.addColorStop(0, 'rgba(255,255,255,.28)'); gr.addColorStop(.3, 'rgba(0,0,0,.08)'); gr.addColorStop(.55, 'rgba(255,255,255,.18)'); gr.addColorStop(.8, 'rgba(0,0,0,.14)'); gr.addColorStop(1, 'rgba(0,0,0,.22)');
  ctx.fillStyle = gr; ctx.fillRect(0, 0, w, h);
  drawInner(ctx, w, h);
  for (let i = 0; i < 6; i++) { ctx.strokeStyle = 'rgba(0,0,0,.1)'; ctx.lineWidth = 2; ctx.beginPath(); const yy = R() * h; ctx.moveTo(0, yy); ctx.lineTo(w, yy + (R() - .5) * 60); ctx.stroke(); }
  grainOver(0, 0, w, h, .45);
  ctx.restore();
  if (tape) { for (const [tx, ty, tr] of [[w * .15, -4, -.4], [w * .85, h + 2, -.4]]) { ctx.save(); ctx.translate(tx, ty); ctx.rotate(tr); ctx.fillStyle = 'rgba(255,236,170,.75)'; ctx.fillRect(-30, -11, 60, 22); ctx.strokeStyle = 'rgba(0,0,0,.2)'; ctx.strokeRect(-30, -11, 60, 22); ctx.restore(); } }
  ctx.restore();
}
function halftone(g, w, h, col, step, rmax, dir = 0) {
  g.fillStyle = col;
  for (let y = 0; y < h; y += step) for (let x = ((y / step) % 2) * step / 2; x < w; x += step) {
    const t = dir ? 1 - x / w : y / h; const r = rmax * t; if (r > .5) { g.beginPath(); g.arc(x, y, r, 0, TAU); g.fill(); }
  }
}
function tag(g, text, x, y, size, col, rot) { // fast marker tag with swoosh underline and drips
  marker(g, text, x, y, size, col, rot, { out: 'rgba(10,0,20,.55)' });
  g.save(); g.translate(x, y); g.rotate(rot); g.strokeStyle = col; g.lineWidth = size * .12; g.lineCap = 'round';
  g.beginPath(); g.moveTo(-size * 2, size * .62); g.quadraticCurveTo(0, size * .95, size * 2.1, size * .5); g.stroke();
  drips(g, -size * 1.4, size * 1.4, size * .6, col, text.length * 11, 3, size * .9); g.restore();
}

/* ---------- turrets (drawn at origin, about +-70) ---------- */
const T = {};
T.kick = g => {
  rr(g, -15, -78, 30, 54, 6); shp(g, '#4a4458', 6);
  rr(g, -19, -84, 38, 18, 6); shp(g, YEL, 5);
  ell(g, 0, 16, 56, 54); shp(g, '#d8d4e6', 6);
  ell(g, 0, 16, 46, 44); shp(g, RED, 5);
  star(g, 0, 16, 26, 11, 5, -Math.PI / 2); shp(g, YEL, 4, false);
  for (let i = 0; i < 8; i++) { const a = i / 8 * TAU; rr(g, Math.cos(a) * 50 - 4, Math.sin(a) * 48 + 12, 8, 8, 2); shp(g, '#fff', 3, false); }
};
T.snare = g => {
  rr(g, -58, -6, 116, 56, 12); shp(g, '#f6e7c4', 6);
  for (let i = -3; i <= 3; i++) { rr(g, i * 15 - 3, 4, 6, 36, 3); shp(g, '#b9a77c', 3, false); }
  ell(g, 0, -6, 58, 22); shp(g, '#fff', 6);
  ell(g, 0, -6, 36, 11); shp(g, '#e6e0f0', 2, false);
  g.save(); g.rotate(-.75); rr(g, -4, -90, 14, 64, 6); shp(g, LIME, 5); g.restore();
  g.save(); g.rotate(.75); rr(g, -10, -90, 14, 64, 6); shp(g, PINK, 5); g.restore();
  line(g, [[-50, 52], [-30, 60], [-10, 52], [10, 60], [30, 52], [50, 60]], RED, 5);
};
T.hat = g => {
  rr(g, -6, 6, 12, 64, 4); shp(g, '#8c86a0', 5);
  line(g, [[0, 66], [-34, 78]], INK, 7); line(g, [[0, 66], [34, 78]], INK, 7);
  for (const [a, y] of [[-.34, -6], [0, 6]]) { g.save(); g.translate(0, y); }
  g.restore(); g.restore();
  g.save(); g.translate(0, 8); ell(g, 0, 0, 60, 16); shp(g, '#e0a800', 6); g.restore();
  for (let i = -1; i <= 1; i++) { g.save(); g.translate(i * 22, -14); rr(g, -8, -52, 16, 56, 6); shp(g, '#4a4458', 5); rr(g, -10, -58, 20, 12, 4); shp(g, ORG, 4); g.restore(); }
  g.save(); g.translate(0, -12); ell(g, 0, 0, 64, 18); shp(g, YEL, 6); ell(g, -12, -3, 22, 5); g.fillStyle = 'rgba(255,255,255,.7)'; g.fill(); g.restore();
};
T.sub = g => {
  rr(g, -54, -64, 108, 128, 16); shp(g, '#3a2a5c', 6);
  ell(g, 0, 22, 42, 42); shp(g, '#1d1432', 6);
  ell(g, 0, 22, 34, 34); g.lineWidth = 4; g.strokeStyle = CYAN; g.stroke();
  ell(g, 0, 22, 22, 22); shp(g, '#2d2250', 4, false); ell(g, 0, 22, 9, 9); shp(g, CYAN, 3, false);
  ell(g, 0, -34, 14, 14); shp(g, '#1d1432', 5); ell(g, 0, -34, 6, 6); g.fillStyle = PINK; g.fill();
  for (const sx of [-1, 1]) { g.beginPath(); g.arc(0, 22, 52 + 0, sx > 0 ? -.5 : Math.PI - .5, sx > 0 ? .5 : Math.PI + .5); g.strokeStyle = CYAN; g.lineWidth = 4; g.stroke(); }
};
T.mic = g => {
  poly(g, [[-12, 6], [12, 6], [8, 66], [-8, 66]]); shp(g, '#2b2540', 5);
  rr(g, -13, 20, 26, 12, 4); shp(g, PINK, 4, false);
  ell(g, 0, -22, 32, 32); shp(g, '#c9c3d8', 6);
  for (let i = -3; i <= 3; i++) { line(g, [[i * 9, -50], [i * 9, 6]], 'rgba(40,20,70,.35)', 2); line(g, [[-30, -22 + i * 9], [30, -22 + i * 9]], 'rgba(40,20,70,.35)', 2); }
  ell(g, 0, -62, 16, 12); shp(g, RED, 5); g.fillStyle = '#fff'; g.fillRect(-4, -68, 5, 5);
  for (let i = 1; i <= 2; i++) { g.beginPath(); g.arc(0, -22, 40 + i * 12, -.9, .9); g.strokeStyle = PINK; g.lineWidth = 5; g.lineCap = 'round'; g.stroke(); g.beginPath(); g.arc(0, -22, 40 + i * 12, Math.PI - .9, Math.PI + .9); g.stroke(); }
};
T.synth = g => {
  rr(g, -64, -34, 128, 88, 12); shp(g, PURP, 6);
  rr(g, -56, -26, 112, 28, 6); shp(g, '#1d1432', 4, false);
  for (let i = 0; i < 4; i++) { ell(g, -40 + i * 14, -12, 5, 5); shp(g, [PINK, LIME, YEL, CYAN][i], 3, false); }
  line(g, [[6, -12], [14, -22], [22, -4], [30, -20], [38, -8], [46, -14]], LIME, 4);
  rr(g, -56, 8, 112, 38, 4); g.fillStyle = '#fff'; g.fill(); g.lineWidth = 4; g.strokeStyle = INK; g.stroke();
  for (let i = 1; i < 8; i++) line(g, [[-56 + i * 14, 8], [-56 + i * 14, 46]], INK, 3);
  for (const i of [1, 2, 4, 5, 6]) { rr(g, -56 + i * 14 - 5, 8, 10, 22, 2); g.fillStyle = INK; g.fill(); }
  for (const sx of [-1, 1]) { rr(g, sx * 50 - 7, -72, 14, 40, 5); shp(g, '#4a4458', 5); rr(g, sx * 50 - 9, -76, 18, 10, 4); shp(g, CYAN, 4); }
};
T.horn = g => {
  poly(g, [[-14, -6], [14, -6], [58, -68], [-58, -68]]); shp(g, '#e8e2f2', 6);
  ell(g, 0, -68, 58, 14); shp(g, '#ff9b9b', 6); ell(g, 0, -68, 40, 8); g.fillStyle = '#7a1d1d'; g.fill();
  for (let i = 0; i < 3; i++) line(g, [[-8 + i * 8, -10 - i * 2], [-26 + i * 26, -60]], 'rgba(120,20,20,.35)', 3);
  rr(g, -34, -10, 68, 70, 14); shp(g, RED, 6);
  rr(g, -34, 14, 68, 26, 0); g.fillStyle = '#fff'; g.fill(); g.lineWidth = 3; g.strokeStyle = INK; g.stroke();
  star(g, 0, 27, 11, 5, 5, -Math.PI / 2); g.fillStyle = ORG; g.fill();
  rr(g, -10, 54, 20, 12, 4); shp(g, '#4a4458', 4);
  rr(g, 22, -2, 14, 18, 4); shp(g, YEL, 4);
};
T.scratch = g => {
  rr(g, -62, -54, 124, 118, 14); shp(g, '#5a5470', 6);
  ell(g, -6, 8, 50, 50); shp(g, '#17111f', 6);
  for (const r of [42, 34, 26]) { g.beginPath(); g.arc(-6, 8, r, 0, TAU); g.strokeStyle = 'rgba(255,255,255,.14)'; g.lineWidth = 2; g.stroke(); }

function burstDraw(col) { return g => { star(g, 0, 0, 40, 20, 9, .2); shp(g, col, 5); star(g, 0, 0, 22, 12, 7, .5); g.fillStyle = '#fff'; g.globalAlpha = .7; g.fill(); g.globalAlpha = 1; }; }

/* ---------- scene layout ---------- */
const GX = 50, GY = 200, TS = 140;
const tileC = (c, r) => [GX + TS * c + TS / 2, GY + TS * r + TS / 2];
const PATH = [[-40, 410], [960, 410], [960, 690], [40, 690], [40, 1000]];
const SEG = []; let PL = 0; for (let i = 0; i < PATH.length - 1; i++) { const a = PATH[i], b = PATH[i + 1], l = Math.hypot(b[0] - a[0], b[1] - a[1]); SEG.push([a, b, l, PL]); PL += l; }
function pathPos(s) { s = Math.max(0, Math.min(PL - 1, s)); for (const [a, b, l, o] of SEG) if (s <= o + l) { const u = (s - o) / l; return [a[0] + (b[0] - a[0]) * u, a[1] + (b[1] - a[1]) * u]; } return PATH[PATH.length - 1]; }

const TURRETS = [
  [0, 0, 'kick', 2], [1, 0, 'hat', 3], [3, 0, 'sub', 4], [4, 0, 'mic', 1], [5, 0, 'synth', 2], [6, 0, 'horn', 3],
  [0, 2, 'scratch', 2], [1, 2, 'cowbell', 3], [2, 2, 'snare', 1], [4, 2, 'kick', 5], [5, 2, 'hat', 2],
  [0, 4, 'horn', 1], [1, 4, 'sub', 2], [3, 4, 'synth', 3], [4, 4, 'snare', 4], [5, 4, 'cowbell', 1], [6, 4, 'mic', 2]
];
const EMPTY = [[2, 0], [3, 2], [2, 4]];
const ENEMIES = [ // type, path offset
  ['fuzz', 150], ['zip', 330], ['brick', 520], ['drone', 700], ['leech', 880], ['mute', 1060], ['golden', 1240], ['fuzz', 1440], ['boss', 1700], ['zip', 1990]
];
const TCOL = { kick: 3, snare: 0, hat: 3, sub: 2, mic: 0, synth: 1, horn: 4, scratch: 1, cowbell: 3 };

/* ---------- drawing the phone battle screen ---------- */
function bar(x, y, w, h, frac, col, bg = '#2a1b3d') {
  ctx.save(); ctx.beginPath(); ctx.roundRect(x, y, w, h, h / 2); ctx.fillStyle = bg; ctx.fill();
  ctx.save(); ctx.clip(); ctx.fillStyle = col; ctx.fillRect(x, y, w * frac, h);
  ctx.fillStyle = 'rgba(255,255,255,.42)'; ctx.fillRect(x, y + 3, w * frac, h * .28);

}
function pill(x, y, w, h, col) { ctx.save(); ctx.beginPath(); ctx.roundRect(x, y, w, h, h / 2); ctx.fillStyle = col; ctx.fill(); ctx.lineWidth = 6; ctx.strokeStyle = INK; ctx.stroke(); ctx.restore(); }

const hudStickers = {};
function hudSticker(key, w, h, draw) { return hudStickers[key] || (hudStickers[key] = sticker(w, h, draw, 9)); }

function drawBattle(t) {

  ctx.fillStyle = 'rgba(0,0,0,.4)'; ctx.beginPath(); ctx.ellipse(0, 40, 470, 20, 0, 0, TAU); ctx.fill();
  ctx.beginPath(); ctx.roundRect(-450, -14, 900, 48, 14); ctx.fillStyle = ORG; ctx.fill(); ctx.lineWidth = 7; ctx.strokeStyle = INK; ctx.stroke();
  ctx.save(); ctx.clip(); ctx.fillStyle = INK; for (let x = -460; x < 460; x += 60) { ctx.beginPath(); ctx.moveTo(x, -14); ctx.lineTo(x + 30, -14); ctx.lineTo(x + 10, 34); ctx.lineTo(x - 20, 34); ctx.fill(); } ctx.restore();

/* ---------- static layers ---------- */
let wallLayer, sheetLayer;
function buildLayers() {
