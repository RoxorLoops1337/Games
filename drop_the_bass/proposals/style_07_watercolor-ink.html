<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Drop the Bass - Watercolor Ink</title>
<style>
html,body{margin:0;height:100%;background:#e9dcc0}
body{display:flex;align-items:center;justify-content:center;overflow:hidden}
canvas{display:block;width:min(100vw,56.25vh);height:auto}
</style></head><body>
<canvas id="c" width="1080" height="1920"></canvas>
<script>
"use strict";
/* Drop the Bass : style 07 watercolor-ink storybook. All procedural, seeded, no external requests. */
const W=1080,H=1920;
const main=document.getElementById('c'); const mctx=main.getContext('2d');
let ctx=mctx, S=1, sc=1;
const INK='#2b2540', PAPER='#f5ebd4';
const FONT='italic 700 SIZEpx "Bitstream Charter","FreeSerif","Caladea","Georgia",serif';
const nx=()=>sc++;
function mb(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const hx=c=>[parseInt(c.slice(1,3),16),parseInt(c.slice(3,5),16),parseInt(c.slice(5,7),16)];
const rgba=(c,a)=>{const [r,g,b]=hx(c);return `rgba(${r},${g},${b},${a})`};
const dk=(c,k)=>{const [r,g,b]=hx(c);return '#'+[r,g,b].map(v=>Math.max(0,Math.min(255,Math.round(v*k))).toString(16).padStart(2,'0')).join('')};
const mix=(a,b,k)=>{const A=hx(a),B=hx(b);return '#'+A.map((v,i)=>Math.round(v+(B[i]-v)*k).toString(16).padStart(2,'0')).join('')};

/* ---------- grain ---------- */
function noiseCanvas(n,scale,lo,hi,seed,alphaMode){
  const c=document.createElement('canvas');c.width=c.height=n*scale;
  const g=c.getContext('2d');const r=mb(seed);const im=g.createImageData(n,n);
  for(let i=0;i<n*n;i++){const v=lo+r()*(hi-lo);
    if(alphaMode){im.data[i*4]=70;im.data[i*4+1]=50;im.data[i*4+2]=30;im.data[i*4+3]=(255-v)}
    else{im.data[i*4]=v;im.data[i*4+1]=v-4;im.data[i*4+2]=v-10;im.data[i*4+3]=255}}
  const t=document.createElement('canvas');t.width=t.height=n;t.getContext('2d').putImageData(im,0,0);
  g.imageSmoothingEnabled=scale<3?false:true;g.drawImage(t,0,0,n*scale,n*scale);return c;
}
const grainPig=noiseCanvas(64,2,196,255,7,false);
const grainPaper=noiseCanvas(128,2,226,256,11,true);
function pigPat(){return ctx._p||(ctx._p=ctx.createPattern(grainPig,'repeat'))}

/* ---------- geometry ---------- */
function jit(p,amt,seed){const r=mb(seed*7919+11),a=amt/S;return p.map(q=>[q[0]+(r()-.5)*2*a,q[1]+(r()-.5)*2*a])}
function path(p,closed=true,sharp=false){
  const n=p.length;ctx.beginPath();
  if(sharp){ctx.moveTo(p[0][0],p[0][1]);for(let i=1;i<n;i++)ctx.lineTo(p[i][0],p[i][1]);if(closed)ctx.closePath();return}
  if(closed){ctx.moveTo((p[n-1][0]+p[0][0])/2,(p[n-1][1]+p[0][1])/2);
    for(let i=0;i<n;i++){const a=p[i],b=p[(i+1)%n];ctx.quadraticCurveTo(a[0],a[1],(a[0]+b[0])/2,(a[1]+b[1])/2)}ctx.closePath()}
  else{ctx.moveTo(p[0][0],p[0][1]);for(let i=1;i<n-1;i++){const a=p[i],b=p[i+1];ctx.quadraticCurveTo(a[0],a[1],(a[0]+b[0])/2,(a[1]+b[1])/2)}ctx.lineTo(p[n-1][0],p[n-1][1])}
}
function bbox(p){let a=1e9,b=1e9,c=-1e9,d=-1e9;for(const q of p){a=Math.min(a,q[0]);b=Math.min(b,q[1]);c=Math.max(c,q[0]);d=Math.max(d,q[1])}return[a,b,c,d]}
function E(cx,cy,rx,ry,n=16,rot=0){const p=[],c=Math.cos(rot),s=Math.sin(rot);for(let i=0;i<n;i++){const a=i/n*6.2832,x=Math.cos(a)*rx,y=Math.sin(a)*ry;p.push([cx+x*c-y*s,cy+x*s+y*c])}return p}
function sd(p){const o=[];for(let i=0;i<p.length;i++){const a=p[i],b=p[(i+1)%p.length];o.push(a,[(a[0]+b[0])/2,(a[1]+b[1])/2])}return o}
function R(x,y,w,h,r=0){return sd(r>0?[[x+r,y],[x+w-r,y],[x+w,y+r],[x+w,y+h-r],[x+w-r,y+h],[x+r,y+h],[x,y+h-r],[x,y+r]]:[[x,y],[x+w,y],[x+w,y+h],[x,y+h]])}
function limb(a,b,w0,w1){const dx=b[0]-a[0],dy=b[1]-a[1],L=Math.hypot(dx,dy)||1,ux=dx/L,uy=dy/L,nx_=-uy,ny=ux,wm=(w0+w1)/2*1.05;
  const m=[(a[0]+b[0])/2,(a[1]+b[1])/2];
  return[[a[0]+nx_*w0,a[1]+ny*w0],[m[0]+nx_*wm,m[1]+ny*wm],[b[0]+nx_*w1,b[1]+ny*w1],[b[0]+ux*w1,b[1]+uy*w1],[b[0]-nx_*w1,b[1]-ny*w1],[m[0]-nx_*wm,m[1]-ny*wm],[a[0]-nx_*w0,a[1]-ny*w0],[a[0]-ux*w0,a[1]-uy*w0]]}
function star(cx,cy,ro,ri,n,rot=0){const p=[];for(let i=0;i<n*2;i++){const a=rot+i/(n*2)*6.2832,r=i%2?ri:ro;p.push([cx+Math.cos(a)*r,cy+Math.sin(a)*r])}return p}
function heart(cx,cy,s){const p=[];for(let i=0;i<22;i++){const t=i/22*6.2832;p.push([cx+16*Math.pow(Math.sin(t),3)*s/16,cy-(13*Math.cos(t)-5*Math.cos(2*t)-2*Math.cos(3*t)-Math.cos(4*t))*s/16])}return p}
function xf(x,y,s,fn,rot=0){ctx.save();ctx.translate(x,y);if(rot)ctx.rotate(rot);ctx.scale(s,s);S*=s;fn();S/=s;ctx.restore()}

/* ---------- watercolor primitives ---------- */
function wash(p,col,o={}){
  const s=nx(),a=o.a??.62,bl=o.bleed??2.6,sh=o.sharp||false;
  ctx.save();ctx.globalCompositeOperation='multiply';
  path(jit(p,bl,s),true,sh);ctx.globalAlpha=a;ctx.fillStyle=col;ctx.fill();
  path(jit(p,bl*1.9,s+1),true,sh);ctx.globalAlpha=a*.42;ctx.fillStyle=o.c2||col;ctx.fill();
  path(p,true,sh);ctx.clip();
  const b=bbox(p),w=b[2]-b[0],h=b[3]-b[1];
  const g=ctx.createLinearGradient(b[0],b[1],b[2],b[3]);
  g.addColorStop(.25,rgba(dk(col,.7),0));g.addColorStop(1,rgba(dk(col,.7),.27));
  ctx.globalAlpha=1;ctx.fillStyle=g;ctx.fillRect(b[0]-2,b[1]-2,w+4,h+4);
  ctx.strokeStyle=rgba(dk(col,.7),.38);ctx.lineWidth=6/S;path(p,true,sh);ctx.stroke();
  ctx.globalCompositeOperation='source-over';
  const rg=ctx.createRadialGradient(b[0]+w*.32,b[1]+h*.28,0,b[0]+w*.32,b[1]+h*.28,Math.max(w,h)*.6);
  rg.addColorStop(0,'rgba(255,252,240,.42)');rg.addColorStop(1,'rgba(255,252,240,0)');
  ctx.fillStyle=rg;ctx.fillRect(b[0]-2,b[1]-2,w+4,h+4);
  if(w*h*S*S>2200&&o.grain!==false){ctx.globalCompositeOperation='multiply';ctx.globalAlpha=.3;ctx.fillStyle=pigPat();ctx.fillRect(b[0]-2,b[1]-2,w+4,h+4)}
  ctx.restore();
}
function ink(p,w=2.4,o={}){
  const s=nx(),cl=o.closed!==false;ctx.save();ctx.strokeStyle=o.col||INK;ctx.lineCap='round';ctx.lineJoin='round';
  ctx.globalAlpha=o.a??.92;ctx.lineWidth=w/S;path(jit(p,.9,s),cl,o.sharp);ctx.stroke();
  ctx.globalAlpha=(o.a??.92)*.42;ctx.lineWidth=w*.5/S;path(jit(p,1.9,s+3),cl,o.sharp);ctx.stroke();ctx.restore();
}
function hatch(p,o={}){
  const ang=o.ang??.9,gap=(o.gap??6)/S,a=o.a??.55,b=bbox(p),cx=(b[0]+b[2])/2,cy=(b[1]+b[3])/2,D=Math.hypot(b[2]-b[0],b[3]-b[1])/2+4/S;
  const r=mb(nx()*31);ctx.save();path(p,true,o.sharp);ctx.clip();
  const g=ctx.createLinearGradient(b[0],b[1],b[2],b[3]);g.addColorStop(.38,'rgba(43,37,64,0)');g.addColorStop(1,`rgba(43,37,64,${a})`);
  ctx.strokeStyle=g;ctx.lineWidth=(o.w??1)/S;ctx.lineCap='round';
  const dx=Math.cos(ang),dy=Math.sin(ang),nx_=-dy,ny=dx;ctx.beginPath();
  for(let k=-D;k<D;k+=gap){const x0=cx+nx_*k,y0=cy+ny*k;ctx.moveTo(x0-dx*D,y0-dy*D);
    ctx.lineTo(x0+nx_*gap*.2*(r()-.5)*2,y0+ny*gap*.2*(r()-.5)*2);ctx.lineTo(x0+dx*D,y0+dy*D)}
  ctx.stroke();ctx.restore();
}
function shape(p,col,o={}){wash(p,col,o);if(o.h)hatch(p,o.h===true?{sharp:o.sharp}:Object.assign({sharp:o.sharp},o.h));if(o.ink!==false)ink(p,o.w??2.4,{sharp:o.sharp})}
function gou(p,col,a=.95,o={}){const s=nx();ctx.save();ctx.globalAlpha=a;ctx.fillStyle=col;path(jit(p,.8,s),true,o.sharp);ctx.fill();ctx.restore();if(o.ink!==false)ink(p,o.w??2,{sharp:o.sharp})}
function line(pts,w=2.2,col=INK,a=.9){ink(pts,w,{closed:false,col,a})}
function stroke(pts,w,col,a=1){ctx.save();ctx.globalAlpha=a;ctx.strokeStyle=col;ctx.lineWidth=w/S;ctx.lineCap='round';ctx.lineJoin='round';path(pts,false);ctx.stroke();ctx.restore()}
function dot(x,y,r,col,a=1){ctx.save();ctx.globalAlpha=a;ctx.fillStyle=col;ctx.beginPath();ctx.arc(x,y,r/1,0,6.2832);ctx.fill();ctx.restore()}
function ticks(list,w=1.4,col=INK,a=.6){ctx.save();ctx.strokeStyle=col;ctx.globalAlpha=a;ctx.lineWidth=w/S;ctx.lineCap='round';ctx.beginPath();for(const t of list){ctx.moveTo(t[0],t[1]);ctx.lineTo(t[2],t[3])}ctx.stroke();ctx.restore()}
function blur(px,fn){ctx.save();ctx.filter=`blur(${px}px)`;fn();ctx.restore()}
function splat(x,y,r,col,n,seed,a=.6){const q=mb(seed);ctx.save();ctx.globalCompositeOperation='multiply';ctx.fillStyle=col;
  for(let i=0;i<n;i++){const ang=q()*6.28,d=Math.pow(q(),.6)*r,rr=(q()<.12?3+q()*5:.8+q()*2.4);ctx.globalAlpha=a*(.5+q()*.5);ctx.beginPath();ctx.arc(x+Math.cos(ang)*d,y+Math.sin(ang)*d,rr,0,6.28);ctx.fill()}ctx.restore()}
function sparkle(x,y,s,col='#fff6c8',rot=0){const p=star(x,y,s,s*.18,4,rot);ctx.save();ctx.globalAlpha=.95;ctx.fillStyle=col;path(p,true,true);ctx.fill();ctx.strokeStyle=INK;ctx.lineWidth=1.1/S;ctx.stroke();ctx.restore()}

/* hand lettering */
function letter(str,x,y,size,col,o={}){
  const al=o.align||'center',r=mb([...str].reduce((a,c)=>a*31+c.charCodeAt(0)|0,7)),sk=o.stroke??Math.max(1.6,size*.05);
  ctx.save();ctx.translate(x,y);ctx.rotate(o.rot||0);ctx.font=FONT.replace('SIZE',size);ctx.textBaseline='alphabetic';ctx.lineJoin='round';
  const ws=[...str].map(c=>ctx.measureText(c).width+(o.track||0));const tot=ws.reduce((a,b)=>a+b,0);
  let cx=al==='center'?-tot/2:al==='right'?-tot:0;
  const pass=(fn)=>{let px=cx;[...str].forEach((c,i)=>{const rr=mb(i*97+str.length*13);ctx.save();ctx.translate(px+ws[i]/2,(rr()-.5)*size*.09);ctx.rotate((rr()-.5)*.14);ctx.textAlign='center';fn(c);ctx.restore();px+=ws[i]})};
  if(o.shadow!==false){ctx.globalCompositeOperation='multiply';ctx.fillStyle=rgba(dk(col,.5),.35);pass(c=>ctx.fillText(c,size*.05,size*.06));ctx.globalCompositeOperation='source-over'}
  if(sk>0){ctx.strokeStyle=INK;ctx.lineWidth=sk*2.2;ctx.globalAlpha=.92;pass(c=>ctx.strokeText(c,0,0))}
  ctx.globalAlpha=.97;ctx.fillStyle=col;pass(c=>ctx.fillText(c,0,0));
  ctx.restore();
}

/* ---------- palette ---------- */
const P={rose:'#f0679f',lime:'#a6d94b',violet:'#7b62b8',ochre:'#eaa23f',teal:'#3fb5a8',sky:'#8fb6e6',blue:'#5a7fc4',red:'#e2503f',grey:'#9097a8',skin:'#f9dcc0',skinJ:'#f4cfa8',brown:'#7b4a2b'};

/* ---------- characters ---------- */
function shadowAt(x,y,rx,a=.32){ctx.save();ctx.translate(x,y);wash(E(0,0,rx,rx*.2,14),'#6a5d88',{a,ink:false,grain:false});ctx.restore()}

function roxor(x,y,sc,t,mode){
  const bt=Math.abs(Math.sin(t*6.2832)),sw=Math.sin(t*3.1),w=Math.sin(t*6.2832*2);
  shadowAt(x,y,70*sc);
  xf(x,y-bt*8*sc,sc,()=>{
    ctx.rotate(sw*.018);
    // mullet tail behind
    shape(sd([[-26,-296],[-50,-304],[-62,-262],[-46,-240],[-30,-262]]),P.brown,{a:.8,h:{ang:1.3,gap:4}});
    // legs
    shape(sd([[-42,-140],[-6,-140],[-10,-34],[-40,-34]]),'#b4c45c',{h:{ang:1.1}});
    shape(sd([[6,-140],[42,-140],[40,-34],[10,-34]]),'#b4c45c',{h:{ang:1.1}});
    // sneakers
    shape(E(-30,-17,32,16,14),P.lime,{h:{ang:.7,gap:5}});shape(E(32,-17,32,16,14),P.lime,{h:{ang:.7,gap:5}});
    line([[-58,-12],[-4,-12]],2,'#fff',.8);line([[4,-12],[60,-12]],2,'#fff',.8);
    // torso
    shape(sd([[-56,-258],[56,-258],[50,-134],[-50,-134]]),'#6a6490',{a:.85,h:{ang:.8,gap:5,a:.4}});
    ticks([[-30,-240,-34,-175],[18,-236,22,-160],[-6,-232,-10,-150],[36,-222,40,-170]],2,'#fff',.22);
    gou(E(0,-196,25,25,18),'#f5a13a',.95,{w:2});
    dot(-8,-203,3,INK);dot(9,-203,3,INK);line([[-12,-190],[0,-181],[13,-190]],2.2);
    // neck
    shape(sd([[-15,-272],[15,-272],[14,-252],[-14,-252]]),P.skin,{a:.8,w:1.8});
    // raised arm (outside left)
    const hh=-345-8*Math.sin(t*6.2832);
    shape(limb([-50,-248],[-98,-270],17,14),'#6a6490',{a:.85,w:2});
    shape(limb([-98,-270],[-108,hh],11,9),P.skin,{a:.85,w:2});shape(E(-109,hh-8,14,15,12),P.skin,{w:2});
    // mic arm (inner right)
    shape(limb([50,-248],[88,-214],17,14),'#6a6490',{a:.85,w:2});
    shape(limb([88,-214],[42,-290],11,9),P.skin,{a:.85,w:2});
    shape(limb([54,-284],[14,-304],7,7),'#3b3550',{w:2});shape(E(10,-306,13,13,12),'#8e93a6',{h:{ang:.8,gap:4,a:.8},w:2});
    ticks([[0,-312,20,-298],[-2,-304,16,-318]],1,INK,.5);
    stroke([[46,-282],[38,-288]],8,P.lime,.95);
    shape(E(40,-290,12,12,12),P.skin,{a:.9,w:2});
    // ears + head
    shape(E(-47,-318,7,11,10),P.skin,{w:1.6});shape(E(47,-318,7,11,10),P.skin,{w:1.6});
    shape(E(0,-316,46,52,22),P.skin,{a:.7,h:{ang:.7,gap:7,a:.28}});
    // shaved sides
    shape(sd([[-46,-330],[-44,-352],[-31,-365],[-31,-338]]),'#6e5a48',{a:.5,h:{ang:.2,gap:3,a:.7},w:1.4});
    shape(sd([[46,-330],[44,-352],[31,-365],[31,-338]]),'#6e5a48',{a:.5,h:{ang:-.2,gap:3,a:.7},w:1.4});
    // stubble
    const r=mb(5);const st=[];for(let i=0;i<34;i++){const a=.3+r()*2.5,rr=24+r()*20;st.push([Math.cos(a)*rr*.9,-300+Math.sin(a)*rr*.62,0,0])}
    ctx.save();ctx.fillStyle=INK;ctx.globalAlpha=.4;st.forEach(q=>{ctx.beginPath();ctx.arc(q[0],q[1],1,0,6.3);ctx.fill()});ctx.restore();
    // cheeks
    wash(E(-29,-302,11,7,10),P.rose,{a:.3,ink:false,grain:false});wash(E(29,-302,11,7,10),P.rose,{a:.3,ink:false,grain:false});
    // eyes
    for(const sx of[-1,1]){gou(E(sx*17,-322,10,7.5,12),'#fffaf0',.98,{w:1.5});dot(sx*17+1,-322,5.4,'#9fb6c9');dot(sx*17+1.5,-322,2.4,INK);dot(sx*17+3,-324,1.3,'#fff')}
    line([[-29,-331],[-18,-337],[-7,-333]],2.4);line([[7,-336],[18,-342],[30,-333]],2.4);
    line([[-7,-322],[-10,-309],[-3,-306]],1.6,INK,.7);
    // smirk w/ teeth flash
    gou([[-12,-292],[2,-286],[16,-292],[20,-299],[4,-293]],'#fffaf0',.97,{w:1.8,sharp:false});
    line([[-14,-294],[4,-285],[20,-300]],2.4);line([[2,-291],[3,-287]],1,INK,.6);
    // mohawk (swooping up and forward)
    shape([[-26,-362],[-36,-394],[-20,-432],[22,-462],[66,-472],[112,-454],[134,-424],[98,-436],[64,-428],[46,-400],[42,-360]],P.brown,{a:.82,h:{ang:-.9,gap:4,a:.7}});
    ctx.save();ctx.globalAlpha=.4;ctx.fillStyle='#d9a066';path(jit([[-10,-400],[10,-440],[50,-462],[90,-458],[60,-440],[24,-428]],1,3),true);ctx.fill();ctx.restore();
    line([[-8,-364],[-2,-412],[40,-450],[100,-458]],1.8,INK,.7);line([[10,-362],[24,-402],[66,-434],[120,-440]],1.6,INK,.6);
    line([[-24,-370],[-28,-404],[-6,-436],[34,-458]],1.6,INK,.6);
  });
}

function jasmin(x,y,sc,t,mode){
  const bt=Math.abs(Math.sin(t*6.2832+.6)),sw=Math.sin(t*3.1+1),sp=Math.sin(t*3.3);
  shadowAt(x,y,64*sc);
  xf(x,y-bt*8*sc,sc,()=>{
    ctx.rotate(sw*.018);
    // ponytail behind
    const tp=[[-2,-372],[-8,-410],[8+sp*3,-442],[46+sp*8,-436],[72+sp*12,-394],[80+sp*16,-342],[70+sp*18,-300],[62+sp*14,-338],[52+sp*8,-386],[34,-404],[18,-384],[14,-372]];
    shape(tp,'#3a2a52',{a:.85,h:{ang:1.2,gap:4,a:.7}});
    line([[6,-390],[20+sp*4,-428],[56+sp*10,-408],[70+sp*14,-340]],1.6,'#e9d9ff',.45);
    line([[8,-380],[40+sp*6,-396],[60+sp*10,-360],[66+sp*14,-312]],1.5,INK,.55);
    // legs
    shape(sd([[-36,-140],[-4,-140],[-8,-34],[-34,-34]]),'#7fa2dc',{h:{ang:1.1}});
    shape(sd([[4,-140],[36,-140],[34,-34],[8,-34]]),'#7fa2dc',{h:{ang:1.1}});
    gou(E(-28,-17,30,16,14),'#fbe4ee',.97,{w:2});gou(E(30,-17,30,16,14),'#fbe4ee',.97,{w:2});
    line([[-54,-10],[-4,-10]],3,P.rose,.9);line([[4,-10],[56,-10]],3,P.rose,.9);
    // torso pink top
    shape(sd([[-46,-256],[46,-256],[42,-200],[38,-136],[-38,-136],[-42,-200]]),P.rose,{a:.8,h:{ang:.8,gap:5,a:.4}});
    ticks([[-24,-238,-28,-172],[16,-236,20,-168]],2,'#fff',.25);
    shape(sd([[-15,-272],[15,-272],[13,-250],[-13,-250]]),P.skinJ,{a:.8,w:1.8});
    line([[-17,-258],[-12,-240],[0,-228],[12,-240],[17,-258]],1.5,'#8a5a1c',.9);
    gou(heart(0,-226,15),'#e23d6e',.95,{w:1.8});
    // raised arm (outside right)
    const hh=-338-9*Math.sin(t*6.2832+1.3);
    shape(limb([44,-248],[92,-266],14,11),P.skinJ,{a:.85,w:2});
    shape(limb([92,-266],[102,hh],10,8),P.skinJ,{a:.85,w:2});shape(E(103,hh-8,12,13,12),P.skinJ,{w:2});
    shape(limb([44,-248],[70,-258],17,14),P.rose,{a:.85,w:2});
    // mic arm (inner left)
    shape(limb([-44,-248],[-84,-218],14,11),P.skinJ,{a:.85,w:2});
    shape(limb([-84,-218],[-38,-286],10,8),P.skinJ,{a:.85,w:2});
    shape(limb([-50,-280],[-14,-302],7,7),'#3b3550',{w:2});shape(E(-10,-304,12,12,12),'#9a9fb2',{h:{ang:.8,gap:4,a:.8},w:2});
    stroke([[-44,-278],[-36,-284]],8,'#ff5fb0',.95);
    shape(E(-38,-288,11,11,12),P.skinJ,{a:.9,w:2});
    // head
    shape(E(-43,-312,6,10,10),P.skinJ,{w:1.6});shape(E(43,-312,6,10,10),P.skinJ,{w:1.6});

function proj(type,a,b,f,t){
  const e=f<.5?2*f*f:1-Math.pow(-2*f+2,2)/2,x=a[0]+(b[0]-a[0])*e,y=a[1]+(b[1]-a[1])*e,ang=Math.atan2(b[1]-a[1],b[0]-a[0]);

  case'sub':{for(let k=0;k<2;k++){ctx.save();ctx.globalAlpha=(1-f)*.7;ctx.strokeStyle='#5a3fa6';ctx.lineWidth=4;ctx.beginPath();ctx.arc(a[0],a[1],20+f*70+k*14,0,6.3);ctx.stroke();ctx.restore()}break}
  case'mic':{ctx.strokeStyle=P.rose;ctx.lineWidth=4;ctx.lineCap='round';for(let k=0;k<3;k++){ctx.beginPath();ctx.arc(x-Math.cos(ang)*k*13,y-Math.sin(ang)*k*13,12+k*2,ang-.7,ang+.7);ctx.stroke()}break}
  case'synth':{const wv=[];for(let i=0;i<=14;i++){const q=i/14,px=a[0]+(x-a[0])*q,py=a[1]+(y-a[1])*q,off=Math.sin(i*1.6-t*18)*7;wv.push([px+Math.cos(ang+1.57)*off,py+Math.sin(ang+1.57)*off])}stroke(wv,6,'#9bd93a',.95);line(wv,1.5,INK,.6);break}
