const MONO='"DejaVu Sans Mono","Liberation Mono","Courier New",monospace';
const SANS='"DejaVu Sans Condensed","Liberation Sans Narrow","Arial Narrow",Arial,sans-serif';
let LWM=1,HM=1;

/* ---------- drafting primitives ---------- */
function mk(bb){const p=new Path2D();p.bb=bb;return p;}
function rect(x,y,w,h){const p=mk([x,y,x+w,y+h]);p.rect(x,y,w,h);return p;}
function rr(x,y,w,h,r){const p=mk([x,y,x+w,y+h]);p.roundRect(x,y,w,h,r);return p;}
function ell(x,y,rx,ry,rot=0){const m=Math.max(rx,ry);const p=mk([x-m,y-m,x+m,y+m]);p.ellipse(x,y,rx,ry,rot,0,TAU);return p;}
function poly(pts,close=true){const p=new Path2D();let a=1e9,b=1e9,d=-1e9,e=-1e9;pts.forEach(([x,y],i)=>{i?p.lineTo(x,y):p.moveTo(x,y);a=Math.min(a,x);b=Math.min(b,y);d=Math.max(d,x);e=Math.max(e,y);});if(close)p.closePath();p.bb=[a,b,d,e];return p;}
function bez(fn,bb){const p=new Path2D();fn(p);p.bb=bb;return p;}
const HC=[[6,45,COL.cy,1,.5]],HV=[[5,90,COL.cy,1,.4]],HD=[[3.5,45,COL.ink,1,.24],[3.5,-45,COL.ink,1,.16]],HP=[[3.5,45,COL.pk,1,.8]];
const HPLAID=[[7,0,COL.cy,1,.5],[7,90,COL.cy,1,.32]];
function hatchLines(bb,s){const [gap,ang,col,w,a]=s;const [x0,y0,x1,y1]=bb;const R=Math.hypot(x1-x0,y1-y0)/2+2;c.save();c.translate((x0+x1)/2,(y0+y1)/2);c.rotate(ang*Math.PI/180);c.globalAlpha=a;c.strokeStyle=col;c.lineWidth=w*LWM;c.beginPath();const g=gap*HM;for(let y=-R;y<=R;y+=g){c.moveTo(-R,y);c.lineTo(R,y);}c.stroke();c.restore();}
function D(p,o={}){
  if(o.f){c.fillStyle=o.f;c.fill(p);}
  if(o.h){c.save();c.clip(p);for(const s of o.h)hatchLines(p.bb,s);c.restore();}
  if(o.s!==null){c.strokeStyle=o.s||COL.ink;c.lineWidth=(o.lw||2)*LWM;c.lineJoin='round';c.lineCap='round';c.setLineDash(o.d||[]);c.stroke(p);c.setLineDash([]);}
}
function L(x1,y1,x2,y2,col=COL.ink,lw=1.5,dash){c.save();c.strokeStyle=col;c.lineWidth=lw*LWM;c.lineCap='round';if(dash)c.setLineDash(dash);c.beginPath();c.moveTo(x1,y1);c.lineTo(x2,y2);c.stroke();c.restore();}
function PL(pts,col=COL.ink,lw=1.5,dash,close){c.save();c.strokeStyle=col;c.lineWidth=lw*LWM;c.lineCap='round';c.lineJoin='round';if(dash)c.setLineDash(dash);c.beginPath();pts.forEach(([x,y],i)=>i?c.lineTo(x,y):c.moveTo(x,y));if(close)c.closePath();c.stroke();c.restore();}
function T(s,x,y,o={}){c.save();c.font=`${o.w||'normal'} ${o.s||14}px ${o.f||MONO}`;c.fillStyle=o.c||COL.ink;c.textAlign=o.a||'left';c.textBaseline=o.b||'alphabetic';c.letterSpacing=(o.ls||0)+'px';if(o.r){c.translate(x,y);c.rotate(o.r);c.fillText(s,0,0);}else c.fillText(s,x,y);c.restore();}
function textW(s,sz,f=MONO,w='normal'){c.save();c.font=`${w} ${sz}px ${f}`;const m=c.measureText(s).width;c.restore();return m;}
function arrowHead(x,y,ux,uy,s=8){c.beginPath();c.moveTo(x,y);c.lineTo(x+ux*s-uy*2.6,y+uy*s+ux*2.6);c.lineTo(x+ux*s+uy*2.6,y+uy*s-ux*2.6);c.closePath();c.fill();}
function dim(x1,y1,x2,y2,off,label,col=COL.cy,fs=12){
  const dx=x2-x1,dy=y2-y1,len=Math.hypot(dx,dy),ux=dx/len,uy=dy/len,nx=-uy,ny=ux,sg=off<0?-1:1;
  const ax=x1+nx*off,ay=y1+ny*off,bx=x2+nx*off,by=y2+ny*off;
  c.save();c.strokeStyle=col;c.fillStyle=col;c.lineWidth=1;
  c.beginPath();c.moveTo(x1+nx*3*sg,y1+ny*3*sg);c.lineTo(ax+nx*6*sg,ay+ny*6*sg);c.moveTo(x2+nx*3*sg,y2+ny*3*sg);c.lineTo(bx+nx*6*sg,by+ny*6*sg);c.stroke();
  c.font=`${fs}px ${MONO}`;const tw=c.measureText(label).width+8;const mx=(ax+bx)/2,my=(ay+by)/2;
  c.beginPath();c.moveTo(ax,ay);c.lineTo(mx-ux*tw/2,my-uy*tw/2);c.moveTo(mx+ux*tw/2,my+uy*tw/2);c.lineTo(bx,by);c.stroke();
  arrowHead(ax,ay,ux,uy);arrowHead(bx,by,-ux,-uy);
  let ang=Math.atan2(dy,dx);if(ang>Math.PI/2||ang<-Math.PI/2)ang+=Math.PI;
  c.translate(mx,my);c.rotate(ang);c.textAlign='center';c.textBaseline='middle';c.fillText(label,0,0);c.restore();
}
function callout(px,py,tx,ty,txt,col=COL.cy,sz=12,sub){
  c.save();c.strokeStyle=col;c.fillStyle=col;c.lineWidth=1.1;
  c.beginPath();c.arc(px,py,2.8,0,TAU);c.fill();
  const right=tx>=px;const w=Math.max(textW(txt,sz),sub?textW(sub,sz-1):0)+8;
  c.beginPath();c.moveTo(px,py);c.lineTo(tx,ty);c.lineTo(tx+(right?w:-w),ty);c.stroke();c.restore();
  T(txt,tx+(right?4:-4),ty-4,{c:col,s:sz,a:right?'left':'right'});
  if(sub)T(sub,tx+(right?4:-4),ty+11,{c:col,s:sz-1,a:right?'left':'right'});
}
function balloon(x,y,n,col=COL.ink){c.save();c.beginPath();c.arc(x,y,9,0,TAU);c.fillStyle=COL.bg;c.fill();c.strokeStyle=col;c.lineWidth=1.3;c.stroke();c.restore();T(String(n),x,y+.5,{a:'center',b:'middle',s:11,c:col});}
function revCloud(x,y,rx,ry,col=COL.pk){const n=Math.round((rx+ry)/9);c.save();c.strokeStyle=col;c.lineWidth=1.6;c.beginPath();for(let i=0;i<n;i++){const a0=i/n*TAU,a1=(i+1)/n*TAU;const x0=x+Math.cos(a0)*rx,y0=y+Math.sin(a0)*ry,x1=x+Math.cos(a1)*rx,y1=y+Math.sin(a1)*ry;const mx=(x0+x1)/2,my=(y0+y1)/2;const nx=mx-x,ny=my-y,nl=Math.hypot(nx,ny);c.moveTo(x0,y0);c.quadraticCurveTo(mx+nx/nl*9,my+ny/nl*9,x1,y1);}c.stroke();c.restore();}
function burst(x,y,hp,col=COL.ink,n=9,r0=8,r1=34,lw=2){c.save();c.strokeStyle=col;c.lineWidth=lw;c.lineCap='round';c.globalAlpha=Math.max(0,1-hp*hp);c.beginPath();for(let i=0;i<n;i++){const a=i/n*TAU+.3;const ra=r0+hp*10,rb=r0+(r1-r0)*(.45+.55*Math.min(1,hp*1.6))*(i%2?.7:1);c.moveTo(x+Math.cos(a)*ra,y+Math.sin(a)*ra);c.lineTo(x+Math.cos(a)*rb,y+Math.sin(a)*rb);}c.stroke();c.restore();}
function dmgNum(x,y,val,crit,hp,col){const a=Math.max(0,1-hp*hp*hp);if(a<=0)return;c.save();c.globalAlpha=a;const s=crit?24:16;const txt=(crit?'':'-')+val.toLocaleString('en-US');const yy=y-24-hp*30;
  c.font=`bold ${s}px ${MONO}`;c.textAlign='center';c.lineJoin='round';c.lineWidth=5;c.strokeStyle=COL.deep;c.strokeText(txt,x,yy);c.fillStyle=crit?COL.pk:COL.ink;c.fillText(txt,x,yy);
  if(crit){c.font=`bold 11px ${MONO}`;c.strokeText('CRIT',x,yy-24);c.fillStyle=COL.lm;c.fillText('CRIT',x,yy-24);}
  c.restore();}

/* ---------- 3D-ish solids ---------- */
function cyl(x,y,rx,ry,h,o={}){
  const b=new Path2D();b.moveTo(x-rx,y);b.lineTo(x-rx,y+h);b.ellipse(x,y+h,rx,ry,0,Math.PI,0,true);b.lineTo(x+rx,y);b.ellipse(x,y,rx,ry,0,0,Math.PI,true);b.closePath();b.bb=[x-rx,y-ry,x+rx,y+h+ry];
  D(b,{f:FILL,h:o.h||HV,lw:o.lw});
  D(ell(x,y,rx,ry),{f:o.top||FILL2,lw:o.lw});
}
function tube(px,py,len,w,ang){c.save();c.translate(px,py);c.rotate(ang);
  D(rect(0,-w/2,len,w),{f:FILL,h:[[4,0,COL.cy,1,.45]]});
  D(rect(len-7,-w/2-3,9,w+6),{f:FILL2});D(ell(0,0,w/2+3,w/2+3),{f:FILL2});
  L(5,0,len-9,0,COL.cy,1,[6,4]);c.restore();}
function box(x,y,w,h,d,o={}){ // front face x,y,w,h ; depth d up-right
  D(poly([[x+w,y],[x+w+d,y-d*.8],[x+w+d,y+h-d*.8],[x+w,y+h]]),{f:FILL,h:HD});
  D(poly([[x,y],[x+d,y-d*.8],[x+w+d,y-d*.8],[x+w,y]]),{f:FILL2,h:HC});
  D(rect(x,y,w,h),{f:FILL,h:o.h||[]});
}

function drawTurret(type,x,y,t,lv=1,aim=-0.8,opt={}){
  AIM=aim;const K=TUR[type];c.save();c.translate(x,y);

  if(lv>=5)D(ell(0,31,62,21),{s:col,lw:1.2,d:[7,4]});
  for(const p of K.parts)p(t);
  if(!opt.bare){
    for(let i=0;i<lv;i++)D(rect(-lv*5.5+i*11,52,8,6),{f:col,lw:1,s:COL.ink});
    D(rr(-50,-44,30,16,4),{f:COL.deep,lw:1.3,s:col});T('L'+lv,-35,-32,{a:'center',s:12,w:'bold',c:col});
    if(lv>=4){c.save();c.translate(42,-40);c.rotate(t*.8);c.strokeStyle=col;c.lineWidth=2;c.beginPath();for(let i=0;i<4;i++){const a=i*TAU/4;c.moveTo(Math.cos(a)*3,Math.sin(a)*3);c.lineTo(Math.cos(a)*12,Math.sin(a)*12);}c.stroke();c.restore();}
  }
  c.restore();
}
function turretExploded(type,x,y,s,e,t){
  const K=TUR[type],n=K.parts.length,gap=52;
  c.save();c.translate(x,y);c.scale(s,s);LWM=1/s;HM=1;
  L(0,-(n-1)*gap*e-110,0,56,COL.cy,1,[10,4,2,4]);
  for(const sx of[-52,52])for(let i=1;i<n;i++)L(sx,-(i-1)*gap*e+22,sx,-i*gap*e+22,COL.cy,1,[3,4]);
  AIM=-.9;
  for(let i=0;i<n;i++){c.save();c.translate(0,-i*gap*e);K.parts[i](t);c.restore();balloon(70,-i*gap*e+8,i+1);L(56,-i*gap*e+8,61,-i*gap*e+8,COL.cy,1);}
  c.restore();LWM=1;
}

/* ---------- Static (enemies) ---------- */
const ER={fuzz:26,zip:20,brick:36,echo:27,drone:24,leech:28,gate:30,squeal:28,mute:28,rager:25,boss:54};
