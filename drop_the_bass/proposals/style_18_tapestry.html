// Drop the Bass, style 18: illuminated tapestry. Everything is drawn procedurally; no assets, no randomness without a seed.
const W=1080,H=1920,TAU=Math.PI*2;

const qs=new URLSearchParams(location.search);const FIX=qs.has('t')?parseFloat(qs.get('t')):null;
function rng(seed){let a=seed>>>0;return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function hx(h){return[1,3,5].map(i=>parseInt(h.substr(i,2),16))}
function mix(a,b,t){const A=hx(a),B=hx(b);return'#'+A.map((v,i)=>Math.round(v+(B[i]-v)*t).toString(16).padStart(2,'0')).join('')}
const pc={};
function pat(col,ang=0.6){const k=col+ang;if(pc[k])return pc[k];const t=document.createElement('canvas');t.width=t.height=6;const g=t.getContext('2d');
 g.fillStyle=col;g.fillRect(0,0,6,6);g.fillStyle=mix(col,'#ffffff',.30);g.fillRect(0,0,6,1.7);g.fillStyle=mix(col,'#000000',.24);g.fillRect(0,3.2,6,1.5);

const R=(x,y,w,h,r=6)=>g=>g.roundRect(x,y,w,h,r);
const P=(...p)=>g=>{g.moveTo(p[0],p[1]);for(let i=2;i<p.length;i+=2)g.lineTo(p[i],p[i+1]);g.closePath()};
const PA=pts=>g=>{pts.forEach((p,i)=>i?g.lineTo(p[0],p[1]):g.moveTo(p[0],p[1]));g.closePath()};
const starF=(x,y,ro,ri,n,rot=0)=>g=>{for(let i=0;i<n*2;i++){const a=rot+i*Math.PI/n-Math.PI/2,r=i%2?ri:ro;g[i?'lineTo':'moveTo'](x+Math.cos(a)*r,y+Math.sin(a)*r)}g.closePath()};

function sh(col,fn,o={}){c.beginPath();fn(c);c.fillStyle=pat(col,o.a===undefined?.6:o.a);c.fill();

  c.save();c.setLineDash([5,4]);c.strokeStyle='rgba(255,236,190,.32)';c.lineWidth=1.2;c.stroke();c.restore()}}
function ln(pts,w,col,o={}){c.save();c.lineCap='round';c.lineJoin='round';c.beginPath();pts.forEach((p,i)=>i?c.lineTo(p[0],p[1]):c.moveTo(p[0],p[1]));
 c.strokeStyle=col;c.lineWidth=w;if(o.dash)c.setLineDash(o.dash);c.stroke();c.restore()}
function limb(p,w,col){c.save();c.lineCap='round';c.lineJoin='round';
 const path=()=>{c.beginPath();c.moveTo(p[0][0],p[0][1]);for(let i=1;i<p.length-1;i++){const mx=(p[i][0]+p[i+1][0])/2,my=(p[i][1]+p[i+1][1])/2;c.quadraticCurveTo(p[i][0],p[i][1],mx,my)}const l=p[p.length-1];c.lineTo(l[0],l[1])};
 path();c.strokeStyle=K.ink;c.lineWidth=w+6;c.stroke();path();c.strokeStyle=pat(col);c.lineWidth=w;c.stroke();c.restore()}
function T(s,x,y,sz,fill,o={}){c.save();c.font=`${o.wt||'bold'} ${o.it?'italic ':''}${sz}px ${FONT}`;c.textAlign=o.al||'center';c.textBaseline='middle';c.letterSpacing=(o.ls||0)+'px';
 if(o.st){c.lineJoin='round';c.lineWidth=o.sw||5;c.strokeStyle=o.st;c.strokeText(s,x,y)}c.fillStyle=fill;c.fillText(s,x,y);c.restore()}

 sh(d,P(x2+n*1.1,y+h*.2,x2-n*.5,y+h*.2,x2-n*.5,y+h*.95,x2+n*1.1,y+h*.95,x2+n*.55,y+h*.575),{w:3});
 sh(col,g=>{g.moveTo(x,y);g.quadraticCurveTo(cx,y-h*.1,x2,y);g.lineTo(x2,y+h);g.quadraticCurveTo(cx,y+h*1.1,x,y+h);g.closePath()},{a:.1});
 if(text)TF(text,cx,cy+1,w-24,sz||h*.55,tc||K.cream,{ls,st:K.ink,sw:4})}

function vine(x1,y1,x2,y2,amp=7,per=52){const L=Math.hypot(x2-x1,y2-y1),ux=(x2-x1)/L,uy=(y2-y1)/L,nx=-uy,ny=ux;
 const pts=[];for(let u=0;u<=L;u+=3){const o=amp*Math.sin(u/per*TAU);pts.push([x1+ux*u+nx*o,y1+uy*u+ny*o])}

  leaf(px+nx*sg*5,py+ny*sg*5,an,1.15,k%4<2?K.green:K.green2);
  const u2=k*per/2,o2=amp*Math.sin(u2/per*TAU);if(k%2===0){c.fillStyle=K.madder;c.strokeStyle=K.ink;c.lineWidth=1.5;c.beginPath();c.arc(x1+ux*u2+nx*o2,y1+uy*u2+ny*o2,3.4,0,TAU);c.fill();c.stroke()}}}

 const nx=6,ny=11;for(let i=0;i<nx;i++){const x=B+(i+.5)*(W-2*B)/nx;medallion(x,28,i,0);medallion(x,H-28,i+3,0)}

 c.lineWidth=2;c.strokeStyle=K.ink;c.strokeRect(0,0,W,H);c.strokeRect(8,8,W-16,H-16);c.strokeRect(B-9,B-9,W-2*B+18,H-2*B+18);c.strokeRect(B+1,B+1,W-2*B-2,H-2*B-2);
 c.fillStyle=K.gold;for(let x=20;x<W-16;x+=18){for(const y of[6,H-6]){c.beginPath();c.arc(x,y,2,0,TAU);c.fill()}}for(let y=20;y<H-16;y+=18){for(const x of[6,W-6]){c.beginPath();c.arc(x,y,2,0,TAU);c.fill()}}

let BG=null;
function bake(){const b=document.createElement('canvas');b.width=W;b.height=H;const g=b.getContext('2d');c=g;

 g.lineWidth=1;for(let i=0;i<2200;i++){const x=r()*W,y=r()*H,a=r()*TAU,l=6+r()*20;g.strokeStyle=`rgba(${r()<.5?'120,80,40':'255,250,225'},${.05+r()*.07})`;g.beginPath();g.moveTo(x,y);g.lineTo(x+Math.cos(a)*l,y+Math.sin(a)*l);g.stroke()}
 for(const[x,y,rr]of[[820,1380,70],[210,1180,52],[640,330,46]]){g.strokeStyle='rgba(120,70,25,.12)';g.lineWidth=5;g.beginPath();g.arc(x,y,rr,0,TAU);g.stroke();g.lineWidth=2;g.beginPath();g.arc(x+3,y+2,rr-6,0,TAU);g.stroke()}

 const v=g.createRadialGradient(W/2,H/2,520,W/2,H/2,1250);v.addColorStop(0,'rgba(110,70,25,0)');v.addColorStop(1,'rgba(110,70,25,.42)');g.fillStyle=v;g.fillRect(0,0,W,H);
 g.fillStyle='rgba(90,55,20,.16)';g.fillRect(0,1299,W,2);g.fillStyle='rgba(255,250,225,.18)';g.fillRect(0,1301,W,2);

let WEAVE=null;

 // left arm raised, rock on
 const lh=[-66+6*sw,-146-8*sw];limb([[-28,-114],[-54,-104],lh],13,K.skin);sh(K.skin,E(lh[0],lh[1],9,9));

 sh(K.black,E(-31,-114,14,13));
 // head
 sh(K.skin,E(-36,-148,6,9));sh(K.skin,E(36,-148,6,9));
 sh(K.skin,E(0,-150,37,35),{a:.3});

 const rr=rng(5);c.fillStyle='rgba(60,40,25,.5)';for(let i=0;i<26;i++){const a=.15*Math.PI+rr()*.7*Math.PI,d=24+rr()*10;c.beginPath();c.arc(Math.cos(a)*d*1.05,-150+Math.sin(a)*d,.9,0,TAU);c.fill()}

 ln([[-24,-163],[-6,-160]],3.5,K.brown);ln([[7,-158],[24,-168]],3.5,K.brown);
