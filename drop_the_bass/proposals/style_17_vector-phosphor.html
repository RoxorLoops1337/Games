<body>
<canvas id="c" width="1080" height="1920"></canvas>
<script>
"use strict";
/* ============ Drop the Bass : Style 17 VECTOR PHOSPHOR ============
   Everything is single-width glowing vector lines (Vectrex / oscilloscope).
   Procedural canvas only. Time driven, no unseeded randomness.            */
const W = 1080, H = 1920;
const cv = document.getElementById('c');
const X = cv.getContext('2d');
const BG = '#020805';
const C = { g:'#3dff7c', gh:'#c9ffdb', gd:'#1f9a4c', gr:'#8fd6a6', p:'#ff5fb0', a:'#ffb347', c:'#38e1ff', w:'#f2fff6' };
const PI = Math.PI, TAU = Math.PI * 2;
const qs = new URLSearchParams(location.search);
const FREEZE = qs.has('t') ? parseFloat(qs.get('t')) : null;

function mkCanvas(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; }
function rng(seed) { let a = seed >>> 0; return () => { a = (a + 0x6D2B79F5) >>> 0; let t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const mix = (a, b, k) => a + (b - a) * k;

/* ---------------- vector pen ---------------- */
let G = null;            // current 2d context
let GA = 1;              // alpha multiplier
let M = { x:0, y:0, s:1, r:0, lw:1 };
const stk = [];
const INTENS = 0.62;
const hotCache = {};
function hot(col) {
  if (hotCache[col]) return hotCache[col];
  const n = parseInt(col.slice(1), 16);
  const r = n >> 16, g = (n >> 8) & 255, b = n & 255;
  const k = 0.62;
  const o = 'rgb(' + Math.round(r + (255 - r) * k) + ',' + Math.round(g + (255 - g) * k) + ',' + Math.round(b + (255 - b) * k) + ')';
  return (hotCache[col] = o);
}
function P(x, y) { const c = Math.cos(M.r), s = Math.sin(M.r); return [M.x + M.s * (x * c - y * s), M.y + M.s * (x * s + y * c)]; }
function push(x = 0, y = 0, s = 1, r = 0) {
  stk.push(M);
  const p = P(x, y);
  M = { x:p[0], y:p[1], s:M.s * s, r:M.r + r, lw:clamp(M.lw * Math.pow(s, 0.5), 0.6, 1.8) };
}
function pop() { M = stk.pop(); }
function resetPen() { M = { x:0, y:0, s:1, r:0, lw:1 }; stk.length = 0; GA = 1; }
function mv(x, y) { const p = P(x, y); G.moveTo(p[0], p[1]); }
function lt(x, y) { const p = P(x, y); G.lineTo(p[0], p[1]); }
function glow(col, w) {
  const lw = w * M.lw * 0.72;
  G.lineJoin = 'round'; G.lineCap = 'round';
  G.strokeStyle = col;
  G.globalAlpha = GA * 0.07 * INTENS; G.lineWidth = lw * 6; G.stroke();
  G.globalAlpha = GA * 0.16 * INTENS; G.lineWidth = lw * 2.8; G.stroke();
  G.globalAlpha = GA * 0.92 * INTENS; G.lineWidth = lw; G.stroke();
  G.strokeStyle = hot(col);
  G.globalAlpha = GA * 0.8 * INTENS; G.lineWidth = lw * 0.4; G.stroke();
  G.globalAlpha = 1;
}
function dotAt(x, y, col, w) {
  const p = P(x, y), r = w * M.lw * 1.15;
  G.fillStyle = col; G.globalAlpha = GA * 0.2 * INTENS; G.beginPath(); G.arc(p[0], p[1], r * 3.2, 0, TAU); G.fill();
  G.fillStyle = hot(col); G.globalAlpha = GA * 0.95 * INTENS; G.beginPath(); G.arc(p[0], p[1], r, 0, TAU); G.fill();
  G.globalAlpha = 1;
}
function pl(pts, col = C.g, w = 2, closed = false, dots = false) {
  G.beginPath();
  for (let i = 0; i < pts.length; i++) i ? lt(pts[i][0], pts[i][1]) : mv(pts[i][0], pts[i][1]);
  if (closed) G.closePath();
  glow(col, w);
  if (dots) for (const q of pts) dotAt(q[0], q[1], col, w);
}
function ln(x1, y1, x2, y2, col = C.g, w = 2) { G.beginPath(); mv(x1, y1); lt(x2, y2); glow(col, w); }
function cp(x, y, rx, ry, n = 16, rot = 0, a0 = 0, a1 = TAU) {
  const o = [];
  const full = Math.abs(a1 - a0 - TAU) < 1e-6;
  const m = full ? n : n + 1;
  for (let i = 0; i < m; i++) { const a = a0 + (a1 - a0) * i / n; o.push([x + Math.cos(a + rot) * rx, y + Math.sin(a + rot) * ry]); }
  return o;
}
function circ(x, y, r, col = C.g, w = 2, n = 16, rot = 0, dots = false) { pl(cp(x, y, r, r, n, rot), col, w, true, dots); }
function ell(x, y, rx, ry, col = C.g, w = 2, n = 18, rot = 0) { pl(cp(x, y, rx, ry, n, rot), col, w, true); }
function arc(x, y, r, a0, a1, col = C.g, w = 2, n = 10) { pl(cp(x, y, r, r, n, 0, a0, a1), col, w, false); }
function disc(x, y, r, col = C.g, w = 1.3) { circ(x, y, r, col, w, 10); if (r > 3) circ(x, y, r * 0.55, col, w, 8); }
function spl(pts, seg = 8) {
  const o = [], n = pts.length;
  for (let i = 0; i < n - 1; i++) {
    const p0 = pts[Math.max(0, i - 1)], p1 = pts[i], p2 = pts[i + 1], p3 = pts[Math.min(n - 1, i + 2)];
    for (let s = 0; s < seg; s++) {
      const t = s / seg, t2 = t * t, t3 = t2 * t;
      o.push([
        0.5 * ((2 * p1[0]) + (-p0[0] + p2[0]) * t + (2 * p0[0] - 5 * p1[0] + 4 * p2[0] - p3[0]) * t2 + (-p0[0] + 3 * p1[0] - 3 * p2[0] + p3[0]) * t3),
        0.5 * ((2 * p1[1]) + (-p0[1] + p2[1]) * t + (2 * p0[1] - 5 * p1[1] + 4 * p2[1] - p3[1]) * t2 + (-p0[1] + 3 * p1[1] - 3 * p2[1] + p3[1]) * t3)
      ]);
    }
  }
  o.push(pts[n - 1]);
  return o;
}
function heartPts(cx, cy, r) {
  const o = [];
  for (let i = 0; i < 24; i++) {
    const t = i / 24 * TAU;
    o.push([cx + Math.pow(Math.sin(t), 3) * 16 * r / 17, cy - (13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t)) * r / 17]);
  }
  return o;
}
function burst(x, y, r0, r1, n, rot, col, w) {
  for (let k = 0; k < n; k++) { const a = rot + k / n * TAU; ln(x + Math.cos(a) * r0, y + Math.sin(a) * r0, x + Math.cos(a) * r1, y + Math.sin(a) * r1, col, w); }
}
function star4(x, y, r, col, w = 1.6) { pl([[x, y - r], [x + r * 0.2, y - r * 0.2], [x + r, y], [x + r * 0.2, y + r * 0.2], [x, y + r], [x - r * 0.2, y + r * 0.2], [x - r, y], [x - r * 0.2, y - r * 0.2]], col, w, true); }
function maskPoly(pts) {
  G.save(); G.globalCompositeOperation = 'source-over'; G.globalAlpha = 1; G.fillStyle = BG;
  G.beginPath(); pts.forEach((q, i) => i ? lt(q[0], q[1]) : mv(q[0], q[1])); G.closePath(); G.fill(); G.restore();
}
function maskC(x, y, r, n = 18) { maskPoly(cp(x, y, r, r, n)); }
function hatch(pts, col, w, gap, ang) {
  const c = Math.cos(-ang), s = Math.sin(-ang);
  const q = pts.map(p => [p[0] * c - p[1] * s, p[0] * s + p[1] * c]);
  let mn = 1e9, mx = -1e9; q.forEach(p => { mn = Math.min(mn, p[1]); mx = Math.max(mx, p[1]); });
  const ca = Math.cos(ang), sa = Math.sin(ang), n = q.length;
  G.beginPath();
  for (let y = mn + gap / 2; y < mx; y += gap) {
    const xs = [];
    for (let i = 0; i < n; i++) {
      const a = q[i], b = q[(i + 1) % n];
      if ((a[1] <= y && b[1] > y) || (b[1] <= y && a[1] > y)) xs.push(a[0] + (y - a[1]) * (b[0] - a[0]) / (b[1] - a[1]));
    }
    xs.sort((u, v) => u - v);
    for (let k = 0; k + 1 < xs.length; k += 2) {
      mv(xs[k] * ca - y * sa, xs[k] * sa + y * ca);
      lt(xs[k + 1] * ca - y * sa, xs[k + 1] * sa + y * ca);
    }
  }
  glow(col, w);
}
function rectPts(x1, y1, x2, y2) { return [[x1, y1], [x2, y1], [x2, y2], [x1, y2]]; }
function chamfer(x1, y1, x2, y2, c) { return [[x1 + c, y1], [x2 - c, y1], [x2, y1 + c], [x2, y2 - c], [x2 - c, y2], [x1 + c, y2], [x1, y2 - c], [x1, y1 + c]]; }
function offsetLine(pts, d) {
  const n = pts.length, out = [];
  const nm = [];
  for (let i = 0; i < n - 1; i++) { const dx = pts[i + 1][0] - pts[i][0], dy = pts[i + 1][1] - pts[i][1], l = Math.hypot(dx, dy) || 1; nm.push([-dy / l, dx / l]); }
  for (let i = 0; i < n; i++) {
    if (i === 0) out.push([pts[0][0] + nm[0][0] * d, pts[0][1] + nm[0][1] * d]);
    else if (i === n - 1) out.push([pts[i][0] + nm[i - 1][0] * d, pts[i][1] + nm[i - 1][1] * d]);
    else {
      const a = nm[i - 1], b = nm[i], k = 1 + a[0] * b[0] + a[1] * b[1];
      out.push([pts[i][0] + (a[0] + b[0]) / k * d, pts[i][1] + (a[1] + b[1]) / k * d]);
    }

function limb(p0, p1, p2, wd, col, w = 1.8) {
  const pts = [p0, p1, p2];
  const A = offsetLine(pts, wd / 2), B = offsetLine(pts, -wd / 2).reverse();
  pl(A.concat(B), col, w, true);
}

/* ---------------- vector font ---------------- */
const GL = {
  A:'0,6 0,2 2,0 4,2 4,6;0,4 4,4', B:'0,0 0,6 3,6 4,5 4,4 3,3 0,3;0,0 3,0 4,1 4,2 3,3', C:'4,1 3,0 1,0 0,1 0,5 1,6 3,6 4,5',
  D:'0,0 0,6 3,6 4,5 4,1 3,0 0,0', E:'4,0 0,0 0,6 4,6;0,3 3,3', F:'4,0 0,0 0,6;0,3 3,3', G:'4,1 3,0 1,0 0,1 0,5 1,6 3,6 4,5 4,3 2,3',
  H:'0,0 0,6;4,0 4,6;0,3 4,3', I:'1,0 3,0;2,0 2,6;1,6 3,6', J:'4,0 4,5 3,6 1,6 0,5', K:'0,0 0,6;4,0 0,3 4,6', L:'0,0 0,6 4,6',
  M:'0,6 0,0 2,3 4,0 4,6', N:'0,6 0,0 4,6 4,0', O:'1,0 3,0 4,1 4,5 3,6 1,6 0,5 0,1 1,0', P:'0,6 0,0 3,0 4,1 4,2 3,3 0,3',
  Q:'1,0 3,0 4,1 4,5 3,6 1,6 0,5 0,1 1,0;2,4 4,6', R:'0,6 0,0 3,0 4,1 4,2 3,3 0,3;2,3 4,6',
  S:'4,1 3,0 1,0 0,1 0,2 1,3 3,3 4,4 4,5 3,6 1,6 0,5', T:'0,0 4,0;2,0 2,6', U:'0,0 0,5 1,6 3,6 4,5 4,0', V:'0,0 2,6 4,0',
  W:'0,0 1,6 2,3 3,6 4,0', X:'0,0 4,6;4,0 0,6', Y:'0,0 2,3 4,0;2,3 2,6', Z:'0,0 4,0 0,6 4,6',
  '0':'1,0 3,0 4,1 4,5 3,6 1,6 0,5 0,1 1,0;0,5 4,1', '1':'1,1 2,0 2,6;1,6 3,6', '2':'0,1 1,0 3,0 4,1 4,2 0,6 4,6',
  '3':'0,0 4,0 2,2 3,2 4,3 4,5 3,6 1,6 0,5', '4':'3,6 3,0 0,4 4,4', '5':'4,0 0,0 0,3 3,3 4,4 4,5 3,6 1,6 0,5',
  '6':'4,1 3,0 1,0 0,1 0,5 1,6 3,6 4,5 4,4 3,3 0,3', '7':'0,0 4,0 1,6',
  '8':'1,0 3,0 4,1 4,2 3,3 1,3 0,2 0,1 1,0;1,3 0,4 0,5 1,6 3,6 4,5 4,4 3,3', '9':'0,5 1,6 3,6 4,5 4,1 3,0 1,0 0,1 0,2 1,3 4,3',
  '/':'0,6 4,0', '!':'2,0 2,4;2,5.4 2,6', '.':'2,5.4 2,6', ',':'2,5 1.4,6.8', '-':'0.5,3 3.5,3', '+':'0.5,3 3.5,3;2,1 2,5', ':':'2,1.6 2,2;2,4 2,4.4',
  '>':'0,0 4,3 0,6', '<':'4,0 0,3 4,6', '?':'0,1 1,0 3,0 4,1 4,2 2,3.5 2,4.5;2,5.4 2,6', '(':'3,0 1,2 1,4 3,6', ')':'1,0 3,2 3,4 1,6',
  '=':'0,2 4,2;0,4 4,4', '*':'0,1 4,5;4,1 0,5;2,0 2,6', "'":'2,0 2,1.6', '%':'0,0 1,0 1,1 0,1 0,0;3,5 4,5 4,6 3,6 3,5;4,0 0,6', ' ':''

const GLP = {};
for (const k in GL) GLP[k] = GL[k] ? GL[k].split(';').map(s => s.split(' ').map(p => p.split(',').map(Number))) : [];
function txtW(s, size, track = 1) { const k = size / 6; return s.length * (4 + 1.6 * track) * k - 1.6 * track * k; }
function txt(s, x, y, size, col = C.gh, w = 1.8, align = 'l', track = 1) {
  s = String(s).toUpperCase();
  const k = size / 6, adv = (4 + 1.6 * track) * k, tw = txtW(s, size, track);
  let ox = align === 'c' ? x - tw / 2 : align === 'r' ? x - tw : x;
  for (const ch of s) {
    const g = GLP[ch];
    if (g) for (const st of g) pl(st.map(p => [ox + p[0] * k, y + p[1] * k]), col, w, false);
    ox += adv;
  }
}

/* ---------------- shared icons ---------------- */
function coinIcon(x, y, r, t, col = C.a) {
  const sq = Math.abs(Math.cos(t * 2.2));
  const rx = r * (0.25 + 0.75 * sq);
  pl(cp(x, y, rx, r, 18), col, 2, true);
  pl(cp(x, y, rx * 0.72, r * 0.72, 14), col, 1.2, true);
  if (sq > 0.3) { ln(x, y - r * 0.4, x, y + r * 0.4, col, 1.6); }
}
function diamondIcon(x, y, r, t, col = C.c) {
  const pts = [[x - r * 0.65, y - r * 0.35], [x, y - r * 0.8], [x + r * 0.65, y - r * 0.35], [x, y + r]];
  pl(pts, col, 2, true, true);
  ln(x - r * 0.65, y - r * 0.35, x + r * 0.65, y - r * 0.35, col, 1.4);
  ln(x - r * 0.25, y - r * 0.35, x, y + r, col, 1.2); ln(x + r * 0.25, y - r * 0.35, x, y + r, col, 1.2);
  ln(x - r * 0.25, y - r * 0.35, x, y - r * 0.8, col, 1.2); ln(x + r * 0.25, y - r * 0.35, x, y - r * 0.8, col, 1.2);
  const tw = (Math.sin(t * 3) + 1) / 2; star4(x + r * 0.9, y - r * 0.8, 3 + tw * 5, C.gh, 1.3);
}
function recordIcon(x, y, r, t, col = C.p) {
  circ(x, y, r, C.g, 2, 22);
  circ(x, y, r * 0.78, C.gd, 1.1, 18); circ(x, y, r * 0.58, C.gd, 1.1, 16);
  circ(x, y, r * 0.34, col, 1.8, 12);
  const a = t * 2.5; ln(x + Math.cos(a) * r * 0.36, y + Math.sin(a) * r * 0.36, x + Math.cos(a) * r * 0.98, y + Math.sin(a) * r * 0.98, C.gh, 1.3);
  dotAt(x, y, col, 1.6);
}

/* ---------------- heroes ---------------- */
function roxorHead(t, bob) {
  const sw = Math.sin(t * 3) * 1.5;
  maskPoly(cp(0, -152, 25, 28, 18));
  maskPoly(spl([[-16, -172], [-20, -198], [-4, -218], [22, -226], [50, -216], [68, -200], [44, -200], [30, -190], [20, -172]], 4));
  // head
  ell(0, -152, 24, 27, C.g, 2.2, 20);
  // shaved sides
  for (let i = 0; i < 6; i++) ln(-23 + (i % 2), -172 + i * 4.2, -18, -172 + i * 4.2 - 2, C.gd, 1.1);
  for (let i = 0; i < 6; i++) ln(23 - (i % 2), -172 + i * 4.2, 18, -172 + i * 4.2 - 2, C.gd, 1.1);
  // mullet tail
  pl(spl([[-22, -142], [-31, -131 + sw], [-28, -121 + sw], [-19, -124]], 5), C.g, 1.8);
  pl(spl([[-24, -138], [-27, -130 + sw], [-24, -124 + sw]], 5), C.gd, 1.2);
  // mohawk
  const top = spl([[-14, -176], [-19, -198], [-4, -216], [22, -225], [50, -216], [68, -200 + sw]], 7);
  const back = spl([[68, -200 + sw], [46, -201], [32, -191], [20, -176]], 5);
  pl(top.concat(back), C.gh, 2.2, false);
  pl(spl([[-8, -177], [-9, -196], [6, -210], [28, -215], [52, -205 + sw]], 7), C.g, 1.5);
  pl(spl([[0, -176], [2, -192], [14, -202], [34, -204], [56, -200 + sw]], 7), C.g, 1.5);
  pl(spl([[9, -176], [13, -187], [25, -193], [41, -194]], 6), C.gd, 1.3);
  dotAt(68, -200 + sw, C.gh, 1.8);
  // eyes, pale cheeky
  circ(-9, -155, 5.2, C.gh, 1.6, 12); disc(-8 + Math.sin(t * 2) * 1.2, -154.5, 2.2, C.c, 1);
  circ(9, -155, 5.2, C.gh, 1.6, 12); disc(10 + Math.sin(t * 2) * 1.2, -154.5, 2.2, C.c, 1);
  ln(-16, -163, -4, -162, C.g, 1.7);
  pl([[3, -164], [10, -168], [17, -171]], C.g, 1.7);
  pl([[2, -154], [0, -147], [4, -146]], C.gd, 1.3);
  // smirk with flash of teeth
  pl(spl([[-9, -139], [-2, -136], [7, -138], [13, -144]], 6), C.gh, 1.8);
  pl([[-2, -137.5], [10, -140.5], [8, -142.5], [-1, -139.5]], C.w, 1.1, true);
  ln(3, -138, 3.4, -141, C.gd, 0.9); ln(7, -139, 7.2, -142, C.gd, 0.9);
  // stubble
  for (let i = 0; i < 8; i++) { const a = 0.35 * PI + i * 0.0 + (i - 3.5) * 0.19; dotAt(Math.cos(a + 0.0) * 21 * (i % 2 ? 0.92 : 1), -152 + Math.sin(a) * 25 - 2, C.gd, 0.7); }
}
function roxor(t, s, x, y, big) {
  push(x, y, s);
  const bob = Math.sin(t * 4.2) * 3;
  // legs
  const legL = [[-28, -54], [-3, -54], [-6, -14], [-30, -14]], legR = [[3, -54], [28, -54], [31, -14], [7, -14]];
  maskPoly(legL); maskPoly(legR);
  pl(legL, C.g, 2, true); pl(legR, C.g, 2, true);
  hatch(legL, C.gd, 1, 5, PI / 2.6); hatch(legR, C.gd, 1, 5, PI / 2.6);
  // sneakers
  const shL = [[-35, -14], [-4, -14], [1, -6], [1, 0], [-39, 0], [-39, -7]], shR = [[5, -14], [37, -14], [40, -7], [40, 0], [1, 0], [0, -6]];
  maskPoly(shL); maskPoly(shR);
  pl(shL, C.gh, 2.4, true, true); pl(shR, C.gh, 2.4, true, true);
  ln(-39, -3, 1, -3, C.g, 1.6); ln(1, -3, 40, -3, C.g, 1.6);
  for (let i = 0; i < 3; i++) { ln(-26 + i * 6, -14, -24 + i * 6, -9, C.g, 1.3); ln(14 + i * 6, -14, 16 + i * 6, -9, C.g, 1.3); }
  push(0, bob);
  // raised fist arm (left)
  const fy = Math.sin(t * 4.2 + 1) * 4;
  maskPoly(offsetLine([[-40, -110], [-64, -88], [-68, -132 + fy]], 5).concat(offsetLine([[-40, -110], [-64, -88], [-68, -132 + fy]], -5).reverse()));
  limb([-40, -110], [-64, -88], [-68, -132 + fy], 11, C.g, 1.9);
  circ(-68, -140 + fy, 8, C.gh, 1.9, 10);
  ln(-72, -142 + fy, -64, -142 + fy, C.g, 1.1); ln(-72, -138 + fy, -64, -138 + fy, C.g, 1.1);
  // torso: black tee with orange smiley
  const tee = [[-36, -116], [-14, -122], [0, -117], [14, -122], [36, -116], [47, -98], [35, -92], [29, -97], [28, -54], [-28, -54], [-28, -97], [-35, -92], [-47, -98]];
