<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Drop the Bass - Style 08 Voxel</title>
<style>
html,body{margin:0;background:#0b0620;height:100%;overflow:hidden}
canvas{display:block;margin:0 auto;width:min(100vw,56.25vh);height:auto;aspect-ratio:1080/1920}
</style></head><body><canvas id="c"></canvas>
<script>
(()=>{
const W=1080,H=1920;
const cv=document.getElementById('c');cv.width=W;cv.height=H;
const ctx=cv.getContext('2d');
const qs=new URLSearchParams(location.search);
const FIX=qs.has('t')?parseFloat(qs.get('t')):null;

/* ---------- utils ---------- */
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function hash2(x,y,z){z=z||0;let h=(Math.imul(x,374761393)+Math.imul(y,668265263)+Math.imul(z,2147483647))|0;h=Math.imul(h^(h>>>13),1274126177);return((h^(h>>>16))>>>0)/4294967296}
const hc=new Map();
function hexRGB(h){let r=hc.get(h);if(!r){const n=parseInt(h.slice(1),16);r=[n>>16&255,n>>8&255,n&255];hc.set(h,r)}return r}
function rgbs(r){return'rgb('+Math.max(0,Math.min(255,r[0]|0))+','+Math.max(0,Math.min(255,r[1]|0))+','+Math.max(0,Math.min(255,r[2]|0))+')'}
function mix(a,b,t){const A=hexRGB(a),B=hexRGB(b);return rgbs([A[0]+(B[0]-A[0])*t,A[1]+(B[1]-A[1])*t,A[2]+(B[2]-A[2])*t])}
function mixh(a,b,t){const A=hexRGB(a),B=hexRGB(b);const c=[A[0]+(B[0]-A[0])*t,A[1]+(B[1]-A[1])*t,A[2]+(B[2]-A[2])*t].map(v=>Math.max(0,Math.min(255,v|0)));return'#'+c.map(v=>v.toString(16).padStart(2,'0')).join('')}
function adj(h,k){const c=hexRGB(h).map(v=>Math.max(0,Math.min(255,v*k|0)));return'#'+c.map(v=>v.toString(16).padStart(2,'0')).join('')}
const lite=c=>mix(c,'#ffffff',.38), dark=c=>mix(c,'#1a0a30',.38);
function rgba(h,a){const c=hexRGB(h);return'rgba('+c[0]+','+c[1]+','+c[2]+','+a+')'}
function clamp(v,a,b){return v<a?a:v>b?b:v}
function fract(v){return v-Math.floor(v)}

/* face colour with per-face shading + AO */
function faceCol(h,f,ao,em){
  const c=hexRGB(h);let r;
  if(em){const m=[1.04,0.95,0.86][f];r=[c[0]*m,c[1]*m,c[2]*m]}
  else{
    const m=[1.16,0.88,0.62][f];r=[c[0]*m,c[1]*m,c[2]*m];
    const t=[0,.07,.22][f];
    r=[r[0]+(46-r[0])*t,r[1]+(26-r[1])*t,r[2]+(112-r[2])*t];
    if(f===0)r=[r[0]+(255-r[0])*.05,r[1]+(236-r[1])*.05,r[2]+(214-r[2])*.05];
    const k=1-ao;r=[r[0]*k,r[1]*k,r[2]*k];
  }
  return rgbs(r);
}
const fcMemo=new Map();
function fc(h,f,em){const k=h+f+(em?'e':'');let v=fcMemo.get(k);if(!v){v=faceCol(h,f,0,em);fcMemo.set(k,v)}return v}

/* ---------- voxel model ---------- */
const key=(x,y,z)=>(x+16)+(y+16)*256+(z+32)*65536;
class Model{
  constructor(){this.v=new Map();this.faces=null}
  set(x,y,z,c){this.v.set(key(x,y,z),[x,y,z,c])}
  has(x,y,z){return this.v.has(key(x,y,z))}
  box(x,y,z,w,d,h,c){for(let i=0;i<w;i++)for(let j=0;j<d;j++)for(let k=0;k<h;k++)this.set(x+i,y+j,z+k,typeof c==='function'?c(x+i,y+j,z+k):c)}
  cyl(cx,cy,z,h,r,c,hollow){
    for(let x=Math.floor(cx-r-1);x<=Math.ceil(cx+r);x++)for(let y=Math.floor(cy-r-1);y<=Math.ceil(cy+r);y++){
      const dx=x+.5-cx,dy=y+.5-cy,d2=dx*dx+dy*dy;
      if(d2<=r*r&&(!hollow||d2>=(r-1)*(r-1)))for(let k=0;k<h;k++)this.set(x,y,z+k,typeof c==='function'?c(x,y,z+k):c)
    }
  }
  sph(cx,cy,cz,r,c){
    for(let x=Math.floor(cx-r-1);x<=Math.ceil(cx+r);x++)for(let y=Math.floor(cy-r-1);y<=Math.ceil(cy+r);y++)for(let z=Math.floor(cz-r-1);z<=Math.ceil(cz+r);z++){
      const dx=x+.5-cx,dy=y+.5-cy,dz=z+.5-cz;
      if(dx*dx+dy*dy+dz*dz<=r*r)this.set(x,y,z,typeof c==='function'?c(x,y,z):c)
    }
  }
  swapXY(){const n=new Model();for(const [x,y,z,c] of this.v.values())n.set(y,x,z,c);return n}
  compile(skipTopZ){
    const arr=[...this.v.values()].sort((a,b)=>a[0]-b[0]||a[1]-b[1]||a[2]-b[2]);
    const H=(x,y,z)=>this.has(x,y,z)?1:0;
    const faces=[];let mnx=1e9,mxx=-1e9,mny=1e9,mxy=-1e9,mnz=1e9;
    for(const [x,y,z,c0] of arr){
      mnx=Math.min(mnx,x);mxx=Math.max(mxx,x);mny=Math.min(mny,y);mxy=Math.max(mxy,y);mnz=Math.min(mnz,z);
      const em=c0[0]==='!',c=em?c0.slice(1):c0;
      const top=!this.has(x,y,z+1)&&z!==skipTopZ,lf=!this.has(x,y+1,z),rt=!this.has(x+1,y,z);
      if(!(top||lf||rt))continue;
      const f={x,y,z,t:null,l:null,r:null};
      if(top){const n=H(x-1,y,z+1)+H(x+1,y,z+1)+H(x,y-1,z+1)+H(x,y+1,z+1);f.t=faceCol(c,0,Math.min(.24,n*.07),em)}
      if(lf){const n=H(x-1,y+1,z)+H(x+1,y+1,z)+H(x,y+1,z+1)+H(x,y+1,z-1);f.l=faceCol(c,1,Math.min(.24,n*.07),em)}
      if(rt){const n=H(x+1,y-1,z)+H(x+1,y+1,z)+H(x+1,y,z+1)+H(x+1,y,z-1);f.r=faceCol(c,2,Math.min(.24,n*.07),em)}
      faces.push(f);
    }
    this.faces=faces;this.cx=(mnx+mxx+1)/2;this.cy=(mny+mxy+1)/2;this.z0=mnz;
    this.hx=mxx+1;this.hy=mxy+1;
    return this;
  }
}
function renderModel(m,X,Y,s,alpha){
  if(alpha!==undefined)ctx.globalAlpha=alpha;
  const vh=s*1.1,hs=s/2;ctx.lineWidth=.8;ctx.lineJoin='round';
  for(const f of m.faces){
    const px=X+(f.x-f.y)*s,py=Y+(f.x+f.y)*hs-f.z*vh,ty=py-vh;
    if(f.t){ctx.fillStyle=ctx.strokeStyle=f.t;ctx.beginPath();ctx.moveTo(px,ty);ctx.lineTo(px+s,ty+hs);ctx.lineTo(px,ty+s);ctx.lineTo(px-s,ty+hs);ctx.closePath();ctx.fill();ctx.stroke()}
    if(f.l){ctx.fillStyle=ctx.strokeStyle=f.l;ctx.beginPath();ctx.moveTo(px-s,ty+hs);ctx.lineTo(px,ty+s);ctx.lineTo(px,ty+s+vh);ctx.lineTo(px-s,ty+hs+vh);ctx.closePath();ctx.fill();ctx.stroke()}
    if(f.r){ctx.fillStyle=ctx.strokeStyle=f.r;ctx.beginPath();ctx.moveTo(px+s,ty+hs);ctx.lineTo(px,ty+s);ctx.lineTo(px,ty+s+vh);ctx.lineTo(px+s,ty+hs+vh);ctx.closePath();ctx.fill();ctx.stroke()}
  }
  if(alpha!==undefined)ctx.globalAlpha=1;
}
/* draw with footprint centre / base anchored at screen point */
function drawAt(m,ax,ay,s,alpha){renderModel(m,ax-(m.cx-m.cy)*s,ay-(m.cx+m.cy)*s/2+m.z0*s*1.1,s,alpha)}

/* ---------- scene geometry ---------- */
const U=58,OX=540,OY=410,S=U/8,VH=S*1.1;
const gp=(sx,sy,sz)=>[OX+(sx-sy)*S,OY+(sx+sy)*S/2-sz*VH];
function drawG(m,sx,sy,sz,sc,dz,alpha){const a=gp(sx,sy,sz);drawAt(m,a[0],a[1]+(dz||0),sc||S,alpha)}
function poly(pts,fill,stroke,lw){ctx.beginPath();ctx.moveTo(pts[0][0],pts[0][1]);for(let i=1;i<pts.length;i++)ctx.lineTo(pts[i][0],pts[i][1]);ctx.closePath();if(fill){ctx.fillStyle=fill;ctx.fill()}if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=lw||1;ctx.stroke()}}
function quadG(x0,y0,x1,y1,z,fill,stroke,lw){poly([gp(x0,y0,z),gp(x1,y0,z),gp(x1,y1,z),gp(x0,y1,z)],fill,stroke,lw)}
function cubeAt(gx,gy,gz,size,hex,em,dzpx){
  const s=S*size,vh=s*1.1,hs=s/2,a=gp(gx,gy,gz),px=a[0],ty=a[1]-vh+(dzpx||0);
  ctx.lineWidth=.6;
  ctx.fillStyle=ctx.strokeStyle=fc(hex,0,em);ctx.beginPath();ctx.moveTo(px,ty);ctx.lineTo(px+s,ty+hs);ctx.lineTo(px,ty+s);ctx.lineTo(px-s,ty+hs);ctx.closePath();ctx.fill();ctx.stroke();
  ctx.fillStyle=ctx.strokeStyle=fc(hex,1,em);ctx.beginPath();ctx.moveTo(px-s,ty+hs);ctx.lineTo(px,ty+s);ctx.lineTo(px,ty+s+vh);ctx.lineTo(px-s,ty+hs+vh);ctx.closePath();ctx.fill();ctx.stroke();
  ctx.fillStyle=ctx.strokeStyle=fc(hex,2,em);ctx.beginPath();ctx.moveTo(px+s,ty+hs);ctx.lineTo(px,ty+s);ctx.lineTo(px,ty+s+vh);ctx.lineTo(px+s,ty+hs+vh);ctx.closePath();ctx.fill();ctx.stroke();
}
function shadowG(sx,sy,r,a,sz){
  const p=gp(sx,sy,sz||0),rx=r*S*1.414,ry=r*S*.707;
  const g=ctx.createRadialGradient(p[0],p[1],0,p[0],p[1],rx);
  g.addColorStop(0,'rgba(8,2,30,'+a+')');g.addColorStop(.6,'rgba(8,2,30,'+a*.6+')');g.addColorStop(1,'rgba(8,2,30,0)');
  ctx.save();ctx.translate(p[0],p[1]);ctx.scale(1,ry/rx);ctx.translate(-p[0],-p[1]);
  ctx.fillStyle=g;ctx.beginPath();ctx.arc(p[0],p[1],rx,0,7);ctx.fill();ctx.restore();
}

/* ---------- blocky bitmap font ---------- */
const FD={
A:'01110|10001|10001|11111|10001|10001|10001',B:'11110|10001|10001|11110|10001|10001|11110',C:'01110|10001|10000|10000|10000|10001|01110',
D:'11110|10001|10001|10001|10001|10001|11110',E:'11111|10000|10000|11110|10000|10000|11111',F:'11111|10000|10000|11110|10000|10000|10000',
G:'01110|10001|10000|10111|10001|10001|01111',H:'10001|10001|10001|11111|10001|10001|10001',I:'01110|00100|00100|00100|00100|00100|01110',
J:'00111|00010|00010|00010|00010|10010|01100',K:'10001|10010|10100|11000|10100|10010|10001',L:'10000|10000|10000|10000|10000|10000|11111',
M:'10001|11011|10101|10101|10001|10001|10001',N:'10001|11001|10101|10011|10001|10001|10001',O:'01110|10001|10001|10001|10001|10001|01110',
P:'11110|10001|10001|11110|10000|10000|10000',Q:'01110|10001|10001|10001|10101|10010|01101',R:'11110|10001|10001|11110|10100|10010|10001',
S:'01111|10000|10000|01110|00001|00001|11110',T:'11111|00100|00100|00100|00100|00100|00100',U:'10001|10001|10001|10001|10001|10001|01110',
V:'10001|10001|10001|10001|10001|01010|00100',W:'10001|10001|10001|10101|10101|11011|10001',X:'10001|10001|01010|00100|01010|10001|10001',
Y:'10001|10001|01010|00100|00100|00100|00100',Z:'11111|00001|00010|00100|01000|10000|11111',
'0':'01110|10001|10011|10101|11001|10001|01110','1':'00100|01100|00100|00100|00100|00100|01110','2':'01110|10001|00001|00010|00100|01000|11111',
'3':'11110|00001|00001|01110|00001|00001|11110','4':'00010|00110|01010|10010|11111|00010|00010','5':'11111|10000|11110|00001|00001|10001|01110',
'6':'00110|01000|10000|11110|10001|10001|01110','7':'11111|00001|00010|00100|01000|01000|01000','8':'01110|10001|10001|01110|10001|10001|01110',
'9':'01110|10001|10001|01111|00001|00010|01100','!':'00100|00100|00100|00100|00100|00000|00100','-':'00000|00000|00000|11111|00000|00000|00000',
'+':'00000|00100|00100|11111|00100|00100|00000','/':'00001|00001|00010|00100|01000|10000|10000','.':'00000|00000|00000|00000|00000|00110|00110',
',':'00000|00000|00000|00000|00110|00100|01000',':':'00000|00110|00110|00000|00110|00110|00000','%':'11001|11010|00010|00100|01000|01011|10011',
' ':'00000|00000|00000|00000|00000|00000|00000','&':'01100|10010|10100|01000|10101|10010|01101'
};
function textW(s,px,sp){sp=sp==null?1:sp;return s.length*(5+sp)*px-sp*px}
function pixBlock(x,y,px,col){
  ctx.fillStyle=col;ctx.fillRect(x,y,px,px);
  if(px>=4){ctx.fillStyle=lite(col);ctx.fillRect(x,y,px,px*.24);ctx.fillRect(x,y,px*.2,px);ctx.fillStyle=dark(col);ctx.fillRect(x,y+px*.78,px,px*.22);ctx.fillRect(x+px*.8,y,px*.2,px)}
}
function pixText(str,x,y,px,col,o){
  o=o||{};str=String(str).toUpperCase();const sp=o.sp==null?1:o.sp;const w=textW(str,px,sp);
  if(o.align==='c')x-=w/2;else if(o.align==='r')x-=w;
  const rects=[];let cx=x;
  for(const ch of str){const g=(FD[ch]||FD[' ']).split('|');for(let r=0;r<7;r++)for(let c=0;c<5;c++)if(g[r][c]==='1')rects.push(cx+c*px,y+r*px);cx+=(5+sp)*px}
  const dep=o.depth||0;
  if(dep>0){ctx.fillStyle=o.side||'#12081f';for(let k=dep;k>=1;k--){const ox=k*px*.13,oy=k*px*.17;for(let i=0;i<rects.length;i+=2)ctx.fillRect(rects[i]+ox,rects[i+1]+oy,px,px)}}
  if(o.glow){ctx.save();ctx.shadowColor=o.glow;ctx.shadowBlur=o.glowBlur||12;ctx.fillStyle=col;for(let i=0;i<rects.length;i+=2)ctx.fillRect(rects[i],rects[i+1],px,px);ctx.restore()}
  if(o.bevel===false){ctx.fillStyle=col;for(let i=0;i<rects.length;i+=2)ctx.fillRect(rects[i],rects[i+1],px,px)}
  else for(let i=0;i<rects.length;i+=2)pixBlock(rects[i],rects[i+1],px,col);
}
function pixArt(rows,x,y,px,map){
  for(let r=0;r<rows.length;r++)for(let c=0;c<rows[r].length;c++){const k=rows[r][c];if(k!=='.'&&map[k])pixBlock(x+c*px,y+r*px,px,map[k])}
}

/* ---------- model builders ---------- */
function plate(m,col,acc,lvl){
  for(let x=0;x<8;x++)for(let y=0;y<8;y++){const e=x===0||y===0||x===7||y===7;m.set(x,y,0,e?'#4b4090':((x+y)&1?'#2a2350':'#30285a'))}
  for(const [cx,cy] of [[0,0],[7,0],[0,7],[7,7]])m.set(cx,cy,0,'!'+col);
  const pips=[[3],[2,4],[1,3,5]][Math.min(3,lvl)-1];
  for(const px of pips)m.set(px,7,0,'!#ffd23c');
  if(lvl>=2)for(const [cx,cy] of [[0,0],[7,0],[0,7],[7,7]])m.box(cx,cy,1,1,1,lvl>=3?3:2,'!'+acc);
}
function crown(m,topZ,lvl){
  if(lvl<3)return;
  m.set(4,4,topZ+2,'!#ffe066');m.set(3,4,topZ+2,'!#ffd23c');m.set(5,4,topZ+2,'!#ffd23c');m.set(4,3,topZ+2,'!#ffd23c');m.set(4,5,topZ+2,'!#ffd23c');m.set(4,4,topZ+3,'!#fff3b0');m.set(4,4,topZ+1,'!#ffd23c');
}
function cone(m,plane,col,lo,hi,zc){ /* speaker rings on +y (plane 'y') or +x ('x') face */
  for(let a=1;a<=6;a++)for(let z=1;z<=6;z++){
    const u=a+.5-4,v=z+.5-zc,d=Math.sqrt(u*u+v*v);
    let c=null;
    if(d<.9)c='#14102c';else if(d<1.7)c=hi;else if(d<2.3)c=col;else if(d<2.9)c=lo;
    if(c){if(plane==='y')m.set(a,6,z,c);else m.set(6,a,z,c)}
  }
}
const TURRET={
  kick(m,l){
    plate(m,'#ff7a3c','#ffd9a0',l);
    m.cyl(4,4,1,1,3.5,'#ffd9a0');m.cyl(4,4,2,3,3.1,(x,y,z)=>(x+y+z)%4===0?'#ff9a5c':'#ff7a3c');
    m.cyl(4,4,5,1,3.5,'#ffd9a0');m.cyl(4,4,6,1,2.7,'#fff1d6');m.cyl(4,4,6,1,1.8,'#ff7a3c');m.cyl(4,4,6,1,.9,'#fff1d6');
    m.box(3,4,7,2,4,2,'#2a2236');m.box(3,7,7,2,1,2,'!#ff7a3c');
    if(l>=2){m.box(1,4,7,2,3,2,'#2a2236');m.box(5,4,7,2,3,2,'#2a2236');m.box(1,6,7,2,1,2,'!#ff7a3c');m.box(5,6,7,2,1,2,'!#ff7a3c')}
    crown(m,8,l);
  },
  snare(m,l){
    plate(m,'#ffd23c','#fff3b0',l);
    m.cyl(4,4,1,3,3.1,(x,y,z)=>z===2?'#e6b020':'#ffd23c');
    for(const [x,y] of [[1,4],[6,3],[3,1],[4,6],[2,6],[6,5]])m.set(x,y,2,'#d8dcf0');
    m.cyl(4,4,4,1,3.5,'#d8dcf0');m.cyl(4,4,5,1,2.8,'#fff6d0');
    for(let t=0;t<6;t++){m.set(1+t,1+t,6,'#8a5a2a');m.set(6-t,1+t,6,'#a8723a')}
    m.set(1,1,6,'!#fff3b0');m.set(6,1,6,'!#fff3b0');
    if(l>=2){m.box(3,5,6,2,3,1,'#2a2236');m.set(3,7,6,'!#ffd23c');m.set(4,7,6,'!#ffd23c')}
    crown(m,7,l);
  },
  hat(m,l){
    plate(m,'#7dffd0','#d8fff0',l);
    m.box(4,4,1,1,1,8,'#9aa0b8');
    for(const [x,y] of [[3,4],[5,4],[4,3],[4,5]])m.set(x,y,1,'#6c738c');
    m.box(3,4,5,2,1,2,'#3a4258');
    m.box(3,5,5,1,3,1,'#2a3240');m.box(4,5,5,1,3,1,'#2a3240');m.box(3,5,6,1,3,1,'#2a3240');m.box(4,5,6,1,3,1,'#2a3240');
    m.set(3,7,5,'!#7dffd0');m.set(4,7,6,'!#7dffd0');
    m.cyl(4,4,8,1,3.4,(x,y)=>((x+y)&1)?'#58e8b8':'#7dffd0');
    m.cyl(4,4,10,1,3.0,(x,y)=>((x+y)&1)?'#7dffd0':'#a8ffe6');
    m.set(4,4,11,'#d8fff0');m.set(3,3,11,'#d8fff0');
    if(l>=2){m.set(1,4,9,'!#7dffd0');m.set(6,4,9,'!#7dffd0')}
    crown(m,11,l);
  },
  sub(m,l){
    plate(m,'#7a5cff','#c9bcff',l);
    m.box(1,1,1,6,6,6,(x,y,z)=>(z===6&&(x===1||x===6||y===1||y===6))?'!#7a5cff':'#2a2150');
    cone(m,'y','#7a5cff','#3d2f7a','#c9bcff',3.5);cone(m,'x','#7a5cff','#3d2f7a','#c9bcff',3.5);
    if(l>=2){m.box(2,2,7,4,4,2,'#3a2d70');m.set(2,5,8,'!#c9bcff');m.set(5,5,8,'!#c9bcff')}
    crown(m,l>=2?9:7,l);
  },
  mic(m,l){
    plate(m,'#ff5fb0','#ffd0ea',l);
    m.cyl(4,4,1,1,2.6,'#333147');m.box(4,4,2,1,1,5,'#c0c0d8');m.box(3,4,2,1,1,1,'#c0c0d8');
    m.sph(4,4,9.2,2.8,(x,y,z)=>((x+y+z)&1)?'#ff5fb0':'#ff9fd0');

/* enemies */
const ENY={
  fuzz:{n:8,h:7,c:'#c9c4d6'},zip:{n:6,h:6,c:'#6dffd8'},brick:{n:10,h:9,c:'#8e86a8'},echo:{n:7,h:7,c:'#b79cff'},mini:{n:4,h:4,c:'#d6c7ff'},
  leech:{n:8,h:7,c:'#8fffa0'},drone:{n:6,h:5,c:'#ff9ad2'},gate:{n:8,h:8,c:'#ffd26b'},squeal:{n:8,h:7,c:'#ff6b6b'},mute:{n:7,h:9,c:'#9fb8ff'},
  rager:{n:7,h:7,c:'#ff8a3c'},boss:{n:16,h:14,c:'#7d8bb0'}
};
function enemyModel(kind,face,seed,frame){
  const sp=ENY[kind],n=sp.n,h=sp.h,r=mulberry(seed*977+kind.length*13+(face==='i'?5:0));
  const m=new Model(),base=sp.c;
  const F=(u,v,z,c)=>{if(face==='j')m.set(Math.round(u),Math.round(v),z,c);else m.set(Math.round(v),Math.round(u),z,c)};
  const body=kind==='boss'?'#8a98c0':base;
  const z0=kind==='drone'?3:1;
  const bodyH=kind==='drone'?3:h;
  const nn=kind==='drone'?4:n, off=kind==='drone'?1:0;
  for(let x=0;x<nn;x++)for(let y=0;y<nn;y++)for(let z=0;z<bodyH;z++){
    const ex=(x===0||x===nn-1)+(y===0||y===nn-1)+(z===0||z===bodyH-1);
    if(ex>=3)continue;if(ex===2&&r()<.35&&kind!=='boss'&&kind!=='drone')continue;
    let c=adj(body,.9+r()*.2);
    if(kind==='brick'){const row=Math.floor(z/3);if(z%3===0||((x+row*2)%4===0&&(y+row*2)%4!==1))c=adj(body,.62)}
    m.set(x+off,y+off,z0+z,c);
  }
  /* tufts */
  if(kind!=='drone'){
    const tuft=adj(base,1.16);
    for(let x=0;x<n;x++)for(let y=0;y<n;y++){
      if(r()<.3)m.set(x,y,z0+h,adj(base,1.1+r()*.15));
      if(r()<.07)m.set(x,y,z0+h+1,tuft);
    }
    for(let a=0;a<n;a++)for(let z=0;z<h;z++){
      if(r()<.2&&m.has(n-1,a,z0+z))m.set(n,a,z0+z,adj(base,1.08+r()*.15));
      if(r()<.2&&m.has(a,n-1,z0+z))m.set(a,n,z0+z,adj(base,1.08+r()*.15));
    }
    if(kind!=='boss'){m.set(1,1,0,'#6f6a80');m.set(n-2,n-2,0,'#6f6a80');m.set(1,n-2,0,'#6f6a80');m.set(n-2,1,0,'#6f6a80')}
  }
  /* googly eyes */
  const eye=(u,zc,er,px,pz)=>{
    const v0=(kind==='drone'?4:n)-.2;
    for(let uu=-4;uu<=n+4;uu++)for(let vv=Math.floor(v0-er-1);vv<=Math.ceil(v0+er);vv++)for(let zz=0;zz<30;zz++){
      const du=uu+.5-u,dv=vv+.5-v0,dz=zz+.5-zc;
      if(du*du+dv*dv+dz*dz<=er*er)F(uu,vv,zz,'#ffffff');
    }
    const pv=Math.round(v0+er-.6);
    F(u-.5+px,pv,Math.round(zc-.5+pz),'#16101f');F(u+.5+px,pv,Math.round(zc-.5+pz),'#16101f');
    F(u-.5+px,pv,Math.round(zc+.5+pz),'#16101f');F(u+.5+px,pv,Math.round(zc+.5+pz),'#16101f');
  };
  if(kind==='boss'){
    eye(4.6,z0+9.5,3.1,.6,-.8);eye(11.4,z0+9.5,3.1,-.4,-.8);
    for(let u=-3;u<=3;u++){F(2.6+u*.5+3,n,z0+13,'#1a1030')}
    for(let u=3;u<=12;u++)for(let z=3;z<=5;z++)F(u,n,z0+z,'#22152f');
    for(let u=3;u<=12;u+=2){F(u,n+1,z0+5,'#e8e8f4');F(u,n+1,z0+3,'#e8e8f4')}
    for(let u=3;u<=7;u++){F(u,n,z0+11,'#2a1840');F(u,n,z0+12,'#2a1840')}
    for(let u=9;u<=12;u++){F(u,n,z0+12,'#2a1840')}
    /* top press */
    m.box(-1,-1,z0+h+2,n+2,n+2,2,'#56608a');m.box(1,1,z0+h+4,n-2,n-2,1,'#7684b0');
    m.box(3,3,z0+h+5,3,3,4,'#b9c2d6');m.box(10,10,z0+h+5,3,3,4,'#b9c2d6');m.box(3,10,z0+h+5,3,3,3,'#9aa4c0');
    m.box(2,2,z0+h+9,5,5,1,'#ff8a1e');
    m.box(7,7,z0+h+5,2,2,2,'!#ff4a5e');
    /* clamps with hazard stripes */
    m.box(-4,2,z0+1,2,n-4,h-3,(x,y,z)=>((y+z)%4<2)?'#ffcf4a':'#2a2236');
    m.box(n+2,2,z0+1,2,n-4,h-3,(x,y,z)=>((y+z)%4<2)?'#ffcf4a':'#2a2236');
    m.box(-2,5,z0+5,2,6,3,'#56608a');m.box(n,5,z0+5,2,6,3,'#56608a');
    for(const [u,c] of [[0,'!#35f0ff'],[1,'!#ff3cc8']])for(let z=2;z<12;z+=3){m.set(n+4+u,3+z%5,z0+z,c);m.set(-5-u,10-z%4,z0+z,c)}
    /* dial */
    for(let u=0;u<5;u++){m.set(6+u,n+1,z0+1,'#e8e8f4')}
  } else if(kind==='drone'){
    /* props + cyclops */
    const pc='#ffe0f0';
    m.box(0,0,z0,1,1,1,'#7a3a6a');m.box(5,0,z0,1,1,1,'#7a3a6a');m.box(0,5,z0,1,1,1,'#7a3a6a');m.box(5,5,z0,1,1,1,'#7a3a6a');
    m.box(0,0,z0+1,6,1,1,'#7a3a6a');m.box(0,5,z0+1,6,1,1,'#7a3a6a');m.box(0,0,z0+1,1,6,1,'#7a3a6a');m.box(5,0,z0+1,1,6,1,'#7a3a6a');
    for(const [px,py] of [[0,0],[5,0],[0,5],[5,5]]){
      if(frame%2===0){m.box(px-1,py,z0+2,3,1,1,pc);m.box(px,py-1,z0+2,1,3,1,pc)}else{m.box(px-1,py-1,z0+2,3,3,1,'#f9b8da')}
    }
    eye(3,z0+1.6,1.7,.2,-.2);
    m.set(2,3,z0+4,'!#ffffff');
  } else {
    const ez=z0+Math.round(h*.55);
    if(kind==='zip'){eye(2,ez,1.5,.4,-.2);eye(4,ez,1.5,-.3,-.3);
      for(let t=1;t<=5;t++){F(-t,2,z0+2,'!#35f0ff');F(-t-1,4,z0+4,'!#ff3cc8');m.set(-t,1+(t%3),z0+3,t%2?'!#35f0ff':'!#ff3cc8')}
    }
    else if(kind==='brick'){eye(3,ez,1.6,.3,-.4);eye(7,ez,1.6,-.4,-.4);for(let t=0;t<3;t++){F(2+t*.7,n,ez+3,'#16101f');F(8-t*.7,n,ez+3+0,'#16101f')} F(3,n,ez+3+1,'#16101f');F(7,n,ez+3+1,'#16101f')}
    else if(kind==='echo'){m.box(-2,-2,z0+1,5,5,5,adj(base,1.25));eye(2.3,ez,2,.5,-.4);eye(5,ez,2,-.5,-.2)}
    else if(kind==='leech'){eye(2.3,ez,1.9,.4,-.4);eye(5.7,ez,1.9,-.4,-.4);
      for(let t=-2;t<=2;t++){F(4+t,n,z0+h+0,'#ffffff')}
      m.box(3,3,z0+h+2,2,2,3,'#ffffff');m.box(2,3,z0+h+3,4,2,1,'#ffffff');m.box(3,3,z0+h+3,2,2,1,'!#ffffff')}
    else if(kind==='gate'){eye(2.5,ez+1,1.8,.4,-.4);eye(5.5,ez+1,1.8,-.4,-.4);
      for(let u=-1;u<=9;u++)for(let z=1;z<=7;z++){const edge=u===-1||u===9||z===1||z===7;F(u,n+2,z0+z,edge?'#a8782a':'!#ffe69a')}}
    else if(kind==='squeal'){eye(2.3,ez+1,1.7,.3,-.2);eye(5.7,ez+1,1.7,-.3,-.2);
      for(let u=2;u<=5;u++)for(let z=1;z<=3;z++)F(u,n-1,z0+z,'#2a0a14');F(3,n-1,z0+1,'#ff8aa0');F(4,n-1,z0+1,'#ff8aa0');
      m.box(-1,2,z0+3,1,3,2,'#8a1a2a');F(n,3,z0+1,'!#ffe066');F(n,5,z0+2,'!#ffe066')}
    else if(kind==='rager'){eye(2.2,ez,1.7,.3,-.5);eye(4.8,ez,1.7,-.3,-.5);m.box(0,0,z0+h+1,1,1,2,'#3a1a10');m.box(n-1,n-1,z0+h+1,1,1,2,'#3a1a10');m.box(0,n-1,z0+h+1,1,1,2,'#3a1a10');m.box(n-1,0,z0+h+1,1,1,2,'#3a1a10')}
    else if(kind==='mini'){eye(1.2,ez,1,.1,-.1);eye(2.8,ez,1,-.1,-.1)}
    else {eye(2.3,ez,1.9,.5,-.4);eye(5.7,ez,1.9,-.4,-.3);
      for(let u=3;u<=5;u++)F(u,n-1,z0+1,'#2a2236');F(2,n-1,z0+2,'#2a2236');F(6,n-1,z0+2,'#2a2236')}
    /* glitch bits */
    for(let q=0;q<5;q++){const gz=z0+1+Math.floor(r()*h);const gy=Math.floor(r()*n);m.set(n+1,gy,gz,q%2?'!#35f0ff':'!#ff3cc8')}
    for(let q=0;q<2;q++){const gz=z0+1+Math.floor(r()*h);m.set(-1,Math.floor(r()*n),gz,'!#35f0ff')}
  }
  return m.compile();
}

function buildIsland(){
  const m=new Model();
  for(let x=0;x<64;x++)for(let y=0;y<64;y++){
    const ed=Math.min(x,y,63-x,63-y);
    const d=Math.min(13,2+Math.floor(ed*1.35+hash2(x,y,7)*2.2));
    for(let k=1;k<=d;k++){
      const n=hash2(x,y,k);let c;
      if(k===1)c=n<.33?'#7bdc45':n<.66?'#6ccb3c':'#62bf36';
      else if(k===2)c=n<.5?'#5aa834':'#8b5a3a';
      else if(k<=5)c=n<.34?'#8b5a3a':n<.67?'#7d5233':'#946140';
      else c=n<.33?'#6a6296':n<.66?'#5a527f':'#74699f';
      if(k>=6&&n>.97)c='!#35c8ff';
      m.set(x,y,-k,c);
    }
  }
  return m.compile(-1);
}
function buildBuilding(w,d,h,seed){
  const m=new Model(),r=mulberry(seed);

  m.box(0,0,0,w,d,h,col);

    if(r()<.5){const c=r()<.6?'!#ffd77a':r()<.5?'!#35c8ff':'!#ff8ac8';m.set(a,d-1,z,c);m.set(w-1,a<d-1?a:d-2,z,c)}
  }
  if(seed%2){m.box(w>>1,d>>1,h,1,1,4,'#5a4a98');m.set(w>>1,d>>1,h+4,'!#ff4a5e')}
  return m.compile();
}
function buildCloud(seed){
  const m=new Model(),r=mulberry(seed);

function buildPedestal(acc){

function buildCoin(){
  const m=new Model();
  for(let x=0;x<11;x++)for(let z=0;z<11;z++){
    const dx=x+.5-5.5,dz=z+.5-5.5,d=Math.hypot(dx,dz);if(d>5.4)continue;
    let c=d>4.4?'#e8a820':'#ffd23c';if(d>4.4)c=(x+z)%3===0?'#ffe27a':'#e8a820';
    for(let y=0;y<3;y++)m.set(x,y,z,y===2?c:adj(c,.85));
  }
  const note=['..XX.','..X.X','..X..','..X..','XXX..','XXX..'];
  for(let r=0;r<6;r++)for(let c=0;c<5;c++)if(note[r][c]==='X')m.set(3+c,3,8-r,'#b36a10');
  return m.compile();
}
function buildGem(){
  const m=new Model();
  for(let x=0;x<11;x++)for(let y=0;y<5;y++)for(let z=0;z<11;z++){
    const dx=Math.abs(x+.5-5.5),dy=Math.abs(y+.5-2.5)*1.8,dz=z+.5-5.5;
    const d=dx+dy+Math.abs(dz)*(dz>0?1:.8);
    if(d<=5.2){const t=dz>0?(dx+dy<2.6?'#b5ecff':'#5fd6ff'):((x+y)&1?'#2aa0e8':'#1d86d0');m.set(x,y,z,t)}
  }
  m.set(4,4,8,'!#ffffff');m.set(5,4,8,'!#ffffff');m.set(4,4,7,'!#e8faff');
  return m.compile();
}
function buildRecord(){
  const m=new Model();
  for(let x=0;x<11;x++)for(let z=0;z<11;z++){
    const dx=x+.5-5.5,dz=z+.5-5.5,d=Math.hypot(dx,dz);if(d>5.4)continue;
    let c=d<1.2?'#16101f':d<2.6?'#9dff3a':((Math.floor(d)&1)?'#22223a':'#14141f');
    for(let y=0;y<2;y++)m.set(x,y,z,y?c:adj(c,.8));
  }
  for(let t=0;t<4;t++){m.set(2+t,2,7+t*0,'!#ffffff');m.set(3+t,2,8-t,'!#c9bcff')}
  m.set(5,2,5,'#ff5fb0');m.set(6,2,5,'#ff5fb0');
  return m.compile();
}

function drawFX(T){

    const p=gp(f.sx,f.sy,f.sz),g=ctx.createRadialGradient(p[0],p[1],0,p[0],p[1],f.r*3);

    ctx.fillStyle=g;ctx.fillRect(p[0]-f.r*3,p[1]-f.r*3,f.r*6,f.r*6);
  }

  const sweep=Math.sin(T*1.1);
  const beams=[[420,205,'#ff5fb0',-60],[540,190,'#9dff3a',0],[660,205,'#35c8ff',60]];
  beams.forEach(([x,y,c,off],i)=>{
    const tx=540+off*2+sweep*90*(i-1)+(i===1?sweep*60:0),ty=470;
    const g=ctx.createLinearGradient(x,y,tx,ty);g.addColorStop(0,rgba(c,.45));g.addColorStop(1,rgba(c,0));
    ctx.fillStyle=g;ctx.beginPath();ctx.moveTo(x-6,y);ctx.lineTo(x+6,y);ctx.lineTo(tx+60,ty);ctx.lineTo(tx-60,ty);ctx.closePath();ctx.fill();

/* ---------- cast sheet ---------- */
function cell(x,y,w,h,acc,label,labelCol){
  ctx.fillStyle='#0b0620';ctx.fillRect(x-3,y-3,w+6,h+6);
  const g=ctx.createLinearGradient(0,y,0,y+h);g.addColorStop(0,'#2a1d5c');g.addColorStop(1,'#15103a');
  ctx.fillStyle=g;ctx.fillRect(x,y,w,h);
  ctx.fillStyle=acc;ctx.fillRect(x,y,w,5);ctx.fillRect(x,y,5,16);ctx.fillRect(x+w-5,y,5,16);
  if(label)pixText(label,x+w/2,y+h-26,3,labelCol||'#ffffff',{align:'c',depth:1,side:'#12081f',bevel:false});
}
function isoFloor(cx,cy,rx,col){
  const g=ctx.createRadialGradient(cx,cy,2,cx,cy,rx);g.addColorStop(0,rgba(col,.5));g.addColorStop(1,rgba(col,0));
  ctx.save();ctx.translate(cx,cy);ctx.scale(1,.5);ctx.translate(-cx,-cy);ctx.fillStyle=g;ctx.beginPath();ctx.arc(cx,cy,rx,0,7);ctx.fill();ctx.restore();
}
function drawCast(T){
  const y0=1290;
  const g=ctx.createLinearGradient(0,y0,0,H);g.addColorStop(0,'#1c1242');g.addColorStop(1,'#0a0620');ctx.fillStyle=g;ctx.fillRect(0,y0,W,H-y0);
  /* iso lattice */
  ctx.strokeStyle='rgba(120,100,220,.14)';ctx.lineWidth=2;
  for(let k=-20;k<30;k++){ctx.beginPath();ctx.moveTo(k*80,y0);ctx.lineTo(k*80+800,y0+400);ctx.stroke();ctx.beginPath();ctx.moveTo(k*80+800,y0);ctx.lineTo(k*80,y0+400);ctx.stroke()}
  ctx.fillStyle='#ff5fb0';ctx.fillRect(0,y0-2,W,6);
  for(let x=0;x<W;x+=24){ctx.fillStyle=((x/24)&1)?'#9dff3a':'#35c8ff';ctx.fillRect(x,y0+4,12,4)}
  /* heroes */
  const hbob=Math.abs(Math.sin(Math.PI*T*128/60))*8;
  cell(30,1318,468,560,'#9dff3a',null);
  isoFloor(264,1800,200,'#ff5fb0');
  drawAt(MODELS.ped.lime,150,1800,13);
  drawAt(MODELS.ped.pink,382,1800,13);
  drawAt(MODELS.roxor,150,1778-hbob,11.6);
  drawAt(MODELS.jasmin,370,1778-Math.abs(Math.sin(Math.PI*T*128/60+1.2))*8,11.6);
  pixText('ROXORLOOPS',150,1850,3,'#9dff3a',{align:'c',depth:2,side:'#12081f',bevel:false});
  pixText('JASMIN',382,1850,3,'#ff5fb0',{align:'c',depth:2,side:'#12081f',bevel:false});
  pixText('THE DUO',264,1330,3,'#ffffff',{align:'c',depth:2,side:'#12081f',bevel:false});
  /* title lockup */
  const tx=520,ty=1318,tw=530;
  ctx.fillStyle='#0b0620';ctx.fillRect(tx-3,ty-3,tw+6,170);
  const tg=ctx.createLinearGradient(0,ty,0,ty+164);tg.addColorStop(0,'#3a2682');tg.addColorStop(1,'#1c1250');ctx.fillStyle=tg;ctx.fillRect(tx,ty,tw,164);
  const cols=['#9dff3a','#ffd23c','#ff8a1e','#ff5fb0','#35c8ff'];
  const word='VOXEL',px=14;const wlen=textW(word,px,1);let cx0=tx+tw/2-wlen/2;
  for(let i=0;i<word.length;i++)pixText(word[i],cx0+i*6*px,ty+30,px,cols[i],{depth:3,side:'#12081f',sp:1});
  pixText('DROP THE BASS',tx+tw/2,ty+142,3,'#c9bcff',{align:'c',bevel:false});
  pixText('STYLE 08',tx+14,ty+10,3,'#ffffff',{bevel:false});
  const clipCell=(x,y,w,h,fn)=>{ctx.save();ctx.beginPath();ctx.rect(x,y,w,h);ctx.clip();fn();ctx.restore()};
  const trs=[['kick',3,'KICK CANNON','#ff7a3c'],['mic',2,'SIREN MIC','#ff5fb0'],['cowbell',3,'COWBELL','#ffb02e']];
  trs.forEach((t,i)=>{
    const x=tx+i*(168+13),y=1500;cell(x,y,168,190,t[3],null);
    isoFloor(x+84,y+148,70,t[3]);
    clipCell(x,y,168,190,()=>drawAt(turretModel(t[0],t[1]),x+84,y+156,8.2));
    pixText(t[2],x+84,y+166,2,'#ffffff',{align:'c',bevel:false});
  });
  const ens=[['fuzz',8.6,'FUZZ','#c9c4d6',3],['brick',7.2,'BRICKWALL','#8e86a8',4],['boss',3.9,'COMPRESSOR','#ff4a5e',1]];
  ens.forEach((t,i)=>{
    const x=tx+i*(168+13),y=1700;cell(x,y,168,172,t[3],null);
    isoFloor(x+84,y+122,70,t[3]);
    const mdl=getEnemy(t[0],'j',t[4],0);
    clipCell(x,y,168,172,()=>drawAt(mdl,x+84,y+128-Math.abs(Math.sin(T*3+i*2))*4,t[1]));
    pixText(t[2],x+84,y+148,2,'#ffffff',{align:'c',bevel:false});
  });
  const cur=[['COIN',MODELS.coin,'#ffd23c'],['DIAMOND',MODELS.gem,'#5fd6ff'],['RECORD',MODELS.rec,'#9dff3a']];
  ctx.fillStyle='#0b0620';ctx.fillRect(tx-3,1878,tw+6,38);
  cur.forEach((c,i)=>{
    const x=tx+i*(168+13);
    ctx.fillStyle='#1c1250';ctx.fillRect(x,1881,168,32);
    drawAt(c[1],x+26,1908,2.7);
    pixText(c[0],x+100,1890,3,c[2],{align:'c',bevel:false});
  });
}

/* ---------- frame ---------- */
function drawPhone(T){
  ctx.fillStyle='#07040f';ctx.fillRect(0,0,W,1290);
  ctx.save();
  rr(16,16,1048,1250,64);ctx.clip();
  drawBackdrop(T);
  drawWalls(T);
  drawGround(T);
  /* stage */
  shadowG(14,14,22,.4,0);
  drawG(MODELS.stage,14,14,0,S);
  collectObjects(T);
  for(const o of OBJ)o.fn();
  drawFX(T);
  drawControls(T);
  drawHUD(T);
  ctx.restore();
  /* bezel */
  ctx.strokeStyle='#07040f';ctx.lineWidth=18;rr(16,16,1048,1250,64);ctx.stroke();
  ctx.strokeStyle='#3a2d78';ctx.lineWidth=3;rr(6,6,1068,1270,74);ctx.stroke();
  ctx.fillStyle='#07040f';rr(430,22,220,34,17);ctx.fill();ctx.fillStyle='#1c1450';ctx.beginPath();ctx.arc(612,39,7,0,7);ctx.fill();
}
function frame(T){
  ctx.setTransform(1,0,0,1,0,0);
  drawPhone(T);
  drawCast(T);
}
const T0=2.6;
function loop(ms){
  frame(FIX!=null?FIX:T0+ms/1000);
  if(FIX==null)requestAnimationFrame(loop);
}
frame(FIX!=null?FIX:T0);
if(FIX==null)requestAnimationFrame(loop);
window.__ready=true;
})();
</script></body></html>
