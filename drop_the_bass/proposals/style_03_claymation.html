<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Drop the Bass Claymation</title>
<style>
html,body{margin:0;height:100%;background:#2a1d3f}
body{display:flex;align-items:center;justify-content:center;overflow:hidden}
canvas{display:block;width:min(100vw,calc(100vh*1080/1920));height:auto;aspect-ratio:1080/1920}
</style>
</head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<script>
'use strict';
/* Claymation: plasticine stop motion. Soft lumpy clay forms with fingerprint dents, warm subsurface rim light,
   felt and corrugated cardboard set dressing, blurred backdrop, 12 fps boil. All procedural, seeded. */
const W = 1080, H = 1920;
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
let X = ctx;
let T = 0, FRM = 0;

/* ---------------------------------------------------------------- colour helpers */
function P(c) {
  if (c[0] === '#') { c = c.slice(1); if (c.length === 3) c = c[0]+c[0]+c[1]+c[1]+c[2]+c[2]; return [parseInt(c.slice(0, 2), 16), parseInt(c.slice(2, 4), 16), parseInt(c.slice(4, 6), 16)]; }
  return c.match(/[\d.]+/g).slice(0, 3).map(Number);
}
function rgbS(a) { return 'rgb(' + a.map(v => Math.max(0, Math.min(255, Math.round(v)))).join(',') + ')'; }
function mix(a, b, t) { const A = P(a), B = P(b); return rgbS(A.map((v, i) => v + (B[i] - v) * t)); }
const lit = (c, t = .35) => mix(c, '#fff3dc', t);
const drk = (c, t = .35) => mix(c, '#2b0f3a', t);
const al = (c, a) => { const v = P(c); return 'rgba(' + v.map(Math.round).join(',') + ',' + a + ')'; };
function rnd(seed) {
  let s = (seed | 0) >>> 0;
  return () => { s = (s + 0x6D2B79F5) >>> 0; let t = s; t = Math.imul(t ^ t >>> 15, t | 1); t ^= t + Math.imul(t ^ t >>> 7, t | 61); return ((t ^ t >>> 14) >>> 0) / 4294967296; };
}
const FONT = '"Inter","Arial Rounded MT Bold","DejaVu Sans",sans-serif';

/* ---------------------------------------------------------------- clay primitives */
function blobPath(cx, cy, rx, ry, rot, seed, wob) {
  const N = 22, r = rnd(seed * 977 + 13);
  const ph = [r() * 6.28, r() * 6.28, r() * 6.28], am = [r() + .3, r() + .3, r() + .3];
  const b = (FRM % 3) * 0.55;
  const pts = [], cr = Math.cos(rot), sr = Math.sin(rot);
  for (let i = 0; i < N; i++) {
    const a = i / N * 6.2832;
    const k = 1 + wob * (am[0] * Math.sin(2 * a + ph[0] + b) + am[1] * Math.sin(3 * a + ph[1] - b) + am[2] * Math.sin(5 * a + ph[2] + b * .7));
    const px = Math.cos(a) * rx * k, py = Math.sin(a) * ry * k;
    pts.push([cx + px * cr - py * sr, cy + px * sr + py * cr]);
  }
  X.beginPath();
  X.moveTo((pts[N - 1][0] + pts[0][0]) / 2, (pts[N - 1][1] + pts[0][1]) / 2);
  for (let i = 0; i < N; i++) {
    const p = pts[i], q = pts[(i + 1) % N];
    X.quadraticCurveTo(p[0], p[1], (p[0] + q[0]) / 2, (p[1] + q[1]) / 2);
  }
  X.closePath();
}
function rpoly(pts, r) {
  const n = pts.length, mid = (a, b) => [(a[0] + b[0]) / 2, (a[1] + b[1]) / 2];
  X.beginPath();
  const m0 = mid(pts[n - 1], pts[0]); X.moveTo(m0[0], m0[1]);
  for (let i = 0; i < n; i++) { const m = mid(pts[i], pts[(i + 1) % n]); X.arcTo(pts[i][0], pts[i][1], m[0], m[1], r); }
  X.closePath();
}
function heartPath(x, y, s) {
  X.beginPath(); X.moveTo(x, y + s * .95);
  X.bezierCurveTo(x - s * 1.6, y - s * .1, x - s * .95, y - s * 1.15, x, y - s * .4);
  X.bezierCurveTo(x + s * .95, y - s * 1.15, x + s * 1.6, y - s * .1, x, y + s * .95); X.closePath();
}
function prints(cx, cy, rx, ry, seed, n) {
  const r = rnd(seed * 31 + 7);
  X.lineCap = 'round';
  for (let i = 0; i < n; i++) {
    const a = r() * 6.28, d = Math.sqrt(r()) * .66;
    const px = cx + Math.cos(a) * rx * d, py = cy + Math.sin(a) * ry * d, s = Math.min(rx, ry) * (.12 + r() * .12);
    const a0 = r() * 6.28;
    for (let k = 0; k < 3; k++) {
      const rr = s * (.35 + k * .3), a1 = a0 + k * .35;
      X.beginPath(); X.arc(px, py, rr, a1, a1 + 2.3); X.strokeStyle = 'rgba(40,0,40,.14)'; X.lineWidth = 1.5; X.stroke();
      X.beginPath(); X.arc(px + 1.4, py + 1.4, rr, a1, a1 + 2.3); X.strokeStyle = 'rgba(255,255,255,.16)'; X.stroke();
    }
  }
}
function clayShape(fn, cx, cy, rx, ry, col, o) {
  o = o || {};
  const L = [-.5, -.6], R = Math.max(rx, ry), m = Math.min(rx, ry);
  X.save();
  fn();
  const g = X.createRadialGradient(cx + L[0] * rx * .8, cy + L[1] * ry * .8, m * .08, cx + rx * .08, cy + ry * .1, R * 1.25);
  g.addColorStop(0, lit(col, .5)); g.addColorStop(.38, col); g.addColorStop(.85, drk(col, .28)); g.addColorStop(1, drk(col, .5));
  X.fillStyle = g; X.fill();
  X.save(); X.clip();
  const g2 = X.createRadialGradient(cx + L[0] * rx * .25, cy + L[1] * ry * .25, m * .45, cx, cy, R * 1.12);
  const sss = mix(lit(col, .15), '#ff6a44', .5);
  g2.addColorStop(0, al(sss, 0)); g2.addColorStop(.68, al(sss, 0)); g2.addColorStop(1, al(sss, .62));
  X.fillStyle = g2; X.fillRect(cx - R * 1.8, cy - R * 1.8, R * 3.6, R * 3.6);
  X.globalAlpha = .42; X.fillStyle = '#fff';
  X.beginPath(); X.ellipse(cx + L[0] * rx * .52, cy + L[1] * ry * .58, rx * .26, ry * .12, -.75, 0, 6.28); X.fill();
  X.globalAlpha = .2; X.beginPath(); X.ellipse(cx + L[0] * rx * .1, cy + L[1] * ry * .16, rx * .6, ry * .4, -.75, 0, 6.28); X.fill();
  X.globalAlpha = 1;
  const np = o.prints === undefined ? Math.floor(m / 15) : o.prints;
  if (np > 0) prints(cx, cy, rx, ry, o.seed || 1, np);
  X.restore();
  if (o.edge !== false) { fn(); X.lineWidth = Math.max(1.2, m * .045); X.strokeStyle = al(drk(col, .65), .6); X.stroke(); }
  X.restore();
}
function clay(cx, cy, rx, ry, col, o) {
  o = o || {};
  const rot = o.rot || 0, seed = o.seed || ((rx * 131 + ry * 71 + (P(col)[0] * 3)) | 0), wob = o.wob === undefined ? .035 : o.wob;
  clayShape(() => blobPath(cx, cy, rx, ry, rot, seed, wob), cx, cy, rx, ry, col, { prints: o.prints, seed, edge: o.edge });
}
function tube(x1, y1, x2, y2, w, col, o) {
  const dx = x2 - x1, dy = y2 - y1, len = Math.hypot(dx, dy);
  clay((x1 + x2) / 2, (y1 + y2) / 2, len / 2 + w * .45, w / 2, col, Object.assign({ rot: Math.atan2(dy, dx) }, o || {}));
}
function shadow(x, y, rx, ry, a) {
  X.save(); X.translate(x, y); X.scale(1, ry / rx);
  const g = X.createRadialGradient(0, 0, rx * .2, 0, 0, rx);
  g.addColorStop(0, 'rgba(20,0,30,' + (a || .35) + ')'); g.addColorStop(1, 'rgba(20,0,30,0)');
  X.fillStyle = g; X.beginPath(); X.arc(0, 0, rx, 0, 6.28); X.fill(); X.restore();
}
function torus(x, y, r, w, col, o) {
  X.save(); X.lineCap = 'round';
  X.beginPath(); X.arc(x, y, r, 0, 6.28); X.strokeStyle = al(drk(col, .6), .8); X.lineWidth = w + 3; X.stroke();
  X.strokeStyle = col; X.lineWidth = w; X.stroke();
  X.beginPath(); X.arc(x - w * .1, y - w * .1, r, 3.4, 4.9); X.strokeStyle = lit(col, .6); X.lineWidth = w * .35; X.globalAlpha = .8; X.stroke();
  X.beginPath(); X.arc(x, y, r, 0.2, 1.6); X.strokeStyle = mix(col, '#ff6a44', .5); X.lineWidth = w * .3; X.globalAlpha = .5; X.stroke();
  X.restore();
}
function bead(x, y, r, col, seed) { clay(x, y, r, r, col, { prints: 0, seed: seed || 5, wob: .02 }); }
function star4(x, y, r, col, rot) {
  const pts = []; for (let i = 0; i < 8; i++) { const a = i / 8 * 6.283 + (rot || 0), rr = i % 2 ? r * .42 : r; pts.push([x + Math.cos(a) * rr, y + Math.sin(a) * rr]); }
  clayShape(() => rpoly(pts, r * .15), x, y, r, r, col, { prints: 0 });
}
function felt(x, y, w, h, col, seed, rad, density) {
  X.save();
  X.beginPath(); X.roundRect(x, y, w, h, rad || 0); X.clip();
  X.fillStyle = col; X.fillRect(x, y, w, h);
  const r = rnd(seed), n = Math.min(9000, (w * h) / (density || 34));
  X.lineCap = 'round'; X.lineWidth = 1.3;
  for (let i = 0; i < n; i++) {
    const px = x + r() * w, py = y + r() * h, a = r() * 6.28, l = 3 + r() * 4;
    X.strokeStyle = r() < .5 ? al(lit(col, .5), .1 + r() * .1) : al(drk(col, .5), .1 + r() * .1);
    X.beginPath(); X.moveTo(px, py); X.lineTo(px + Math.cos(a) * l, py + Math.sin(a) * l); X.stroke();
  }
  X.restore();
}
function cardboard(x, y, w, h, col, rad, vertical) {
  X.save(); X.beginPath(); X.roundRect(x, y, w, h, rad || 0); X.clip();
  const g = X.createLinearGradient(x, y, x + w, y + h);
  g.addColorStop(0, lit(col, .15)); g.addColorStop(1, drk(col, .15)); X.fillStyle = g; X.fillRect(x, y, w, h);
  X.strokeStyle = al(drk(col, .5), .16); X.lineWidth = 2;
  if (vertical) for (let i = x; i < x + w; i += 7) { X.beginPath(); X.moveTo(i, y); X.lineTo(i, y + h); X.stroke(); }
  else for (let i = y; i < y + h; i += 7) { X.beginPath(); X.moveTo(x, i); X.lineTo(x + w, i); X.stroke(); }
  X.strokeStyle = al(lit(col, .6), .2);
  if (vertical) for (let i = x + 3; i < x + w; i += 7) { X.beginPath(); X.moveTo(i, y); X.lineTo(i, y + h); X.stroke(); }
  else for (let i = y + 3; i < y + h; i += 7) { X.beginPath(); X.moveTo(x, i); X.lineTo(x + w, i); X.stroke(); }
  const r = rnd((x * 7 + y * 3) | 0);
  for (let i = 0; i < w * h / 500; i++) { X.fillStyle = 'rgba(80,40,10,' + (.05 + r() * .08) + ')'; X.fillRect(x + r() * w, y + r() * h, 2, 2); }
  X.restore();
  X.beginPath(); X.roundRect(x, y, w, h, rad || 0); X.strokeStyle = al(drk(col, .55), .8); X.lineWidth = 3; X.stroke();
}
function stitch(x, y, w, h, rad, col) {
  X.save(); X.setLineDash([9, 7]); X.lineCap = 'round'; X.lineWidth = 3; X.strokeStyle = col;
  X.beginPath(); X.roundRect(x, y, w, h, rad); X.stroke(); X.restore();
}
function clayText(str, x, y, size, col, o) {
  o = o || {};
  X.save();
  X.font = '900 ' + size + 'px ' + FONT; X.textAlign = o.align || 'center'; X.textBaseline = 'middle'; X.lineJoin = 'round'; X.lineCap = 'round';
  const d = o.depth === undefined ? size * .1 : o.depth, sw = size * .13;
  X.strokeStyle = drk(col, .8); X.lineWidth = sw + 6; X.strokeText(str, x + d * .3, y + d);
  for (let i = d; i > 0; i -= 1.2) { X.strokeStyle = drk(col, .55); X.fillStyle = drk(col, .55); X.lineWidth = sw; X.strokeText(str, x + i * .3, y + i); X.fillText(str, x + i * .3, y + i); }
  const g = X.createLinearGradient(0, y - size * .6, 0, y + size * .6);
  g.addColorStop(0, lit(col, .3)); g.addColorStop(.45, col); g.addColorStop(1, drk(col, .2));
  X.strokeStyle = g; X.lineWidth = sw; X.strokeText(str, x, y);
  X.fillStyle = g; X.fillText(str, x, y);
  X.globalAlpha = .55; X.strokeStyle = lit(col, .75); X.lineWidth = Math.max(1.5, size * .03); X.strokeText(str, x - size * .015, y - size * .035);
  X.restore();
}
function tag(str, x, y, w, size, col) {
  cardboard(x - w / 2, y - size * .8, w, size * 1.6, col || '#d6a86c', 10, false);
  X.fillStyle = '#4a2a14'; X.beginPath(); X.arc(x - w / 2 + 14, y, 4, 0, 6.28); X.fill();
  X.font = '800 ' + size + 'px ' + FONT; X.textAlign = 'center'; X.textBaseline = 'middle'; X.fillStyle = '#3a1f10'; X.fillText(str, x + 6, y + 1);
}
function glow(x, y, r, col, a) {
  const g = X.createRadialGradient(x, y, 0, x, y, r); g.addColorStop(0, al(col, a)); g.addColorStop(1, al(col, 0));
  X.fillStyle = g; X.fillRect(x - r, y - r, r * 2, r * 2);
}
function splat(x, y, r, col, rot) {
  const pts = [], n = 10;
  for (let i = 0; i < n * 2; i++) { const a = i / (n * 2) * 6.283 + rot, rr = i % 2 ? r * .52 : r * (.85 + ((i * 37) % 5) * .06); pts.push([x + Math.cos(a) * rr, y + Math.sin(a) * rr]); }
  clayShape(() => rpoly(pts, r * .08), x, y, r, r, col, { prints: 0 });
}

/* ---------------------------------------------------------------- game data (ids from data_core.js) */
const TCOL = { kick: '#ff7a3c', snare: '#ffd23c', hat: '#7dffd0', sub: '#7a5cff', mic: '#ff5fb0', synth: '#35c8ff', horn: '#ff4a5e', scratch: '#e5e5ff', cowbell: '#ffb02e' };
const TACC = { kick: '#ffd9a0', snare: '#fff3b0', hat: '#d8fff0', sub: '#c9bcff', mic: '#ffd0ea', synth: '#c4f1ff', horn: '#ffc4cb', scratch: '#ffffff', cowbell: '#fff0c4' };
const TNAME = { kick: 'Kick Cannon', snare: 'Snare Snapper', hat: 'Hi-Hat Gatling', sub: 'Sub Bass', mic: 'Siren Mic', synth: 'Arc Synth', horn: 'Air Horn', scratch: 'Vinyl Scratcher', cowbell: 'Cowbell Sniper' };
const ECOL = { fuzz: '#c9c4d6', zip: '#6dffd8', brick: '#8e86a8', echo: '#b79cff', leech: '#8fffa0', drone: '#ff9ad2', gate: '#ffd26b', squeal: '#ff6b6b', compressor: '#7d8bb0' };

/* ---------------------------------------------------------------- turrets */
function turret(type, lv, x, y, s, o) {
  o = o || {};
  const ang = o.ang === undefined ? -1.2 : o.ang, f = o.fire || 0, col = TCOL[type], acc = TACC[type];
  const ca = Math.cos(ang), sa = Math.sin(ang);
  const Q = (dx, dy) => [x + dx * s, y + dy * s];
  shadow(x, y + 24 * s, 58 * s, 15 * s, .38);
  clay(x, y + 16 * s, 51 * s, 27 * s, mix(col, '#4a3a8a', .6), { seed: 3 });
  clay(x, y + 7 * s, 45 * s, 22 * s, mix(col, '#7a6ab0', .5), { seed: 5, prints: 3 });
  for (let i = 0; i < lv; i++) bead(x + (i - (lv - 1) / 2) * 12.5 * s, y + 31 * s, 5.2 * s, '#ffd94a', i + 9);
  if (lv >= 4) { const [sx, sy] = Q(40, 14); star4(sx, sy, 10 * s, '#fff1a0', .3); }
  const hy = -16;
  if (type === 'kick') {
    const [bx, by] = Q(0, hy), rc = -f * 8 * s, tx = bx + ca * (46 * s + rc), ty = by + sa * (46 * s + rc);
    tube(bx, by, tx, ty, 34 * s, mix(col, '#8a2a10', .45));
    clay(tx, ty, 19 * s, 19 * s, '#3a2038', { prints: 0 }); clay(tx, ty, 11 * s, 11 * s, '#150a18', { prints: 0 });
    clay(bx, by, 39 * s, 37 * s, col);
    clay(bx, by, 27 * s, 25 * s, acc, { prints: 2 });
    torus(bx, by, 15 * s, 6 * s, col); bead(bx, by, 5 * s, lit(col, .5));
    for (let i = 0; i < 8; i++) { const a = i / 8 * 6.28; bead(bx + Math.cos(a) * 38 * s, by + Math.sin(a) * 36 * s, 4.2 * s, '#fff0d0', i); }
    if (f > .3) splat(tx + ca * 12 * s, ty + sa * 12 * s, 18 * s * f, '#ffe45a', f);
  } else if (type === 'snare') {
    const [bx, by] = Q(0, hy + 6);
    tube(bx, by, bx + ca * 40 * s, by + sa * 40 * s, 15 * s, '#b88a1c');
    bead(bx + ca * 42 * s, by + sa * 42 * s, 9 * s, '#2a1a18');
    clay(bx, by + 10 * s, 46 * s, 26 * s, col, { seed: 21 });
    clay(bx, by, 46 * s, 24 * s, acc, { seed: 22, prints: 3 });
    torus(bx, by, 30 * s, 5 * s, col);
    for (let i = 0; i < 9; i++) { const a = i / 9 * 6.28; bead(bx + Math.cos(a) * 44 * s, by + Math.sin(a) * 22 * s + 5 * s, 4 * s, '#a8761a', i); }
    tube(bx - 22 * s, by - 6 * s, bx + 14 * s, by - 24 * s - f * 4, 8 * s, '#8a5a2a'); tube(bx + 24 * s, by - 6 * s, bx - 10 * s, by - 26 * s, 8 * s, '#9a6a34');
  } else if (type === 'hat') {
    const [bx, by] = Q(0, hy + 4);
    tube(bx, by - 4 * s, bx, by + 14 * s, 10 * s, '#aab4c0');
    for (let k = -1; k <= 1; k++) tube(bx + k * 7 * s, by - 10 * s, bx + ca * 52 * s + k * 7 * s * sa, by + sa * 52 * s - k * 7 * s * ca, 9 * s, '#5aa890');
    clay(bx, by + 4 * s, 46 * s, 14 * s, mix(col, '#2a8a6a', .3), { seed: 31 });
    const jx = Math.sin(T * 40) * f * 3 * s;
    clay(bx + jx, by - 12 * s, 47 * s, 15 * s, col, { seed: 32, prints: 2 });
    bead(bx + jx, by - 16 * s, 7 * s, '#fff'); torus(bx + jx, by - 12 * s, 24 * s, 3 * s, acc);
  } else if (type === 'sub') {
    const [bx, by] = Q(0, hy);
    for (let k = 2; k >= 0; k--) { const rr = (44 + k * 14 + (T * 30) % 14) * s; X.globalAlpha = .25 * (1 - k / 3); torus(bx, by, rr, 4 * s, acc); X.globalAlpha = 1; }
    clayShape(() => X.roundRect(bx - 44 * s, by - 44 * s, 88 * s, 86 * s, 20 * s) || X.beginPath() || X.roundRect(bx - 44 * s, by - 44 * s, 88 * s, 86 * s, 20 * s), bx, by, 44 * s, 43 * s, mix(col, '#2a1a70', .45), { seed: 41 });
    clay(bx, by, 33 * s, 31 * s, '#2a2058', { prints: 0 });
    clay(bx, by, 28 * s + f * 3 * s, 26 * s + f * 3 * s, col, { seed: 42, prints: 3 });
    torus(bx, by, 17 * s, 4 * s, acc); clay(bx, by, 10 * s, 9 * s, acc, { prints: 0 });
    for (const [dx, dy] of [[-36, -36], [36, -36], [-36, 36], [36, 36]]) bead(bx + dx * s, by + dy * s, 4 * s, '#d8d0ff');
  } else if (type === 'mic') {
    const [bx, by] = Q(0, hy);
    tube(bx, by + 24 * s, bx, by - 6 * s, 10 * s, '#b8bcc8');
    for (let k = 0; k < 3; k++) { const rr = (24 + ((T * 50 + k * 20) % 60)) * s; X.save(); X.globalAlpha = .5 * (1 - (rr / s - 24) / 60); X.beginPath(); X.arc(bx, by - 18 * s, rr, ang - .5, ang + .5); X.strokeStyle = acc; X.lineWidth = 6 * s; X.lineCap = 'round'; X.stroke(); X.restore(); }
    clay(bx, by - 18 * s, 25 * s, 25 * s, col, { seed: 51 });
    const rr = rnd(51); for (let i = 0; i < 14; i++) { const a = rr() * 6.28, d = rr() * 17; bead(bx + Math.cos(a) * d * s, by - 18 * s + Math.sin(a) * d * s, 2.6 * s, lit(col, .55), i); }

    clay(bx, by, 56 * s, 23 * s, col, { seed: 62, prints: 3 });
    for (let i = 0; i < 7; i++) clay(bx + (i - 3) * 14 * s, by + 8 * s, 5.4 * s, 9 * s, '#f6fbff', { prints: 0, seed: i + 70, wob: .02 });
    for (let i = 0; i < 3; i++) bead(bx + (i - 1) * 20 * s, by - 10 * s, 5 * s, '#ff5fb0', i);
    tube(bx, by - 8 * s, bx + ca * 20 * s, by - 34 * s, 12 * s, '#8a95a8'); bead(bx + ca * 20 * s, by - 38 * s, 10 * s, acc);
    X.save(); X.strokeStyle = acc; X.lineWidth = 3.5 * s; X.lineCap = 'round'; X.lineJoin = 'round'; X.beginPath(); X.moveTo(bx + ca * 20 * s, by - 38 * s);
    for (let i = 1; i < 5; i++) X.lineTo(bx + ca * 20 * s + (i * 8 + ((FRM * 7 + i * 5) % 5)) * s * (ca > 0 ? 1 : -1), by - 38 * s + ((i % 2) ? -9 : 6) * s); X.stroke(); X.restore();
  } else if (type === 'horn') {
