<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Drop the Bass - Style 02 Low-Poly Iso</title>
<style>
html,body{margin:0;background:#0b0620;height:100%;overflow:hidden}
canvas{display:block;margin:0 auto;width:min(100vw,56.25vh);height:auto;aspect-ratio:1080/1920}
</style></head><body><canvas id="c"></canvas>
<script>
(()=>{
const W=1080,H=1920,TAU=Math.PI*2,D2R=Math.PI/180,PI=Math.PI;
const cv=document.getElementById('c');cv.width=W;cv.height=H;
const ctx=cv.getContext('2d');
const mkc=(w,h)=>{const c=document.createElement('canvas');c.width=w;c.height=h;return c};
const qs=new URLSearchParams(location.search);
const FREEZE=qs.has('t')?parseFloat(qs.get('t')):null;
const FONT='800 {S}px Inter,"DejaVu Sans","Liberation Sans",Arial,sans-serif';
const fnt=(s,w)=>`${w||800} ${s}px Inter,"DejaVu Sans","Liberation Sans",Arial,sans-serif`;

/* ---------- utils ---------- */
function rng(seed){let s=seed>>>0;return()=>{s=(s+0x6D2B79F5)>>>0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const HC=new Map();
function hc(h){if(Array.isArray(h))return h;let v=HC.get(h);if(!v){v=[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)];HC.set(h,v)}return v}
const mixc=(a,b,t)=>{a=hc(a);b=hc(b);return[a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t,a[2]+(b[2]-a[2])*t]};
const rgb=c=>`rgb(${c[0]|0},${c[1]|0},${c[2]|0})`;
const rgba=(c,a)=>`rgba(${c[0]|0},${c[1]|0},${c[2]|0},${a})`;
const hexa=(h,a)=>rgba(hc(h),a);
const dot=(a,b)=>a[0]*b[0]+a[1]*b[1]+a[2]*b[2];
const cross=(a,b)=>[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]];
const len=a=>Math.hypot(a[0],a[1],a[2]);
const norm=a=>{const l=len(a)||1;return[a[0]/l,a[1]/l,a[2]/l]};
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const lerp=(a,b,t)=>a+(b-a)*t;
const fract=x=>x-Math.floor(x);

/* ---------- transforms ---------- */
function mkT(o){o=o||{};
  const sc=o.sc==null?[1,1,1]:(Array.isArray(o.sc)?o.sc:[o.sc,o.sc,o.sc]);
  const rx=o.rx||0,ry=o.ry||0,rz=o.rz||0,pos=o.pos||[0,0,0];
  const cx=Math.cos(rx),sx=Math.sin(rx),cy=Math.cos(ry),sy=Math.sin(ry),cz=Math.cos(rz),sz=Math.sin(rz);
  const rot=v=>{let x=v[0],y=v[1],z=v[2];
    let y1=y*cx-z*sx,z1=y*sx+z*cx;y=y1;z=z1;
    let x2=x*cy+z*sy,z2=-x*sy+z*cy;x=x2;z=z2;
    return[x*cz-y*sz,x*sz+y*cz,z]};
  return{p:v=>{const r=rot([v[0]*sc[0],v[1]*sc[1],v[2]*sc[2]]);return[r[0]+pos[0],r[1]+pos[1],r[2]+pos[2]]},n:rot};
}
const then=(a,b)=>({p:v=>b.p(a.p(v)),n:v=>b.n(a.n(v))});
const ID=mkT();

/* ---------- geometry ---------- */
function frus(n,r0,r1,h,col,o){o=o||{};
  const rot=o.rot||0,sx=o.sx==null?1:o.sx,sy=o.sy==null?1:o.sy,z0=o.z0||0,faces=[];
  const ring=(r,z)=>{const a=[];for(let i=0;i<n;i++){const t=rot+i/n*TAU;a.push([Math.cos(t)*r*sx,Math.sin(t)*r*sy,z])}return a};
  const b=ring(r0,z0),t=ring(r1,z0+h);
  for(let i=0;i<n;i++){
    const c=o.alt&&(i&1)?o.alt:col;
    faces.push({v:[b[i],b[(i+1)%n],t[(i+1)%n],t[i]],col:c,emit:o.emit});
  }
  if(r1>0)faces.push({v:t,col:o.top||col,emit:o.topEmit!=null?o.topEmit:o.emit});
  if(o.bottom)faces.push({v:b,col:col});
  return faces;
}
function box(w,d,h,col,o){o=o||{};return frus(4,1,o.k==null?1:o.k,h,col,Object.assign({},o,{rot:PI/4,sx:w*.70711,sy:d*.70711}))}
const SPH=new Map();
function cvar(c,v,r){c=hc(c);const k=1+(r()-.5)*2*v;return[c[0]*k,c[1]*k,c[2]*k]}
function sph(r,rings,segs,col,o){o=o||{};
  const key=[r,rings,segs,col,o.jit,o.var,o.seed,o.emit].join('|');
  if(SPH.has(key))return SPH.get(key);
  const rnd=rng(o.seed||7),jit=o.jit||0,vr=o.var||0,faces=[];
  const vtx=(phi,th)=>{const rr=r*(1+jit*(rnd()*2-1));return[rr*Math.sin(phi)*Math.cos(th),rr*Math.sin(phi)*Math.sin(th),rr*Math.cos(phi)]};
  const ring=[];
  for(let k=1;k<rings;k++){const phi=PI*k/rings,a=[];for(let i=0;i<segs;i++)a.push(vtx(phi,(i+.5*(k&1))/segs*TAU));ring.push(a)}
  const pT=[0,0,r*(1+jit*(rnd()-.3))],pB=[0,0,-r*(1+jit*(rnd()-.3))];
  const fc=()=>vr?cvar(col,vr,rnd):col;
  const push=(a,b,c)=>faces.push({v:[a,b,c],col:fc(),emit:o.emit});
  for(let i=0;i<segs;i++)push(pT,ring[0][i],ring[0][(i+1)%segs]);
  for(let k=0;k<rings-2;k++){
    const A=ring[k],B=ring[k+1],even=((k+1)&1)===0;
    for(let i=0;i<segs;i++){const j=(i+1)%segs;
      if(even){push(A[i],A[j],B[i]);push(A[j],B[j],B[i])}
      else{push(A[i],A[j],B[j]);push(B[i],B[j],A[i])}}
  }
  const L=ring[rings-2];
  for(let i=0;i<segs;i++)push(pB,L[(i+1)%segs],L[i]);
  SPH.set(key,faces);return faces;
}
function decal(c,n,uv,col,o){o=o||{};
  let t1=cross(n,[0,0,1]);if(len(t1)<1e-3)t1=[1,0,0];t1=norm(t1);const t2=cross(t1,n),off=o.off||0;
  return{v:uv.map(p=>[c[0]+n[0]*off-t1[0]*p[0]+t2[0]*p[1],c[1]+n[1]*off-t1[1]*p[0]+t2[1]*p[1],c[2]+n[2]*off-t1[2]*p[0]+t2[2]*p[1]]),
    col,n,top:o.top||1,emit:o.emit,alpha:o.alpha};
}
function ell(rx,ry,k,cx,cy,a0){k=k||12;cx=cx||0;cy=cy||0;const p=[];for(let i=0;i<k;i++){const t=(a0||0)+i/k*TAU;p.push([cx+Math.cos(t)*rx,cy+Math.sin(t)*ry])}return p}
function heartUV(r,cx,cy){const p=[];for(let i=0;i<16;i++){const t=i/16*TAU;p.push([cx+r*16*Math.pow(Math.sin(t),3)/17,cy+r*(13*Math.cos(t)-5*Math.cos(2*t)-2*Math.cos(3*t)-Math.cos(4*t))/17])}return p}
function onSph(cen,r,dir,uv,col,o){dir=norm(dir);return decal([cen[0]+dir[0]*r,cen[1]+dir[1]*r,cen[2]+dir[2]*r],dir,uv,col,o)}

/* ---------- scene list + renderer ---------- */
let CUR=[];
function add(faces,tr,o){o=o||{};
  const fs=new Array(faces.length);
  for(let i=0;i<faces.length;i++){const f=faces[i];
    fs[i]={v:f.v.map(tr.p),col:f.col,n:f.n?tr.n(f.n):null,top:f.top,emit:f.emit,alpha:o.alpha!=null?o.alpha:f.alpha};
    if(o.emit!=null&&fs[i].emit==null)fs[i].emit=o.emit;
  }
  CUR.push({faces:fs,layer:o.layer||0,bias:o.bias||0,ao:o.ao});
}
const part=(f,l,G,o)=>add(f,then(mkT(l),G),o);
function scene(fn){const old=CUR;CUR=[];fn();const m=CUR;CUR=old;return m}

const LV=norm([.5,-.15,.85]);
function shade(col,n,emit){
  const d=Math.max(0,dot(n,LV)),h=n[2]*.5+.5;
  const kr=.34+.21*h+.64*d,kg=.26+.32*h+.56*d,kb=.50+.38*h+.42*d;
  let r=col[0]*kr,g=col[1]*kg,b=col[2]*kb;
  if(emit){const e=emit;r=r*(1-e)+col[0]*e*1.1;g=g*(1-e)+col[1]*e*1.1;b=b*(1-e)+col[2]*e*1.1}
  return[Math.min(255,r),Math.min(255,g),Math.min(255,b)];
}
function newell(vs){let x=0,y=0,z=0;for(let i=0;i<vs.length;i++){const a=vs[i],b=vs[(i+1)%vs.length];x+=(a[1]-b[1])*(a[2]+b[2]);y+=(a[2]-b[2])*(a[0]+b[0]);z+=(a[0]-b[0])*(a[1]+b[1])}return norm([x,y,z])}

function renderScene(g,meshes,cam){
  const ca=Math.cos(cam.a),sa=Math.sin(cam.a),sE=Math.sin(cam.E),cE=Math.cos(cam.E),S=cam.S;
  const V=[sa*cE,ca*cE,sE];
  const P=p=>{const xr=-p[0]*ca+p[1]*sa,yr=p[0]*sa+p[1]*ca;return[cam.ox+xr*S,cam.oy+yr*S*sE-p[2]*S*cE,yr*cE+p[2]*sE]};
  for(const m of meshes){
    let cx=0,cy=0,cz=0,n=0;
    for(const f of m.faces){if(f.n)continue;for(const v of f.v){cx+=v[0];cy+=v[1];cz+=v[2];n++}}
    let db=0;if(!n){for(const f of m.faces)for(const v of f.v){cx+=v[0];cy+=v[1];cz+=v[2];n++}db=.06}
    m.c=[cx/n,cy/n,cz/n];m.d=P(m.c)[2]+m.bias+db;
  }
  const list=meshes.slice().sort((a,b)=>a.layer-b.layer||a.d-b.d);
  for(const m of list){
    const fl=[];
    for(const f of m.faces){
      let nn=f.n;
      if(!nn){nn=newell(f.v);let fx=0,fy=0,fz=0;for(const v of f.v){fx+=v[0];fy+=v[1];fz+=v[2]}
        const k=f.v.length;if(dot(nn,[fx/k-m.c[0],fy/k-m.c[1],fz/k-m.c[2]])<0)nn=[-nn[0],-nn[1],-nn[2]]}
      if(dot(nn,V)<.03)continue;
      const pts=f.v.map(P);let d=0,y0=1e9,y1=-1e9;for(const p of pts){d+=p[2];if(p[1]<y0)y0=p[1];if(p[1]>y1)y1=p[1]}
      fl.push({f,nn,pts,d:d/pts.length,y0,y1});
    }
    fl.sort((a,b)=>(a.f.top||0)-(b.f.top||0)||a.d-b.d);
    for(const q of fl){
      const f=q.f,col=hc(f.col),c=shade(col,q.nn,f.emit);
      g.globalAlpha=f.alpha!=null?f.alpha:1;
      g.beginPath();g.moveTo(q.pts[0][0],q.pts[0][1]);for(let i=1;i<q.pts.length;i++)g.lineTo(q.pts[i][0],q.pts[i][1]);g.closePath();
      if(q.nn[2]<.35&&m.ao!==false&&!f.top&&q.y1-q.y0>11&&!f.emit){
        const gr=g.createLinearGradient(0,q.y0,0,q.y1);gr.addColorStop(0,rgb(c));gr.addColorStop(1,rgb([c[0]*.74,c[1]*.72,c[2]*.84]));g.fillStyle=gr;g.fill();g.strokeStyle=rgb(c);
      }else{g.fillStyle=g.strokeStyle=rgb(c);g.fill()}
      g.lineWidth=1.1;g.lineJoin='round';g.stroke();
    }
  }
  g.globalAlpha=1;
}
const proj=(cam,x,y,z)=>{const ca=Math.cos(cam.a),sa=Math.sin(cam.a),sE=Math.sin(cam.E),cE=Math.cos(cam.E);
  return[cam.ox+(-x*ca+y*sa)*cam.S,cam.oy+(x*sa+y*ca)*cam.S*sE-z*cam.S*cE]};

/* ---------- board camera ---------- */
const BC={a:PI/4,E:42*D2R,S:86,ox:540,oy:565};
const PB=(x,y,z)=>proj(BC,x,y,z);
const FA=-BC.a; // yaw that makes a +Y-facing model face the viewer
const TOPZ=.22;

/* ---------- palette ---------- */
const COL={space:'#1a0b3d',pink:'#ff5fb0',lime:'#9dff3a',cyan:'#38e4ff',orange:'#ff9a3c',grey:'#9aa0b4',gold:'#ffc83a'};
const LVC=['#8fa3c9','#5be0a0','#4db8ff','#b36bff','#ffc83a'];
const TCOL={kick:'#ff4d5e',snare:'#e8ecff',hat:'#ffd23a',sub:'#8a4dff',mic:'#ff5fb0',synth:'#2de2c9',horn:'#ff8a2a',scratch:'#9dff3a',cowbell:'#ffb02e'};
const TNAME={kick:'KICK CANNON',snare:'SNARE',hat:'HI-HAT GATLING',sub:'SUBWOOFER',mic:'SIREN MIC',synth:'SYNTH',horn:'AIR HORN',scratch:'VINYL SCRATCHER',cowbell:'COWBELL SNIPER'};

/* ---------- turrets ---------- */
const dirv=(a,p)=>[-Math.sin(a)*Math.cos(p),Math.cos(a)*Math.cos(p),Math.sin(p)];
function bar(P,len,r0,r1,col,tip,aim,pitch,z,off,x0,y0){
  x0=x0||0;y0=y0||0;const d=dirv(aim,pitch),rx=-(PI/2-pitch),b=[-Math.sin(aim)*off+x0,Math.cos(aim)*off+y0,z];
  P(frus(8,r0,r1,len,col,{top:tip}),{rx,rz:aim,pos:b});
  const q=len-.05;
  P(frus(8,r1*1.3,r1*1.3,.05,tip),{rx,rz:aim,pos:[b[0]+d[0]*q,b[1]+d[1]*q,b[2]+d[2]*q]});
  return[b[0]+d[0]*len,b[1]+d[1]*len,b[2]+d[2]*len];
}
function turret(type,lvl,G,t,aim,ph,lay){
  lay=lay==null?2:lay;
  const P=(f,l,o)=>part(f,l,G,Object.assign({layer:lay},o));
  const G2=then(mkT({rz:aim}),G),P2=(f,l,o)=>part(f,l,G2,Object.assign({layer:lay},o));
  const GF=then(mkT({rz:FA}),G),PF=(f,l,o)=>part(f,l,GF,Object.assign({layer:lay},o));
  const pul=Math.max(0,1-ph*5);
  let m=[0,0,.5],MG=G;
  P(frus(8,.5,.45,.10,LVC[lvl-1],{top:mixc(LVC[lvl-1],'#ffffff',.25)}),{});
  P(frus(8,.40,.40,.02,TCOL[type],{emit:.6}),{pos:[0,0,.10]});
  switch(type){
  case'kick':{
    P(frus(14,.33,.33,.30,'#ff4d5e',{top:'#ffe9e2'}),{pos:[0,0,.12]});
    for(const z of[.12,.39])P(frus(14,.355,.355,.05,'#ffd24a',{top:'#fff0a8'}),{pos:[0,0,z]});
    for(let i=0;i<6;i++){const a=i/6*TAU;P(box(.06,.06,.22,'#ffd24a'),{pos:[Math.cos(a)*.34,Math.sin(a)*.34,.17]})}
    P(frus(14,.15,.15,.01,'#ff9a3c',{emit:.5}),{pos:[0,0,.435]});
    m=bar(P,.52,.17,.14,'#2b2440','#ff8a2a',aim,.3,.46,.10-pul*.07);break;}
  case'snare':{
    P(frus(16,.37,.37,.22,'#f3efff',{top:'#ffffff'}),{pos:[0,0,.12]});
    for(const z of[.12,.305])P(frus(16,.395,.395,.035,'#aeb7d6'),{pos:[0,0,z]});
    for(let i=0;i<8;i++){const a=i/8*TAU;P(box(.04,.04,.15,'#8f98b8'),{pos:[Math.cos(a)*.39,Math.sin(a)*.39,.17]})}
    for(const s of[-1,1])P(box(.05,.52,.04,'#d8a86a'),{pos:[0,0,.345],rz:s*.7});
    const pp=[Math.cos(aim),Math.sin(aim)];
    for(const s of[-1,1])m=bar(P,.42,.065,.05,'#4a4466','#ffffff',aim,.28,.40,.08-pul*.05,pp[0]*s*.09,pp[1]*s*.09);
    break;}
  case'hat':{
    P(frus(8,.05,.04,.5,'#8f98b5'),{pos:[0,0,.12]});
    P(frus(20,.42,.1,.05,'#ffd23a',{top:'#fff1a0'}),{pos:[0,0,.30],rx:Math.sin(t*9)*.05});
    P(frus(20,.42,.1,.05,'#e9b827',{top:'#fff1a0'}),{pos:[0,0,.38],rx:-Math.sin(t*9)*.05});
    const GZ=.70;
    bar(P,.22,.11,.10,'#3b3563','#ffd23a',aim,.25,GZ,-.08);
    const pp=[Math.cos(aim),Math.sin(aim)],sp=t*10;
    for(let k=0;k<5;k++){const a=sp+k/5*TAU,c=Math.cos(a)*.065,s=Math.sin(a)*.065;
      m=bar(P,.36,.027,.022,'#aab3d4','#ffd23a',aim,.25,GZ+s,.12-pul*.03,pp[0]*c,pp[1]*c)}
    MG=G;break;}
  case'sub':{
    P2(box(.68,.68,.64,'#3b2a7f',{top:'#6a4ec0'}),{pos:[0,0,.12]});
    for(const [sx,sy] of[[1,1],[-1,1],[1,-1],[-1,-1]])P2(box(.08,.08,.66,'#241a55'),{pos:[sx*.32,sy*.32,.12]});
    const pz=.5+.5*Math.sin(t*8);
    P2(frus(18,.31,.31,.02,'#38e4ff',{emit:.6+pz*.4}),{rx:-PI/2,pos:[0,.336,.44],bias:.01});
    P2(frus(18,.275,.275,.02,'#14102a'),{rx:-PI/2,pos:[0,.342,.44],bias:.02});
    P2(frus(18,.235,.11,.09,'#2d2160',{top:'#38e4ff',topEmit:.55+pz*.4}),{rx:PI/2,pos:[0,.352,.44],bias:.03});
    P2(frus(10,.07,.07,.02,'#ffffff',{emit:.8}),{rx:PI/2,pos:[0,.275,.44],bias:.04});
    for(const z of[.2,.68])P2(box(.5,.03,.04,'#9dff3a',{emit:.5}),{pos:[0,.345,z],bias:.02});
    m=[0,.4,.44];MG=G2;break;}
  case'mic':{
    P(frus(10,.24,.2,.05,'#2b2440'),{pos:[0,0,.12]});
    P(frus(6,.035,.03,.5,'#aab3d4'),{pos:[0,0,.17]});
    P(sph(.17,5,8,'#d3d8ee',{var:.05,seed:3}),{pos:[0,0,.78]});
    P(frus(10,.175,.175,.07,'#ff5fb0',{emit:.35}),{pos:[0,0,.72]});
    const sir=Math.sin(t*10)>0;
    P(frus(8,.09,.03,.2,sir?'#ff3b6b':'#3bc8ff',{alt:sir?'#3bc8ff':'#ff3b6b',emit:.7,top:'#ffffff'}),{pos:[0,0,.93],rz:t*3});
    m=[0,0,1.0];break;}
  case'synth':{
    PF(box(.74,.42,.14,'#1d2656',{top:'#2c3a7a'}),{pos:[0,.05,.12]});
    for(let k=0;k<8;k++)PF(box(.078,.2,.03,'#f2f4ff'),{pos:[-.28+k*.08,.12,.26]});
    for(const k of[0,1,3,4,6])PF(box(.046,.12,.04,'#15152a'),{pos:[-.24+k*.08,.16,.29]});
    PF(box(.64,.05,.32,'#101636'),{pos:[0,-.17,.26],rx:-.25});
    PF(box(.56,.012,.24,COL.cyan,{emit:.8}),{pos:[0,-.137,.30],rx:-.25});
    for(let k=0;k<7;k++){const h=.04+.14*Math.abs(Math.sin(t*3+k*1.3));PF(box(.045,.012,h,'#ffffff',{emit:1}),{pos:[-.24+k*.08,-.128,.20],rx:-.25,bias:.01})}
    for(const x of[-.3,.3])PF(frus(8,.035,.03,.04,'#ff5fb0'),{pos:[x,-.02,.26]});
    P(sph(.12,2,5,'#ff5fb0',{emit:.45}),{pos:[0,-.05,.92+.04*Math.sin(t*3)],rz:t,sc:[1,1,1.7]});
    m=[0,-.05,.95];break;}
  case'horn':{
    P2(frus(10,.15,.15,.36,'#e8344a',{top:'#ffb0b8'}),{pos:[0,-.14,.12]});
    P2(box(.1,.12,.08,'#2b2440'),{pos:[0,-.14,.48]});
    P2(box(.06,.06,.2,'#2b2440'),{pos:[0,-.14,.12],rx:.4});
    m=bar(P2,.64,.075,.31,'#ffa63a','#fff1cc',0,.42,.42,-.04-pul*.04);
    MG=G2;break;}
  case'scratch':{
    PF(box(.76,.76,.14,'#2a2152',{top:'#3d3078'}),{pos:[0,0,.12]});
    for(const[a,b,w,d]of[[0,.37,.76,.03],[0,-.37,.76,.03],[.37,0,.03,.76],[-.37,0,.03,.76]])PF(box(w,d,.03,'#9dff3a',{emit:.5}),{pos:[a,b,.26]});
    PF(frus(20,.3,.3,.04,'#14101f',{top:'#1c1630'}),{pos:[0,0,.26],rz:t*3});
    PF(frus(20,.22,.22,.006,'#2b2342'),{pos:[0,0,.30],rz:t*3});
    PF(frus(14,.09,.09,.012,'#ff5fb0',{top:'#ff8cc8',topEmit:.3}),{pos:[0,0,.306],rz:t*3});
    PF(box(.025,.12,.006,'#ffffff',{emit:1}),{pos:[0,.19,.312],rz:t*3+PI*.0});
    PF(box(.04,.34,.03,'#cfd6f0'),{pos:[.27,-.02,.32],rz:.45});
    PF(box(.08,.07,.04,'#ff5fb0'),{pos:[.17,.15,.34],rz:.45});

/* ---------- 2D helpers ---------- */
function poly(g,pts){g.beginPath();g.moveTo(pts[0][0],pts[0][1]);for(let i=1;i<pts.length;i++)g.lineTo(pts[i][0],pts[i][1]);g.closePath()}
function glow(g,x,y,r,col,a){const gr=g.createRadialGradient(x,y,0,x,y,r);gr.addColorStop(0,rgba(hc(col),a));gr.addColorStop(1,rgba(hc(col),0));g.fillStyle=gr;g.fillRect(x-r,y-r,r*2,r*2)}

function txt(g,s,x,y,size,fill,o){o=o||{};g.font=fnt(size,o.w);g.textAlign=o.al||'center';g.textBaseline='middle';
  if(o.st){g.lineJoin='round';g.lineWidth=o.sw||size*.16;g.strokeStyle=o.st;g.strokeText(s,x,y)}
  g.fillStyle=fill;g.fillText(s,x,y)}
function extrude(g,s,x,y,size,top,side,dep,o){o=o||{};
  g.font=fnt(size,900);g.textAlign=o.al||'center';g.textBaseline='middle';g.lineJoin='round';
  for(let i=dep;i>=1;i--){g.fillStyle=mixc(side,'#000000',.35*(i/dep))&&rgb(mixc(side,'#000000',.1+.3*(i/dep)));g.strokeStyle=g.fillStyle;g.lineWidth=size*.1;g.strokeText(s,x-i*.6,y+i*.9);g.fillText(s,x-i*.6,y+i*.9)}
  g.lineWidth=size*.1;g.strokeStyle=o.edge||'#1a0b3d';g.strokeText(s,x,y);
  const gr=g.createLinearGradient(0,y-size*.5,0,y+size*.5);gr.addColorStop(0,top[0]);gr.addColorStop(.5,top[1]);gr.addColorStop(.51,top[2]);gr.addColorStop(1,top[3]);

function facetPanel(g,x,y,w,h,c,base,hi){
  const P=chamfer(x,y,w,h,c);
  poly(g,chamfer(x,y+5,w,h,c));g.fillStyle='rgba(8,2,30,.55)';g.fill();
  poly(g,P);const gr=g.createLinearGradient(0,y,0,y+h);gr.addColorStop(0,hi);gr.addColorStop(1,base);g.fillStyle=gr;g.fill();
  g.save();poly(g,P);g.clip();
  g.fillStyle='rgba(255,255,255,.10)';g.beginPath();g.moveTo(x,y);g.lineTo(x+w*.55,y);g.lineTo(x+w*.25,y+h);g.lineTo(x,y+h);g.fill();

function skyColor(y){

  const v=y/1280;for(let i=0;i<st.length-1;i++){if(v<=st[i+1][0]){return mixc(st[i][1],st[i+1][1],(v-st[i][0])/(st[i+1][0]-st[i][0]))}}
  return hc(st[st.length-1][1]);
}
function drawTriMesh(g,x0,y0,w,h,cols,rows,colFn,seed,jit){
  const r=rng(seed),cw=w/cols,ch=h/rows,V=[];
  for(let j=0;j<=rows;j++){V.push([]);for(let i=0;i<=cols;i++){const edge=i===0||j===0||i===cols||j===rows;V[j].push([x0+i*cw+(edge?0:(r()-.5)*cw*jit),y0+j*ch+(edge?0:(r()-.5)*ch*jit)])}}
  for(let j=0;j<rows;j++)for(let i=0;i<cols;i++){
    const a=V[j][i],b=V[j][i+1],c=V[j+1][i+1],d=V[j+1][i],flip=(i+j)&1;
    const tris=flip?[[a,b,c],[a,c,d]]:[[a,b,d],[b,c,d]];
    for(const T of tris){const cy=(T[0][1]+T[1][1]+T[2][1])/3,cx=(T[0][0]+T[1][0]+T[2][0])/3;
      const k=.88+r()*.24,c0=colFn(cx,cy);g.fillStyle=g.strokeStyle=rgb([c0[0]*k,c0[1]*k,c0[2]*k]);
      g.beginPath();g.moveTo(T[0][0],T[0][1]);g.lineTo(T[1][0],T[1][1]);g.lineTo(T[2][0],T[2][1]);g.closePath();g.fill();g.lineWidth=1;g.stroke()}
  }
}

  const rg=rings.map(([z,s,j])=>outline.map(p=>{const k=s+(r()-.5)*j;return[p[0]*k,p[1]*k,z+(r()-.5)*j*.7]}));
  const apex=[0,0,-5.6],faces=[];
  const dirt=['#6a4aa6','#5d3f98','#4f3487','#43296f','#37205b'];
  const n=outline.length;
  for(let k=0;k<rings.length-1;k++){
    for(let i=0;i<n;i++){const j=(i+1)%n,a=rg[k][i],b=rg[k][j],c=rg[k+1][j],d=rg[k+1][i];

  }

  return faces;
}
