<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Drop the Bass Art Deco</title>
<style>
html,body{margin:0;height:100%;background:#040406;overflow:hidden}
#c{position:absolute;left:0;top:0;display:block}
</style>
</head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<script>
"use strict";
// Drop the Bass, style 12: Art Deco gold and black. Everything is drawn procedurally.
const cv = document.getElementById('c');
const mainCtx = cv.getContext('2d');
let ctx = mainCtx;
const W = 1080, H = 1920;
const FONT = '"Bebas Neue","Oswald","Inter Display","Inter",sans-serif';
const OL = '#120b05';
const C = { ruby:'#c8203f', emer:'#12a67e', sap:'#2a5bd7', ame:'#8a3fd0', pink:'#ff5fb0', lime:'#9dff3a', champ:'#f6e7b0', gold:'#d4a93c' };
let P = 0.5; // gold sheen position
let T = 0;

function fit() {
  const s = Math.min(innerWidth / W, innerHeight / H);
  cv.style.width = (W * s) + 'px'; cv.style.height = (H * s) + 'px';
  cv.style.left = ((innerWidth - W * s) / 2) + 'px'; cv.style.top = ((innerHeight - H * s) / 2) + 'px';
}
addEventListener('resize', fit); fit();

/* ---------- helpers ---------- */
function rng(seed) { let a = seed >>> 0; return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function rgba(hex, a) { const n = parseInt(hex.slice(1), 16); return `rgba(${n >> 16},${n >> 8 & 255},${n & 255},${a})`; }
function goldG(x0, y0, x1, y1, p) {
  p = p == null ? P : p;
  const g = ctx.createLinearGradient(x0, y0, x1, y1);
  g.addColorStop(0, '#5a3b0c'); g.addColorStop(Math.max(.02, p - .3), '#c9992f'); g.addColorStop(p, '#fff3bd');
  g.addColorStop(Math.min(.98, p + .22), '#b88628'); g.addColorStop(1, '#68450f');
  return g;
}
function silverG(x0, y0, x1, y1) {
  const g = ctx.createLinearGradient(x0, y0, x1, y1);
  g.addColorStop(0, '#4a4d57'); g.addColorStop(.4, '#d9dbe2'); g.addColorStop(.55, '#ffffff'); g.addColorStop(.75, '#8e929e'); g.addColorStop(1, '#4a4d57');
  return g;
}
function poly(pts) { ctx.beginPath(); pts.forEach((p, i) => i ? ctx.lineTo(p[0], p[1]) : ctx.moveTo(p[0], p[1])); ctx.closePath(); }
function fs(fill, stroke, lw) { if (fill) { ctx.fillStyle = fill; ctx.fill(); } if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = lw || 2; ctx.lineJoin = 'round'; ctx.stroke(); } }
function cutRect(x, y, w, h, k) { poly([[x + k, y], [x + w - k, y], [x + w, y + k], [x + w, y + h - k], [x + w - k, y + h], [x + k, y + h], [x, y + h - k], [x, y + k]]); }
function octPath(cx, cy, r) { ctx.beginPath(); for (let i = 0; i < 8; i++) { const a = Math.PI / 8 + i * Math.PI / 4; const px = cx + Math.cos(a) * r, py = cy + Math.sin(a) * r; i ? ctx.lineTo(px, py) : ctx.moveTo(px, py); } ctx.closePath(); }
function stepRect(x, y, w, h, k) {
  const a = k, b = k * 2; ctx.beginPath();
  ctx.moveTo(x + b, y); ctx.lineTo(x + w - b, y); ctx.lineTo(x + w - b, y + a); ctx.lineTo(x + w - a, y + a); ctx.lineTo(x + w - a, y + b); ctx.lineTo(x + w, y + b);
  ctx.lineTo(x + w, y + h - b); ctx.lineTo(x + w - a, y + h - b); ctx.lineTo(x + w - a, y + h - a); ctx.lineTo(x + w - b, y + h - a); ctx.lineTo(x + w - b, y + h);
  ctx.lineTo(x + b, y + h); ctx.lineTo(x + b, y + h - a); ctx.lineTo(x + a, y + h - a); ctx.lineTo(x + a, y + h - b); ctx.lineTo(x, y + h - b);
  ctx.lineTo(x, y + b); ctx.lineTo(x + a, y + b); ctx.lineTo(x + a, y + a); ctx.lineTo(x + b, y + a); ctx.closePath();
}
function archPath(x, y, w, h, k) {
  ctx.beginPath(); ctx.moveTo(x, y + h); ctx.lineTo(x, y + 3 * k); ctx.lineTo(x + k, y + 3 * k); ctx.lineTo(x + k, y + 2 * k); ctx.lineTo(x + 2 * k, y + 2 * k); ctx.lineTo(x + 2 * k, y + k);
  ctx.lineTo(x + 3 * k, y + k); ctx.lineTo(x + 3 * k, y); ctx.lineTo(x + w - 3 * k, y); ctx.lineTo(x + w - 3 * k, y + k); ctx.lineTo(x + w - 2 * k, y + k); ctx.lineTo(x + w - 2 * k, y + 2 * k);
  ctx.lineTo(x + w - k, y + 2 * k); ctx.lineTo(x + w - k, y + 3 * k); ctx.lineTo(x + w, y + 3 * k); ctx.lineTo(x + w, y + h); ctx.closePath();
}
function goldPlate(x, y, w, h, k, bw, inner) {
  stepRect(x, y, w, h, k); fs(goldG(x, y, x + w, y + h), OL, 2);
  stepRect(x + bw, y + bw, w - 2 * bw, h - 2 * bw, Math.max(2, k - bw * .6)); fs(inner || '#0a0a10', 'rgba(255,232,160,.6)', 1.2);
}
function goldArch(x, y, w, h, k, bw, inner) {
  archPath(x, y, w, h, k); fs(goldG(x, y, x + w, y + h), OL, 2);
  archPath(x + bw, y + bw, w - 2 * bw, h - bw, Math.max(3, k - bw * .6)); fs(inner || '#0a0a10', 'rgba(255,232,160,.6)', 1.2);
}
function rays(cx, cy, r0, r1, n, a0, a1, fA, fB) {
  const da = (a1 - a0) / n;
  for (let i = 0; i < n; i++) {
    const a = a0 + i * da;
    poly([[cx + Math.cos(a) * r0, cy + Math.sin(a) * r0], [cx + Math.cos(a) * r1, cy + Math.sin(a) * r1], [cx + Math.cos(a + da) * r1, cy + Math.sin(a + da) * r1], [cx + Math.cos(a + da) * r0, cy + Math.sin(a + da) * r0]]);
    ctx.fillStyle = i % 2 ? fA : fB; ctx.fill();
  }
}
function txt(s, x, y, size, o) {
  o = o || {};
  ctx.save(); ctx.translate(x, y); ctx.scale(o.cond || .6, 1);
  ctx.font = `${o.w || 800} ${size}px ${FONT}`; ctx.letterSpacing = (o.ls || 0) + 'px';
  ctx.textAlign = o.align || 'center'; ctx.textBaseline = 'middle';
  if (o.stroke) { ctx.lineWidth = o.sw || 4; ctx.strokeStyle = o.stroke; ctx.lineJoin = 'round'; ctx.strokeText(s, 0, 0); }
  ctx.fillStyle = o.gold ? goldG(0, -size * .5, 0, size * .5, o.p) : (o.fill || '#fff');
  ctx.fillText(s, 0, 0); ctx.restore();
}
function spark(x, y, r, col, rot) {
  ctx.save(); ctx.translate(x, y); ctx.rotate(rot || 0); ctx.beginPath();
  for (let i = 0; i < 8; i++) { const a = i * Math.PI / 4; const rr = i % 2 ? r * .22 : r; ctx.lineTo(Math.cos(a) * rr, Math.sin(a) * rr); }
  ctx.closePath(); ctx.fillStyle = col; ctx.fill(); ctx.restore();
}
function heartPath(x, y, s) {
  ctx.beginPath(); ctx.moveTo(x, y + s * .9);
  ctx.bezierCurveTo(x - s * 1.5, y - s * .1, x - s * .8, y - s * 1.1, x, y - s * .35);
  ctx.bezierCurveTo(x + s * .8, y - s * 1.1, x + s * 1.5, y - s * .1, x, y + s * .9); ctx.closePath();
}
function gem(x, y, r, col) {
  const g = ctx.createRadialGradient(x - r * .3, y - r * .4, 1, x, y, r * 1.2);
  g.addColorStop(0, '#ffffff'); g.addColorStop(.25, col); g.addColorStop(1, rgba(col, .45));
  poly([[x, y - r], [x + r * .75, y], [x, y + r], [x - r * .75, y]]); fs(g, OL, 1.5);
  ctx.strokeStyle = 'rgba(255,255,255,.55)'; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(x - r * .75, y); ctx.lineTo(x + r * .75, y); ctx.moveTo(x, y - r); ctx.lineTo(x - r * .25, y); ctx.lineTo(x, y + r); ctx.stroke();
}
function glow(x, y, r, col, a) {
  const g = ctx.createRadialGradient(x, y, 0, x, y, r); g.addColorStop(0, rgba(col, a)); g.addColorStop(1, rgba(col, 0));
  ctx.fillStyle = g; ctx.fillRect(x - r, y - r, r * 2, r * 2);
}
function fanArcs(cx, cy, r, n, a0, a1, col, lw) {
  ctx.strokeStyle = col; ctx.lineWidth = lw || 1.5;
  for (let i = 1; i <= n; i++) { ctx.beginPath(); ctx.arc(cx, cy, r * i / n, a0, a1); ctx.stroke(); }
}
function pinstripes(x, y, w, h, step, col) { ctx.fillStyle = col; for (let xx = x; xx < x + w; xx += step) ctx.fillRect(xx, y, 1.5, h); }

/* ---------- path and board ---------- */
const GX = 90, GY = 355, CW = 150, RH = 108;
const cc = (r, c) => [GX + c * CW + CW / 2, GY + r * RH + RH / 2];
const PP = [[GX + 4, cc(0, 0)[1]], cc(0, 5), cc(2, 5), cc(2, 0), cc(4, 0), cc(4, 5), cc(5, 5)];
const SEG = []; let PLEN = 0;
for (let i = 0; i < PP.length - 1; i++) { const l = Math.hypot(PP[i + 1][0] - PP[i][0], PP[i + 1][1] - PP[i][1]); SEG.push(l); PLEN += l; }
function pathAt(d) {
  d = Math.max(0, Math.min(PLEN - .01, d));
  for (let i = 0; i < SEG.length; i++) {
    if (d <= SEG[i]) { const f = d / SEG[i]; const a = PP[i], b = PP[i + 1]; return { x: a[0] + (b[0] - a[0]) * f, y: a[1] + (b[1] - a[1]) * f, ang: Math.atan2(b[1] - a[1], b[0] - a[0]) }; }
    d -= SEG[i];
  }
}
const TURRETS = [
  { k: 'kick', l: 2, r: 1, c: 0 }, { k: 'snare', l: 1, r: 1, c: 1 }, { k: 'hat', l: 3, r: 1, c: 2 }, { k: 'sub', l: 2, r: 1, c: 3 },
  { k: 'mic', l: 2, r: 3, c: 1 }, { k: 'synth', l: 3, r: 3, c: 2 }, { k: 'horn', l: 1, r: 3, c: 4 }, { k: 'scratch', l: 2, r: 3, c: 5 },
  { k: 'cowbell', l: 3, r: 5, c: 0 }, { k: 'kick', l: 1, r: 5, c: 1 }, { k: 'hat', l: 2, r: 5, c: 3 }, { k: 'snare', l: 2, r: 5, c: 4 }
];
const EMPTY = [[1, 4], [3, 3], [5, 2]];
const SLOTS = [];
[[1, [0, 1, 2, 3, 4]], [3, [1, 2, 3, 4, 5]], [5, [0, 1, 2, 3, 4]]].forEach(([r, cs]) => cs.forEach(c => SLOTS.push([r, c])));
const JEWEL = { kick: C.ruby, snare: '#e9e2cf', hat: '#e8a31f', sub: C.emer, mic: C.ame, synth: C.sap, horn: '#e8551f', scratch: C.pink, cowbell: '#f0c24a' };
const ENEMIES = [
  { t: 'fuzz', f: .045 }, { t: 'zip', f: .115 }, { t: 'brick', f: .19 }, { t: 'drone', f: .265 }, { t: 'giant', f: .345 },
  { t: 'leech', f: .425 }, { t: 'squeal', f: .5 }, { t: 'fuzz', f: .565 }, { t: 'boss', f: .66 }, { t: 'brick', f: .76 }, { t: 'zip', f: .835 }
];

/* ---------- static layer ---------- */
const SC = document.createElement('canvas'); SC.width = W; SC.height = H;

function drawCurtain(x, w) {
  const g = ctx.createLinearGradient(x, 0, x + w, 0);
  g.addColorStop(0, '#3a0714'); g.addColorStop(.5, '#8d1530'); g.addColorStop(1, '#3a0714');
  ctx.fillStyle = g; ctx.fillRect(x, 100, w, 245);
  for (let i = 0; i < 9; i++) {
    const xx = x + i * w / 9; const gg = ctx.createLinearGradient(xx, 0, xx + w / 9, 0);
    gg.addColorStop(0, 'rgba(0,0,0,.55)'); gg.addColorStop(.5, 'rgba(255,120,150,.12)'); gg.addColorStop(1, 'rgba(0,0,0,.5)');
    ctx.fillStyle = gg; ctx.fillRect(xx, 100, w / 9, 245);
  }
  ctx.fillStyle = goldG(x, 0, x + w, 0, .5); ctx.fillRect(x, 332, w, 6);
  for (let i = 0; i < 14; i++) { ctx.fillStyle = '#d9ad45'; ctx.fillRect(x + 4 + i * (w - 8) / 14, 338, 2, 8); }
}
function speakerStack(x, y, s) {
  ctx.save(); ctx.translate(x, y); ctx.scale(s, s);
  const tiers = [[60, 34], [46, 30], [32, 26]]; let yy = 0;
  tiers.forEach(([w, h]) => {
    cutRect(-w / 2, yy - h, w, h, 5); fs(goldG(-w / 2, yy - h, w / 2, yy), OL, 1.5);
    cutRect(-w / 2 + 4, yy - h + 4, w - 8, h - 8, 4); fs('#0a0a10');
    ctx.beginPath(); ctx.arc(0, yy - h / 2, h / 2 - 7, 0, 7); fs('#181820', C.gold, 1.5);
    ctx.beginPath(); ctx.arc(0, yy - h / 2, 4, 0, 7); fs(C.gold);
    yy -= h;
  });
  ctx.restore();
}
function drawStage() {
  ctx.save(); ctx.beginPath(); ctx.rect(150, 140, 780, 200); ctx.clip();
  const bg = ctx.createLinearGradient(0, 140, 0, 340); bg.addColorStop(0, '#0a0810'); bg.addColorStop(1, '#241a0d'); ctx.fillStyle = bg; ctx.fillRect(150, 140, 780, 200);
  rays(540, 332, 0, 560, 30, Math.PI, Math.PI * 2, 'rgba(212,169,60,.30)', 'rgba(20,14,6,.0)');
  fanArcs(540, 332, 190, 5, Math.PI, Math.PI * 2, 'rgba(255,225,140,.45)', 2);
  ctx.restore();
  drawCurtain(0, 150); drawCurtain(930, 150);
  for (let i = 0; i < 12; i++) {
    const x = i * 90; ctx.beginPath(); ctx.moveTo(x, 100); ctx.lineTo(x + 90, 100); ctx.lineTo(x + 90, 118); ctx.arc(x + 45, 118, 45, 0, Math.PI); ctx.closePath();
    const g = ctx.createLinearGradient(x, 100, x, 163); g.addColorStop(0, '#6c0f24'); g.addColorStop(1, '#2d0510'); fs(g, null);
    ctx.beginPath(); ctx.arc(x + 45, 118, 45, 0, Math.PI); ctx.strokeStyle = goldG(x, 118, x + 90, 160); ctx.lineWidth = 4; ctx.stroke();
    ctx.beginPath(); ctx.arc(x + 45, 118, 36, 0, Math.PI); ctx.strokeStyle = 'rgba(255,225,140,.35)'; ctx.lineWidth = 1.5; ctx.stroke();
  }
  ctx.fillStyle = goldG(0, 100, W, 108); ctx.fillRect(0, 98, W, 8);
  const fl = ctx.createLinearGradient(0, 316, 0, 340); fl.addColorStop(0, '#2a1d0a'); fl.addColorStop(1, '#0a0806'); ctx.fillStyle = fl; ctx.fillRect(150, 316, 780, 24);
  ctx.strokeStyle = 'rgba(232,190,90,.75)'; ctx.lineWidth = 2;
  for (let x = 150; x < 930; x += 26) { ctx.beginPath(); ctx.moveTo(x, 318); ctx.lineTo(x + 13, 330); ctx.lineTo(x + 26, 318); ctx.stroke(); }
  ctx.fillStyle = goldG(150, 0, 930, 0); ctx.fillRect(150, 314, 780, 4);
  speakerStack(232, 316, 1.25); speakerStack(848, 316, 1.25);
  goldPlate(300, 112, 480, 44, 7, 4, '#0b0610');
  txt('ROXORLOOPS  &  JASMIN', 540, 135, 30, { gold: true, ls: 5, cond: .62 });
  gem(318, 134, 8, C.emer); gem(762, 134, 8, C.pink);
}
function hudStatic() {
  goldPlate(30, 16, 370, 64, 8, 4, '#07070b');
  cutRect(104, 30, 276, 36, 6); fs('#16060a', 'rgba(255,225,140,.4)', 1);
  ctx.save(); cutRect(104, 30, 276, 36, 6); ctx.clip();
  const hg = ctx.createLinearGradient(0, 30, 0, 66); hg.addColorStop(0, '#53f2c0'); hg.addColorStop(.5, '#12a67e'); hg.addColorStop(1, '#075c46');
  ctx.fillStyle = hg; ctx.fillRect(104, 30, 276 * .72, 36);
  ctx.fillStyle = 'rgba(0,0,0,.45)'; for (let i = 1; i < 12; i++) ctx.fillRect(104 + i * 23, 30, 2, 36);
  ctx.fillStyle = 'rgba(255,255,255,.28)'; ctx.fillRect(104, 32, 276 * .72, 7);
  ctx.restore();
  octPath(66, 48, 36); fs(goldG(30, 12, 100, 84), OL, 2.5); octPath(66, 48, 29); fs('#120508', 'rgba(255,225,140,.6)', 1.2);
  heartPath(66, 47, 15); fs('#e0304f', OL, 2);
  txt('72 / 100', 258, 48, 28, { fill: '#fff', stroke: '#000', sw: 4, cond: .7, ls: 2 });
  goldPlate(400, 10, 280, 80, 14, 5, '#0a0610');
  ctx.save(); stepRect(405, 15, 270, 70, 11); ctx.clip(); rays(540, 90, 0, 90, 18, Math.PI, Math.PI * 2, 'rgba(212,169,60,.18)', 'rgba(0,0,0,0)'); ctx.restore();
  txt('WAVE', 540, 30, 17, { gold: true, ls: 8, cond: .7 });
  txt('7 / 12', 540, 56, 40, { fill: C.champ, stroke: '#000', sw: 5, cond: .62, ls: 4 });
  for (let i = 0; i < 12; i++) { const x = 454 + i * 12.4; poly([[x, 78], [x + 4, 74], [x + 8, 78], [x + 4, 82]]); fs(i < 7 ? '#ffd86a' : '#2b2416', i < 7 ? OL : '#6b5420', 1); }
  goldPlate(710, 16, 340, 64, 8, 4, '#07070b');
  coinIcon(752, 48, 24);
  txt('12,480', 890, 48, 38, { fill: C.champ, stroke: '#000', sw: 5, cond: .62, ls: 3 });
  gem(1018, 48, 12, C.sap);
}
function boardStatic() {
  const bx = GX - 20, by = GY - 18, bw = CW * 6 + 40, bh = RH * 6 + 36;
  stepRect(bx, by, bw, bh, 12); fs('#09090e', null);
  ctx.save(); stepRect(bx, by, bw, bh, 12); ctx.clip();
  ctx.fillStyle = 'rgba(212,169,60,.07)'; for (let x = bx; x < bx + bw; x += 20) ctx.fillRect(x, by, 1.5, bh);
  ctx.lineJoin = 'round'; ctx.lineCap = 'butt';
  const route = () => { ctx.beginPath(); PP.forEach((p, i) => i ? ctx.lineTo(p[0], p[1]) : ctx.moveTo(p[0], p[1])); };
  route(); ctx.strokeStyle = goldG(bx, by, bx + bw, by + bh, .5); ctx.lineWidth = 88; ctx.stroke();
  route(); ctx.strokeStyle = '#05100f'; ctx.lineWidth = 80; ctx.stroke();
  route(); ctx.strokeStyle = '#0c2624'; ctx.lineWidth = 66; ctx.stroke();
  route(); ctx.strokeStyle = 'rgba(255,225,140,.55)'; ctx.lineWidth = 1.5; ctx.setLineDash([2, 10]); ctx.stroke(); ctx.setLineDash([]);
  ctx.restore();
  SLOTS.forEach(([r, c]) => {
    const x = GX + c * CW + 8, y = GY + r * RH + 6, w = CW - 16, h = RH - 12;
    const g = ctx.createLinearGradient(x, y, x, y + h); g.addColorStop(0, '#191722'); g.addColorStop(1, '#0b0a10');
    cutRect(x, y, w, h, 14); fs(g, 'rgba(232,190,90,.85)', 2);
    cutRect(x + 5, y + 5, w - 10, h - 10, 10); ctx.strokeStyle = 'rgba(232,190,90,.28)'; ctx.lineWidth = 1; ctx.stroke();
    ctx.strokeStyle = 'rgba(232,190,90,.22)'; ctx.beginPath(); ctx.moveTo(x + w / 2, y + 6); ctx.lineTo(x + w / 2, y + h - 6); ctx.moveTo(x + 8, y + h / 2); ctx.lineTo(x + w - 8, y + h / 2); ctx.stroke();
  });
  EMPTY.forEach(([r, c]) => {
    const [x, y] = cc(r, c); poly([[x, y - 22], [x + 22, y], [x, y + 22], [x - 22, y]]); fs('rgba(232,190,90,.08)', 'rgba(255,225,140,.8)', 2);
    ctx.strokeStyle = 'rgba(255,225,140,.9)'; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(x - 9, y); ctx.lineTo(x + 9, y); ctx.moveTo(x, y - 9); ctx.lineTo(x, y + 9); ctx.stroke();
  });
  stepRect(bx, by, bw, bh, 12); ctx.strokeStyle = goldG(bx, by, bx + bw, by + bh); ctx.lineWidth = 8; ctx.lineJoin = 'miter'; ctx.stroke();
  stepRect(bx + 8, by + 8, bw - 16, bh - 16, 10); ctx.strokeStyle = 'rgba(255,230,160,.5)'; ctx.lineWidth = 1.5; ctx.stroke();
  gem(bx + 4, by + 4, 12, C.ruby); gem(bx + bw - 4, by + 4, 12, C.emer); gem(bx + 4, by + bh - 4, 12, C.sap); gem(bx + bw - 4, by + bh - 4, 12, C.ame);
  const [gx, gy] = cc(5, 5);
  goldArch(gx - 56, gy - 50, 112, 100, 9, 5, '#0d0508');
  ctx.fillStyle = goldG(gx - 40, gy, gx + 40, gy); ctx.fillRect(gx - 2, gy - 38, 4, 80);
  heartPath(gx, gy - 8, 14); fs('#e0304f', OL, 2);
  txt('HOME', gx, gy + 36, 16, { gold: true, ls: 4, cond: .7 });
}
function bottomHudStatic() {
  ctx.save(); ctx.beginPath(); ctx.rect(0, 1020, W, 252); ctx.clip();
  rays(540, 1300, 40, 700, 36, Math.PI, Math.PI * 2, 'rgba(212,169,60,.22)', 'rgba(0,0,0,0)');
  fanArcs(540, 1300, 300, 6, Math.PI, Math.PI * 2, 'rgba(255,225,140,.25)', 2);
  ctx.restore();
  txt('HYPE', 78, 1040, 28, { gold: true, ls: 4, cond: .7 });
  goldPlate(130, 1020, 800, 40, 8, 4, '#08060a');
  ctx.save(); cutRect(142, 1030, 776, 20, 4); ctx.clip();
  const g = ctx.createLinearGradient(142, 0, 918, 0); g.addColorStop(0, '#8a1630'); g.addColorStop(.5, '#ff5fb0'); g.addColorStop(1, '#ffd86a');
  ctx.fillStyle = g; ctx.fillRect(142, 1030, 776 * .74, 20);
  ctx.fillStyle = 'rgba(0,0,0,.5)'; for (let i = 1; i < 26; i++) ctx.fillRect(142 + i * 29.8, 1030, 2, 20);
  ctx.fillStyle = 'rgba(255,255,255,.3)'; ctx.fillRect(142, 1031, 776 * .74, 5);
