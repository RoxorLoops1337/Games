<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Drop the Bass - Style 11 Ukiyo-e</title>
<style>html,body{margin:0;background:#0e0c0a;height:100%;overflow:hidden}canvas{display:block;margin:0 auto}</style>
</head><body><canvas id="c" width="1080" height="1920"></canvas>
<script>
// Drop the Bass - style proposal 11: ukiyo-e woodblock print. Everything is drawn procedurally on one canvas.
const W = 1080, H = 1920, TAU = Math.PI * 2;
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
function fit() { const s = Math.min(innerWidth / W, innerHeight / H); cv.style.width = W * s + 'px'; cv.style.height = H * s + 'px'; }
addEventListener('resize', fit); fit();
const FONT = "'Liberation Serif','DejaVu Serif','Times New Roman',serif";
const K = '#17120f';
const C = {
  paper: '#efe2c2', indigo: '#1f3358', indigoD: '#142342', blue: '#3f6ca3', sky: '#a8c8d8', verm: '#d9402b', pink: '#ee7aa6',
  pinkL: '#f7b4cb', lime: '#9bc53d', limeD: '#6a9a28', ochre: '#dda63e', brown: '#7a4326', cream: '#f6ecd0', grey: '#aaa8a3',
  skin: '#f2d6b3', olive: '#6d6c34', sand: '#ecd9a6'
};
function rng(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const q = new URLSearchParams(location.search), FROZEN = q.has('t') ? parseFloat(q.get('t')) : null;

// ---------- drawing helpers ----------
let SC = 1;
function at(x, y, s, fn) { ctx.save(); ctx.translate(x, y); ctx.scale(s, s); const o = SC; SC = o * s; fn(); SC = o; ctx.restore(); }
function shape(p, fill, k = 1) { ctx.beginPath(); p(); if (fill) { ctx.fillStyle = fill; ctx.fill(); } if (k > 0) { ctx.lineWidth = 3.4 * k / SC; ctx.strokeStyle = K; ctx.lineJoin = 'round'; ctx.lineCap = 'round'; ctx.stroke(); } }
function fillOnly(p, fill) { ctx.beginPath(); p(); ctx.fillStyle = fill; ctx.fill(); }
function ell(x, y, rx, ry, rot = 0) { ctx.ellipse(x, y, rx, ry, rot, 0, TAU); }
function circ(x, y, r) { ctx.arc(x, y, r, 0, TAU); }
function rr(x, y, w, h, r) { ctx.roundRect(x, y, w, h, r); }
function poly(pts) { ctx.moveTo(pts[0][0], pts[0][1]); for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0], pts[i][1]); ctx.closePath(); }
function lg(x0, y0, x1, y1, ...cs) { const g = ctx.createLinearGradient(x0, y0, x1, y1); cs.forEach((c, i) => g.addColorStop(i / (cs.length - 1), c)); return g; }
function rg(x, y, r0, r1, ...cs) { const g = ctx.createRadialGradient(x, y, r0, x, y, r1); cs.forEach((c, i) => g.addColorStop(i / (cs.length - 1), c)); return g; }
function limb(pts, w, col, outline = 3.4) {
  const path = () => { ctx.beginPath(); ctx.moveTo(pts[0][0], pts[0][1]); for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0], pts[i][1]); };
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  path(); ctx.strokeStyle = K; ctx.lineWidth = w + 2 * outline / SC; ctx.stroke();
  path(); ctx.strokeStyle = col; ctx.lineWidth = w; ctx.stroke();
}
function line(pts, w, col, alpha = 1) { ctx.save(); ctx.globalAlpha = alpha; ctx.beginPath(); ctx.moveTo(pts[0][0], pts[0][1]); for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0], pts[i][1]); ctx.strokeStyle = col; ctx.lineWidth = w / SC; ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.stroke(); ctx.restore(); }
function txt(s, x, y, size, fill, o = {}) {
  ctx.save(); ctx.font = `${o.w || 'bold'} ${size}px ${FONT}`; ctx.textAlign = o.al || 'center'; ctx.textBaseline = 'middle'; ctx.lineJoin = 'round';
  if (o.st) { ctx.lineWidth = o.sw || size * 0.18; ctx.strokeStyle = o.st; ctx.strokeText(s, x, y); }
  ctx.fillStyle = fill; ctx.fillText(s, x, y); ctx.restore();
}
function vtxt(s, cx, y0, size, fill, o = {}) { let y = y0; for (const ch of s) { if (ch === ' ') { y += size * 0.45; continue; } txt(ch, cx, y + size / 2, size, fill, o); y += size * 1.04; } return y; }
function spark(x, y, r, col = C.cream) { ctx.save(); ctx.translate(x, y); ctx.beginPath(); for (let i = 0; i < 8; i++) { const a = i * TAU / 8, rr_ = i % 2 ? r * 0.28 : r; ctx.lineTo(Math.cos(a) * rr_, Math.sin(a) * rr_); } ctx.closePath(); ctx.fillStyle = col; ctx.fill(); ctx.lineWidth = 1.6; ctx.strokeStyle = K; ctx.stroke(); ctx.restore(); }
function cart(x, y, w, h, fill = C.cream, border = C.verm) { shape(() => rr(x, y, w, h, 6), fill, 1.1); ctx.save(); ctx.strokeStyle = border; ctx.lineWidth = 2.2; ctx.beginPath(); rr(x + 4.5, y + 4.5, w - 9, h - 9, 3); ctx.stroke(); ctx.restore(); }
function seig(x, y, w, h, r, c1, c2, line_, lw = 1.5) {
  ctx.save(); ctx.beginPath(); ctx.rect(x, y, w, h); ctx.clip();
  const rows = Math.ceil(h / (r * 0.5)) + 2;
  for (let j = -1; j < rows; j++) {
    const cy = y + j * r * 0.5 + r * 0.5, off = (j & 1) ? r : 0;
    for (let cx = x - 2 * r + off; cx < x + w + r; cx += 2 * r) {
      const ks = [1, 0.75, 0.5, 0.25];
      ks.forEach((k, i) => { ctx.fillStyle = i % 2 ? c2 : c1; ctx.beginPath(); ctx.arc(cx, cy, r * k, 0, TAU); ctx.fill(); });
      ctx.strokeStyle = line_; ctx.lineWidth = lw;
      ks.forEach(k => { ctx.beginPath(); ctx.arc(cx, cy, r * k, Math.PI, TAU); ctx.stroke(); });
    }
  }
  ctx.restore();
}
function cloud(x, y, w, h, fill = C.cream, trim = C.ochre) {
  // ukiyo-e band cloud: flat base, scalloped top
  const n = Math.max(3, Math.round(w / 70)), bw = w / n;
  shape(() => { ctx.moveTo(x, y + h); ctx.lineTo(x, y + h * 0.5); for (let i = 0; i < n; i++) { const x0 = x + i * bw; ctx.bezierCurveTo(x0 + bw * 0.1, y - h * 0.15, x0 + bw * 0.9, y - h * 0.3 - (i % 2) * h * 0.3, x0 + bw, y + h * 0.5); } ctx.lineTo(x + w, y + h); ctx.closePath(); }, lg(0, y, 0, y + h, fill, trim), 0.7);
}
function torii(x, y, s) {
  at(x, y, s, () => {
    shape(() => rr(-40, -88, 16, 90, 3), C.verm); shape(() => rr(24, -88, 16, 90, 3), C.verm);
    shape(() => { ctx.moveTo(-62, -96); ctx.quadraticCurveTo(0, -80, 62, -96); ctx.lineTo(54, -112); ctx.quadraticCurveTo(0, -98, -54, -112); ctx.closePath(); }, K, 0.4);
    shape(() => rr(-52, -80, 104, 11, 3), C.verm);
    shape(() => rr(-10, -108, 20, 26, 3), C.cream, 0.8);
  });
}

// ---------- paper & wood grain ----------
function makePaper() {
  const c = document.createElement('canvas'); c.width = W; c.height = H; const g = c.getContext('2d'), r = rng(11);
  g.fillStyle = C.paper; g.fillRect(0, 0, W, H);
  for (let i = 0; i < 70; i++) { const x = r() * W, y = r() * H, rad = 60 + r() * 220; const gr = g.createRadialGradient(x, y, 0, x, y, rad); gr.addColorStop(0, `rgba(170,120,60,${0.03 + r() * 0.05})`); gr.addColorStop(1, 'rgba(170,120,60,0)'); g.fillStyle = gr; g.fillRect(x - rad, y - rad, rad * 2, rad * 2); }
  for (let i = 0; i < 3200; i++) { const x = r() * W, y = r() * H, l = 6 + r() * 34, a = r() * TAU; g.strokeStyle = r() < 0.5 ? `rgba(120,85,45,${0.05 + r() * 0.08})` : `rgba(255,248,225,${0.14 + r() * 0.2})`; g.lineWidth = 0.6 + r() * 0.8; g.beginPath(); g.moveTo(x, y); g.quadraticCurveTo(x + Math.cos(a + 1) * l * 0.5, y + Math.sin(a + 1) * l * 0.5, x + Math.cos(a) * l, y + Math.sin(a) * l); g.stroke(); }
  const id = g.getImageData(0, 0, W, H), d = id.data;
  for (let i = 0; i < d.length; i += 4) { const n = (r() - 0.5) * 12; d[i] += n; d[i + 1] += n; d[i + 2] += n * 0.8; }
  g.putImageData(id, 0, 0);
  return c;
}
function makeGrain() {
  const c = document.createElement('canvas'); c.width = W; c.height = H; const g = c.getContext('2d'), r = rng(23);
  // wood grain streaks of the printing block
  for (let i = 0; i < 520; i++) {
    const y0 = r() * H, x0 = r() * W - 100, len = 160 + r() * 520, amp = 2 + r() * 6, ph = r() * 6;
    g.strokeStyle = r() < 0.7 ? `rgba(40,25,10,${0.03 + r() * 0.05})` : `rgba(255,250,230,${0.05 + r() * 0.07})`; g.lineWidth = 0.6 + r() * 1.6;
    g.beginPath(); for (let k = 0; k <= 16; k++) { const x = x0 + len * k / 16; g.lineTo(x, y0 + Math.sin(ph + k * 0.7) * amp); } g.stroke();
  }
  for (let i = 0; i < 1400; i++) { g.fillStyle = `rgba(255,248,225,${0.18 + r() * 0.3})`; g.fillRect(r() * W, r() * H, 1 + r() * 2, 1 + r() * 2); }
  for (let i = 0; i < 900; i++) { g.fillStyle = `rgba(60,40,20,${0.05 + r() * 0.12})`; g.fillRect(r() * W, r() * H, 1 + r() * 1.5, 1 + r() * 1.5); }
  const v = g.createRadialGradient(W / 2, H / 2, H * 0.32, W / 2, H / 2, H * 0.72); v.addColorStop(0, 'rgba(150,100,40,0)'); v.addColorStop(1, 'rgba(150,100,40,0.2)');

}
const PAPER = makePaper(), GRAIN = makeGrain();

// ---------- the board ----------
const CELL = 130, GX = 20, GY = 450;
const tc = (c, r) => [GX + CELL * c + CELL / 2, GY + CELL * r + CELL / 2];
const PATH = [[-70, 515], [995, 515], [995, 775], [215, 775], [215, 1035], [1150, 1035]];
const pathCells = new Set(); (function () { for (let c = 0; c < 8; c++) { pathCells.add(c + ',0'); pathCells.add(c + ',2'); } for (let r = 0; r < 3; r++) pathCells.add('7,' + r); for (let r = 2; r < 5; r++) pathCells.add('1,' + r); for (let c = 1; c < 8; c++) pathCells.add(c + ',4'); })();
function pathPos(d) {
  for (let i = 0; i < PATH.length - 1; i++) {
    const a = PATH[i], b = PATH[i + 1], l = Math.hypot(b[0] - a[0], b[1] - a[1]);
    if (d <= l) return [a[0] + (b[0] - a[0]) * d / l, a[1] + (b[1] - a[1]) * d / l];
    d -= l;
  }
  return PATH[PATH.length - 1];
}
let ROAD = null;
function makeRoad() {
  const c = document.createElement('canvas'); c.width = W; c.height = 1300; const g = c.getContext('2d');
  g.lineCap = 'round'; g.lineJoin = 'round'; g.strokeStyle = '#fff'; g.lineWidth = 104; g.beginPath(); PATH.forEach((p, i) => i ? g.lineTo(p[0], p[1]) : g.moveTo(p[0], p[1])); g.stroke();
  const pat = document.createElement('canvas'); pat.width = W; pat.height = 1300; const pg = pat.getContext('2d');
  pg.fillStyle = C.sand; pg.fillRect(0, 0, W, 1300);
  const r = 17;
  for (let j = 0; j < 1300 / (r * 0.5) + 2; j++) { const cy = j * r * 0.5, off = (j & 1) ? r : 0; for (let cx = -2 * r + off; cx < W + r; cx += 2 * r) { [1, 0.7, 0.4].forEach((k, i) => { pg.fillStyle = i % 2 ? '#e4cf94' : C.sand; pg.beginPath(); pg.arc(cx, cy, r * k, 0, TAU); pg.fill(); }); pg.strokeStyle = 'rgba(160,120,50,.55)'; pg.lineWidth = 1.2; [1, 0.7, 0.4].forEach(k => { pg.beginPath(); pg.arc(cx, cy, r * k, Math.PI, TAU); pg.stroke(); }); } }
  g.globalCompositeOperation = 'source-in'; g.drawImage(pat, 0, 0);
  return { c, g };
}
function drawRoad() {
  if (!ROAD) ROAD = makeRoad();
  ctx.save(); ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  const p = () => { ctx.beginPath(); PATH.forEach((q_, i) => i ? ctx.lineTo(q_[0], q_[1]) : ctx.moveTo(q_[0], q_[1])); };
  p(); ctx.strokeStyle = K; ctx.lineWidth = 116; ctx.stroke();
  p(); ctx.strokeStyle = C.ochre; ctx.lineWidth = 108; ctx.stroke();
  ctx.drawImage(ROAD.c, 0, 0);
  // bokashi shade along road edge
  p(); ctx.strokeStyle = 'rgba(120,80,30,.0)'; ctx.stroke();
  ctx.restore();
}

// ---------- characters ----------
function roxorHead(t) {
  const sw = Math.sin(t * 3);
  // mullet tail
  shape(() => { ctx.moveTo(-26, -6); ctx.bezierCurveTo(-42, 8, -40, 30, -22, 40); ctx.bezierCurveTo(-24, 24, -14, 14, -10, 6); ctx.closePath(); }, lg(0, 0, 0, 40, '#8a5230', '#5b3018'));
  // head
  shape(() => { ctx.moveTo(-33, -8); ctx.bezierCurveTo(-36, 22, -22, 40, 0, 41); ctx.bezierCurveTo(22, 40, 36, 22, 33, -8); ctx.bezierCurveTo(30, -34, -30, -34, -33, -8); ctx.closePath(); }, lg(0, -30, 0, 40, '#f6dfc0', C.skin));
  shape(() => ell(-34, 6, 6, 9), C.skin, 0.8); shape(() => ell(34, 6, 6, 9), C.skin, 0.8);
  // shaved sides
  fillOnly(() => { ctx.moveTo(-33, -10); ctx.bezierCurveTo(-32, -26, -22, -30, -20, -26); ctx.bezierCurveTo(-26, -10, -26, 6, -24, 14); ctx.bezierCurveTo(-32, 10, -33, 0, -33, -10); }, 'rgba(78,56,42,.55)');
  fillOnly(() => { ctx.moveTo(33, -10); ctx.bezierCurveTo(32, -26, 22, -30, 20, -26); ctx.bezierCurveTo(26, -10, 26, 6, 24, 14); ctx.bezierCurveTo(32, 10, 33, 0, 33, -10); }, 'rgba(78,56,42,.55)');
  // cheeks
  fillOnly(() => circ(-19, 16, 7), 'rgba(236,110,90,.35)'); fillOnly(() => circ(19, 16, 7), 'rgba(236,110,90,.35)');
  // stubble
  const r = rng(5); ctx.fillStyle = 'rgba(70,50,40,.55)'; for (let i = 0; i < 38; i++) { const a = r() * Math.PI, rad = 18 + r() * 14; const x = Math.cos(a) * rad * 1.0, y = 18 + Math.sin(a) * rad * 0.55; if (Math.abs(x) > 8 || y > 26) ctx.fillRect(x, y, 1.6, 1.6); }
  // brows
  line([[-26, -8], [-14, -12], [-5, -9]], 4.2, '#5a2f16'); line([[5, -9], [15, -15], [27, -9]], 4.2, '#5a2f16');
  // eyes (almond with pale blue iris)
  [[-15, 0], [15, 0]].forEach(([x, y], i) => {
    shape(() => { ctx.moveTo(x - 10, y + 1); ctx.quadraticCurveTo(x, y - 8, x + 10, y + 1); ctx.quadraticCurveTo(x, y + 6, x - 10, y + 1); }, C.cream, 0.8);
    fillOnly(() => circ(x + 1, y, 3.8), '#9fc4d8'); fillOnly(() => circ(x + 1, y, 1.8), K);
  });
  // nose (hikime kagibana hook)
  line([[1, 2], [-1, 14], [5, 15]], 2.2, K);
  // smirk with teeth flash
  shape(() => { ctx.moveTo(-13, 24); ctx.quadraticCurveTo(0, 30, 15, 20); ctx.lineTo(18, 17); ctx.quadraticCurveTo(2, 22, -13, 24); }, '#c7503f', 0.8);
  shape(() => { ctx.moveTo(-6, 25); ctx.quadraticCurveTo(3, 26, 12, 21); ctx.lineTo(10, 27); ctx.quadraticCurveTo(2, 31, -5, 28); ctx.closePath(); }, C.cream, 0.7);
  // mohawk: swooping up and forward
  const m = Math.sin(t * 2.4) * 3;
  shape(() => { ctx.moveTo(-26, -22); ctx.bezierCurveTo(-34, -52, -6, -84, 30 + m, -88); ctx.bezierCurveTo(58 + m, -90, 66 + m, -70, 50 + m, -64); ctx.bezierCurveTo(60 + m, -56, 48, -40, 30, -34); ctx.bezierCurveTo(14, -40, -8, -34, -26, -22); ctx.closePath(); }, lg(-20, -90, 30, -25, '#b57443', '#75401f', '#4f2812'));
  line([[-18, -34], [-6, -62], [22, -80], [44 + m, -80]], 2, '#e1a46a', 0.8); line([[-6, -32], [8, -56], [30, -70], [48 + m, -68]], 1.8, '#e1a46a', 0.7); line([[8, -32], [20, -48], [38, -58]], 1.6, '#2e1608', 0.6);
  line([[-14, -26], [-8, -44], [10, -62]], 1.6, '#2e1608', 0.5);
}
function roxor(x, y, s, t, ph = 0) {
  at(x, y, s, () => {
    const b = Math.sin(t * 4 + ph) * 3;
    // legs
    shape(() => poly([[-37, -122], [-2, -122], [-7, -26], [-42, -26]]), lg(-40, 0, 0, 0, '#7d7c3e', C.olive));
    shape(() => poly([[2, -122], [37, -122], [44, -26], [9, -26]]), lg(0, 0, 44, 0, C.olive, '#5c5b2a'));
    line([[-30, -90], [-24, -60]], 1.6, '#464518', 0.7); line([[28, -92], [32, -60]], 1.6, '#464518', 0.7);
    // lime sneakers
    [[-36, -1], [40, 1]].forEach(([x_, d], i) => { shape(() => { ctx.moveTo(x_ - 20, -26); ctx.bezierCurveTo(x_ - 26, -12, x_ - 26, 0, x_ - 14, 0); ctx.lineTo(x_ + 26 * (i ? 1 : -1) * 0 + (i ? 30 : 20), 0); ctx.bezierCurveTo(x_ + (i ? 38 : 26), -2, x_ + (i ? 34 : 26), -16, x_ + 16, -22); ctx.lineTo(x_ + 16, -26); ctx.closePath(); }, lg(0, -26, 0, 0, '#c5ee66', C.lime)); line([[x_ - 20, -4], [x_ + (i ? 36 : 24), -4]], 3.4, C.cream); line([[x_ - 8, -20], [x_ + 8, -16]], 1.6, K); });
    at(0, b, 1, () => {
      // right arm (raised, viewer right) and left arm with mic
      limb([[50, -222], [84, -250]], 27, '#2b2730'); limb([[84, -250], [90, -300]], 19, C.skin); shape(() => circ(90, -306, 12), C.skin);
      line([[84, -306], [96, -306]], 1.6, K);
      // torso
      shape(() => { ctx.moveTo(-52, -232); ctx.quadraticCurveTo(0, -246, 52, -232); ctx.bezierCurveTo(46, -190, 46, -150, 42, -108); ctx.quadraticCurveTo(0, -98, -42, -108); ctx.bezierCurveTo(-46, -150, -46, -190, -52, -232); ctx.closePath(); }, lg(-50, -230, 50, -110, '#34303a', '#1d1a21'));
      line([[-36, -200], [-30, -130]], 1.6, '#e8dcc0', 0.35); line([[34, -204], [38, -128]], 1.6, '#e8dcc0', 0.35);
      line([[-44, -112], [0, -104], [44, -112]], 2, C.cream, 0.5);
      // orange smiley
      shape(() => circ(0, -168, 24), lg(0, -190, 0, -144, '#ffb04a', '#e8741c'), 0.9);
      fillOnly(() => ell(-8, -176, 3, 5), K); fillOnly(() => ell(8, -176, 3, 5), K);
      ctx.beginPath(); ctx.arc(0, -170, 13, 0.25, Math.PI - 0.25); ctx.lineWidth = 2.6 / SC; ctx.strokeStyle = K; ctx.lineCap = 'round'; ctx.stroke();
      // neck
      shape(() => rr(-10, -250, 20, 24, 5), C.skin, 0.8);
      limb([[-50, -222], [-68, -176]], 27, '#2b2730');
      // mic (black, green band)
      shape(() => rr(-34, -222, 14, 52, 5), '#26242a', 0.9); shape(() => rr(-35, -204, 16, 9, 2), C.lime, 0.6); shape(() => circ(-27, -232, 13), lg(-36, -240, -18, -222, '#585660', '#1d1b22'), 0.9);
      line([[-34, -236], [-20, -228]], 1.2, '#9a98a4', 0.8);
      limb([[-68, -176], [-27, -196]], 19, C.skin); shape(() => circ(-26, -196, 11), C.skin, 0.9);
      // head
      at(0, -272, 1, () => roxorHead(t));
    });
  });
}
function jasminHead(t) {
  const sway = Math.sin(t * 3) * 6;
  // ponytail (behind), from the scrunchie high at the back
  shape(() => { ctx.moveTo(14, -66); ctx.bezierCurveTo(60 + sway, -96, 96 + sway, -40, 74 + sway * 1.5, 22); ctx.bezierCurveTo(70 + sway * 1.5, 60, 52 + sway * 2, 84, 44 + sway * 2, 100); ctx.bezierCurveTo(40 + sway * 2, 70, 30, 40, 36, 8); ctx.bezierCurveTo(38, -24, 28, -50, 14, -66); ctx.closePath(); }, lg(20, -80, 80, 100, '#3a3552', '#14121f'));
  line([[26, -62], [66 + sway, -50], [76 + sway, 0], [62 + sway * 1.5, 54]], 1.6, '#8c92c0', 0.7); line([[24, -56], [50 + sway, -48], [60 + sway, 8], [50 + sway * 2, 70]], 1.4, '#8c92c0', 0.5);
  // back hair mass behind the head
  shape(() => { ctx.moveTo(-36, -4); ctx.bezierCurveTo(-42, 36, -36, 56, -26, 60); ctx.lineTo(26, 60); ctx.bezierCurveTo(36, 56, 42, 36, 36, -4); ctx.closePath(); }, '#1b1829', 0.9);
  // face
  shape(() => { ctx.moveTo(-30, -8); ctx.bezierCurveTo(-32, 24, -18, 40, 0, 42); ctx.bezierCurveTo(18, 40, 32, 24, 30, -8); ctx.bezierCurveTo(26, -32, -26, -32, -30, -8); ctx.closePath(); }, lg(0, -30, 0, 42, '#fbeadb', '#f3d7c2'));
  fillOnly(() => circ(-18, 18, 7.5), 'rgba(238,100,130,.38)'); fillOnly(() => circ(18, 18, 7.5), 'rgba(238,100,130,.38)');
