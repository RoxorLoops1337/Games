<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Drop the Bass Paper Diorama</title>
<style>
html,body{margin:0;height:100%;background:#2a201c}
body{display:flex;align-items:center;justify-content:center;overflow:hidden}
canvas{display:block;width:min(100vw,calc(100vh*1080/1920));height:auto;aspect-ratio:1080/1920}
</style>
</head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<script>
'use strict';
/* Paper Diorama: everything cut from coloured card, white cut edges, drop shadows between layers,
   torn edges, glued tabs, folded cranes, paper grain and warm craft-table light. Procedural + seeded. */
const W = 1080, H = 1920, TAU = Math.PI * 2;
const main = document.getElementById('c');
const mctx = main.getContext('2d');
let ctx = mctx;
const qs = new URLSearchParams(location.search);
const FIX = qs.has('t') ? parseFloat(qs.get('t')) : null;

function rng(seed) { let s = seed >>> 0; return () => { s = (Math.imul(s, 1664525) + 1013904223) >>> 0; return s / 4294967296; }; }
function hx(h) { h = h.replace('#', ''); return [parseInt(h.slice(0, 2), 16), parseInt(h.slice(2, 4), 16), parseInt(h.slice(4, 6), 16)]; }
function toHex(a) { return '#' + a.map(v => Math.max(0, Math.min(255, Math.round(v))).toString(16).padStart(2, '0')).join(''); }
function mix(a, b, t) { const x = hx(a), y = hx(b); return toHex(x.map((v, i) => v + (y[i] - v) * t)); }
const lt = (c, t) => mix(c, '#ffffff', t), dk = (c, t) => mix(c, '#1a1030', t);
const fract = v => v - Math.floor(v);

/* ---------- shapes ---------- */
const R = (x, y, w, h, r = 6) => ({ bb: [x, y, w, h], p(c) { c.roundRect(x, y, w, h, r); } });
const C = (x, y, r) => ({ bb: [x - r, y - r, 2 * r, 2 * r], p(c) { c.arc(x, y, r, 0, TAU); } });
const E = (x, y, rx, ry, rot = 0) => ({ bb: [x - rx, y - ry, 2 * rx, 2 * ry], p(c) { c.ellipse(x, y, rx, ry, rot, 0, TAU); } });
const PL = pts => {
  let x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9;
  for (const q of pts) { x0 = Math.min(x0, q[0]); y0 = Math.min(y0, q[1]); x1 = Math.max(x1, q[0]); y1 = Math.max(y1, q[1]); }
  return { bb: [x0, y0, x1 - x0, y1 - y0], p(c) { c.moveTo(pts[0][0], pts[0][1]); for (let i = 1; i < pts.length; i++) c.lineTo(pts[i][0], pts[i][1]); c.closePath(); } };
};
const PT = (bb, fn) => ({ bb, p: fn });
const star = (cx, cy, ro, ri, n, rot = -Math.PI / 2) => {
  const pts = [];
  for (let i = 0; i < n * 2; i++) { const a = rot + i * Math.PI / n, r = i % 2 ? ri : ro; pts.push([cx + Math.cos(a) * r, cy + Math.sin(a) * r]); }
  return PL(pts);
};
const heart = (cx, cy, s) => PT([cx - s * 1.5, cy - s * 1.1, s * 3, s * 2.1], c => {
  c.moveTo(cx, cy + s * .95);
  c.bezierCurveTo(cx - s * 1.8, cy - s * .15, cx - s * .95, cy - s * 1.35, cx, cy - s * .4);
  c.bezierCurveTo(cx + s * .95, cy - s * 1.35, cx + s * 1.8, cy - s * .15, cx, cy + s * .95);
});
function fringe(cx, cy, r, n, amp, rot) {
  const pts = [];
  for (let i = 0; i < n * 2; i++) { const a = rot + i / (n * 2) * TAU, rr = r + (i % 2 ? 0 : amp); pts.push([cx + Math.cos(a) * rr, cy + Math.sin(a) * rr * .93]); }
  return PL(pts);
}

/* the paper layer: shadow, white cut edge, soft sheen */
function P(sh, fill, o = {}) {
  const d = o.d == null ? 1 : o.d, c = ctx;
  c.save(); c.beginPath(); sh.p(c);
  if (!o.noShadow) { c.shadowColor = 'rgba(24,10,44,' + (o.sa == null ? .42 : o.sa) + ')'; c.shadowBlur = 5 * d; c.shadowOffsetX = 1.5 * d; c.shadowOffsetY = 3.5 * d; }
  c.fillStyle = fill; c.fill();
  c.shadowColor = 'transparent'; c.shadowBlur = 0; c.shadowOffsetX = 0; c.shadowOffsetY = 0;
  if (o.edge !== false) { c.lineJoin = 'round'; c.lineWidth = o.lw == null ? 2.6 : o.lw; c.strokeStyle = o.ec || 'rgba(255,255,255,.95)'; c.stroke(); }
  if (o.sheen !== false) {
    c.clip(); const b = sh.bb, g = c.createLinearGradient(b[0], b[1], b[0] + b[2], b[1] + b[3]);
    g.addColorStop(0, 'rgba(255,255,255,.24)'); g.addColorStop(.55, 'rgba(255,255,255,0)'); g.addColorStop(1, 'rgba(20,0,40,.17)');
    c.fillStyle = g; c.fillRect(b[0] - 3, b[1] - 3, b[2] + 6, b[3] + 6);
  }
  c.restore();
}
function T(txt, x, y, size, fill, o = {}) {
  const c = ctx; c.save();
  c.font = '900 ' + size + 'px "Arial Black","Segoe UI Black",Impact,"DejaVu Sans",sans-serif';
  c.textAlign = o.align || 'center'; c.textBaseline = 'middle'; c.lineJoin = 'round';
  if (o.rot) { c.translate(x, y); c.rotate(o.rot); x = 0; y = 0; }
  if (o.sticker !== false) {
    c.shadowColor = 'rgba(24,10,44,.4)'; c.shadowBlur = 4; c.shadowOffsetY = 3;
    c.strokeStyle = o.sc || '#fff'; c.lineWidth = size * (o.sw || .26); c.strokeText(txt, x, y); c.shadowColor = 'transparent';
  }
  c.fillStyle = fill; c.fillText(txt, x, y); c.restore();
}
function burst(x, y, r, col, rot, n = 9) {
  const pts = [];
  for (let i = 0; i < n * 2; i++) { const a = rot + i * Math.PI / n, rr = i % 2 ? r * .52 : r; pts.push([x + Math.cos(a) * rr, y + Math.sin(a) * rr]); }
  P(PL(pts), col, { d: .6, lw: 2 });
  P(star(x, y, r * .5, r * .26, n, rot), '#fff7c8', { d: 0, noShadow: true, edge: false });
}
function tape(x, y, w, h, rot, col) {
  const c = ctx; c.save(); c.translate(x, y); c.rotate(rot);
  const pts = [[-w / 2, -h / 2]]; for (let i = 0; i <= 4; i++) pts.push([-w / 2 + (i % 2 ? 4 : 0), -h / 2 + i * h / 4]);
  const tl = PL([[-w / 2, -h / 2], [w / 2, -h / 2], [w / 2 - 4, -h / 4], [w / 2, 0], [w / 2 - 4, h / 4], [w / 2, h / 2], [-w / 2, h / 2], [-w / 2 + 4, h / 4], [-w / 2, 0], [-w / 2 + 4, -h / 4]]);
  P(tl, col, { d: .5, edge: false, sheen: false, sa: .25 });
  c.globalAlpha = .35; c.strokeStyle = '#fff'; c.lineWidth = 1.4; c.beginPath();
  for (let i = -w / 2 + 6; i < w / 2; i += 9) { c.moveTo(i, -h / 2); c.lineTo(i + 5, h / 2); } c.stroke();
  c.restore();
}
function tab(x, y, w, h, col) { /* glued flap with dashed fold */
  P(PL([[x, y], [x + w, y], [x + w - 6, y + h], [x + 6, y + h]]), col, { d: .5, lw: 1.6 });
  ctx.save(); ctx.strokeStyle = 'rgba(80,40,20,.45)'; ctx.lineWidth = 1.4; ctx.setLineDash([4, 3]);
  ctx.beginPath(); ctx.moveTo(x + 2, y + 1); ctx.lineTo(x + w - 2, y + 1); ctx.stroke(); ctx.restore();
}
function note(x, y, s, col, rot = 0) {
  ctx.save(); ctx.translate(x, y); ctx.rotate(rot); ctx.scale(s, s);
  P(E(0, 0, 7, 5.2, -.4), col, { d: .5, lw: 1.6 });
  P(R(5, -22, 3.2, 22, 1), col, { d: .3, lw: 1.2 });
  P(PL([[8, -22], [18, -15], [8, -11]]), col, { d: .3, lw: 1.2 });
  ctx.restore();
}
function crane(x, y, s, col, flap, rot = 0) {
  const c = ctx; c.save(); c.translate(x, y); c.rotate(rot); c.scale(s, s);
  const o = { d: .5, lw: 1.6 }, f = flap * 14;
  P(PL([[-4, -8], [-14, -44 - f], [16, -8]]), dk(col, .18), o);          // back wing
  P(PL([[-26, 2], [-52, -16], [-47, -5], [-22, 7]]), lt(col, .1), o);    // tail
  P(PL([[22, -2], [40, -32], [45, -28], [29, 5]]), lt(col, .22), o);     // neck
  P(PL([[40, -32], [53, -29], [45, -23]]), dk(col, .25), o);            // head
  P(PL([[-26, 2], [0, -12], [26, 2], [0, 15]]), col, o);                 // body
  P(PL([[-2, -6], [14, -42 - f], [27, -3]]), lt(col, .3), o);           // front wing
  P(PL([[0, -12], [26, 2], [0, 15]]), dk(col, .1), { d: 0, noShadow: true, edge: false });
  c.restore();
}

/* ---------- data ---------- */
const TUR = {
  kick: { col: '#ff7a3c', acc: '#ffd9a0', piv: -66, len: 58, name: 'KICK CANNON' },
  snare: { col: '#ffd23c', acc: '#fff3b0', piv: -56, len: 34, name: 'SNARE SNAPPER' },
  hat: { col: '#7dffd0', acc: '#d8fff0', piv: -72, len: 26, name: 'HI-HAT GATLING' },
  sub: { col: '#7a5cff', acc: '#c9bcff', piv: -52, len: 0, name: 'SUB BASS' },
  mic: { col: '#ff5fb0', acc: '#ffd0ea', piv: -76, len: 26, name: 'SIREN MIC' },
  synth: { col: '#35c8ff', acc: '#c4f1ff', piv: -96, len: 10, name: 'ARC SYNTH' },
  horn: { col: '#ff4a5e', acc: '#ffc4cb', piv: -50, len: 66, name: 'AIR HORN' },
  scratch: { col: '#e5e5ff', acc: '#ffffff', piv: -62, len: 30, name: 'VINYL SCRATCHER' },
  cowbell: { col: '#ffb02e', acc: '#fff0c4', piv: -62, len: 76, name: 'COWBELL SNIPER' }
};
const EN = {
  fuzz: { r: 15, col: '#c9c4d6', name: 'FUZZ' }, zip: { r: 12, col: '#6dffd8', name: 'GLITCH ZIP' }, brick: { r: 22, col: '#8e86a8', name: 'BRICKWALL' },
  echo: { r: 16, col: '#b79cff', name: 'ECHO' }, leech: { r: 17, col: '#8fffa0', name: 'HUM HEALER' }, drone: { r: 14, col: '#ff9ad2', name: 'AUTOTUNE DRONE' },
  gate: { r: 18, col: '#ffd26b', name: 'GATE GUARD' }, squeal: { r: 17, col: '#ff6b6b', name: 'FEEDBACK' }, mute: { r: 17, col: '#9fb8ff', name: 'MUTE GHOST' },
  compressor: { r: 38, col: '#7d8bb0', name: 'THE COMPRESSOR' }
};
const INK = '#2a2660', PINK = '#ff5fb0', LIME = '#9dff3a', TANG = '#ff9a3c', CREAM = '#fff3dc', KRAFT = '#c9996a';

/* ---------- turrets ---------- */
function muz(type, x, y, a) { const T_ = TUR[type]; return [x + Math.sin(a) * T_.len, y + T_.piv - Math.cos(a) * T_.len]; }

function turret(type, lvl, x, y, t, a, fire) {
  const c = ctx, D = TUR[type], col = D.col, acc = D.acc, dkc = dk(col, .35), rec = fire * 5;
  c.save(); c.translate(x, y);
  c.fillStyle = 'rgba(30,10,50,.3)'; c.beginPath(); c.ellipse(2, 4, 50, 10, 0, 0, TAU); c.fill();
  P(R(-44, -14, 88, 18, 6), '#e0b27a', { d: .8, lw: 2 });
  P(R(-44, -4, 88, 8, 3), '#c58f55', { d: 0, noShadow: true, edge: false });
  switch (type) {
    case 'kick':
      P(R(-36, -62, 72, 50, 9), col);
      P(R(-36, -62, 72, 9, 4), dkc, { d: 0, noShadow: true, edge: false });
      P(R(-36, -24, 72, 9, 4), dkc, { d: 0, noShadow: true, edge: false });
      for (const lx of [-36, 36]) P(R(lx - 3, -46, 6, 16, 3), acc, { d: .4, lw: 1.4 });
      P(PL([[3, -52], [-9, -38], [-1, -38], [-6, -27], [9, -43], [1, -43]]), CREAM, { d: .4, lw: 1.4 });
      P(E(0, -62, 36, 11), acc, { d: .5, lw: 2 });
      c.save(); c.translate(0, D.piv + rec); c.rotate(a);
      P(R(-10, -50, 20, 50, 4), dk(col, .2)); P(R(-14, -58, 28, 12, 4), acc); P(C(0, 0, 13), dkc, { d: .6, lw: 2 });
      c.restore(); break;
    case 'snare':
      P(R(-38, -44, 76, 32, 7), col);
      c.save(); c.strokeStyle = acc; c.lineWidth = 2.4; c.beginPath();
      for (let i = -34; i < 34; i += 8) { c.moveTo(i, -40); c.lineTo(i + 4, -16); c.lineTo(i + 8, -40); } c.stroke(); c.restore();
      P(R(-38, -44, 76, 7, 3), dkc, { d: 0, noShadow: true, edge: false });
      P(E(0, -44, 38, 11), acc, { d: .5, lw: 2 });
      c.save(); c.translate(0, D.piv); c.rotate(a);
      for (const k of [-1, 1]) { c.save(); c.rotate(k * (.38 - fire * .22)); P(R(-3, -46, 6, 46, 3), CREAM, { d: .6, lw: 1.6 }); P(C(0, -46, 5.5), TANG, { d: .3, lw: 1.4 }); c.restore(); }
      c.restore(); break;
    case 'hat': {
      P(PL([[-4, -22], [-36, -3], [-29, -2], [0, -16]]), '#8e97ad', { d: .4, lw: 1.4 });
      P(PL([[4, -22], [36, -3], [29, -2], [0, -16]]), '#8e97ad', { d: .4, lw: 1.4 });
      P(R(-3, -84, 6, 68), '#a5aec2', { d: .4, lw: 1.4 });
      P(E(0, -60, 38, 8), dk(col, .2));
      P(E(0, -64 - fire * 6, 38, 8), col);
      c.save(); c.translate(0, D.piv); c.rotate(a);
      const o = Math.sin(t * 18) * 3;
      for (let i = -1; i <= 1; i++) P(R(i * 9 - 4 + o * i * .3, -28, 8, 28, 2), i === 0 ? '#e3e9f7' : '#b4bed6', { d: .4, lw: 1.3 });
      P(R(-17, -10, 34, 14, 5), dk(col, .35), { d: .5, lw: 1.6 });
      c.restore();
      P(E(0, -84, 32, 6), acc, { d: .5, lw: 1.8 });
      break; }
    case 'sub': {
      P(R(-40, -94, 80, 82, 12), col);
      P(R(-32, -86, 64, 66, 8), dk(col, .45), { d: 0, noShadow: true, sheen: false, lw: 1.6 });
      const pu = 1 + Math.sin(t * 8) * .04 + fire * .08;
      P(C(0, -52, 26 * pu), acc, { d: .6, lw: 2 }); P(C(0, -52, 20 * pu), dk(col, .25), { d: .3, lw: 1.6 });
      P(C(0, -52, 12 * pu), lt(col, .35), { d: .3, lw: 1.6 }); P(C(0, -52, 4.5), CREAM, { d: 0, lw: 1.2 });
      for (const [bx, by] of [[-34, -88], [34, -88], [-34, -18], [34, -18]]) P(C(bx, by, 2.6), acc, { d: 0, noShadow: true, lw: .8 });
      c.lineWidth = 4;
      for (let k = 0; k < 3; k++) { const ph = fract(t * .9 + k / 3); c.strokeStyle = 'rgba(201,188,255,' + (1 - ph) * .9 + ')'; c.beginPath(); c.arc(0, -52, 30 + ph * 24, 0, TAU); c.stroke(); }
      break; }
    case 'mic':
      P(PL([[-24, -8], [24, -8], [11, -20], [-11, -20]]), '#6b6f88', { d: .6, lw: 1.8 });
      P(R(-3, -66, 6, 50), '#8e97ad', { d: .4, lw: 1.4 });
      P(C(0, -78, 21), col, { d: .8 });
      c.save(); c.beginPath(); c.arc(0, -78, 19, 0, TAU); c.clip(); c.strokeStyle = 'rgba(120,20,80,.45)'; c.lineWidth = 1.4; c.beginPath();
      for (let k = -4; k <= 4; k++) { c.moveTo(k * 7 - 14, -98); c.lineTo(k * 7 + 14, -58); c.moveTo(k * 7 + 14, -98); c.lineTo(k * 7 - 14, -58); } c.stroke(); c.restore();
      P(R(-21, -70, 42, 9, 3), CREAM, { d: .3, lw: 1.4 });
      c.save(); c.translate(0, D.piv); c.rotate(a); c.lineCap = 'round';
      for (let k = 0; k < 3; k++) {
        const r = 30 + k * 13, al = .55 + .45 * Math.sin(t * 7 - k * 1.2 + fire * 3);
        c.globalAlpha = Math.max(.25, al);
        c.strokeStyle = '#fff'; c.lineWidth = 9; c.beginPath(); c.arc(0, 0, r, -Math.PI / 2 - .6, -Math.PI / 2 + .6); c.stroke();
        c.strokeStyle = col; c.lineWidth = 5; c.beginPath(); c.arc(0, 0, r, -Math.PI / 2 - .6, -Math.PI / 2 + .6); c.stroke();
      }
      c.restore(); break;
    case 'synth':
      P(PL([[-46, -12], [46, -12], [46, -46], [-46, -56]]), col);
      P(R(-46, -22, 92, 10, 3), dkc, { d: 0, noShadow: true, edge: false });
      for (let i = 0; i < 9; i++) P(R(-41 + i * 9.2, -40 + i * 1.1, 8, 20, 1.5), '#ffffff', { d: 0, noShadow: true, edge: false, sheen: false });
      for (let i = 0; i < 8; i++) if (i !== 2 && i !== 6) P(R(-36 + i * 9.2, -40 + i * 1.1, 5, 11, 1), INK, { d: 0, noShadow: true, edge: false, sheen: false });
      for (let i = 0; i < 4; i++) P(C(-34 + i * 13, -49 + i * 1.1, 3.6), CREAM, { d: .2, lw: 1 });
      P(R(-5, -84, 10, 30), '#8e97ad', { d: .4, lw: 1.4 });
      c.strokeStyle = '#5b6380'; c.lineWidth = 1.6; c.beginPath(); for (let i = -82; i < -56; i += 5) { c.moveTo(-5, i); c.lineTo(5, i + 2); } c.stroke();
      c.fillStyle = 'rgba(196,241,255,' + (.35 + fire * .3) + ')'; c.beginPath(); c.arc(0, -96, 14 + fire * 5, 0, TAU); c.fill();
      P(C(0, -96, 8.5), acc, { d: .5, lw: 1.8 });
      break;
    case 'horn':
      P(R(-26, -30, 52, 24, 7), dk(col, .35));
      P(C(0, -32, 11), INK, { d: .4, lw: 1.6 });
      c.save(); c.translate(0, D.piv); c.rotate(a);
      P(PL([[-9, 0], [9, 0], [27, -66], [-27, -66]]), col);
      P(PL([[-14, -26], [14, -26], [18, -42], [-18, -42]]), CREAM, { d: 0, noShadow: true, edge: false });
      P(R(-32, -76, 64, 12, 6), acc, { d: .6, lw: 2 });
      P(R(-10, -2, 20, 12, 4), INK, { d: .4, lw: 1.4 });
      c.restore(); break;
    case 'scratch':
      P(R(-46, -34, 92, 26, 8), '#8f86d9');
      P(R(-40, -58, 10, 26, 3), '#8f86d9', { d: .5, lw: 1.6 }); P(R(30, -58, 10, 26, 3), '#8f86d9', { d: .5, lw: 1.6 });
      c.save(); c.translate(0, -62); c.rotate(Math.sin(t * 2) * .1); c.scale(1 - fire * .12, 1);
      P(C(0, 0, 32), '#1f1a38', { lw: 2.4 });
      c.strokeStyle = '#3d3560'; c.lineWidth = 1.5; for (const r of [26, 20, 14]) { c.beginPath(); c.arc(0, 0, r, 0, TAU); c.stroke(); }
      c.fillStyle = 'rgba(255,255,255,.2)'; for (let k = 0; k < 2; k++) { const an = t * 4 + k * Math.PI; c.beginPath(); c.moveTo(0, 0); c.arc(0, 0, 31, an, an + .5); c.fill(); }
      P(C(0, 0, 11), PINK, { d: .3, lw: 1.4 }); P(C(0, 0, 2.5), CREAM, { d: 0, edge: false, noShadow: true });
      c.restore();
      c.strokeStyle = '#cfd3e6'; c.lineWidth = 4; c.lineCap = 'round'; c.beginPath(); c.moveTo(40, -32); c.lineTo(16, -66); c.stroke();
      P(R(10, -72, 12, 8, 3), '#fff', { d: .4, lw: 1.2 });
      break;
    case 'cowbell':
      P(E(0, -14, 26, 7), '#7a4a00', { d: .2, lw: 1.5 });
      P(PL([[-25, -14], [25, -14], [17, -58], [-17, -58]]), col);
      P(E(0, -58, 17, 5), dk(col, .3), { d: .2, lw: 1.5 });
      P(PL([[-12, -28], [12, -28], [9, -46], [-9, -46]]), lt(col, .45), { d: 0, noShadow: true, edge: false });
      P(R(-6, -74, 12, 16, 4), dkc, { d: .5, lw: 1.5 });
      c.save(); c.translate(0, D.piv + rec); c.rotate(a);
      P(R(-3.5, -76, 7, 76), '#3a3558', { d: .6, lw: 1.6 }); P(R(-6, -36, 12, 18, 3), acc, { d: .5, lw: 1.4 }); P(R(-6, -82, 12, 8, 2), INK, { d: .3, lw: 1.2 });
      P(C(0, 0, 9), dkc, { d: .5, lw: 1.6 });
      c.restore(); break;
  }
  for (let i = 0; i < lvl; i++) P(star((i - (lvl - 1) / 2) * 17, 16, 8.5, 3.8, 5), '#ffd23c', { d: .4, lw: 1.5 });
  c.restore();
}

/* ---------- enemies ---------- */
function eyes(r, t, ph, o = {}) {
  const ex = r * .36, ey = -r * .12, er = r * .31 * (o.big || 1);
  for (const sx of [-1, 1]) {

    const q = L(p), ang = Math.atan2(ty - mz[1], tx - mz[0]);
    c.save();
    switch (type) {
      case 'kick': P(C(q[0], q[1], 8), '#ff7a3c', { d: .7, lw: 2 }); P(C(q[0], q[1], 3.5), '#ffd9a0', { d: 0, noShadow: true, edge: false }); for (let k = 1; k < 4; k++) { const z = L(Math.max(0, p - k * .035)); P(C(z[0], z[1], 6 - k), 'rgba(255,154,60,' + (.6 - k * .15) + ')', { d: 0, noShadow: true, edge: false, sheen: false }); } break;
      case 'snare': c.translate(q[0], q[1]); c.rotate(t * 8); P(star(0, 0, 9, 4, 4), '#ffd23c', { d: .7, lw: 1.8 }); break;
      case 'hat': for (let k = 0; k < 3; k++) { const z = L(fract(p + k * .1)); c.save(); c.translate(z[0], z[1]); c.rotate(ang + Math.PI / 2); P(R(-2.5, -8, 5, 16, 2), '#7dffd0', { d: .5, lw: 1.3 }); c.restore(); } break;
      case 'sub': c.lineWidth = 4; for (let k = 0; k < 2; k++) { const ph = fract(t * .9 + k * .5); c.strokeStyle = 'rgba(201,188,255,' + (1 - ph) * .8 + ')'; c.beginPath(); c.arc(bx, by - 52, 60 + ph * 70, 0, TAU); c.stroke(); } break;
      case 'mic': {
        const segs = 18, pts = [];
        for (let k = 0; k <= segs; k++) { const u = k / segs, z = L(u), nx = -(ty - mz[1]), ny = tx - mz[0], nl = Math.hypot(nx, ny) || 1, w = Math.sin(u * 18 - t * 12) * 7 * Math.sin(u * Math.PI); pts.push([z[0] + nx / nl * w, z[1] + ny / nl * w]); }
        c.lineCap = 'round'; c.lineJoin = 'round';
        for (const [lw, st] of [[11, '#ffffff'], [6, PINK]]) { c.strokeStyle = st; c.lineWidth = lw; c.beginPath(); pts.forEach((z, k) => k ? c.lineTo(z[0], z[1]) : c.moveTo(z[0], z[1])); c.stroke(); }
        note(pts[7][0], pts[7][1] - 4, .6, '#ffd0ea', .2); note(pts[13][0], pts[13][1] - 4, .55, CREAM, -.2); break; }
      case 'synth': {
        const pts = [[mz[0], mz[1]]], seedn = Math.floor(t * 14), rj = rng(seedn * 7 + i);
        for (let k = 1; k < 7; k++) { const z = L(k / 7); pts.push([z[0] + (rj() - .5) * 26, z[1] + (rj() - .5) * 26]); } pts.push([tx, ty]);
        c.lineJoin = 'round'; for (const [lw, st] of [[9, '#ffffff'], [4.5, '#35c8ff']]) { c.strokeStyle = st; c.lineWidth = lw; c.beginPath(); pts.forEach((z, k) => k ? c.lineTo(z[0], z[1]) : c.moveTo(z[0], z[1])); c.stroke(); } break; }
      case 'horn': for (let k = 0; k < 3; k++) { const ph = fract(t * 1.4 + k / 3), rd = 20 + ph * 80; c.strokeStyle = 'rgba(255,74,94,' + (1 - ph) + ')'; c.lineWidth = 7; c.lineCap = 'round'; c.beginPath(); c.arc(mz[0] - Math.sin(a) * 0, mz[1], rd, ang - .5, ang + .5); c.stroke(); c.strokeStyle = 'rgba(255,255,255,' + (1 - ph) * .9 + ')'; c.lineWidth = 2.4; c.stroke(); } break;
      case 'scratch': { const u = Math.sin(p * Math.PI), z = L(u * .95); c.translate(z[0], z[1] - Math.sin(p * TAU) * 18); c.rotate(t * 14); P(C(0, 0, 11), '#1f1a38', { d: .8, lw: 2 }); P(C(0, 0, 4.5), PINK, { d: 0, noShadow: true, edge: false }); c.fillStyle = 'rgba(255,255,255,.7)'; c.fillRect(2, -9, 3, 9); break; }
      case 'cowbell': c.setLineDash([3, 6]); c.strokeStyle = 'rgba(255,95,176,.7)'; c.lineWidth = 2; c.beginPath(); c.moveTo(mz[0], mz[1]); c.lineTo(tx, ty); c.stroke(); c.setLineDash([]);
        { const z0 = L(Math.max(0, p - .12)), z1 = L(Math.min(1, p + .02)); c.lineCap = 'round'; c.strokeStyle = '#fff'; c.lineWidth = 9; c.beginPath(); c.moveTo(z0[0], z0[1]); c.lineTo(z1[0], z1[1]); c.stroke(); c.strokeStyle = '#ffb02e'; c.lineWidth = 5; c.stroke(); } break;
    }
    c.restore();
    if (p > .8 && type !== 'sub') burst(tx, ty, 8 + (p - .8) * 90, ['#ffb06a', '#fff07a', '#fff07a', '#b9fff0', '#ff9ac8', '#9fe4ff', '#ff8a96', '#e5e5ff', '#ffd27a', '#fff07a'][i], i + t * 2);
    if (p < .12 && type !== 'sub' && type !== 'synth') burst(mz[0], mz[1], 10 + (1 - p / .12) * 6, '#fff07a', t * 3, 7);
  });
  // damage numbers
  const dn = [[0, '128', 0], [1, '96', 0], [3, '540', 1], [5, '212', 0], [6, '75', 0], [7, '310', 1], [8, '154', 0], [9, '1.2K', 1], [2, '88', 0]];
  dn.forEach((d, k) => {
    const e = foes[d[0]], ph = fract(t * .5 + k * .29), r = EN[e.f[0]].r * (e.f[0] === 'compressor' ? 1.4 : 1.9);
    const yy = e.y - r * (e.f[0] === 'compressor' ? 3.0 : 2.4) - ph * 36 + (e.f[0] === 'drone' ? -40 : 0);
    c.save(); c.globalAlpha = Math.min(1, (1 - ph) * 2.2);
    if (d[2]) { T(d[1], e.x + 6, yy, 26, '#ff5a2a', { sw: .3 }); P(star(e.x - 30, yy - 14, 8, 3.5, 5), '#ffd23c', { d: .3, lw: 1.2 }); }
    else T(d[1], e.x + 6, yy, 19, INK, { sw: .32 });
    c.restore();
  });

  // stage + heroes + notes
  hero('r', 450, 1118, .74, t); hero('j', 640, 1118, .74, t);
  for (let i = 0; i < 6; i++) { const ph = fract(t * .25 + i / 6), nx = 400 + i * 60 + Math.sin(t + i) * 12, ny = 1090 - ph * 180; c.globalAlpha = Math.sin(ph * Math.PI); note(nx, ny, .8, i % 2 ? PINK : LIME, Math.sin(t * 2 + i) * .3); c.globalAlpha = 1; }
  // little crane on stage
  crane(790, 1062 + Math.sin(t * 2) * 4, .8, LIME, Math.sin(t * 4), -.1);
  crane(300, 1050 + Math.sin(t * 2 + 1) * 4, .7, PINK, Math.sin(t * 4 + 1), .1);

  // HUD
  heart(0, 0, 1);
  P(heart(96, 82, 15), PINK, { d: 1, lw: 2.4 });
  P(R(126, 66, 250, 32, 16), '#14102e', { d: .6, lw: 2 });
  P(R(130, 70, 222 * .78 + 16, 24, 12), PINK, { d: 0, noShadow: true, edge: false });
  P(R(136, 74, 190, 6, 3), '#ffb4dc', { d: 0, noShadow: true, edge: false, sheen: false });
  T('16/20', 250, 83, 17, INK, { sticker: false });
  P(R(398, 58, 284, 52, 26), TANG, { d: 1.4, lw: 3 });
  T('WAVE 7 / 20', 540, 85, 28, INK, { sticker: false });
  P(R(724, 66, 250, 32, 16), '#14102e', { d: .6, lw: 2 });
  coinI(738, 82, 22, t);
  T('1,284', 880, 83, 22, '#ffd23c', { sticker: false, align: 'center' });
  // hype bar
  P(R(126, 112, 740, 24, 12), '#14102e', { d: .6, lw: 2 });
  P(R(130, 116, 530, 16, 8), LIME, { d: 0, noShadow: true, edge: false });
  c.save(); c.beginPath(); c.roundRect(130, 116, 530, 16, 8); c.clip(); c.fillStyle = 'rgba(255,255,255,.35)';
  for (let x = -40; x < 600; x += 40) { const sx = 130 + x + (t * 40 % 40); c.beginPath(); c.moveTo(sx, 132); c.lineTo(sx + 12, 116); c.lineTo(sx + 22, 116); c.lineTo(sx + 10, 132); c.fill(); } c.restore();
  P(PT([84, 108, 30, 36], cc => { cc.moveTo(99, 108); cc.bezierCurveTo(112, 124, 114, 136, 99, 142); cc.bezierCurveTo(84, 136, 86, 124, 99, 108); }), TANG, { d: .8, lw: 2 });
  P(PT([92, 124, 14, 18], cc => { cc.moveTo(99, 124); cc.bezierCurveTo(105, 132, 105, 138, 99, 141); cc.bezierCurveTo(93, 138, 93, 132, 99, 124); }), '#ffe45a', { d: 0, noShadow: true, edge: false });
  T('HYPE x2.4', 970, 124, 18, CREAM, { align: 'right', sticker: false });
  // buttons
  const beat = Math.sin(t * Math.PI * 2 * 2.1) * .5 + .5;
  c.save(); c.translate(540, 1210); c.scale(1 + beat * .03, 1 + beat * .03);
  P(R(-190, -34, 380, 84, 42), '#b3410f', { d: 2 });
  P(R(-190, -46, 380, 84, 42), TANG, { d: 1, lw: 3.4 });
  P(R(-170, -40, 340, 26, 13), 'rgba(255,255,255,.28)', { d: 0, noShadow: true, edge: false, sheen: false });
  T('DROP', 0, -2, 52, INK, { sw: .2 });
  for (const sx of [-1, 1]) { P(PL([[sx * 130 - 14, -20], [sx * 130 + 14, -20], [sx * 130, 2]]), CREAM, { d: .5, lw: 1.8 }); P(PL([[sx * 130 - 14, -4], [sx * 130 + 14, -4], [sx * 130, 18]]), CREAM, { d: .5, lw: 1.8 }); }
  c.restore();
  const abil = (x, col, glyph, cd) => {
    P(C(x, 1210, 44), col, { d: 2, lw: 3.2 }); P(C(x, 1210, 35), lt(col, .25), { d: 0, noShadow: true, lw: 1.6, ec: 'rgba(255,255,255,.6)' });
    c.save(); c.translate(x, 1208);
    if (glyph === 'bolt') P(PL([[6, -22], [-14, 4], [-3, 4], [-8, 22], [14, -6], [3, -6]]), '#fff3dc', { d: .6, lw: 2, ec: dk(col, .3) });
    else { P(heart(0, -2, 13), '#fff3dc', { d: .6, lw: 2, ec: dk(col, .3) }); }
    c.restore();
    c.strokeStyle = 'rgba(255,255,255,.95)'; c.lineWidth = 6; c.lineCap = 'round'; c.beginPath(); c.arc(x, 1210, 49, -Math.PI / 2, -Math.PI / 2 + TAU * cd); c.stroke();
  };
  abil(170, LIME, 'bolt', .78); abil(910, PINK, 'heart', .55);
  T('R', 218, 1176, 16, INK, { sw: .3 }); T('J', 862, 1176, 16, INK, { sw: .3 });
  c.restore();

  // ---------- cast sheet dynamic ----------
  hero('r', 185, 1636, .84, t); hero('j', 400, 1636, .84, t + 1);
  // name tags
  for (const [x, col, nm, rot] of [[120, LIME, 'ROXORLOOPS', -.05], [470, PINK, 'JASMIN', .05]]) {
    c.save(); c.translate(x, 1452); c.rotate(rot + Math.sin(t * 1.5 + x) * .03);
    c.strokeStyle = 'rgba(255,243,220,.8)'; c.lineWidth = 1.6; c.beginPath(); c.moveTo(0, -20); c.lineTo(0, 0); c.stroke();
    P(R(-(nm.length * 6.4 + 12), 0, nm.length * 12.8 + 24, 26, 8), col, { d: 1.2, lw: 2.2 }); T(nm, 0, 13.5, 15, INK, { sticker: false }); c.restore();
  }
  crane(520, 1500 + Math.sin(t * 2) * 5, .8, TANG, Math.sin(t * 4), -.15);
  // currency tokens
  [coinI, diamondI, recordI].forEach((fn, i) => {
    const x = 662 + i * 140, y = 1500 + Math.sin(t * 2 + i) * 3;
    fn(x + 30, y + 8, 33, t);
    T(['COIN', 'DIAMOND', 'RECORD'][i], x + 30, 1538, 13, INK, { sticker: false });
  });
  // cards
  const cardObj = [
    x => { turret('kick', 3, x, 1672 + 140, t, Math.sin(t) * .3, fract(t) < .2 ? 1 - fract(t) * 5 : 0); },
    x => { turret('sub', 2, x, 1672 + 140, t, 0, fract(t * 1.3) < .2 ? 1 : 0); },
    x => { turret('mic', 3, x, 1672 + 140, t, Math.sin(t) * .3, 0); }
  ];
  for (let i = 0; i < 6; i++) {
    const x = 30 + i * 172 + 80;
    c.save(); c.beginPath(); R(x - 70, 1682, 140, 150, 10).p(c); c.clip();
    c.translate(x, 0);
    if (i < 3) { c.save(); c.translate(0, 1672 + 132); c.scale(1.3, 1.3); c.translate(0, -(1672 + 132)); c.translate(-0, 0); c.restore(); }
    c.restore();
    if (i < 3) { c.save(); c.translate(x, 1672 + 138); c.scale(1.25, 1.25); const tp = ['kick', 'sub', 'mic'][i], lv = [3, 2, 3][i]; turret(tp, lv, 0, 0, t, tp === 'sub' ? 0 : Math.sin(t + i) * .3, fract(t * 1.1 + i * .3) < .2 ? 1 : 0); c.restore(); }
    else {
      const ty = ['fuzz', 'squeal', 'compressor'][i - 3];
      enemy(ty, x, 1672 + (ty === 'compressor' ? 128 : 134), t, { k: ty === 'compressor' ? 1.15 : 3.0, ph: i, tag: false });
    }
  }
  // paper confetti on top of cast sheet
  c.save(); c.restore();

  // ---------- light + grain ----------
  c.save(); c.globalCompositeOperation = 'multiply'; c.drawImage(GR, 0, 0); c.restore();
  c.drawImage(LT, 0, 0);
}

buildOverlay(); buildStatic();
const t0 = performance.now();
function loop() {
  const t = FIX != null ? FIX : (performance.now() - t0) / 1000;
  frame(t); window.__ready = true;
  if (FIX == null) requestAnimationFrame(loop);
}
loop();
</script>
