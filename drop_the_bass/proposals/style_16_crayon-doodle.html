<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Drop the Bass - Crayon Doodle</title>
<style>
html,body{margin:0;height:100%;background:#2a2630;overflow:hidden}
canvas{position:absolute;left:50%;top:50%;transform-origin:center center;display:block}
</style></head><body>
<canvas id="c" width="1080" height="1920"></canvas>
<script>
"use strict";
/* Style 16: crayon doodle on lined notebook paper. Everything is drawn with wobbly waxy strokes,
   scribble-hatched fills and a hand-made stroke font. Redrawn about 7 times a second (boiling lines). */
const W = 1080, H = 1920;
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
function fit() { const k = Math.min(innerWidth / W, innerHeight / H); cv.style.transform = 'translate(-50%,-50%) scale(' + k + ')'; }
addEventListener('resize', fit); fit();

/* ---------- seeded random ---------- */
let seed = 1, BOIL = 0, SC = 1;
function rnd() { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }
function setSeed(n) { seed = (Math.imul(n | 0, 2654435761) ^ Math.imul(BOIL + 1, 40503)) | 0; }
const rr = (a, b) => a + (b - a) * rnd();

const C = {
  paper: '#fbf6e6', ink: '#2b2733', red: '#e8403f', orange: '#ff9226', yellow: '#ffd60a', green: '#43b94a', lime: '#9dff3a',
  blue: '#2f7de1', sky: '#6cc4ff', purple: '#7b4fd0', lav: '#d9ccf5', pink: '#ff5fb0', brown: '#8a5a2b', grey: '#9a9aa6',
  cyan: '#19d3ff', mag: '#ff2fb9', skin: '#f5c49a', tan: '#e3a073', olive: '#6f7a2a', teal: '#2fc4b2', gold: '#ffc83a'
};

/* ---------- geometry helpers (flat [x,y,x,y...] arrays) ---------- */
function arc(cx, cy, rx, ry, a0, a1, n) {
  n = n || Math.max(6, Math.ceil(Math.abs(a1 - a0) / 20)); const o = [];
  for (let k = 0; k <= n; k++) { const t = (a0 + (a1 - a0) * k / n) * Math.PI / 180; o.push(cx + Math.cos(t) * rx, cy + Math.sin(t) * ry); }
  return o;
}
function blob(cx, cy, rx, ry, n = 14, w = .07) {
  const o = []; for (let i = 0; i < n; i++) { const a = i / n * 6.2832, r = 1 + (rnd() - .5) * w * 2; o.push(cx + Math.cos(a) * rx * r, cy + Math.sin(a) * ry * r); } return o;
}
function spiky(rx, ry, n = 11, sp = .16, cx = 0, cy = 0) {
  const o = []; for (let i = 0; i < n * 2; i++) { const a = i / (n * 2) * 6.2832, r = (i % 2 ? 1 : 1 + sp) * (1 + (rnd() - .5) * .07); o.push(cx + Math.cos(a) * rx * r, cy + Math.sin(a) * ry * r); } return o;
}
function rect(x, y, w, h, r = 0) {
  if (!r) return [x, y, x + w, y, x + w, y + h, x, y + h];
  const o = [], c = [[x + w - r, y + r, -90], [x + w - r, y + h - r, 0], [x + r, y + h - r, 90], [x + r, y + r, 180]];
  for (const [a, b, s] of c) for (let k = 0; k <= 3; k++) { const t = (s + k * 30) * Math.PI / 180; o.push(a + Math.cos(t) * r, b + Math.sin(t) * r); }
  return o;
}
function rev(p) { const o = []; for (let i = p.length - 2; i >= 0; i -= 2) o.push(p[i], p[i + 1]); return o; }
function rs(p, step, closed) {
  const o = [], n = p.length / 2, m = closed ? n : n - 1;
  for (let i = 0; i < m; i++) {
    const x0 = p[i * 2], y0 = p[i * 2 + 1], x1 = p[((i + 1) % n) * 2], y1 = p[((i + 1) % n) * 2 + 1];
    const L = Math.hypot(x1 - x0, y1 - y0), k = Math.max(1, Math.round(L / step));
    for (let j = 0; j < k; j++) o.push(x0 + (x1 - x0) * j / k, y0 + (y1 - y0) * j / k);
  }
  if (!closed) o.push(p[(n - 1) * 2], p[(n - 1) * 2 + 1]);
  return o;
}

/* ---------- crayon primitives ---------- */
function ln(p, col, w = 4, closed = false, j = 1.5, dash) {
  const s = SC;
  for (let pass = 0; pass < 2; pass++) {
    const q = rs(p, 22 / s, closed);
    for (let i = 0; i < q.length; i++) q[i] += (rnd() - .5) * 2 * j / s;
    if (closed && q.length >= 6) q.push(q[0] + (rnd() - .5) * 3 / s, q[1] + (rnd() - .5) * 3 / s, q[2], q[3]);
    if (q.length < 4) q.push(q[0] + .1, q[1] + .1);
    ctx.beginPath(); ctx.moveTo(q[0], q[1]);
    for (let i = 2; i < q.length - 2; i += 2) ctx.quadraticCurveTo(q[i], q[i + 1], (q[i] + q[i + 2]) / 2, (q[i + 1] + q[i + 3]) / 2);
    ctx.lineTo(q[q.length - 2], q[q.length - 1]);
    ctx.strokeStyle = col; ctx.lineWidth = (pass ? w * .5 : w) / s; ctx.globalAlpha = pass ? .55 : .92;
    ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    if (dash) ctx.setLineDash(dash.map(d => d / s));
    ctx.stroke(); ctx.setLineDash([]);
  }
  ctx.globalAlpha = 1;
}
function hatch(p, col, gap = 7, ang = -.6, alpha = .9) {
  const s = SC; gap /= s;
  let x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9;
  for (let i = 0; i < p.length; i += 2) { x0 = Math.min(x0, p[i]); x1 = Math.max(x1, p[i]); y0 = Math.min(y0, p[i + 1]); y1 = Math.max(y1, p[i + 1]); }
  const cx = (x0 + x1) / 2, cy = (y0 + y1) / 2, R = Math.hypot(x1 - x0, y1 - y0) / 2 + gap;
  ctx.save(); ctx.beginPath(); ctx.moveTo(p[0], p[1]); for (let i = 2; i < p.length; i += 2) ctx.lineTo(p[i], p[i + 1]); ctx.closePath(); ctx.clip();
  ctx.translate(cx, cy); ctx.rotate(ang);
  ctx.strokeStyle = col; ctx.lineWidth = gap * 1.35; ctx.globalAlpha = alpha; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  ctx.beginPath(); let d = 1, first = true;
  for (let y = -R; y < R; y += gap) {
    const xa = -R + (rnd() - .5) * gap, xb = R + (rnd() - .5) * gap;
    if (first) { ctx.moveTo(d > 0 ? xa : xb, y); first = false; }
    ctx.lineTo(d > 0 ? xb : xa, y + gap * .5 + (rnd() - .5) * gap * .3); d = -d;
  }
  ctx.stroke(); ctx.restore(); ctx.globalAlpha = 1;
}
function shp(p, fill, line = C.ink, lw = 4, o = {}) {
  const ang = o.ang !== undefined ? o.ang : -.7 + rr(-.25, .25);
  if (fill) hatch(p, fill, o.gap || 6.5, ang, o.alpha || .9);
  if (o.f2) hatch(p, o.f2, (o.gap || 6.5) * 2.2, ang + 1.3, .3);
  if (line) ln(p, line, lw, true, o.j || 1.3);
}
function dot(x, y, r, col) { ctx.beginPath(); ctx.ellipse(x, y, r * (1 + (rnd() - .5) * .15), r, 0, 0, 6.3); ctx.fillStyle = col; ctx.globalAlpha = .96; ctx.fill(); ctx.globalAlpha = 1; }

/* ---------- hand-made stroke font ---------- */
const G = {
  'A': [[0, 6, 2, 0, 4, 6], [.8, 4, 3.2, 4]],
  'B': [[0, 6, 0, 0, 2.4, 0].concat(arc(2.4, 1.5, 1.4, 1.5, -90, 90), [0, 3]), [2.4, 3].concat(arc(2.5, 4.5, 1.5, 1.5, -90, 90), [0, 6])],
  'C': [arc(2.2, 3, 2, 3, -40, -320)],
  'D': [[0, 6, 0, 0, 1.4, 0].concat(arc(1.4, 3, 2.5, 3, -90, 90), [0, 6])],
  'E': [[4, 0, 0, 0, 0, 6, 4, 6], [0, 3, 3, 3]],
  'F': [[4, 0, 0, 0, 0, 6], [0, 3, 3, 3]],
  'G': [arc(2.2, 3, 2, 3, -40, -330).concat([4, 3.3, 2.4, 3.3])],
  'H': [[0, 0, 0, 6], [4, 0, 4, 6], [0, 3, 4, 3]],
  'I': [[1, 0, 3, 0], [2, 0, 2, 6], [1, 6, 3, 6]],
  'J': [[3.6, 0, 3.6, 4.2].concat(arc(2.2, 4.2, 1.4, 1.8, 0, 160))],
  'K': [[0, 0, 0, 6], [3.8, 0, 0, 3.4], [1, 2.6, 4, 6]],
  'L': [[0, 0, 0, 6, 4, 6]],
  'M': [[0, 6, 0, 0, 2, 3.5, 4, 0, 4, 6]],
  'N': [[0, 6, 0, 0, 4, 6, 4, 0]],
  'O': [arc(2, 3, 2, 3, -90, 270)],
  'P': [[0, 6, 0, 0, 2.4, 0].concat(arc(2.4, 1.6, 1.5, 1.6, -90, 90), [0, 3.2])],
  'Q': [arc(2, 3, 2, 3, -90, 270), [2.4, 4.2, 4, 6]],
  'R': [[0, 6, 0, 0, 2.4, 0].concat(arc(2.4, 1.6, 1.5, 1.6, -90, 90), [0, 3.2]), [1.5, 3.2, 4, 6]],
  'S': [arc(2, 1.6, 1.9, 1.6, -30, -270).concat(arc(2, 4.4, 1.9, 1.6, -90, 150))],
  'T': [[0, 0, 4, 0], [2, 0, 2, 6]],
  'U': [[0, 0, 0, 3.8].concat(arc(2, 3.8, 2, 2.2, 180, 0), [4, 0])],
  'V': [[0, 0, 2, 6, 4, 0]],
  'W': [[0, 0, 1, 6, 2, 2.5, 3, 6, 4, 0]],
  'X': [[0, 0, 4, 6], [4, 0, 0, 6]],
  'Y': [[0, 0, 2, 3, 4, 0], [2, 3, 2, 6]],
  'Z': [[0, 0, 4, 0, 0, 6, 4, 6]],
  '0': [arc(2, 3, 1.9, 3, -90, 270)],
  '1': [[1, 1.2, 2.2, 0, 2.2, 6], [1, 6, 3.4, 6]],
  '2': [arc(2, 1.8, 1.9, 1.8, -180, 30).concat([0, 6, 4, 6])],
  '3': [arc(2, 1.5, 1.8, 1.5, -150, 90), arc(2, 4.5, 2, 1.5, -90, 150)],
  '4': [[3, 6, 3, 0, 0, 4.2, 4, 4.2]],
  '5': [[3.8, 0, .4, 0, .2, 2.8].concat(arc(2, 4, 2, 2, -120, 150))],
  '6': [[3.4, .2, 1, 2, .1, 4.2].concat(arc(2, 4.2, 1.9, 1.8, 180, 540))],
  '7': [[0, 0, 4, 0, 1.5, 6]],
  '8': [arc(2, 1.6, 1.6, 1.6, 0, 360), arc(2, 4.4, 1.9, 1.6, 0, 360)],
  '9': [arc(2, 1.8, 1.9, 1.8, 0, 360), [3.9, 1.8, 3.7, 4, 2.5, 6]],
  '!': [[2, 0, 2, 3.8], [2, 5.5, 2, 5.7]],
  '.': [[2, 5.5, 2, 5.7]],
  ':': [[2, 1.6, 2, 1.8], [2, 4.4, 2, 4.6]],
  '+': [[2, 1.5, 2, 4.5], [.5, 3, 3.5, 3]],
  '-': [[.5, 3, 3.5, 3]],
  '/': [[4, 0, 0, 6]],
  '?': [arc(2, 1.7, 1.7, 1.7, -180, 60).concat([2, 3.6, 2, 4]), [2, 5.5, 2, 5.7]],
  '#': [[1.3, 0, 1, 6], [3, 0, 2.7, 6], [0, 2, 4, 2], [0, 4, 4, 4]],
  ',': [[2, 5.4, 1.4, 6.6]]
};
function txt(str, x, y, size, col, o = {}) {
  str = String(str).toUpperCase(); const u = size / 6, adv = (o.adv || 5.2) * u;
  const wTot = str.length * adv - 1.2 * u, dx = o.align === 'c' ? -wTot / 2 : o.align === 'r' ? -wTot : 0;
  const lw = o.w || Math.max(2.2, size * .15), jj = Math.min(1.4, size * .04 + .3);
  const sv = SC; SC = 1; ctx.save(); ctx.translate(x, y); ctx.rotate(o.rot || 0);
  const passes = o.out ? [[o.out, lw + (o.ow || 6)], [col, lw]] : [[col, lw]];
  for (const [pc, pw] of passes) {
    for (let i = 0; i < str.length; i++) {
      const g = G[str[i]]; if (!g) continue;
      const gx = dx + i * adv, gy = Math.sin(i * 1.7 + (o.ph || 0)) * u * .3 - size;
      const cc = Array.isArray(pc) ? pc : pc;
      const colr = (o.rainbow && pc === col) ? o.rainbow[i % o.rainbow.length] : pc;
      for (const st of g) {
        const q = []; for (let k = 0; k < st.length; k += 2) q.push(gx + st[k] * u, gy + st[k + 1] * u);
        ln(q, colr, pw, false, jj);
      }
    }
  }
  ctx.restore(); SC = sv;
}

/* ---------- little icons ---------- */
function star5(cx, cy, r, col, rot = 0, lw = 2.5) {
  const p = []; for (let i = 0; i < 10; i++) { const a = -Math.PI / 2 + rot + i * Math.PI / 5, q = i % 2 ? r * .46 : r; p.push(cx + Math.cos(a) * q, cy + Math.sin(a) * q); }
  shp(p, col, C.ink, lw, { gap: 4 });
}
function heart(cx, cy, s, col, lw = 2.5) {
  const p = []; for (let i = 0; i < 26; i++) { const t = i / 26 * 6.2832; p.push(cx + 16 * Math.pow(Math.sin(t), 3) * s / 16, cy - (13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t)) * s / 16); }
  shp(p, col, C.ink, lw, { gap: 4 });
}
function sparkle(cx, cy, r, col, w = 3) { ln([cx - r, cy, cx + r, cy], col, w); ln([cx, cy - r, cx, cy + r], col, w); ln([cx - r * .5, cy - r * .5, cx + r * .5, cy + r * .5], col, w * .6); }
function note(x, y, s, col) {
  dot(x, y, s * .5, col); ln([x + s * .45, y, x + s * .45, y - s * 1.6], col, Math.max(2, s * .22)); ln([x + s * .45, y - s * 1.6, x + s * 1.15, y - s * 1.1], col, Math.max(2, s * .22));
}
function burst(cx, cy, r, col, n = 11) {
  const p = []; for (let i = 0; i < n * 2; i++) { const a = i / (n * 2) * 6.2832, q = (i % 2 ? .62 : 1) * r * (1 + (rnd() - .5) * .12); p.push(cx + Math.cos(a) * q, cy + Math.sin(a) * q); }
  shp(p, col, C.red, 3, { gap: 4.5 });
}
function gEye(x, y, r, lx, ly) {
  dot(x, y, r, '#fff'); ln(blob(x, y, r, r, 10, .04), C.ink, 3, true, .8);
  const px = x + lx * r * .42, py = y + ly * r * .42; dot(px, py, r * .5, C.ink); dot(px - r * .12, py - r * .15, r * .14, '#fff');
}
function face(x, y, s = 1) {
  dot(x - 9 * s, y, 3.6 * s, C.ink); dot(x + 9 * s, y, 3.6 * s, C.ink);
  const g = arc(x, y + 5 * s, 11 * s, 9 * s, 15, 165); ln(g, C.ink, 3, false, .6);
  ln([x - 8 * s, y + 9.5 * s, x + 8 * s, y + 9.5 * s], '#fff', 2.5, false, .3);
  dot(x - 18 * s, y + 6 * s, 4 * s, 'rgba(255,95,176,.75)'); dot(x + 18 * s, y + 6 * s, 4 * s, 'rgba(255,95,176,.75)');
}
function coinI(x, y, r) { shp(blob(x, y, r, r, 12, .03), C.yellow, C.orange, 3.5, { gap: 4 }); ln(arc(x, y, r * .6, r * .6, 0, 360), C.orange, 2.4, false, .6); note(x - r * .22, y + r * .25, r * .45, C.orange); }
function diamI(x, y, r) {
  shp([x - r, y - r * .3, x - r * .5, y - r * .85, x + r * .5, y - r * .85, x + r, y - r * .3, x, y + r], C.cyan, C.blue, 3.5, { gap: 4 });
  ln([x - r, y - r * .3, x + r, y - r * .3], C.blue, 2.2); ln([x - r * .3, y - r * .3, x, y + r, x + r * .3, y - r * .3], C.blue, 2); sparkle(x + r * .9, y - r * .9, r * .35, C.yellow, 2.5);
}
function recI(x, y, r, t) {
  shp(blob(x, y, r, r, 14, .02), C.ink, C.ink, 3, { gap: 4 });
  ln(arc(x, y, r * .72, r * .72, 0, 360), '#6b6478', 1.8); ln(arc(x, y, r * .5, r * .5, 0, 360), '#6b6478', 1.8);
  dot(x, y, r * .3, C.pink); dot(x, y, r * .06, C.paper); const a = t * 5;
  ln(arc(x, y, r * .85, r * .85, a * 57, a * 57 + 50), '#fff', 3);
}

/* ---------- paper, grain (prebuilt) ---------- */
const paperC = document.createElement('canvas'); paperC.width = W; paperC.height = H;
const grainC = document.createElement('canvas'); grainC.width = W; grainC.height = H;
function buildPaper() {
  setSeed(5); const g = paperC.getContext('2d');
  g.fillStyle = C.paper; g.fillRect(0, 0, W, H);
  const rg = g.createRadialGradient(540, 960, 380, 540, 960, 1250); rg.addColorStop(0, 'rgba(255,255,255,0)'); rg.addColorStop(1, 'rgba(160,125,70,.2)');
  g.fillStyle = rg; g.fillRect(0, 0, W, H);
  // fibres
  for (let i = 0; i < 1400; i++) { g.strokeStyle = 'rgba(150,125,90,' + (.05 + rnd() * .1) + ')'; g.lineWidth = 1; const x = rnd() * W, y = rnd() * H, a = rnd() * 6.3; g.beginPath(); g.moveTo(x, y); g.lineTo(x + Math.cos(a) * (3 + rnd() * 9), y + Math.sin(a) * (3 + rnd() * 9)); g.stroke(); }
  // fold creases
  for (const y of [640, 1280]) { const gr = g.createLinearGradient(0, y - 8, 0, y + 8); gr.addColorStop(0, 'rgba(120,100,70,0)'); gr.addColorStop(.5, 'rgba(120,100,70,.14)'); gr.addColorStop(1, 'rgba(255,255,255,.25)'); g.fillStyle = gr; g.fillRect(0, y - 8, W, 16); }
  const gv = g.createLinearGradient(536, 0, 548, 0); gv.addColorStop(0, 'rgba(120,100,70,0)'); gv.addColorStop(.5, 'rgba(120,100,70,.09)'); gv.addColorStop(1, 'rgba(255,255,255,.2)'); g.fillStyle = gv; g.fillRect(536, 0, 12, H);
  // ruled lines
  g.strokeStyle = 'rgba(80,155,215,.55)'; g.lineWidth = 2.3;
  for (let y = 100; y < H; y += 48) { g.beginPath(); g.moveTo(0, y); g.lineTo(W, y + ((y * 7) % 3 - 1) * .5); g.stroke(); }
  g.strokeStyle = 'rgba(80,155,215,.55)'; g.beginPath(); g.moveTo(0, 52); g.lineTo(W, 52); g.stroke();
  // red margin
  g.strokeStyle = 'rgba(235,85,85,.6)'; g.lineWidth = 2.6; for (const x of [57, 63]) { g.beginPath(); g.moveTo(x, 0); g.lineTo(x + .8, H); g.stroke(); }
  // punch holes
  for (const y of [280, 960, 1640]) {
    g.fillStyle = 'rgba(70,60,50,.2)'; g.beginPath(); g.arc(30, y + 2, 17, 0, 6.3); g.fill();
    g.fillStyle = '#2a2630'; g.beginPath(); g.arc(30, y, 14, 0, 6.3); g.fill();
    g.strokeStyle = 'rgba(255,255,255,.5)'; g.lineWidth = 2; g.beginPath(); g.arc(30, y, 14.5, .2, 2.4); g.stroke();
  }
  // coffee rings
  function ring(x, y, r, a) {
    for (let k = 0; k < 3; k++) { g.strokeStyle = 'rgba(125,72,30,' + (a * (.5 + k * .25)) + ')'; g.lineWidth = 3 + k * 2.4; g.beginPath(); const s0 = rnd() * 6; g.ellipse(x + rnd() * 3, y + rnd() * 3, r + k * 2, r * .96 + k * 2, 0, s0, s0 + 5.4 + rnd() * .6); g.stroke(); }
    g.fillStyle = 'rgba(150,90,40,' + (a * .22) + ')'; g.beginPath(); g.ellipse(x, y, r - 3, r * .96 - 3, 0, 0, 6.3); g.fill();
    for (let k = 0; k < 6; k++) { g.fillStyle = 'rgba(125,72,30,' + a * .6 + ')'; g.beginPath(); g.arc(x + (rnd() - .5) * r * 3.4, y + (rnd() - .5) * r * 3.4, 1.5 + rnd() * 3, 0, 6.3); g.fill(); }
  }
  ring(1010, 1305, 64, .5); ring(170, 1700, 46, .38); ring(560, 36, 30, .3);
}
function buildGrain() {
  setSeed(11); const g = grainC.getContext('2d');
  g.fillStyle = C.paper;
  for (let i = 0; i < 60000; i++) { g.globalAlpha = .25 + rnd() * .55; g.fillRect(rnd() * W, rnd() * H, .7 + rnd() * 2.2, .6 + rnd() * 1.8); }
  g.strokeStyle = C.paper; g.lineWidth = 1.2;
  for (let i = 0; i < 11000; i++) { g.globalAlpha = .2 + rnd() * .4; const x = rnd() * W, y = rnd() * H; g.beginPath(); g.moveTo(x, y); g.lineTo(x + 5 + rnd() * 10, y + 3 + rnd() * 6); g.stroke(); }
  g.globalAlpha = 1;
}

/* ---------- characters ---------- */
function limb(p, w, col) { ln(p, C.ink, w + 6, false, .8); ln(p, col, w, false, .6); }
function mic(x, y, ang, band) {
  ctx.save(); ctx.translate(x, y); ctx.rotate(ang);
  shp(rect(-5, -6, 10, 34, 4), '#3a3744', C.ink, 3, { gap: 4 });
  shp(rect(-6, 8, 12, 8, 2), band, C.ink, 2.5, { gap: 3 });
  shp(blob(0, -14, 11, 12, 10, .03), '#4b4757', C.ink, 3, { gap: 3.5 }); ln([-8, -14, 8, -14], '#888', 1.5); ln([0, -24, 0, -4], '#888', 1.5);
  ctx.restore();
