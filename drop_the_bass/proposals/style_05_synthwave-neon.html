<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Drop the Bass Synthwave Neon</title>
<style>
html,body{margin:0;height:100%;background:#05010d}
body{display:flex;align-items:center;justify-content:center;overflow:hidden}
canvas{display:block;width:min(100vw,calc(100vh*1080/1920));height:auto;aspect-ratio:1080/1920}
</style>
</head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<script>
'use strict';
/* Synthwave Neon: black void, neon tube outlines, additive glow, bloom pass, chrome text, scanlines.
   Palette: #05010d void, #ff2bd6 magenta, #18e6ff cyan, #8a4dff violet, #ff9a3c sunset, #9dff3a lime. */
const W = 1080, H = 1920, TAU = Math.PI * 2;
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const FONT = "'Arial Black','Liberation Sans','DejaVu Sans',sans-serif";
const MONO = "'DejaVu Sans Mono','Liberation Mono',monospace";
const FREEZE = new URLSearchParams(location.search).get('t');
function rng(seed) { return function () { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

/* ---------- helpers ---------- */

}
function S(fill, col, w, fn, a) { ctx.beginPath(); fn(); if (fill) { ctx.fillStyle = fill; ctx.fill(); } if (col) tube(col, w, undefined, a); }
function poly(p) { ctx.moveTo(p[0][0], p[0][1]); for (let i = 1; i < p.length; i++) ctx.lineTo(p[i][0], p[i][1]); ctx.closePath(); }
function circ(x, y, r) { ctx.moveTo(x + r, y); ctx.arc(x, y, r, 0, TAU); }
function ell(x, y, rx, ry) { ctx.moveTo(x + rx, y); ctx.ellipse(x, y, rx, ry, 0, 0, TAU); }
function rrect(x, y, w, h, r) { ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }
function cap(x1, y1, x2, y2, r, fill, col) {

function lg(x0, y0, x1, y1, stops) { const g = ctx.createLinearGradient(x0, y0, x1, y1); stops.forEach((s, i) => g.addColorStop(s[0], s[1])); return g; }

}
function text(str, x, y, size, col, o) {
  o = o || {}; ctx.save(); ctx.font = (o.font || ('900 ' + size + 'px ' + FONT)); ctx.textAlign = o.align || 'center'; ctx.textBaseline = 'alphabetic';
  if (o.glow) { ctx.shadowColor = o.glow; ctx.shadowBlur = o.blur || 14; }
  if (o.stroke) { ctx.lineJoin = 'round'; ctx.strokeStyle = o.stroke; ctx.lineWidth = o.sw || 4; ctx.strokeText(str, x, y); }
  ctx.fillStyle = col; ctx.fillText(str, x, y); ctx.restore();
}
function chrome(str, x, y, size, o) {
  o = o || {}; ctx.save(); ctx.font = 'italic 900 ' + size + 'px ' + FONT; ctx.textAlign = o.align || 'center'; ctx.lineJoin = 'round';
  ctx.shadowColor = o.glow || '#ff2bd6'; ctx.shadowBlur = size * .45; ctx.strokeStyle = o.glow || '#ff2bd6'; ctx.lineWidth = size * .13; ctx.strokeText(str, x, y);
  ctx.shadowBlur = 0; ctx.strokeStyle = o.edge || '#18e6ff'; ctx.lineWidth = size * .07; ctx.strokeText(str, x, y);
  const g = lg(0, y - size * .78, 0, y, [[0, '#ffffff'], [.38, '#c3ecff'], [.49, '#6a7ff0'], [.5, '#1a0c4a'], [.56, '#ff7ad9'], [1, '#ffc15e']]);
  ctx.fillStyle = g; ctx.fillText(str, x, y);

  ctx.restore();

function fitChrome(str, x, y, size, maxW, o) {

/* ---------- backdrop pieces ---------- */
function perspGrid(x0, x1, yH, yB, vx, t, col, a, n) {
  ctx.save(); ctx.beginPath(); ctx.rect(x0, yH, x1 - x0, yB - yH); ctx.clip();
  ctx.beginPath();
  const rows = n || 14;

  const sp = (x1 - x0) / 9;
  for (let i = -16; i <= 16; i++) { ctx.moveTo(vx + i * sp * .06, yH); ctx.lineTo(vx + i * sp * 1.2, yB); }
  tube(col, 1.6, col, a); ctx.restore();
}
function sun(cx, cy, r, yCut, t) {
  ctx.save(); ctx.beginPath(); ctx.rect(cx - r - 10, cy - r - 10, r * 2 + 20, yCut - (cy - r - 10)); ctx.clip();
  ctx.beginPath(); ctx.arc(cx, cy, r, 0, TAU); ctx.fillStyle = lg(0, cy - r, 0, cy + r, [[0, '#ffe45e'], [.45, '#ff9a3c'], [.75, '#ff2bd6'], [1, '#8a4dff']]); ctx.fill();
  ctx.globalCompositeOperation = 'destination-out';
  for (let i = 0; i < 9; i++) { const y = cy + r * .05 + i * r * .12 + ((t * 4) % 1) * 0; const h = 2 + i * 1.8; ctx.fillRect(cx - r, y, r * 2, h); }
  ctx.restore();
}
function mountains(x0, x1, yb, hMax, seed, col) {
  const r = rng(seed), pts = []; let x = x0; pts.push([x0, yb]);
  while (x < x1) { pts.push([x, yb - hMax * (.25 + .75 * r())]); x += 30 + r() * 40; pts.push([x, yb - hMax * .15 * r()]); x += 10 + r() * 20; }
  pts.push([x1, yb]);
  ctx.beginPath(); ctx.moveTo(pts[0][0], pts[0][1]); pts.forEach(p => ctx.lineTo(p[0], p[1])); ctx.fillStyle = 'rgba(20,4,50,.85)'; ctx.fill(); tube(col, 1.8, col, .9);
}
function stars(x0, y0, x1, y1, n, seed, t) {
  const r = rng(seed); ctx.save(); ctx.globalCompositeOperation = 'lighter';
  for (let i = 0; i < n; i++) { const x = x0 + r() * (x1 - x0), y = y0 + r() * (y1 - y0), s = .6 + r() * 1.6, ph = r() * 6; ctx.globalAlpha = .4 + .5 * Math.sin(t * 2 + ph) ** 2; ctx.fillStyle = r() < .3 ? '#18e6ff' : '#ffffff'; ctx.fillRect(x, y, s, s); }
  ctx.restore();
}

/* ---------- turrets ---------- */
const TUR = {
  kick: { c: '#ff7a3c', a: '#ffd9a0', n: 'KICK CANNON' }, snare: { c: '#ffd23c', a: '#fff3b0', n: 'SNARE SNAPPER' },
  hat: { c: '#7dffd0', a: '#d8fff0', n: 'HI-HAT GATLING' }, sub: { c: '#8a5cff', a: '#c9bcff', n: 'SUB BASS' },
  mic: { c: '#ff5fb0', a: '#ffd0ea', n: 'SIREN MIC' }, synth: { c: '#18e6ff', a: '#c4f1ff', n: 'ARC SYNTH' },
  horn: { c: '#ff4a5e', a: '#ffc4cb', n: 'AIR HORN' }, scratch: { c: '#e5e5ff', a: '#ffffff', n: 'VINYL SCRATCHER' },
  cowbell: { c: '#ffb02e', a: '#fff0c4', n: 'COWBELL SNIPER' }

function turret(type, x, y, s, lvl, t, fire) {
  const d = TUR[type], c = d.c, a = d.a; fire = fire || 0;
  ctx.save(); ctx.translate(x, y); ctx.scale(s, s);
  glowDot(0, 0, 54, c, .22 + .1 * lvl);
  S(lg(0, -42, 0, 42, [[0, '#1a0a3a'], [1, '#08021a']]), c, 2, () => rrect(-42, -42, 84, 84, 12), .75);
  if (lvl >= 3) { ctx.save(); ctx.rotate(t * .8); S(null, a, 1.4, () => { ctx.moveTo(52, 0); ctx.arc(0, 0, 52, 0, 1.1); ctx.moveTo(-52, 0); ctx.arc(0, 0, 52, Math.PI, Math.PI + 1.1); }, .9); ctx.restore(); }
  ctx.translate(0, -2);

    case 'kick':
      S(dark, c, 3, () => rect4(-6, -34 - fire * 5, 12, 28)); S(null, a, 1.6, () => circ(0, -36 - fire * 5, 7));
      S('#2a1208', c, 3, () => circ(0, 8, 24)); S(null, a, 2, () => circ(0, 8, 15)); S(null, c, 1.4, () => circ(0, 8, 6));
      break;
    case 'snare':
      S(dark, c, 3, () => { ctx.moveTo(-26, -4); ctx.lineTo(-26, 16); ctx.quadraticCurveTo(0, 30, 26, 16); ctx.lineTo(26, -4); ctx.closePath(); });
      S('#2b2208', a, 2.4, () => ell(0, -4, 26, 11));
      S(null, c, 1.3, () => { for (let i = -3; i <= 3; i++) { ctx.moveTo(i * 6, -9); ctx.lineTo(i * 6 + 2, 3); } });
      S(null, '#ffffff', 2.4, () => { ctx.moveTo(-24, -30); ctx.lineTo(10, -4 - fire * 4); ctx.moveTo(24, -30); ctx.lineTo(-10, -4 - fire * 4); });
      break;
    case 'hat':
      S(dark, c, 3, () => { ctx.moveTo(0, -4); ctx.lineTo(0, 28); });
      S('#0a2a24', c, 2.6, () => ell(0, 14, 28, 7)); S('#0a2a24', a, 2.6, () => ell(0, 6, 28, 7));
      for (let i = 0; i < 3; i++) { const an = t * 9 + i * TAU / 3, ox = Math.cos(an) * 7; S(dark, a, 2.4, () => rect4(ox - 2, -34 - fire * 3, 4, 28)); }
      S('#0a2a24', c, 2.4, () => circ(0, -8, 11));
      break;
    case 'sub': {
      S(dark, c, 3, () => rrect(-28, -28, 56, 56, 8));
      const pu = Math.sin(t * 7) * 1.6 + fire * 3;
      S('#1a0a48', c, 2.6, () => circ(0, 0, 21 + pu)); S('#2a1470', a, 2, () => circ(0, 0, 13 + pu * .6)); S('#c9bcff', '#fff', 1.4, () => circ(0, 0, 5));
      break; }
    case 'mic':
      S(dark, c, 3, () => { ctx.moveTo(0, 8); ctx.lineTo(0, 28); ctx.moveTo(-14, 28); ctx.lineTo(14, 28); });
      S('#3a0f30', c, 3, () => circ(0, -8, 15));
      S(null, a, 1.2, () => { for (let i = -2; i <= 2; i++) { ctx.moveTo(i * 5, -20); ctx.lineTo(i * 5, 4); ctx.moveTo(-14, -8 + i * 5); ctx.lineTo(14, -8 + i * 5); } }, .8);
      S('#ff5fb0', '#fff', 1.6, () => rrect(-9, 4, 18, 5, 2));
      for (let i = 0; i < 2; i++) { const k = ((t * 1.5 + i * .5) % 1); S(null, c, 2, () => { ctx.arc(0, -8, 24 + k * 10, -2.4, -.74); ctx.moveTo(0, 0); }, 1 - k); }

      { const j = Math.floor(t * 14), r = rng(j * 7 + 3); S(null, '#ffffff', 2.4, () => { ctx.moveTo(0, -18); let yy = -18, xx = 0; for (let k = 0; k < 4; k++) { yy -= 6; xx = (r() - .5) * 16; ctx.lineTo(xx, yy); } }); }

      S('#ff4a5e', a, 2.4, () => ell(0, -26, 24, 7)); S(null, a, 1.2, () => { ctx.moveTo(-14, -6); ctx.lineTo(14, -6); ctx.moveTo(-18, -16); ctx.lineTo(18, -16); });
      break;
    case 'scratch':
      ctx.save(); ctx.rotate(t * 3);
      S('#05020f', c, 2.6, () => circ(0, 0, 28));
      S(null, '#6a58c8', 1, () => { circ(0, 0, 24); circ(0, 0, 20); circ(0, 0, 16); }, .8);
      S('#ff2bd6', '#fff', 1.6, () => circ(0, 0, 8)); S(null, '#ffffff', 2, () => { ctx.arc(0, 0, 22, .3, .9); });
      ctx.restore();
      S(null, a, 2.4, () => { ctx.moveTo(32, -30); ctx.lineTo(10, -6 + fire * 4); });

      S('#2c1a04', c, 3, () => poly([[-14, -10], [14, -10], [24, 24], [-24, 24]]));
      S('#ffb02e', a, 2, () => ell(0, 24, 24, 5)); S(null, a, 1.4, () => { ctx.moveTo(-8, -4); ctx.lineTo(-11, 18); });
      S(null, c, 2, () => circ(0, 8, 5));

  ctx.restore();

  ctx.save(); ctx.translate(x, y + 46 * s);
  for (let i = 0; i < lvl; i++) { const px = (i - (lvl - 1) / 2) * 13 * s; ctx.save(); ctx.translate(px, 0); S(c, '#ffffff', 1.4, () => poly([[0, -5 * s], [4 * s, 0], [0, 5 * s], [-4 * s, 0]])); ctx.restore(); }
  ctx.restore();

function rect4(x, y, w, h) { ctx.moveTo(x, y); ctx.lineTo(x + w, y); ctx.lineTo(x + w, y + h); ctx.lineTo(x, y + h); ctx.closePath(); }

/* ---------- The Static ---------- */
function staticMob(kind, x, y, sc, t, seed, o) {
  GL = .3; try { _staticMob(kind, x, y, sc, t, seed, o); } finally { GL = 1; }

function _staticMob(kind, x, y, sc, t, seed, o) {
  o = o || {};

    mini: { c: '#d6c7ff', r: 10 }, leech: { c: '#8fffa0', r: 17 }, drone: { c: '#ff9ad2', r: 14 }, gate: { c: '#ffd26b', r: 18 },
    squeal: { c: '#ff6b6b', r: 17 }, mute: { c: '#9fb8ff', r: 17 }, rager: { c: '#ff8a3c', r: 15 }, boss: { c: '#ff4fa0', r: 40 }
  }[kind];
  const r = D.r * sc, c = D.c;
  const hop = Math.sin(t * 6 + seed) * 2 * sc;
  ctx.save(); ctx.translate(x, y + (kind === 'drone' ? Math.sin(t * 3 + seed) * 4 : hop));
  if (kind !== 'drone') glowDot(0, r * .9, r * 1.6, c, .12);
  const body = (ox, oy, rx, ry, col, a) => {
    ctx.beginPath(); const n = 26;
    for (let i = 0; i <= n; i++) {
      const an = i / n * TAU, rr = 1 + (i % 2 ? .13 : -.05) + .05 * Math.sin(t * 6 + i * 1.7 + seed);
      const px = ox + Math.cos(an) * rx * rr, py = oy + Math.sin(an) * ry * rr; if (i) ctx.lineTo(px, py); else ctx.moveTo(px, py);

    ctx.save(); ctx.translate(j * sc, 0); body(ox, oy, rx, ry); tube('#ff2bd6', 1.6, '#ff2bd6', .7); ctx.restore();
  };
  const fillG = (ry, oy) => lg(0, oy - ry, 0, oy + ry, [[0, '#5a5670'], [1, '#1b1a2a']]);

  if (kind === 'zip') { rx = r * .85; ry = r * 1.05; ctx.save(); for (let i = 1; i <= 3; i++) S(null, c, 1.6, () => { ctx.moveTo(-rx - 6 * i * sc, -4 * sc + i * 3 * sc); ctx.lineTo(-rx - 20 * i * sc, -4 * sc + i * 3 * sc); }, 1 - i * .25); ctx.restore(); }

    S('rgba(255,154,210,.25)', c, 1.8, () => ell(r * 1.15, -r * .6, r * .9, r * .28 * (.6 - .4 * fl)));

    S(null, '#18e6ff', 5, () => { ctx.arc(0, -r * .1, r * 1.2, Math.PI * 1.05, Math.PI * 1.95); });
    S('#2a0a3a', '#ff2bd6', 3, () => rrect(-r * 1.42, -r * .35, r * .36, r * .8, 6)); S('#2a0a3a', '#ff2bd6', 3, () => rrect(r * 1.06, -r * .35, r * .36, r * .8, 6));

  { const rr = rng(seed * 13 + 5); S(null, c, 1, () => { for (let i = 0; i < 5; i++) { const an = rr() * TAU, d = r * (.4 + rr() * .3); ctx.moveTo(Math.cos(an) * d, Math.sin(an) * d + r * .25); ctx.lineTo(Math.cos(an + .3) * (d + 5 * sc), Math.sin(an + .3) * (d + 5 * sc) + r * .25); } }, .5); }
  // kind specifics
  if (kind === 'brick') {
    S('#2a2540', c, 2.4, () => rrect(-r * .8, -r * .8, r * 1.6, r * .55, 3));
    S(null, c, 1.2, () => { ctx.moveTo(-r * .8, -r * .52); ctx.lineTo(r * .8, -r * .52); ctx.moveTo(-r * .2, -r * .8); ctx.lineTo(-r * .2, -r * .52); ctx.moveTo(r * .3, -r * .52); ctx.lineTo(r * .3, -r * .25); }, .9);
  }
  if (kind === 'gate') { S('rgba(255,210,107,.2)', c, 3, () => { ctx.arc(0, 0, r * 1.3, -2.2, -.9); ctx.arc(0, 0, r * 1.05, -.9, -2.2, true); ctx.closePath(); }); }
  if (kind === 'leech') { const k = (t * .8 + seed) % 1; S(null, c, 1.8, () => circ(0, -r * 1.2, r * (.5 + k * .7)), 1 - k); text('+', 0, -r * 1.05, 14 * sc, '#8fffa0', { glow: '#8fffa0' }); }

    const ex = k * r * .38, look = t * 2.6 + seed + ii;
    S('#ffffff', c, 1.6, () => circ(ex, ey, eyeR), .8);
    ctx.beginPath(); ctx.arc(ex + Math.cos(look) * eyeR * .38, ey + Math.sin(look) * eyeR * .38, eyeR * .5, 0, TAU); ctx.fillStyle = '#0b0618'; ctx.fill();
