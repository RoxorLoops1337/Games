<body><canvas id="c" width="1080" height="1920"></canvas>
<script>
const W=1080,H=1920,cv=document.getElementById('c');let c=cv.getContext('2d');
function fit(){const s=Math.min(innerWidth/W,innerHeight/H);cv.style.width=W*s+'px';cv.style.height=H*s+'px';cv.style.marginLeft=Math.max(0,(innerWidth-W*s)/2)+'px'}
addEventListener('resize',fit);fit();
const QT=new URLSearchParams(location.search).get('t');let T=0;
const PI=Math.PI,sin=Math.sin,cos=Math.cos;
function hx(h){h=h.replace('#','');return[parseInt(h.substr(0,2),16),parseInt(h.substr(2,2),16),parseInt(h.substr(4,2),16)]}
function mx(h,a){const r=hx(h),f=a>=0?255:0,k=Math.abs(a);return'#'+r.map(v=>('0'+Math.round(v+(f-v)*k).toString(16)).slice(-2)).join('')}
function RNG(s){s=(Math.abs(Math.floor(s))%2147483646)+1;return()=>(s=s*16807%2147483647)/2147483647}
function onto(ctx,fn){const o=c;c=ctx;fn();c=o}
/* ---------- thread textures ---------- */
const pc={};
function thread(col,ang=.6){const k=col+ang;if(pc[k])return pc[k];const t=document.createElement('canvas');t.width=5;t.height=5;const g=t.getContext('2d');
g.fillStyle=col;g.fillRect(0,0,5,5);g.fillStyle=mx(col,.34);g.fillRect(0,0,5,1);g.fillStyle=mx(col,.12);g.fillRect(0,1,5,1);g.fillStyle=mx(col,-.28);g.fillRect(0,3,5,1);
const p=c.createPattern(t,'repeat');p.setTransform(new DOMMatrix().rotate(ang*57.3));return pc[k]=p}
function feltPat(){if(pc.felt)return pc.felt;const t=document.createElement('canvas');t.width=t.height=96;const g=t.getContext('2d'),id=g.createImageData(96,96),r=RNG(5);
for(let i=0;i<96*96;i++){const v=r();id.data[i*4]=v>.5?255:0;id.data[i*4+1]=v>.5?255:0;id.data[i*4+2]=v>.5?255:0;id.data[i*4+3]=Math.abs(v-.5)*52}
g.putImageData(id,0,0);return pc.felt=c.createPattern(t,'repeat')}
function aidaPat(){if(pc.aida)return pc.aida;const t=document.createElement('canvas');t.width=t.height=10;const g=t.getContext('2d');
g.fillStyle='#ece0bf';g.fillRect(0,0,10,10);g.fillStyle='#d9c999';g.fillRect(0,0,10,1.4);g.fillRect(0,0,1.4,10);g.fillStyle='#f6edd2';g.fillRect(5,5,5,1);g.fillRect(5,5,1,5);
g.fillStyle='#8f7c4c';g.beginPath();g.arc(.2,.2,1.5,0,7);g.arc(10,10,1.5,0,7);g.arc(10,.2,1.5,0,7);g.arc(.2,10,1.5,0,7);g.fill();
return pc.aida=c.createPattern(t,'repeat')}
/* ---------- shapes ---------- */
function E(x,y,rx,ry,rot=0){rx=Math.max(.2,rx);ry=Math.max(.2,ry);const f=()=>c.ellipse(x,y,rx,ry,rot,0,7);f.b=[x,y,Math.max(rx,ry)+2];return f}
function R(x,y,w,h,r=8){r=Math.min(r,w/2,h/2);const f=()=>c.roundRect(x-w/2,y-h/2,w,h,r);f.b=[x,y,Math.hypot(w,h)/2+2];return f}
function PG(p){const f=()=>{c.moveTo(p[0][0],p[0][1]);for(let i=1;i<p.length;i++)c.lineTo(p[i][0],p[i][1]);c.closePath()};let sx=0,sy=0;p.forEach(q=>{sx+=q[0];sy+=q[1]});sx/=p.length;sy/=p.length;let r=0;p.forEach(q=>r=Math.max(r,Math.hypot(q[0]-sx,q[1]-sy)));f.b=[sx,sy,r+2];return f}
function SM(p){const f=()=>{const n=p.length,m=(a,b)=>[(a[0]+b[0])/2,(a[1]+b[1])/2];let s=m(p[n-1],p[0]);c.moveTo(s[0],s[1]);for(let i=0;i<n;i++){const e=m(p[i],p[(i+1)%n]);c.quadraticCurveTo(p[i][0],p[i][1],e[0],e[1])}c.closePath()};const g=PG(p);f.b=g.b;return f}
function starPts(x,y,ro,ri,n,rot=-PI/2){const p=[];for(let i=0;i<n*2;i++){const a=rot+i*PI/n,r=i%2?ri:ro;p.push([x+cos(a)*r,y+sin(a)*r])}return p}
function heartPts(x,y,s){const p=[];for(let i=0;i<30;i++){const t=i/30*2*PI;p.push([x+16*sin(t)**3*s/17,y-(13*cos(t)-5*cos(2*t)-2*cos(3*t)-cos(4*t))*s/17])}return p}
/* ---------- stitching primitives ---------- */
function fillS(sh,col,ang=.6,vol=1){c.beginPath();sh();c.fillStyle=thread(col,ang);c.fill();
c.save();c.beginPath();sh();c.clip();const[x,y,r]=sh.b;const g=c.createLinearGradient(x-r,y-r,x+r,y+r);
g.addColorStop(0,'rgba(255,255,255,'+.3*vol+')');g.addColorStop(.45,'rgba(255,255,255,0)');g.addColorStop(1,'rgba(10,0,40,'+.34*vol+')');c.fillStyle=g;c.fillRect(x-r,y-r,2*r,2*r);
if(r>9){const p=((T*.3+(x+y)*.0018)%2)-.5,bx=x-r*1.6+p*r*3.4;const g2=c.createLinearGradient(bx-r*.35,y-r*.35,bx+r*.35,y+r*.35);g2.addColorStop(0,'rgba(255,255,255,0)');g2.addColorStop(.5,'rgba(255,255,255,.26)');g2.addColorStop(1,'rgba(255,255,255,0)');c.fillStyle=g2;c.fillRect(x-r,y-r,2*r,2*r)}
c.restore()}
function mer(sh,col,w=5){c.save();c.lineJoin='round';c.lineCap='butt';c.beginPath();sh();c.strokeStyle=mx(col,-.55);c.lineWidth=w+2.4;c.stroke();c.strokeStyle=col;c.lineWidth=w;c.stroke();
c.setLineDash([1.2,1.6]);c.strokeStyle='rgba(255,255,255,.4)';c.lineWidth=w;c.stroke();c.lineDashOffset=1.4;c.strokeStyle='rgba(0,0,0,.3)';c.stroke();c.restore()}
function patch(sh,fill,bord,bw=5,ang=.6,iron){c.save();c.translate(2.5,4);c.beginPath();sh();c.fillStyle='rgba(0,0,0,.4)';c.strokeStyle='rgba(0,0,0,.4)';c.lineWidth=bw+3;c.lineJoin='round';c.fill();c.stroke();c.restore();
if(iron){c.save();c.beginPath();sh();c.lineWidth=bw+iron*2;c.lineJoin='round';c.strokeStyle='#efe6cf';c.stroke();c.restore()}
fillS(sh,fill,ang);mer(sh,bord,bw)}
function sl(pts,col,w=6,close){c.save();c.lineCap='round';c.lineJoin='round';c.beginPath();c.moveTo(pts[0][0],pts[0][1]);for(let i=1;i<pts.length;i++)c.lineTo(pts[i][0],pts[i][1]);if(close)c.closePath();
c.strokeStyle=mx(col,-.5);c.lineWidth=w+1.8;c.stroke();c.strokeStyle=col;c.lineWidth=w;c.stroke();c.globalAlpha=.5;c.strokeStyle=mx(col,.45);c.lineWidth=Math.max(1,w*.28);c.translate(-w*.14,-w*.16);c.stroke();c.restore()}
function arcPts(x,y,r,a0,a1,n=14){const p=[];for(let i=0;i<=n;i++){const a=a0+(a1-a0)*i/n;p.push([x+cos(a)*r,y+sin(a)*r])}return p}
function run(pts,col='#f3e6c8',w=2.4,d=[6,5]){c.save();c.lineCap='round';c.setLineDash(d);c.beginPath();c.moveTo(pts[0][0],pts[0][1]);for(let i=1;i<pts.length;i++)c.lineTo(pts[i][0],pts[i][1]);c.strokeStyle=col;c.lineWidth=w;c.stroke();c.restore()}
function txt(s,x,y,size,fill,bord,bw,al='center'){c.save();c.font='900 '+size+'px Impact,"Arial Black","DejaVu Sans",sans-serif';c.textAlign=al;c.textBaseline='middle';c.lineJoin='round';bw=bw??size*.22;
c.lineWidth=bw+3;c.strokeStyle=mx(bord,-.55);c.strokeText(s,x,y);c.lineWidth=bw;c.strokeStyle=bord;c.strokeText(s,x,y);c.setLineDash([1.2,1.6]);c.strokeStyle='rgba(255,255,255,.34)';c.strokeText(s,x,y);c.setLineDash([]);
c.fillStyle=thread(fill,.5);c.fillText(s,x,y);c.fillStyle='rgba(255,255,255,.12)';c.fillText(s,x-1,y-1);c.restore()}
function wlabel(x,y,w,h,s,size,bg,fg){c.save();c.translate(1.5,3);c.fillStyle='rgba(0,0,0,.35)';c.beginPath();R(x,y,w,h,5)();c.fill();c.restore();
fillS(R(x,y,w,h,5),bg,0,.5);c.save();c.beginPath();R(x,y,w-8,h-8,3)();c.strokeStyle=fg;c.globalAlpha=.55;c.setLineDash([3,3]);c.lineWidth=1.4;c.stroke();c.restore();
c.save();c.font='700 '+size+'px "DejaVu Sans",Arial,sans-serif';c.textAlign='center';c.textBaseline='middle';c.fillStyle=fg;c.fillText(s,x,y+1);c.restore()}
function spark(x,y,r,col,ph=0){const k=.7+.3*sin(T*3+ph);const p=starPts(x,y,r*k,r*.2*k,4);sl(p,col,2.2,true);c.beginPath();PG(p)();c.fillStyle=thread(col,.7);c.fill()}
function xst(list,col,sz,w=3){c.save();c.lineCap='round';c.strokeStyle=mx(col,-.4);c.lineWidth=w+1.2;c.beginPath();list.forEach(([x,y])=>{c.moveTo(x-sz/2,y-sz/2);c.lineTo(x+sz/2,y+sz/2)});c.stroke();
c.strokeStyle=col;c.lineWidth=w;c.stroke();c.strokeStyle=mx(col,-.15);c.lineWidth=w;c.beginPath();list.forEach(([x,y])=>{c.moveTo(x+sz/2,y-sz/2);c.lineTo(x-sz/2,y+sz/2)});c.stroke();
c.strokeStyle='rgba(255,255,255,.35)';c.lineWidth=1;c.beginPath();list.forEach(([x,y])=>{c.moveTo(x+sz/2-1,y-sz/2);c.lineTo(x-sz/2-1,y+sz/2)});c.stroke();c.restore()}
function kit(x,y,k){return{k,X:d=>x+d*k,Y:d=>y+d*k,e:(dx,dy,rx,ry,rot)=>E(x+dx*k,y+dy*k,rx*k,ry*k,rot||0),rr:(dx,dy,w,h,r)=>R(x+dx*k,y+dy*k,w*k,h*k,(r||6)*k),
pg:p=>PG(p.map(q=>[x+q[0]*k,y+q[1]*k])),sm:p=>SM(p.map(q=>[x+q[0]*k,y+q[1]*k])),ln:(p,col,w)=>sl(p.map(q=>[x+q[0]*k,y+q[1]*k]),col,Math.max(1.6,w*k)),
p:(sh,f,b,bw,ang)=>patch(sh,f,b,Math.max(2,(bw==null?3:bw)*k),ang),run:(p,col,w,d)=>run(p.map(q=>[x+q[0]*k,y+q[1]*k]),col,Math.max(1.4,w*k),d)}}
function rot(p,a){const co=cos(a),si=sin(a);return p.map(q=>[q[0]*co-q[1]*si,q[0]*si+q[1]*co])}
/* ---------- static layers ---------- */
const BG=document.createElement('canvas');BG.width=W;BG.height=H;
const PP=[[70,434],[912,434],[912,682],[168,682],[168,930],[990,930]];let PL=[0];for(let i=1;i<PP.length;i++)PL.push(PL[i-1]+Math.hypot(PP[i][0]-PP[i-1][0],PP[i][1]-PP[i-1][1]));const PT=PL[PL.length-1];
function pathAt(s){s=Math.max(0,Math.min(PT-.01,s));let i=1;while(PL[i]<s)i++;const f=(s-PL[i-1])/(PL[i]-PL[i-1]),a=PP[i-1],b=PP[i];return[a[0]+(b[0]-a[0])*f,a[1]+(b[1]-a[1])*f,Math.atan2(b[1]-a[1],b[0]-a[0])]}
const OX=106,OY=372,CS=124;const cx=col=>OX+CS/2+CS*col,cy=row=>OY+CS/2+CS*row;
const PADS=[[0,1],[1,1],[2,1],[3,1],[4,1],[5,1],[1,3],[2,3],[3,3],[4,3],[5,3],[6,3]];
function buildBG(){const g=BG.getContext('2d');onto(g,()=>{
/* denim */
c.fillStyle='#2f4f86';c.fillRect(0,0,W,H);
c.lineWidth=1.6;for(let i=-H;i<W;i+=3){c.strokeStyle=(i/3)%2?'rgba(255,255,255,.06)':'rgba(0,0,30,.10)';c.beginPath();c.moveTo(i,0);c.lineTo(i+H,H);c.stroke()}
c.lineWidth=1;for(let i=0;i<H;i+=6){c.strokeStyle='rgba(120,170,255,.045)';c.beginPath();c.moveTo(0,i);c.lineTo(W,i);c.stroke()}
const r=RNG(77);for(let i=0;i<9000;i++){const x=r()*W,y=r()*H,v=r();c.fillStyle=v>.55?'rgba(210,225,255,.2)':'rgba(10,20,60,.18)';c.fillRect(x,y,1+r()*2,1)}
for(let i=0;i<7;i++){const x=r()*W,y=r()*H,gr=c.createRadialGradient(x,y,0,x,y,260);gr.addColorStop(0,'rgba(140,180,240,.13)');gr.addColorStop(1,'rgba(140,180,240,0)');c.fillStyle=gr;c.fillRect(x-260,y-260,520,520)}
const vg=c.createRadialGradient(540,960,500,540,960,1250);vg.addColorStop(0,'rgba(0,0,0,0)');vg.addColorStop(1,'rgba(5,10,40,.45)');c.fillStyle=vg;c.fillRect(0,0,W,H);
/* jacket seams (topstitch) */
[[22,0,22,H],[1058,0,1058,H],[0,1290,W,1290]].forEach(s=>{c.beginPath();c.moveTo(s[0],s[1]);c.lineTo(s[2],s[3]);c.strokeStyle='rgba(0,0,0,.35)';c.lineWidth=8;c.stroke();
[-5,5].forEach(o=>{run(s[0]==s[2]?[[s[0]+o,s[1]],[s[2]+o,s[3]]]:[[s[0],s[1]+o],[s[2],s[3]+o]],'#e8b84a',2.6,[9,6])})});
/* phone shell + felt screen */
const scr=R(540,653,1004,1234,76);
c.save();c.translate(0,8);c.beginPath();R(540,653,1018,1250,84)();c.fillStyle='rgba(0,0,0,.45)';c.fill();c.restore();
patch(R(540,653,1018,1250,84),'#1d1830','#0e0b1a',10,.3);
c.beginPath();R(540,653,1004,1234,76)();const sg=c.createLinearGradient(0,40,0,1270);sg.addColorStop(0,'#150b36');sg.addColorStop(.28,'#3b2370');sg.addColorStop(.3,'#241548');sg.addColorStop(1,'#1c1038');c.fillStyle=sg;c.fill();
c.save();c.beginPath();R(540,653,1004,1234,76)();c.clip();
/* backdrop: stars, moon, skyline */
const q=RNG(9);const st=[];for(let i=0;i<46;i++)st.push([60+q()*960,50+q()*210]);xst(st.slice(0,23),'#f3e6c8',7,1.8);xst(st.slice(23),'#ffd54a',6,1.8);
patch(E(870,170,34,34),'#f6ecd0','#c9b88f',4);xst([[858,160],[880,178],[866,184]],'#d7c9a3',8,2);
const bl=[[60,170,80,150],[150,140,70,180],[230,190,70,130],[760,150,80,170],[850,185,70,135],[930,135,80,190],[320,205,55,120],[680,200,60,125]];
bl.forEach((b,i)=>{patch(R(b[0]+b[2]/2,330-b[3]/2,b[2],b[3],6),['#2a1a55','#35206b'][i%2],'#4d3a8c',3,.2);
const w=[];for(let yy=330-b[3]+14;yy<318;yy+=18)for(let xx=b[0]+12;xx<b[0]+b[2]-8;xx+=16)if(q()>.45)w.push([xx,yy]);xst(w,i%3?'#ffd54a':'#ff8fc8',7,1.8)});
c.restore();
/* stage deck */
patch(R(540,336,920,40,12),'#7b4a2a','#e0a43a',6,0);for(let i=0;i<8;i++)run([[120+i*115,322],[120+i*115,352]],'rgba(40,20,10,.5)',2,[4,3]);
patch(R(540,358,940,18,8),'#c8344c','#ffd54a',4,0);
/* truss */
patch(R(540,132,880,16,7),'#8a90a4','#d6dbe8',3,0);for(let i=0;i<22;i++)run([[110+i*40,126],[130+i*40,138]],'#d6dbe8',1.6,[3,2]);
/* board sampler */
const frame=R(540,682,950,664,34);
patch(frame,'#e7d9b4','#e8b84a',9,.2,5);c.beginPath();R(540,682,934,648,26)();c.fillStyle=aidaPat();c.fill();
c.save();c.beginPath();R(540,682,934,648,26)();c.clip();const sh=c.createLinearGradient(0,350,0,1010);sh.addColorStop(0,'rgba(80,50,120,.22)');sh.addColorStop(.12,'rgba(80,50,120,0)');c.fillStyle=sh;c.fillRect(60,350,960,660);c.restore();
/* border ring cross-stitch */
const ring=[],sz=10,x0=79,x1=1001,y0=364,y1=1000;for(let x=x0;x<=x1;x+=sz){ring.push([x,y0]);ring.push([x,y1])}for(let y=y0+sz;y<y1;y+=sz){ring.push([x0,y]);ring.push([x1,y])}

bucket.forEach((b,i)=>xst(b,cols[i],8,2.6));

/* woven tape path */
c.save();c.lineJoin='round';c.lineCap='butt';const path=()=>{c.beginPath();c.moveTo(PP[0][0],PP[0][1]);for(let i=1;i<PP.length;i++)c.lineTo(PP[i][0],PP[i][1])};
path();c.translate(2,4);c.strokeStyle='rgba(0,0,0,.35)';c.lineWidth=82;c.stroke();c.translate(-2,-4);
path();c.strokeStyle='#2b1750';c.lineWidth=80;c.stroke();c.setLineDash([1.2,1.6]);c.strokeStyle='rgba(255,255,255,.4)';c.stroke();c.setLineDash([]);
path();c.strokeStyle=thread('#c9a468',0);c.lineWidth=70;c.stroke();path();c.strokeStyle='rgba(60,25,10,.18)';c.lineWidth=70;c.setLineDash([2,4]);c.stroke();c.setLineDash([]);
path();c.strokeStyle='#ff8a2a';c.lineWidth=3;c.setLineDash([12,10]);c.stroke();c.restore();
for(let s=70;s<PT-60;s+=130){const[x,y,an]=pathAt(s);const ch=rot([[-8,-11],[6,0],[-8,11]],an).map(p=>[x+p[0],y+p[1]]);sl(ch,'#7a3a12',3.5)}
/* gate + base */

patch(E(996,930,32,32),'#ff5fb0','#ffd54a',5);fillS(PG(heartPts(996,929,40)),'#fff0f8',.5);
});}
/* ---------- characters ---------- */
function hero(who,x,y,s,t){const K=kit(x,y,s),sw=sin(t*2.4+(who=='r'?0:1.7)),bob=Math.abs(sw)*3*s;y-=bob;K.k;const k=kit(x,y,s);
const OL='#16101f',bw=3.4;c.save();c.beginPath();E(x,y+bob+2*s,48*s,9*s)();c.fillStyle='rgba(0,0,0,.35)';c.fill();c.restore();
const sk=who=='r'?'#f1c7a1':'#e6ab82',skb=who=='r'?'#b57a52':'#a8683f';const arm=sin(t*4+(who=='r'?0:2))*4;
if(who=='r'){
/* legs and sneakers */
k.p(k.rr(-13,-36,25,62,9),'#6b7a33','#3d4a18',bw);k.p(k.rr(13,-36,25,62,9),'#6b7a33','#3d4a18',bw);k.run([[-13,-58],[-13,-14]],'#9aab52',1.8,[4,3]);k.run([[13,-58],[13,-14]],'#9aab52',1.8,[4,3]);

[-22,-14].forEach(o=>k.ln([[o,-10],[o+5,-7]],'#ffffff',1.8));[12,20].forEach(o=>k.ln([[o,-10],[o+5,-7]],'#ffffff',1.8));
