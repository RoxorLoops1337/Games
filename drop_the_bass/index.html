<body>
<canvas id="game" tabindex="0" aria-label="Drop the Bass game canvas"></canvas>
<div id="ui"></div>
<div id="boot" role="status"><b>DROP THE BASS</b><i></i><small id="bootmsg">Tuning the speakers...</small></div>
<noscript><div class="noscript">Drop the Bass needs JavaScript. Loopy is very sorry.</div></noscript>
<script>
  setTimeout(function () {
    if (window.__dtbReady) return;
    var m = document.getElementById('bootmsg');
    if (m) m.textContent = window.__dtbError ? 'Something went wrong starting the game. Reload the page. Your save is safe.' : 'Still loading. If nothing happens, your browser may be too old. Try a recent Chrome, Safari or Firefox.';
  }, 6000);
</script>
<script type="module" src="js/main.js"></script>
