<!doctype html>
<meta charset="utf-8">
<title>Drop the Bass: enemy art lab (AAA pass)</title>
<style>html,body{margin:0;background:#1a1236;color:#fff6ea;font:12px sans-serif}canvas{display:block}</style>
<canvas id="c"></canvas>
<script type="module">
import * as A from '../js/art_enemies.js';
import { ENEMIES, BOSSES, AFFIXES } from '../js/data_core.js';
const q = new URLSearchParams(location.search);
const sheet = q.get('sheet') || 'enemies', T = parseFloat(q.get('t') || '1.3'), Z = parseFloat(q.get('z') || '2');
const dpr = 2;
A.setArtScale(Z * dpr);
const cv = document.getElementById('c');
const W = 1100, H = sheet === 'bosses' ? 820 : sheet === 'enemies' ? 700 : 820;
cv.width = W * dpr; cv.height = H * dpr; cv.style.width = W + 'px';
const c = cv.getContext('2d'); c.scale(dpr, dpr);
c.fillStyle = q.get('bg') || '#2a1c5a'; c.fillRect(0, 0, W, H);
const g = c.createLinearGradient(0, 0, 0, H); g.addColorStop(0, '#2d1d63'); g.addColorStop(1, '#1b1040'); c.fillStyle = g; c.fillRect(0, 0, W, H);
c.fillStyle = '#fff6ea'; c.font = '12px sans-serif'; c.textAlign = 'center';
const label = (s, x, y) => { c.fillStyle = '#fff6ea'; c.fillText(s, x, y); };
c.save(); c.scale(Z, Z); const S = (x) => x / Z;
if (sheet === 'enemies') {
  Object.keys(ENEMIES).forEach((id, i) => { const x = 50 + (i % 6) * 80, y = 55 + Math.floor(i / 6) * 100; A.drawEnemy(c, id, x, y, { t: T, ang: 0.5, hp: i % 3 === 0 ? 0.6 : 1, shield: id === 'gate' ? 0.7 : 0 }); });
  c.restore();
  Object.keys(ENEMIES).forEach((id, i) => label(id, (50 + (i % 6) * 80) * Z, (55 + Math.floor(i / 6) * 100) * Z + 52 * Z * 0.6));
} else if (sheet === 'status') {
  const affs = Object.keys(AFFIXES);
  affs.forEach((a, i) => A.drawEnemy(c, 'fuzz', 50 + i * 90, 50, { t: T, ang: 0.3, affix: a, scale: AFFIXES[a].scale || 1 }));
  ['slow', 'stun', 'burn', 'mark', 'rage', 'hit'].forEach((s, i) => A.drawEnemy(c, 'rager', 50 + i * 90, 150, { t: T, ang: 0.3, [s]: s === 'hit' ? 0.8 : true, hp: 0.4 }));
  A.drawEnemy(c, 'gate', 50, 250, { t: T, ang: 0.3, shield: 1 }); A.drawEnemy(c, 'brick', 140, 250, { t: T, affix: 'armored' }); A.drawEnemy(c, 'zip', 230, 250, { t: T, ang: 0.4, affix: 'swift' });
  A.drawEnemy(c, 'brick', 320, 250, { t: T, affix: 'golden' }); A.drawEnemy(c, 'echo', 410, 250, { t: T }); A.drawEnemy(c, 'drone', 500, 250, { t: T, ang: 0.2 });
  c.restore();
} else {
  Object.keys(BOSSES).forEach((id, i) => { A.drawBoss(c, id, 70 + i * 100, 100, { t: T, ang: 0.4, hp: 0.7, phase: 2, gated: i === 1 }); A.drawBoss(c, id, 70 + i * 100, 290, { t: T + 1.7, ang: 0.4, hp: 1, phase: 3, gated: false, hit: i === 0 ? 0.7 : 0 }); });
  c.restore();
}
window.__ready = true;
</script>
