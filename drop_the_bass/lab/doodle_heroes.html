<!doctype html>
<meta charset="utf-8"><title>doodle_heroes lab</title>
<style>body{margin:0;background:#222;color:#eee;font:12px sans-serif}canvas{display:block}</style>
<canvas id="c"></canvas>
<script type="module">
import * as A from '../js/doodle_heroes.js';
import { paper } from '../js/doodle_kit.js';
// ?w=1100&h=900&what=sheet | big:<pose> | onesie:<pose> | busts | loopy | logo &t=1.3&size=300&scale=2
const q = new URLSearchParams(location.search);
const W = +q.get('w') || 1100, H = +q.get('h') || 900, what = q.get('what') || 'sheet', t = +q.get('t') || 1.3;
A.setArtScale(+q.get('scale') || 2);
const c = document.getElementById('c'); c.width = W; c.height = H; const ctx = c.getContext('2d');
paper(ctx, 0, 0, W, H, {});
const [kind, a] = what.split(':');
if (kind === 'big') {
  const sz = +q.get('size') || 560;
  ['roxor', 'jasmin'].forEach((who, i) => A.drawHero(ctx, who, W * (0.28 + i * 0.44), H - 30, sz, { t, pose: a || 'idle', talk: q.get('talk') === '1' }));
} else if (kind === 'onesie') {
  const sz = +q.get('size') || 560;
  ['roxor', 'jasmin'].forEach((who, i) => A.drawHero(ctx, who, W * (0.28 + i * 0.44), H - 30, sz, { t, pose: a || 'cheer', outfit: 'onesie' }));
} else if (kind === 'busts') {
  ['roxor', 'jasmin'].forEach((w, r) => ['default', 'onesie'].forEach((oc, i) => ['talk', 'sad'].forEach((ps, k) => A.drawBust(ctx, w, 100 + (r * 4 + i * 2 + k) * 130, 120, 180, { t, outfit: oc, pose: ps, talk: ps === 'talk' }))));
  [30, 60, 100].forEach((s, i) => A.drawBust(ctx, 'jasmin', 100 + i * 130, 330, s, { t }));
} else if (kind === 'loopy') {
  ['happy', 'worried', 'excited', 'sleepy'].forEach((m, i) => A.drawLoopy(ctx, 150 + i * 260, 220, 220, { t, mood: m, talk: i === 2 }));
  [40, 80].forEach((s, i) => A.drawLoopy(ctx, 100 + i * 120, 520, s, { t }));
} else if (kind === 'logo') {
  A.drawLogo(ctx, W / 2, H / 2, +q.get('lw') || 900, t);
} else {
  const poses = ['idle', 'cheer', 'sing', 'beat', 'sad', 'shock', 'talk', 'point', 'hype'];
  poses.forEach((ps, i) => { const x = 90 + (i % 3) * 340, y = 270 + Math.floor(i / 3) * 280; A.drawHero(ctx, 'roxor', x, y, 220, { t, pose: ps }); A.drawHero(ctx, 'jasmin', x + 130, y, 214, { t, pose: ps, talk: ps === 'talk' }); ctx.fillStyle = '#2b2733'; ctx.font = '14px sans-serif'; ctx.fillText(ps, x - 50, y - 210); });
}
</script>
