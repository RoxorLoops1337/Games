<!doctype html>
<meta charset="utf-8"><title>art_world lab</title>
<style>body{margin:0;background:#222;color:#eee;font:12px sans-serif}canvas{display:block}</style>
<canvas id="c"></canvas>
<script type="module">
import * as A from '../js/art_world.js';
// ?w=540&h=960&what=scene:garage_day | backdrop:club | board:garage:garage | heroes | busts | logo | title | stage | loopy&t=2&p=0.5&static=0
const q = new URLSearchParams(location.search);
const W = +q.get('w') || 540, H = +q.get('h') || 960, what = q.get('what') || 'heroes', t = +q.get('t') || 1.3, p = q.has('p') ? +q.get('p') : 0.5;
const c = document.getElementById('c'); c.width = W; c.height = H; const ctx = c.getContext('2d');
ctx.fillStyle = '#2a1c4a'; ctx.fillRect(0, 0, W, H);
const [kind, a, b] = what.split(':');
if (kind === 'scene') A.drawScene(ctx, a, W, H, t, { progress: p });
else if (kind === 'backdrop') A.drawBackdrop(ctx, a, W, H, t, { beat: 0.5, staticAmt: +q.get('static') || 0 });
else if (kind === 'title') { A.drawTitle(ctx, W, H, t, {}); A.drawLogo(ctx, W / 2, 190, 440, t); }
else if (kind === 'board') { const WD = { garage: 'garage', busk: 'busk', club: 'club', festival: 'festival', arena: 'arena' }; A.drawBackdrop(ctx, b || a, W, H, t, {}); A.drawBoard(ctx, a, b || a, t, { beat: 0.3, slotHint: [[0, 0]], hoverSlot: [2, 2], dropSlot: [4, 4] }); }
else if (kind === 'logo') { A.drawBackdrop(ctx, 'title', W, H, t, {}); A.drawLogo(ctx, W / 2, H / 2, 460, t); }
else if (kind === 'loopy') { ['happy', 'worried', 'excited', 'sleepy'].forEach((m, i) => A.drawLoopy(ctx, 90 + i * 120, 120, 100, { t, mood: m, talk: i === 2 })); }
else if (kind === 'stage') { A.drawBackdrop(ctx, a || 'garage', W, H, t, {}); [1, 0.5, 0.2].forEach((hp, i) => A.drawStageBase(ctx, a || 'garage', 90 + i * 180, 120, { t, hp, hit: i === 1 ? 0.6 : 0 })); }
else if (kind === 'busts') { ['roxor', 'jasmin'].forEach((w, r) => ['default', 'onesie'].forEach((oc, i) => A.drawBust(ctx, w, 70 + (r * 2 + i) * 128, 90, 120, { t, outfit: oc, pose: 'talk', talk: true }))); }
else { // heroes sheet
  const poses = ['idle', 'cheer', 'sing', 'beat', 'sad', 'shock', 'talk', 'point', 'hype'];
  ctx.fillStyle = '#3a2a6a'; ctx.fillRect(0, 0, W, H);
  poses.forEach((ps, i) => { const x = 50 + (i % 3) * 180, y = 150 + Math.floor(i / 3) * 170; A.drawHero(ctx, 'roxor', x, y, 140, { t, pose: ps }); A.drawHero(ctx, 'jasmin', x + 70, y, 136, { t, pose: ps }); });
  ['default', 'onesie'].forEach((oc, i) => { A.drawHero(ctx, 'roxor', 70 + i * 260, 780, 280, { t, pose: 'cheer', outfit: oc }); A.drawHero(ctx, 'jasmin', 170 + i * 260, 780, 270, { t, pose: 'sing', outfit: oc }); });
}
window.__done = true;
</script>
