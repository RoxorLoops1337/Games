<!doctype html>
<meta charset="utf-8"><title>art_env lab</title>
<style>body{margin:0;background:#222;color:#eee;font:12px sans-serif}canvas{display:block}</style>
<canvas id="c"></canvas>
<script type="module">
import * as A from '../js/art_env.js';
// ?w=540&h=960&what=backdrop:club | battle:garage (backdrop + board + stage, as in the game) | stage:garage | sheet&t=2&static=0&beat=0.3
const q = new URLSearchParams(location.search);
const W = +q.get('w') || 540, H = +q.get('h') || 960, what = q.get('what') || 'sheet', t = +q.get('t') || 1.3, st = +q.get('static') || 0, beat = q.has('beat') ? +q.get('beat') : 0.4;
const c = document.getElementById('c'); c.width = W; c.height = H; const ctx = c.getContext('2d');
const MAPS = { garage: 'garage', busk: 'busk', club: 'club', festival: 'festival', arena: 'arena' };
const [kind, a] = what.split(':');
function battle(id) {
  A.drawBackdrop(ctx, id, W, H, t, { beat, staticAmt: st });
  const s = Math.min(W / 540, H / 960); ctx.save(); ctx.translate((W - 540 * s) / 2, (H - 960 * s) / 2); ctx.scale(s, s);
  A.drawBoard(ctx, MAPS[id], id, t, { beat, slotHint: [[0, 0]], hoverSlot: [2, 2], dropSlot: [4, 4] });
  const b = { garage: [6, 9], busk: [2, 4], club: [5, 9], festival: [5, 9], arena: [3, 9] }[id];
  A.drawStageBase(ctx, id, 18 + b[0] * 72 + 36, 120 + b[1] * 72 + 36, { t, hp: +q.get('hp') || 1, hit: +q.get('hit') || 0, beat });
  ctx.restore();
}
if (kind === 'backdrop') A.drawBackdrop(ctx, a, W, H, t, { beat, staticAmt: st });
else if (kind === 'battle') battle(a);
else if (kind === 'stage') { A.drawBackdrop(ctx, a || 'garage', W, H, t, {}); [1, 0.5, 0.2].forEach((hp, i) => A.drawStageBase(ctx, a || 'garage', 90 + i * 180, 120, { t, hp, hit: i === 1 ? 0.6 : 0, beat })); }
window.__done = true;
</script>
