<!doctype html>
<meta charset="utf-8"><title>doodle_env lab</title>
<style>body{margin:0;background:#222;color:#eee;font:12px sans-serif}canvas{display:block}</style>
<canvas id="c"></canvas>
<script type="module">
import * as A from '../js/art_world.js';
import { setStyle } from '../js/style.js';
setStyle('doodle');
// ?what=backdrop:garage | board:garage | stage:garage | sheet   &w=540&h=960&t=1.3&static=0&beat=0.4
const q = new URLSearchParams(location.search);
const what = q.get('what') || 'sheet', t = +q.get('t') || 1.3, beat = q.has('beat') ? +q.get('beat') : 0.4, st = +q.get('static') || 0;
const MAPS = { garage: 'garage', busk: 'busk', club: 'club', festival: 'festival', arena: 'arena' };
const [kind, a] = what.split(':');
const W = +q.get('w') || (kind === 'sheet' ? 1600 : 540), H = +q.get('h') || (kind === 'sheet' ? 1000 : 960);
const c = document.getElementById('c'); c.width = W; c.height = H; const ctx = c.getContext('2d');
ctx.fillStyle = '#2a1c4a'; ctx.fillRect(0, 0, W, H);
function board(id, x, y, s) {
  ctx.save(); ctx.translate(x, y); ctx.scale(s, s); ctx.translate(-0, -0);
  A.drawBackdrop(ctx, id, 540, 960, t, { beat, staticAmt: st });
  A.drawBoard(ctx, MAPS[id], id, t, { beat, slotHint: [[2, 2]], hoverSlot: [3, 2], dropSlot: [4, 4] });
  A.drawStageBase(ctx, id, 342, 756, { t, hp: 1, beat });
  ctx.restore();
}
if (kind === 'backdrop') A.drawBackdrop(ctx, a, W, H, t, { beat, staticAmt: st });
else if (kind === 'board') board(a || 'garage', 0, 0, 1);
else if (kind === 'stage') {
  A.drawBackdrop(ctx, a || 'garage', W, H, t, {});
  [[1, 0], [0.6, 0], [0.4, 0.5], [0.2, 0]].forEach(([hp, hit], i) => A.drawStageBase(ctx, a || 'garage', 90 + (i % 2) * 220, 200 + Math.floor(i / 2) * 200, { t, hp, hit, beat }));
} else {
  const ids = ['title', 'hub', 'garage', 'busk', 'club', 'festival', 'arena'];
  ids.forEach((id, i) => { ctx.save(); ctx.translate(10 + i * 224, 10); ctx.scale(0.4, 0.4); ctx.beginPath(); ctx.rect(0, 0, 540, 960); ctx.clip(); A.drawBackdrop(ctx, id, 540, 960, t, { beat }); ctx.restore(); });
  ['garage', 'busk', 'club', 'festival', 'arena'].forEach((id, i) => { board(id, 10 + i * 316, 410, 0.58); });
}
window.__done = true;
</script>
