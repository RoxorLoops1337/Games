<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Drop the Bass Stats</title>
<style>
@font-face{font-family:"Patrick Hand";font-weight:400;font-display:swap;src:url(fonts/PatrickHand-latin.woff2) format("woff2")}
:root{--paper:#fbf6e6;--ink:#2b2733;--pink:#ff5fb0;--green:#9dff3a}
body{margin:0;padding:16px;background:var(--paper);color:var(--ink);font:20px/1.3 "Patrick Hand",system-ui,sans-serif}
main{max-width:860px;margin:0 auto}
h1{margin:0 0 4px;font-size:34px;transform:rotate(-1deg)}
h2{margin:28px 0 8px;font-size:26px;display:inline-block;border-bottom:5px solid var(--pink);transform:rotate(-.6deg)}
p.note{margin:4px 0 12px;opacity:.75}
table{border-collapse:separate;border-spacing:0;width:100%;border:3px solid var(--ink);border-radius:14px;background:#fff;overflow:hidden;margin-bottom:8px}
th,td{padding:6px 10px;text-align:left;border-bottom:2px dashed #cfc7b0}
th{background:var(--green);border-bottom:3px solid var(--ink)}
tr:last-child td{border-bottom:0}
td.n{text-align:right;font-variant-numeric:tabular-nums}
.bar{display:inline-block;height:10px;border:2px solid var(--ink);border-radius:6px;background:var(--pink);vertical-align:middle}
label{margin-right:10px}select{font:inherit;border:3px solid var(--ink);border-radius:10px;background:#fff;padding:2px 8px}
#msg{margin:12px 0;font-size:22px}
</style>
</head>
<body>
<main>
<h1>Drop the Bass: player stats</h1>
<p class="note">Anonymous aggregates only. No names, no ids, no IP addresses are stored.</p>
<label>Days <select id="days"><option>7</option><option selected>30</option><option>90</option></select></label>
<div id="msg" role="status">Loading...</div>
<div id="out"></div>
</main>
<script>
(function () {
  var out = document.getElementById('out'), msg = document.getElementById('msg'), sel = document.getElementById('days');
  function el(tag, text, cls) { var e = document.createElement(tag); if (text !== undefined) e.textContent = String(text); if (cls) e.className = cls; return e; }
  function table(head, rows) {
    var t = el('table'), th = el('tr'); head.forEach(function (h) { th.appendChild(el('th', h)); }); t.appendChild(th);
    rows.forEach(function (r) { var tr = el('tr'); r.forEach(function (c, i) { var td = el('td', c && c.bar !== undefined ? '' : c, i ? 'n' : ''); if (c && c.bar !== undefined) { var b = el('span', '', 'bar'); b.style.width = Math.round(c.bar * 100) + 'px'; td.appendChild(b); td.appendChild(document.createTextNode(' ' + c.text)); } tr.appendChild(td); }); t.appendChild(tr); });
    return t;
  }
  var pct = function (x) { return Math.round(x * 100) + '%'; };
  function section(title, node) { out.appendChild(el('h2', title)); out.appendChild(node); }
  function render(d) {
    out.replaceChildren();
    msg.textContent = d.runs + ' runs, ' + d.from + ' to ' + d.to + ', average ' + d.avgSeconds + ' s, ' + d.avgLeaks + ' leaks per run';
    var rows = [];
    Object.keys(d.byWorld).forEach(function (w) { Object.keys(d.byWorld[w]).forEach(function (df) { var r = d.byWorld[w][df]; rows.push([w + ' / ' + df, r.runs, { bar: r.winRate, text: pct(r.winRate) }, r.avgWave]); }); });
    section('Win rate per world and difficulty', table(['World / difficulty', 'Runs', 'Win rate', 'Avg wave'], rows));
    section('Turrets (in the top 3 of a loadout)', table(['Turret', 'Runs', 'Win rate', 'Picks'], d.turrets.map(function (t) { return [t.id, t.runs, { bar: t.winRate, text: pct(t.winRate) }, t.picks]; })));
    var lr = Object.keys(d.leakLane).map(function (w) { var l = d.leakLane[w]; return [w, l.top === null ? '-' : 'lane ' + (l.top + 1), JSON.stringify(l.lanes)]; });
    section('Most common leak lane', table(['World', 'Top lane', 'Counts'], lr));
    section('Top remix cards', table(['Card', 'Runs'], d.topBranches.map(function (b) { return [b.id, b.count]; })));
    section('Modes', table(['Mode', 'Runs'], Object.keys(d.modes).map(function (m) { return [m, d.modes[m]]; })));
  }
  function load() {
    msg.textContent = 'Loading...';
    fetch('/api/dropbass_stats?days=' + sel.value).then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); }).then(render).catch(function (e) { out.replaceChildren(); msg.textContent = 'Could not load stats (' + e.message + ').'; });
  }
  sel.addEventListener('change', load); load();
})();
</script>
</body>
</html>
