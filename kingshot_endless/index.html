{ // every label gets the warm Hocus Vocus outline

    const fs = this.fillStyle; let dark = lumc.get(fs);
    if (dark === undefined && typeof fs === 'string') { const m = /^#([0-9a-f]{6})$/i.exec(fs) || null, r = /^rgba?\((\d+),(\d+),(\d+)/.exec(fs); const v = m ? [parseInt(m[1].slice(0, 2), 16), parseInt(m[1].slice(2, 4), 16), parseInt(m[1].slice(4), 16)] : r ? [+r[1], +r[2], +r[3]] : null; dark = v ? (v[0] * 0.3 + v[1] * 0.59 + v[2] * 0.11) < 105 : false; lumc.set(fs, dark); }
    if (dark) return ft.call(this, t, x, y, mw);
    this.save(); this.lineJoin = 'round'; this.strokeStyle = 'rgba(45,23,15,0.85)'; this.lineWidth = Math.max(2, sz * 0.2); this.strokeText(t, x, y); this.restore();
    ft.call(this, t, x, y, mw);
  };
} // let: temporarily swapped to offscreen canvases for sprite caching

function comboMul() { for (const t of COMBO_TIERS) if (S.combo >= t[0]) return t[1]; return 1; }
function comboTier() { for (let i = 0; i < COMBO_TIERS.length; i++) if (S.combo >= COMBO_TIERS[i][0]) return COMBO_TIERS.length - i; return 0; }
function comboColor() { for (const t of COMBO_TIERS) if (S.combo >= t[0]) return t[2]; return '#e6dcff'; }
// escalating streak payouts fired once per streak when you cross the count
const COMBO_REWARDS = [
  { at: 25,  label: '🔥 SPREE',        fx: () => { S.frenzyT = Math.max(S.frenzyT, 4);  comboCoins(0.6); } },
  { at: 50,  label: '💥 RAMPAGE',      fx: () => { S.goldRushT = Math.max(S.goldRushT, 6); comboCoins(1.2); } },
  { at: 100, label: '⚡ UNSTOPPABLE',  fx: () => { S.frenzyT = Math.max(S.frenzyT, 8);  S.gems += 2; S.stats.gemsFound = (S.stats.gemsFound || 0) + 2; comboCoins(2.5); } },

];

// ---- hero XP + roguelite level-up upgrade draft --------------
function pk(id) { return (S.perks && S.perks[id]) || 0; }
function perkCount() { let n = 0; for (const k in (S.perks || {})) n += S.perks[k]; return n; }
function xpNeed(lvl) { return Math.ceil(18 * Math.pow(1.28, lvl - 1)); }
// upgrade cards — mostly stackable perks; each pick is a permanent run buff (reset on prestige)
const CARDS = [
  { id: 'dmg',     ic: '⚔️', name: 'Sharper Arrows', d: '+18% damage', max: 99 },
  { id: 'rate',    ic: '🏹', name: 'Quickdraw',      d: '+10% fire rate', max: 99 },
  { id: 'multi',   ic: '🎯', name: 'Multishot',      d: '+1 arrow per volley', max: 8 },
  { id: 'crit',    ic: '💥', name: 'Deadeye',        d: '+6% crit chance', max: 12 },
  { id: 'critdmg', ic: '🩸', name: 'Brutality',      d: '+60% crit damage', max: 12 },
  { id: 'range',   ic: '📡', name: 'Eagle Eye',      d: '+12% range', max: 10 },
  { id: 'velocity',ic: '💨', name: 'Swift Shafts',   d: '+18% arrow speed', max: 10 },
  { id: 'speed',   ic: '👟', name: 'Fleet Foot',     d: '+9% move speed', max: 12 },
  { id: 'hp',      ic: '❤️', name: 'Toughness',      d: '+30 max HP', max: 99 },

  { id: 'nimble',  ic: '🌀', name: 'Nimble',         d: '−0.3s dash cooldown', max: 8 },
  { id: 'magnet',  ic: '🧲', name: 'Magnetism',      d: '+20% pickup range', max: 10 },
  { id: 'coin',    ic: '🪙', name: 'Greed',          d: '+12% coin value', max: 20 },
  { id: 'combow',  ic: '🔥', name: 'Momentum',       d: '+0.4s combo window', max: 8 },
  { id: 'scholar', ic: '📖', name: 'Fast Learner',   d: '+15% XP gained', max: 12 },
  { id: 'thorns',  ic: '🛡️', name: 'Thornmail',      d: 'Reflect damage when hit', max: 8 },
  { id: 'luck',    ic: '🍀', name: 'Fortune',        d: '+1.5% golden-foe chance', max: 6 },
  { id: 'cap',     ic: '🎒', name: 'Deep Pockets',   d: '+2 backpack slots', max: 20 },
];
function cardById(id) { return CARDS.find(c => c.id === id); }
function drawCards() {
  const avail = CARDS.filter(c => pk(c.id) < c.max);
  const pool = avail.length ? avail : CARDS;
  const pick = [];
  let g2 = 0;
  while (pick.length < 3 && g2++ < 80) {
    const c = pool[Math.floor(rnd() * pool.length)];
    if (!pick.includes(c)) pick.push(c);
    if (pick.length >= pool.length) break;
  }
  S.cards = pick;
}
function grantXp(n) {
  if (!S.started) return;
  S.xp += n * (1 + 0.15 * pk('scholar')) * (1 + petBonus('xp')) * (1 + cperkBonus('xp'));
  while (S.xp >= xpNeed(S.level)) {
    S.xp -= xpNeed(S.level); S.level++;
    S.stats.level = S.level;
    if (S.cards) S.pendingLevels = (S.pendingLevels || 0) + 1; else drawCards();
    S.goldPulse = Math.max(S.goldPulse, 0.5); sfx('unlock', true); buzz([20, 20, 40]);
    JUICE.flash = 0.7; ringFx(S.player.x, S.player.y - 10, 130, '#ffe98a', 0.6); ringFx(S.player.x, S.player.y - 10, 80, '#ff9ac8', 0.45); starBurst(S.player.x, S.player.y - 24, 18, ['#ffe98a', '#ff9ac8', '#9af0b4'], 300);
    S.toasts.push({ txt: '⭐ LEVEL ' + S.level + ' — choose an upgrade!', t: 0 });
    for (let i = 0; i < 16; i++) S.parts.push({ x: S.player.x, y: S.player.y, vx: (rnd() - 0.5) * 240, vy: -100 - rnd() * 180, t: 0, dur: 0.7, r: 3, color: '#ffd94a', g: 1 });
  }
}
function pickCard(i) {
  if (!S.cards || !S.cards[i]) return false;
  const c = S.cards[i];
  S.perks[c.id] = pk(c.id) + 1;
  if (c.id === 'hp') { const mh = pMaxHp(); S.player.hp += 30; if (S.player.hp > mh) S.player.hp = mh; }
  S.cards = null;
  S.toasts.push({ txt: c.ic + ' ' + c.name + (pk(c.id) > 1 ? ' x' + pk(c.id) : ''), t: 0 });
  S.goldPulse = Math.max(S.goldPulse, 0.4); sfx('built', true); buzz(30);
  if (S.pendingLevels > 0) { S.pendingLevels--; drawCards(); }
  return true;
}

function petDef(id) { return PETS.find(p => p.id === id) || null; }
function petLvl(id) { return (S.pets && S.pets[id]) || 0; }
function petsOwned() { let n = 0; for (const id in (S.pets || {})) if (S.pets[id] > 0) n++; return n; }
function activePet() { return S.activePet ? petDef(S.activePet) : null; }
// additive fraction contributed by the active pet for a given stat kind
function petBonus(kind) {
  const a = activePet(); if (!a) return 0;
  const lvl = petLvl(a.id);
  if (a.kind === kind) return a.amt * lvl;
  if (a.kind === 'all') return a.amt * lvl; // unicorn buffs every kind
  return 0;
}
// active pet ability — a tappable themed power on a cooldown
const PET_CD = 22;
function petAbilityReady() { return !!S.activePet && (S.petCd || 0) <= 0; }
function petAbility() {
  if (!S.started || !petAbilityReady()) return false;
  const a = activePet(); if (!a) return false;
  S.petCd = PET_CD;
  S.stats.petAbil = (S.stats.petAbil || 0) + 1;
  let msg = 'Frenzy!';
  if (a.kind === 'coin') { const g = Math.ceil(150 * helmVal(S.zones.length) * coinMul()); S.pallet += g; S.stats.earned += g; msg = '+' + fmt(g) + '¢'; }
  else if (a.kind === 'hp') { S.player.hp = S.player.maxHp; msg = 'Full heal'; }
  else if (a.kind === 'xp') { grantXp(xpNeed(S.level) * 0.7); msg = 'XP surge'; }
  else if (a.kind === 'magnet') { for (const it of S.items) { it.vx = (S.player.x - it.x) * 3; it.vy = (S.player.y - it.y) * 3; } msg = 'Magnet pull'; }
  else { S.frenzyT = Math.max(S.frenzyT, 6); msg = 'Frenzy 6s'; } // dmg / rate / speed / all
  S.toasts.push({ txt: a.ic + ' ' + a.name + ' — ' + msg, t: 0 });
  S.goldPulse = Math.max(S.goldPulse, 0.6); S.shake = Math.max(S.shake, 7);
  for (let i = 0; i < 20; i++) { const ang = i / 20 * 6.2831853; S.parts.push({ x: S.player.x, y: S.player.y - 16, vx: Math.cos(ang) * 230, vy: Math.sin(ang) * 210 - 90, t: 0, dur: 0.7, r: 3, color: RARITY[a.rar].col, g: 1 }); }

}
// permanent collection bonus: +2% coin value per unique species owned
function petCollectionMul() { return 1 + 0.02 * petsOwned(); }

function rollRarity() {
  const tot = RARITY.reduce((s, r) => s + r.w, 0);
  let x = rnd() * tot;
  for (let i = 0; i < RARITY.length; i++) { x -= RARITY[i].w; if (x < 0) return i; }
  return 0;
}
function hatchEgg() {
  const c = eggCost();
  if (S.gems < c) { float(S.player.x, S.player.y - 40, 'Need ' + c + '💎', '#6ee0d8'); return false; }
  S.gems -= c;
  S.stats.hatches = (S.stats.hatches || 0) + 1;
  const r = rollRarity();
  let pool = PETS.filter(p => p.rar === r);
  if (!pool.length) pool = PETS;
  const def = pool[Math.floor(rnd() * pool.length)];
  const wasNew = petLvl(def.id) === 0;
  S.pets[def.id] = petLvl(def.id) + 1;
  if (!S.activePet) S.activePet = def.id;
  const rc = RARITY[def.rar].col;
  S.toasts.push({ txt: def.ic + ' ' + (wasNew ? 'NEW! ' : 'Lv' + S.pets[def.id] + ' ') + def.name, t: 0 });
  S.shake = Math.max(S.shake, wasNew ? 8 : 4); S.goldPulse = Math.max(S.goldPulse, 0.5);
  for (let i = 0; i < (wasNew ? 26 : 12); i++) S.parts.push({ x: S.player.x, y: S.player.y - 20, vx: (rnd() - 0.5) * 300, vy: -100 - rnd() * 200, t: 0, dur: 0.8, r: 3, color: rc, g: 1 });
  sfx('unlock', true); buzz(wasNew ? [30, 20, 60] : 30);
  return true;
}

// ---- gear / equipment (boss loot) ----------------------------
// Boss kings drop gear. Three slots (weapon/armor/trinket); each piece
// rolls a rarity (reusing the pet tiers) and a stat. Better pieces
// auto-equip, weaker ones salvage into a gem — no fiddly inventory.
const RAR_MUL = [1, 1.8, 3, 5]; // power multiplier per rarity tier
const TRINKET_KINDS = [
  { kind: 'coin',   label: 'of Greed' },
  { kind: 'rate',   label: 'of Haste' },
  { kind: 'speed',  label: 'of Swiftness' },
  { kind: 'magnet', label: 'of Draw' },
];
const GEAR_SLOTS = [
  { id: 'weapon',  ic: '🗡', name: 'Weapon',  fixed: 'dmg', base: 0.12 },
  { id: 'armor',   ic: '🛡', name: 'Armor',   fixed: 'hp',  base: 0.10 },
  { id: 'trinket', ic: '💍', name: 'Trinket', fixed: null,  base: 0.10 },
];
function gearDef(id) { return GEAR_SLOTS.find(s => s.id === id) || null; }
// blacksmith: each enhance level adds a flat bump on top of the rolled stat
const ENH_STEP = 0.02, ENH_MAX = 10;
function gearAmt(g) { return g ? g.amt + ENH_STEP * (g.enh || 0) : 0; }
function enhCost(g) { return 2 + (g.enh || 0) * 2 + g.rar; } // gems, escalating with level + rarity
function enhanceGear(id) {
  const g = S.gear[id]; if (!g) return false;
  if ((g.enh || 0) >= ENH_MAX) return false;
  const c = enhCost(g);
  if (S.gems < c) { float(S.player.x, S.player.y - 40, 'Need ' + c + '💎', '#6ee0d8'); return false; }
  S.gems -= c;
  g.enh = (g.enh || 0) + 1;
  S.stats.enhanced = (S.stats.enhanced || 0) + 1;
  S.player.maxHp = pMaxHp(); if (S.player.hp > S.player.maxHp) S.player.hp = S.player.maxHp;
  S.toasts.push({ txt: '⚒️ ' + gearDef(id).name + ' +' + g.enh, t: 0 });
  S.goldPulse = Math.max(S.goldPulse, 0.4); S.shake = Math.max(S.shake, 5);
  for (let i = 0; i < 14; i++) S.parts.push({ x: S.player.x, y: S.player.y - 20, vx: (rnd() - 0.5) * 240, vy: -80 - rnd() * 160, t: 0, dur: 0.6, r: 2.5, color: '#ffce4a', g: 1 });
  sfx('built', true); buzz([20, 15, 30]);
  save();
  return true;
}
function gearBonus(kind) {
  let b = 0;
  for (const s of GEAR_SLOTS) { const g = S.gear && S.gear[s.id]; if (g && g.kind === kind) b += gearAmt(g); }
  return b;
}
function gearCount() { let n = 0; for (const s of GEAR_SLOTS) if (S.gear && S.gear[s.id]) n++; return n; }
function rollGear() {
  const slot = GEAR_SLOTS[Math.floor(rnd() * GEAR_SLOTS.length)];
  const rar = rollRarity(); // reuse the pet rarity roller
  let kind = slot.fixed, kname = '';
  if (!kind) { const tk = TRINKET_KINDS[Math.floor(rnd() * TRINKET_KINDS.length)]; kind = tk.kind; kname = tk.label; }
  const amt = Math.round(slot.base * RAR_MUL[rar] * 1000) / 1000;

function grantGear(g) {

  if (!cur || g.amt > cur.amt) {
    S.gear[g.slot] = g;
    S.player.maxHp = pMaxHp(); if (S.player.hp > S.player.maxHp) S.player.hp = S.player.maxHp;
    const rc = RARITY[g.rar].col, def = gearDef(g.slot);
    S.toasts.push({ txt: def.ic + ' ' + RARITY[g.rar].name + ' ' + def.name + '!', t: 0 });
    S.goldPulse = Math.max(S.goldPulse, 0.5); S.shake = Math.max(S.shake, 6);
    for (let i = 0; i < 18; i++) S.parts.push({ x: S.player.x, y: S.player.y - 20, vx: (rnd() - 0.5) * 300, vy: -100 - rnd() * 200, t: 0, dur: 0.8, r: 3, color: rc, g: 1 });

}

// ---- deterministic rng --------------------------------------
let seed = 987654321;
function rnd() { seed = (seed * 1103515245 + 12345) & 0x7fffffff; return seed / 0x7fffffff; }
// dedicated stream for the wandering merchant so its rolls never perturb the
// deterministic enemy-spawn sequence the tests calibrate against.
let mseed = 424242;

// ---- day / night cycle (cosmetic) ---------------------------
const DAY_LEN = 96; // seconds for a full dawn→day→dusk→night loop
function dayPhase() { return (((S.t % DAY_LEN) + DAY_LEN) % DAY_LEN) / DAY_LEN; } // 0..1, 0=midnight
function daylight() { return (1 - Math.cos(dayPhase() * 6.2831853)) / 2; }        // 0 night .. 1 noon
function skyName() { const p = dayPhase(); return (p < 0.17 || p >= 0.83) ? 'Night' : p < 0.33 ? 'Dawn' : p < 0.67 ? 'Day' : 'Dusk'; }
// fixed star field on its own tiny RNG — never touches the game or merchant streams
const STARS = (() => {
  let s = 1234567; const r = () => { s = (s * 1103515245 + 12345) & 0x7fffffff; return s / 0x7fffffff; };
  const a = []; for (let i = 0; i < 64; i++) a.push({ x: r(), y: r() * 0.55, r: 1 + Math.floor(r() * 2), tw: 2 + r() * 3, o: r() * 6.28 });
  return a;
})();

const WEATHER_LEN = 68; // seconds per weather window
const WEATHER_SEQ = ['clear', 'rain', 'clear', 'snow', 'clear', 'fog', 'clear', 'rain', 'snow'];
function weatherBucket() { const span = WEATHER_LEN * WEATHER_SEQ.length; return Math.floor((((S.t % span) + span) % span) / WEATHER_LEN); }
function weatherType() { return WEATHER_SEQ[weatherBucket() % WEATHER_SEQ.length]; }
// fixed precipitation field on its own local rng — animated purely from S.t
const WEATHER_P = (() => {
  let s = 9876543; const r = () => { s = (s * 1103515245 + 12345) & 0x7fffffff; return s / 0x7fffffff; };

// tower training (repeatable), +porter (repeatable), unlock.

const POOL = [
  { id: 'tower2',   icon: '🏹', name: 'ARCHER TOWER', mul: 1.5 },
  { id: 'wizard',   icon: '⚡', name: 'WIZARD TOWER', mul: 1.8 },

function mkZone(k) {
  const cell = cellFor(k);
  const x0 = cell.cx * CELL_W, y0 = cell.cy * CELL_H;
  const x1 = x0 + CELL_W, y1 = y0 + CELL_H;
  const P = (id, icon, name, px, py, cost, rep) => ({
    id, icon, name, x: x0 + px, y: y0 + py,
    base: Math.ceil(cost), mul: rep ? rep.mul : 0, maxLvl: rep ? rep.max : 0,
    cost: Math.ceil(cost), paid: 0, lvl: 0, built: false, repeat: !!rep,
  });
  // building costs outrun income at high lands (bcost == eco at land 1, steeper after)
  const bc = bcost(k);
  const plates = [
    P('tower1', '🏹', 'ARCHER TOWER', 260, 265, 70 * bc),
    P('gate2', '🚪', 'HORDE GATE', 640, 230, 110 * bc, { mul: 1.6, max: 4 }),
    P('towersUp', '🎯', 'TRAIN TOWERS', 525, 500, 130 * bc, { mul: 1.7, max: 6 }),
    P('porter', '🧺', 'PORTER', 150, 380, 90 * bc),
    P('porterPlus', '🧺', '+PORTER', 150, 620, 150 * bc, { mul: 1.9, max: 2 }),
  ];
  if (k === 1) {
    plates.push(P('tower2', '🏹', 'ARCHER TOWER', 260, 735, 120 * bc));
  } else {
    const a = POOL[k % POOL.length], b = POOL[(k + 2) % POOL.length];
    plates.push(P(a.id, a.icon, a.name, 260, 735, 95 * bc * a.mul));
    plates.push(P(b.id, b.icon, b.name, 790, 265, 95 * bc * b.mul));
    plates.push(P('altar', '💀', 'BOSS ALTAR', 640, 770, 200 * bc));
  }
  // unlock plate sits on the outward edge; entrance pad faces the hub
  const d = DIRS[cell.dir];
  const ux = d[0] ? (d[0] > 0 ? x1 - 60 : x0 + 60) : x0 + 525;
  const uy = d[1] ? (d[1] > 0 ? y1 - 60 : y0 + 60) : y0 + 500;
  plates.push({ id: 'unlock', icon: '🔓', name: 'NEW LANDS', x: ux, y: uy, base: unlockCost(k), mul: 0, maxLvl: 0, cost: unlockCost(k), paid: 0, lvl: 0, built: false, repeat: false });
  const padx = d[0] ? (d[0] > 0 ? x0 + 60 : x1 - 60) : x0 + 525;
  const pady = d[1] ? (d[1] > 0 ? y0 + 60 : y1 - 60) : y0 + 500;
  const gatex = d[0] ? (d[0] > 0 ? x1 - 130 : x0 + 130) : x0 + 525;
  const gatey = d[1] ? (d[1] > 0 ? y1 - 200 : y0 + 200) : y0 + 500;
  return {
    k, x0, y0, x1, y1, cx: cell.cx, cy: cell.cy, dir: cell.dir,
    pen: { x0: x0 + 90, x1: x1 - 90, y0: y0 + 160, y1: y1 - 160 },
    gate: { x: gatex, y: gatey },
    pad: { x: padx, y: pady, r: 44 },
    spawnCd: 1.2, plates,
    towers: [], porters: [], drums: false, altar: null,
    towerLvl: 0, hordeLvl: 0,
  };
}

function registerCombo(e) {
  S.combo++;

  if (S.combo > (S.stats.comboBest || 0)) S.stats.comboBest = S.combo;
  const mul = comboMul();
  // combo pays a bonus on top of the dropped helmet, scaled by the current multiplier
  if (mul > 1) {
    const bonus = Math.ceil(helmVal(e.k) * (mul - 1) * coinMul());
    if (bonus > 0) {
      S.pallet += bonus; S.stats.earned += bonus;
      float(e.x, e.y - 26, '+' + fmt(bonus) + '¢', comboColor());
      questEvent('earn', bonus);
    }
  }
  // milestone flourish when you cross into a new tier
  const tier = comboTier();
  if (tier > S.comboTierShown) {
    S.comboTierShown = tier;
    S.comboFlash = 0.6; S.goldPulse = Math.max(S.goldPulse, 0.4);
    S.toasts.push({ txt: '🔥 COMBO x' + mul + '  (' + S.combo + ' streak!)', t: 0 });
    for (let i = 0; i < 14; i++) S.parts.push({ x: e.x, y: e.y, vx: (rnd() - 0.5) * 260, vy: -80 - rnd() * 180, t: 0, dur: 0.6, r: 3, color: comboColor(), g: 1 });

  // escalating streak reward when you cross a milestone count (once per streak)
  for (const r of COMBO_REWARDS) {
    if (S.combo >= r.at && (S.comboRewardMax || 0) < r.at) {
      S.comboRewardMax = r.at;
      r.fx();

      S.toasts.push({ txt: r.label + '!  ' + S.combo + ' KILL STREAK', t: 0 });
      S.comboFlash = 0.9; S.goldPulse = Math.max(S.goldPulse, 0.7); S.shake = Math.max(S.shake, 8);
      for (let i = 0; i < 22; i++) { const a = i / 22 * 6.2831853; S.parts.push({ x: S.player.x, y: S.player.y - 20, vx: Math.cos(a) * 270, vy: Math.sin(a) * 240 - 100, t: 0, dur: 0.8, r: 3, color: comboColor(), g: 1 }); }
      sfx('unlock', true); buzz([30, 20, 50]);
    }

  // kill pitch rises with the streak (regular kills; boss/gold have their own sounds)
  if (!e.boss && !e.gold) sfx('kill', false, 1 + Math.min(1.4, S.combo * 0.02));
}
function dashAbility() {
  const p = S.player;
  if (!S.started || p.dashT > 0 || p.dashCd > 0) return false;
  let dx = 0, dy = 0;
  if (S.stick) { dx = S.stick.dx; dy = S.stick.dy; }
  if (S.keys.a || S.keys.ArrowLeft) dx -= 1;
  if (S.keys.d || S.keys.ArrowRight) dx += 1;
  if (S.keys.w || S.keys.ArrowUp) dy -= 1;
  if (S.keys.s || S.keys.ArrowDown) dy += 1;
  const l = Math.hypot(dx, dy);
  if (l > 0.1) { dx /= l; dy /= l; } else { dx = p.mvx || p.face || 1; dy = p.mvy || 0; }
  p.dvx = dx; p.dvy = dy;
  p.dashT = DASH_TIME; p.dashCd = dashCdMax();
  S.stats.dashes = (S.stats.dashes || 0) + 1;
  p.invuln = Math.max(p.invuln, DASH_TIME + 0.12); // i-frames through the dash + a hair after
  if (Math.abs(dx) > 0.15) p.face = dx > 0 ? 1 : -1;
  puff(p.x, p.y, '#6ec9e0', 12, false);
  sfx('warp'); buzz(15);
  return true;
}

function applyPlate(z, pl) {
  if (pl.id === 'tower1' || pl.id === 'tower2') z.towers.push({ type: 'archer', x: pl.x, y: pl.y, k: z.k, cd: rnd() * 0.5 });
  else if (pl.id === 'wizard')     z.towers.push({ type: 'wizard', x: pl.x, y: pl.y, k: z.k, cd: rnd() * 0.5 });
  else if (pl.id === 'catapult')   z.towers.push({ type: 'catapult', x: pl.x, y: pl.y, k: z.k, cd: 1 + rnd() });
  else if (pl.id === 'drums')      z.drums = true;
  else if (pl.id === 'altar')      z.altar = { x: pl.x, y: pl.y, cd: 0 };
  else if (pl.id === 'porter' || pl.id === 'porterPlus')
    z.porters.push({ x: pl.x, y: pl.y, hx: pl.x, hy: pl.y, k: z.k, state: 'seek', carry: [], cd: 0 });
  else if (pl.id === 'gate2')      z.hordeLvl++;
  else if (pl.id === 'towersUp')   z.towerLvl++;
  else if (pl.id === 'unlock')   { S.zones.push(mkZone(z.k + 1)); questEvent('land', 1); }
}
function buildPlate(z, pl, silent) {
  applyPlate(z, pl);
  if (pl.repeat) {
    pl.lvl++; pl.paid = 0;
    pl.cost = Math.ceil(pl.base * Math.pow(pl.mul, pl.lvl));
    if (pl.lvl >= pl.maxLvl) pl.built = true;
    if (!silent) { float(pl.x, pl.y - 50, pl.name + ' LV' + pl.lvl + '!', '#6ecb5a', true); sfx('built', true); buzz(40); puff(pl.x, pl.y, '#ffd94a', 12, true); }
    return;
  }
  pl.built = true;
  if (pl.id === 'unlock') {
    if (!silent) {
      const nz = S.zones[S.zones.length - 1];
      float(pl.x, pl.y - 60, '🌍 NEW LAND ' + DIR_NAME[nz.dir] + '!', '#ffd94a', true);
      sfx('unlock', true); buzz([40, 30, 80]);
    }
    return;
  }
  if (!silent) { float(pl.x, pl.y - 50, pl.name + ' BUILT!', '#6ecb5a', true); sfx('built', true); buzz(50); puff(pl.x, pl.y, '#ffd94a', 16, true); }
}
function pourInto(pl, z, dt) {
  if (pl.built || S.wallet <= 0) return;
  touchFlow(pl, dt);
  const chunk = Math.min(S.wallet, Math.ceil(BUILD_RATE * flowMul() * dt), pl.cost - pl.paid);
  if (chunk <= 0) return;
  S.wallet -= chunk; pl.paid += chunk;
  sfx('pour'); pourFx(dt);
  if (pl.paid >= pl.cost) buildPlate(z, pl, false);
}
function pourHub(plate, dt, done) {
  if (plate.built || S.wallet <= 0) return;
  touchFlow(plate, dt);
  const chunk = Math.min(S.wallet, Math.ceil(BUILD_RATE * flowMul() * dt), plate.cost - plate.paid);
  if (chunk <= 0) return;
  S.wallet -= chunk; plate.paid += chunk; sfx('pour'); pourFx(dt);
  if (plate.paid >= plate.cost) { plate.built = true; done(); sfx('built', true); buzz(50); }
}

// ---- war dog ------------------------------------------------
function spawnDog() {
  S.dog = { x: KENNEL.x, y: KENNEL.y - 30, state: 'follow', carry: null, tail: 0 };
}
function dogTick(dt) {
  const d = S.dog, p = S.player;
  if (!d) return;
  d.tail += dt;
  if (d.state === 'follow') {
    // trot behind the player, sniff out nearby drops if there's room on the stack
    if (p.helmets.length < cap()) {
      let it = null, bd = DOG_FETCH_R * DOG_FETCH_R;
      for (const i2 of S.items) {
        if (i2.dead || i2.gem || i2.t < 0.25) continue;
        const q = dist2(i2.x, i2.y, p.x, p.y); if (q < bd) { bd = q; it = i2; }
      }
      if (it) { d.state = 'fetch'; d.item = it; }
    }
    const hx = p.x - p.face * 30, hy = p.y + 12;
    const dl = Math.hypot(hx - d.x, hy - d.y);
    if (dl > 16) { d.x += (hx - d.x) / dl * Math.min(DOG_SPD, dl * 6) * dt; d.y += (hy - d.y) / dl * Math.min(DOG_SPD, dl * 6) * dt; }
  } else if (d.state === 'fetch') {
    const it = d.item;
    if (!it || it.dead) { d.state = 'follow'; d.item = null; }
    else {
      const dl = Math.hypot(it.x - d.x, it.y - d.y) || 1;
      d.x += (it.x - d.x) / dl * DOG_SPD * dt; d.y += (it.y - d.y) / dl * DOG_SPD * dt;
      if (dl < 20) { it.dead = true; d.carry = cloneEntry(it); d.item = null; d.state = 'return'; }
    }
  } else { // return to the player
    const dl = Math.hypot(p.x - d.x, p.y - d.y) || 1;
    d.x += (p.x - d.x) / dl * DOG_SPD * dt; d.y += (p.y - d.y) / dl * DOG_SPD * dt;
    if (dl < 30) {
      if (p.helmets.length < cap()) { p.helmets.push(d.carry); sfx('pick'); }
      else dropItem(p.x, p.y, cloneEntry(d.carry));
      d.carry = null; d.state = 'follow';
    }
  }
}

// ---- crown hall: permanent prestige perk tree ----------------
// Crowns (won by founding New Kingdoms) buy PERMANENT account-wide
// perks that survive every prestige. Each level costs a little more,
// so crowns always have somewhere meaningful to go — deep meta loop.
const CPERKS = [
  { id: 'wealth',  ic: '💰', name: 'Royal Treasury',    kind: 'coin',  amt: 0.08, max: 12, desc: '+8% coin value' },
  { id: 'might',   ic: '⚔️', name: 'Warlord Blood',     kind: 'dmg',   amt: 0.08, max: 12, desc: '+8% damage' },
  { id: 'haste',   ic: '🏹', name: 'Rapid Volley',      kind: 'rate',  amt: 0.05, max: 12, desc: '+5% fire rate' },
  { id: 'vigor',   ic: '❤️', name: 'Iron Constitution', kind: 'hp',    amt: 0.10, max: 12, desc: '+10% max HP' },
  { id: 'swift',   ic: '👟', name: 'Royal Courier',     kind: 'speed', amt: 0.05, max: 8,  desc: '+5% move speed' },
  { id: 'scholar', ic: '📖', name: 'Royal Academy',     kind: 'xp',    amt: 0.10, max: 10, desc: '+10% XP gain' },
  { id: 'legacy',  ic: '👑', name: 'Enduring Legacy',   kind: 'crown', amt: 1,    max: 6,  desc: '+1 crown per New Kingdom' },
];
function cpk(id) { return (S.cperks && S.cperks[id]) || 0; }
function cperkDef(id) { return CPERKS.find(p => p.id === id) || null; }
function cperkCost(id) { return 1 + cpk(id); } // 1,2,3… crowns per level
function cperkBonus(kind) {
  let b = 0;
  for (const p of CPERKS) if (p.kind === kind) b += p.amt * cpk(p.id);
  return b;
}
function buyCperk(id) {
  const def = cperkDef(id); if (!def) return false;
  if (cpk(id) >= def.max) return false;
  const c = cperkCost(id);
  if (S.crowns < c) { float(S.player.x, S.player.y - 40, 'Need ' + c + ' 👑', '#ffd94a'); return false; }
  S.crowns -= c;
  S.cperks[id] = cpk(id) + 1;
  S.player.maxHp = pMaxHp(); if (S.player.hp > S.player.maxHp) S.player.hp = S.player.maxHp;
  S.toasts.push({ txt: def.ic + ' ' + def.name + ' Lv' + S.cperks[id], t: 0 });
  S.goldPulse = Math.max(S.goldPulse, 0.4); sfx('built', true); buzz(30);
  save();
  return true;
}

function qTier() { return S.zones.length - 1; }
function streakMul() { return 1 + Math.min(1, 0.1 * Math.max(0, S.streak - 1)); }
function qReward(t, daily) { return Math.ceil(80 * Math.pow(1.75, t) * (daily ? 2 * streakMul() : 1)); }
function mkQuest(tpl, daily) {
  const t = qTier();
  const target = tpl.n(t);
  return { tpl: tpl.id, icon: tpl.icon, ev: tpl.ev, txt: tpl.txt.replace('#', fmt(target)), target, prog: 0, reward: qReward(t, daily), gem: rnd() < 0.3, daily: !!daily, done: false, doneT: 0 };
}
function rollQuest() {
  const avoid = new Set(S.quests.map(q => q.tpl));
  let pick = null, g2 = 0;
  while (g2++ < 40) { const tpl = QTPL[Math.floor(rnd() * QTPL.length)]; if (!avoid.has(tpl.id)) { pick = tpl; break; } }
  return mkQuest(pick || QTPL[0], false);
}
function dayStr(off) { return new Date(Date.now() + (off || 0) * 86400000).toISOString().slice(0, 10); }
function rollDailies() {
  // deterministic template picks from the calendar day
  const s = dayStr(0);
  let h = 0;
  for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) & 0x7fffffff;
  const list = [];
  for (let i = 0; i < 3; i++) {
    h = (h * 1103515245 + 12345) & 0x7fffffff;
    let idx = h % QTPL.length, g2 = 0;
    while (list.some(q => q.tpl === QTPL[idx].id) && g2++ < 10) idx = (idx + 1) % QTPL.length;
    list.push(mkQuest(QTPL[idx], true));
  }
  S.dailies = list; S.dailyDay = s;
}

function questEvent(ev, n) {
  for (const q of S.quests.concat(S.dailies)) {
    if (q.done || q.ev !== ev) continue;
    q.prog += n;
    if (q.prog >= q.target) completeQuest(q);
  }
}
function completeQuest(q) {
  q.done = true; q.doneT = 0;
  S.wallet += q.reward;
  if (q.gem) { S.gems++; S.stats.gemsFound++; }
  if (q.daily) {
    const today = dayStr(0);
    if (S.lastStreakDay !== today) {
      S.streak = (S.lastStreakDay === dayStr(-1)) ? S.streak + 1 : 1;
      S.lastStreakDay = today;
    }
  }
  S.stats.quests = (S.stats.quests || 0) + 1;
  S.toasts.push({ txt: '📜 ' + q.txt + '  +' + fmt(q.reward) + '¢' + (q.gem ? ' +💎' : ''), t: 0 });
  confetti(S.player.x, S.player.y - 30);
  S.goldPulse = 0.6;
  sfx('unlock', true); buzz([40, 30, 60]);
}
function confetti(x, y) {
  const cols = ['#ffd94a', '#ff6a5a', '#6ee0d8', '#6ecb5a', '#c98aff'];
  for (let i = 0; i < 24; i++)

}

// ---- wandering merchant (timed event + resource sink) --------
// A travelling trader shows up every so often near the hub with three
// randomized deals. Pay coins or gems for eggs, gear, boons, coins or
// heals. He leaves after a while or once you clear his stock.
const MERCH_CD = 140, MERCH_STAY = 78;
const DEALS = [
  { id: 'egg',   ic: '🥚', name: 'Mystery Egg', cur: 'coin', cost: () => Math.ceil(260 * helmVal(S.zones.length)), desc: 'Hatch a random pet', apply: () => { S.gems += eggCost(); hatchEgg(); } },
  { id: 'gear',  ic: '🎁', name: 'Gear Crate',  cur: 'gem',  cost: () => 7, desc: 'A random gear piece',   apply: () => { grantGear(rollGear()); } },
  { id: 'gems',  ic: '💎', name: 'Gem Cache',   cur: 'coin', cost: () => Math.ceil(340 * helmVal(S.zones.length)), desc: '+8 gems', apply: () => { S.gems += 8; S.stats.gemsFound = (S.stats.gemsFound || 0) + 8; } },
  { id: 'coins', ic: '🪙', name: 'Coin Sack',   cur: 'gem',  cost: () => 5, desc: 'A big pile of coins',   apply: () => { const g = Math.ceil(500 * helmVal(S.zones.length) * coinMul()); S.wallet += g; S.stats.earned += g; } },
  { id: 'boon',  ic: '⚡', name: 'Blessing',    cur: 'gem',  cost: () => 4, desc: 'Frenzy + Gold Rush 15s', apply: () => { S.frenzyT = Math.max(S.frenzyT, 15); S.goldRushT = Math.max(S.goldRushT, 15); } },
  { id: 'heal',  ic: '❤️', name: 'Elixir',      cur: 'coin', cost: () => Math.ceil(200 * helmVal(S.zones.length)), desc: 'Full heal', apply: () => { S.player.hp = S.player.maxHp; } },
];
function dealDef(id) { return DEALS.find(d => d.id === id) || null; }
function spawnMerchant() {
  const pool = DEALS.slice(), deals = [];
  for (let i = 0; i < 3 && pool.length; i++) {
    const d = pool.splice(Math.floor(mrnd() * pool.length), 1)[0];
    deals.push({ id: d.id, ic: d.ic, name: d.name, cur: d.cur, cost: d.cost(), desc: d.desc, sold: false });
  }
  S.merchant = { x: SPAWN.x + 96, y: SPAWN.y - 30, t: 0, stay: MERCH_STAY, deals };
  S.toasts.push({ txt: '🛒 A merchant has arrived!', t: 0 });
  sfx('gem', true); buzz(30);
}
function merchantLeaves(msg) {
  if (msg) S.toasts.push({ txt: msg, t: 0 });
  S.merchant = null; S.showShop = false;
  S.merchantCd = MERCH_CD * (0.8 + mrnd() * 0.5);
}
function buyDeal(i) {
  if (!S.merchant) return false;
  const d = S.merchant.deals[i]; if (!d || d.sold) return false;
  const have = d.cur === 'gem' ? S.gems : S.wallet;
  if (have < d.cost) { float(S.player.x, S.player.y - 40, 'Need ' + d.cost + (d.cur === 'gem' ? '💎' : '¢'), '#ffd94a'); return false; }
  if (d.cur === 'gem') S.gems -= d.cost; else S.wallet -= d.cost;
  const def = dealDef(d.id); if (def) def.apply();
  d.sold = true;
  S.stats.trades = (S.stats.trades || 0) + 1;
  S.goldPulse = Math.max(S.goldPulse, 0.4); S.shake = Math.max(S.shake, 5);
  sfx('unlock', true); buzz(30);
  if (S.merchant.deals.every(x => x.sold)) merchantLeaves('🛒 The merchant packs up, satisfied.');
  else save();
  return true;
}

// Spend gems for a spin; the landing segment is picked on the isolated
// mrnd() stream so it never perturbs the enemy-spawn sequence. Rewards
// reuse the shared gacha systems (eggs, gear) so they feel consistent.
const SPIN_COST = 4;
const WHEEL = [
  { id: 'coins', ic: '🪙', label: 'Coins',     col: '#ffd94a', w: 22, apply: () => { const g = Math.ceil(120 * helmVal(S.zones.length) * coinMul()); S.wallet += g; S.stats.earned += g; return '+' + fmt(g) + '¢'; } },

  { id: 'boon',  ic: '⚡', label: 'Frenzy',    col: '#c98aff', w: 14, apply: () => { S.frenzyT = Math.max(S.frenzyT, 12); return 'Frenzy 12s'; } },
  { id: 'gold',  ic: '💰', label: 'Gold Rush', col: '#f0a63c', w: 12, apply: () => { S.goldRushT = Math.max(S.goldRushT, 15); return 'Gold Rush 15s'; } },
  { id: 'egg',   ic: '🥚', label: 'Pet Egg',   col: '#6ecb5a', w: 10, apply: () => { S.gems += eggCost(); hatchEgg(); return 'a pet!'; } },
  { id: 'gear',  ic: '🎁', label: 'Gear',      col: '#5aa9e0', w: 10, apply: () => { grantGear(rollGear()); return 'gear!'; } },
  { id: 'xp',    ic: '⭐', label: 'XP Boost',  col: '#ff9a4a', w: 8,  apply: () => { grantXp(xpNeed(S.level) * 0.6); return 'XP boost'; } },

];
function spinWheel() {
  if ((S.gems || 0) < SPIN_COST) { float(S.player.x, S.player.y - 40, 'Need ' + SPIN_COST + '💎', '#6ee0d8'); return null; }
  S.gems -= SPIN_COST;
  const tot = WHEEL.reduce((s, w) => s + w.w, 0);
  let x = mrnd() * tot, idx = 0;
  for (let i = 0; i < WHEEL.length; i++) { x -= WHEEL[i].w; if (x < 0) { idx = i; break; } }
  const seg = WHEEL[idx], msg = seg.apply();
  S.stats.spins = (S.stats.spins || 0) + 1;
  S.wheel = { idx, t: 0, spinT: 0, msg: seg.label + ': ' + msg };
  S.toasts.push({ txt: '🎡 ' + seg.label + ' — ' + msg, t: 0 });
  S.goldPulse = Math.max(S.goldPulse, 0.5); S.shake = Math.max(S.shake, 6);
  sfx('unlock', true); buzz([20, 15, 40]);
  save();
  return seg;
}

function heroRank() { return RANKS[heroRankIdx()]; }

// ---- main update --------------------------------------------
function tick(dt) {
  if (!S.started) return;
  S.t += dt;
  S.stats.playT = (S.stats.playT || 0) + dt;
  S.flowTouched = false;
  // combo decays if you stop killing
  if (S.combo > 0) {
    S.comboT -= dt;
    if (S.comboT <= 0) { S.combo = 0; S.comboTierShown = 0; S.comboRewardMax = 0; }
  }
  if (S.comboFlash > 0) S.comboFlash -= dt;
  if (S.shake > 0) S.shake = Math.max(0, S.shake - dt * 40);
  if (S.offlineMsg > 0) S.offlineMsg -= dt;
  const p = S.player;
  p.invuln = Math.max(0, p.invuln - dt);
  p.hurtT = Math.max(0, p.hurtT - dt); p.atkT = Math.max(0, (p.atkT || 0) - dt);
  // keep max HP in sync with VITALITY level + crowns; buying HP / prestige heals
  const mh = pMaxHp();
  if (mh > p.maxHp) p.hp += mh - p.maxHp;
  p.maxHp = mh;
  if (p.hp > p.maxHp) p.hp = p.maxHp;
  // regen scales with the pool so it stays meaningful on a big HP bar
  if (p.hp < p.maxHp && p.invuln <= 0) p.hp = Math.min(p.maxHp, p.hp + (Math.max(5, p.maxHp * 0.04) + 3 * pk('regen')) * dt);
  if (S.frenzyT > 0) S.frenzyT -= dt;
  if (S.goldRushT > 0) S.goldRushT -= dt;

  // -- movement (joystick + keys), constrained to unlocked lands
  let mx = 0, my = 0;
  if (S.stick) { mx = S.stick.dx; my = S.stick.dy; }
  if (S.keys.a || S.keys.ArrowLeft) mx -= 1;
  if (S.keys.d || S.keys.ArrowRight) mx += 1;
  if (S.keys.w || S.keys.ArrowUp) my -= 1;
  if (S.keys.s || S.keys.ArrowDown) my += 1;
  const ml = Math.hypot(mx, my);
  if (ml > 0.1) { p.mvx = mx / ml; p.mvy = my / ml; } // remember heading for dash direction
  p.dashCd = Math.max(0, p.dashCd - dt);
  if (p.dashT > 0) {
    // dashing: fast burst, invulnerable, cyan afterimage trail
    p.dashT -= dt;
    const nx = p.x + p.dvx * DASH_SPD * dt, ny = p.y + p.dvy * DASH_SPD * dt;
    if (inWalkable(nx, ny)) { p.x = nx; p.y = ny; }
    else if (inWalkable(nx, p.y)) p.x = nx;
    else if (inWalkable(p.x, ny)) p.y = ny;
    p.moving = 1;
    S.parts.push({ x: p.x, y: p.y, vx: 0, vy: 0, t: 0, dur: 0.22, r: 9, color: 'rgba(110,201,224,0.45)' });
  } else if (ml > 0.1) {
    mx /= Math.max(1, ml); my /= Math.max(1, ml);
    const slow = 1 - Math.min(0.35, p.helmets.length / cap() * 0.35);
    const nx = p.x + mx * speed() * slow * dt;
    const ny = p.y + my * speed() * slow * dt;
    if (inWalkable(nx, ny)) { p.x = nx; p.y = ny; }
    else if (inWalkable(nx, p.y)) p.x = nx;
    else if (inWalkable(p.x, ny)) p.y = ny;
    p.moving = 1; if (Math.abs(mx) > 0.15) p.face = mx > 0 ? 1 : -1;
    p.dustT += dt;
    if (p.dustT > 0.18) {
      p.dustT = 0;
      S.parts.push({ x: p.x - mx * 10, y: p.y + 14, vx: -mx * 30, vy: -10, t: 0, dur: 0.4, r: 3, color: 'rgba(180,170,150,0.5)' });
    }
  } else p.moving = 0;

  // -- pet companion follows a trailing point behind the hero
  if (S.activePet) {
    if (!S.petPos) S.petPos = { x: p.x - 26, y: p.y + 10 };
    const tx = p.x - p.face * 22, ty = p.y + 12;
    S.petPos.x += (tx - S.petPos.x) * Math.min(1, dt * 6);
    S.petPos.y += (ty - S.petPos.y) * Math.min(1, dt * 6);
  }
  if (S.petCd > 0) S.petCd = Math.max(0, S.petCd - dt);
  if (S.wheel && (S.wheel.spinT || 0) < 10) S.wheel.spinT = (S.wheel.spinT || 0) + dt; // fortune-wheel spin animation

  // -- waygate pads
  if (S.waygate) {
    const pads = warpPads();
    let onPad = null;
    for (const pad of pads) if (dist2(p.x, p.y, pad.x, pad.y) < pad.r * pad.r) onPad = pad;
    if (onPad && !p.moving) {
      p.warpT += dt;
      if (p.warpT >= WARP_T) {
        p.warpT = 0;
        puff(p.x, p.y, '#6ec9e0', 14, true);
        p.x = onPad.to.x; p.y = onPad.to.y;
        S.cam.x = p.x; S.cam.y = p.y;
        puff(p.x, p.y, '#6ec9e0', 14, true);
        sfx('warp', true); buzz(20);
      }
    } else p.warpT = 0;
  }

  // -- auto-fire (crits + multishot: one arrow at each of the nearest N foes)
  p.fireCd -= dt;
  if (p.fireCd <= 0) {
    const range = FIRE_RANGE * (1 + 0.12 * pk('range'));
    const inRange = [];
    for (const e of S.enemies) { if (e.hp > 0) { const d = dist2(e.x, e.y, p.x, p.y); if (d < range * range) inRange.push([d, e]); } }
    if (inRange.length) {
      inRange.sort((a, b) => a[0] - b[0]);
      const shots = 1 + pk('multi'), spd = 460 * (1 + 0.18 * pk('velocity'));
      p.fireCd = pRate(); p.atkT = 0.4;
      for (let i = 0; i < shots; i++) {
        const tgt = inRange[i % inRange.length][1];
        const crit = rnd() < critChance();
        S.shots.push({ x: p.x, y: p.y - 26, tgt, dmg: pDmg() * (crit ? critMult() : 1), spd, crit });
      }
      p.face = inRange[0][1].x > p.x ? 1 : -1;
      sfx('shoot');
    }
  }

  // -- item pickup
  const pr = pickR();
  for (const it of S.items) {
    if (it.dead || it.t < 0.25) continue;
    if (dist2(it.x, it.y, p.x, p.y) >= pr * pr) continue;
    if (it.gem) {
      it.dead = true; S.gems++; S.stats.gemsFound++; questEvent('gem', 1);
      flyTo('gem', it.x, it.y, p.x, p.y - 34, { dur: 0.26 }); starBurst(p.x, p.y - 34, 5, ['#b8fff6', '#6ee0d8'], 140);
      float(p.x, p.y - 50, '💎 +1', '#6ee0d8', true); sfx('gem', true, chainPitch());
    } else if (p.helmets.length < cap()) {
      it.dead = true;
      p.helmets.push(cloneEntry(it));
      flyTo('item', it.x, it.y, p.x, p.y - 34, { entry: it, dur: 0.2, arc: 18 });
      sfx('pick', false, chainPitch());
      if (p.helmets.length >= cap()) float(p.x, p.y - 60, 'FULL! Go sell →', '#ffd94a', true);
    }
  }

  // -- sell stand
  if (p.helmets.length && dist2(p.x, p.y, SELL.x, SELL.y) < SELL.r * SELL.r) {
    p.sellAcc = (p.sellAcc || 0) + dt * SELL_RATE;
    while (p.sellAcc >= 1 && p.helmets.length) {
      p.sellAcc -= 1;
      const e = p.helmets.pop();
      const v = entryVal(e);
      S.pallet += v; S.stats.sold++; S.stats.earned += v;
      questEvent('sell', 1); questEvent('earn', v);
      float(SELL.x + 30, SELL.y - 46, '+' + fmt(v), e.crown ? '#ffd94a' : e.bar ? '#e8b93a' : '#ffd94a', e.crown);
      flyTo('item', p.x, p.y - 30, SELL.x, SELL.y - 24, { entry: e, dur: 0.26, arc: 44 });
      flyTo('coin', SELL.x, SELL.y - 24, PALLET.x + (mrnd() - 0.5) * 40, PALLET.y - 16, { delay: 0.2, dur: 0.34, arc: 70 });
      puff(PALLET.x, PALLET.y - 30, '#ffd94a', 3, true);
      sfx('sell', false, chainPitch());
    }
  } else p.sellAcc = 0;

  // -- forge chain
  if (S.forge) {
    const f = S.forge;
    if (dist2(p.x, p.y, FORGE.x, FORGE.y) < FORGE.r * FORGE.r && f.queue.length < forgeQ()) {
      p.forgeAcc = (p.forgeAcc || 0) + dt * SELL_RATE;
      while (p.forgeAcc >= 1 && f.queue.length < forgeQ()) {
        p.forgeAcc -= 1;
        // the forge ONLY smelts raw helmets (shields) — not bars, crowns, logs, ore, produce…
        let idx = -1;
        for (let i = p.helmets.length - 1; i >= 0; i--) if (entryRes(p.helmets[i]) === 'helm') { idx = i; break; }
        if (idx < 0) break;
        f.queue.push(p.helmets.splice(idx, 1)[0].k);
        sfx('smelt');
      }
    } else p.forgeAcc = 0;
    if (f.queue.length && f.tray.length < trayMax()) {
      f.smeltT += dt * jobBoost('forge') * forgeSpeed();
      if (f.smeltT >= FORGE_T) {
        f.smeltT = 0;
        const bk = f.queue.shift();
        f.tray.push(bk);
        questEvent('bar', 1);
        const m = metal(bk);
        float(TRAY.x, TRAY.y - 30, m.name + ' bar', m.col);
        puff(TRAY.x, TRAY.y - 10, m.col, 5, true);
        sfx('smelt');
      }
    } else f.smeltT = 0;
    if (f.tray.length && p.helmets.length < cap() && dist2(p.x, p.y, TRAY.x, TRAY.y) < TRAY.r * TRAY.r) {
      p.trayAcc = (p.trayAcc || 0) + dt * SELL_RATE;
      while (p.trayAcc >= 1 && f.tray.length && p.helmets.length < cap()) {
        p.trayAcc -= 1;
        p.helmets.push({ k: f.tray.pop(), bar: true });
        sfx('pick');
      }
    } else p.trayAcc = 0;
  }

  // -- industry district: production chains + hand-feeding
  if (S.district) {
    const D = S.district, fk = S.zones.length;
    // grove: two woodcutters chop logs
    if (D.plates.grove.built && D.grove.logs.length < PILE_MAX) {
      D.grove.t += dt * jobBoost('ind');
      if (D.grove.t >= GROVE_T) { D.grove.t = 0; D.grove.logs.push(fk); puff(DIST.grove.x - 40, DIST.grove.y - 20, '#8a5c30', 3, true); }
    }
    // quarry: miner chips stones
    if (D.plates.quarry.built && D.quarry.stones.length < PILE_MAX) {
      D.quarry.t += dt * jobBoost('ind');
      if (D.quarry.t >= QUARRY_T) { D.quarry.t = 0; D.quarry.stones.push(fk); puff(DIST.quarry.x + 30, DIST.quarry.y - 20, '#9aa0a8', 3, true); }
    }
    // sawmill: 2 logs → 1 plank
    if (D.plates.saw.built && D.saw.ks.length >= 2 && D.saw.tray.length < TRAY12) {
      D.saw.t += dt * jobBoost('ind');
      if (D.saw.t >= SAW_T) { D.saw.t = 0; const a = D.saw.ks.shift(), b = D.saw.ks.shift(); D.saw.tray.push(Math.max(a, b)); puff(DIST.sawTray.x, DIST.sawTray.y - 10, '#d9b98a', 4, true); sfx('smelt'); }
    } else if (!(D.saw.ks.length >= 2)) D.saw.t = 0;
    // toolmaker: 1 plank + 2 stones → 1 tool
    if (D.plates.tool.built && D.tool.wood.length >= 1 && D.tool.stone.length >= 2 && D.tool.tray.length < TOOLTRAY_MAX) {
      D.tool.t += dt * jobBoost('ind');
      if (D.tool.t >= TOOL_T) {
        D.tool.t = 0;
        D.tool.wood.shift(); D.tool.stone.shift(); D.tool.stone.shift();
        D.tool.tray.push(fk);
        questEvent('tool', 1); questEvent('craft', 1); S.stats.crafted = (S.stats.crafted || 0) + 1;
        puff(DIST.toolTray.x, DIST.toolTray.y - 10, '#ffd94a', 5, true); sfx('built');
      }
    } else if (!(D.tool.wood.length >= 1 && D.tool.stone.length >= 2)) D.tool.t = 0;
    // station purchase plates
    for (const id in D.plates) {
      const pl = D.plates[id];
      if (pl.built) continue;
      const pos = DIST[id === 'grove' ? 'grove' : id === 'quarry' ? 'quarry' : id === 'saw' ? 'saw' : id === 'tool' ? 'tool' : id];
      if (dist2(p.x, p.y, pos.x, pos.y) < 60 * 60) {
        pourHub(pl, dt, () => {
          float(pos.x, pos.y - 50, id.toUpperCase() + ' BUILT!', '#6ecb5a', true);
          if (id === 'hauler') spawnHauler();
          if (id === 'trader') spawnTrader();
        });
      }
    }
    // hand interactions
    const take = (arr, mk) => { // pile → back stack
      if (arr.length && p.helmets.length < cap()) {
        p.hAcc = (p.hAcc || 0) + dt * SELL_RATE;
        while (p.hAcc >= 1 && arr.length && p.helmets.length < cap()) { p.hAcc -= 1; p.helmets.push(mk(arr.pop())); sfx('pick'); }
      }
    };
    if (D.plates.grove.built && dist2(p.x, p.y, DIST.grove.x, DIST.grove.y) < DIST.grove.r * DIST.grove.r)
      take(D.grove.logs, k => { questEvent('log', 1); return { k, log: true }; });
    if (D.plates.quarry.built && dist2(p.x, p.y, DIST.quarry.x, DIST.quarry.y) < DIST.quarry.r * DIST.quarry.r)
      take(D.quarry.stones, k => ({ k, stone: true }));
    if (D.plates.saw.built && dist2(p.x, p.y, DIST.saw.x, DIST.saw.y) < DIST.saw.r * DIST.saw.r && D.saw.ks.length < SAW_IN_MAX) {
      p.sawAcc = (p.sawAcc || 0) + dt * SELL_RATE;
      while (p.sawAcc >= 1 && D.saw.ks.length < SAW_IN_MAX) {
        p.sawAcc -= 1;
        const i = p.helmets.map(e => !!e.log).lastIndexOf(true);
        if (i < 0) break;
        D.saw.ks.push(p.helmets.splice(i, 1)[0].k); sfx('smelt');
      }
    } else p.sawAcc = 0;
    if (D.plates.saw.built && dist2(p.x, p.y, DIST.sawTray.x, DIST.sawTray.y) < DIST.sawTray.r * DIST.sawTray.r)
      take(D.saw.tray, k => ({ k, plank: true }));
    if (D.plates.tool.built && dist2(p.x, p.y, DIST.tool.x, DIST.tool.y) < DIST.tool.r * DIST.tool.r) {
      p.toolAcc = (p.toolAcc || 0) + dt * SELL_RATE;
      while (p.toolAcc >= 1) {
        p.toolAcc -= 1;
        let i = D.tool.wood.length < TOOL_IN ? p.helmets.map(e => !!e.plank).lastIndexOf(true) : -1;
        if (i >= 0) { D.tool.wood.push(p.helmets.splice(i, 1)[0].k); sfx('smelt'); continue; }
        i = D.tool.stone.length < TOOL_IN ? p.helmets.map(e => !!e.stone).lastIndexOf(true) : -1;
        if (i >= 0) { D.tool.stone.push(p.helmets.splice(i, 1)[0].k); sfx('smelt'); continue; }
        break;
      }
    } else p.toolAcc = 0;
    if (D.plates.tool.built && dist2(p.x, p.y, DIST.toolTray.x, DIST.toolTray.y) < DIST.toolTray.r * DIST.toolTray.r)
      take(D.tool.tray, k => ({ k, tool: true }));
    // hauler NPC: keeps the chain fed (grove→saw, quarry→tool, sawTray→tool)
    const H = D.haulerNpc;
    if (H) {
      const jobs = [];
      if (D.plates.saw.built && D.saw.ks.length < SAW_IN_MAX - 3 && D.grove.logs.length) jobs.push({ from: DIST.grove, to: DIST.saw, src: D.grove.logs, put: k => D.saw.ks.push(k), kind: 'log' });
      if (D.plates.tool.built && D.tool.stone.length < TOOL_IN - 3 && D.quarry.stones.length) jobs.push({ from: DIST.quarry, to: DIST.tool, src: D.quarry.stones, put: k => D.tool.stone.push(k), kind: 'stone' });
      if (D.plates.tool.built && D.tool.wood.length < TOOL_IN - 3 && D.saw.tray.length) jobs.push({ from: DIST.sawTray, to: DIST.tool, src: D.saw.tray, put: k => D.tool.wood.push(k), kind: 'plank' });
      if (H.state === 'idle') {
        if (jobs.length) { H.job = jobs[0]; H.state = 'pick'; }
        else { const dl = Math.hypot(DIST.hauler.x - H.x, DIST.hauler.y - H.y); if (dl > 12) { H.x += (DIST.hauler.x - H.x) / dl * PORTER_SPD * 0.6 * dt; H.y += (DIST.hauler.y - H.y) / dl * PORTER_SPD * 0.6 * dt; } }
      } else if (H.state === 'pick') {
        const dl = Math.hypot(H.job.from.x - H.x, H.job.from.y - H.y) || 1;
        H.x += (H.job.from.x - H.x) / dl * PORTER_SPD * dt; H.y += (H.job.from.y - H.y) / dl * PORTER_SPD * dt;
        if (dl < 30) {
          H.carry = [];
          while (H.carry.length < 4 && H.job.src.length) H.carry.push(H.job.src.pop());
          H.state = H.carry.length ? 'drop' : 'idle';
        }
      } else { // drop
        const dl = Math.hypot(H.job.to.x - H.x, H.job.to.y - H.y) || 1;
        H.x += (H.job.to.x - H.x) / dl * PORTER_SPD * dt; H.y += (H.job.to.y - H.y) / dl * PORTER_SPD * dt;
        if (dl < 30) { for (const k of H.carry) H.job.put(k); H.carry = []; H.state = 'idle'; }
      }
    }
    // trader NPC: sells finished goods at the hub sell stand
    const T = D.traderNpc;
    if (T) {
      if (T.state === 'idle') {
        const src = D.tool.tray.length ? { arr: D.tool.tray, mk: k => ({ k, tool: true }), at: DIST.toolTray }
          : (!D.plates.tool.built && D.saw.tray.length >= 4 ? { arr: D.saw.tray, mk: k => ({ k, plank: true }), at: DIST.sawTray } : null);
        if (src) { T.src = src; T.state = 'pick'; }
        else { const dl = Math.hypot(DIST.trader.x - T.x, DIST.trader.y - T.y); if (dl > 12) { T.x += (DIST.trader.x - T.x) / dl * PORTER_SPD * 0.6 * dt; T.y += (DIST.trader.y - T.y) / dl * PORTER_SPD * 0.6 * dt; } }
      } else if (T.state === 'pick') {
        const dl = Math.hypot(T.src.at.x - T.x, T.src.at.y - T.y) || 1;
        T.x += (T.src.at.x - T.x) / dl * PORTER_SPD * dt; T.y += (T.src.at.y - T.y) / dl * PORTER_SPD * dt;
        if (dl < 30) {
          T.carry = [];
          while (T.carry.length < 6 && T.src.arr.length) T.carry.push(T.src.mk(T.src.arr.pop()));
          T.state = T.carry.length ? 'sell' : 'idle';
        }
      } else {
        const dl = Math.hypot(SELL.x - T.x, SELL.y - T.y) || 1;
        T.x += (SELL.x - T.x) / dl * PORTER_SPD * dt; T.y += (SELL.y - T.y) / dl * PORTER_SPD * dt;
        if (dl < 46) {
          T.cd = (T.cd || 0) - dt;
          if (T.cd <= 0 && T.carry.length) {
            T.cd = 0.15;
            const v = entryVal(T.carry.pop());
            S.pallet += v; S.stats.earned += v; S.stats.sold++;
            questEvent('sell', 1); questEvent('earn', v);
            coinToPallet(1);
          }
          if (!T.carry.length) T.state = 'idle';
        }
      }
    }
  }
  // district purchase plate (at zone 1's south edge)
  if (!S.distPlate.built && S.zones.length >= 2 && dist2(p.x, p.y, DIST.plate.x, DIST.plate.y) < 56 * 56)
    pourHub(S.distPlate, dt, () => { initDistrict(); float(DIST.plate.x, DIST.plate.y - 50, '🏭 INDUSTRY DISTRICT OPEN — head southeast!', '#ffd94a', true); });

  // -- expansion districts (farmlands / deep mines)
  for (const dk in D2CFG) {
    const cfg = D2CFG[dk];
    if (!S.d2Plate[dk].built) {
      if (S.zones.length >= cfg.need && dist2(p.x, p.y, cfg.plate.x, cfg.plate.y) < 56 * 56)
        pourHub(S.d2Plate[dk], dt, () => { initD2(dk); float(cfg.plate.x, cfg.plate.y - 50, cfg.icon + ' ' + cfg.name + ' OPEN!', '#ffd94a', true); });
      continue;
    }
    const d = S.d2[dk], fk = S.zones.length;
    // producers grow their piles
    for (const pr of cfg.producers) {
      const pile = d.piles[pr.id];
      if (d.plates[pr.id].built && pile.arr.length < PILE_MAX) {
        pile.t += dt * jobBoost(dk);
        if (pile.t >= pr.t) { pile.t = 0; pile.arr.push(fk); }
      }
    }
    // crafters combine recipes
    for (const cr of cfg.crafters) {
      const c = d.crafts[cr.id];
      const ready = d.plates[cr.id].built && c.tray.length < TRAY12 && Object.keys(cr.recipe).every(r => c.in[r].length >= cr.recipe[r]);
      if (ready) {
        c.t += dt * jobBoost(dk);
        if (c.t >= cr.t) {
          c.t = 0;
          for (const r in cr.recipe) for (let i = 0; i < cr.recipe[r]; i++) c.in[r].shift();
          c.tray.push(fk);
          questEvent('craft', 1); S.stats.crafted = (S.stats.crafted || 0) + 1;
          puff(cr.trayPos.x, cr.trayPos.y - 10, '#ffd94a', 4, true); sfx('smelt');
        }
      } else c.t = 0;
    }
    // station purchase plates
    for (const id in d.plates) {
      const pl = d.plates[id];
      if (pl.built) continue;
      const pos = id === 'hauler' ? cfg.hauler : id === 'trader' ? cfg.trader
        : (cfg.producers.find(q => q.id === id) || {}).pos || cfg.crafters.find(q => q.id === id).pos;
      if (dist2(p.x, p.y, pos.x, pos.y) < 60 * 60)
        pourHub(pl, dt, () => {
          float(pos.x, pos.y - 50, 'BUILT!', '#6ecb5a', true);
          if (id === 'hauler') spawnD2Hauler(dk);
          if (id === 'trader') spawnD2Trader(dk);
        });
    }
    // hand interactions: piles → stack, stack → crafter inputs, trays → stack
    for (const pr of cfg.producers) {
      if (!d.plates[pr.id].built) continue;
      const pile = d.piles[pr.id];
      if (pile.arr.length && p.helmets.length < cap() && dist2(p.x, p.y, pr.pos.x, pr.pos.y) < pr.pos.r * pr.pos.r) {
        p.hAcc = (p.hAcc || 0) + dt * SELL_RATE;
        while (p.hAcc >= 1 && pile.arr.length && p.helmets.length < cap()) { p.hAcc -= 1; p.helmets.push({ k: pile.arr.pop(), res: pr.out }); sfx('pick'); }
      }
    }
    for (const cr of cfg.crafters) {
      if (!d.plates[cr.id].built) continue;
      const c = d.crafts[cr.id];
      if (dist2(p.x, p.y, cr.pos.x, cr.pos.y) < cr.pos.r * cr.pos.r) {
        p.cAcc = (p.cAcc || 0) + dt * SELL_RATE;
        while (p.cAcc >= 1) {
          p.cAcc -= 1;
          let fed = false;
          for (const r in cr.recipe) {
            if (c.in[r].length >= TOOL_IN) continue;
            const i = p.helmets.map(e => entryRes(e) === r).lastIndexOf(true);
            if (i >= 0) { c.in[r].push(p.helmets.splice(i, 1)[0].k); sfx('smelt'); fed = true; break; }
          }
          if (!fed) break;
        }
      }
      if (c.tray.length && p.helmets.length < cap() && dist2(p.x, p.y, cr.trayPos.x, cr.trayPos.y) < cr.trayPos.r * cr.trayPos.r) {
        p.hAcc = (p.hAcc || 0) + dt * SELL_RATE;
        while (p.hAcc >= 1 && c.tray.length && p.helmets.length < cap()) { p.hAcc -= 1; p.helmets.push({ k: c.tray.pop(), res: cr.out }); sfx('pick'); }
      }
    }
    // hauler NPC: feed crafters from piles/trays (incl. cross-district planks)
    const H = d.haulerNpc;
    if (H) {
      if (H.state === 'idle') {
        let job = null;
        for (const cr of cfg.crafters) {
          if (!d.plates[cr.id].built) continue;
          for (const r in cr.recipe) {
            if (d.crafts[cr.id].in[r].length >= TOOL_IN - 3) continue;
            const srcs = d2Sources(dk, r);
            if (srcs.length) { job = { from: srcs[0], to: cr.pos, put: k => d.crafts[cr.id].in[r].push(k), res: r }; break; }
          }
          if (job) break;
        }
        if (job) { H.job = job; H.state = 'pick'; }
        else { const dl = Math.hypot(cfg.hauler.x - H.x, cfg.hauler.y - H.y); if (dl > 12) { H.x += (cfg.hauler.x - H.x) / dl * PORTER_SPD * 0.6 * dt; H.y += (cfg.hauler.y - H.y) / dl * PORTER_SPD * 0.6 * dt; } }
      } else if (H.state === 'pick') {
        const dl = Math.hypot(H.job.from.at.x - H.x, H.job.from.at.y - H.y) || 1;
        H.x += (H.job.from.at.x - H.x) / dl * PORTER_SPD * dt; H.y += (H.job.from.at.y - H.y) / dl * PORTER_SPD * dt;
        if (dl < 30) {
          H.carry = [];
          while (H.carry.length < 4 && H.job.from.arr.length) H.carry.push(H.job.from.arr.pop());
          H.state = H.carry.length ? 'drop' : 'idle';
        }
      } else {
        const dl = Math.hypot(H.job.to.x - H.x, H.job.to.y - H.y) || 1;
        H.x += (H.job.to.x - H.x) / dl * PORTER_SPD * dt; H.y += (H.job.to.y - H.y) / dl * PORTER_SPD * dt;
        if (dl < 30) { for (const k of H.carry) H.job.put(k); H.carry = []; H.state = 'idle'; }
      }
    }
    // trader NPC: sell the final product (or the first tray while the last crafter is unbuilt)
    const T = d.traderNpc;
    if (T) {
      if (T.state === 'idle') {
        const last = cfg.crafters[1], first = cfg.crafters[0];
        const src = d.crafts[last.id].tray.length ? { at: last.trayPos, arr: d.crafts[last.id].tray, res: last.out }
          : (!d.plates[last.id].built && d.crafts[first.id].tray.length >= 4 ? { at: first.trayPos, arr: d.crafts[first.id].tray, res: first.out } : null);
        if (src) { T.src = src; T.state = 'pick'; }
        else { const dl = Math.hypot(cfg.trader.x - T.x, cfg.trader.y - T.y); if (dl > 12) { T.x += (cfg.trader.x - T.x) / dl * PORTER_SPD * 0.6 * dt; T.y += (cfg.trader.y - T.y) / dl * PORTER_SPD * 0.6 * dt; } }
      } else if (T.state === 'pick') {
        const dl = Math.hypot(T.src.at.x - T.x, T.src.at.y - T.y) || 1;
        T.x += (T.src.at.x - T.x) / dl * PORTER_SPD * dt; T.y += (T.src.at.y - T.y) / dl * PORTER_SPD * dt;
        if (dl < 30) {
          T.carry = [];
          while (T.carry.length < 6 && T.src.arr.length) T.carry.push({ k: T.src.arr.pop(), res: T.src.res });
          T.state = T.carry.length ? 'sell' : 'idle';
        }
      } else {
        const dl = Math.hypot(SELL.x - T.x, SELL.y - T.y) || 1;
        T.x += (SELL.x - T.x) / dl * PORTER_SPD * dt; T.y += (SELL.y - T.y) / dl * PORTER_SPD * dt;
        if (dl < 46) {
          T.cd = (T.cd || 0) - dt;
          if (T.cd <= 0 && T.carry.length) {
            T.cd = 0.15;
            const v = entryVal(T.carry.pop());
            S.pallet += v; S.stats.earned += v; S.stats.sold++;
            questEvent('sell', 1); questEvent('earn', v);
            coinToPallet(1);
          }
          if (!T.carry.length) T.state = 'idle';
        }
      }
    }
  }

  // -- vacuum coins from pallet (flow ramps up the longer you stand)
  if (S.pallet > 0 && dist2(p.x, p.y, PALLET.x, PALLET.y) < PALLET.r * PALLET.r) {
    touchFlow('pallet', dt);
    // the flow multiplier accelerates exponentially (now uncapped up to ~millions/s),
    // so standing on a huge pile drains it fully in a few seconds
    const take = Math.min(S.pallet, Math.max(1, Math.ceil(VAC_RATE * flowMul() * dt)));
    S.pallet -= take; S.wallet += take;
    if ((S.coinFxT = (S.coinFxT || 0) + dt) > 0.09) {
      S.coinFxT = 0; float(p.x, p.y - 46, '+' + fmt(take), '#ffd94a'); sfx('coin', false, 1 + Math.min(1, Math.log2(flowMul()) * 0.08));
      const nc = Math.min(6, 1 + Math.floor(Math.log2(Math.max(1, flowMul()))));
      for (let i = 0; i < nc; i++) flyTo('coin', PALLET.x + (mrnd() - 0.5) * 70, PALLET.y - 14, p.x, p.y - 32, { delay: i * 0.025, dur: 0.32, arc: 50 });
      S.parts.push({ x: PALLET.x + (rnd() - 0.5) * 60, y: PALLET.y - 10, vx: (p.x - PALLET.x) * 2, vy: (p.y - 40 - PALLET.y) * 2, t: 0, dur: 0.5, r: 4, color: '#ffd94a' });
    }
  }

  // -- coin upgrade plates (hub)
  let ux = UPG_X0;
  for (const key in UPG) {
    const cost = upgCost(key, S.up[key]);
    if (dist2(p.x, p.y, ux, UPG_Y) < 52 * 52 && S.wallet > 0 && S.upPaid[key] < cost) {
      touchFlow('upg:' + key, dt);
      const chunk = Math.min(S.wallet, Math.ceil(BUILD_RATE * flowMul() * dt), cost - S.upPaid[key]);
      S.wallet -= chunk; S.upPaid[key] += chunk; sfx('pour'); pourFx(dt);
      if (S.upPaid[key] >= cost) {
        S.up[key]++; S.upPaid[key] = 0;
        float(ux, UPG_Y - 50, UPG[key].name + ' LV' + (S.up[key] + 1) + '!', '#6ecb5a', true);
        sfx('built', true); buzz(40);
      }
    }
    ux += UPG_STEP;
  }

  // -- gem shrine plates (hub, paid in gems)
  let gy = GEM_Y0;
  for (const key in GEMU) {
    const cost = gemUpCost(key, S.gemUp[key]);
    if (dist2(p.x, p.y, GEM_X, gy) < 46 * 46 && S.gems > 0 && S.gemPaid[key] < cost) {
      S.gemAcc = (S.gemAcc || 0) + dt * 3;
      while (S.gemAcc >= 1 && S.gems > 0 && S.gemPaid[key] < cost) {
        S.gemAcc -= 1; S.gems--; S.gemPaid[key]++;
        sfx('gem');
        if (S.gemPaid[key] >= cost) {
          S.gemUp[key]++; S.gemPaid[key] = 0;
          float(GEM_X, gy - 60, GEMU[key].name + ' LV' + S.gemUp[key] + '!', '#6ee0d8', true);
          sfx('built', true); buzz(40);
        }
      }
    }
    gy += GEM_STEP;
  }

  // -- hub build plates: forge + waygate + kennel
  if (!S.forgePlate.built && dist2(p.x, p.y, FORGE.x, FORGE.y) < 56 * 56)
    pourHub(S.forgePlate, dt, () => { S.forge = { queue: [], tray: [], smeltT: 0 }; float(FORGE.x, FORGE.y - 50, 'SMELTER BUILT! Shields → metal bars (x' + BAR_MUL + ') — porters feed it', '#6ecb5a', true); });
  // smeltery upgrades: faster smelting + bigger queue/tray per level
  if (S.forgePlate.built && (S.forgeLvl || 0) < FORGE_LVL_MAX && dist2(p.x, p.y, FUP.x, FUP.y) < FUP.r * FUP.r)
    pourHub(S.forgeUpPlate, dt, () => {
      S.forgeLvl = (S.forgeLvl || 0) + 1;
      S.forgeUpPlate = { cost: forgeUpCost(), paid: 0, built: false };
      float(FUP.x, FUP.y - 50, '⚒ SMELTER LV' + (S.forgeLvl + 1) + '! Faster + bigger', '#6ecb5a', true);
      S.shake = Math.max(S.shake, 6);
    });
  if (!S.wayPlate.built && S.zones.length >= 2 && dist2(p.x, p.y, HUBPAD.x, HUBPAD.y) < 56 * 56)
    pourHub(S.wayPlate, dt, () => { S.waygate = true; float(HUBPAD.x, HUBPAD.y - 50, 'WAYGATE OPEN! Stand still on it to warp', '#6ec9e0', true); });
  if (!S.dogPlate.built && S.zones.length >= 2 && dist2(p.x, p.y, KENNEL.x, KENNEL.y) < 56 * 56)
    pourHub(S.dogPlate, dt, () => { spawnDog(); float(KENNEL.x, KENNEL.y - 50, '🐕 WAR DOG! He fetches drops for you', '#6ecb5a', true); });
  if (!S.campPlate.built && S.zones.length >= 2 && dist2(p.x, p.y, CAMP.x, CAMP.y) < 56 * 56)
    pourHub(S.campPlate, dt, () => { S.camp = { logs: [], chopT: 0 }; float(CAMP.x, CAMP.y - 50, '🪵 LUMBER CAMP! Logs pile up on their own', '#6ecb5a', true); });

  // -- lumber camp: woodcutter chops, logs pile, player hauls them
  if (S.camp) {
    if (S.camp.logs.length < CAMP_MAX) {
      S.camp.chopT += dt * jobBoost('camp');
      if (S.camp.chopT >= CHOP_T) {
        S.camp.chopT = 0;
        S.camp.logs.push(S.zones.length); // log value tracks your frontier
        puff(CAMP.x - 30, CAMP.y - 20, '#8a5c30', 4, true);
        sfx('smelt');
      }
    }
    if (S.camp.logs.length && p.helmets.length < cap() && dist2(p.x, p.y, CAMP.x, CAMP.y) < CAMP.r * CAMP.r) {
      p.campAcc = (p.campAcc || 0) + dt * SELL_RATE;
      while (p.campAcc >= 1 && S.camp.logs.length && p.helmets.length < cap()) {

        p.helmets.push({ k: S.camp.logs.pop(), log: true });
        questEvent('log', 1);
        sfx('pick');
      }
    } else p.campAcc = 0;
  }

  // -- war dog
  dogTick(dt);

  // -- New Kingdom monument (prestige)
  if (S.zones.length >= PRESTIGE_MIN && dist2(p.x, p.y, MONU.x, MONU.y) < MONU.r * MONU.r && !p.moving) {
    S.prestT += dt;
    if (S.prestT >= PREST_T) { S.prestT = 0; prestige(); }
  } else S.prestT = 0;

  // -- wandering treasure chest
  if (!S.chest) {
    S.chestCd -= dt;
    if (S.chestCd <= 0) spawnChest();
  } else if (dist2(p.x, p.y, S.chest.x, S.chest.y) < 60 * 60) {
    S.wallet += S.chest.val;
    float(S.chest.x, S.chest.y - 40, '💰 +' + fmt(S.chest.val) + '¢', '#ffd94a', true);
    if (S.chest.gem) { S.gems++; S.stats.gemsFound++; questEvent('gem', 1); float(S.chest.x, S.chest.y - 66, '💎 +1', '#6ee0d8', true); }
    for (let i = 0; i < 16; i++) puff(S.chest.x, S.chest.y, '#ffd94a', 1, true);
    S.stats.chests = (S.stats.chests || 0) + 1;
    questEvent('chest', 1);
    sfx('unlock', true); buzz([30, 20, 50]);
    S.chest = null; S.chestCd = CHEST_CD * (0.8 + rnd() * 0.5);
  }

  // -- wandering merchant
  if (!S.merchant) {
    S.merchantCd -= dt;
    if (S.merchantCd <= 0) spawnMerchant();
  } else {
    S.merchant.t += dt; S.merchant.stay -= dt;
    if (S.merchant.stay <= 0) merchantLeaves('🛒 The merchant moves on…');
  }

  // -- elite champions: promote a foe now and then (isolated mrnd, one at a time)
  if (!S.enemies.some(e => e.elite && e.hp > 0)) {
    S.eliteCd = (S.eliteCd || 0) - dt;
    if (S.eliteCd <= 0) { S.eliteCd = ELITE_CD * (0.7 + mrnd() * 0.6); promoteElite(); }
  }

  // -- quests housekeeping: keep 3 side quests rolling, roll dailies at midnight
  while (S.quests.length < 3) S.quests.push(rollQuest());
  for (let i = 0; i < S.quests.length; i++) {
    const q = S.quests[i];
    if (q.done) { q.doneT += dt; if (q.doneT > 2.5) S.quests[i] = rollQuest(); }
  }
  S.dayCd = (S.dayCd || 0) - dt;
  if (S.dayCd <= 0) { S.dayCd = 30; if (S.dailyDay !== dayStr(0)) rollDailies(); checkLogin(); }
  if (S.goldPulse > 0) S.goldPulse -= dt;

  // -- ambient butterflies
  while (S.amb.length < 10) S.amb.push({ x: p.x + (rnd() - 0.5) * 800, y: p.y + (rnd() - 0.5) * 800, a: rnd() * 6.28, ph: rnd() * 6.28, col: rnd() < 0.5 ? '#fff8c0' : '#ffd94a' });
  for (const b of S.amb) {
    b.a += (rnd() - 0.5) * 3 * dt; b.ph += dt * 14;
    b.x += Math.cos(b.a) * 30 * dt; b.y += Math.sin(b.a) * 22 * dt + Math.sin(b.ph) * 8 * dt;
    if (dist2(b.x, b.y, p.x, p.y) > 1100 * 1100) { b.x = p.x + (rnd() - 0.5) * 800; b.y = p.y + (rnd() - 0.5) * 800; }
  }

  // -- golden boon: a shiny drifts across the screen; tap it for a random buff
  if (S.boon) {
    S.boon.x += S.boon.vx * dt; S.boon.t += dt;
    if (S.boon.x < -60 || S.boon.x > vw + 60 || S.boon.t > 14) S.boon = null;
  } else {
    S.boonT -= dt;
    if (S.boonT <= 0) {
      S.boonT = BOON_MIN + rnd() * (BOON_MAX - BOON_MIN);
      const fromLeft = rnd() < 0.5;
      S.boon = { x: fromLeft ? -40 : vw + 40, y: 120 + rnd() * (vh - 300), vx: (fromLeft ? 1 : -1) * (90 + rnd() * 60), t: 0, bob: rnd() * 6.28 };
    }
  }

  // -- milestones + toasts
  S.achCd -= dt;
  if (S.achCd <= 0) { S.achCd = 0.5; checkAch(); checkRankUp(); }
  for (const to of S.toasts) to.t += dt;
  compact(S.toasts, keepToast);

  // -- zone build plates + boss altars
  for (const z of S.zones) {
    for (const pl of z.plates) {
      if (pl.built) continue;
      if (pl.id === 'unlock' && z.k < S.zones.length) continue;
      if (dist2(p.x, p.y, pl.x, pl.y) < 56 * 56) pourInto(pl, z, dt);
    }
    if (z.altar) {
      z.altar.cd = Math.max(0, z.altar.cd - dt);

    }
  }

  // -- zone spawners (per-land foe buckets: one pass instead of a scan per zone)
  rebuildFoeBuckets();
  for (const z of S.zones) {
    const bkt = FOE_BUCKETS.get(z.k);
    z.spawnCd -= dt;
    if (z.spawnCd <= 0 && (bkt ? bkt.nb : 0) < maxAlive(z)) {
      z.spawnCd = spawnInt(z); spawnEnemy(z);
      const ne = S.enemies[S.enemies.length - 1], b2 = foeBucket(ne.k);
      b2.push(ne); if (!ne.boss) b2.nb++; // keep the bucket live for this tick's towers
    }
  }

  // -- enemies (behavior varies by archetype)
  for (const e of S.enemies) {
    if (e.hp <= 0) continue;
    e.hurt = Math.max(0, e.hurt - dt);
    const z = S.zones[e.k - 1];
    const aggroR = e.boss ? 1200 : e.arch === 'spitter' ? 360 : 220;
    const pd2 = dist2(e.x, e.y, p.x, p.y);
    const nearPlayer = pd2 < aggroR * aggroR && inCell(z, p.x, p.y, 60);
    const spdMul = e.arch === 'fast' ? 1.55 : e.arch === 'tank' ? 0.7 : 1;
    let tx = e.tx, ty = e.ty, spd = (e.boss ? e.spd : 42) * spdMul;
    if (nearPlayer) {
      if (e.arch === 'spitter') {

        const near = e.boss ? 280 : 190, far = e.boss ? 440 : 300, range = e.boss ? 560 : 320;
        if (pd2 < near * near) { tx = e.x + (e.x - p.x); ty = e.y + (e.y - p.y); }
        else if (pd2 < far * far) { tx = e.x; ty = e.y; }
        else { tx = p.x; ty = p.y; }
        spd = (e.boss ? e.spd : 52) * spdMul;
        e.atkCd -= dt;
        if (e.atkCd <= 0 && pd2 < range * range) {
          e.atkCd = e.boss ? 1.1 : 1.6;
          const sl = Math.sqrt(pd2) || 1;
          const bvx = (p.x - e.x) / sl, bvy = (p.y - 10 - e.y) / sl;
          const shots = e.boss ? 3 : 1;
          for (let s = 0; s < shots; s++) {
            const a = (s - (shots - 1) / 2) * 0.3, ca = Math.cos(a), sa = Math.sin(a);
            S.eshots.push({ x: e.x, y: e.y - 10, vx: (bvx * ca - bvy * sa) * 320, vy: (bvx * sa + bvy * ca) * 320, dmg: e.dmg * (e.boss ? 0.6 : 1), k: e.k, life: 0, big: e.boss });
          }
          sfx('shoot');
        }
      } else { tx = p.x; ty = p.y; spd = (e.boss ? e.spd : 62 + e.k * 2) * spdMul; }
    } else {
      e.wanderT -= dt;
      if (e.wanderT <= 0) { e.wanderT = 1.5 + rnd() * 2.5; e.tx = z.pen.x0 + rnd() * (z.pen.x1 - z.pen.x0); e.ty = z.pen.y0 + rnd() * (z.pen.y1 - z.pen.y0); }
    }
    const dx = tx - e.x, dy = ty - e.y, dl = Math.hypot(dx, dy) || 1;
    if (dl > 30) { e.x += dx / dl * spd * dt; e.y += dy / dl * spd * dt; }
    e.x = Math.max(z.pen.x0, Math.min(z.pen.x1, e.x));
    e.y = Math.max(z.pen.y0, Math.min(z.pen.y1, e.y));
    if (e.arch !== 'spitter') { // spitters (incl. bosses) attack only at range
      e.atkCd -= dt;
      if (e.atkCd <= 0 && dist2(e.x, e.y, p.x, p.y) < (e.r + 22) * (e.r + 22)) {
        e.atkCd = 0.85; hurtPlayer(e.dmg, e);
      }
    }
  }
  compact(S.enemies, keepAliveFoe);

  // -- hostile projectiles (spitters)
  for (const es of S.eshots) {
    es.life += dt;
    es.x += es.vx * dt; es.y += es.vy * dt;
    if (dist2(es.x, es.y, p.x, p.y - 10) < 22 * 22) { es.done = true; hurtPlayer(es.dmg); }
    if (es.life > 2.2) es.done = true;
  }
  compact(S.eshots, keepNotDone);

  // -- towers
  for (const z of S.zones) {
    const rateMul = z.drums ? DRUM_MUL : 1;
    const dmgBase = towerDmg(z.k) * towerMul(z);
    for (const tw of z.towers) {
      tw.cd -= dt;
      if (tw.cd > 0) continue;
      const foes = foeBucket(z.k); // enemies never leave their land's pen
      if (tw.type === 'archer') {
        let tgt = null, bd = TOWER_RANGE * TOWER_RANGE;
        for (const e of foes) { if (e.hp <= 0) continue; const d = dist2(e.x, e.y, tw.x, tw.y); if (d < bd) { bd = d; tgt = e; } }
        if (tgt) { tw.cd = TOWER_RATE * rateMul; S.shots.push({ x: tw.x, y: tw.y - 52, tgt, dmg: dmgBase, spd: 430 }); }
      } else if (tw.type === 'wizard') {
        let tgt = null, bd = TOWER_RANGE * TOWER_RANGE;
        for (const e of foes) { if (e.hp <= 0) continue; const d = dist2(e.x, e.y, tw.x, tw.y); if (d < bd) { bd = d; tgt = e; } }
        if (tgt) {
          tw.cd = WIZ_RATE * rateMul;
          const hitOrder = [tgt];
          let cur = tgt;
          for (let j = 1; j < WIZ_CHAIN; j++) {
            let nxt = null, nb = WIZ_JUMP * WIZ_JUMP;
            for (const e of foes) {
              if (e.hp <= 0 || hitOrder.includes(e)) continue;
              const d = dist2(e.x, e.y, cur.x, cur.y); if (d < nb) { nb = d; nxt = e; }
            }
            if (!nxt) break;
            hitOrder.push(nxt); cur = nxt;
          }

// ---- guidance arrow -----------------------------------------
function guideTarget() {
  const p = S.player;
  if (p.helmets.length >= cap()) return { x: SELL.x, y: SELL.y, label: 'SELL' };
  // only interrupt for the pallet when it holds real money relative to the wallet
  if (S.pallet >= Math.max(60, S.wallet * 0.5)) return { x: PALLET.x, y: PALLET.y, label: 'COINS' };
  let gy = GEM_Y0;
  for (const key in GEMU) {
    if (S.gems >= gemUpCost(key, S.gemUp[key]) - S.gemPaid[key]) return { x: GEM_X, y: gy, label: '💎 ' + GEMU[key].name };

  }

  // porter, then push to NEW LANDS. Everything else is discretionary —
  // the arrow always shows the road forward, even while you save up.
  const fz = S.zones[S.zones.length - 1];
  for (const id of ['tower1', 'porter', 'unlock']) {
    const pl = fz.plates.find(q => q.id === id);
    if (pl && !pl.built) return { x: pl.x, y: pl.y, label: pl.name };

function drawZoneStands() {
  // zone plates + altars
  for (const z of S.zones) {
    if (!rectVis(z.x0, z.y0, z.x1, z.y1)) continue;
    for (const pl of z.plates) {
      if (pl.built) continue;
      if (pl.id === 'unlock' && z.k < S.zones.length) continue;
      plateCircle(pl.x, pl.y, 52, pl.id === 'unlock' ? '#6ec9e0' : pl.repeat ? '#e0a13c' : '#6ecb5a', pl.paid, pl.cost);
      ctx.font = '28px "Arial Rounded MT Bold","Trebuchet MS",sans-serif'; ctx.textAlign = 'center'; ctx.fillStyle = '#fff';
      ctx.fillText(pl.icon, pl.x, pl.y - 2);

      ctx.fillStyle = '#ffd94a'; ctx.font = 'bold 14px "Arial Rounded MT Bold","Trebuchet MS",sans-serif';
      priceTag(fmt(pl.cost - pl.paid), pl.x, pl.y + 74, false);
