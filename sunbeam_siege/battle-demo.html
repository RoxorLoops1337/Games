<script src="src/ui/mock-battle.js"></script>
<script>
(function () {
  var q = new URLSearchParams(location.search);
  if (q.get('phone')) document.documentElement.classList.add('touch');
  tryInit();
  function tryInit() { try { SB.audio.init({ seed: 7 }); } catch (e) {} }
  // stub reward and gameover screens so the hand-off can be seen
  ['reward', 'gameover'].forEach(function (n) {
    SB.ui.register(n, { mount: function (root, p) {
      root.appendChild(SB.ui.h('div', { style: 'padding:40px;text-align:center' }, SB.ui.h('h1.title', {}, n + ' screen (stub)'),
        SB.ui.h('p', {}, 'outcome: ' + p.outcome), SB.ui.h('button.btn', { onclick: start }, 'Fight again')));
    }, unmount: function () {} });
  });
  function start() {
    var useReal = q.get('engine') === 'real' && SB.battle && SB.battle.create;
    var run = (SB.run && SB.run.newRun && useReal) ? SB.run.newRun({ seed: 7, clan: 'alley', side: 'hearth' }) : SB.mockRun();
    window.__run = run;
    var enc = { id: 'demo', waves: [] }, node = null, seed = 7;
    if (useReal && SB.run.enterNode) {
      var kindQ = q.get('node');
      var av = SB.run.availableNodes(run);
      var out = SB.run.enterNode(run, av[0]);
      enc = out.payload.encounter; node = out.payload.node; seed = out.payload.seed;
    }
    SB.ui.go('battle', { run: run, encounter: enc, node: node, factory: useReal ? function (r, e, o) {
      try { return SB.battle.create(r, e, o); }
      catch (err) { console.warn('real engine failed, using mock: ' + err.message); document.title += ' (mock fallback)'; return SB.mockBattle.create(SB.mockRun(), { id: 'demo', waves: [] }, o); }
    } : SB.mockBattle.create, opts: { seed: seed } });
  }
  window.__start = start;
  start();
})();
</script>
