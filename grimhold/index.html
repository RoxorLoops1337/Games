/* --------------------------------------------------- doors, traps, markers */

function doorMid(d){ return [ (d.rx + d.cx)/2 + .5, (d.ry + d.cy)/2 + .5 ]; }

function drawDoor(g, d, t){
  if (d.secret && !d.found) return;
  const [mx,my] = doorMid(d);
  const vert = d.rx !== d.cx;                       // door leaf runs north–south
  const px = mx*TS, py = my*TS;
  g.save(); g.translate(px, py);
  if (vert) g.rotate(Math.PI/2);
  const w = TS*.92, h = TS*.30;
  if (d.open){
    g.fillStyle = 'rgba(9,7,6,.78)';                // shadowed threshold
    g.fillRect(-w/2, -h/2, w, h);
    g.fillStyle = '#57493a';                        // jambs, still standing
    g.fillRect(-w/2 - 2, -h/2 - 2, w*.13, h + 4);
    g.fillRect( w/2 - w*.13 + 2, -h/2 - 2, w*.13, h + 4);
    g.fillStyle = 'rgba(255,238,208,.18)';
    g.fillRect(-w/2 - 2, -h/2 - 2, w*.13, 2);
    g.fillRect( w/2 - w*.13 + 2, -h/2 - 2, w*.13, 2);
    g.save();                                        // the leaf, folded back flat
    g.translate(-w*.40, -h*.10); g.rotate(-1.42);
    g.fillStyle = '#3f2b1a'; g.fillRect(0, -h*.30, w*.46, h*.60);
    g.fillStyle = '#57381f'; g.fillRect(0, -h*.30, w*.46, h*.28);
    g.fillStyle = 'rgba(0,0,0,.35)';
    g.fillRect(w*.14, -h*.30, w*.03, h*.60);
    g.fillRect(w*.30, -h*.30, w*.03, h*.60);
    g.restore();
    g.fillStyle = 'rgba(0,0,0,.55)';                 // dark lintel shadow
    g.fillRect(-w/2, -h/2, w, h*.22);
  } else {
    g.fillStyle = '#2a2018';
    g.fillRect(-w/2 - 2, -h/2 - 2, w + 4, h + 4);
    const grd = g.createLinearGradient(0, -h/2, 0, h/2);
    grd.addColorStop(0,'#6b4b2e'); grd.addColorStop(.5,'#4e3520'); grd.addColorStop(1,'#33220f');
    g.fillStyle = grd; g.fillRect(-w/2, -h/2, w, h);
    g.fillStyle = 'rgba(0,0,0,.32)';
    for (let i=1;i<5;i++) g.fillRect(-w/2 + i*w/5, -h/2, 1.6, h);
    g.fillStyle = '#4a4750';                        // iron bands
    g.fillRect(-w/2, -h*.34, w, h*.13);
    g.fillRect(-w/2,  h*.20, w, h*.13);
    g.fillStyle = 'rgba(190,190,205,.30)';
    g.fillRect(-w/2, -h*.34, w, 1.2); g.fillRect(-w/2, h*.20, w, 1.2);
    g.fillStyle = '#2b2830';                        // rivets
    for (let i=0;i<5;i++){
      g.beginPath(); g.arc(-w*.38 + i*w*.19, -h*.275, h*.045, 0, 6.284); g.fill();
      g.beginPath(); g.arc(-w*.38 + i*w*.19,  h*.265, h*.045, 0, 6.284); g.fill();
    }
    g.fillStyle = '#c8a24a';                        // ring handle
    g.beginPath(); g.arc(w*.30, 0, h*.16, 0, 6.284); g.fill();
    g.fillStyle = '#33220f';
    g.beginPath(); g.arc(w*.30, 0, h*.09, 0, 6.284); g.fill();
    if (d.secret){
      g.fillStyle = `rgba(200,150,255,${.25 + Math.sin(t*.004)*.15})`;
      g.beginPath(); g.arc(-w*.28, 0, h*.16, 0, 6.284); g.fill();
    }
  }
  g.restore();
}

function trapBlocks(x,y){
  for (const tr of G.q.traps) if (tr.x===x && tr.y===y && tr.t==='block' && tr.sprung) return true;
  return false;
}
function trapAt(x,y){
  for (const tr of G.q.traps) if (tr.x===x && tr.y===y && !tr.disarmed && !tr.sprung) return tr;
  return null;
}
function drawTrap(g, tr, t){
  if (!tr.found && !tr.sprung) return;
  const px = (tr.x+.5)*TS, py = (tr.y+.5)*TS;
  g.save(); g.translate(px, py);
  if (tr.t === 'pit'){
    if (tr.sprung){
      g.fillStyle = '#040303';
      g.beginPath(); g.ellipse(0,0, TS*.40, TS*.36, 0, 0, 6.284); g.fill();
      g.strokeStyle = 'rgba(120,105,85,.5)'; g.lineWidth = 3;
      g.beginPath(); g.ellipse(0,0, TS*.40, TS*.36, 0, 0, 6.284); g.stroke();
      g.fillStyle = 'rgba(160,140,110,.25)';
      for (let i=0;i<7;i++){ const a = i/7*6.284;
        g.beginPath(); g.moveTo(Math.cos(a)*TS*.40, Math.sin(a)*TS*.36);
        g.lineTo(Math.cos(a+.3)*TS*.28, Math.sin(a+.3)*TS*.26);
        g.lineTo(Math.cos(a+.55)*TS*.40, Math.sin(a+.55)*TS*.36); g.closePath(); g.fill(); }
    } else { trapMark(g, '#e8b63c', t, 'pit'); }
  } else if (tr.t === 'spear'){
    if (tr.sprung){
      g.fillStyle = '#8a8f96';
      for (let i=0;i<4;i++){
        const a = i/4*6.284 + .4, r = TS*.26;
        g.save(); g.translate(Math.cos(a)*r*.5, Math.sin(a)*r*.5); g.rotate(a);
        g.beginPath(); g.moveTo(0,-TS*.05); g.lineTo(TS*.22,0); g.lineTo(0,TS*.05); g.closePath(); g.fill();
        g.restore();
      }
      g.fillStyle = 'rgba(120,20,14,.5)';
      g.beginPath(); g.arc(0,0, TS*.14, 0, 6.284); g.fill();
    } else { trapMark(g, '#e8b63c', t, 'spear'); }
  } else {
    if (tr.sprung){
      g.fillStyle = '#3a352e'; rr(g, -TS*.42, -TS*.40, TS*.84, TS*.80, 6); g.fill();
      g.fillStyle = '#4e483e'; rr(g, -TS*.38, -TS*.44, TS*.76, TS*.72, 6); g.fill();
      g.fillStyle = 'rgba(0,0,0,.4)';
      for (let i=0;i<3;i++) g.fillRect(-TS*.34, -TS*.30 + i*TS*.22, TS*.68, 2.5);
      g.fillStyle = 'rgba(220,200,170,.10)'; g.fillRect(-TS*.38,-TS*.44, TS*.76, 3);
    } else { trapMark(g, '#e8b63c', t, 'block'); }
  }
  g.restore();
}
function trapMark(g, col, t, kind){
  const p = .55 + Math.sin(t*.005)*.45;
  g.strokeStyle = `rgba(232,182,60,${.35 + p*.4})`; g.lineWidth = 2.4;
  g.setLineDash([6,5]); g.lineDashOffset = -t*.012;
  rr(g, -TS*.34, -TS*.34, TS*.68, TS*.68, 6); g.stroke();
  g.setLineDash([]);
  g.fillStyle = `rgba(232,182,60,${.55 + p*.35})`;
  g.font = `${TS*.34}px ${'Georgia,serif'}`; g.textAlign = 'center'; g.textBaseline = 'middle';
  g.fillText(kind==='pit' ? '⌷' : kind==='spear' ? '⁘' : '⬓', 0, 0);
}

/* --------------------------------------------------------- 6. RENDER LOOP */

let cv, ctx, cw = 0, ch = 0, DPR = 1;
let fogCan = null, fogCtx = null, fogImg = null, grainCan = null;
let TT0 = 0;                                        // ms since boot
const FOGQ = 2;                                     // fog texels per square
let fogTmp = null;                                  // per-square darkness, reused

function initCanvas(){
  if (HEADLESS){
    ctx = mkCan(800, 1400).getContext('2d');
    cw = 800; ch = 1400;
  } else {
    cv = document.getElementById('cv');
    ctx = cv.getContext('2d');
    resize();
    addEventListener('resize', resize);
  }
  fogCan = mkCan(W*FOGQ, H*FOGQ); fogCtx = fogCan.getContext('2d');
  fogImg = fogCtx.createImageData(W*FOGQ, H*FOGQ);
  grainCan = mkCan(96, 96);
  const gg = grainCan.getContext('2d');
  const im = gg.createImageData(96,96);
  for (let i=0;i<96*96;i++){
    const v = 118 + Math.random()*70;
    im.data[i*4] = v; im.data[i*4+1] = v; im.data[i*4+2] = v; im.data[i*4+3] = 255;
  }
  gg.putImageData(im, 0, 0);
}
function resize(){
  if (HEADLESS) return;
  DPR = Math.min(2, window.devicePixelRatio || 1);
  cw = innerWidth; ch = innerHeight;
  cv.width = Math.floor(cw*DPR); cv.height = Math.floor(ch*DPR);
  ctx.setTransform(DPR,0,0,DPR,0,0);
}

// The board sits in the space the HUD is not using.
function viewBox(){
  const top = 54, bot = G && G.q ? 190 : 20;
  return { x:0, y:top, w:cw, h:Math.max(120, ch - top - bot) };
}
function camApply(g){
  const v = viewBox();
  g.translate(v.x + v.w/2, v.y + v.h/2);
  g.scale(G.cam.z, G.cam.z);
  g.translate(-G.cam.x, -G.cam.y);
}
function worldOf(sx, sy){
  const v = viewBox();
  return [ (sx - v.x - v.w/2)/G.cam.z + G.cam.x, (sy - v.y - v.h/2)/G.cam.z + G.cam.y ];
}
function tileOf(sx, sy){
  const [wx,wy] = worldOf(sx,sy);
  return [ Math.floor(wx/TS), Math.floor(wy/TS) ];
}
function clampCam(){
  const v = viewBox();
  const halfW = v.w/(2*G.cam.z), halfH = v.h/(2*G.cam.z);
  const mw = W*TS, mh = H*TS;
  G.cam.x = mw < halfW*2 ? mw/2 : clamp(G.cam.x, halfW - TS*.6, mw - halfW + TS*.6);
  G.cam.y = mh < halfH*2 ? mh/2 : clamp(G.cam.y, halfH - TS*.6, mh - halfH + TS*.6);
}
function focusOn(x, y, snap){
  const tx = (x+.5)*TS, ty = (y+.5)*TS;
  if (snap){ G.cam.x = tx; G.cam.y = ty; } else { G.cam.tx = tx; G.cam.ty = ty; }
  clampCam();
}

// Runs headless too — against a no-op context — so the test suite catches
// render-time mistakes the logic suites never touch.
function draw(){
  const t = TT0;
  ctx.setTransform(DPR,0,0,DPR,0,0);
  ctx.fillStyle = '#050404'; ctx.fillRect(0,0,cw,ch);
  if (!G || !G.q){ drawAntechamber(t); return; }

  const v = viewBox();
  ctx.save();
  ctx.beginPath(); ctx.rect(v.x, v.y, v.w, v.h); ctx.clip();
  ctx.save();
  if (G.shake > 0){
    ctx.translate((Math.random()-.5)*G.shake, (Math.random()-.5)*G.shake);
  }
  camApply(ctx);

  if (BAKE) ctx.drawImage(BAKE, 0, 0);

  // furniture, doors, traps
  for (const f of G.q.furn) if (G.q.seen[idx(f.x,f.y)]) drawFurniture(ctx, f, t);
  for (const k in G.q.doors){
    const d = G.q.doors[k];
    if (G.q.seen[idx(d.cx,d.cy)] || G.q.seen[idx(d.rx,d.ry)]) drawDoor(ctx, d, t);
  }
  for (const tr of G.q.traps) if (G.q.seen[idx(tr.x,tr.y)]) drawTrap(ctx, tr, t);

  drawMarkers(ctx, t);

  // bodies, back to front so southern figures overlap northern ones
  const order = G.q.actors.filter(a => a.alive || a.deathT > 0)
    .sort((a,b) => (a.py||a.y) - (b.py||b.y));
  for (const a of order) drawActor(ctx, a, t);

  drawParticles(ctx, t);
  ctx.restore();

  drawFog(ctx, t);
  drawLights(ctx, t);
  ctx.restore();

  drawVignette(ctx);
  drawDice(ctx, t);
}
// The title screen is not a black rectangle: it is a wall, two torches and the
// dust that never settles in a place like this.
let wallBake = null;
function bakeWall(){
  const c = mkCan(320, 320);
  const g = c.getContext('2d');
  g.fillStyle = '#17130f'; g.fillRect(0,0,320,320);
  for (let r=0;r<8;r++){
    const off = (r % 2) * 40;
    for (let i=-1;i<5;i++){
      const x = i*80 + off, y = r*40, v = hash2(i,r,7);
      const l = 24 + v*14;
      g.fillStyle = `rgb(${l+7},${l+3},${l-2})`;
      rr(g, x+2, y+2, 76, 36, 3); g.fill();
      g.fillStyle = `rgba(255,232,196,${.02 + v*.035})`;
      g.fillRect(x+4, y+4, 72, 2);
      g.fillStyle = 'rgba(0,0,0,.30)';
      g.fillRect(x+4, y+34, 72, 3);
      for (let k=0;k<5;k++){
        const a = hash2(x+k,y,11), b = hash2(x,y+k,13);
        g.fillStyle = `rgba(${a>.5?120:0},${a>.5?110:0},${a>.5?96:0},${.03+b*.06})`;
        g.fillRect(x + 6 + a*66, y + 6 + b*28, 1+b*3, 1+a*2);
      }
    }
  }
  wallBake = c;
}
let embers = [];
function drawAntechamber(t){
  if (HEADLESS) return;
  if (!wallBake) bakeWall();
  const g = ctx;
  for (let y=0;y<ch;y+=320) for (let x=0;x<cw;x+=320) g.drawImage(wallBake, x, y);
  g.fillStyle = 'rgba(4,3,3,.38)'; g.fillRect(0,0,cw,ch);

  const tx = [cw*.16, cw*.84], ty = ch*.26;
  g.save(); g.globalCompositeOperation = 'lighter';
  for (let i=0;i<2;i++){
    const fl = .74 + Math.sin(t*.008 + i*2.1)*.16 + Math.sin(t*.029 + i)*.10;
    const R0 = Math.min(cw,ch)*.72*fl;
    const gr = g.createRadialGradient(tx[i], ty, 0, tx[i], ty, R0);
    gr.addColorStop(0, `rgba(255,186,102,${.34*fl})`);
    gr.addColorStop(.4, `rgba(210,116,44,${.11*fl})`);
    gr.addColorStop(1, 'rgba(60,20,0,0)');
    g.fillStyle = gr; g.beginPath(); g.arc(tx[i], ty, R0, 0, 6.284); g.fill();
    const top = ty - 24 - fl*10;
    const fg = g.createLinearGradient(0, top, 0, ty + 12);
    fg.addColorStop(0,   `rgba(255,236,180,${.85*fl})`);
    fg.addColorStop(.45, `rgba(255,160,52,${.72*fl})`);
    fg.addColorStop(1,   `rgba(190,60,10,${.18*fl})`);
    g.fillStyle = fg;
    g.beginPath(); g.moveTo(tx[i]-10, ty+12);
    g.bezierCurveTo(tx[i]-12, ty-6, tx[i]-4, ty-14, tx[i], top);
    g.bezierCurveTo(tx[i]+4, ty-14, tx[i]+12, ty-6, tx[i]+10, ty+12);
    g.closePath(); g.fill();
    g.fillStyle = `rgba(255,248,214,${.55*fl})`;
    g.beginPath(); g.ellipse(tx[i], ty-2, 3.6, 8, 0, 0, 6.284); g.fill();
  }
  g.restore();
  for (let i=0;i<2;i++){
    g.fillStyle = '#241d17';
    g.beginPath(); g.moveTo(tx[i]-13, ty+10); g.lineTo(tx[i]+13, ty+10);
    g.lineTo(tx[i]+7, ty+26); g.lineTo(tx[i]-7, ty+26); g.closePath(); g.fill();
    g.fillStyle = '#3d332a'; g.fillRect(tx[i]-4, ty+22, 8, 26);
  }
  if (embers.length < 44 && Math.random() < .5){
    const i = Math.random() < .5 ? 0 : 1;
    embers.push({ x:tx[i] + (Math.random()-.5)*16, y:ty, vx:(Math.random()-.5)*.012,
                  vy:-.02 - Math.random()*.03, life:3200, max:3200 });
  }
  for (let i=embers.length-1;i>=0;i--){
    const p = embers[i];
    p.life -= 16; if (p.life <= 0){ embers.splice(i,1); continue; }
    p.x += p.vx*16; p.y += p.vy*16; p.vx += (Math.random()-.5)*.0016;
    const k = p.life/p.max;
    g.globalAlpha = k*.8;
    g.fillStyle = k > .5 ? '#ffc878' : '#a85a24';
    g.beginPath(); g.arc(p.x, p.y, 2.1*k + .8, 0, 6.284); g.fill();
  }
  g.globalAlpha = 1;
  drawVignette(g);
}

function drawActor(g, a, t){
  if (a.kind !== 'hero' && !tileVisible(a.x, a.y) && a.deathT === undefined) return;
  if (a.kind === 'monster' && !tileVisible(a.x, a.y)) return;
  const px = (a.px !== undefined ? a.px : a.x + .5)*TS;
  const py = (a.py !== undefined ? a.py : a.y + .5)*TS;
  const u = TS * (a.kind === 'hero' ? .96 : (MONSTERS[a.mt] ? MONSTERS[a.mt].size : .9));
  const bob = a.walking ? Math.abs(Math.sin(t*.016))*TS*.05 : Math.sin(t*.0022 + (a.bob||0))*TS*.014;
  g.save();
  g.translate(px, py - bob);
  if (a.deathT !== undefined && a.deathT > 0){
    const k = a.deathT/600;
    g.globalAlpha = k; g.scale(1 + (1-k)*.3, 1 - (1-k)*.5); g.rotate((1-k)*.7);
  }
  g.save();
  g.shadowColor = 'rgba(0,0,0,.62)'; g.shadowBlur = u*.10; g.shadowOffsetY = u*.035;
  if (a.facing < 0) g.scale(-1, 1);
  if (a.kind === 'hero') HERO_ART[a.id](g, u, t);
  else if (a.kind === 'npc') drawNPC(g, u, t);
  else (MON_ART[a.mt] || drawGoblin)(g, u, a, t);
  g.restore();
  if (a.hurtT > 0){                                     // white flash on a hit
    g.globalAlpha = Math.min(.75, a.hurtT/180);
    g.globalCompositeOperation = 'lighter';
    g.fillStyle = '#ff9a80';
    g.beginPath(); g.arc(0, -u*.10, u*.36, 0, 6.284); g.fill();
    g.globalCompositeOperation = 'source-over'; g.globalAlpha = 1;
  }
  g.restore();
  if (a.alive) drawActorTag(g, a, px, py, u, t);
}
function drawActorTag(g, a, px, py, u, t){
  if (a.kind === 'monster'){
    if (a.bp < a.bpMax || a.boss){
      const w = u*.56, y = py - u*.62;
      g.fillStyle = 'rgba(0,0,0,.65)'; rr(g, px-w/2, y, w, 5.5, 2.5); g.fill();
      g.fillStyle = a.boss ? '#e0b040' : '#c0392b';
      rr(g, px-w/2+1, y+1, (w-2)*(a.bp/a.bpMax), 3.5, 1.7); g.fill();
    }
    if (a.sleep > 0){
      g.fillStyle = '#9fd8e8'; g.font = `${u*.28}px Georgia,serif`; g.textAlign = 'center';
      g.fillText('z', px + u*.22, py - u*.52 + Math.sin(t*.004)*3);
    }
    if (a.stun > 0){
      g.fillStyle = '#e8d060'; g.font = `${u*.26}px Georgia,serif`; g.textAlign = 'center';
      g.fillText('✦', px - u*.24, py - u*.52);
    }
  } else if (a.kind === 'hero'){
    const act = activeHero();
    if (act === a && G.q.phase === 'hero'){
      const p = .5 + Math.sin(t*.005)*.5;
      g.strokeStyle = `rgba(216,168,60,${.45 + p*.4})`; g.lineWidth = 2.4;
      g.beginPath(); g.ellipse(px, py + u*.36, u*.36, u*.14, 0, 0, 6.284); g.stroke();
      g.fillStyle = `rgba(216,168,60,${.6 + p*.4})`;
      g.beginPath();
      const ay = py - u*.72 - p*3;
      g.moveTo(px, ay + 9); g.lineTo(px - 6, ay); g.lineTo(px + 6, ay); g.closePath(); g.fill();
    }
    if (a.buffs.veil){
      g.fillStyle = `rgba(160,200,255,${.10 + Math.sin(t*.003)*.05})`;
      g.beginPath(); g.arc(px, py - u*.08, u*.42, 0, 6.284); g.fill();
    }
    if (a.buffs.rockskin){
      g.strokeStyle = 'rgba(150,200,120,.4)'; g.lineWidth = 2;
      g.beginPath(); g.arc(px, py - u*.08, u*.40, 0, 6.284); g.stroke();
    }
  }
}

function drawMarkers(g, t){
  const h = activeHero();
  if (!h || G.q.phase !== 'hero' || G.busy()) return;
  const f = G.q.field;
  if (!f) return;
  const p = .5 + Math.sin(t*.004)*.5;
  g.lineWidth = 2;
  for (const [k, cost] of f.d){
    if (cost === 0) continue;
    const x = k % W, y = (k/W)|0;
    if (!tileSeen(x,y)) continue;
    const px = x*TS, py = y*TS;
    g.fillStyle = `rgba(232,190,90,${.075 + p*.045})`;
    rr(g, px+5, py+5, TS-10, TS-10, 5); g.fill();
    g.strokeStyle = `rgba(232,190,90,${.26 + p*.14})`;
    rr(g, px+5, py+5, TS-10, TS-10, 5); g.stroke();
  }
  // once the prize is in hand, the stair is the objective — say so
  if (objectiveReady() && needsEscape()){
    for (const [sx,sy] of STAIRS){
      const px = sx*TS, py = sy*TS;
      g.fillStyle = `rgba(120,220,150,${.10 + p*.10})`;
      rr(g, px+4, py+4, TS-8, TS-8, 6); g.fill();
      g.strokeStyle = `rgba(120,220,150,${.45 + p*.35})`; g.lineWidth = 2.5;
      rr(g, px+4, py+4, TS-8, TS-8, 6); g.stroke();
    }
  }
  // squares you could strike from where you stand
  for (const m of monstersOf()){
    if (!tileVisible(m.x,m.y)) continue;
    if (!canStrike(h, m)) continue;
    const px = m.x*TS, py = m.y*TS;
    g.strokeStyle = `rgba(200,60,44,${.5 + p*.3})`; g.lineWidth = 3;
    rr(g, px+4, py+4, TS-8, TS-8, 6); g.stroke();
  }
}

/* ------------------------------------------------------------- the dark */

function drawFog(g, t){
  if (!fogCan) return;
  const d = fogImg.data, Q = G.q, FW = W*FOGQ;

  // where the light actually comes from: the party's torches, and any sconce
  // close enough to matter. A lit room still falls off into its corners.
  const lights = [];
  const hs = livingHeroes();
  for (const h of hs) lights.push([h.px !== undefined ? h.px : h.x+.5, h.py !== undefined ? h.py : h.y+.5, 3.3]);
  for (const tr of TORCHES){
    for (const h of hs){
      if (Math.abs(tr.x - h.x) < 11 && Math.abs(tr.y - h.y) < 11){ lights.push([tr.x, tr.y, 2.9]); break; }
    }
  }
  const A = fogTmp || (fogTmp = new Uint8Array(W*H));
  for (let y=0;y<H;y++) for (let x=0;x<W;x++){
    const i = idx(x,y);
    if (!isFloor(x,y)){ A[i] = 252; continue; }
    if (!(Q.vis && Q.vis[i])){ A[i] = Q.seen[i] ? 150 : 252; continue; }
    let best = 99;
    for (let k=0;k<lights.length;k++){
      const L = lights[k];
      const dx = x + .5 - L[0], dy = y + .5 - L[1];
      const dd = Math.sqrt(dx*dx + dy*dy) - L[2];
      if (dd < best) best = dd;
    }
    A[i] = best <= 0 ? 0 : Math.min(104, best*27)|0;
  }
  // stone borrows the light of the brightest floor square beside it
  for (let y=0;y<H;y++) for (let x=0;x<W;x++){
    const i = idx(x,y);
    let a = A[i];
    if (!isFloor(x,y)){
      let best = 252;
      for (const [dx,dy] of DIRS8){
        const nx = x+dx, ny = y+dy;
        if (!isFloor(nx,ny)) continue;
        const va = Math.min(252, A[idx(nx,ny)] + 26);
        if (va < best) best = va;
      }
      a = best;
    }
    for (let sy=0; sy<FOGQ; sy++) for (let sx=0; sx<FOGQ; sx++){
      const j = ((y*FOGQ + sy)*FW + x*FOGQ + sx)*4;
      d[j] = 2; d[j+1] = 2; d[j+2] = 4; d[j+3] = a;
    }
  }
  fogCtx.putImageData(fogImg, 0, 0);
  g.save(); camApply(g);
  g.imageSmoothingEnabled = true;
  g.drawImage(fogCan, 0, 0, W*TS, H*TS);
  g.restore();
}

function drawLights(g, t){
  g.save(); camApply(g);
  g.globalCompositeOperation = 'lighter';
  for (const tr of TORCHES){
    const tx = Math.floor(tr.x), ty = Math.floor(tr.y);
    let lit = false;
    for (const [dx,dy] of DIRS8) if (isFloor(tx+dx,ty+dy) && tileVisible(tx+dx,ty+dy)) lit = true;
    if (isFloor(tx,ty) && tileVisible(tx,ty)) lit = true;
    if (!lit) continue;
    const fl = .72 + Math.sin(t*.009 + tr.ph)*.16 + Math.sin(t*.031 + tr.ph*2)*.09;
    const R0 = TS*2.5*fl;
    const gr = g.createRadialGradient(tr.x*TS, tr.y*TS, 0, tr.x*TS, tr.y*TS, R0);
    gr.addColorStop(0,   `rgba(255,186,96,${.30*fl})`);
    gr.addColorStop(.35, `rgba(220,130,50,${.12*fl})`);
    gr.addColorStop(1,   'rgba(120,50,10,0)');
    g.fillStyle = gr;
    g.beginPath(); g.arc(tr.x*TS, tr.y*TS, R0, 0, 6.284); g.fill();
    // the flame itself
    const fx = tr.x*TS, fy = tr.y*TS - 6;
    g.fillStyle = `rgba(255,170,60,${.55*fl})`;
    g.beginPath(); g.moveTo(fx-5, fy+5);
    g.quadraticCurveTo(fx-4, fy-4, fx, fy-11-fl*4);
    g.quadraticCurveTo(fx+4, fy-4, fx+5, fy+5); g.closePath(); g.fill();
    g.fillStyle = `rgba(255,240,190,${.5*fl})`;
    g.beginPath(); g.ellipse(fx, fy-3, 2.4, 4.4, 0, 0, 6.284); g.fill();
  }
  for (const h of livingHeroes()){
    const px = (h.px !== undefined ? h.px : h.x+.5)*TS, py = (h.py !== undefined ? h.py : h.y+.5)*TS;
    const fl = .86 + Math.sin(t*.006 + h.x)*.08;
    const R0 = TS*3.1*fl;
    const gr = g.createRadialGradient(px, py, 0, px, py, R0);
    gr.addColorStop(0,   `rgba(255,196,120,${.20*fl})`);
    gr.addColorStop(.45, `rgba(190,120,60,${.07*fl})`);
    gr.addColorStop(1,   'rgba(60,30,10,0)');
    g.fillStyle = gr;
    g.beginPath(); g.arc(px, py, R0, 0, 6.284); g.fill();
  }
  for (const p of G.fx){
    if (!p.glow) continue;
    const gr = g.createRadialGradient(p.x*TS, p.y*TS, 0, p.x*TS, p.y*TS, p.r*TS);
    gr.addColorStop(0, p.glow); gr.addColorStop(1,'rgba(0,0,0,0)');
    g.fillStyle = gr;
    g.beginPath(); g.arc(p.x*TS, p.y*TS, p.r*TS, 0, 6.284); g.fill();
  }
  g.globalCompositeOperation = 'source-over';
  g.restore();
}

function drawVignette(g){
  const gr = g.createRadialGradient(cw/2, ch*.46, Math.min(cw,ch)*.28, cw/2, ch*.46, Math.max(cw,ch)*.78);
  gr.addColorStop(0,'rgba(0,0,0,0)'); gr.addColorStop(1,'rgba(0,0,0,.72)');
  g.fillStyle = gr; g.fillRect(0,0,cw,ch);
  if (grainCan){
    g.save(); g.globalAlpha = .045; g.globalCompositeOperation = 'overlay';
    const ox = (Math.random()*96)|0, oy = (Math.random()*96)|0;
    for (let y=-oy; y<ch; y+=96) for (let x=-ox; x<cw; x+=96) g.drawImage(grainCan, x, y);
    g.restore();
  }
}

/* -------------------------------------------------------------- particles */

// #rrggbb → rgba(r,g,b,a). Canvas throws on a malformed colour stop, and a
// throw inside draw() takes the whole frame loop with it.
function hexA(hex, a){
  const n = parseInt(String(hex).slice(1), 16) || 0;
  return `rgba(${(n>>16)&255},${(n>>8)&255},${n&255},${a})`;
}

function spark(x, y, n, col, opt){
  opt = opt || {};
  for (let i=0;i<n;i++){
    const a = Math.random()*6.284, s = (opt.spd || .012)*(.4 + Math.random());
    G.fx.push({
      x:x+.5 + (Math.random()-.5)*.3, y:y+.5 + (Math.random()-.5)*.3,
      vx:Math.cos(a)*s, vy:Math.sin(a)*s - (opt.up||0),
      life:opt.life || 520, max:opt.life || 520, col, size:opt.size || 3,
      grav:opt.grav === undefined ? .00004 : opt.grav, glow:opt.glow, r:opt.r || .8,
    });
  }
}
function floatText(x, y, text, col){
  G.fx.push({ x:x+.5, y:y+.2, vx:0, vy:-.0016, life:1000, max:1000, text, col, size:0, grav:0 });
}
function drawParticles(g, t){
  for (const p of G.fx){
    const k = p.life / p.max;
    if (p.text){
      g.save();
      g.globalAlpha = Math.min(1, k*1.6);
      g.font = `700 ${TS*.42}px Georgia,serif`;
      g.textAlign = 'center'; g.textBaseline = 'middle';
      g.lineWidth = 4; g.strokeStyle = 'rgba(0,0,0,.8)';
      g.strokeText(p.text, p.x*TS, p.y*TS);
      g.fillStyle = p.col; g.fillText(p.text, p.x*TS, p.y*TS);
      g.restore();
      continue;
    }
    g.globalAlpha = k;
    g.fillStyle = p.col;
    g.beginPath(); g.arc(p.x*TS, p.y*TS, p.size*k, 0, 6.284); g.fill();
  }
  g.globalAlpha = 1;
}

/* ------------------------------------------------------------- 7. SOUND */
// Small WebAudio kit: a breathing drone under everything, a handful of hits,
// and a slow modal loop that changes when steel comes out.

let AC = null, masterG = null, musicG = null, droneNodes = null, audioOn = true;

function audioInit(){
  if (AC || HEADLESS) return;
  try {
    const C = window.AudioContext || window.webkitAudioContext;
    if (!C) return;
    AC = new C();
    masterG = AC.createGain(); masterG.gain.value = .9; masterG.connect(AC.destination);
    musicG = AC.createGain(); musicG.gain.value = .34; musicG.connect(masterG);
    startDrone();
  } catch(e){ AC = null; }
}
function startDrone(){
  if (!AC) return;
  const g = AC.createGain(); g.gain.value = .055; g.connect(masterG);
  const f = AC.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 260; f.Q.value = 3;
  f.connect(g);
  const oscs = [];
  for (const [freq, det] of [[55,0],[55.4,7],[82.5,-6]]){
    const o = AC.createOscillator(); o.type = 'sawtooth';
    o.frequency.value = freq; o.detune.value = det;
    const og = AC.createGain(); og.gain.value = .5;
    o.connect(og); og.connect(f); o.start(); oscs.push(o);
  }
  const lfo = AC.createOscillator(); lfo.frequency.value = .07;
  const lg = AC.createGain(); lg.gain.value = 90;
  lfo.connect(lg); lg.connect(f.frequency); lfo.start();
  droneNodes = { g, f };
}
function tone(freq, dur, type, vol, when, slide){
  if (!AC || !audioOn) return;
  const t0 = AC.currentTime + (when || 0);
  const o = AC.createOscillator(); o.type = type || 'triangle';
  o.frequency.setValueAtTime(freq, t0);
  if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, slide), t0 + dur);
  const g = AC.createGain();
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.exponentialRampToValueAtTime(vol || .12, t0 + .012);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  o.connect(g); g.connect(masterG); o.start(t0); o.stop(t0 + dur + .03);
}
function noise(dur, vol, freq, type){
  if (!AC || !audioOn) return;
  const n = Math.floor(AC.sampleRate * dur);
  const buf = AC.createBuffer(1, n, AC.sampleRate);
  const d = buf.getChannelData(0);
  for (let i=0;i<n;i++) d[i] = (Math.random()*2-1) * (1 - i/n);
  const s = AC.createBufferSource(); s.buffer = buf;
  const f = AC.createBiquadFilter(); f.type = type || 'bandpass';
  f.frequency.value = freq || 900; f.Q.value = 1.1;
  const g = AC.createGain(); g.gain.value = vol || .16;
  s.connect(f); f.connect(g); g.connect(masterG); s.start();
}
function sfx(k){
  if (!AC || !audioOn) return;
  switch(k){
    case 'step':   noise(.07, .045, 480, 'lowpass'); break;
    case 'door':   noise(.34, .13, 320, 'bandpass'); tone(90, .5, 'sawtooth', .07, 0, 62); break;
    case 'hit':    noise(.14, .30, 2000, 'bandpass'); tone(160, .16, 'square', .13, 0, 70); break;
    case 'block':  noise(.10, .20, 3400, 'bandpass'); tone(320, .09, 'square', .07); break;
    case 'miss':   noise(.13, .12, 1400, 'highpass'); break;
    case 'dice':   for (let i=0;i<5;i++) noise(.05, .10, 1600 + Math.random()*1800, 'bandpass'); break;
    case 'die':    tone(200, .5, 'sawtooth', .13, 0, 48); noise(.3, .16, 500, 'lowpass'); break;
    case 'heroDie':tone(150, 1.1, 'sawtooth', .16, 0, 40); tone(75, 1.3, 'sine', .12, .05, 32); break;
    case 'spell':  tone(520, .5, 'sine', .10, 0, 1500); tone(780, .45, 'triangle', .07, .04, 2100); break;
    case 'heal':   [523,659,784,1046].forEach((f,i) => tone(f, .35, 'sine', .09, i*.06)); break;
    case 'gold':   [880,1175,1568].forEach((f,i) => tone(f, .18, 'square', .06, i*.05)); break;
    case 'trap':   noise(.22, .28, 700, 'bandpass'); tone(110, .35, 'sawtooth', .14, 0, 55); break;
    case 'search': noise(.30, .07, 2600, 'bandpass'); break;
    case 'win':    [392,523,659,784,1046].forEach((f,i) => tone(f, .6, 'triangle', .11, i*.11)); break;
    case 'lose':   [392,349,294,220].forEach((f,i) => tone(f, .8, 'sawtooth', .11, i*.18)); break;
    case 'ui':     tone(660, .06, 'square', .045); break;
    case 'boss':   tone(58, 1.6, 'sawtooth', .2, 0, 40); noise(1.0, .12, 200, 'lowpass'); break;
  }
}

// --- the loop ------------------------------------------------------------
const SCALE_EXPLORE = [0,2,3,5,7,8,10];      // D aeolian
const SCALE_FIGHT   = [0,1,3,5,6,8,10];      // D phrygian, meaner
let musicStep = 0, musicNext = 0, musicMood = 'explore';

function musicTick(now){
  if (!AC || !audioOn || !G || !G.q) return;
  const bpm = musicMood === 'fight' ? 104 : 74;
  const beat = 60/bpm;
  if (now < musicNext) return;
  musicNext = (musicNext || now) + beat/2;
  if (musicNext < now) musicNext = now + beat/2;
  const s = musicStep++;
  const root = 36.71;                        // D1
  const sc = musicMood === 'fight' ? SCALE_FIGHT : SCALE_EXPLORE;
  const bar = (s >> 3) % 4;
  const bassDeg = [0,0,5,3][bar];
  if (s % 4 === 0){
    tone(root*Math.pow(2, bassDeg/12), beat*1.6, 'sawtooth', .075);
  }
  if (musicMood === 'fight'){
    if (s % 2 === 0) noise(.06, .06, 5200, 'highpass');
    if (s % 8 === 4) noise(.20, .12, 240, 'lowpass');
    const deg = sc[(s*3) % sc.length];
    tone(root*4*Math.pow(2, (deg + bassDeg)/12), beat*.42, 'square', .045);
  } else {
    if (s % 8 === 0){
      const deg = sc[(s>>3) % sc.length];
      tone(root*4*Math.pow(2, (deg + bassDeg)/12), beat*2.4, 'triangle', .04);
      tone(root*6*Math.pow(2, (deg + bassDeg)/12), beat*2.0, 'sine', .022);
    }
    if (s % 16 === 9) noise(.5, .03, 3000, 'bandpass');   // a drip somewhere
  }
}
function setMood(m){
  if (m !== musicMood){ musicMood = m; musicStep = 0; }
}

/* ------------------------------------------------------- 8. TIME AND DICE */

// One timer list drives all pacing. In headless the callback fires at once, so
// the tests walk the same code path the game does, only instantly.
function later(ms, fn){
  if (HEADLESS){ fn(); return; }
  G.timers.push({ t:ms, fn });
}
function clearTimers(){ if (G) G.timers.length = 0; }

const SKULL = 0, WHITE = 1, BLACK = 2;
function combatDie(){ const r = ri(6); return r < 3 ? SKULL : r < 5 ? WHITE : BLACK; }
function rollCombat(n){ const out = []; for (let i=0;i<n;i++) out.push(combatDie()); return out; }
const countSkulls = (f) => f.filter(v => v === SKULL).length;
const countShields = (f, hero) => f.filter(v => v === (hero ? WHITE : BLACK)).length;

function showDice(kind, atk, def, label, sub, done){
  const items = [];
  for (const f of atk) items.push({ side:'atk', face:f, settle:0 });
  for (const f of def) items.push({ side:'def', face:f, settle:0 });
  const per = 90, base = 380;
  items.forEach((it,i) => { it.settle = base + i*per; });
  const total = base + items.length*per + 520;
  G.dice = { kind, items, t:0, total, label, sub };
  sfx('dice');
  later(total, () => { G.dice = null; if (done) done(); });
}
function showMoveDice(a, b, done){
  G.dice = { kind:'move', items:[{side:'pip',face:a,settle:380},{side:'pip',face:b,settle:470}],
             t:0, total:1150, label:'MOVEMENT', sub:(a+b)+' squares' };
  sfx('dice');
  later(1150, () => { G.dice = null; if (done) done(); });
}

function drawDice(g, t){
  if (!G.dice) return;
  const D = G.dice, n = D.items.length;
  const size = Math.min(46, (cw - 60) / Math.max(4, n) - 8);
  const gap = size + 8;
  const totalW = n*gap - 8;
  const cx0 = cw/2 - totalW/2;
  const cy = ch*.40;
  g.save();
  g.fillStyle = 'rgba(6,5,4,.72)';
  rr(g, cw/2 - totalW/2 - 22, cy - size/2 - 40, totalW + 44, size + 78, 12); g.fill();
  g.strokeStyle = 'rgba(216,168,60,.35)'; g.lineWidth = 1;
  rr(g, cw/2 - totalW/2 - 22, cy - size/2 - 40, totalW + 44, size + 78, 12); g.stroke();
  g.fillStyle = '#9c8d75'; g.font = '600 10px Georgia,serif';
  g.textAlign = 'center'; g.textBaseline = 'middle';
  g.save(); g.translate(cw/2, cy - size/2 - 22);
  g.letterSpacing = '3px';
  g.fillText(D.label, 0, 0);
  g.restore();
  D.items.forEach((it, i) => {
    const x = cx0 + i*gap + size/2;
    const settled = D.t >= it.settle;
    const face = settled ? it.face : ri(6);
    let yy = cy, sc = 1, rot = 0;
    if (!settled){
      const k = D.t / it.settle;
      yy = cy - Math.abs(Math.sin(D.t*.02))*22*(1-k);
      rot = D.t*.02; sc = 1.08;
    } else {
      const k = Math.min(1, (D.t - it.settle)/160);
      sc = 1 + (1-k)*.28;
    }
    g.save(); g.translate(x, yy); g.rotate(rot); g.scale(sc, sc);
    dieFace(g, size, it.side, settled ? it.face : (D.kind === 'move' ? 1+ri(6) : face), D.kind);
    g.restore();
  });
  if (D.sub && D.t > D.total - 620){
    g.globalAlpha = Math.min(1, (D.t - (D.total-620))/180);
    g.fillStyle = '#f3d488'; g.font = '700 15px Georgia,serif';
    g.letterSpacing = '2px';
    g.fillText(D.sub, cw/2, cy + size/2 + 22);
    g.globalAlpha = 1;
  }
  g.restore();
}
function dieFace(g, s, side, face, kind){
  const r = s*.18;
  g.save();
  g.shadowColor = 'rgba(0,0,0,.7)'; g.shadowBlur = 10; g.shadowOffsetY = 4;
  if (kind === 'move'){
    g.fillStyle = '#a8231d';
    rr(g, -s/2, -s/2, s, s, r); g.fill();
    g.shadowBlur = 0;
    g.fillStyle = 'rgba(255,255,255,.22)'; rr(g, -s/2+2, -s/2+2, s-4, s*.34, r*.7); g.fill();
    g.fillStyle = '#fff4e0';
    const P = [[0,0]], pip = s*.10;
    const layouts = { 1:[[0,0]], 2:[[-.24,-.24],[.24,.24]], 3:[[-.26,-.26],[0,0],[.26,.26]],
      4:[[-.24,-.24],[.24,-.24],[-.24,.24],[.24,.24]],
      5:[[-.26,-.26],[.26,-.26],[0,0],[-.26,.26],[.26,.26]],
      6:[[-.25,-.28],[.25,-.28],[-.25,0],[.25,0],[-.25,.28],[.25,.28]] };
    for (const [dx,dy] of (layouts[face] || P)){
      g.beginPath(); g.arc(dx*s, dy*s, pip, 0, 6.284); g.fill();
    }
    g.restore(); return;
  }
  const atk = side === 'atk';
  g.fillStyle = atk ? '#e6ddc6' : '#2b2c31';
  rr(g, -s/2, -s/2, s, s, r); g.fill();
  g.shadowBlur = 0;
  g.fillStyle = atk ? 'rgba(255,255,255,.5)' : 'rgba(255,255,255,.10)';
  rr(g, -s/2+2, -s/2+2, s-4, s*.32, r*.7); g.fill();
  g.strokeStyle = atk ? 'rgba(90,74,50,.45)' : 'rgba(200,200,220,.20)'; g.lineWidth = 1.2;
  rr(g, -s/2, -s/2, s, s, r); g.stroke();
  const ink = atk ? '#2a2018' : '#dfe4ea';
  if (face === SKULL) glyphSkull(g, s*.60, ink);
  else if (face === WHITE) glyphShield(g, s*.56, atk ? '#c8c2ae' : '#eef2f6', ink);
  else glyphShield(g, s*.56, atk ? '#4a4238' : '#6a6f78', ink);
  g.restore();
}
function glyphSkull(g, s, col){
  g.fillStyle = col;
  g.beginPath(); g.arc(0, -s*.10, s*.34, 0, 6.284); g.fill();
  g.fillRect(-s*.18, s*.14, s*.36, s*.20);
  g.fillStyle = 'rgba(255,255,255,.85)';
  g.beginPath(); g.arc(-s*.13, -s*.12, s*.11, 0, 6.284); g.fill();
  g.beginPath(); g.arc( s*.13, -s*.12, s*.11, 0, 6.284); g.fill();
  g.fillStyle = col;
  g.beginPath(); g.moveTo(0, -s*.02); g.lineTo(s*.06, s*.10); g.lineTo(-s*.06, s*.10); g.closePath(); g.fill();
  g.fillStyle = 'rgba(255,255,255,.75)';
  for (let i=0;i<3;i++) g.fillRect(-s*.15 + i*s*.11, s*.17, s*.05, s*.14);
}
function glyphShield(g, s, fill, edge){
  g.fillStyle = fill;
  g.beginPath();
  g.moveTo(-s*.34, -s*.36); g.lineTo(s*.34, -s*.36);
  g.lineTo(s*.34, s*.04); g.quadraticCurveTo(s*.30, s*.34, 0, s*.44);
  g.quadraticCurveTo(-s*.30, s*.34, -s*.34, s*.04);
  g.closePath(); g.fill();
  g.strokeStyle = edge; g.lineWidth = Math.max(1.2, s*.07); g.stroke();
  g.strokeStyle = edge; g.lineWidth = Math.max(1, s*.05);
  g.beginPath(); g.moveTo(0, -s*.30); g.lineTo(0, s*.30); g.stroke();
}

/* ------------------------------------------------------- 9. THE TURN LOOP */

function activeHero(){
  if (!G.q) return null;
  return G.q.actors.find(a => a.kind === 'hero' && a.id === G.q.activeId && a.alive) || null;
}
function busy(){
  return !!(G.dice || G.timers.length || G.q.actors.some(a => a.walking) || G.q.over);
}

function say(text, cls){
  if (!G.q) return;
  G.q.log.push({ text, cls, t:0 });
  if (G.q.log.length > 4) G.q.log.shift();
  renderLog();
}

/* --------------------------------------------------------------- movement */

function slide(a, tx, ty, ms, done){
  a.px = a.x + .5; a.py = a.y + .5;
  a.sx = a.px; a.sy = a.py;
  a.x = tx; a.y = ty;
  a.gx = tx + .5; a.gy = ty + .5;
  if (HEADLESS || ms <= 0){ a.px = a.gx; a.py = a.gy; a.walking = false; if (done) done(); return; }
  a.slideT = 0; a.slideMs = ms; a.walking = true; a.slideDone = done;
}
function tickSlide(a, dt){
  if (!a.walking) return;
  a.slideT += dt;
  const k = Math.min(1, a.slideT / a.slideMs);
  const e = k*k*(3-2*k);
  a.px = lerp(a.sx, a.gx, e); a.py = lerp(a.sy, a.gy, e);
  if (k >= 1){
    a.walking = false;
    const f = a.slideDone; a.slideDone = null;
    if (f) f();
  }
}

function heroWalk(h, path, done){
  let k = 0;
  const step = () => {
    if (k >= path.length || h.moveLeft <= 0 || !h.alive){ finishStep(); return; }
    const [nx,ny] = path[k];
    // a shut door stops you where you stand — opening it is free, walking on is not
    const dr = doorBetween(h.x, h.y, nx, ny);
    if (dr && !dr.open){ openDoorAt(h, dr); finishStep(); return; }
    const occ = actorAt(nx,ny);
    const last = k === path.length - 1;
    if (furnAt(nx,ny) || trapBlocks(nx,ny) || (occ && (occ.kind !== 'hero' || last))){ finishStep(); return; }
    k++;
    const ox = h.x, oy = h.y;
    h.facing = nx > ox ? 1 : nx < ox ? -1 : h.facing;
    sfx('step');
    slide(h, nx, ny, 150, () => {
      h.moveLeft--;
      const npc = G.q.actors.find(a => a.kind === 'npc' && a.follow === h.id && a.alive);
      if (npc) slide(npc, ox, oy, 150, null);
      recomputeVision();
      focusOn(h.x, h.y);
      const tr = trapAt(h.x, h.y);
      if (tr){ springTrap(h, tr, step); return; }
      later(30, step);
    });
  };
  const finishStep = () => {
    recomputeVision();
    refreshField();
    checkQuestState();
    renderHUD();
    if (done) done();
  };
  step();
}

function refreshField(){
  const h = activeHero();
  G.q.field = h && h.alive && h.moveLeft > 0 ? walkFieldSafe(h.x, h.y, h.moveLeft, h) : { d:new Map(), from:new Map() };
}
// The field you may *end* on: squeezing past a companion is fine, standing on
// one is not, and a fallen block is not a square at all.
function walkFieldSafe(x, y, n, mover){
  const f = walkField(x, y, n, mover);
  for (const [k] of [...f.d]){
    const tx = k % W, ty = (k/W)|0;
    const occ = actorAt(tx,ty);
    if (trapBlocks(tx,ty) || (occ && occ !== mover)) f.d.delete(k);
  }
  return f;
}

/* ------------------------------------------------------------------ traps */

function springTrap(h, tr, cont){
  tr.sprung = true; tr.found = true;
  sfx('trap'); G.shake = 14;
  if (tr.t === 'pit'){
    if (h.gear.rope){
      say(`${h.name} drops into a pit — and is out again on the rope.`, 'bad');
      spark(h.x, h.y, 14, '#6b5a3c');
      hurt(h, 1, () => later(220, cont));
      return;
    }
    say(`${h.name} falls into a pit! −1 Body Point, and there the movement ends.`, 'bad');
    spark(h.x, h.y, 18, '#4a3a28');
    h.moveLeft = 0;
    hurt(h, 1, () => later(260, cont));
  } else if (tr.t === 'spear'){
    say(`Spears burst from the wall! ${h.name} loses 2 Body Points.`, 'bad');
    spark(h.x, h.y, 20, '#c8ccd2', { spd:.02 });
    hurt(h, 2, () => later(260, cont));
  } else {
    say(`A block of stone crashes down — 3 Body Points, and the way is shut.`, 'bad');
    spark(h.x, h.y, 26, '#6a6258', { spd:.018 });
    const back = lastFreeNeighbour(h);
    h.moveLeft = 0;
    if (back) slide(h, back[0], back[1], 130, null);
    hurt(h, 3, () => later(280, cont));
  }
}
function lastFreeNeighbour(h){
  for (const [dx,dy] of DIRS){
    const nx = h.x+dx, ny = h.y+dy;
    if (linked(h.x,h.y,nx,ny) && !blocked(nx,ny) && !trapBlocks(nx,ny)) return [nx,ny];
  }
  return null;
}

/* ----------------------------------------------------------------- combat */

function adjacentMonster(h){
  for (const [dx,dy] of DIRS){
    const m = actorAt(h.x+dx, h.y+dy);
    if (m && m.kind === 'monster' && m.alive && linked(h.x,h.y,h.x+dx,h.y+dy)) return m;
  }
  return null;
}
// Why this hero cannot hit that monster — null when they can. Everything that
// refuses an attack goes through here, so the player is told the real reason
// rather than the first guess.
function strikeBlocker(h, m){
  if (!h || !h.alive) return 'nohero';
  if (!m || !m.alive) return 'gone';
  if (h.acted) return 'acted';
  const w = weaponOf(h);
  const dx = Math.abs(h.x-m.x), dy = Math.abs(h.y-m.y);
  const orth = (dx+dy) === 1 && linked(h.x,h.y,m.x,m.y);
  const diag = dx <= 1 && dy <= 1 && (dx+dy) > 0;
  const seen = tileVisible(m.x,m.y) && hasLOS(h.x,h.y,m.x,m.y);
  if (w.ranged){
    if (adjacentMonster(h)) return 'crowded';
    return seen ? null : 'sight';
  }
  if (w.thrown && !orth) return seen ? null : 'sight';
  if (w.diag) return (orth || (diag && hasLOS(h.x,h.y,m.x,m.y))) ? null : 'range';
  return orth ? null : 'range';
}
function canStrike(h, m){ return !strikeBlocker(h, m); }

function strikeReason(h, m, code){
  const w = weaponOf(h);
  switch (code){
    case 'acted':   return `${h.name} has already taken an action this turn.`;
    case 'crowded': return `The ${w.name.toLowerCase()} cannot be fired with something this close.`;
    case 'sight':   return `${h.name} has no clear shot at the ${m.name}.`;
    case 'range':   return `The ${m.name} is out of reach.`;
    case 'gone':    return 'It is already down.';
    default:        return 'Nothing to strike there.';
  }
}

function doAttack(h, m){
  if (!canStrike(h, m)) return false;
  h.acted = true;
  h.facing = m.x > h.x ? 1 : m.x < h.x ? -1 : h.facing;
  setMood('fight');
  const n = attackDice(h, m);
  const atk = rollCombat(n);
  const def = rollCombat(m.def);
  const skulls = countSkulls(atk);
  const blocks = countShields(def, false);
  const immune = m.spirit && !weaponOf(h).spirit;
  let dmg = Math.max(0, skulls - blocks);
  if (immune) dmg = 0;
  const sub = immune ? 'The blow passes through him'
            : dmg > 0 ? `${dmg} Body Point${dmg>1?'s':''}` : 'Turned aside';
  if (h.buffs.courage) delete h.buffs.courage;
  showDice('attack', atk, def, `${h.name} vs ${m.name}`, sub, () => {
    if (immune){
      say(`Your steel passes through ${m.name} like smoke. Only the Spirit Blade will bite.`, 'magic');
      spark(m.x, m.y, 14, '#9a86e0', { glow:'rgba(154,134,224,.4)', r:1.2 });
      sfx('block');
    } else if (dmg > 0){
      sfx('hit'); G.shake = 7 + dmg*3;
      m.sleep = 0;
      hurt(m, dmg, null);
    } else {
      sfx('block');
      say(`${m.name} turns the blow aside.`, '');
      spark(m.x, m.y, 8, '#c8ccd2', { spd:.014 });
    }
    refreshField(); renderHUD(); checkQuestState();
  });
  return true;
}

function monsterAttack(m, h, done){
  if (h.buffs.veil){
    say(`The mist swallows ${h.name} — ${m.name} strikes at nothing.`, 'magic');
    later(300, done); return;
  }
  m.facing = h.x > m.x ? 1 : h.x < m.x ? -1 : m.facing;
  const atk = rollCombat(m.atk);
  const def = rollCombat(defendDice(h));
  const skulls = countSkulls(atk);
  const blocks = countShields(def, true);
  const dmg = Math.max(0, skulls - blocks);
  const sub = dmg > 0 ? `${h.name} loses ${dmg}` : `${h.name} holds`;
  showDice('defend', atk, def, `${m.name} vs ${h.name}`, sub, () => {
    if (dmg > 0){ sfx('hit'); G.shake = 8 + dmg*3; hurt(h, dmg, null); }
    else { sfx('block'); spark(h.x, h.y, 8, '#dfe4ea', { spd:.012 }); }
    renderHUD();
    later(220, done);
  });
}

function hurt(a, n, done){
  a.bp -= n;
  a.hurtT = 280;
  floatText(a.x, a.y, '−' + n, a.kind === 'hero' ? '#ff7a6a' : '#ffd06a');
  spark(a.x, a.y, 10 + n*4, a.kind === 'hero' ? '#c0392b' : '#8a1f1f', { spd:.016, up:.004 });
  if (a.bp <= 0){ kill(a); }
  renderHUD();
  if (done) done();
}
function kill(a){
  a.alive = false; a.deathT = 620;
  if (a.kind === 'monster'){
    sfx('die');
    G.q.pot = (G.q.pot || 0) + (MONSTERS[a.mt] ? MONSTERS[a.mt].gold : 10);
    spark(a.x, a.y, 24, '#6a1f14', { spd:.02, up:.003 });
    say(`${a.name} falls.`, 'good');
    if (a.boss){
      G.q.bossDead = true;
      sfx('boss'); G.shake = 26;
      spark(a.x, a.y, 46, '#e0b040', { spd:.03, glow:'rgba(224,176,64,.5)', r:2.2, life:900 });
      say(`${a.name} is destroyed!`, 'good');
    }
    const npc = null;
  } else if (a.kind === 'hero'){
    sfx('heroDie');
    say(`${a.name} falls, and does not get up.`, 'bad');
    spark(a.x, a.y, 30, '#7a1f14', { spd:.02, life:800 });
    a.done = true;
    const npc = G.q.actors.find(x => x.kind === 'npc' && x.follow === a.id);
    if (npc){
      const other = livingHeroes()[0];
      npc.follow = other ? other.id : null;
    }
  }
  later(40, checkQuestState);
}

/* ------------------------------------------------------------- activation */

function beginHeroActivation(h){
  G.q.activeId = h.id;
  h.buffs.rockskin = 0; delete h.buffs.rockskin;
  h.buffs.veil = 0; delete h.buffs.veil;
  h.acted = false;
  focusOn(h.x, h.y);
  if (!h.rolled){
    const a = 1+ri(6), b = 1+ri(6);
    const total = Math.max(1, a + b - moveSlow(h));
    showMoveDice(a, b, () => {
      h.rolled = true; h.moveLeft = total;
      refreshField(); renderHUD();
      if (G.q.field && G.q.field.d.size <= 1) say(`${h.name} is hemmed in — move somebody else first.`, 'bad');
      else say(`${h.name} may move ${total} squares.`, '');
    });
  } else { refreshField(); renderHUD(); }
  if (h.rolled && h.moveLeft > 0 && G.q.field && G.q.field.d.size <= 1)
    say(`${h.name} is hemmed in — move somebody else first.`, 'bad');
}
function selectHero(id){
  const h = G.q.actors.find(a => a.kind === 'hero' && a.id === id);
  if (!h || !h.alive || h.done || busy() || G.q.phase !== 'hero') return;
  if (G.q.activeId === id) { focusOn(h.x, h.y); return; }
  sfx('ui');
  beginHeroActivation(h);
}
function endHeroTurn(){
  const h = activeHero();
  if (!h || busy()) return;
  h.done = true; h.moveLeft = 0;
  sfx('ui');
  const next = G.q.actors.find(a => a.kind === 'hero' && a.alive && !a.done);
  if (next) beginHeroActivation(next);
  else zargonTurn();
  renderHUD();
}

/* ------------------------------------------------------------ the Warlock */

function zargonTurn(){
  G.q.phase = 'monster';
  G.q.field = null;
  renderHUD();
  banner('THE WARLOCK', 'moves his pieces');
  // anything that can see a hero is awake now
  for (const m of monstersOf()){
    if (m.awake) continue;
    for (const h of livingHeroes())
      if (tileVisible(m.x,m.y) || hasLOS(m.x,m.y,h.x,h.y) && dist2(m.x,m.y,h.x,h.y) <= 8) { m.awake = true; break; }
  }
  const queue = monstersOf().filter(m => m.awake);
  let i = 0;
  const next = () => {
    if (G.q.over) return;
    if (i >= queue.length){ endZargonTurn(); return; }
    const m = queue[i++];
    if (!m.alive){ next(); return; }
    monsterAct(m, () => later(60, next));
  };
  later(HEADLESS ? 0 : 620, next);
}

function monsterAct(m, done){
  if (m.sleep > 0){ done(); return; }
  if (m.stun > 0){ m.stun--; done(); return; }
  const targets = livingHeroes();
  if (!targets.length){ done(); return; }
  // A monster holds its room until it can actually see somebody. Without this
  // leash a revealed dungeon turns into one rolling mob a dozen rooms deep.
  const engaged = targets.some(h => dist2(m.x,m.y,h.x,h.y) <= 12 && hasLOS(m.x,m.y,h.x,h.y));
  if (!engaged && roomAt(m.x,m.y) >= 0){ done(); return; }
  // closest hero we can actually reach or see
  let best = null, bestD = 1e9;
  for (const h of targets){
    const d = dist2(m.x,m.y,h.x,h.y);
    if (d < bestD){ bestD = d; best = h; }
  }
  if (!best){ done(); return; }
  const strike = () => {
    const adj = DIRS.some(([dx,dy]) => m.x+dx===best.x && m.y+dy===best.y && linked(m.x,m.y,best.x,best.y));
    if (adj){ focusOn(m.x,m.y); monsterAttack(m, best, done); }
    else done();
  };
  // already next to someone? hit them
  for (const h of targets){
    if (dist2(m.x,m.y,h.x,h.y) === 1 && linked(m.x,m.y,h.x,h.y)){
      focusOn(m.x,m.y); monsterAttack(m, h, done); return;
    }
  }
  const f = walkFieldSafe(m.x, m.y, m.mv, m);
  let goal = null, goalD = dist2(m.x,m.y,best.x,best.y), goalCost = 0;
  for (const [k, cost] of f.d){
    const x = k % W, y = (k/W)|0;
    if (blocked(x,y) && !(x===m.x&&y===m.y)) continue;
    const d = dist2(x,y,best.x,best.y);
    if (d < goalD || (d === goalD && cost < goalCost)){ goalD = d; goal = [x,y]; goalCost = cost; }
  }
  if (!goal){ strike(); return; }
  const path = tracePath(f, goal[0], goal[1]);
  if (!path || !path.length){ strike(); return; }
  let k = 0;
  const step = () => {
    if (k >= path.length){ strike(); return; }
    const [nx,ny] = path[k++];
    m.facing = nx > m.x ? 1 : nx < m.x ? -1 : m.facing;
    slide(m, nx, ny, 130, () => later(20, step));
  };
  step();
}

function endZargonTurn(){
  if (G.q.over) return;
  G.q.turn++;
  const q = QUESTS[G.q.qi];
  if (q.turnLimit && G.q.turn > q.turnLimit){ questOver(false, 'The working completes. Grimhold seals itself with you inside.'); return; }
  G.q.phase = 'hero';
  for (const h of heroes()){
    h.done = !h.alive; h.acted = false; h.rolled = false; h.moveLeft = 0;
  }
  setMood(monstersOf().some(m => m.awake && tileVisible(m.x,m.y)) ? 'fight' : 'explore');
  const first = heroes().find(h => h.alive && !h.done);
  if (!first){ questOver(false, 'The party is destroyed.'); return; }
  banner('YOUR TURN', 'turn ' + G.q.turn);
  beginHeroActivation(first);
  renderHUD();
}

/* ---------------------------------------------------------------- actions */

function openDoorAt(h, d){
  if (d.open) return false;
  if (d.secret && !d.found) return false;
  d.open = true;
  sfx('door');
  say('The door swings open.', '');
  revealRoom(d.rid);
  recomputeVision();
  refreshField();
  const q = QUESTS[G.q.qi];
  const room = ROOMS[d.rid];
  if (!G.q.announced) G.q.announced = {};
  if (!G.q.announced[d.rid]){
    G.q.announced[d.rid] = 1;
    const n = monstersOf().filter(m => roomAt(m.x,m.y) === d.rid).length;
    say(`${room.name}${n ? ' — ' + n + ' hostile' + (n>1?'s':'') : ' — empty'}`, n ? 'bad' : '');
    if (n) setMood('fight');
  }
  renderHUD();
  return true;
}
function doorBetween(x1,y1,x2,y2){
  const d = doorAt(x1,y1,x2,y2);
  return d && (!d.secret || d.found) ? d : null;
}

function searchTreasure(){
  const h = activeHero();
  if (!h || h.acted || busy()) return;
  const rid = roomAt(h.x, h.y);
  if (rid < 0){ say('You can only ransack a room, not a corridor.', 'bad'); return; }
  if (monstersOf().some(m => roomAt(m.x,m.y) === rid)){ say('Not with monsters in the room.', 'bad'); return; }
  if (G.q.searched[rid]){ say('This room has been picked over already.', 'bad'); return; }
  h.acted = true; G.q.searched[rid] = 1;
  sfx('search');
  const qf = G.q.furn.find(f => f.r === rid && f.quest && !f.taken);
  if (qf){
    qf.taken = true;
    later(260, () => giveQuestItem(qf.quest, h));
    renderHUD();
    return;
  }
  const card = TREASURE_DECK[G.q.deck[G.q.deckAt++ % G.q.deck.length]];
  later(260, () => applyTreasure(card, h));
  renderHUD();
}
function applyTreasure(card, h){
  if (card.k === 'gold'){
    G.q.pot = (G.q.pot || 0) + card.n;
    sfx('gold'); floatText(h.x, h.y, '+' + card.n, '#f3d488');
    spark(h.x, h.y, 16, '#d8a83c', { spd:.014, up:.004 });
    say(`${card.t}: ${card.d}`, 'good');
  } else if (card.k === 'item'){
    h.items[card.n] = (h.items[card.n] || 0) + 1;
    sfx('gold'); say(`${card.t} — ${h.name} takes it.`, 'good');
  } else if (card.k === 'hazard'){
    say(`${card.t}! ${card.d}`, 'bad');
    hurt(h, card.n, null);
  } else if (card.k === 'wander'){
    say(`${card.t} — ${card.d}`, 'bad');
    spawnWanderer(h);
  } else {
    say(`${card.t}. ${card.d}`, '');
  }
  renderHUD(); checkQuestState();
}
function spawnWanderer(h){
  const pool = ['goblin','orc','skeleton','fimir','zombie'];
  const t = pool[Math.min(pool.length-1, Math.floor(G.q.qi/2.4) + ri(2))] || 'goblin';
  const spots = [];
  for (const [dx,dy] of DIRS8){
    const x = h.x+dx, y = h.y+dy;
    if (isFloor(x,y) && !blocked(x,y) && linked(h.x,h.y,x,y)) spots.push([x,y]);
  }
  if (!spots.length) return;
  const [x,y] = pick(spots);
  const def = MONSTERS[t];
  G.q.actors.push({ kind:'monster', uid:9000 + ri(9999), mt:t, name:def.name, x, y, alive:true, facing:-1,
    bpMax:def.bp, bp:def.bp, atk:def.atk, def:def.def, mind:def.mind, mv:def.move,
    boss:false, awake:true, sleep:0, stun:0, bob:Math.random()*6.28 });
  spark(x, y, 20, '#6a1f7a', { spd:.02, glow:'rgba(150,60,200,.4)', r:1.4 });
  setMood('fight');
}

function searchTraps(){
  const h = activeHero();
  if (!h || h.acted || busy()) return;
  const rid = roomAt(h.x, h.y);
  if (monstersOf().some(m => tileVisible(m.x,m.y) && dist2(m.x,m.y,h.x,h.y) <= 5)){
    say('Too dangerous to search with a monster this close.', 'bad'); return;
  }
  h.acted = true; sfx('search');
  let found = 0;
  for (const tr of G.q.traps){
    if (tr.found || tr.sprung) continue;
    const inRoom = rid >= 0 && roomAt(tr.x,tr.y) === rid;
    const near = dist2(tr.x,tr.y,h.x,h.y) <= 5 && hasLOS(h.x,h.y,tr.x,tr.y);
    if (inRoom || near){ tr.found = true; found++; }
  }
  let doors = 0;
  for (const k in G.q.doors){
    const d = G.q.doors[k];
    if (!d.secret || d.found) continue;
    const near = dist2(d.rx,d.ry,h.x,h.y) <= 5 || dist2(d.cx,d.cy,h.x,h.y) <= 5;
    if ((rid >= 0 && d.rid === rid) || near){ d.found = true; doors++; }
  }
  if (G.q.trapSearchedTiles === undefined) G.q.trapSearchedTiles = 1;
  say(found || doors
    ? `${h.name} finds ${found ? found + ' trap' + (found>1?'s':'') : ''}${found&&doors?' and ':''}${doors ? doors + ' hidden door' + (doors>1?'s':'') : ''}.`
    : `${h.name} finds nothing hidden here.`, found||doors ? 'good' : '');
  recomputeVision(); renderHUD();
}

function disarmTarget(){
  const h = activeHero();
  if (!h) return null;
  for (const [dx,dy] of [[0,0],...DIRS]){
    const tr = trapAt(h.x+dx, h.y+dy);
    if (tr && tr.found && !tr.sprung && (dx===0&&dy===0 ? true : linked(h.x,h.y,h.x+dx,h.y+dy))) return tr;
  }
  return null;
}
function disarmTrap(){
  const h = activeHero();
  const tr = disarmTarget();
  if (!h || !tr || h.acted || busy()) return;
  h.acted = true;
  if (h.toolkit || h.gear.toolkit){
    tr.disarmed = true; sfx('search');
    say(`${h.name} pulls the mechanism apart. The trap is dead.`, 'good');
    spark(tr.x, tr.y, 10, '#9c8d75');
    renderHUD(); return;
  }
  const f = rollCombat(1);
  showDice('attack', f, [], `${h.name} works the trap`, f[0]===SKULL ? 'Disarmed' : f[0]===BLACK ? 'It goes off!' : 'No luck', () => {
    if (f[0] === SKULL){ tr.disarmed = true; say('The trap is disarmed.', 'good'); }
    else if (f[0] === BLACK){ if (dist2(tr.x,tr.y,h.x,h.y) === 0) springTrap(h, tr, ()=>{}); else { tr.sprung = true; say('It springs harmlessly.', ''); } }
    else say('The mechanism will not budge.', '');
    renderHUD();
  });
}

function quaffPotion(){
  const h = activeHero();
  if (!h || busy() || !h.items.potion) return;
  h.items.potion--;
  const before = h.bp;
  h.bp = Math.min(h.bpMax, h.bp + 4);
  sfx('heal');
  floatText(h.x, h.y, '+' + (h.bp - before), '#7de8a0');
  spark(h.x, h.y, 18, '#7de8a0', { spd:.012, up:.006 });
  say(`${h.name} drinks. +${h.bp - before} Body Points.`, 'good');
  renderHUD();
}
function useHolyWater(m){
  const h = activeHero();
  if (!h || h.acted || !h.items.holy || !m || !MONSTERS[m.mt].undead) return false;
  h.items.holy--; h.acted = true;
  const atk = rollCombat(3);
  const skulls = countSkulls(atk);
  showDice('attack', atk, [], `Holy water on ${m.name}`, skulls ? `${skulls} Body Points` : 'It only steams', () => {
    if (skulls > 0){ sfx('hit'); hurt(m, skulls, null); }
    spark(m.x, m.y, 20, '#e8f0ff', { spd:.016, glow:'rgba(220,240,255,.45)', r:1.4 });
    renderHUD(); checkQuestState();
  });
  return true;
}

/* ----------------------------------------------------------------- spells */

function knownSpells(h){
  const out = [];
  for (const el of h.elements) for (const k of ELEMENT_SPELLS[el]) out.push(k);
  return out;
}
function spellReady(h, key){ return knownSpells(h).includes(key) && !h.spent.includes(key); }

function castSpell(h, key, target){
  if (!spellReady(h, key) || h.acted) return false;
  const sp = SPELLS[key];
  h.acted = true; h.spent.push(key);
  sfx('spell');
  const el = ELEMENTS[sp.el];
  spark(h.x, h.y, 22, el.col, { spd:.016, up:.004, glow:hexA(el.col, .4) });
  if (sp.dice && target){
    const atk = rollCombat(sp.dice);
    const skulls = countSkulls(atk);
    const def = sp.noDef ? [] : rollCombat(target.def);
    const blocks = sp.noDef ? 0 : countShields(def, false);
    const dmg = Math.max(0, skulls - blocks);
    spark(target.x, target.y, 26, el.col, { spd:.022, glow:'rgba(255,180,90,.45)', r:1.6 });
    showDice('attack', atk, def, `${sp.name} → ${target.name}`, dmg ? `${dmg} Body Point${dmg>1?'s':''}` : 'No effect', () => {
      if (dmg > 0){ G.shake = 12; target.sleep = 0; hurt(target, dmg, null); }
      renderHUD(); checkQuestState();
    });
    say(`${h.name} casts ${sp.name}.`, 'magic');
    return true;
  }
  switch(key){
    case 'sleep':
      if (target.mind <= 4){ target.sleep = 1; say(`${target.name} slumps into sleep.`, 'magic'); }
      else say(`${target.name} shrugs off the spell.`, 'bad');
      break;
    case 'veil':
      target.buffs.veil = 1; say(`Mist closes around ${target.name}.`, 'magic'); break;
    case 'rockskin':
      target.buffs.rockskin = 1; say(`${target.name}'s skin turns to stone.`, 'magic'); break;
    case 'courage':
      target.buffs.courage = 1; say(`${target.name} burns with courage — +2 attack dice.`, 'magic'); break;
    case 'swiftwind':
      target.rolled = true; target.moveLeft += 6;
      say(`The wind takes ${target.name} — 6 more squares.`, 'magic'); break;
    case 'healing': case 'healbody': {
      const before = target.bp;
      target.bp = Math.min(target.bpMax, target.bp + sp.heal);
      floatText(target.x, target.y, '+' + (target.bp - before), '#7de8a0');
      sfx('heal');
      say(`${target.name} recovers ${target.bp - before} Body Points.`, 'good');
      break;
    }
    case 'tempest': {
      let n = 0;
      for (const m of monstersOf()) if (tileVisible(m.x,m.y)){ m.stun = 1; n++;
        spark(m.x, m.y, 12, '#9fd8e8', { spd:.02 }); }
      say(n ? `The tempest halts ${n} of them.` : 'The wind finds nothing to blow at.', 'magic');
      break;
    }
    case 'passrock':
      if (target && target.tile){
        slide(h, target.tile[0], target.tile[1], 200, () => { recomputeVision(); refreshField(); });
        say(`${h.name} walks through the stone.`, 'magic');
      }
      break;
  }
  refreshField(); renderHUD(); checkQuestState();
  return true;
}

/* -------------------------------------------------------------- objective */

function giveQuestItem(name, h){
  G.q.itemsFound.push(name);
  G.q.collected++;
  if (h) G.q.carrier = h.id;   // this one has to make it back up
  sfx('win');
  spark(h.x, h.y, 34, '#f3d488', { spd:.02, up:.004, glow:'rgba(243,212,136,.5)', r:2 });
  const wk = name === "Orc's Bane" ? 'orcsbane' : name === 'Spirit Blade' ? 'spirit' : null;
  if (wk){
    const old = h.weapon;
    h.weapon = wk;
    say(`${h.name} takes up the ${name}. (${WEAPONS[wk].dice} attack dice)`, 'good');
    if (old && WEAPONS[old] && !WEAPONS[old].quest) h.stowed = old;
  } else {
    say(`Found: ${name}.`, 'good');
  }
  renderHUD(); checkQuestState();
}
function objectiveReady(){
  const o = QUESTS[G.q.qi].objective;
  if (o.type === 'slay') return G.q.bossDead;
  if (o.type === 'fetch') return G.q.itemsFound.includes(o.item);
  if (o.type === 'collect') return G.q.collected >= o.count;
  if (o.type === 'rescue') return G.q.npcFreed;
  if (o.type === 'fetchslay') return G.q.itemsFound.includes(o.item) && G.q.bossDead;
  return false;
}
function needsEscape(){
  const t = QUESTS[G.q.qi].objective.type;
  return t === 'fetch' || t === 'collect' || t === 'rescue';
}
function onStairs(h){ return STAIRS.some(s => s[0]===h.x && s[1]===h.y); }

function checkQuestState(){
  if (!G.q || G.q.over) return;
  if (!livingHeroes().length){ questOver(false, 'The party is destroyed. Grimhold keeps what it takes.'); return; }
  const ready = objectiveReady();
  if (!ready) return;
  if (!needsEscape()){ questOver(true); return; }
  // the hero holding the prize has to walk it out; if they fall, anyone may
  const c = G.q.carrier ? livingHeroes().find(x => x.id === G.q.carrier) : null;
  if (c ? onStairs(c) : livingHeroes().some(onStairs)){ questOver(true); return; }
  if (!G.q.escapeHinted){
    G.q.escapeHinted = 1;
    say(`It is done — now get ${c ? c.name : 'out'} back to the stair.`, 'good');
  }
}
function questOver(won, why){
  if (G.q.over) return;
  G.q.over = won ? 1 : 2;
  clearTimers(); G.dice = null;
  sfx(won ? 'win' : 'lose');
  setMood('explore');
  later(HEADLESS ? 0 : 700, () => showQuestEnd(won, why));
}

function banner(a, b){
  if (HEADLESS) return;
  const el = document.getElementById('turnband');
  el.innerHTML = a + (b ? '<small>' + b + '</small>' : '');
  el.classList.add('on');
  setTimeout(() => el.classList.remove('on'), 1050);
}

/* ------------------------------------------------------------- 10. THE UI */

const $ = (id) => document.getElementById(id);
let portraitCache = {};

function renderLog(){
  if (HEADLESS) return;
  const el = $('log');
  el.innerHTML = G.q.log.map(l => `<div class="logline ${l.cls||''}">${l.text}</div>`).join('');
}

function heroPortrait(id, w, h){
  const key = id + '_' + w + '_' + h;
  if (portraitCache[key]) return portraitCache[key];
  const c = mkCan(w*2, h*2);
  const g = c.getContext('2d');
  g.scale(2,2);
  g.save(); g.translate(w/2, h*.62);
  HERO_ART[id](g, Math.min(w, h)*1.35, 0);
  g.restore();
  portraitCache[key] = c;
  return c;
}

function renderHUD(){
  if (HEADLESS || !G || !G.q) return;
  const q = QUESTS[G.q.qi];
  $('qname').innerHTML = `${q.name}<b>${q.sub}</b>`;
  $('goldn').textContent = G.camp.gold + (G.q.pot ? ' +' + G.q.pot : '');
  $('turnn').textContent = G.q.turn + (q.turnLimit ? '/' + q.turnLimit : '');
  $('turnpill').classList.toggle('gold', !!q.turnLimit && G.q.turn > q.turnLimit - 6);

  // --- party ------------------------------------------------------------
  const party = $('party');
  if (party.children.length !== G.camp.heroes.length){
    party.innerHTML = '';
    for (const h of G.camp.heroes){
      const c = document.createElement('div');
      c.className = 'hcard'; c.dataset.id = h.id;
      c.innerHTML = `<div class="top"><span class="st"></span><span class="nm">${h.name}</span><span class="num"></span></div>
        <canvas></canvas>
        <div class="bar bp"><i></i></div><div class="bar mp"><i></i></div>`;
      c.addEventListener('click', () => selectHero(h.id));
      party.appendChild(c);
      const cv2 = c.querySelector('canvas');
      cv2.width = 120; cv2.height = 68;
      const g2 = cv2.getContext('2d');
      g2.drawImage(heroPortrait(h.id, 60, 34), 0, 0, 120, 68);
    }
  }
  [...party.children].forEach(c => {
    const h = G.camp.heroes.find(x => x.id === c.dataset.id);
    c.classList.toggle('act', G.q.activeId === h.id && G.q.phase === 'hero');
    c.classList.toggle('done', h.done && h.alive);
    c.classList.toggle('dead', !h.alive);
    c.querySelector('.bar.bp i').style.width = Math.max(0, h.bp/h.bpMax*100) + '%';
    c.querySelector('.bar.mp i').style.width = (h.mp/h.mpMax*100) + '%';
    c.querySelector('.num').textContent = h.alive ? h.bp + '/' + h.bpMax : '✝';
    const st = [];
    if (h.buffs.rockskin) st.push('🪨');
    if (h.buffs.veil) st.push('🌫');
    if (h.buffs.courage) st.push('🔥');
    if (h.moveLeft > 0 && G.q.activeId === h.id) st.push(h.moveLeft + '▸');
    c.querySelector('.st').textContent = st.join(' ');
  });

  // --- movement pill ----------------------------------------------------
  const h = activeHero();
  const pill = $('movepill');
  if (h && G.q.phase === 'hero' && !busy()){
    const bits = [];
    if (h.moveLeft > 0) bits.push(`${h.moveLeft} squares left`);
    if (!h.acted) bits.push('1 action');
    pill.textContent = bits.join(' · ') || 'nothing left — end the turn';
    pill.classList.add('on');
  } else pill.classList.remove('on');

  // --- actions ----------------------------------------------------------
  const acts = $('actions');
  const trap = disarmTarget();
  const spells = h ? knownSpells(h).filter(k => spellReady(h,k)) : [];
  const packN = h ? (h.items.potion||0) + (h.items.holy||0) : 0;
  const rid = h ? roomAt(h.x,h.y) : -1;
  const roomHasMonsters = rid >= 0 && monstersOf().some(m => roomAt(m.x,m.y) === rid);
  const monsterNear = !!h && monstersOf().some(m => tileVisible(m.x,m.y) && dist2(m.x,m.y,h.x,h.y) <= 5);
  const spent = () => h ? `${h.name} has already taken an action this turn.` : 'Nobody is up.';
  const dicing = () => 'Hold on — the dice are still rolling.';
  const guard = (fn) => () => busy() ? dicing() : (!h ? 'Nobody is up.' : fn());
  const canSearch = !!h && !h.acted && rid >= 0 && !G.q.searched[rid] && !roomHasMonsters;
  const defs = [
    { ic:'🔦', lb:'Search<br>Room', on:canSearch, fn:searchTreasure, why: guard(() => {
        if (h.acted) return spent();
        if (rid < 0) return 'You can only ransack a room, not a corridor.';
        if (G.q.searched[rid]) return `${ROOMS[rid].name} has been picked over already.`;
        if (roomHasMonsters) return 'Not with monsters still in the room.';
        return null;
      }) },
    trap
      ? { ic:'🧰', lb:'Disarm<br>Trap', on:!!h && !h.acted, fn:disarmTrap, hot:!!h && !h.acted,
          why: guard(() => h.acted ? spent() : null) }
      : { ic:'🔍', lb:'Find<br>Traps', on:!!h && !h.acted && !monsterNear, fn:searchTraps, why: guard(() => {
          if (h.acted) return spent();
          if (monsterNear) return 'Too dangerous to search with a monster this close.';
          return null;
        }) },
    { ic:'✨', lb:'Cast<br>Spell', on:spells.length>0 && !!h && !h.acted, fn:openSpellbook,
      hot:spells.length>0 && !!h && !h.acted, why: guard(() => {
        if (!knownSpells(h).length) return `${h.name} knows no magic.`;
        if (h.acted) return spent();
        if (!spells.length) return `${h.name} has spent every spell this quest.`;
        return null;
      }) },
    { ic:'🎒', lb:'Pack<br>' + (packN?packN:''), on:packN>0, fn:openPack,
      why: guard(() => packN ? null : `${h.name} is carrying nothing to use.`) },
    { ic:'✔', lb:'End<br>Turn', on:!!h, fn:endHeroTurn, end:true,
      hot:!!h && h.acted && h.moveLeft <= 0, why: guard(() => null) },
  ];
  if (acts.children.length !== defs.length){
    acts.innerHTML = '';
    defs.forEach((d,i) => {
      const b = document.createElement('div');
      b.className = 'actbtn'; b.innerHTML = `<div class="ic"></div><div class="lb"></div>`;
      // A greyed button still answers when you press it — silence is the worst
      // possible response to "why can't I do this?"
      b.addEventListener('click', () => {
        const dd = acts._defs[i];
        audioInit();
        if (dd.on && !busy()) { dd.fn(); return; }
        const r = dd.why && dd.why();
        if (r) say(r, 'bad');
      });
      acts.appendChild(b);
    });
  }
  acts._defs = defs;
  [...acts.children].forEach((b, i) => {
    const d = defs[i];
    b.querySelector('.ic').textContent = d.ic;
    b.querySelector('.lb').innerHTML = d.lb;
    b.classList.toggle('off', !d.on || busy());
    b.classList.toggle('hot', !!d.hot && !busy());
    b.classList.toggle('end', !!d.end);
  });
}

function showQuestScroll(qi, onGo){
  const q = QUESTS[qi];
  modal(`
    <h2>${q.name}</h2>
    <div class="sub" style="margin:2px 0 0">${q.sub}</div>

function showQuestEnd(won, why){
  const q = QUESTS[G.q.qi];
  const pot = G.q.pot || 0;
  const bonus = won ? q.reward : 0;
  const total = pot + bonus;
  if (won){
    G.camp.gold += total;
    if (!G.camp.done.includes(G.q.qi)) G.camp.done.push(G.q.qi);
    G.camp.unlocked = Math.max(G.camp.unlocked, Math.min(QUESTS.length, G.q.qi + 2));
    // the blade and the bane are kept; everything else quest-bound is not
    for (const h of G.camp.heroes){
      if (WEAPONS[h.weapon] && WEAPONS[h.weapon].quest && q.keepItem !== h.weapon){
        h.weapon = h.stowed || heroDef(h).weapon;
      }
      delete h.stowed;
    }
  } else {
    G.camp.gold += Math.floor(pot/2);
  }
  for (const h of G.camp.heroes){ h.bp = h.bpMax; h.alive = true; h.buffs = {}; h.spent = []; }
  saveCampaign(); clearRun();
  const dead = G.q.actors.filter(a => a.kind === 'hero' && !a.alive).length;
  modal(`
    <h2 style="color:${won?'#63bf7d':'#b03a2c'}">${won ? 'Quest Complete' : 'Quest Failed'}</h2>
    <div class="sub" style="margin:2px 0 0">${q.name}</div>
    <div class="rule"></div>
    <p class="flavor">${won
      ? 'You come back up the stair with the dust of Grimhold on you, and Mentor is waiting.'
      : (why || 'Grimhold closes over you.')}</p>
    <div class="row"><div class="ic">◈</div><div class="tx"><b>Plunder carried out</b><s>Coin found in the dark</s></div><div style="color:#f3d488">${won?pot:Math.floor(pot/2)}</div></div>
    ${won?`<div class="row"><div class="ic">🏅</div><div class="tx"><b>Quest reward</b><s>Paid by the Empire</s></div><div style="color:#f3d488">${bonus}</div></div>`:''}
    <div class="row"><div class="ic">☠</div><div class="tx"><b>Heroes lost</b><s>They are back on their feet by morning — mostly</s></div><div>${dead}</div></div>
    <div class="rule"></div>
    <div class="goldline">Treasury: ◈ ${G.camp.gold}</div>
    <div style="text-align:center">
      <button class="btn big" id="mNext">${won ? 'To the Armoury' : 'Try Again'}</button>
      <button class="btn ghost" id="mMap">Quest Board</button>
    </div>`);
  bindModal('#mNext', () => { closeModal(); if (won) showArmoury(); else showQuestScroll(G.q.qi, () => launchQuest(G.q.qi)); });
  bindModal('#mMap', () => { closeModal(); showQuestSelect(); });
  if (!HEADLESS) $('hud').classList.remove('on');

function showArmoury(){
  const h = G.camp.heroes[shopHero];

  } else {

  modal(`

    <div class="row" style="border-bottom:1px solid rgba(216,168,60,.2)">
      <div class="ic">${WEAPONS[h.weapon].ic}</div>
      <div class="tx"><b>${h.name} — ${h.title}</b>
      <s>${h.bpMax} Body · ${h.mpMax} Mind · ${attackDice(h)} attack · ${defendDice(h)} defend</s></div>

  bindModal('#mGo', () => { closeModal(); showQuestSelect(); });
}
function shopRow(k, ic, name, desc, cost, owned, cant){
  const afford = G.camp.gold >= cost;
  const label = owned ? 'Equipped' : cant ? '—' : `◈ ${cost}`;
  return `<div class="row"><div class="ic">${ic}</div>
    <div class="tx"><b>${name}</b><s>${cant || desc}</s></div>
    <button class="bu ${owned?'own':''}" data-buy="${k}"
      ${(owned||cant||!afford)?'disabled':''}>${label}</button></div>`;
}
function buy(k){
  const h = G.camp.heroes[shopHero];
  let cost = 0, kind = null;
  if (WEAPONS[k]){ cost = WEAPONS[k].cost; kind = 'w'; }
  else if (ARMOURS[k]){ cost = ARMOURS[k].cost; kind = 'a'; }
  else if (GEAR[k]){ cost = GEAR[k].cost; kind = 'g'; }
  if (!kind || G.camp.gold < cost) return false;
  if (kind === 'w'){
    if (h.id === 'wizard' && WEAPONS[k].dice > 1) return false;
    h.weapon = k;
    if (WEAPONS[k].twoH) h.gear.shield = false;
  } else if (kind === 'a'){
    if (h.id === 'wizard') return false;
    h.armour = k;
  } else {
    if (k === 'shield' && WEAPONS[h.weapon].twoH) return false;
    if (GEAR[k].stack) h.items[k] = (h.items[k]||0) + 1;
    else h.gear[k] = true;
  }
  G.camp.gold -= cost;
  sfx('gold');
  saveCampaign();
  return true;
}

let ptrs = new Map(), dragged = false, downT = 0, pinchD = 0, pinchZ = 1;

function bindInput(){
  if (HEADLESS) return;
  const el = cv;
  el.addEventListener('pointerdown', e => {
    audioInit();
    el.setPointerCapture(e.pointerId);
    ptrs.set(e.pointerId, { x:e.clientX, y:e.clientY, ox:e.clientX, oy:e.clientY });
    if (ptrs.size === 1){ dragged = false; downT = performance.now(); }
    if (ptrs.size === 2){
      const [a,b] = [...ptrs.values()];
      pinchD = Math.hypot(a.x-b.x, a.y-b.y); pinchZ = G.cam.z;
    }
  });
  el.addEventListener('pointermove', e => {
    const p = ptrs.get(e.pointerId);
    if (!p) return;
    const dx = e.clientX - p.x, dy = e.clientY - p.y;
    p.x = e.clientX; p.y = e.clientY;
    if (Math.hypot(e.clientX - p.ox, e.clientY - p.oy) > 9) dragged = true;
    if (!G || !G.q) return;
    if (ptrs.size === 2){
      const [a,b] = [...ptrs.values()];
      const d = Math.hypot(a.x-b.x, a.y-b.y);
      if (pinchD > 0) G.cam.z = clamp(pinchZ * d/pinchD, .34, 2.2);
      G.cam.tx = G.cam.ty = null;
      clampCam();
    } else if (dragged){
      G.cam.x -= dx/G.cam.z; G.cam.y -= dy/G.cam.z;
      G.cam.tx = G.cam.ty = null;
      clampCam();
    }
  });
  const up = e => {
    const p = ptrs.get(e.pointerId);
    ptrs.delete(e.pointerId);
    if (!p) return;
    if (ptrs.size === 0 && !dragged && performance.now() - downT < 500) onTap(e.clientX, e.clientY);
    if (ptrs.size < 2) pinchD = 0;
  };
  el.addEventListener('pointerup', up);
  el.addEventListener('pointercancel', e => { ptrs.delete(e.pointerId); pinchD = 0; });
  el.addEventListener('wheel', e => {
    if (!G || !G.q) return;
    e.preventDefault();
    G.cam.z = clamp(G.cam.z * (e.deltaY > 0 ? .9 : 1.11), .34, 2.2);
    clampCam();
  }, { passive:false });

  $('btnPlay').addEventListener('click', () => { audioInit(); $('scTitle').classList.remove('on'); showQuestSelect(); });
  $('btnContinue').addEventListener('click', () => { audioInit(); resumeRun(); });
  $('btnHow').addEventListener('click', () => { audioInit(); $('scTitle').classList.remove('on'); showHow(); });
  $('menubtn').addEventListener('click', openMenu);
  $('scModal').addEventListener('click', e => { if (e.target.id === 'scModal' && modalOpen) { /* stay put */ } });
}

function onTap(sx, sy){
  if (!G || !G.q || modalOpen) return;
  if (G.dice){ return; }
  if (G.q.over) return;
  const [x,y] = tileOf(sx, sy);
  tapTile(x, y);
}

function tapTile(x, y){
  const h = activeHero();
  if (!h || G.q.phase !== 'hero' || busy()) return false;
  if (!inB(x,y)) return false;
  const target = actorAt(x,y);

  // aiming a spell or a vial
  if (G.aim){
    const a = G.aim;
    if (a.kind === 'holy'){
      if (target && target.kind === 'monster' && MONSTERS[target.mt].undead && tileVisible(x,y)){
        G.aim = null; useHolyWater(target); return true;
      }
      G.aim = null; say('Not a target for holy water.', 'bad'); renderHUD(); return false;
    }
    const sp = SPELLS[a.key];
    if (sp.target === 'enemy' && target && target.kind === 'monster' && target.alive
        && tileVisible(x,y) && hasLOS(h.x,h.y,x,y)){
      G.aim = null; castSpell(h, a.key, target); return true;
    }
    if (sp.target === 'hero' && target && target.kind === 'hero' && target.alive){
      G.aim = null; castSpell(h, a.key, target); return true;
    }
    if (sp.target === 'tile' && tileSeen(x,y) && !blocked(x,y) && dist2(x,y,h.x,h.y) <= 5){
      G.aim = null; castSpell(h, a.key, { tile:[x,y] }); return true;
    }
    G.aim = null; say('Nothing there to aim at.', 'bad'); renderHUD();
    return false;
  }

  // free the prisoner
  if (target && target.kind === 'npc' && dist2(x,y,h.x,h.y) <= 1 && linked(h.x,h.y,x,y)){
    if (!target.follow){
      target.follow = h.id; G.q.npcFreed = true; G.q.carrier = h.id;
      sfx('gold');
      say(`${target.name} is free — get them to the stair.`, 'good');
      spark(x, y, 18, '#f3d488', { spd:.014, up:.004 });
      checkQuestState(); renderHUD();
    }
    return true;
  }

  // strike, or close the distance and strike
  if (target && target.kind === 'monster' && target.alive && tileVisible(x,y)){
    const block = strikeBlocker(h, target);
    if (!block) return doAttack(h, target);
    // only distance is worth walking off; everything else is a flat refusal
    if (block !== 'range'){ say(strikeReason(h, target, block), 'bad'); return false; }
    if (h.moveLeft <= 0){
      say(h.rolled
        ? `The ${target.name} is out of reach, and ${h.name} has no movement left.`
        : `The ${target.name} is out of reach.`, 'bad');
      return false;
    }
    const f = G.q.field;
    let bestT = null, bestC = 1e9;
    for (const [dx,dy] of DIRS){
      const k = idx(target.x+dx, target.y+dy);
      if (!inB(target.x+dx, target.y+dy) || !f.d.has(k)) continue;
      if (!linked(target.x+dx, target.y+dy, target.x, target.y)) continue;
      const c = f.d.get(k);
      if (c < bestC){ bestC = c; bestT = [target.x+dx, target.y+dy]; }
    }
    if (!bestT){ say(`There is no way through to the ${target.name} from here.`, 'bad'); return false; }
    const path = tracePath(f, bestT[0], bestT[1]);
    heroWalk(h, path || [], () => { if (canStrike(h, target)) doAttack(h, target); });
    return true;
  }

  // a door next to us
  const near = dist2(x,y,h.x,h.y) === 1;
  if (near){
    const d = doorBetween(h.x, h.y, x, y);
    if (d && !d.open){ openDoorAt(h, d); renderHUD(); return true; }
  }

  // walk
  if (h.moveLeft <= 0){ say(h.rolled ? 'No movement left this turn.' : '', 'bad'); return false; }
  const f = G.q.field;
  if (f && f.d.has(idx(x,y)) && f.d.get(idx(x,y)) > 0){
    heroWalk(h, tracePath(f, x, y) || []);
    return true;
  }
  // walking toward a closed door: route to it, and open it when we arrive
  const open = walkFieldOpen(h.x, h.y, h.moveLeft + 1, h);
  if (open.d.has(idx(x,y))){
    const path = tracePath(open, x, y);
    if (path && path.length){ heroWalk(h, path); return true; }
  }
  return false;
}
function walkFieldOpen(sx, sy, maxSteps, mover){
  const d = new Map(), from = new Map();
  d.set(idx(sx,sy), 0);
  let frontier = [[sx,sy]];
  while (frontier.length){
    const next = [];
    for (const [x,y] of frontier){
      const cost = d.get(idx(x,y));
      if (cost >= maxSteps) continue;
      for (const [dx,dy] of DIRS){
        const nx = x+dx, ny = y+dy, ni = idx(nx,ny);
        if (!inB(nx,ny) || d.has(ni)) continue;
        if (!linkedIgnoringDoors(x,y,nx,ny)) continue;
        const dr = doorAt(x,y,nx,ny);
        if (dr && dr.secret && !dr.found) continue;
        if (!dr && TR[idx(x,y)] !== TR[ni]) continue;
        if (furnAt(nx,ny) || trapBlocks(nx,ny)) continue;
        const occ = actorAt(nx,ny);
        if (occ && occ !== mover && !(mover && mover.kind === 'hero' && occ.kind === 'hero')) continue;
        d.set(ni, cost+1); from.set(ni, idx(x,y));
        next.push([nx,ny]);
      }
    }
    frontier = next;
  }
  return { d, from };
}
