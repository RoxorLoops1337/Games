/* ------------------------------------------------------------- 12c2. TRIALS */
// A door that tells you what it wants before you open it. Optional, always —
// a trial you cannot decline is just a tax with a name on it.

const TRIALS = {
  survive: { turns:5, name:'The Vigil',
    terms:'Set foot inside and hold the room for five turns. Leave it empty and the vigil breaks.' },
  clean:   { name:'The Clean Kill',
    terms:'Kill everything in the room without a single hero taking a wound. One drop of blood and it is over.' },
  // Order of death, not speed or safety — a fight you have to aim rather than win
  marked:  { name:'The Marked One', needsMonsters:true,
    terms:'One of them wears the mark. It dies first, or it does not count. Anything else in the room falling before it breaks the trial.' },
};
const TRIAL_KINDS = Object.keys(TRIALS);
function trialDef(){ return G.q && G.q.trial ? TRIALS[G.q.trial.kind] : null; }
function trialActive(){ return !!(G.q && G.q.trial && G.q.trial.active && !G.q.trial.done); }

function startTrial(){
  if (!G.q || !G.q.trialRoom || G.q.trial) return false;
  G.q.trial = { room:G.q.trialRoom.room, kind:G.q.trialRoom.kind, turns:0,
                active:true, failed:false, done:false, won:false, marked:null };
  // The marked one is chosen when you accept, out of whatever is standing then,
  // so it is a target you can see rather than a secret you have to guess.
  if (G.q.trial.kind === 'marked'){
    const inRoom = monstersOf().filter(m => roomAt(m.x,m.y) === G.q.trial.room);
    if (!inRoom.length){ G.q.trial = null; return false; }
    const it = inRoom[ri(inRoom.length)];
    it.marked = true;
    G.q.trial.marked = it.uid;
    say(`The mark settles on ${it.name}.`, 'magic');
  }
  say(`${TRIALS[G.q.trial.kind].name} begins.`, 'magic');
  sfx('boss'); G.shake = 12;
  renderHUD();
  return true;
}
// dead or alive — the whole point is asking whether it has died yet
const markedOne = () => (G.q && G.q.trial && G.q.trial.marked)
  ? G.q.actors.find(a => a.kind === 'monster' && a.uid === G.q.trial.marked) || null : null;
// Breaking one used to simply stop. A trial you can fail for free is a lottery
// ticket, not a decision — so it breaks loudly: the doors of the room slam and
// bolt, and the Warlock looks up from whatever he was doing.
const TRIAL_WRATH = 8;
function failTrial(why){
  if (!trialActive()) return;
  const room = G.q.trial.room;
  G.q.trial.failed = true; G.q.trial.done = true; G.q.trial.active = false;
  say(`The trial is broken — ${why}`, 'bad');
  banner('BROKEN', 'the room is not finished with you');
  sfx('lose');
  G.shake = Math.max(G.shake, 20);
  hitStop(260);

  // every door of that room slams shut and bolts itself
  let slammed = 0;
  for (const k in G.q.doors){
    const d = G.q.doors[k];
    if (d.rid !== room) continue;
    d.open = false; d.locked = true; d.trialBolt = true;
    slammed++;
  }
  if (slammed){
    sfx('door');
    say(`The ${slammed > 1 ? 'doors' : 'door'} slam${slammed > 1 ? '' : 's'} and bolt${slammed > 1 ? '' : 's'}. You are on whichever side you are on.`, 'bad');
  }
  stirWrath(TRIAL_WRATH, 'a trial broken');
  if (spendPlinth()) say('The light on the plinth goes out.', 'bad');
  recomputeVision(); refreshField(); renderHUD();
  return slammed;
}
function winTrial(){
  if (!trialActive()) return;
  G.q.trial.won = true; G.q.trial.done = true; G.q.trial.active = false;
  say(`${trialDef().name} is answered.`, 'good');
  sfx('win'); G.shake = 16;
  addFate(2, 'a trial answered');
  // it pays what was standing on the plinth, not a surprise off the shelf
  const want = plinthRelic();
  const p = spendPlinth();
  if (p) spark(p.x, p.y, 26, '#f3d488', { spd:.02, up:.006, glow:'rgba(243,212,136,.5)', r:1.6 });
  const r = G.run ? (want || (relicOffer() || {}).id) : null;
  G.q.trialPaid = r || null;                  // what the room actually put up
  if (r) later(700, () => showRelic(r));
  renderHUD();
  return { won:true, relic:r };
}
// Called once a turn, after the Warlock has moved.
function tickTrial(){
  if (!trialActive()) return;
  const T = G.q.trial;
  if (T.kind === 'survive'){
    const held = livingHeroes().some(h => roomAt(h.x,h.y) === T.room);
    if (!held){ failTrial('nobody was left standing in the room.'); return; }
    T.turns++;
    if (T.turns >= TRIALS.survive.turns) winTrial();
    else say(`The vigil holds. ${TRIALS.survive.turns - T.turns} turn${TRIALS.survive.turns-T.turns>1?'s':''} to go.`, 'magic');
  }
}
function checkTrialKill(victim){
  if (!trialActive()) return;
  const T = G.q.trial;
  if (T.kind === 'clean'){
    const left = monstersOf().filter(m => roomAt(m.x,m.y) === T.room).length;
    if (!left) winTrial();
    return;
  }
  if (T.kind === 'marked'){
    // the marked one dies first, or not at all
    const it = markedOne();
    if (it && !it.alive){ winTrial(); return; }
    if (victim && victim.kind === 'monster' && victim.uid !== T.marked && victim.diedIn === T.room)
      failTrial(`${victim.name} went down before the marked one.`);
  }
}
function showTrialOffer(onAccept){
  const t = G.q.trialRoom;
  if (!t) return;
  const d = TRIALS[t.kind];
  modal(`<h2>${d.name}</h2>
    <div class="sub" style="margin:2px 0 0">${ROOMS[t.room].name}</div>
    <div class="rule"></div>
    <p class="flavor">Words are cut into the lintel, and they are not a warning. They are terms.</p>
    <div class="obj"><b>The terms</b>${d.terms}</div>
    ${(() => { const rid2 = plinthRelic(), R2 = rid2 && RELIC(rid2);
      return `<div class="row"><div class="ic">${R2 ? R2.ic : '✦'}</div><div class="tx"><b>If you answer them</b><s>2 Fate${
        R2 ? `, and the <b style="display:inline;font-size:inherit;color:var(--gold2)">${R2.name}</b> on the plinth — ${R2.desc}`
           : ', and whatever is on the plinth'}</s></div></div>`; })()}
    <div class="row"><div class="ic">⛓</div><div class="tx"><b>If you break them</b><s>Every door of this room slams and bolts —
      a shoulder and a Body Point to get through one — and the Warlock looks up</s></div></div>
    <div class="row"><div class="ic">🚪</div><div class="tx"><b>If you would rather not</b><s>The door stays shut. It will still be here.</s></div></div>
    <div class="rule"></div>
    <div style="text-align:center">
      <button class="btn big" id="mAccept">Accept the terms</button>
      <button class="btn ghost" id="mDecline">Walk on</button>
    </div>`);
  bindModal('#mAccept', () => { closeModal(); startTrial(); if (onAccept) onAccept(); });
  bindModal('#mDecline', () => { closeModal(); say('You leave the door shut.', ''); });
}

/* ------------------------------------------------------------ 12d2. RELICS */
// Relics are not drafted. You find them, in vaults and at the end of trials,
// and you may carry two. A third means putting one down — which is the first
// thing in the game you own rather than roll for.

const RELIC_SLOTS = 2;
const RELICS = [
  { id:'skull',  ic:'💀', name:"Warlock's Skull",       desc:'+1 Fate at the start of every floor.' },
  { id:'lantern',ic:'🏮', name:'Deepwater Lantern',     desc:'+3 torch, and every trap shows itself as you arrive.' },
  { id:'ring',   ic:'💍', name:'Ring of Bone',          desc:'+1 attack die against the undead.' },
  { id:'coin',   ic:'🪙', name:"Ferryman's Coin",       desc:'Once a run, a hero who would fall survives on 1 Body Point.' },
  { id:'horn',   ic:'📯', name:'Cracked Horn',          desc:'Everything in a room you open loses its first turn.' },
  { id:'mirror', ic:'🪞', name:'Black Mirror',          desc:'Your spells land on warded things anyway.' },
  { id:'anvil',  ic:'⚒',  name:'Splinter of the Anvil', desc:'+1 defend die, and traps cut one point less.' },
  { id:'thread', ic:'🧵', name:'Red Thread',            desc:'Hidden doors are never hidden from you.' },
];
const RELIC = (id) => RELICS.find(r => r.id === id);
const relicHas = (id) => !!(G && G.run && G.run.relics && G.run.relics.includes(id));
function relicOffer(){
  if (!G.run) return null;
  const pool = RELICS.filter(r => !G.run.relics.includes(r.id));
  return pool.length ? pool[ri(pool.length)] : null;
}
function takeRelic(id, dropId){
  if (!G.run || !RELIC(id) || relicHas(id)) return false;
  if (G.run.relics.length >= RELIC_SLOTS){
    const i = G.run.relics.indexOf(dropId);
    if (i < 0) return false;
    say(`${RELIC(dropId).name} is left behind.`, '');
    G.run.relics.splice(i, 1);
  }
  G.run.relics.push(id);
  say(`${RELIC(id).ic} ${RELIC(id).name} — ${RELIC(id).desc}`, 'good');
  sfx('win');
  applyRelicOnArrival();
  renderHUD(); saveRun();
  return true;
}
// The relics that do their work the moment you set foot on a floor.
function applyRelicOnArrival(){
  if (!G.q) return;
  if (relicHas('lantern')) for (const tr of G.q.traps) tr.found = true;
  if (relicHas('thread')) for (const k in G.q.doors) G.q.doors[k].found = true;
}
function showRelic(id){
  const r = RELIC(id);
  if (!r) return;
  const full = G.run.relics.length >= RELIC_SLOTS;
  modal(`<h2>${r.ic} ${r.name}</h2>
    <div class="sub" style="margin:2px 0 0">${full ? 'Your hands are full' : 'Yours, if you want it'}</div>
    <div class="rule"></div>
    <p class="flavor">${r.desc}</p>
    ${full ? `<div style="font-size:10px;letter-spacing:.24em;text-transform:uppercase;color:var(--dim);text-align:center;margin:10px 0 6px">Put something down</div>
      ${G.run.relics.map(x => `<div class="row">
        <div class="ic">${RELIC(x).ic}</div>
        <div class="tx"><b>${RELIC(x).name}</b><s>${RELIC(x).desc}</s></div>
        <button class="bu" data-drop="${x}">Drop this</button>
      </div>`).join('')}` : ''}
    <div class="rule"></div>
    <div style="text-align:center">
      ${full ? '' : `<button class="btn big" id="mTake">Take it</button>`}
      <button class="btn ghost" id="mLeaveR">Leave it</button>
    </div>`);
  bindModal('#mTake', () => { takeRelic(id); closeModal(); });
  bindAll('.bu[data-drop]', el => { takeRelic(id, el.dataset.drop); closeModal(); });
  bindModal('#mLeaveR', closeModal);
}

/* ------------------------------------------------------------- 12e. CURSES */
// A curse you carry, floor after floor, until you pay somebody to lift it.
// Some of them are worth keeping — that is what makes taking one a decision.

// Every mark takes something and gives something back. A curse you would never
// keep is just a punishment; a curse you might keep is a decision.
const CURSE_MARKS = [
  { id:'frail',  ic:'🦴', name:'Brittle Bones',  desc:'−1 defend die for every hero.',
    up:'But they swing like they have nothing to lose: +1 attack die.' },
  { id:'heavy',  ic:'⛓',  name:'Dragging Chain', desc:'−1 to every movement roll.',
    up:'But you are dug in where you stand: +1 defend die.' },
  { id:'blind',  ic:'🕯', name:'Guttering Light',desc:'Your torches reach 2 squares less.',
    up:'And nothing sees you coming until it is close.' },
  { id:'greedy', ic:'🪙', name:"Miser's Due",    desc:'Coin you find is worth a quarter less.',
    up:'The stone takes coin and gives interest: +1 Fate every floor.' },
  { id:'watched',ic:'👁', name:'Marked',         desc:'Something new arrives every sixth turn.',
    up:'And everything it sends is worth two Fate instead of one.' },
  { id:'thin',   ic:'🩸', name:'Thin Skin',      desc:'Traps cut one Body Point deeper.',
    up:'You are jumpy enough to spot every one of them on arrival.' },
];
const CURSE_MARK = (id) => CURSE_MARKS.find(c => c.id === id);
const curseHas = (id) => !!(G && G.run && G.run.curses && G.run.curses.includes(id));
function addCurse(id){
  if (!G.run) return null;
  const free = CURSE_MARKS.filter(c => !G.run.curses.includes(c.id));
  const c = id ? CURSE_MARK(id) : (free.length ? free[ri(free.length)] : null);
  if (!c || G.run.curses.includes(c.id)) return null;
  G.run.curses.push(c.id);
  say(`${c.ic} ${c.name} — ${c.desc}`, 'bad');
  if (c.up) say(c.up, 'good');
  return c.id;
}
function liftCurse(id){
  if (!G.run || !G.run.curses.length) return null;
  const which = id || G.run.curses[0];
  const i = G.run.curses.indexOf(which);
  if (i < 0) return null;
  G.run.curses.splice(i, 1);
  say(`${CURSE_MARK(which).name} is lifted.`, 'good');
  return which;
}

/* ------------------------------------------------- 12e2. WHAT YOU ARE CARRYING */
// The top bar can only afford icons. Tapping the run line spells them out —
// this floor's modifiers, then every boon, curse and relic, with its text.

function carriedList(){
  const out = [];
  if (!G || !G.q) return out;
  for (const m of (questDef().mods || [])){
    const d = MOD(m); if (d) out.push({ group:'floor', id:d.id, ic:d.ic, name:d.name, desc:d.desc });
  }
  if (G.run){
    for (const b of G.run.boons){
      const d = BOON(b); if (!d) continue;
      // a boon you paid Body Points for reads under its own heading, with the toll
      out.push(BLOOD(b)
        ? { group:'blood', id:d.id, ic:d.ic, name:d.name, desc:d.desc, up:d.toll }
        : { group:'boon',  id:d.id, ic:d.ic, name:d.name, desc:d.desc });
    }
    for (const c of G.run.curses){
      const d = CURSE_MARK(c);
      if (d) out.push({ group:'curse', id:d.id, ic:d.ic, name:d.name, desc:d.desc, up:d.up });
    }
    for (const r of G.run.relics){
      const d = RELIC(r); if (d) out.push({ group:'relic', id:d.id, ic:d.ic, name:d.name, desc:d.desc });
    }
  }
  return out;
}
const CARRY_HEADS = { floor:'This floor', boon:'Boons', blood:'Paid in blood', curse:'Curses', relic:'Relics' };
const CARRY_ORDER = ['floor','boon','blood','curse','relic'];
function showCarried(){
  const items = carriedList();
  const q = questDef();
  let body = '';
  for (const g of CARRY_ORDER){
    const rows = items.filter(i => i.group === g);
    if (!rows.length) continue;
    body += `<div style="font-size:10px;letter-spacing:.24em;text-transform:uppercase;color:var(--dim);margin:12px 0 4px">${
      CARRY_HEADS[g]}${g === 'relic' ? ` · ${rows.length}/${RELIC_SLOTS}` : ''}</div>`;
    body += rows.map(i => `<div class="row"><div class="ic">${i.ic}</div><div class="tx"><b>${i.name}</b><s>${
      i.desc}${i.up ? ' ' + i.up : ''}</s></div></div>`).join('');
  }
  if (!body) body = `<p class="flavor">Nothing but the torch and what you walked in with.</p>`;
  const fallen = (G.q.fallen || []);
  if (fallen.length){
    body += `<div style="font-size:10px;letter-spacing:.24em;text-transform:uppercase;color:var(--blood);margin:12px 0 4px">The fallen</div>`;
    body += fallen.map(f => `<div class="row"><div class="ic">✝</div><div class="tx"><b>${
      f.name}</b><s>Cut down by ${f.by}.</s></div></div>`).join('');
  }
  modal(`<h2>${q.name}</h2>
    <div class="sub" style="margin:2px 0 0">${q.sub}</div>
    <div class="rule"></div>
    ${body}
    <div class="rule"></div>
    <div style="text-align:center"><button class="btn ghost" id="mCarryClose">Back</button></div>`);
  bindModal('#mCarryClose', closeModal);

/* ---------------------------------------------------- 12f. WHAT HEROES LEARN */
// Kills buy a pick. Four floors deep the barbarian who has been doing the
// killing is a different barbarian from the one who walked in.

const LESSONS = [
  { id:'hand',  ic:'🗡', name:'Weapon Hand', desc:'+1 attack die, always.' },
  { id:'guard', ic:'🛡', name:'Guard',       desc:'+1 defend die, always.' },
  { id:'vigour',ic:'❤',  name:'Vigour',      desc:'+2 maximum Body Points, and heal that much now.' },
  { id:'fleet', ic:'👟', name:'Fleet',       desc:'+2 to your movement rolls.' },
];
const LESSON = (id) => LESSONS.find(l => l.id === id);
const KILL_STEPS = [3, 7, 12, 18, 25];
const lessonCount = (h) => (h.picks || []).length;
function lessonDue(h){
  const step = KILL_STEPS[lessonCount(h)];
  return step !== undefined && (h.kills || 0) >= step;
}
function heroHas(h, id){ return !!(h.picks && h.picks.includes(id)); }
function lessonOptions(h){
  const pool = LESSONS.filter(l => (h.picks || []).filter(p => p === l.id).length < 2);
  const out = [];
  const c = pool.slice();
  while (out.length < 3 && c.length) out.push(c.splice(ri(c.length), 1)[0]);
  return out;
}
function takeLesson(h, id){
  if (!LESSON(id) || !lessonDue(h)) return false;
  h.picks = h.picks || [];
  h.picks.push(id);
  if (id === 'vigour'){ h.bpMax += 2; h.bp = Math.min(h.bpMax, h.bp + 2); }
  say(`${h.name} learns ${LESSON(id).name}.`, 'good');
  spark(h.x, h.y, 24, '#f3d488', { spd:.016, up:.005, glow:'rgba(243,212,136,.5)', r:1.6 });
  sfx('win');
  renderHUD();
  return true;
}
function showLesson(h){
  const opts = lessonOptions(h);
  if (!opts.length) return;
  G.q.lesson = { hero:h.id, opts:opts.map(o => o.id) };
  modal(`<h2>${h.name} Has Been Busy</h2>
    <div class="sub" style="margin:2px 0 0">${h.kills} kills</div>
    <div class="rule"></div>
    <p class="flavor">Something in the way they move has changed. Whatever they picked
      up down here, they are keeping it.</p>
    ${opts.map(o => `<div class="row">
      <div class="ic">${o.ic}</div>
      <div class="tx"><b>${o.name}</b><s>${o.desc}</s></div>
      <button class="bu" data-lesson="${o.id}">Take</button>
    </div>`).join('')}`);
  bindAll('.bu[data-lesson]', el => { takeLesson(h, el.dataset.lesson); closeModal(); });
}

/* ----------------------------------------------- 12g. THE WARLOCK'S ATTENTION */
// Time spent and coin taken both draw his eye. Greed should cost something.

const WRATH_STEPS = [14, 28, 44];
function stirWrath(n, why){
  if (!G.q || G.q.over) return;
  G.q.wrath = (G.q.wrath || 0) + n;
  const step = WRATH_STEPS[G.q.wrathAt || 0];
  if (step !== undefined && G.q.wrath >= step){
    G.q.wrathAt = (G.q.wrathAt || 0) + 1;
    warlockActs(G.q.wrathAt);
  }
  renderHUD();
}
function warlockActs(level){
  const hs = livingHeroes();
  if (!hs.length) return;
  sfx('boss'); G.shake = 18;
  if (level === 1){
    say('The keep shifts. Something is sent for you.', 'bad');
    const h = hs[ri(hs.length)];
    spawnWanderer(h);
    const born = monstersOf()[monstersOf().length - 1];
    if (born) born.awake = true;
  } else if (level === 2){
    // seal the way you came
    const open = Object.values(G.q.doors).filter(d => d.open);
    if (open.length){
      const d = open[ri(open.length)];
      d.open = false; d.locked = false;
      say('A door slams somewhere behind you, and the bolt goes across.', 'bad');
      recomputeVision(); refreshField();
    } else say('The stone groans. He knows where you are.', 'bad');
  } else {
    const h = hs.slice().sort((a,b) => b.bp - a.bp)[0];
    say(`The Warlock's eye settles on ${h.name}.`, 'bad');
    h.poison = Math.max(h.poison || 0, 2);
    const born2 = hs[ri(hs.length)];
    spawnWanderer(born2);
    const m = monstersOf()[monstersOf().length - 1];
    if (m && !m.affix){ applyAffix(m, AFFIXES[ri(AFFIXES.length)].id); m.awake = true; }
  }
}

const boonHas = (id) => !!(G && G.run && G.run.boons && G.run.boons.includes(id));
const modHas  = (id) => !!(G && G.q && G.q.def && G.q.def.mods && G.q.def.mods.includes(id));
const metaHas = (id) => !!(G && G.meta && G.meta.unlocks && G.meta.unlocks.includes(id));

/* ------------------------------------------------------------ 12c. ELITES */
// A champion is an ordinary monster wearing one visible affix. It is the
// cheapest way to make a corridor of orcs stop being a corridor of orcs.

const AFFIXES = [
  { id:'armoured',  ic:'🛡', name:'Armoured',  desc:'+2 defend dice',            col:'#9aa6b4' },
  { id:'frenzied',  ic:'⚔',  name:'Frenzied',  desc:'strikes twice',            col:'#e0603c' },
  { id:'venomous',  ic:'🐍', name:'Venomous',  desc:'its wounds keep bleeding', col:'#7fd86b' },
  { id:'warded',    ic:'✦',  name:'Warded',    desc:'spells wash off it',       col:'#a88ae8' },
  { id:'vampiric',  ic:'🩸', name:'Vampiric',  desc:'heals on every hit',       col:'#c0392b' },
  { id:'hulking',   ic:'💪', name:'Hulking',   desc:'+2 Body Points, +1 attack die', col:'#d8a83c' },
  { id:'skittering',ic:'💨', name:'Skittering',desc:'moves three squares further',   col:'#7fc8e8' },
];
const AFFIX = (id) => AFFIXES.find(a => a.id === id);

function applyAffix(m, id){
  if (m.affix) return m;                  // one affix a champion, never two
  m.affix = id;
  m.name = AFFIX(id).name + ' ' + m.name;
  m.elite = true;
  if (id === 'armoured') m.def += 2;
  if (id === 'hulking'){ m.bpMax += 2; m.bp = m.bpMax; m.atk += 1; }
  if (id === 'skittering') m.mv += 3;
  return m;
}
const isWarded = (m) => m && m.affix === 'warded';

// Poison left by a venomous strike: one Body Point at the start of your turn.
function tickPoison(){
  for (const h of livingHeroes()){
    if (!h.poison) continue;
    h.poison--;
    floatText(h.x, h.y, '☠', '#7fd86b');
    spark(h.x, h.y, 8, '#7fd86b', { spd:.01, up:.004 });
    say(`${h.name} is bleeding — 1 Body Point.`, 'bad');
    hurt(h, 1, null);
  }
}

/* -------------------------------------------------------------- 12d. FATE */
// One spendable currency that turns a bad roll into a decision. Nothing else
// in the game is this addictive, so it is deliberately scarce.

function fateOf(){ return G.run ? (G.run.fate || 0) : (G.q ? (G.q.fate || 0) : 0); }
function addFate(n, why){
  if (!G.q) return;
  if (G.run) G.run.fate = (G.run.fate || 0) + n;
  else G.q.fate = (G.q.fate || 0) + n;
  if (n > 0) say(`✦ ${n} Fate${why ? ' — ' + why : ''}.`, 'magic');
  renderHUD();
}
// Reroll the dice on the table. Only once per pool, and only while they are up.
function canReroll(){
  return !!(G.dice && G.dice.kind !== 'move' && !G.dice.rerolled && fateOf() > 0 && !G.q.over);
}
function spendReroll(){
  if (!canReroll()) return false;
  const D = G.dice;
  D.rerolled = true;
  if (G.run) G.run.fate--; else G.q.fate--;
  const atk = [], def = [];
  for (const it of D.items){
    it.face = combatDie();
    it.settle = Math.max(120, D.t + 90);
    (it.side === 'atk' ? atk : def).push(it.face);
  }
  D.t = Math.min(D.t, 60);
  D.settleAt = 60 + D.items.length*90 + 180;
  D.hold = false;                                  // spent — it resolves on its own now
  D.total = D.settleAt + 900;
  if (D.timer) D.timer.t = D.total;
  if (D.onReroll) D.onReroll(atk, def);
  sfx('spell'); G.shake = 8;
  say('✦ Fate is spent. The dice go again.', 'magic');
  renderHUD();
  return true;
}

/* ------------------------------------------------------- floor generation */

const FLOOR_A = ['Weeping','Ashen','Hollow','Rusted','Bleeding','Silent','Broken','Gilded',
                 'Drowned','Hungry','Cold','Burnt','Forgotten','Sunken','Whispering','Split'];
const FLOOR_B = ['Stair','Gallery','Warren','Vault','Cloister','Shambles','Undercroft',
                 'Reliquary','Kennel','Pit','Reach','Gate','Larder','Choir'];

// cost, and the depth at which a thing starts turning up
const SPAWN_TABLE = [
  { t:'goblin',  cost:1, from:1 }, { t:'orc',      cost:2, from:1 },
  { t:'skeleton',cost:2, from:2 }, { t:'zombie',   cost:2, from:3 },
  { t:'fimir',   cost:3, from:3 }, { t:'mummy',    cost:4, from:5 },
  { t:'chaos',   cost:5, from:5 }, { t:'gargoyle', cost:6, from:7 },
  { t:'sorcerer',cost:6, from:7 }, { t:'ogre',     cost:7, from:9 },
  { t:'archer',  cost:2, from:2 }, { t:'cultist',  cost:3, from:4 },
  { t:'wraith',  cost:4, from:6 }, { t:'troll',    cost:6, from:8 },
  { t:'spider',  cost:3, from:3 }, { t:'hound',    cost:4, from:5 },
  { t:'chained', cost:7, from:8 },
];
const BOSS_TABLE = [
  { t:'gargoyle', from:1 }, { t:'chaos', from:3 }, { t:'ogre', from:5 },
  { t:'sorcerer', from:5 }, { t:'troll', from:8 },
];
const BOSS_NAMES = ['Verag','Gulthor','Ulag','Karlen','Balur','Torvin','Vess','Gorag','Skarn','Malgrim'];

function makeFloor(depth, R){
  const pick1 = (arr) => arr[Math.floor(R()*arr.length)];
  const name = `The ${pick1(FLOOR_A)} ${pick1(FLOOR_B)}`;
  const bossFloor = depth % 5 === 0;

  // --- modifiers ---------------------------------------------------------
  const mods = [];
  const modChance = Math.min(.85, .18 + depth*.07);
  const pool = MODIFIERS.filter(m => (m.from || 1) <= depth).map(m => m.id);
  // splice on an empty pool yields undefined — never let that reach the floor
  const draw = () => pool.length ? pool.splice(Math.floor(R()*pool.length), 1)[0] : null;
  if (R() < modChance){ const m = draw(); if (m) mods.push(m); }
  if (depth >= 4 && R() < modChance*.5){ const m = draw(); if (m) mods.push(m); }

  // --- objective ---------------------------------------------------------
  const kinds = bossFloor ? ['slay']
    : depth <= 4 ? ['slay','clear','fetch','rescue','collect']
    : ['slay','slay','fetch','collect','rescue'];        // clearing a deep floor is a grind
  const type = pick1(kinds);
  const rooms = ROOMS.map(r => r.id);
  const far = rooms.filter(id => {
    const r = ROOMS[id];
    return Math.abs(r.x - 8) + Math.abs(r.y - 15) > 8;
  });
  const goalRoom = pick1(far.length ? far : rooms);

  let objective, keepItem = null;
  if (type === 'slay')       objective = { type:'slay',  label:'Slay the master of this floor' };
  else if (type === 'clear') objective = { type:'clear', label:'Kill everything on this floor' };
  else if (type === 'fetch') objective = { type:'fetch', item:'Black Key', label:'Find the Black Key and take the stair' };
  else if (type === 'collect') objective = { type:'collect', count:2 + (depth > 6 ? 1 : 0), item:'Reliquary',
                                             label:`Recover ${2 + (depth > 6 ? 1 : 0)} reliquaries and take the stair` };
  else objective = { type:'rescue', npc:'A Prisoner', room:goalRoom, label:'Free the prisoner and take the stair' };

  // --- the garrison ------------------------------------------------------
  let budget = 9 + depth*4;
  if (mods.includes('swarm')) budget = Math.round(budget*1.5);
  let table = SPAWN_TABLE.filter(e => e.from <= depth);
  if (mods.includes('swarm')) table = table.filter(e => e.cost <= 2).concat(table.slice(0,2));
  if (mods.includes('haunted')){
    // never past the depth gate — a mummy on floor one is not a modifier, it is a bug
    const undead = SPAWN_TABLE.filter(e => MONSTERS[e.t].undead && e.from <= depth);
    if (undead.length) table = undead;
  }
  if (!table.length) table = [SPAWN_TABLE[0]];

  const monsters = [];
  const roomOrder = rooms.slice();
  for (let i = roomOrder.length - 1; i > 0; i--){ const j = Math.floor(R()*(i+1)); const t = roomOrder[i]; roomOrder[i] = roomOrder[j]; roomOrder[j] = t; }
  const useRooms = roomOrder.slice(0, Math.min(rooms.length, 5 + Math.min(depth, 5)));
  let guard = 0;
  while (budget > 0 && guard++ < 200){
    const e = pick1(table);
    if (e.cost > budget + 1) { if (table.every(x => x.cost > budget + 1)) break; continue; }
    const r = pick1(useRooms);
    const found = monsters.find(m => m.r === r && m.t === e.t);
    if (found) found.n++; else monsters.push({ r, t:e.t, n:1 });
    budget -= e.cost;
  }

  // the thing in charge
  if (type === 'slay'){
    const bossPool = BOSS_TABLE.filter(b => b.from <= depth);
    const bt = pick1(bossPool.length ? bossPool : [BOSS_TABLE[0]]);
    const bp = MONSTERS[bt.t].bp + Math.floor(depth/2) + (bossFloor ? 2 : 0);
    monsters.push({ r:goalRoom, t:bt.t, n:1, boss:true, bp,
                    name:(bossFloor ? '' : '') + pick1(BOSS_NAMES) + (bossFloor ? ' the Deep' : '') });
  }

  // --- furniture and the prize ------------------------------------------
  const FTYPES = ['table','chest','bookcase','rack','alchemy','tomb','fireplace','cupboard','altar','sorcerer','cage','throne'];
  const furn = [];
  const nf = 5 + Math.floor(R()*4);
  for (let i=0;i<nf;i++) furn.push({ r:pick1(rooms), t:pick1(FTYPES) });
  if (type === 'fetch') furn.push({ r:goalRoom, t:pick1(['chest','tomb','bookcase','altar']), quest:objective.item });
  if (type === 'collect'){
    const spread = roomOrder.slice(0, objective.count);
    for (const r of spread) furn.push({ r, t:'chest', quest:objective.item });
  }

  // A vault is never the objective room: sealing that behind a key would let a
  // floor lock its own quest away.
  const vaultPool = rooms.filter(id => id !== goalRoom);
  const vaultRoom = depth >= 3 && R() < .45 ? vaultPool[Math.floor(R()*vaultPool.length)] : -1;
  // a trial is never the objective room and never the vault: one door, one idea
  const trialPool = rooms.filter(id => id !== goalRoom && id !== vaultRoom);
  const trialRoom = depth >= 4 && R() < .38
    ? { room: trialPool[Math.floor(R()*trialPool.length)],
        kind: TRIAL_KINDS[Math.floor(R()*TRIAL_KINDS.length)] }
    : null;

  let traps = 2 + Math.floor(depth*.8);
  if (mods.includes('brittle')) traps *= 2;
  return {
    name, sub:`Depth ${depth}`, depth, mods,
    intro:'', objective, monsters, furn,
    traps:Math.min(14, traps), secrets: depth >= 3 ? 2 : 1,
    eliteChance: Math.min(.32, .06 + depth*.032),
    vault: vaultRoom,
    trial: trialRoom,
    reward: 60 + depth*40, keepItem,
  };
}

/* ---------------------------------------------------------- the run itself */

function newRun(partyIds){
  const heroes = HERO_DEFS.filter(d => partyIds.includes(d.id)).map(mkHero);
  for (const h of heroes){
    if (metaHas('leather')) h.armour = 'leather';
    if (metaHas('potionbelt')) h.items.potion = (h.items.potion||0) + 1;
    if (metaHas('veteran')){ h.bpMax++; h.bp = h.bpMax; }
  }
  return {
    heroes, party:partyIds.slice(), depth:0, boons:[], gold: metaHas('warchest') ? 250 : 0,
    kills:0, floorsCleared:0, revived:false, over:false, fate:1, nextDef:null, stake:0, doubles:0,
    curses:[], relics:[], coinUsed:false,
    seed: (Math.random()*1e9)|0,
  };
}
function runAlive(){ return G.run ? G.run.heroes.filter(h => h.alive) : []; }

// Two or three stairs lead down from every floor, and you see what is waiting
// at the bottom of each before you commit to one.
function floorChoices(depth){
  const n = depth >= 3 ? 3 : 2;
  const out = [];
  for (let i = 0; i < n; i++){
    const R = mkRng(G.run.seed + depth*7717 + i*90001);
    const def = makeFloor(depth, R);
    def.branch = i;
    out.push(def);
  }
  return out;
}
function chooseFloor(def){
  if (!G.run) return false;
  G.run.nextDef = def;
  return true;
}

function beginFloor(){
  const R = mkRng(G.run.seed + G.run.depth*7717);
  const def = G.run.nextDef || makeFloor(G.run.depth, R);
  G.run.nextDef = null;
  clearTimers();
  G.fx = []; G.dice = null; G.aim = null; G.shake = 0;
  G.cam = { x:0, y:0, z:1, tx:null, ty:null };

  // Mentor's bargain: one fallen hero comes back before the floor is entered
  if (metaHas('revive') && !G.run.revived && G.run.heroes.some(h => !h.alive) && runAlive().length){
    const back = G.run.heroes.find(h => !h.alive);
    back.alive = true; back.bp = 1; G.run.revived = true;
    say(`${back.name} is dragged back from the dark. Mentor's bargain is spent.`, 'good');
  }
  for (const h of G.run.heroes){
    if (!h.alive) continue;
    h.bp = Math.min(h.bpMax, h.bp + 2);                  // a breather between floors
    h.echoed = 0;
    if (boonHas('alchemist')) h.items.potion = (h.items.potion||0) + 1;
  }
  if (boonHas('hoard')) G.run.gold += 100;

  startQuest(-1, def, G.run.seed + G.run.depth*104729 + (def.branch || 0)*7717);
  G.q.runDepth = G.run.depth;
  if (boonHas('trapsense') || boonHas('lastlight') || modHas('brittle') || curseHas('thin'))
    for (const tr of G.q.traps) tr.found = true;
  if (boonHas('mapsense') || boonHas('lastlight')) for (const k in G.q.doors) G.q.doors[k].found = true;
  applyRelicOnArrival();
  if (relicHas('skull')) addFate(1, "the Warlock's skull");
  if (curseHas('greedy')) addFate(1, 'the stone pays interest');
  recomputeVision();

  bakeDungeon(4242 + G.run.depth*991);
  const v = viewBox();
  G.cam.z = HEADLESS ? 1 : clamp(Math.min(v.w, v.h) / (TS*8.6), .42, 1.4);
  focusOn(STAIRS[0][0], STAIRS[0][1] - 2, true);
  if (!HEADLESS){ $('scTitle').classList.remove('on'); $('hud').classList.add('on'); }
  setMood('explore');
  say(`Depth ${G.run.depth}: ${def.name}.`, '');
  for (const m of def.mods){ const M = MOD(m); if (M) say(`${M.ic} ${M.name} — ${M.desc}`, 'bad'); }
  banner('DEPTH ' + G.run.depth, def.name);
  renderHUD(); renderLog();
  saveRun();
}

function startRun(partyIds){
  G.run = newRun(partyIds);
  G.run.depth = 1;
  beginFloor();
}

// Called instead of showQuestEnd when a Descent floor resolves.
function descentFloorEnd(won, why){
  const pot = G.q.pot || 0;
  G.run.kills += (G.q.kills || 0);
  if (won){
    G.run.stake = pot + questDef().reward;      // stake it, or bank it on the next screen
    G.run.doubles = 0;
    G.run.floorsCleared++;
  }
  saveRun();
  if (!won || !runAlive().length){ endRun(why); return; }
  showDraft();
}

function endRun(why){
  settleStake();                                 // an unresolved stake still counts
  G.run.over = true;
  const depth = G.run.depth;
  const favour = depth + G.run.floorsCleared + Math.floor(G.run.gold/300)
                 + Math.max(0, 5 - G.run.heroes.length)*Math.floor(depth/3);
  G.meta.favour += favour;
  G.meta.best = Math.max(G.meta.best || 0, depth);
  G.meta.runs = (G.meta.runs || 0) + 1;
  G.meta.deepestKills = Math.max(G.meta.deepestKills || 0, G.run.kills);
  // a lost run should still leave a story behind
  G.meta.history = (G.meta.history || []);
  G.meta.history.unshift({
    n: G.meta.runs, depth, cleared: G.run.floorsCleared, kills: G.run.kills,
    gold: G.run.gold, favour,
    party: G.run.heroes.map(x => x.id),
    lost: G.run.heroes.filter(x => !x.alive).map(x => x.id),
    boons: G.run.boons.slice(), curses: G.run.curses.slice(), relics: (G.run.relics||[]).slice(),
    fall: G.run.lastFall || null,
    won: runAlive().length > 0,
  });
  G.meta.history = G.meta.history.slice(0, 10);
  saveMeta(); clearRun();
  const lost = G.run.heroes.filter(h => !h.alive).length;
  modal(`
    <h2 style="color:#b03a2c">The Descent Ends</h2>
    <div class="sub" style="margin:2px 0 0">Depth ${depth}</div>
    <div class="rule"></div>
    <p class="flavor">${why || 'The keep keeps what it takes. Somewhere above, Mentor writes another name down.'}</p>
    <div class="row"><div class="ic">⬇</div><div class="tx"><b>Depth reached</b><s>Floors cleared: ${G.run.floorsCleared}</s></div><div style="color:#f3d488">${depth}</div></div>
    <div class="row"><div class="ic">☠</div><div class="tx"><b>Things killed</b><s>Heroes lost: ${lost} of ${G.run.heroes.length}</s></div><div>${G.run.kills}</div></div>
    <div class="row"><div class="ic">◈</div><div class="tx"><b>Gold carried</b><s>Coin counts toward favour</s></div><div style="color:#f3d488">${G.run.gold}</div></div>
    <div class="row"><div class="ic">🕯</div><div class="tx"><b>Mentor’s Favour earned</b><s>Spend it before the next descent</s></div><div style="color:#f3d488">+${favour}</div></div>
    ${G.run.boons.length ? `<div class="rule"></div><div style="font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--dim);text-align:center;margin-bottom:8px">Boons taken</div>
      <div style="text-align:center;font-size:13px;color:#ddd0b4">${G.run.boons.map(b => BOON(b).ic + ' ' + BOON(b).name).join(' · ')}</div>` : ''}
    <div class="rule"></div>
    <div style="text-align:center">
      <button class="btn big" id="mAgain">Descend Again</button>
      <button class="btn ghost" id="mFavour">Mentor’s Table</button>
      <button class="btn ghost" id="mBook">The Book</button>
      <button class="btn ghost" id="mTitle">Title Screen</button>
    </div>`);
  bindModal('#mBook', () => { closeModal(); showHistory(); });
  bindModal('#mAgain', () => { closeModal(); G.run = null; showDescentSetup(); });
  bindModal('#mFavour', () => { closeModal(); showMentor(); });
  bindModal('#mTitle', () => { closeModal(); G.run = null; showTitle(); });
  if (!HEADLESS) $('hud').classList.remove('on');
}

/* --------------------------------------------------------------- the draft */

function draftOptions(){
  const n = metaHas('extradraft') ? 4 : 3;
  const taken = G.run.boons;
  const pool = BOONS.filter(b => !taken.includes(b.id));
  const out = [];
  while (out.length < n && pool.length) out.push(pool.splice(ri(pool.length), 1)[0]);
  return out;
}
function takeBoon(id){
  if (!G.run || G.run.boons.includes(id)) return false;
  const blood = BLOOD(id);
  if (blood && !payBlood(blood)) return false;      // nobody left to pay with
  G.run.boons.push(id);
  if (id === 'stoutheart') for (const h of G.run.heroes){ h.bpMax++; h.bp = Math.min(h.bpMax, h.bp + 1); }
  saveRun();
  return true;
}

/* --------------------------------------------------------- BLOOD PRICE BOONS */
// One is offered beside the three, from the second floor down. It is stronger
// than anything in the ordinary pool and it is not free: the party pays for it
// out of their maximum Body Points, and there is no giving it back.

const BLOOD_FROM = 2;                            // not on the first stair down
function bloodOffer(){
  if (!G.run || G.run.depth < BLOOD_FROM) return null;
  const pool = BLOOD_BOONS.filter(b => !G.run.boons.includes(b.id));
  return pool.length ? pool[ri(pool.length)] : null;
}
// Every hero must be able to survive the toll — a boon that kills the party as
// you take it is not a decision, it is a bug with flavour text.
function canPayBlood(b){
  if (!G.run || !b) return false;
  const alive = runAlive();
  return alive.length > 0 && alive.every(h => h.bpMax - b.cost >= 1);
}
function payBlood(b){
  if (!canPayBlood(b)) return false;
  for (const h of G.run.heroes){
    const before = h.bpMax;
    h.bpMax = Math.max(1, h.bpMax - b.cost);
    h.tolled = (h.tolled || 0) + (before - h.bpMax);   // what the stone actually took
    h.bp = Math.min(h.bp, h.bpMax);
  }
  say(`${b.ic} ${b.name} — ${b.desc}`, 'good');
  say(b.toll, 'bad');
  sfx('heroDie');
  return true;
}

/* -------------------------------------------------- THE WARLOCK'S WAGER */
// Three boons you do not want is the worst screen in the game. Fate can throw
// the whole hand back — but it costs one more every time you ask, and the next
// hand can be worse. Nothing is protected: the boons you just turned down can
// come straight back.

const WAGER_MAX = 3;
function wagerCost(){ return 1 + (draftState ? (draftState.wagers || 0) : 0); }
function canWager(){
  return !!(G.run && draftState && !draftState.taken
    && (draftState.wagers || 0) < WAGER_MAX
    && fateOf() >= wagerCost());
}
function wagerDraft(){
  if (!canWager()) return null;
  const cost = wagerCost();
  if (G.run) G.run.fate -= cost; else G.q.fate -= cost;
  draftState.wagers = (draftState.wagers || 0) + 1;
  const before = draftState.opts.map(b => b.id);
  draftState.opts = draftOptions();
  sfx('spell');
  say(`✦ ${cost} Fate. The Warlock deals again.`, 'magic');
  renderHUD();
  return { cost, before, after: draftState.opts.map(b => b.id) };
}

/* ------------------------------------------------------------ STAKE A BOON */
// The Wager throws back a hand you have not taken. This puts a boon you already
// own on one combat die: skull and the Warlock pays another on top, white
// shield and nothing happens, black shield and it is his. Once a stair.

function canStake(){
  return !!(G.run && draftState && !draftState.taken && !draftState.staked
    && G.run.boons.length > 0
    && BOONS.some(b => !G.run.boons.includes(b.id)));      // something left to win
}
function stakeBoon(id){
  if (!canStake() || !G.run.boons.includes(id)) return null;
  const b = BOON(id);
  draftState.staked = id;
  const face = combatDie();
  let out, won = null;
  if (face === SKULL){
    const pool = BOONS.filter(x => !G.run.boons.includes(x.id));
    won = pool.length ? pool[ri(pool.length)] : null;
    if (won) G.run.boons.push(won.id);
    out = won ? 'won' : 'hold';
    sfx('win');
    say(won ? `Skull. You keep ${b.name}, and he throws in ${won.name}.`
            : `Skull — but he has nothing left worth having.`, 'good');
  } else if (face === WHITE){
    out = 'hold';
    sfx('block');
    say(`A white shield. ${b.name} stays where it is, and so does everything else.`, '');
  } else {
    const i = G.run.boons.indexOf(id);
    if (i >= 0) G.run.boons.splice(i, 1);
    if (id === 'stoutheart') for (const h of G.run.heroes){ h.bpMax = Math.max(1, h.bpMax - 1); h.bp = Math.min(h.bp, h.bpMax); }
    out = 'lost';
    sfx('lose');
    say(`A black shield. ${b.name} is his now.`, 'bad');
  }
  saveRun(); renderHUD();
  return { face, out, staked:id, won: won ? won.id : null };
}

// Stake the floor's takings on one combat die. Skull doubles it, a white shield
// leaves it, a black shield takes the lot — and you may keep pressing.
function dblStake(){ return G.run ? (G.run.stake || 0) : 0; }
function canDouble(){ return !!(G.run && !G.run.over && (G.run.stake || 0) > 0); }
function doubleOrNothing(){
  if (!canDouble()) return null;
  const face = combatDie();
  const before = G.run.stake;
  let out;
  if (face === SKULL){ G.run.stake = before*2; out = 'double'; }
  else if (face === WHITE){ out = 'hold'; }
  else { G.run.stake = 0; out = 'lost'; }
  G.run.doubles = (G.run.doubles || 0) + 1;
  sfx(out === 'lost' ? 'lose' : out === 'double' ? 'gold' : 'block');
  return { face, out, before, after:G.run.stake };
}
function settleStake(){
  if (!G.run) return 0;
  const n = G.run.stake || 0;
  G.run.gold += n;
  G.run.stake = 0; G.run.doubles = 0;
  return n;
}

const PEDLAR = [
  { id:'potion', ic:'🧪', name:'Healing Potion', cost:120, desc:'Restores 4 Body Points. To whoever needs it most.' },
  { id:'holy',   ic:'⚱',  name:'Holy Water',     cost:170, desc:'Three dice against one undead thing.' },
  { id:'mend',   ic:'✚',  name:'Field Surgery',  cost:200, desc:'Restore 3 Body Points to every living hero, now.' },
  { id:'leather',ic:'🦺', name:'Leather Armour', cost:260, desc:'+1 defend die for one hero who has none.' },
  { id:'absolve',ic:'⛓',  name:'Absolution',     cost:320, desc:'Lift one curse you are carrying.' },
  // The blood price was a one-way door. It is an expensive door now instead.
  { id:'bonesetter',ic:'🦴', name:'The Bonesetter', cost:420,
    desc:'Give every hero back one maximum Body Point the stone took, and heal it.' },
];
// How much of the party's maximum the blood prices are still holding.
const bloodOwed = () => (G.run ? G.run.heroes.reduce((n,h) => n + (h.tolled || 0), 0) : 0);

/* ------------------------------------------------------------- THE PEDLAR */
// He lifts curses, buys back the blood price, and buys boons you never use.
// That is one identity — the place regret gets undone — and it had been
// growing a row at a time inside the Coin tab. It is a shop now.

function pedlarBlurb(owed){
  const bits = [];
  const affordable = PEDLAR.filter(p => p.cost <= G.run.gold
    && (p.id !== 'bonesetter' || owed > 0)
    && (p.id !== 'absolve' || G.run.curses.length)).length;
  bits.push(affordable ? `${affordable} thing${affordable>1?'s':''} you can afford` : 'Nothing you can afford');
  if (owed > 0) bits.push(`he can give back ${owed} Body Point${owed>1?'s':''} the stone took`);
  if (sellable().length) bits.push('and he buys');
  return bits.join(' · ');
}
function showPedlar(){
  if (!G.run) return;
  const owed = bloodOwed();
  const rows = PEDLAR.filter(p => p.id !== 'bonesetter' || owed > 0).map(p => `<div class="row">
      <div class="ic">${p.ic}</div>
      <div class="tx"><b>${p.name}</b><s>${p.desc}${
        p.id === 'bonesetter' ? `<br>The stone is holding ${owed} between you.` : ''}${
        p.id === 'absolve' && !G.run.curses.length ? '<br>Nothing on you to lift.' : ''}</s></div>
      <button class="bu" data-buy="${p.id}" ${G.run.gold < p.cost
        || (p.id === 'absolve' && !G.run.curses.length) ? 'disabled' : ''}>◈ ${p.cost}</button>
    </div>`).join('');
  const forSale = sellable();
  modal(`<h2>The Pedlar</h2>
    <div class="sub" style="margin:2px 0 0">On the stair, as always</div>
    <div class="rule"></div>
    <div class="goldline">◈ ${G.run.gold}</div>
    <div style="font-size:10px;letter-spacing:.24em;text-transform:uppercase;color:var(--dim);text-align:center;margin-bottom:6px">What he sells</div>
    ${rows}
    ${forSale.length ? `<div class="rule"></div>
      <div style="font-size:10px;letter-spacing:.24em;text-transform:uppercase;color:var(--dim);text-align:center;margin-bottom:6px">What he buys</div>
      <div class="row"><div class="ic">🪙</div>
        <div class="tx"><b>◈ ${SELL_PRICE} for a boon</b><s>One you never use. Not the ones you paid
          for in blood — those are between you and the stone.</s></div></div>
      <div class="stakebar">${forSale.map(id => `<button class="bu" data-sell2="${id}">${
        BOON(id).ic} ${BOON(id).name}</button>`).join('')}</div>` : ''}
    <div class="rule"></div>
    <div style="text-align:center"><button class="btn ghost" id="mShopBack">Back to the stair</button></div>`);
  bindAll('.bu[data-buy]', el => { if (buyPedlar(el.dataset.buy)) showPedlar(); });
  bindAll('.bu[data-sell2]', el => { if (sellBoon(el.dataset.sell2)) showPedlar(); });
  bindModal('#mShopBack', () => { closeModal(); showDraft(); });
}

/* ------------------------------------------------- SELLING WHAT YOU DO NOT USE */
// The stake gambles a boon away. This lets you choose to. A blood price is not
// for sale — you paid for that in Body Points, and the Bonesetter handles it.
const SELL_PRICE = 190;
const sellable = () => (G.run ? G.run.boons.filter(id => BOON(id) && !BLOOD(id)) : []);
function sellBoon(id){
  if (!G.run || !sellable().includes(id)) return null;
  const b = BOON(id);
  const i = G.run.boons.indexOf(id);
  G.run.boons.splice(i, 1);
  if (id === 'stoutheart') for (const h of G.run.heroes){ h.bpMax = Math.max(1, h.bpMax - 1); h.bp = Math.min(h.bp, h.bpMax); }
  G.run.gold += SELL_PRICE;
  sfx('gold');
  say(`${b.name} goes into the pedlar's bag. ◈ ${SELL_PRICE}.`, 'good');
  renderHUD(); saveRun();
  return { id, paid: SELL_PRICE };
}
function buyPedlar(id){
  if (!G.run) return false;
  const it = PEDLAR.find(p => p.id === id);
  if (!it || G.run.gold < it.cost) return false;
  const alive = runAlive();
  if (!alive.length) return false;
  if (id === 'potion' || id === 'holy'){
    const who = alive.slice().sort((a,b) => (a.bp/a.bpMax) - (b.bp/b.bpMax))[0];
    who.items[id] = (who.items[id]||0) + 1;
  } else if (id === 'mend'){
    for (const h of alive) h.bp = Math.min(h.bpMax, h.bp + 3);
  } else if (id === 'absolve'){
    if (!G.run.curses.length) return false;
    liftCurse();
  } else if (id === 'bonesetter'){
    if (!bloodOwed()) return false;                  // nothing owed, nothing to buy
    let n = 0;
    for (const h of G.run.heroes){
      if (!(h.tolled > 0)) continue;
      h.tolled--; h.bpMax++; h.bp = Math.min(h.bpMax, h.bp + 1); n++;
    }
    if (!n) return false;
    say(`The bonesetter works. ${n} hero${n>1?'es':''} stand${n>1?'':'s'} a little straighter.`, 'good');
  } else {
    const who = alive.find(h => !h.armour && h.id !== 'wizard');
    if (!who) return false;
    who.armour = 'leather';
  }
  G.run.gold -= it.cost;
  sfx('gold'); saveRun();
  return true;
}

let draftState = null;
const DRAFT_TABS = [
  { id:'boons', name:'Boons' },
  { id:'coin',  name:'Coin'  },
  { id:'stair', name:'Stairs'},
  { id:'book',  name:'Book'  },
];
function showDraft(){
  const next = G.run.depth + 1;
  if (!draftState || draftState.depth !== G.run.depth){
    draftState = { depth:G.run.depth, opts:draftOptions(), taken:null, stairs:null,
                   blood:bloodOffer(), staked:null, tab:'boons' };
  }
  if (!draftState.stairs){
    G.run.depth = next;                       // generate the floors below
    draftState.stairs = floorChoices(next);
    G.run.depth = next - 1;
  }
  const opts = draftState.opts;
  G.q.draft = opts.map(o => o.id);
  G.q.stairs = draftState.stairs.map(d => d.name);
  const rows = opts.map(b => `<div class="row">
      <div class="ic">${b.ic}</div>
      <div class="tx"><b>${b.name}</b><s>${b.desc}</s></div>
      <button class="bu ${draftState.taken === b.id ? 'own' : ''}" data-boon="${b.id}"
        ${draftState.taken ? 'disabled' : ''}>${draftState.taken === b.id ? 'Taken' : 'Take'}</button>
    </div>`).join('');
  // The blood price sits under the three, marked out, with what it costs said
  // plainly. Taking it is instead of a boon, not as well as one.
  const bb = draftState.blood;
  const bloodRow = (!bb || draftState.taken) ? '' : `<div class="row blood">
      <div class="ic">${bb.ic}</div>
      <div class="tx"><b>${bb.name}</b><s>${bb.desc}<br><i>${bb.toll}</i></s></div>
      <button class="bu red" data-blood="${bb.id}" ${canPayBlood(bb) ? '' : 'disabled'}>${
        canPayBlood(bb) ? `−${bb.cost} BP` : 'Too thin'}</button>
    </div>`;
  const stakeable = canStake() ? G.run.boons.filter(id => BOON(id)) : [];
  const stakeRow = !stakeable.length ? '' : `<div class="row">
      <div class="ic">🎲</div>
      <div class="tx"><b>Stake a boon</b><s>Put one you already hold on a single die.
        Skull and he pays another on top (3 in 6), white shield and nothing moves (2 in 6),
        black shield and it is his (1 in 6). Once a stair.</s></div>
    </div>
    <div class="stakebar">${stakeable.map(id => `<button class="bu" data-stake="${id}">${
      BOON(id).ic} ${BOON(id).name}</button>`).join('')}</div>`;
  const wagersLeft = WAGER_MAX - (draftState.wagers || 0);
  const wagerRow = (draftState.taken || wagersLeft <= 0) ? '' : `<div class="row">
      <div class="ic">✦</div>
      <div class="tx"><b>The Warlock's Wager</b><s>Throw this hand back and take another.
        Nothing is protected — what you just turned down can come straight back.
        ${draftState.wagers ? `Dealt again ${draftState.wagers} time${draftState.wagers>1?'s':''}; ` : ''}${
        wagersLeft} left.</s></div>
      <button class="bu" data-wager="1" ${canWager() ? '' : 'disabled'}>✦ ${wagerCost()}</button>
    </div>`;
  const stairs = draftState.stairs.map((d, i) => {
    const mods = (d.mods || []).map(m => MOD(m)).filter(Boolean).map(m => `${m.ic} ${m.name}`).join(' · ');
    return `<div class="qrow" data-stair="${i}">
      <div class="n">⬇</div>
      <div class="tx"><b>${d.name}</b><s>${d.objective.label}<br>
        ${mods ? mods : 'No hazard worth the name'} · ◈ ${d.reward} · ${d.monsters.reduce((n2,m)=>n2+m.n,0)} hostiles</s></div>
    </div>`;
  }).join('');
  const alive = runAlive();
  const stake = dblStake();
  const wager = stake > 0 ? `
    <div class="rule"></div>
    <div style="font-size:10px;letter-spacing:.24em;text-transform:uppercase;color:var(--dim);text-align:center;margin-bottom:6px">The floor's takings</div>
    <div class="row">
      <div class="ic">🎲</div>
      <div class="tx"><b>Double or nothing · ◈ ${stake}</b>
        <s>One combat die. Skull doubles it (3 in 6), white shield leaves it (2 in 6),
        black shield takes the lot (1 in 6). Press as often as you dare.
        ${G.run.doubles ? `<br>Pressed ${G.run.doubles} time${G.run.doubles>1?'s':''} already.` : ''}</s></div>
      <button class="bu" data-dbl="1">Roll</button>
    </div>
    <div class="row">
      <div class="ic">◈</div>
      <div class="tx"><b>Bank it</b><s>Put the ${stake} in the purse and stop.</s></div>
      <button class="bu own" data-bank="1">Bank</button>
    </div>` : '';
  // He lifts curses, buys back blood and buys boons: he is the place regret gets
  // undone, and that had been accreting one row at a time inside this tab. One
  // door into his shop now, and the shop is its own screen.
  const owed = bloodOwed();
  const ped = `<div class="row">
      <div class="ic">🎒</div>
      <div class="tx"><b>The pedlar on the stair</b><s>${pedlarBlurb(owed)}</s></div>
      <button class="bu" data-shop="1">Open</button>
    </div>`;
  const sellRow = '';
  // Eight things on one scroll was too many. Three tabs: what you take, what
  // you spend, and where you go. The party and the purse stay above all three,
  // because they are the numbers every one of those decisions is made against.
  const tab = DRAFT_TABS.some(x => x.id === draftState.tab) ? draftState.tab : 'boons';
  draftState.tab = tab;
  const head = (s) => `<div style="font-size:10px;letter-spacing:.24em;text-transform:uppercase;color:var(--dim);text-align:center;margin-bottom:6px">${s}</div>`;
  const panes = {
    boons: `${head(draftState.taken ? 'Taken' : 'Take one boon')}${rows}${bloodRow}${wagerRow}${stakeRow}${

    coin:  `${wager}${wager ? '<div class="rule"></div>' : ''}${head('The pedlar on the stair')}${ped}${sellRow}`,
    stair: `${head('Choose your stair')}${stairs}`,
    // how far this has got before, next to how far it has got this time
    book:  `${head('This descent')}<div class="qlist">${thisRunRow()}</div>
            <div class="rule"></div>${head(`The last ${Math.min(10, (G.meta.history||[]).length) || 'few'}`)}
            <div class="qlist">${historyRows()}</div>
            <div class="row"><div class="ic">⬇</div><div class="tx"><b>Deepest</b><s>${
              G.meta.runs} run${G.meta.runs===1?'':'s'} attempted</s></div><div style="color:#f3d488">${G.meta.best}</div></div>`,
  };
  modal(`
    <h2>Between Floors</h2>
    <div class="sub" style="margin:2px 0 0">Depth ${G.run.depth} cleared · ${next} below</div>
    <div class="rule"></div>
    <div style="text-align:center;font-size:12.5px;color:#ddd0b4;margin-bottom:6px">
      ${alive.map(h => `${h.name} ${h.bp}/${h.bpMax}`).join(' · ')}
      ${G.run.heroes.length > alive.length ? `<div style="color:#b03a2c;font-size:11px;margin-top:4px">Lost: ${G.run.heroes.filter(h=>!h.alive).map(h=>h.name).join(', ')}</div>` : ''}
    </div>
    <div class="goldline">◈ ${G.run.gold}${stake ? ` <span style="color:#ccb8ff">· ◈ ${stake} unbanked</span>` : ''}</div>
    <div class="rule"></div>
    <div class="tabs">${DRAFT_TABS.map(x => `<button class="tab ${x.id === tab ? 'on' : ''}" data-tab="${x.id}">${
      x.name}${x.id === 'boons' && draftState.taken ? ' ✓' : ''}${
      x.id === 'coin' && stake ? ' ◈' : ''}</button>`).join('')}</div>
    ${panes[tab]}`, 'draft');
  bindAll('.tab[data-tab]', el => { draftState.tab = el.dataset.tab; showDraft(); });
  bindAll('.bu[data-boon]', el => {
    if (draftState.taken) return;

const K_CAMP = 'grimhold_camp_v1', K_RUN = 'grimhold_run_v1';

function saveCampaign(){

function migrateCamp(c){
  if (!c || !Array.isArray(c.heroes) || c.heroes.length !== HERO_DEFS.length) return newCampaign();
  const fresh = newCampaign();
  fresh.gold = c.gold|0;
  fresh.done = Array.isArray(c.done) ? c.done.filter(n => n >= 0 && n < QUESTS.length) : [];
  fresh.unlocked = clamp(c.unlocked|0 || 1, 1, QUESTS.length);
  fresh.heroes = fresh.heroes.map(h => {
    const old = c.heroes.find(x => x && x.id === h.id);
    if (!old) return h;
    if (WEAPONS[old.weapon]) h.weapon = old.weapon;
    if (ARMOURS[old.armour]) h.armour = old.armour;
    h.gear = Object.assign({}, old.gear || {});
    h.items = Object.assign({ potion:0, holy:0 }, old.items || {});
    return h;
  });
  return fresh;
}
function loadCampaign(){
  try {
    const s = localStorage.getItem(K_CAMP);
    if (s) return migrateCamp(JSON.parse(s));
  } catch(e){}
  return newCampaign();
}
function saveRun(){
  if (!G.q || G.q.over) return;
  try {
    const q = Object.assign({}, G.q);
    delete q.vis; delete q.field;
    q.actors = G.q.actors.map(a => a.kind === 'hero' ? { ref:a.id } : a);
    localStorage.setItem(K_RUN, JSON.stringify({ q, camp:G.camp, cam:G.cam, run:G.run || null }));
  } catch(e){}
}
function hasRun(){ try { return !!localStorage.getItem(K_RUN); } catch(e){ return false; } }
function clearRun(){ try { localStorage.removeItem(K_RUN); } catch(e){} }
function resumeRun(){
  let s = null;
  try { s = JSON.parse(localStorage.getItem(K_RUN)); } catch(e){}
  if (!s || !s.q){ showQuestSelect(); return false; }
  G.camp = migrateCamp(s.camp);
  G.run = s.run && Array.isArray(s.run.heroes) && s.run.heroes.length ? s.run : null;
  if (G.run){
    // a run carries its own roster, saved whole — nothing to reconcile
    G.run.heroes = G.run.heroes.map(h => Object.assign(mkHero(HERO_DEFS.find(d => d.id === h.id) || HERO_DEFS[0]), h));
    G.run.boons = (G.run.boons || []).filter(b => !!BOON(b));   // ordinary and blood alike
  }
  // the saved heroes hold their in-quest condition; put it back on the roster
  const savedHeroes = (s.camp && s.camp.heroes) || [];
  for (const h of (G.run ? [] : G.camp.heroes)){
    const old = savedHeroes.find(x => x && x.id === h.id);
    if (!old) continue;
    h.bp = old.bp === undefined ? h.bpMax : old.bp;
    h.mp = old.mp === undefined ? h.mpMax : old.mp;
    h.alive = old.alive !== false;
    h.x = old.x|0; h.y = old.y|0;
    h.moveLeft = old.moveLeft|0; h.rolled = !!old.rolled;
    h.acted = !!old.acted; h.done = !!old.done;
    h.spent = Array.isArray(old.spent) ? old.spent.slice() : [];
    h.buffs = Object.assign({}, old.buffs || {});
    h.quests = Array.isArray(old.quests) ? old.quests.slice() : [];
    if (old.stowed) h.stowed = old.stowed;
    if (WEAPONS[old.weapon]) h.weapon = old.weapon;
    h.kind = 'hero';
  }
  G.q = s.q;
  G.q.actors = s.q.actors.map(a => a.ref ? partyHeroes().find(h => h.id === a.ref) : a).filter(Boolean);
  G.cam = s.cam || { x:0, y:0, z:1 };
  G.fx = []; G.timers = []; G.dice = null; G.aim = null; G.shake = 0;
  bakeDungeon(G.run ? 4242 + G.run.depth*991 : 1234 + G.q.qi*991);
  recomputeVision(); refreshField();
  if (!HEADLESS){
    $('scTitle').classList.remove('on');
    closeModal();
    $('hud').classList.add('on');
  }
  setMood('explore');
  renderHUD(); renderLog();
  return true;
}

/* ------------------------------------------------------------ 14. THE LOOP */

function update(dt){
  if (G && G.freeze > 0){ G.freeze -= dt; TT0 += dt*.15; return; }
  TT0 += dt;
  if (!G) return;
  // Collect what is due *before* running any of it: a callback may call
  // clearTimers (questOver does), and mutating the list mid-walk used to read
  // past the end of it and kill the frame.
  const due = [];
  for (let i = G.timers.length - 1; i >= 0; i--){
    const T = G.timers[i];
    if (!T){ G.timers.splice(i,1); continue; }
    T.t -= dt;
    if (T.t <= 0){ G.timers.splice(i,1); due.push(T); }
  }
  const gen = G.timerGen || 0;
  for (const T of due){
    if ((G.timerGen || 0) !== gen) break;    // something cleared the queue; respect it
    T.fn();
  }
  if (G.dice) G.dice.t += dt;
  if (G.shake > 0) G.shake = Math.max(0, G.shake - dt*.055);
  if (G.camPunch > 0) G.camPunch = Math.max(0, G.camPunch - dt*.0022);
  if (!G.q) return;
  let dropped = false;
  for (let i = G.q.log.length - 1; i >= 0; i--){
    G.q.log[i].t += dt;
    if (G.q.log[i].t > 5200){ G.q.log.splice(i,1); dropped = true; }
  }
  if (dropped) renderLog();

  for (const a of G.q.actors){
    tickSlide(a, dt);
    if (a.hurtT > 0) a.hurtT -= dt;
    if (a.deathT > 0) a.deathT -= dt;
    if (a.lt > 0) a.lt = Math.max(0, a.lt - dt*.006);
  }
  for (let i = G.fx.length - 1; i >= 0; i--){
    const p = G.fx[i];
    p.life -= dt;
    if (p.life <= 0){ G.fx.splice(i,1); continue; }
    p.x += p.vx*dt; p.y += p.vy*dt;
    p.vy += (p.grav||0)*dt;
  }
  // dust in the torchlight
  if (!HEADLESS && G.fx.length < 90 && Math.random() < .22){
    const hs = livingHeroes();
    if (hs.length){
      const h = hs[(Math.random()*hs.length)|0];
      G.fx.push({ x:h.x + .5 + (Math.random()-.5)*5, y:h.y + .5 + (Math.random()-.5)*5,
        vx:(Math.random()-.5)*.0006, vy:-.0004 - Math.random()*.0006,
        life:2600, max:2600, col:'rgba(255,220,170,.30)', size:1.5, grav:0 });
    }
  }
  // camera drift toward its mark
  if (G.cam.tx !== null && G.cam.tx !== undefined){
    G.cam.x = lerp(G.cam.x, G.cam.tx, Math.min(1, dt*.006));
    G.cam.y = lerp(G.cam.y, G.cam.ty, Math.min(1, dt*.006));
    if (Math.abs(G.cam.x - G.cam.tx) < .6 && Math.abs(G.cam.y - G.cam.ty) < .6){ G.cam.tx = G.cam.ty = null; }
    clampCam();
  }
  if (AC) musicTick(AC.currentTime);
  syncHUD();
}

// The HUD used to be repainted only at the points somebody remembered to call
// renderHUD. A timer draining after a kill left the buttons greyed with nothing
// scheduled to un-grey them. Now the frame loop watches the state that the HUD
// actually shows and repaints when any of it moves.
let hudSig = '';
function hudState(){
  if (!G || !G.q) return '';
  const h = activeHero();
  const p = [G.q.phase, G.q.turn, G.q.activeId, busy()?1:0, G.q.over,
             G.aim ? (G.aim.key || G.aim.kind) : '', G.camp.gold, G.q.pot|0];
  if (h) p.push(h.acted?1:0, h.moveLeft, h.rolled?1:0, roomAt(h.x,h.y),
                disarmTarget()?1:0, knownSpells(h).filter(k => spellReady(h,k)).length,
                (h.items.potion||0) + (h.items.holy||0));
  for (const x of heroes()) p.push(x.bp, x.alive?1:0, x.done?1:0, Object.keys(x.buffs).sort().join('.'));
  return p.join('|');
}
function syncHUD(){
  const sig = hudState();
  if (sig === hudSig) return false;
  hudSig = sig; renderHUD();
  return true;
}

let lastT = 0, frameErrs = 0;
function frame(ts){
  const dt = Math.min(48, ts - lastT || 16);
  lastT = ts;
  // A slip in update or draw must never end the loop — a frozen board is the
  // one failure a player cannot recover from. Log it once and carry on.
  try { update(dt); draw(); }
  catch (e){
    if (frameErrs++ === 0 && typeof console !== 'undefined' && console.error)
      console.error('Grimhold: frame error', e);
    if (frameErrs === 1) G.fx.length = 0;      // most often a bad particle
  }
  requestAnimationFrame(frame);
}
