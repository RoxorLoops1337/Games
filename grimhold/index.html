  banner('THE WARLOCK', 'moves his pieces');
  // anything that can see a hero is awake now
  for (const m of monstersOf()){
    if (m.awake) continue;
    for (const h of livingHeroes())
      if (tileVisible(m.x,m.y) || hasLOS(m.x,m.y,h.x,h.y) && dist2(m.x,m.y,h.x,h.y) <= 8) { m.awake = true; break; }
  }
  const queue = monstersOf().filter(m => m.awake);
  let i = 0;
  const next = () => {
    if (G.q.over) return;
    if (i >= queue.length){ endZargonTurn(); return; }
    const m = queue[i++];
    if (!m.alive){ next(); return; }
    monsterAct(m, () => later(60, next));
  };
  later(HEADLESS ? 0 : 620, next);
}

// What each kind of thing does with its turn beyond walking at you.
function monsterCast(m, h, done){
  if (G.q) G.q.lastKiller = m.name;
  const atk = rollCombat(3);
  const skulls = countSkulls(atk);
  m.cast = (m.cast || 0) + 1;
  focusOn(m.x, m.y);
  say(`${m.name} throws a bolt of the Warlock's fire at ${h.name}.`, 'magic');
  spark(m.x, m.y, 18, '#c86bff', { spd:.02, dir:[Math.sign(h.x-m.x), Math.sign(h.y-m.y)],
                                   glow:'rgba(200,107,255,.4)', r:1.4 });
  showDice('attack', atk, [], `${m.name} vs ${h.name}`,
    skulls ? `${skulls} Body Point${skulls>1?'s':''} — no shield will help` : 'It gutters out', () => {
    if (skulls > 0){
      sfx('hit'); G.shake = 10 + skulls*3; hitStop(70);
      spark(h.x, h.y, 14 + skulls*3, '#c86bff', { spd:.022, life:700 });
      hurt(h, skulls, null);
    }
    renderHUD();
    later(220, done);
  });
}

function monsterShoot(m, h, done){
  if (G.q) G.q.lastKiller = m.name;
  const atk = rollCombat(m.atk);
  const def = rollCombat(defendDice(h));
  const dmg = Math.max(0, countSkulls(atk) - countShields(def, true));
  focusOn(m.x, m.y);
  say(`${m.name} looses an arrow at ${h.name}.`, 'bad');
  spark(m.x, m.y, 10, '#c8b088', { spd:.03, dir:[Math.sign(h.x-m.x), Math.sign(h.y-m.y)], life:420 });
  showDice('defend', atk, def, `${m.name} shoots ${h.name}`,
    dmg > 0 ? `${h.name} loses ${dmg}` : 'It goes wide', () => {
    if (dmg > 0){
      sfx('hit'); G.shake = 7 + dmg*3; hitStop(50);
      spark(h.x, h.y, 8 + dmg*3, '#a01d14', { spd:.02, life:600 });
      hurt(h, dmg, null);
    } else { sfx('miss'); }
    renderHUD();
    later(220, done);
  });
}

/* ------------------------------------------------- WHAT THE NEW THINGS DO */
// A spider does not want to kill you, it wants you to stop moving. A hero it
// catches spends their next turn cutting out of the webbing — no roll, no
// defence, just a turn gone, which is the most expensive thing in the game.
function monsterWeb(m, h, done){
  if (G.q) G.q.lastKiller = m.name;
  h.webbed = 1;
  focusOn(m.x, m.y);
  lungeAt(m, h.x, h.y);
  say(`${m.name} throws webbing over ${h.name}. That is next turn gone.`, 'bad');
  sfx('spell'); G.shake = Math.max(G.shake, 8);
  spark(h.x, h.y, 16, '#cfd6e2', { spd:.012, up:.002, life:700 });
  renderHUD();
  later(260, done);
}
// A hellhound breathes down a straight line. Everybody standing in it rolls.
function breathLine(m, h){
  const dx = Math.sign(h.x - m.x), dy = Math.sign(h.y - m.y);
  if (!dx && !dy) return null;
  if (dx && dy && Math.abs(h.x - m.x) !== Math.abs(h.y - m.y)) return null;
  if (!dx && !dy) return null;
  const line = [];
  for (let i = 1; i <= 4; i++){
    const x = m.x + dx*i, y = m.y + dy*i;
    if (!isFloor(x,y) || !hasLOS(m.x, m.y, x, y)) break;
    line.push([x,y]);
  }
  return line.length ? { dx, dy, line } : null;
}
function monsterBreath(m, aim, done){
  if (G.q) G.q.lastKiller = m.name;
  const caught = livingHeroes().filter(h => aim.line.some(([x,y]) => x === h.x && y === h.y));
  focusOn(m.x, m.y);
  say(`${m.name} opens its mouth and the corridor lights up. ${caught.length} in the way.`, 'bad');
  sfx('trap'); G.shake = Math.max(G.shake, 14); hitStop(90);
  for (const [x,y] of aim.line)
    spark(x, y, 12, '#ff9040', { spd:.014, up:.006, life:520, glow:'rgba(255,140,60,.4)', r:1.2 });
  let i = 0;
  const next = () => {
    if (i >= caught.length){ renderHUD(); later(220, done); return; }
    const h = caught[i++];
    const atk = rollCombat(m.atk);
    const def = rollCombat(defendDice(h));
    const dmg = Math.max(0, countSkulls(atk) - countShields(def, true));
    showDice('defend', atk, def, `${m.name} burns ${h.name}`,
      dmg > 0 ? `${h.name} loses ${dmg}` : 'Not this one', () => {
        if (dmg > 0){ sfx('hit'); hurt(h, dmg, null); } else sfx('miss');
        next();
      });
  };
  next();
}

function monsterAct(m, done){
  if (m.sleep > 0){ done(); return; }
  if (m.stun > 0){ m.stun--; done(); return; }
  m.parried = 0;                                   // chaos warriors parry once a turn
  // a troll closes up again unless the last wound was burned into it
  if (m.alive && MONSTERS[m.mt] && MONSTERS[m.mt].regen && m.bp < m.bpMax && !m.burned){
    m.bp++;
    floatText(m.x, m.y, '+1', '#8fd86b');
    if (tileVisible(m.x,m.y)) spark(m.x, m.y, 8, '#8fd86b', { spd:.01, up:.003 });
  }
  m.burned = 0;
  // a cultist does not fight so much as tell everyone where you are
  if (MONSTERS[m.mt] && MONSTERS[m.mt].herald && !m.heralded){
    const seen = livingHeroes().some(h => hasLOS(m.x,m.y,h.x,h.y) && dist2(m.x,m.y,h.x,h.y) <= 9);
    if (seen){
      m.heralded = 1;
      const rid = roomAt(m.x, m.y);
      let n = 0;
      for (const o of monstersOf()) if (!o.awake && (rid < 0 || roomAt(o.x,o.y) === rid)){ o.awake = true; n++; }
      say(n ? `${m.name} throws its head back and screams. ${n} more thing${n>1?'s':''} wake${n>1?'':'s'} up.`
            : `${m.name} screams. Nothing answers — this time.`, 'bad');
      sfx('boss'); G.shake = 10;
    }
  }
  const targets = livingHeroes();
  if (!targets.length){ done(); return; }
  // A monster holds its room until it can actually see somebody. Without this
  // leash a revealed dungeon turns into one rolling mob a dozen rooms deep.
  const reach = curseHas('blind') ? 6 : 12;      // a dim party is spotted later
  const engaged = targets.some(h => dist2(m.x,m.y,h.x,h.y) <= reach && hasLOS(m.x,m.y,h.x,h.y));
  if (!engaged && roomAt(m.x,m.y) >= 0){ done(); return; }
  // closest hero we can actually reach or see
  let best = null, bestD = 1e9;
  for (const h of targets){
    const d = dist2(m.x,m.y,h.x,h.y);
    if (d < bestD){ bestD = d; best = h; }
  }
  if (!best){ done(); return; }
  const strike = () => {
    const adj = DIRS.some(([dx,dy]) => m.x+dx===best.x && m.y+dy===best.y && linked(m.x,m.y,best.x,best.y));
    if (adj){ focusOn(m.x,m.y); monsterAttack(m, best, done); }
    else done();
  };
  // an archer would rather not be reached at all
  if (MONSTERS[m.mt] && MONSTERS[m.mt].shooter){
    const shot = targets.filter(h => dist2(m.x,m.y,h.x,h.y) >= 2 && dist2(m.x,m.y,h.x,h.y) <= 9
                                     && hasLOS(m.x,m.y,h.x,h.y));
    if (shot.length){
      monsterShoot(m, shot.sort((a,b) => a.bp - b.bp)[0], done);
      return;
    }
  }
  // a hellhound would rather catch two of you at once
  if (MONSTERS[m.mt] && MONSTERS[m.mt].breath && (m.breathed || 0) < 2){
    let bestAim = null, bestCount = 0;
    for (const h of targets){
      const aim = breathLine(m, h);
      if (!aim) continue;
      const n = targets.filter(x => aim.line.some(([px,py]) => px === x.x && py === x.y)).length;
      if (n > bestCount){ bestCount = n; bestAim = aim; }
    }
    if (bestAim && bestCount > 0){
      m.breathed = (m.breathed || 0) + 1;
      monsterBreath(m, bestAim, done);
      return;
    }
  }
  // a caster would rather burn you from across the room
  if (MONSTERS[m.mt] && MONSTERS[m.mt].caster && (m.cast || 0) < 3){
    const seen = targets.filter(h => dist2(m.x,m.y,h.x,h.y) <= 8 && hasLOS(m.x,m.y,h.x,h.y));
    if (seen.length && !targets.some(h => dist2(m.x,m.y,h.x,h.y) === 1)){
      const mark = seen.sort((a,b) => a.bp - b.bp)[0];
      monsterCast(m, mark, done);
      return;
    }
  }
  // already next to someone? hit them — unless it has been bloodied and is small
  for (const h of targets){
    if (dist2(m.x,m.y,h.x,h.y) === 1 && linked(m.x,m.y,h.x,h.y)){
      if (m.skittish && !m.fled){ m.fled = 1; break; }
      // a spider webs somebody who is still free, and only bites if they are not
      if (MONSTERS[m.mt] && MONSTERS[m.mt].webber && !h.webbed){
        monsterWeb(m, h, done);
        return;
      }
      focusOn(m.x,m.y);
      // the frenzied get a second swing, at whoever is still standing
      monsterAttack(m, h, m.affix === 'frenzied'
        ? () => { const t = h.alive ? h : livingHeroes().find(x => dist2(m.x,m.y,x.x,x.y) === 1);
                  if (t && m.alive) monsterAttack(m, t, done); else done(); }
        : done);
      return;
    }
  }
  const f = walkFieldSafe(m.x, m.y, m.mv, m, m.mt === 'gargoyle');
  const away = !!(m.skittish && m.fled);            // bloodied goblins want distance
  let goal = null, goalD = dist2(m.x,m.y,best.x,best.y), goalCost = 0;
  for (const [k, cost] of f.d){
    const x = k % W, y = (k/W)|0;
    if (blocked(x,y) && !(x===m.x&&y===m.y)) continue;
    const d = dist2(x,y,best.x,best.y);
    const better = away ? d > goalD : d < goalD;
    if (better || (d === goalD && cost < goalCost && !away)){ goalD = d; goal = [x,y]; goalCost = cost; }
  }
  if (away && goal){ m.skittish = 0; m.fled = 0; }
  if (!goal){ strike(); return; }
  const path = tracePath(f, goal[0], goal[1]);
  if (!path || !path.length){ strike(); return; }
  let k = 0;
  const step = () => {
    if (k >= path.length){ strike(); return; }
    const [nx,ny] = path[k++];
    m.facing = nx > m.x ? 1 : nx < m.x ? -1 : m.facing;
    slide(m, nx, ny, 130, () => later(20, step));
  };
  step();
}

function endZargonTurn(){
  if (G.q.over) return;
  G.q.turn++;
  stirWrath(1, 'time');
  if (curseHas('watched') && G.q.turn % 6 === 0){
    const hs2 = livingHeroes();
    if (hs2.length){ say('Marked. Something finds you again.', 'bad'); spawnWanderer(hs2[ri(hs2.length)]); }
  }
  if (modHas('hunted') && G.q.turn % 4 === 0){
    const hs = livingHeroes();
    if (hs.length){
      say('Something new comes down the corridor. The Warlock is watching.', 'bad');
      spawnWanderer(hs[ri(hs.length)]);
    }
  }
  const q = questDef();
  if (q.turnLimit && G.q.turn > q.turnLimit){ questOver(false, 'The working completes. Grimhold seals itself with you inside.'); return; }
  tickTrial();
  if (G.q.over) return;
  tickRaising();
  tickLiars();
  if (G.q.over) return;
  G.q.phase = 'hero';
  for (const h of heroes()){
    h.done = !h.alive; h.acted = false; h.rolled = false; h.moveLeft = 0;
  }
  setMood(monstersOf().some(m => m.awake && tileVisible(m.x,m.y)) ? 'fight' : 'explore');
  const first = heroes().find(h => h.alive && !h.done);
  if (!first){ questOver(false, 'The party is destroyed.'); return; }
  banner('YOUR TURN', 'turn ' + G.q.turn);
  tickPoison();
  beginHeroActivation(first);
  renderHUD();
}

/* ---------------------------------------------------------------- actions */

function openDoorAt(h, d){
  if (d.open) return false;
  if (d.secret && !d.found) return false;
  // a trial announces its terms before it lets you in
  if (G.q.trialRoom && d.rid === G.q.trialRoom.room && !G.q.trial){
    if (!HEADLESS){ showTrialOffer(() => openDoorAt(h, d)); return false; }
    startTrial();
  }
  // A door the broken trial bolted. No key fits it — somebody puts a shoulder
  // through it, and pays for the privilege. Never a lock you cannot get past.
  if (d.trialBolt){
    if (!h || h.acted){
      say('Bolted from the inside. Somebody with an action left will have to put a shoulder through it.', 'bad');
      sfx('block');
      return false;
    }
    h.acted = true;
    d.trialBolt = false; d.locked = false;
    say(`${h.name} puts a shoulder through the bolt. It costs a Body Point.`, 'bad');
    sfx('door'); G.shake = Math.max(G.shake, 14);
    hurt(h, 1, null);
    if (!h.alive) return false;
  }
  if (d.locked && !G.q.key){
    // No key, but a locked door is still only a door. Forcing it is the same
    // question the chests ask: quiet and slow, or now and loud.
    if (!HEADLESS && h && !h.acted && !d.forced){ showForceDoor(h, d); return false; }
    say('The door is locked, and the lock is a good one. Something down here is carrying the key.', 'bad');
    sfx('block');
    return false;
  }
  if (d.locked){
    d.locked = false;
    say('The key turns. Whatever they were keeping in here, it is yours now.', 'good');
    sfx('gold');
  }
  d.open = true;
  sfx('door');
  say('The door swings open.', '');
  if (boonHas('doorward')){
    for (const x of livingHeroes()) if (x.bp < x.bpMax){ x.bp++; floatText(x.x, x.y, '+1', '#7de8a0'); }
  }
  if (relicHas('horn')){
    let n = 0;
    for (const m of monstersOf()) if (roomAt(m.x,m.y) === d.rid){ m.stun = Math.max(m.stun||0, 1); n++; }
    if (n) say(`The horn sounds. ${n} of them stand there blinking.`, 'good');
  }
  pushIn(d.rid);
  revealRoom(d.rid);
  recomputeVision();
  refreshField();
  const q = questDef();
  const room = ROOMS[d.rid];
  if (!G.q.announced) G.q.announced = {};
  if (!G.q.announced[d.rid]){
    G.q.announced[d.rid] = 1;
    const n = monstersOf().filter(m => roomAt(m.x,m.y) === d.rid).length;
    say(`${room.name}${n ? ' — ' + n + ' hostile' + (n>1?'s':'') : ' — empty'}`, n ? 'bad' : '');
    if (n) setMood('fight');
    bossIntro(d.rid);
  }
  renderHUD();
  return true;
}

/* ------------------------------------------------------------ FORCING A DOOR */
// A chest asks whether you want it open or open now. A locked door with no key
// used to just say no. It asks the same question — and the cost is noise
// rather than a needle: the Warlock hears it, and so does the room behind it.

const FORCE_DOOR_WRATH = 6;
function forceDoor(h, d){
  if (!h || !d || h.acted || !d.locked || d.trialBolt) return false;
  h.acted = true;
  d.forced = true; d.locked = false;
  say(`${h.name} puts a shoulder through the lock. The whole floor heard that.`, 'bad');
  sfx('door'); G.shake = Math.max(G.shake, 16); hitStop(120);
  stirWrath(FORCE_DOOR_WRATH, 'a door taken off its lock');
  // opening the room wakes what is in it; the noise is what the Warlock hears
  openDoorAt(h, d);
  return true;
}
function showForceDoor(h, d){
  modal(`<h2>The Lock</h2>
    <div class="sub" style="margin:2px 0 0">${ROOMS[d.rid].name}</div>
    <div class="rule"></div>
    <p class="flavor">A good lock, and no key on anybody here. ${h.name} can leave
      it for whoever is carrying the key — or stop asking politely.</p>
    <div class="row">
      <div class="ic">🗝</div>
      <div class="tx"><b>Find the key</b><s>A champion on this floor has it. The door will wait.</s></div>
      <div style="color:#63bf7d">quiet</div>
    </div>
    <div class="row">
      <div class="ic">🪓</div>
      <div class="tx"><b>Put a shoulder through it</b><s>It opens now, for your action — and the
        Warlock hears it, and nothing in that room is asleep any more</s></div>
      <div style="color:#b03a2c">loud</div>
    </div>
    <div class="rule"></div>
    <div style="text-align:center">
      <button class="btn big" id="mForceDoor">Force it</button>
      <button class="btn ghost" id="mLeaveLock">Leave it locked</button>
    </div>`);
  bindModal('#mForceDoor', () => { closeModal(); forceDoor(h, d); });
  bindModal('#mLeaveLock', () => { closeModal(); say('You leave the lock alone.', ''); });
}

/* ------------------------------------------------------------ boss intros */
// The thing at the end of a floor gets its name said out loud before it moves.
// One card, one line, once — a title you have already read is just a delay.

const BOSS_LINES = {
  gargoyle:'Carved to guard, and it remembers the work',
  chaos:   'His armour has not been off in years',
  ogre:    'The ceiling is low. He stopped minding',
  sorcerer:'He was expecting somebody — not you',
  troll:   'It has been fed. It is still hungry',
  mummy:   'It has outlasted whoever wrapped it',
};
function bossOf(rid){
  return monstersOf().find(m => m.boss && m.alive && roomAt(m.x, m.y) === rid) || null;
}
function bossIntro(rid){
  if (!G || !G.q) return null;
  const b = bossOf(rid);
  if (!b) return null;
  if (!G.q.bossMet) G.q.bossMet = {};
  if (G.q.bossMet[b.uid]) return null;             // a title card, not a habit
  G.q.bossMet[b.uid] = 1;
  const line = BOSS_LINES[b.mt] || 'The master of this floor.';
  banner(b.name, line);
  say(`${b.name}. ${line}`, 'bad');
  sfx('boss');
  G.shake = Math.max(G.shake, 22);
  G.camPunch = 1.4;
  hitStop(260);
  setMood('fight');
  return b;
}
// And a second line when he is nearly done, so the fight has a shape: the room
// says his name, you take him apart, and the room says one thing more.
const BOSS_LAST = {
  gargoyle:'A crack runs through it, and it does not slow down',
  chaos:   'He is still on his feet, and that is the problem',
  ogre:    'He stops laughing. That is worse',
  sorcerer:'The working is coming apart in his hands',
  troll:   'It has stopped knitting itself back together',
  mummy:   'What is left of it is still coming',
};
function bossLastWords(m){
  if (!G || !G.q || !m || !m.boss || !m.alive) return null;
  if (m.bp > 1 || m.spoke) return null;
  m.spoke = 1;
  const line = BOSS_LAST[m.mt] || 'Whatever held it together is going';
  banner(m.name, line);
  say(`${m.name} — ${line}.`, 'bad');

  G.camPunch = 1.2;

}

function doorBetween(x1,y1,x2,y2){
  const d = doorAt(x1,y1,x2,y2);
  return d && (!d.secret || d.found) ? d : null;
}

function searchTreasure(){
  const h = activeHero();
  if (!h || h.acted || busy()) return;
  const rid = roomAt(h.x, h.y);
  if (rid < 0){ say('You can only ransack a room, not a corridor.', 'bad'); return; }
  if (monstersOf().some(m => roomAt(m.x,m.y) === rid)){ say('Not with monsters in the room.', 'bad'); return; }
  if (G.q.searched[rid]){ say('This room has been picked over already.', 'bad'); return; }
  h.acted = true; G.q.searched[rid] = 1;
  // everything in here has been gone through, and should look it from the door
  for (const f of G.q.furn)
    if (f.r === rid && FURN[f.t] && FURN[f.t].search) f.searched = true;
  stirWrath(3, 'rummaging');
  sfx('search');
  const qf = G.q.furn.find(f => f.r === rid && f.quest && !f.taken);
  if (qf){
    qf.taken = true;
    later(260, () => giveQuestItem(qf.quest, h));
    renderHUD();
    return;
  }
  // A room with a chest in it asks one question before it pays anything.
  const chest = chestIn(rid);
  if (chest && !HEADLESS){ showChest(h, chest); return; }
  openChest(h, chest, false);
}

/* ---------------------------------------------------------- FORCED CHESTS */
// Every chest asks the same question: do you want it open, or do you want it
// open now. Easing it takes the card the room was always going to give you.
// Putting your shoulder to it pays twice — and roughly two times in five the
// lock was a needle, or the chest was never a chest.

const FORCE_RISK = .42;
function chestIn(rid){
  if (!G.q || rid < 0) return null;
  return G.q.furn.find(f => f.r === rid && f.t === 'chest' && !f.quest && !f.taken) || null;
}
function drawCard(rid, h){
  let card = TREASURE_DECK[G.q.deck[G.q.deckAt++ % G.q.deck.length]];
  if (rid === G.q.vault){
    card = { k:'gold', n:250 + ri(200), t:'The vault', d:'This is what the lock was for.' };
    // it pays what has been standing on the plinth in here all along
    const p = vaultPlinth();
    const want = plinthRelicOf(p);
    const r = G.run && !G.q.relicFound ? (want || (relicOffer() || {}).id) : null;
    if (r){
      G.q.relicFound = r;
      spendPlinth('vault');
      later(900, () => showRelic(r));
    }
  }
  return card;
}
// What forcing it is worth if it goes well: twice the coin, or coin on top of
// whatever else was in there.
function forcedCard(card){
  if (card.k === 'gold') return Object.assign({}, card, { n: card.n*2, d: card.d + ' The lid did not survive.' });
  return Object.assign({}, card, { k:'gold', n:80 + ri(80), t:card.t,
    d:`${card.d} And loose coin under it.` });
}
function openChest(h, chest, forced){
  const rid = roomAt(h.x, h.y);
  if (chest) chest.taken = true;
  if (forced){
    stirWrath(3, 'splintering wood');
    sfx('door'); G.shake = Math.max(G.shake, 10);
    if (rnd() < FORCE_RISK){ chestBites(h, chest); return null; }
    const card = forcedCard(drawCard(rid, h));
    later(260, () => applyTreasure(card, h));
    renderHUD();
    return card;
  }
  const card = drawCard(rid, h);
  later(260, () => applyTreasure(card, h));
  renderHUD();
  return card;
}
// It goes wrong in one of two ways, and the second one has teeth.
function chestBites(h, chest){
  const depth = G.run ? G.run.depth : (G.q.qi + 1);
  const mimic = depth >= 2 && rnd() < .5;
  if (mimic){
    if (chest) chest.taken = true;
    const m = spawnWanderer(h, 'mimic');
    say('The chest was never a chest. It has been waiting a long time.', 'bad');
    sfx('boss'); G.shake = Math.max(G.shake, 18); hitStop(200);
    if (m) banner('MIMIC', 'it was patient');
    renderHUD();
    return m;
  }
  const n = 2;
  say('The lock was a needle, and it was meant for exactly this.', 'bad');
  spark(h.x, h.y, 18, '#7fd86b', { spd:.016, up:.004 });
  sfx('hit'); G.shake = Math.max(G.shake, 12);
  h.poison = Math.max(h.poison || 0, 2);
  hurt(h, n, null);
  renderHUD();
  return null;
}

/* --------------------------------------------------- FURNITURE THAT LIES */
// Forcing a chest can turn one into a mimic. From the third floor down one
// piece of furniture on the floor was never furniture, and it is waiting for
// somebody to walk within arm's reach. Find Traps turns it up before it turns
// up you — which is what makes walking past the scenery a decision.
//
// Three things can lie, and each lies as the thing it is: the chest has teeth,
// the tomb was never sealed, and the armour on the rack is standing up by
// itself. What comes out is whatever that piece of furniture would hide.

const LIE_FROM = 3;
const LIE_CHANCE = .38;
const LIARS = {
  chest: { mt:'mimic',  col:'#7a5a2c', banner:'MIMIC',           sub:'it has been waiting',
    ambush:'reaches for the chest, and the chest reaches back.',
    quiet: 'The chest is breathing. It gives up pretending and stands.' },
  tomb:  { mt:'mummy',  col:'#c9bb93', banner:'IT WAS NOT EMPTY', sub:'the lid was never sealed',
    ambush:'leans on the tomb, and the lid goes over with a crack.',
    quiet: 'The lid of the tomb does not quite sit right, and has not for a long time.' },
  rack:  { mt:'chaos',  col:'#3a3340', banner:'IT WAS NOT ARMOUR',sub:'nobody put it there',
    ambush:'steps past the weapon rack, and the armour on it steps down.',
    quiet: 'The armour on the rack is standing at attention. Nothing is holding it up.' },
};
const LIAR_TYPES = Object.keys(LIARS);
const liars = () => (G && G.q && G.q.furn ? G.q.furn.filter(f => f.lie && !f.sprung) : []);
const lyingChests = liars;                     // it was all chests once
// A hero standing beside one is close enough.
function mimicWatch(){
  if (!G || !G.q || G.q.over) return null;
  for (const f of liars()){
    const h = livingHeroes().find(x => Math.max(Math.abs(x.x - f.x), Math.abs(x.y - f.y)) <= 1);
    if (h) return springLiar(f, h);
  }
  return null;
}
// It stops pretending. Whoever woke it wears the first blow; one you already
// spotted has lost its ambush and simply stands up.
function springLiar(f, h, quiet){
  if (!f || f.sprung) return null;
  const L = LIARS[f.t] || LIARS.chest;
  f.sprung = true; f.lie = false;
  const i = G.q.furn.indexOf(f);
  if (i >= 0) G.q.furn.splice(i, 1);
  const def = MONSTERS[L.mt];
  const m = { kind:'monster', uid:9500 + ri(499), mt:L.mt, name:def.name,
    x:f.x, y:f.y, alive:true, facing:-1,
    bpMax:def.bp, bp:def.bp, atk:def.atk, def:def.def, mind:def.mind, mv:def.move,
    boss:false, awake:true, sleep:0, stun:0, bob:rnd()*6.28,
    // it remembers what it was pretending to be, and can go back to it
    wasLiar: { t:f.t, r:f.r, w:f.w, h:f.h, rot:f.rot } };
  G.q.actors.push(m);
  spark(f.x, f.y, 24, L.col, { spd:.02, up:.004 });
  setMood('fight');
  recomputeVision();
  if (quiet){
    say(L.quiet, 'bad');
    sfx('die'); G.shake = Math.max(G.shake, 10);
  } else {
    say(`${h ? h.name : 'Somebody'} ${L.ambush}`, 'bad');
    banner(L.banner, L.sub);
    sfx('boss'); G.shake = Math.max(G.shake, 20); hitStop(240);
    focusOn(f.x, f.y); G.camPunch = 1.3;
    if (h) later(320, () => { if (h.alive && m.alive) monsterAttack(m, h, () => {}); });
  }
  refreshField(); renderHUD();
  return m;
}
const springMimic = springLiar;                // the name it had when it was only chests

// And it can go back. A liar nobody is looking at, that nobody has managed to
// hurt, settles down and becomes furniture again — on the square it is standing
// on, not the one it started from. Wound it and it has lost the trick for good.
function tickLiars(){
  if (!G || !G.q || G.q.over) return null;
  let hid = null;
  for (const m of monstersOf()){
    if (!m.wasLiar || m.bp < m.bpMax) continue;
    if (livingHeroes().some(h => tileVisible(m.x, m.y) || dist2(h.x, h.y, m.x, m.y) <= 4)) continue;
    if (furnAt(m.x, m.y)) continue;              // no room to be furniture here
    m.alive = false; m.deathT = 0;
    const L = m.wasLiar;
    G.q.furn.push({ t:L.t, r:roomAt(m.x, m.y), x:m.x, y:m.y, w:L.w || 1, h:L.h || 1,
                    rot:L.rot || 0, quest:null, taken:false, searched:false, lie:true });
    say('Somewhere behind you, something stops moving.', 'bad');
    hid = m;
    break;
  }
  if (hid){ recomputeVision(); refreshField(); renderHUD(); }
  return hid;
}

/* --------------------------------------------------- WHAT THEY WERE CARRYING */
// A body has been sitting on its square doing nothing since the fall got its
// own beat. Their weapon is still in their hand. Going back for it costs the
// action you were going to spend on something else, which is the whole point:
// walking to a dead friend has to compete with fighting.

const bodyAt = (x,y) => (G.q && G.q.bodies ? G.q.bodies.find(b => b.x === x && b.y === y) || null : null);
function bodyWorthTaking(b, h){
  if (!b || b.taken || !h) return false;
  const theirs = WEAPONS[b.weapon], mine = weaponOf(h);
  const betterWeapon = !!(theirs && !theirs.quest && theirs.dice > mine.dice);
  const anyItems = Object.keys(b.items || {}).some(k => b.items[k] > 0);
  return betterWeapon || anyItems;
}
function bodyWatch(h){
  if (!G || !G.q || G.q.over || !h || !h.alive) return null;
  const b = bodyAt(h.x, h.y);
  if (!b || b.risen) return null;
  if (!bodyWorthTaking(b, h) && !bodyStirring(b)) return null;
  if (HEADLESS) return b;                       // tests call takeUp themselves
  if (h.acted) return b;                        // nothing left to spend on it
  showBody(h, b);
  return b;
}

/* ------------------------------------------------- WHAT THE WARLOCK WANTS */
// Taking a friend's blade back was the party's half of it. This is his: while
// a sorcerer is alive on the floor, the nearest body it can see starts to
// stir, and two turns later it gets up wearing your friend's name. Killing the
// sorcerer stops it; so does going back and laying them to rest, which costs
// the same action the blade did. Leaving them where they fell is a decision now.

const RAISE_TURNS = 2;
const bodyStirring = (b) => !!(b && b.stirring > 0 && !b.risen && !b.laid);
const stirringBodies = () => (G.q && G.q.bodies ? G.q.bodies.filter(bodyStirring) : []);
const raisers = () => monstersOf().filter(m => MONSTERS[m.mt] && MONSTERS[m.mt].caster);
function layToRest(h, b){
  if (!h || !b || h.acted || b.risen || b.laid) return false;
  h.acted = true;
  b.laid = true; b.stirring = 0;
  say(`${h.name} closes ${b.name}'s eyes. Whatever was pulling at them lets go.`, 'good');
  spark(b.x, b.y, 18, '#9fd8e8', { spd:.012, up:.006 });

  return true;
}
// Called once a turn, with the Warlock's other business.
function tickRaising(){
  if (!G || !G.q || G.q.over || !G.q.bodies) return null;
  const casters = raisers();
  let risen = null;
  for (const b of G.q.bodies){
    if (b.risen || b.laid) continue;
    if (b.stirring > 0){
      if (!casters.length){                       // nothing left to pull at them
        b.stirring = 0;
        say(`Whatever was reaching for ${b.name} has stopped.`, 'good');
        continue;
      }
      b.stirring--;
      if (b.stirring <= 0) risen = raiseBody(b) || risen;
      else say(`${b.name} is moving. Not on their own.`, 'bad');
      continue;
    }
    // nothing has started on this one yet — a caster who can see it begins
    if (!casters.length) continue;
    if (casters.some(m => hasLOS(m.x, m.y, b.x, b.y) && dist2(m.x, m.y, b.x, b.y) <= 64)){
      b.stirring = RAISE_TURNS;
      say(`Something starts to work on ${b.name} where they fell.`, 'bad');
      sfx('spell');
      break;                                      // one at a time; it is not a factory
    }
  }
  renderHUD();
  return risen;
}
function raiseBody(b){
  if (!b || b.risen || b.laid) return null;

  const m = { kind:'monster', uid:9800 + ri(199), mt:'zombie', name:`${b.name}'s Corpse`,
    x:b.x, y:b.y, alive:true, facing:-1,
    bpMax:def.bp + 1, bp:def.bp + 1, atk:def.atk, def:def.def, mind:def.mind, mv:def.move,
    boss:false, awake:true, sleep:0, stun:0, bob:rnd()*6.28, wasHero:b.id };
  G.q.actors.push(m);
  say(`${b.name} gets up. It is not ${b.name} any more.`, 'bad');
  banner(b.name.toUpperCase(), 'is on its feet again');

  spark(b.x, b.y, 26, '#7d8f6a', { spd:.02, up:.005 });

}
function takeUp(h, b){
  if (!h || !b || b.taken || h.acted) return null;
  const theirs = WEAPONS[b.weapon], mine = weaponOf(h);
  const got = { weapon:null, items:[] };
  h.acted = true;
  b.taken = true;
  if (theirs && !theirs.quest && theirs.dice > mine.dice){
    h.weapon = b.weapon;
    got.weapon = b.weapon;
  }
  for (const k in (b.items || {})){
    const n = b.items[k];

    ? `${h.name} takes up ${b.name}'s ${theirs.name}.`

  spark(b.x, b.y, 16, '#c8a24a', { spd:.014, up:.005 });
  renderHUD(); saveRun();
  return got;
}

// Push your luck. The first pull is the search itself; every pull after it
// pays more and is likelier to go wrong. The odds are always on screen — a
// gamble you cannot see the price of is just a trap.
function pushOdds(pulls){
  return {
    bad: Math.min(.72, .16 + pulls*.15),
    mult: 1 + pulls*.7,
  };
}
function canPush(){
  const p = G.q.push;
  if (!p || !G.q || G.q.over) return false;
  const h = activeHero();
  return !!(h && h.id === p.hero && p.pulls > 0 && !p.done);
}
function pushLuck(){
  if (!canPush()) return false;
  const P = G.q.push, h = activeHero();
  const o = pushOdds(P.pulls);
  P.pulls++;
  const bad = rnd() < o.bad;
  sfx('search');
  if (bad){
    P.done = true;
    const roll = ri(3);
    if (roll === 0){
      say('Your luck runs out — something was listening.', 'bad');
      spawnWanderer(h);
    } else if (roll === 1){
      const n = 1 + ri(2);
      say(`Your luck runs out — the shelf gives way. ${n} Body Point${n>1?'s':''}.`, 'bad');
      spark(h.x, h.y, 18, '#6a6258', { spd:.018 });
      hurt(h, n, null);
    } else {
      say('Your luck runs out — the dust in here is not dust. Poisoned.', 'bad');
      h.poison = Math.max(h.poison || 0, 2);
      spark(h.x, h.y, 16, '#7fd86b', { spd:.014, up:.004 });
    }
    G.shake = 12;
  } else {
    const base = [40, 60, 80, 120][Math.min(3, P.pulls - 2)] || 120;
    let n = Math.round(base * o.mult);
    if (boonHas('luckyfind')) n = Math.round(n*1.5);
    if (modHas('wealthy')) n *= 2;
    G.q.pot = (G.q.pot || 0) + n;
    P.won += n;
    sfx('gold');
    floatText(h.x, h.y, '+' + n, '#f3d488', n >= 150);
    spark(h.x, h.y, 16, '#d8a83c', { spd:.014, up:.004 });
    say(`Another handful — ${n} gold. That is ${P.won} from this room.`, 'good');
  }
  renderHUD(); checkQuestState();
  if (!HEADLESS && !P.done && !G.q.over) later(420, showPush);
  return !bad;
}
function bankPush(){
  if (!G.q.push) return false;
  const P = G.q.push;
  P.done = true;
  if (P.won > 0) say(`You take the ${P.won} and step away from it.`, 'good');
  renderHUD();
  return true;
}
/* ------------------------------------------------------- THE GAMBLER'S COFFIN */
// Somebody has been using a tomb as a bank, and whatever they were banking
// against is still in there. One combat die a pull: a skull pays and the pot
// climbs, a white shield moves nothing but the pot climbs anyway, and a black
// shield lets out whatever the pot has been feeding. The first pull costs an
// action; after that you may keep going until you stop or it stops you.

const COFFIN_FROM = 3;
const COFFIN_CHANCE = .3;
// What climbs out gets worse the longer you have been at it.
const COFFIN_GUESTS = ['goblin','skeleton','orc','fimir','mummy','chaos'];
const coffinAt = (rid) => (G.q && G.q.furn ? G.q.furn.find(f => f.t === 'coffin' && f.r === rid) || null : null);
const coffinNear = (h) => (!h || !G.q || !G.q.furn) ? null
  : G.q.furn.find(f => f.t === 'coffin' && !f.done
      && Math.max(Math.abs(h.x - (f.x + (f.w-1)/2)), Math.abs(h.y - (f.y + (f.h-1)/2))) <= 1.5) || null;
function coffinPot(pulls){ return Math.round(120 * (1 + pulls*.85)); }
function coffinPull(h, f){
  if (!h || !f || f.done || !G.q || G.q.over) return null;
  if (!f.pulls && h.acted) return null;              // the first one costs the turn
  if (!f.pulls) h.acted = true;
  const face = combatDie();
  const out = { face, pulls: f.pulls || 0, paid:0, guest:null, done:false };
  f.pulls = (f.pulls || 0) + 1;
  if (face === SKULL){
    let n = coffinPot(out.pulls);
    if (boonHas('luckyfind')) n = Math.round(n*1.5);
    if (modHas('wealthy')) n *= 2;
    if (curseHas('greedy')) n = Math.round(n*.75);
    G.q.pot = (G.q.pot || 0) + n;
    out.paid = n;
    stirWrath(Math.ceil(n/60), 'coin');
    sfx('gold');
    floatText(f.x, f.y, '+' + n, '#f3d488', n >= 200);
    spark(f.x, f.y, 18, '#d8a83c', { spd:.015, up:.005 });
    say(`The lid comes up and there is coin under it. ◈ ${n}.`, 'good');
  } else if (face === WHITE){
    sfx('block');
    say('The lid grinds, settles, and gives you nothing. Whatever is under it is listening.', '');
  } else {
    f.done = true; out.done = true;
    const t = COFFIN_GUESTS[Math.min(COFFIN_GUESTS.length - 1, f.pulls - 1)];
    const m = spawnWanderer(h, t);
    out.guest = m ? m.mt : null;
    say(`The lid goes over. Something has been waiting under it for a long time.`, 'bad');
    banner('IT WAS NOT EMPTY', 'somebody had been feeding it');
    sfx('boss'); G.shake = Math.max(G.shake, 20); hitStop(220);
  }
  renderHUD(); checkQuestState();
  if (!HEADLESS && !f.done && !G.q.over) later(420, () => showCoffin(h, f));
  return out;
}
function showCoffin(h, f){
  if (!h || !f || f.done) return;
  const next = coffinPot((f.pulls || 0) + 1);
  const guest = MONSTERS[COFFIN_GUESTS[Math.min(COFFIN_GUESTS.length - 1, f.pulls || 0)]];

function applyTreasure(card, h){
  if (card.k === 'gold'){

    if (boonHas('luckyfind')) n = Math.round(n*1.5);

    if (curseHas('greedy')) n = Math.round(n*.75);
    card = Object.assign({}, card, { n });
    stirWrath(Math.ceil(n/60), 'coin');
    G.q.pot = (G.q.pot || 0) + n;
    sfx('gold'); floatText(h.x, h.y, '+' + n, '#f3d488');
    spark(h.x, h.y, 16, '#d8a83c', { spd:.014, up:.004 });
    say(`${card.t}: ${card.d}`, 'good');
  } else if (card.k === 'item'){
    h.items[card.n] = (h.items[card.n] || 0) + 1;
    sfx('gold'); say(`${card.t} — ${h.name} takes it.`, 'good');
  } else if (card.k === 'hazard'){
    say(`${card.t}! ${card.d}`, 'bad');
    hurt(h, card.n, null);
  } else if (card.k === 'wander'){
    if (boonHas('quietstep')){
      say('Something stirs in the dark — and settles again. You were quiet enough.', 'good');
    } else {
      say(`${card.t} — ${card.d}`, 'bad');
      spawnWanderer(h);
    }
  } else {
    say(`${card.t}. ${card.d}`, '');
  }
  // a room that gave you something will give you more, for a price
  if (card.k === 'gold' || card.k === 'item'){
    const rid = roomAt(h.x, h.y);
    if (rid >= 0){
      G.q.push = { rid, hero:h.id, pulls:1, won:(card.k === 'gold' ? card.n : 0), done:false };
      if (!HEADLESS) later(500, showPush);
    }
  }
  renderHUD(); checkQuestState();
}
function spawnWanderer(h, type){
  const pool = ['goblin','orc','skeleton','fimir','zombie'];
  const t = type || pool[Math.min(pool.length-1, Math.floor(G.q.qi/2.4) + ri(2))] || 'goblin';
  const spots = [];
  for (const [dx,dy] of DIRS8){
    const x = h.x+dx, y = h.y+dy;
    if (isFloor(x,y) && !blocked(x,y) && linked(h.x,h.y,x,y)) spots.push([x,y]);
  }
  if (!spots.length){
    // boxed in — widen the search so the Warlock's reinforcements always land
    for (let r = 2; r <= 6 && !spots.length; r++){
      for (let dy=-r; dy<=r; dy++) for (let dx=-r; dx<=r; dx++){
        if (Math.max(Math.abs(dx), Math.abs(dy)) !== r) continue;
        const x = h.x+dx, y = h.y+dy;
        if (!isFloor(x,y) || blocked(x,y) || trapBlocks(x,y)) continue;
        if (roomAt(x,y) !== roomAt(h.x,h.y)) continue;      // same side of the walls
        spots.push([x,y]);
      }
    }
  }
  if (!spots.length) return null;
  const [x,y] = pick(spots);
  const def = MONSTERS[t];
  const mon = { kind:'monster', uid:9000 + ri(9999), mt:t, name:def.name, x, y, alive:true, facing:-1,
    bpMax:def.bp, bp:def.bp, atk:def.atk, def:def.def, mind:def.mind, mv:def.move,
    boss:false, awake:true, sleep:0, stun:0, bob:Math.random()*6.28 };
  G.q.actors.push(mon);
  spark(x, y, 20, '#6a1f7a', { spd:.02, glow:'rgba(150,60,200,.4)', r:1.4 });
  setMood('fight');
  return mon;
}

function searchTraps(){
  const h = activeHero();
  if (!h || h.acted || busy()) return;
  const rid = roomAt(h.x, h.y);
  if (monstersOf().some(m => tileVisible(m.x,m.y) && dist2(m.x,m.y,h.x,h.y) <= 5)){
    say('Too dangerous to search with a monster this close.', 'bad'); return;
  }
  h.acted = true; sfx('search');
  let found = 0;
  for (const tr of G.q.traps){
    if (tr.found || tr.sprung) continue;
    const inRoom = rid >= 0 && roomAt(tr.x,tr.y) === rid;
    const near = dist2(tr.x,tr.y,h.x,h.y) <= 5 && hasLOS(h.x,h.y,tr.x,tr.y);
    if (inRoom || near){ tr.found = true; found++; }
  }
  let doors = 0;
  for (const k in G.q.doors){
    const d = G.q.doors[k];
    if (!d.secret || d.found) continue;
    const near = dist2(d.rx,d.ry,h.x,h.y) <= 5 || dist2(d.cx,d.cy,h.x,h.y) <= 5;
    if ((rid >= 0 && d.rid === rid) || near){ d.found = true; doors++; }
  }
  if (G.q.trapSearchedTiles === undefined) G.q.trapSearchedTiles = 1;
  // furniture that lies is a trap with an appetite, and a careful hero spots it
  let lies = 0;
  for (const f of liars()){
    const inRoom = rid >= 0 && f.r === rid;
    const near = dist2(f.x, f.y, h.x, h.y) <= 5 && hasLOS(h.x, h.y, f.x, f.y);
    if (inRoom || near){ springLiar(f, h, true); lies++; }
  }
  say(found || doors || lies
    ? `${h.name} finds ${found ? found + ' trap' + (found>1?'s':'') : ''}${found&&doors?' and ':''}${doors ? doors + ' hidden door' + (doors>1?'s':'') : ''}${
        lies ? (found||doors ? ', and ' : '') + 'something pretending to be furniture' : ''}.`
    : `${h.name} finds nothing hidden here.`, found||doors||lies ? 'good' : '');
  recomputeVision(); renderHUD();
}

function disarmTarget(){
  const h = activeHero();
  if (!h) return null;
  for (const [dx,dy] of [[0,0],...DIRS]){
    const tr = trapAt(h.x+dx, h.y+dy);
    if (tr && tr.found && !tr.sprung && (dx===0&&dy===0 ? true : linked(h.x,h.y,h.x+dx,h.y+dy))) return tr;
  }
  return null;
}
function disarmTrap(){
  const h = activeHero();
  const tr = disarmTarget();
  if (!h || !tr || h.acted || busy()) return;
  h.acted = true;
  if (h.toolkit || h.gear.toolkit){
    tr.disarmed = true; sfx('search');
    say(`${h.name} pulls the mechanism apart. The trap is dead.`, 'good');
    spark(tr.x, tr.y, 10, '#9c8d75');
    renderHUD(); return;
  }
  const f = rollCombat(1);
  showDice('attack', f, [], `${h.name} works the trap`, f[0]===SKULL ? 'Disarmed' : f[0]===BLACK ? 'It goes off!' : 'No luck', () => {
    if (f[0] === SKULL){ tr.disarmed = true; say('The trap is disarmed.', 'good'); }
    else if (f[0] === BLACK){ if (dist2(tr.x,tr.y,h.x,h.y) === 0) springTrap(h, tr, ()=>{}); else { tr.sprung = true; say('It springs harmlessly.', ''); } }
    else say('The mechanism will not budge.', '');
    renderHUD();
  });
}

function quaffPotion(){
  const h = activeHero();
  if (!h || busy() || !h.items.potion) return;
  h.items.potion--;
  const before = h.bp;
  h.bp = Math.min(h.bpMax, h.bp + 4);
  sfx('heal');
  floatText(h.x, h.y, '+' + (h.bp - before), '#7de8a0');
  spark(h.x, h.y, 18, '#7de8a0', { spd:.012, up:.006 });
  say(`${h.name} drinks. +${h.bp - before} Body Points.`, 'good');
  renderHUD();
}
function useHolyWater(m){
  const h = activeHero();
  if (!h || h.acted || !h.items.holy || !m || !MONSTERS[m.mt].undead) return false;
  h.items.holy--; h.acted = true;
  const atk = rollCombat(3);
  const skulls = countSkulls(atk);
  showDice('attack', atk, [], `Holy water on ${m.name}`, skulls ? `${skulls} Body Points` : 'It only steams', () => {
    if (skulls > 0){ sfx('hit'); hurt(m, skulls, null); }
    spark(m.x, m.y, 20, '#e8f0ff', { spd:.016, glow:'rgba(220,240,255,.45)', r:1.4 });
    renderHUD(); checkQuestState();
  });
  return true;
}

/* ---------------------------------------------------------- 9b. THE ALTAR */
// One altar a room, one use a quest. Pray for free at even-ish odds, or open a
// vein for better ones. Both tables can turn on you — that is the point.

const BLESSINGS = [
  { id:'mend',  ic:'✚', t:'The stone is warm', d:'Every hero recovers 2 Body Points.' },
  { id:'fate',  ic:'✦', t:'Something listens', d:'+1 Fate.' },
  { id:'sight', ic:'👁', t:'The floor shows itself', d:'Every trap and hidden door on this floor is revealed.' },
  { id:'clean', ic:'💧', t:'Clean water',        d:'Poison and curses wash off the party.' },
  { id:'coin',  ic:'◈',  t:'An old offering',    d:'150 gold, left by somebody who did not come back.' },
];
const GREATER = [
  { id:'heal',  ic:'✚', t:'The stone drinks and gives back', d:'Every hero is healed in full.' },
  { id:'fate2', ic:'✦', t:'It takes an interest in you',     d:'+2 Fate.' },
  { id:'boon',  ic:'🃏', t:'A gift with a name',             d:'A boon, free.' },
  { id:'hoard', ic:'◈',  t:'The floor gives up its purse',   d:'400 gold.' },
];
const CURSES = [
  { id:'guard', ic:'👹', t:'Something was sleeping under it', d:'A champion climbs out.' },
  { id:'wake',  ic:'🔔', t:'The stone screams',               d:'Everything on this floor knows where you are.' },
  { id:'rot',   ic:'🐍', t:'The offering was not for you',    d:'The hero is poisoned.' },
  { id:'toll',  ic:'💀', t:'It takes its due',                d:'Half the coin in the pot, gone.' },
  { id:'mark',  ic:'⛓',  t:'It puts a hand on you',            d:'A curse, and it travels with you.' },
];

function altarTarget(){
  const h = activeHero();
  if (!h) return null;
  for (const f of G.q.furn){
    if (f.t !== 'altar' || f.used) continue;
    for (let j=0;j<f.h;j++) for (let i=0;i<f.w;i++){
      const d = dist2(h.x, h.y, f.x+i, f.y+j);
      if (d <= 1) return f;
    }
  }
  return null;
}
function altarOutcome(kind, h, f){
  f.used = true;
  const bad = rnd() < (kind === 'bleed' ? .18 : .42);
  const table = bad ? CURSES : (kind === 'bleed' ? GREATER : BLESSINGS);
  const pick1 = table[ri(table.length)];
  const heroes2 = livingHeroes();
  sfx(bad ? 'trap' : 'heal');
  G.shake = bad ? 14 : 6;
  spark(f.x + f.w/2 - .5, f.y, 26, bad ? '#b03a2c' : '#f3d488',
        { spd:.018, up:.005, glow: bad ? 'rgba(176,58,44,.45)' : 'rgba(243,212,136,.5)', r:1.6 });
  switch (pick1.id){
    case 'mend':  for (const x of heroes2) x.bp = Math.min(x.bpMax, x.bp + 2); break;
    case 'heal':  for (const x of heroes2) x.bp = x.bpMax; break;
    case 'fate':  addFate(1, 'the altar'); break;
    case 'fate2': addFate(2, 'the altar'); break;
    case 'sight':
      for (const tr of G.q.traps) tr.found = true;
      for (const k in G.q.doors) G.q.doors[k].found = true;
      break;
    case 'clean': for (const x of heroes2){ x.poison = 0; delete x.cursed; } liftCurse(); break;
    case 'coin':  G.q.pot = (G.q.pot || 0) + 150; break;
    case 'hoard': G.q.pot = (G.q.pot || 0) + 400; break;
    case 'boon': {
      const opts = G.run ? draftOptions() : [];
      if (opts.length) takeBoon(opts[0].id);
      break;
    }
    case 'guard': {
      spawnWanderer(h);
      const born = monstersOf()[monstersOf().length - 1];
      if (born && !born.affix) applyAffix(born, AFFIXES[ri(AFFIXES.length)].id);
      break;
    }
    case 'wake':  for (const m of monstersOf()) m.awake = true; break;
    case 'rot':   h.poison = Math.max(h.poison || 0, 3); break;
    case 'mark':  addCurse(); break;
    case 'toll':  G.q.pot = Math.floor((G.q.pot || 0)/2); break;
  }
  say(`${pick1.ic} ${pick1.t} — ${pick1.d}`, bad ? 'bad' : 'good');
  recomputeVision(); refreshField(); renderHUD(); checkQuestState();
  return { bad, outcome:pick1.id };
}
// A pact is the honest version of the curse: you know what you are taking.
function altarPact(){
  const h = activeHero(), f = altarTarget();
  if (!h || !f || h.acted || busy() || !G.run) return false;
  h.acted = true; f.used = true;
  const id = addCurse();
  if (!id){ say('The stone has nothing left to take from you.', ''); renderHUD(); return false; }
  const opts = draftOptions();
  if (opts.length) takeBoon(opts[0].id);
  sfx('boss'); G.shake = 14;
  spark(f.x, f.y, 28, '#9a86e0', { spd:.02, up:.004, glow:'rgba(154,134,224,.5)', r:1.8 });
  renderHUD();
  return true;
}
function useAltar(kind){
  const h = activeHero(), f = altarTarget();
  if (!h || !f || h.acted || busy()) return false;
  if (kind === 'bleed' && h.bp <= 2){
    say(`${h.name} has not the blood to spare.`, 'bad');
    return false;
  }
  h.acted = true;
  if (kind === 'bleed'){
    floatText(h.x, h.y, '−2', '#ff7a6a');
    hurt(h, 2, null);
    if (!h.alive){ renderHUD(); return true; }
  }
  return altarOutcome(kind, h, f);
}
function showAltar(){
  const h = activeHero(), f = altarTarget();
  if (!h || !f) return;
  modal(`<h2>The Altar</h2>
    <div class="sub" style="margin:2px 0 0">Whoever built this wanted something</div>
    <div class="rule"></div>
    <p class="flavor">The stone is older than the keep around it, and the channel cut
      down its middle has been used. ${h.name} can say the words, or open a vein.</p>
    <div class="row">
      <div class="ic">🙏</div>
      <div class="tx"><b>Pray</b><s>Free. A blessing, or the stone takes an interest in you.</s></div>
      <div style="color:#63bf7d">58%</div>
    </div>
    <div class="row">
      <div class="ic">🩸</div>
      <div class="tx"><b>Bleed</b><s>Two Body Points, and the greater table.</s></div>
      <div style="color:#63bf7d">82%</div>
    </div>
    <div class="rule"></div>
    <div style="text-align:center">
      <button class="btn" id="mPray">Pray</button>
      <button class="btn red" id="mBleed" ${h.bp <= 2 ? 'disabled' : ''}>Bleed · 2 Body</button>
      ${G.run ? `<button class="btn" id="mPact" style="border-color:rgba(154,134,224,.6);color:#ccb8ff">Make a pact · a curse for a boon</button>` : ''}
      <button class="btn ghost" id="mLeave">Leave it alone</button>
    </div>`);
  bindModal('#mPray',  () => { closeModal(); useAltar('pray'); });
  bindModal('#mBleed', () => { closeModal(); useAltar('bleed'); });
  bindModal('#mPact',  () => { closeModal(); altarPact(); });
  bindModal('#mLeave', closeModal);
}

/* ----------------------------------------------------------------- spells */

function knownSpells(h){
  const out = [];
  for (const el of h.elements) for (const k of ELEMENT_SPELLS[el]) out.push(k);
  return out;
}
function spellReady(h, key){ return knownSpells(h).includes(key) && !h.spent.includes(key); }

function castSpell(h, key, target){
  if (!spellReady(h, key) || h.acted) return false;
  const sp = SPELLS[key];
  h.acted = true;
  if (boonHas('spellecho') && !h.echoed){ h.echoed = 1; say(`The weave holds — ${sp.name} is not spent.`, 'magic'); }
  else h.spent.push(key);
  sfx('spell');
  const el = ELEMENTS[sp.el];
  spark(h.x, h.y, 22, el.col, { spd:.016, up:.004, glow:hexA(el.col, .4) });
  if (sp.dice && target && isWarded(target) && !relicHas('mirror')){
    say(`The spell washes off the ${target.name} — it is warded.`, 'bad');
    spark(target.x, target.y, 18, '#a88ae8', { spd:.016, glow:'rgba(168,138,232,.4)', r:1.3 });
    refreshField(); renderHUD();
    return true;
  }
  if (sp.dice && target){
    G.q.lastStriker = h.id;
    const atk = rollCombat(sp.dice);
    const skulls = countSkulls(atk);
    const def = sp.noDef ? [] : rollCombat(target.def);
    const blocks = sp.noDef ? 0 : countShields(def, false);
    const dmg = Math.max(0, skulls - blocks);
    spark(target.x, target.y, 26, el.col, { spd:.022, glow:'rgba(255,180,90,.45)', r:1.6 });
    showDice('attack', atk, def, `${sp.name} → ${target.name}`, dmg ? `${dmg} Body Point${dmg>1?'s':''}` : 'No effect', () => {
      if (dmg > 0){
        G.shake = 12; target.sleep = 0;
        if (sp.el === 'fire') target.burned = 1;      // a burned troll does not knit
        hurt(target, dmg, null);
      }
      renderHUD(); checkQuestState();
    });
    say(`${h.name} casts ${sp.name}.`, 'magic');
    return true;
  }
  switch(key){
    case 'sleep':
      if (target.mind <= 4){ target.sleep = 1; say(`${target.name} slumps into sleep.`, 'magic'); }
      else say(`${target.name} shrugs off the spell.`, 'bad');
      break;
    case 'veil':
      target.buffs.veil = 1; say(`Mist closes around ${target.name}.`, 'magic'); break;
    case 'rockskin':
      target.buffs.rockskin = 1; say(`${target.name}'s skin turns to stone.`, 'magic'); break;
    case 'courage':
      target.buffs.courage = 1; say(`${target.name} burns with courage — +2 attack dice.`, 'magic'); break;
    case 'swiftwind':
      target.rolled = true; target.moveLeft += 6;
      say(`The wind takes ${target.name} — 6 more squares.`, 'magic'); break;
    case 'healing': case 'healbody': {
      const before = target.bp;
      target.bp = Math.min(target.bpMax, target.bp + sp.heal);
      floatText(target.x, target.y, '+' + (target.bp - before), '#7de8a0');
      sfx('heal');
      say(`${target.name} recovers ${target.bp - before} Body Points.`, 'good');
      break;
    }
    case 'tempest': {
      let n = 0;
      for (const m of monstersOf()) if (tileVisible(m.x,m.y)){ m.stun = 1; n++;
        spark(m.x, m.y, 12, '#9fd8e8', { spd:.02 }); }
      say(n ? `The tempest halts ${n} of them.` : 'The wind finds nothing to blow at.', 'magic');
      break;
    }
    case 'passrock':
      if (target && target.tile){
        slide(h, target.tile[0], target.tile[1], 200, () => { recomputeVision(); refreshField(); });
        say(`${h.name} walks through the stone.`, 'magic');
      }
      break;
  }
  refreshField(); renderHUD(); checkQuestState();
  return true;
}

/* -------------------------------------------------------------- objective */

function giveQuestItem(name, h){
  G.q.itemsFound.push(name);
  G.q.collected++;
  if (h) G.q.carrier = h.id;   // this one has to make it back up
  sfx('win');
  spark(h.x, h.y, 34, '#f3d488', { spd:.02, up:.004, glow:'rgba(243,212,136,.5)', r:2 });
  const wk = name === "Orc's Bane" ? 'orcsbane' : name === 'Spirit Blade' ? 'spirit' : null;
  if (wk){
    const old = h.weapon;
    h.weapon = wk;
    say(`${h.name} takes up the ${name}. (${WEAPONS[wk].dice} attack dice)`, 'good');
    if (old && WEAPONS[old] && !WEAPONS[old].quest) h.stowed = old;
  } else {
    say(`Found: ${name}.`, 'good');
  }
  renderHUD(); checkQuestState();
}
function objectiveReady(){
  const o = questDef().objective;
  if (o.type === 'slay') return G.q.bossDead;
  if (o.type === 'fetch') return G.q.itemsFound.includes(o.item);
  if (o.type === 'collect') return G.q.collected >= o.count;
  if (o.type === 'rescue') return G.q.npcFreed;
  if (o.type === 'fetchslay') return G.q.itemsFound.includes(o.item) && G.q.bossDead;
  if (o.type === 'clear') return !monstersOf().length;
  return false;
}
function needsEscape(){
  const t = questDef().objective.type;
  return t === 'fetch' || t === 'collect' || t === 'rescue';
}
function onStairs(h){ return STAIRS.some(s => s[0]===h.x && s[1]===h.y); }

function checkQuestState(){
  if (!G.q || G.q.over) return;
  if (!livingHeroes().length){ questOver(false, 'The party is destroyed. Grimhold keeps what it takes.'); return; }
  const ready = objectiveReady();
  if (!ready) return;
  if (!needsEscape()){ questOver(true); return; }
  // the hero holding the prize has to walk it out; if they fall, anyone may
  const c = G.q.carrier ? livingHeroes().find(x => x.id === G.q.carrier) : null;
  if (c ? onStairs(c) : livingHeroes().some(onStairs)){ questOver(true); return; }
  if (!G.q.escapeHinted){
    G.q.escapeHinted = 1;
    say(`It is done — now get ${c ? c.name : 'out'} back to the stair.`, 'good');
  }
}
function questOver(won, why){
  if (G.q.over) return;
  G.q.over = won ? 1 : 2;
  clearTimers(); G.dice = null;
  sfx(won ? 'win' : 'lose');
  setMood('explore');
  later(HEADLESS ? 0 : 700, () => (G.run ? descentFloorEnd(won, why) : showQuestEnd(won, why)));
}

function banner(a, b){
  if (HEADLESS) return;
  const el = document.getElementById('turnband');
  el.innerHTML = a + (b ? '<small>' + b + '</small>' : '');
  el.classList.add('on');
  setTimeout(() => el.classList.remove('on'), 1050);
}

/* ------------------------------------------------------------- 10. THE UI */

const $ = (id) => document.getElementById(id);
let portraitCache = {};

function renderLog(){
  if (HEADLESS) return;
  const el = $('log');
  el.innerHTML = G.q.log.map(l => `<div class="logline ${l.cls||''}">${l.text}</div>`).join('');
}

function heroPortrait(id, w, h){
  const key = id + '_' + w + '_' + h;
  if (portraitCache[key]) return portraitCache[key];
  const c = mkCan(w*2, h*2);
  const g = c.getContext('2d');
  g.scale(2,2);
  g.save(); g.translate(w/2, h*.62);
  HERO_ART[id](g, Math.min(w, h)*1.35, 0);
  g.restore();
  portraitCache[key] = c;
  return c;
}

function renderHUD(){
  if (HEADLESS || !G || !G.q) return;
  const q = questDef();
  const mods = (q.mods || []).map(m => MOD(m)).filter(Boolean).map(m => m.ic).join('');
  // The sub-line is the run line: what floor, what you carry, and a tap to read
  // it. On a phone the top bar has room for one of those spelled out, so on a
  // descent the depth goes short and the icons keep the space.
  const sub = G.run ? q.sub.replace(/^Depth /, 'D') : q.sub;
  const gone = (G.q.fallen || []).length;
  $('qname').innerHTML = `${q.name}${mods ? ' ' + mods : ''}<b>${sub}${
    gone ? ` <em>✝${gone}</em>` : ''}${
    carriedList().length ? '<u>read</u>' : ''}${
    G.run && G.run.boons.length ? ' · ' + G.run.boons.map(b => BOON(b).ic).join('') : ''}${
    G.run && G.run.curses.length ? ' · ' + G.run.curses.map(c => CURSE_MARK(c).ic).join('') : ''}${
    G.run && G.run.relics.length ? ' · ' + G.run.relics.map(r => RELIC(r).ic).join('') : ''}</b>`;
  $('goldn').textContent = (G.run ? G.run.gold : G.camp.gold) + (G.q.pot ? ' +' + G.q.pot : '');
  const fp = $('fatepill');
  if (fp){ fp.style.display = ''; $('faten').textContent = fateOf(); }
  // the run you are on. It only appears once it is worth minding, and it says
  // how far to the next step so the banner is something you can see coming.
  const sp = $('streakpill');
  if (sp){
    const n = G.q.streak || 0;
    const next = STREAK_STEPS.find(s => s > n);
    sp.style.display = n >= STREAK_SHOW ? '' : 'none';
    $('streakn').textContent = next === undefined ? String(n) : `${n}/${next}`;
    sp.classList.toggle('hot', n >= 5);
    sp.classList.toggle('max', next === undefined);
  }
  // The board says a great deal about where you have been and nothing about
  // where you have not. This is the count of rooms nobody has looked into.
  const dp = $('doorpill');
  if (dp){
    const n = roomsUnopened();
    dp.style.display = n > 0 ? '' : 'none';
    $('doorn').textContent = n;
  }
  const wp = $('wrathpill');
  if (wp){
    const lvl = G.q.wrathAt || 0, next = WRATH_STEPS[lvl];
    wp.style.display = ((G.q.wrath || 0) > 0 || next !== undefined) ? '' : 'none';
    wp.textContent = '👁 ' + (next !== undefined ? Math.max(0, next - (G.q.wrath||0)) : '!');
    wp.classList.toggle('hot', next !== undefined && (G.q.wrath||0) >= next - 4);
  }
  $('turnn').textContent = G.q.turn + (q.turnLimit ? '/' + q.turnLimit : '');
  $('turnpill').classList.toggle('gold', !!q.turnLimit && G.q.turn > q.turnLimit - 6);

  // --- party ------------------------------------------------------------
  const party = $('party');
  const roster = partyHeroes();
  if (party.children.length !== roster.length || party._for !== roster.map(h=>h.id).join()){
    party._for = roster.map(h=>h.id).join();
    party.innerHTML = '';
    for (const h of roster){
      const c = document.createElement('div');
      c.className = 'hcard'; c.dataset.id = h.id;
      c.innerHTML = `<div class="top"><span class="st"></span><span class="nm">${h.name}</span><span class="num"></span></div>
        <canvas></canvas>
        <div class="bar bp"><i></i></div><div class="bar mp"><i></i></div>`;
      c.addEventListener('click', () => selectHero(h.id));
      party.appendChild(c);
      const cv2 = c.querySelector('canvas');
      cv2.width = 120; cv2.height = 68;
      const g2 = cv2.getContext('2d');
      g2.drawImage(heroPortrait(h.id, 60, 34), 0, 0, 120, 68);
    }
  }
  [...party.children].forEach(c => {
    const h = roster.find(x => x.id === c.dataset.id);
    if (!h) return;
    c.classList.toggle('act', G.q.activeId === h.id && G.q.phase === 'hero');
    c.classList.toggle('done', h.done && h.alive);
    c.classList.toggle('dead', !h.alive);
    c.querySelector('.bar.bp i').style.width = Math.max(0, h.bp/h.bpMax*100) + '%';
    c.querySelector('.bar.mp i').style.width = (h.mp/h.mpMax*100) + '%';
    c.querySelector('.num').textContent = h.alive ? h.bp + '/' + h.bpMax : '✝';
    const st = [];
    if (h.buffs.rockskin) st.push('🪨');
    if (h.buffs.veil) st.push('🌫');
    if (h.buffs.courage) st.push('🔥');
    if (h.moveLeft > 0 && G.q.activeId === h.id) st.push(h.moveLeft + '▸');
    c.querySelector('.st').textContent = st.join(' ');
  });

  // --- movement pill ----------------------------------------------------
  const h = activeHero();
  const pill = $('movepill');
  if (h && G.q.phase === 'hero' && !busy()){
    const bits = [];
    if (h.moveLeft > 0) bits.push(`${h.moveLeft} squares left`);
    if (!h.acted) bits.push('1 action');
    pill.textContent = bits.join(' · ') || 'nothing left — end the turn';
    pill.classList.add('on');
  } else pill.classList.remove('on');

  // --- actions ----------------------------------------------------------
  const acts = $('actions');
  const trap = disarmTarget();
  const spells = h ? knownSpells(h).filter(k => spellReady(h,k)) : [];
  const packN = h ? (h.items.potion||0) + (h.items.holy||0) : 0;
  const rid = h ? roomAt(h.x,h.y) : -1;
  const roomHasMonsters = rid >= 0 && monstersOf().some(m => roomAt(m.x,m.y) === rid);
  const monsterNear = !!h && monstersOf().some(m => tileVisible(m.x,m.y) && dist2(m.x,m.y,h.x,h.y) <= 5);
  const spent = () => h ? `${h.name} has already taken an action this turn.` : 'Nobody is up.';
  const dicing = () => 'Hold on — the dice are still rolling.';
  const guard = (fn) => () => busy() ? dicing() : (!h ? 'Nobody is up.' : fn());
  const canSearch = !!h && !h.acted && rid >= 0 && !G.q.searched[rid] && !roomHasMonsters;
  const altar = altarTarget();
  const defs = [
    altar
      ? { ic:'🕯', lb:'The<br>Altar', on:!!h && !h.acted, fn:showAltar, hot:!!h && !h.acted,
          why: guard(() => h.acted ? spent() : null) }
      : { ic:'🔦', lb:'Search<br>Room', on:canSearch, fn:searchTreasure, why: guard(() => {
        if (h.acted) return spent();
        if (rid < 0) return 'You can only ransack a room, not a corridor.';
        if (G.q.searched[rid]) return `${ROOMS[rid].name} has been picked over already.`;
        if (roomHasMonsters) return 'Not with monsters still in the room.';
        return null;
      }) },
    trap
      ? { ic:'🧰', lb:'Disarm<br>Trap', on:!!h && !h.acted, fn:disarmTrap, hot:!!h && !h.acted,
          why: guard(() => h.acted ? spent() : null) }
      : { ic:'🔍', lb:'Find<br>Traps', on:!!h && !h.acted && !monsterNear, fn:searchTraps, why: guard(() => {
          if (h.acted) return spent();
          if (monsterNear) return 'Too dangerous to search with a monster this close.';
          return null;
        }) },
    { ic:'✨', lb:'Cast<br>Spell', on:spells.length>0 && !!h && !h.acted, fn:openSpellbook,
      hot:spells.length>0 && !!h && !h.acted, why: guard(() => {
        if (!knownSpells(h).length) return `${h.name} knows no magic.`;
        if (h.acted) return spent();
        if (!spells.length) return `${h.name} has spent every spell this quest.`;
        return null;
      }) },
    { ic:'🎒', lb:'Pack<br>' + (packN?packN:''), on:packN>0, fn:openPack,
      why: guard(() => packN ? null : `${h.name} is carrying nothing to use.`) },
    { ic:'✔', lb:'End<br>Turn', on:!!h, fn:endHeroTurn, end:true,
      hot:!!h && h.acted && h.moveLeft <= 0, why: guard(() => null) },
  ];
  if (acts.children.length !== defs.length){
    acts.innerHTML = '';
    defs.forEach((d,i) => {
      const b = document.createElement('div');
      b.className = 'actbtn'; b.innerHTML = `<div class="ic"></div><div class="lb"></div>`;
      // A greyed button still answers when you press it — silence is the worst
      // possible response to "why can't I do this?"
      b.addEventListener('click', () => {
        const dd = acts._defs[i];
        audioInit();
        if (dd.on && !busy()) { dd.fn(); return; }
        const r = dd.why && dd.why();
        if (r) say(r, 'bad');
      });
      acts.appendChild(b);
    });
  }
  acts._defs = defs;
  [...acts.children].forEach((b, i) => {
    const d = defs[i];
    b.querySelector('.ic').textContent = d.ic;
    b.querySelector('.lb').innerHTML = d.lb;
    b.classList.toggle('off', !d.on || busy());
    b.classList.toggle('hot', !!d.hot && !busy());
    b.classList.toggle('end', !!d.end);
  });
}

let modalOpen = false;
function modal(html, cls){
  if (HEADLESS) return;
  modalOpen = true;
  $('modalBody').className = 'sheet ' + (cls||'');

function closeModal(){

}
function bindModal(sel, fn){

function bindAll(sel, fn){

/* ----------------------------------------------------------- quest ending */

function showQuestEnd(won, why){
  const q = questDef();
  const pot = G.q.pot || 0;
  const bonus = won ? q.reward : 0;
  const total = pot + bonus;
  if (won){
    G.camp.gold += total;
    if (!G.camp.done.includes(G.q.qi)) G.camp.done.push(G.q.qi);
    G.camp.unlocked = Math.max(G.camp.unlocked, Math.min(QUESTS.length, G.q.qi + 2));
    // the blade and the bane are kept; everything else quest-bound is not
    for (const h of G.camp.heroes){
      if (WEAPONS[h.weapon] && WEAPONS[h.weapon].quest && q.keepItem !== h.weapon){
        h.weapon = h.stowed || heroDef(h).weapon;
      }
      delete h.stowed;
    }
  } else {
    G.camp.gold += Math.floor(pot/2);
  }
  for (const h of G.camp.heroes){ h.bp = h.bpMax; h.alive = true; h.buffs = {}; h.spent = []; }
  saveCampaign(); clearRun();
  const dead = G.q.actors.filter(a => a.kind === 'hero' && !a.alive).length;
  modal(`
    <h2 style="color:${won?'#63bf7d':'#b03a2c'}">${won ? 'Quest Complete' : 'Quest Failed'}</h2>
    <div class="sub" style="margin:2px 0 0">${q.name}</div>
    <div class="rule"></div>
    <p class="flavor">${won
      ? 'You come back up the stair with the dust of Grimhold on you, and Mentor is waiting.'
      : (why || 'Grimhold closes over you.')}</p>
    <div class="row"><div class="ic">◈</div><div class="tx"><b>Plunder carried out</b><s>Coin found in the dark</s></div><div style="color:#f3d488">${won?pot:Math.floor(pot/2)}</div></div>
    ${won?`<div class="row"><div class="ic">🏅</div><div class="tx"><b>Quest reward</b><s>Paid by the Empire</s></div><div style="color:#f3d488">${bonus}</div></div>`:''}
    <div class="row"><div class="ic">☠</div><div class="tx"><b>Heroes lost</b><s>They are back on their feet by morning — mostly</s></div><div>${dead}</div></div>
    <div class="rule"></div>
    <div class="goldline">Treasury: ◈ ${G.camp.gold}</div>
    <div style="text-align:center">
      <button class="btn big" id="mNext">${won ? 'To the Armoury' : 'Try Again'}</button>
      <button class="btn ghost" id="mMap">Quest Board</button>
    </div>`);
  bindModal('#mNext', () => { closeModal(); if (won) showArmoury(); else showQuestScroll(G.q.qi, () => launchQuest(G.q.qi)); });
  bindModal('#mMap', () => { closeModal(); showQuestSelect(); });
  if (!HEADLESS) $('hud').classList.remove('on');
}

let shopTab = 'weapon', shopHero = 0;
function showArmoury(){
  const h = G.camp.heroes[shopHero];
  const tabs = [['weapon','Weapons'],['armour','Armour'],['gear','Gear']];
  let rows = '';
  const own = (k) => h.weapon === k || h.armour === k || h.gear[k] || (h.items[k] > 0);
  if (shopTab === 'weapon'){
    for (const k in WEAPONS){
      const w = WEAPONS[k];
      if (w.quest || k === 'fists') continue;
      const has = h.weapon === k;
      const cant = h.id === 'wizard' && w.dice > 1;
      rows += shopRow(k, w.ic, w.name, `${w.dice} attack ${w.dice===1?'die':'dice'} · ${w.desc}`, w.cost, has, cant ? 'The wizard cannot wield it' : '');
    }
  } else if (shopTab === 'armour'){
    for (const k in ARMOURS){
      const a = ARMOURS[k];
      const cant = h.id === 'wizard';
      rows += shopRow(k, a.ic, a.name, a.desc, a.cost, h.armour === k, cant ? 'The wizard wears only robes' : '');
    }
  } else {
    for (const k in GEAR){
      const g = GEAR[k];
      const stack = g.stack;
      const has = stack ? false : !!h.gear[k];
      const cant = (k === 'shield' && WEAPONS[h.weapon] && WEAPONS[h.weapon].twoH) ? 'Both hands are busy' : '';
      rows += shopRow(k, g.ic, g.name + (stack && h.items[k] ? ` ×${h.items[k]}` : ''), g.desc, g.cost, has, cant);
    }
  }
  modal(`
    <h2>The Armoury</h2>
    <div class="goldline">◈ ${G.camp.gold}</div>
    <div class="tabs">${G.camp.heroes.map((x,i) =>
      `<button class="tab ${i===shopHero?'on':''}" data-h="${i}">${x.name}</button>`).join('')}</div>
    <div class="tabs">${tabs.map(([k,n]) =>
      `<button class="tab ${k===shopTab?'on':''}" data-t="${k}">${n}</button>`).join('')}</div>
    <div class="rule"></div>
    <div class="row" style="border-bottom:1px solid rgba(216,168,60,.2)">
      <div class="ic">${WEAPONS[h.weapon].ic}</div>
      <div class="tx"><b>${h.name} — ${h.title}</b>
      <s>${h.bpMax} Body · ${h.mpMax} Mind · ${attackDice(h)} attack · ${defendDice(h)} defend</s></div>
    </div>
    ${rows}
    <div class="rule"></div>
    <div style="text-align:center">
      <button class="btn big" id="mGo">To the Quest Board</button>
    </div>`);
  bindAll('.tab[data-h]', el => { shopHero = +el.dataset.h; showArmoury(); });
  bindAll('.tab[data-t]', el => { shopTab = el.dataset.t; showArmoury(); });
  bindAll('.bu[data-buy]', el => { buy(el.dataset.buy); showArmoury(); });
  bindModal('#mGo', () => { closeModal(); showQuestSelect(); });
}
function shopRow(k, ic, name, desc, cost, owned, cant){
  const afford = G.camp.gold >= cost;
  const label = owned ? 'Equipped' : cant ? '—' : `◈ ${cost}`;
  return `<div class="row"><div class="ic">${ic}</div>
    <div class="tx"><b>${name}</b><s>${cant || desc}</s></div>
    <button class="bu ${owned?'own':''}" data-buy="${k}"
      ${(owned||cant||!afford)?'disabled':''}>${label}</button></div>`;
}
function buy(k){
  const h = G.camp.heroes[shopHero];
  let cost = 0, kind = null;
  if (WEAPONS[k]){ cost = WEAPONS[k].cost; kind = 'w'; }
  else if (ARMOURS[k]){ cost = ARMOURS[k].cost; kind = 'a'; }
  else if (GEAR[k]){ cost = GEAR[k].cost; kind = 'g'; }
  if (!kind || G.camp.gold < cost) return false;
  if (kind === 'w'){
    if (h.id === 'wizard' && WEAPONS[k].dice > 1) return false;
    h.weapon = k;
    if (WEAPONS[k].twoH) h.gear.shield = false;
  } else if (kind === 'a'){
    if (h.id === 'wizard') return false;
    h.armour = k;
  } else {
    if (k === 'shield' && WEAPONS[h.weapon].twoH) return false;
    if (GEAR[k].stack) h.items[k] = (h.items[k]||0) + 1;
    else h.gear[k] = true;
  }
  G.camp.gold -= cost;
  sfx('gold');
  saveCampaign();
  return true;
}

/* ------------------------------------------------------------- 12. INPUT */

let ptrs = new Map(), dragged = false, downT = 0, pinchD = 0, pinchZ = 1;

function bindInput(){
  if (HEADLESS) return;
  const el = cv;
  el.addEventListener('pointerdown', e => {
    audioInit();
    el.setPointerCapture(e.pointerId);
    ptrs.set(e.pointerId, { x:e.clientX, y:e.clientY, ox:e.clientX, oy:e.clientY });
    if (ptrs.size === 1){ dragged = false; downT = performance.now(); }
    if (ptrs.size === 2){
      const [a,b] = [...ptrs.values()];
      pinchD = Math.hypot(a.x-b.x, a.y-b.y); pinchZ = G.cam.z;
    }
  });
  el.addEventListener('pointermove', e => {
    const p = ptrs.get(e.pointerId);
    if (!p) return;
    const dx = e.clientX - p.x, dy = e.clientY - p.y;
    p.x = e.clientX; p.y = e.clientY;
    if (Math.hypot(e.clientX - p.ox, e.clientY - p.oy) > 9) dragged = true;
    if (!G || !G.q) return;
    if (ptrs.size === 2){
      const [a,b] = [...ptrs.values()];
      const d = Math.hypot(a.x-b.x, a.y-b.y);
      if (pinchD > 0) G.cam.z = clamp(pinchZ * d/pinchD, .34, 2.2);
      G.cam.tx = G.cam.ty = null;
      clampCam();
    } else if (dragged){
      G.cam.x -= dx/G.cam.z; G.cam.y -= dy/G.cam.z;
      G.cam.tx = G.cam.ty = null;
      clampCam();
    }
  });
  const up = e => {
    const p = ptrs.get(e.pointerId);
    ptrs.delete(e.pointerId);
    if (!p) return;
    if (ptrs.size === 0 && !dragged && performance.now() - downT < 500) onTap(e.clientX, e.clientY);
    if (ptrs.size < 2) pinchD = 0;
  };
  el.addEventListener('pointerup', up);
  el.addEventListener('pointercancel', e => { ptrs.delete(e.pointerId); pinchD = 0; });
  el.addEventListener('wheel', e => {
    if (!G || !G.q) return;
    e.preventDefault();
    G.cam.z = clamp(G.cam.z * (e.deltaY > 0 ? .9 : 1.11), .34, 2.2);
    clampCam();
  }, { passive:false });

  $('btnDescend').addEventListener('click', () => { audioInit(); $('scTitle').classList.remove('on'); showDescentSetup(); });
  $('btnPlay').addEventListener('click', () => { audioInit(); $('scTitle').classList.remove('on'); showQuestSelect(); });
  $('btnContinue').addEventListener('click', () => { audioInit(); resumeRun(); });
  $('btnHow').addEventListener('click', () => { audioInit(); $('scTitle').classList.remove('on'); showHow(); });
  $('menubtn').addEventListener('click', openMenu);
  $('qname').addEventListener('click', () => { if (!modalOpen && G && G.q) showCarried(); });
  $('scModal').addEventListener('click', e => { if (e.target.id === 'scModal' && modalOpen) { /* stay put */ } });
}

function onTap(sx, sy){
  if (!G || !G.q || modalOpen) return;
  if (G.dice){
    const b = G.dice.btn;
    if (b && sx >= b.x && sx <= b.x + b.w && sy >= b.y && sy <= b.y + b.h){
      spendReroll();
      return;
    }
    if (G.dice.t < G.dice.settleAt){
      // still tumbling — slam them down rather than waiting the animation out
      G.dice.t = G.dice.settleAt;
      for (const it of G.dice.items) it.settle = Math.min(it.settle, G.dice.t - 40);
      if (!G.dice.hold && G.dice.timer) G.dice.timer.t = Math.min(G.dice.timer.t, 520);
      sfx('block');
      return;
    }
    resolveDice();                       // landed, and the player has read it
    return;
  }
  if (G.q.over) return;
  const [x,y] = tileOf(sx, sy);
  tapTile(x, y);
}

function tapTile(x, y){
  const h = activeHero();
  if (!h || G.q.phase !== 'hero' || busy()) return false;
  if (!inB(x,y)) return false;
  const target = actorAt(x,y);

  // aiming a spell or a vial
  if (G.aim){
    const a = G.aim;
    if (a.kind === 'holy'){
      if (target && target.kind === 'monster' && MONSTERS[target.mt].undead && tileVisible(x,y)){
        G.aim = null; useHolyWater(target); return true;
      }
      G.aim = null; say('Not a target for holy water.', 'bad'); renderHUD(); return false;
    }
    const sp = SPELLS[a.key];
    if (sp.target === 'enemy' && target && target.kind === 'monster' && target.alive
        && tileVisible(x,y) && hasLOS(h.x,h.y,x,y)){
      G.aim = null; castSpell(h, a.key, target); return true;
    }
    if (sp.target === 'hero' && target && target.kind === 'hero' && target.alive){
      G.aim = null; castSpell(h, a.key, target); return true;
    }
    if (sp.target === 'tile' && tileSeen(x,y) && !blocked(x,y) && dist2(x,y,h.x,h.y) <= 5){
      G.aim = null; castSpell(h, a.key, { tile:[x,y] }); return true;
    }
    G.aim = null; say('Nothing there to aim at.', 'bad'); renderHUD();
    return false;
  }

  // free the prisoner
  if (target && target.kind === 'npc' && dist2(x,y,h.x,h.y) <= 1 && linked(h.x,h.y,x,y)){
    if (!target.follow){
      target.follow = h.id; G.q.npcFreed = true; G.q.carrier = h.id;
      sfx('gold');
      say(`${target.name} is free — get them to the stair.`, 'good');
      spark(x, y, 18, '#f3d488', { spd:.014, up:.004 });
      checkQuestState(); renderHUD();
    }
    return true;
  }

  // strike, or close the distance and strike
  if (target && target.kind === 'monster' && target.alive && tileVisible(x,y)){
    const block = strikeBlocker(h, target);
    if (!block) return doAttack(h, target);
    // only distance is worth walking off; everything else is a flat refusal
    if (block !== 'range'){ say(strikeReason(h, target, block), 'bad'); return false; }
    if (h.moveLeft <= 0){
      say(h.rolled
        ? `The ${target.name} is out of reach, and ${h.name} has no movement left.`
        : `The ${target.name} is out of reach.`, 'bad');
      return false;
    }
    const f = G.q.field;
    let bestT = null, bestC = 1e9;
    for (const [dx,dy] of DIRS){
      const k = idx(target.x+dx, target.y+dy);
      if (!inB(target.x+dx, target.y+dy) || !f.d.has(k)) continue;
      if (!linked(target.x+dx, target.y+dy, target.x, target.y)) continue;
      const c = f.d.get(k);
      if (c < bestC){ bestC = c; bestT = [target.x+dx, target.y+dy]; }
    }
    if (!bestT){ say(`There is no way through to the ${target.name} from here.`, 'bad'); return false; }
    const path = tracePath(f, bestT[0], bestT[1]);
    heroWalk(h, path || [], () => { if (canStrike(h, target)) doAttack(h, target); });
    return true;
  }

  // a door next to us
  const near = dist2(x,y,h.x,h.y) === 1;
  if (near){
    const d = doorBetween(h.x, h.y, x, y);
    if (d && !d.open){ openDoorAt(h, d); renderHUD(); return true; }
  }

  // walk
  if (h.moveLeft <= 0){ say(h.rolled ? 'No movement left this turn.' : '', 'bad'); return false; }
  const f = G.q.field;
  if (f && f.d.has(idx(x,y)) && f.d.get(idx(x,y)) > 0){
    heroWalk(h, tracePath(f, x, y) || []);
    return true;
  }
  // walking toward a closed door: route to it, and open it when we arrive
  const open = walkFieldOpen(h.x, h.y, h.moveLeft + 1, h);
  if (open.d.has(idx(x,y))){
    const path = tracePath(open, x, y);
    if (path && path.length){ heroWalk(h, path); return true; }
  }
  return false;
}
function walkFieldOpen(sx, sy, maxSteps, mover){
  const d = new Map(), from = new Map();
  d.set(idx(sx,sy), 0);
  let frontier = [[sx,sy]];
  while (frontier.length){
    const next = [];
    for (const [x,y] of frontier){
      const cost = d.get(idx(x,y));
      if (cost >= maxSteps) continue;
      for (const [dx,dy] of DIRS){
        const nx = x+dx, ny = y+dy, ni = idx(nx,ny);
        if (!inB(nx,ny) || d.has(ni)) continue;
        if (!linkedIgnoringDoors(x,y,nx,ny)) continue;
        const dr = doorAt(x,y,nx,ny);
        if (dr && dr.secret && !dr.found) continue;
        if (!dr && TR[idx(x,y)] !== TR[ni]) continue;
        if (furnAt(nx,ny) || trapBlocks(nx,ny)) continue;
        if (!bodyPassable(mover, actorAt(nx,ny))) continue;
        d.set(ni, cost+1); from.set(ni, idx(x,y));
        next.push([nx,ny]);
      }
    }
    frontier = next;
  }
  return { d, from };
}
