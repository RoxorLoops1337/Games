    g.fillStyle = '#4a3524';
    rr(g, -w*.42, -h*.28, w*.84, h*.56, 5); g.fill();
    g.fillStyle = '#6b4d33'; rr(g, -w*.40, -h*.30, w*.80, h*.52, 5); g.fill();
    g.strokeStyle = 'rgba(0,0,0,.3)'; g.lineWidth = 1.5;
    for (let i=1;i<4;i++){ g.beginPath(); g.moveTo(-w*.40 + i*w*.20, -h*.30); g.lineTo(-w*.40 + i*w*.20, h*.22); g.stroke(); }
    g.fillStyle = 'rgba(255,220,170,.10)'; rr(g, -w*.38, -h*.28, w*.76, h*.10, 3); g.fill();
  } else if (F==='chest'){
    // With mimics on the floor, "have I been to that one" is load-bearing. A
    // shut chest keeps its lid and its glint; an opened one is unmistakably
    // open — lid thrown back, nothing inside, no gold left on it.
    g.fillStyle = '#59401f';
    rr(g, -w*.34, -h*.20, w*.68, h*.44, 4); g.fill();
    if (f.taken){
      g.fillStyle = '#160f06';                          // the empty inside
      rr(g, -w*.30, -h*.18, w*.60, h*.30, 3); g.fill();
      g.fillStyle = 'rgba(0,0,0,.55)';
      rr(g, -w*.26, -h*.15, w*.52, h*.16, 2); g.fill();
      g.save();                                          // the lid, tipped back
      g.translate(0, -h*.24); g.rotate(-.42);
      g.fillStyle = '#6b4c26'; rr(g, -w*.32, -h*.20, w*.64, h*.20, 5); g.fill();
      g.fillStyle = '#4a3318'; g.fillRect(-w*.32, -h*.06, w*.64, h*.05);
      g.restore();
      g.fillStyle = 'rgba(0,0,0,.45)';                   // shadow it casts back
      rr(g, -w*.34, h*.16, w*.68, h*.08, 3); g.fill();
    } else {
      g.fillStyle = '#7a5a2c'; rr(g, -w*.34, -h*.30, w*.68, h*.24, 7); g.fill();
      g.fillStyle = '#c8a24a'; g.fillRect(-w*.34, -h*.10, w*.68, h*.07);
      g.fillStyle = '#d8b85a';
      g.beginPath(); g.arc(0, -h*.04, w*.07, 0, 6.284); g.fill();
      g.fillStyle = '#2a1c0c'; g.fillRect(-w*.02, -h*.05, w*.04, h*.09);
      const glint = .5 + Math.sin(t*.0022 + f.x*1.7 + f.y)*.5;   // it wants opening
      g.fillStyle = `rgba(255,240,196,${(.10 + glint*.16).toFixed(3)})`;
      g.fillRect(-w*.30, -h*.28, w*.24, 1.8);
    }
  } else if (F==='throne'){
    g.fillStyle = '#3a3238'; rr(g, -w*.30, -h*.44, w*.60, h*.74, 6); g.fill();
    g.fillStyle = '#4f4550'; rr(g, -w*.26, -h*.40, w*.52, h*.44, 5); g.fill();
    g.fillStyle = '#7a2a34'; rr(g, -w*.22, -h*.06, w*.44, h*.30, 4); g.fill();
    g.fillStyle = '#c8a24a';
    g.beginPath(); g.moveTo(0,-h*.52); g.lineTo(w*.08,-h*.40); g.lineTo(-w*.08,-h*.40); g.closePath(); g.fill();
  } else if (F==='bookcase'){
    g.fillStyle = '#3a2a1c'; rr(g, -w*.44, -h*.34, w*.88, h*.66, 3); g.fill();
    const cols = ['#7a2a2a','#2a4a6a','#4a6a2a','#6a5a2a','#5a2a5a'];
    for (let r=0;r<2;r++) for (let i=0;i<9;i++){
      const bh = h*.20 + (i%3)*h*.04;
      g.fillStyle = cols[(i+r)%cols.length];
      g.fillRect(-w*.40 + i*w*.088, -h*.28 + r*h*.32, w*.062, bh);
    }
    g.fillStyle = 'rgba(0,0,0,.4)'; g.fillRect(-w*.44, -h*.04, w*.88, 3);
  } else if (F==='rack'){
    g.fillStyle = '#3f2e1e';
    g.fillRect(-w*.30, -h*.36, w*.60, h*.10);
    g.fillRect(-w*.30, h*.20, w*.60, h*.10);
    for (let i=0;i<3;i++){
      const x = -w*.20 + i*w*.20;
      g.fillStyle = '#8a9298'; g.fillRect(x-w*.018, -h*.30, w*.036, h*.50);
      g.fillStyle = '#c8ccd2'; g.beginPath();
      g.moveTo(x, -h*.42); g.lineTo(x+w*.035,-h*.30); g.lineTo(x-w*.035,-h*.30); g.closePath(); g.fill();
    }
    if (f.taken){ g.fillStyle = 'rgba(0,0,0,.45)'; g.fillRect(-w*.34,-h*.44,w*.68,h*.80); }
  } else if (F==='alchemy'){
    g.fillStyle = '#3a3428'; rr(g, -w*.42, -h*.16, w*.84, h*.44, 4); g.fill();
    const cols = ['#6bd8a8','#d86b8a','#6b9ad8','#d8c86b'];
    for (let i=0;i<5;i++){
      const x = -w*.34 + i*w*.17;
      g.fillStyle = cols[i%4];
      g.beginPath(); g.arc(x, -h*.24, w*.045, 0, 6.284); g.fill();
      g.fillStyle = 'rgba(255,255,255,.28)'; g.fillRect(x-w*.012, -h*.36, w*.024, h*.10);
    }
    g.fillStyle = 'rgba(140,255,200,.10)';
    g.beginPath(); g.ellipse(0,-h*.30, w*.42, h*.22, 0,0,6.284); g.fill();
  } else if (F==='tomb'){
    const L = w*.44, D = h*.34;                    // a sarcophagus, lid and all
    g.fillStyle = '#38352d'; rr(g, -L, -D*.6, L*2, D*1.9, 4); g.fill();
    g.fillStyle = '#565044'; rr(g, -L*.97, -D*1.0, L*1.94, D*1.75, 5); g.fill();
    g.fillStyle = '#6b6455'; rr(g, -L*.92, -D*1.06, L*1.84, D*1.5, 5); g.fill();
    g.fillStyle = 'rgba(255,244,214,.10)';
    g.fillRect(-L*.92, -D*1.06, L*1.84, 2.5);
    g.fillStyle = 'rgba(0,0,0,.34)';               // the lid's seam
    g.fillRect(-L*.92, -D*.16, L*1.84, 2.5);
    g.strokeStyle = 'rgba(0,0,0,.30)'; g.lineWidth = 2;
    rr(g, -L*.74, -D*.90, L*1.48, D*1.14, 3); g.stroke();
    // the effigy carved on the lid: crossed arms over a sword
    g.fillStyle = 'rgba(0,0,0,.28)';
    g.beginPath(); g.arc(0, -D*.66, w*.055, 0, 6.284); g.fill();
    g.fillRect(-w*.012, -D*.56, w*.024, D*.72);
    g.fillRect(-w*.075, -D*.40, w*.15, w*.024);
    g.fillStyle = 'rgba(255,244,214,.07)';
    g.beginPath(); g.arc(-w*.012, -D*.68, w*.05, 0, 6.284); g.fill();
    if (f.taken){                                  // opened, and empty
      g.fillStyle = 'rgba(6,4,10,.82)';
      rr(g, -L*.80, -D*.94, L*1.6, D*1.3, 4); g.fill();
      g.fillStyle = 'rgba(150,150,160,.10)';
      rr(g, -L*.80, -D*.94, L*1.6, 4, 2); g.fill();
    }
  } else if (F==='fireplace'){
    g.fillStyle = '#2e2a26'; rr(g, -w*.44, -h*.40, w*.88, h*.74, 4); g.fill();
    g.fillStyle = '#120e0a'; rr(g, -w*.32, -h*.24, w*.64, h*.56, 5); g.fill();
    const fl = .6 + Math.sin(t*.008)*.4;
    g.fillStyle = `rgba(255,150,50,${.55*fl+.3})`;
    g.beginPath(); g.moveTo(-w*.16, h*.26);
    g.quadraticCurveTo(-w*.14,-h*.06, 0,-h*.20 - fl*h*.08);
    g.quadraticCurveTo(w*.14,-h*.06, w*.16, h*.26); g.closePath(); g.fill();
    g.fillStyle = `rgba(255,230,140,${.5*fl+.2})`;
    g.beginPath(); g.moveTo(-w*.07, h*.26);
    g.quadraticCurveTo(-w*.05,-h*.02, 0,-h*.10 - fl*h*.05);
    g.quadraticCurveTo(w*.05,-h*.02, w*.07, h*.26); g.closePath(); g.fill();
  } else if (F==='cupboard'){
    g.fillStyle = '#54401f'; rr(g, -w*.42, -h*.40, w*.84, h*.74, 3); g.fill();
    g.fillStyle = '#6b5228'; rr(g, -w*.38, -h*.36, w*.36, h*.66, 3); g.fill();
    rr(g, w*.02, -h*.36, w*.36, h*.66, 3); g.fill();
    g.fillStyle = '#c8a24a';
    g.beginPath(); g.arc(-w*.05, 0, w*.02, 0, 6.284); g.fill();
    g.beginPath(); g.arc( w*.05, 0, w*.02, 0, 6.284); g.fill();
  } else if (F==='altar'){
    g.fillStyle = '#3e3a44'; rr(g, -w*.40, -h*.20, w*.80, h*.50, 3); g.fill();
    g.fillStyle = '#4e4a58'; rr(g, -w*.44, -h*.30, w*.88, h*.18, 3); g.fill();
    g.fillStyle = 'rgba(160,60,60,.5)';
    g.beginPath(); g.ellipse(0,-h*.22, w*.16, h*.06, 0,0,6.284); g.fill();
    const pulse = .5 + Math.sin(t*.003)*.5;
    g.fillStyle = `rgba(200,90,255,${.2 + pulse*.25})`;
    g.beginPath(); g.arc(0,-h*.34, w*.09, 0, 6.284); g.fill();
  } else if (F==='sorcerer'){
    g.fillStyle = '#2e2838'; rr(g, -w*.42, -h*.22, w*.84, h*.50, 4); g.fill();
    g.fillStyle = '#3e3650'; rr(g, -w*.40, -h*.28, w*.80, h*.44, 4); g.fill();
    const pulse = .5 + Math.sin(t*.004)*.5;
    g.fillStyle = `rgba(150,110,240,${.25 + pulse*.35})`;
    g.beginPath(); g.arc(-w*.16,-h*.22, w*.075, 0, 6.284); g.fill();
    g.fillStyle = '#c8b88a';
    g.fillRect(w*.02, -h*.28, w*.24, h*.16);
    g.strokeStyle = 'rgba(0,0,0,.4)'; g.lineWidth = 1;
    g.beginPath(); g.moveTo(w*.14,-h*.28); g.lineTo(w*.14,-h*.12); g.stroke();
  } else if (F==='plinth'){
    // A trial's terms are cut into the lintel; the reason to accept them stands
    // in the middle of the room, lit, where you can see it from the doorway.
    g.fillStyle = '#3a3630'; rr(g, -w*.22, -h*.02, w*.44, h*.34, 2); g.fill();
    g.fillStyle = '#4c4740'; rr(g, -w*.28, -h*.10, w*.56, h*.12, 2); g.fill();
    g.fillStyle = '#565048'; rr(g, -w*.26, h*.26, w*.52, h*.10, 2); g.fill();
    if (f.spent){
      g.fillStyle = 'rgba(0,0,0,.45)'; rr(g, -w*.28, -h*.12, w*.56, h*.14, 2); g.fill();
    } else {
      const pulse = .5 + Math.sin(t*.0026)*.5;
      const lift = -h*.30 - pulse*h*.05;
      g.fillStyle = `rgba(216,168,60,${.10 + pulse*.10})`;   // the light it throws
      g.beginPath(); g.ellipse(0, lift, w*.30, h*.22, 0, 0, 6.284); g.fill();
      // and the thing it is actually paying, floating over it
      drawRelicOn(g, f.relic, w*.13, lift, pulse);
    }
  } else if (F==='coffin'){
    // A tomb somebody has been using as a bank. The lid is off-centre because
    // it has been lifted before, and the coins on it are the argument.
    const L = w*.44, D = h*.34;
    g.fillStyle = '#2f2a22'; rr(g, -L, -D*.6, L*2, D*1.9, 4); g.fill();
    g.fillStyle = '#4a4034'; rr(g, -L*.97, -D*1.0, L*1.94, D*1.75, 5); g.fill();
    g.fillStyle = f.done ? '#3a332a' : '#5e5240';
    rr(g, -L*.88, -D*1.06, L*1.84, D*1.5, 5); g.fill();
    g.fillStyle = 'rgba(0,0,0,.55)';                 // the gap the lid leaves
    g.fillRect(-L*.88, -D*1.06, L*.16, D*1.5);
    if (f.done){
      g.fillStyle = 'rgba(0,0,0,.45)'; rr(g, -L*.88, -D*1.06, L*1.84, D*1.5, 5); g.fill();
    } else {
      const q = .5 + Math.sin(t*.0024 + f.x)*.5;
      g.fillStyle = `rgba(216,168,60,${(.55 + q*.35).toFixed(3)})`;   // the takings on the lid
      for (let i = 0; i < 3; i++){
        g.beginPath();
        g.ellipse(-L*.30 + i*L*.34, -D*.50, w*.035, w*.024, 0, 0, 6.284); g.fill();
      }
      g.fillStyle = `rgba(255,236,180,${(.20 + q*.25).toFixed(3)})`;
      g.fillRect(-L*.84, -D*1.02, L*1.76, 2);
    }
  } else if (F==='cage'){
    g.fillStyle = 'rgba(10,8,6,.75)'; rr(g, -w*.36, -h*.40, w*.72, h*.74, 3); g.fill();
    g.strokeStyle = '#6a6258'; g.lineWidth = Math.max(2, w*.035);
    for (let i=0;i<5;i++){
      const x = -w*.30 + i*w*.15;
      g.beginPath(); g.moveTo(x,-h*.40); g.lineTo(x, h*.32); g.stroke();
    }
    g.beginPath(); g.moveTo(-w*.36,-h*.38); g.lineTo(w*.36,-h*.38); g.stroke();
    g.beginPath(); g.moveTo(-w*.36, h*.30); g.lineTo(w*.36, h*.30); g.stroke();
  }
  // The chest has its own opened art. Everything else you can ransack gets the
  // same "somebody has been through this" read: the inside is a dark hole now,
  // and what was in it is on the floor at its feet.
  if (f.searched && F !== 'chest' && FURN[F] && FURN[F].search) drawRansacked(g, w, h, f);
  g.restore();
}
function drawRansacked(g, w, h, f){
  g.fillStyle = 'rgba(6,5,4,.66)';                 // emptied out
  rr(g, -w*.30, -h*.24, w*.60, h*.32, 3); g.fill();
  g.fillStyle = 'rgba(0,0,0,.42)';
  rr(g, -w*.26, -h*.20, w*.52, h*.16, 2); g.fill();
  // and the leavings, deterministic per square so they do not crawl about
  const j = (n) => ((Math.sin((f.x*7.13 + f.y*3.71 + n*1.97)) + 1) % 1);
  g.fillStyle = 'rgba(150,132,100,.55)';
  for (let i = 0; i < 3; i++){
    const x = -w*.30 + j(i)*w*.60, y = h*.16 + j(i+9)*h*.14;
    g.fillRect(x, y, w*.10, h*.045);
  }
  g.fillStyle = 'rgba(210,196,166,.30)';
  g.fillRect(-w*.16 + j(4)*w*.30, h*.24, w*.13, h*.035);
}

// What is left where a hero fell. It stays on the square for the rest of the
// floor: a helm on its side, a blade planted, and a stain that does not fade.
function drawBody(g, b, t){
  // the stain spreads over the first moments rather than appearing all at once
  b.t = (b.t || 0) + 1;
  const settle = Math.min(1, b.t/26);
  const px = (b.x + .5)*TS, py = (b.y + .5)*TS;
  g.save(); g.translate(px, py);
  g.fillStyle = `rgba(90,20,14,${(.34*settle).toFixed(3)})`;
  g.beginPath(); g.ellipse(0, TS*.10, TS*.34*settle, TS*.19*settle, 0, 0, 6.284); g.fill();
  g.fillStyle = `rgba(122,31,20,${(.24*settle).toFixed(3)})`;
  g.beginPath(); g.ellipse(-TS*.14, TS*.16, TS*.15*settle, TS*.08*settle, 0, 0, 6.284); g.fill();
  // the blade, planted where they went down
  g.strokeStyle = '#8b8578'; g.lineWidth = Math.max(2, TS*.045); g.lineCap = 'round';
  g.beginPath(); g.moveTo(TS*.14, TS*.12); g.lineTo(TS*.05, -TS*.26); g.stroke();
  g.strokeStyle = '#4a3a24'; g.lineWidth = Math.max(2, TS*.05);
  g.beginPath(); g.moveTo(TS*.16, TS*.16); g.lineTo(TS*.13, TS*.06); g.stroke();
  // the helm, on its side
  g.fillStyle = '#6f6a60';
  g.beginPath(); g.arc(-TS*.12, TS*.02, TS*.115, Math.PI*1.05, Math.PI*2.1); g.fill();
  g.fillStyle = '#514c45';
  g.fillRect(-TS*.235, TS*.00, TS*.235, TS*.045);
  g.fillStyle = 'rgba(0,0,0,.55)';
  g.beginPath(); g.ellipse(-TS*.12, TS*.005, TS*.055, TS*.028, 0, 0, 6.284); g.fill();
  // Something is pulling at them. This one gets the hot fast treatment, because
  // for once the thing on the floor is about to become dangerous.
  if (b.stirring > 0 && !b.risen && !b.laid){
    const q = .5 + Math.sin(t*.006)*.5;
    g.strokeStyle = `rgba(150,90,200,${(.35 + q*.45).toFixed(3)})`;
    g.lineWidth = 2.4;
    g.beginPath(); g.ellipse(0, TS*.08, TS*.36, TS*.20, 0, 0, 6.284); g.stroke();
    g.fillStyle = `rgba(190,130,240,${(.45 + q*.45).toFixed(3)})`;
    g.font = `${TS*.30}px Georgia,serif`; g.textAlign = 'center'; g.textBaseline = 'middle';
    g.fillText(String(b.stirring), 0, -TS*.30 - q*2);
  }
  g.restore();
}

// The plinth used to hold a gem that meant "a reward". It holds the actual
// relic now, so accepting the terms is a decision about a specific object you
// can see from the doorway rather than about a reward in the abstract.
function drawRelicOn(g, id, s, y, pulse){
  const lit = `rgba(243,212,136,${(.75 + pulse*.25).toFixed(3)})`;
  const dim = `rgba(196,164,96,${(.55 + pulse*.25).toFixed(3)})`;
  const hot = `rgba(255,246,214,${(.5 + pulse*.5).toFixed(3)})`;
  g.save(); g.translate(0, y);
  switch (id){
    case 'skull':
      g.fillStyle = lit;
      g.beginPath(); g.arc(0, -s*.12, s*.62, 0, 6.284); g.fill();
      g.fillRect(-s*.34, s*.30, s*.68, s*.30);
      g.fillStyle = 'rgba(30,20,10,.85)';
      g.beginPath(); g.arc(-s*.24, -s*.14, s*.17, 0, 6.284); g.fill();
      g.beginPath(); g.arc( s*.24, -s*.14, s*.17, 0, 6.284); g.fill();
      break;
    case 'lantern':
      g.fillStyle = dim; g.fillRect(-s*.42, -s*.50, s*.84, s*.16);
      g.fillStyle = lit; g.fillRect(-s*.34, -s*.34, s*.68, s*.76);
      g.fillStyle = hot;
      g.beginPath(); g.ellipse(0, s*.02, s*.20, s*.30, 0, 0, 6.284); g.fill();
      g.fillStyle = dim; g.fillRect(-s*.42, s*.42, s*.84, s*.16);
      break;
    case 'ring':
      g.strokeStyle = lit; g.lineWidth = s*.26;
      g.beginPath(); g.arc(0, s*.06, s*.44, 0, 6.284); g.stroke();
      g.fillStyle = hot;
      g.beginPath(); g.arc(0, -s*.48, s*.20, 0, 6.284); g.fill();
      break;
    case 'coin':
      g.fillStyle = lit;
      g.beginPath(); g.ellipse(0, 0, s*.40, s*.60, 0, 0, 6.284); g.fill();
      g.fillStyle = 'rgba(60,42,16,.65)';
      g.beginPath(); g.ellipse(0, 0, s*.18, s*.34, 0, 0, 6.284); g.fill();
      break;
    case 'horn':
      g.fillStyle = lit;
      g.beginPath();
      g.moveTo(-s*.62, s*.34); g.quadraticCurveTo(s*.10, s*.34, s*.56, -s*.34);
      g.quadraticCurveTo(s*.20, s*.02, -s*.58, s*.62); g.closePath(); g.fill();
      g.fillStyle = hot; g.fillRect(s*.34, -s*.42, s*.24, s*.16);
      break;
    case 'mirror':
      g.fillStyle = dim;
      g.beginPath(); g.ellipse(0, -s*.10, s*.44, s*.56, 0, 0, 6.284); g.fill();
      g.fillStyle = 'rgba(24,16,30,.88)';
      g.beginPath(); g.ellipse(0, -s*.10, s*.32, s*.44, 0, 0, 6.284); g.fill();
      g.fillStyle = lit; g.fillRect(-s*.12, s*.42, s*.24, s*.34);
      break;
    case 'anvil':
      g.fillStyle = lit;
      g.fillRect(-s*.58, -s*.42, s*1.16, s*.28);
      g.fillRect(-s*.22, -s*.14, s*.44, s*.36);
      g.fillRect(-s*.46, s*.22, s*.92, s*.24);
      break;
    case 'thread':
      g.strokeStyle = lit; g.lineWidth = s*.16; g.lineCap = 'round';
      g.beginPath();
      g.moveTo(-s*.56, -s*.44);
      g.quadraticCurveTo(s*.50, -s*.10, -s*.42, s*.24);
      g.quadraticCurveTo(-s*.10, s*.62, s*.54, s*.50);
      g.stroke();
      break;
    default:                                    // a trial with nothing left to pay
      g.fillStyle = lit;
      g.beginPath();
      g.moveTo(0, -s); g.lineTo(s*.76, 0); g.lineTo(0, s); g.lineTo(-s*.76, 0);
      g.closePath(); g.fill();
      g.fillStyle = hot;
      g.beginPath(); g.arc(0, 0, s*.26, 0, 6.284); g.fill();
  }
  g.restore();
}

/* --------------------------------------------------- doors, traps, markers */

function doorMid(d){ return [ (d.rx + d.cx)/2 + .5, (d.ry + d.cy)/2 + .5 ]; }

function drawDoor(g, d, t){
  if (d.secret && !d.found) return;
  const [mx,my] = doorMid(d);
  const vert = d.rx !== d.cx;                       // door leaf runs north–south
  const px = mx*TS, py = my*TS;
  g.save(); g.translate(px, py);
  if (vert) g.rotate(Math.PI/2);
  const w = TS*.92, h = TS*.30;
  if (d.open){
    g.fillStyle = 'rgba(9,7,6,.78)';                // shadowed threshold
    g.fillRect(-w/2, -h/2, w, h);
    g.fillStyle = '#57493a';                        // jambs, still standing
    g.fillRect(-w/2 - 2, -h/2 - 2, w*.13, h + 4);
    g.fillRect( w/2 - w*.13 + 2, -h/2 - 2, w*.13, h + 4);
    g.fillStyle = 'rgba(255,238,208,.18)';
    g.fillRect(-w/2 - 2, -h/2 - 2, w*.13, 2);
    g.fillRect( w/2 - w*.13 + 2, -h/2 - 2, w*.13, 2);
    g.save();                                        // the leaf, folded back flat
    g.translate(-w*.40, -h*.10); g.rotate(-1.42);
    g.fillStyle = '#3f2b1a'; g.fillRect(0, -h*.30, w*.46, h*.60);
    g.fillStyle = '#57381f'; g.fillRect(0, -h*.30, w*.46, h*.28);
    g.fillStyle = 'rgba(0,0,0,.35)';
    g.fillRect(w*.14, -h*.30, w*.03, h*.60);
    g.fillRect(w*.30, -h*.30, w*.03, h*.60);
    g.restore();
    g.fillStyle = 'rgba(0,0,0,.55)';                 // dark lintel shadow
    g.fillRect(-w/2, -h/2, w, h*.22);
  } else {
    g.fillStyle = '#2a2018';
    g.fillRect(-w/2 - 2, -h/2 - 2, w + 4, h + 4);
    const grd = g.createLinearGradient(0, -h/2, 0, h/2);
    grd.addColorStop(0,'#6b4b2e'); grd.addColorStop(.5,'#4e3520'); grd.addColorStop(1,'#33220f');
    g.fillStyle = grd; g.fillRect(-w/2, -h/2, w, h);
    g.fillStyle = 'rgba(0,0,0,.32)';
    for (let i=1;i<5;i++) g.fillRect(-w/2 + i*w/5, -h/2, 1.6, h);
    g.fillStyle = '#4a4750';                        // iron bands
    g.fillRect(-w/2, -h*.34, w, h*.13);
    g.fillRect(-w/2,  h*.20, w, h*.13);
    g.fillStyle = 'rgba(190,190,205,.30)';
    g.fillRect(-w/2, -h*.34, w, 1.2); g.fillRect(-w/2, h*.20, w, 1.2);
    g.fillStyle = '#2b2830';                        // rivets
    for (let i=0;i<5;i++){
      g.beginPath(); g.arc(-w*.38 + i*w*.19, -h*.275, h*.045, 0, 6.284); g.fill();
      g.beginPath(); g.arc(-w*.38 + i*w*.19,  h*.265, h*.045, 0, 6.284); g.fill();
    }
    g.fillStyle = '#c8a24a';                        // ring handle
    g.beginPath(); g.arc(w*.30, 0, h*.16, 0, 6.284); g.fill();
    g.fillStyle = '#33220f';
    g.beginPath(); g.arc(w*.30, 0, h*.09, 0, 6.284); g.fill();
    if (d.secret){
      g.fillStyle = `rgba(200,150,255,${.25 + Math.sin(t*.004)*.15})`;
      g.beginPath(); g.arc(-w*.28, 0, h*.16, 0, 6.284); g.fill();
    }
    // Nobody has been through this one. Pale and cold, and slow — it is an
    // invitation, not a warning, and the warnings on this board are hot and fast.
    if (roomUnopened(d.rid) && !d.trialBolt){
      const q = .5 + Math.sin(t*.0018)*.5;
      g.strokeStyle = `rgba(150,200,235,${(.16 + q*.26).toFixed(3)})`;
      g.lineWidth = 2;
      rr(g, -w/2 - 1, -h/2 - 1, w + 2, h + 2, 3); g.stroke();
      g.fillStyle = `rgba(180,220,245,${(.10 + q*.16).toFixed(3)})`;
      g.fillRect(-w/2, -h*.06, w, h*.12);
    }
    // A trial's bolt is not a lock — no key fits it, and it costs a Body Point
    // to shift. It gets a bar across the whole door so the cost is never a
    // surprise: you can see what you are about to put a shoulder through.
    if (d.trialBolt){
      const pulse = .5 + Math.sin(t*.0035)*.5;
      g.fillStyle = '#2b2126';                              // brackets
      g.fillRect(-w*.44, -h*.16, w*.10, h*.34);
      g.fillRect( w*.34, -h*.16, w*.10, h*.34);
      const bar = g.createLinearGradient(0, -h*.10, 0, h*.14);
      bar.addColorStop(0, '#7a6a6a'); bar.addColorStop(.5, '#4a3c3c'); bar.addColorStop(1, '#2e2424');
      g.fillStyle = bar;
      g.fillRect(-w*.46, -h*.08, w*.92, h*.20);             // the bar itself
      g.fillStyle = 'rgba(224,150,130,.35)';
      g.fillRect(-w*.46, -h*.08, w*.92, 1.6);
      g.fillStyle = '#241b1b';                              // bolt heads
      g.beginPath(); g.arc(-w*.34, h*.02, h*.055, 0, 6.284); g.fill();
      g.beginPath(); g.arc( w*.34, h*.02, h*.055, 0, 6.284); g.fill();
      g.strokeStyle = `rgba(176,58,44,${.30 + pulse*.30})`; // it is still angry
      g.lineWidth = 2;
      g.strokeRect(-w*.46, -h*.08, w*.92, h*.20);
    }
    else if (d.locked){
      const lit = G.q.key ? .9 : .45 + Math.sin(t*.004)*.2;
      g.fillStyle = `rgba(216,168,60,${lit})`;
      g.fillRect(-w*.34, -h*.20, w*.16, h*.40);
      g.fillStyle = 'rgba(20,16,10,.85)';
      g.beginPath(); g.arc(-w*.26, -h*.02, h*.09, 0, 6.284); g.fill();
      g.fillRect(-w*.29, -h*.02, w*.06, h*.16);
      g.strokeStyle = `rgba(216,168,60,${lit})`; g.lineWidth = 2.4;
      g.beginPath(); g.arc(-w*.26, -h*.20, h*.13, Math.PI, 0); g.stroke();
    }
  }
  g.restore();
}

function trapBlocks(x,y){
  for (const tr of G.q.traps) if (tr.x===x && tr.y===y && tr.t==='block' && tr.sprung) return true;
  return false;
}
function trapAt(x,y){
  for (const tr of G.q.traps) if (tr.x===x && tr.y===y && !tr.disarmed && !tr.sprung) return tr;
  return null;
}
function drawTrap(g, tr, t){
  if (!tr.found && !tr.sprung) return;
  const px = (tr.x+.5)*TS, py = (tr.y+.5)*TS;
  g.save(); g.translate(px, py);
  // A disarmed trap used to keep the live warning mark, pulsing away at
  // something that cannot hurt you any more. It goes grey and it stops moving —
  // stillness is the signal, because everything dangerous on this board pulses.
  if (tr.disarmed && !tr.sprung){
    g.strokeStyle = 'rgba(126,120,110,.55)'; g.lineWidth = 2;
    rr(g, -TS*.30, -TS*.30, TS*.60, TS*.60, 5); g.stroke();
    g.strokeStyle = 'rgba(150,144,132,.75)'; g.lineWidth = 3; g.lineCap = 'round';
    g.beginPath(); g.moveTo(-TS*.18, -TS*.18); g.lineTo(TS*.18, TS*.18); g.stroke();
    g.beginPath(); g.moveTo(TS*.18, -TS*.18); g.lineTo(-TS*.18, TS*.18); g.stroke();
    g.fillStyle = 'rgba(90,86,78,.40)';
    g.beginPath(); g.arc(0, 0, TS*.07, 0, 6.284); g.fill();
    g.restore();
    return;
  }
  if (tr.t === 'pit'){
    if (tr.sprung){
      g.fillStyle = '#040303';
      g.beginPath(); g.ellipse(0,0, TS*.40, TS*.36, 0, 0, 6.284); g.fill();
      g.strokeStyle = 'rgba(120,105,85,.5)'; g.lineWidth = 3;
      g.beginPath(); g.ellipse(0,0, TS*.40, TS*.36, 0, 0, 6.284); g.stroke();
      g.fillStyle = 'rgba(160,140,110,.25)';
      for (let i=0;i<7;i++){ const a = i/7*6.284;
        g.beginPath(); g.moveTo(Math.cos(a)*TS*.40, Math.sin(a)*TS*.36);
        g.lineTo(Math.cos(a+.3)*TS*.28, Math.sin(a+.3)*TS*.26);
        g.lineTo(Math.cos(a+.55)*TS*.40, Math.sin(a+.55)*TS*.36); g.closePath(); g.fill(); }
    } else { trapMark(g, '#e8b63c', t, 'pit'); }
  } else if (tr.t === 'spear'){
    if (tr.sprung){
      g.fillStyle = '#8a8f96';
      for (let i=0;i<4;i++){
        const a = i/4*6.284 + .4, r = TS*.26;
        g.save(); g.translate(Math.cos(a)*r*.5, Math.sin(a)*r*.5); g.rotate(a);
        g.beginPath(); g.moveTo(0,-TS*.05); g.lineTo(TS*.22,0); g.lineTo(0,TS*.05); g.closePath(); g.fill();
        g.restore();
      }
      g.fillStyle = 'rgba(120,20,14,.5)';
      g.beginPath(); g.arc(0,0, TS*.14, 0, 6.284); g.fill();
    } else { trapMark(g, '#e8b63c', t, 'spear'); }
  } else {
    if (tr.sprung){
      g.fillStyle = '#3a352e'; rr(g, -TS*.42, -TS*.40, TS*.84, TS*.80, 6); g.fill();
      g.fillStyle = '#4e483e'; rr(g, -TS*.38, -TS*.44, TS*.76, TS*.72, 6); g.fill();
      g.fillStyle = 'rgba(0,0,0,.4)';
      for (let i=0;i<3;i++) g.fillRect(-TS*.34, -TS*.30 + i*TS*.22, TS*.68, 2.5);
      g.fillStyle = 'rgba(220,200,170,.10)'; g.fillRect(-TS*.38,-TS*.44, TS*.76, 3);
    } else { trapMark(g, '#e8b63c', t, 'block'); }
  }
  g.restore();
}
function trapMark(g, col, t, kind){
  const p = .55 + Math.sin(t*.005)*.45;
  g.strokeStyle = `rgba(232,182,60,${.35 + p*.4})`; g.lineWidth = 2.4;
  g.setLineDash([6,5]); g.lineDashOffset = -t*.012;
  rr(g, -TS*.34, -TS*.34, TS*.68, TS*.68, 6); g.stroke();
  g.setLineDash([]);
  g.fillStyle = `rgba(232,182,60,${.55 + p*.35})`;
  g.font = `${TS*.34}px ${'Georgia,serif'}`; g.textAlign = 'center'; g.textBaseline = 'middle';
  g.fillText(kind==='pit' ? '⌷' : kind==='spear' ? '⁘' : '⬓', 0, 0);
}

/* --------------------------------------------------------- 6. RENDER LOOP */

let cv, ctx, cw = 0, ch = 0, DPR = 1;
let fogCan = null, fogCtx = null, fogImg = null, grainCan = null;
let TT0 = 0;                                        // ms since boot
const FOGQ = 2;                                     // fog texels per square
let fogTmp = null;                                  // per-square darkness, reused

function initCanvas(){
  if (HEADLESS){
    ctx = mkCan(800, 1400).getContext('2d');
    cw = 800; ch = 1400;
  } else {
    cv = document.getElementById('cv');
    ctx = cv.getContext('2d');
    resize();
    addEventListener('resize', resize);
  }
  fogCan = mkCan(W*FOGQ, H*FOGQ); fogCtx = fogCan.getContext('2d');
  fogImg = fogCtx.createImageData(W*FOGQ, H*FOGQ);
  grainCan = mkCan(96, 96);
  const gg = grainCan.getContext('2d');
  const im = gg.createImageData(96,96);
  for (let i=0;i<96*96;i++){
    const v = 118 + Math.random()*70;
    im.data[i*4] = v; im.data[i*4+1] = v; im.data[i*4+2] = v; im.data[i*4+3] = 255;
  }
  gg.putImageData(im, 0, 0);
}
function resize(){
  if (HEADLESS) return;
  DPR = Math.min(2, window.devicePixelRatio || 1);
  cw = innerWidth; ch = innerHeight;
  cv.width = Math.floor(cw*DPR); cv.height = Math.floor(ch*DPR);
  ctx.setTransform(DPR,0,0,DPR,0,0);
}

// The board sits in the space the HUD is not using.
function viewBox(){
  const top = 54, bot = G && G.q ? 190 : 20;
  return { x:0, y:top, w:cw, h:Math.max(120, ch - top - bot) };
}
function camApply(g){
  const v = viewBox();
  g.translate(v.x + v.w/2, v.y + v.h/2);
  const punch = G.cam.z * (1 + (G.camPunch || 0)*0.10);
  g.scale(punch, punch);
  g.translate(-G.cam.x, -G.cam.y);
}
function worldOf(sx, sy){
  const v = viewBox();
  return [ (sx - v.x - v.w/2)/G.cam.z + G.cam.x, (sy - v.y - v.h/2)/G.cam.z + G.cam.y ];
}
function tileOf(sx, sy){
  const [wx,wy] = worldOf(sx,sy);
  return [ Math.floor(wx/TS), Math.floor(wy/TS) ];
}
function clampCam(){
  const v = viewBox();
  const halfW = v.w/(2*G.cam.z), halfH = v.h/(2*G.cam.z);
  const mw = W*TS, mh = H*TS;
  G.cam.x = mw < halfW*2 ? mw/2 : clamp(G.cam.x, halfW - TS*.6, mw - halfW + TS*.6);
  G.cam.y = mh < halfH*2 ? mh/2 : clamp(G.cam.y, halfH - TS*.6, mh - halfH + TS*.6);
}
// A door opening is the game's biggest beat; the camera should lean into it.
// Consecutive kills without a hero bleeding for it.
const STREAK_STEPS = [3, 5, 8, 12];
const STREAK_SHOW = 2;                 // below two it is not a run, it is a Tuesday
function bumpStreak(){
  if (!G.q) return;
  G.q.streak = (G.q.streak || 0) + 1;
  G.q.streakBest = Math.max(G.q.streakBest || 0, G.q.streak);
  const n = G.q.streak;
  if (STREAK_STEPS.includes(n)){
    const word = n >= 12 ? 'UNTOUCHABLE' : n >= 8 ? 'BUTCHERY' : n >= 5 ? 'RAMPAGE' : 'ON A RUN';
    banner(word, `${n} without a scratch`);
    G.shake = Math.max(G.shake, 10 + n);
    hitStop(60 + Math.min(90, n*6));
    sfx('win');
    if (n >= 8) addFate(1, `${n} kills without a scratch`);
  }
}

function pushIn(rid){
  if (rid < 0 || rid === undefined) return;
  const r = ROOMS[rid];
  focusOn(r.x + (r.w-1)/2, r.y + (r.h-1)/2);
  G.camPunch = 1;
}
function focusOn(x, y, snap){
  const tx = (x+.5)*TS, ty = (y+.5)*TS;
  if (snap){ G.cam.x = tx; G.cam.y = ty; } else { G.cam.tx = tx; G.cam.ty = ty; }
  clampCam();
}

// Runs headless too — against a no-op context — so the test suite catches
// render-time mistakes the logic suites never touch.
function draw(){
  const t = TT0;
  ctx.setTransform(DPR,0,0,DPR,0,0);
  ctx.fillStyle = '#050404'; ctx.fillRect(0,0,cw,ch);
  if (!G || !G.q){ drawAntechamber(t); return; }

  const v = viewBox();
  ctx.save();
  ctx.beginPath(); ctx.rect(v.x, v.y, v.w, v.h); ctx.clip();
  ctx.save();
  if (G.shake > 0){
    ctx.translate((Math.random()-.5)*G.shake, (Math.random()-.5)*G.shake);
  }
  camApply(ctx);

  if (BAKE) ctx.drawImage(BAKE, 0, 0);

  // furniture, doors, traps
  for (const f of G.q.furn) if (G.q.seen[idx(f.x,f.y)]) drawFurniture(ctx, f, t);
  for (const k in G.q.doors){
    const d = G.q.doors[k];
    if (G.q.seen[idx(d.cx,d.cy)] || G.q.seen[idx(d.rx,d.ry)]) drawDoor(ctx, d, t);
  }
  for (const tr of G.q.traps) if (G.q.seen[idx(tr.x,tr.y)]) drawTrap(ctx, tr, t);
  for (const b of (G.q.bodies || [])) if (G.q.seen[idx(b.x,b.y)]) drawBody(ctx, b, t);

  drawMarkers(ctx, t);

  // bodies, back to front so southern figures overlap northern ones
  const order = G.q.actors.filter(a => a.alive || a.deathT > 0)
    .sort((a,b) => (a.py||a.y) - (b.py||b.y));
  for (const a of order) drawActor(ctx, a, t);

  drawParticles(ctx, t);
  ctx.restore();

  drawFog(ctx, t);
  drawLights(ctx, t);
  ctx.restore();

  drawVignette(ctx);
  drawDice(ctx, t);
}
// The title screen is not a black rectangle: it is a wall, two torches and the
// dust that never settles in a place like this.
let wallBake = null;
function bakeWall(){
  const c = mkCan(320, 320);
  const g = c.getContext('2d');
  g.fillStyle = '#17130f'; g.fillRect(0,0,320,320);
  for (let r=0;r<8;r++){
    const off = (r % 2) * 40;
    for (let i=-1;i<5;i++){
      const x = i*80 + off, y = r*40, v = hash2(i,r,7);
      const l = 24 + v*14;
      g.fillStyle = `rgb(${l+7},${l+3},${l-2})`;
      rr(g, x+2, y+2, 76, 36, 3); g.fill();
      g.fillStyle = `rgba(255,232,196,${.02 + v*.035})`;
      g.fillRect(x+4, y+4, 72, 2);
      g.fillStyle = 'rgba(0,0,0,.30)';
      g.fillRect(x+4, y+34, 72, 3);
      for (let k=0;k<5;k++){
        const a = hash2(x+k,y,11), b = hash2(x,y+k,13);
        g.fillStyle = `rgba(${a>.5?120:0},${a>.5?110:0},${a>.5?96:0},${.03+b*.06})`;
        g.fillRect(x + 6 + a*66, y + 6 + b*28, 1+b*3, 1+a*2);
      }
    }
  }
  wallBake = c;
}
let embers = [];
function drawAntechamber(t){
  if (HEADLESS) return;
  if (!wallBake) bakeWall();
  const g = ctx;
  for (let y=0;y<ch;y+=320) for (let x=0;x<cw;x+=320) g.drawImage(wallBake, x, y);
  g.fillStyle = 'rgba(4,3,3,.38)'; g.fillRect(0,0,cw,ch);

  const tx = [cw*.16, cw*.84], ty = ch*.26;
  g.save(); g.globalCompositeOperation = 'lighter';
  for (let i=0;i<2;i++){
    const fl = .74 + Math.sin(t*.008 + i*2.1)*.16 + Math.sin(t*.029 + i)*.10;
    const R0 = Math.min(cw,ch)*.72*fl;
    const gr = g.createRadialGradient(tx[i], ty, 0, tx[i], ty, R0);
    gr.addColorStop(0, `rgba(255,186,102,${.34*fl})`);
    gr.addColorStop(.4, `rgba(210,116,44,${.11*fl})`);
    gr.addColorStop(1, 'rgba(60,20,0,0)');
    g.fillStyle = gr; g.beginPath(); g.arc(tx[i], ty, R0, 0, 6.284); g.fill();
    const top = ty - 24 - fl*10;
    const fg = g.createLinearGradient(0, top, 0, ty + 12);
    fg.addColorStop(0,   `rgba(255,236,180,${.85*fl})`);
    fg.addColorStop(.45, `rgba(255,160,52,${.72*fl})`);
    fg.addColorStop(1,   `rgba(190,60,10,${.18*fl})`);
    g.fillStyle = fg;
    g.beginPath(); g.moveTo(tx[i]-10, ty+12);
    g.bezierCurveTo(tx[i]-12, ty-6, tx[i]-4, ty-14, tx[i], top);
    g.bezierCurveTo(tx[i]+4, ty-14, tx[i]+12, ty-6, tx[i]+10, ty+12);
    g.closePath(); g.fill();
    g.fillStyle = `rgba(255,248,214,${.55*fl})`;
    g.beginPath(); g.ellipse(tx[i], ty-2, 3.6, 8, 0, 0, 6.284); g.fill();
  }
  g.restore();
  for (let i=0;i<2;i++){
    g.fillStyle = '#241d17';
    g.beginPath(); g.moveTo(tx[i]-13, ty+10); g.lineTo(tx[i]+13, ty+10);
    g.lineTo(tx[i]+7, ty+26); g.lineTo(tx[i]-7, ty+26); g.closePath(); g.fill();
    g.fillStyle = '#3d332a'; g.fillRect(tx[i]-4, ty+22, 8, 26);
  }
  if (embers.length < 44 && Math.random() < .5){
    const i = Math.random() < .5 ? 0 : 1;
    embers.push({ x:tx[i] + (Math.random()-.5)*16, y:ty, vx:(Math.random()-.5)*.012,
                  vy:-.02 - Math.random()*.03, life:3200, max:3200 });
  }
  for (let i=embers.length-1;i>=0;i--){
    const p = embers[i];
    p.life -= 16; if (p.life <= 0){ embers.splice(i,1); continue; }
    p.x += p.vx*16; p.y += p.vy*16; p.vx += (Math.random()-.5)*.0016;
    const k = p.life/p.max;
    g.globalAlpha = k*.8;
    g.fillStyle = k > .5 ? '#ffc878' : '#a85a24';
    g.beginPath(); g.arc(p.x, p.y, 2.1*k + .8, 0, 6.284); g.fill();
  }
  g.globalAlpha = 1;
  drawVignette(g);
}

function drawActor(g, a, t){
  if (a.kind !== 'hero' && !tileVisible(a.x, a.y) && a.deathT === undefined) return;
  if (a.kind === 'monster' && !tileVisible(a.x, a.y)) return;
  const px = (a.px !== undefined ? a.px : a.x + .5)*TS;
  const py = (a.py !== undefined ? a.py : a.y + .5)*TS;
  const u = TS * (a.kind === 'hero' ? .96 : (MONSTERS[a.mt] ? MONSTERS[a.mt].size : .9));
  const bob = a.walking ? Math.abs(Math.sin(t*.016))*TS*.05 : Math.sin(t*.0022 + (a.bob||0))*TS*.014;
  g.save();
  const lk = a.lt > 0 ? Math.sin(a.lt*Math.PI) : 0;
  g.translate(px + (a.lx||0)*lk*TS*.34, py - bob + (a.ly||0)*lk*TS*.34);
  if (a.deathT !== undefined && a.deathT > 0){
    const k = a.deathT/620;
    g.globalAlpha = k*k;                       // going up in ash
    g.translate(0, -(1-k)*TS*.30);
    g.scale(1 + (1-k)*.20, 1 + (1-k)*.12);
    g.rotate((1-k)*.35);
  }
  g.save();
  g.shadowColor = 'rgba(0,0,0,.62)'; g.shadowBlur = u*.10; g.shadowOffsetY = u*.035;
  if (a.facing < 0) g.scale(-1, 1);
  if (a.kind === 'hero') HERO_ART[a.id](g, u, t);
  else if (a.kind === 'npc') drawNPC(g, u, t);
  else (MON_ART[a.mt] || drawGoblin)(g, u, a, t);
  g.restore();
  if (a.hurtT > 0){                                     // white flash on a hit
    g.globalAlpha = Math.min(.75, a.hurtT/180);
    g.globalCompositeOperation = 'lighter';
    g.fillStyle = '#ff9a80';
    g.beginPath(); g.arc(0, -u*.10, u*.36, 0, 6.284); g.fill();
    g.globalCompositeOperation = 'source-over'; g.globalAlpha = 1;
  }
  g.restore();
  if (a.alive) drawActorTag(g, a, px, py, u, t);
}
function drawActorTag(g, a, px, py, u, t){
  if (a.webbed){                                  // caught, and going nowhere
    const q = .5 + Math.sin(t*.004 + (a.bob||0))*.5;
    g.strokeStyle = `rgba(20,22,28,.55)`;         // a dark backing so the strands read on any floor
    g.lineWidth = 5;
    for (let i = 0; i < 4; i++){
      const an = i/4*6.284 + .4;
      g.beginPath(); g.moveTo(px + Math.cos(an)*u*.46, py + Math.sin(an)*u*.34);
      g.lineTo(px - Math.cos(an)*u*.46, py - Math.sin(an)*u*.34); g.stroke();
    }
    g.strokeStyle = `rgba(232,238,248,${(.72 + q*.28).toFixed(3)})`;
    g.lineWidth = 2.6;
    for (let i = 0; i < 4; i++){
      const an = i/4*6.284 + .4;
      g.beginPath(); g.moveTo(px + Math.cos(an)*u*.46, py + Math.sin(an)*u*.34);
      g.lineTo(px - Math.cos(an)*u*.46, py - Math.sin(an)*u*.34); g.stroke();
    }
    g.beginPath(); g.ellipse(px, py, u*.34, u*.25, 0, 0, 6.284); g.stroke();
    g.beginPath(); g.ellipse(px, py, u*.18, u*.13, 0, 0, 6.284); g.stroke();
    // and the same head glyph every other status wears, so it reads at a glance
    g.font = `${u*.34}px Georgia,serif`; g.textAlign = 'center';
    g.fillStyle = 'rgba(0,0,0,.75)';
    g.fillText('✳', px + 1, py - u*.56 + 1);
    g.fillStyle = `rgba(232,238,248,${(.75 + q*.25).toFixed(3)})`;
    g.fillText('✳', px, py - u*.56);
  }
  if (a.kind === 'monster'){
    if (a.bp < a.bpMax || a.boss){
      const w = u*.56, y = py - u*.62;
      g.fillStyle = 'rgba(0,0,0,.65)'; rr(g, px-w/2, y, w, 5.5, 2.5); g.fill();
      g.fillStyle = a.boss ? '#e0b040' : '#c0392b';
      rr(g, px-w/2+1, y+1, (w-2)*(a.bp/a.bpMax), 3.5, 1.7); g.fill();
    }
    if (a.elite && a.affix){
      const af = AFFIX(a.affix), p = .5 + Math.sin(t*.004 + (a.bob||0))*.5;
      g.strokeStyle = af.col; g.globalAlpha = .35 + p*.35; g.lineWidth = 2.2;
      g.beginPath(); g.ellipse(px, py + u*.34, u*.36, u*.14, 0, 0, 6.284); g.stroke();
      g.globalAlpha = 1;
      g.font = `${u*.30}px Georgia,serif`; g.textAlign = 'center';
      g.fillStyle = 'rgba(0,0,0,.7)';
      g.fillText(af.ic, px + u*.30 + 1, py - u*.44 + 1);
      g.fillStyle = af.col;
      g.fillText(af.ic, px + u*.30, py - u*.44);
    }
    // The one the trial wants dead first. It has to be findable across a lit
    // room at a glance, so it gets a ring on the floor and a sigil over it.
    if (a.marked && a.alive){
      const p = .5 + Math.sin(t*.005 + (a.bob||0))*.5;
      g.strokeStyle = `rgba(200,90,255,${(.45 + p*.40).toFixed(3)})`;
      g.lineWidth = 2.6;
      g.beginPath(); g.ellipse(px, py + u*.34, u*.42, u*.17, 0, 0, 6.284); g.stroke();
      g.beginPath(); g.ellipse(px, py + u*.34, u*.30, u*.12, 0, 0, 6.284); g.stroke();
      g.font = `${u*.34}px Georgia,serif`; g.textAlign = 'center';
      g.fillStyle = 'rgba(0,0,0,.75)';
      g.fillText('✖', px + 1, py - u*.56 - p*2 + 1);
      g.fillStyle = `rgba(220,140,255,${(.75 + p*.25).toFixed(3)})`;
      g.fillText('✖', px, py - u*.56 - p*2);
    }
    if (a.poisonMark){ /* reserved */ }
    if (a.sleep > 0){
      g.fillStyle = '#9fd8e8'; g.font = `${u*.28}px Georgia,serif`; g.textAlign = 'center';
      g.fillText('z', px + u*.22, py - u*.52 + Math.sin(t*.004)*3);
    }
    if (a.stun > 0){
      g.fillStyle = '#e8d060'; g.font = `${u*.26}px Georgia,serif`; g.textAlign = 'center';
      g.fillText('✦', px - u*.24, py - u*.52);
    }
  } else if (a.kind === 'hero'){
    const act = activeHero();
    if (act === a && G.q.phase === 'hero'){
      const p = .5 + Math.sin(t*.005)*.5;
      g.strokeStyle = `rgba(216,168,60,${.45 + p*.4})`; g.lineWidth = 2.4;
      g.beginPath(); g.ellipse(px, py + u*.36, u*.36, u*.14, 0, 0, 6.284); g.stroke();
      g.fillStyle = `rgba(216,168,60,${.6 + p*.4})`;
      g.beginPath();
      const ay = py - u*.72 - p*3;
      g.moveTo(px, ay + 9); g.lineTo(px - 6, ay); g.lineTo(px + 6, ay); g.closePath(); g.fill();
    }
    if (a.buffs.veil){
      g.fillStyle = `rgba(160,200,255,${.10 + Math.sin(t*.003)*.05})`;
      g.beginPath(); g.arc(px, py - u*.08, u*.42, 0, 6.284); g.fill();
    }
    if (a.buffs.rockskin){
      g.strokeStyle = 'rgba(150,200,120,.4)'; g.lineWidth = 2;
      g.beginPath(); g.arc(px, py - u*.08, u*.40, 0, 6.284); g.stroke();
    }
  }
}

function drawMarkers(g, t){
  const h = activeHero();
  if (!h || G.q.phase !== 'hero' || G.busy()) return;
  const f = G.q.field;
  if (!f) return;
  const p = .5 + Math.sin(t*.004)*.5;
  g.lineWidth = 2;
  for (const [k, cost] of f.d){
    if (cost === 0) continue;
    const x = k % W, y = (k/W)|0;
    if (!tileSeen(x,y)) continue;
    const px = x*TS, py = y*TS;
    g.fillStyle = `rgba(232,190,90,${.075 + p*.045})`;
    rr(g, px+5, py+5, TS-10, TS-10, 5); g.fill();
    g.strokeStyle = `rgba(232,190,90,${.26 + p*.14})`;
    rr(g, px+5, py+5, TS-10, TS-10, 5); g.stroke();
  }
  // once the prize is in hand, the stair is the objective — say so
  if (objectiveReady() && needsEscape()){
    for (const [sx,sy] of STAIRS){
      const px = sx*TS, py = sy*TS;
      g.fillStyle = `rgba(120,220,150,${.10 + p*.10})`;
      rr(g, px+4, py+4, TS-8, TS-8, 6); g.fill();
      g.strokeStyle = `rgba(120,220,150,${.45 + p*.35})`; g.lineWidth = 2.5;
      rr(g, px+4, py+4, TS-8, TS-8, 6); g.stroke();
    }
  }
  // squares you could strike from where you stand
  for (const m of monstersOf()){
    if (!tileVisible(m.x,m.y)) continue;
    if (!canStrike(h, m)) continue;
    const px = m.x*TS, py = m.y*TS;
    g.strokeStyle = `rgba(200,60,44,${.5 + p*.3})`; g.lineWidth = 3;
    rr(g, px+4, py+4, TS-8, TS-8, 6); g.stroke();
  }
}

/* ------------------------------------------------------------- the dark */

function drawFog(g, t){
  if (!fogCan) return;
  const d = fogImg.data, Q = G.q, FW = W*FOGQ;

  // where the light actually comes from: the party's torches, and any sconce
  // close enough to matter. A lit room still falls off into its corners.
  const lights = [];
  const hs = livingHeroes();
  for (const h of hs) lights.push([h.px !== undefined ? h.px : h.x+.5, h.py !== undefined ? h.py : h.y+.5, 3.3]);
  for (const tr of TORCHES){
    for (const h of hs){
      if (Math.abs(tr.x - h.x) < 11 && Math.abs(tr.y - h.y) < 11){ lights.push([tr.x, tr.y, 2.9]); break; }
    }
  }
  const A = fogTmp || (fogTmp = new Uint8Array(W*H));
  for (let y=0;y<H;y++) for (let x=0;x<W;x++){
    const i = idx(x,y);
    if (!isFloor(x,y)){ A[i] = 252; continue; }
    if (!(Q.vis && Q.vis[i])){ A[i] = Q.seen[i] ? 150 : 252; continue; }
    let best = 99;
    for (let k=0;k<lights.length;k++){
      const L = lights[k];
      const dx = x + .5 - L[0], dy = y + .5 - L[1];
      const dd = Math.sqrt(dx*dx + dy*dy) - L[2];
      if (dd < best) best = dd;
    }
    A[i] = best <= 0 ? 0 : Math.min(104, best*27)|0;
  }
  // stone borrows the light of the brightest floor square beside it
  for (let y=0;y<H;y++) for (let x=0;x<W;x++){
    const i = idx(x,y);
    let a = A[i];
    if (!isFloor(x,y)){
      let best = 252;
      for (const [dx,dy] of DIRS8){
        const nx = x+dx, ny = y+dy;
        if (!isFloor(nx,ny)) continue;
        const va = Math.min(252, A[idx(nx,ny)] + 26);
        if (va < best) best = va;
      }
      a = best;
    }
    for (let sy=0; sy<FOGQ; sy++) for (let sx=0; sx<FOGQ; sx++){
      const j = ((y*FOGQ + sy)*FW + x*FOGQ + sx)*4;
      d[j] = 2; d[j+1] = 2; d[j+2] = 4; d[j+3] = a;
    }
  }
  fogCtx.putImageData(fogImg, 0, 0);
  g.save(); camApply(g);
  g.imageSmoothingEnabled = true;
  g.drawImage(fogCan, 0, 0, W*TS, H*TS);
  g.restore();
}

function drawLights(g, t){
  g.save(); camApply(g);
  g.globalCompositeOperation = 'lighter';
  for (const tr of TORCHES){
    const tx = Math.floor(tr.x), ty = Math.floor(tr.y);
    let lit = false;
    for (const [dx,dy] of DIRS8) if (isFloor(tx+dx,ty+dy) && tileVisible(tx+dx,ty+dy)) lit = true;
    if (isFloor(tx,ty) && tileVisible(tx,ty)) lit = true;
    if (!lit) continue;
    const fl = .72 + Math.sin(t*.009 + tr.ph)*.16 + Math.sin(t*.031 + tr.ph*2)*.09;
    const R0 = TS*2.5*fl;
    const gr = g.createRadialGradient(tr.x*TS, tr.y*TS, 0, tr.x*TS, tr.y*TS, R0);
    gr.addColorStop(0,   `rgba(255,186,96,${.30*fl})`);
    gr.addColorStop(.35, `rgba(220,130,50,${.12*fl})`);
    gr.addColorStop(1,   'rgba(120,50,10,0)');
    g.fillStyle = gr;
    g.beginPath(); g.arc(tr.x*TS, tr.y*TS, R0, 0, 6.284); g.fill();
    // the flame itself
    const fx = tr.x*TS, fy = tr.y*TS - 6;
    g.fillStyle = `rgba(255,170,60,${.55*fl})`;
    g.beginPath(); g.moveTo(fx-5, fy+5);
    g.quadraticCurveTo(fx-4, fy-4, fx, fy-11-fl*4);
    g.quadraticCurveTo(fx+4, fy-4, fx+5, fy+5); g.closePath(); g.fill();
    g.fillStyle = `rgba(255,240,190,${.5*fl})`;
    g.beginPath(); g.ellipse(fx, fy-3, 2.4, 4.4, 0, 0, 6.284); g.fill();
  }
  for (const h of livingHeroes()){
    const px = (h.px !== undefined ? h.px : h.x+.5)*TS, py = (h.py !== undefined ? h.py : h.y+.5)*TS;
    const fl = .86 + Math.sin(t*.006 + h.x)*.08;
    const R0 = TS*3.1*fl;
    const gr = g.createRadialGradient(px, py, 0, px, py, R0);
    gr.addColorStop(0,   `rgba(255,196,120,${.20*fl})`);
    gr.addColorStop(.45, `rgba(190,120,60,${.07*fl})`);
    gr.addColorStop(1,   'rgba(60,30,10,0)');
    g.fillStyle = gr;
    g.beginPath(); g.arc(px, py, R0, 0, 6.284); g.fill();
  }
  for (const p of G.fx){
    if (!p.glow) continue;
    const gr = g.createRadialGradient(p.x*TS, p.y*TS, 0, p.x*TS, p.y*TS, p.r*TS);
    gr.addColorStop(0, p.glow); gr.addColorStop(1,'rgba(0,0,0,0)');
    g.fillStyle = gr;
    g.beginPath(); g.arc(p.x*TS, p.y*TS, p.r*TS, 0, 6.284); g.fill();
  }
  g.globalCompositeOperation = 'source-over';
  g.restore();
}

function drawVignette(g){
  const gr = g.createRadialGradient(cw/2, ch*.46, Math.min(cw,ch)*.28, cw/2, ch*.46, Math.max(cw,ch)*.78);
  gr.addColorStop(0,'rgba(0,0,0,0)'); gr.addColorStop(1,'rgba(0,0,0,.72)');
  g.fillStyle = gr; g.fillRect(0,0,cw,ch);
  // somebody is nearly gone: the edges of the world start beating
  if (G && G.q){
    const worst = livingHeroes().reduce((w, h) => Math.min(w, h.bp/h.bpMax), 9);
    if (worst <= .34){
      const beat = .5 + Math.sin(TT0*.006)*.5;
      const a = (1 - worst/.34)*(.16 + beat*.20);
      const rg = g.createRadialGradient(cw/2, ch*.46, Math.min(cw,ch)*.22, cw/2, ch*.46, Math.max(cw,ch)*.72);
      rg.addColorStop(0,'rgba(120,10,6,0)');
      rg.addColorStop(1, `rgba(140,12,8,${a.toFixed(3)})`);
      g.fillStyle = rg; g.fillRect(0,0,cw,ch);
    }
  }
  if (grainCan){
    g.save(); g.globalAlpha = .045; g.globalCompositeOperation = 'overlay';
    const ox = (Math.random()*96)|0, oy = (Math.random()*96)|0;
    for (let y=-oy; y<ch; y+=96) for (let x=-ox; x<cw; x+=96) g.drawImage(grainCan, x, y);
    g.restore();
  }
}

/* -------------------------------------------------------------- particles */

// #rrggbb → rgba(r,g,b,a). Canvas throws on a malformed colour stop, and a
// throw inside draw() takes the whole frame loop with it.
function hexA(hex, a){
  const n = parseInt(String(hex).slice(1), 16) || 0;
  return `rgba(${(n>>16)&255},${(n>>8)&255},${n&255},${a})`;
}

function spark(x, y, n, col, opt){
  opt = opt || {};
  for (let i=0;i<n;i++){
    const a = Math.random()*6.284, s = (opt.spd || .012)*(.4 + Math.random());
    const d = opt.dir;
    G.fx.push({
      x:x+.5 + (Math.random()-.5)*.3, y:y+.5 + (Math.random()-.5)*.3,
      vx:Math.cos(a)*s*(d?.45:1) + (d ? d[0]*s*1.7 : 0),
      vy:Math.sin(a)*s*(d?.45:1) + (d ? d[1]*s*1.7 : 0) - (opt.up||0),
      life:opt.life || 520, max:opt.life || 520, col, size:opt.size || 3,
      grav:opt.grav === undefined ? .00004 : opt.grav, glow:opt.glow, r:opt.r || .8,
    });
  }
}
function floatText(x, y, text, col, big){
  G.fx.push({ x:x+.5, y:y+.2, vx:(Math.random()-.5)*.0006, vy:-.0019,
              life:1050, max:1050, text, col, size:0, grav:.0000009, big:big?1:0 });
}
function drawParticles(g, t){
  for (const p of G.fx){
    const k = p.life / p.max;
    if (p.text){
      g.save();
      g.globalAlpha = Math.min(1, k*1.6);
      const pop = 1 + Math.max(0, (k - .82))*2.4;         // a punch as it appears
      g.translate(p.x*TS, p.y*TS); g.scale(pop, pop); g.translate(-p.x*TS, -p.y*TS);
      g.font = `700 ${TS*(p.big ? .58 : .42)}px Georgia,serif`;
      g.textAlign = 'center'; g.textBaseline = 'middle';
      g.lineWidth = 4; g.strokeStyle = 'rgba(0,0,0,.8)';
      g.strokeText(p.text, p.x*TS, p.y*TS);
      g.fillStyle = p.col; g.fillText(p.text, p.x*TS, p.y*TS);
      g.restore();
      continue;
    }
    g.globalAlpha = k;
    g.fillStyle = p.col;
    g.beginPath(); g.arc(p.x*TS, p.y*TS, p.size*k, 0, 6.284); g.fill();
  }
  g.globalAlpha = 1;
}

/* ------------------------------------------------------------- 7. SOUND */
// Small WebAudio kit: a breathing drone under everything, a handful of hits,
// and a slow modal loop that changes when steel comes out.

let AC = null, masterG = null, musicG = null, droneNodes = null, audioOn = true;

function audioInit(){
  if (AC || HEADLESS) return;
  try {
    const C = window.AudioContext || window.webkitAudioContext;
    if (!C) return;
    AC = new C();
    masterG = AC.createGain(); masterG.gain.value = .9; masterG.connect(AC.destination);
    musicG = AC.createGain(); musicG.gain.value = .34; musicG.connect(masterG);
    startDrone();
  } catch(e){ AC = null; }
}
function startDrone(){
  if (!AC) return;
  const g = AC.createGain(); g.gain.value = .055; g.connect(masterG);
  const f = AC.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 260; f.Q.value = 3;
  f.connect(g);
  const oscs = [];
  for (const [freq, det] of [[55,0],[55.4,7],[82.5,-6]]){
    const o = AC.createOscillator(); o.type = 'sawtooth';
    o.frequency.value = freq; o.detune.value = det;
    const og = AC.createGain(); og.gain.value = .5;
    o.connect(og); og.connect(f); o.start(); oscs.push(o);
  }
  const lfo = AC.createOscillator(); lfo.frequency.value = .07;
  const lg = AC.createGain(); lg.gain.value = 90;
  lfo.connect(lg); lg.connect(f.frequency); lfo.start();
  droneNodes = { g, f };
}
function tone(freq, dur, type, vol, when, slide){
  if (!AC || !audioOn) return;
  const t0 = AC.currentTime + (when || 0);
  const o = AC.createOscillator(); o.type = type || 'triangle';
  o.frequency.setValueAtTime(freq, t0);
  if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, slide), t0 + dur);
  const g = AC.createGain();
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.exponentialRampToValueAtTime(vol || .12, t0 + .012);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  o.connect(g); g.connect(masterG); o.start(t0); o.stop(t0 + dur + .03);
}
function noise(dur, vol, freq, type){
  if (!AC || !audioOn) return;
  const n = Math.floor(AC.sampleRate * dur);
  const buf = AC.createBuffer(1, n, AC.sampleRate);
  const d = buf.getChannelData(0);
  for (let i=0;i<n;i++) d[i] = (Math.random()*2-1) * (1 - i/n);
  const s = AC.createBufferSource(); s.buffer = buf;
  const f = AC.createBiquadFilter(); f.type = type || 'bandpass';
  f.frequency.value = freq || 900; f.Q.value = 1.1;
  const g = AC.createGain(); g.gain.value = vol || .16;
  s.connect(f); f.connect(g); g.connect(masterG); s.start();
}
function sfx(k){
  if (!AC || !audioOn) return;
  switch(k){
    case 'step':   noise(.07, .045, 480, 'lowpass'); break;
    case 'door':   noise(.34, .13, 320, 'bandpass'); tone(90, .5, 'sawtooth', .07, 0, 62); break;
    case 'hit':    noise(.14, .30, 2000, 'bandpass'); tone(160, .16, 'square', .13, 0, 70); break;
    case 'block':  noise(.10, .20, 3400, 'bandpass'); tone(320, .09, 'square', .07); break;
    case 'miss':   noise(.13, .12, 1400, 'highpass'); break;
    case 'dice':   for (let i=0;i<5;i++) noise(.05, .10, 1600 + Math.random()*1800, 'bandpass'); break;
    case 'die':    tone(200, .5, 'sawtooth', .13, 0, 48); noise(.3, .16, 500, 'lowpass'); break;
    case 'heroDie':tone(150, 1.1, 'sawtooth', .16, 0, 40); tone(75, 1.3, 'sine', .12, .05, 32); break;
    case 'spell':  tone(520, .5, 'sine', .10, 0, 1500); tone(780, .45, 'triangle', .07, .04, 2100); break;
    case 'heal':   [523,659,784,1046].forEach((f,i) => tone(f, .35, 'sine', .09, i*.06)); break;
    case 'gold':   [880,1175,1568].forEach((f,i) => tone(f, .18, 'square', .06, i*.05)); break;
    case 'trap':   noise(.22, .28, 700, 'bandpass'); tone(110, .35, 'sawtooth', .14, 0, 55); break;
    case 'search': noise(.30, .07, 2600, 'bandpass'); break;
    case 'win':    [392,523,659,784,1046].forEach((f,i) => tone(f, .6, 'triangle', .11, i*.11)); break;
    case 'lose':   [392,349,294,220].forEach((f,i) => tone(f, .8, 'sawtooth', .11, i*.18)); break;
    case 'ui':     tone(660, .06, 'square', .045); break;
    case 'boss':   tone(58, 1.6, 'sawtooth', .2, 0, 40); noise(1.0, .12, 200, 'lowpass'); break;
  }
}

// --- the loop ------------------------------------------------------------
const SCALE_EXPLORE = [0,2,3,5,7,8,10];      // D aeolian
const SCALE_FIGHT   = [0,1,3,5,6,8,10];      // D phrygian, meaner
let musicStep = 0, musicNext = 0, musicMood = 'explore';

function musicTick(now){
  if (!AC || !audioOn || !G || !G.q) return;
  const bpm = musicMood === 'fight' ? 104 : 74;
  const beat = 60/bpm;
  if (now < musicNext) return;
  musicNext = (musicNext || now) + beat/2;
  if (musicNext < now) musicNext = now + beat/2;
  const s = musicStep++;
  const root = 36.71;                        // D1
  const sc = musicMood === 'fight' ? SCALE_FIGHT : SCALE_EXPLORE;
  const bar = (s >> 3) % 4;
  const bassDeg = [0,0,5,3][bar];
  if (s % 4 === 0){
    tone(root*Math.pow(2, bassDeg/12), beat*1.6, 'sawtooth', .075);
  }
  if (musicMood === 'fight'){
    if (s % 2 === 0) noise(.06, .06, 5200, 'highpass');
    if (s % 8 === 4) noise(.20, .12, 240, 'lowpass');
    const deg = sc[(s*3) % sc.length];
    tone(root*4*Math.pow(2, (deg + bassDeg)/12), beat*.42, 'square', .045);
  } else {
    if (s % 8 === 0){
      const deg = sc[(s>>3) % sc.length];
      tone(root*4*Math.pow(2, (deg + bassDeg)/12), beat*2.4, 'triangle', .04);
      tone(root*6*Math.pow(2, (deg + bassDeg)/12), beat*2.0, 'sine', .022);
    }
    if (s % 16 === 9) noise(.5, .03, 3000, 'bandpass');   // a drip somewhere
  }
}
function setMood(m){
  if (m !== musicMood){ musicMood = m; musicStep = 0; }
}

/* ------------------------------------------------------- 8. TIME AND DICE */

// One timer list drives all pacing. In headless the callback fires at once, so
// the tests walk the same code path the game does, only instantly.
function later(ms, fn){
  if (HEADLESS){ fn(); return null; }
  const T = { t:ms, fn };
  G.timers.push(T);
  return T;
}
// A blow lands better if the world stops for a tenth of a second.
function hitStop(ms){ if (!HEADLESS) G.freeze = Math.max(G.freeze || 0, ms); }
function lungeAt(a, tx, ty){
  const dx = tx - a.x, dy = ty - a.y, d = Math.hypot(dx, dy) || 1;
  a.lx = dx/d; a.ly = dy/d; a.lt = 1;
}
function clearTimers(){ if (G){ G.timers.length = 0; G.timerGen = (G.timerGen || 0) + 1; } }

const SKULL = 0, WHITE = 1, BLACK = 2;
function combatDie(){ const r = ri(6); return r < 3 ? SKULL : r < 5 ? WHITE : BLACK; }
function rollCombat(n){ const out = []; for (let i=0;i<n;i++) out.push(combatDie()); return out; }
const countSkulls = (f) => f.filter(v => v === SKULL).length;
const countShields = (f, hero) => f.filter(v => v === (hero ? WHITE : BLACK)).length;

function showDice(kind, atk, def, label, sub, done, onReroll){
  const items = [];
  for (const f of atk) items.push({ side:'atk', face:f, settle:0 });
  for (const f of def) items.push({ side:'def', face:f, settle:0 });
  const per = 90, base = 380;
  items.forEach((it,i) => { it.settle = base + i*per; });
  const shape = diceShape(kind, items.length, fateOf());
  const settleAt = shape.settleAt;
  // If Fate could be spent on this pool, hold it on the table and wait for the
  // player. Auto-resolving half a second after the dice land gave nobody time
  // to decide, and tapping to read the result only made it resolve sooner.
  const hold = shape.hold;
  const total = shape.total;
  // Drop any pool still on the table: a stale timer must never blank a newer
  // roll, and the token makes that impossible even if one slips through.
  if (G.dice && G.dice.timer){
    const i = G.timers.indexOf(G.dice.timer);
    if (i >= 0) G.timers.splice(i, 1);
  }
  const token = {};
  G.dice = { kind, items, t:0, total, settleAt, hold, label, sub, token,
             onReroll:onReroll || null, rerolled:false };
  sfx('dice');
  G.dice.timer = later(total, () => {
    if (G.dice && G.dice.token !== token) return;
    G.dice = null; if (done) done();
  });
}
function showMoveDice(a, b, done){
  if (G.dice && G.dice.timer){
    const i = G.timers.indexOf(G.dice.timer);
    if (i >= 0) G.timers.splice(i, 1);
  }
  const token = {};
  G.dice = { kind:'move', items:[{side:'pip',face:a,settle:380},{side:'pip',face:b,settle:470}],
             t:0, total:1150, label:'MOVEMENT', sub:(a+b)+' squares', token };
  sfx('dice');
  G.dice.timer = later(1150, () => {
    if (G.dice && G.dice.token !== token) return;
    G.dice = null; if (done) done();
  });
}

// The timing a pool would be given — held for a decision, or flowing.
function diceShape(kind, n, fate){
  const settleAt = 380 + n*90;
  const hold = kind !== 'move' && fate > 0;
  return { settleAt, hold, total: settleAt + (hold ? 6000 : 520) };
}

// Fire a waiting pool's resolution now, on the player's say-so.
function resolveDice(){
  if (!G.dice) return false;
  const T = G.dice.timer;
  if (T){
    const i = G.timers.indexOf(T);
    if (i >= 0) G.timers.splice(i, 1);
    T.fn();
  } else G.dice = null;
  return true;
}

function drawDice(g, t){
  if (!G.dice) return;
  const D = G.dice, n = D.items.length;
  const size = Math.min(46, (cw - 60) / Math.max(4, n) - 8);
  const gap = size + 8;
  const totalW = n*gap - 8;
  const cx0 = cw/2 - totalW/2;
  const cy = ch*.40;
  g.save();
  g.fillStyle = 'rgba(6,5,4,.72)';
  rr(g, cw/2 - totalW/2 - 22, cy - size/2 - 40, totalW + 44, size + 78, 12); g.fill();
  g.strokeStyle = 'rgba(216,168,60,.35)'; g.lineWidth = 1;
  rr(g, cw/2 - totalW/2 - 22, cy - size/2 - 40, totalW + 44, size + 78, 12); g.stroke();
  g.fillStyle = '#9c8d75'; g.font = '600 10px Georgia,serif';
  g.textAlign = 'center'; g.textBaseline = 'middle';
  g.save(); g.translate(cw/2, cy - size/2 - 22);
  g.letterSpacing = '3px';
  g.fillText(D.label, 0, 0);
  g.restore();
  D.items.forEach((it, i) => {
    const x = cx0 + i*gap + size/2;
    const settled = D.t >= it.settle;
    const face = settled ? it.face : ri(6);
    let yy = cy, sc = 1, rot = 0;
    if (!settled){
      const k = D.t / it.settle;
      yy = cy - Math.abs(Math.sin(D.t*.02))*22*(1-k);
      rot = D.t*.02; sc = 1.08;
    } else {
      const k = Math.min(1, (D.t - it.settle)/160);
      sc = 1 + (1-k)*.28;
    }
    g.save(); g.translate(x, yy); g.rotate(rot); g.scale(sc, sc);
    dieFace(g, size, it.side, settled ? it.face : (D.kind === 'move' ? 1+ri(6) : face), D.kind);
    g.restore();
  });
  // Fate: one reroll a pool, and the whole point is that you can see the cost
  if (canReroll()){
    const bw = Math.min(230, cw - 80), bh = 42;
    const bx = cw/2 - bw/2, by = cy + size/2 + (D.sub ? 44 : 22);
    D.btn = { x:bx, y:by, w:bw, h:bh };
    const p = .5 + Math.sin(TT0*.005)*.5;
    g.fillStyle = `rgba(60,40,90,${.72 + p*.12})`;
    rr(g, bx, by, bw, bh, 12); g.fill();
    g.strokeStyle = `rgba(180,150,255,${.55 + p*.35})`; g.lineWidth = 1.6;
    rr(g, bx, by, bw, bh, 12); g.stroke();
    g.fillStyle = '#ddd0ff'; g.font = '700 14px Georgia,serif';
    g.textAlign = 'center'; g.textBaseline = 'middle';
    g.letterSpacing = '2px';
    g.fillText(`✦ REROLL  ·  ${fateOf()} FATE`, cw/2, by + bh/2);
    g.letterSpacing = '0px';
    if (D.t >= D.settleAt){
      g.globalAlpha = .55 + Math.sin(TT0*.004)*.25;
      g.fillStyle = '#9c8d75'; g.font = '10px Georgia,serif';
      g.letterSpacing = '3px';
      g.fillText('OR TAP ANYWHERE TO CARRY ON', cw/2, by + bh + 16);
      g.letterSpacing = '0px'; g.globalAlpha = 1;
    }
  } else D.btn = null;
  if (D.sub && D.t >= D.settleAt){
    g.globalAlpha = Math.min(1, (D.t - D.settleAt)/180);
    g.fillStyle = '#f3d488'; g.font = '700 15px Georgia,serif';
    g.letterSpacing = '2px';
    g.fillText(D.sub, cw/2, cy + size/2 + 22);
    g.globalAlpha = 1;
  }
  g.restore();
}
function dieFace(g, s, side, face, kind){
  const r = s*.18;
  g.save();
  g.shadowColor = 'rgba(0,0,0,.7)'; g.shadowBlur = 10; g.shadowOffsetY = 4;
  if (kind === 'move'){
    g.fillStyle = '#a8231d';
    rr(g, -s/2, -s/2, s, s, r); g.fill();
    g.shadowBlur = 0;
    g.fillStyle = 'rgba(255,255,255,.22)'; rr(g, -s/2+2, -s/2+2, s-4, s*.34, r*.7); g.fill();
    g.fillStyle = '#fff4e0';
    const P = [[0,0]], pip = s*.10;
    const layouts = { 1:[[0,0]], 2:[[-.24,-.24],[.24,.24]], 3:[[-.26,-.26],[0,0],[.26,.26]],
      4:[[-.24,-.24],[.24,-.24],[-.24,.24],[.24,.24]],
      5:[[-.26,-.26],[.26,-.26],[0,0],[-.26,.26],[.26,.26]],
      6:[[-.25,-.28],[.25,-.28],[-.25,0],[.25,0],[-.25,.28],[.25,.28]] };
    for (const [dx,dy] of (layouts[face] || P)){
      g.beginPath(); g.arc(dx*s, dy*s, pip, 0, 6.284); g.fill();
    }
    g.restore(); return;
  }
  const atk = side === 'atk';
  g.fillStyle = atk ? '#e6ddc6' : '#2b2c31';
  rr(g, -s/2, -s/2, s, s, r); g.fill();
  g.shadowBlur = 0;
  g.fillStyle = atk ? 'rgba(255,255,255,.5)' : 'rgba(255,255,255,.10)';
  rr(g, -s/2+2, -s/2+2, s-4, s*.32, r*.7); g.fill();
  g.strokeStyle = atk ? 'rgba(90,74,50,.45)' : 'rgba(200,200,220,.20)'; g.lineWidth = 1.2;
  rr(g, -s/2, -s/2, s, s, r); g.stroke();
  const ink = atk ? '#2a2018' : '#dfe4ea';
  if (face === SKULL) glyphSkull(g, s*.60, ink);
  else if (face === WHITE) glyphShield(g, s*.56, atk ? '#c8c2ae' : '#eef2f6', ink);
  else glyphShield(g, s*.56, atk ? '#4a4238' : '#6a6f78', ink);
  g.restore();
}
function glyphSkull(g, s, col){
  g.fillStyle = col;
  g.beginPath(); g.arc(0, -s*.10, s*.34, 0, 6.284); g.fill();
  g.fillRect(-s*.18, s*.14, s*.36, s*.20);
  g.fillStyle = 'rgba(255,255,255,.85)';
  g.beginPath(); g.arc(-s*.13, -s*.12, s*.11, 0, 6.284); g.fill();
  g.beginPath(); g.arc( s*.13, -s*.12, s*.11, 0, 6.284); g.fill();
  g.fillStyle = col;
  g.beginPath(); g.moveTo(0, -s*.02); g.lineTo(s*.06, s*.10); g.lineTo(-s*.06, s*.10); g.closePath(); g.fill();
  g.fillStyle = 'rgba(255,255,255,.75)';
  for (let i=0;i<3;i++) g.fillRect(-s*.15 + i*s*.11, s*.17, s*.05, s*.14);
}
function glyphShield(g, s, fill, edge){
  g.fillStyle = fill;
  g.beginPath();
  g.moveTo(-s*.34, -s*.36); g.lineTo(s*.34, -s*.36);
  g.lineTo(s*.34, s*.04); g.quadraticCurveTo(s*.30, s*.34, 0, s*.44);
  g.quadraticCurveTo(-s*.30, s*.34, -s*.34, s*.04);
  g.closePath(); g.fill();
  g.strokeStyle = edge; g.lineWidth = Math.max(1.2, s*.07); g.stroke();
  g.strokeStyle = edge; g.lineWidth = Math.max(1, s*.05);
  g.beginPath(); g.moveTo(0, -s*.30); g.lineTo(0, s*.30); g.stroke();
}

/* ------------------------------------------------------- 9. THE TURN LOOP */

function activeHero(){
  if (!G.q) return null;
  return G.q.actors.find(a => a.kind === 'hero' && a.id === G.q.activeId && a.alive) || null;
}
function busy(){
  return !!(G.dice || G.timers.length || G.q.actors.some(a => a.walking) || G.q.over);
}

function say(text, cls){
  if (!G.q) return;
  G.q.log.push({ text, cls, t:0 });
  if (G.q.log.length > 4) G.q.log.shift();
  renderLog();
}

/* --------------------------------------------------------------- movement */

function slide(a, tx, ty, ms, done){
  a.px = a.x + .5; a.py = a.y + .5;
  a.sx = a.px; a.sy = a.py;
  a.x = tx; a.y = ty;
  a.gx = tx + .5; a.gy = ty + .5;
  if (HEADLESS || ms <= 0){ a.px = a.gx; a.py = a.gy; a.walking = false; if (done) done(); return; }
  a.slideT = 0; a.slideMs = ms; a.walking = true; a.slideDone = done;
}
function tickSlide(a, dt){
  if (!a.walking) return;
  a.slideT += dt;
  const k = Math.min(1, a.slideT / a.slideMs);
  const e = k*k*(3-2*k);
  a.px = lerp(a.sx, a.gx, e); a.py = lerp(a.sy, a.gy, e);
  if (k >= 1){
    a.walking = false;
    const f = a.slideDone; a.slideDone = null;
    if (f) f();
  }
}

function heroWalk(h, path, done){
  let k = 0;
  const step = () => {
    if (k >= path.length || h.moveLeft <= 0 || !h.alive){ finishStep(); return; }
    const [nx,ny] = path[k];
    // a shut door stops you where you stand — opening it is free, walking on is not
    const dr = doorBetween(h.x, h.y, nx, ny);
    if (dr && !dr.open){ openDoorAt(h, dr); finishStep(); return; }
    const occ = actorAt(nx,ny);
    const last = k === path.length - 1;
    if (furnAt(nx,ny) || trapBlocks(nx,ny) || (occ && (!bodyPassable(h, occ) || last))){ finishStep(); return; }
    k++;
    const ox = h.x, oy = h.y;
    h.facing = nx > ox ? 1 : nx < ox ? -1 : h.facing;
    sfx('step');
    slide(h, nx, ny, 150, () => {
      h.moveLeft--;
      const npc = G.q.actors.find(a => a.kind === 'npc' && a.follow === h.id && a.alive);
      // they take the square you just left — which is how you swap past them
      if (npc){
        const there = actorAt(ox, oy);
        if (!there || there === npc) slide(npc, ox, oy, 150, null);
      }
      recomputeVision();
      focusOn(h.x, h.y);
      const tr = trapAt(h.x, h.y);
      if (tr){ springTrap(h, tr, step); return; }
      later(30, step);
    });
  };
  const finishStep = () => {
    recomputeVision();
    mimicWatch();                       // something in this room was not furniture
    refreshField();
    checkQuestState();
    renderHUD();
    if (done) done();
    bodyWatch(h);                       // you are standing on somebody
    coffinWatch(h);                     // and somebody has been banking in that
  };
  step();
}

function refreshField(){
  const h = activeHero();
  G.q.field = h && h.alive && h.moveLeft > 0 ? walkFieldSafe(h.x, h.y, h.moveLeft, h) : { d:new Map(), from:new Map() };
}
// The field you may *end* on: squeezing past a companion is fine, standing on
// one is not, and a fallen block is not a square at all.
function walkFieldSafe(x, y, n, mover, flying){
  const f = walkField(x, y, n, mover, flying);
  for (const [k] of [...f.d]){
    const tx = k % W, ty = (k/W)|0;
    const occ = actorAt(tx,ty);
    if (trapBlocks(tx,ty) || (occ && occ !== mover) || furnAt(tx,ty)) f.d.delete(k);
  }
  return f;
}

/* ------------------------------------------------------------------ traps */

// What a trap actually takes, once the marks and the relics have their say.
function trapBite(n){
  let d = n;
  if (curseHas('thin')) d += 1;
  if (relicHas('anvil')) d -= 1;
  return Math.max(1, d);
}
function springTrap(h, tr, cont){
  tr.sprung = true; tr.found = true;
  if (G.q) G.q.lastKiller = tr.t === 'pit' ? 'a pit' : tr.t === 'spear' ? 'a spear trap' : 'a falling block';
  sfx('trap'); G.shake = 14;
  if (tr.t === 'pit'){
    if (h.gear.rope){
      say(`${h.name} drops into a pit — and is out again on the rope.`, 'bad');
      spark(h.x, h.y, 14, '#6b5a3c');
      hurt(h, trapBite(1), () => later(220, cont));
      return;
    }
    say(`${h.name} falls into a pit! −1 Body Point, and there the movement ends.`, 'bad');
    spark(h.x, h.y, 18, '#4a3a28');
    h.moveLeft = 0;
    hurt(h, trapBite(1), () => later(260, cont));
  } else if (tr.t === 'spear'){
    say(`Spears burst from the wall! ${h.name} loses 2 Body Points.`, 'bad');
    spark(h.x, h.y, 20, '#c8ccd2', { spd:.02 });
    hurt(h, trapBite(2), () => later(260, cont));
  } else {
    say(`A block of stone crashes down — 3 Body Points, and the way is shut.`, 'bad');
    spark(h.x, h.y, 26, '#6a6258', { spd:.018 });
    const back = lastFreeNeighbour(h);
    h.moveLeft = 0;
    if (back) slide(h, back[0], back[1], 130, null);
    hurt(h, trapBite(3), () => later(280, cont));
  }
}
function lastFreeNeighbour(h){
  for (const [dx,dy] of DIRS){
    const nx = h.x+dx, ny = h.y+dy;
    if (linked(h.x,h.y,nx,ny) && !blocked(nx,ny) && !trapBlocks(nx,ny)) return [nx,ny];
  }
  return null;
}

/* ----------------------------------------------------------------- combat */

function adjacentMonster(h){
  for (const [dx,dy] of DIRS){
    const m = actorAt(h.x+dx, h.y+dy);
    if (m && m.kind === 'monster' && m.alive && linked(h.x,h.y,h.x+dx,h.y+dy)) return m;
  }
  return null;
}
// Why this hero cannot hit that monster — null when they can. Everything that
// refuses an attack goes through here, so the player is told the real reason
// rather than the first guess.
function strikeBlocker(h, m){
  if (!h || !h.alive) return 'nohero';
  if (!m || !m.alive) return 'gone';
  if (h.acted) return 'acted';
  const w = weaponOf(h);
  const dx = Math.abs(h.x-m.x), dy = Math.abs(h.y-m.y);
  const orth = (dx+dy) === 1 && linked(h.x,h.y,m.x,m.y);
  const diag = dx <= 1 && dy <= 1 && (dx+dy) > 0;
  const seen = tileVisible(m.x,m.y) && hasLOS(h.x,h.y,m.x,m.y);
  if (w.ranged){
    if (adjacentMonster(h)) return 'crowded';
    return seen ? null : 'sight';
  }
  if (w.thrown && !orth) return seen ? null : 'sight';
  if (w.diag) return (orth || (diag && hasLOS(h.x,h.y,m.x,m.y))) ? null : 'range';
  return orth ? null : 'range';
}
function canStrike(h, m){ return !strikeBlocker(h, m); }

function strikeReason(h, m, code){
  const w = weaponOf(h);
  switch (code){
    case 'acted':   return `${h.name} has already taken an action this turn.`;
    case 'crowded': return `The ${w.name.toLowerCase()} cannot be fired with something this close.`;
    case 'sight':   return `${h.name} has no clear shot at the ${m.name}.`;
    case 'range':   return `The ${m.name} is out of reach.`;
    case 'gone':    return 'It is already down.';
    default:        return 'Nothing to strike there.';
  }
}

function doAttack(h, m){
  if (!canStrike(h, m)) return false;
  h.acted = true;
  G.q.lastStriker = h.id;
  h.facing = m.x > h.x ? 1 : m.x < h.x ? -1 : h.facing;
  setMood('fight');
  const n = attackDice(h, m);
  const ghost = MONSTERS[m.mt] && MONSTERS[m.mt].ethereal && !weaponOf(h).spirit;
  const immune = (m.spirit && !weaponOf(h).spirit) || ghost;
  const calc = (a, d) => {
    const skulls = countSkulls(a), blocks = countShields(d, false);
    let dmg = immune ? 0 : Math.max(0, skulls - blocks);
    const savage = n >= 2 && skulls === n && !immune && dmg > 0;
    return { dmg, savage, sub: immune ? 'The blow passes through him'
      : savage ? `SAVAGE — ${dmg} Body Point${dmg>1?'s':''}`
      : dmg > 0 ? `${dmg} Body Point${dmg>1?'s':''}` : 'Turned aside' };
  };
  let r = calc(rollCombat(0), []);
  let extra = 0;
  if (m.mt === 'chaos' && !m.parried){ m.parried = 1; extra = 2; }   // the first blow is turned
  const atk = rollCombat(n), def = rollCombat(m.def + extra);
  r = calc(atk, def);
  if (extra) say(`${m.name} turns the first blow of the turn aside.`, '');
  if (h.buffs.courage) delete h.buffs.courage;
  if (h.cursed) delete h.cursed;
  const reroll = (na, nd) => { r = calc(na, nd); if (G.dice) G.dice.sub = r.sub; };
  showDice('attack', atk, def, `${h.name} vs ${m.name}`, r.sub, () => {
    const dmg = r.dmg, savage = r.savage;
    lungeAt(h, m.x, m.y);
    const dir = [Math.sign(m.x - h.x), Math.sign(m.y - h.y)];
    if (immune){
      say(ghost
        ? `Your steel goes through ${m.name} and out the other side. Only magic touches a thing like that.`
        : `Your steel passes through ${m.name} like smoke. Only the Spirit Blade will bite.`, 'magic');
      spark(m.x, m.y, 14, '#9a86e0', { glow:'rgba(154,134,224,.4)', r:1.2 });
      sfx('block');
    } else if (dmg > 0){
      sfx('hit');
      G.shake = (savage ? 16 : 7) + dmg*3;
      hitStop(savage ? 150 : 70);
      m.sleep = 0;
      spark(m.x, m.y, savage ? 22 : 12, '#a01d14', { spd:.026, dir, up:.002, life:640 });
      // a pack goblin scatters the moment it is bloodied
      if (m.mt === 'goblin' && m.bp - dmg > 0) m.skittish = 1;
      if (savage){
        banner('SAVAGE', `${h.name} opens up the ${m.name}`);
        spark(m.x, m.y, 16, '#ffd07a', { spd:.03, dir, glow:'rgba(255,190,90,.45)', r:1.6, life:700 });
      }
      hurt(m, dmg, null);
    } else {
      sfx('block');
      say(`${m.name} turns the blow aside.`, '');
      spark(m.x, m.y, 8, '#c8ccd2', { spd:.014 });
    }
    refreshField(); renderHUD(); checkQuestState();
  }, reroll);
  return true;
}

function monsterAttack(m, h, done){
  if (G.q) G.q.lastKiller = m.name;
  if (h.buffs.veil){
    say(`The mist swallows ${h.name} — ${m.name} strikes at nothing.`, 'magic');
    later(300, done); return;
  }
  m.facing = h.x > m.x ? 1 : h.x < m.x ? -1 : m.facing;
  const calc = (a, d) => {
    const dmg = Math.max(0, countSkulls(a) - countShields(d, true));
    return { dmg, sub: dmg > 0 ? `${h.name} loses ${dmg}` : `${h.name} holds` };
  };
  // a cultist beside it makes anything braver
  const zeal = monstersOf().some(o => o !== m && MONSTERS[o.mt] && MONSTERS[o.mt].herald
                                      && Math.abs(o.x-m.x) <= 1 && Math.abs(o.y-m.y) <= 1) ? 1 : 0;
  const atk = rollCombat(m.atk + zeal), def = rollCombat(defendDice(h));
  let r = calc(atk, def);
  const reroll = (na, nd) => { r = calc(na, nd); if (G.dice) G.dice.sub = r.sub; };
  showDice('defend', atk, def, `${m.name} vs ${h.name}`, r.sub, () => {
    lungeAt(m, h.x, h.y);
    const dmg = r.dmg;
    if (dmg > 0){
      sfx('hit'); G.shake = 8 + dmg*3; hitStop(60 + dmg*24);
      spark(h.x, h.y, 10 + dmg*4, '#a01d14',
            { spd:.024, dir:[Math.sign(h.x-m.x), Math.sign(h.y-m.y)], life:640 });
      if (m.mt === 'mummy' && !h.cursed){
        h.cursed = 1;
        say(`The ${m.name}'s touch clings — ${h.name}'s next attack rolls one die fewer.`, 'bad');
      }
      if (m.affix === 'venomous' && !h.poison){
        h.poison = 2;
        say(`${h.name} is poisoned — it will keep bleeding.`, 'bad');
      }
      if (m.affix === 'vampiric' && m.bp < m.bpMax){
        m.bp = Math.min(m.bpMax, m.bp + 1);
        floatText(m.x, m.y, '+1', '#c0392b');
      }
      hurt(h, dmg, null);
    }
    else { sfx('block'); spark(h.x, h.y, 8, '#dfe4ea', { spd:.012 }); }
    renderHUD();
    later(220, done);
  }, reroll);
}

function hurt(a, n, done){
  a.bp -= n;
  a.hurtT = 280;
  if (a.kind === 'hero' && trialActive() && G.q.trial.kind === 'clean')
    failTrial(`${a.name} is bleeding.`);
  if (a.kind === 'hero' && G.q) G.q.streak = 0;
  if (a.bp <= 0 && a.kind === 'hero' && relicHas('coin') && G.run && !G.run.coinUsed){
    G.run.coinUsed = 1; a.bp = 1;
    say(`${a.name} pays the ferryman and is turned back at the water.`, 'good');
    spark(a.x, a.y, 26, '#d8a83c', { spd:.02, up:.005, glow:'rgba(216,168,60,.5)', r:1.8 });
    sfx('heal');
  }
  if (a.bp <= 0 && a.kind === 'hero' && boonHas('secondwind') && !G.q.secondWindUsed){
    G.q.secondWindUsed = 1; a.bp = 1;
    say(`${a.name} should be dead — and is not. Second wind.`, 'good');
    spark(a.x, a.y, 26, '#f3d488', { spd:.02, up:.005, glow:'rgba(243,212,136,.5)', r:1.8 });
    sfx('heal');
  }
  floatText(a.x, a.y, '−' + n, a.kind === 'hero' ? '#ff7a6a' : '#ffd06a', n >= 3);
  spark(a.x, a.y, 10 + n*4, a.kind === 'hero' ? '#c0392b' : '#8a1f1f', { spd:.016, up:.004 });
  if (a.bp <= 0){ kill(a); }
  else if (a.boss) bossLastWords(a);
  renderHUD();
  if (done) done();
}
function kill(a){
  // the dead do not always stay down
  if (a.kind === 'monster' && a.mt === 'zombie' && !a.risen && rnd() < .5){
    a.risen = 1; a.bp = 1;
    say(`${a.name} gets back up.`, 'bad');
    spark(a.x, a.y, 18, '#7d8f6a', { spd:.016, up:.005 });
    sfx('die'); G.shake = 8;
    return;
  }
  a.alive = false; a.deathT = 620;
  if (a.kind === 'monster'){
    sfx('die');
    G.q.pot = (G.q.pot || 0) + (MONSTERS[a.mt] ? MONSTERS[a.mt].gold : 10);
    spark(a.x, a.y, 24, '#6a1f14', { spd:.02, up:.003 });
    spark(a.x, a.y, 18, '#ffb457', { spd:.007, up:.012, life:1000, grav:-.000012,
                                     glow:'rgba(255,170,80,.28)', r:.9 });
    hitStop(60);
    say(`${a.name} falls.`, 'good');
    G.q.kills = (G.q.kills || 0) + 1;
    bumpStreak();
    a.diedIn = roomAt(a.x, a.y);                 // which room it went down in
    later(20, () => checkTrialKill(a));
    const slayer = G.q.lastStriker && livingHeroes().find(x => x.id === G.q.lastStriker);
    if (slayer){
      slayer.kills = (slayer.kills || 0) + 1;
      // the reaper's cut: what you take, you keep
      if (boonHas('reaper') && slayer.bp < slayer.bpMax){
        slayer.bp++;
        floatText(slayer.x, slayer.y, '+1', '#c0392b');
      }
      if (G.run && lessonDue(slayer)) later(700, () => showLesson(slayer));
    }
    if (a.elite){
      G.q.pot = (G.q.pot || 0) + 30;
      addFate(curseHas('watched') ? 2 : 1, `${a.name} put down`);
      if (G.q.vault >= 0 && !G.q.key){
        G.q.key = true;
        say(`${a.name} was carrying an iron key. Something on this floor is locked.`, 'good');
        spark(a.x, a.y, 22, '#d8a83c', { spd:.02, up:.004, glow:'rgba(216,168,60,.5)', r:1.6 });
      }
      spark(a.x, a.y, 20, AFFIX(a.affix).col, { spd:.022, life:800 });
    }
    if (boonHas('vampiric')){
      const near = livingHeroes().sort((p,q2) => dist2(p.x,p.y,a.x,a.y) - dist2(q2.x,q2.y,a.x,a.y))[0];
      if (near && near.bp < near.bpMax){ near.bp++; floatText(near.x, near.y, '+1', '#7de8a0'); }
    }
    if (a.boss){
      G.q.bossDead = true;
      addFate(2, 'the master of this floor is dead');
      sfx('boss'); G.shake = 26;
      spark(a.x, a.y, 46, '#e0b040', { spd:.03, glow:'rgba(224,176,64,.5)', r:2.2, life:900 });
      say(`${a.name} is destroyed!`, 'good');
    }
    const npc = null;
  } else if (a.kind === 'hero'){
    heroFalls(a);
  }
  later(40, checkQuestState);
}

/* -------------------------------------------------------------- 9c. A FALL */
// Losing a hero is the biggest thing that happens in a run and it used to go
// past in one log line. It gets its own beat now: the world stops, the camera
// goes to them, the party turns to look, and the floor remembers the name.

function heroFalls(a){
  sfx('heroDie');
  if (G.q) G.q.lastKiller = G.q.lastKiller || null;
  const by = (G.q && G.q.lastKiller) || 'the dark';
  if (G.run) G.run.lastFall = { who:a.name, by, depth:G.run.depth };
  a.done = true;
  a.fellTo = by;

  // the floor keeps its own list, so the run line can say who is gone
  if (G.q){
    if (!G.q.fallen) G.q.fallen = [];
    if (!G.q.fallen.some(f => f.id === a.id)) G.q.fallen.push({ id:a.id, name:a.name, by });
    // and the square keeps them. A hero's death should be somewhere on the
    // board for the rest of the floor, not a banner that goes past.
    if (!G.q.bodies) G.q.bodies = [];
    if (!G.q.bodies.some(b => b.id === a.id))
      // what they were carrying goes down with them, and can be picked back up
      G.q.bodies.push({ id:a.id, name:a.name, x:a.x, y:a.y, by, t:0,
        weapon: a.weapon || null,
        items: Object.assign({}, a.items || {}),
        taken: false });
    G.q.streak = 0;
  }

  banner(a.name, `cut down by ${by}`);
  say(`${a.name} falls, and does not get up.`, 'bad');
  spark(a.x, a.y, 30, '#7a1f14', { spd:.02, life:800 });
  spark(a.x, a.y, 16, '#3a2a24', { spd:.006, up:.010, life:1400, grav:-.000006, r:1.4 });
  G.shake = Math.max(G.shake, 26);
  hitStop(520);                            // the longest the game ever stops
  focusOn(a.x, a.y);
  G.camPunch = 1.6;
  // the party turns to look at where they were standing
  for (const h of livingHeroes()) lungeAt(h, a.x, a.y);
  setMood('fight');

  const npc = G.q.actors.find(x => x.kind === 'npc' && x.follow === a.id);
  if (npc){
    const other = livingHeroes()[0];
    npc.follow = other ? other.id : null;
  }
  renderHUD();
  return a;
}

/* ------------------------------------------------------------- activation */

function beginHeroActivation(h){
  G.q.activeId = h.id;
  h.buffs.rockskin = 0; delete h.buffs.rockskin;
  h.buffs.veil = 0; delete h.buffs.veil;
  h.acted = false;
  focusOn(h.x, h.y);
  // Webbing costs the whole turn. No roll, no defence — the most expensive
  // thing a spider can take off you is the thing it takes.
  if (h.webbed){
    h.webbed = 0; h.rolled = true; h.moveLeft = 0; h.acted = true;
    say(`${h.name} spends the turn cutting out of the webbing.`, 'bad');
    sfx('search');
    spark(h.x, h.y, 12, '#cfd6e2', { spd:.012, life:600 });
    refreshField(); renderHUD();
    return;
  }
  if (!h.rolled){
    const a = 1+ri(6), b = 1+ri(6);
    let total = a + b - moveSlow(h) + (boonHas('swiftboots') ? 1 : 0);
    if (h.picks) total += h.picks.filter(p => p === 'fleet').length*2;
    if (curseHas('heavy')) total -= 1;
    total = Math.max(1, total);
    showMoveDice(a, b, () => {
      h.rolled = true; h.moveLeft = total;
      refreshField(); renderHUD();
      if (G.q.field && G.q.field.d.size <= 1) say(`${h.name} is hemmed in — move somebody else first.`, 'bad');
      else say(`${h.name} may move ${total} squares.`, '');
    });
  } else { refreshField(); renderHUD(); }
  if (h.rolled && h.moveLeft > 0 && G.q.field && G.q.field.d.size <= 1)
    say(`${h.name} is hemmed in — move somebody else first.`, 'bad');
}
function selectHero(id){
  const h = G.q.actors.find(a => a.kind === 'hero' && a.id === id);
  if (!h || !h.alive || h.done || busy() || G.q.phase !== 'hero') return;
  if (G.q.activeId === id) { focusOn(h.x, h.y); return; }
  sfx('ui');
  beginHeroActivation(h);
}
function endHeroTurn(){
  const h = activeHero();
  if (!h || busy()) return;
  h.done = true; h.moveLeft = 0;
  if (G.q.push && G.q.push.hero === h.id) G.q.push.done = true;
  sfx('ui');
  const next = G.q.actors.find(a => a.kind === 'hero' && a.alive && !a.done);
  if (next) beginHeroActivation(next);
  else zargonTurn();
  renderHUD();
}

/* ------------------------------------------------------------ the Warlock */

function zargonTurn(){
  G.q.phase = 'monster';
  G.q.field = null;
  renderHUD();
