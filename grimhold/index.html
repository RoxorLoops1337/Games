const K_CAMP = 'grimhold_camp_v1', K_RUN = 'grimhold_run_v1';

function saveCampaign(){
  try { localStorage.setItem(K_CAMP, JSON.stringify(G.camp)); } catch(e){}
}
function migrateCamp(c){
  if (!c || !Array.isArray(c.heroes) || c.heroes.length !== HERO_DEFS.length) return newCampaign();
  const fresh = newCampaign();
  fresh.gold = c.gold|0;
  fresh.done = Array.isArray(c.done) ? c.done.filter(n => n >= 0 && n < QUESTS.length) : [];
  fresh.unlocked = clamp(c.unlocked|0 || 1, 1, QUESTS.length);
  fresh.heroes = fresh.heroes.map(h => {
    const old = c.heroes.find(x => x && x.id === h.id);
    if (!old) return h;
    if (WEAPONS[old.weapon]) h.weapon = old.weapon;
    if (ARMOURS[old.armour]) h.armour = old.armour;
    h.gear = Object.assign({}, old.gear || {});
    h.items = Object.assign({ potion:0, holy:0 }, old.items || {});
    return h;
  });
  return fresh;
}
function loadCampaign(){
  try {
    const s = localStorage.getItem(K_CAMP);
    if (s) return migrateCamp(JSON.parse(s));
  } catch(e){}
  return newCampaign();
}
function saveRun(){
  if (!G.q || G.q.over) return;
  try {
    const q = Object.assign({}, G.q);
    delete q.vis; delete q.field;
    q.actors = G.q.actors.map(a => a.kind === 'hero' ? { ref:a.id } : a);
    localStorage.setItem(K_RUN, JSON.stringify({ q, camp:G.camp, cam:G.cam }));
  } catch(e){}
}
function hasRun(){ try { return !!localStorage.getItem(K_RUN); } catch(e){ return false; } }
function clearRun(){ try { localStorage.removeItem(K_RUN); } catch(e){} }
function resumeRun(){
  let s = null;
  try { s = JSON.parse(localStorage.getItem(K_RUN)); } catch(e){}
  if (!s || !s.q){ showQuestSelect(); return false; }
  G.camp = migrateCamp(s.camp);
  // the saved heroes hold their in-quest condition; put it back on the roster
  const savedHeroes = (s.camp && s.camp.heroes) || [];
  for (const h of G.camp.heroes){
    const old = savedHeroes.find(x => x && x.id === h.id);
    if (!old) continue;
    h.bp = old.bp === undefined ? h.bpMax : old.bp;
    h.mp = old.mp === undefined ? h.mpMax : old.mp;
    h.alive = old.alive !== false;
    h.x = old.x|0; h.y = old.y|0;
    h.moveLeft = old.moveLeft|0; h.rolled = !!old.rolled;
    h.acted = !!old.acted; h.done = !!old.done;
    h.spent = Array.isArray(old.spent) ? old.spent.slice() : [];
    h.buffs = Object.assign({}, old.buffs || {});
    h.quests = Array.isArray(old.quests) ? old.quests.slice() : [];
    if (old.stowed) h.stowed = old.stowed;
    if (WEAPONS[old.weapon]) h.weapon = old.weapon;
    h.kind = 'hero';
  }
  G.q = s.q;
  G.q.actors = s.q.actors.map(a => a.ref ? G.camp.heroes.find(h => h.id === a.ref) : a).filter(Boolean);
  G.cam = s.cam || { x:0, y:0, z:1 };
  G.fx = []; G.timers = []; G.dice = null; G.aim = null; G.shake = 0;
  bakeDungeon(1234 + G.q.qi*991);
  recomputeVision(); refreshField();
  if (!HEADLESS){
    $('scTitle').classList.remove('on');
    closeModal();
    $('hud').classList.add('on');
  }
  setMood('explore');
  renderHUD(); renderLog();
  return true;
}

/* ------------------------------------------------------------ 14. THE LOOP */

function update(dt){
  TT0 += dt;
  if (!G) return;
  for (let i = G.timers.length - 1; i >= 0; i--){
    const T = G.timers[i];
    T.t -= dt;
    if (T.t <= 0){ G.timers.splice(i,1); T.fn(); }
  }
  if (G.dice) G.dice.t += dt;
  if (G.shake > 0) G.shake = Math.max(0, G.shake - dt*.055);
  if (!G.q) return;
  let dropped = false;
  for (let i = G.q.log.length - 1; i >= 0; i--){
    G.q.log[i].t += dt;
    if (G.q.log[i].t > 5200){ G.q.log.splice(i,1); dropped = true; }
  }
  if (dropped) renderLog();

  for (const a of G.q.actors){
    tickSlide(a, dt);
    if (a.hurtT > 0) a.hurtT -= dt;
    if (a.deathT > 0) a.deathT -= dt;
  }
  for (let i = G.fx.length - 1; i >= 0; i--){
    const p = G.fx[i];
    p.life -= dt;
    if (p.life <= 0){ G.fx.splice(i,1); continue; }
    p.x += p.vx*dt; p.y += p.vy*dt;
    p.vy += (p.grav||0)*dt;
  }
  // dust in the torchlight
  if (!HEADLESS && G.fx.length < 90 && Math.random() < .22){
    const hs = livingHeroes();
    if (hs.length){
      const h = hs[(Math.random()*hs.length)|0];
      G.fx.push({ x:h.x + .5 + (Math.random()-.5)*5, y:h.y + .5 + (Math.random()-.5)*5,
        vx:(Math.random()-.5)*.0006, vy:-.0004 - Math.random()*.0006,
        life:2600, max:2600, col:'rgba(255,220,170,.30)', size:1.5, grav:0 });
    }
  }
  // camera drift toward its mark
  if (G.cam.tx !== null && G.cam.tx !== undefined){
    G.cam.x = lerp(G.cam.x, G.cam.tx, Math.min(1, dt*.006));
    G.cam.y = lerp(G.cam.y, G.cam.ty, Math.min(1, dt*.006));
    if (Math.abs(G.cam.x - G.cam.tx) < .6 && Math.abs(G.cam.y - G.cam.ty) < .6){ G.cam.tx = G.cam.ty = null; }
    clampCam();
  }
  if (AC) musicTick(AC.currentTime);
  syncHUD();
}

// The HUD used to be repainted only at the points somebody remembered to call
// renderHUD. A timer draining after a kill left the buttons greyed with nothing
// scheduled to un-grey them. Now the frame loop watches the state that the HUD
// actually shows and repaints when any of it moves.
let hudSig = '';
function hudState(){
  if (!G || !G.q) return '';
  const h = activeHero();
  const p = [G.q.phase, G.q.turn, G.q.activeId, busy()?1:0, G.q.over,
             G.aim ? (G.aim.key || G.aim.kind) : '', G.camp.gold, G.q.pot|0];
  if (h) p.push(h.acted?1:0, h.moveLeft, h.rolled?1:0, roomAt(h.x,h.y),
                disarmTarget()?1:0, knownSpells(h).filter(k => spellReady(h,k)).length,
                (h.items.potion||0) + (h.items.holy||0));
  for (const x of heroes()) p.push(x.bp, x.alive?1:0, x.done?1:0, Object.keys(x.buffs).sort().join('.'));
  return p.join('|');
}
function syncHUD(){
  const sig = hudState();
  if (sig === hudSig) return false;
  hudSig = sig; renderHUD();
  return true;
}

let lastT = 0, frameErrs = 0;
function frame(ts){
  const dt = Math.min(48, ts - lastT || 16);
  lastT = ts;
  // A slip in update or draw must never end the loop — a frozen board is the
  // one failure a player cannot recover from. Log it once and carry on.
  try { update(dt); draw(); }
  catch (e){
    if (frameErrs++ === 0 && typeof console !== 'undefined' && console.error)
      console.error('Grimhold: frame error', e);
    if (frameErrs === 1) G.fx.length = 0;      // most often a bad particle
  }
  requestAnimationFrame(frame);
}

/* -------------------------------------------------------------- 15. BOOT */

function newG(){
  return { camp:newCampaign(), q:null, fx:[], timers:[], dice:null, aim:null,
           shake:0, cam:{ x:0, y:0, z:1, tx:null, ty:null }, busy };
}
function setRng(f){ rnd = f || Math.random; }

function boot(){
  G = newG();
  G.camp = loadCampaign();
  initCanvas();
  bindInput();
  showTitle();
  requestAnimationFrame(frame);
}

if (HEADLESS){
  G = newG();
  initCanvas();
} else {
  boot();
}

globalThis.HQ = {

  newG, newCampaign, mkHero, startQuest, launchQuest, boot, setRng,

  strikeBlocker, strikeReason,
  tapTile, selectHero, endHeroTurn, zargonTurn, monsterAct, heroWalk, refreshField,
  doAttack, canStrike, monsterAttack, hurt, kill, attackDice, defendDice, moveSlow,
  rollCombat, combatDie, countSkulls, countShields,
  castSpell, knownSpells, spellReady, searchTreasure, searchTraps, disarmTrap, disarmTarget,
  quaffPotion, useHolyWater, applyTreasure, spawnWanderer, openDoorAt, springTrap, giveQuestItem,
  objectiveReady, needsEscape, onStairs, checkQuestState, questOver, showQuestEnd,
