<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>RUSTGRIFT</title>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#120c08">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Permanent+Marker&family=Bangers&family=Patrick+Hand&display=swap" rel="stylesheet">
<style>
html,body{margin:0;height:100%;background:#120c08;overflow:hidden;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
canvas{display:block;touch-action:none;user-select:none}
#rot{display:none;position:fixed;left:0;right:0;top:0;padding:10px 14px;text-align:center;font:700 15px/1.3 system-ui,sans-serif;color:#fff;background:#f06aa0;z-index:9}
@media (orientation:portrait){#rot{display:block}}
</style>
</head>
<body>
<div id="rot" onclick="this.remove()">Turn your phone sideways for a bigger game (tap to dismiss)</div>
<div id="wrap"><canvas id="c"></canvas></div>
<script src="js/core.js"></script>
<script src="js/art.js"></script>
<script src="js/style.js"></script>
<script src="js/data.js"></script>
<script src="js/sprites.js"></script>
<script src="js/battle.js"></script>
<script src="js/negotiation.js"></script>
<script src="js/scenes.js"></script>
<script src="js/art_humans.js"></script>
<script src="js/art_creatures.js"></script>
<script src="js/art_env.js"></script>
<script src="js/art_ui.js"></script>
<script src="js/art_fx.js"></script>
<script src="js/art_icons.js"></script>
<script src="js/art_scenes.js"></script>
<script src="js/main.js"></script>
</body>
</html>
