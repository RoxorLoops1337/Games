  rr(c, x + pad, B.name, w - pad * 2, 16, 4); c.fill();
  txt(c, def.name, x + w / 2, B.name + 8.5, 9.5, '#efeaff', 'center', 800, .5);

  // the three numbers that decide a fight, and the voice that decides the tune
  txt(c, def.hp, x + 15, B.stat, 12, '#a6ff5e', 'center', 800);
  txt(c, def.atk + card.plus, x + w - 15, B.stat, 12, '#ffc94d', 'center', 800);
  txt(c, VOICE_LABEL[def.voice] || '', x + w / 2, B.stat, 8.5, rgba(def.tint, .95), 'center', 800, .5);

  // the rule, shown whole or not at all -- a rule cut off mid-sentence prices
  // the card wrong, and on a hand card there is no way to read the rest
  const rule = def.text || '';
  if (rule) {
    c.save();
    const lh = 9;
    const maxLines = Math.max(1, Math.floor(ruleRoom / lh));
    let size = 8;
    let lines = wrapText(c, rule, w - 12, size);
    while (lines.length > maxLines && size > 6.2) { size -= 0.5; lines = wrapText(c, rule, w - 12, size); }
    c.font = '600 ' + size + 'px ui-monospace,Menlo,monospace';
    c.fillStyle = '#a79ccb'; c.textAlign = 'center'; c.textBaseline = 'middle';
    const shown = lines.slice(0, maxLines);
    const y0 = B.rule + ruleRoom / 2 - ((shown.length - 1) * lh) / 2;
    for (let i = 0; i < shown.length; i++) c.fillText(shown[i], x + w / 2, y0 + i * lh);
    c.restore();
  }
  c.restore();
}
// wrap on words, and break a word that is wider than the line rather than
// letting it run off the card
function wrapText(c, str, maxW, size) {
  c.save();
  c.font = '600 ' + size + 'px ui-monospace,Menlo,monospace';
  const out = [];
  let line = '';
  for (const word of String(str).split(' ')) {
    const test = line ? line + ' ' + word : word;
    if (c.measureText(test).width <= maxW || !line) {
      if (c.measureText(test).width > maxW && !line) {
        let part = '';
        for (const ch of word) {
          if (c.measureText(part + ch).width > maxW && part) { out.push(part); part = ch; }
          else part += ch;
        }
        line = part;
      } else line = test;
    } else { out.push(line); line = word; }
  }
  if (line) out.push(line);
  c.restore();
  return out;
}

const VOICE_LABEL = { kick: 'KICK', snare: 'SNARE', hat: 'HAT', bass: 'BASS', lead: 'LEAD', pad: 'PAD', vox_rox: 'ROX', vox_jas: 'JAS', bell: 'BELL', grit: 'GRIT', sub: 'SUB' };

function drawHand(c, L, S) {
  const n = S.hand.length;
  for (let i = 0; i < n; i++) {
    if (G.drag && G.drag.i === i) continue;
    const r = L.handRect(i, n);
    const sel = G.sel === i;
    const state = sel ? 'sel' : canPlay(S, i) ? '' : 'poor';
    const lift = sel ? 14 : 0;
    drawCard(c, r.x, r.y - lift, r.w, r.h, S.hand[i], state);
  }
  if (G.drag) {
    const r = L.handRect(0, 1);
    drawCard(c, G.drag.x - r.w / 2, G.drag.y - r.h / 2, r.w, r.h, G.drag.card, 'sel');
  }
}

/* ---- HUD ---------------------------------------------------------------- */
function drawHUD(c, L, S) {
  const R = G.run;
  c.fillStyle = 'rgba(7,6,13,.72)';
  c.fillRect(0, 0, L.W, L.hud.h);
  c.strokeStyle = 'rgba(255,255,255,.08)'; c.lineWidth = 1;
  c.beginPath(); c.moveTo(0, L.hud.h); c.lineTo(L.W, L.hud.h); c.stroke();

  // the set: your health, named for what it is
  txt(c, 'SET', 18, 18, 10, '#6d6394', 'left', 800, 1.4);
  bar(c, 18, 28, 132, 12, S.hp / S.maxHp, S.hp / S.maxHp < .3 ? '#ff5a4a' : '#a6ff5e');
  txt(c, S.hp + '/' + S.maxHp, 84, 34, 10, '#07060d', 'center', 900);

  // energy as pips, because you count energy and you read a bar
  txt(c, 'ENERGY', 172, 18, 10, '#6d6394', 'left', 800, 1.4);
  for (let i = 0; i < S.maxEnergy; i++) {
    const on = i < S.energy;
    c.fillStyle = on ? '#ffc94d' : 'rgba(255,255,255,.10)';
    circ(c, 178 + i * 19, 34, on ? 7.5 : 6); c.fill();
  }

  // where you are
  const act = ACTS[S.actI];
  txt(c, act.name, L.cx, 18, 11, '#a79ccb', 'center', 800, 1.6);
  txt(c, S.boss ? 'BOSS' : 'STAGE ' + (S.stageI + 1) + ' / ' + STAGES_PER_ACT, L.cx, 36, 12, S.boss ? '#ff2e88' : '#efeaff', 'center', 900, 1.2);

  txt(c, act.bpm + ' BPM', L.W - 18, 18, 10, '#6d6394', 'right', 800, 1.2);
  txt(c, 'FOES ' + sideUnits(S, 'them').length, L.W - 18, 36, 11, '#ff6bb0', 'right', 800, 1);

  // ---- the crowd meter. The loudest thing on the screen, on purpose.
  const cw = L.crowd;
  const frac = S.crowd / 100;
  c.fillStyle = '#0b0917'; rr(c, cw.x, cw.y, cw.w, cw.h, 7); c.fill();
  if (frac > 0) {
    const g = c.createLinearGradient(cw.x, 0, cw.x + cw.w, 0);
    g.addColorStop(0, '#7a1d55'); g.addColorStop(.6, '#ff2e88'); g.addColorStop(1, '#ffc94d');
    c.fillStyle = g; rr(c, cw.x, cw.y, Math.max(cw.h, cw.w * frac), cw.h, 7); c.fill();
  }
  if (S.drop > 0) {
    c.save(); c.globalCompositeOperation = 'lighter';
    c.fillStyle = rgba('#ff2e88', .25 + Math.sin(G.t * .02) * .2);
    rr(c, cw.x, cw.y, cw.w, cw.h, 7); c.fill(); c.restore();
  }
  c.strokeStyle = 'rgba(255,255,255,.14)'; c.lineWidth = 1; rr(c, cw.x, cw.y, cw.w, cw.h, 7); c.stroke();
  txt(c, S.drop > 0 ? 'DROP  x' + S.drop : 'CROWD', cw.x + 10, cw.y + cw.h / 2 + .5, 9, S.drop > 0 ? '#fff' : 'rgba(255,255,255,.7)', 'left', 900, 1.4);
  txt(c, Math.round(S.crowd) + '%', cw.x + cw.w - 10, cw.y + cw.h / 2 + .5, 9, 'rgba(255,255,255,.8)', 'right', 900, 1);
}

/* ---- the beat rail: the only timing cue, so it has to be unmissable ---- */
function drawBeatRail(c, L, S) {
  const b = A.running ? beatNow() : 0;
  const ph = b - Math.floor(b);
  const cur = ((Math.floor(b) % BEATS_PER_BAR) + BEATS_PER_BAR) % BEATS_PER_BAR;
  const y = L.beat.y, spacing = 46, x0 = L.cx - spacing * 1.5;
  for (let i = 0; i < BEATS_PER_BAR; i++) {
    const x = x0 + i * spacing;
    const isCur = i === cur;
    const hit = isCur ? Math.pow(1 - ph, 4) : 0;
    c.fillStyle = i === 0 ? 'rgba(255,201,77,.24)' : 'rgba(255,255,255,.12)';
    circ(c, x, y, L.beat.r); c.fill();
    c.strokeStyle = 'rgba(255,255,255,.14)'; c.lineWidth = 1;
    circ(c, x, y, L.beat.r); c.stroke();
    if (isCur) {
      c.save(); c.globalCompositeOperation = 'lighter';
      c.fillStyle = i === 0 ? '#ffc94d' : '#2ee6d6';
      circ(c, x, y, L.beat.r * (0.62 + hit * 1.05)); c.fill();
      c.restore();
    }
  }
  // the approach ring: shrinks onto the NEXT beat, which is what you tap to
  const nx = x0 + (((cur + 1) % BEATS_PER_BAR)) * spacing;
  c.save();
  c.strokeStyle = rgba('#ffc94d', .18 + ph * .55);
  c.lineWidth = 2;
  circ(c, nx, y, L.beat.r + (1 - ph) * 26); c.stroke();
  c.restore();

  if (S && !S.armed) {
    const p = 0.5 + Math.sin(G.t * 0.005) * 0.5;
    c.save(); c.globalAlpha = .55 + p * .45;
    txt(c, 'DRAG A CARD ONTO A SLOT', L.cx, y - 46, 13, '#efeaff', 'center', 900, 2.2);
    txt(c, 'ON THE BEAT', L.cx, y - 27, 11, '#ffc94d', 'center', 900, 2.2);
    c.restore();
  }
  if (S && S.judged && G.t - S.judged.t < 620) {
    const k = inv(G.t - S.judged.t, 0, 620);
    const col = S.judged.grade === 'perfect' ? '#ffc94d' : S.judged.grade === 'good' ? '#2ee6d6' : '#8f86b8';
    c.save(); c.globalAlpha = 1 - k;
    txt(c, S.judged.grade.toUpperCase(), L.cx, y - 26 - k * 14, 15, col, 'center', 900, 2.4);
    c.restore();
  }
}

/* ---- effects on top ----------------------------------------------------- */
function drawFX(c, L, S) {
  for (const f of G.fx) {
    const k = f.t / f.life;
    if (f.k === 'pop' && f.u) {
      const p = L.slot(f.u.side, f.u.col, f.u.row);
      c.save(); c.globalAlpha = 1 - k * k;
      const py = Math.max(L.crowd.y + L.crowd.h + 14, p.y - 58 - (f.dy || 0) - k * 32);
      txt(c, f.txt, p.x + f.dx, py, 14, f.col, 'center', 900, .5);
      c.restore();
    } else if (f.k === 'spark' && f.u) {
      const p = L.slot(f.u.side, f.u.col, f.u.row);
      c.save(); c.globalAlpha = 1 - k;
      c.fillStyle = f.col;
      const s = f.t / 1000;
      circ(c, p.x + f.vx * s, p.y - 48 + f.vy * s + 180 * s * s, 3 * (1 - k)); c.fill();
      c.restore();
    } else if (f.k === 'beam' && f.a && f.b) {
      const a = L.slot(f.a.side, f.a.col, f.a.row), b = L.slot(f.b.side, f.b.col, f.b.row);
      c.save(); c.globalAlpha = (1 - k) * .8; c.globalCompositeOperation = 'lighter';
      c.strokeStyle = f.a.tint; c.lineWidth = 3 * (1 - k) + 1; c.lineCap = 'round';
      c.beginPath(); c.moveTo(a.x, a.y - 44); c.lineTo(b.x, b.y - 44); c.stroke();
      c.restore();
    } else if (f.k === 'ring') {
      c.save(); c.globalAlpha = (1 - k) * .5; c.globalCompositeOperation = 'lighter';
      c.strokeStyle = f.col; c.lineWidth = 5 * (1 - k) + 1;
      circ(c, L.W * f.nx, L.H * f.ny, k * 340 * f.scale); c.stroke();
      c.restore();
    }
  }
  if (G.toast) {
    const k = inv(G.toast.t, 0, 1200);
    c.save(); c.globalAlpha = (1 - Math.pow(k, 3)) * .88;
    txt(c, G.toast.txt, L.cx, 118 - k * 16, 21, G.toast.col, 'center', 900, 2.6);
    c.restore();
  }
  if (G.flash > 0) { c.fillStyle = 'rgba(255,255,255,' + (G.flash * .22) + ')'; c.fillRect(0, 0, L.W, L.H); }
}

function render() {
  if (!CX) return;
  const L = layout();
  const c = CX;
  c.setTransform(DPR, 0, 0, DPR, 0, 0);
  c.clearRect(0, 0, L.W, L.H);
  const S = G.run && G.run.fight;
  if (G.shake > .1) {
    c.translate((rnd() - .5) * G.shake, (rnd() - .5) * G.shake);
  }
  drawRoom(c, L, S);
  if (S && (G.scr === 'run' || G.scr === 'reward' || G.scr === 'over')) {
    drawBoard(c, L, S);
    drawHUD(c, L, S);
    drawBeatRail(c, L, S);
    if (G.scr === 'run') drawHand(c, L, S);
    drawFX(c, L, S);
  } else {
    drawTitleArt(c, L);
  }
}

/* ================================================== S10 -- input ========= */
/* Two ways to place a card, because on a phone one of them is always wrong:
   drag it onto a slot, or tap the card and then tap the slot. Both end in the
   same playCard, so both are judged by the same clock. */

function toLogical(ev) {
  const r = CV.getBoundingClientRect();
  return { x: (ev.clientX - r.left) / r.width * G.W, y: (ev.clientY - r.top) / r.height * G.H };
}
function hitHand(L, S, p) {
  const n = S.hand.length;
  for (let i = n - 1; i >= 0; i--) {
    const r = L.handRect(i, n);
    if (p.x >= r.x && p.x <= r.x + r.w && p.y >= r.y - 18 && p.y <= r.y + r.h) return i;
  }
  return -1;
}
function hitSlot(L, p, side) {
  for (let r = 0; r < ROWS; r++) for (let col = 0; col < COLS; col++) {
    const s = L.slot(side, col, r);
    if (p.x >= s.x - s.w / 2 && p.x <= s.x + s.w / 2 && p.y >= s.y - s.h + 8 && p.y <= s.y + 40) return { col, row: r };
  }
  return null;
}

function onDown(ev) {
  ac();
  const S = G.run && G.run.fight;
  if (!S || S.over || G.scr !== 'run') return;
  const L = layout(), p = toLogical(ev);

  const hi = hitHand(L, S, p);
  if (hi >= 0) {
    if (!canPlay(S, hi)) { sfx('deny'); G.sel = -1; return; }
    G.drag = { i: hi, card: S.hand[hi], x: p.x, y: p.y };
    G.sel = hi;
    return;
  }
  // picking up a placed ally moves it
  const sl = hitSlot(L, p, 'us');
  if (sl) {
    const u = unitAt(S, 'us', sl.col, sl.row);
    if (u) { G.moving = u; G.sel = -1; return; }
    if (G.sel >= 0) { playCard(S, G.sel, sl.col, sl.row); G.sel = -1; return; }
  }
  G.sel = -1;
}
function onMove(ev) {
  const S = G.run && G.run.fight;
  if (!S) return;
  const L = layout(), p = toLogical(ev);
  if (G.drag) {
    G.drag.x = p.x; G.drag.y = p.y;
    const sl = hitSlot(L, p, 'us');
    G.hover = sl && !unitAt(S, 'us', sl.col, sl.row) ? slotIndex(sl.col, sl.row) : -1;
  } else if (G.moving) {
    const sl = hitSlot(L, p, 'us');
    G.hover = sl && !unitAt(S, 'us', sl.col, sl.row) ? slotIndex(sl.col, sl.row) : -1;
  }
}
function onUp(ev) {
  const S = G.run && G.run.fight;
  if (!S) { G.drag = null; G.moving = null; G.hover = -1; return; }
  const L = layout(), p = toLogical(ev);
  if (G.drag) {
    const sl = hitSlot(L, p, 'us');
    if (sl && !unitAt(S, 'us', sl.col, sl.row)) { playCard(S, G.drag.i, sl.col, sl.row); G.sel = -1; }
    G.drag = null; G.hover = -1;
    return;
  }
  if (G.moving) {
    const sl = hitSlot(L, p, 'us');
    if (sl && !unitAt(S, 'us', sl.col, sl.row)) moveUnit(S, G.moving, sl.col, sl.row);
    G.moving = null; G.hover = -1;
  }
}
function bindInput() {
  if (HEADLESS || !CV) return;
  CV.addEventListener('pointerdown', e => { e.preventDefault(); try { CV.setPointerCapture(e.pointerId); } catch (x) {} onDown(e); });
  CV.addEventListener('pointermove', e => { e.preventDefault(); onMove(e); });
  CV.addEventListener('pointerup', e => { e.preventDefault(); onUp(e); });
  CV.addEventListener('pointercancel', () => { G.drag = null; G.moving = null; G.hover = -1; });
  window.addEventListener('keydown', e => {
    const S = G.run && G.run.fight;
    if (e.key === 'm') { G.muted = !G.muted; toast(G.muted ? 'MUTED' : 'SOUND ON', '#a79ccb'); }
    if (!S || G.scr !== 'run') return;
    const n = parseInt(e.key, 10);
    if (n >= 1 && n <= 8) { G.sel = n - 1 < S.hand.length ? n - 1 : -1; }
  });
}

/* ================================================= S11 -- screens ======== */
/* Every screen is DOM, so the text stays crisp and selectable and the canvas
   below keeps playing. The canvas never draws a button. */

const UI = () => document.getElementById('ui');
function esc(s) { return String(s).replace(/[&<>"]/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[ch])); }

function cardHTML(id, extra) {
  const d = CREW_BY[id]; if (!d) return '';
  return '<div class="cardv" data-id="' + id + '" style="--tint:' + d.tint + ';border-color:' + RCOL[d.r] + '">' +
    '<div class="cv-top"><span class="pill">' + d.cost + '</span><span class="pill ctr">' + d.ctr + '</span></div>' +
    '<canvas class="cv-art" width="200" height="130" data-art="' + d.art + '" data-tint="' + d.tint + '"></canvas>' +
    '<div class="cv-name">' + esc(d.name) + '</div>' +
    '<div class="cv-stat"><b style="color:#a6ff5e">' + d.hp + '</b> HP · <b style="color:#ffc94d">' + d.atk + '</b> ATK · ' + (VOICE_LABEL[d.voice] || '') + '</div>' +
    '<div class="cv-text">' + esc(d.text || '') + '</div>' + (extra || '') + '</div>';
}
function charmHTML(id, extra) {
  const d = CHARM_BY[id]; if (!d) return '';
  return '<div class="charmv" data-id="' + id + '" style="border-color:' + d.tint + '">' +
    '<div class="ch-name" style="color:' + d.tint + '">' + esc(d.name) + '</div>' +
    '<div class="ch-text">' + esc(d.text) + '</div>' + (extra || '') + '</div>';
}

function paintCardArt() {
  if (HEADLESS) return;
  for (const cv of UI().querySelectorAll('canvas.cv-art')) {
    const c = cv.getContext('2d'); if (!c) continue;
    c.clearRect(0, 0, cv.width, cv.height);
    c.save(); c.translate(cv.width / 2, cv.height - 8);
    drawUnit(c, cv.dataset.art, cv.dataset.tint, 110, G.t / 1000);
    c.restore();
  }
}

function screenHTML() {
  const R = G.run;
  if (G.scr === 'title') {
    const m = G.meta;
    return '<div class="screen show ttl">' +
      '<div class="tt-mid">' +
      '<div class="tt-logo">BEATBORNE</div>' +
      '<div class="tt-sub">your board is the band</div>' +
      '<div class="row" style="justify-content:center;margin-top:24px;gap:12px">' +
      '<button class="btn pri" data-a="new">' + (loadRun() ? 'NEW SET' : 'START THE SET') + '</button>' +
      (loadRun() ? '<button class="btn go" data-a="resume">RESUME</button>' : '') +
      '<button class="btn" data-a="how">HOW IT WORKS</button>' +
      '<button class="btn" data-a="collection">THE CREW</button>' +
      '</div>' +
      '<div class="sub" style="margin-top:22px;text-align:center">' +
      (m.bestScore ? 'best score ' + m.bestScore + '<br>' : '') +
      'runs ' + m.runs + ' · encores ' + m.wins + ' · perfects ' + m.perfects + ' · drops ' + m.drops +
      '</div></div></div>';
  }
  if (G.scr === 'how') {
    return '<div class="screen show"><div class="doc">' +
      '<div class="row"><h1>HOW IT WORKS</h1><div class="grow"></div>' +
      '<button class="btn" data-a="title">BACK</button></div>' +
      '<div class="hr"></div>' +
      '<h2>the counter is the rhythm</h2><p class="sub">Every unit has a COUNTER. It drops by one on every beat, and at zero the unit fires: its ability, its swing, and its VOICE. A counter of 1 is a hi-hat. A counter of 4 is a bass drum. The music you hear is your board, playing itself. Nothing is pre-recorded.</p>' +
      '<h2>the front column runs double</h2><p class="sub">Column 0, nearest the middle, ticks TWICE a beat. Forward is faster and louder and gets hit first. Moving a unit already on the board is free, so this is a question you answer every beat, not once.</p>' +
      '<h2>play on the beat</h2><p class="sub">Drag a card onto a slot, or tap the card then tap the slot. Land it on the beat for <b style="color:#ffc94d">PERFECT</b>: the unit arrives one beat from firing, and the crowd jumps. <b style="color:#2ee6d6">GOOD</b> is close. <b>LATE</b> costs you crowd.</p>' +
      '<h2>fill the crowd, take the drop</h2><p class="sub">PERFECTs, kills and some units fill the CROWD bar. At 100% the room goes off: for four beats every ally ticks three times as fast and hits for half again as much. That is where sets are won.</p>' +
      '<h2>the set</h2><p class="sub">SET is your health. A foe that reaches the middle with nothing in front of it hits the set instead. Three acts, four stages and a boss each. Between stages you take a card or a charm.</p>' +
      '<div class="row" style="margin-top:14px"><button class="btn pri" data-a="new">START THE SET</button>' +
      '<button class="btn" data-a="title">BACK</button></div>' +
      '</div></div>';
  }
  if (G.scr === 'collection') {
    const seen = G.meta.seen || {};
    const rows = CREW.map(c => {
      const known = G.meta.unlocked.indexOf(c.id) >= 0 || seen[c.id];
      return known ? cardHTML(c.id, '<div class="cv-seen">fielded ' + (seen[c.id] || 0) + '</div>')
                   : '<div class="cardv locked"><div class="cv-lock">?</div><div class="cv-name">UNKNOWN</div></div>';
    }).join('');
    const foes = FOES.concat(BOSSES).map(f => {
      const n = (G.meta.beaten || {})[f.id] || 0;
      return '<div class="foev' + (n ? '' : ' locked') + '"><b>' + (n ? esc(f.name) : '???') + '</b><span>' + (n ? n + ' downed' : 'not yet met') + '</span></div>';
    }).join('');
    return '<div class="screen show"><div class="doc wide">' +
      '<div class="row"><h1 style="font-size:22px">THE CREW</h1><div class="grow"></div><button class="btn" data-a="title">BACK</button></div>' +
      '<div class="grid">' + rows + '</div>' +
      '<h2 style="margin-top:20px">THE HUSH</h2><div class="foegrid">' + foes + '</div>' +
      '</div></div>';
  }
  if (G.scr === 'map') {
    const act = ACTS[R.act];
    const nodes = [];
    for (let i = 0; i <= STAGES_PER_ACT; i++) {
      const st = i === STAGES_PER_ACT ? 'BOSS' : String(i + 1);
      const cls = i < R.stage ? 'done' : i === R.stage ? 'now' : '';
      nodes.push('<div class="node ' + cls + '">' + st + '</div>');
    }
    return '<div class="screen show"><div class="doc">' +
      '<div class="sub">ACT ' + act.n + ' · ' + act.bpm + ' BPM</div>' +
      '<h1 style="font-size:26px">' + esc(act.name) + '</h1>' +
      '<div class="nodes">' + nodes.join('<div class="link"></div>') + '</div>' +
      '<div class="row" style="margin-top:6px"><span class="tag">SET ' + R.hp + '/' + R.maxHp + '</span><span class="tag">' + R.coin + ' COIN</span><span class="tag">' + R.deck.length + ' CARDS</span></div>' +
      (R.charms.length ? '<div class="charmrow">' + R.charms.map(c => charmHTML(c)).join('') + '</div>' : '') +
      '<div class="row" style="margin-top:16px">' +
      '<button class="btn pri" data-a="fight">' + (R.stage >= STAGES_PER_ACT ? 'FACE ' + esc(ALL_UNITS[act.boss].name) : 'PLAY STAGE ' + (R.stage + 1)) + '</button>' +
      '<button class="btn" data-a="shop">MERCH TABLE</button>' +
      '<button class="btn" data-a="deck">DECK (' + R.deck.length + ')</button>' +
      '</div></div></div>';
  }
  if (G.scr === 'deck') {
    const counts = {}; for (const id of R.deck) counts[id] = (counts[id] || 0) + 1;
    const list = Object.keys(counts).map(id => cardHTML(id, '<div class="cv-seen">x' + counts[id] + '</div>')).join('');
    return '<div class="screen show"><div class="doc wide">' +
      '<div class="row"><h1 style="font-size:22px">YOUR DECK</h1><div class="grow"></div><button class="btn" data-a="map">BACK</button></div>' +
      '<div class="grid">' + list + '</div></div></div>';
  }
  if (G.scr === 'reward') {
    const o = R.offer || rollOffer();
    if (o.taken) return '<div class="screen show"><div class="doc"><h1 style="font-size:22px">ONWARD</h1><div class="row" style="margin-top:16px"><button class="btn pri" data-a="next">CONTINUE</button></div></div></div>';
    // one row: three cards and the charm alongside them, because this is the
    // screen where you compare things against each other and the charm used to
    // sit below the fold on a 420px-high phone
    const items = o.cards.map(c => cardHTML(c.id, '<button class="btn go tiny" data-a="take" data-id="' + c.id + '">TAKE</button>'));
    if (o.charm) items.push(charmHTML(o.charm.id, '<button class="btn go tiny" data-a="takecharm" data-id="' + o.charm.id + '">TAKE</button>'));
    return '<div class="screen show"><div class="doc wide tight">' +
      '<div class="row"><h1>TAKE ONE</h1><div class="grow"></div>' +
      '<span class="sub">stage cleared · +' + (12 + (R.fight ? R.fight.coin : 0)) + ' coin</span>' +
      '<button class="btn" data-a="skip">SKIP · HEAL 8</button></div>' +
      '<div class="grid three compact">' + items.join('') + '</div>' +
      '</div></div>';
  }
  if (G.scr === 'shop') {
    const s = R.shop || rollShop();
    return '<div class="screen show"><div class="doc wide tight">' +
      '<div class="row"><h1>MERCH TABLE</h1><div class="grow"></div><span class="tag big">' + R.coin + ' COIN</span><button class="btn" data-a="map">LEAVE</button></div>' +
      '<div class="grid three compact">' +
      s.cards.map(c => cardHTML(c.id, c.sold ? '<div class="sold">SOLD</div>' : '<button class="btn go tiny" data-a="buy" data-id="' + c.id + '" ' + (R.coin < c.price ? 'disabled' : '') + '>' + c.price + '</button>')).join('') +
      s.charms.map(c => charmHTML(c.id, c.sold ? '<div class="sold">SOLD</div>' : '<button class="btn go tiny" data-a="buycharm" data-id="' + c.id + '" ' + (R.coin < c.price ? 'disabled' : '') + '>' + c.price + '</button>')).join('') + '</div>' +
      '<div class="row" style="margin-top:12px">' +
      '<button class="btn" data-a="heal" ' + (R.coin < s.heal.price || s.heal.taken ? 'disabled' : '') + '>PATCH THE SET · +12 · ' + s.heal.price + '</button>' +
      '<button class="btn" data-a="purge" ' + (R.coin < s.purge.price || s.purge.taken || R.deck.length <= 5 ? 'disabled' : '') + '>CUT A CARD · ' + s.purge.price + '</button>' +
      '</div></div></div>';
  }
  if (G.scr === 'purge') {
    const counts = {}; for (const id of R.deck) counts[id] = (counts[id] || 0) + 1;
    const list = Object.keys(counts).map(id => cardHTML(id, '<button class="btn tiny" data-a="cut" data-id="' + id + '">CUT</button>')).join('');
    return '<div class="screen show"><div class="doc wide"><div class="row"><h1 style="font-size:22px">CUT A CARD</h1><div class="grow"></div><button class="btn" data-a="shop">BACK</button></div><div class="grid">' + list + '</div></div></div>';
  }
  if (G.scr === 'over') {
    return '<div class="screen show"><div class="doc" style="text-align:center">' +
      '<h1 style="font-size:30px;color:#ff5a4a">THE ROOM WENT QUIET</h1>' +
      '<div class="score">' + (R.score || 0) + (R.newBest ? ' <span class="nb">NEW BEST</span>' : '') + '</div>' +
      '<div class="sub">Act ' + (R.act + 1) + ' · stage ' + (R.stage + 1) + ' · ' + R.stagesCleared + ' cleared · ' + R.perfects + ' perfects · ' + R.drops + ' drops' +
      (R.newBest ? '' : ' · best ' + (G.meta.bestScore || 0)) + '</div>' +
      '<div class="row" style="justify-content:center;margin-top:20px"><button class="btn pri" data-a="new">GO AGAIN</button><button class="btn" data-a="title">TITLE</button></div>' +
      '</div></div>';
  }
  if (G.scr === 'win') {
    return '<div class="screen show"><div class="doc" style="text-align:center">' +
      '<h1 style="font-size:30px;color:#ffc94d">ENCORE</h1>' +
      '<div class="score">' + (R.score || 0) + (R.newBest ? ' <span class="nb">NEW BEST</span>' : '') + '</div>' +
      '<div class="sub">You played the whole set and the room never dropped below a roar.<br>' +
      R.perfects + ' perfects · ' + R.drops + ' drops · ' + R.deck.length + ' cards' +
      (R.newBest ? '' : ' · best ' + (G.meta.bestScore || 0)) + '</div>' +
      '<div class="row" style="justify-content:center;margin-top:20px"><button class="btn pri" data-a="new">AGAIN</button><button class="btn" data-a="title">TITLE</button></div>' +
      '</div></div>';
  }
  return '';
}

function refreshUI() {
  if (HEADLESS) return;
  const html = G.scr === 'run' ? '' : screenHTML();
  const ui = UI();
  if (ui.dataset.scr !== G.scr || ui.dataset.stamp !== String(G.uiStamp || 0)) {
    ui.innerHTML = html;
    ui.dataset.scr = G.scr;
    ui.dataset.stamp = String(G.uiStamp || 0);
    ui.classList.toggle('on', G.scr !== 'run');
  }
}
function bump() { G.uiStamp = (G.uiStamp || 0) + 1; }

function act(a, id) {
  const R = G.run;
  if (a === 'new') { newRun(); G.scr = 'map'; bump(); sfx('coin'); return; }
  if (a === 'resume') { const r = loadRun(); if (r) { G.run = r; G.run.fight = null; G.scr = 'map'; } bump(); return; }
  if (a === 'title') { G.scr = 'title'; bump(); return; }
  if (a === 'how') { G.scr = 'how'; bump(); return; }
  if (a === 'collection') { G.scr = 'collection'; bump(); return; }
  if (a === 'map') { G.scr = 'map'; bump(); return; }
  if (a === 'deck') { G.scr = 'deck'; bump(); return; }
  if (a === 'fight') { startFight(); bump(); return; }
  if (a === 'shop') { if (!R.shop) rollShop(); G.scr = 'shop'; bump(); return; }
  if (a === 'take') { takeCard(id); bump(); return; }
  if (a === 'takecharm') { takeCharm(id); bump(); return; }
  if (a === 'skip') { skipOffer(); R.hp = Math.min(R.maxHp, R.hp + 8); bump(); return; }
  if (a === 'next') { advance(); bump(); return; }
  if (a === 'buy') {
    const it = R.shop.cards.find(c => c.id === id && !c.sold);
    if (it && R.coin >= it.price) { R.coin -= it.price; R.deck.push(id); it.sold = true; sfx('coin'); if (G.meta.unlocked.indexOf(id) < 0) { G.meta.unlocked.push(id); saveMeta(); } }
    bump(); return;
  }
  if (a === 'buycharm') {
    const it = R.shop.charms.find(c => c.id === id && !c.sold);
    if (it && R.coin >= it.price) { R.coin -= it.price; R.charms.push(id); it.sold = true; applyCharmOnce(id); sfx('coin'); }
    bump(); return;
  }
  if (a === 'heal') { const s = R.shop; if (R.coin >= s.heal.price && !s.heal.taken) { R.coin -= s.heal.price; R.hp = Math.min(R.maxHp, R.hp + 12); s.heal.taken = true; sfx('coin'); } bump(); return; }
  if (a === 'purge') { const s = R.shop; if (R.coin >= s.purge.price && !s.purge.taken) { G.scr = 'purge'; } bump(); return; }
  if (a === 'cut') {
    const i = R.deck.indexOf(id);
    if (i >= 0 && R.deck.length > 5) { R.deck.splice(i, 1); R.coin -= R.shop.purge.price; R.shop.purge.taken = true; sfx('coin'); G.scr = 'shop'; }
    bump(); return;
  }
}
function bindUI() {
  if (HEADLESS) return;
  UI().addEventListener('click', e => {
    ac();
    const b = e.target.closest('[data-a]');
    if (!b || b.disabled) return;
    act(b.dataset.a, b.dataset.id);
    saveRun();
  });
}

/* ---- the title screen draws on the canvas behind the DOM ---------------- */
function drawTitleArt(c, L) {
  const t = G.t / 1000;
  // the whole band, lined up along the front of the stage, bobbing at 100 BPM
  // whether or not the audio has been unlocked yet -- the title should look
  // like the game sounds
  const cast = [
    ['drum', '#ffc94d'], ['cabinet', '#5aa9ff'], ['boxer', '#ff2e88'],
    ['duo', '#ff2e88'], ['singer', '#2ee6d6'], ['ring', '#a06bff'], ['wire', '#a6ff5e'],
  ];
  const bpm = 100, beat = (t * bpm / 60);
  const step = L.W / (cast.length + 1);
  for (let i = 0; i < cast.length; i++) {
    const [art, tint] = cast[i];
    const ph = (beat + i * 0.5) % 1;
    const hop = Math.pow(1 - ph, 3) * 9;
    const x = step * (i + 1);
    const y = L.H - 26 - hop;
    c.save();
    c.globalAlpha = .92;
    c.translate(x, y);
    drawUnit(c, art, tint, 118, t + i * 1.7);
    c.restore();
    // a wash of the unit's own colour on the floor beneath it
    c.save(); c.globalCompositeOperation = 'lighter';
    const g = c.createRadialGradient(x, y, 2, x, y, 120);
    g.addColorStop(0, rgba(tint, .16)); g.addColorStop(1, rgba(tint, 0));
    c.fillStyle = g; circ(c, x, y, 120); c.fill();
    c.restore();
  }
}

/* =============================================== S12 -- boot and loop ==== */
/* The loop does three things: advance the transport to the next whole beat,
   run the sim for each beat that has passed, and draw. Beats are consumed in
   a while loop rather than one per frame so a dropped frame does not drop a
   beat -- and if the tab was backgrounded long enough to owe us fifty beats,
   the clock resyncs instead of fast-forwarding the fight. */

let lastTs = 0;

function stepFight(S) {
  if (!S || S.over) return;
  if (!A.running) return;
  if (beatNow() - A.beat > 8) A.beat = Math.floor(beatNow()) - 1;   // resync after a stall
  let guard = 0;
  while (Math.floor(beatNow()) > A.beat && guard++ < 16) {
    A.beat++;
    if (!S.armed) continue;             // count-in: the clock runs, the board does not
    beatStep(S, timeOfBeat(A.beat));
    if (S.over) break;
  }
}

function settleFight(S) {
  if (!S || !S.over || S.settled) return;
  S.settled = true;
  if (S.over === 'win') {
    afterFight(S);
    rollOffer();
    G.scr = 'reward';
  } else {
    G.run.hp = S.hp;
    bankScore();
    clearRun();
    G.scr = 'over';
  }
  bump();
}

function frame(ts) {
  const dt = Math.min(60, ts - lastTs || 16);
  lastTs = ts;
  G.t = ts; G.dt = dt;
  if (!A.ac || G.muted) VCLOCK += dt / 1000;

  const S = G.run && G.run.fight;
  if (G.scr === 'run' && S) {
    stepFight(S);
    settleFight(S);
    for (const u of S.units) if (u.flash > 0) u.flash = Math.max(0, u.flash - dt * 0.005);
  }
  stepFX(dt);
  render();
  refreshUI();
  if (G.scr !== 'run') paintCardArt();
  requestAnimationFrame(frame);
}

function boot() {
  loadMeta();
  if (HEADLESS) return;
  CV = document.getElementById('cv');
  CX = CV.getContext('2d');
  fitCanvas();
  window.addEventListener('resize', fitCanvas);
  window.addEventListener('orientationchange', () => setTimeout(fitCanvas, 220));
  document.addEventListener('visibilitychange', () => { if (!document.hidden) A.beat = Math.floor(beatNow()) - 1; });
  bindInput();
  bindUI();
  G.scr = 'title';
  bump();
  requestAnimationFrame(frame);
}

/* ---- the test export ----------------------------------------------------
   tests/beatborne*.test.mjs drive the game entirely through this. Nothing in
   here exists for the game itself, and nothing the game needs is missing from
   it -- if a test cannot reach something, that is a reason to widen this
   object, never to reach into the file another way. */
const BB = {
  G, A, CREW, CREW_BY, FOES, BOSSES, CHARMS, CHARM_BY, ACTS, ALL_UNITS, ART, VOICE, RCOL, VOICE_LABEL,
  COLS, ROWS, STAGES_PER_ACT, WIN_PERFECT, WIN_GOOD,
  mulberry, shade, hex2rgb, rgba, clamp, weighted, pickN,
  newRun, startFight, buildStage, beatStep, playCard, moveUnit, canPlay, drawN, drawOne, mkCard, mkUnit,
  unitAt, sideUnits, emptySlots, frontOf, frontOfRowOnly, backOfRowOnly, orderedSide, slotIndex,
  hurt, hitPlayer, addCrowd, triggerDrop, fireUnit, endFight, nextWaveMaybe,
  afterFight, advance, runScore, bankScore, rollOffer, rollShop, takeCard, takeCharm, skipOffer, act, startingDeck,
  layout, render, drawUnit, drawCard, drawHUD, drawBoard, drawRoom, drawBeatRail, drawHand, drawFX,
  screenHTML, hasCharm, judgeNow, startTransport, stopTransport, beatNow, hz,
  setRnd(seed) { RND = mulberry(seed); },
  setClock(t) { VCLOCK = t; },
  clock() { return VCLOCK; },
  headless() { return HEADLESS; },
  mountTest(cv, cx) { CV = cv; CX = cx; DPR = 1; },
  setScreen(w, h) { G.W = w; G.H = h; },
  // run one whole fight with a simple pilot, and report what happened
  sim(opts) { return pilot(opts || {}); },
  simRun(opts) { return pilotRun(opts || {}); },
};
if (typeof window !== 'undefined') window.BB = BB;
if (typeof globalThis !== 'undefined') globalThis.BB = BB;

// the pilot's beat loop, shared by the single-stage probe and the full run
function runFight(S, grade, maxBeats, cheap, opts) {
  opts = opts || {};
  VCLOCK = 0; A.t0 = 0; A.beat = -1; A.running = true; A.bpm = S.bpm;
  S.armed = true;                       // no count-in for the probe
  const spb = 60 / S.bpm;
  let beats = 0;
  while (!S.over && beats < maxBeats) {
    // place what we can, timed to whatever grade the caller asked for
    for (let guard = 0; guard < 6; guard++) {
      // Spend down, not up. Cheapest-first looked like a conservative floor and
      // was actually a broken player: it dumped five cost-1 cards a bar and
      // never once played a rare it had drafted, so a deck that grew to 18
      // cards fought with the same ten it started with. `cheap` keeps the old
      // behaviour for comparison; it is a floor, not a player.
      if (opts.idle) break;
      const playable = S.hand.map((c, i) => i).filter(i => canPlay(S, i));
      if (!playable.length) break;
      playable.sort((a, b) => cheap ? S.hand[a].cost - S.hand[b].cost : S.hand[b].cost - S.hand[a].cost);
      const idx = playable[0];
      if (idx == null) break;
      const slots = emptySlots(S, 'us');
      if (!slots.length) break;
      slots.sort((a, b) => a.col - b.col || a.row - b.row);
      const offMs = grade === 'perfect' ? 0 : grade === 'good' ? 120 : 300;
      VCLOCK = beats * spb + offMs / 1000;
      if (!playCard(S, idx, slots[0].col, slots[0].row)) break;
    }
    VCLOCK = (beats + 1) * spb;
    A.beat = beats;
    beatStep(S, null);
    beats++;
  }
  return beats;
}

/* ---- a whole run ---------------------------------------------------------
   The single-stage probe cannot see the thing that actually kills a run: the
   set does not heal between stages, so act two is not five easy fights, it is
   one long one with the damage kept. This plays all fifteen, drafts on the way
   the way a player would, and reports where it stopped. */
function pilotRun(opts) {
  opts = opts || {};
  const seed = opts.seed == null ? 1 : opts.seed;
  const grade = opts.grade || 'perfect';
  newRun(seed);
  const R = G.run;
  let cleared = 0, drops = 0, perfects = 0, beats = 0;
  for (let guard = 0; guard < 40; guard++) {
    const S = startFight();
    beats += runFight(S, grade, opts.maxBeats || 900, opts.play === 'cheap', opts);
    drops += S.drops;
    if (S.over !== 'win') {
      return { won: false, cleared, act: R.act + 1, stage: R.stage + 1, hp: S.hp,
               deck: R.deck.length, charms: R.charms.length, drops, beats };
    }
    afterFight(S);
    cleared++;
    // draft like a player: take the charm about half the time, else the rarest
    rollOffer();
    const o = R.offer;
    if (o.charm && rnd() < 0.5) takeCharm(o.charm.id);
    else if (o.cards.length) takeCard(o.cards.slice().sort((a, b) => b.r - a.r)[0].id);
    else skipOffer();
    advance();
    if (G.scr === 'win') {
      return { won: true, cleared, act: 3, stage: 5, hp: R.hp,
               deck: R.deck.length, charms: R.charms.length, drops, beats };
    }
  }
  return { won: false, cleared, act: R.act + 1, stage: R.stage + 1, hp: R.hp,
           deck: R.deck.length, charms: R.charms.length, drops, beats };
}

/* ---- the pilot ----------------------------------------------------------
   A deliberately simple player: it plays the cheapest card it can afford into
   the front-most empty slot, on the beat. It is not good, and that is the
   point -- if the pilot can clear act one the fight is too easy, and if it
   cannot survive stage one the fight is too hard. Every balance claim in the
   tests is a number this produced. */
function pilot(opts) {
  const seed = opts.seed == null ? 7 : opts.seed;
  const maxBeats = opts.maxBeats || 400;
  const grade = opts.grade || 'perfect';
  RND = mulberry(seed);
  newRun(seed);
  if (opts.act != null) G.run.act = opts.act;
  if (opts.stage != null) G.run.stage = opts.stage;
  if (opts.deck) G.run.deck = opts.deck.slice();
  if (opts.charms) G.run.charms = opts.charms.slice();
  const S = startFight();
  const beats = runFight(S, grade, maxBeats, opts.play === 'cheap', opts);
  return {
    over: S.over || 'timeout', beats, hp: S.hp, maxHp: S.maxHp,
    killed: S.killed, drops: S.drops, crowd: S.crowd, coin: S.coin,
    foesLeft: sideUnits(S, 'them').length, alliesLeft: sideUnits(S, 'us').length,
    waves: S.waveI + '/' + S.waves.length, S,
  };
}

if (!HEADLESS) {
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
} else {
  loadMeta();
}
</script>
