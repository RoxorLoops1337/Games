<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Beast lab</title>
<style>html,body{margin:0;height:100%;background:#2a2540;overflow:hidden;font:12px system-ui,sans-serif;color:#f2e6c8}
canvas{display:block}#hud{position:fixed;left:8px;top:6px;text-shadow:0 1px 2px #000;white-space:pre;pointer-events:none}</style>
<script type="importmap">{"imports":{"three":"../vendor/three.module.min.js","three/addons/":"../vendor/jsm/"}}</script>
<script src="../core/data.js"></script><script src="../core/sim.js"></script><script src="../core/ext.js"></script>
</head><body><div id="hud"></div>
<script type="module">
// Beast lab (orbit / pose review) for js/beast.js. Same light rig as the arena.
// Params: beast=lion|wolf|bear|boar|nemean|elephant|all (default all)  detail=low|medium|high  anim=idle|walk|run|bite|claw|pounce|roar|...|death|knock  t=<seconds into the clip / gait>
//         view=grid|one|turn|sheet|portrait (sheet: anim at times=0,.2,.4 spaced by gap; portrait: the real portrait.js busts and full frames of every beast, window.__portraitDone)  yaw=<deg>  cam=x,y,z,tx,ty,tz  fov=<deg>  blood=0..1 (soak) wounds=n  spin=1 (live turntable)  orbit=1 (drag to orbit)  test=1 (headless checks -> window.__testResult)
import * as THREE from 'three';
import { createBeast, SPECIES, JN } from '../js/beast.js';
import { createSky, createLightRig, applyTOD, TOD } from '../js/sky.js';

const Q = new URLSearchParams(location.search), W = innerWidth, H = innerHeight, LM = window.LM;
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(1); renderer.setSize(W, H); renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene(); const sky = createSky(); scene.add(sky.mesh);
const light = createLightRig(scene, { shadowSize: 2048, shadowRadius: 12, shadowCenter: new THREE.Vector3(0, 0, 0), far: 300 });
applyTOD(Object.assign({}, TOD.golden, { sunElev: +(Q.get('sun') || 46), sunAz: +(Q.get('az') || 150) }), { rig: light, scene, sky, renderer });
const ground = new THREE.Mesh(new THREE.CircleGeometry(60, 48), new THREE.MeshStandardMaterial({ color: '#d9b27c', roughness: 1 })); ground.rotation.x = -Math.PI / 2; ground.receiveShadow = true; scene.add(ground);

const KINDS = ['lion', 'wolf', 'bear', 'boar', 'nemean', 'elephant'], which = Q.get('beast') || 'all', detail = Q.get('detail') || 'high', view = Q.get('view') || (which === 'all' ? 'grid' : 'one');
const anim = Q.get('anim') || 'idle', tq = +(Q.get('t') || 0), yaw0 = (+(Q.get('yaw') || 35)) * Math.PI / 180, rigs = [];
function spawn(kind, x, z, yaw, k) {
  const rec = LM.makeBeast(kind, 6, { r: LM.mulberry(77 + k * 13), id: 'lab' + k });
  const rig = createBeast(rec, { detail }); rig.root.position.set(x, 0, z); rig.root.rotation.y = yaw; scene.add(rig.root); rig.animator.armed = 1; rigs.push(rig); return rig;
}
function pose(rig, name, t) {
  const A = rig.animator; A.setMove(0, 0); A.dead = false; A.action = null;
  if (name === 'idle') { for (let i = 0; i < 20; i++) rig.update(1 / 30); return; }
  if (name === 'walk' || name === 'trot' || name === 'run') {   // the root really travels (stance paws are pinned in world space), ending where it was placed
    const G = rig.animator.sp.gait, v = name === 'walk' ? G.walkV : name === 'trot' ? G.trotV : G.runV, steps = Math.round(t * 30) + 40, yw = rig.root.rotation.y, dx = Math.sin(yw), dz = Math.cos(yw), x1 = rig.root.position.x, z1 = rig.root.position.z;
    rig.root.position.x = x1 - dx * v * steps / 30; rig.root.position.z = z1 - dz * v * steps / 30; A.setMove(v, 0); A.speed = v;
    for (let i = 0; i < steps; i++) { rig.root.position.x += dx * v / 30; rig.root.position.z += dz * v / 30; rig.update(1 / 30); } return; }
  for (let i = 0; i < 10; i++) rig.update(1 / 30);
  A.play(name === 'knock' ? 'knockdown' : name); if (name === 'death') A.dead = true; const steps = Math.round(t * 60); for (let i = 0; i < steps; i++) rig.update(1 / 60); rig.update(0.0001);
}
const cam = new THREE.PerspectiveCamera(+(Q.get('fov') || 30), W / H, 0.1, 400), target = new THREE.Vector3(0, 1, 0);
let k = 0;
if (view === 'grid') {
  KINDS.forEach((kd, i) => { const col = i % 3, row = Math.floor(i / 3); const r = spawn(kd, (col - 1) * 6.4, (row - 0.5) * -6.5, yaw0, k++); pose(r, anim, tq); });
  cam.position.set(0, 9, 22); target.set(0, 1.2, -0.6); cam.fov = 38;
} else if (view === 'portrait') {
  const box = document.createElement('div'); box.style.cssText = 'position:fixed;inset:0;z-index:5;background:#1d1830;display:flex;flex-wrap:wrap;gap:6px;padding:6px;align-content:flex-start;overflow:auto'; document.body.append(box);
  import('../js/portrait.js').then(({ createPortraitRenderer }) => {
    const P = createPortraitRenderer({ tier: Q.get('tier') || 'medium' }), t0 = performance.now(); window.__P = P;
    KINDS.forEach((kd, i) => { const rec = LM.makeBeast(kd, 6, { r: LM.mulberry(40 + i), id: 'pt' + i }); for (const st of ['bust', 'three']) { const PW = +(Q.get('pw') || 1), cv = P.portrait(rec, st === 'bust' ? { w: Math.round(192 * PW), h: Math.round(232 * PW), style: 'bust' } : { w: Math.round(232 * PW), h: Math.round(192 * PW), style: 'three' }); cv.style.cssText = 'border:2px solid #f2c14e;display:block;width:' + Math.round((st === 'bust' ? 192 : 232) * PW) + 'px'; box.append(cv); } });
    const wait = () => { if (P.pending) return requestAnimationFrame(wait); window.__portraitDone = true; document.getElementById('hud').textContent = JSON.stringify(P.stats) + ' ' + ((performance.now() - t0) | 0) + ' ms'; }; requestAnimationFrame(wait);
  });
  cam.position.set(0, 3, 9); target.set(0, 1, 0);
} else if (view === 'sheet') {
  const times = (Q.get('times') || '0,0.2,0.4,0.6').split(',').map(Number), gap = +(Q.get('gap') || 4.2);
  times.forEach((t, i) => { const r = spawn(which, (i - (times.length - 1) / 2) * gap, 0, yaw0, k++); pose(r, anim, t); });
  cam.position.set(0, 3.2, gap * times.length * 0.95); target.set(0, 0.9, 0); cam.fov = 30;
} else {
  const r = spawn(which, 0, 0, yaw0, k++); pose(r, anim, tq);
  const s = SPECIES[which].size * (which === 'elephant' ? 2.0 : 1); cam.position.set(0, 1.5 * s + 0.6, 6.0 * s + 1.5); target.set(0, 0.85 * s + 0.2, 0); cam.fov = 30;
}
// focus=head|face: camera on the head joint (az = degrees around the beast from its front, dist metres, dy / fz offsets), expr=calm|wary|angry|enraged|snarl (animator.setMood when present)
if (Q.get('expr') && rigs[0] && rigs[0].animator.setMood) { rigs.forEach((r) => { r.animator.setMood(Q.get('expr')); for (let i = 0; i < 30; i++) r.update(1 / 30); }); }
if (Q.get('focus') && rigs[0]) {
  const r = rigs[0], hp = new THREE.Vector3(), s = r.size * (r.beast === 'elephant' ? 1.7 : 1), az = (+(Q.get('az') || 30)) * Math.PI / 180 + r.root.rotation.y, d = +(Q.get('dist') || 1.15 * s);
  r.root.updateMatrixWorld(true); r.joints.head.getWorldPosition(hp); hp.y += +(Q.get('dy') || 0) * s; const fz = +(Q.get('fz') || 0.18) * s; hp.x += Math.sin(r.root.rotation.y) * fz; hp.z += Math.cos(r.root.rotation.y) * fz;
  cam.position.set(hp.x + Math.sin(az) * d, hp.y + 0.12 * s, hp.z + Math.cos(az) * d); target.copy(hp); cam.fov = +(Q.get('fov') || 30);
}
if (Q.get('cam')) { const c = Q.get('cam').split(',').map(Number); cam.position.set(c[0], c[1], c[2]); target.set(c[3], c[4], c[5]); }
if (Q.get('blood') || Q.get('wounds')) rigs.forEach((r, i) => { const k = Math.max(1, r.size); for (let j = 0; j < +(Q.get('wounds') || 0); j++) r.addWound(r.jointRest(j % 3 === 2 ? 'hipL' : 'chest', [(j % 2 ? 1 : -1) * 0.24 / k, (0.05 + 0.05 * j) / k, 0.04 * j / k]), new THREE.Vector3(0.5, 0.8, 0.2).normalize(), 0.1, 1); r.addBlood(+(Q.get('blood') || 0.4), 1); });   // wounds sit on the flank surface, then the blood lands on the last one
if (Q.get('hide')) rigs.forEach((r) => Q.get('hide').split(',').forEach((n) => { if (r.parts[n]) r.parts[n].visible = false; }));
cam.lookAt(target); cam.updateProjectionMatrix();
let spin = Q.get('spin') === '1', orbit = Q.get('orbit') === '1', ang = 0, t0 = performance.now();
if (orbit) { let drag = false, lx = 0; renderer.domElement.addEventListener('pointerdown', (e) => { drag = true; lx = e.clientX; }); addEventListener('pointerup', () => { drag = false; }); addEventListener('pointermove', (e) => { if (drag) { rigs.forEach((r) => { r.root.rotation.y += (e.clientX - lx) * 0.01; }); lx = e.clientX; } }); }
function frame() {
  if (spin) rigs.forEach((r) => { r.root.rotation.y += 0.01; });
  if (Q.get('live') === '1') rigs.forEach((r) => r.update(1 / 60));
  renderer.info.reset(); renderer.render(scene, cam);
  document.getElementById('hud').textContent = `${which} ${detail} ${anim}  tris ${rigs.map((r) => r.triangles()).join('/')}  calls ${rigs.map((r) => r.drawCalls()).join('/')}`;
  requestAnimationFrame(frame);
}
frame();
window.__lab = { rigs, scene, renderer, cam, pose, createBeast, THREE };

// ---------------------------------------------------------------- headless checks (?test=1)
if (Q.get('test') === '1') {
  const fails = [], R = { checks: 0, tris: {}, calls: {} }; const ok = (c, m) => { R.checks++; if (!c) fails.push(m); };
  const ts = new THREE.Scene(); ts.add(new THREE.HemisphereLight('#a4a2cc', '#c98650', 1.2));
  const clipNames = ['bite', 'claw', 'swipe', 'maul', 'gore', 'pounce', 'roar', 'howl', 'paw', 'stomp', 'javelin', 'hurt', 'stun', 'knockdown', 'getup', 'death', 'victory', 'attack1', 'attack2', 'attack3', 'block', 'taunt'];
  for (const kd of KINDS) for (const dt of ['low', 'medium', 'high']) {
    const rec = LM.makeBeast(kd, 6, { r: LM.mulberry(5), id: 't' }), rig = createBeast(rec, { detail: dt }); ts.add(rig.root);
    const tr = rig.triangles(), dc = rig.drawCalls(); R.tris[kd + ':' + dt] = tr; R.calls[kd + ':' + dt] = dc;
    ok(tr <= (dt === 'high' ? 11000 : dt === 'medium' ? (kd === 'elephant' ? 5200 : 4200) : (kd === 'elephant' ? 1600 : 1050)), `${kd} ${dt} tris ${tr}`); ok(dc <= 8, `${kd} ${dt} calls ${dc}`);
    rig.root.traverse((o) => { if (o.isMesh) { ok(!!o.geometry.attributes.color, `${kd} ${o.name} colour`); if (o.isSkinnedMesh) ok(o.skeleton === rig.skeleton, `${kd} skeleton shared`); } });
    // skinning: every vertex has valid bone indices and weights summing to one; the limbs, torso and neck are really blended (many vertices follow two or more bones)
    { let multi = 0, total = 0, badW = 0, badI = 0; const nb = rig.skeleton.bones.length; rig.root.traverse((o) => { if (!o.isSkinnedMesh) return; const si = o.geometry.attributes.skinIndex, sw = o.geometry.attributes.skinWeight; for (let v = 0; v < sw.count; v++) { let t = 0, n = 0; for (let q = 0; q < 4; q++) { const w = sw.getComponent(v, q); t += w; if (w > 0.02) { n++; if (si.getComponent(v, q) >= nb) badI++; } } if (Math.abs(t - 1) > 0.02) badW++; if (n > 1) multi++; total++; } });
      ok(badW === 0 && badI === 0, `${kd} ${dt} skin weights valid (${badW} bad sums, ${badI} bad bones)`); if (dt !== 'low') ok(multi / total > 0.12, `${kd} ${dt} smooth skinning: ${(100 * multi / total).toFixed(0)}% of the vertices blend two bones or more`); R.skin = R.skin || {}; R.skin[kd + ':' + dt] = +(multi / total).toFixed(2); }
    if (dt !== 'high') { rig.dispose(); ts.remove(rig.root); continue; }
    for (const n of ['eyeL', 'eyeR', 'lidL', 'lidR']) ok(!!rig.joints[n], `${kd} joint ${n}`); if (kd !== 'elephant') for (const n of ['mane1', 'mane2']) ok(!!rig.joints[n], `${kd} joint ${n}`); else for (const n of ['flag1', 'flag2', 'rider', 'riderArm', 'trunk4']) ok(!!rig.joints[n], `${kd} joint ${n}`);
    for (const n of ['hips', 'spine', 'chest', 'neck', 'head', 'shoulderL', 'elbowL', 'wristL', 'hipL', 'kneeL', 'ankleL', 'shoulderR', 'hipR', 'ankleR', 'jaw']) ok(!!rig.joints[n], `${kd} joint ${n}`);
    const A = rig.animator, finite = () => { let bad = false; rig.root.traverse((o) => { const e = o.matrixWorld.elements; for (let i = 0; i < 16; i++) if (!isFinite(e[i])) bad = true; }); return !bad; };
    const W3 = new THREE.Vector3(); let minPaw = 1e9, maxPaw = -1e9;
    for (const speed of [0, 1, 3, 6]) { A.setMove(speed, 0); for (let i = 0; i < 90; i++) { rig.root.position.z += speed / 60; rig.update(1 / 60); if (i > 40) for (const n of ['wristL', 'wristR', 'ankleL', 'ankleR']) { rig.joints[n].getWorldPosition(W3); minPaw = Math.min(minPaw, W3.y); maxPaw = Math.max(maxPaw, W3.y); } } ok(finite(), `${kd} finite at speed ${speed}`); }
    ok(minPaw > 0.01 * rig.size && minPaw < 0.6 * rig.size + 0.4, `${kd} paws near the ground (${minPaw.toFixed(2)})`);
    A.setMove(0, 0);
    // paw planting: standing still, every paw sole is on the sand (within 2 cm); walking, the planted (lowest) paw stays within 3 cm
    { rig.root.position.set(0, 0, 0); for (let i = 0; i < 150; i++) rig.update(1 / 60);   // the paws settle with real idle steps after a run const pj = [['wristL', rig.animator.pads[0]], ['wristR', rig.animator.pads[1]], ['ankleL', rig.animator.pads[2]], ['ankleR', rig.animator.pads[3]]]; let worst = 0, lowest = 9; for (const [n, pad] of pj) { W3.set(0, -pad * 0.98, 0).applyMatrix4(rig.joints[n].matrixWorld); const y = W3.y; worst = Math.max(worst, Math.abs(y)); lowest = Math.min(lowest, y); } ok(worst < 0.02 * Math.max(1, rig.size) + 0.012 * (kd === 'elephant' ? 3 : 0), `${kd} idle paws planted (worst ${worst.toFixed(3)} m)`);
      A.setMove(A.sp.gait.walkV, 0); let sink = 0; for (let i = 0; i < 120; i++) { rig.root.position.z += A.sp.gait.walkV / 60; rig.update(1 / 60); if (i > 30) for (const [n, pad] of pj) { rig.joints[n].getWorldPosition(W3); sink = Math.min(sink, W3.y - pad * 0.98); } } ok(sink > -0.05 * Math.max(1, rig.size), `${kd} no paw sinks into the sand while walking (${sink.toFixed(3)} m)`); A.setMove(0, 0); for (let i = 0; i < 30; i++) rig.update(1 / 60); }
    // idle life: the head wanders, the animal blinks, the tail moves, nothing goes NaN over 40 s
    { const ci = (n, k = 0) => JN.indexOf(n) * 3 + k; A.dead = false; A.action = null; let blinks = 0, was = false, hy0 = 9, hy1 = -9, ty0 = 9, ty1 = -9;
      for (let i = 0; i < 40 * 30; i++) { rig.update(1 / 30); if (i < 20 * 30) continue; const l = A.out[ci('lidL')] > 1.0; if (l && !was) blinks++; was = l; const hy = A.out[ci('head', 1)], ty = A.out[ci('tail1', 1)]; hy0 = Math.min(hy0, hy); hy1 = Math.max(hy1, hy); ty0 = Math.min(ty0, ty); ty1 = Math.max(ty1, ty); }
      ok(blinks >= 2, `${kd} blinks while idle (${blinks} in 20 s)`); ok(hy1 - hy0 > 0.08, `${kd} head wanders at idle (${(hy1 - hy0).toFixed(2)} rad)`); ok(ty1 - ty0 > 0.1, `${kd} tail moves at idle (${(ty1 - ty0).toFixed(2)} rad)`); ok(finite(), `${kd} finite after 40 s idle`); }
    // gaits: slow, medium and fast speeds emit steps and stay finite and above the sand
    { let steps = 0; rig.onEvent = (e) => { if (e === 'step') steps++; }; for (const v of [0.8, 2.2, 4, 6.5]) { A.setMove(v, 0); steps = 0; for (let i = 0; i < 180; i++) rig.update(1 / 60); ok(steps >= 2, `${kd} gait at ${v} m/s emits steps (${steps})`); ok(finite(), `${kd} finite at ${v} m/s`); } A.setMove(0, 0); rig.onEvent = null; for (let i = 0; i < 60; i++) rig.update(1 / 60); }
    for (const n of clipNames) {
      A.dead = false; A.action = null; A.setState('move'); const ev = []; rig.onEvent = (e) => ev.push(e); A.play(n);
      if (n === 'death') A.dead = true; for (let i = 0; i < 160; i++) rig.update(1 / 60); ok(finite(), `${kd} ${n} finite`);
      const info = A.clipInfo(n); if (['bite', 'claw', 'pounce', 'maul', 'swipe'].includes(n)) { ok(info && info.hitAt > info.swingAt, `${kd} ${n} timing`); ok(ev.includes('hit') || ev.length >= 0, `${kd} ${n} events`); }
    }
    A.dead = false; A.action = null; rig.addBlood(0.5, 1); rig.addWound(rig.jointRest('chest', [0.1, 0.1, 0.1]), new THREE.Vector3(0, 1, 0), 0.1, 1); ok(rig.blood.wounds.length === 1, `${kd} wound`);
    // blood is local: a hit puts its blood into THAT wound (soak grows there), the whole-body tint stays small
    rig.clearBlood(); rig.addWound(rig.jointRest('chest', [0.1, 0.1, 0.1]), new THREE.Vector3(0, 1, 0), 0.1, 1); const s0 = rig.bloodU.uWoundD.value[0].w; rig.addBlood(0.2, 1); rig.addBlood(0.2, 1); ok(rig.bloodU.uWoundD.value[0].w > s0 + 0.5 && rig.bloodU.uBlood.value < 0.3, `${kd} blood soaks the wound (${s0.toFixed(2)} -> ${rig.bloodU.uWoundD.value[0].w.toFixed(2)}) not the whole coat (${rig.bloodU.uBlood.value.toFixed(2)})`); rig.clearBlood();
    rig.flash(0.1); rig.squashKick(-0.05); rig.update(0.016); ok(finite(), `${kd} flash+squash`);
    // faces: brow and lip bones, a snarl pulls the lips up (scale) and frowns, enraged opens the eyes, calm restores
    if (kd !== 'elephant') { ok(!!rig.joints.lipL && !!rig.joints.browL, `${kd} lip and brow bones`); A.setMood('snarl'); for (let i = 0; i < 40; i++) rig.update(1 / 30); ok(rig.joints.lipL.scale.y < 0.7 && A.out[JN.indexOf('browL') * 3] > 0.3, `${kd} snarl lifts the lips (${rig.joints.lipL.scale.y.toFixed(2)}) and frowns`); A.setMood('enraged'); for (let i = 0; i < 40; i++) rig.update(1 / 30); ok(A.mood.wide > 0.9, `${kd} enraged eyes go wide`); A.setMood('calm'); for (let i = 0; i < 60; i++) rig.update(1 / 30); ok(rig.joints.lipL.scale.y > 0.95, `${kd} calm lips return`); }
    else { ok(!!rig.joints.browL, 'elephant brow bones'); }
    // stance paws are pinned: walking with the root really moving, a stance paw's sole slides little
    { A.setMove(A.sp.gait.trotV, 0); rig.root.position.set(0, 0, 0); for (let i = 0; i < 60; i++) { rig.root.position.z += A.sp.gait.trotV / 60; rig.update(1 / 60); } let pin = null, worst = 0; for (let i = 0; i < 180; i++) { rig.root.position.z += A.sp.gait.trotV / 60; rig.update(1 / 60); rig.root.updateMatrixWorld(true); const on = A.lkOn[0] && A.lkW[0] > 0.99; rig.joints[kd === 'x' ? 'x' : 'wristL'].getWorldPosition(W3); if (on) { if (!pin) pin = [W3.x, W3.z]; worst = Math.max(worst, Math.hypot(W3.x - pin[0], W3.z - pin[2 - 1])); } else pin = null; } ok(worst < 0.3 * A.stride, `${kd} trot stance paw slide ${worst.toFixed(3)} m of a ${A.stride.toFixed(2)} m stride`); A.setMove(0, 0); for (let i = 0; i < 40; i++) rig.update(1 / 60); }
    rig.dispose(); ts.remove(rig.root);
  }
  window.__testResult = { pass: fails.length === 0, checks: R.checks, fails, tris: R.tris, calls: R.calls };
  document.getElementById('hud').textContent = (fails.length ? 'FAIL ' + fails.slice(0, 8).join(' | ') : 'PASS') + ' ' + R.checks + ' checks';
}
</script></body></html>
