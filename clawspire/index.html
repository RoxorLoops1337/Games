<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#12091f">
<title>CLAWSPIRE -- a claw machine roguelike</title>
<meta name="description" content="Strap a cursed arcade claw to your back and climb the Clawspire. Your deck is a bin of real objects, your turn is a handful of claw drops.">
<style>
:root{
  --ink:#12091f; --ink2:#1b1030; --panel:#22163a; --panel2:#2c1d4a;
  --line:#3d2a63; --line2:#5a3f8f;
  --text:#f3ecff; --dim:#b3a4d6; --dimmer:#8d7fb3;
  --pink:#ff2e88; --pink2:#ff6bb0;
  --cyan:#2ee6d6; --cyan2:#8dfff5;
  --gold:#ffc94d; --lime:#a6ff5e; --blood:#ff5a4a;
  --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
  --safe-l:env(safe-area-inset-left,0px); --safe-r:env(safe-area-inset-right,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%;overflow:hidden;background:var(--ink);color:var(--text);
  font-family:"Trebuchet MS","Segoe UI",system-ui,-apple-system,sans-serif;
  -webkit-user-select:none;user-select:none;overscroll-behavior:none;touch-action:none}
button{font-family:inherit}
#wrap{position:fixed;inset:0;background:var(--ink);overflow:hidden;
  padding:var(--safe-t) var(--safe-r) var(--safe-b) var(--safe-l)}
#stage{position:absolute;width:540px;height:960px;left:0;top:0;transform-origin:0 0;
  background:var(--ink2);overflow:hidden;touch-action:none}
#cv{position:absolute;left:0;top:0;width:540px;height:960px;display:block;touch-action:none}

/* ---------- shared chrome ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;min-width:44px;
  padding:8px 18px;border-radius:12px;border:2px solid var(--line2);
  background:linear-gradient(180deg,#3a2a60,#241a40);color:var(--text);font-size:15px;font-weight:900;
  letter-spacing:.06em;text-transform:uppercase;cursor:pointer;box-shadow:0 4px 0 #120a22,0 6px 14px rgba(0,0,0,.4);
  transition:transform .06s,filter .12s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #120a22}
.btn.pri{border-color:var(--pink);background:linear-gradient(180deg,#7a1a4c,#4a1030);color:#fff;
  box-shadow:0 4px 0 #3a0a22,0 0 22px rgba(255,46,136,.35)}
.btn.go{border-color:var(--cyan);background:linear-gradient(180deg,#0f5a58,#0a3538);
  box-shadow:0 4px 0 #062224,0 0 22px rgba(46,230,214,.28)}
.btn.gold{border-color:var(--gold);background:linear-gradient(180deg,#8a6210,#4d3608);color:#fff8e0;
  box-shadow:0 4px 0 #2a1d04,0 0 18px rgba(255,201,77,.3)}
.btn.ghost{background:transparent;box-shadow:none;border-color:var(--line)}
.btn.sm{min-height:44px;padding:6px 12px;font-size:13px}
.btn:disabled,.btn.off{opacity:.38;cursor:default;box-shadow:none;transform:none}
.btn.toggle.on{border-color:var(--lime);color:var(--lime)}
.panel{background:linear-gradient(180deg,var(--panel2),var(--panel));border:2px solid var(--line);
  border-radius:14px;box-shadow:0 10px 30px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.06)}
h1{margin:0;font-size:30px;letter-spacing:.14em;font-weight:900;color:#fff;text-transform:uppercase;
  text-shadow:0 0 18px rgba(255,46,136,.45)}
h2{margin:0;font-size:16px;letter-spacing:.14em;color:var(--cyan2);text-transform:uppercase;font-weight:900}
h3{margin:0;font-size:14px;letter-spacing:.1em;color:var(--gold);text-transform:uppercase;font-weight:900}
.sub{color:var(--dim);font-size:13px;line-height:1.5}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row.center{justify-content:center}
.grow{flex:1}
.col{display:flex;flex-direction:column;gap:10px}
.hr{height:2px;background:linear-gradient(90deg,var(--pink),transparent);margin:4px 0}
.tag{display:inline-flex;align-items:center;gap:4px;padding:4px 9px;border-radius:8px;background:#17102a;
  border:1px solid var(--line);font-size:12px;color:var(--dim);letter-spacing:.04em}
.tag.gold{color:var(--gold);border-color:#7a5a1a}
.tag.cyan{color:var(--cyan);border-color:#1a6a64}
.tag.pink{color:var(--pink2);border-color:#7a1a4c}
.tag.lime{color:var(--lime);border-color:#4a7a1a}
.big{font-size:22px;font-weight:900;color:#fff}
.mono{font-variant-numeric:tabular-nums}

/* ---------- fight HUD layers (stage coordinates) ---------- */
.hud{position:absolute;left:0;right:0;pointer-events:none;display:none}
.hud.show{display:flex}
.hud button,.hud .tap{pointer-events:auto}
#top{top:0;height:70px;align-items:center;gap:6px;padding:6px 8px;
  background:linear-gradient(180deg,rgba(18,9,31,.96),rgba(18,9,31,.72));border-bottom:2px solid var(--line)}
#portrait{width:54px;height:54px;border-radius:12px;border:2px solid var(--line2);background:#0d0718;flex:0 0 auto}
.stat{display:flex;flex-direction:column;justify-content:center;min-width:52px;height:54px;padding:0 6px;
  border-radius:10px;background:rgba(0,0,0,.28);border:1px solid var(--line);font-weight:900;line-height:1.05}
.stat .k{font-size:12px;letter-spacing:.14em;color:var(--dimmer);text-transform:uppercase}
.stat .v{font-size:17px;color:#fff}
.stat.hp .v{color:var(--blood)}
.stat.hp .blk{color:var(--cyan);font-size:12px}
.stat.gold .v{color:var(--gold)}
.stat.ink .v{color:var(--cyan)}
.stat.act .v{font-size:13px;color:var(--pink2)}
#relics{display:flex;gap:4px;flex:1;min-width:0;height:54px;align-items:center;overflow-x:auto;overflow-y:hidden;padding:0 6px;
  scrollbar-width:none;pointer-events:auto}
#relics::-webkit-scrollbar{display:none}
.relic{width:44px;height:44px;flex:0 0 auto;border-radius:10px;border:2px solid var(--line2);background:#150c26;
  display:flex;align-items:center;justify-content:center;font-size:20px;cursor:pointer;padding:0}
.relic canvas{width:40px;height:40px;display:block}
#playerRow{top:338px;height:44px;align-items:center;gap:8px;padding:0 10px}
#pstatus{display:flex;gap:4px;flex:1;min-width:0;overflow-x:auto;overflow-y:hidden;scrollbar-width:none}
#pstatus::-webkit-scrollbar{display:none}
#pstatus .pip{flex:0 0 auto}
/* a crowded row (six or more) packs tighter; past the width it scrolls instead of hiding chips */
#pstatus.many{gap:2px}
#pstatus.many .pip{padding:0 5px;gap:1px}
.pip{display:inline-flex;align-items:center;gap:3px;height:44px;padding:0 9px;border-radius:9px;
  background:#1a1030;border:1.5px solid var(--line2);font-size:13px;font-weight:900;color:#fff;cursor:pointer;
  pointer-events:auto}
.pip.debuff{border-color:var(--blood)}
.pip.buff{border-color:var(--lime)}
#grabs{display:flex;gap:7px;align-items:center;justify-content:center;min-width:120px;height:40px;padding:0 12px;
  border-radius:20px;background:rgba(18,9,31,.85);border:2px solid var(--line2)}
#grabs .g{width:20px;height:20px;border-radius:50%;border:2.5px solid var(--cyan);background:var(--cyan);
  box-shadow:0 0 10px rgba(46,230,214,.8)}
#grabs .g.used{background:transparent;box-shadow:none;border-color:var(--dimmer)}
#grabs .lbl{font-size:12px;letter-spacing:.14em;color:var(--cyan2);text-transform:uppercase;font-weight:900;margin-right:2px}
#grabs,#pstatus{transition:opacity .2s}
#playerRow.bannerOn #pstatus{opacity:.1}
#banner{position:absolute;left:0;right:0;top:-30px;height:100px;display:flex;align-items:center;justify-content:center;
  pointer-events:none;opacity:0;transition:opacity .2s}
#banner.show{opacity:1}
#banner span{font-size:34px;font-weight:900;letter-spacing:.12em;color:#fff;text-transform:uppercase;
  text-shadow:0 0 22px var(--pink),0 4px 0 #3a0a22;transform:rotate(-3deg)}
#banner.jackpot span{color:var(--gold);text-shadow:0 0 26px var(--gold),0 4px 0 #4d3608;animation:pop .5s ease}
#banner.enemy span{color:var(--blood);text-shadow:0 0 22px var(--blood),0 4px 0 #3a0a0a}
#banner.turn span{color:var(--cyan2);text-shadow:0 0 22px var(--cyan),0 4px 0 #062224}
@keyframes pop{0%{transform:scale(.4) rotate(-8deg)}60%{transform:scale(1.15) rotate(-3deg)}100%{transform:scale(1) rotate(-3deg)}}
#ctrl{top:830px;height:130px;flex-direction:column;gap:6px;padding:6px 10px;
  background:linear-gradient(0deg,rgba(18,9,31,.98),rgba(18,9,31,.8));border-top:2px solid var(--line)}
#tray{display:flex;gap:6px;height:60px;align-items:center;overflow:hidden}
.chip{display:flex;align-items:center;gap:6px;height:56px;padding:4px 10px 4px 4px;border-radius:12px;
  background:linear-gradient(180deg,#2c1d4a,#1b1030);border:2px solid var(--gold);min-width:0;flex:0 1 250px;
  animation:chipIn .35s cubic-bezier(.2,1.4,.4,1);box-shadow:0 0 14px rgba(255,201,77,.25)}
.chip.fade{opacity:0;transition:opacity .5s}
.chip canvas{width:46px;height:46px;flex:0 0 auto}
.chip .n{font-size:13px;font-weight:900;color:var(--gold);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip .t{font-size:12px;color:var(--dim);line-height:1.2;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
@keyframes chipIn{0%{transform:translateY(40px) scale(.6);opacity:0}100%{transform:none;opacity:1}}
.ctrlRow{display:flex;align-items:center;gap:10px;height:52px}
#hint{flex:1;font-size:14px;color:var(--cyan2);letter-spacing:.04em;line-height:1.3;min-width:0}
#endTurn{min-width:150px;height:52px}
#endTurn:disabled{opacity:.45;filter:grayscale(1);border-style:dashed;color:var(--dim)}

/* ---------- popovers, toasts, coach marks ---------- */
#pop{position:absolute;display:none;max-width:300px;padding:10px 12px;font-size:13px;line-height:1.45;
  color:var(--text);z-index:40;pointer-events:none}
#pop.show{display:block}
#pop b{color:var(--gold)}
#toast{position:absolute;left:50%;top:400px;transform:translateX(-50%);padding:10px 16px;border-radius:12px;
  background:rgba(18,9,31,.95);border:2px solid var(--cyan);color:#fff;font-size:15px;font-weight:900;
  letter-spacing:.04em;opacity:0;transition:opacity .25s;pointer-events:none;z-index:45;max-width:500px;text-align:center;line-height:1.35}
#toast.show{opacity:1}
#coach{position:absolute;display:none;left:40px;right:40px;top:540px;padding:14px;z-index:42;gap:10px;
  flex-direction:column;border-color:var(--cyan);pointer-events:auto}
#coach.show{display:flex}
#coach .t{font-size:15px;line-height:1.45}
#coach .t b{color:var(--cyan2)}
#coach .arrow{position:absolute;left:50%;bottom:-14px;width:0;height:0;border-left:12px solid transparent;
  border-right:12px solid transparent;border-top:14px solid var(--cyan);transform:translateX(-50%)}

/* ---------- full screen overlays ---------- */
.screen{position:absolute;inset:0;display:none;flex-direction:column;gap:10px;z-index:20;
  background:rgba(18,9,31,.94);padding:16px;overflow:auto;overscroll-behavior:contain;
  scrollbar-width:none;pointer-events:auto}
.screen::-webkit-scrollbar{display:none}
.screen.show{display:flex}
.screen.clear{background:transparent;pointer-events:none;justify-content:flex-end}
.screen.clear .menu{pointer-events:auto}
.screen.mapHead{background:transparent;pointer-events:none;justify-content:flex-start;padding:0;top:70px;bottom:auto;
  height:100px;gap:0}
.screen.mapHead .mh{pointer-events:auto;background:linear-gradient(180deg,rgba(18,9,31,.92),rgba(18,9,31,.7));
  border-bottom:2px solid var(--line);padding:3px 10px 5px;display:flex;flex-direction:column;gap:1px;height:100px}
.mh .l1{display:flex;align-items:center;gap:8px}
.mh .l1 h2{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:15px}
.mh .l1 .mhInk{font-size:19px;font-weight:900;color:var(--cyan2);letter-spacing:.02em;white-space:nowrap;line-height:1;
  padding:3px 7px;border:2px solid var(--line2);border-radius:10px;background:#1a1030}
.mh .l2{display:flex;align-items:center;gap:6px;min-height:44px}
.mh .l2 .hint{flex:1;min-width:0;font-size:12px;color:var(--dim);line-height:1.2;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.brush{display:inline-flex;align-items:center;gap:3px;height:40px;padding:0 8px;border-radius:10px;flex:0 0 auto;
  border:2px solid var(--line2);background:#1a1030;color:#fff;font-size:13px;font-weight:900;cursor:pointer}
.brush.sel{border-color:var(--lime);color:var(--lime);box-shadow:0 0 12px rgba(166,255,94,.4)}
.menu{display:flex;flex-direction:column;gap:10px;align-items:center;padding:60px 0 24px;
  background:linear-gradient(180deg,rgba(18,9,31,0),rgba(18,9,31,.88) 26%,rgba(18,9,31,.96))}
.menu .btn{width:280px}
.menu .row{justify-content:center}
.menu .row .btn{width:auto;min-width:88px}
.tt-sub{color:var(--cyan2);font-size:13px;letter-spacing:.3em;text-transform:uppercase;text-align:center;font-weight:900}
.footer{color:var(--dimmer);font-size:12px;text-align:center}

/* cards */
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.cards.two{grid-template-columns:repeat(2,1fr)}
.cards.one{grid-template-columns:1fr}
.card{position:relative;display:flex;flex-direction:column;align-items:center;gap:5px;padding:10px 8px;min-height:44px;
  border-radius:14px;border:2px solid var(--line2);background:linear-gradient(180deg,#2c1d4a,#180f2c);
  cursor:pointer;color:var(--text);text-align:center;box-shadow:0 4px 0 #120a22;transition:transform .08s}
.card:active{transform:translateY(3px);box-shadow:none}
.card.sel{border-color:var(--lime);box-shadow:0 0 16px rgba(166,255,94,.45)}
.card.locked{opacity:.5;border-style:dashed;cursor:default}
.card.sold{opacity:.4;cursor:default}
.card canvas{width:84px;height:84px;display:block}
.card .name{font-size:14px;font-weight:900;color:#fff;line-height:1.15}
.card .text{font-size:12px;color:var(--dim);line-height:1.35}
.card .price{font-size:14px;font-weight:900;color:var(--gold)}
.card .rar{position:absolute;top:6px;right:8px;font-size:12px;font-weight:900;letter-spacing:.1em;color:var(--dimmer)}
.card .rar.u{color:var(--cyan)} .card .rar.r{color:var(--pink2)} .card .rar.l{color:var(--gold)} .card .rar.junk{color:var(--blood)}
.card .cnt{position:absolute;top:6px;left:8px;min-width:22px;height:22px;border-radius:11px;background:var(--gold);color:#2a1d04;
  font-size:12px;font-weight:900;display:flex;align-items:center;justify-content:center;padding:0 5px}
.card .plus{position:absolute;bottom:6px;right:8px;font-size:12px;font-weight:900;color:var(--lime)}
.charcard{align-items:stretch;text-align:left;gap:8px;padding:12px}
.charcard .head{display:flex;gap:10px;align-items:center}
.charcard canvas{width:72px;height:72px}
.charcard .name{font-size:18px}
.charcard .title{font-size:12px;color:var(--pink2);letter-spacing:.1em;text-transform:uppercase;font-weight:900}
.charcard .stats{display:flex;gap:6px;flex-wrap:wrap}
.charcard .lock{font-size:12px;color:var(--gold);font-weight:900}
/* claw picker (CLAW TYPES) */
.clawPick{display:flex;flex-direction:column;gap:8px;padding:10px 12px 12px}
.clawRow{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.clawChip{display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px 2px 6px;border-radius:10px;border:2px solid var(--line);
  background:#17102a;cursor:pointer;min-height:44px;transition:transform .08s,border-color .12s}
.clawChip:active{transform:scale(.95)}
.clawChip.on{border-color:var(--cyan);background:#1b2438;box-shadow:0 0 14px rgba(46,230,214,.45)}
.clawChip canvas{width:58px;height:58px}
.clawChip .n{font-size:12px;font-weight:900;text-align:center;line-height:1.1;color:var(--text)}
.clawInfo{display:flex;gap:10px;align-items:flex-start}
.clawInfo canvas.clawDemo{width:200px;height:141px;border-radius:10px;flex:0 0 auto;border:2px solid var(--line)}
.clawInfo .col{gap:5px;min-width:0}
.clawInfo .name{font-size:17px;font-weight:900}
.clawInfo .text{font-size:12px;color:var(--dim);line-height:1.35}
.clawInfo .cpips{display:flex;flex-direction:column;gap:1px}
.clawInfo .cpip{display:flex;gap:6px;font-size:12px;align-items:center}
.clawInfo .cpip .k{width:50px;color:var(--dimmer);font-weight:900;letter-spacing:.06em;text-transform:uppercase}
.clawInfo .cpip .v{color:var(--gold);letter-spacing:.08em}
.clawInfo .stats{display:flex;gap:4px;flex-wrap:wrap}
.clawInfo .stats .tag{font-size:12px;padding:2px 7px}
.clawInfo .joke{font-size:12px;font-style:italic;color:var(--pink2);line-height:1.3}
.choice{display:flex;flex-direction:column;align-items:flex-start;gap:3px;padding:10px 14px;min-height:56px;text-align:left;
  text-transform:none;letter-spacing:0;width:100%}
.choice .c1{font-size:15px}
.choice .c2{font-size:12px;color:var(--dim);font-weight:700}
.list{display:flex;flex-direction:column;gap:8px}
.kv{display:flex;justify-content:space-between;gap:10px;font-size:14px;padding:6px 10px;border-radius:8px;background:rgba(0,0,0,.25)}
.kv b{color:var(--gold)}
.help p{margin:0 0 6px;font-size:14px;line-height:1.5;color:var(--dim)}
.help b{color:#fff}
.help h3{margin-top:8px}
.statusList{display:flex;flex-direction:column;gap:4px}
.statusList .kv{font-size:13px}
.eventArt{height:110px;border-radius:12px;border:2px solid var(--line);background:#0d0718;display:block;width:100%}
.eventPic{height:auto;aspect-ratio:3/2;max-height:220px;object-fit:cover}
/* optional PNG icons: js/art.js adds .art-ui-<key> to <html> once art/ui/<key>.png has loaded */
.art-ui-coin .stat.gold .k::before,.art-ui-ink .stat.ink .k::before,.art-ui-brush .brush::before{content:'';display:inline-block;
  width:14px;height:14px;margin-right:3px;vertical-align:-2px;background:center/contain no-repeat}
.art-ui-coin .stat.gold .k::before{background-image:url(art/ui/coin.png)}
.art-ui-ink .stat.ink .k::before{background-image:url(art/ui/ink.png)}
.art-ui-brush .brush::before{width:20px;height:20px;margin-right:0;background-image:url(art/ui/brush.png)}
.shopSec{display:flex;flex-direction:column;gap:8px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.grid4 .card canvas{width:56px;height:56px}
.grid4 .card .name{font-size:12px}
.grid4 .card .text{display:none}
.center{text-align:center}
.spacer{flex:1}

/* ---------- juice ---------- */
.btn{transition:transform .08s cubic-bezier(.3,1.6,.5,1),filter .12s,box-shadow .12s}
.btn:active{transform:translateY(3px) scale(.96,.92)}
@media (hover:hover){
  .btn:not(:disabled):hover{filter:brightness(1.18);box-shadow:0 4px 0 #120a22,0 0 20px rgba(255,46,136,.45)}
  .card:not(.locked):not(.sold):hover{transform:perspective(500px) rotateX(4deg) rotateY(-5deg) translateY(-4px);
    box-shadow:0 10px 20px rgba(0,0,0,.45),0 0 18px rgba(255,255,255,.12)}
  .relic:hover{filter:brightness(1.25)}
}
.card{transition:transform .14s ease,box-shadow .14s}
.card:active{transform:scale(.96)}
/* rarity: uncommon cyan rim, rare gold pulse, legendary rainbow sheen */
.card.rr-u{border-color:#1f8f88}
.card.rr-r{border-color:var(--gold);animation:rarePulse 1.8s ease-in-out infinite}
.card.rr-l{border-color:var(--pink);overflow:hidden;animation:rarePulse 1.4s ease-in-out infinite}
.card.rr-l::after{content:'';position:absolute;inset:-40%;pointer-events:none;mix-blend-mode:screen;
  background:linear-gradient(115deg,transparent 40%,rgba(255,46,136,.35) 45%,rgba(255,201,77,.35) 50%,rgba(46,230,214,.35) 55%,transparent 60%);
  animation:sheen 2.4s linear infinite}
@keyframes rarePulse{0%,100%{box-shadow:0 4px 0 #120a22,0 0 6px rgba(255,201,77,.25)}50%{box-shadow:0 4px 0 #120a22,0 0 22px rgba(255,201,77,.6)}}
.card.rr-l{--glow:rgba(255,46,136,.6)}
@keyframes sheen{0%{transform:translateX(-60%)}100%{transform:translateX(60%)}}
/* cards deal in with a flip (the delay is set per card) */
.card.deal{animation:dealIn .5s cubic-bezier(.2,1.3,.4,1) both}
.card.rr-r.deal{animation:dealIn .5s cubic-bezier(.2,1.3,.4,1) both,rarePulse 1.8s ease-in-out .6s infinite}
.card.rr-l.deal{animation:dealIn .5s cubic-bezier(.2,1.3,.4,1) both,rarePulse 1.4s ease-in-out .6s infinite}
@keyframes dealIn{0%{opacity:0;transform:perspective(600px) translateY(-60px) rotateY(180deg) scale(.6)}
  60%{opacity:1}100%{opacity:1;transform:perspective(600px) translateY(0) rotateY(0) scale(1)}}
.card.nope{animation:nope .3s}
@keyframes nope{0%,100%{transform:none}25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
.card .stamp{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%) rotate(-14deg);padding:2px 10px;
  border:3px solid var(--blood);border-radius:8px;color:var(--blood);font-size:22px;font-weight:900;letter-spacing:.12em;
  background:rgba(18,9,31,.6);pointer-events:none;opacity:.9}
.card .stamp.slam{animation:slam .35s cubic-bezier(.3,1.5,.5,1) both}
@keyframes slam{0%{transform:translate(-50%,-50%) rotate(-30deg) scale(3);opacity:0}100%{transform:translate(-50%,-50%) rotate(-14deg) scale(1);opacity:.9}}
/* keyword chips (DATA.keywords): the build's archetypes on every card */
.kws{display:flex;flex-wrap:wrap;gap:3px;justify-content:center}
.kw{font-size:12px;font-weight:900;line-height:1;padding:3px 6px;border-radius:7px;border:1.5px solid var(--line2);
  color:var(--dim);background:rgba(0,0,0,.3);letter-spacing:.02em;white-space:nowrap}
.kws.sm{justify-content:flex-start}
.kws.sm .kw{font-size:12px;padding:1px 5px}
/* relic reveal: rays spin behind the icon as it rises */
.relicReveal{overflow:hidden;padding-top:18px;animation:revealIn .6s cubic-bezier(.2,1.4,.4,1) both}
.relicReveal .rays{position:absolute;left:50%;top:60px;width:340px;height:340px;margin:-170px 0 0 -170px;pointer-events:none;
  background:repeating-conic-gradient(from 0deg,rgba(255,201,77,.28) 0deg 10deg,transparent 10deg 24deg);
  -webkit-mask:radial-gradient(circle,#000 20%,transparent 68%);mask:radial-gradient(circle,#000 20%,transparent 68%);
  animation:spin 6s linear infinite}
.relicReveal canvas.relicIcon{position:relative;width:110px;height:110px;animation:floaty 2.4s ease-in-out infinite}
.col>.tag{align-self:flex-start}
@keyframes revealIn{0%{opacity:0;transform:scale(.4) translateY(40px)}100%{opacity:1;transform:none}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.row.pops .tag{animation:tagPop .45s cubic-bezier(.2,1.6,.4,1) both}
.row.pops .tag:nth-child(2){animation-delay:.08s}.row.pops .tag:nth-child(3){animation-delay:.16s}
@keyframes tagPop{0%{transform:scale(0)}100%{transform:scale(1)}}
/* HUD counters: a bump on a gain, a dip on a spend, floats flying in */
.stat.bump{animation:bump .35s cubic-bezier(.2,1.8,.4,1)}
.stat.dip{animation:dip .3s ease}
.tag.dip{animation:dip .3s ease}
@keyframes bump{0%{transform:scale(1)}40%{transform:scale(1.18);filter:brightness(1.6)}100%{transform:scale(1)}}
@keyframes dip{0%{transform:none}40%{transform:scale(.9) translateY(2px);filter:brightness(.8)}100%{transform:none}}
.dfloat{position:absolute;z-index:46;transform:translate(-50%,-50%);font-size:17px;font-weight:900;pointer-events:none;
  text-shadow:0 2px 0 #12091f,0 0 10px currentColor;animation:dfloat 1.1s ease-out forwards}
.dfloat.gold{color:var(--gold)} .dfloat.cyan{color:var(--cyan2)}
@keyframes dfloat{0%{opacity:0;transform:translate(-50%,-10%) scale(.5)}15%{opacity:1;transform:translate(-50%,-50%) scale(1.2)}100%{opacity:0;transform:translate(-50%,-160%) scale(1)}}
.dfly{position:absolute;z-index:47;pointer-events:none;transform:translate(-50%,-50%)}
.dcoin{width:14px;height:14px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff6c0,#ffc94d 45%,#c98a1a);
  border:2px solid #12091f;box-shadow:0 0 8px rgba(255,201,77,.7)}
.flycard{padding:6px;border-radius:12px;border:2px solid var(--gold);background:#2c1d4a;box-shadow:0 0 20px rgba(255,201,77,.5)}
.flycard canvas{width:64px;height:64px;display:block}
/* the player's hp: a drain bar with a ghost, a shake on hits, a shield sheen */
.stat.hp{position:relative;overflow:hidden}
.hpbar{position:absolute;left:4px;right:4px;bottom:3px;height:4px;border-radius:2px;background:rgba(0,0,0,.5)}
.hpbar i{position:absolute;left:0;top:0;bottom:0;border-radius:2px;width:100%}
.hpbar .gh{background:#fff;transition:width .5s ease .35s}
.hpbar .fl{background:var(--blood);transition:width .12s ease-out}
#hpStat.hit{animation:hudHit .35s}
@keyframes hudHit{0%,100%{transform:none}20%{transform:translateX(-5px);background:rgba(255,46,48,.45)}40%{transform:translateX(5px)}60%{transform:translateX(-3px)}80%{transform:translateX(2px)}}
#hpStat.clank{animation:clank .35s}
@keyframes clank{0%{box-shadow:0 0 0 0 rgba(46,230,214,.9)}100%{box-shadow:0 0 0 12px rgba(46,230,214,0)}}
#hpStat.shield,#hpStat.heal{animation:glowIn .5s}
#hpStat.heal{--gc:rgba(166,255,94,.7)}
@keyframes glowIn{0%{box-shadow:0 0 0 0 var(--gc,rgba(46,230,214,.8)),inset 0 0 12px var(--gc,rgba(46,230,214,.8))}100%{box-shadow:0 0 0 10px transparent,inset 0 0 0 transparent}}
#hpStat.shielded{border-color:var(--cyan)}
#hpStat.shielded::after{content:'';position:absolute;top:0;bottom:0;width:18px;left:-30px;pointer-events:none;
  background:linear-gradient(90deg,transparent,rgba(191,232,255,.35),transparent);transform:skewX(-20deg);animation:shimmer 2.2s linear infinite}
@keyframes shimmer{0%{left:-30px}60%,100%{left:110%}}
#hpStat.low{animation:lowPulse .95s ease-in-out infinite}
@keyframes lowPulse{0%,100%{border-color:var(--line)}12%{border-color:var(--blood);box-shadow:0 0 14px rgba(255,46,48,.6)}}
/* relic procs, status chips, grabs */
.relic{transition:transform .1s}
.relic.proc{animation:proc .55s cubic-bezier(.2,1.8,.4,1)}
@keyframes proc{0%{transform:scale(1)}30%{transform:scale(1.18) rotate(-6deg);border-color:var(--gold);background:#4d3608;box-shadow:inset 0 0 12px rgba(255,201,77,.9)}
  100%{transform:scale(1);box-shadow:inset 0 0 0 rgba(255,201,77,0)}}
.pip.pop,.pip{animation:pipIn .4s cubic-bezier(.2,1.8,.4,1)}
@keyframes pipIn{0%{transform:scale(.3)}60%{transform:scale(1.2)}100%{transform:scale(1)}}
#grabs .g{transition:background .2s,box-shadow .2s,transform .2s}
#grabs .g.used{transform:scale(.8)}
#grabs.bump{animation:bump .4s cubic-bezier(.2,1.8,.4,1)}
.chip .col{gap:1px;min-width:0}
.chip.haskw .t{-webkit-line-clamp:1}
.chip .kws{margin-top:2px}
.chip.rr-r{border-color:var(--gold)} .chip.rr-l{border-color:var(--pink);box-shadow:0 0 16px rgba(255,46,136,.4)} .chip.rr-c{border-color:var(--line2)} .chip.rr-u{border-color:var(--cyan)}
/* banners: each kind has its own entrance, replayed on every call */
#banner.show span{animation:bTurn .5s cubic-bezier(.2,1.5,.4,1) both}
#banner.turn.show span{animation:bTurn .5s cubic-bezier(.2,1.5,.4,1) both}
#banner.enemy.show span{animation:bEnemy .5s cubic-bezier(.2,1.3,.4,1) both}
#banner.jackpot.show span{animation:pop .5s ease both,jackGlow .25s linear .5s 4 alternate}
#banner.victory.show span{color:var(--gold);font-size:46px;text-shadow:0 0 26px var(--gold),0 5px 0 #4d3608;
  animation:bSweep .6s cubic-bezier(.2,1.2,.4,1) both,shine 1.1s ease-in-out .6s infinite}
@keyframes bTurn{0%{transform:translateX(-120px) scale(.6) rotate(-3deg);opacity:0}100%{transform:rotate(-3deg);opacity:1}}
@keyframes bEnemy{0%{transform:translateX(140px) skewX(-20deg) rotate(-3deg);opacity:0}70%{transform:translateX(-8px) skewX(6deg) rotate(-3deg)}100%{transform:rotate(-3deg);opacity:1}}
@keyframes bSweep{0%{transform:translateX(-300px) skewX(-30deg) scale(1.4);opacity:0}70%{transform:translateX(10px) skewX(8deg)}100%{transform:rotate(-3deg);opacity:1}}
@keyframes shine{0%,100%{filter:brightness(1)}50%{filter:brightness(1.5)}}
@keyframes jackGlow{to{text-shadow:0 0 40px var(--gold),0 0 12px #fff,0 4px 0 #4d3608}}
/* named combo banner: stacked name + rules text, scaled by tier */
#combo{position:absolute;left:0;right:0;top:96px;display:none;flex-direction:column;align-items:center;pointer-events:none;z-index:30;
  --cc:#ffc94d}
#combo.show{display:flex}
#combo .cn{white-space:nowrap;font-size:34px;font-weight:900;letter-spacing:.1em;text-transform:uppercase;color:#fff;
  text-shadow:0 0 18px var(--cc),0 4px 0 #12091f,-3px 0 0 rgba(255,46,136,.6),3px 0 0 rgba(46,230,214,.6);
  transform:rotate(-4deg);animation:cIn .55s cubic-bezier(.2,1.6,.4,1) both, cOut .3s ease-in var(--out,1.2s) both}
#combo .ct{margin-top:4px;padding:5px 12px;border-radius:10px;background:rgba(18,9,31,.9);border:2px solid var(--cc);
  font-size:14px;font-weight:900;color:var(--cc);max-width:440px;text-align:center;animation:ctIn .45s ease .12s both, cOut .3s ease-in var(--out,1.2s) both}
#combo .ct:empty{display:none}
#combo .cburst{position:absolute;top:26px;left:50%;width:10px;height:10px;border-radius:50%;
  box-shadow:0 0 0 0 var(--cc);animation:cBurst .6s ease-out both}
#combo.t3{--out:1.8s}
#combo.t3 .cn{animation:cIn3 .7s cubic-bezier(.2,1.6,.4,1) both,cShake .08s linear .7s 6,cOut .3s ease-in 1.8s both}
#combo.t2{--out:1.5s}
/* the announcer's quick exit: a bigger banner is coming, or this one is done */
#banner.quick{transition:opacity .1s}
#combo.out .cn,#combo.out .ct{animation:cOut .12s ease-in both!important}
@keyframes cIn{0%{transform:scale(3) rotate(-12deg);opacity:0}100%{transform:scale(1) rotate(-4deg);opacity:1}}
@keyframes cIn3{0%{transform:scale(2.6) rotate(10deg);opacity:0;filter:blur(6px)}100%{transform:scale(1) rotate(-4deg);opacity:1;filter:none}}
@keyframes cShake{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(-4deg) translate(3px,-2px)}}
@keyframes ctIn{0%{transform:translateY(-10px) scaleY(0);opacity:0}100%{transform:none;opacity:1}}
@keyframes cOut{to{opacity:0;transform:translateY(-20px) scale(.9) rotate(-4deg)}}
@keyframes cBurst{0%{box-shadow:0 0 0 0 var(--cc);opacity:1}100%{box-shadow:0 0 0 160px transparent;opacity:0}}
/* screen transitions */
#wipe{position:absolute;inset:0;z-index:55;pointer-events:none;overflow:hidden;display:none}
#wipe.iris,#wipe.swipe,#wipe.fade,#wipe.bleed{display:block}
#wipe.iris::before{content:'';position:absolute;left:50%;top:48%;width:0;height:0;border-radius:50%;transform:translate(-50%,-50%);
  box-shadow:0 0 0 1400px #12091f,inset 0 0 26px 8px rgba(255,46,136,.9);animation:iris .5s cubic-bezier(.5,0,.3,1) forwards}
@keyframes iris{0%{width:0;height:0}100%{width:1500px;height:1500px;box-shadow:0 0 0 1400px rgba(18,9,31,0),inset 0 0 26px 8px rgba(255,46,136,0)}}
#wipe.swipe::before{content:'';position:absolute;top:-10%;bottom:-10%;left:-20%;width:140%;
  background:linear-gradient(100deg,#12091f 0 70%,var(--pink) 70% 73%,#12091f 73% 76%,var(--cyan) 76% 78%,transparent 78%);
  transform:skewX(-12deg) translateX(0);animation:swipe .42s cubic-bezier(.6,0,.4,1) forwards}
@keyframes swipe{to{transform:skewX(-12deg) translateX(110%)}}
#wipe.fade{background:#12091f;animation:fadeOut .3s ease forwards}
#wipe.bleed{background:radial-gradient(circle,rgba(255,46,48,.1),rgba(120,0,20,.85));animation:fadeOut 1.1s ease forwards}
@keyframes fadeOut{to{opacity:0}}
#scr-gameover.show .col{animation:goIn .8s cubic-bezier(.2,1.2,.4,1) both}
@keyframes goIn{0%{transform:translateY(-80px) rotate(-4deg);opacity:0;filter:grayscale(1)}100%{transform:none;opacity:1}}
#scr-win.show .col,#scr-reward.show h1,#scr-treasure.show h1{animation:tagPop .5s cubic-bezier(.2,1.6,.4,1) both}
/* settings: Shake off calms the heavy CSS motion too */
.calm .card.deal,.calm .card.rr-r,.calm .card.rr-l,.calm #hpStat.hit,.calm #hpStat.low,.calm .relicReveal .rays,.calm #combo .cn,.calm #wipe::before{animation-duration:.01s!important;animation-iteration-count:1!important}
.calm .card:hover{transform:none}
@media (prefers-reduced-motion:reduce){.card.deal,.relicReveal .rays,#wipe::before,#combo .cn,#hpStat.low{animation:none!important}#wipe{display:none!important}}

/* ---------- loot: tickets, payout, capsules, prize counter (DESIGN.md "Loot") ---------- */
.stat.tix .v{color:#ff9ec7}
.tixi{display:inline-block;font-style:normal;font-size:.9em;line-height:1;margin-left:3px;vertical-align:0;
  filter:drop-shadow(0 0 4px rgba(255,158,199,.7))}
.tixi::before{content:'\1F39F\FE0F'}
/* the payout receipt: lines tick in, the total slams */
.payout{position:relative;padding:10px 12px 8px;border-radius:14px;border:2px dashed #5a3f8f;
  background:linear-gradient(180deg,#1d1236,#140b26);box-shadow:inset 0 0 22px rgba(255,201,77,.08)}
.payout .ph{display:flex;justify-content:space-between;font-size:12px;letter-spacing:.2em;color:var(--dimmer);font-weight:900;text-transform:uppercase;margin-bottom:4px}
.pl{display:grid;grid-template-columns:1fr 70px 78px;align-items:center;gap:6px;padding:4px 2px;font-size:15px;font-weight:900;
  border-bottom:1px solid rgba(90,63,143,.4)}
.pl .lb{color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pl .g{color:var(--gold);text-align:right}
.pl .x{color:#ff9ec7;text-align:right}
.pl.wait{visibility:hidden}
.pl.in{animation:plIn .32s cubic-bezier(.2,1.6,.4,1) both}
.pl.jackpot .lb,.pl.combo .lb{color:var(--gold)} .pl.flawless .lb{color:var(--lime)} .pl.speedy .lb{color:var(--cyan2)} .pl.overkill .lb{color:var(--blood)}
.pl.double{border:2px solid var(--gold);border-radius:10px;background:rgba(255,201,77,.12)}
.pl.double .lb{color:var(--gold);letter-spacing:.06em}
@keyframes plIn{0%{transform:translateX(-40px) scale(.8);opacity:0}100%{transform:none;opacity:1}}
.ptot{display:grid;grid-template-columns:1fr 70px 78px;white-space:nowrap;align-items:center;gap:6px;padding:8px 2px 2px;font-size:22px;font-weight:900}
.ptot .lb{letter-spacing:.2em;color:var(--dim);font-size:14px}
.ptot .g{color:var(--gold);text-align:right;text-shadow:0 0 14px rgba(255,201,77,.6)} .ptot .x{color:#ff9ec7;text-align:right;text-shadow:0 0 14px rgba(255,158,199,.6)}
.ptot.wait{visibility:hidden}
.ptot.slam{animation:totSlam .45s cubic-bezier(.2,1.8,.4,1) both}
@keyframes totSlam{0%{transform:scale(2.4) rotate(-6deg);opacity:0;filter:brightness(2)}60%{transform:scale(.94) rotate(1deg);opacity:1}100%{transform:none}}
.payout.shake{animation:nope .25s}
.payout .skipT{position:absolute;right:10px;bottom:-18px;font-size:12px;color:var(--dimmer);letter-spacing:.1em}
.rwWait{opacity:0;pointer-events:none}
.rwShow{animation:tagPop .4s cubic-bezier(.2,1.6,.4,1) both}
/* the lucky roulette: a strip of multipliers flicks past a window and lands */
.roul{position:relative;height:44px;border-radius:12px;border:2px solid var(--gold);overflow:hidden;background:#140b26;
  box-shadow:0 0 18px rgba(255,201,77,.35)}
.roul .strip{position:absolute;left:0;top:0;display:flex;height:100%;will-change:transform}
.roul .cell{flex:0 0 90px;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:900;color:var(--dim)}
.roul .cell.x2{color:var(--gold);text-shadow:0 0 12px var(--gold)}
.roul.wait{visibility:hidden}
.payout .skipT.gone{display:none}
.roul::after{content:'';position:absolute;left:50%;top:0;bottom:0;width:90px;margin-left:-45px;border-left:2px solid var(--pink);border-right:2px solid var(--pink);
  background:rgba(255,46,136,.08);pointer-events:none}
.roul.won{animation:rouWin .5s ease 3}
@keyframes rouWin{50%{box-shadow:0 0 34px rgba(255,201,77,.9);border-color:#fff}}
/* capsules waiting on the reward screen / the map */
.capslot{display:flex;align-items:center;gap:10px;padding:8px 12px;min-height:56px;border-radius:14px;border:2px solid var(--cc,#b9b0cc);
  background:linear-gradient(90deg,rgba(255,255,255,.06),rgba(18,9,31,.4));cursor:pointer;color:#fff;text-align:left;width:100%;
  font:inherit;animation:capPulse 1.2s ease-in-out infinite}
.capslot canvas{width:48px;height:48px;flex:0 0 auto}
.capslot .c1{font-size:15px;font-weight:900;color:var(--cc,#fff);letter-spacing:.06em;text-transform:uppercase}
.capslot .c2{font-size:12px;color:var(--dim)}
.capslot.done{animation:none;opacity:.45;cursor:default}
@keyframes capPulse{0%,100%{box-shadow:0 0 0 rgba(255,255,255,0)}50%{box-shadow:0 0 18px var(--cc,#b9b0cc)}}
.brush.capchip{border-color:var(--pink);color:#fff;gap:2px;padding:0 8px 0 2px;animation:capPulse 1.2s ease-in-out infinite;--cc:#ff2e88}
.brush.capchip canvas{width:34px;height:34px}
/* the capsule ritual: the canvas draws the capsule, the DOM frames it */
.screen.capsule{background:transparent;padding:0;cursor:pointer}
.capBody{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;pointer-events:none}
.capBody .btn,.capBody .prize{pointer-events:auto}
.capTop{margin-top:92px;display:flex;flex-direction:column;align-items:center;gap:4px;--cc:#b9b0cc}
.capTier{font-size:38px;font-weight:900;letter-spacing:.12em;text-transform:uppercase;color:var(--cc);
  text-shadow:0 0 22px var(--cc),0 4px 0 #12091f;transform:rotate(-3deg)}
.capTier.up{animation:capUp .6s cubic-bezier(.2,1.7,.4,1) both}
.capTier.lg{background:linear-gradient(90deg,#ff6bb0,#ffe28a,#c8ff8f,#8dfff5,#c3adff,#ff6bb0);background-size:200% 100%;
  -webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:none;
  filter:drop-shadow(0 0 10px rgba(255,201,77,.85)) drop-shadow(0 3px 0 #12091f);animation:rainbow 1.2s linear infinite}
.capTier.lg.up{animation:capUp .6s cubic-bezier(.2,1.7,.4,1) both,rainbow 1.2s linear infinite}
@keyframes capUp{0%{transform:scale(2.6) rotate(8deg);filter:brightness(3) blur(3px);opacity:0}100%{transform:rotate(-3deg);opacity:1}}
@keyframes rainbow{to{background-position:200% 0}}
.capUpTag{font-size:16px;font-weight:900;letter-spacing:.3em;color:#fff;padding:3px 12px;border-radius:9px;background:var(--pink);
  box-shadow:0 0 18px var(--pink);animation:tagPop .45s cubic-bezier(.2,1.8,.4,1) both}
.capSrc{font-size:13px;letter-spacing:.2em;color:var(--dim);text-transform:uppercase;font-weight:900}
.capPity{font-size:12px;color:var(--dimmer);letter-spacing:.08em}
.capPity b{color:var(--pink2)}
.capHint{position:absolute;top:640px;left:0;right:0;text-align:center;font-size:22px;font-weight:900;letter-spacing:.2em;color:#fff;
  text-shadow:0 0 16px var(--cc,#fff);animation:hintBlink 1s ease-in-out infinite}
.capHint small{display:block;font-size:13px;letter-spacing:.1em;color:var(--dim);margin-top:4px}
@keyframes hintBlink{50%{opacity:.45}}
.capSkip{position:absolute;right:14px;bottom:22px}
.prize{position:absolute;top:548px;left:40px;right:40px;display:flex;flex-direction:column;align-items:center;gap:6px;padding:14px;
  border-radius:16px;border:3px solid var(--cc,#ffc94d);background:linear-gradient(180deg,#2c1d4a,#150c26);
  box-shadow:0 0 30px var(--cc,#ffc94d),0 10px 30px rgba(0,0,0,.6);animation:prizeIn .5s cubic-bezier(.2,1.5,.4,1) both;cursor:default}
.prize .pic{width:84px;height:84px;display:flex;align-items:center;justify-content:center;font-size:52px;line-height:1;margin-top:-58px;
  border-radius:50%;background:radial-gradient(circle,#3a2a60,#1b1030);border:3px solid var(--cc,#ffc94d);box-shadow:0 0 20px var(--cc,#ffc94d)}
.prize .pic canvas{width:76px;height:76px}
.prize .pn{font-size:20px;font-weight:900;color:#fff;text-align:center}
.prize .pk{font-size:12px;font-weight:900;letter-spacing:.2em;color:var(--cc,#ffc94d);text-transform:uppercase}
.prize .pt{font-size:13px;color:var(--dim);text-align:center;line-height:1.4}
@keyframes prizeIn{0%{transform:translateY(-120px) scale(.3);opacity:0}100%{transform:none;opacity:1}}
/* the prize counter: a glass case of prizes with ticket tags */
.counterHead{display:flex;align-items:center;gap:10px}
.counterHead h1{flex:1;font-size:26px;color:#ff9ec7;text-shadow:0 0 18px #ff2e88,0 0 4px #fff;animation:neon 3s linear infinite}
@keyframes neon{0%,92%,100%{opacity:1}94%{opacity:.4}96%{opacity:1}97%{opacity:.6}}
.tixbal{font-size:20px;font-weight:900;color:#ff9ec7;padding:6px 12px;border-radius:12px;border:2px solid #7a1a4c;background:#17102a;white-space:nowrap}

<body>
<div id="wrap"><div id="stage">
  <canvas id="cv" width="540" height="960"></canvas>

  <!-- top bar: portrait, hp/block, gold, bulbs (the light stat, id inkTxt), act, relics -->
  <div id="top" class="hud">
    <canvas id="portrait" width="108" height="108" class="tap"></canvas>
    <div class="stat hp tap" id="hpStat"><span class="k">HP</span><span class="v mono" id="hpTxt">0/0</span><span class="blk mono" id="blockTxt"></span><span class="hpbar"><i class="gh" id="hpGhost"></i><i class="fl" id="hpFill"></i></span></div>
    <div class="stat gold"><span class="k">Gold</span><span class="v mono" id="goldTxt">0</span></div>
    <div class="stat ink"><span class="k">Bulbs</span><span class="v mono" id="inkTxt">0</span></div>
    <div class="stat tix" id="tixStat"><span class="k">Tix</span><span class="v mono" id="tixTxt">0</span></div>
    <div class="stat act"><span class="k">Act</span><span class="v" id="actTxt">1</span></div>
    <div id="relics"></div>
  </div>

  <!-- player row: statuses, grabs pips, turn banner -->
  <div id="playerRow" class="hud">
    <div id="pstatus"></div>
    <div id="grabs"></div>
    <div id="banner"><span id="bannerTxt"></span></div>
  </div>

  <!-- control bar -->
  <div id="ctrl" class="hud">
    <div id="tray"></div>
    <div class="ctrlRow">
      <div id="hint">steer and release</div>
      <button id="endTurn" class="btn pri">End turn</button>
    </div>
  </div>

  <!-- named grab combos (the synergy events) -->
  <div id="combo"><div class="cburst"></div><div class="cn" id="comboName"></div><div class="ct" id="comboText"></div></div>

  <div id="coach" class="panel"><div class="t" id="coachTxt"></div><div class="row"><button id="coachBtn" class="btn go sm">Got it</button></div><div class="arrow"></div></div>
  <div id="pop" class="panel"></div>
  <div id="toast"></div>
  <!-- FEEL: the tip card (one at a time, a tap puts it away) -->
  <div id="tipCard" class="panel"><canvas id="tipArt" width="128" height="128"></canvas><div class="tx"><div class="k">TIP</div><div class="n" id="tipTitle"></div><div class="t" id="tipText"></div></div><div class="x">TAP</div></div>

  <!-- overlays -->
  <div id="scr-title" class="screen clear"><div class="menu" id="titleMenu"></div></div>
  <div id="scr-chars" class="screen"><div id="charsBody" class="col"></div></div>
  <div id="scr-map" class="screen mapHead"><div class="mh" id="mapHead"></div></div>
  <div id="scr-reward" class="screen"><div id="rewardBody" class="col"></div></div>
  <div id="scr-shop" class="screen"><div id="shopBody" class="col"></div></div>
  <div id="scr-event" class="screen"><div id="eventBody" class="col"></div></div>
  <div id="scr-rest" class="screen"><div id="restBody" class="col"></div></div>
  <div id="scr-forge" class="screen"><div id="forgeBody" class="col"></div></div>
  <div id="scr-treasure" class="screen"><div id="treasureBody" class="col"></div></div>
  <div id="scr-parts" class="screen"><div id="partsBody" class="col"></div></div>
  <div id="scr-bin" class="screen"><div id="binBody" class="col"></div></div>
  <div id="scr-gameover" class="screen"><div id="gameoverBody" class="col"></div></div>
  <div id="scr-win" class="screen"><div id="winBody" class="col"></div></div>
  <div id="scr-help" class="screen"><div id="helpBody" class="col help"></div></div>
  <div id="scr-collection" class="screen"><div id="collectionBody" class="col"></div></div>
  <div id="scr-stickers" class="screen"><div id="stickersBody" class="col"></div></div>
  <div id="scr-tips" class="screen"><div id="tipsBody" class="col"></div></div>
  <!-- loot: the capsule ritual (the canvas draws the capsule under it) and the prize counter -->
  <div id="scr-capsule" class="screen capsule"><div id="capsuleBody" class="capBody"></div></div>
  <div id="scr-counter" class="screen"><div id="counterBody" class="col"></div></div>
  <!-- ARCADE: the mini-game cabinets (the canvas draws the machine under this frame) -->
  <div id="scr-arcade" class="screen arcade"><div id="arcadeBody" class="arcBody"></div></div>
  <!-- ENDLESS: the loop reboot (a CRT powering on) -->
  <div id="scr-loop" class="screen loop"><div id="loopBody"></div></div>
  <!-- VAULT: the Prize Vault (the canvas paints the prize wall and the preview window under this frame) -->
  <div id="scr-vault" class="screen vault"><div id="vaultBody" class="vaultBody"></div></div>
  <!-- SECRET: the hidden door and the true ending (the canvas paints the scene under this frame) -->
  <div id="scr-secret" class="screen secret"><div id="secretBody"></div></div>
  <!-- SETS (round 6): the boon draft (the canvas draws the machine) and the Compactor (the canvas draws the press), the set fanfare -->
  <div id="scr-boon" class="screen boonScr"><div id="boonBody" class="boonBody"></div></div>
  <div id="scr-compactor" class="screen cmpScr"><div id="cmpBody" class="cmpBody"></div></div>
  <!-- SEASON (round 7): a trick-or-treat door (the canvas paints the haunted house under this frame) -->
  <div id="scr-sea" class="screen seaScr"><div id="seaBody"></div></div>
  <div id="setFan"></div>
  <!-- screen transitions (iris / wipe / fade), never takes input -->
  <div id="wipe"></div>
</div></div>
