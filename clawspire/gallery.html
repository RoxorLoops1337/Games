<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Clawspire art gallery</title>
<!-- The art team's review page (round 31): every drawable in js/render.js from the live data, each section's canvas
     sized from its content. Scale: "2x" for review, "play" for the size the game draws it at. Backdrop: dark or light. -->
<style>
  :root { --bg: #0b0616; --cv: #12091f; --fg: #e9dcc4; --line: #2a2340; }
  body.light { --bg: #d9d3e6; --cv: #efeaf7; --fg: #23183a; --line: #b8aecd; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 14px system-ui, sans-serif; }
  header { position: sticky; top: 0; z-index: 2; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; padding: 8px 12px;
    background: color-mix(in srgb, var(--bg) 92%, transparent); border-bottom: 1px solid var(--line); }
  header b { margin-right: 8px; color: #ff6bb0; letter-spacing: .06em; }
  header button { font: inherit; font-size: 13px; padding: 5px 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--cv); color: var(--fg); cursor: pointer; }
  header button.on { border-color: #2ee6d6; color: #2ee6d6; }
  header nav { display: flex; flex-wrap: wrap; gap: 4px 10px; font-size: 12px; }
  header nav a { color: inherit; opacity: .75; }
  h2 { margin: 22px 12px 6px; font-size: 16px; color: #2ee6d6; }
  canvas { display: block; margin: 0 12px 8px; background: var(--cv); border: 1px solid var(--line); max-width: calc(100% - 24px); }
  .note { margin: 0 12px 10px; opacity: .7; font-size: 13px; }
</style>
</head>
<body>
<header>
  <b>CLAWSPIRE ART</b>
  <button id="scale2" class="on">2x review</button><button id="scale1">play size</button>
  <button id="bgDark" class="on">dark</button><button id="bgLight">light</button>
  <nav id="nav"></nav>
</header>
<div class="note">Every drawable in js/render.js, from the live data (DATA.ITEMS, RELICS, ENEMIES, STATUS, CLAWS, EVENTS). Labels are ids. Canvases size to their content.</div>
<div id="sections"></div>
<script src="js/util.js"></script>
<script src="js/art.js"></script>
<script src="js/i18n.js"></script>
<script src="js/physics.js"></script>
<script src="js/data.js"></script>
<script src="js/combat.js"></script>
<script src="js/map.js"></script>
<script src="js/render.js"></script>
<script>
(() => {
  const R = RENDER, D = typeof DATA !== 'undefined' ? DATA : {};
  const T = 1.3, W = 1040;
  const opt = { big: true, light: false };
  const CHARS = Object.keys(D.CHARACTERS || { knight: 1, alchemist: 1, rogue: 1, gambler: 1 });
  const ink = () => (opt.light ? '#23183a' : '#e9dcc4');
  const label = (ctx, s, x, y, o) => { ctx.save(); ctx.font = (o && o.size || 11) + 'px system-ui'; ctx.fillStyle = (o && o.col) || ink(); ctx.textAlign = (o && o.align) || 'center'; ctx.fillText(String(s), x, y); ctx.restore(); };
  const longOf = (sh) => !sh ? 40 : sh.kind === 'circle' ? sh.r * 2 : sh.kind === 'box' ? Math.max(sh.w, sh.h) : sh.verts ? Math.max(...sh.verts.map(v => Math.max(Math.abs(v.x), Math.abs(v.y)) * 2)) : 40;
  const SECTIONS = [];
  // A section: id, title, note, h(): its height from content, draw(ctx)
  const sec = (id, title, note, h, draw) => SECTIONS.push({ id, title, note, h, draw });

  /* ---------------- crawlers */
  sec('ui', 'Crawlers: portraits, moods (blink, hurt, happy, sad), HUD size', 'R.portrait(ctx, id, x, y, size, t, {mood}). The idle blink runs on each crawler\'s own clock.', () => 70 + CHARS.length * 0 + 330, (ctx) => {
    const moods = ['', 'blink', 'hurt', 'happy', 'sad'];
    CHARS.concat(['unknown']).forEach((id, i) => {
      const x = 70 + i * 120;
      R.portrait(ctx, id, x, 80, opt.big ? 110 : 56, T);
      label(ctx, id, x, opt.big ? 150 : 124);
      moods.slice(1).forEach((m, j) => R.portrait(ctx, id, x - 27 + (j % 2) * 54, 190 + Math.floor(j / 2) * 56, opt.big ? 50 : 36, T, { mood: m }));
      R.portrait(ctx, id, x, 330, 40, T);
    });
    label(ctx, 'blink / hurt  (row 1)    happy / sad  (row 2)    HUD 40 px (row 3)', 20, 372, { align: 'left' });
  });
  /* ---------------- intents */
  const KINDS = (() => {
    const s = new Set(['attack', 'block', 'buff', 'debuff', 'heal', 'charge', 'summon', 'escape']);
    for (const id in D.ENEMIES || {}) for (const m of (D.ENEMIES[id].moves || [])) if (m && m.k) s.add(m.k);
    ['shake', 'grease', 'fog', 'junk', 'tilt', 'steal', 'freezeItem', 'gulp', 'bomb', 'corrode', 'jam', 'eggs'].forEach(k => s.add(k));
    return [...s];
  })();
  sec('intents', 'Intent bubbles: every move kind in the data (plus charged)', 'R.intent: each bin trick has its own glyph (UIX round 31).', () => 60 + Math.ceil(KINDS.length / 13) * 160, (ctx) => {
    KINDS.forEach((k, i) => {
      const x = 44 + (i % 13) * 78, y = 50 + Math.floor(i / 13) * 160;
      ctx.save(); ctx.translate(x, y); if (opt.big) ctx.scale(1.4, 1.4);
      R.intent(ctx, 0, 0, { intent: { k, v: 7, n: 2, s: 'str' } }, T);
      R.intent(ctx, 0, 50, { intent: { k, v: 12 }, charged: true }, T);
      ctx.restore();
      label(ctx, k, x, y + (opt.big ? 96 : 76));
    });
  });
  /* ---------------- statuses, hp bars */
  const STS = Object.keys(D.STATUS || {});
  sec('status', 'Statuses: drawn glyphs (DOM strip), canvas chips, hp bars', 'R.uix.statusGlyph at 18 / 36 px; R.statusPips; R.hpBar.', () => 300, (ctx) => {
    STS.forEach((id, i) => {
      const x = 30 + i * 46;
      if (R.uix) { R.uix.statusGlyph(ctx, id, x, 30, 18); R.uix.statusGlyph(ctx, id, x, 74, 36); }
      ctx.save(); ctx.translate(x - 4, 104); ctx.rotate(0.6); label(ctx, id, 0, 0, { align: 'left', size: 10 }); ctx.restore();
    });
    const half = {}, rest = {};
    STS.forEach((id, i) => { (i % 2 ? rest : half)[id] = 1 + (i % 4); });
    R.statusPips(ctx, 30, 170, half, 18);
    R.statusPips(ctx, 30, 196, rest, 18);
    R.hpBar(ctx, 50, 250, 120, 14, 33, 50, 6);
    R.hpBar(ctx, 220, 250, 120, 14, 8, 50, 0, { ghost: 20, flash: 0.3 });
    R.hpBar(ctx, 400, 250, 220, 18, 280, 280, 12, { shield: 0.4 });
  });
  /* ---------------- items */
  const ITEMS = Object.keys(D.ITEMS || {});
  const itemCols = () => (opt.big ? 10 : 16);
  sec('items', 'Items: every DATA.ITEMS def', '2x: fitted to a 64 px box (the card art). Play: scale 0.55, the size in the bin.', () => 40 + Math.ceil(ITEMS.length / itemCols()) * (opt.big ? 100 : 62) + 140, (ctx) => {
    const cols = itemCols(), cw = (W - 20) / cols, rh = opt.big ? 100 : 62;
    ITEMS.forEach((id, i) => {
      const d = D.ITEMS[id], x = 10 + cw / 2 + (i % cols) * cw, y = 44 + Math.floor(i / cols) * rh;
      const s = opt.big ? Math.min(2.6, 64 / Math.max(10, longOf(d.shape))) : 0.55;
      R.item(ctx, d, x, y, 0, s, {});
      label(ctx, id.slice(0, opt.big ? 15 : 11), x, y + (opt.big ? 44 : 24), { size: opt.big ? 10 : 9 });
    });
    const y0 = 44 + Math.ceil(ITEMS.length / cols) * rh + 20;
    label(ctx, 'plus / frozen / glow / alpha .4 / rotated', 20, y0, { align: 'left' });
    const v = [{ plus: true }, { frozen: true }, { glow: true }, { alpha: 0.4 }, null];
    ITEMS.slice(0, 8).forEach((id, i) => v.forEach((o, j) => R.item(ctx, D.ITEMS[id], 60 + i * 120 + j * 22, y0 + 60, j === 4 ? 0.8 : 0, 1, o || {})));
  });
  /* ---------------- relics */
  const RELICS = Object.keys(D.RELICS || {});
  sec('relics', 'Relics: every DATA.RELICS medallion', 'R.relicIcon (t set: the shine and the legendary rainbow as they are on screen).', () => 30 + Math.ceil(RELICS.length / 14) * (opt.big ? 84 : 60), (ctx) => {
    const cw = (W - 20) / 14, rh = opt.big ? 84 : 60, s = opt.big ? 52 : 32;
    RELICS.forEach((id, i) => {
      const x = 10 + cw / 2 + (i % 14) * cw, y = 40 + Math.floor(i / 14) * rh;
      R.relicIcon(ctx, D.RELICS[id], x, y, s, T);
      label(ctx, id.slice(0, 12), x, y + s / 2 + 12, { size: 9 });
    });
  });
  /* ---------------- enemies */
  const ENEMIES = Object.keys(D.ENEMIES || {}).map(id => D.ENEMIES[id]);
  const STATES = [{}, { hurt: 0.8 }, { attack: 0.5 }, { frozen: true }, { poisoned: true }, { burning: true }, { dead: 0.6 }];
  const enRow = (d) => (d.tier === 'boss' ? 300 : 170) * (opt.big ? 1 : 0.7);
  sec('enemies', 'Enemies: idle, hurt, attack, frozen, poisoned, burning, dead', 'R.enemy for every DATA.ENEMIES def.', () => ENEMIES.reduce((a, d) => a + enRow(d), 0) + 40, (ctx) => {
    let y = 0;
    ENEMIES.forEach((d) => {
      y += enRow(d);
      const sc = (d.tier === 'boss' ? 0.6 : 1) * (opt.big ? 1 : 0.7);
      STATES.forEach((st, j) => {
        const x = 74 + j * 148;
        ctx.save(); ctx.strokeStyle = opt.light ? '#b8aecd' : '#2a2340'; ctx.beginPath(); ctx.moveTo(x - 60, y); ctx.lineTo(x + 60, y); ctx.stroke(); ctx.restore();
        R.enemy(ctx, d, x, y, sc, T + j, st);
      });
      label(ctx, d.id + (d.tier && d.tier !== 'normal' ? ' [' + d.tier + ']' : ''), 74, y + 14);
    });
  });
  /* ---------------- claws (real rigs from PHYS.clawRig) */
  const CLAWS = Object.keys(D.CLAWS || { classic: 1 });
  sec('claws', 'Claws: every claw type on its real rig', 'PHYS.clawRig + R.claw in a 240 x 220 cabinet slice.', () => 40 + Math.ceil(CLAWS.length / 4) * 250, (ctx) => {
    CLAWS.forEach((id, i) => {
      const ox = 10 + (i % 4) * 255, oy = 20 + Math.floor(i / 4) * 250;
      try {
        const Wd = PHYS.world({ gravity: { x: 0, y: 900 }, w: 240, h: 220 });
        const C = PHYS.cabinet(Wd, { w: 240, h: 220, chuteW: 50, dividerH: 0.45 });
        const rig = PHYS.clawRig(Wd, { cabinet: C, type: id, rand: U.rng(7) });
        for (let k = 0; k < 20; k++) { rig.update(1 / 60); Wd.step(1 / 60); }
        ctx.save(); ctx.beginPath(); ctx.rect(ox, oy, 240, 220); ctx.fillStyle = opt.light ? '#d6cce8' : '#1d1233'; ctx.fill(); ctx.clip();
        R.claw(ctx, rig, ox, oy, { juice: { t: T, idle: 1 } });
        ctx.restore();
      } catch (e) { label(ctx, 'rig failed: ' + e.message, ox + 120, oy + 110); }
      label(ctx, id, ox + 120, oy + 236);
    });
  });
  /* ---------------- cabinet */
  sec('cabinet', 'Cabinet: acts 1 to 3 (fog, grease, tilt)', 'R.cabinetBack / cabinetFront with sample prizes.', () => 900, (ctx) => {
    const cfg = { w: 480, h: 390, frame: 30, chuteW: 64, dividerH: 0.6 };
    const pick = ITEMS.slice(0, 12).map(id => D.ITEMS[id]);
    const draw = (x, y, st) => {
      R.cabinetBack(ctx, x, y, cfg, st);
      pick.forEach((d, i) => R.item(ctx, d, x + 50 + (i % 6) * 58, y + 330 - Math.floor(i / 6) * 34, i * 0.5, 1, { glow: i === 4, plus: i === 2, frozen: i === 7 }));
      R.cabinetFront(ctx, x, y, cfg, st);
    };
    draw(20, 20, { t: T, act: 1 }); draw(530, 20, { t: T, act: 2, fog: 0.7 }); draw(20, 470, { t: T, act: 3, grease: 0.9, tilt: 1 });
  });
  /* ---------------- capsules, minis */
  sec('capsules', 'Capsules (tiers, cracking, open) and Capsule Minis', 'R.capsule; R.gacha.mini.', () => 330, (ctx) => {
    ['c', 'u', 'r', 'l'].forEach((tier, i) => [0, 0.5, 1].forEach((cr, j) => R.capsule(ctx, 70 + i * 250 + j * 70, 80, 30, { tier, t: T, crack: cr, glow: tier === 'l' ? 1 : 0 })));
    const minis = D.GACHA && D.GACHA.MINIS ? Object.keys(D.GACHA.MINIS) : [];
    if (R.gacha && R.gacha.mini) minis.slice(0, 26).forEach((id, i) => { R.gacha.mini(ctx, id, 40 + (i % 13) * 78, 200 + Math.floor(i / 13) * 80, 56, T, {}); });
  });
  /* ---------------- VS cards */
  sec('vs', 'VS cards: an elite and a boss', 'R.vsCard at 1.4 s of its timeline, 540 x 300 scaled 0.9.', () => 300, (ctx) => {
    const pick = [ENEMIES.find(d => d.tier === 'elite'), ENEMIES.find(d => d.tier === 'boss')].filter(Boolean);
    pick.forEach((d, i) => {
      ctx.save(); ctx.translate(10 + i * 515, 10); ctx.scale(0.92, 0.92); ctx.beginPath(); ctx.rect(0, 0, 540, 300); ctx.clip();
      R.vsCard(ctx, 540, 300, { t: 1.4, dur: 2.4, boss: d.tier === 'boss', title: d.tier === 'boss' ? 'BOSS' : 'ELITE', name: d.name, taunt: 'Insert coin.', affixes: [], charId: 'knight', charName: 'Sir Grabsworth', def: d, color: '#ff2e88', now: T });
      ctx.restore();
    });
  });
  /* ---------------- event scenes */
  const EVENTS = Object.keys(D.EVENTS || {});
  sec('events', 'Event scenes', 'R.arcScene for every DATA.EVENTS id (508 x 190, scaled 0.5).', () => 20 + Math.ceil(EVENTS.length / 4) * 112, (ctx) => {
    EVENTS.forEach((id, i) => {
      ctx.save(); ctx.translate(8 + (i % 4) * 258, 10 + Math.floor(i / 4) * 112); ctx.scale(0.5, 0.5);
      R.arcScene(ctx, 508, 190, { id, t: T, act: 1 + (i % 3), roll: -1 });
      ctx.restore();
      label(ctx, id, 8 + (i % 4) * 258 + 127, 10 + Math.floor(i / 4) * 112 + 106, { size: 10 });
    });
  });
  /* ---------------- hexes, map */
  sec('hexes', 'Hex tiles (hidden, revealed, visited, reachable, hover), map backgrounds', 'R.hex, R.mapBg per act.', () => 640, (ctx) => {
    R.mapBg(ctx, W, 520, 1, T);
    const types = ['empty', 'fight', 'elite', 'treasure', 'gem', 'ink', 'brush', 'event', 'shop', 'rest', 'forge', 'boss', 'start'];
    types.forEach((ty, i) => {
      const x = 50 + i * 76;
      R.hex(ctx, x, 50, 36, { type: ty, revealed: false, q: i, r: 1 }, { t: T });
      R.hex(ctx, x, 130, 36, { type: ty, revealed: true, q: i, r: 2 }, { t: T });
      R.hex(ctx, x, 210, 36, { type: ty, revealed: true, visited: true, q: i, r: 3 }, { t: T });
      R.hex(ctx, x, 290, 36, { type: ty, revealed: true, q: i, r: 4 }, { t: T, reachable: true });
      R.hex(ctx, x, 370, 36, { type: ty, revealed: true, q: i, r: 5 }, { t: T, hover: true });
      label(ctx, ty, x, 420, { col: '#e9dcc4' });
    });
    for (let a = 1; a <= 3; a++) { ctx.save(); ctx.translate((a - 1) * 347, 450); ctx.beginPath(); ctx.rect(0, 0, 340, 180); ctx.clip(); R.mapBg(ctx, 340, 180, a, T); ctx.restore(); }
  });
  /* ---------------- backdrops */
  sec('bgs', 'Arena backdrops per act', 'R.bg (the arena band 70..340 of the stage).', () => 300, (ctx) => {
    for (let a = 1; a <= 3; a++) { ctx.save(); ctx.translate((a - 1) * 347, 0); ctx.beginPath(); ctx.rect(0, 0, 340, 270); ctx.clip(); R.bg(ctx, 340, 270, a, T); ctx.restore(); label(ctx, 'act ' + a, (a - 1) * 347 + 170, 290); }
  });
  /* ---------------- run end */
  sec('runend', 'Run end pictures (win, loss) for every crawler', 'R.uix.runEnd at the end of its entrance.', () => 20 + Math.ceil(CHARS.length * 2 / 3) * 165, (ctx) => {
    if (!R.uix || !R.uix.runEnd) return;
    const items = ITEMS.slice(0, 11).map(id => ({ def: D.ITEMS[id] }));
    CHARS.forEach((c, i) => ['win', 'loss'].forEach((kind, j) => {
      const k = i * 2 + j;
      ctx.save(); ctx.translate(8 + (k % 3) * 344, 10 + Math.floor(k / 3) * 165); ctx.scale(0.62, 0.62);
      ctx.beginPath(); ctx.rect(0, 0, 540, 230); ctx.clip();
      R.uix.runEnd(ctx, 540, 230, { kind, char: c, items, t: 9, now: T });
      ctx.restore();
    }));
  });
  /* ---------------- title */
  sec('title', 'Title', 'R.title (540 x 960).', () => 970, (ctx) => { ctx.save(); ctx.translate(250, 5); R.title(ctx, 540, 960, T); ctx.restore(); });

  // ---- build and draw
  const root = document.getElementById('sections'), nav = document.getElementById('nav');
  for (const S of SECTIONS) {
    const h = document.createElement('h2'); h.id = 's_' + S.id; h.textContent = S.title; root.appendChild(h);
    const n = document.createElement('div'); n.className = 'note'; n.textContent = S.note; root.appendChild(n);
    S.cv = document.createElement('canvas'); S.cv.id = S.id; root.appendChild(S.cv);
    const a = document.createElement('a'); a.href = '#s_' + S.id; a.textContent = S.id; nav.appendChild(a);
  }
  function drawAll() {
    for (const S of SECTIONS) {
      let hh = 300;
      try { hh = Math.max(60, Math.ceil(S.h())); } catch (e) { hh = 300; }
      S.cv.width = W; S.cv.height = hh;
      const ctx = S.cv.getContext('2d');
      ctx.fillStyle = opt.light ? '#efeaf7' : '#12091f'; ctx.fillRect(0, 0, W, hh);
      try { S.draw(ctx); } catch (e) { label(ctx, 'section failed: ' + e.message, W / 2, 30, { col: '#ff5a4a' }); console.error(S.id, e); }
    }
    window.__galleryDone = true;
  }
  const tog = (on, off, f) => { document.getElementById(on).classList.add('on'); document.getElementById(off).classList.remove('on'); f(); drawAll(); };
  document.getElementById('scale2').onclick = () => tog('scale2', 'scale1', () => { opt.big = true; });
  document.getElementById('scale1').onclick = () => tog('scale1', 'scale2', () => { opt.big = false; });
  document.getElementById('bgDark').onclick = () => tog('bgDark', 'bgLight', () => { opt.light = false; document.body.classList.remove('light'); });
  document.getElementById('bgLight').onclick = () => tog('bgLight', 'bgDark', () => { opt.light = true; document.body.classList.add('light'); });
  // (the PNG art pack is left out on purpose: this page reviews the drawn art, the fallback every PNG sits on)
  drawAll();
})();
</script>
</body>
</html>
