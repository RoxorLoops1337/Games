<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#120d20">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Claw Crawl</title>
<meta name="description" content="A claw-machine roguelike. Grab weapons, shields and potions out of a physics claw machine to fight your way through a hand-painted hex map.">
<style>
:root{--ink:#f6efff;--dim:#b7a9d6;--gold:#ffd24d;--hot:#ff5fa2;--cy:#4de3ff;--lime:#8cff6a;--pan:#231a3a;--pan2:#171027}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#0b0814;color:var(--ink);
  font-family:'Trebuchet MS','Segoe UI',system-ui,-apple-system,sans-serif;
  user-select:none;-webkit-user-select:none;touch-action:none;overscroll-behavior:none}
#stage{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);overflow:hidden;border-radius:6px;
  box-shadow:0 0 60px rgba(120,60,220,.25)}
#cv{position:absolute;left:0;top:0;display:block;touch-action:none}
#ui{position:absolute;left:0;top:0;width:400px;height:720px;transform-origin:0 0;pointer-events:none}
#ui > *{pointer-events:auto}
#ov{position:absolute;inset:0;display:none;align-items:center;justify-content:center;
  background:rgba(8,5,16,.74);padding:14px;z-index:5}
#ov.on{display:flex}
#ov.clear{background:transparent}
.pn{background:linear-gradient(180deg,#2e2350,#1a1330);border:2px solid #6a55a8;border-radius:20px;
  padding:16px 14px;width:100%;max-width:372px;max-height:100%;overflow-y:auto;
  box-shadow:0 14px 40px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.12);text-align:center;
  animation:pop .22s ease-out}
@keyframes pop{from{transform:scale(.92);opacity:0}to{transform:none;opacity:1}}
.pn h1{margin:0 0 4px;font-size:44px;line-height:.95;font-weight:900;letter-spacing:-1px;color:#fff;
  text-shadow:0 4px 0 #b3308a,0 8px 0 #5a1a6e,0 14px 24px rgba(0,0,0,.6);transform:rotate(-2deg)}
.pn h1 em{display:block;font-style:normal;color:var(--gold);text-shadow:0 4px 0 #b3781a,0 8px 0 #6e4210,0 14px 24px rgba(0,0,0,.6)}
.pn h2{margin:2px 0 8px;font-size:22px;font-weight:900;letter-spacing:.5px;color:#fff;text-transform:uppercase}
.pn p{margin:6px 0 10px;color:var(--dim);font-size:14px;line-height:1.4}
.pn p b{color:#fff}
.btn{display:inline-block;border:0;border-radius:14px;padding:12px 18px;margin:4px;font:900 15px/1 inherit;
  font-family:inherit;letter-spacing:.5px;text-transform:uppercase;color:#1b1330;cursor:pointer;
  background:linear-gradient(180deg,#ffe58a,var(--gold));box-shadow:0 4px 0 #b3861a,0 8px 16px rgba(0,0,0,.35)}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #b3861a}
.btn.alt{background:linear-gradient(180deg,#ff9ccc,var(--hot));color:#fff;box-shadow:0 4px 0 #a02a66,0 8px 16px rgba(0,0,0,.35)}
.btn.cy{background:linear-gradient(180deg,#9df1ff,var(--cy));box-shadow:0 4px 0 #1a8aa3,0 8px 16px rgba(0,0,0,.35)}
.btn.ghost{background:rgba(255,255,255,.06);color:#d9ccf5;box-shadow:inset 0 0 0 2px #574780}
.btn[disabled]{opacity:.38;pointer-events:none}
.btn.sm{padding:14px 18px;font-size:13px;border-radius:12px}
.cards{display:flex;gap:8px;justify-content:center;margin:8px 0 10px;flex-wrap:wrap}
.card{flex:1 1 0;min-width:100px;max-width:116px;border:0;border-radius:14px;padding:10px 6px 9px;cursor:pointer;
  background:linear-gradient(180deg,#3b2e66,#261c44);color:#fff;font-family:inherit;
  box-shadow:inset 0 0 0 2px #7d6bb8,0 5px 0 #120c20;display:flex;flex-direction:column;align-items:center;gap:4px}
.card:active{transform:translateY(3px)}
.card.r1{box-shadow:inset 0 0 0 2px #4de3ff,0 5px 0 #120c20}
.card.r2{box-shadow:inset 0 0 0 2px #ffd24d,0 0 18px rgba(255,210,77,.35),0 5px 0 #120c20}
.card .ce{font-size:38px;line-height:1.1;filter:drop-shadow(0 3px 0 rgba(0,0,0,.4))}
.card b{font-size:13px}
.card small{font-size:11px;color:#cfc2ee;line-height:1.3;min-height:28px}
.card .pr{font-weight:900;color:var(--gold);font-size:13px}
.card .rt{font-size:10px;letter-spacing:1px;text-transform:uppercase;opacity:.7}
.card[disabled]{opacity:.4;pointer-events:none}
.list{display:flex;flex-direction:column;gap:6px;margin:8px 0;text-align:left}
.li{display:flex;align-items:center;gap:10px;min-height:52px;background:rgba(255,255,255,.05);border-radius:12px;padding:8px 10px;
  border:0;color:#fff;font-family:inherit;font-size:13px;text-align:left;cursor:pointer;width:100%}
.li .ie{font-size:26px;width:34px;text-align:center;flex:none}
.li .tx{flex:1;line-height:1.3}
.li .tx small{display:block;color:#bfb2df;font-size:11px}
.li .pr{font-weight:900;color:var(--gold);flex:none}
.li[disabled]{opacity:.4;pointer-events:none}
.grid{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:8px 0}
.chip{border:0;border-radius:12px;background:rgba(255,255,255,.07);color:#fff;font-family:inherit;padding:6px 8px;
  display:flex;flex-direction:column;align-items:center;min-width:58px;cursor:pointer;font-size:10px;gap:1px}
.chip .ie{font-size:24px}
.chip .lv{color:var(--gold);font-size:10px;letter-spacing:1px}
.gains{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:6px 0 4px}
.gain{background:rgba(255,255,255,.08);border-radius:999px;padding:6px 11px;font-weight:800;font-size:13px}
.sec{font-size:11px;letter-spacing:2px;text-transform:uppercase;color:#9a8cc4;margin:12px 0 2px;font-weight:900}
.help{text-align:left;font-size:13px;color:#d8cdf2;line-height:1.45}
.help b{color:#fff}
.help .k{display:inline-block;min-width:22px;text-align:center}
.bar{position:absolute;left:0;right:0;bottom:0;height:78px;display:none;align-items:center;justify-content:center;gap:5px;padding:0 6px 6px}
.bar.on{display:flex}
.tool{border:0;border-radius:14px;min-width:54px;height:60px;padding:4px 5px;background:linear-gradient(180deg,#3a2d63,#241a40);
  box-shadow:inset 0 0 0 2px #5d4c93,0 4px 0 #0e0a18;color:#fff;font-family:inherit;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:1px;cursor:pointer}
.tool .ie{font-size:22px;line-height:1}
.tool .nm{font-size:10px;letter-spacing:.5px;text-transform:uppercase;opacity:.85}
.tool .ct{font-size:12px;font-weight:900;color:var(--gold)}
.tool.sel{background:linear-gradient(180deg,#ffe58a,#ffb84d);color:#1b1330;box-shadow:inset 0 0 0 2px #fff,0 4px 0 #8a5a10}
.tool.sel .ct{color:#6a2a00}
.tool[disabled]{opacity:.35;pointer-events:none}
.fb{position:absolute;bottom:12px;border:0;border-radius:14px;padding:14px 16px;font:900 14px inherit;font-family:inherit;
  color:#fff;background:rgba(40,28,70,.9);box-shadow:inset 0 0 0 2px #5d4c93;display:none;cursor:pointer}
.fb.on{display:block}
#toast{position:absolute;left:50%;top:588px;transform:translateX(-50%);background:rgba(20,12,36,.94);
  border:2px solid #7d6bb8;border-radius:14px;padding:9px 14px;font-weight:800;font-size:14px;color:#fff;
  max-width:340px;text-align:center;opacity:0;transition:opacity .25s;pointer-events:none;z-index:4}
#toast.on{opacity:1}
#rot{position:absolute;inset:0;display:none;align-items:center;justify-content:center;text-align:center;background:#0b0814;z-index:20;font-size:22px;font-weight:900;line-height:1.6}
#rot.on{display:flex}
.big{font-size:54px;line-height:1;margin:4px 0}
.stat{display:flex;justify-content:space-around;margin:10px 0;font-size:12px;color:var(--dim)}
.stat b{display:block;font-size:22px;color:#fff}
</style>
</head>
<body>
<div id="stage">
  <canvas id="cv"></canvas>
  <div id="ui">
    <div id="mapbar" class="bar"></div>
    <button id="bagBtn" class="fb" style="right:10px">🎒 Bag</button>
    <button id="helpBtn" class="fb" style="left:10px">❓ Help</button>
    <button id="muteBtn" class="fb" style="left:50%;transform:translateX(-50%)" data-a="mute">🔊</button>
    <div id="toast"></div>
    <div id="ov"></div>
    <div id="rot">📱↻<br>Turn your phone upright</div>
  </div>
</div>
<script>
'use strict';
/* =========================================================================
   CLAW CRAWL
   A claw-machine roguelike.  Everything below is one script:
     1. data (items, enemies, relics)
     2. a small rigid-body physics engine (compound circles vs capsules)
     3. the claw
     4. combat
     5. the hex map (fog, brushes and inks)
     6. screens, overlays, input, drawing
   ========================================================================= */
const VW = 400, VH = 720;
// the claw machine, in machine-local coordinates (0,0 = top-left of the glass)
const MX = 20, MY = 276, MW = 360, MH = 316;
const CHW = 76, DIVH = 104;          // prize chute width, divider height
const RAIL = 36;                     // claw hub y when parked
const $ = id => document.getElementById(id);
const cv = $('cv'), ctx = cv.getContext('2d');
const TAU = Math.PI * 2;
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const rnd = (a, b) => a + Math.random() * (b - a);
let SCALE = 1, RS = 1;

/* ------------------------------------------------------------------ state */
const G = { scr: 'title', run: null, meta: null, time: 0, tool: null, walk: null, walkT: 0, hover: -1,
  rq: null, toastT: 0, fx: [], aimAt: -1, paused: false, tip: null, press: null };
let F = null;                               // current fight
const W = { bodies: [], segs: [], csegs: [], contacts: [] };

/* ------------------------------------------------------------------- rng */
function R(){
  const r = G.run;
  let t = (r.seed = (r.seed + 0x6D2B79F5) | 0);
  t = Math.imul(t ^ (t >>> 15), t | 1);
  t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
  return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
}
const ri = n => Math.floor(R() * n);
const pick = a => a[ri(a.length)];
function shuffle(a){ for (let i = a.length - 1; i > 0; i--){ const j = ri(i + 1); [a[i], a[j]] = [a[j], a[i]]; } return a; }

/* =============================== DATA ==================================== */
// sh: physical shape.  cap = capsule [len, radius], blob = rounded cluster [radius],
// ball = one circle [radius].  rot = how the emoji glyph is turned to lie along the body.
const D45 = Math.PI / 4;
const ITEMS = {
  sword:  { n:'Sword',        e:'🗡️', rar:0, sh:['cap',46,8],  dens:1.0, rot:D45, col:'#a9c1dc', fx:{ dmg:[5,7,9] } },
  dagger: { n:'Dagger',       e:'🔪', rar:0, sh:['cap',32,6],  dens:0.9, rot:D45, col:'#c9d3de', fx:{ dmg:[3,5,7] } },
  bow:    { n:'Bow',          e:'🏹', rar:0, sh:['cap',42,9],  dens:0.7, rot:D45, col:'#c79a5b', fx:{ dmg:[3,4,5], hits:[2,2,3] } },
  axe:    { n:'Battle Axe',   e:'🪓', rar:1, sh:['cap',44,11], dens:1.9, rot:D45, col:'#b98a5a', fx:{ dmg:[10,13,17] } },
  hammer: { n:'War Hammer',   e:'🔨', rar:1, sh:['cap',40,10], dens:1.6, rot:D45, col:'#9d8f86', fx:{ dmg:[5,7,9], vuln:[2,2,3] } },
  bomb:   { n:'Bomb',         e:'💣', rar:1, sh:['ball',16],   dens:1.3, rot:0,   col:'#6b6b88', fx:{ dmgAll:[7,9,12] } },
  bolt:   { n:'Storm Jar',    e:'⚡', rar:1, sh:['blob',15],   dens:0.8, rot:0,   col:'#ffe066', fx:{ dmgAll:[3,4,5], hits:[2,2,3] } },
  shield: { n:'Shield',       e:'🛡️', rar:0, sh:['blob',18],   dens:1.0, rot:0,   col:'#6fa8ff', fx:{ block:[5,7,10] } },
  ice:    { n:'Frost Shard',  e:'❄️', rar:0, sh:['blob',14],   dens:0.7, rot:0,   col:'#a8f0ff', fx:{ chill:[2,3,4], block:[2,3,4] } },
  fire:   { n:'Fire Flask',   e:'🔥', rar:0, sh:['blob',14],   dens:0.8, rot:0,   col:'#ff8a3d', fx:{ burn:[4,6,8] } },
  poison: { n:'Venom Vial',   e:'🧪', rar:0, sh:['cap',34,8],  dens:0.8, rot:D45, col:'#7dff6a', fx:{ poison:[4,6,8] } },
  mush:   { n:'Toadstool',    e:'🍄', rar:1, sh:['blob',14],   dens:0.6, rot:0,   col:'#ff6a6a', fx:{ weak:[2,3,3], poison:[2,3,5] } },
  apple:  { n:'Apple',        e:'🍎', rar:0, sh:['blob',13],   dens:0.9, rot:0,   col:'#ff5a5a', fx:{ heal:[3,5,7] } },
  banana: { n:'Banana',       e:'🍌', rar:0, sh:['cap',38,8],  dens:0.7, rot:D45, col:'#ffe066', fx:{ heal:[2,3,4], block:[3,4,6] } },
  brocc:  { n:'Broccoli',     e:'🥦', rar:1, sh:['blob',15],   dens:0.7, rot:0,   col:'#62d26f', fx:{ heal:[4,6,8], regen:[1,2,2] } },
  ring:   { n:'Troll Ring',   e:'💍', rar:1, sh:['ball',11],   dens:1.2, rot:0,   col:'#ffd24d', fx:{ regen:[2,3,4] } },
  tonic:  { n:'Rage Tonic',   e:'💪', rar:1, sh:['blob',14],   dens:0.9, rot:0,   col:'#ffb36b', fx:{ str:[1,2,3] } },
  cactus: { n:'Spike Plant',  e:'🌵', rar:1, sh:['cap',34,10], dens:0.9, rot:Math.PI/2, col:'#6fd46f', fx:{ thorns:[3,4,6] } },
  coin:   { n:'Gold Coin',    e:'🪙', rar:0, sh:['ball',10],   dens:1.5, rot:0,   col:'#ffd24d', fx:{ gold:[3,5,7] } },
  gem:    { n:'Power Gem',    e:'💎', rar:2, sh:['blob',12],   dens:1.1, rot:0,   col:'#6ff0ff', fx:{ grab:[1,1,1], block:[0,3,6] } },
  clover: { n:'Four-Leaf',    e:'🍀', rar:2, sh:['blob',12],   dens:0.5, rot:0,   col:'#6fe07a', fx:{ echo:[1,2,3] } },
  heart:  { n:'Heart Gem',    e:'💖', rar:2, sh:['blob',14],   dens:0.9, rot:0,   col:'#ff7ad9', fx:{ maxhp:[1,2,3], heal:[3,4,5] } },
  crown:  { n:'Crown',        e:'👑', rar:2, sh:['blob',15],   dens:1.4, rot:0,   col:'#ffd24d', fx:{ gold:[8,12,16], str:[1,1,2] } },
  // junk (enemies stuff these into your machine; they vanish when grabbed)
  slime:  { n:'Slime',        e:'🟢', junk:1, sh:['blob',15],  dens:0.8, rot:0,   col:'#7dff6a', fx:{} },
  web:    { n:'Cobweb',       e:'🕸️', junk:1, sh:['blob',17],  dens:0.4, rot:0,   col:'#d0d0e8', fx:{} },
  rock:   { n:'Rock',         e:'🪨', junk:1, sh:['blob',17],  dens:2.6, rot:0,   col:'#8a8497', fx:{} },
  bone:   { n:'Cursed Bone',  e:'🦴', junk:1, sh:['cap',38,7], dens:1.0, rot:D45, col:'#efe6d0', fx:{ self:[2,2,2] } },
};
const RAR_NAME = ['Common', 'Uncommon', 'Rare'];
const POOL = Object.keys(ITEMS).filter(k => !ITEMS[k].junk);

const STATUS = {
  poison:{ e:'☠️', c:'#8cff6a', d:'Loses HP equal to poison at the start of its turn, then poison drops by 1.' },
  burn:  { e:'🔥', c:'#ff8a3d', d:'Takes damage equal to burn at the start of its turn, then burn halves.' },
  chill: { e:'❄️', c:'#a8f0ff', d:'At 5 chill an enemy FREEZES and skips its next action.' },
  weak:  { e:'🥀', c:'#d7a6ff', d:'Deals 25% less attack damage. Wears off by 1 each turn.' },
  vuln:  { e:'💔', c:'#ff7a9c', d:'Takes 50% more damage. Wears off by 1 each turn.' },
  str:   { e:'💪', c:'#ffb36b', d:'Adds to every hit.' },
  thorns:{ e:'🌵', c:'#9dff8a', d:'Attackers take this much damage back.' },
  regen: { e:'💚', c:'#7dffb0', d:'Heals this much at the start of each turn.' },
};

// Enemy moves: atk (x = hits), block, str, poison/burn/weak/vuln on you, junk (stuffs your
// machine), steal (takes items out of the machine until it dies), freeze (-1 grab), drain.
const ENEMIES = {
  // act 1
  rat:    { n:'Sewer Rat',   e:'🐀', hp:13, mv:[{atk:5},{atk:3,x:2}] },
  bat:    { n:'Cave Bat',    e:'🦇', hp:10, mv:[{atk:2,x:3},{atk:4,weak:1}] },
  slime:  { n:'Gloop',       e:'🦠', hp:18, cycle:1, mv:[{atk:4},{junk:'slime',n:2,block:3},{atk:6}] },
  snake:  { n:'Pit Viper',   e:'🐍', hp:16, mv:[{atk:3,poison:3},{atk:6}] },
  goblin: { n:'Goblin',      e:'👺', hp:22, mv:[{atk:7},{block:6,atk:3},{str:2}] },
  ogre:   { n:'Ogre',        e:'👹', hp:58, elite:1, mv:[{atk:12},{block:10,str:2},{atk:6,x:2}] },
  bandit: { n:'Claw Thief',  e:'🥷', hp:48, elite:1, mv:[{steal:1,atk:5},{atk:10},{block:8,atk:4}] },
  crab:   { n:'The Pinch King', e:'🦀', hp:120, boss:1, cycle:1,
            mv:[{atk:7,x:2},{block:14,junk:'rock',n:2},{steal:2,atk:6},{atk:17}] },
  // act 2
  spider: { n:'Weaver',      e:'🕷️', hp:30, mv:[{atk:5,poison:4},{atk:9},{junk:'web',n:2,atk:3}] },
  wolf:   { n:'Dire Wolf',   e:'🐺', hp:36, mv:[{atk:8},{atk:5,x:2},{str:3,block:5}] },
  mage:   { n:'Ember Mage',  e:'🧙', hp:28, mv:[{burn:6,atk:3},{atk:10},{block:10,weak:2}] },
  ghost:  { n:'Wisp',        e:'👻', hp:32, mv:[{atk:9,vuln:1},{block:14},{weak:2,atk:5}] },
  skel:   { n:'Skeleton',    e:'💀', hp:28, mv:[{atk:7,x:2},{block:9},{junk:'bone',n:2,atk:4}] },
  troll:  { n:'Frost Troll', e:'🧌', hp:105, elite:1, mv:[{atk:13,freeze:1},{block:15,str:2},{atk:6,x:3}] },
  knight: { n:'Black Knight',e:'🤺', hp:95, elite:1, mv:[{block:16,atk:6},{atk:20},{str:3,vuln:2}] },
  dragon: { n:'Cinder Dragon', e:'🐉', hp:220, boss:1, cycle:1,
            mv:[{burn:7,atk:8},{atk:11,x:2},{block:20,str:3},{junk:'rock',n:3,atk:6},{atk:30}] },
  // act 3
  golem:  { n:'Stone Golem', e:'🗿', hp:68, mv:[{block:20,atk:5},{atk:17},{atk:9,x:2}] },
  vamp:   { n:'Vampire',     e:'🧛', hp:58, mv:[{atk:11,drain:1},{weak:2,vuln:2,atk:4},{atk:5,x:3}] },
  demon:  { n:'Demon',       e:'😈', hp:62, mv:[{burn:8,atk:6},{atk:14},{str:4,block:8}] },
  zombie: { n:'Rotter',      e:'🧟', hp:74, mv:[{atk:10,poison:5},{junk:'bone',n:3,atk:5},{atk:16}] },
  imp:    { n:'Imp',         e:'👿', hp:38, mv:[{atk:5,x:3},{burn:5,atk:3}] },
  kraken: { n:'Kraken',      e:'🐙', hp:175, elite:1, mv:[{atk:8,x:4},{steal:2,block:15},{atk:26}] },
  hexer:  { n:'Hex Witch',   e:'🧙‍♀️', hp:150, elite:1, mv:[{weak:3,vuln:3,atk:6},{atk:21},{junk:'bone',n:2,atk:9}] },
  house:  { n:'The House',   e:'🤖', hp:340, boss:1, cycle:1,
            mv:[{atk:11,x:3},{junk:'rock',n:3,block:22},{steal:3,atk:10},{str:4,freeze:1,atk:6},{atk:44}] },
};
const ENC = {
  1:{ easy:[['rat'],['bat'],['slime'],['snake']],
      hard:[['rat','bat'],['goblin'],['slime','rat'],['snake','bat'],['goblin','bat']],
      elite:[['ogre'],['bandit']], boss:['crab'] },
  2:{ easy:[['spider'],['wolf'],['mage'],['skel']],
      hard:[['wolf','spider'],['ghost','mage'],['skel','skel'],['ghost'],['wolf','mage']],
      elite:[['troll'],['knight']], boss:['dragon'] },
  3:{ easy:[['golem'],['vamp'],['imp','imp']],
      hard:[['demon','imp'],['zombie'],['golem','imp'],['vamp','zombie'],['demon']],
      elite:[['kraken'],['hexer']], boss:['house'] },
};
const ACT_NAME = { 1:'The Mossy Arcade', 2:'The Ember Galleries', 3:'The House Always Wins' };

/* ============================ PHYSICS ==================================== */
// Rigid bodies built from circles, colliding with each other, static walls and the
// kinematic claw (capsules).  Sequential impulses with Coulomb friction, sub-stepped.
const ITEM_SCALE = 1.28;   // items and claw are both drawn at this scale
const PH = { g:1150, sub:4, it:10, slop:0.5, beta:0.24, maxBias:200, clawBias:110, e:0.12 };

function shapeParts(sh, sc){
  const k = sh[0], out = [];
  if (k === 'cap'){
    const len = sh[1] * sc, r = sh[2] * sc;
    const n = Math.max(2, Math.round((len - 2 * r) / (r * 0.9)) + 1);
    for (let i = 0; i < n; i++) out.push({ x: -len / 2 + r + (len - 2 * r) * i / (n - 1), y: 0, r });
  } else if (k === 'blob'){
    const r = sh[1] * sc;
    out.push({ x: 0, y: 0, r: r * 0.62 });
    for (let i = 0; i < 3; i++){ const a = -Math.PI / 2 + i * TAU / 3; out.push({ x: Math.cos(a) * r * 0.42, y: Math.sin(a) * r * 0.42, r: r * 0.58 }); }
  } else out.push({ x: 0, y: 0, r: sh[1] * sc });
  return out;
}
function mkBody(it, x, y, a){
  const d = ITEMS[it.id];
  const parts = shapeParts(d.sh, ITEM_SCALE);
  let m = 0, cx = 0, cy = 0;
  for (const p of parts){ const pm = Math.PI * p.r * p.r * d.dens * 0.01; m += pm; cx += p.x * pm; cy += p.y * pm; }
  cx /= m; cy /= m;
  let I = 0, br = 0;
  for (const p of parts){ p.x -= cx; p.y -= cy; const pm = Math.PI * p.r * p.r * d.dens * 0.01; I += pm * (0.5 * p.r * p.r + p.x * p.x + p.y * p.y); br = Math.max(br, Math.hypot(p.x, p.y) + p.r); }
  return { it, x, y, a: a || 0, vx: 0, vy: 0, w: 0, m, im: 1 / m, I, iI: 1 / I, parts, br,
    px: new Float64Array(parts.length), py: new Float64Array(parts.length),
    mu: 0.5, sl: false, slT: 0, held: 0, glow: 0 };
}
function mkSeg(ax, ay, bx, by, r){ return { ax, ay, bx, by, r, own: 9, vx: 0, vy: 0, om: 0, hx: 0, hy: 0 }; }
function buildWalls(){
  W.segs = [
    mkSeg(-4, -120, -4, MH + 90, 4),          // left
    mkSeg(MW + 4, -120, MW + 4, MH + 4, 4),   // right
    mkSeg(CHW, MH + 4, MW + 8, MH + 4, 4),    // floor (the chute has none)
    mkSeg(CHW, MH - DIVH, CHW, MH + 4, 5),    // chute divider
    mkSeg(-8, -124, MW + 8, -124, 4),         // lid
  ];
}
function segClosest(s, px, py){
  const dx = s.bx - s.ax, dy = s.by - s.ay, l2 = dx * dx + dy * dy;
  let t = l2 > 1e-6 ? ((px - s.ax) * dx + (py - s.ay) * dy) / l2 : 0;
  t = t < 0 ? 0 : t > 1 ? 1 : t;
  return [s.ax + dx * t, s.ay + dy * t];
}
function addContact(a, b, px, py, nx, ny, pen, mu, seg){
  W.contacts.push({ a, b, px, py, nx, ny, pen, mu, seg, jn: 0, jt: 0, kn: 0, kt: 0, bias: 0,
    rax: 0, ray: 0, rbx: 0, rby: 0, kvx: 0, kvy: 0 });
}
function bodyVsSeg(b, s, claw){
  const q = segClosest(s, b.x, b.y);
  const R0 = b.br + s.r, qx0 = b.x - q[0], qy0 = b.y - q[1];
  if (qx0 * qx0 + qy0 * qy0 > R0 * R0) return;
  for (let i = 0; i < b.parts.length; i++){
    const r = b.parts[i].r, px = b.px[i], py = b.py[i];
    const c = segClosest(s, px, py);
    const ex = c[0] - px, ey = c[1] - py, d2 = ex * ex + ey * ey, rr = r + s.r;
    if (d2 >= rr * rr) continue;
    const d = Math.sqrt(d2);
    const nx = d > 1e-6 ? ex / d : 0, ny = d > 1e-6 ? ey / d : -1;
    const pen = rr - d;
    const mu = claw ? 0.3 + clawGrip() * 0.9 : 0.4;
    addContact(b, null, px + nx * r, py + ny * r, nx, ny, pen, mu, s);
    if (claw){
      if (b.sl){ b.sl = false; b.slT = 0; }
      b.held = 2;
      const C = F.claw;
      if (s.own === 0 && pen > 1.2 && ny < -0.2) C.touch = true;
      if (s.own !== 0 && pen > 3 && ny < -0.3) C.touch = true;
      if (s.own === -1 && pen > C.halt) C.hitL = true;
      if (s.own === 1 && pen > C.halt) C.hitR = true;
    }
  }
}
function collide(){
  const B = W.bodies; W.contacts.length = 0;
  for (const b of B){
    const c = Math.cos(b.a), s = Math.sin(b.a);
    for (let i = 0; i < b.parts.length; i++){ const p = b.parts[i]; b.px[i] = b.x + p.x * c - p.y * s; b.py[i] = b.y + p.x * s + p.y * c; }
  }
  for (let i = 0; i < B.length; i++){
    const a = B[i];
    for (let j = i + 1; j < B.length; j++){
      const b = B[j];
      if (a.sl && b.sl) continue;
      const dx = b.x - a.x, dy = b.y - a.y, RR = a.br + b.br;
      if (dx * dx + dy * dy > RR * RR) continue;
      for (let m = 0; m < a.parts.length; m++){
        const ra = a.parts[m].r;
        for (let n = 0; n < b.parts.length; n++){
          const rb = b.parts[n].r;
          const ex = b.px[n] - a.px[m], ey = b.py[n] - a.py[m], d2 = ex * ex + ey * ey, rr = ra + rb;
          if (d2 >= rr * rr) continue;
          const d = Math.sqrt(d2);
          const nx = d > 1e-6 ? ex / d : 0, ny = d > 1e-6 ? ey / d : 1;
          const pen = rr - d;
          addContact(a, b, a.px[m] + nx * (ra - pen * 0.5), a.py[m] + ny * (ra - pen * 0.5), nx, ny, pen, 0.5, null);
        }
      }
    }
  }
  for (const b of B){
    if (!b.sl) for (const s of W.segs) bodyVsSeg(b, s, false);
    for (const s of W.csegs) bodyVsSeg(b, s, true);
  }
}
function prepContacts(h){
  for (const c of W.contacts){
    const a = c.a, b = c.b;
    // a sleeper hit hard or pushed deep wakes up
    if (b && (a.sl !== b.sl)){
      const s = a.sl ? a : b, o = a.sl ? b : a;
      if (c.pen > 2.5 || Math.hypot(o.vx, o.vy) > 70){ s.sl = false; s.slT = 0; }
    }
    const ima = a.sl ? 0 : a.im, iIa = a.sl ? 0 : a.iI;
    const imb = b && !b.sl ? b.im : 0, iIb = b && !b.sl ? b.iI : 0;
    c.ima = ima; c.iIa = iIa; c.imb = imb; c.iIb = iIb;
    c.rax = c.px - a.x; c.ray = c.py - a.y;
    if (b){ c.rbx = c.px - b.x; c.rby = c.py - b.y; }
    else if (c.seg){ const s = c.seg; c.kvx = s.vx - s.om * (c.py - s.hy); c.kvy = s.vy + s.om * (c.px - s.hx); }
    const nx = c.nx, ny = c.ny, tx = -ny, ty = nx;
    const rna = c.rax * ny - c.ray * nx, rta = c.rax * ty - c.ray * tx;
    let kn = ima + iIa * rna * rna, kt = ima + iIa * rta * rta;
    if (b){ const rnb = c.rbx * ny - c.rby * nx, rtb = c.rbx * ty - c.rby * tx; kn += imb + iIb * rnb * rnb; kt += imb + iIb * rtb * rtb; }
    c.kn = kn > 0 ? 1 / kn : 0; c.kt = kt > 0 ? 1 / kt : 0;
    const cap = c.seg && c.seg.own !== 9 ? PH.clawBias : PH.maxBias;
    c.bias = Math.min(cap, PH.beta / h * Math.max(0, c.pen - PH.slop));
    const v = relVel(c), vn = v[0] * nx + v[1] * ny;
    if (vn < -90) c.bias = Math.max(c.bias, -PH.e * vn);
    c.jn = 0; c.jt = 0;
  }
}
function relVel(c){
  const a = c.a;
  const vax = a.vx - a.w * c.ray, vay = a.vy + a.w * c.rax;
  let vbx = 0, vby = 0;
  if (c.b){ const b = c.b; vbx = b.vx - b.w * c.rby; vby = b.vy + b.w * c.rbx; }
  else if (c.seg){ vbx = c.kvx; vby = c.kvy; }
  return [vbx - vax, vby - vay];
}
function applyImp(c, Px, Py){
  const a = c.a;
  a.vx -= Px * c.ima; a.vy -= Py * c.ima; a.w -= c.iIa * (c.rax * Py - c.ray * Px);
  if (c.b){ const b = c.b; b.vx += Px * c.imb; b.vy += Py * c.imb; b.w += c.iIb * (c.rbx * Py - c.rby * Px); }
}
function solveContacts(){
  const C = W.contacts;
  for (let k = 0; k < PH.it; k++){
    for (let i = 0; i < C.length; i++){
      const c = C[i];
      if (!c.kn) continue;
      let v = relVel(c);
      const vn = v[0] * c.nx + v[1] * c.ny;
      let j = (c.bias - vn) * c.kn;
      const o = c.jn; c.jn = Math.max(0, o + j); j = c.jn - o;
      applyImp(c, j * c.nx, j * c.ny);
      const tx = -c.ny, ty = c.nx;
      v = relVel(c);
      const vt = v[0] * tx + v[1] * ty;
      let jt = -vt * c.kt;
      const mx = c.mu * c.jn, ot = c.jt;
      c.jt = clamp(ot + jt, -mx, mx); jt = c.jt - ot;
      applyImp(c, jt * tx, jt * ty);
    }
  }
}
function physStep(h, clawBusy){
  for (const b of W.bodies){
    if (b.sl) continue;
    b.vy += PH.g * h;
    const ld = 1 - 0.15 * h, ad = 1 - 1.6 * h;
    b.vx *= ld; b.vy *= ld; b.w *= ad;
  }
  collide();
  prepContacts(h);
  solveContacts();
  for (const b of W.bodies){
    if (b.sl) continue;
    const sp = b.vx * b.vx + b.vy * b.vy;
    if (sp > 1600 * 1600){ const k = 1600 / Math.sqrt(sp); b.vx *= k; b.vy *= k; }
    b.x += b.vx * h; b.y += b.vy * h; b.a += b.w * h;
    if (b.held > 0) b.held -= h * 8;
    if (!clawBusy && sp < 14 * 14 && Math.abs(b.w) < 0.35 && b.held <= 0){
      b.slT += h;
      if (b.slT > 0.45){ b.sl = true; b.vx = b.vy = b.w = 0; }
    } else b.slT = 0;
  }
}
function wakeAll(){ for (const b of W.bodies){ b.sl = false; b.slT = 0; } }
function kinetic(){ let e = 0; for (const b of W.bodies) e += b.vx * b.vx + b.vy * b.vy; return e; }

/* =============================== CLAW ==================================== */
const PRONG = [[0, 0], [14, 28], [9, 48], [1, 57]];
const PHI_OPEN = 0.62, PHI_CLOSED = -0.1;
function clawSize(){ const r = G.run; return ITEM_SCALE * r.claw.size * (hasRelic('magnet') ? 1.12 : 1); }
function clawGrip(){ const r = G.run; return Math.min(1, r.claw.grip + (hasRelic('gloves') ? 0.15 : 0)); }
function initClaw(){
  const s = clawSize();
  F.claw = { x: CHW / 2 + 4, y: RAIL, tx: 200, vx: 0, vy: 0, pL: PHI_OPEN, pR: PHI_OPEN, wL: 0, wR: 0,
    st: 'idle', t: 0, s, pending: false, touch: false, hitL: false, hitR: false, haltL: false, haltR: false,
    halt: 2.2, loosen: 0, sway: 0, swayV: 0 };
  F.claw.tx = F.claw.x;
}
const XMIN = 26, XMAX = MW - 30;
function clawSegs(){
  const C = F.claw, s = C.s, out = W.csegs; out.length = 0;
  const hub = mkSeg(C.x, C.y, C.x, C.y, 13 * s); hub.own = 0; hub.vx = C.vx; hub.vy = C.vy; hub.hx = C.x; hub.hy = C.y;
  out.push(hub);
  for (const side of [-1, 1]){
    const phi = side < 0 ? C.pL : C.pR, dphi = side < 0 ? C.wL : C.wR;
    const hx = C.x + side * 7 * s, hy = C.y + 7 * s;
    const al = -side * phi, ca = Math.cos(al), sa = Math.sin(al);
    const P = PRONG.map(([lx, ly]) => { const x = side * lx * s, y = ly * s; return [hx + x * ca - y * sa, hy + x * sa + y * ca]; });
    for (let k = 0; k < P.length - 1; k++){
      const g = mkSeg(P[k][0], P[k][1], P[k + 1][0], P[k + 1][1], 4.5 * s);
      g.own = side; g.vx = C.vx; g.vy = C.vy; g.om = -side * dphi; g.hx = hx; g.hy = hy;
      out.push(g);
    }
  }
  return out;
}
function prongPts(C, side){
  const s = C.s, phi = side < 0 ? C.pL : C.pR;
  const hx = C.x + side * 7 * s, hy = C.y + 7 * s;
  const al = -side * phi, ca = Math.cos(al), sa = Math.sin(al);
  return PRONG.map(([lx, ly]) => { const x = side * lx * s, y = ly * s; return [hx + x * ca - y * sa, hy + x * sa + y * ca]; });
}
function clawBusy(){ const st = F.claw.st; return st === 'drop' || st === 'close' || st === 'lift'; }
// Decide this sub-step's claw velocities (called before the physics step).
function clawPlan(h){
  const C = F.claw;
  C.vx = 0; C.vy = 0; C.wL = 0; C.wR = 0; C.t += h;
  const maxY = MH - 60 * C.s - 2;
  switch (C.st){
    case 'idle': {
      const tx = clamp(C.tx, XMIN, XMAX), d = tx - C.x;
      if (Math.abs(d) > 0.6) C.vx = Math.sign(d) * Math.min(330, Math.abs(d) / h);
      else if (C.pending && F.phase === 'player' && F.grabs > 0){
        C.pending = false; C.st = 'drop'; C.t = 0; C.touch = false;
        F.grabs--; F.dropGot = 0; F.jackpotDone = false; G.run.stats.grabs++;
        wakeAll(); sfx('drop');
      } else C.pending = false;
      break;
    }
    case 'drop':
      C.vy = 250;
      if (C.touch || C.y >= maxY){ C.st = 'close'; C.t = 0; C.haltL = C.haltR = false; sfx('clamp'); }
      break;
    case 'close': {
      if (C.hitL) C.haltL = true;
      if (C.hitR) C.haltR = true;
      if (!C.haltL && C.pL > PHI_CLOSED) C.wL = -2.6;
      if (!C.haltR && C.pR > PHI_CLOSED) C.wR = -2.6;
      const doneL = C.haltL || C.pL <= PHI_CLOSED, doneR = C.haltR || C.pR <= PHI_CLOSED;
      if ((doneL && doneR && C.t > 0.18) || C.t > 0.75){
        C.st = 'lift'; C.t = 0; C.loosen = (1 - clawGrip()) * 0.2 * (0.7 + Math.random() * 0.6);
        F.cargo = W.bodies.filter(b => b.held > 0 && b.y < C.y + 70 * C.s);
        if (F.cargo.length) sfx('clamp2');
      }
      break;
    }
    case 'lift':
      C.vy = -175;
      if (C.t < 0.4){ C.wL = C.wR = C.loosen / 0.4; }
      if (C.y <= RAIL){
        C.st = 'carry'; C.t = 0; C.swayV += 2.2;
        // the jolt at the top: a weak claw twitches open a touch
        if (Math.random() < (1 - clawGrip()) * 0.6){ C.jolt = 0.08; }
      }
      break;
    case 'carry': {
      if (C.jolt > 0 && C.t < 0.1){ C.wL = C.wR = C.jolt / 0.1; }
      const tx = CHW / 2 + 4, d = tx - C.x;
      if (Math.abs(d) > 0.6) C.vx = Math.sign(d) * Math.min(330, Math.abs(d) / h);
      else if (C.t > 0.2){ C.st = 'open'; C.t = 0; C.jolt = 0; sfx('open'); }
      break;
    }
    case 'open':
      if (C.pL < PHI_OPEN) C.wL = 3.2;
      if (C.pR < PHI_OPEN) C.wR = 3.2;
      if (C.t > 0.35){ C.st = 'idle'; C.t = 0; C.tx = F.aiming ? C.tx : C.x; onDropDone(); }
      break;
  }
  if (C.st === 'drop' && C.y + C.vy * h > maxY) C.vy = (maxY - C.y) / h;
  if (C.st === 'lift' && C.y + C.vy * h < RAIL) C.vy = (RAIL - C.y) / h;
  C.touch = false; C.hitL = false; C.hitR = false;
  clawSegs();
}
function clawMove(h){
  const C = F.claw;
  C.x += C.vx * h; C.y += C.vy * h;
  C.pL = clamp(C.pL + C.wL * h, PHI_CLOSED - 0.02, PHI_OPEN);
  C.pR = clamp(C.pR + C.wR * h, PHI_CLOSED - 0.02, PHI_OPEN);
  // purely visual cable sway
  C.swayV += (-C.sway * 40 - C.swayV * 3 - C.vx * 0.02) * h; C.sway += C.swayV * h;
}

/* =============================== RUN ===================================== */
function hasRelic(id){ return !!(G.run && G.run.relics.indexOf(id) >= 0); }
function newEntry(id, lvl){ const r = G.run; return { id, lvl: lvl || 1, uid: ++r.uid }; }
function newRun(seed){
  G.run = {
    seed: seed == null ? (Math.random() * 2 ** 31) | 0 : seed,
    hp: 60, max: 60, gold: 45, deck: [], relics: [], uid: 0,
    claw: { grabs: 3, size: 1, grip: 0.5 },
    act: 1, brushes: 3, inks: { dot: 3, line: 1, twin: 0, grand: 0 }, map: null,
    stats: { kills: 0, fights: 0, grabs: 0, items: 0, gold: 0 }, buys: { claw: 0, remove: 0 },
  };
  for (const id of ['sword','sword','sword','dagger','dagger','shield','shield','shield','apple','apple','coin','coin','fire'])
    G.run.deck.push(newEntry(id));
  G.run.map = genMap(1);
  G.meta.runs++; saveMeta();
}
function goldGain(n){ const r = G.run; n = Math.round(n * (hasRelic('purse') ? 1.5 : 1)); r.gold += n; r.stats.gold += n; return n; }

/* =============================== COMBAT ================================== */
function mkEnemy(id, depth){
  const d = ENEMIES[id];
  const hpMul = 1 + 0.4 * depth, hp = Math.round(d.hp * hpMul * (0.93 + R() * 0.14));
  return { id, d, hp, max: hp, block: 0, st: {}, chill: 0, frozen: false, turn: 0, intent: null, last: -1,
    x: 200, y: 140, hitT: 0, atkT: 0, deadT: 0, dead: false, pouch: [], mul: 1 + 0.3 * depth };
}
function layoutEnemies(){
  const al = F.enemies, n = al.length;
  const xs = n === 1 ? [220] : n === 2 ? [150, 290] : [100, 210, 320];
  al.forEach((e, i) => { e.x = xs[i]; e.y = e.d.boss ? 124 : 132; });
}
function rollIntent(e){
  const mv = e.d.mv;
  let i;
  if (e.d.cycle) i = e.turn % mv.length;
  else { do { i = ri(mv.length); } while (mv.length > 1 && i === e.last && R() < 0.8); }
  e.last = i;
  const m = Object.assign({}, mv[i]);
  for (const k of ['atk', 'block', 'poison', 'burn']) if (m[k]) m[k] = Math.max(1, Math.round(m[k] * e.mul));
  e.intent = m;
}
function intentBits(e){
  const m = e.intent, out = [];
  if (!m) return out;

// One fixed 60 Hz step of the fight.
function stepFight(dt){
  F.t += dt;
  const C = F.claw;
  // items raining back into the machine
  if (F.spawnQ.length){ F.spawnT -= dt; if (F.spawnT <= 0){ spawnBody(F.spawnQ.shift(), false); F.spawnT = 0.06; } }
  if (G.keyDir && C.st === 'idle') C.tx = C.x + G.keyDir * 40;
  const h = 1 / (60 * PH.sub);
  for (let s = 0; s < PH.sub; s++){
    clawPlan(h);
    physStep(h, clawBusy());
    clawMove(h);
  }
  // cargo that slipped out of the prongs on the way
  if (C.st === 'lift' || C.st === 'carry'){
    for (let i = F.cargo.length - 1; i >= 0; i--){
      const b = F.cargo[i];
      if (W.bodies.indexOf(b) < 0){ F.cargo.splice(i, 1); continue; }
      if (b.y > C.y + 95 * C.s && b.vy > 60 && b.x > CHW){
        F.cargo.splice(i, 1); G.run.stats.slips = (G.run.stats.slips || 0) + 1;
        popup(MX + b.x, MY + b.y - 20, pick2(['slipped!', 'nooo!', 'so close!', 'butterfingers']), '#ff8a9c'); sfx('slip'); F.shake = Math.max(F.shake, 3);
      }
    }
  }
  if (C.st === 'open' && C.t < 1 / 60 + 1e-9 && F.dropGot === 0 && !F.flies.length) F.whiffT = 0.6;
  if (F.whiffT > 0){ F.whiffT -= dt; if (F.whiffT <= 0 && F.dropGot === 0 && C.st !== 'drop'){ popup(MX + C.x, MY + 90, pick2(['whiff...', 'empty claw', 'nothing!']), '#b0a8c8'); } }
  F.chuteT = Math.max(0, F.chuteT - dt);
  // prizes that fell through the chute
  for (let i = W.bodies.length - 1; i >= 0; i--){
    const b = W.bodies[i];
    if (b.y > MH + 26 && b.x < CHW + 6){ if (F.phase === 'player' || F.phase === 'enemy') collect(b); else { W.bodies.splice(i, 1); F.used.push(b.it); } }
    else if (b.y > MH + 60 || b.x < -60 || b.x > MW + 60 || b.y < -200){ W.bodies.splice(i, 1); F.spawnQ.push(b.it); }
  }
  // flying icons land and fire their effect
  for (const f of F.flies){
    f.t += dt;
    if (!f.fired && f.t >= f.dur){ f.fired = true; if (F.phase === 'player' || F.phase === 'enemy') useItem(f.it); }
  }
  F.flies = F.flies.filter(f => f.t < f.dur + 0.05);
  // enemy turn sequence
  if (F.seq.length){
    F.seqT += dt;
    if (F.seqT >= F.seq[0].d){ F.seqT = 0; const s = F.seq.shift(); s.fn(); }
  }
  // end of the player's turn: out of grabs, claw parked, chute empty
  if (F.phase === 'player' && F.grabs <= 0 && C.st === 'idle' && !F.flies.length){
    const inChute = W.bodies.some(b => b.x < CHW + 4 && b.y > MH - DIVH - 30);
    F.quiet += dt;
    if ((!inChute && F.quiet > 0.55) || F.quiet > 2.6) endPlayerTurn();

    F.endT -= dt;

  }
  // juice
  for (const e of F.enemies){ e.hitT = Math.max(0, e.hitT - dt); e.atkT = Math.max(0, e.atkT - dt); if (e.dead) e.deadT += dt; }
  F.P.hitT = Math.max(0, F.P.hitT - dt);
  F.shake = Math.max(0, F.shake - dt * 30);
  for (const t of F.texts) t.t += dt;
  F.texts = F.texts.filter(t => t.t < 1.1);
  for (const p of F.parts){ p.t += dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 500 * dt; }
  F.parts = F.parts.filter(p => p.t < p.life);
  if (F.banner){ F.banner.t -= dt; if (F.banner.t <= 0) F.banner = null; }
}

function rollItems(n, weights){
  const out = [], seen = new Set();
  let guard = 0;
  while (out.length < n && guard++ < 200){
    const r = R(); let rar = r < weights[0] ? 0 : r < weights[0] + weights[1] ? 1 : 2;
    const pool = POOL.filter(k => ITEMS[k].rar === rar && !seen.has(k));
    if (!pool.length) continue;
    const id = pick(pool); seen.add(id); out.push(id);
  }
  return out;
}
function rollRelic(){

  return pool.length ? pick(pool) : null;
}
function randomInk(big){

/* ================================ MAP ==================================== */
// Hex map (pointy-top, odd rows shoved right).  Everything starts under fog; the
// boss is always visible.  Brushes paint around you, inks paint lines and dots.
const ROWS = 11, COLS = 7;
const DIRS = [[1, 0], [1, -1], [0, -1], [-1, 0], [-1, 1], [0, 1]];
const idx = (r, c) => r * COLS + c;
const toCube = (r, c) => [c - (r - (r & 1)) / 2, r];
const fromCube = (q, r) => [r, q + (r - (r & 1)) / 2];
function inMap(r, c){ return r >= 0 && r < ROWS && c >= 0 && c < COLS; }
function hexDist(a, b){
  const [q1, r1] = toCube(a.r, a.c), [q2, r2] = toCube(b.r, b.c);
  const dq = q1 - q2, dr = r1 - r2; return (Math.abs(dq) + Math.abs(dr) + Math.abs(dq + dr)) / 2;
}
function neighbors(cells, i){
  const c = cells[i], [q, r] = toCube(c.r, c.c), out = [];
  for (const [dq, dr] of DIRS){ const [rr, cc] = fromCube(q + dq, r + dr); if (inMap(rr, cc)) out.push(idx(rr, cc)); }
  return out;
}
function genMap(act){
  const cells = [];
  for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++)
    cells.push({ r, c, v: R() < 0.17, rev: false, revT: -9, k: '', done: false, n: R() });
  const start = idx(ROWS - 1, 3), boss = idx(0, 3);
  cells[start].v = cells[boss].v = false;
  // carve a wandering path so the boss is always reachable
  let cur = start, guard = 0;
  while (cur !== boss && guard++ < 200){
    const nb = neighbors(cells, cur).sort(() => R() - 0.5);
    const d0 = hexDist(cells[cur], cells[boss]);
    const nx = nb.find(i => hexDist(cells[i], cells[boss]) < d0) || nb[0];
    cells[nx].v = false; cur = nx;
  }
  // anything cut off from the start becomes void
  const seen = bfs(cells, start, i => !cells[i].v);
  cells.forEach((c, i) => { if (!seen.has(i)) c.v = true; });
  const open = cells.map((c, i) => i).filter(i => !cells[i].v && i !== start && i !== boss);
  const put = (k, rows) => {
    const cand = open.filter(i => !cells[i].k && cells[i].r >= rows[0] && cells[i].r <= rows[1]);
    if (cand.length) cells[pick(cand)].k = k;
  };
  put('shop', [3, 7]); put('camp', [1, 2]); put('elite', [2, 5]); put('chest', [4, 8]);
  if (act > 1) put('elite', [3, 6]);
  for (const i of open){
    const c = cells[i];
    if (c.k) continue;
    if (hexDist(c, cells[start]) <= 1){ c.k = R() < 0.35 ? 'gold' : ''; continue; }
    const r = R();
    c.k = r < 0.27 ? 'fight' : r < 0.36 ? 'gold' : r < 0.45 ? 'mystery' : r < 0.51 ? 'ink' : r < 0.55 ? 'chest'
        : r < 0.58 && c.r <= 6 ? 'elite' : r < 0.60 ? 'camp' : '';
  }
  cells[boss].k = 'boss'; cells[start].k = 'start'; cells[start].done = true;
  const m = { cells, pos: start, act };
  reveal(m, cells.map((c, i) => i).filter(i => hexDist(cells[i], cells[start]) <= 1), true);
  cells[boss].rev = true;
  for (const i of neighbors(cells, boss)) cells[i].rev = true;
  return m;
}
function bfs(cells, from, ok){
  const seen = new Set([from]), q = [from];
  while (q.length){ const i = q.shift(); for (const n of neighbors(cells, i)) if (!seen.has(n) && ok(n)){ seen.add(n); q.push(n); } }
  return seen;
}
function pathTo(m, to){
  const cells = m.cells, prev = new Map([[m.pos, -1]]), q = [m.pos];
  while (q.length){
    const i = q.shift();
    if (i === to) break;
    for (const n of neighbors(cells, i)){
      if (prev.has(n) || cells[n].v || !cells[n].rev) continue;
      prev.set(n, i);
      // don't route through unfinished encounters
      if (n !== to && !cells[n].done && (cells[n].k === 'fight' || cells[n].k === 'elite' || cells[n].k === 'boss')) continue;
      q.push(n);
    }
  }
  if (!prev.has(to)) return null;
  const p = []; for (let i = to; i !== m.pos; i = prev.get(i)) p.unshift(i);
  return p;
}
function reveal(m, list, quiet){
  let n = 0;
  for (const i of list){ const c = m.cells[i]; if (c && !c.rev){ c.rev = true; c.revT = G.time + n * 0.04; n++; } }
  if (n && !quiet) sfx('paint');
  return n;
}
function lineCells(m, dir, from, to){
  const c = m.cells[m.pos], [q, r] = toCube(c.r, c.c), out = [];
  const [dq, dr] = DIRS[dir];
  for (let k = from; k <= to; k++){ const [rr, cc] = fromCube(q + dq * k, r + dr * k); if (inMap(rr, cc)) out.push(idx(rr, cc)); }
  return out;
}
function toolCells(tool, hi){
  const m = G.run.map, cells = m.cells, me = cells[m.pos];
  if (tool === 'brush') return cells.map((c, i) => i).filter(i => hexDist(cells[i], me) <= 2);
  if (tool === 'grand') return cells.map((c, i) => i).filter(i => hexDist(cells[i], me) <= 3);
  if (hi < 0) return [];
  if (tool === 'dot'){
    const c = cells[hi];
    if (c.rev || !neighbors(cells, hi).some(n => cells[n].rev)) return [];
    return [hi];
  }
  const dir = dirTo(hi);
  if (dir < 0) return [];
  if (tool === 'line') return lineCells(m, dir, 1, 5);
  if (tool === 'twin') return lineCells(m, dir, 1, 3).concat(lineCells(m, (dir + 3) % 6, 1, 3));
  return [];
}
function dirTo(i){
  const m = G.run.map; if (i === m.pos) return -1;
  const a = hexXY(m.cells[m.pos]), b = hexXY(m.cells[i]);
  const ang = Math.atan2(b[1] - a[1], b[0] - a[0]);
  let best = 0, bd = 9;
  for (let k = 0; k < 6; k++){ const da = Math.abs(((ang - (-k * Math.PI / 3)) % TAU + TAU + Math.PI) % TAU - Math.PI); if (da < bd){ bd = da; best = k; } }
  return best;
}
const HS = 29, HW = Math.sqrt(3) * HS;
const HOX = (VW - HW * (COLS + 0.5)) / 2 + HW / 2, HOY = 92;
function hexXY(c){ return [HOX + HW * (c.c + 0.5 * (c.r & 1)), HOY + HS * 1.5 * c.r]; }
function hexAt(x, y){
  const cells = G.run.map.cells; let best = -1, bd = 1e9;
  cells.forEach((c, i) => { const [hx, hy] = hexXY(c); const d = (hx - x) ** 2 + (hy - y) ** 2; if (d < bd){ bd = d; best = i; } });
  return bd < HS * HS ? best : -1;
}
function useTool(tool, hi){
  const run = G.run, m = run.map;
  const list = toolCells(tool, hi);
  if (!list.length) return false;
  if (!list.some(i => !m.cells[i].rev)){ toast('Nothing new to paint there.'); return true; }
  reveal(m, list);
  if (tool === 'brush') run.brushes--;
  else run.inks[tool]--;
  G.tool = null; G.aimAt = -1; syncBars();
  checkStuck();
  saveRun();
  return true;
}
function checkStuck(){
  const run = G.run, m = run.map;
  const tools = run.brushes + run.inks.dot + run.inks.line + run.inks.twin + run.inks.grand;
  if (tools > 0) return;
  const bossI = m.cells.findIndex(c => c.k === 'boss');
  if (pathTo(m, bossI)) return;
  run.brushes++; syncBars();
  toast('You find a spare brush in your pack. 🖌️');
}
function tapMap(i){
  const run = G.run, m = run.map;
  if (G.walk) return;
  if (G.tool){
    // aimed inks: the first tap shows where the ink will go, the second tap paints
    const key = G.tool === 'dot' ? i : dirTo(i);
    if (!toolCells(G.tool, i).length){ toast(G.tool === 'dot' ? 'Pick a foggy hex next to the painted area.' : 'Tap a hex to choose a direction.'); return; }
    if (G.aimAt === key){ useTool(G.tool, i); return; }
    G.aimAt = key; G.hover = i; sfx('step');
    toast('Tap again to paint here.');
    return;
  }
  if (i < 0 || i === m.pos){ if (i === m.pos) enterCell(); return; }
  const c = m.cells[i];
  if (!c.rev){ toast('Paint the fog first: use a brush or ink below.'); return; }
  if (c.v){ toast('That is a chasm.'); return; }
  const p = pathTo(m, i);
  if (!p){ toast('No painted path leads there yet.'); return; }
  G.walk = p; G.walkT = 0;
}
function stepWalk(dt){
  if (!G.walk) return;
  G.walkT += dt;
  if (G.walkT < 0.16) return;
  G.walkT = 0;
  const m = G.run.map, i = G.walk.shift();
  m.pos = i; sfx('step'); syncBars();
  const c = m.cells[i];
  if ((c.k && !c.done) || !G.walk.length){ G.walk = null; saveRun(); enterCell(); }
}
function depthOf(c){ return clamp((ROWS - 1 - c.r) / (ROWS - 1), 0, 1); }
function enterCell(){
  const run = G.run, m = run.map, c = m.cells[m.pos];
  if (c.done && c.k !== 'shop') return;
  const act = run.act, d = depthOf(c);
  switch (c.k){
    case 'fight': startFight('normal', pick(d < 0.3 ? ENC[act].easy : ENC[act].hard), d); break;
    case 'elite': startFight('elite', pick(ENC[act].elite), d); break;
    case 'boss':  startFight('boss', ENC[act].boss, 0); break;
    case 'gold': { const g = goldGain(14 + ri(14) + act * 4); c.done = true; toast('💰 +' + g + ' gold'); sfx('coin'); saveRun(); break; }
    case 'ink': { const k = randomInk(R() < 0.3); addInk(k); c.done = true; toast(INKS[k].e + ' ' + INKS[k].n + ' Ink found!'); sfx('gem'); syncBars(); saveRun(); break; }
    case 'chest': c.done = true; G.rq = { stages: [{ t: 'items', ids: rollItems(3, [0.4, 0.42, 0.18]) }], gains: null, title: '🎁 Treasure' };
      run.rq = G.rq; saveRun(); showReward(); break;
    case 'camp': showCamp(); break;
    case 'shop': showShop(); break;
    case 'mystery': showEvent(); break;
  }
}

let AC = null;
function tone(f, dur, type, vol, slide, delay){
  const t0 = AC.currentTime + (delay || 0);
  const o = AC.createOscillator(), g = AC.createGain();
  o.type = type || 'square'; o.frequency.setValueAtTime(f, t0);
  if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, f * slide), t0 + dur);
  g.gain.setValueAtTime(vol || 0.06, t0); g.gain.exponentialRampToValueAtTime(0.0008, t0 + dur);
  o.connect(g); g.connect(AC.destination); o.start(t0); o.stop(t0 + dur + 0.02);
}
function sfx(k, n){
  if (G.meta && G.meta.muted) return;
  try {
    if (!AC){ const A = window.AudioContext || window.webkitAudioContext; if (!A) return; AC = new A(); }
    if (AC.state === 'suspended') AC.resume();
    switch (k){
      case 'drop': tone(420, 0.35, 'sawtooth', 0.03, 0.5); break;
      case 'clamp': tone(160, 0.08, 'square', 0.06); tone(120, 0.1, 'square', 0.05, 1, 0.06); break;
      case 'clamp2': tone(880, 0.05, 'triangle', 0.05); break;
      case 'slip': tone(700, 0.35, 'triangle', 0.05, 0.35); break;
      case 'open': tone(300, 0.12, 'triangle', 0.05, 1.6); break;
      case 'grab': tone(520 + (n || 1) * 120, 0.12, 'square', 0.05, 1.5); break;
      case 'hit': tone(180, 0.1, 'sawtooth', 0.07, 0.5); break;
      case 'kill': tone(300, 0.25, 'square', 0.06, 0.3); tone(600, 0.2, 'triangle', 0.05, 2, 0.1); break;
      case 'ouch': tone(110, 0.18, 'sawtooth', 0.08, 0.6); break;
      case 'block': tone(700, 0.06, 'triangle', 0.05); break;
      case 'coin': tone(988, 0.07, 'square', 0.04); tone(1318, 0.12, 'square', 0.04, 1, 0.07); break;
      case 'gem': tone(660, 0.1, 'triangle', 0.05); tone(990, 0.1, 'triangle', 0.05, 1, 0.08); tone(1320, 0.18, 'triangle', 0.05, 1, 0.16); break;
      case 'status': tone(240, 0.14, 'triangle', 0.05, 1.4); break;
      case 'burn': tone(200, 0.2, 'sawtooth', 0.04, 0.7); break;
      case 'freeze': tone(1400, 0.25, 'sine', 0.05, 0.6); break;
      case 'junk': tone(90, 0.2, 'square', 0.05, 0.8); break;
      case 'steal': tone(500, 0.2, 'triangle', 0.05, 0.4); break;
      case 'paint': tone(330, 0.2, 'sine', 0.04, 1.5); break;
      case 'step': tone(260, 0.04, 'triangle', 0.025); break;
      case 'heal': tone(523, 0.12, 'sine', 0.05); tone(784, 0.2, 'sine', 0.05, 1, 0.1); break;
      case 'start': tone(392, 0.1, 'square', 0.04); tone(523, 0.1, 'square', 0.04, 1, 0.1); tone(784, 0.2, 'square', 0.04, 1, 0.2); break;
      case 'boss': tone(98, 0.5, 'sawtooth', 0.07, 0.8); tone(92, 0.6, 'sawtooth', 0.06, 0.8, 0.25); break;
      case 'win': [523, 659, 784, 1046].forEach((f, i) => tone(f, 0.18, 'square', 0.04, 1, i * 0.09)); break;
      case 'lose': [392, 330, 262, 196].forEach((f, i) => tone(f, 0.25, 'triangle', 0.05, 1, i * 0.14)); break;

/* ================================ INPUT ================================== */
function toL(e){
  const r = cv.getBoundingClientRect();
  return { x: (e.clientX - r.left) / (r.width || 1) * VW, y: (e.clientY - r.top) / (r.height || 1) * VH };
}
function onDown(x, y){
  G.tip = null;
  if (G.scr === 'fight' && F){
    G.press = { x, y, t: 0, moved: false };
    if (y < 196){
      const i = F.enemies.findIndex(e => !e.dead && Math.abs(e.x - x) < 50 && Math.abs(e.y - y) < 70);
      if (i >= 0){ F.target = i; sfx('step'); }
      return;
    }
    // aiming may start while the claw is still busy; it heads there once it is free
    if (F.phase === 'player' && y > MY - 30 && (F.grabs > 0 || F.claw.st !== 'idle')){
      F.aiming = true; F.claw.tx = x - MX;
    }
  } else if (G.scr === 'map' && G.run){
    if (y > VH - 80) return;
    tapMap(hexAt(x, y));
  }
}
function onMove(x, y){
  if (G.press && Math.hypot(x - G.press.x, y - G.press.y) > 9) G.press.moved = true;
  if (G.press) { G.press.lx = x; G.press.ly = y; }
  if (G.scr === 'fight' && F && F.aiming) F.claw.tx = x - MX;
  if (G.scr === 'map' && G.run) G.hover = hexAt(x, y);
}
function onUp(){
  const pr = G.press; G.press = null;
  if (G.tip){ G.tip = null; if (F) F.aiming = false; return; }
  if (G.scr === 'fight' && F && F.aiming){
    F.aiming = false;
    // letting go over the prize chute cancels the aim
    if (pr && pr.lx != null && pr.lx < MX + CHW - 6 && pr.moved){ toast('Aim cancelled'); return; }
    if (F.grabs > 0) F.claw.pending = true;
  }
}
// Long-press anything in a fight to read what it does.
function inspectAt(x, y){
  if (!F) return null;
  for (const e of F.enemies){
    if (e.dead) continue;
    if (Math.abs(e.x - x) < 50 && Math.abs(e.y - y) < 60){
      const mv = e.d.mv.map(m => intentBits({ intent: m, st: {}, frozen: false }).map(b => b[0] + b[1]).join(' ')).join('  |  ');
      const st = statusList(e.st).map(s => s[0] + ' ' + s[3] + ' ' + s[1]).join(', ');
      return { x, y, t: e.d.e + ' ' + e.d.n + '  ' + e.hp + '/' + e.max, l: ['Moves: ' + mv].concat(st ? [st] : []).concat(e.pouch.length ? ['Holding ' + e.pouch.map(it => ITEMS[it.id].e).join('') + ' until it dies'] : []) };
    }
  }
  if (y > 196 && y < 256){
    const st = statusList(F.P.st);
    if (st.length) return { x, y, t: 'Your statuses', l: st.map(s => s[0] + ' ' + s[3] + ' ' + s[1] + ': ' + STATUS[s[3]].d) };
  }
  if (y < 34 && G.run.relics.length){
    return { x, y, t: 'Charms', l: G.run.relics.map(r => RELICS[r].e + ' ' + RELICS[r].n + ': ' + RELICS[r].d) };
  }
  const mx = x - MX, my = y - MY;
  for (const b of W.bodies){
    if (Math.hypot(b.x - mx, b.y - my) < b.br + 4){
      const d = ITEMS[b.it.id];
      return { x, y, t: d.e + ' ' + d.n + (b.it.lvl > 1 ? ' ' + '★'.repeat(b.it.lvl - 1) : ''), l: [fxText(b.it.id, b.it.lvl).replace(/<[^>]+>/g, ''), physText(b.it.id)] };
    }
  }
  return null;
}
function stepPress(dt){
  const p = G.press;
  if (!p || p.moved || G.tip || G.scr !== 'fight') return;
  p.t += dt;
  if (p.t > 0.42){
    const tip = inspectAt(p.x, p.y);
    if (tip){ G.tip = tip; if (F) F.aiming = false; sfx('step'); buzz(8); }
  }
}
function drawTip(){
  const t = G.tip; if (!t) return;
  ctx.font = '900 14px "Trebuchet MS",system-ui,sans-serif';
  const lines = [];
  for (const l of t.l){
    const words = l.split(' '); let cur = '';
    ctx.font = '600 13px "Trebuchet MS",system-ui,sans-serif';
    for (const w of words){ const nx = cur ? cur + ' ' + w : w; if (ctx.measureText(nx).width > 300 && cur){ lines.push(cur); cur = w; } else cur = nx; }
    if (cur) lines.push(cur);
  }

function bindUI(){

  window.addEventListener('resize', fit);
  window.addEventListener('keydown', e => {
    if (G.scr !== 'fight' || !F) return;
    if (e.key === 'ArrowLeft' || e.key === 'a') G.keyDir = -1;
    else if (e.key === 'ArrowRight' || e.key === 'd') G.keyDir = 1;
    else if (e.key === ' ' || e.key === 'ArrowDown' || e.key === 's'){ F.claw.pending = true; e.preventDefault && e.preventDefault(); }
    else if (e.key === 'Tab'){ const al = F.enemies; let i = F.target; for (let k = 0; k < al.length; k++){ i = (i + 1) % al.length; if (!al[i].dead) break; } F.target = i; e.preventDefault && e.preventDefault(); }
  });

  const click = e => {

function fit(){
  const w = window.innerWidth || VW, h = window.innerHeight || VH;
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  SCALE = Math.min(w / VW, h / VH);
  RS = SCALE * dpr;
  cv.width = Math.round(VW * RS); cv.height = Math.round(VH * RS);
  const st = $('stage');
  st.style.width = cv.style.width = VW * SCALE + 'px';
  st.style.height = cv.style.height = VH * SCALE + 'px';
  $('ui').style.transform = 'scale(' + SCALE + ')';
  const touch = 'ontouchstart' in window || (navigator.maxTouchPoints || 0) > 0;
  $('rot').className = touch && w > h * 1.15 && h < 560 ? 'on' : '';
}

  const preview = G.tool ? new Set(toolCells(G.tool, G.hover)) : null;
  const reach = new Set(neighbors(cells, m.pos));
  cells.forEach((c, i) => {
    const [x, y] = hexXY(c);
    const k = c.rev ? clamp((G.time - c.revT) / 0.35, 0, 1) : 0;
    if (!c.rev || k < 1) hexPath(x, y, HS - 1), ctx.fillStyle = fogCol(c), ctx.fill();
    if (c.rev){
      const s = (HS - 1.5) * (k < 1 ? 0.3 + 0.7 * k : 1);
      hexPath(x, y, s);
      if (c.v){ ctx.fillStyle = '#2a2240'; ctx.fill(); }
      else {
        const pal = run.act === 1 ? ['#7fb069', '#8cbf73', '#6fa35e'] : run.act === 2 ? ['#d7a86e', '#c9975c', '#e0b57c'] : ['#9d86c9', '#8a74b8', '#ab96d6'];
        ctx.fillStyle = pal[Math.floor(c.n * 3)]; ctx.fill();
        ctx.strokeStyle = 'rgba(60,40,20,.35)'; ctx.lineWidth = 1.5; ctx.stroke();
        if (c.done && c.k && c.k !== 'start' && c.k !== 'shop'){ ctx.fillStyle = 'rgba(255,255,255,.18)'; ctx.fill(); }
      }
      if (k >= 1 && c.k && !c.v){
        const e = cellEmoji(c);
        if (e){ ctx.globalAlpha = c.done && c.k !== 'shop' ? 0.3 : 1; emoji(e, x, y + (c.done ? 0 : Math.sin(G.time * 3 + i) * 1.5), c.k === 'boss' ? 34 : 24); ctx.globalAlpha = 1; }
      }
    }
    if (preview && preview.has(i)){ hexPath(x, y, HS - 3); ctx.strokeStyle = '#ff5fa2'; ctx.lineWidth = 3; ctx.stroke(); }
    else if (!G.tool && reach.has(i) && c.rev && !c.v){ hexPath(x, y, HS - 3); ctx.strokeStyle = 'rgba(255,255,255,' + (0.5 + Math.sin(G.time * 4) * 0.3) + ')'; ctx.lineWidth = 2.5; ctx.stroke(); }
  });
  // the player
  const [px, py] = hexXY(cells[m.pos]);
  ctx.fillStyle = 'rgba(0,0,0,.3)'; ctx.beginPath(); ctx.ellipse(px, py + 14, 14, 5, 0, 0, TAU); ctx.fill();
  emoji('🦝', px, py - 4 + Math.sin(G.time * 5) * 2, 32);
  // top bar
  ctx.fillStyle = 'rgba(0,0,0,.4)'; ctx.fillRect(0, 0, VW, 44);
  txt('❤️ ' + run.hp + '/' + run.max, 10, 22, 15, '#ff8a9c', 'left');
  txt('💰 ' + run.gold, 112, 22, 15, '#ffd24d', 'left');
  txt('Act ' + run.act + ': ' + ACT_NAME[run.act], VW - 10, 22, 12, '#cfc2ee', 'right');
  const hint = G.tool ? (G.tool === 'dot' ? 'Tap a foggy hex beside the paint' : 'Tap a hex to aim the ink') : 'Tap a painted hex to walk. Paint the fog below.';
  txt(hint, VW / 2, VH - 84, 13, '#cfc2ee');
}
function fogCol(c){ const v = 0.5 + c.n * 0.5; return 'rgb(' + Math.round(58 * v + 20) + ',' + Math.round(46 * v + 16) + ',' + Math.round(78 * v + 24) + ')'; }
function cellEmoji(c){
  switch (c.k){
    case 'fight': return '⚔️'; case 'elite': return '☠️'; case 'boss': return ENEMIES[ENC[G.run.act].boss[0]].e;
    case 'gold': return '💰'; case 'chest': return '🎁'; case 'mystery': return '❓'; case 'ink': return '🖋️';
    case 'camp': return '🔥'; case 'shop': return '🛒'; default: return '';
  }
}
function hexPath(x, y, s){
  ctx.beginPath();
  for (let i = 0; i < 6; i++){ const a = Math.PI / 180 * (60 * i - 30); const px = x + s * Math.cos(a), py = y + s * Math.sin(a); i ? ctx.lineTo(px, py) : ctx.moveTo(px, py); }
  ctx.closePath();
}

/* ================================ LOOP =================================== */
let last = 0;
function update(dt){
  G.time += dt;
  stepPress(dt);
  if (G.toastT > 0){ G.toastT -= dt; if (G.toastT <= 0) $('toast').className = ''; }
  if (G.scr === 'fight' && F && !ov.className){
    if (F.stop > 0){ F.stop -= dt; return; }
    F.acc += dt;
    let n = 0;
    while (F.acc >= 1 / 60 && n++ < 4){ F.acc -= 1 / 60; stepFight(1 / 60); if (!F) break; }
    if (F && F.acc > 0.1) F.acc = 0;
  } else if (G.scr === 'map') stepWalk(dt);
}
function loop(ts){
  const dt = Math.min(0.05, Math.max(0, (ts - last) / 1000 || 0)); last = ts;
  update(dt); draw();
  requestAnimationFrame(loop);
}

loadMeta();
bindUI();
fit();
toTitle();
requestAnimationFrame(loop);
</script>
