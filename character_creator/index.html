<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0d0b1e">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='31' fill='%232d170f'/%3E%3Ccircle cx='32' cy='32' r='29' fill='%23fff4e6'/%3E%3Cpath d='M3 32A29 29 0 0 1 61 32Z' fill='%23ff7eb6'/%3E%3Cpath d='M61 32A29 29 0 0 1 3 32Z' fill='%233fcf6a'/%3E%3Ccircle cx='32' cy='27' r='9' fill='%23fff4e6' stroke='%232d170f' stroke-width='3'/%3E%3Cpath d='M18 49c2-9 8-12 14-12s12 3 14 12' fill='%23fff4e6' stroke='%232d170f' stroke-width='3'/%3E%3C/svg%3E">
<title>Character Studio</title>
<meta name="description" content="Build your own chibi character in the Hocus Vocus style: hair, eyes, faces, outfits, shoes, hats and more. Save, share and export PNGs.">
<link rel="stylesheet" href="css/cc.css">
</head>
<body>
<div id="app" class="app">
  <header class="top">
    <h1 class="logo" aria-label="Character Studio"><span>CHARACTER</span><span>STUDIO</span></h1>
    <label class="name"><span class="sr">Character name</span><input id="name" type="text" maxlength="28" value="New Character" spellcheck="false" autocomplete="off"></label>
    <div class="tools" role="toolbar" aria-label="Edit tools">
      <button id="undo" class="btn ghost" title="Undo (Ctrl+Z)" aria-label="Undo">&#8630; Undo</button>
      <button id="redo" class="btn ghost" title="Redo (Ctrl+Y)" aria-label="Redo">Redo &#8631;</button>
      <button id="roll" class="btn pink" title="Roll a whole new character">&#9856; Surprise me</button>
    </div>
  </header>

  <main class="main">
    <section class="stage" aria-label="Preview">
      <div class="view">
        <canvas id="view" aria-label="Character preview"></canvas>
        <div class="viewtools">
          <button id="play" class="chip round" aria-pressed="true" title="Animate">Moving</button>
          <button id="flip" class="chip round" aria-pressed="false" title="Mirror the character">Mirror</button>
          <button id="zoomOut" class="chip round" aria-label="Zoom out">&minus;</button>
          <button id="zoomIn" class="chip round" aria-label="Zoom in">+</button>
          <button id="portrait" class="chip round" aria-pressed="false" title="Close-up of the face">Face</button>
        </div>
      </div>
      <div class="belt">
        <div class="beltrow"><b class="beltlab">Pose</b><div id="poses" class="chips scroll" role="group" aria-label="Pose"></div></div>
        <div class="beltrow"><b class="beltlab">Mood</b><div id="exprs" class="chips scroll" role="group" aria-label="Expression"></div></div>
        <div class="beltrow"><b class="beltlab">Stage</b><div id="bgs" class="chips scroll" role="group" aria-label="Background"></div></div>
      </div>
    </section>

    <aside class="panel" aria-label="Customise">
      <nav id="tabs" class="tabs" role="tablist" aria-label="Categories"></nav>
      <div id="pane" class="pane" role="tabpanel" tabindex="0"></div>
    </aside>
  </main>
</div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>

<script>
/* The art kit of the game wants a DATA global; the creator only needs it to exist. */
window.DATA = { heroes: {}, enemies: {}, cards: {}, LISTS: { poses: [], fx: [], heroIds: [], sizeHeight: {} } };
window.__errors = [];
window.addEventListener('error', function (e) { window.__errors.push(String(e.message) + ' @' + String(e.filename || '').split('/').pop() + ':' + e.lineno); });
</script>
<script src="../hocus_vocus/js/util.js"></script>
<script src="../hocus_vocus/js/art.js"></script>
<script src="../hocus_vocus/js/art_cast_kit.js"></script>
<script src="js/cc_data.js"></script>
<script src="js/cc_core.js"></script>
<script src="js/cc_hair.js"></script>
<script src="js/cc_face.js"></script>
<script src="js/cc_outfit.js"></script>
<script src="js/cc_acc.js"></script>
<script src="js/cc_figure.js"></script>
<script src="js/cc_export.js"></script>
<script src="js/cc_app.js"></script>
</body>
</html>
