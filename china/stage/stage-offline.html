<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>R&J Stage Screen (offline)</title>
<meta name="theme-color" content="#000">
<style>
html,body{margin:0;height:100%;background:#000;overflow:hidden;font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
#stage{position:fixed;inset:0;overflow:hidden;background:#000}
#bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;animation:kb 24s ease-in-out infinite;transform-origin:50% 40%}
@keyframes kb{0%,100%{transform:scale(1) translate(0,0)}50%{transform:scale(1.03) translate(-.4%,.3%)}}
/* soft light sweep, once per loop */
#sweep{position:absolute;inset:-20%;pointer-events:none;background:linear-gradient(110deg,transparent 40%,rgba(255,255,255,.10) 50%,transparent 60%);
  transform:translateX(-70%);animation:sweep 24s linear infinite}
@keyframes sweep{0%{transform:translateX(-70%)}20%{transform:translateX(70%)}100%{transform:translateX(70%)}}
/* a few slow sparkles, kept away from the corners */
.sp{position:absolute;color:#fff;pointer-events:none;opacity:0;text-shadow:0 0 12px rgba(255,255,255,.8);animation:tw 8s ease-in-out infinite}
@keyframes tw{0%,100%{opacity:0;transform:scale(.4) rotate(0)}50%{opacity:.55;transform:scale(1) rotate(45deg)}}
/* QR card (never animated) */
#qr{position:absolute;width:var(--qs,22vh);background:#fff;border-radius:2.2vh;padding:1.4vh 1.4vh 1vh;box-shadow:0 1vh 4vh rgba(0,0,0,.35);text-align:center;transition:opacity .4s}
#qr svg{display:block;width:100%;height:auto}
#qr .cap{font-weight:900;font-size:calc(var(--qs,22vh)*.11);color:#24212a;margin-top:.5vh;letter-spacing:.02em}
#qr .cap b{color:#e74380}
#qr.tr{top:4vh;right:3vw}#qr.tl{top:4vh;left:3vw}#qr.br{bottom:4vh;right:3vw}#qr.bl{bottom:4vh;left:3vw}
#qr.off{opacity:0}
/* help overlay */
#help{position:absolute;left:50%;bottom:3vh;transform:translateX(-50%);background:rgba(0,0,0,.72);color:#fff;border-radius:14px;padding:12px 18px;font-size:14px;line-height:1.6;transition:opacity .6s;max-width:92vw}
#help.off{opacity:0;pointer-events:none}
#help kbd{background:#fff;color:#000;border-radius:4px;padding:0 6px;font-weight:700}
body.idle{cursor:none}
@media (prefers-reduced-motion:reduce){#bg,#sweep,.sp{animation:none}}
</style>
</head>

  var D=["01-white-chibi", "02-split-photo", "03-dark", "04-podium", "05-pink-green-chibi", "06-stars-chibi", "07-stars-photo", "08-green-pink", "09-faces", "10-white"], i=D.indexOf('03-dark');
  var bg=document.getElementById('bg'),qr=document.getElementById('qr'),help=document.getElementById('help'),root=document.documentElement;
  var corners=['tr','tl','bl','br'],ci=0,qs=22,anim=true;

  function put(k,v){try{localStorage.setItem('rjstage_'+k,JSON.stringify(v))}catch(e){}}

  ci=corners.indexOf(q.get('qr')||get('c','tr')); if(ci<0)ci=0;

  function show(){bg.src=IMG[D[i]];put('d',i+1)}
